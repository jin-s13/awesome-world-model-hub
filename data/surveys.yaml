  related_work_outline:
  - 'Mainstream direction: The strongest recent evidence clusters around generative
    world models built with diffusion or transformer architectures for video prediction
    in driving and embodied settings, often adding auxiliary objectives such as mask
    reconstruction, physics-informed losses, or action-video coupling.'
  - 'Shared research pattern: Papers cast world modeling as learning a predictive
    generative model from visual or multimodal interaction data, then evaluate via
    video fidelity, rollout/consistency, downstream policy learning, or dedicated
    benchmark metrics.'
  - 'Key differences: The evidence divides over latent state-space versus diffusion-based
    video generation, whether actions/language/physics are explicit conditioning signals,
    how much emphasis is placed on policy versus benchmark evaluation, and which domain
    transfers are tested.'
  - 'Trend evolution: Within the top-paper evidence (2023-2026), the field is moving
    from model-based RL latent dynamics and VAE-Transformer world models toward large-scale
    video diffusion, multimodal action-video pretraining, and explicit consistency/control
    benchmarks.'
  - 'Open questions: Transfer beyond tested driving/robot/Minecraft settings, long-term
    memory consistency, novel primitive or unobserved context generalization, and
    isolation of model contribution from dataset, planner, and system effects remain
    under-evidenced.'
  related_work_outline_zh:
  - 主流方向：近期证据集中于以扩散或Transformer架构构建生成式世界模型，用于驾驶与具身视频预测，并常加入掩码重建、物理信息损失或动作-视频耦合等辅助目标。
  - 研究共性：将世界建模视为从视觉或多模态交互数据中学习预测性生成模型，并通过视频质量、长时域一致性、下游策略或专用基准来评估。
  - 关键差异：证据在潜在状态空间与扩散视频生成、动作/语言/物理作为显式条件、策略与基准评估侧重、以及测试域迁移上存在分化。
  - 趋势演进：在现有高排名证据（2023-2026）中，从模型化RL潜在动力学和VAE-Transformer世界模型，转向大规模视频扩散、多模态动作-视频预训练和显式一致性/控制基准。
  - 开放问题：测试域之外的迁移、长期记忆一致性、新原语或不可观测上下文泛化，以及模型贡献与数据、规划器和系统影响隔离等仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion and auxiliary-task generative world-model architectures
      what_it_solves: Learns high-dimensional visual/dynamics predictors for driving
        and embodied scenes by combining video generation with objectives such as
        mask reconstruction, depth prediction, or keypoint dynamics.
      what_remains_open: Several papers omit limitations, so transfer beyond reported
        driving/robotic datasets and the marginal role of each auxiliary task remain
        verification gaps.
    - line: Latent and compositional dynamics models for policy and zero-shot generalization
      what_it_solves: Connects world-model imagination to control by conditioning
        latent state-space dynamics on context or by factorizing video generation
        into language-derived primitives for unseen task combinations.
      what_remains_open: Observed context is assumed in one case; compositional generalization
        is limited to seen primitives; evaluation covers only two contextual RL tasks
        or simulation, leaving real-world and novel primitive coverage open.
    - line: World-model evaluation protocols for consistency and action control
      what_it_solves: Defines benchmarks and metrics for spatial consistency, memory
        consistency, and action-control ability of world models, using loop navigation
        or closed-loop revisited videos.
      what_remains_open: One benchmark reports no experimental results; another reveals
        current models struggle with long-term memory and cross-action-space generalization,
        but broader model comparisons are not yet established.
    consensus:
    - Recent work treats world models as generative predictors over visual or multimodal
      interaction data, not simply as latent forward models for control.
    - Auxiliary training signals such as mask reconstruction, physics-informed depth/keypoint
      tasks, context conditioning, or action prediction are used to improve prediction
      quality, physical plausibility, or generalization.
    - Evaluation is broadening from aggregate game performance to include long-horizon
      rollout, zero-shot dynamics, video fidelity, spatial consistency, memory consistency,
      and action control.
    disagreements:
    - 'Representation differs: some methods learn latent recurrent state-space dynamics,
      while others generate video with diffusion transformers or couple video and
      action diffusion in a single transformer.'
    - 'Supervision and conditioning differ: explicit context values, language-derived
      primitives, physics-informed auxiliary tasks, and action/video diffusion timesteps
      each impose different assumptions.'
    - 'Evaluation settings differ: Atari 100k, contextual RL zero-shot tasks, driving
      benchmarks, robot simulation, Minecraft navigation, and open-domain video benchmarks
      stress different capabilities and domain transfer.'
    open_questions:
    - Which auxiliary losses or architecture choices transfer beyond the specific
      driving, robotic, or game benchmarks shown in the evidence?
    - How can world models handle unobserved context or entirely novel language primitives
      without assuming observability or coverage of training primitives?
    - What measurement and baseline controls are needed to isolate world-model contributions
      from data scale, pretraining, planner, or downstream policy effects?
    - What training objectives and memory mechanisms can improve long-term consistency
      and cross-action-space generalization that current benchmarks flag as challenging?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散与辅助任务生成式世界模型架构
      解决的问题: 通过视频生成结合掩码重建、深度预测或关键点动力学等目标，学习驾驶和具身场景下的高维视觉/动力学预测器。
      尚未覆盖: 多篇论文未报告局限性，因此超出驾驶/机器人数据集之外的迁移，以及各辅助任务的边际贡献仍是验证缺口。
    - 路线: 面向策略与零样本泛化的潜变量及组合动力学模型
      解决的问题: 通过上下文条件化潜在状态空间动力学，或将视频生成分解为语言派生原语，把世界模型想象连接到控制与未见任务组合。
      尚未覆盖: 一项工作假设上下文可观测；组合泛化仅限已见原语；评估仅覆盖两个上下文强化学习任务或仿真，现实世界与全新原语覆盖仍未解决。
    - 路线: 针对一致性与动作控制的世界模型评测协议
      解决的问题: 用循环导航或闭环回访视频定义空间一致性、记忆一致性与动作控制能力的基准和指标。
      尚未覆盖: 一个基准未报告实验结果；另一个基准显示现有模型在长期记忆和跨动作空间泛化上存在困难，但更广泛的模型比较尚未建立。
    共识:
    - 近期工作将世界模型视为视觉或多模态交互数据的生成式预测器，而不仅是控制的潜在前向模型。
    - 引入掩码重建、物理信息深度/关键点、上下文条件或动作预测等辅助信号，以改善预测质量、物理合理性或泛化。
    - 评测从综合游戏分数扩展到长时域推演、零样本动力学、视频保真度、空间一致性、记忆一致性和动作控制。
    分歧:
    - 表示不同：部分方法学习潜在循环状态空间动力学，部分用扩散Transformer生成视频，或在单个Transformer中耦合视频与动作扩散。
    - 监督与条件不同：显式上下文、语言原语、物理辅助任务和动作/视频扩散时间步施加了不同假设。
    - 评测场景不同：Atari 100k、上下文强化学习零样本任务、驾驶基准、机器人仿真、Minecraft导航和开放域视频基准强调不同能力与迁移。
    开放问题:
    - 哪些辅助损失或架构选择能迁移到证据中特定驾驶、机器人或游戏基准之外？
    - 如何不假设上下文可观测或训练原语覆盖，处理不可观测上下文和全新语言原语？
    - 需要哪些测量与基线控制来分离世界模型贡献与数据规模、预训练、规划器或下游策略影响？
    - 何种训练目标与记忆机制可改善当前基准所标出的长期一致性与跨动作空间泛化困难？
