  related_work_outline:
  - 'Mainstream direction: Generative world models dominate the evidence, with diffusion,
    VAE, or Transformer dynamics predicting future video/latent states for reinforcement
    learning and embodied control, then benchmarked on shared visual-control, driving,
    or robotic settings.'
  - 'Shared research pattern: A world model is trained with self-supervised objectives
    such as mask reconstruction, video-action diffusion, or physics-informed signals,
    and its generated rollouts are evaluated for visual fidelity, consistency, or
    downstream policy utility.'
  - 'Key differences: Some work targets short-horizon game agents, while other work
    evaluates long-horizon driving, open-domain memory, or large-scale robotic pretraining;
    supervision ranges from pixel reconstruction to physics priors and joint video-action
    modeling.'
  - 'Trend evolution: Top evidence clusters in 2023-2026, moving from VAE/Transformer
    game world models toward diffusion and large-scale video-action world models,
    with increasing benchmark coverage of spatial consistency, memory consistency,
    and action control.'
  - 'Open questions: Whether current benchmark metrics reflect downstream decision
    quality, whether task distributions cover cross-action and long-horizon deployment
    settings, and whether long-term memory plus physical plausibility can be tested
    rigorously.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型在证据中占主导，使用扩散、VAE或Transformer动力学预测未来视频/潜在状态，用于强化学习与具身控制，并在共享视觉控制、驾驶或机器人设置下进行基准评测。
  - 研究共性：以掩码重建、视频-动作扩散或物理信息信号等自监督目标训练世界模型，再评估生成轨迹的视觉保真度、一致性或下游策略效用。
  - 关键差异：部分工作面向短期游戏智能体，部分面向长时域驾驶、开放域记忆或大规模机器人预训练；监督信号从像素重建到物理先验和视频-动作联合建模不等。
  - 趋势演进：高排名证据集中在2023-2026年，从VAE/Transformer游戏世界模型转向扩散和大规模视频-动作世界模型，空间一致性、记忆一致性和动作控制基准覆盖增加。
  - 开放问题：当前基准指标是否反映下游决策质量，任务分布是否覆盖跨动作和长时域部署设置，长期记忆与物理合理性能否被严格测试。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared datasets and tasks that make world-model claims
        comparable across visual-control, driving, navigation, and robotic settings.
      what_remains_open: Whether the task distribution covers long-horizon, cross-action,
        and open-domain conditions where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual fidelity, and downstream policy utility beyond aggregate scores.
      what_remains_open: Whether proxy metrics such as SGCS, human-normalized scores,
        or video fidelity align with the downstream decisions users actually care
        about.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common reference points such as Atari 100k or CARL
        to audit training efficiency, zero-shot generalization, and agent performance.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and datasets; limitation reporting is uneven.
    consensus:
    - World models are evaluated by combining generation quality with task success,
      control performance, or consistency checks rather than relying on a single visual
      score.
    - Shared benchmarks and fixed datasets enable comparison of training efficiency,
      visual fidelity, and policy performance across different model families.
    - Generated rollouts or videos are treated as a testbed for downstream policy
      learning or evaluation, not only as perceptual outputs.
    disagreements:
    - 'Evaluation target differs: spatial consistency, memory consistency, action
      controllability, physical plausibility, zero-shot dynamics, or visual detail
      are prioritized differently.'
    - 'Representation and supervision differ: mask reconstruction, VAE stochastic
      latents, diffusion generation, joint video-action diffusion, temporal depth,
      or keypoint dynamics.'
    - 'Interaction mode and deployment setting differ: short-horizon game optimization,
      long-horizon driving prediction, open-domain navigation, or large-scale robotic
      pretraining.'
    - 'Data scale and domain differ: Minecraft loop navigation, CARL contextual control,
      Atari 100k, driving datasets, or robotic multitask videos, which changes what
      generalization means.'
    open_questions:
    - Do benchmark metrics like human-normalized Atari scores, SGCS, or video fidelity
      track real downstream decision quality under distribution shift?
    - Can world-model benchmarks cover multiple action spaces, viewpoints, and long-horizon
      memory without becoming too costly or domain-specific?
    - How stable are world-model rankings across different implementations, compute
      budgets, and data splits when some top evidence omits limitations?
    - What evidence is needed to separate generative realism from actual usefulness
      for control or policy evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 建立共享数据集和任务，使不同世界模型在视觉控制、驾驶、导航和机器人设置下可比较。
      尚未覆盖: 任务分布是否覆盖长时域、跨动作和开放域条件，仍不清楚。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、视觉保真度和下游决策效用。
      尚未覆盖: SGCS、人类归一化得分或视频保真度等代理指标是否与真实部署决策一致，仍缺少证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL等公共参考点审计训练效率、零样本泛化和智能体表现。
      尚未覆盖: 基准结论在不同实现、算力和数据划分下是否稳定，且部分论文未报告局限。
    共识:
    - 世界模型评估通常结合生成质量与任务成功、控制表现或一致性检查，而非仅看单一视觉分数。
    - 固定基准和数据集使训练效率、视觉保真度和策略性能在不同模型族之间可比较。
    - 生成轨迹或视频被视为下游策略学习或评估的测试平台，而不仅是感知输出。
    分歧:
    - 评测目标不同：空间一致性、记忆一致性、动作可控性、物理合理性、零样本动态或视觉细节各有侧重。
    - 表示与监督不同：掩码重建、VAE随机潜变量、扩散生成、视频-动作联合扩散、时间深度或关键点动力学。
    - 交互模式与部署场景不同：短期游戏优化、长时域驾驶预测、开放域导航或大规模机器人预训练。
    - 数据规模和领域不同：Minecraft循环导航、CARL上下文控制、Atari 100k、驾驶数据或机器人多任务视频，使泛化含义不同。
    开放问题:
    - 人类归一化得分、SGCS或视频保真度等指标是否能在分布变化下反映真实下游决策质量？
    - 世界模型基准能否覆盖多个动作空间、视角和长时域记忆，而不致成本过高或领域过窄？
    - 在部分高排名证据未报告局限的情况下，世界模型排序在不同实现、算力和数据划分下有多稳定？
    - 需要哪些证据来区分生成逼真性与模型对控制或策略评估的实际效用？
