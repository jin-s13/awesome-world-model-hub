  related_work_outline:
  - 'Mainstream direction: Development and use of benchmarks that test world models
    through visual rollouts, action conditioning, and consistency diagnostics rather
    than isolated task rewards.'
  - 'Shared research pattern: Methods are validated on common suites such as Atari
    100k, CARL, Nuscenes, OpenDV-2K, Waymo, Minecraft, and robotic video, while benchmark
    papers introduce open datasets and targeted metrics.'
  - 'Key differences: Some works build evaluation datasets and metrics; others build
    models and report benchmark improvements. Evaluation targets split across spatial
    consistency, memory/action control, visual detail, zero-shot dynamics, and physical
    plausibility.'
  - 'Trend evolution: Within the current frontier, evaluation is moving from score-centric
    RL benchmarks toward long-horizon, multi-view, action-conditioned, physics-informed,
    and memory-consistency stress tests.'
  - 'Open questions: Metric-to-decision alignment, coverage of long-horizon and cross-action
    settings, stability across implementations/compute budgets, and many missing limitation/reproducibility
    details remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：通过视觉推演、动作条件和一致性诊断来测试世界模型，而非只看孤立任务奖励。
  - 研究共性：方法在Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo、Minecraft和机器人视频等公开基准上验证；基准工作引入开放数据集和定向指标。
  - 关键差异：部分工作构建评测数据集和指标，部分构建模型并报告基准提升；评测目标分为空间一致性、记忆/动作控制、视觉细节、零样本动力学和物理合理性。
  - 趋势演进：在近期前沿中，评测正从以分数为中心的强化学习基准，走向长时域、多视角、动作条件、物理信息和记忆一致性的压力测试。
  - 开放问题：指标与决策的对齐、长时域和跨动作覆盖、跨实现与算力预算的稳定性，以及缺失的局限性和可复现性细节仍是证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets for comparing world-model
        spatial consistency, memory consistency, and action control; representative
        examples include LoopNav and MIND.
      what_remains_open: Coverage is still uncertain for long-horizon memory, cross-action
        spaces, multi-view open worlds, and embodied settings. LoopNav describes dataset
        construction but reports no baseline results in the abstract.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and consistency
        beyond aggregate scores through scene-graph consistency, memory/action-control
        checks, visual fidelity, physical plausibility, and human-normalized Atari
        performance.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility is not validated; most metrics are benchmark-specific and missing
        direct evidence of real-world or policy relevance.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable by reusing baselines and suites such
        as Dreamer v3, Atari 100k, CARL, Nuscenes, OpenDV-2K, Waymo, and prior state-of-the-art
        driving world models.
      what_remains_open: Stability across independent implementations and compute
        budgets is unreported. Several papers have empty limitation fields, so reproducibility
        and boundary conditions remain verification gaps.
    consensus:
    - World-model evaluation is converging on visual, action-conditioned, or closed-loop
      rollouts as evidence, not only scalar rewards.
    - Researchers agree on the need to test spatial consistency, memory, action control,
      visual quality, and physical plausibility through dedicated datasets and metrics.
    - Open-sourcing datasets and benchmarks is treated as a key contribution, especially
      for evaluation-focused works.
    disagreements:
    - 'Evaluation target differs: navigation loop consistency versus memory/action
      control across viewpoints versus RL normalized scores versus robotic visual
      and physical plausibility.'
    - 'Representation and supervision differ: diffusion video models, transformer-VAE
      stochastic models, recurrent state-space models, and physics-informed losses
      optimize different signals.'
    - 'Interaction mode differs: open-loop video prediction, closed-loop revisited
      navigation, action-conditioned generation, and policy evaluation inside learned
      models.'
    - 'Deployment setting differs: simulated games, Minecraft, driving, robotic manipulation,
      and large multitask robot datasets lead to different generalization expectations.'
    open_questions:
    - How do spatial consistency and memory/action-control metrics relate to downstream
      policy quality or deployment performance?
    - Can benchmark tasks maintain coverage across long-horizon, cross-action, multi-view,
      and open-world settings without overfitting to specific visuals?
    - Are reported benchmark gains stable across independent implementations, baselines,
      and compute budgets when limitation details are absent?
    - Do context-conditioned or physics-informed world models generalize beyond the
      narrow task suites shown in the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型的空间一致性、记忆一致性与动作控制具备可比性；代表性包括LoopNav和MIND。
      尚未覆盖: 对长时域记忆、跨动作空间、多视角开放世界和具身场景的覆盖仍不确定；LoopNav摘要未报告基线实验结果。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性、记忆/动作控制检查、视觉保真度、物理合理性及Atari人类归一化分数，检验总分之外的预测、可控性、鲁棒性和一致性。
      尚未覆盖: 代理指标与下游决策效用的对齐尚未验证；多数指标绑定特定基准，缺少真实场景或策略相关性的直接证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过复用Dreamer v3、Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo及先前最先进的驾驶世界模型等基线和套件，使结果可审计。
      尚未覆盖: 跨实现与算力预算的稳定性未报告；多篇论文局限性字段为空，可复现性和边界条件仍是证据缺口。
    共识:
    - 世界模型评测正趋向以视觉、动作条件或闭环推演作为证据，而非仅使用标量奖励。
    - 研究者普遍认为需要通过专门数据集和指标测试空间一致性、记忆、动作控制、视觉质量和物理合理性。
    - 开放数据集与基准被视为评测导向工作的重要贡献。
    分歧:
    - 评测目标不同：导航循环一致性、跨视角记忆/动作控制、强化学习归一化分数、机器人视觉与物理合理性。
    - 表示与监督不同：扩散视频模型、Transformer-VAE随机模型、循环状态空间模型和物理信息损失优化不同信号。
    - 交互模式不同：开环视频预测、闭环重访导航、动作条件生成以及在习得模型中进行策略评估。
    - 部署场景不同：模拟游戏、Minecraft、驾驶、机器人操作和大规模多任务机器人数据集导致不同的泛化预期。
