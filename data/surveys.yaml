  literature_review:
    line_of_work_matrix:
    - line: Controllable world-model and simulator construction
      what_it_solves: Learning forward generative dynamics conditioned on actions,
        context, or physics so that synthetic rollouts can support model-based reinforcement
        learning or closed-loop simulation.
      what_remains_open: Most evidence is limited to selected tasks or datasets; long-horizon
        coherence, cross-domain generalization, and tradeoffs between visual fidelity
        and physical action adherence remain unresolved.
    - line: Benchmark and evaluation frameworks
      what_it_solves: Providing datasets, metrics, and protocols for comparing spatial
        consistency, action fidelity, zero-shot generalization, and downstream policy
        utility without relying on visual quality alone.
      what_remains_open: Metric validity beyond the proposed environments, coverage
        of diverse sensor layouts and platforms, and independent verification of floor
        or ceiling behavior are not yet established.
    - line: Real-time and interactive serving stacks
      what_it_solves: Turning generative world models into deployable inference pipelines
        with sub-second or interactive latency for physical robots, gaming, and driving
        simulation.
      what_remains_open: Evidence mainly covers single-GPU or specific robot platforms;
        scaling to multi-GPU, multi-sensor, out-of-distribution scenes, and changing
