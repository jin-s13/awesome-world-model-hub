  related_work_outline:
  - 'Mainstream direction: applying world models to concrete domains—autonomous driving,
    robotics, and interactive games—via video generation, diffusion, and state-space
    models, with growing emphasis on physical plausibility and long-horizon consistency.'
  - 'Shared research pattern: combining generative architectures (diffusion, transformers)
    with task-specific conditioning (language, context, physics) to learn predictive
    world models that support planning, policy learning, or evaluation.'
  - 'Key differences: representation choices (raw video vs. latent states), how domain
    knowledge is injected (explicit physics priors, compositional language, context
    variables), and evaluation targets (visual fidelity, action controllability, memory
    consistency, zero-shot generalization).'
  - 'Trend evolution: the frontier has moved from game benchmarks (Atari) and simple
    RL tasks toward realistic, embodied settings (driving, robot manipulation) and
    specialized benchmarks that probe spatial-temporal consistency, memory, and action
    control (2023–2026).'
  - 'Open questions: whether long-term memory and physical consistency can be guaranteed
    without real-world interaction, how to generalize across unseen morphologies and
    action spaces, and how to close the gap between simulated gains and real-world
    safety or operational outcomes.'
  related_work_outline_zh:
  - 主流方向：将世界模型落地到自动驾驶、机器人、交互游戏等具体领域，通过视频生成、扩散模型和状态空间模型实现，越来越强调物理合理性和长时域一致性。
  - 研究共性：将生成式架构（扩散、Transformer）与任务条件（语言、上下文、物理）结合，学习支持规划、策略学习或评估的预测型世界模型。
  - 关键差异：表示方式（原始视频 vs. 隐状态）、领域知识注入方式（显式物理先验、组合语言、上下文变量）以及评测目标（视觉保真度、动作可控性、记忆一致性、零样本泛化）不同。
  - 趋势演进：前沿从游戏基准（Atari）和简单RL任务转向真实具身场景（驾驶、机器人操作）以及探测时空一致性、记忆和动作控制的专用基准（2023–2026年）。
  - 开放问题：长期记忆与物理一致性能否在无真实交互下保证；如何跨未见形态和动作空间泛化；如何弥合仿真收益与真实安全或运营结果之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models and simulation
      what_it_solves: long-horizon multi-view scene prediction and closed-loop driving
        simulation by combining diffusion transformers with mask reconstruction, enabling
        zero-shot transfer across datasets
      what_remains_open: alignment between simulation improvements and real-world
        driving safety or operational outcomes; verification on physical vehicles
        and diverse road conditions
    - line: Embodied robotic world models with compositional or physics-informed generation
      what_it_solves: learning robot dynamics and video plans from language instructions,
        physical priors, or unified video–action diffusion, supporting compositional
        generalization and large-scale pretraining
      what_remains_open: real-robot deployment validation; generalization to entirely
        novel primitives or unseen object dynamics; robustness of implicit physics
        knowledge under distribution shift
    - line: Interactive environment world models and consistency benchmarks
      what_it_solves: efficient stochastic world models for RL, memory-aided spatial
        consistency evaluation, and benchmarks for action controllability and long-term
        memory in open-domain environments
      what_remains_open: guaranteeing long-term memory consistency across diverse
        action spaces; generalization to unseen environment rules and user interactions;
        benchmarks that bridge simulation and real-world interactions
    consensus:
    - World models are increasingly framed as generative predictive models of sensory
      observations, used for planning, policy learning, or evaluation.
    - Large-scale pretraining on diverse datasets improves generalization and robustness
      compared to training from scratch in a single environment.
    - The community is moving beyond visual fidelity metrics toward measuring consistency,
      controllability, and zero-shot generalization.
    - Benchmarks with explicit memory and action-control dimensions are necessary
      to reveal limitations of current world models.
    disagreements:
    - Whether to model the world in raw pixel space (video generation) or in a learned
      latent state space (RSSM-style) affects computational cost, controllability,
      and interpretability.
    - 'The role of explicit physics knowledge: some works inject depth or keypoint
      dynamics as joint training objectives, while others rely on implicit learning
      from data alone.'
    - 'Evaluation settings differ sharply: some target zero-shot generalization across
      environments or embodiments, others focus on within-distribution planning or
      policy performance, making cross-paper comparisons difficult.'
    - 'Action representation varies: continuous control in robotics, discrete actions
      in games, and camera parameter changes in benchmark videos, with no single standardized
      action space.'
    open_questions:
    - How can long-term memory consistency be maintained in open-domain world models
      without access to an external memory or world state?
    - Under what conditions does incorporating physics priors demonstrably improve
      performance on downstream tasks, and can these priors transfer across embodiments?
    - Can world models pretrained on internet-scale video and action data be safely
      deployed in safety-critical applications like autonomous driving without real-world
      fine-tuning?
    - What evaluation protocols can capture the gap between simulated world model
      accuracy and real-world task success, especially for physical interaction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型与仿真
      解决的问题: 通过扩散变换器与掩码重建相结合，实现长时域多视角场景预测和闭环驾驶仿真，支持跨数据集零样本迁移
      尚未覆盖: 仿真改进与真实驾驶安全及运营结果之间的一致性；在物理车辆和多样化道路条件下的验证
    - 路线: 具身机器人世界模型，利用组合生成或物理信息
      解决的问题: 从语言指令、物理先验或统一视频–动作扩散中学习机器人动力学和视频计划，支持组合泛化和大规模预训练
      尚未覆盖: 真实机器人部署验证；对全新原语或未见物体动力学的泛化；分布偏移下隐式物理知识的鲁棒性
    - 路线: 交互式环境世界模型与一致性基准
      解决的问题: 为RL构建高效随机世界模型，提供记忆辅助的空间一致性评估，以及开放域环境中动作可控性和长期记忆的基准测试
      尚未覆盖: 在多样化动作空间下保证长期记忆一致性；对未见环境规则和用户交互的泛化；能连接仿真与真实交互的基准
    共识:
    - 世界模型越来越多地被构建为感觉观测的生成式预测模型，用于规划、策略学习或评估。
    - 在多样化数据集上进行大规模预训练相比单环境从头训练能提升泛化性和鲁棒性。
    - 社区正从单纯关注视觉保真度转向衡量一致性、可控性和零样本泛化。
    - 需构建具有明确记忆和动作控制维度的基准，以揭示当前世界模型的局限。
    分歧:
    - 在原始像素空间（视频生成）还是学习到的隐状态空间（RSSM式）建模影响计算成本、可控性和可解释性。
    - 显式物理知识的作用：部分工作将深度或关键点动力学作为联合训练目标，另有工作仅依赖数据隐式学习。
    - 评测设置差异显著：有的针对跨环境或跨本体的零样本泛化，有的聚焦分布内规划或策略性能，难以跨论文对比。
    - 动作表示不统一：机器人中的连续控制、游戏中的离散动作、基准视频中的相机参数变化，缺乏统一标准化的动作空间。
    开放问题:
    - 在无外部记忆或世界状态的情况下，开放域世界模型如何维持长期记忆一致性？
    - 引入物理先验在何种条件下能显著提升下游任务性能，且这些先验能否跨本体迁移？
    - 基于互联网规模视频和动作数据预训练的世界模型能否在无需真实微调的情况下安全部署于自动驾驶等安全关键应用？
    - 何种评估协议能捕捉仿真世界模型精度与真实世界任务成功之间的差距，特别是针对物理交互？
