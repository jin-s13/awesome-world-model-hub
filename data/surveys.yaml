  - 'Shared research pattern: Papers couple action and visual dynamics in unified
    generative models, then evaluate rollouts with downstream planning, policy, or
    physical/task-alignment benchmarks rather than only visual metrics.'
  - 'Key differences: Training paradigm spans unified diffusion, masked autoregression,
    adapter-based adaptation, and flow alignment; supervision spans action labels,
    human preferences, DPO discriminators, and test-time verifiers; evaluation domains
    and benchmarks differ.'
  - 'Trend evolution: From 2024 action-frame alignment and model adaptation toward
    2025-2026 alignment, physics benchmarks, test-time verification, and mechanistic
