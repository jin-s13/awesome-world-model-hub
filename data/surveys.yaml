  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks for evaluating world models
    beyond aggregate scores, targeting spatial consistency, memory, and action controllability
    with dedicated datasets and metrics.'
  - 'Shared research pattern: Creating new datasets and tasks paired with custom metrics,
    then validating them by exposing failures of existing world models, while method
    papers adopt standard benchmarks to demonstrate superior performance.'
  - 'Key differences: Evaluation targets diverge—spatial consistency via loop closure
    (LoopNav), memory consistency and action control across diverse scenes (MIND),
    versus visual fidelity and decision scores on standard game / driving benchmarks
    (Atari 100k, Nuscenes).'
  - 'Trend evolution: From 2023–2026, the field moves from repurposing general RL
    benchmarks (Atari 100k) toward purpose-built diagnostic benchmarks for world models,
    with increasing emphasis on open-domain, long-horizon, and multi-view scenarios.'
  - 'Open questions: How to unify diverse capability dimensions into a single benchmark
    suite, and whether proxy metrics align with downstream decision utility in real-world
    deployment.'
  related_work_outline_zh:
  - 主流方向：设计专门基准以评估世界模型在总分之外的性能，通过专用数据集和指标关注空间一致性、记忆和动作可控性。
  - 研究共性：创建新数据集和任务，搭配定制指标，并通过暴露现有世界模型的失败来验证基准；方法论文则采用标准基准展示优越性能。
  - 关键差异：评估目标分化——基于循环闭合的空间一致性（LoopNav）、跨场景的记忆一致性与动作控制（MIND），以及标准游戏/驾驶基准上的视觉保真度和决策得分（Atari
    100k、Nuscenes）。
  - 趋势演进：2023至2026年间，领域从重用通用强化学习基准（Atari 100k）转向为世界模型量身定制的诊断基准，越来越强调开放域、长时域和多视角场景。
  - 开放问题：如何将多样化的能力维度统一到单一基准套件中，以及代理指标是否与真实世界部署中的下游决策效用一致。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, e.g., spatial consistency via LoopNav and memory/action control
        via MIND, complementing standard suites like Atari 100k used in STORM and
        DIAMOND.
      what_remains_open: Whether the task distribution covers the settings where world
        models are expected to help, especially for long-horizon, open-domain, and
        multi-view scenarios beyond the curated test sets.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, with metrics such as Scene Graph Consistency
        Score (LoopNav) and evaluations of memory consistency and action control (MIND).
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; the sensitivity of these metrics to different data
        distributions and model architectures remains underexplored.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines, artifacts,
        and reporting conventions, as seen in the use of Atari 100k human normalized
        score across STORM, DIAMOND, and the release of code and datasets for LoopNav
        and MIND.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; many method papers lack explicit limitation sections
        and do not report variance across runs.
    consensus:
    - World models require evaluation beyond visual quality or single-game scores,
      focusing on temporally consistent, spatially coherent, and action-controlled
      generation.
    - Purpose-built benchmarks with curated datasets and metrics are necessary to
      reveal specific failure modes like memory inconsistency or poor spatial consistency.
    - Open-source code, datasets, and clear evaluation protocols are critical for
      reproducibility and fair comparison across world model architectures.
    disagreements:
    - 'Evaluation target: spatial consistency (LoopNav) vs. memory consistency and
      action control (MIND) vs. visual details and game performance (Atari 100k, Nuscenes).'
    - 'Supervision signal: LoopNav uses scene graphs while MIND uses video with action
      labels; standard benchmarks rely on game scores or visual similarity metrics.'
    - 'Interaction mode: closed-loop revisited navigation in MIND vs. loop-based navigation
      in LoopNav vs. open-loop rollout on driving datasets.'
    - 'Deployment setting: Minecraft (LoopNav), diverse video scenes (MIND), Atari
      games (STORM, DIAMOND), and autonomous driving (MaskGWM), with no single benchmark
      covering all.'
    open_questions:
    - How can we design a unified evaluation framework that covers spatial, temporal,
      and physical consistency without sacrificing domain-specific depth?
    - To what extent do current benchmark metrics correlate with the real-world utility
      of world models in embodied decision-making or robotic control?
    - How stable are benchmark rankings when models are retrained with different random
      seeds, compute budgets, or slight implementation variations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集，使世界模型的主张可比，例如通过 LoopNav 评估空间一致性，通过 MIND 评估记忆和动作控制，补充了 STORM
        和 DIAMOND 使用的 Atari 100k 等标准套件。
      尚未覆盖: 任务分布是否覆盖了世界模型预期发挥作用的真实设置，特别是超越策展测试集的长时域、开放域和多视角场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数（LoopNav）以及记忆一致性和动作控制评估（MIND）。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间的一致性；这些指标对不同数据分布和模型架构的敏感性尚未充分探索。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、工件和报告规范使结果可审计，如 STORM、DIAMOND 共同使用 Atari 100k 人类归一化得分，以及 LoopNav
        和 MIND 发布代码和数据集。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；许多方法论文缺乏明确的局限性说明，且未报告跨运行方差。
    共识:
    - 世界模型的评估需要超越视觉质量或单一游戏得分，关注时间一致、空间连贯和动作控制的生成。
    - 为揭示特定失败模式（如记忆不一致或空间一致性差），需要包含策展数据集和指标的专用基准。
    - 开源代码、数据集和清晰的评估协议对于世界模型架构间的可复现性和公平比较至关重要。
    分歧:
    - 评估目标：空间一致性（LoopNav）与记忆一致性和动作控制（MIND）与视觉细节和游戏性能（Atari 100k、Nuscenes）。
    - 监督信号：LoopNav 使用场景图，MIND 使用带有动作标签的视频，标准基准依赖游戏得分或视觉相似度指标。
    - 交互模式：MIND 中的闭环重访导航与 LoopNav 中的循环导航与驾驶数据集上的开环展开。
    - 部署场景：Minecraft（LoopNav）、多样化视频场景（MIND）、Atari 游戏（STORM、DIAMOND）和自动驾驶（MaskGWM），没有单一基准覆盖所有场景。
    开放问题:
    - 如何设计一个统一的评估框架，既覆盖空间、时间和物理一致性，又不牺牲领域特定深度？
    - 当前基准指标在多大程度上与世界模型在具身决策或机器人控制中的真实效用相关？
    - 当模型使用不同随机种子、算力预算或轻微实现差异重新训练时，基准排名如何保持稳定？
