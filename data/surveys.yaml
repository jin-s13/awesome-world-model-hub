  related_work_outline:
  - 'Mainstream direction: Adapting video generation models into action-conditioned
    embodied world models for decision-making and planning, emphasizing physical realism
    and scalability.'
  - 'Shared research pattern: Architectures condition next-frame prediction on actions,
    using large-scale pre-training and post-training alignment to improve fidelity
    and controllability.'
  - 'Key differences: Generative framework (diffusion vs. autoregression), action-conditioning
    mechanism (frame-level, mask adaptation, independent timesteps), alignment strategy
    (RL with human preferences, DPO, self-supervised), and evaluation target (spatial
    reasoning, task completion, zero-shot generalization).'
  - 'Trend evolution: From 2024 task-specific designs (IRASim, AVID) toward unified
    large-scale foundation models (UWM, ABot-PhysWorld) and human-preference alignment
    (ReWorld), with growing attention to mechanistic limits (ViSA) and functional
    benchmarks (mechanistic survey).'
  - 'Open questions: How to achieve long-horizon persistence and causal reasoning;
    how to formulate predictable scaling laws; how to design verifiable and generalizable
    benchmarks beyond visual quality.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型适配为动作条件化的具身世界模型，用于决策与规划，强调物理真实性和可扩展性。
  - 研究共性：架构以动作条件化下一帧预测为核心，利用大规模预训练和后训练对齐提升保真度与可控性。
  - 关键差异：生成框架（扩散 vs 自回归）、动作条件化机制（帧级条件、掩码适配、独立时间步）、对齐策略（基于人类偏好的强化学习、DPO、自监督）和评测目标（空间推理、任务完成、零样本泛化）。
  - 趋势演进：从2024年专用设计（IRASim、AVID）走向统一大规模基础模型（UWM、ABot-PhysWorld）和人类偏好对齐（ReWorld），同时开始审视机制局限性（ViSA）和功能基准（机制视角综述）。
  - 开放问题：如何实现长程持久性和因果推理；如何建立可预测的缩放规律；如何设计超越视觉质量的可验证且可泛化的基准。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifying core concepts such as state, dynamics, and action-conditioning,
        and the assumptions underlying diffusion, autoregression, and adapter-based
        world models.
      what_remains_open: Whether these architectural assumptions (e.g., independent
        diffusion timesteps, implicit state construction) hold under long-horizon
        reasoning and physical consistency, as seen in the information bottleneck
        identified by ViSA.
    - line: Scaling laws and guarantees
      what_it_solves: Connecting model size, data scale, and post-training alignment
        (DPO, RLHF) to improved physical fidelity and controllability of world model
        rollouts.
      what_remains_open: Direct validation that scaling behaviors predict failure
        modes and cross-task transfer; alignment relies on subjective human preferences,
        and generalization beyond the training distribution remains unverified.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizing video generation world models into categories of
        state construction (implicit/explicit) and dynamics modeling (knowledge integration/architectural
        reformulation), advocating for functional benchmarks.
      what_remains_open: Whether the taxonomy changes how researchers design or evaluate
        models, and whether it can bridge the gap between stateless video generation
        and classical world model theory.
    consensus:
    - Action-conditioned video prediction is the central paradigm for constructing
      embodied world models, enabling decision-making and planning.
    - Evaluation must move beyond visual fidelity to include physical plausibility,
      task completion, and temporal consistency, as purely appearance-based metrics
      are insufficient.
    - Large-scale pre-training on diverse robot or video datasets is critical for
      generalization and robustness, with post-training alignment further improving
      reliability.
    disagreements:
    - 'Architectural choice: unified diffusion transformer frameworks (UWM, IRASim)
      versus masked autoregression (HMA) versus adapter-based reuse of pretrained
      video diffusion models (AVID), each making different trade-offs in speed and
      accessibility.'
    - 'Action-conditioning mechanism: frame-level action-conditioning modules (IRASim),
      learned mask adaptation of intermediate outputs (AVID), independent modality-specific
      diffusion timesteps (UWM), and parallel context blocks for spatial action injection
      (ABot-PhysWorld).'
    - 'Alignment signal: multi-dimensional human-preference reward modeling with RL
      fine-tuning (ReWorld) versus DPO with decoupled discriminators (ABot-PhysWorld)
      versus purely self-supervised objectives without explicit alignment (UWM, IRASim).'
    - 'Evaluation target: test-time spatial reasoning and verifier scaling (ViSA)
      versus physical realism and task logic (ReWorld, ABot-PhysWorld) versus policy
      evaluation and planning in simulation (IRASim, UWM).'
    open_questions:
    - Current world models form an information bottleneck where imagined views fail
      to enrich fine-grained reasoning; how can we achieve persistent state tracking
      and causal reasoning over long horizons?
    - The gap between stateless video generation and classical world model theory
      (explicit state, dynamics) remains unresolved; can functional benchmarks drive
      the design of stateful, verifiable world models?
    - Human-preference alignment is costly and subjective; how can we design scalable
      and objective reward signals that guarantee cross-embodiment and cross-task
      generalization?
    - What scaling laws govern the relationship between model size, data diversity,
      and the emergence of robust physical understanding, and how can we predict failure
      cases before deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型中状态、动态和动作条件化等核心概念，以及扩散、自回归和适配器架构所依赖的假设。
      尚未覆盖: 这些架构假设（如独立扩散时间步、隐式状态构建）在长程推理和物理一致性下是否成立，如ViSA发现的信息瓶颈所示。
    - 路线: 缩放规律与保证
      解决的问题: 将模型规模、数据量和后训练对齐（DPO、RLHF）与世界模型生成轨迹的物理保真度和可控性联系起来。
      尚未覆盖: 缩放行为是否可预测失败模式和跨任务迁移；对齐依赖主观人类偏好，分布外泛化未经验证。
    - 路线: 概念分类与边界
      解决的问题: 将视频生成世界模型按状态构建（隐式/显式）和动态建模（知识整合/架构重构）分类，并倡导功能基准。
      尚未覆盖: 该分类法是否改变研究者的设计和评估方式，以及能否弥合无状态视频生成与经典世界模型理论的差距。
    共识:
    - 动作条件化视频预测是构建具身世界模型的核心范式，可支持决策和规划。
    - 评估必须超越视觉保真度，纳入物理合理性、任务完成和时序一致性，纯外观指标不足。
    - 在多样化机器人或视频数据集上进行大规模预训练对泛化和鲁棒性至关重要，后训练对齐可进一步提升可靠性。
    分歧:
    - 架构选择：统一扩散Transformer框架（UWM、IRASim）与掩码自回归（HMA）与基于适配器复用预训练视频扩散模型（AVID），在推理速度和可访问性上各有取舍。
    - 动作条件化机制：帧级动作条件模块（IRASim）、学习掩码修改中间输出（AVID）、模态独立扩散时间步（UWM）和并行上下文块空间动作注入（ABot-PhysWorld）。
    - 对齐信号：多维人类偏好奖励建模结合RL微调（ReWorld）与DPO解耦判别器（ABot-PhysWorld）与纯自监督目标无显式对齐（UWM、IRASim）。
    - 评测目标：测试时空间推理和验证器缩放（ViSA）与物理真实性和任务逻辑（ReWorld、ABot-PhysWorld）与仿真中策略评估和规划（IRASim、UWM）。
    开放问题:
    - 当前世界模型形成信息瓶颈，想象视图无法丰富细粒度推理；如何实现长程持久状态跟踪和因果推理？
    - 无状态视频生成与经典世界模型理论（显式状态、动态）之间的鸿沟尚未弥合；功能基准能否驱动有状态、可验证的世界模型设计？
    - 人类偏好对齐成本高且主观；如何设计可扩展、客观的奖励信号，保证跨本体和跨任务的泛化？
    - 什么缩放规律支配模型规模、数据多样性与鲁棒物理理解涌现之间的关系，如何在实际部署前预测失败案例？
