    unresolved.'
  related_work_outline_zh:
  - 主流方向：当前工作构建可运行的生成式世界模型系统，用于闭环仿真，尤其是自动驾驶和机器人。代表性工作如FAR-Drive、Terra ACT-Bench和Vista，目标是生成动作可控的未来帧或场景动态，而非仅训练孤立模型。
  - 研究共性：论文通过动作、轨迹、上下文或物理信号条件化生成或动力学，并通过保真度、一致性或下游策略表现来评估系统。开放数据集、评测框架和基线模型是常见工件。
  - 关键差异：主要差异在于目标领域、条件信号和评测目标。部分工作强调部署延迟与多视角闭环驾驶；部分侧重零样本策略泛化、物理合理性或数据集与指标构建。
  - 趋势演进：可见的2024-2026前沿从上下文世界模型走向动作可控驾驶仿真器与显式评测工件。证据不足以支撑更长趋势，但方向是可部署闭环仿真和以工件驱动的比较。
  - 开放问题：长时程空间/动作一致性、对未知环境或传感器的泛化、证据包中结果或局限细节缺失，以及延迟、保真度、可控性和系统复杂度之间的权衡仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable simulation and closed-loop serving
      what_it_solves: Produces future video frames or scene dynamics conditioned on
        actions or trajectories, exposing them as simulators or planners for downstream
        control and evaluation.
      what_remains_open: Long-horizon consistency, multi-view and cross-dataset generalization,
        and joint speed-fidelity trade-offs remain only partially verified.
    - line: Contextual and physics-informed world-model training
      what_it_solves: Incorporates context values or physics-derived signals into
        world models to improve zero-shot generalization and physical plausibility
        for learned policies.
      what_remains_open: Assumes observable context in some settings; evaluation breadth
        is limited, and several limitations are not reported in the packet.
    - line: Dataset- and metric-driven evaluation artifacts
      what_it_solves: Provides datasets, metrics, and open-source evaluation frameworks
        for spatial consistency, action fidelity, or simulation realism.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        remains uncertain when results or experimental details are missing.
    consensus:
    - Recent systems focus on generative world models as runnable simulators, often
      using action- or context-conditioned generation.
    - Spatial consistency, action fidelity, and physical plausibility are treated
      as central requirements for simulation-based evaluation.
    - Open datasets, baseline models, or evaluation frameworks are common, but evaluation
      breadth is frequently narrow.
    disagreements:
    - 'Deployment setting differs: closed-loop autonomous driving with latency constraints
      and multi-view consistency versus general game/robotics simulation or contributions
      centered on dataset and metric construction.'
    - 'Conditioning and supervision differ: explicit actions or trajectories, observable
      context values, or physics-based temporal depth and keypoint dynamics.'
    - 'Evaluation targets differ: generation fidelity metrics such as FID/FVD, scene
      graph consistency, action fidelity, planning or simulation realism, or downstream
      reinforcement learning performance.'
    open_questions:
    - Can action-controllable simulators preserve spatial and action fidelity over
      very long rollouts without iterative autoregressive degradation?
    - How well do these systems transfer beyond the reported datasets and environments
      to unseen sensors, dynamics, and unobserved context?
    - What is the independent reproducibility status of evaluation artifacts whose
      evidence packets do not report key results or limitations?
    - How should latency, visual fidelity, controllability, and system complexity
      be jointly traded off for real deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控仿真与闭环服务
      解决的问题: 生成以动作或轨迹为条件的未来视频帧或场景动态，作为仿真器或规划器供下游控制和评测使用。
      尚未覆盖: 长时程一致性、多视角与跨数据集泛化，以及速度-保真度联合权衡仍需验证。
    - 路线: 上下文与物理信息驱动的世界模型训练
      解决的问题: 将上下文值或物理信号纳入世界模型，提升学习策略的零样本泛化和物理合理性。
      尚未覆盖: 部分设置假设上下文可观测；评估范围有限，部分局限性在证据包中未报告。
    - 路线: 数据集与指标驱动的评测工件
      解决的问题: 提供数据集、指标和开源评测框架，用于空间一致性、动作保真度或仿真真实感。
      尚未覆盖: 在结果或实验细节缺失时，跨团队、跨数据集与跨基础设施的独立复现仍有待确认。
    共识:
    - 近期系统集中将生成式世界模型作为可运行仿真器，常采用动作或上下文条件化生成。
    - 空间一致性、动作保真度和物理合理性被视为基于仿真的评测的核心要求。
    - 开放数据集、基线模型或评测框架较常见，但评估范围通常较窄。
    分歧:
    - 部署场景不同：部分面向带延迟约束和多视角一致性的闭环自动驾驶；部分面向通用游戏/机器人仿真或以数据集与指标建设为主的工作。
    - 条件化与监督信号不同：显式动作或轨迹、可观测上下文值，或基于物理的时序深度与关键点动力学。
    - 评测目标不同：FID/FVD等生成保真度指标、场景图一致性、动作保真度、规划或仿真真实感，或下游强化学习表现。
    开放问题:
    - 动作可控仿真器能否在极长推演中保持空间与动作保真度，而不出现迭代自回归退化？
    - 这些系统在超出报告数据集和环境后，对未知传感器、动力学与不可观测上下文的迁移能力如何？
    - 当证据包未报告关键结果或局限性时，评测工件的独立可复现性处于何种状态？
    - 如何在真实部署中联合权衡延迟、视觉保真度、可控性和系统复杂度？
