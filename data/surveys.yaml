    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人和上下文依赖的RL任务中，通过学习潜在动态、视频生成或统一视频-动作表示，实现零样本或组合泛化。
      尚未覆盖: 跨本体和跨数据集的迁移未经验证；评估局限于仿真环境或窄基准套件；可观测上下文变量的假设（如cRSSM）在真实部署中可能不成立。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 构建用于驾驶场景的多视角、长时域视频预测世界模型，支持闭环仿真和策略评估，避免真实世界交互。
      尚未覆盖: 基于仿真的指标与真实驾驶安全或运营结果之间的一致性尚未建立；对新传感器配置或地理域的泛化能力尚未得到验证。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落地到交互式环境（Atari、Minecraft、开放域导航）中，从少量交互中学习高效策略，或对空间一致性和记忆一致性进行基准测试。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化机制尚不清楚；跨视角和跨动作空间的长期记忆一致性与动作控制仍具挑战性。
    共识:
    - 世界模型主要构建为预测未来感官观测的生成模型（扩散、Transformer或循环VAE）。
    - 下游效用通过模型想象空间内的策略学习或通过视频保真度和一致性基准指标来展现。
    - 在大规模数据集上进行自监督或离线预训练是提升泛化能力和数据效率的常见策略。
    - 评估实践越来越多地引入专门基准，测试世界模型的特定能力，如记忆、动作控制和空间一致性。
    分歧:
    - 表示层面：像素空间视频生成（MaskGWM、RoboDreamer、RoboScape）对比潜在状态空间动态（cRSSM、STORM）。
    - 监督信号：纯视频（MaskGWM、RoboDreamer）对比视频-动作联合（UWM）对比上下文条件化（cRSSM）对比物理信息驱动（RoboScape）。
    - 泛化目标：对未见动力学的零样本迁移（cRSSM）对比原语的组合泛化（RoboDreamer）对比跨动作空间和记忆一致性（MIND、LoopNav）。
    - 交互模式：世界模型用于行为策略训练（STORM、UWM）对比世界模型作为开环视频预测器用于评估或规划（MaskGWM、RoboScape）。
    - 部署领域：自动驾驶（MaskGWM）对比机器人操作（RoboDreamer、RoboScape、UWM）对比游戏和导航基准（STORM、LoopNav、MIND）。
    开放问题:
    - 什么样的证据能够将空间一致性或记忆方面基准得分的提升与真实机器人或驾驶任务的成功联系起来？
    - 在多样化机器人数据集上预训练的世界模型能否在不微调的情况下迁移到新本体或物理环境？
    - 物理信息驱动的世界模型（如RoboScape）与纯数据驱动方法相比，在物理合理性和下游策略鲁棒性方面如何？
    - 世界模型需要多少最小监督信号，才能在变化的动作空间中实现鲁棒的长期记忆一致性？
