  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video world models, especially
    diffusion-transformer architectures with auxiliary objectives, applied to driving,
    robotics, and model-based reinforcement learning.'
  - 'Shared research pattern: Models combine visual generation with additional signals
    such as mask reconstruction, depth, keypoint dynamics, context conditioning, or
    action diffusion to improve consistency and downstream control.'
  - 'Key differences: They differ in representation, from recurrent state-space and
    VAE-transformer hybrids to diffusion transformers; in supervision signals; and
    in evaluation settings such as Atari, driving, robot simulation, and consistency
    protocols.'
  - 'Trend evolution: The evidence spans 2023-2026, moving from efficient Atari world
    models toward large-scale robot/driving pretraining, physics-informed generation,
    and closed-loop memory/action evaluation; the trend is current-frontier.'
  - 'Open questions: Whether visual fidelity and generated consistency transfer to
    real robot execution, how much gain comes from the model versus the policy/planner,
    and how unseen context/compositional boundaries should be measured remain verification
    gaps.'
  related_work_outline_zh:
  - 主流方向：围绕生成式视频世界模型，尤其是扩散Transformer架构并结合辅助目标，应用于驾驶、机器人和基于模型的强化学习。
  - 研究共性：将视觉生成与掩码重建、深度、关键点动力学、上下文条件或动作扩散等额外信号结合，以改善一致性和下游控制。
  - 关键差异：表示方式、监督信号和评测设置不同，涉及Atari、驾驶、机器人仿真以及一致性与动作控制评估协议。
  - 趋势演进：证据集中在2023至2026年，从高效Atari世界模型走向大规模机器人与驾驶预训练、物理信息生成和闭环记忆/动作评估；处于当前前沿演变。
  - 开放问题：视觉保真度和生成一致性是否迁移到真实机器人执行，收益多少来自模型而非策略/规划器，以及未见上下文与组合边界如何度量，仍属验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative video-diffusion world-model architectures
      what_it_solves: Builds scalable video prediction with diffusion transformers
        and auxiliary reconstruction tasks; MaskGWM and Unified World Models are representative.
      what_remains_open: Evidence mostly covers visual fidelity and policy pretraining,
        while physical plausibility and transfer to unseen real-world domains remain
        under-verified.
    - line: Context-conditioned and compositional dynamics
      what_it_solves: Adapts latent dynamics to observed context or language-derived
        primitives for zero-shot/compositional generalization; cRSSM and RoboDreamer
        illustrate this line.
      what_remains_open: Assumes observable context values or pre-seen primitives,
        and evaluation is limited to narrow tasks or simulated execution.
    - line: Efficient stochastic model-based reinforcement learning
      what_it_solves: Uses stochastic or transformer-based world models to train policies
        from imagined rollouts with low interaction; STORM demonstrates Atari 100k
        efficiency.
      what_remains_open: The contribution of the model representation versus training
        recipe and task prior is not fully isolated.
    - line: Closed-loop evaluation protocols for memory and action control
      what_it_solves: Creates datasets and metrics to measure spatial-temporal consistency
        and action following beyond pixel-level similarity; LoopNav and MIND are examples.
      what_remains_open: Metric sensitivity, baseline comparability, and relation
        to real downstream robot/agent performance are verification gaps.
    consensus:
    - Recent architectures augment video generation with auxiliary objectives rather
      than relying on pure next-frame reconstruction.
    - Learned world models are increasingly evaluated by downstream policy learning,
      action-conditioned generation, or closed-loop consistency, not only image quality.
    - Multi-task robot and driving data are treated as a key source for pretraining
      generalizable dynamics.
    disagreements:
    - 'Representation choices differ: compact recurrent state-space/VAE hybrids versus
      large diffusion-transformer video generators.'
    - Supervision signals differ, including mask reconstruction, depth/keypoint physics
      proxies, language-compositional primitives, and paired video-action diffusion.
    - Evaluation targets and interaction settings differ across Atari sample efficiency,
      driving prediction, simulated robot execution, and first/third-person memory/action
      protocols.
    - Assumptions about context observability, primitive coverage, and deployment
      realism vary, limiting direct comparability.
    open_questions:
    - How do world models maintain long-term memory consistency and generalize across
      action spaces when evaluated beyond their training distribution?
    - How much of reported policy improvement is attributable to the learned world
      model rather than the policy/planner or task-specific context?
    - Can physics-informed and diffusion-based video predictions be validated against
      real robot execution, not only visual metrics or simulation?
    - What minimal context, primitive, and action assumptions are required for zero-shot
      or compositional generalization without relying on observable ground truth?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频扩散世界模型架构
      解决的问题: 利用扩散Transformer和辅助重建任务构建可扩展的视频预测；代表工作如MaskGWM和Unified World Models。
      尚未覆盖: 证据主要覆盖视觉保真度和策略预训练，物理合理性及向未见的真实域迁移仍未充分验证。
    - 路线: 上下文条件与组合动力学
      解决的问题: 根据可观测上下文或语言导出原语调整潜在动力学，以实现零样本/组合泛化；cRSSM和RoboDreamer是示例。
      尚未覆盖: 假设上下文可观测或存在已见原语，且评估限于较窄任务或仿真执行。
    - 路线: 高效随机基于模型的强化学习
      解决的问题: 利用随机或Transformer世界模型从想象轨迹训练策略，以低交互量提升效率；STORM在Atari 100k上表现突出。
      尚未覆盖: 模型表示本身的贡献与训练配方、任务先验的贡献尚未完全隔离。
    - 路线: 记忆与动作控制的闭环评估协议
      解决的问题: 构建数据集和指标以衡量时空一致性和动作跟随能力，超越像素级相似性；LoopNav和MIND是示例。
      尚未覆盖: 指标敏感性、基线可比性以及其与真实下游机器人/智能体表现的关系仍是验证缺口。
    共识:
    - 近期架构普遍在视频生成中引入辅助目标，而不是只依赖纯下一帧重建。
    - 学习到的世界模型越来越多地通过下游策略学习、动作条件生成或闭环一致性来评估，而不仅看图像质量。
    - 多任务机器人和驾驶数据被视为预训练可泛化动力学的重要来源。
    分歧:
    - 表示选择不同：紧凑的循环状态空间/VAE混合与大规模扩散Transformer视频生成器并存。
    - 监督信号不同，包括掩码重建、深度/关键点物理代理、语言组合原语以及视频-动作配对扩散。
    - 评测目标和交互设置不同：Atari样本效率、驾驶预测、机器人仿真执行以及第一/第三人称记忆与动作协议。
    - 关于上下文可观测性、原语覆盖和部署真实性的假设各不相同，限制了直接可比性。
    开放问题:
    - 当超出训练分布时，世界模型如何保持长期记忆一致性并跨动作空间泛化？
    - 报告的策略提升中，有多少来自学到的世界模型，而不是策略/规划器或任务特定上下文？
    - 物理信息驱动和基于扩散的视频预测能否通过真实机器人执行，而不只是视觉指标或仿真来验证？
    - 在不依赖可观测真值的情况下，实现零样本或组合泛化所需的最低上下文、原语和动作假设是什么？
