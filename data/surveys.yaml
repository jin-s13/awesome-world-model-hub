  literature_review:
    line_of_work_matrix:
    - line: Generative driving video prediction with masked feature reconstruction
      what_it_solves: Long-horizon and multi-view driving video generation by coupling
        diffusion transformers with MAE-style mask construction and cross-view modules.
      what_remains_open: Whether the reported gains transfer beyond NuScenes, OpenDV-2K,
        and Waymo is unclear, and limitation details are not reported.
    - line: Contextual recurrent state-space world models for model-based RL
      what_it_solves: Zero-shot policy generalization to unseen dynamics by conditioning
        latent state inference and dynamics on observable context values.
      what_remains_open: Assumes observable context and is evaluated on only two CARL
        tasks; broader hidden-context generalization remains untested.
    - line: Efficient stochastic transformer world models for sample-limited control
      what_it_solves: Combines transformer sequence modeling with variational stochastic
        latents to improve Atari 100k performance and training efficiency without
        lookahead search.
      what_remains_open: Evidence is limited to Atari 100k; transfer to complex embodied
        or long-horizon settings is not shown.
    - line: Compositional language-conditioned robot world models
      what_it_solves: Generates video plans for unseen task-goal combinations by factorizing
        language into lower-level primitives and composing conditioned video models.
      what_remains_open: Generalization depends on seen primitives and accurate parsing,
        and evaluation remains in simulation rather than real robots.
    - line: Physics-informed and unified action-video embodied world models
      what_it_solves: Improves visual fidelity and physical plausibility through temporal
        depth/keypoint tasks, or couples video and action diffusion for pretraining
        and policy/dynamics learning.
      what_remains_open: Limitations are not reported; evidence does not fully separate
        gains from auxiliary tasks or pretraining data versus the core dynamics learner.
    - line: World-model evaluation benchmarks for spatial, memory, and action consistency
      what_it_solves: Provides loop-navigation or open-domain closed-loop video benchmarks
        and consistency scores to quantify spatial coherence, memory, and action control.
      what_remains_open: Top evidence is mostly benchmark construction; systematic
        method comparisons and failure boundaries across current models remain to
        be demonstrated.
    consensus:
    - World-model methods increasingly treat video generation as a core capability
      and add auxiliary objectives such as masked reconstruction, depth prediction,
      or keypoint dynamics to improve consistency or physical plausibility.
    - 'Conditioning is a shared mechanism: context values, language instructions,
      multimodal goals, or action/video diffusion timesteps are used to control the
      model and improve downstream generalization.'
    - Evaluations connect predictive quality to downstream utility, including policy
      learning, video planning, long-horizon generation, zero-shot generalization,
      and memory/action consistency.
    - The field is shifting from reconstruction loss alone toward data-driven benchmarks
      and task-oriented evaluation, while several works still lack detailed limitation
      reporting.
    disagreements:
    - 'Representation differs across methods: recurrent state-space latents with explicit
      context, stochastic VAE-transformer latents, diffusion transformers with mask
      tokens, language-factorized generators, and unified video-action diffusion.'
    - 'Training objectives differ: MAE-style mask reconstruction, contextual latent
      imagination, VAE-transformer self-supervised learning, language-primitive video
      composition, joint depth/keypoint prediction, and coupled diffusion objectives.'
    - 'Evaluation settings differ: Atari 100k sample-efficient control, CARL contextual
      zero-shot dynamics, driving multi-view generation, robot simulation/RT-X video
      planning, and Minecraft/open-domain consistency benchmarks.'
    - 'Interaction assumptions differ: some models require observable contexts or
      predefined primitives; others learn from action-free video or control modality-specific
      diffusion timesteps.'
    - 'Deployment scope differs: some methods are validated only in simulation or
      narrow task families, while others target real-world driving or robotic pretraining
      but do not yet demonstrate real-robot execution.'
    open_questions:
    - Which auxiliary objectives actually transfer beyond the reported datasets, and
      do they improve the learned dynamics rather than only visual prediction?
    - Can contextual world models generalize when context variables are partially
      observable or unobservable instead of given?
    - How should memory consistency, spatial consistency, action control, and physical
      plausibility be jointly evaluated across diverse action spaces and long horizons?
    - What failure boundaries remain for language-composed world models when instructions
      require novel primitive combinations or parsing errors occur?
    - How much downstream policy or planning improvement is caused by the model representation
      versus the planner, controller, data scale, or auxiliary system choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带掩码重建的驾驶视频生成世界模型
      解决的问题: 通过扩散Transformer结合MAE式掩码构建和跨视图模块，实现长时域、多视角驾驶视频预测。
      尚未覆盖: 已报告在NuScenes、OpenDV-2K和Waymo上的提升，但未说明局限性和其他任务族的迁移边界。
    - 路线: 面向模型基强化学习的上下文循环状态空间世界模型
      解决的问题: 将可观测上下文显式引入潜在状态推断和动力学建模，提升未见动力学下的零样本策略泛化。
      尚未覆盖: 假设上下文可观测，且仅在CARL两个任务上验证，更广泛的不可见上下文场景未覆盖。
    - 路线: 样本受限控制的高效随机Transformer世界模型
      解决的问题: 结合Transformer序列建模与变分随机潜在变量，在Atari 100k上提升人类表现分数并降低训练时间。
      尚未覆盖: 证据限于Atari 100k，缺少复杂具身或长时域设置中的迁移验证。
    - 路线: 语言组合条件机器人世界模型
      解决的问题: 将语言指令分解为低层原语并组合条件视频模型，以生成未见目标组合的视频计划。
      尚未覆盖: 泛化依赖已见原语和准确解析，评估停留在仿真，未展示真实机器人执行。
    - 路线: 物理信息与统一动作-视频具身世界模型
      解决的问题: 通过时间深度/关键点任务增强物理合理性，或联合视频与动作扩散学习策略、动力学和视频生成。
      尚未覆盖: 缺乏局限性说明，且下游收益是否来自核心动力学学习而非辅助任务、预训练数据或系统选择仍不明确。
    - 路线: 面向空间、记忆和动作一致性的世界模型评测基准
      解决的问题: 提供循环导航或开放域闭环视频基准和一致性分数，量化空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 主要证据集中于基准构建，当前模型间的系统性比较和失败边界仍需进一步展示。
    共识:
    - 世界模型方法日益将视频生成作为核心能力，并加入掩码重建、深度预测或关键点动力学等辅助目标，以提升一致性或物理合理性。
    - 条件化是共同机制：上下文值、语言指令、多模态目标或动作/视频扩散时间步被用于控制模型并提升下游泛化。
    - 评测将预测质量与下游效用联系起来，包括策略学习、视频规划、长时域生成、零样本泛化和记忆/动作一致性。
    - 领域正从仅看重建损失转向数据驱动基准和任务导向评测，但若干部工作仍缺少详细的局限性报告。
    分歧:
    - 表示方式不同：显式上下文的循环状态空间潜在、随机VAE-Transformer潜在、带掩码token的扩散Transformer、语言分解生成器，以及统一视频-动作扩散。
    - 训练目标不同：MAE式掩码重建、上下文潜在想象、VAE-Transformer自监督学习、语言原语视频组合、联合深度/关键点预测和耦合扩散目标。
    - 评测设置不同：Atari 100k样本受限控制、CARL上下文零样本动力学、驾驶多视角生成、机器人仿真/RT-X视频规划，以及Minecraft/开放域一致性基准。
    - 交互假设不同：部分模型要求可观测上下文或预定义原语；另一些从无动作视频中学习，或通过控制模态特定扩散时间步工作。
    - 部署范围不同：部分方法仅在仿真或狭窄任务族中验证，另一些面向真实驾驶或机器人预训练，但尚未展示真实机器人执行。
    开放问题:
    - 哪些辅助目标能真正迁移到报告数据集之外，并且改善的是学习动力学而不只是视觉预测？
    - 当上下文变量部分可观测或不可观测时，上下文世界模型能否继续泛化？
    - 如何跨不同动作空间和长时域联合评估记忆一致性、空间一致性、动作控制和物理合理性？
    - 当指令要求新的原语组合或解析出错时，语言组合世界模型的失败边界在哪里？
    - 下游策略或规划提升中有多少来自模型表示，而不是规划器、控制器、数据规模或辅助系统选择？
