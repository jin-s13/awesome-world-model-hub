  related_work_outline:
  - 'Mainstream direction: The visible high-ranking work focuses on world-model evaluation
    and construction for embodied, driving, robotic, and game settings, stressing
    video prediction, spatial or memory consistency, action control, and downstream
    policy value rather than leaderboard score alone.'
  - 'Shared research pattern: Contributions combine a dataset or benchmark with a
    model or baseline and assess fidelity, consistency, generalization, or policy
    utility, often using shared suites such as Atari 100k, Nuscenes, OpenDV-2K, Waymo,
    or CARL.'
  - 'Key differences: Evaluation targets range from spatial loop consistency and memory/action
    control to visual detail and zero-shot dynamics; supervision varies across action-free
    video, observable context, joint action-video diffusion, and physics-informed
    objectives.'
  - 'Trend evolution: The available top evidence is concentrated in 2023-2026, showing
    a shift from game-centric aggregate benchmarking toward embodied, driving, and
    robotic stress tests for consistency, controllability, and generative pretraining.'
  - 'Open questions: How to measure open-domain long-term memory and cross-action-space
    generalization; whether proxy metrics align with downstream decisions; how stable
    reported gains are under varied implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：可见高排名工作聚焦于具身驾驶、机器人和游戏场景的世界模型评测与构建，强调视频预测、空间/记忆一致性、动作控制和下游策略价值，而非仅看总分。
  - 研究共性：工作通常将数据集或基准与模型/基线配对，评估保真度、一致性、泛化或策略效用，常用Atari 100k、Nuscenes、OpenDV-2K、Waymo、CARL等共享套件。
  - 关键差异：评测目标从空间循环一致性、记忆/动作控制到视觉细节和零样本动力学不等；监督信号涵盖无动作视频、可观测上下文、视频-动作联合扩散和物理信息目标。
  - 趋势演进：可见高排序证据集中在2023-2026年，显示从游戏中心聚合基准转向具身、驾驶和机器人一致性、可控性与生成式预训练压力测试。
  - 开放问题：如何测量开放域长期记忆与跨动作空间泛化；代理指标是否与下游决策一致；报告提升在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets, such as loop-based navigation
        video in Minecraft or multi-scene videos with varied action spaces, to compare
        world-model spatial, memory, and action-consistency capabilities.
      what_remains_open: Whether these curated distributions cover the open-domain
        and long-horizon settings where world models are expected to help; one dataset-focused
        contribution reports no experimental results in the abstract.
    - line: Metric and stress-test design
      what_it_solves: Provides targeted probes, including scene-graph consistency
        scoring, memory consistency and action control measures, and Atari human-normalized
        scores, to test specific model capabilities beyond aggregate numbers.
      what_remains_open: Alignment between these proxy metrics and downstream policy
        or deployment utility remains unclear; several stress-test results rely on
        limited tasks or scenes.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared benchmarks such as Atari 100k, Nuscenes, OpenDV-2K,
        Waymo, and CARL to make world-model training, rollout, and generalization
        results more auditable across implementations.
      what_remains_open: Whether benchmark conclusions stay stable across implementations
        and compute budgets is unverified; several top papers omit limitations or
        do not clarify all artifact availability.
    - line: Generative world-model pretraining and downstream evaluation
      what_it_solves: Tests whether joint video-action diffusion, physics-informed
        objectives, or mask-reconstruction training improve visual fidelity, physical
        plausibility, policy training, or zero-shot generalization.
      what_remains_open: Most evidence covers specific benchmarks or robot tasks;
        broader generalization to unseen dynamics, real-world deployment, and open-domain
        long-term memory remains untested.
    consensus:
    - World-model evaluation is moving toward targeted capability probes such as spatial
      consistency, memory consistency, physical plausibility, and action control rather
      than relying solely on visual quality or aggregate scores.
    - Shared benchmarks and curated datasets are used as common ground for comparing
      generative world models, with results reported on suites including Atari 100k,
      CARL, Nuscenes, OpenDV-2K, and Waymo.
    - Several works treat world models as trainable simulators, evaluating their usefulness
      through downstream policy training, policy evaluation, or zero-shot generalization.
    disagreements:
    - 'Evaluation target differs: loop-based spatial consistency, memory consistency
      and action control, zero-shot contextual dynamics, and game visual-detail or
      agent performance represent different priorities.'
    - 'Interaction and supervision differ: some benchmarks provide paired actions
      or action spaces, while some methods learn from action-free video or require
      observable context values.'
    - 'Representation and training objective differ: approaches include diffusion
      transformers with mask reconstruction, stochastic transformer-VAE models, physics-informed
      keypoint/depth training, and joint video-action diffusion.'
    open_questions:
    - Do current proxy metrics align with downstream robot policy or deployment decisions
      rather than only benchmark rankings?
    - Can current datasets and stress tests cover open-domain long-horizon memory,
      cross-action-space generalization, and unobserved dynamics?
    - Are reported improvements stable across independent implementations, compute
      budgets, and broader task distributions beyond the tested scenes or limited
      CARL tasks?
    - Several top papers omit limitations or do not clarify artifact availability,
      creating a verification gap for reproducibility rather than proof of missing
      assets.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务与数据集，例如Minecraft循环导航视频或跨场景多动作空间视频，以比较世界模型的空间、记忆和动作一致性。
      尚未覆盖: 这些精选分布是否覆盖世界模型预期发挥作用的开放域和长时域设置尚不确定；某数据集工作摘要未报告实验结果。
    - 路线: 指标与压力测试设计
      解决的问题: 提出场景图一致性分数、记忆一致性与动作控制度量、Atari人类归一化分数等定向探针，在聚合总分之外检验具体能力。
      尚未覆盖: 这些代理指标与下游策略或部署效用之间的一致性仍不清楚；若干压力测试仅覆盖有限任务或场景。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、Nuscenes、OpenDV-2K、Waymo、CARL等共享基准，使世界模型训练、展开和泛化结果更可审计。
      尚未覆盖: 基准结论能否在不同实现和算力预算下保持稳定尚未验证；若干高排名论文未报告局限性或未明确所有工件可用性。
    - 路线: 生成式世界模型预训练与下游评测
      解决的问题: 检验联合视频-动作扩散、物理信息目标或掩码重建训练是否提升视觉保真度、物理合理性、策略训练或零样本泛化。
      尚未覆盖: 证据多覆盖特定基准或机器人任务；对未知动力学、真实部署和开放域长期记忆的泛化仍缺少检验。
    共识:
    - 世界模型评测正在转向针对空间一致性、记忆一致性、物理合理性和动作控制等具体能力的探测，而非仅依赖视觉质量或聚合分数。
    - 共享基准和精选数据集被用作比较生成式世界模型的共同基础，结果通常报告在Atari 100k、CARL、Nuscenes、OpenDV-2K和Waymo等套件上。
    - 多项工作将世界模型视为可训练的模拟器，通过下游策略训练、策略评估或零样本泛化来检验其实际用途。
    分歧:
    - 评测目标不同：基于循环的空间一致性、记忆一致性与动作控制、零样本上下文动力学、以及游戏视觉细节或智能体表现对应不同优先级。
    - 交互与监督不同：一些基准提供配对动作或动作空间，而一些方法从无动作视频学习，或依赖可观测上下文值。
    - 表示与训练目标不同：方法包括带掩码重建的扩散Transformer、随机Transformer-VAE模型、物理信息关键点/深度训练以及视频-动作联合扩散。
    开放问题:
    - 当前代理指标是否与下游机器人策略或真实部署决策一致，而不只是基准排名？
    - 当前数据集和压力测试能否覆盖开放域长时域记忆、跨动作空间泛化和未知动力学？
    - 报告提升是否能在独立实现、不同算力预算以及超出测试场景或有限CARL任务的更广任务分布中保持稳定？
    - 若干高排名论文未报告局限性或未明确工件可用性，这是可复现性验证缺口，而非缺失资产的证明。
