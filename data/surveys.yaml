  related_work_outline:
  - 'Mainstream direction: Recent world-model research centers on generative sequence
    architectures for video and latent dynamics, with three sub-directions: model
    representation/objective design, action-coupled or planning interfaces, and benchmark/metric
    protocols for consistency and control. Top evidence clusters in embodied settings—driving,
    robotics, and interactive environments—rather than a single generic architecture.'
  - 'Shared research pattern: Papers learn predictive dynamics from interaction or
    video, then evaluate through downstream control, zero-shot generalization, or
    action-conditional generation. Common elements include self-supervised reconstruction/generation
    losses, stochastic or diffusion formulations, and multi-objective training such
    as mask, context, physics, language, or action prediction.'
  - 'Key differences: They differ in representation, including transformer-VAE, diffusion
    transformer, and coupled action-video diffusion; in supervision signals such as
    context, language primitives, physics, mask reconstruction, or action-free video;
    in evaluation targets such as policy returns, video fidelity, or memory/spatial
    consistency; and in interaction mode such as latent planning, generated video
    plans, or action-conditioned rollout.'
  - 'Trend evolution: The available top papers span 2023–2026 and show a shift from
    model-based RL efficiency on Atari toward large generative world models for driving
    and robotics, with growing emphasis on zero-shot generalization, physics-informed
    generation, unified action-video modeling, and benchmarked long-term consistency.'
  - 'Open questions: Cross-task transfer of representations and objectives remains
    unverified; gains are not fully attributed to model versus planner, context, or
    language priors; memory and consistency evaluation is still narrow; and missing
    limitations, baselines, or metrics leave method evidence incomplete.'
  related_work_outline_zh:
  - 主流方向：近期世界模型研究以视频与潜在动力学的生成式序列架构为核心，主要分为模型表示与目标设计、动作耦合或规划接口、一致性与控制的基准协议三个子方向；证据集中在驾驶、机器人和交互环境。
  - 研究共性：论文从交互或视频中学习预测动力学，并通过下游控制、零样本泛化或动作条件生成评估；常采用自监督重建/生成损失、随机或扩散形式，以及掩码、上下文、物理、语言或动作等多目标训练。
  - 关键差异：表示方式（Transformer-VAE、Diffusion Transformer、动作-视频扩散耦合）、监督信号（上下文、语言原语、物理、掩码重建、无动作视频）、评测目标（策略回报、视频保真、记忆/空间一致性）和交互模式（潜在规划、生成视频计划、动作条件展开）不同。
  - 趋势演进：可用高排名论文集中于2023–2026，显示从Atari上基于模型强化学习的效率追求，转向面向驾驶与机器人的生成式世界模型，并更强调整零样本泛化、物理信息生成、统一动作-视频建模和长期一致性基准。
  - 开放问题：表示与目标的跨任务迁移仍不明确；收益多少来自模型而非规划器、上下文或语言先验尚未隔离；记忆/一致性评测仍较窄；部分论文缺少局限性、基线和指标，方法证据不完整。
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model representation and objective design
      what_it_solves: Converts world-model ideas into concrete video/latent predictive
        architectures and training losses, such as diffusion transformers with mask
        reconstruction, transformer-VAE stochastic models, context-conditioned recurrent
        state-space models, and physics-informed video generation.
      what_remains_open: Which representation and auxiliary objectives transfer beyond
        reported task families such as Atari, CARL, driving datasets, and robotic
        scenarios; whether long-horizon, multi-view, unseen-dynamics, and physical-plausibility
        claims hold under missing limitation evidence.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention by training policies
        inside world-model imagination, coupling action and video diffusion, generating
        language-composed video plans, or producing physics-informed rollouts for
        policy training and evaluation.
      what_remains_open: Whether measured gains come from the model rather than the
        planner, controller, language parser, or task context; how far action-free
        video learning and cross-action-space generalization extend; and whether simulation-only
        execution transfers to real robots.
    - line: Method evidence and evaluation protocol
      what_it_solves: Provides datasets, benchmarks, and metrics for spatial consistency,
        memory consistency, action control, and zero-shot generalization; examples
        include loop-navigation scene-graph consistency, closed-loop revisited video
        evaluation, and policy generalization on CARL.
      what_remains_open: Evidence often does not isolate the proposed method from
        dataset, baseline, metric, and implementation choices; some benchmark papers
        report no experimental results, small task counts, or incomplete baseline
        and limitation details, limiting comparability.
    consensus:
    - Recent work treats generative sequence models, including video diffusion, transformer-VAE,
      or coupled action-video diffusion, as the shared substrate for learning world
      models.
    - 'Multiple objectives and modalities are increasingly combined to improve fidelity
      and control: reconstruction, mask or context conditioning, physics, language
      composition, and action prediction.'
    - Evaluation is shifting from per-task returns toward generalization, long-horizon
      consistency, physical plausibility, and action-conditioned controllability.
    disagreements:
    - 'Representation assumptions differ: variational stochastic latents, diffusion
      denoising, and unified multi-modal diffusion imply different uncertainty and
      conditioning choices.'
    - 'Supervision and data differ: context-observable reinforcement learning, language-parsed
      primitives, mask reconstruction, physics auxiliary tasks, action-free video,
      and large multitask robot datasets are used unequally.'
    - 'Evaluation targets differ: policy zero-shot or return, driving video fidelity,
      embodied video plausibility, and memory/spatial/action consistency create different
      success criteria.'
    - 'Interaction mode differs: latent imagination for policy learning, generated
      video plans for execution, and interactive action-conditioned rollouts expose
      different control assumptions.'
    open_questions:
    - Which model architecture and objective choices generalize beyond Atari 100k,
      CARL, NuScenes/OpenDV-2K/Waymo, RT-X, and Minecraft-style benchmarks?
    - How can evaluation separate the contribution of learned dynamics from planner,
      controller, language-parser, or task-context effects?
    - Can memory and spatial consistency benchmarks scale beyond small curated video
      sets while providing standardized baselines and metrics?
    - Are physics-informed and compositional generation methods sufficient for novel
      action spaces, unseen object/action primitives, and real-world deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型的表示与目标设计
      解决的问题: 将世界模型思想落实为具体的视频/潜在预测架构和训练损失，例如Diffusion Transformer加掩码重建、Transformer-VAE随机模型、上下文条件循环状态空间模型、物理信息视频生成。
      尚未覆盖: 哪些表示与辅助目标能迁移到报告任务族之外（Atari、CARL、驾驶数据集、机器人场景）；长时域、多视角、未知动力学和物理合理性声明在缺少局限性证据时仍不明确。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预：在世界模型的想象轨迹中训练策略、耦合动作与视频扩散、生成由语言组合的视频计划，或提供物理信息展开用于策略训练与评估。
      尚未覆盖: 收益来自模型还是规划器、控制器、语言解析器或任务上下文尚未隔离；无动作视频学习与跨动作空间泛化边界不明；仅仿真的执行能否迁移到真实机器人尚不明确。
    - 路线: 方法证据与评测协议
      解决的问题: 提供用于空间一致性、记忆一致性、动作控制和零样本泛化的数据集、基准与指标，例如循环导航场景图一致性、闭环复访视频评测、CARL策略泛化。
      尚未覆盖: 证据常未隔离所提方法与数据集、基线、指标和实现选择；部分基准论文无实验结果、任务数少或缺少基线与局限性细节，可比性有限。
    共识:
    - 近期工作将生成式序列模型作为世界模型的共同基础，包括视频扩散、Transformer-VAE或动作-视频耦合扩散。
    - 越来越多的研究组合多种目标与模态以改善保真度和控制：重建、掩码或上下文条件、物理、语言组合和动作预测。
    - 评测正从单任务回报转向泛化、长时域一致性、物理合理性和动作条件可控性。
    分歧:
    - 表示假设不同：变分随机潜变量、扩散去噪与统一多模态扩散隐含不同的不确定性和条件化方式。
    - 监督和数据不同：可观测上下文强化学习、语言解析原语、掩码重建、物理辅助任务、无动作视频和大规模多任务机器人数据被不同程度采用。
    - 评测目标不同：策略零样本/回报、驾驶视频保真度、具身视频合理性与记忆/空间/动作一致性形成不同成功标准。
    - 交互模式不同：潜在想象用于策略学习、生成视频计划用于执行、以及交互式动作条件展开暴露不同的控制假设。
    开放问题:
    - 哪些模型架构和目标选择能泛化到Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo、RT-X和Minecraft式基准之外？
    - 如何让评测分离学习动力学与规划器、控制器、语言解析器或任务上下文的影响？
    - 记忆与空间一致性基准能否从小规模精选视频集扩展，并提供标准化基线和指标？
    - 物理信息和组合生成方法是否足以应对新动作空间、未见物体/动作原语和真实部署？
