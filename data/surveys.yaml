  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    or stochastic latent dynamics, applied to driving, robotics, and model-based RL;
    recent work adds physics, context, action coupling, and consistency benchmarks.'
  - 'Shared research pattern: Learn dynamics from videos or interaction trajectories,
    often self-supervised, and evaluate generation quality or downstream control;
    papers combine visual prediction with auxiliary tasks such as masks, depth, keypoints,
    language primitives, or action diffusion.'
  - 'Key differences: Representation choices range from pixel-space diffusion and
    VAE latents to physics/keypoint-aware objectives; supervision ranges from context
    values and language instructions to actions and reward-free video; evaluation
    spans Atari, CARL, driving, robot, and Minecraft settings.'
  - 'Trend evolution: High-read-first evidence is concentrated in 2023-2026, so the
    inferred trend remains within the current frontier; it shifts from efficient stochastic
    world models for Atari toward contextual/compositional robot world models and
    unified video-action pretraining, with 2025-2026 benchmarks emphasizing long-horizon
    and spatial/memory consistency.'
  - 'Open questions: How to maintain physical and memory consistency across long horizons,
    generalize beyond observed contexts/primitives, attribute gains to model versus
    planner or task prior, and connect consistency benchmarks to downstream policy
    improvement.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer或随机潜在动力学的生成式世界模型，应用于驾驶、机器人和基于模型的强化学习；近期工作引入物理、上下文、动作耦合与一致性基准。
  - 研究共性：从视频或交互轨迹中自监督学习动力学，评估生成质量或下游控制；视觉预测常与掩码、深度、关键点、语言原语或动作扩散等辅助任务结合。
  - 关键差异：表示选择涵盖像素扩散、VAE潜变量和物理/关键点感知目标；监督信号涵盖上下文、语言指令、动作与无奖励视频；评测覆盖Atari、CARL、驾驶、机器人和Minecraft。
  - 趋势演进：高优先证据集中在2023–2026年，趋势仍在当前前沿内；先是从Atari高效随机世界模型转向上下文/组合式机器人世界模型，再转向统一视频-动作预训练；2025–2026年基准更强调长时域与空间/记忆一致性。
  - 开放问题：如何保持长时域物理与记忆一致性、泛化到未见上下文/原语、区分模型与规划器或任务先验的贡献，以及将一致性基准和下游策略提升联系起来。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-transformer video world models with auxiliary reconstruction
        or physics-aware objectives
      what_it_solves: Long-horizon, multi-view, and physically plausible future video
        generation for driving and robot scenarios
      what_remains_open: Transfer beyond the reported datasets and whether spatial
        or physical consistency holds without task-specific auxiliary losses
    - line: Stochastic latent or contextual recurrent state-space world models for
        model-based RL
      what_it_solves: Data-efficient policy learning and zero-shot generalization
        to changed dynamics by conditioning latent dynamics on context
      what_remains_open: Generalization beyond observed context values and a small
        set of CARL tasks; assumes context observability
    - line: Language-factorized compositional world models for robot video generation
      what_it_solves: Generalization to unseen object-action-goal combinations by
        decomposing instructions into learned primitive generators
      what_remains_open: Truly novel primitives, parsing accuracy, and real-robot
        execution evidence beyond simulation
    - line: Unified video-and-action diffusion pretraining for robot policies and
        dynamics
      what_it_solves: Pretraining policy, forward/inverse dynamics, and video generation
        in one transformer while also using action-free video
      what_remains_open: Isolation of which mixture of dynamics, video, and action
        supervision drives downstream policy gains
    - line: Benchmarks for spatial consistency, memory consistency, and action control
      what_it_solves: Evaluation protocols that move beyond pixel-level or short-horizon
        generation quality
      what_remains_open: Whether benchmark scores predict downstream control or deployment
        reliability; some benchmarks lack reported model-comparison results
    consensus:
    - Recent world-model methods increasingly treat learned dynamics as generative
      or predictive systems conditioned on context, actions, language, or physics
      signals rather than isolated next-frame predictors.
    - Evaluation is expanding from short-horizon visual quality to long-horizon consistency,
      spatial coherence, memory, and action responsiveness.
    - Self-supervised or reward-free video learning is used as a pathway to improve
      downstream policy learning and generalization.
    disagreements:
    - 'Representation differs: some methods generate in pixel space with diffusion,
      while others use latent state-space, VAE, or physics/keypoint-aware representations.'
    - 'Supervision differs: methods use explicit context variables, language-instruction
      primitives, auxiliary physics tasks, or joint action diffusion.'
    - 'Evaluation target differs: evidence ranges from Atari 100k and CARL contextual
      RL to driving, robot manipulation, and open-domain Minecraft consistency.'
    - 'Interaction mode differs: some models are video predictors disconnected from
      policy execution, while others natively couple action generation with video
      generation or plan execution.'
    open_questions:
    - How do generative video world models maintain long-horizon memory and spatial
      consistency across viewpoints or loop closures without explicit memory or geometry?
    - How much of the reported improvement comes from the world model representation,
      auxiliary tasks, planner/controller, or task priors?
    - Do context-conditioned and composition-based models transfer beyond observed
      context ranges and known primitive combinations?
    - Can memory/action consistency benchmark scores serve as reliable predictors
      of downstream policy performance or robotic deployment?
    - Several top papers omit limitations or comparison details; which verification
      gaps hide untested assumptions, missing baselines, or non-reproducible evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带辅助重建或物理目标的扩散Transformer视频世界模型
      解决的问题: 为驾驶和机器人场景生成长时域、多视角且物理合理的未来视频
      尚未覆盖: 报告数据集之外的迁移，以及无任务特定辅助损失时空间/物理一致性是否仍成立
    - 路线: 用于基于模型的强化学习的随机潜在或上下文循环状态空间模型
      解决的问题: 通过上下文条件化潜在动力学，实现数据高效策略学习和面对动力学变化的零样本泛化
      尚未覆盖: 可观测上下文值之外的泛化，以及仅少量CARL任务上验证的局限
    - 路线: 语言因子化组合世界模型用于机器人视频生成
      解决的问题: 通过把指令分解为已学原语生成器，实现对未见物体-动作-目标组合的泛化
      尚未覆盖: 全新原语、解析准确性和仿真之外的真实机器人执行证据
    - 路线: 统一视频与动作扩散预训练用于机器人策略和动力学
      解决的问题: 在单个Transformer中预训练策略、前向/逆动力学和视频生成，并利用无动作视频
      尚未覆盖: 动力学、视频和动作监督的何种组合驱动下游策略提升，仍需分离
    - 路线: 空间一致性、记忆一致性和动作控制基准
      解决的问题: 提供超越像素级或短时域生成质量的评估协议
      尚未覆盖: 基准分数是否预测下游控制或部署可靠性；部分基准缺少模型对比结果
    共识:
    - 近年世界模型方法越来越把学习到的动力学视为以上下文、动作、语言或物理信号为条件的生成或预测系统，而不是孤立地预测下一帧。
    - 评估正从短时域视觉质量扩展到长时域一致性、空间连贯性、记忆和动作响应。
    - 自监督或无奖励视频学习被用作提升下游策略学习和泛化的路径。
    分歧:
    - 表示方式不同：有的在像素空间用扩散生成，有的使用潜在状态空间、VAE或物理/关键点感知表示。
    - 监督信号不同：有的用显式上下文变量，有的用语言指令原语、辅助物理任务或联合动作扩散。
    - 评测目标不同：证据覆盖Atari 100k和CARL上下文强化学习，以及驾驶、机器人操控和开放域Minecraft一致性。
    - 交互模式不同：有的视频预测器不直接执行策略，有的在同一个模型中耦合动作生成与视频生成或计划执行。
    开放问题:
    - 生成式视频世界模型如何在没有显式记忆或几何的情况下，跨视角或闭环保持长时域记忆和空间一致性？
    - 报告的提升有多少来自世界模型表示、辅助任务、规划器/控制器或任务先验？
    - 基于上下文和组合的方法能否迁移到已观测上下文范围和已知原语组合之外？
    - 记忆/动作一致性基准分数能否可靠预测下游策略表现或机器人部署？
    - 若干高排名论文未给出局限性或对比细节，哪些验证缺口隐藏着未检验假设、缺失基线或不可复现证据？
