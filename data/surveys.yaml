    policy correlation, zero-shot physical benchmarks, and spatial reasoning benchmarks.'
  - 'Trend evolution: The top-ranked evidence is concentrated in 2024–2026, moving
    from adapting existing video diffusion models to larger physics-aligned world
    models and from visual-quality metrics toward functional, causal-persistence,
    and zero-shot embodied evaluation; older packet years do not appear among the
    top-ranked papers.'
  - 'Open questions: Do learned video dynamics satisfy formal state/dynamics assumptions?
    Are scaling claims or test-time verifier rewards predictive beyond selected benchmarks?
    Can evaluation separate visual realism, physical plausibility, action alignment,
    and causal reasoning? Missing code, datasets, metrics, and limitations remain
    verification gaps.'
  related_work_outline_zh:
  - 主流方向：以机器人操作和具身控制为中心的动作条件化视频世界模型，采用扩散Transformer或掩码自回归生成未来帧，并支持策略、动力学、规划或评测。
  - 研究共性：多数工作把动作与观测耦合到生成目标中，评测混合视觉质量与下游任务相关性，并越来越多引入物理/任务对齐或测试时验证。
  - 关键差异：架构上包括统一扩散时间步、帧级动作条件、在固定视频扩散模型上训练适配器、掩码自回归；监督信号上包括动作标签预训练、奖励/偏好对齐和验证器锚定断言；评测目标从视频质量到规划IoU、策略相关性、零样本物理基准和空间推理基准均有不同。
  - 趋势演进：高排名证据集中在2024–2026年，从适配已有视频扩散模型转向更大规模物理对齐世界模型，并从视觉质量指标转向功能、因果持久性和零样本具身评测；包内更早年份未进入高排名论文。
  - 开放问题：学习到的视频动力学是否满足形式化状态/动力学假设；缩放或验证器奖励能否跨基准预测；评测能否分离视觉真实、物理合理、动作对齐和因果推理；代码、数据、指标和局限缺失仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics and embodied pretraining
      what_it_solves: Learning future observation generation under action inputs to
        support policy learning, forward or inverse dynamics, planning, and synthetic
        rollout evaluation.
      what_remains_open: Whether these learned dynamics satisfy formal state/dynamics
        assumptions, maintain physical consistency outside training domains, or transfer
        across embodiments and tasks remains directly unverified.
    - line: Reward alignment and test-time verification for world-model outputs
      what_it_solves: Improving physical realism, task logic, or reasoning quality
        of generated rollouts through preference/reward modeling or verifiable test-time
        assertions.
      what_remains_open: Verifier calibration and reward reliability are inconsistent
        across benchmarks; human-preference cost and domain-specificity remain unresolved.
    - line: Scaling and multi-embodiment generalization claims
      what_it_solves: Connecting larger models, heterogeneous robot pretraining, or
        post-training alignment to higher fidelity, faster generation, and more general
        policies.
      what_remains_open: No formal scaling law or failure/transfer prediction is validated;
        current evidence consists of point results on selected benchmarks.
    - line: Conceptual taxonomy and functional evaluation of video models as world
        models
      what_it_solves: Organizing implicit or explicit state construction and dynamics
        modeling, and separating visual quality from functional world-model capabilities.
      what_remains_open: Whether the taxonomy changes design or evaluation practice
        is not demonstrated; functional benchmarks for persistence and causality remain
        proposed rather than validated.
    consensus:
    - Action-conditioned video generation is treated as a practical proxy for world-model
      dynamics in embodied settings, but the field has not settled on a formal state/dynamics
      criterion for calling these models world models.
    - Visual quality alone is insufficient to support world-model claims; downstream
      planning, policy, or physical-plausibility evidence is increasingly required.
    - Pretrained video models and heterogeneous robot data are common starting points,
      but controllable embodied prediction still requires domain-specific action supervision
      or alignment.
    - Evaluation protocols are fragmented across visual fidelity, planning success,
      policy correlation, spatial reasoning, and zero-shot physical benchmarks.
    disagreements:
    - Whether action conditioning should be built into a unified generative architecture,
      injected at frame level, or learned as an adapter over a fixed pretrained video
      model.
    - Whether reward or preference alignment and test-time verifier assertions provide
      reliable improvements; evidence is mixed across spatial reasoning and manipulation
      benchmarks.
    - Whether scale, heterogeneous pretraining, or post-training alignment is the
      primary driver of generalization; these mechanisms are entangled and not separately
      validated.
    - Whether benchmarks should target visual realism, physical plausibility, action-frame
      alignment, or causal and persistent state reasoning; current protocols do not
      consistently separate these dimensions.
    open_questions:
    - What formal assumptions must an action-conditioned video model satisfy before
      it can be considered a world model, and how should those assumptions be tested
      under interventions?
    - Does test-time verification or reward modeling remain calibrated and useful
      across different embodiments, tasks, or benchmark distributions?
    - Which evaluation signals predict downstream policy or planning success, and
      can physical persistence and causality be measured without visual-quality confounds?
    - What limitations or negative results are hidden by unreleased code, datasets,
      baselines, and metrics in the current high-ranking evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件化视频动力学与具身预训练
      解决的问题: 在动作输入下生成未来观测，以支持策略学习、前向或逆动力学、规划以及合成轨迹评估。
      尚未覆盖: 学习到的动力学是否满足形式化状态/动力学假设，能否在训练域外保持物理一致性并跨本体或任务迁移，仍缺少直接验证。
    - 路线: 世界模型输出的奖励对齐与测试时验证
      解决的问题: 通过偏好或奖励建模、可验证的测试时断言，改进生成轨迹的物理真实、任务逻辑或推理质量。
      尚未覆盖: 验证器校准和奖励可靠性在不同基准上表现不一致；人类偏好成本与领域特定性仍未被解决。
    - 路线: 世界模型的缩放与多本体泛化声明
      解决的问题: 把更大模型、异构机器人预训练或后训练对齐与更高保真度、更快生成、更通用策略联系起来。
      尚未覆盖: 尚未验证正式的缩放规律或失败/迁移预测；当前证据主要来自选定基准上的点结果。
    - 路线: 视频生成作为世界模型的概念分类与功能评测
      解决的问题: 组织隐式或显式状态构建与动力学建模，区分视觉质量与功能性的世界模型能力。
      尚未覆盖: 分类是否真正改变设计和评测实践尚未被证明；针对持久性与因果性的功能基准仍停留在倡议阶段。
    共识:
    - 动作条件化视频生成被视作具身场景下世界模型动力学的实用代理，但领域尚未就形式化状态/动力学标准达成一致。
    - 视觉质量不足以支撑世界模型主张，下游规划、策略或物理合理性证据越来越必要。
    - 预训练视频模型和异构机器人数据是常见起点，但可控具身预测仍需要领域特定的动作监督或对齐。
    - 评测协议在视觉保真、规划成功率、策略相关性、空间推理和零样本物理基准之间仍呈碎片化。
    分歧:
    - 动作条件应内置到统一生成架构、在帧级注入，还是作为固定预训练视频模型上的适配器学习，存在路线差异。
    - 奖励或偏好对齐与测试时验证器能否提供可靠收益存在分歧；在空间推理和操作基准上证据混合。
    - 尺度、异构预训练和后训练对齐哪一个是泛化的主要驱动力，尚未被分离验证。
    - 基准应针对视觉真实、物理合理性、动作-帧对齐还是因果/持久状态推理，现有协议未能一致地分离这些维度。
    开放问题:
    - 动作条件化视频模型需要满足哪些形式化假设才可称为世界模型，如何通过干预进行检验？
    - 测试时验证或奖励建模在不同本体、任务或基准分布上能否保持校准和有效？
    - 哪些评测信号能预测下游策略或规划成功，如何在不被视觉质量混淆的情况下测量物理持久性与因果性？
    - 当前高排名证据中未发布代码、数据集、基线和指标所掩盖的局限或负结果是什么？
