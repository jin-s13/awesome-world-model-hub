  related_work_outline:
  - 'Mainstream direction: Recent work is turning generative video and world models
    into runnable, action-controllable simulators for closed-loop autonomous driving,
    robotics, and game-like interaction.'
  - 'Shared research pattern: Systems couple large-scale video/action data with controllable
    generation, then evaluate visual fidelity together with control-following, spatial
    consistency, or physical plausibility.'
  - 'Key differences: Papers differ in representation, from recurrent state-space
    world models to frame-autoregressive diffusion; they also differ in evaluation
    target, interaction mode, and deployment constraints such as single-GPU latency.'
  - 'Trend evolution: Across the 2024-2026 evidence, the frontier is moving from open-loop
    video generation toward interactive, closed-loop, physics-aware world-model systems,
    with increased emphasis on action fidelity and long-horizon consistency.'
  - 'Open questions: Generalization beyond specific benchmarks, the real-world speed-fidelity-controllability
    tradeoff, long-horizon drift, and independent reproducibility remain under-verified.'
  related_work_outline_zh:
  - 主流方向：将生成式视频与世界模型转化为可运行、动作可控的模拟器，用于闭环自动驾驶、机器人及游戏式交互。
  - 研究共性：系统将大规模视频/动作数据与可控生成结合，并在视觉保真度之外评估控制跟随、空间一致性或物理合理性。
  - 关键差异：方法在表示上分为循环状态空间世界模型与帧级自回归扩散；评测目标、交互模式及单GPU延迟等部署约束也不同。
  - 趋势演进：从可用证据看，2024-2026的前沿正从开放式视频生成走向交互式、闭环、物理感知的世界模型系统，更强调动作保真与长时一致性。
  - 开放问题：跨基准泛化、实际速度-保真度-可控性权衡、长时推演漂移及独立可复现性仍未得到充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop simulation and deployment stacks
      what_it_solves: Turns generative world models into end-to-end simulation workflows
        for driving or robotics, including conditional generation, rollout, and evaluation.
      what_remains_open: Evidence is often limited to one dataset or benchmark such
        as nuScenes or selected CARL tasks; external deployment, sensor variation,
        and long-horizon rollout reliability remain under-verified.
    - line: Action-controllable real-time video serving
      what_it_solves: Provides low-latency, action- or trajectory-conditioned video
        generation for interactive and closed-loop use.
      what_remains_open: Trade-offs among inference speed, visual fidelity, controllability,
        and model complexity are not fully mapped, and single-GPU serving claims lack
        independent cross-infrastructure reproduction.
    - line: Benchmarks and engineering artifacts for simulation quality
      what_it_solves: Makes simulation capability inspectable and reusable by introducing
        datasets, metrics, evaluation frameworks, or open-source artifacts for spatial,
        action, or physical consistency.
      what_remains_open: Metric coverage across environments is incomplete; missing
        limitation or citation metadata and the absence of independent cross-team
        replication leave verification gaps.
    consensus:
    - Recent systems converge on using controllable video or world models as simulators
      by conditioning generation on actions, trajectories, or context.
    - Evaluation increasingly combines visual fidelity metrics with control-following,
      spatial consistency, or physical plausibility rather than relying on image quality
      alone.
    - Open datasets, benchmarks, or code are treated as central to making simulation
      systems inspectable and reusable.
    - Long-horizon consistency, domain transfer, and interactive responsiveness are
      recognized as central system challenges.
    disagreements:
    - Representations differ between recurrent state-space world models for policy
      learning and frame-autoregressive diffusion models for high-fidelity video simulation.
    - 'Evaluation targets vary: spatial consistency in navigation, action fidelity
      in autonomous driving, physical plausibility in robotic video, and zero-shot
      policy generalization in context-conditioned reinforcement learning.'
    - Some systems prioritize sub-second single-GPU interactive serving, while others
      emphasize model-based reinforcement learning sample efficiency or benchmark
      coverage over latency.
    - Assumptions differ about observable context or available action/trajectory supervision,
      which changes model design and what can be tested.
    open_questions:
    - How well do these systems maintain spatial, action, and physical consistency
      beyond specific benchmarks such as nuScenes, CARL, and Minecraft?
    - What is the empirical speed-fidelity-controllability frontier when interactive
      world models are deployed outside their original infrastructure?
    - Can action-conditioned modules attached to pre-trained video generative models
      transfer to specialized domains without inheriting biases or losing fine-grained
      visual detail?
    - Which evaluation protocols best capture closed-loop system reliability, including
      drift over very long rollouts and out-of-distribution conditions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环模拟与部署栈
      解决的问题: 将生成式世界模型转化为面向驾驶或机器人的端到端模拟工作流，覆盖条件生成、推演和评估。
      尚未覆盖: 证据常局限于nuScenes或少数CARL任务等单一基准；外部部署、传感器变化和长时程推演可靠性仍未充分验证。
    - 路线: 动作可控的实时视频服务
      解决的问题: 提供低延迟、动作或轨迹条件控制的视频生成，以支持交互式与闭环使用。
      尚未覆盖: 推理速度、视觉保真度、可控性与模型复杂度之间的权衡尚未完全探明；单GPU服务能力缺乏跨基础设施独立复现。
    - 路线: 面向模拟质量的基准与工程工件
      解决的问题: 通过数据集、指标、评估框架或开源工件，使模拟能力在空间、动作或物理一致性上可检查、可复用。
      尚未覆盖: 跨环境指标覆盖不完整；缺少年份或引用元数据及独立跨团队复现，仍属于验证缺口。
    共识:
    - 近期系统普遍将可控视频或世界模型作为模拟器，通过动作、轨迹或上下文条件控制生成。
    - 评估越来越将视觉保真度与控制跟随、空间一致性或物理合理性结合，而不再仅依赖图像质量。
    - 开放数据集、基准或代码被视为使模拟系统可检查、可复用的核心手段。
    - 长时程一致性、跨域迁移和交互响应速度被普遍视为系统层关键挑战。
    分歧:
    - 表示方式不同：一类使用循环状态空间世界模型做策略学习，另一类使用帧级自回归扩散模型做高保真视频模拟。
    - 评测目标不同：分别关注导航空间一致性、自动驾驶动作保真度、机器人视频物理合理性，以及上下文强化学习中的零样本策略泛化。
    - 系统偏重不同：有的优先单GPU亚秒级交互服务，有的优先基于模型的强化学习样本效率或基准覆盖度。
    - 关于上下文可观测性及动作/轨迹监督可获得性的假设不同，导致模型设计和可验证范围存在差异。
    开放问题:
    - 这些系统在nuScenes、CARL和Minecraft等特定基准之外，能否保持空间、动作和物理一致性？
    - 当交互式世界模型离开原始基础设施部署后，速度-保真度-可控性的实证边界在哪里？
    - 附加到预训练视频生成模型上的动作条件模块能否在专业领域中迁移，而不继承偏置或损失细粒度视觉细节？
    - 哪些评估协议能更好地衡量闭环系统可靠性，包括长时程推演漂移和分布外条件？
