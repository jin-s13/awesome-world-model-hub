  related_work_outline:
  - 'Mainstream direction: Generative world modeling is dominated by transformer/diffusion
    architectures trained on video and action sequences, with strong recent emphasis
    on embodied settings such as driving and robot manipulation.'
  - 'Shared research pattern: Methods attach structured auxiliary objectives—mask
    reconstruction, depth prediction, keypoint dynamics, context conditioning, or
    coupled action diffusion—to a base visual generator to improve coherence and downstream
    control.'
  - 'Key differences: Papers differ in supervision signal, interaction interface (action-free
    generation, action-conditioned rollout, unified action-video diffusion), and evaluation
    target (Atari, driving, robot, Minecraft/open-domain consistency).'
  - 'Trend evolution: Available top-paper years run 2023–2026; within this frontier,
    work shifts from efficient stochastic RL world models toward diffusion/transformer
    embodied world models and newer memory/action-consistency benchmarks.'
  - 'Open questions: It remains unclear which auxiliary loss or architecture choice
    transfers beyond observed task families, how robust gains are under unseen contexts
    or primitives, and whether real-robot or long-horizon consistency holds; blank
    limitation fields leave boundary evidence incomplete.'
  related_work_outline_zh:
  - 主流方向：生成式世界建模以Transformer/Diffusion架构为主，训练对象是视频与动作序列，近期重点聚焦驾驶和机器人操作等具身场景。
  - 研究共性：在基础视觉生成器上加入结构化辅助目标，如掩码重建、深度预测、关键点动力学、上下文条件化或动作-视频耦合扩散，以提升一致性和下游控制。
  - 关键差异：监督信号、交互接口（无动作生成、动作条件展开、统一动作-视频扩散）和评测目标（Atari、驾驶、机器人、Minecraft/开放域一致性）存在差异。
  - 趋势演进：可用高分论文年份集中在2023至2026年；在此前沿内，工作从高效随机RL世界模型转向扩散/Transformer具身世界模型，并出现记忆与动作一致性基准。
  - 开放问题：尚不明确哪些辅助损失或架构选择可跨任务族迁移；在未见上下文或原语、真实机器人及长时域一致性下是否成立仍不清楚；多个局限性字段为空，构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete generative architectures,
        stochastic sequence models, auxiliary losses, and training recipes for visual
        dynamics prediction.
      what_remains_open: Which representation or auxiliary objective transfers beyond
        the reported task family remains unclear; several top papers do not state
        limitations, so boundary conditions are not established.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention through context-conditioned
        latent rollouts, language-primitive conditioned video plans, or unified video-action
        diffusion.
      what_remains_open: Evidence does not fully isolate model contribution from the
        action prior, context assumption, planner, or downstream policy-training procedure.
    - line: Method evidence and ablation protocol
      what_it_solves: Builds datasets and metrics for spatial consistency, memory
        consistency, and action control to evaluate world-model capability beyond
        single-step visual quality.
      what_remains_open: Current benchmark evidence often reports dataset construction
        or visual comparisons rather than controlled ablations across architectures
        and task distributions.
    consensus:
    - Recent world-model methods rely on generative transformer or diffusion backbones
      rather than purely deterministic recurrent predictors for visual dynamics.
    - Structured auxiliary objectives are commonly used to inject temporal, spatial,
      geometric, or physical constraints beyond plain video reconstruction.
    - Evaluation increasingly includes downstream policy learning, action-conditioned
      rollout, or closed-loop consistency metrics, not only pixel-level generation
      quality.
    - Context and action interfaces are treated as central design choices for generalization
      and decision-making.
    disagreements:
    - 'Supervision differs: masked feature reconstruction, context-conditioned latent
      dynamics, physics-informed depth/keypoint tasks, language-primitive factorization,
      and coupled action-video diffusion are used as alternative training signals.'
    - 'Interaction mode differs: some models generate action-free or action-conditioned
      video, while others jointly diffuse actions and videos or train policies inside
      learned rollouts.'
    - Evaluation targets differ across Atari, driving videos, robot manipulation videos,
      Minecraft loop navigation, and open-domain memory/action benchmarks.
    - 'Deployment assumptions differ: some methods require observable context values
      or a predefined primitive vocabulary, while others assume large video or robot
      datasets.'
    open_questions:
    - Which auxiliary objective or representation choice is necessary for long-horizon
      temporal and spatial consistency across unseen environments?
    - Can learned policies and video plans transfer when context variables are not
      observable or when instructions require primitives outside the training set?
    - How much of the reported downstream gain comes from the learned world model
      rather than the planner, action prior, or dataset scale?
    - Does superior visual fidelity or consistency in simulation and benchmarks translate
      to real-world robot or driving control?
    - Several top-paper limitation fields and external citation signals are missing;
      what unreported constraints or failure modes remain unverified?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思想落实为具体生成架构、随机序列模型、辅助损失和训练配方，用于视觉动力学预测。
      尚未覆盖: 哪些表示或辅助目标能迁移到已报告任务族之外仍不明确；多篇论文未说明局限性，边界条件尚未确立。
    - 路线: 规划与动作接口方法
      解决的问题: 通过上下文条件潜在展开、语言原语条件视频计划或统一视频-动作扩散，将学习到的动力学连接到干预和决策。
      尚未覆盖: 证据尚未充分隔离模型贡献与动作先验、上下文假设、规划器或下游策略训练过程。
    - 路线: 方法证据与消融协议
      解决的问题: 构建空间一致性、记忆一致性和动作控制的数据集与指标，以评估超越单步视觉质量的世界模型能力。
      尚未覆盖: 当前基准证据多报告数据集构建或视觉对比，缺乏跨架构和任务分布的受控消融。
    共识:
    - 近年世界模型方法倾向于采用生成式Transformer或Diffusion骨干，而非纯确定性循环预测器处理视觉动力学。
    - 常见做法是在普通视频重建之外加入结构化辅助目标，以注入时间、空间、几何或物理约束。
    - 评测越来越多地纳入下游策略学习、动作条件展开或闭环一致性指标，而不仅是像素级生成质量。
    - 上下文与动作接口被视为泛化和决策中的核心设计选择。
    分歧:
    - 监督信号不同：掩码特征重建、上下文条件潜在动力学、物理深度/关键点任务、语言原语分解和动作-视频耦合扩散被用作不同训练信号。
    - 交互模式不同：有的模型生成无动作或动作条件视频，有的联合扩散动作与视频，或在学习到的展开中训练策略。
    - 评测目标不同：覆盖Atari、驾驶视频、机器人操作视频、Minecraft循环导航和开放域记忆/动作基准。
    - 部署假设不同：某些方法要求上下文可观测或预定义原语词汇，另一些则依赖大规模视频或机器人数据集。
    开放问题:
    - 哪种辅助目标或表示选择对跨未见环境的长时域时间和空间一致性是必要的？
    - 当上下文变量不可观测或指令需要训练集之外的原语时，学习到的策略和视频计划能否迁移？
    - 报告的下游收益有多少来自学习到的世界模型，而非规划器、动作先验或数据规模？
    - 在仿真和基准上的视觉保真度或一致性优势能否迁移到真实机器人或驾驶控制？
    - 多篇论文的局限性字段和外部引用信号缺失，尚有哪些未报告约束或失败模式未被验证？
