  related_work_outline:
  - 'Mainstream direction: Building generative world models for embodied tasks (robotics,
    driving) and interactive environments, with a shift from pure visual prediction
    to models that incorporate physics, actions, and compositional structure.'
  - 'Shared research pattern: Papers adopt diffusion models, Transformers, or recurrent
    state-space models to generate future frames or states, often conditioned on actions,
    language, or context, and evaluate via task-specific benchmarks or novel evaluation
    protocols.'
  - 'Key differences: Some works focus on compositional generalization via language
    parsing (RoboDreamer), while others inject physics priors (RoboScape), unify video
    and action diffusion (UWM), or target memory consistency and spatial awareness
    in interactive benchmarks (LoopNav, MIND).'
  - 'Trend evolution: Early work (2023) centered on efficient world models for Atari;
    later work (2024–2025) expanded to robotics and driving with richer modalities;
    most recently (2025–2026), dedicated benchmarks for memory and action control
    emerged, signaling a maturation of the field.'
  - 'Open questions: How to ensure real-world safety and physical plausibility beyond
    simulation; how to evaluate long-term memory and cross-action generalization;
    how to transfer improvements across embodiments, datasets, and institutions.'
  related_work_outline_zh:
  - 主流方向：面向具身任务（机器人、驾驶）和交互环境的生成式世界模型，从纯视觉预测转向融合物理、动作和组合结构的模型。
  - 研究共性：采用扩散模型、Transformer 或循环状态空间模型生成未来帧或状态，通常以动作、语言或上下文为条件，并通过任务特定基准或新的评估协议进行评测。
  - 关键差异：有的致力于通过语言解析实现组合泛化（RoboDreamer），有的注入物理先验（RoboScape），有的统一视频和动作扩散（UWM），有的在交互式基准中关注记忆一致性和空间意识（LoopNav、MIND）。
  - 趋势演进：早期工作（2023）集中于 Atari 的高效世界模型；随后（2024–2025）扩展到机器人学和驾驶，模态更丰富；最近（2025–2026）出现了针对记忆和动作控制的专用基准，表明领域走向成熟。
  - 开放问题：如何确保仿真之外的真实世界安全性和物理合理性；如何评估长期记忆和跨动作泛化；如何将改进迁移到不同本体、数据集和机构。
  literature_review:
    line_of_work_matrix:
    - line: Physics-informed and compositional embodied world models
      what_it_solves: Generating realistic robot interaction videos and learning policies
        by incorporating physical knowledge (depth, keypoints), compositional language
        instructions, or unified video-action diffusion.
      what_remains_open: Real-world transfer beyond simulation; generalization to
        entirely novel primitives or contexts; reliance on observable context variables
        or accurate language parsing; limited task diversity in evaluation.
    - line: Generalizable driving scene prediction
      what_it_solves: Long-horizon and multi-view video prediction for autonomous
        driving using diffusion transformers with mask reconstruction, achieving zero-shot
        transfer across datasets.
      what_remains_open: Alignment between simulation-based video quality and real-world
        driving safety metrics; robustness to diverse weather, traffic, and sensor
        configurations.
    - line: Efficient interactive world models and evaluation benchmarks
      what_it_solves: Training efficient world models (e.g., STORM) for games and
        providing standardized benchmarks (LoopNav, MIND) to measure spatial consistency,
        memory, and action control in interactive environments.
      what_remains_open: Long-term memory consistency across viewpoints; generalization
        across disparate action spaces; limited experimental results on benchmark-only
        papers; no unified metric for world model faithfulness.
    consensus:
    - World models are predominantly built using generative architectures (diffusion,
      Transformers, VAEs) and trained to predict future observations or states.
    - Application-specific conditioning (actions, language, context) is crucial for
      grounding world models in concrete tasks.
    - There is a growing recognition that standard visual fidelity metrics are insufficient;
      new benchmarks target spatial consistency, memory, and action controllability.
    disagreements:
    - 'Integration of physics: RoboScape explicitly injects physics via temporal depth
      and keypoint dynamics, while others rely on data-driven patterns without explicit
      physical constraints.'
    - 'Compositionality: RoboDreamer achieves generalization through language-driven
      decomposition into primitives, whereas UWM unifies video and action without
      such factorization, and cRSSM conditions on explicit context variables.'
    - 'Evaluation targets: some evaluate on established task benchmarks (Atari, NuScenes),
      while others propose new evaluation-only datasets (LoopNav, MIND) that prioritize
      memory and action consistency over task success.'
    - 'Use of actions: STORM and UWM incorporate actions in the world model for policy
      learning, whereas LoopNav and MIND focus on action-conditioned video generation
      for benchmarking without policy optimization.'
    open_questions:
    - Can world models trained in simulation provide reliable predictions for safety-critical
      real-world deployments, and what validation protocols are needed?
    - How can we measure and improve the long-term memory of world models, especially
      when viewpoints change or objects are occluded?
    - What is the best way to enable compositional generalization to truly novel combinations
      of objects, actions, and environments without retraining?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 物理信息与组合式具身世界模型
      解决的问题: 通过融入物理知识（深度、关键点）、组合式语言指令或统一视频-动作扩散，生成逼真的机器人交互视频并学习策略。
      尚未覆盖: 仿真向真实世界的迁移；对全新原语或上下文的泛化；依赖可观测上下文变量或准确语言解析；评测任务多样性有限。
    - 路线: 泛化驾驶场景预测
      解决的问题: 利用扩散Transformer与掩码重建实现自动驾驶的长时域和多视角视频预测，并具备跨数据集零样本迁移能力。
      尚未覆盖: 仿真视频质量与真实驾驶安全指标之间的对齐；对不同天气、交通和传感器配置的鲁棒性。
    - 路线: 高效交互式世界模型与评估基准
      解决的问题: 训练游戏等场景的高效世界模型（如STORM），并提供标准化基准（LoopNav、MIND）以衡量交互环境中的空间一致性、记忆和动作控制。
      尚未覆盖: 跨视角的长期记忆一致性；不同动作空间之间的泛化；纯基准论文缺少实验结果；缺乏统一的世界模型忠实度度量。
    共识:
    - 世界模型主要采用生成式架构（扩散、Transformer、VAE），并训练以预测未来观测或状态。
    - 针对具体应用的条件化（动作、语言、上下文）对于将世界模型落地到具体任务至关重要。
    - 人们越来越认识到单纯的视觉保真度指标不够，新的基准开始关注空间一致性、记忆和动作可控性。
    分歧:
    - 物理集成方式：RoboScape显式注入时间深度和关键点动力学，其他方法则依赖数据驱动模式，无显式物理约束。
    - 组合性：RoboDreamer通过语言驱动分解为原语实现泛化，UWM统一视频与动作但未做此类分解，cRSSM条件化于显式上下文变量。
    - 评测目标：部分工作在已有的任务基准（Atari、NuScenes）上评测，另一些则提出纯评测数据集（LoopNav、MIND），侧重记忆和动作一致性而非任务成功率。
    - 动作使用：STORM和UWM将动作纳入世界模型用于策略学习，而LoopNav和MIND关注以动作为条件的视频生成用于基准测试，不涉及策略优化。
    开放问题:
    - 在仿真中训练的世界模型能否为安全关键的真实部署提供可靠预测，需要何种验证协议？
    - 如何衡量和改善世界模型的长期记忆，尤其是当视角变化或物体被遮挡时？
    - 如何实现对新物体、动作和环境的真正组合泛化而无需重新训练？
