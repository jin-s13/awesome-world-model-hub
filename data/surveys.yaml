  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on generative and latent world
    models for visual control: diffusion transformers with reconstruction objectives,
    stochastic sequence models for reinforcement learning, and unified video-action
    pretraining for robotics.'
  - 'Shared research pattern: Most methods learn dynamics through self-supervised
    prediction or denoising over observations, actions, or context, then evaluate
    through video fidelity, downstream policy execution, or closed-loop consistency
    protocols.'
  - 'Key differences: Representations range from compact latent recurrent state-space
    models to high-resolution diffusion video generators; objectives range from MAE-style
    masked reconstruction and variational losses to physics-informed auxiliary tasks
    and joint video-action diffusion.'
  - 'Trend evolution: Available years show model-based reinforcement learning world
    models around 2023, contextual and compositional embodied models in 2024, and
    2025-2026 diffusion-action unification plus memory and action-control evaluation;
    the trend is within the current frontier.'
  - 'Open questions: Long-horizon physical and spatial consistency, generalization
    beyond observed contexts, primitive combinations, or action spaces, isolation
    of model contribution from planners and task priors, and missing limitation or
    reproducibility evidence remain open.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于视觉控制中的生成式与潜变量世界模型，包括扩散Transformer重建目标、强化学习随机序列模型，以及机器人视频-动作统一预训练。
  - 研究共性：多数方法通过自监督预测或去噪学习观测、动作或上下文的动力学，并通过视频保真度、下游策略执行或闭环一致性协议评估。
  - 关键差异：表示从紧凑潜变量循环状态空间到高分辨率扩散视频生成不等；目标涵盖MAE式掩码重建、变分损失、物理信息辅助任务与联合视频-动作扩散。
  - 趋势演进：已有年份显示2023年前后基于模型的强化学习世界模型，2024年上下文与组合式具身模型，2025-2026年扩散-动作统一与记忆/动作控制评测；趋势集中于当前前沿。
  - 开放问题：长时域物理与空间一致性、对未见上下文/原语组合/动作空间的泛化、模型贡献与规划器及任务先验的隔离，以及缺失的局限性与可复现证据仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based generative video world models with auxiliary reconstruction
        or physics objectives
      what_it_solves: High-dimensional visual prediction and action-conditioned video
        synthesis for driving, robot imagination, and embodied policy learning.
      what_remains_open: Long-horizon physical consistency, generalization to unseen
        primitive combinations or scene distributions, and attribution of gains to
        auxiliary objectives remain underevidenced.
    - line: Latent stochastic sequence world models for model-based reinforcement
        learning
      what_it_solves: Sample-efficient policy learning by training agents on imagined
        trajectories from compact latent dynamics.
      what_remains_open: Zero-shot transfer beyond limited context or task suites,
        context observability assumptions, and whether improvements come from representation,
        dynamics, or planner remain open.
    - line: Closed-loop world-model evaluation protocols for spatial, memory, and
        action-control consistency
      what_it_solves: Measuring spatial and memory consistency, action-conditioned
        control, and generalization across viewpoints and action spaces in open-domain
        environments.
      what_remains_open: One protocol reports no experimental results; there is still
        a gap in validating metrics across model classes and separating visual fidelity
        from control and memory consistency.
    consensus:
    - Self-supervised next-observation prediction or denoising is the dominant training
      signal for learning world dynamics.
    - Action or context conditioning is increasingly integrated directly into learned
      dynamics or generation, rather than added only at policy time.
    - Evaluation is expanding from reconstruction quality and task score toward closed-loop
      consistency, memory, and action-control probes.
    - Recent evidence and reported limitations indicate long-term consistency and
      generalization to unseen dynamics or action spaces are shared unresolved issues.
    disagreements:
    - 'Representation choices differ: compact latent state-space models versus pixel
      or latent diffusion video generators versus unified transformer sequence models.'
    - 'Training objectives differ: MAE-style masked reconstruction, variational autoencoding,
      physics-informed depth or keypoint auxiliary tasks, or joint video-action diffusion
      with independent timesteps.'
    - 'Interface assumptions differ: observable context values, language-to-primitive
      parsing, action-free video, or action diffusion timesteps affect transfer and
      deployment settings.'
    - 'Evaluation targets differ: sample-efficient control on narrow interaction budgets,
      long-horizon multi-view driving, robot task execution, or navigation-loop spatial
      and memory consistency.'
    open_questions:
    - Which representation and objective best preserve long-horizon physical and spatial
      consistency without task-specific auxiliary signals?
    - Can models generalize to entirely novel contexts, primitive combinations, or
      action spaces when context is not observable or language parsing is imperfect?
    - How should evaluation protocols separate visual generation fidelity from memory
      consistency, action controllability, and downstream policy utility?
    - What is the actual contribution of world-model learning versus planner, task
      prior, or dataset scale when limitation reports are sparse and baselines are
      narrow?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带辅助重建或物理目标的扩散生成式视频世界模型
      解决的问题: 面向驾驶、机器人想象和具身策略学习的高维视觉预测与动作条件视频合成。
      尚未覆盖: 长时域物理一致性、对未见原语组合或场景分布的泛化，以及增益是否来自辅助目标仍证据不足。
    - 路线: 用于基于模型强化学习的潜变量随机序列世界模型
      解决的问题: 通过紧凑潜在动力学生成想象轨迹，实现样本高效策略学习。
      尚未覆盖: 有限上下文或任务套件之外的零样本迁移、上下文可观测性假设，以及改进来自表示、动力学还是规划器仍未解决。
    - 路线: 面向空间、记忆与动作控制一致性的闭环世界模型评估协议
      解决的问题: 测量开放域环境中的空间与记忆一致性、动作条件控制，以及跨视角和动作空间的泛化。
      尚未覆盖: 一个协议未报告实验结果；仍缺乏跨模型类别的指标验证，难以将视觉保真度与控制、记忆一致性分离。
    共识:
    - 自监督下一观测预测或去噪是学习世界动力学的主要训练信号。
    - 动作或上下文条件越来越直接集成到动力学学习或生成过程，而非只在策略使用时加入。
    - 评估从重建质量和任务得分扩展到闭环一致性、记忆和动作控制探针。
    - 近期证据与报告的局限性表明，长期一致性以及对未见动力学或动作空间的泛化是共同的未解决问题。
    分歧:
    - 表示选择不同：紧凑潜在状态空间模型、像素或潜在扩散视频生成器与统一Transformer序列模型之间存在差异。
    - 训练目标不同：MAE式掩码重建、变分自编码、物理信息深度或关键点辅助任务、带独立时间步的联合视频-动作扩散并存。
    - 接口假设不同：可观测上下文、语言到原语解析、无动作视频或动作扩散时间步等不同假设影响迁移和部署场景。
    - 评测目标不同：样本高效控制、长时域多视角驾驶、机器人任务执行或导航循环空间与记忆一致性各有侧重。
    开放问题:
    - 哪种表示和目标最能保持长时域物理与空间一致性，而不依赖任务特定辅助信号？
    - 当上下文不可观测或语言解析不完美时，模型能否泛化到全新上下文、原语组合或动作空间？
    - 评估协议应如何分离视觉生成保真度与记忆一致性、动作可控性和下游策略效用？
    - 在局限性报告稀疏且基线较窄的情况下，世界模型学习的实际贡献相比规划器、任务先验或数据规模如何？
