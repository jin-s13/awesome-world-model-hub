  related_work_outline:
  - 'Mainstream direction: World models are being specialized for concrete embodied
    and simulation domains—autonomous driving, robotics, and interactive games—by
    coupling video generation with action, physics, or memory consistency.'
  - 'Shared research pattern: Learning a generative model of environment dynamics
    from multimodal data, then using it for policy learning, planning, or evaluation,
    often via diffusion or transformer architectures.'
  - 'Key differences: Supervision signals vary from video reconstruction to physics-informed
    losses; interaction modes differ among action-conditioned video, action-free pretraining,
    and compositional language-to-video; evaluation settings range from Atari benchmarks
    to real-world driving logs and Minecraft loops.'
  - 'Trend evolution: From 2023''s efficient game-oriented world models to 2024–2025''s
    compositional, physics-informed, and unified action-video diffusion models for
    robotics, and 2025–2026''s benchmarks measuring memory and spatial consistency.'
  - 'Open questions: Whether physical plausibility in generated videos translates
    to safe real-world policy performance; how to verify long-term memory and spatial
    consistency across diverse embodiments; and how to generalize without assuming
    observable context parameters.'
  related_work_outline_zh:
  - 主流方向：世界模型正被专门化到具身和仿真领域（自动驾驶、机器人、交互游戏），通过将视频生成与动作、物理或记忆一致性耦合。
  - 研究共性：从多模态数据中学习环境动力学生成模型，并用于策略学习、规划或评测，常采用扩散模型或Transformer架构。
  - 关键差异：监督信号不同（视频重建 vs. 物理对齐损失）；交互方式不同（动作条件视频、无动作预训练、组合式语言到视频）；评测场景不同（Atari基准、真实驾驶日志、Minecraft循环）。
  - 趋势演进：2023年高效游戏世界模型，2024–2025年组合式、物理信息、统一动作-视频扩散的机器人世界模型，2025–2026年衡量记忆和空间一致性的基准。
  - 开放问题：生成视频中的物理合理性是否转化为真实世界的安全策略性能；如何验证跨本体的长期记忆和空间一致性；如何在无需假设可观测上下文参数的情况下泛化。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and embodied tasks by learning
        dynamics from high-dimensional sensory inputs and actions to generate imagined
        trajectories for policy learning.
      what_remains_open: Generalization across different robots, environments, and
        tasks without assuming access to ground-truth context parameters; physical
        plausibility of generated videos in real-world deployment.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view video prediction, long-horizon
        scene generation, and closed-loop simulation to evaluate driving policies.
      what_remains_open: Whether improvement in simulation metrics like FID or FVD
        aligns with safer real-world driving; zero-shot transfer to unseen driving
        environments and sensor setups.
    - line: Interactive agents and games
      what_it_solves: Building world models that maintain spatial and temporal consistency
        over long horizons in interactive, open-world environments to support planning
        and navigation.
      what_remains_open: Long-term memory consistency and generalization across action
        spaces and environment rules; evaluation metrics that capture semantic correctness
        beyond pixel-level fidelity.
    consensus:
    - World models are shifting from reconstruction-only objectives to generative
      frameworks that can support downstream decision-making and policy learning.
    - Diffusion models and transformer architectures are the dominant architectural
      choices for video-based world models across domains.
    - There is a growing recognition that pixel-level realism is insufficient; evaluation
      must include temporal coherence, physical plausibility, and task-oriented metrics.
    disagreements:
    - Some works condition video generation on discrete actions, while others treat
      action as a diffusion variable alongside video, or bypass action by using language
      to factorize generation.
    - Zero-shot generalization is pursued either by context-conditioned latent dynamics
      (cRSSM) or by compositional use of language primitives (RoboDreamer), reflecting
      different assumptions about the observability of task variables.
    - 'Evaluation targets differ: Atari human-normalized scores, driving video prediction
      metrics, and robot task success in simulation, making cross-domain comparison
      difficult.'
    open_questions:
    - How to design benchmarks that jointly measure video quality, action control,
      and long-term memory consistency across diverse embodiments?
    - Can physics-informed world models trained in simulation improve real-world policy
      robustness without overfitting to synthetic physics?
    - What are the minimal supervision signals needed to enable zero-shot transfer
      of world models to new environments or embodiments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等具身任务，从高维感官输入和动作中学习动力学，生成想象轨迹用于策略学习。
      尚未覆盖: 跨不同机器人、环境和任务的泛化，且不假设可获取真实上下文参数；生成视频在真实部署中的物理合理性。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角视频预测、长时域场景生成和闭环仿真，以评测驾驶策略。
      尚未覆盖: 仿真指标（如 FID、FVD）的提升是否与真实世界驾驶安全性一致；对未见驾驶环境和传感器配置的零样本迁移。
    - 路线: 交互式智能体与游戏
      解决的问题: 构建在交互式开放世界环境中长时间保持时空一致性的世界模型，以支持规划与导航。
      尚未覆盖: 长期记忆一致性和跨动作空间的泛化；超越像素级保真度的语义正确性评测指标。
    共识:
    - 世界模型正从纯重建目标转向能够支撑下游决策和策略学习的生成式框架。
    - 扩散模型和 Transformer 架构是各领域视频世界模型的主流选择。
    - 越来越认识到像素级逼真度不足，必须同时评估时序连贯性、物理合理性和面向任务的指标。
    分歧:
    - 部分工作将视频生成条件于离散动作，而另一些将动作与视频一同作为扩散变量，或通过语言分解生成来绕过动作条件。
    - 零样本泛化有的通过上下文条件潜在动力学实现（cRSSM），有的通过语言原语的组合使用实现（RoboDreamer），反映出对任务变量可观测性的不同假设。
    - 评测目标各异：Atari 人类标准化得分、驾驶视频预测指标、仿真中的机器人任务成功率，难以跨领域比较。
    开放问题:
    - 如何设计能同时衡量视频质量、动作控制和长期记忆一致性的跨具身基准？
    - 在仿真中训练的物理信息世界模型能否提升真实世界策略鲁棒性，而不至于过拟合合成物理？
    - 实现世界模型对新环境或新本体的零样本迁移，最少需要哪些监督信号？
