  related_work_outline:
  - 'Mainstream direction: The visible evidence is dominated by action-conditioned
    video world models for embodied control, not formal guarantees; the main theory-flavored
    contribution is a taxonomy separating state construction from dynamics modeling.
    Empirical work focuses on diffusion or autoregressive generation, test-time verification,
    and physics/reward alignment.'
  - 'Shared research pattern: Papers condition future video on actions and observations,
    then use generated rollouts as simulators for policy evaluation/planning or as
    reasoning substrates. Several add post-training or test-time selection to align
    rollouts with task success or physical plausibility.'
  - 'Key differences: Representation differs between diffusion transformers and masked
    autoregression over tokens; adaptation differs between training unified models
    and black-box adapters over pretrained video models; alignment signal differs
    among heuristic verifiers, learned preference reward, and DPO-style discriminators;
    evaluation target differs across visual fidelity, planning correlation, physics
    consistency, and reasoning accuracy.'
  - 'Trend evolution: Visible evidence is concentrated in 2024–2026, so the trend
    appears to be from generic video generation toward embodied action-conditioned
    world models and then toward physical realism/task-logic alignment. Older years
    are present only in the span, not in enough detail for a long-term trend.'
  - 'Open questions: How can functional evaluation connect visual generation quality
    to policy learning or real-world transfer; when do verifiers or learned rewards
    produce consistent test-time scaling rather than an information bottleneck; can
    explicit state/dynamics construction improve long-horizon persistence and causality;
    and do taxonomies change model design?'
  related_work_outline_zh:
  - 主流方向：可见证据主要由面向具身控制的动作条件视频世界模型主导，而非形式化保证；最具理论色彩的工作是将状态构建与动态建模分离的分类法。实证工作聚焦于扩散或自回归生成、测试时验证以及物理/奖励对齐。
  - 研究共性：论文普遍将未来视频条件化于动作与观测，并把生成轨迹用作策略评估/规划的模拟器或推理基础；部分工作进一步加入后训练或测试时选择，使轨迹更符合任务成功或物理合理性。
  - 关键差异：表示方式不同，包括扩散Transformer与掩码自回归令牌建模；适配方式不同，包括训练统一模型与黑盒适配预训练视频模型；对齐信号不同，包括启发式验证器、学习偏好奖励和DPO式判别器；评测目标不同，包括视觉保真、规划相关性、物理一致性与推理准确率。
  - 趋势演进：可见证据集中在2024–2026年，趋势似乎从通用视频生成走向具身动作条件世界模型，再走向物理真实性/任务逻辑对齐；较早年份仅出现在时间跨度中，缺乏足够证据支持长期趋势判断。
  - 开放问题：功能性评测如何将视觉生成质量与策略学习或真实迁移联系起来；验证器或学习奖励在什么条件下能产生一致测试时缩放而非信息瓶颈；显式状态/动态构建能否改善长时程持久性与因果性；分类法是否会改变模型设计。
  literature_review:
    line_of_work_matrix:
    - line: Joint action-video dynamics modeling for robot control
      what_it_solves: Couples future video generation with action sequences so one
        model can support policy, forward dynamics, inverse dynamics, and video prediction
        for robot pretraining and planning.
      what_remains_open: Evidence is concentrated in robot manipulation settings;
        long-horizon stability, domain transfer, and direct comparison among dynamics
        objectives remain underexplored.
    - line: Pretrained-video adaptation without parameter access
      what_it_solves: Turns black-box pretrained video diffusion models into action-conditioned
        dynamics models by training a lightweight mask adapter on small labeled datasets.
      what_remains_open: Assumes availability of action-labeled domain videos and
        a suitable pretrained video model; generalization beyond game and robotics
        domains is not shown.
    - line: Test-time verification and reward/alignment for world-model rollouts
      what_it_solves: Improves selected rollouts or post-trains models by grounding
        rewards in spatial micro-claims, human preference, or physical discriminators
        so generated trajectories better match task and physical constraints.
      what_remains_open: Verifier calibration and scaling are inconsistent across
        benchmarks; preference rewards may be subjective, and generalization beyond
        contact-rich manipulation is missing.
    - line: Conceptual taxonomy and state/dynamics boundaries
      what_it_solves: Formalizes video generation as world models by separating state
        construction from dynamics modeling and distinguishing visual fidelity from
        functional evaluation gaps.
      what_remains_open: The taxonomy is conceptual; no direct experimental evidence
        shows it changes model evaluation or design, and the connection to empirical
        model behavior remains open.
    - line: Scaling and efficiency of action-conditioned video generation
      what_it_solves: Explores model scale, autoregressive tokenization, and test-time
        scaling to improve generation speed, controllability, and planning or reasoning
        quality.
      what_remains_open: Scaling results are mostly empirical rather than predictive;
        no validated law connects scale, speed, or tokenization choices to policy
        robustness and failure transfer.
    consensus:
    - Most work treats action- and observation-conditioned future video generation
      as a learned dynamics proxy and uses generated rollouts for planning, policy
      evaluation, or synthetic data.
    - There is shared concern that visual fidelity alone is insufficient; physical
      plausibility, action-frame alignment, or task logic must be evaluated or aligned
      separately.
    - Recent work converges on adding post-training or test-time selection mechanisms
      to improve action-conditioned rollouts beyond next-frame generation.
    disagreements:
    - 'Representation differs: diffusion transformers versus masked autoregression
      over discrete or soft tokens.'
    - 'Alignment signal differs: heuristic spatial verifiers, learned human-preference
      reward models, and DPO-style physical discriminators encode different assumptions
      about what makes a rollout good.'
    - 'Evaluation target differs: planning correlation, visual fidelity, physical
      plausibility, or spatial reasoning accuracy, with no common functional benchmark.'
    - 'Model access differs: training unified models from large datasets versus adapting
      closed pretrained video generators through intermediate outputs.'
    open_questions:
    - How can world models be evaluated functionally so that improvements in visual
      generation predict improvements in policy learning or real-world transfer?
    - Under what conditions do test-time verifiers or learned rewards yield consistent
      scaling rather than an information bottleneck?
    - Can explicit state construction and dynamics disentanglement improve long-horizon
      persistence and causal reasoning in video world models?
    - Do formal taxonomies of state and dynamics alter model design, or mostly organize
      existing methods without changing evaluation?
