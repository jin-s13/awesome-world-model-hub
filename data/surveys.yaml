  related_work_outline:
  - 'Mainstream direction: Using video generative models as action-controllable world
    simulators to enable closed-loop training and evaluation for autonomous driving,
    robotics, and games.'
  - 'Shared research pattern: Incorporating action conditioning into video generation
    with structured losses or pluggable modules, addressing long-horizon consistency
    and controllability, and constructing benchmarks for quantitative evaluation.'
  - 'Key differences: Generator architecture (diffusion vs. autoregressive), integration
    of physics priors, reliance on pre-trained models, emphasis on real-time interactivity,
    and target domain (driving, embodied, general).'
  - 'Trend evolution: Shifting from latent world models (e.g., Dreamer) around 2021
    to large-scale video diffusion simulators in 2024–2025, and toward 2026 closed-loop
    frame-level autoregressive systems with focus on action fidelity, latency, and
    deployment efficiency.'
  - 'Open questions: How to guarantee spatiotemporal consistency and physical plausibility
    over very long rollouts; how to generalize simulators to unseen dynamics; optimal
    trade-offs between real-time interactivity and high fidelity; whether current
    benchmarks sufficiently capture real-world task performance.'
  related_work_outline_zh:
  - 主流方向：利用视频生成模型作为动作可控的世界模拟器，实现自动驾驶、机器人和游戏的闭环训练与评估。
  - 研究共性：将动作条件融入视频生成，通过结构化损失或可插拔模块解决长时域一致性和可控性，并构建基准进行量化评估。
  - 关键差异：生成器架构（扩散 vs 自回归）、物理先验的引入方式、对预训练模型的依赖程度、对实时交互性的侧重以及目标领域（驾驶、具身、通用）不同。
  - 趋势演进：从2021年前后基于Dreamer等潜在世界模型，到2024–2025年大规模视频扩散模拟器，再到2026年闭环帧级自回归系统，关注点从生成质量转向动作保真度、延迟和部署效率。
  - 开放问题：极长时域演绎如何保证时空一致性和物理合理性；模拟器如何泛化到未见动态；实时交互与高保真度的最优权衡；当前基准是否充分反映真实任务性能。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable video world simulators
      what_it_solves: Generating future frames conditioned on actions to serve as
        virtual environments for policy training and evaluation in driving, robotics,
        and games.
      what_remains_open: Degradation of temporal consistency and physical plausibility
        over very long rollouts; generalization to unseen dynamics and sensor configurations;
        balancing high visual fidelity with low-latency, real-time inference.
    - line: Benchmarks and evaluation frameworks for world models
      what_it_solves: Providing standardized datasets and metrics (e.g., spatial consistency,
        action fidelity) to quantitatively compare world model quality.
      what_remains_open: How well these benchmarks represent open-world diversity
        and long-tail events; correlation between benchmark metrics and downstream
        task performance; coverage of diverse interaction modalities.
    - line: Physics-informed embodied world models
      what_it_solves: Incorporating explicit or implicit physics knowledge (depth,
        keypoint dynamics) into video generation to improve 3D consistency and motion
        realism for robotic applications.
      what_remains_open: Computational cost of physics simulation modules; generalization
        to novel object interactions and materials; trade-off between physical accuracy
        and visual detail.
    consensus:
    - Video generation models can serve as effective world simulators but require
      explicit action-conditioning to be useful for downstream tasks.
    - Long-horizon consistency and closed-loop evaluation remain central technical
      challenges.
    - Standardized benchmarks are critical for measuring progress, as no single metric
      yet captures all desired properties.
    disagreements:
    - 'Architecture choice: diffusion-based generators versus autoregressive transformers,
      with different implications for controllability and inference speed.'
    - 'Physics integration: some works inject explicit physical priors (depth, keypoints),
      while others rely purely on data-driven learning from video.'
    - 'Generality versus specialization: some systems target specific domains (autonomous
      driving, robotics) with tailored designs, while others propose universal modules
      for any pre-trained video generator.'
    - 'Evaluation focus: some prioritize pixel-level fidelity (FID, FVD), others emphasize
      action-following accuracy or spatial consistency, making direct comparison difficult.'
    open_questions:
    - Can current benchmarks (e.g., LoopNav, ACT-Bench) capture the full complexity
      of real-world interactive dynamics and long-tail scenarios?
    - How do biases inherited from pre-trained video generators affect the safety
      and fairness of downstream policies trained inside these simulators?
    - What are the practical engineering barriers to independently reproducing these
      simulator systems across different teams and hardware environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的视频世界模拟器
      解决的问题: 基于动作生成未来帧，为驾驶、机器人、游戏中的策略训练和评估提供虚拟环境。
      尚未覆盖: 极长时域演绎中时序一致性和物理合理性的退化；对未见动态和传感器配置的泛化；高视觉保真度与低延迟实时推理的平衡。
    - 路线: 世界模型的基准与评估框架
      解决的问题: 提供标准化数据集和指标（如空间一致性、动作保真度），以定量比较世界模型质量。
      尚未覆盖: 基准能否代表开放世界多样性和长尾事件；指标与下游任务性能的相关性；对多样化交互模态的覆盖。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 将显式或隐式物理知识（深度、关键点动力学）融入视频生成，提升机器人应用中的3D一致性和运动真实性。
      尚未覆盖: 物理模拟模块的计算开销；对新颖物体交互和材质的泛化；物理准确性与视觉细节之间的权衡。
    共识:
    - 视频生成模型可作为有效的世界模拟器，但需要显式动作条件化才能用于下游任务。
    - 长时域一致性和闭环评估仍是核心挑战。
    - 标准化基准对衡量进展至关重要，因为尚无单一指标能捕获所有理想属性。
    分歧:
    - 架构选择：基于扩散的生成器与自回归变换器，对可控性和推理速度的影响不同。
    - 物理融合：部分工作注入显式物理先验（深度、关键点），其他则完全依赖视频数据驱动学习。
    - 通用与专用：部分系统针对特定领域（自动驾驶、机器人）设计，另一些则提出可插入任何预训练视频生成器的通用模块。
    - 评估重点：有的侧重像素级保真度（FID、FVD），有的强调动作跟随精度或空间一致性，造成直接比较困难。
    开放问题:
    - 当前基准（如LoopNav、ACT-Bench）能否捕获真实世界交互动态和长尾场景的全部复杂性？
    - 预训练视频生成器引入的偏见如何影响在模拟器中训练的下游策略的安全性和公平性？
    - 在不同团队和硬件环境下独立复现这些模拟器系统面临哪些实际工程障碍？
