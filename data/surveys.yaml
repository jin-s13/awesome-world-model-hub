    reconstruction or generation of future observations, then use the model for planning,
    policy learning, or evaluation.'
  - 'Key differences: They differ in supervision (action-conditioned video, physical
    depth/keypoints, or pure video), generalization target (compositional, zero-shot,
    or cross-dataset), and evaluation focus (visual fidelity, task success, or memory
    consistency).'
  - 'Trend evolution: Evidence from 2023–2026 shows a shift from efficient game world
    models toward robotics and driving, followed by dedicated benchmarks for spatial
    and memory consistency, signaling a move toward systematic evaluation.'
  - 'Open questions: Real-world deployment safety, long-term memory and spatial consistency,
