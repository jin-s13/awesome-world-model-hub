  - 主流方向：证据集中于构建可控世界模型模拟器，尤其面向自动驾驶和具身控制，以动作条件视频或状态生成为核心系统能力。
  - 研究共性：论文将可学习的动力学或生成主干与显式控制信号结合，并通过基准或损失测量时间、空间或动作保真度，而非仅看视觉质量。
  - 关键差异：系统在表示方式、控制接口、评测目标、交互模式和部署延迟上不同。
  - 趋势演进：高排名论文集中在2024–2026年，从上下文模型强化学习走向大规模驾驶/世界模拟器与闭环实时部署；较早年份未在高排名证据中出现。
  - 开放问题：长时程一致性、跨域与传感器泛化、速度-保真度权衡、上下文可观测假设及独立可复现性仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: World-model evaluation benchmarks and datasets
      what_it_solves: Quantifying spatial consistency or action fidelity through loop-navigation
        or trajectory-paired driving data.
      what_remains_open: Validation is limited to single environments and metrics;
        cross-simulator or real-world validity is not demonstrated.
    - line: Action-controllable generative simulation frameworks
      what_it_solves: Converting pretrained video generators or scene-dynamics models
        into controllable simulators for closed-loop driving and policy training.
      what_remains_open: Long-horizon consistency, generalization beyond the shown
        driving or game settings, and trade-offs among speed, visual detail, and real-time
        serving remain unresolved.
    - line: Contextual and physics-informed model-based learning systems
      what_it_solves: Improving zero-shot generalization and physical plausibility
        of imagined rollouts for policy learning.
      what_remains_open: Assumes observable context or physics signals; evaluation
        is narrow and independent cross-team reproduction is not shown.
    - line: Deployment-oriented engineering stacks and artifacts
      what_it_solves: Providing open-access benchmarks, code, datasets, or low-latency
        GPU runtimes.
      what_remains_open: Evidence for external deployment, hardware variation, and
        reproducible engineering is uneven and often missing from abstracts.
    consensus:
    - World-model quality must be evaluated beyond visual fidelity, using spatial
      consistency, action fidelity, or downstream policy utility.
    - Explicit control or context conditioning improves usefulness for simulation
      and closed-loop tasks compared with unconditional generation.
    - Benchmarks and datasets are introduced alongside methods to make action-following
      or environment consistency testable.
    - Real-time or low-latency operation matters for closed-loop driving and interactive
      model-based reinforcement learning.
    - Open artifacts exist, but independent verification is not uniformly reported.
    disagreements:
    - 'Representation choice differs: recurrent state-space models, diffusion-based
      video models, and frame/autoregressive models make different temporal and inference
      assumptions.'
    - 'Supervision signal differs: some systems learn physical structure through depth
      and keypoint losses, while others rely on action-conditioned generation or benchmark
      metrics.'
    - 'Evaluation target differs: spatial consistency, action fidelity, visual realism,
      planning performance, and downstream policy value are prioritized differently.'
    - 'Interaction and deployment setting differs: some work targets offline evaluation
      benchmarks, while others target closed-loop driving simulation or model-based
      reinforcement learning environments.'
    open_questions:
    - Can learned world simulators maintain spatial and action consistency over long
      closed-loop rollouts without compounding error?
    - Do systems generalize across sensors, road geometries, embodiments, or domains
      beyond the single benchmark environments shown?
    - What are the actual latency-fidelity-controllability trade-offs in external
      deployment, and how robust are they to hardware changes?
    - Are context or physics cues always observable or extractable enough for real-world
      use, and how do systems behave under partial observability?
    - Which artifacts enable independent cross-team reproduction, and which public
      metrics align with downstream system reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评测基准与数据集
      解决的问题: 通过循环导航或轨迹配对驾驶数据，量化空间一致性或动作保真度。
      尚未覆盖: 仅在单一环境或指标上验证，跨模拟器与真实场景的有效性仍缺少证据。
    - 路线: 动作可控生成式模拟框架
      解决的问题: 将预训练视频生成器或场景动力学模型转为可控模拟器，用于闭环驾驶和策略训练。
      尚未覆盖: 长时程一致性、对所展示驾驶或游戏设置之外的泛化，以及速度、视觉细节和实时性之间的权衡仍未解决。
    - 路线: 上下文与物理信息模型式学习系统
      解决的问题: 提升想象轨迹的零样本泛化和物理合理性，以支持策略学习。
      尚未覆盖: 假设上下文或物理信号可观测，评测范围较窄，且未展示跨团队独立复现。
    - 路线: 面向部署的工程栈与工件
      解决的问题: 提供开放获取的基准、代码、数据集或单GPU低延迟运行能力。
      尚未覆盖: 外部部署、硬件变化和可复现工程证据分布不均，部分摘要未提供限制或实验细节。
    共识:
    - 世界模型质量不应只看视觉保真度，还要通过空间一致性、动作保真度或下游策略效用评估。
    - 显式控制或上下文条件比无条件生成更能满足仿真与闭环任务需求。
    - 方法通常与基准或数据集一起提出，使动作遵循或环境一致性可测试。
    - 闭环驾驶与交互式模型强化学习需要低延迟或实时运行能力。
    - 开放工件存在，但独立可复现验证并不统一。
    分歧:
    - 表示选择不同：循环状态空间模型、扩散视频模型和帧/自回归模型在时间结构与推理假设上存在差异。
    - 监督信号不同：有的系统通过深度和关键点损失学习物理结构，有的系统依赖动作条件生成或基准指标。
    - 评测目标不同：空间一致性、动作保真度、视觉真实感、规划性能和下游策略价值被分别优先。
    - 交互与部署设置不同：有的面向离线评测基准，有的面向闭环驾驶模拟或基于模型的强化学习环境。
    开放问题:
    - 学习型世界模拟器能否在长时闭环推演中持续保持空间与动作一致性而不累积误差？
    - 系统能否泛化到不同的传感器、道路几何、本体或领域，超越所展示的单一基准环境？
    - 实际部署中的延迟-保真度-可控性权衡如何，硬件变化时是否仍然稳健？
    - 上下文或物理线索是否始终可观测或可提取，部分可观测条件下系统会如何表现？
    - 哪些工件支持跨团队独立复现，哪些公开指标与下游系统可靠性一致？
