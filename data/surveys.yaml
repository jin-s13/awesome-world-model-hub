  related_work_outline:
  - 'Mainstream direction: Generative world-model architectures dominate, including
    diffusion transformers, transformer-VAE models, and unified video-action models
    for driving, robotics, and RL, often using auxiliary objectives for consistency,
    physics, or context.'
  - 'Shared research pattern: Methods couple high-dimensional visual generation with
    an auxiliary signal such as mask reconstruction, physics prediction, context conditioning,
    language primitives, or action diffusion, then evaluate downstream control or
    video quality.'
  - 'Key differences: Representation and objective choices vary across stochastic
    latent dynamics, diffusion-based generation, physics-informed prediction, and
    language-compositional models; action/context interfaces and evaluation targets
    range from Atari and driving to robot simulation and Minecraft consistency/action-control
    benchmarks.'
  - 'Trend evolution: Within the current frontier from 2023 to 2026, work moves from
    RL-oriented world models toward large generative embodied world models, then toward
    explicit benchmarks for memory, spatial consistency, and action control. Earlier
    topic years are not represented in the top evidence.'
  - 'Open questions: Long-term memory and cross-action-space generalization remain
    difficult; many evidence packets omit limitations or standardized metrics. It
    remains unclear which architectural choices transfer beyond specific datasets
    and how much gain comes from model quality versus planner or task prior.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型架构占主导，包括扩散Transformer、Transformer-VAE和视频-动作统一模型，应用于驾驶、机器人和强化学习，常加入一致性、物理或上下文辅助目标。
  - 研究共性：方法将高维视觉生成与辅助信号耦合，如掩码重建、物理预测、上下文条件、语言原语或动作扩散，并评估下游控制或视频质量。
  - 关键差异：表示和目标选择不同，包括随机潜在动力学、扩散生成、物理信息预测和语言组合模型；动作/上下文接口与评测目标覆盖Atari、驾驶、机器人仿真和Minecraft一致性/动作控制基准。
  - 趋势演进：在当前前沿（2023-2026）中，研究从面向强化学习的世界模型转向大型具身生成世界模型，再转向记忆、空间一致性和动作控制的显式基准；更早年份未在主要证据中体现。
  - 开放问题：长期记忆和跨动作空间泛化仍困难；许多证据缺少局限性或标准化指标；尚不清楚哪些架构选择能跨数据集迁移，以及收益多大来自模型本身而非规划器或任务先验。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete generative architectures,
        losses, and auxiliary training tasks, including mask reconstruction with diffusion
        transformers, stochastic transformer-VAE dynamics, physics-informed depth/keypoint
        prediction, and unified video-action diffusion.
      what_remains_open: Which representation and objective choices transfer beyond
        the reported driving, robotics, or RL task families; long-term consistency
        and physical plausibility are not yet standardized.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention and decision-time
        interfaces through context-conditioned model-based RL, language-primitive
        video planning, or unified video and action diffusion timesteps.
      what_remains_open: How much gain comes from the model versus the planner, controller,
        or task prior; generalization beyond seen primitives or observed context;
        real-robot deployment evidence remains limited.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides datasets, metrics, and benchmarks for spatial/memory
        consistency and action control, such as scene-graph consistency scores and
        closed-loop revisited evaluation.
      what_remains_open: Whether evidence isolates the proposed method rather than
        dataset, baseline, metric, and system choices; some benchmark papers report
        dataset construction but not comparative experimental results.
    consensus:
    - Recent work treats world models primarily as high-dimensional generative models
      over video or image sequences, using stochastic or diffusion-based latent dynamics.
    - Auxiliary objectives or inductive biases such as mask reconstruction, physics
      prediction, context conditioning, language composition, and action coupling
      are used to improve generalization, consistency, or controllability.
    - Many methods are evaluated through downstream policy learning or control, not
      only through visual quality, especially in robotics and reinforcement learning.
    - Evaluation is expanding toward explicit properties such as memory consistency,
      spatial consistency, and action control, indicating a shift from generative
      realism alone to closed-loop behavioral validity.
    disagreements:
    - 'They differ in representation: stochastic transformer-VAE latent dynamics versus
      diffusion-based generation versus physics-informed auxiliary prediction versus
      language-primitive composition.'
    - 'They differ in interaction and supervision: some require observable context
      values, some depend on parsed language primitives, some use independent action-video
      diffusion timesteps, and some evaluate without action-conditioned control.'
    - 'They differ in evaluation targets: Atari human-normalized score, multi-view
      driving prediction, robot video planning in simulation, and Minecraft spatial/memory
      consistency benchmarks.'
    - 'They differ in evidence maturity: several method papers report strong quantitative
      gains but omit limitations, while benchmark papers emphasize dataset and metric
      construction and may not yet report complete comparisons.'
    open_questions:
    - Can current architectures maintain long-term memory consistency and generalize
      across unseen action spaces and viewpoints?
    - Which auxiliary objectives or representation choices transfer beyond specific
      datasets such as driving, CARL, RT-X, Atari, or Minecraft?
    - Can language-compositional approaches handle entirely novel primitives, not
      just novel combinations of seen primitives?
    - Is the assumption of observable context values plausible for real-world zero-shot
      generalization, and what happens when it is violated?
    - Do reported policy or control gains isolate model quality from planner, controller,
      data scale, or task prior effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 把世界模型想法落实为具体生成架构、损失和辅助训练任务，包括扩散Transformer掩码重建、随机Transformer-VAE动力学、物理信息深度/关键点预测和统一视频-动作扩散。
      尚未覆盖: 哪些表示和目标选择能迁移到已报告的驾驶、机器人或强化学习任务族之外；长期一致性和物理合理性尚未形成标准化评测。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预和决策时接口，通过上下文条件模型强化学习、语言原语视频规划或统一视频与动作扩散时间步实现。
      尚未覆盖: 收益有多少来自模型本身而非规划器、控制器或任务先验；对未见原语或未观测上下文的泛化；真实机器人部署证据仍有限。
    - 路线: 方法证据与消融协议
      解决的问题: 提供空间/记忆一致性和动作控制的数据集、指标与基准，例如场景图一致性分数和闭环重访评估。
      尚未覆盖: 证据是否真正隔离了方法贡献，而非数据集、基线、指标和系统选择；部分基准论文只报告数据集构建，未报告对比实验结果。
    共识:
    - 近期工作普遍把世界模型视为视频或图像序列上的高维生成模型，并使用随机或扩散潜在动力学。
    - 辅助目标或归纳偏置，如掩码重建、物理预测、上下文条件、语言组合和动作耦合，被用来提升泛化、一致性或可控性。
    - 许多方法通过下游策略学习或控制进行评估，而不只看视觉质量，尤其在机器人和强化学习中如此。
    - 评测正从生成真实感扩展到记忆一致性、空间一致性和动作控制，表明研究重点转向闭环行为有效性。
    分歧:
    - 表示方式不同：随机Transformer-VAE潜在动力学、扩散生成、物理信息辅助预测或语言原语组合。
    - 交互与监督信号不同：有的需要可观测上下文值，有的依赖语言原语解析，有的使用独立动作-视频扩散时间步，有的不评估动作控制。
    - 评测目标不同：Atari人类标准化分数、多视角驾驶预测、机器人视频规划仿真和Minecraft空间/记忆一致性基准。
    - 证据成熟度不同：部分方法论文报告强量化提升但未给出局限性，部分基准论文侧重数据集和指标构建，尚未报告完整对比。
    开放问题:
    - 当前架构能否保持长期记忆一致性，并泛化到未见动作空间和视角？
    - 哪些辅助目标或表示选择能迁移到驾驶、CARL、RT-X、Atari或Minecraft等特定数据集之外？
    - 语言组合方法能否处理完全新颖的原语，而不只是已见原语的新组合？
    - 可观测上下文值假设在真实零样本泛化中是否成立，违反时会如何？
    - 报告的策略或控制收益是否隔离了模型质量与规划器、控制器、数据规模或任务先验的影响？
