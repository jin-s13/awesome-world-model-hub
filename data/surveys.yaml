  related_work_outline_zh:
  - 主流方向：以具身视频世界模型为主，将视频生成与动作动力学耦合，用于机器人学习、规划与仿真；近期重心从视觉生成转向物理合理、动作可控的轨迹生成、对齐与验证。
  - 研究共性：把视频预测视为世界模型，通过专门机制注入动作，在机器人或任务视频上预训练或适配，并以视觉质量、可控性、规划分数或下游策略指标评测；多篇证据呼吁超越视觉保真度。
  - 关键差异：建模包括统一扩散、掩码自回归和冻结视频扩散适配；对齐信号包括人类偏好、DPO/PPO式后训练、测试时启发式或断言奖励；评测基准和具身设置不同，结果迁移不一致。
  - 趋势演进：2024-2026证据显示，从构建动作-视频世界模型和适配预训练生成器，转向物理或任务奖励对齐和测试时缩放探测；概念性工作开始形式化状态、动态和基准缺陷。更早证据较少。
  - 开放问题：跨任务和基准的收益是否迁移；测试时验证何时失效；如何评测持久状态和因果动态；人类偏好对齐如何规模化；概念分类是否真正改变设计或评测。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative dynamics models
      what_it_solves: Couples action and video generation in shared autoregressive
        or diffusion formulations to pretrain robot dynamics and policies, support
        flexible policy, forward or inverse dynamics, and improve controllability
        or speed.
      what_remains_open: Long-horizon physical persistence, causality, and cross-embodiment
        generalization beyond training distributions remain weakly validated; several
        works omit explicit limitation statements or public validation artifacts.
    - line: Pretrained video diffusion adaptation for action-conditioned world models
      what_it_solves: Adapts existing video generators to action-conditioned rollouts
        without full retraining, using learned masks or post-training discriminators
        to reduce data requirements and improve physical plausibility.
      what_remains_open: Dependence on domain-specific action-labeled videos or curated
        physics-aware datasets is unresolved, and evidence is concentrated in manipulation
        or game scenes with limited transfer to unseen task families.
    - line: Reward alignment and test-time verification for embodied rollouts
      what_it_solves: Aligns generated trajectories with physical realism, task logic,
        embodiment, and visual quality through reward models, preference optimization,
        or frame-anchored verification, addressing unreliable heuristic reward signals.
      what_remains_open: Inconsistent benchmark scaling and possible information bottlenecks
        in fine-grained spatial reasoning remain; human-preference labels are subjective
        and costly, and gains do not transfer across all benchmarks.
    - line: Conceptual taxonomies and evaluation redefinitions
      what_it_solves: Formalizes state construction and dynamics modeling categories
        for video generation as world models, and argues for functional benchmarks
        that go beyond visual fidelity to physical persistence and causal reasoning.
      what_remains_open: No empirical demonstration shows that the taxonomy changes
        model design or evaluation; current metrics and benchmarks still under-test
        persistence and causal dynamics.
    consensus:
    - Video generation is treated as the central medium for embodied world modeling,
      with action conditioning needed to make rollouts useful for policy learning
      or planning.
    - Visual quality alone is insufficient; physical plausibility, task logic, action-frame
      alignment, and controllability are jointly emphasized.
    - Large-scale pretraining, adaptation, or post-training on robot or task data
      is commonly used to improve generalization, but evaluation remains benchmark-
      and domain-dependent.
    disagreements:
    - 'Formulation differs: some use unified diffusion over video and action, some
      use masked autoregressive generation, and some adapt frozen video diffusion
      models with external learned masks.'
    - 'Alignment signal differs: human-preference reward models and DPO/PPO-style
      post-training contrast with test-time heuristic verifiers or frame-anchored
      assertion rewards.'
    - 'Evaluation target differs: visual fidelity, policy correlation, planning IoU,
      physical plausibility, trajectory consistency, and spatial reasoning benchmarks
      are used separately, and improvements on one do not always appear on another.'
    - 'Deployment setting differs: large multi-task robot pretraining, closed-source
      video model adaptation with small action-labeled datasets, real-time simulation
      for policy evaluation, and zero-shot benchmark evaluation across embodiments.'
    open_questions:
    - Do improvements in video fidelity, physical plausibility, or benchmark scores
      transfer to downstream robot policy success and long-horizon planning?
    - Under what conditions does test-time verification improve spatial reasoning,
      and where do world-model rollouts become an information bottleneck rather than
      an evidence source?
    - Can human-preference alignment scale without expensive subjective labels, and
      does it generalize beyond contact-rich manipulation?
    - What evaluation protocol can measure persistent state, causal dynamics, and
      action-frame alignment independently of visual appearance?
    - How do formal taxonomies and conceptual definitions translate into concrete
      model design choices or benchmark changes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成动力学模型
      解决的问题: 在共享的自回归或扩散公式中耦合动作与视频生成，用于机器人动力学和策略预训练，支持策略、前向或逆动力学表示，并改善可控性或速度。
      尚未覆盖: 长时程物理持久性、因果性以及跨本体泛化仍缺乏充分验证；部分工作缺少明确的局限性说明或公开验证工件。
    - 路线: 预训练视频扩散适配为动作条件世界模型
      解决的问题: 无需完全重训即可将现有视频生成器适配为动作条件轨迹生成，通过学习掩码或后训练判别器降低数据需求并提升物理合理性。
      尚未覆盖: 仍依赖领域特定的动作标注视频或精心整理的物理感知数据，证据集中在操作或游戏场景，未见任务族之外的迁移验证。
    - 路线: 具身轨迹的奖励对齐与测试时验证
      解决的问题: 通过奖励模型、偏好优化或帧锚定断言验证，使生成轨迹对齐物理真实性、任务逻辑、具身合理性和视觉质量，缓解不可靠启发式奖励信号。
      尚未覆盖: 不同基准上的缩放不一致，细粒度空间推理中可能形成信息瓶颈；人类偏好标注主观且成本高，收益不能跨基准稳定迁移。
    - 路线: 概念分类与评测重定义
      解决的问题: 把视频生成作为世界模型的状态构建和动态建模类别形式化，并倡导超越视觉保真度、面向物理持久性和因果推理的功能基准。
      尚未覆盖: 缺少经验证据表明分类法真正改变模型设计或评测方式；现有指标和基准仍不足以检验持久性和因果动态。
    共识:
    - 视频生成被视为具身世界建模的核心媒介，动作条件化是使生成轨迹对策略学习或规划可用的关键。
    - 仅看视觉质量不够，物理合理性、任务逻辑、动作-帧对齐和可控性被共同强调。
    - 大规模预训练、适配或后训练常用于提升泛化，但评测结果依赖特定基准和领域。
    分歧:
    - 表示方式不同：有的在统一扩散中耦合视频和动作，有的使用掩码自回归生成，有的通过外部学习掩码适配冻结视频扩散模型。
    - 监督信号不同：基于人类偏好的奖励模型和DPO/PPO式后训练，与测试时启发式验证器或帧锚定断言奖励形成对比。
    - 评测目标不同：视觉保真度、策略相关性、规划IoU、物理合理性、轨迹一致性和空间推理基准被分别使用，一项上的提升不总能迁移到另一项。
