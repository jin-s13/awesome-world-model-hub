  literature_review:
    line_of_work_matrix:
    - line: Runnable action-controllable video simulation frameworks
      what_it_solves: Transforms pretrained video generators or bespoke world models
        into controllable simulators that produce future-frame rollouts under action,
        trajectory, or intention signals.
      what_remains_open: Long-horizon geometric and visual stability across domains,
        plus trade-offs between dynamic control and fine-grained appearance.
    - line: Closed-loop autonomous driving simulation and serving stacks
      what_it_solves: Generates multi-view future frames with sub-second inference
        for closed-loop evaluation on driving data such as nuScenes.
      what_remains_open: Generalization beyond nuScenes-like sensor layouts, multi-GPU
        deployment, and robustness to out-of-distribution driving conditions.
    - line: Benchmark and dataset infrastructure for world-model consistency
      what_it_solves: Operationalizes spatial consistency, action fidelity, and physical
        plausibility as measurable targets using loop navigation or context-future
        driving pairs.
      what_remains_open: Metric transferability across environments and the lack of
        universal ground truth for physical or action consistency.
    - line: Contextual latent world models for model-based reinforcement learning
      what_it_solves: Learns latent dynamics conditioned on observable context so
        policies trained on imagined rollouts can transfer to unseen context values.
      what_remains_open: Assumes observable context or simplified benchmark tasks;
        broader unseen dynamics and real-world context estimation remain uncovered.
    - line: Survey and systematization of interactive world modeling
      what_it_solves: Maps application scenarios, technical challenges, benchmarks,
        and evaluation dimensions for interactive video world modeling.
      what_remains_open: The map may lag rapid development and does not itself empirically
        validate the identified open challenges.
    consensus:
    - Action conditioning is treated as a first-class control signal, with future
      video prediction evaluated by whether generated frames follow actions or trajectories.
    - Open artifacts such as datasets, baselines, and evaluation protocols are treated
      as primary system contributions alongside generated video or policy performance.
    - Temporal consistency, spatial or geometric coherence, and low-latency responsiveness
      recur as requirements for practical interactive simulators.
    - Several works use domain-specific datasets or benchmarks to turn abstract world-model
      claims into quantitative evidence.
    disagreements:
    - 'Representation differs: some systems use latent recurrent state-space dynamics
      for policy learning, while others adapt diffusion or autoregressive video transformers
      for pixel-level generation.'
    - 'Supervision differs: context conditioning, physics-informed depth or keypoint
      objectives, motion-reinforced losses, and structured multi-view controls impose
      different inductive biases.'
    - 'Evaluation targets differ: visual fidelity metrics, action-following fidelity,
      scene-graph spatial consistency, and downstream policy generalization are not
      interchangeable.'
    - 'Interaction and deployment settings differ: some systems generate offline or
      open-loop rollouts, while others target sub-second closed-loop driving simulation.'
    - 'Control interfaces differ: low-level trajectories, angles, speeds, high-level
      intentions or goals, and latent context variables create different controllability
      requirements.'
    open_questions:
    - How do action-controllable simulators maintain long-horizon spatial, cross-view,
      and dynamic consistency under repeated self-conditioning?
    - How well do current Minecraft, nuScenes, CARL, game, and robotics evaluations
      predict generalization to unseen environments, sensors, or physical contexts?
    - What evidence links visual action fidelity or world-model benchmark scores to
      downstream policy utility or safety?
    - Which latency, fidelity, and controllability trade-offs are acceptable in real
      deployments when code, dataset, or system details are incomplete in current
      evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的动作可控视频模拟框架
      解决的问题: 将预训练视频生成器或定制世界模型转化为可在动作、轨迹或意图信号下生成未来帧的可控模拟器。
      尚未覆盖: 跨域长时域几何与视觉稳定性，以及动态控制与细粒度外观之间的权衡。
    - 路线: 闭环自动驾驶模拟与部署栈
      解决的问题: 在nuScenes等驾驶数据上生成多视角未来帧，并以亚秒级延迟支持闭环评测。
      尚未覆盖: 对nuScenes之外传感器布局的泛化、多GPU部署，以及分布外驾驶场景下的鲁棒性。
    - 路线: 面向世界模型一致性的基准与数据基础设施
      解决的问题: 通过循环导航或驾驶上下文-未来数据对，将空间一致性、动作忠实度和物理合理性操作化为可测目标。
      尚未覆盖: 指标跨环境迁移性，以及物理或动作一致性缺乏通用真值。
    - 路线: 面向基于模型的强化学习的上下文潜在世界模型
      解决的问题: 学习以可观测上下文为条件的潜在动力学，使在想象轨迹上训练的策略能泛化到未见上下文。
      尚未覆盖: 假设上下文可观测或评测任务简化；更广泛的未知动力学和真实环境上下文估计仍未覆盖。
    - 路线: 交互式世界建模的综述与体系化
      解决的问题: 系统梳理交互式视频世界建模的应用场景、技术挑战、基准和评测维度。
      尚未覆盖: 综述可能滞后于快速发展，且自身并不构成对开放挑战的实证验证。
    共识:
    - 动作条件被视作一级控制信号，未来视频预测主要以生成帧是否遵循动作或轨迹来评估。
    - 数据集、基线和评测协议等开放工件被视为系统主要贡献，而不仅是生成视频或策略性能。
    - 时间一致性、空间或几何一致性以及低延迟响应被共同视为实用交互式模拟器的核心要求。
    - 多项工作通过领域特定数据集或基准将抽象的世界模型主张转化为量化证据。
    分歧:
    - 表示方式不同：部分系统使用潜在循环状态空间动力学进行策略学习，另一些则适配扩散或自回归视频Transformer进行像素级生成。
    - 监督信号不同：上下文条件、物理深度或关键点目标、运动增强损失和结构化多视图控制各自施加不同的归纳偏置。
    - 评测目标不同：视觉保真指标、动作跟随忠实度、场景图空间一致性和下游策略泛化不可互换。
    - 交互与部署设置不同：部分系统是离线或开环生成，另一些面向亚秒级闭环驾驶模拟。
    - 控制接口不同：低层轨迹、角度、速度，高层意图或目标点，以及潜在上下文变量导致不同的可控性要求。
    开放问题:
    - 在重复自条件下，动作可控模拟器能在多长时域内保持空间、跨视图和动态一致性？
    - 当前Minecraft、nuScenes、CARL、游戏和机器人评测能在多大程度上预测对未知环境、传感器或物理上下文的泛化？
    - 何种证据能将视觉动作忠实度或世界模型基准分数与下游策略效益或安全性联系起来？
    - 在当前代码、数据集或系统细节不完整的情况下，实际部署中应接受怎样的延迟、保真度和可控性权衡？
