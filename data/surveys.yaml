  related_work_outline:
  - 'Mainstream direction: Designing dedicated benchmarks and metrics to evaluate
    specific world-model capabilities—spatial consistency, memory, action control—rather
    than relying on aggregate reconstruction scores or task performance alone.'
  - 'Shared research pattern: Each benchmark constructs a curated dataset with controlled
    distribution shifts, proposes a tailored metric that isolates a capability (e.g.,
    scene graph consistency, action-sensitive memory), and releases open-source code
    and baselines to enable reproducible comparisons.'
  - 'Key differences: Benchmarks differ in the capability they target (spatial consistency
    vs. memory/action control), the environment (Minecraft vs. diverse 3D scenes),
    the action space design (fixed vs. varied), and whether evaluation is open-loop
    or closed-loop revisited.'
  - 'Trend evolution: From 2024–2026, the frontier moves from using existing game
    benchmarks (Atari 100k) for world-model evaluation toward purpose-built, multi-view,
    long-horizon benchmarks with explicit consistency and control metrics, reflecting
    a demand for fine-grained diagnostics beyond final scores.'
  - 'Open questions: Whether proxy metrics like SGCS or memory consistency scores
    align with downstream decision utility in real-world tasks; how benchmark conclusions
    hold under different compute budgets and implementations; and whether the task
    distributions cover the full range of settings where world models are expected
    to operate.'
  related_work_outline_zh:
  - 主流方向：设计专用基准与指标来评估世界模型的特定能力（如空间一致性、记忆、动作控制），而非依赖聚合重建分数或单一任务表现。
  - 研究共性：每个基准构建一个带有受控分布偏移的精选数据集，提出隔离特定能力的定制指标（例如场景图一致性、动作敏感记忆），并开源代码和基线以实现可复现比较。
  - 关键差异：基准在目标能力（空间一致性 vs. 记忆/动作控制）、环境（Minecraft vs. 多样3D场景）、动作空间设计（固定 vs. 变化）以及评估是开环还是闭环重访上存在差异。
  - 趋势演进：2024至2026年，前沿从使用现有游戏基准（Atari 100k）转向构建带有显式一致性和控制指标的专用、多视角、长时序基准，反映出对超越最终分数的细粒度诊断需求。
  - 开放问题：SGCS或记忆一致性分数等代理指标是否与真实下游决策效用对齐；基准结论在不同算力预算和实现下是否稳定；任务分布是否覆盖世界模型预期运行的全部场景范围。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable by providing controlled testbeds with known distribution shifts
        and open-source artifacts.
      what_remains_open: Whether the designed task distribution (e.g., loop navigation
        in Minecraft, 1080p 3D scenes) covers the long-tail settings where world models
        are expected to help, and whether dataset scale is sufficient to prevent overfitting.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores through targeted metrics like scene graph
        consistency or memory-consistency scores that isolate specific failure modes.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; sensitivity to hyperparameters and implementation
        details; and whether the metrics capture compositional generalization.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines (e.g., MIND-World),
        public leaderboards, and standardized reporting of training conditions, evaluation
        protocols, and artifacts.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; the absence of large-scale pre-trained baselines in some
        domains; and the reproducibility of baseline results when retrained from scratch.
    consensus:
    - World-model evaluation must move beyond simple reconstruction error or final
      task score to measure specific capabilities like spatial consistency, temporal
      memory, and action controllability.
    - Open-sourcing datasets, metrics, and baselines is critical for reproducibility
      and fair comparison across different world-model architectures.
    - Long-horizon, multi-view, and closed-loop settings expose weaknesses that short-horizon,
      open-loop benchmarks hide, and should be part of standard evaluation suites.
    disagreements:
    - 'Choice of evaluation environment: one line uses Minecraft for its open-world
      flexibility and controllable navigation, while another uses a collection of
      diverse 3D scenes with varying first- and third-person viewpoints to stress-test
      generalization.'
    - 'Action space design: some benchmarks fix a shared action space across all clips,
      whereas others deliberately vary action spaces to probe generalization across
      different control interfaces.'
    - 'Metric focus: scene-graph-based consistency scores prioritize viewpoint-invariant
      spatial fidelity, while memory-consistency metrics emphasize temporal stability
      and contextual coherence after revisiting locations.'
    - 'Role of video quality: one benchmark uses high-resolution (1080p) videos, while
      earlier work relied on lower-resolution simulation frames, which may affect
      the sensitivity of visual quality metrics and the difficulty of the task.'
    open_questions:
    - To what extent do current proxy metrics (SGCS, memory consistency scores) correlate
      with real-world robotic policy performance or human judgments of simulation
      quality?
    - How do benchmark rankings change under different compute budgets, implementation
      choices, or when using pre-trained models versus training from scratch?
    - Can the task distributions in existing benchmarks (loop navigation, 3D scene
      traversal) be extended to cover interactive, multi-agent, or embodied scenarios
      that world models are ultimately intended for?
    - Are current benchmarks sufficient to detect and quantify the failure modes of
      world models that combine video and action generation, such as those pretrained
      on large robotic datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 通过提供具有受控分布偏移的开源测试床，构建共享任务和数据集，使世界模型的主张具备可比性。
      尚未覆盖: 设计的任务分布（如Minecraft中的循环导航、1080p 3D场景）是否覆盖世界模型预期发挥作用的尾部场景，以及数据集规模是否足以防止过拟合。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性或记忆一致性分数等针对性指标，在总分之外检验预测、可控性、鲁棒性和决策效用，隔离特定失效模式。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致；对超参数和实现细节的敏感性；指标是否捕捉组合泛化。
    - 路线: 可比基线与报告规范
      解决的问题: 通过通用基线（如MIND-World）、公开排行榜以及标准化的训练条件、评估协议和工件报告，使结果可审计。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；某些领域缺乏大规模预训练基线；从零开始重新训练时基线结果的可复现性。
    共识:
    - 世界模型评估必须超越简单的重建误差或最终任务分数，转而衡量空间一致性、时间记忆和动作可控性等特定能力。
    - 开源数据集、指标和基线对于不同世界模型架构之间的可复现性和公平比较至关重要。
    - 长时域、多视角和闭环设置暴露了短时域、开环基准所隐藏的弱点，应成为标准评估套件的一部分。
    分歧:
    - 评估环境的选择：一条路线使用Minecraft的开放世界灵活性和可控导航，另一条路线使用多样化的3D场景集合，包含不同第一人称和第三人称视角，以压力测试泛化性。
    - 动作空间设计：一些基准在所有片段中固定共享动作空间，而另一些则故意变化动作空间，以探究跨不同控制接口的泛化能力。
    - 指标重点：基于场景图的一致性分数优先考虑视角不变的空间保真度，而记忆一致性指标则强调重访地点后的时间稳定性和上下文连贯性。
    - 视频质量的作用：一个基准使用高分辨率（1080p）视频，而早期工作依赖较低分辨率的模拟帧，这可能影响视觉质量指标的敏感度和任务难度。
    开放问题:
    - 当前的代理指标（SGCS、记忆一致性分数）在多大程度上与真实机器人策略性能或人类对仿真质量的判断相关？
    - 在不同算力预算、实现选择或使用预训练模型与从头训练的情况下，基准排名会如何变化？
    - 现有基准中的任务分布（循环导航、3D场景遍历）能否扩展到世界模型最终旨在服务的交互式、多智能体或具身场景？
    - 当前基准是否足以检测和量化结合视频与动作生成的世界模型（例如在大规模机器人数据集上预训练的模型）的失效模式？
