  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on generative video world models
    using diffusion or Transformer architectures for embodied, driving, and large-scale
    robot data.'
  - 'Shared research pattern: Methods augment prediction with auxiliary tasks, conditioning,
    or benchmarks to improve generalization, consistency, and policy utility.'
  - 'Key differences: Factorized versus unified generation, world-model-only versus
    action-coupled planning, and task-specific versus open-domain benchmark evaluation.'
  - 'Trend evolution: Within the 2023-2026 frontier, the field is moving from RL-specific
    world models toward general video-action diffusion and open-domain consistency
    benchmarks.'
  - 'Open questions: Transferability of architecture choices, source of policy gains,
    real-robot validation, and whether consistency metrics track downstream control
    remain open.'
  related_work_outline_zh:
  - 主流方向：近期工作集中在扩散或Transformer架构的生成式视频世界模型，面向具身智能、驾驶和大规模机器人数据。
  - 研究共性：在预测之外加入辅助任务、条件信息或基准评估，以提升泛化、一致性和策略效用。
  - 关键差异：存在分解式与统一式生成、仅世界模型与动作耦合规划、任务内评测与开放域基准评测等差异。
  - 趋势演进：在2023-2026年前沿内，从面向强化学习的专用世界模型走向通用视频-动作扩散和开放域一致性基准。
  - 开放问题：架构选择的可迁移性、策略收益来源、真实机器人验证，以及一致性指标与下游控制的关系仍待证明。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete architectures and training
        recipes, including diffusion with mask reconstruction, stochastic Transformer-VAE,
        recurrent state-space models, and auxiliary physics or context signals.
      what_remains_open: Which representation and auxiliary-loss choices transfer
        beyond reported driving, Atari, CARL, and robot-video settings; some works
        omit limitation evidence, leaving failure modes unclear.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decision-time interfaces through
        dream-based policy learning, language-primitive video planning, and unified
        video-action diffusion pretraining.
      what_remains_open: How much reported gain comes from the model rather than the
        planner, controller, task prior, or pretraining data; several evaluations
        stay in simulation or on narrow task suites.
    - line: Method evidence and benchmark protocol
      what_it_solves: Builds datasets and metrics for capabilities beyond visual fidelity,
        including spatial consistency in loop navigation and memory consistency plus
        action control.
      what_remains_open: Whether benchmarks isolate the proposed method from surrounding
        system choices and whether their metrics predict real downstream control quality
        or cross-domain generalization.
    consensus:
    - Recent methods converge on generative or sequence-modeling architectures, especially
      diffusion and Transformer variants, for video prediction and learned dynamics.
    - Research is shifting from pixel-level generation quality toward consistency,
      memory, action controllability, and downstream policy utility.
    - Extra conditioning or auxiliary tasks, such as context values, language primitives,
      physics signals, or action modeling, are used to improve generalization and
      control interfaces.
    - Dedicated benchmarks are emerging to evaluate spatial and memory consistency
      in world models, supplementing existing task benchmarks.
    disagreements:
    - 'Representation choices differ: unified video/action generation contrasts with
      factorized compositional generation and with recurrent state-space latent dynamics.'
    - 'Supervisory signals differ: pure video prediction, physics-informed depth and
      keypoint objectives, context-conditioned latent dynamics, and coupled action
      diffusion emphasize different training targets.'
    - 'Evaluation targets differ: some report RL benchmark scores, some report driving
      or multi-view prediction, and others stress robot-video generation or open-domain
      consistency.'
    - 'Interaction modes differ: policy learning from model imagination or simulation
      is common, but large-scale robot-dataset pretraining and real-robot deployment
      remain unevenly validated.'
    open_questions:
    - Which architecture and objective choices transfer beyond the reported task families
      and benchmarks?
    - Do spatial or memory consistency benchmark metrics correlate with downstream
      real-world policy performance?
    - How much of the policy improvement comes from learned dynamics versus context
      observability, pretraining data, planner, or task prior?
    - What failure modes arise for methods that lack limitation evidence or are evaluated
      only in simulation or on narrow task sets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法落实为具体架构和训练配方，例如扩散掩码重建、随机Transformer-VAE、循环状态空间以及物理或上下文辅助信号。
      尚未覆盖: 哪些表示和辅助损失选择能迁移到驾驶、Atari、CARL和机器人视频之外；部分工作未给出局限性，失败边界不清。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，包括基于想象的策略学习、语言原语视频规划和统一视频-动作扩散预训练。
      尚未覆盖: 收益有多少来自模型本身而非规划器、控制器、任务先验或预训练数据；不少评估仍停留在仿真或较窄任务集。
    - 路线: 方法证据与消融协议
      解决的问题: 构建超越视觉保真度的数据集和指标，例如循环导航空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些基准是否隔离了方法本身贡献，指标能否预测真实下游控制质量或跨域泛化，仍有待验证。
    共识:
    - 近期方法普遍采用生成式或序列建模架构，尤其是扩散与Transformer变体，用于视频预测和动力学学习。
    - 研究重心正从像素级生成质量转向一致性、记忆、动作可控性和下游策略效用。
    - 通过上下文、语言原语、物理信号或动作建模等附加条件/辅助任务来提高泛化和控制接口。
    - 开始出现专门评估世界模型空间一致性和记忆一致性的基准，以补充传统任务指标。
    分歧:
    - 表示方式不同：统一视频/动作生成与分解式组合生成、循环状态空间潜在动力学存在明显差异。
    - 监督信号不同：纯视频预测、物理信息深度/关键点目标、上下文条件潜在动力学和耦合动作扩散各有侧重。
    - 评测目标不同：部分关注强化学习分数，部分关注驾驶或多视角预测，部分强调机器人视频或开放域一致性。
    - 交互与部署设置不同：模型想象或仿真中的策略学习较常见，大规模机器人数据预训练和真实机器人验证强度不一。
    开放问题:
    - 哪些架构和目标选择能跨任务族泛化，而不只在报告数据集上有效？
    - 空间或记忆一致性基准指标是否与真实下游策略表现相关？
    - 策略提升在多大程度上来自动力学模型本身，而非可观测上下文、预训练数据、规划器或任务先验？
    - 缺少局限性说明或仅在仿真/较窄任务集上评估的方法，其失败模式和未覆盖边界是什么？
