  related_work_outline:
  - 'Mainstream direction: Constructing dedicated benchmarks that evaluate world models
    on spatial-temporal consistency, memory, and action control, rather than relying
    solely on downstream task scores.'
  - 'Shared research pattern: Each benchmark proposes a new dataset (e.g., LoopNav,
    MIND) paired with a novel metric designed to probe a specific world-model capability,
    such as loop closure or memory across viewpoints.'
  - 'Key differences: Benchmarks differ in environment (Minecraft vs. diverse real-world-like
    scenes), interaction modality (navigation versus shared action spaces), and the
    aspect of world model consistency they target (spatial consistency via scene graphs
    vs. memory consistency and action controllability).'
  - 'Trend evolution: Between 2025 and 2026, the focus shifted from single-environment,
    navigation-only benchmarks to open-domain, multi-scene benchmarks with explicit
    interactive baselines, indicating a move toward richer, more general evaluation
    protocols.'
  - 'Open questions: Whether the proposed metrics align with downstream decision-making
    quality, and whether benchmark conclusions remain stable across different model
    implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建专用基准，评估世界模型在时空一致性、记忆和动作控制方面的能力，而非仅依赖下游任务得分。
  - 研究共性：每个基准都提出一个新的数据集（如 LoopNav、MIND）并配以新颖的指标，专门探测世界模型的某一特定能力，例如闭环或跨视角记忆。
  - 关键差异：基准在环境（Minecraft 与多样化类真实场景）、交互模态（导航与共享动作空间）以及它们所针对的世界模型一致性方面（基于场景图的空间一致性与记忆一致性和动作可控性）存在差异。
  - 趋势演进：从 2025 年到 2026 年，焦点从单一环境、仅导航的基准转向开放域、多场景基准，并引入显式的交互式基线，表明评估协议正朝着更丰富、更通用的方向发展。
  - 开放问题：所提出的指标是否与下游决策质量对齐，以及基准结论在不同模型实现和计算预算下是否保持稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets (e.g., LoopNav's Minecraft
        navigation, MIND's multi-scene videos) that make world-model claims about
        spatial and memory consistency comparable.
      what_remains_open: Whether the task distribution covers the full range of settings
        where world models are expected to help, and whether a single environment
        or a small set of scenes can represent real-world diversity.
    - line: Metric and stress-test design
      what_it_solves: Probing world-model capabilities beyond aggregate scores, such
        as spatial consistency via Scene Graph Consistency Score (LoopNav) or memory
        consistency and action control via tailored evaluation frameworks (MIND).
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; the sensitivity of metrics to pixel-level
        vs. semantic-level inconsistencies is not fully characterized.
    - line: Comparable baselines and reporting
      what_it_solves: Providing reference implementations or interactive baselines
        (e.g., MIND-World) to enable reproducible comparisons and reveal model limitations.
      what_remains_open: Benchmark conclusions may not be stable across different
        implementations or compute budgets; the single baseline provided in each benchmark
        offers limited evidence on generalizability.
    consensus:
    - World models require benchmarks that go beyond task performance and directly
      measure internal consistency properties such as spatial coherence and memory
      stability.
    - Evaluation should involve closed-loop or revisited scenarios where the model
      must maintain a consistent representation over time.
    - New metrics are needed because conventional image/video quality metrics do not
      capture the unique failure modes of world models.
    disagreements:
    - LoopNav focuses on spatial consistency measured through scene graphs, while
      MIND emphasizes memory consistency and action control, reflecting different
      priorities in what constitutes a reliable world model.
    - 'The environments differ: LoopNav uses a single game engine (Minecraft) with
      synthetic navigation, whereas MIND collects diverse real-world style videos,
      leading to different assumptions about visual and action complexity.'
    - LoopNav provides a dataset and metric without an interactive baseline, while
      MIND includes an interactive video-to-world baseline, suggesting different views
      on whether the benchmark should include a reference model.
    open_questions:
    - How do benchmark scores for spatial or memory consistency correlate with downstream
      task performance in reinforcement learning or robotics?
    - Can the conclusions drawn from these benchmarks generalize to world models deployed
      in continuous, real-world environments with noisy sensors?
    - What is the minimal set of scenes and action spaces needed to reliably stress-test
      the memory and consistency of a world model?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集（如 LoopNav 的 Minecraft 导航、MIND 的多场景视频），使世界模型关于空间和记忆一致性的主张可比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部设置，以及单一环境或少量场景是否能代表真实世界的多样性。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外探测世界模型的能力，例如通过场景图一致性分数（LoopNav）或定制评估框架（MIND）衡量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的对齐；指标对像素级与语义级不一致的敏感性尚未完全刻画。
    - 路线: 可比基线与报告规范
      解决的问题: 提供参考实现或交互式基线（如 MIND-World），以实现可复现比较并揭示模型局限性。
      尚未覆盖: 基准结论在不同实现或计算预算下可能不稳定；每个基准仅提供单一基线，对泛化性的证据有限。
    共识:
    - 世界模型需要超越任务性能的基准，直接衡量空间一致性和记忆稳定性等内部一致性属性。
    - 评估应涉及闭环或重访场景，要求模型随时间保持一致的表示。
    - 需要新的指标，因为传统图像/视频质量指标无法捕捉世界模型特有的失败模式。
    分歧:
    - LoopNav 侧重于通过场景图衡量的空间一致性，而 MIND 强调记忆一致性和动作控制，反映了对可靠世界模型构成要素的不同优先级。
    - 环境不同：LoopNav 使用单一游戏引擎（Minecraft）进行合成导航，而 MIND 收集多样化类真实视频，导致对视觉和动作复杂性的假设不同。
    - LoopNav 提供了数据集和指标，但没有交互式基线；MIND 包含了一个交互式视频到世界的基线，显示出对基准是否应包含参考模型的不同看法。
    开放问题:
    - 空间或记忆一致性基准得分与强化学习或机器人任务中的下游任务性能有何关联？
    - 从这些基准中得出的结论能否推广到部署在具有噪声传感器的连续真实环境中的世界模型？
    - 可靠地压力测试世界模型记忆和一致性所需的最少场景和动作空间集合是什么？
