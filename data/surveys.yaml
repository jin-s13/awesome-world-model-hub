    scaling laws and failure boundaries remain unverified.'
  related_work_outline_zh:
  - 主流方向：构建基于视频的世界模型，通过动作条件化实现机器人操作与决策，并利用预训练、对齐和物理合理性提升可靠性。
  - 研究共性：将世界模型视为从动作到未来视频的映射，强调动作-视频对齐，并用于策略评估或规划。
  - 关键差异：生成架构（扩散与自回归）、动作注入方式、对齐目标（物理真实性、任务逻辑、视觉质量）以及评估标准（视觉保真度与功能基准）。
  - 趋势演进：从2024年的细粒度动作对齐和适配，到2025年的统一预训练和异构学习，再到2026年的大规模模型、多维对齐、物理对齐和理论分析，逐步走向更真实、可控和可解释。
  - 开放问题：世界模型缺乏形式化状态表示和长期因果推理；评估指标偏重视觉质量而非功能持久性；缩放规律和失效边界尚未验证。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifying what a world model must represent through state construction
        and dynamics modeling, and exposing unreliable assumptions in test-time verifiers
        for spatial reasoning.
      what_remains_open: Whether formal conditions match empirical model behavior
        remains unverified; failure boundaries are not rigorously defined; verifier
        analysis is limited to specific spatial reasoning tasks.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizing video generation models into implicit/explicit state
        construction and knowledge-integration/architecture-reformulation dynamics,
        and advocating functional benchmarks to test physical persistence and causality.
      what_remains_open: The taxonomy has not yet been shown to change how researchers
        evaluate or design models; functional benchmarks are not established; existing
        models are still assessed primarily by visual quality.
    - line: Scaling laws and guarantees
      what_it_solves: Large-scale models (14B) and preference alignment (DPO) are
        used to improve physical plausibility, implicitly assuming that scale and
        alignment confer guarantees.
      what_remains_open: No formal scaling law has been validated; it is unclear how
        model size, data, and objectives relate to catastrophic failures or transfer;
        the subjectivity of human-preference alignment is not quantified.
    consensus:
    - Action conditioning must be integrated into video generation to enable dynamics
      prediction.
    - Current world models are insufficient in long-term physical consistency and
      causal reasoning.
    - Evaluation should shift from visual quality to functional benchmarks (physical
      plausibility, task completion).
    - Pretraining or adapting large video models is an effective way to build world
      models.
    disagreements:
    - 'Generation architecture: diffusion models versus autoregressive models lead
      to different trade-offs in quality and inference speed.'
    - 'Action injection mechanism: frame-level conditioning, learned masks, and parallel
      context blocks yield varying alignment precision and controllability.'
    - 'Alignment supervision: unsupervised pretraining, reward modeling, and preference
      optimization (DPO) target different aspects (physical realism, task logic, visual
      quality).'
    - 'Evaluation scenario: policy evaluation, planning, and spatial reasoning impose
      different requirements, causing inconsistent performance conclusions.'
    open_questions:
    - How can formal state representations be introduced into world models to enable
      long-term memory and causal reasoning?
    - To what extent does the information bottleneck in current world models limit
      fine-grained reasoning?
    - How can standardized functional benchmarks be established to reliably assess
      physical persistence and causality?
    - Do scaling laws apply to world models, and can they predict failures on unseen
      tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 通过状态构建和动态建模澄清世界模型必须表示的内容，并揭示基于测试时验证器的空间推理假设不可靠。
      尚未覆盖: 形式条件是否匹配实际模型行为未经验证；失效边界未严格定义；验证器分析仅限于特定空间推理任务。
    - 路线: 概念分类与边界
      解决的问题: 将视频生成模型组织为隐式/显式状态构建和知识整合/架构重构动态建模，并倡导功能基准以测试物理持久性和因果推理。
      尚未覆盖: 该分类法尚未被证明能改变研究者的评估或设计方式；功能基准尚未建立；现有模型仍以视觉质量为主要评估手段。
    - 路线: 缩放规律与保证
      解决的问题: 通过大规模模型（14B）和偏好对齐（DPO）提升物理合理性，隐含地假设规模和对齐能提供保证。
      尚未覆盖: 尚未验证形式化的缩放规律；模型规模、数据、目标与灾难性失败或迁移之间的关系不明确；人类偏好对齐的主观性未被量化。
    共识:
    - 动作条件化必须融入视频生成才能实现动力学预测。
    - 当前世界模型在长期物理一致性和因果推理方面存在不足。
    - 评估应从视觉质量转向功能基准（物理合理性、任务完成）。
    - 预训练或适配大规模视频模型是构建世界模型的有效途径。
    分歧:
    - 生成架构：扩散模型与自回归模型在生成质量和推理速度上存在不同权衡。
    - 动作注入方式：帧级条件、学习掩码和并行上下文块等机制导致对齐精度和可控性各异。
    - 对齐监督：无监督预训练、奖励建模和偏好优化（DPO）针对不同方面（物理真实、任务逻辑、视觉质量）。
    - 评测场景：策略评估、规划与空间推理对世界模型提出不同要求，导致性能结论不一致。
    开放问题:
    - 如何将形式化状态表示引入世界模型，以实现长期记忆和因果推理？
    - 当前世界模型的信息瓶颈在多大程度上限制了细粒度推理？
    - 如何建立标准化的功能基准，以可靠地评估物理持久性和因果性？
    - 缩放规律是否适用于世界模型，能否预测其在未见任务上的失败？
