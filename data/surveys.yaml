  related_work_outline:
  - 'Mainstream direction: Learned video and latent-dynamics world models for embodied
    and driving settings dominate, especially diffusion or transformer architectures
    with auxiliary objectives for spatial, temporal, or physical consistency.'
  - 'Shared research pattern: Papers augment generative dynamics with additional self-supervised
    or coupled signals such as mask reconstruction, depth, keypoint dynamics, context
    conditioning, or action diffusion to improve generalization and control.'
  - 'Key differences: Some methods target sample-efficient model-based reinforcement
    learning and zero-shot contextual control, while others target explicit video
    generation or memory and action-influence benchmarking; supervision and interaction
    assumptions differ.'
  - 'Trend evolution: Available top evidence concentrates in 2023-2026, showing a
    visible frontier shift from stochastic latent dynamics on Atari/CARL toward large
    embodied or driving video world models and dedicated consistency benchmarks.'
  - 'Open questions: Whether auxiliary objectives transfer beyond reported tasks,
    whether visual or physical consistency gains improve downstream planning, and
    how to maintain long-term memory and action-space generalization.'
  related_work_outline_zh:
  - 主流方向：以具身智能和驾驶场景为核心，基于扩散或Transformer的视觉与潜在动力学世界模型成为主要路线，并用辅助目标提升空间、时间和物理一致性。
  - 研究共性：将生成式动力学与掩码重建、深度、关键点动力学、上下文条件或动作扩散等信号耦合，以增强泛化与控制能力。
  - 关键差异：不同工作分别侧重强化学习样本效率、上下文零样本泛化、显式视频生成或记忆/动作一致性评测，监督信号和交互假设不同。
  - 趋势演进：可用核心证据集中在2023-2026年，可见趋势是从Atari/CARL上的随机潜在动力学转向大规模具身/驾驶视频世界模型及专门一致性基准。
  - 开放问题：辅助目标在报告任务外是否迁移，视觉与物理一致性提升是否带来规划收益，以及如何维持长期记忆和跨动作空间泛化。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model ideas into concrete architectures and losses,
        including diffusion transformers with mask reconstruction, stochastic transformer-VAE
        models, contextual recurrent state-space models, and physics-informed video
        objectives.
      what_remains_open: Which representation or auxiliary loss transfers beyond the
        reported driving, Atari, CARL, or robot settings is not established; limitation
        details are often missing.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention, planning, and control
        through action-conditioned generation, action diffusion coupling, language-composed
        primitives, or policy learning from imagined rollouts.
      what_remains_open: Whether reported gains come from the world model or from
        the planner, policy, or task prior remains unresolved; interfaces often assume
        observable context or previously seen primitives.
    - line: Method evidence and ablation protocol
      what_it_solves: Introduces datasets and metrics for evaluating spatial, memory,
        and action-control consistency so method contributions can be separated from
        visual fidelity alone.
      what_remains_open: Benchmarks are new or small, and some available evidence
        reports no experimental results; baseline sensitivity, metric validity, and
        failure modes remain verification gaps.
    consensus:
    - A central trend is to combine generative sequence models such as transformers
      or diffusion with stochastic or auxiliary objectives to improve world-model
      prediction rather than relying on a single reconstruction loss.
    - Evaluation increasingly includes embodied or driving video, action conditioning,
      and consistency metrics, with shared interest in generalization to unseen scenes,
      tasks, or context values.
    - Many papers treat learned dynamics as a substrate for downstream policy learning
      or model-based control, not only as a video synthesis task.
    disagreements:
    - 'Representation differs: compact latent state-space models for sample-efficient
      reinforcement learning versus high-dimensional video prediction models with
      explicit pixel generation.'
    - 'Supervision and conditioning differ: some assume observable context or language
      primitives; others use physics-informed signals, action diffusion, or action-free
      video.'
    - 'Primary evaluation targets differ: control performance on Atari or CARL, driving
      or robot video fidelity, versus spatial, memory, and action-control benchmarks.'
    open_questions:
    - Do auxiliary objectives such as mask reconstruction, depth prediction, keypoint
      dynamics, and action diffusion transfer outside the tested datasets and embodiments?
    - How much of reported policy or planning improvement is attributable to world-model
      quality rather than planner, policy, or task-specific assumptions?
    - Can current world models maintain long-term memory consistency and generalize
      across action spaces in open-domain settings, given evidence that these remain
      difficult?
    - What are the failure modes and dataset or baseline sensitivities of newly proposed
      consistency benchmarks, especially where experimental results or limitations
      are absent?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思路落实为具体架构和损失，包括结合掩码重建的扩散Transformer、随机Transformer-VAE、上下文循环状态空间模型和物理信息视频目标。
      尚未覆盖: 哪类表示或辅助损失能迁移到已报告的驾驶、Atari、CARL或机器人场景之外尚不明确；局限性说明经常缺失。
    - 路线: 规划与动作接口方法
      解决的问题: 通过动作条件生成、动作扩散耦合、语言组合原语或基于想象轨迹的策略学习，把学习到的动力学连接到干预、规划和控制。
      尚未覆盖: 收益有多少来自世界模型本身，而非规划器、策略或任务先验，仍未被充分隔离；接口常假设上下文可观测或原语已见过。
    - 路线: 方法证据与消融协议
      解决的问题: 引入用于评估空间、记忆和动作控制一致性的数据集与指标，以便将方法贡献从单纯视觉保真度中分离出来。
      尚未覆盖: 基准较新或规模较小，部分可用证据未报告实验结果；基线敏感性、指标有效性和失败模式仍是验证缺口。
    共识:
    - 当前趋势是将Transformer或扩散等生成式序列模型与随机或辅助目标结合，以改善世界模型预测，而不是只依赖单一重建损失。
    - 评测越来越多包含具身或驾驶视频、动作条件和一致性指标，并普遍关注对未见场景、任务或上下文值的泛化。
    - 许多工作将学习到的动力学作为下游策略学习或基于模型控制的底层能力，而不仅是视频合成。
    分歧:
    - 表示方式不同：用于样本高效强化学习的紧凑潜在状态空间模型，与显式像素生成的高维视频预测模型并存。
    - 监督和条件信号不同：有的假设上下文或语言原语可观测，有的使用物理信息信号、动作扩散或无动作视频。
    - 主要评测目标不同：有的以Atari或CARL控制性能为主，有的以驾驶或机器人视频保真度为主，有的以空间、记忆和动作控制基准为主。
    开放问题:
    - 掩码重建、深度预测、关键点动力学和动作扩散等辅助目标能否迁移到已测试数据集和具身形态之外？
    - 所报告的策略或规划提升有多少归因于世界模型质量，而不是规划器、策略或任务特定假设？
    - 当前世界模型能否在开放环境中维持长期记忆一致性并跨动作空间泛化？现有证据显示这仍是难点。
    - 新提出的一致性基准在实验结果或局限性信息缺失时，其失败模式、数据集与基线敏感性如何？
