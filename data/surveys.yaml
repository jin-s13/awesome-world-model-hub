  related_work_outline:
  - 'Mainstream direction: Building world models with diffusion or Transformer architectures
    and evaluating them on standard RL and video generation benchmarks, while a parallel
    stream introduces dedicated benchmarks for intrinsic consistency (memory, spatial,
    physical).'
  - 'Shared research pattern: Most works train models in simulated environments (Atari,
    CARL, Nuscenes, Minecraft) and report task rewards or visual quality, gradually
    adding diagnostic metrics beyond aggregate scores.'
  - 'Key differences: Some works create new benchmarks and metrics (LoopNav, MIND),
    others improve model architectures and training (STORM, DIAMOND, MaskGWM, cRSSM,
    RoboScape, UWM). Evaluation dimensions span task reward, visual fidelity, memory
    consistency, and physical plausibility, across disparate environments from games
    to driving to robotics.'
  - 'Trend evolution: In 2023–2024, the focus was on training efficiency and visual
    detail via diffusion models; 2025–2026 saw the emergence of targeted benchmarks
    for memory and action control and physics-informed models, shifting attention
    toward interpretability and robustness.'
  - 'Open questions: Whether benchmark reward scores correlate with real-world decision
    utility; whether new consistency metrics are stable across environments and compute
    budgets; and how to evaluate safety and long-term stability of world models.'
  related_work_outline_zh:
  - 主流方向：构建基于扩散或Transformer的世界模型，在标准强化学习与视频生成基准上追求更高性能，同时出现专门评估内在一致性（记忆、空间、物理）的基准。
  - 研究共性：多数工作在模拟环境（Atari、CARL、Nuscenes、Minecraft）中训练模型，报告任务奖励或视觉质量，并逐步引入总分之外的诊断指标。
  - 关键差异：部分工作创建新基准与指标（LoopNav、MIND），部分工作改进模型架构与训练（STORM、DIAMOND、MaskGWM、cRSSM、RoboScape、UWM）。评估维度涵盖任务奖励、视觉保真度、记忆一致性、物理合理性，部署环境从游戏到驾驶再到机器人差异显著。
  - 趋势演进：2023–2024年侧重训练效率与扩散模型带来的视觉细节提升；2025–2026年涌现针对记忆、动作控制的定向基准和物理先验模型，重心转向可解释性与鲁棒性评估。
  - 开放问题：基准奖励得分是否与真实世界决策效用一致？新提出的一致性指标在跨环境、跨算力下是否稳定？如何评估世界模型的安全性与长期稳定性？
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable, e.g., LoopNav provides loop-based navigation data to evaluate
        spatial consistency, and MIND offers diverse videos with varied action spaces
        to assess memory consistency and action control.
      what_remains_open: Whether these task distributions cover the full range of
        real-world settings where world models are expected to help, including safety-critical
        and long-horizon scenarios.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores. Examples include MIND's memory consistency
        and action control metrics, LoopNav's Scene Graph Consistency Score, cRSSM's
        zero-shot generalization tests, and RoboScape's physical plausibility evaluation.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about, and whether the metrics remain sensitive
        and stable across different model architectures and implementations.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines and reporting
        conventions. Works such as STORM and DIAMOND standardize on Atari 100k, MaskGWM
        on Nuscenes and Waymo, cRSSM on CARL, and UWM on large-scale robot datasets,
        enabling direct comparisons with prior methods.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets, and the lack of standardized protocols
        for open-sourcing code, models, and evaluation pipelines.
    consensus:
    - World model evaluation must move beyond aggregate task rewards toward fine-grained
      diagnostics of internal states like memory, spatial consistency, and physical
      plausibility.
    - Diffusion-based world models improve visual detail and can lead to better agent
      performance, but they require more rigorous benchmarks to verify their predictive
      accuracy and generalization.
    - All works emphasize reporting results on specific benchmarks, but there is no
      unified meta-evaluation framework, leading to fragmented comparisons across
      environments and metrics.
    disagreements:
    - 'Evaluation target: some works prioritize task reward or visual fidelity, while
      others focus on internal consistency such as memory and action control.'
    - 'Supervision signal: methods use different inductive biases, including physics-informed
      depth and keypoints, explicit context values, or mask reconstruction, which
      affects what aspect of the world is captured.'
    - 'Interaction mode: models are trained and evaluated in offline settings, online
      RL, or via pre-training on passive video, leading to different assumptions about
      data availability and agent interaction.'
    - 'Deployment environment: the complexity varies from simple Atari games to semi-realistic
      driving simulators and diverse robotic scenarios, making it difficult to compare
      the true generality of world models.'
    open_questions:
    - Does the improvement in Atari 100k scores reliably translate to better decision-making
      in real-world robotic tasks or autonomous driving?
    - Are the memory and spatial consistency metrics proposed by MIND and LoopNav
      validated in physically realistic environments beyond simulated video?
    - How can we design benchmarks that test world model stability and safety over
      long horizons, a dimension entirely absent from current evaluations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具备可比性。例如 LoopNav 提供循环导航数据评估空间一致性，MIND 提供多样视频与动作空间评估记忆一致性与动作控制。
      尚未覆盖: 这些任务分布是否覆盖世界模型在真实世界（包括安全关键和长时域场景）中预期发挥作用的全部设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用。例如 MIND 的记忆一致性与动作控制指标、LoopNav 的场景图一致性分数、cRSSM
        的零样本泛化测试、RoboScape 的物理合理性评估。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致，以及这些指标在不同模型架构和实现下是否保持敏感性和稳定性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线和报告规范使结果可审计。STORM与DIAMOND在Atari 100k上标准化，MaskGWM在Nuscenes和Waymo上，cRSSM在CARL上，UWM在大规模机器人数据集上，实现了与先前方法的直接比较。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定，以及缺乏开源代码、模型和评估管线的标准化规范。
    共识:
    - 世界模型评估必须超越聚合任务奖励，转向对内部状态（如记忆、空间一致性、物理合理性）的细粒度诊断。
    - 基于扩散的世界模型能改善视觉细节并可能提升智能体性能，但需要用更严格的基准来验证其预测准确性和泛化能力。
    - 所有工作都强调在特定基准上报告结果，但缺乏统一的元评估框架，导致跨环境和跨指标的比较碎片化。
    分歧:
    - 评估目标差异：部分工作优先考虑任务奖励或视觉保真度，其他工作则侧重记忆和动作控制等内在一致性。
    - 监督信号差异：方法使用不同的归纳偏置，包括物理信息深度与关键点、显式上下文值或掩码重建，影响了世界模型捕捉的方面。
    - 交互模式差异：模型在离线设置、在线强化学习或通过被动视频预训练中进行训练和评估，对数据可用性和智能体交互的假设不同。
    - 部署环境差异：从简单Atari游戏到半真实驾驶模拟器和多样机器人场景，环境复杂度不同，使得比较世界模型的真正通用性变得困难。
    开放问题:
    - Atari 100k 分数的提升是否能可靠地转化为真实世界机器人任务或自动驾驶中更好的决策？
    - MIND 和 LoopNav 提出的记忆和空间一致性指标是否在仿真视频之外的真实物理环境中得到验证？
    - 如何设计能测试世界模型在长时域上稳定性和安全性的基准？当前评估完全缺失这一维度。
