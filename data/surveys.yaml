  related_work_outline:
  - 'Mainstream direction: Deploy world models as video generators or latent dynamics
    models in concrete domains—driving, robotics, and games—to support prediction,
    planning, and policy learning.'
  - 'Shared research pattern: Most works use Transformer or diffusion architectures,
    learn dynamics via self-supervised or large-scale pretraining, and condition on
    actions, language instructions, or physics priors to improve downstream task performance.'
  - 'Key differences: Methods differ in representation (pixel-space video generation
    vs. latent-state modeling), dependence on action conditioning, integration of
    physics knowledge, and evaluation targets (visual fidelity, spatial consistency,
    policy success).'
  - 'Trend evolution: The field evolved from model-based RL with compact latent models
    (e.g., Dreamer) toward diffusion-based video generation, expanding from Atari
    and Minecraft to driving and robotics, and now includes dedicated benchmarks for
    memory and spatial consistency.'
  - 'Open questions: Long-term memory consistency across extended horizons, cross-domain
    and cross-embodiment generalization, safe transfer from simulation to real-world
    deployment, and unified evaluation of generation quality and decision-making capability.'
  related_work_outline_zh:
  - 主流方向：将世界模型作为视频生成器或潜在动力学模型部署到驾驶、机器人和游戏等具体领域，以支持预测、规划与策略学习。
  - 研究共性：多数工作采用Transformer或扩散架构，通过自监督或大规模预训练学习动态，并利用动作、语言指令或物理先验作为条件来提升下游任务性能。
  - 关键差异：方法在表示形式（像素空间视频生成 vs. 潜在状态建模）、对动作条件的依赖、物理知识的引入程度以及评测目标（视觉保真度、空间一致性、策略成功率）上存在分歧。
  - 趋势演进：从基于模型的强化学习（如Dreamer）向基于扩散的视频生成演进，应用从Atari和Minecraft扩展到自动驾驶和机器人，并出现了专门评估记忆和空间一致性的基准。
  - 开放问题：长时域下的记忆一致性、跨领域和跨本体的泛化、从仿真到真实部署的安全迁移，以及生成质量与决策能力的统一评价。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation
      what_it_solves: Uses world models for multi-view video prediction and closed-loop
        simulation in driving, supporting scene understanding and planning.
      what_remains_open: Alignment between simulation gains and real-world safety,
        zero-shot transfer to new cities or sensor setups, and long-horizon physical
        consistency.
    - line: Embodied robot world models
      what_it_solves: Enables task imagination and policy learning for robots by generating
        videos conditioned on language or goals, often incorporating physics or compositional
        primitives.
      what_remains_open: Generalization across different robot platforms and environments,
        bridging simulation to real execution, and extrapolation to dynamics beyond
        observed context values.
    - line: Interactive agents and games
      what_it_solves: Learns world models in interactive environments for state inference
        and action control, and establishes benchmarks for spatial consistency and
        memory.
      what_remains_open: Maintaining long-term memory and generalizing across action
        spaces, robustness to changes in environment rules, and transition from open-loop
        evaluation to closed-loop decision-making.
    consensus:
    - Diffusion models and Transformers are the dominant architectures for world model
      learning in applications.
    - World models are used either as video generators for planning or as latent dynamics
      models for policy optimization.
    - Self-supervised or large-scale multi-task pretraining is a common strategy to
      improve generalization.
    - Evaluation typically combines generation quality metrics with downstream task
      performance, but specific metrics vary by domain.
    disagreements:
    - 'Pixel-space video generation vs. latent-state modeling: some works directly
      predict future frames, while others operate on compact latent representations.'
    - 'Action conditioning: certain models require explicit actions for dynamics,
      while others can exploit action-free video data to learn dynamics.'
    - 'Integration of physics: some methods explicitly inject physics priors (e.g.,
      depth, keypoints), whereas others rely purely on data-driven generation.'
    - 'Evaluation targets: visual fidelity, spatial consistency, and policy success
      are emphasized differently, making cross-work comparison difficult.'
    open_questions:
    - How can world models guarantee long-term memory consistency and physical plausibility
      over extended rollouts in open domains?
    - What enables a world model trained in one embodiment or environment to transfer
      its dynamics knowledge to a different one without retraining?
    - How can we reliably bridge the gap between high-fidelity video generation and
      safe, effective real-world robot or vehicle control?
    - What evaluation protocols can jointly assess generation quality and the model's
      utility for closed-loop decision-making?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真
      解决的问题: 利用世界模型进行驾驶场景的多视角视频预测和闭环仿真，支持场景理解与规划。
      尚未覆盖: 仿真收益与真实安全之间的对齐，新城市或传感器配置的零样本迁移，以及长时域物理一致性。
    - 路线: 具身机器人世界模型
      解决的问题: 通过语言或目标条件生成视频，实现机器人任务想象和策略学习，常结合物理或组合原语。
      尚未覆盖: 跨不同机器人平台和环境的泛化，仿真到真实执行的差距，以及对超出可观测上下文值的动力学外推。
    - 路线: 交互式智能体与游戏
      解决的问题: 在交互环境中学习世界模型以进行状态推理和动作控制，并建立空间一致性和记忆的基准。
      尚未覆盖: 长期记忆维持和跨动作空间泛化，对环境规则变化的鲁棒性，以及从开环评估到闭环决策的过渡。
    共识:
    - 扩散模型和Transformer是应用领域世界模型学习的主流架构。
    - 世界模型被用作视频生成器以支持规划，或作为潜在动力学模型用于策略优化。
    - 自监督或大规模多任务预训练是提升泛化能力的常用策略。
    - 评估通常结合生成质量指标与下游任务性能，但具体指标因领域而异。
    分歧:
    - 像素空间视频生成 vs. 潜在状态建模：部分工作直接预测未来帧，另一些在紧凑的潜在表示上操作。
    - 动作条件化：某些模型需要显式动作来驱动动态，而其他模型可以利用无动作视频数据学习动态。
    - 物理知识的引入：一些方法显式注入物理先验（如深度、关键点），另一些则完全依赖数据驱动生成。
    - 评测目标：视觉保真度、空间一致性和策略成功率的侧重不同，导致跨工作比较困难。
    开放问题:
    - 世界模型如何在开放域的长时域推演中保证记忆一致性和物理合理性？
    - 如何使在一个本体或环境中训练的世界模型将其动力学知识迁移到不同本体，而无需重新训练？
    - 如何可靠地弥合高保真视频生成与安全有效的真实机器人或车辆控制之间的差距？
    - 哪些评估协议能够同时衡量生成质量以及模型对闭环决策的可用性？
