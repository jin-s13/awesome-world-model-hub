  related_work_outline:
  - 'Mainstream direction: World-model evaluation is moving from aggregate control
    scores toward dedicated benchmarks that probe spatial consistency, memory consistency,
    and action control.'
  - 'Shared research pattern: Most works adopt action-conditioned visual dynamics
    or video generation and validate through downstream policy or consistency metrics
    rather than visual quality alone.'
  - 'Key differences: They differ mainly in evaluation target, representation, and
    deployment setting: decision utility vs generative fidelity, diffusion vs transformer-VAE
    vs recurrent state-space, and gaming, driving, robotics, or Minecraft domains.'
  - 'Trend evolution: Evidence clusters in 2023-2026; earlier Atari-centric model
    improvements give way to driving/robotic generalization and explicit open-domain
    evaluation suites.'
  - 'Open questions: Open questions concern metric-to-decision alignment, limited
    scene/action coverage, absent limitation reporting, and stability across implementations
    and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从Atari、NuScenes等聚合控制分数转向专门的记忆一致性、空间一致性与动作控制基准。
  - 研究共性：研究多采用动作条件下的视觉动力学或视频生成框架，并用下游策略性能或一致性指标进行验证。
  - 关键差异：评测目标不同，例如视觉保真与物理合理性、策略泛化或空间/记忆一致性；表示方式包括扩散、Transformer-VAE和循环状态空间。
  - 趋势演进：证据集中在2023-2026年，从以模型为中心的Atari世界模型转向驾驶、机器人及开放式基准。
  - 开放问题：一致性代理指标与下游决策的一致性，以及任务覆盖、局限性报告和实现稳定性仍然不明确。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared navigation or video-action tasks for measuring
        world-model spatial consistency, memory consistency, and action control across
        scenes.
      what_remains_open: Coverage is limited to selected environments such as Minecraft
        or a few robotic scenes, and deployment extrapolation beyond these distributions
        remains unverified.
    - line: Metric and stress-test design
      what_it_solves: Introduces consistency and controllability probes such as scene-graph
        consistency and memory/action evaluation beyond aggregate visual fidelity.
      what_remains_open: Proxy metrics have not been shown to align with downstream
        decision utility or long-horizon policy quality.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared suites such as Atari 100k, CARL, and NuScenes/OpenDV-2K/Waymo
        to make world-model and policy results more comparable.
      what_remains_open: Many works lack limitation details, and conclusions remain
        sensitive to implementation choices, compute budgets, and benchmark versions.
    consensus:
    - World-model evaluation is shifting from frame prediction or aggregate return
      scores toward measuring consistency and controllability under action-conditioned
      generation.
    - Public datasets and reproducible evaluation artifacts are treated as necessary
      for comparable world-model benchmarking.
    - Visual generation quality alone is insufficient to validate world models; evaluation
      usually includes downstream policy or control performance.
    disagreements:
    - One line evaluates spatial or memory consistency in open-domain video, while
      another evaluates policy returns on game or driving benchmarks; the split is
      whether the evaluation target is generative consistency or decision utility.
    - 'Representations differ: diffusion-based video generation, transformer-VAE world
      models, recurrent state-space models, and physics-informed keypoint-depth training
      make distinct fidelity, efficiency, and controllability trade-offs.'
    - 'Supervision and coverage differ: some rely on action-free or action-coupled
      video, others assume observable context values; task domains range from Atari
      and CARL to Minecraft and robotic scenes.'
    open_questions:
    - Do spatial consistency and memory consistency metrics predict downstream robotic
      or driving policy success?
    - How stable are leaderboard conclusions across implementation details, compute
      budgets, and dataset versions when many method papers report no limitations?
    - What task distributions and action spaces are required to expose long-horizon
      memory and cross-action-space generalization failures?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的导航或视频-动作任务，以衡量世界模型的空间一致性、记忆一致性与动作控制。
      尚未覆盖: 现有场景和动作空间覆盖有限，主要集中于Minecraft或少数量机器人场景，部署外推证据不足。
    - 路线: 指标与压力测试设计
      解决的问题: 引入场景图一致性、记忆/动作控制等探针，以超越聚合视觉保真度评估。
      尚未覆盖: 这些代理指标与下游决策效用或长期策略质量之间的一致性尚未验证。
    - 路线: 可比基线与报告规范
      解决的问题: 采用Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo等共享基准与基线，使结果可比较。
      尚未覆盖: 许多工作缺少局限性说明，结论对实现细节、算力预算和基准版本的敏感性仍不清晰。
    共识:
    - 世界模型评估正从单帧预测或聚合奖励分数转向衡量动作条件下的空间/记忆一致性与可控性。
    - 公开数据集和可复现评估工件被视为构建可比较基准的必要条件。
    - 视觉生成质量不足以单独验证世界模型，评估通常包含下游策略或控制表现。
    分歧:
    - 一条路线评估开放域视频中的空间或记忆一致性，另一条评估游戏或驾驶基准上的策略回报，评测目标在生成一致性与决策效用之间存在分歧。
    - 表示方式存在差异：扩散视频生成、Transformer-VAE世界模型、循环状态空间模型以及物理信息关键点/深度训练各有保真度、效率和可控性取舍。
    - 监督信号与评估覆盖不同：一部分依赖动作耦合或无动作视频，另一部分假设上下文可观测；任务域从Atari、CARL延伸到Minecraft和机器人场景。
    开放问题:
    - 空间一致性和记忆一致性指标能否预测下游机器人或驾驶策略成功率？
    - 在大量方法论文未报告局限性的情况下，排行榜结论对实现细节、算力预算和数据集版本有多稳定？
    - 需要什么样的任务分布和动作空间来暴露长时记忆一致性与跨动作空间泛化失败？
