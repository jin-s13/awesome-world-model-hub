  related_work_outline_zh:
  - 主流方向：构建面向自动驾驶、机器人和游戏类环境的交互式世界模型模拟器与评测基准，强调动作可控生成和闭环使用。
  - 研究共性：用动作或上下文条件化生成式或循环预测模型，并围绕视觉保真度、动作忠实度、空间一致性、物理合理性或下游策略回报进行评测。
  - 关键差异：训练表示不同，包括循环Dreamer式模型、带动作模块的预训练视频生成式模型和物理信息视频模型；评测目标与交互模式也不同。
