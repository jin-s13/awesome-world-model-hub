  related_work_outline:
  - 'Mainstream direction: Generative action-conditioned world modeling is dominant
    in the packet, especially video diffusion or transformer architectures for driving
    and robotics, with latent-dynamics model-based RL as a second route.'
  - 'Shared research pattern: Most works learn dynamics through self-supervised future
    prediction or reconstruction, then evaluate via downstream policy learning, video
    planning, or consistency benchmarks.'
  - 'Key differences: Representation ranges from latent state-space rollouts to pixel-space
    video diffusion; supervision uses context, language primitives, physics auxiliary
    tasks, or masks; evaluation targets Atari, CARL, driving, robot, and Minecraft-style
    settings.'
  - 'Trend evolution: The packet''s top evidence clusters in 2023-2026, showing a
    shift from compact recurrent/VAE world models toward large video diffusion models
    pretrained on robot or driving data, plus new memory/action-consistency benchmarks.'
  - 'Open questions: Whether reported gains isolate the model from planner/system
    choices; whether consistency metrics predict control success; and how contextual,
    compositional, or physics-informed methods transfer beyond tested environments.'
  related_work_outline_zh:
  - 主流方向：动作条件生成式世界建模在证据包中占主导，尤其是面向驾驶和机器人的视频扩散或Transformer架构；潜在动力学模型基强化学习是第二条路线。
  - 研究共性：多数研究通过自监督未来预测或重建学习动力学，再通过下游策略学习、视频规划或一致性基准进行评估。
  - 关键差异：表示从潜在状态空间推演到像素空间视频扩散；监督信号包括上下文、语言原语、物理辅助任务或掩码；评测目标覆盖Atari、CARL、驾驶、机器人和Minecraft式场景。
  - 趋势演进：证据包顶部论文集中在2023-2026年，显示从紧凑循环/VAE世界模型转向大规模视频扩散预训练，并出现记忆、动作一致性和空间一致性基准。
  - 开放问题：报告收益是否隔离模型与规划器/系统选择；一致性指标能否预测控制成功；上下文、组合或物理信息方法能否迁移到测试环境之外。
  literature_review:
    line_of_work_matrix:
    - line: Latent dynamics representation and objective design
      what_it_solves: Learning compact stochastic or transformer/VAE dynamics for
        model-based control, where future prediction or reconstruction trains the
        model and imagined rollouts train policies.
      what_remains_open: Transfer of architecture and objective choices beyond Atari,
        CARL, or specific driving/robot datasets is not established; missing limitation
        details in the packet leave failure boundaries unclear.
    - line: Action-conditioned video generation and unified diffusion interfaces
      what_it_solves: Coupling visual futures with actions or goals to generate video
        plans, enable policy learning, and pretrain on large robot or driving datasets.
      what_remains_open: It remains unclear how much of the reported benefit comes
        from diffusion timestep design, dataset scale, or policy coupling rather than
        the learned dynamics itself.
    - line: Compositional and physics-informed generation
      what_it_solves: Using language-primitive factorization, context conditioning,
        depth prediction, or keypoint dynamics to improve generalization and physical
        plausibility.
      what_remains_open: Generalization to unseen primitives, unobserved contexts,
        or real-world physics is limited or not yet verified in the packet.
    - line: Consistency and memory evaluation protocols
      what_it_solves: Quantifying spatial consistency, memory consistency, and action
        control in generated video, moving evaluation beyond short-horizon visual
        fidelity.
      what_remains_open: Reported metrics are dataset- or scene-specific, and the
        packet does not yet connect them to downstream control success across environments.
    consensus:
    - World models are trained mainly with self-supervised future prediction or reconstruction
      objectives.
    - Generated futures are assessed for visual fidelity and downstream control or
      policy utility, though metric choices differ.
    - Recent work treats action conditioning or action generation as central for embodied
      world models.
    - Long-horizon consistency and generalization are shared targets beyond short-frame
      quality.
    disagreements:
    - 'Representation: some methods use latent state-space rollouts, while others
      generate pixel-space video with diffusion.'
    - 'Supervision: approaches condition on observable context, language-derived primitives,
      physics auxiliary targets such as depth or keypoints, or mask reconstruction.'
    - 'Evaluation target: model-based RL benchmarks, driving video prediction, robot
      manipulation data, and Minecraft-style consistency benchmarks emphasize different
      capabilities.'
    - 'Interaction mode: some train policies inside imagined rollouts, others synthesize
      video plans, and others couple action and video diffusion within one transformer.'
    open_questions:
    - Do reported world-model gains isolate the model from the planner, controller,
      task context, dataset scale, or metric selection?
    - Can memory, spatial, and action-control consistency metrics predict downstream
      control success in unseen environments?
    - How do compositional, contextual, or physics-informed models behave under unseen
      primitives, unobserved context, or real-world dynamics?
    - What additional evidence is needed when the packet lacks limitation, failure-analysis,
      or ablation details for several methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 潜在动力学表示与目标设计
      解决的问题: 学习紧凑随机或Transformer/VAE动力学，以未来预测或重建训练模型，并在想象轨迹中训练控制策略。
      尚未覆盖: 架构和目标选择能否迁移到Atari、CARL或特定驾驶/机器人数据之外尚未证实；证据包缺少限制说明，失败边界不明。
    - 路线: 动作条件视频生成与统一扩散接口
      解决的问题: 将视觉未来与动作或目标耦合，生成视频计划、支持策略学习，并在大规模机器人或驾驶数据上预训练。
      尚未覆盖: 报告收益有多少来自扩散时间步设计、数据规模或策略耦合，而不是学到的动力学本身，仍不清楚。
    - 路线: 组合与物理信息生成
      解决的问题: 利用语言原语分解、上下文条件、深度预测或关键点动力学提高泛化性和物理合理性。
      尚未覆盖: 对未见原语、不可观测上下文或真实世界物理的泛化在证据包中有限或未验证。
    - 路线: 一致性与记忆评测协议
      解决的问题: 量化生成视频中的空间一致性、记忆一致性和动作控制，使评测超越短时域视觉保真度。
      尚未覆盖: 指标依赖数据集或场景，证据尚未显示其能跨环境预测下游控制成功。
    共识:
    - 世界模型主要通过自监督未来预测或重建目标训练。
    - 生成未来同时关注视觉保真度和下游控制或策略效用，但指标选择不一致。
    - 近期工作把动作条件或动作生成视为具身世界模型的核心。
    - 长时域一致性和泛化是超越短期帧质量的共同目标。
    分歧:
    - 表示方式：有的使用潜在状态空间推演，有的使用扩散生成像素空间视频。
    - 监督信号：分别依赖可观测上下文、语言派生原语、深度或关键点等物理辅助目标，或掩码重建。
    - 评测目标：基于模型的强化学习、驾驶视频预测、机器人操作数据和Minecraft式一致性基准强调不同能力。
    - 交互模式：有的在想象轨迹中训练策略，有的合成视频计划，有的在单个Transformer中耦合动作与视频扩散。
    开放问题:
    - 报告的世界模型收益是否隔离了模型与规划器、控制器、任务上下文、数据规模或指标选择的影响？
    - 记忆、空间和动作控制一致性指标能否预测未见环境中的下游控制成功率？
    - 组合、上下文或物理信息模型在未见原语、不可观测上下文或真实世界动力学下表现如何？
    - 当证据包缺少多个方法的局限性、失败分析或消融细节时，还需要哪些额外证据？
