  related_work_outline:
  - 'Mainstream direction: The topic concentrates on domain-specific world models
    for driving, robotics, and reinforcement-learning environments, using generative
    video or latent dynamics with action or context conditioning to predict futures
    and support policy learning.'
  - 'Shared research pattern: Methods combine self-supervised generation or reconstruction
    with auxiliary signals such as mask reconstruction, depth, keypoint dynamics,
    language primitives, or action diffusion, then evaluate on domain benchmarks for
    visual fidelity, consistency, and policy transfer.'
  - 'Key differences: Representations vary among diffusion transformers, recurrent
    state-space models, and transformer-VAEs; supervision ranges from action-free
    video to context-conditioned RL, language-primitive generation, and unified action-video
    diffusion; evaluation settings span driving, robot, Atari, and open-world benchmarks.'
  - 'Trend evolution: From 2023 sample-efficient Atari world models through 2024 contextual
    and compositional embodied models, the frontier is moving toward 2025-2026 unified
    video-action diffusion and explicit benchmarks for memory, spatial consistency,
    and action control.'
  - 'Open questions: Cross-domain and real-world transfer remains underevidenced;
    long-horizon memory consistency, novel primitive generalization, partial observability,
    and simulator-to-real safety alignment need validation; several papers lack detailed
    limitations and reproducible artifact evidence.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和强化学习环境的领域专属世界模型，以生成视频或潜在动力学配合动作或上下文条件，预测未来并支持策略学习。
  - 研究共性：以自监督生成或重建为基础，引入掩码重建、深度、关键点动力学、语言原语或动作扩散等辅助信号，并在领域基准上评测视觉保真、一致性和策略迁移。
  - 关键差异：表示方式涵盖扩散Transformer、循环状态空间模型和Transformer-VAE；监督信号从无动作视频到上下文强化学习、语言原语生成和统一动作-视频扩散；评测场景涉及驾驶、机器人、Atari和开放世界基准。
  - 趋势演进：从2023年Atari样本高效世界模型到2024年上下文与组合式具身模型，前沿正在转向2025-2026年统一视频-动作扩散以及记忆、空间一致性和动作控制的显式基准。
  - 开放问题：跨域与真实环境迁移证据不足；长时记忆一致性、新原语泛化、部分可观测性和仿真到真实安全对齐仍需验证；多篇论文缺少详细局限性与可复现工件信息。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and multi-view video generation
      what_it_solves: Uses world models for long-horizon and multi-view driving scene
        prediction; one representative direction combines MAE-style mask reconstruction
        with diffusion transformers and evaluates on nuScenes, OpenDV-2K, and Waymo.
      what_remains_open: Evidence does not yet connect improved driving video prediction
        to real-world safety or operational outcomes; long-horizon and zero-shot cross-dataset
        results need broader validation.
    - line: Embodied robot imagination and policy learning
      what_it_solves: Generates robot video plans or imagined trajectories for policy
        training and evaluation; representative approaches include language-primitive
        decomposition, physics-informed depth and keypoint dynamics, and unified video-action
        diffusion.
      what_remains_open: Generalization beyond seen primitive combinations; transfer
        from simulation or video generation to real robot execution; whether action-free
        video pretraining leads to robust real-world policies.
    - line: Model-based reinforcement learning in interactive tasks
      what_it_solves: Learns latent or stochastic environment models to improve sample
        efficiency and zero-shot generalization in contextual or visual control tasks;
        representative work improves Atari 100k efficiency and conditions Dreamer-style
        models on observable context.
      what_remains_open: Assumptions of observable context limit partially observable
        settings; contextual evaluation is narrow, leaving broader task and embodiment
        generalization unverified; scaling beyond discrete visual benchmarks needs
        evidence.
    - line: Spatial, memory, and action-consistency benchmarking
      what_it_solves: Quantifies world model consistency under closed-loop or loop-based
        navigation; representative benchmarks measure Minecraft spatial consistency
        via scene graph scores and evaluate memory consistency and action control
        across diverse scenes.
      what_remains_open: One benchmark abstract reports no experimental results, so
        baseline behavior remains a verification gap; whether benchmark scores predict
        downstream policy quality or real-world performance is not shown.
    consensus:
    - Domain applications converge on generative or predictive environment models
      that condition on actions, context, or language and are trained with self-supervised
      reconstruction plus auxiliary losses.
    - Evaluation emphasizes long-horizon future generation, zero-shot or unseen-condition
      generalization, visual plausibility, and consistency rather than only one-step
      prediction error.
    - Robotics and driving work treats video generation as a substrate for policy
      learning, planning, or evaluation, while game and reinforcement-learning work
      treats imagined trajectories as training data for policies.
    - 'Reproducibility evidence is partial: several papers provide code or dataset
      signals, but limitations and cross-institution real-world validation are frequently
      missing.'
    disagreements:
    - Representation choices split among recurrent state-space models, transformer-based
      variational autoencoders, and diffusion transformers with or without physics
      auxiliary tasks.
    - 'Supervision differs: action-free video generation, action-conditioned diffusion,
      language-primitive decomposition, context-conditioned latent dynamics, and mask
      reconstruction objectives reflect different assumptions about available labels.'
    - Evaluation settings range from driving video benchmarks and robot simulation
      or datasets to Atari 100k and open-world Minecraft or MIND consistency tests,
      making direct comparison across approaches difficult.
    - 'Deployment assumptions differ: some methods require observable context or a
      finite primitive vocabulary, while others assume shared action spaces or simulated
      evaluation, leaving real-world transfer unresolved.'
    open_questions:
    - Do improvements in driving or robot video prediction transfer to safer or more
      reliable real-world operation and policy learning?
    - Can embodied world models generalize to entirely novel primitives, embodiments,
      or action spaces rather than only combinations of seen training primitives?
    - Do memory and spatial consistency benchmarks predict long-horizon closed-loop
      control quality or downstream task success?
    - How should world models handle partially observable or action-free real-world
      data without explicit context labels or controlled benchmark action spaces?
    - What missing limitations, baselines, and artifact details are needed to verify
      the current evidence, especially for benchmark-only claims?
