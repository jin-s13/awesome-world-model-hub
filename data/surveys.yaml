  related_work_outline:
  - 'Mainstream direction: deploying world models in domain applications such as robotics,
    autonomous driving, and interactive games, with a focus on video generation, action
    prediction, and policy learning under domain-specific constraints.'
  - 'Shared research pattern: leveraging generative sequence models (diffusion, transformers)
    to learn environment dynamics from visual or multimodal data, enabling future
    state prediction and downstream decision-making.'
  - 'Key differences: the application domain dictates the required action space, physical
    fidelity, and interaction mode; works differ in whether they prioritize visual
    generation quality, control policy learning, or memory and spatial consistency.'
  - 'Trend evolution: from early RL-based world models in simple games (Atari) around
    2018–2023 to recent 2024–2025 works tackling complex robotics, driving, and compositional
    video generation, with increasing emphasis on physical plausibility and unified
    multimodal pretraining.'
  - 'Open questions: cross-domain generalization across embodiments and environments,
    long-term memory and spatial consistency, alignment between simulated gains and
    real-world safety, and the lack of standardized benchmarks for complex open-domain
    tasks.'
  related_work_outline_zh:
  - 主流方向：将世界模型部署到机器人、自动驾驶和交互游戏等领域应用中，侧重于在领域特定约束下进行视频生成、动作预测和策略学习。
  - 研究共性：利用生成式序列模型（扩散、Transformer）从视觉或多模态数据中学习环境动态，实现未来状态预测和下游决策。
  - 关键差异：应用领域决定了所需动作空间、物理保真度和交互模式；工作之间的差异在于优先考虑视觉生成质量、控制策略学习还是记忆与空间一致性。
  - 趋势演进：从2018–2023年早期在简单游戏（Atari）中基于RL的世界模型，发展到2024–2025年应对复杂机器人、驾驶和组合视频生成的最新工作，越来越强调物理合理性和统一多模态预训练。
  - 开放问题：跨本体和环境的泛化能力、长期记忆和空间一致性、仿真收益与真实安全之间的对齐，以及复杂开放域任务缺乏标准化基准。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: adapting world models to robotic and embodied tasks by incorporating
        language for compositional planning, physics-informed dynamics, unified video-action
        diffusion, and context conditioning for zero-shot generalization.
      what_remains_open: generalization to unseen embodiments, sensors, and physical
        environments; real-world deployment validation; and the sufficiency of physics
        priors for complex interactions.
    - line: Autonomous driving and simulation use cases
      what_it_solves: long-horizon, multi-view video prediction for driving scenes,
        enabling scene forecast, closed-loop simulation, and zero-shot transfer across
        datasets using masked diffusion transformers.
      what_remains_open: alignment between simulated prediction quality and real-world
        safety or operational metrics; robustness to rare events and corner cases
        in diverse driving conditions.
    - line: Interactive agents and games
      what_it_solves: efficient world model training for game-playing agents under
        limited data, and evaluation of spatial consistency and action-controlled
        memory in open-world environments like Minecraft.
      what_remains_open: maintaining long-term memory consistency across extended
        trajectories; generalization when environment rules, goals, or action spaces
        change; transitioning from benchmark performance to general agent capabilities.
    consensus:
    - World models are predominantly built on generative architectures such as diffusion
      transformers and variational autoencoders to predict future states or videos.
    - Incorporating additional structural information—context, physics, depth, or
      keypoints—improves generation plausibility and policy generalization.
    - Evaluation is shifting from simple game benchmarks to more complex, open-domain
      tasks, yet standardized metrics for long-term consistency and physical fidelity
      are still emerging.
    disagreements:
    - 'Representation: some works use latent state-space models (e.g., cRSSM) while
      others rely on explicit video diffusion in pixel space.'
    - 'Supervision: approaches differ in whether they use pure visual reconstruction,
      action-conditioned generation, or auxiliary tasks like depth prediction and
      keypoint dynamics.'
    - 'Evaluation target: driving-focused works emphasize multi-view video quality
      and zero-shot dataset transfer, whereas robot-focused works prioritize policy
      robustness and compositional task success.'
    - 'Interaction mode: game and simulation agents often use discrete actions and
      frame-level conditioning, while robotic models deal with continuous action spaces
      and multimodal goal specifications.'
    open_questions:
    - Do improvements in simulated video prediction reliably translate to safer or
      more effective real-world deployment in driving and robotics?
    - How can world models maintain object permanence and spatial consistency over
      long horizons, given evidence from benchmarks like MIND and LoopNav?
    - Can compositional world models generalize to entirely novel primitives not seen
      during training, or are they limited to recombining known concepts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 通过语言组合规划、物理信息动力学、统一视频-动作扩散和上下文条件化，将世界模型适配到机器人及具身任务，实现零样本泛化。
      尚未覆盖: 向未见本体、传感器和物理环境的泛化；真实世界部署验证；物理先验在复杂交互中的充分性。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 驾驶场景下的长时域、多视角视频预测，支持场景预报、闭环仿真和跨数据集零样本迁移，使用掩码扩散Transformer。
      尚未覆盖: 仿真预测质量与真实安全或运营指标之间的对齐；多样化驾驶条件下对罕见事件和边缘情况的鲁棒性。
    - 路线: 交互式智能体与游戏
      解决的问题: 在有限数据下高效训练游戏智能体的世界模型，以及在Minecraft等开放世界环境中评估空间一致性和动作控制记忆。
      尚未覆盖: 在超长轨迹中维持长期记忆一致性；环境规则、目标或动作空间变化时的泛化；从基准性能向通用智能体能力过渡。
    共识:
    - 世界模型主要基于扩散Transformer和变分自编码器等生成式架构来预测未来状态或视频。
    - 融入上下文、物理、深度或关键点等额外结构信息，有助于提升生成合理性和策略泛化。
    - 评估正从简单游戏基准转向更复杂的开放域任务，但针对长期一致性和物理保真度的标准化指标仍在形成中。
    分歧:
    - 表示方式：部分工作使用隐式状态空间模型，另一些依赖像素级的显式视频扩散。
    - 监督信号：方法在纯视觉重建、动作条件生成或辅助任务（如深度预测、关键点动力学）上存在差异。
    - 评测目标：驾驶工作强调多视角视频质量和跨数据集零样本迁移，而机器人工作更关注策略鲁棒性和组合任务成功。
    - 交互模式：游戏和仿真智能体常使用离散动作和帧级条件，而机器人模型处理连续动作空间和多模态目标。
    开放问题:
    - 在驾驶和机器人领域，仿真视频预测的改进能否可靠地转化为更安全、更有效的真实世界部署？
    - 基于MIND和LoopNav等基准暴露的证据，世界模型如何在长时域中保持物体持久性和空间一致性？
    - 组合世界模型能否泛化到训练中未见过的新原语，还是仅限于重新组合已知概念？
