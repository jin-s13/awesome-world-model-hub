  related_work_outline:
  - 'Mainstream direction: Recent method work concentrates on generative world models,
    especially diffusion/Transformer architectures for video prediction and model-based
    RL, with action or context conditioning for downstream control.'
  - 'Shared research pattern: Papers learn dynamics from visual/action sequences through
    self-supervised or generative objectives, then use the learned model for policy
    training, video planning, or capability evaluation.'
  - 'Key differences: They differ in supervision signals (pixel, mask features, depth/keypoint,
    action-video diffusion), evaluation targets (Atari/CARL, driving, robotic video,
    memory/action benchmarks), and interaction mode (open-loop, imagined rollouts,
    closed-loop).'
  - 'Trend evolution: From 2023 stochastic Transformer model-based RL to 2024-2025
    contextual, compositional, physics-informed, and unified action-video world models;
    2025-2026 adds memory and spatial consistency benchmarks. Evidence is concentrated
    at the current frontier.'
  - 'Open questions: How to isolate architecture versus data or planner contributions,
    maintain long-horizon consistency, and transfer to unseen control settings; benchmarks
    reveal these gaps but not yet solutions.'
  related_work_outline_zh:
  - 主流方向：方法工作集中在生成式世界模型，尤其是用于视频预测和基于模型强化学习的扩散/Transformer架构，并通过动作或上下文条件化服务于下游控制。
  - 研究共性：论文从视觉/动作序列中通过自监督或生成目标学习动力学，再用所学模型进行策略训练、视频规划或能力评测。
  - 关键差异：监督信号、评测目标和交互方式不同；包括像素、掩码特征、深度/关键点、动作-视频扩散，以及开环、想象轨迹和闭环控制。
  - 趋势演进：从2023年随机Transformer基于模型的强化学习，发展到2024-2025上下文、组合、物理信息和统一动作-视频世界模型；2025-2026新增记忆与空间一致性基准，证据集中在当前前沿。
  - 开放问题：如何隔离架构、数据与规划器贡献，维持长时域一致性并迁移到未见控制场景；基准揭示了缺口但尚未给出解决方案。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic and contextual latent dynamics for model-based RL
      what_it_solves: Turns visual observations into latent state-space dynamics for
        sample-efficient policy learning; contextual variants such as cRSSM improve
        zero-shot generalization when task parameters change.
      what_remains_open: Assumes context values are observable; evaluation is limited
        to two CARL tasks for cRSSM and Atari 100k for STORM; architecture contribution
        versus task prior is not isolated.
    - line: Masked and diffusion video world models for driving/embodied prediction
      what_it_solves: Uses Diffusion Transformers with mask reconstruction or multi-view
        loss for long-horizon and zero-shot video prediction in driving scenes, as
        in MaskGWM.
      what_remains_open: Mostly open-loop visual fidelity evidence; closed-loop planning
        effect is not isolated; limitation details are absent from the packet.
    - line: Compositional and physics-informed video world models for robot imagination
      what_it_solves: Decomposes language instructions into primitives or adds depth/keypoint
        losses to improve compositional and physical plausibility of synthesized robotic
        video.
      what_remains_open: Generalization is limited to seen primitive combinations;
        physics losses are not fully ablated for policy utility; evidence is largely
        simulation-based.
    - line: Unified action-video diffusion interfaces
      what_it_solves: Couples action and video diffusion in one transformer so policy,
        forward/inverse dynamics, and video generation share parameters; can use action-free
        video for pretraining.
      what_remains_open: Action diffusion and video diffusion contributions are not
        isolated; long-horizon closed-loop behavior and real-robot transfer remain
        unverified.
    - line: Spatial/memory/action consistency benchmarks
      what_it_solves: Provides loop navigation or 1080p video datasets and metrics
        such as scene graph consistency or memory/action consistency to evaluate persistent
        world state beyond pixel error.
      what_remains_open: LoopNav's abstract reports no experimental results; metric
        sensitivity and whether benchmark gains improve downstream methods are not
        yet shown.
    consensus:
    - Several methods replace or augment purely deterministic video prediction with
      stochastic, contextual, or diffusion objectives over visual and action sequences.
    - Work converges on conditioning world models with action, context, or language
      to make generated futures controllable and task-relevant.
    - Evidence is reported on standardized settings such as Atari 100k, CARL, NuScenes/OpenDV-2K/Waymo,
      RT-X, or dedicated consistency benchmarks.
    - 'Reproducibility signals are partial: some works provide code/datasets or links,
      but many limitation and attribution analyses are empty or not isolated in the
      packet.'
    disagreements:
    - 'Supervision signal: pixel-level video generation versus feature-level mask
      reconstruction versus depth/keypoint physics versus joint action-video diffusion.'
    - 'Evaluation target: sample-efficient game policy performance versus driving
      video long-horizon/zero-shot versus robotic video fidelity versus memory/action
      consistency.'
    - 'Interaction mode: open-loop generation, policy training on imagined trajectories,
      or closed-loop action-controlled generation.'
    - 'Representation: compact latent state-space, diffusion transformer, compositional
      primitive set, or unified action-video token sequence.'
    - 'Deployment setting: Atari/CARL simulation, driving scenes, robotic simulation,
      or Minecraft/open-domain video.'
    open_questions:
    - Can current world models maintain long-term spatial/temporal consistency under
      closed-loop control, as MIND and LoopNav probe but existing methods do not yet
      solve?
    - How much of downstream improvement comes from the generative/dynamics objective
      versus data scale, baselines, and metric choices, especially where limitations
      are unreported?
    - Do compositional, physics-informed, and unified action-video formulations transfer
      to unseen primitives, real robots, and broader action spaces beyond training
      distribution?
    - Which evaluation signals beyond visual fidelity best predict policy learning,
      planning robustness, and zero-shot generalization?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向基于模型强化学习的随机与上下文潜在动力学
      解决的问题: 将视觉观测转化为潜在状态空间动力学，以支持样本高效策略学习；上下文变体如cRSSM在任务参数变化时改善零样本泛化。
      尚未覆盖: 假设上下文可观测；cRSSM仅在CARL两个任务上验证，STORM主要在Atari 100k上；架构贡献与任务先验未隔离。
    - 路线: 用于驾驶/具身预测的掩码与扩散视频世界模型
      解决的问题: 利用扩散Transformer和掩码重建或多视角损失进行长时域和零样本视频预测，如MaskGWM。
      尚未覆盖: 多为开环视觉质量证据；对下游规划的闭环作用未隔离；证据包中局限说明缺失。
    - 路线: 面向机器人想象的组合与物理信息视频世界模型
      解决的问题: 将语言指令分解为原语或加入深度/关键点损失，提高合成机器人视频的组合性与物理合理性。
      尚未覆盖: 仅支持训练见过的原语组合；物理损失对策略效用的贡献未充分消融；证据主要在仿真。
    - 路线: 统一动作-视频扩散接口
      解决的问题: 在单个Transformer中耦合动作与视频扩散，使策略、前向/逆向动力学和视频生成共享参数，并利用无动作视频预训练。
      尚未覆盖: 动作扩散与视频扩散的贡献未隔离；长时域闭环行为与真实机器人迁移仍未验证。
    - 路线: 空间/记忆/动作一致性基准
      解决的问题: 提供循环导航或1080p视频数据集与指标，如场景图一致性或记忆/动作一致性，以评测超越像素误差的持续世界状态。
      尚未覆盖: LoopNav摘要未报告实验结果；指标敏感性以及基准提升能否改善下游方法尚未展示。
    共识:
    - 多种方法开始用随机、上下文或扩散目标替代或补充纯确定性视频预测，建模视觉与动作序列。
    - 工作集中在用动作、上下文或语言条件化世界模型，使生成未来可控并服务于任务。
    - 证据多基于标准化设置，如Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo、RT-X或专用一致性基准。
    - 复现信号不完整：部分工作提供代码/数据集，但很多局限性和归因分析在证据包中为空或未隔离。
    分歧:
    - 监督信号：像素级视频生成、特征级掩码重建、深度/关键点物理损失或动作-视频联合扩散。
    - 评测目标：样本高效游戏策略、驾驶视频长时域/零样本、机器人视频质量或记忆/动作一致性。
    - 交互模式：开环生成、基于想象轨迹的策略训练或闭环动作控制生成。
    - 表示方式：紧凑潜在状态空间、扩散Transformer、组合原语或统一动作-视频token序列。
    - 部署场景：Atari/CARL仿真、驾驶场景、机器人仿真或Minecraft/开放域视频。
    开放问题:
    - 当前世界模型能否在闭环控制下维持长期空间/时间一致性？MIND和LoopNav提出了探测，但现有方法尚未解决。
    - 下游改进有多少来自生成/动力学目标，有多少来自数据规模、基线和指标选择，尤其在局限未报告之处？
    - 组合、物理信息与统一动作-视频方法能否迁移到未见原语、真实机器人和更广动作空间？
    - 除了视觉质量，哪些评测信号最能预测策略学习、规划稳健性和零样本泛化？
