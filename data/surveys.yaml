  related_work_outline_zh:
  - 主流方向：世界模型被应用于具身智能体、自动驾驶和交互游戏，主要通过视频生成和潜在动力学建模实现规划、策略学习和仿真。
  - 研究共性：多数工作采用生成框架（扩散或VAE）预测基于动作的未来观测，并在领域基准或定制数据集上评估。
  - 关键差异：各方法在物理信息、上下文和动作模态的整合方式上不同；有的强调组合泛化，有的追求高效训练或统一视频-动作扩散，而评估目标从视觉保真度扩展到记忆一致性。
  - 趋势演进：2023至2026年，前沿从高效模型强化学转向大规模机器人数据集预训练，同时涌现出评估空间和记忆一致性的专用基准。
  - 开放问题：长时域物理合理性与记忆保持、跨本体和仿真到现实的迁移，以及离线指标与真实安全运营结果的一致性仍未验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robotic world models for video planning and policy learning
      what_it_solves: Generating action-conditioned video forecasts and learning policies
        from visual and language inputs to support robot task execution and imagination.
      what_remains_open: Real-world execution beyond simulation, scalable compositional
        generalization to unseen primitives, and physical plausibility guarantees
        remain unverified; context observability assumptions limit applicability.
    - line: Autonomous driving world models for scene simulation
      what_it_solves: Multi-view, long-horizon driving scene prediction with diffusion
        models and mask reconstruction, enabling zero-shot transfer across driving
        datasets.
      what_remains_open: Correlation between simulation improvements and real-world
        driving safety or operational metrics is not established; domain shift beyond
        the tested datasets is unexplored.
    - line: Interactive world model benchmarks and evaluation frameworks
      what_it_solves: Quantifying memory consistency, spatial coherence, and action
        controllability in open-domain environments through curated datasets and metrics.
      what_remains_open: Benchmark coverage across diverse model architectures and
        environments is limited; standardization of evaluation protocols for long-term
        memory and action generalization is still missing.
    consensus:
    - World models for application benefit from generative architectures that jointly
      model observations and actions across multiple modalities.
    - Simulation and game-based benchmarks are the primary testbeds, with evaluation
      focused on generation quality, task success, or consistency metrics.
    - Pretraining on large-scale domain datasets improves generalization, but the
      evaluation of downstream policy performance is often decoupled from the world
      model training.
    disagreements:
    - 'Representation of actions: some models couple video and action diffusion in
      a unified transformer, while others treat action as a controllable condition
      for separate video generation.'
    - 'Physics integration: works like RoboScape explicitly enforce physical knowledge
      through depth and keypoint dynamics, whereas others rely solely on data-driven
      generation without explicit physics constraints.'
    - 'Evaluation targets: some prioritize visual fidelity and FVD, others focus on
      policy robustness or memory consistency, and benchmarks like MIND and LoopNav
      introduce new metrics that are not yet standard across the field.'
    - 'Generalization scope: compositional generalization to unseen command combinations
      is tackled via language factorization, while other methods target zero-shot
      dynamics transfer via context variables, highlighting different assumptions
      about what changes across deployment scenarios.'
    open_questions:
    - Can world models trained on robot datasets transfer reliably to real-world embodiments
      without fine-tuning, given the limited evidence of physical execution?
    - How should long-horizon memory and physical plausibility be measured and guaranteed
      in open-domain video generation, as current benchmarks only begin to address
      these?
    - What is the minimal set of evaluation protocols needed to close the gap between
      offline world model scores and real-world task performance in autonomous driving
      and robotics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人世界模型用于视频规划与策略学习
      解决的问题: 生成以动作为条件的视频预测，并从视觉和语言输入中学习策略，以支持机器人任务执行与想象。
      尚未覆盖: 除仿真外的真实世界执行、对未见原语的可扩展组合泛化以及物理合理性保证仍未验证；上下文可观测性假设限制了适用范围。
    - 路线: 自动驾驶世界模型用于场景仿真
      解决的问题: 利用扩散模型和掩码重建实现多视图、长时域驾驶场景预测，并支持跨驾驶数据集的零样本迁移。
      尚未覆盖: 仿真改进与真实驾驶安全或运营指标之间的关联尚未建立；测试数据集之外的域漂移未探索。
    - 路线: 交互式世界模型基准与评估框架
      解决的问题: 通过精心设计的数据集和指标，量化开放域环境中世界模型的记忆一致性、空间连贯性和动作可控性。
      尚未覆盖: 基准对多样化模型架构和环境的覆盖有限；长期记忆和动作泛化评估的标准化协议仍缺失。
    共识:
    - 应用世界模型倾向于采用生成式架构，联合建模多模态的观测和动作。
    - 仿真和基于游戏的基准是主要测试平台，评估围绕生成质量、任务成功率或一致性指标展开。
    - 在大规模领域数据集上预训练能提升泛化能力，但下游策略性能的评估往往与世界模型训练解耦。
    分歧:
    - 动作表示：部分模型在统一Transformer中耦合视频与动作扩散，其他则将动作作为可控条件注入独立的视频生成。
    - 物理信息整合：RoboScape等通过深度和关键点动力学显式施加物理约束，而其他方法仅依赖数据驱动生成，无显式物理约束。
    - 评估目标：有的侧重视觉保真度和FVD，有的关注策略鲁棒性或记忆一致性，MIND和LoopNav等基准引入的新指标尚未成为领域标准。
    - 泛化范围：通过语言分解实现对新指令组合的组合泛化，而另一些方法通过上下文变量实现零样本动力学迁移，反映了对部署场景变化的不同假设。
    开放问题:
    - 在缺乏真实物理执行证据的情况下，基于机器人数据集训练的世界模型能否不经微调可靠地迁移到真实本体？
    - 随着当前基准刚刚开始解决这些问题，如何在开放域视频生成中衡量和保证长时域记忆与物理合理性？
    - 需要哪些最小评估协议来弥合自动驾驶和机器人领域离线世界模型评分与真实世界任务性能之间的差距？
