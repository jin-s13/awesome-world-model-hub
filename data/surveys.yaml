    - What evaluation protocol should jointly capture spatial consistency, action
      fidelity, physical plausibility, and downstream planning value without overfitting
      to pixel-level metrics?
    - How stable are long-horizon closed-loop rollouts when models consume their own
      predictions, and when does degradation become unsafe for planning or policy
      training?
    - Can claimed single-GPU latency be preserved under multi-GPU, multi-agent, or
