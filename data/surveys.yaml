  - 趋势演进：可见论文集中在2023-2026年，趋势属于当前前沿；2023年Atari高效世界模型强化学习，2024年上下文与组合机器人模型，2025-2026年驾驶/机器人视频生成及记忆-动作基准。
  - 开放问题：跨本体与跨领域泛化、长时记忆一致性、真实安全迁移、可复现基准覆盖，以及医疗与科学仿真等未被充分覆盖的领域仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon video prediction
      what_it_solves: Generates future driving scenes for simulation and policy evaluation,
        including long-horizon rollout and multi-view prediction.
      what_remains_open: Alignment between simulated video quality and real-world
        safety or operational outcomes, and zero-shot transfer across different driving
        datasets, remains underevidenced.
    - line: Embodied robot world models for visual policy and dynamics
      what_it_solves: Learns robot video generation, physical plausibility, and coupled
        action-video dynamics to support policy training or evaluation.
      what_remains_open: Generalization to unseen language primitives, new embodiments,
        and real robot deployment is limited; many results are simulation-based or
        lack visible real-world validation.
    - line: Contextual and sample-efficient model-based reinforcement learning
      what_it_solves: Improves policy learning and zero-shot generalization under
        context variation or limited interaction using world-model imagined trajectories.
      what_remains_open: Assumes observable context values and is evaluated on narrow
        task sets, leaving partially observable or broader real-world settings unverified.
    - line: Memory, spatial consistency, and action-control benchmarks
      what_it_solves: Quantifies long-term memory consistency, spatial coherence,
        and action grounding in open-domain world models.
      what_remains_open: Long-term consistency in revisited scenes, cross-action-space
        generalization, and translation from benchmark scores to improved world-model
        capability remain incomplete.
    consensus:
    - Most systems learn a generative dynamics or video model conditioned on actions,
      language, or context rather than relying only on static perception.
    - Evaluation tends to use domain-specific datasets and metrics such as rollout
      quality, visual fidelity, task success, or consistency scores.
    - Recent work treats world models as reusable components for downstream policy
      training or policy evaluation, not merely frame predictors.
    - Task-specific conditioning, whether through context variables, language primitives,
      physics auxiliary tasks, or action-video coupling, is widely viewed as beneficial
      for generalization.
    disagreements:
    - 'Representation choices differ: masked diffusion tokens, contextual state-space
      models, VAE-Transformer models, compositional primitives, and unified action-video
      diffusion.'
    - Supervision differs across action-free video, paired robot demonstrations, physics
      auxiliary tasks, and context-conditioned imagined rollouts.
    - Evaluation targets differ among driving datasets, robotic manipulation datasets,
      Atari, contextual reinforcement learning suites, and Minecraft or open-domain
      memory benchmarks.
    - 'Interaction mode differs: closed-loop action-conditioned rollout, open-loop
      video generation, or benchmark-based consistency evaluation.'
    open_questions:
    - How well do driving and robot world models transfer from simulations or existing
      datasets to unseen environments, embodiments, and real operational safety?
    - Can current models maintain long-term memory consistency and action control
      in open-domain revisited scenes beyond the current benchmark clips?
    - Do conditioning methods remain reliable when context is partially observed or
      when language primitives are entirely novel?
    - Which evaluation metrics connect visual and dynamics fidelity directly to downstream
      task success or safety outcomes?
    - Healthcare and scientific simulation applications are not represented in the
      bounded top-paper evidence, so transfer to those domains remains an open gap.
    - Some top papers lack visible limitations and some lack external identifiers
      or artifact verification, leaving reproducibility and independent verification
      gaps.
