    - 路线: 基于语言、目标和物理先验的机器人视频生成
      解决的问题: 通过语言原语分解或深度/关键点物理信号合成机器人未来视频，用于规划与策略评估。
      尚未覆盖: 真实机器人泛化、对未见过语言原语的支持、以及跨机器人和场景的物理合理性仍未验证。
    - 路线: 面向大规模机器人数据的统一视频-动作扩散
      解决的问题: 利用模态特定扩散时间步，在统一模型中表示策略、前向或逆动力学或视频生成，并在多任务机器人数据上预训练。
      尚未覆盖: 论文未给出局限性细节；需验证在更大无动作视频数据和真实机器人部署下的鲁棒性。
    - 路线: 高效随机与上下文模型式强化学习
      解决的问题: 学习紧凑潜在动力学或上下文条件世界模型，在想象轨迹中训练策略，提升Atari样本效率或零样本上下文泛化。
      尚未覆盖: 评测范围较窄：一个仅限Atari，另一个仅限两个可观测上下文任务；向更广泛具身任务转移尚未验证。
    - 路线: 交互/开放域世界模型一致性与动作控制基准
      解决的问题: 提供循环导航或可重访视频的数据集和指标，评估空间或记忆一致性以及跨视角、跨动作空间的动作控制。
      尚未覆盖: 基准显示长期一致性和跨动作空间泛化仍然困难；不同模型如何弥合这些缺陷仍缺乏证据。
    共识:
    - 世界模型被当作面向具体领域的可学习仿真器，用于生成未来观测并支撑策略训练、规划或评测。
    - 近期工作普遍采用视频生成、扩散或Transformer类结构，并加入辅助目标来提升多视角、长期或物理一致性。
    - 评估依赖驾驶、机器人、Atari、Minecraft或开放域视频等专用数据和指标，关注可控性和对未见上下文或目标的泛化。
    - 多条路线使用动作、语言、目标图像或上下文等多模态条件，将观测映射到策略或动力学。
    - 多篇论文缺少显式局限性证据，性能结果的范围与边界条件需要以复现和验证缺口的方式看待。
    分歧:
