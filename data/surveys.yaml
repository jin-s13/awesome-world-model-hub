  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video diffusion world models
    for robotic manipulation, with growing emphasis on physical plausibility, alignable
    reward structures, and controllable generation.'
  - 'Shared research pattern: Large-scale pretraining on diverse robot or video datasets,
    coupling video and action modalities in a single architecture, and assessing both
    visual fidelity and downstream task utility.'
  - 'Key differences: Disagreement persists on whether explicit state construction
    is necessary, how to best inject action control, and whether test-time scaling
    or post-training alignment yields more reliable physical consistency.'
  - 'Trend evolution: Work moves from fine-grained action-frame alignment (2024) and
    lightweight adaptation of pretrained models (2024) to unified video-action pretraining
    (2025) and then to reward-based alignment with physics and human preferences (2026),
    accompanied by a recent conceptual taxonomy.'
  - 'Open questions: Can scaling laws be formulated to predict when a world model
    will fail or generalize? How to move from implicit state to explicit state representations
    that support long-term causal reasoning? Which functional benchmarks can replace
    visual-only metrics for physical persistence?'
  related_work_outline_zh:
  - 主流方向：构建面向机器人操作的动作条件化视频扩散世界模型，并越来越强调物理合理性、可对齐的奖励结构和可控生成。
  - 研究共性：在多样化机器人或视频数据集上进行大规模预训练，在单一架构中耦合视频与动作模态，同时评估视觉保真度和下游任务效用。
  - 关键差异：在是否需要显式状态构建、如何最好地注入动作控制，以及测试时缩放与后训练对齐哪条路径能带来更可靠的物理一致性上存在分歧。
  - 趋势演进：从细粒度动作-帧对齐（2024）和预训练模型轻量适配（2024），到统一视频-动作预训练（2025），再到基于奖励的物理与人类偏好对齐（2026），并伴随近期出现概念性分类框架。
  - 开放问题：能否建立可预测世界模型何时失败或泛化的缩放规律？如何从隐式状态过渡到支持长期因果推理的显式状态表示？哪些功能基准可以替代仅关注视觉的指标来评估物理持久性？
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent by coupling video
        and action diffusion within a unified framework (e.g., UWM), and defines action-frame
        alignment conditions for fine-grained manipulation (e.g., IRASim).
      what_remains_open: Current formalizations center on video prediction and action
        conditioning, but they leave the internal state implicit; it is unverified
        whether these assumptions hold under distribution shift or long-horizon dynamics.
    - line: Scaling laws and guarantees
      what_it_solves: Examines whether test-time computation scaling improves spatial
        reasoning in world models, revealing that heuristic verifiers suffer from
        poor calibration and action biases, and introducing structured verifiers like
        ViSA.
      what_remains_open: On MMSI-Bench no verifier achieves consistent scaling, indicating
        an information bottleneck; no predictive scaling law for world-model fidelity
        exists, and reward signals remain unreliable without human annotation.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes video generation as world models into state construction
        (implicit vs. explicit) and dynamics modeling (knowledge integration vs. architectural
        reformulation), and advocates moving evaluation from visual quality to functional
        benchmarks.
      what_remains_open: The taxonomy has not yet been instantiated in a new model
        design or evaluation protocol; causal reasoning and long-term persistence
        remain unmeasured, and the gap between non-stateful video models and classical
        state-space world models is unresolved.
    consensus:
    - A world model intended for decision-making must condition on actions and generate
      future observations, not just static frames.
    - Visual fidelity is necessary but insufficient; physical plausibility and task-oriented
      coherence are critical targets.
    - Large-scale pretraining on diverse embodiments and tasks is a shared strategy
      for improving generalization.
    - Test-time compute or post-training reward signals can refine model behavior,
      but their reliability depends heavily on the reward design.
    disagreements:
    - 'State construction: most video-generation-based world models treat state as
      implicit, while classical theory demands explicit state-space models; whether
      this gap matters for planning is contested.'
    - 'Action injection: some works couple action and video diffusion inside a unified
      transformer, others use learned adapters on frozen pretrained video models,
      and a third line uses masked autoregression, leading to different trade-offs
      in controllability and fidelity.'
    - 'Evaluation target: one group evaluates spatial reasoning and physics via functional
      benchmarks (EZSbench, PBench), while others rely on visual similarity metrics
      and policy correlation, creating a split between appearance and causal correctness.'
    - 'Scaling strategy: test-time scaling is shown to be ineffective on certain benchmarks,
      but some works assume that larger models and more data will naturally yield
      better physical consistency, a claim not yet verified.'
    open_questions:
    - How can we formulate a scaling law that predicts cross-embodiment transfer and
      failure modes of video-based world models?
    - What minimal form of explicit state representation is needed to overcome the
      information bottleneck and enable long-term causal reasoning?
    - Which functional, training-independent benchmarks can replace visual-only metrics
      and isolate physical persistence from short-term appearance quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 通过统一框架（如UWM）耦合视频与动作扩散来明确世界模型必须表示什么，并定义细粒度操作的动作-帧对齐条件（如IRASim）。
      尚未覆盖: 当前形式化以视频预测为中心，保持内部状态隐式化；这些假设在分布偏移或长时域动态下是否成立尚未验证。
    - 路线: 缩放规律与保证
      解决的问题: 探究测试时计算缩放是否提升世界模型的空间推理，揭示启发式验证器存在校准不良和动作偏差，并引入结构化验证器如ViSA。
      尚未覆盖: 在MMSI-Bench上无验证器实现一致缩放，表明存在信息瓶颈；尚无预测世界模型保真度的缩放律，且奖励信号在缺乏人类标注时仍不可靠。
    - 路线: 概念分类与边界
      解决的问题: 将视频生成作为世界模型分类为状态构建（隐式/显式）和动态建模（知识整合/架构重构），并倡导从视觉质量转向功能基准的评估。
      尚未覆盖: 该分类尚未落实为新的模型设计或评估协议；因果推理和长期持久性仍未被衡量，无状态视频模型与经典状态空间世界模型之间的鸿沟尚未弥合。
    共识:
    - 面向决策的世界模型必须以动作为条件并生成未来观测，而非仅生成静态帧。
    - 视觉保真度是必要但不充分的指标，物理合理性和任务导向的一致性才是关键目标。
    - 在多样化本体和任务上进行大规模预训练是提升泛化能力的共同策略。
    - 测试时计算或后训练奖励信号可以改善模型行为，但其可靠性严重依赖奖励设计。
    分歧:
    - 状态构建：多数基于视频生成的世界模型将状态视为隐式，而经典理论要求显式状态空间模型，这一差距对规划是否重要仍存争议。
    - 动作注入：部分工作在一个统一Transformer中耦合动作与视频扩散，另一些使用学习适配器冻结预训练视频模型，还有方法使用掩码自回归，它们在可控性与保真度上存在不同权衡。
    - 评测目标：一组通过功能基准（如EZSbench、PBench）评估空间推理与物理合理性，另一组依赖视觉相似度和策略相关性，造成外观正确与因果正确的目标分裂。
    - 缩放策略：测试时缩放在某些基准上被证明无效，但部分工作假设更大模型与更多数据自然带来更好的物理一致性，这一主张尚未得到验证。
    开放问题:
    - 如何建立能预测跨本体迁移和视频世界模型失败模式的缩放律？
    - 需要何种最小形式的显式状态表示才能克服信息瓶颈并支持长期因果推理？
    - 哪些与训练无关的功能基准可以替代仅关注视觉的指标，并将物理持久性与短期外观质量解耦？
