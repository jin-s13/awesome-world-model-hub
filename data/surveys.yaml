  related_work_outline:
  - 'Mainstream direction: Repurposing video generation models as action-conditioned
    world models for embodied decision-making, with a focus on robotics manipulation
    and autonomous driving.'
  - 'Shared research pattern: Large-scale pretraining on diverse video and action
    data, coupling visual dynamics with control signals, and evaluating through visual
    fidelity or task-specific benchmarks.'
  - 'Key differences: State representation (implicit context vs. explicit latent compression),
    dynamics architecture (diffusion vs. autoregressive), alignment strategy (reward
    modeling vs. DPO), and evaluation protocol (perceptual metrics vs. functional
    benchmarks).'
  - 'Trend evolution: Moving from pure video generation to action-conditioned world
    models, then to physics alignment and test-time scaling, with evaluation shifting
    from visual quality toward physical plausibility and causal reasoning.'
  - 'Open questions: How to build explicit state representations for long-horizon
    persistence and causality; whether test-time scaling can reliably improve reasoning;
    how to generalize alignment beyond contact-rich manipulation; and whether current
    metrics correlate with downstream decision performance.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型重新用作动作条件化的世界模型，用于具身决策，重点关注机器人操作和自动驾驶。
  - 研究共性：在多样化视频和动作数据上进行大规模预训练，将视觉动态与控制信号耦合，并通过视觉保真度或任务特定基准进行评估。
  - 关键差异：状态表示（隐式上下文 vs. 显式潜在压缩）、动态架构（扩散 vs. 自回归）、对齐策略（奖励建模 vs. DPO）以及评估协议（感知指标 vs.
    功能基准）。
  - 趋势演进：从纯视频生成到动作条件化世界模型，再到物理对齐和测试时缩放，评估从视觉质量转向物理合理性和因果推理。
  - 开放问题：如何构建显式状态表示以实现长期持久性和因果性；测试时缩放能否可靠改善推理；如何将对齐泛化到接触丰富操作之外的任务；当前指标是否与下游决策性能相关。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies that world models must construct a state and model
        its dynamics, and identifies a gap between stateless video generators and
        classic world model theories. For example, one survey proposes a taxonomy
        of implicit vs. explicit state construction and knowledge-integrated vs. architecture-reformulated
        dynamics.
      what_remains_open: Whether the proposed formal conditions and taxonomies translate
        into actionable model designs or evaluation protocols that improve physical
        persistence and causal reasoning in practice.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model design choices (diffusion vs. regression, compact
        jump models, test-time verifiers) to expected behavior such as visual fidelity,
        motion magnitude recovery, and spatial reasoning accuracy. One study shows
        diffusion outperforms regression on perceptual metrics and that test-time
        verifiers can correct trajectory-selection biases on some benchmarks.
      what_remains_open: Direct validation that scaling trends predict failures and
        transfers; test-time verifiers exhibit poor calibration and inconsistent scaling
        across benchmarks, revealing an information bottleneck in current world models.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into categories centered
        on state construction (implicit/explicit) and dynamics modeling (knowledge
        integration, architectural reformulation), and advocates for functional benchmarks
        over visual fidelity metrics.
      what_remains_open: Whether the taxonomy changes how researchers evaluate or
        design models; current evaluation still heavily relies on perceptual metrics,
        and the proposed functional benchmarks are not yet widely adopted.
    consensus:
    - World models must capture both state and dynamics to support decision-making,
      and current video generation models are largely stateless, limiting long-horizon
      consistency.
    - Action conditioning is essential for controllable prediction, and coupling video
      with action modalities during pretraining improves policy learning and generalization.
    - Evaluation should move beyond visual fidelity to measure physical plausibility,
      causal reasoning, and downstream task performance.
    - Large-scale pretraining on diverse robotic or driving datasets is a common enabler,
      but domain-specific adaptation remains necessary for accurate dynamics.
    disagreements:
    - 'State representation: some methods rely on implicit state via context frames
      or latent sequences, while others argue for explicit latent compression to enable
      persistence.'
    - 'Dynamics architecture: diffusion-based models are favored for perceptual quality
      and controllability, whereas autoregressive models are used for faster real-time
      simulation.'
    - 'Alignment approach: one line uses multi-dimensional reward models trained on
      human preferences with PPO-style post-training, another uses DPO with decoupled
      discriminators to suppress unphysical behaviors.'
    - 'Evaluation setting: benchmarks range from video game and real-robot manipulation
      (PBench, EZSbench) to spatial reasoning (SAT-Real, MMSI-Bench) and autonomous
      driving (nuScenes), with no agreed-upon protocol for world model capability.'
    open_questions:
    - Can explicit state construction mechanisms be designed to improve long-term
      persistence and causal reasoning without sacrificing visual quality?
    - Under what conditions does test-time scaling reliably improve world model reasoning,
      and how can verifier calibration be guaranteed?
    - How well do alignment techniques trained on contact-rich manipulation transfer
      to other embodiments or domains such as navigation or deformable object manipulation?
    - What functional benchmarks and metrics best predict downstream decision-making
      performance, and how can they be standardized across communities?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须构建状态并建模其动态，并指出无状态视频生成器与经典世界模型理论之间的差距。例如，一项综述提出了隐式与显式状态构建以及知识整合与架构重构动态的分类法。
      尚未覆盖: 所提出的形式条件和分类法是否能转化为可操作的模型设计或评估协议，从而在实践中改善物理持久性和因果推理。
    - 路线: 缩放规律与保证
      解决的问题: 将模型设计选择（扩散 vs. 回归、紧凑跳跃模型、测试时验证器）与预期行为（如视觉保真度、运动幅度恢复、空间推理准确性）联系起来。一项研究表明扩散在感知指标上优于回归，且测试时验证器可在某些基准上纠正轨迹选择偏差。
      尚未覆盖: 缩放趋势能否预测失败和迁移仍缺乏直接验证；测试时验证器校准不良且跨基准缩放不一致，揭示了当前世界模型的信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为以状态构建（隐式/显式）和动态建模（知识整合、架构重构）为中心的类别，并倡导功能基准而非视觉保真度指标。
      尚未覆盖: 该分类法是否改变研究者的评估或模型设计方式；当前评估仍严重依赖感知指标，所提议的功能基准尚未被广泛采用。
    共识:
    - 世界模型必须同时捕获状态和动态以支持决策，而当前视频生成模型大多无状态，限制了长期一致性。
    - 动作条件化对于可控预测至关重要，在预训练中耦合视频与动作模态可改善策略学习和泛化。
    - 评估应超越视觉保真度，衡量物理合理性、因果推理和下游任务性能。
    - 在多样化机器人或驾驶数据集上进行大规模预训练是常见使能因素，但领域特定适应对于准确动态仍是必要的。
    分歧:
    - 状态表示：一些方法依赖通过上下文帧或潜在序列的隐式状态，而另一些主张显式潜在压缩以实现持久性。
    - 动态架构：基于扩散的模型因感知质量和可控性受青睐，而自回归模型用于更快的实时模拟。
    - 对齐方法：一条路线使用在人类偏好上训练的多维奖励模型结合PPO风格后训练，另一条使用带解耦判别器的DPO来抑制非物理行为。
    - 评估设置：基准涵盖视频游戏、真实机器人操作（PBench、EZSbench）、空间推理（SAT-Real、MMSI-Bench）和自动驾驶（nuScenes），缺乏公认的世界模型能力评估协议。
    开放问题:
    - 能否设计显式状态构建机制以改善长期持久性和因果推理而不牺牲视觉质量？
    - 在什么条件下测试时缩放能可靠改善世界模型推理，如何保证验证器校准？
    - 在接触丰富操作上训练的对齐技术如何迁移到其他本体或领域，如导航或可变形物体操作？
    - 哪些功能基准和指标最能预测下游决策性能，如何在不同社区间标准化？
