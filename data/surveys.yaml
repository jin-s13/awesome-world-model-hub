  - 趋势演进：现有证据集中在2024-2026前沿；正从单任务上下文世界模型学习走向开放基准、跨具身预训练与带延迟约束的闭环实时驾驶模拟。
  - 开放问题：能否泛化到 nuScenes/Minecraft/CARL/LIBERO 之外环境；跨团队独立复现是否成立；长时域自回归一致性如何保持；不可观测上下文或分布外动力学下如何表现。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation systems for world-model rollouts
      what_it_solves: Quantifies spatial consistency or action fidelity in generated
        navigation or driving rollouts using paired observations and control trajectories.
      what_remains_open: Evidence is limited to Minecraft or nuScenes; independent
        evaluation across teams and infrastructure is not yet demonstrated.
    - line: Action-controllable closed-loop driving simulators
      what_it_solves: Generates future multi-view driving frames under trajectory
        or command control with low-latency deployment as potentially runnable simulators.
      what_remains_open: Generalization beyond nuScenes and long-horizon cross-view
        consistency under autoregressive rollout remain bounded; multi-GPU or complex-scene
        scalability is not shown.
    - line: Context-aware and physics-informed world models for policy learning
      what_it_solves: Improves zero-shot generalization to unseen context values or
        generates physically plausible robot videos for policy training and evaluation.
      what_remains_open: Assumes observable context; evaluation uses limited CARL
        tasks or robotic scenarios, and downstream policy generalization outside tested
        settings is not verified.
    - line: Cross-embodiment latent-action world models
      what_it_solves: Aligns heterogeneous human, robot, and simulation demonstrations
        through shared latent actions to generate synthetic data that improves video
        prediction and policy success.
      what_remains_open: Real-robot and benchmark gains are reported on LIBERO/LIBERO-Plus,
        but artifact and repository signals are sparse; broader embodiment coverage
        is not independently validated.
    consensus:
    - These systems treat world models as learned simulators that map observations
      and actions or controls to future visual or latent rollouts, then use generated
      rollouts for evaluation or policy improvement.
    - The evidence converges on supporting runnable evaluation frameworks and open
      datasets to compare visual fidelity, controllability, or downstream success.
    - Recent work emphasizes long-horizon coherence, action adherence, and deployment-oriented
      concerns such as low-latency inference.
    disagreements:
    - 'Control interface: explicit driving trajectory or command controls, shared
      latent actions across embodiments, or observable context parameters in reinforcement
      learning.'
    - 'Evaluation target: spatial consistency, action fidelity, visual realism or
      physical plausibility, policy success, or closed-loop latency.'
    - 'Modeling approach: contextual recurrent state-space dynamics, physics-informed
      keypoint and depth learning, multi-view diffusion transformers, or latent-action-aligned
      video transformers.'
    - 'Deployment setting: autonomous driving simulation on nuScenes versus cross-embodiment
      robot platforms and simulation-based policy training.'
    open_questions:
    - Do improvements on LoopNav, ACT-Bench, CARL, or LIBERO transfer to unseen environments
      and real-world deployment conditions?
    - Can performance remain stable over long autoregressive rollouts without drift
      in spatial, action, or cross-view consistency?
    - How do these world models behave when context variables are unobserved or when
      dynamics are out-of-distribution?
    - What independent replication evidence is available across teams, datasets, and
      infrastructure when repository and dataset signals are missing or heterogeneous?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型推演基准与评测系统
      解决的问题: 通过配对观测与控制轨迹，量化生成导航/驾驶推演中的空间一致性或动作忠实度。
      尚未覆盖: 证据集中在Minecraft或nuScenes；跨团队、跨基础设施的独立评测尚未展示。
    - 路线: 动作可控闭环驾驶模拟器
      解决的问题: 在轨迹/指令控制下生成未来多视图驾驶帧，并以低延迟支持可运行的闭环模拟。
      尚未覆盖: nuScenes之外泛化和长时域跨视图一致性未被充分验证；多GPU或复杂场景可扩展性缺少证据。
    - 路线: 上下文感知与物理信息世界模型，用于策略学习
      解决的问题: 提升对未见上下文值的零样本泛化，或生成物理更可信的机器人视频用于策略训练与评估。
      尚未覆盖: 假设上下文可观测；仅用有限CARL任务或机器人场景评测，下游策略在测试设置之外不明确。
    - 路线: 跨具身潜动作世界模型
      解决的问题: 通过共享潜动作对齐人类、机器人与仿真数据，生成合成数据以改善视频预测和策略成功率。
      尚未覆盖: LIBERO/LIBERO-Plus和真实机器人报告增益，但代码/仓库信号稀疏；更广泛具身覆盖未独立验证。
    共识:
    - 这些系统把世界模型视为可学习模拟器，从观测和动作/控制映射到未来视觉或潜变量推演，并用生成结果做评测或策略改进。
    - 证据共同指向可运行的评测框架和开放数据集，用视觉保真度、可控性或下游成功作为比较依据。
    - 近期工作强调长时域一致性、动作遵循和低延迟推理等部署导向指标。
    分歧:
    - 控制接口不同：显式驾驶轨迹/指令、跨具身共享潜动作，或强化学习中的可观测上下文参数。
    - 评测目标不同：空间一致性、动作忠实度、视觉真实/物理合理性、策略成功或闭环延迟。
    - 建模方式不同：上下文循环状态空间动力学、物理信息关键点/深度学习、多视图扩散Transformer，或潜动作对齐视频Transformer。
    - 部署设置不同：nuScenes上的自动驾驶模拟，或跨具身机器人平台与仿真策略训练。
    开放问题:
    - 在LoopNav、ACT-Bench、CARL或LIBERO上的提升，是否迁移到未见环境和真实部署条件？
    - 长自回归推演下，空间、动作和跨视图一致性是否能保持不退化？
    - 当上下文变量不可观测或动力学处于分布外时，这些世界模型会如何表现？
    - 当代码、数据集和仓库信号缺失或不一致时，跨团队、数据集和基础设施的独立复现证据是什么？
