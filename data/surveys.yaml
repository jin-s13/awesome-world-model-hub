  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model literature into shared dimensions
        such as latent representations, structural priors, internal mechanics, and
        research directions.
      what_remains_open: Whether the proposed taxonomies are backed by systematic
        coverage and whether conceptual frameworks can be empirically validated.
    - line: Benchmark and evaluation-framework construction
      what_it_solves: Turns qualitative goals into measurable tasks, including out-of-sight
        dynamics, georeferencing, controllable generation, and closed-loop evaluation
        prescriptions.
      what_remains_open: Comparability across benchmarks is uncertain; some closed-loop
        and resource-aware metrics are proposed but not yet implemented or tested.
    - line: Primary generative world-model development as survey evidence
      what_it_solves: Provides concrete evidence for compositional video planning,
        long-term memory, traffic simulation, ego-vision control, and open-source
        interactive generation.
      what_remains_open: Generalization to novel primitives, real-robot execution,
        and persistent unseen state dynamics remain under-evaluated; some limitation
        fields are absent.
    - line: Open problem and gap mapping
      what_it_solves: Converts method and benchmark observations into next research
        questions, such as physical-law comprehension and reproducible open-source
        access.
      what_remains_open: Prioritization of open gaps and the evidence quality threshold
        for including a claim in a synthesis are not established.
    consensus:
    - Generative world models are treated as a unifying frame across video generation,
      autonomous driving, and embodied interaction.
    - Long-horizon temporal consistency and controllable generation are recurring
      quality requirements.
    - Latent representations and structural priors are used to organize model design
      and evaluation.
    - Evaluation is shifting from open-loop realism toward closed-loop, task-oriented,
      or resource-aware assessment.
    disagreements:
    - 'Representation differs: language-derived compositional primitives, unified
      latent autoregressive states, or persistent global state.'
    - 'Supervision differs: large real-world multimodal road/ego-vision datasets versus
      existing robot datasets and simulation.'
    - 'Evaluation targets differ: unseen robot task composition, photorealistic road
      image synthesis, or persistent out-of-sight event evolution.'
    - 'Deployment differs: real-time interactive generation versus offline traffic
      simulation versus autonomous driving planning.'
    - Some work emphasizes open-source artifacts, while the provided evidence for
      other work shows no public code or dataset signals.
    open_questions:
    - How should survey-style taxonomies be empirically validated rather than remaining
      conceptual frameworks?
    - Can compositional world models generalize to entirely new primitives or objects
      outside seen combinations?
    - Which closed-loop metrics best capture value alignment and resource constraints
      in autonomous driving?
    - How can persistent out-of-sight dynamics be evaluated with datasets that cover
      revisiting and state synchronization?
    - Which reproducibility gaps are missing evidence rather than missing artifacts,
      and how should synthesis account for that uncertainty?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型文献组织为潜在表示、结构先验、内部机制和研究方向等共享维度。
      尚未覆盖: 所提分类体系是否由系统覆盖支撑，以及概念框架能否被实证验证仍不明确。
    - 路线: 基准与评估框架构建
      解决的问题: 将定性目标转化为可测量任务，包括视线外动态、地理参考、可控生成和闭环评估方案。
      尚未覆盖: 不同基准之间的可比性不确定；部分闭环指标和资源感知指标仍只是提出，未实施或测试。
    - 路线: 作为综述证据的生成式世界模型方法
      解决的问题: 为组合式视频规划、长期记忆、交通仿真、自我中心控制和开源交互生成提供具体能力证据。
      尚未覆盖: 对全新原语、真实机器人执行和持续未见状态动态的泛化仍缺乏充分评估；部分局限性字段缺失。
    - 路线: 开放问题与缺口映射
      解决的问题: 把方法与基准观察转化为下一批研究问题，如物理规律理解和可复现的开源访问。
      尚未覆盖: 哪些缺口应优先解决，以及合成结论所需证据质量门槛尚未建立。
    共识:
    - 生成式世界模型被视为连接视频生成、自动驾驶与具身交互的统一框架。
    - 长时程时间一致性与可控生成是反复出现的质量要求。
    - 潜在表示与结构先验被用于组织模型设计和评测。
    - 评测正从开放域真实感转向闭环、任务导向或资源感知评估。
    分歧:
    - 表示方式不同：语言派生的组合原语、统一潜在自回归状态或持久全局状态。
    - 监督信号不同：大规模真实多模态道路/自我中心数据，或既有机器人数据与仿真。
    - 评测目标不同：未见机器人任务组合、逼真道路图像合成或持续视线外事件演化。
    - 部署场景不同：实时交互生成、离线交通仿真或自动驾驶规划。
    - 部分工作强调开源工件，而证据中另一些工作未显示公开代码或数据集信号。
    开放问题:
    - 如何实证验证综述式分类体系，而不是停留在概念框架？
    - 组合式世界模型能否泛化到已见组合之外的全新原语或物体？
    - 哪些闭环指标能同时反映自动驾驶中的价值对齐与资源约束？
    - 如何用覆盖重新访问与状态同步的数据集评测持续视线外动态？
    - 哪些可复现性缺口只是缺少证据而非缺少工件？综合结论应如何处理这种不确定性？
