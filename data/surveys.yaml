  related_work_outline:
  - 'Mainstream direction: Most papers propose end-to-end world models or simulators
    that generate future video frames conditioned on actions, with a focus on autonomous
    driving, robotics, and game environments. They prioritize controllability, fidelity,
    and action-conditioned generation.'
  - 'Shared research pattern: Researchers build on pre-trained video generative models
    (diffusion or autoregressive transformers) and inject action-conditioned modules,
    then evaluate on task-specific benchmarks using metrics like FVD, FID, or custom
    consistency scores. Code and datasets are often released to foster reproducibility.'
  - 'Key differences: Work differs in the type of world model architecture (diffusion
    vs. autoregressive), the evaluation target (spatial consistency vs. action fidelity
    vs. visual quality), the simulation mode (open-loop vs. closed-loop), and the
    deployment goal (offline high-fidelity vs. real-time interactive serving).'
  - 'Trend evolution: The field has moved from generic video generation toward domain-specific
    world simulators with explicit action controllability and physics grounding, and
    recent work (2024–2026) increasingly emphasizes real-time closed-loop simulation
    and systematic benchmarking.'
  - 'Open questions: Long-horizon consistency and compounding error in autoregressive
    rollouts, generalization to unseen environments or sensor setups, and the trade-off
    between visual fidelity and real-time latency remain unresolved. The assumption
    of observable context or ground-truth actions is not always realistic.'
  related_work_outline_zh:
  - 主流方向：多数工作提出以动作为条件的端到端世界模型或模拟器，生成未来视频帧，聚焦自动驾驶、机器人和游戏环境，重点关注可控性、保真度和动作条件生成。
  - 研究共性：研究者基于预训练视频生成模型（扩散或自回归Transformer），注入动作条件模块，并在任务特定基准上使用FVD、FID或自定义一致性分数评估，同时常发布代码和数据集以促进可复现性。
  - 关键差异：工作在世界模型架构（扩散 vs. 自回归）、评测目标（空间一致性 vs. 动作忠实度 vs. 视觉质量）、仿真模式（开环 vs. 闭环）以及部署目标（离线高保真
    vs. 实时交互服务）上存在差别。
  - 趋势演进：领域从通用视频生成转向具有显式动作可控和物理基础的特定领域世界模拟器，近期工作（2024–2026）越来越强调实时闭环仿真和系统性基准测试。
  - 开放问题：长时域一致性和自回归推演中的累积误差、对未见环境或传感器配置的泛化、视觉保真度与实时延迟之间的权衡仍未解决，可观测上下文或真实动作的假设并不总是现实。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turns pre-trained video generation models into end-to-end world
        simulators for training and evaluation in domains like driving and robotics,
        enabling action-conditioned scenario generation.
      what_remains_open: Generalization beyond training domains, long-horizon stability,
        and the assumption of observable context or ground-truth actions are not fully
        addressed; deployment complexity in multi-GPU settings is underexplored.
    - line: Real-time and interactive serving
      what_it_solves: Achieves low-latency, closed-loop simulation for autonomous
        driving and robotics, enabling interactive policy evaluation and model-based
        RL with sub-second response times.
      what_remains_open: Trade-offs between speed, visual fidelity, and controllability
        under stochastic or out-of-distribution conditions; scalability to complex
        multi-agent or multi-sensor scenes is not yet proven.
    - line: Artifacts and reproducible engineering
      what_it_solves: Provides open-source benchmarks, datasets, and evaluation frameworks
        (e.g., LoopNav, ACT-Bench) that standardize assessment of spatial consistency,
        action fidelity, and world model quality.
      what_remains_open: Independent reproduction across different teams and infrastructure
        is still rare; many benchmarks are single-domain and lack cross-dataset validation,
        and reported metrics may not capture all failure modes.
    consensus:
    - Action-conditioned video generation is the dominant paradigm for building world
      models as simulators; almost all works release code and/or datasets to promote
      reuse.
    - High-fidelity visual output and precise action following are both pursued, but
      papers often trade one for the other depending on the target application.
    - Evaluation is increasingly moving toward closed-loop settings and physical plausibility,
      supplementing traditional image quality metrics with task-specific consistency
      scores.
    disagreements:
    - 'Architecture choice: diffusion-based models (e.g., Vista, FAR-Drive) compete
      with autoregressive transformers (e.g., DWS) for video generation, with different
      assumptions about temporal modeling and training stability.'
    - 'Evaluation target: some benchmarks measure spatial consistency (LoopNav), others
      action fidelity (ACT-Bench), and others visual quality (FID/FVD) – there is
      no single agreed-upon metric for world model capability.'
    - 'Interaction mode: closed-loop simulation (FAR-Drive, DWS) versus open-loop
      generation (RoboScape, Vista) reflects different priorities on interactive deployment
      versus generation fidelity.'
    - 'Real-time requirement: only a subset of works explicitly optimize for sub-second
      latency (FAR-Drive), while others focus on offline high-fidelity generation
      without real-time constraints.'
    open_questions:
    - How can world models maintain spatial and temporal consistency over long horizons
      without accumulating compounding errors, especially in closed-loop autonomous
      driving?
    - To what extent can world models trained on one domain (e.g., nuScenes) generalize
      to different sensor configurations, weather, or geographic locations, and what
      minimal adaptation is required?
    - What is the optimal trade-off between visual fidelity, physical accuracy, and
      inference latency for real-time interactive simulators, and how should it be
      evaluated?
    - Can world models reliably simulate rare or safety-critical scenarios that are
      underrepresented in training data, and what verification methods are needed
      to trust such simulations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将预训练视频生成模型转化为端到端世界模拟器，用于驾驶和机器人等领域的训练与评估，实现动作条件场景生成。
      尚未覆盖: 训练域之外的泛化、长时域稳定性以及可观测上下文或真实动作的假设尚未完全解决；多GPU部署的复杂性探索不足。
    - 路线: 实时与交互式服务
      解决的问题: 实现自动驾驶和机器人的低延迟闭环仿真，支持交互式策略评估和基于模型的强化学习，响应时间达亚秒级。
      尚未覆盖: 在随机或分布外条件下速度、视觉保真度与可控性之间的权衡；复杂多智能体或多传感器场景的可扩展性尚未验证。
    - 路线: 工件与可复现工程
      解决的问题: 提供开源基准、数据集和评估框架（如LoopNav、ACT-Bench），标准化评估空间一致性、动作忠实度和世界模型质量。
      尚未覆盖: 跨团队和基础设施的独立复现仍少见；多数基准局限于单一领域，缺乏跨数据集验证，且报告的指标可能无法覆盖所有失败模式。
    共识:
    - 动作条件视频生成是构建世界模型作为模拟器的主流范式；几乎所有工作都发布代码和/或数据集以促进复用。
    - 高保真视觉输出和精确动作跟随两者均被追求，但论文往往根据目标应用进行取舍。
    - 评估正越来越多地转向闭环设置和物理合理性，以任务特定一致性分数补充传统图像质量指标。
    分歧:
    - 架构选择：扩散模型（如Vista、FAR-Drive）与自回归Transformer（如DWS）在视频生成上竞争，对时序建模和训练稳定性有不同假设。
    - 评测目标：一些基准测量空间一致性（LoopNav），另一些测量动作忠实度（ACT-Bench），还有一些测量视觉质量（FID/FVD）——尚无公认的世界模型能力度量标准。
    - 交互模式：闭环仿真（FAR-Drive、DWS）与开环生成（RoboScape、Vista）反映了对交互式部署与生成保真度的不同优先级。
    - 实时需求：只有部分工作明确优化亚秒级延迟（FAR-Drive），其他则专注于离线高保真生成，无实时约束。
    开放问题:
    - 世界模型如何在不累积误差的情况下在长时域上保持时空一致性，特别是在闭环自动驾驶中？
    - 在一个领域（如nuScenes）训练的世界模型在多大程度上能泛化到不同的传感器配置、天气或地理位置，需要何种最小适配？
    - 实时交互模拟器在视觉保真度、物理准确性和推理延迟之间的最优权衡是什么，应该如何评估？
    - 世界模型能否可靠地模拟训练数据中代表性不足的罕见或安全关键场景，需要哪些验证方法才能信任此类仿真？
