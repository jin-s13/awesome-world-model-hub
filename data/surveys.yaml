  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video diffusion world models
    for robot manipulation and spatial reasoning, with a focus on physics-aware and
    controllable next-frame prediction.'
  - 'Shared research pattern: Using video generation as a world model, conditioning
    on actions or state trajectories, pretraining on large-scale robot or video data,
    and evaluating via visual fidelity, controllability, and task-specific metrics.'
  - 'Key differences: Action conditioning mechanisms (frame-level, masked, diffusion
    timestep control), whether to adapt pretrained video models or train from scratch,
    physics alignment strategies (reward modeling, DPO), and evaluation protocols
    (visual quality vs. functional benchmarks).'
  - 'Trend evolution: From 2024 fine-grained action alignment to 2025 unified architectures
    and heterogeneous pretraining, then to 2026 physics alignment via reward models
    and zero-shot benchmarks, moving toward more physically plausible and reliably
    evaluable world models.'
  - 'Open questions: Lack of physical persistence and causal reasoning in long-horizon
    rollouts, limited generalization to out-of-distribution actions and embodiments,
    absence of unified functional benchmarks, and theoretical frameworks disconnected
    from empirical model behavior.'
  related_work_outline_zh:
  - 主流方向：构建以动作条件化的视频扩散世界模型，用于机器人操作和空间推理，重点关注物理合理性及可控的未来帧预测。
  - 研究共性：将视频生成作为世界模型，基于动作或状态轨迹条件化，在大规模机器人或视频数据上预训练，并通过视觉保真度、可控性和任务特定指标评估。
  - 关键差异：动作条件化机制（帧级、掩码、扩散时间步控制）、是否适配预训练视频模型、物理对齐策略（奖励建模、DPO）以及评估协议（视觉质量 vs. 功能基准）。
  - 趋势演进：从2024年的细粒度动作对齐，到2025年的统一架构与异构预训练，再到2026年通过奖励模型和零样本基准实现物理对齐，朝着更物理合理且可可靠评估的世界模型发展。
  - 开放问题：长期推演中缺乏物理持久性和因果推理，对分布外动作和实体的泛化有限，缺乏统一的功能基准，理论框架与经验模型行为脱节。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video diffusion world models
      what_it_solves: Transforms video generation into a world model by conditioning
        on actions to predict future visual states, enabling policy learning, planning,
        and simulation.
      what_remains_open: Physical consistency, long-horizon persistence, causal reasoning,
        and cross-embodiment generalization remain unverified; most models rely on
        visual fidelity metrics that ignore physical plausibility.
    - line: Physics alignment and preference-driven world models
      what_it_solves: Enhances physical plausibility and task alignment of generated
        rollouts via multi-dimensional reward models or DPO-based post-training, reducing
        unphysical behaviors while preserving visual quality.
      what_remains_open: Scalability of human preference collection, generalization
        to non-manipulation domains, and integration with other alignment paradigms
        are not demonstrated; dependency on subjective reward signals may introduce
        bias.
    - line: World model evaluation and theoretical frameworks
      what_it_solves: Diagnoses information bottlenecks and verifier biases in spatial
        reasoning, proposes taxonomies bridging video generation and world model theory,
        and advocates for functional benchmarks over visual fidelity.
      what_remains_open: Functional benchmarks are not yet widely adopted, theoretical
        taxonomies have not been shown to change model design, and evaluation of causal
        reasoning in open-world settings is missing.
    consensus:
    - World models should support action-conditioned video prediction and evolve from
      pure visual generation toward physically correct and task-effective rollouts.
    - Diffusion models and large-scale pretraining are the dominant architectural
      choices, with a shared goal of improving downstream policy and planning performance.
    - Evaluation must go beyond visual quality; metrics and benchmarks need to capture
      physical plausibility, action alignment, and trajectory consistency.
    disagreements:
    - 'Action conditioning is implemented differently: frame-level alignment modules
      versus masked autoregression versus independent diffusion timestep control.'
    - Some works adapt pretrained video diffusion models without accessing parameters,
      while others train unified transformers from scratch on robot-specific data.
    - Physics alignment is pursued through reward modeling with human preferences,
      DPO with decoupled discriminators, or remains unaddressed, leading to divergent
      training objectives and data requirements.
    - Evaluation setups vary widely, using different benchmarks (PBench, SAT-Real,
      EZSbench, MMSI-Bench) and metrics (FVD, IoU, physical plausibility scores),
      which complicates direct comparison.
    open_questions:
    - How can causal reasoning and long-term physical persistence be incorporated
      into current video-based world models?
    - What are the cost-effective ways to collect high-quality preference data for
      physics alignment without introducing subjective bias?
    - Can a unified zero-shot benchmark be designed to evaluate both physical plausibility
      and action controllability across diverse embodiments and tasks?
    - How can theoretical taxonomies of state construction and dynamics modeling guide
      practical architectural improvements and metric design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频扩散世界模型
      解决的问题: 将视频生成转化为世界模型，通过动作条件化预测未来视觉状态，支撑策略学习、规划和仿真。
      尚未覆盖: 物理一致性、长期持久性、因果推理及跨实体泛化仍待验证；多数模型依赖视觉保真度指标，忽略物理合理性。
    - 路线: 物理对齐与偏好驱动世界模型
      解决的问题: 通过多维奖励模型或基于DPO的后训练增强生成轨迹的物理合理性和任务对齐，在保持视觉质量的同时抑制非物理行为。
      尚未覆盖: 人类偏好收集的可扩展性、向非操作领域的泛化及与其他对齐范式的结合尚未展示；依赖主观奖励信号可能引入偏差。
    - 路线: 世界模型评估与理论框架
      解决的问题: 诊断空间推理中的信息瓶颈和验证器偏差，提出连接视频生成与世界模型理论的分类法，倡导功能基准取代视觉保真度。
      尚未覆盖: 功能基准尚未被广泛采用，理论分类未证明能改变模型设计，开放世界因果推理的评估尚属空白。
    共识:
    - 世界模型应具备动作条件视频预测能力，并从视觉生成向物理正确且任务有效的推演演进。
    - 扩散模型和大规模预训练是主流架构选择，共同目标是提升下游策略和规划性能。
    - 评估必须超越视觉质量，指标和基准需捕捉物理合理性、动作对齐和轨迹一致性。
    分歧:
    - 动作条件化实现方式不同：帧级对齐模块、掩码自回归、独立扩散时间步控制。
    - 部分工作在不访问参数的情况下适配预训练视频扩散模型，其他则从零开始训练统一的Transformer。
    - 物理对齐通过人类偏好奖励建模、解耦判别器DPO或未被处理，导致训练目标和数据需求各异。
    - 评估设置差异大，使用不同基准（PBench、SAT-Real、EZSbench、MMSI-Bench）和指标（FVD、IoU、物理合理性分数），难以直接比较。
    开放问题:
    - 如何将因果推理和长期物理持久性融入当前的视频世界模型？
    - 如何以低成本收集高质量偏好数据用于物理对齐，同时避免主观偏差？
    - 能否设计统一的零样本基准，同时评估跨实体和任务的物理合理性及动作可控性？
    - 状态构建和动态建模的理论分类如何指导实际架构改进和指标设计？
