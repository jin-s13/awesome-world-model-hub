  related_work_outline:
  - 'Mainstream direction: Recent work favors generative world-model architectures
    such as diffusion transformers, VAEs, and unified video-action transformers, often
    with auxiliary self-supervised objectives like mask reconstruction, depth, or
    keypoint dynamics.'
  - 'Shared research pattern: Methods couple representation learning with action or
    context conditioning and evaluate on standard suites such as Atari 100k, CARL,
    RT-X, nuScenes, OpenDV-2K, Waymo, or newer Minecraft-based benchmarks.'
  - 'Key differences: Approaches diverge in stochastic modeling, conditioning signals,
    factorization strategies, and evaluation focus such as visual fidelity, spatial/memory
    consistency, policy generalization, or action control.'
  - 'Trend evolution: The frontier has shifted from single-task model-based RL toward
    large-scale generative pretraining, unified multimodal action-video diffusion,
    and specialized open-domain consistency and control benchmarks in 2024-2026.'
  - 'Open questions: Long-term consistency, cross-action-space transfer, reliance
    on action labels or observable context, real-robot deployment, and whether measured
    gains isolate the proposed method remain underevidenced.'
  related_work_outline_zh:
  - 主流方向：前沿世界模型以生成式架构为主，包括扩散Transformer、VAE和统一视频-动作Transformer，并结合掩码重建、深度或关键点动力学等自监督目标，以增强长时域预测与控制能力。
  - 研究共性：方法通常将表示学习与动作或上下文条件耦合，采用自监督视频目标，并在Atari 100k、CARL、RT-X、nuScenes、OpenDV-2K、Waymo或新Minecraft基准上评测。
  - 关键差异：方法在随机建模、条件信号、因子分解方式以及评测焦点上不同，焦点包括视觉保真、空间/记忆一致性、策略泛化或动作控制。
  - 趋势演进：前沿正从单任务基于模型强化学习转向大规模生成式预训练、统一多模态动作-视频扩散，以及2024至2026年专门的开放域一致性与控制基准。
  - 开放问题：长期一致性、跨动作空间迁移、对动作标注或可观测上下文的依赖、真实机器人部署，以及方法贡献是否被充分隔离，仍缺乏证据。
  literature_review:
    line_of_work_matrix:
    - line: Generative representation and objective design
      what_it_solves: Builds scalable world models for video prediction and dynamics
        learning using diffusion, VAE, Transformer, mask reconstruction, depth, and
        keypoint-dynamics objectives.
      what_remains_open: Which architectural and objective choices transfer beyond
        reported datasets, domains, and view settings; long-horizon and cross-domain
        consistency are not fully isolated.
    - line: Contextual, compositional, and action-coupled dynamics
      what_it_solves: Connects learned dynamics to intervention and generalization
        through explicit context variables, language-primitive factorization, physics-informed
        signals, or coupled video-action diffusion.
      what_remains_open: Assumptions about observable context, action-labeled data,
        predefined primitives, simulation-only evaluation, and whether gains come
        from the dynamics model or the surrounding control interface.
    - line: World-model benchmark and evidence protocols
      what_it_solves: Measures spatial consistency, memory consistency, action control,
        physical plausibility, and policy generalization under standardized datasets
        and benchmarks.
      what_remains_open: Coverage across domains and action spaces is still limited;
        several records report dataset or benchmark construction without experimental
        results, full ablations, or limitation details.
    consensus:
    - Generative or self-supervised objectives are widely used to train world models
      from video and interaction, moving beyond deterministic single-step prediction.
    - Auxiliary signals such as mask reconstruction, depth, keypoint dynamics, context
      conditioning, and action diffusion are used to improve consistency, physical
      plausibility, or controllability.
    - Evaluation increasingly includes long-horizon rollout, zero-shot or unseen-context
      generalization, spatial and memory consistency, and action control rather than
      short-frame reconstruction alone.
    - Standardized datasets and benchmarks provide shared reference points, but reproducibility
      evidence, baselines, metrics, and ablations remain incomplete across the sample.
    disagreements:
    - 'Stochastic representation differs: VAE-style recurrent state-space models,
      diffusion-based video generation, and unified video-action diffusion are used
      as alternative foundations.'
    - 'Conditioning and factorization differ: explicit context variables, language-primitive
      decomposition, independent modality-specific timesteps, and physics-informed
      auxiliary tasks coexist.'
    - 'Evaluation targets differ: policy zero-shot generalization, Atari human performance,
      driving video prediction, robotic video plausibility, spatial consistency, and
      memory/action control are each prioritized by different lines.'
    - 'Data assumptions differ: some approaches require action labels or observable
      context, others exploit action-free video or large-scale robot data, and real-world
      validation is often absent.'
    - 'Evidence strength differs: some contributions report strong benchmark results,
      while others focus on dataset and benchmark construction without experimental
      outcomes or clear limitations.'
    open_questions:
    - Which representation or objective most reliably supports long-horizon spatial
      and memory consistency across diverse contexts and action spaces?
    - Can compositional or unified video-action methods handle entirely novel primitives,
      actions, or embodiment changes beyond combinations seen during training?
    - How much reported performance comes from learned dynamics versus auxiliary losses,
      action-conditioning choices, evaluation metrics, or system implementation?
    - How can world models be deployed reliably under missing action labels, unobserved
      context, limited physical priors, and real-world constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式表示与目标设计
      解决的问题: 利用扩散、VAE、Transformer、掩码重建、深度和关键点动力学等目标，构建可扩展的世界模型以进行视频预测和动力学学习。
      尚未覆盖: 哪些架构与目标选择能迁移到报告数据集、领域和视角之外；长时域和跨域一致性尚未被充分隔离验证。
    - 路线: 上下文、组合与动作耦合动力学
      解决的问题: 通过显式上下文变量、语言原语分解、物理信息信号或耦合视频-动作扩散，将学习到的动力学连接到干预与泛化。
      尚未覆盖: 可观测上下文、动作标注、预定义原语、仅仿真评估等假设，以及收益来自动力学模型还是周边控制接口仍不清楚。
    - 路线: 世界模型基准与证据协议
      解决的问题: 在标准化数据集和基准下，量化空间一致性、记忆一致性、动作控制、物理合理性和策略泛化能力。
      尚未覆盖: 域和动作空间覆盖仍有限；部分记录只构建数据集或基准，未报告实验结果、完整消融或限制。
    共识:
    - 世界模型训练广泛采用生成式或自监督目标，从视频和交互中学习，已不再局限于确定性单步预测。
    - 掩码重建、深度、关键点动力学、上下文条件和动作扩散等辅助信号被用于提升一致性、物理合理性或可控性。
    - 评测开始纳入长时域展开、零样本或未见上下文泛化、空间与记忆一致性以及动作控制，而非只看短期重建误差。
    - 标准化数据集和基准提供共同参照，但样本中关于可复现性、基线、指标和消融的证据仍不完整。
    分歧:
    - 随机表示方式不同：VAE式循环状态空间模型、扩散视频生成和统一视频-动作扩散被用作不同基础。
    - 条件与因子分解方式不同：显式上下文变量、语言原语分解、模态独立时间步和物理信息辅助任务并存。
    - 评测目标不同：策略零样本泛化、Atari人类表现、驾驶视频预测、机器人视频合理性、空间一致性以及记忆/动作控制各有侧重。
    - 数据假设不同：部分方法依赖动作标注或可观测上下文，部分利用无动作视频或大规模机器人数据，且真实世界验证通常缺失。
    - 证据强度不同：部分贡献给出较强基准结果，部分仅构建数据集和基准而未报告实验或限制。
    开放问题:
    - 哪种表示或目标最可靠地支持跨情境和跨动作空间的长期空间与记忆一致性？
    - 组合式或统一视频-动作方法能否处理训练中未见过的原语、动作或具身变化，而不仅是已见组合内泛化？
    - 报告性能中多少来自动力学模型，多少来自辅助损失、动作条件设计、评测指标或系统实现？
    - 在缺少动作标签、上下文不可观测、物理先验有限和真实世界约束下，世界模型如何可靠部署？
