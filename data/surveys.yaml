  related_work_outline:
  - 'Mainstream direction: Recent method work centers on generative sequence models
    for world dynamics, with diffusion transformers and transformer-VAE hybrids used
    for video, driving, and robotics.'
  - 'Shared research pattern: Models add auxiliary structure beyond next-frame prediction,
    including mask reconstruction, depth/keypoint physics, action diffusion, and context
    conditioning.'
  - 'Key differences: They differ in representation, supervision, action interface,
    and evaluation targets: stochastic RL, driving video prediction, robot imagination,
    and memory/action benchmarks.'
  - 'Trend evolution: Evidence clusters in 2023-2026, moving from efficient game world
    models toward embodied, physics-informed, and benchmark-driven evaluation of consistency
    and generalization.'
  - 'Open questions: Limits remain in long-term memory consistency, cross-action-space
    generalization, context observability, primitive decomposition, and isolation
    of model contribution.'
  related_work_outline_zh:
  - 主流方向：近期方法以扩散Transformer和Transformer-VAE等生成式序列模型为核心，用于驾驶、机器人等世界动力学建模。
  - 研究共性：在下一帧预测之外引入辅助结构，如掩码重建、深度/关键点物理任务、动作扩散和上下文条件。
  - 关键差异：表示方式、监督信号、动作接口与评测目标不同，横跨随机RL、驾驶视频、机器人想象和记忆/动作基准。
  - 趋势演进：证据集中在2023-2026年，从高效游戏世界模型转向具身、物理信息及一致性评测驱动。
  - 开放问题：长期记忆一致性、跨动作空间泛化、上下文可观测性、原语分解和模型贡献隔离仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete architectures and training
        recipes, such as transformer-VAE stochastic dynamics, diffusion video generation,
        physics-informed depth/keypoint losses, and unified video-action diffusion.
      what_remains_open: Which representation or auxiliary objective transfers beyond
        the reported domain is not established, and several works omit limitation
        or ablation details.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention, planning, or decision-time
        interfaces through context-conditioned Dreamer rollouts, language-primitive
        video plans, robot policy training, and action diffusion coupling.
      what_remains_open: For contextual RL, gains depend on observable context and
        two CARL tasks; for robot imagination, generalization is limited to seen primitives
        and mainly simulation; the model-versus-planner contribution is not isolated.
    - line: Method evidence and ablation protocol
      what_it_solves: Builds evaluation datasets and metrics for spatial consistency,
        memory consistency, and action control, aiming to separate world-model capabilities
        from pixel-level variation.
      what_remains_open: Abstracts for benchmark papers may lack experimental results;
        current benchmarks still reveal challenges in long-term memory, cross-action-space
        generalization, and broad coverage.
    consensus:
    - Recent architectures rely heavily on generative sequence models, especially
      diffusion and transformer-based designs.
    - 'Auxiliary objectives beyond raw next-frame generation are common for injecting
      structure: mask reconstruction, depth, keypoint dynamics, action modeling, context
      conditioning, and consistency scoring.'
    - Evaluation is shifting from simple sample efficiency toward generalization,
      long-horizon prediction, embodied policy utility, and consistency benchmarks.
    - Benchmarks indicate current models still struggle with long-term memory and
      generalization under changing viewpoints or action spaces.
    - Code, dataset, or repository release is frequent, but limitation sections and
      ablation evidence are uneven or absent.
    disagreements:
    - 'Representation differs: stochastic transformer-VAE dynamics, diffusion transformers
      with mask reconstruction, physics-informed generative models, and compositional
      language-driven generators.'
    - 'Supervision differs: context-conditioned latent dynamics, parsed language primitives,
      physics auxiliary tasks, and independent video/action diffusion timesteps.'
    - 'Evaluation target differs: Atari sample efficiency, driving multi-view prediction,
      robot task generalization, and open-domain memory/action control.'
    - 'Action interface differs: action-free video generation, language-goal conditioning,
      coupled action diffusion, and loop-based navigation actions.'
    - 'Evidence depth differs: some works report comparative results, while benchmark-focused
      works primarily construct datasets or metrics, and limitation reporting is inconsistent.'
    open_questions:
    - Which auxiliary losses or representations transfer across domains and scales?
    - How much of planning or control improvement comes from the learned world model
      rather than the planner, controller, or task prior?
    - Can world models maintain memory consistency under long loops, viewpoint change,
      and action-space shift?
    - Do assumptions such as observable context and predefined language primitives
      hold in partially observed real-world settings?
    - Do current benchmarks isolate method contribution from dataset, baseline, metric,
      and implementation choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型落实为具体架构与训练配方，例如Transformer-VAE随机动力学、扩散视频生成、物理信息深度/关键点损失以及视频-动作联合扩散。
      尚未覆盖: 哪些表示或辅助目标能跨域迁移尚不明确，部分工作缺少局限性与消融细节。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划或决策接口，包括上下文Dreamer展开、语言原语视频计划、机器人策略训练和动作扩散耦合。
      尚未覆盖: 上下文RL收益依赖可观测上下文且仅覆盖两个CARL任务；机器人想象局限于已见原语并主要为仿真；模型与规划器的贡献未隔离。
    - 路线: 方法证据与评测协议
      解决的问题: 构建空间一致性、记忆一致性和动作控制的评测数据集与指标，尝试将世界模型能力与像素级变化区分开。
      尚未覆盖: 基准论文摘要可能缺少实验对比；现有基准仍暴露长期记忆、跨动作空间泛化和覆盖度不足。
    共识:
    - 近期架构大量采用生成式序列模型，尤其是扩散和Transformer类设计。
    - 除原始下一帧生成外，常用辅助目标注入结构：掩码重建、深度、关键点动力学、动作建模、上下文条件和一致性评分。
    - 评测正从单纯样本效率转向泛化、长时域预测、具身策略效用和一致性基准。
    - 基准显示当前模型在长期记忆以及视角或动作空间变化下的泛化仍有困难。
    - 代码、数据集或仓库发布常见，但局限性与消融证据不均衡或缺失。
    分歧:
    - 表示方式不同：随机Transformer-VAE动力学、带掩码重建的扩散Transformer、物理信息生成模型和组合式语言驱动生成器。
    - 监督信号不同：上下文条件潜在动力学、解析语言原语、物理辅助任务以及独立视频/动作扩散时间步。
    - 评测目标不同：Atari样本效率、驾驶多视角预测、机器人任务泛化和开放域记忆/动作控制。
    - 动作接口不同：无动作视频生成、语言目标条件、耦合动作扩散和循环导航动作。
    - 证据深度不同：部分工作给出对比结果，基准工作更偏数据集或指标构建，限制声明也不一致。
    开放问题:
    - 哪些辅助损失或表示能跨领域和规模迁移？
    - 规划或控制提升有多少来自世界模型本身，而不是规划器、控制器或任务先验？
    - 世界模型能否在长循环、视角变化和动作空间变化下保持记忆一致性？
    - 可观测上下文和预定义语言原语等假设在部分可观测真实场景中是否成立？
    - 当前基准是否能隔离方法贡献与数据集、基线、指标和实现因素？
