  related_work_outline_zh:
  - 主流方向：以生成式视频世界模型为核心，围绕自动驾驶、机器人、交互智能体展开综述与分类体系综合；方法论文作为可控性、长时一致性和评测的支撑证据。
  - 研究共性：按表示方式、应用场景或评测维度整理碎片化世界模型研究，反复提出动作条件可控性、长时记忆、实时交互、场景持续性等挑战。
  - 关键差异：部分工作偏概念分类与评测建议但缺实证验证；部分方法论文给出仿真或真实机器人结果；输入模态和部署设置跨越语言、自运动、参考帧、视频和潜在状态。
  - 趋势演进：从2022年物理机器人Dreamer学习，走向2024-2026年生成式视频世界模型综述与交互/自动驾驶分类法，强调实时、记忆、视线外动态和开源。
  - 开放问题：跨开放世界、游戏引擎、自动驾驶和机器人的基准兼容性仍未解决；分类法验证、缺口优先级、仿真到真实迁移及缺失证据仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into design spaces, technical
        challenges, application scenarios, milestones, and future directions.
      what_remains_open: Synthesis rigor varies; some works do not state inclusion
        criteria or systematic coverage, leaving whether conclusions are representative
        rather than selective unverified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how benchmark and metric choices shape cross-paper
        conclusions in interactive video, autonomous driving, and robotics settings.
      what_remains_open: Proposed evaluation suites are sometimes not implemented
        or tested, so compatibility across settings and closed-loop validity remain
        unverified.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into concrete research questions
        such as action-conditioned controllability, long-horizon memory, real-time
        interactivity, and out-of-sight dynamics.
      what_remains_open: Prioritization of gaps is not systematically evidenced; missing
        limitation details and sparse reproducibility signals make importance ranking
        difficult.
    consensus:
    - World-model surveys and roadmaps cluster around generative video simulation,
      autonomous driving, robotics, and interactive agents.
    - Action-conditioned controllability, long-horizon temporal consistency, and real-time
      interactivity are recurring unsolved requirements.
    - Evaluation progress requires benchmarks, metrics, and reproducible artifacts,
      but these are often proposed rather than validated.
    disagreements:
    - Some papers emphasize conceptual taxonomy and evaluation prescriptions, while
      others contribute method-level evidence with simulation, real-robot, or generation
      results.
    - 'Representation choices differ: language-primitive decomposition, ego-motion
      or reference-frame conditioning, latent-state frameworks, and persistent 3D
      or entity-based global state.'
    - Evaluation targets differ across open-world exploration, game engines, autonomous
      driving, robotics, and ego-vision future prediction, creating incompatible comparison
      settings.
    - 'Deployment expectations differ: real-time video generation, physical robot
      learning without simulators, simulation-only evaluation, or purely theoretical
      framework with no implementation.'
    open_questions:
    - Which evaluation claims can be compared across open-world, game-engine, autonomous-driving,
      and robotics benchmarks without shared metrics or closed-loop rollout evidence?
    - What systematic inclusion criteria would make survey taxonomies representative
      rather than selective?
    - What evidence is needed to transfer video-based or latent world-model advances
      from simulation to physical robot execution?
    - Why are limitation and reproducibility signals absent for several 2025-2026
      contributions, and how should synthesis treat those verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型研究整理为设计空间、技术挑战、应用场景、里程碑和未来方向。
      尚未覆盖: 综合严谨性不一；部分工作未说明纳入标准或系统覆盖，无法确认结论是否代表全貌而非选择性举例。
    - 路线: 对比评测综合
      解决的问题: 总结不同基准和指标选择如何影响交互视频、自动驾驶和机器人领域的跨论文结论。
      尚未覆盖: 部分评测套件被提出但未实现或测试，跨设置兼容性和闭环有效性仍未验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为具体研究问题，如动作条件可控性、长时记忆、实时交互、视线外动态。
      尚未覆盖: 缺口优先级缺乏系统证据；缺失局限说明和不完整的可复现信号使重要性排序困难。
    共识:
    - 世界模型综述和路线图主要围绕生成式视频模拟、自动驾驶、机器人和交互智能体展开。
    - 动作条件可控性、长时一致性和实时交互是反复出现的未完全解决的瓶颈。
    - 评测进展依赖基准、指标和可复现工件，但这些常被提出多而验证少。
    分歧:
    - 部分工作偏概念分类与评测建议，另一些则提供仿真、真实机器人或生成结果层面的方法证据。
    - 表示方式不同：语言原语分解、自运动或参考帧条件、潜在状态框架、持久3D或实体全局状态各有侧重。
    - 评测目标不同：开放世界探索、游戏引擎、自动驾驶、机器人或自运动未来预测，导致比较设置难以兼容。
    - 部署期望不同：实时视频生成、无模拟器物理机器人学习、仅仿真评估或完全理论化框架并存。
    开放问题:
    - 在缺少共享指标和闭环评估的情况下，哪些评测结论可以在开放世界、游戏引擎、自动驾驶和机器人基准之间比较？
    - 需要怎样的系统纳入标准，才能让综述分类法具有代表性而非选择性？
    - 将视频或潜在世界模型能力从仿真迁移到物理机器人执行还需要哪些证据？
    - 若干2025-2026年工作缺少局限性和可复现性信号，综合时该如何处理这些验证缺口？
