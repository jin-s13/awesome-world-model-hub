  related_work_outline_zh:
  - 主流方向：生成式视频/潜在世界模型是主流证据，研究从开放域视觉真实感逐步转向长期一致、可控、可交互的模拟器，面向机器人想象、自我中心视觉和自动驾驶。
  - 研究共性：论文通常把问题拆为表示、生成和评测，并通过数据集、基准、分类法或综述揭示组合性、视线外动态、长期一致性和泛化等缺口。
  - 关键差异：表示方式从语言组合原语、统一Transformer自回归到持久全局/3D状态不等；评测目标包括视频仿真、运动预测、地理参考、自我运动/物体/人体姿态控制及闭环驾驶就绪。
  - 趋势演进：从2022-2023年的交通与机器人世界模型，到2024年围绕生成视频模拟器的综述整合，再到2025-2026年开源实时系统、视线外持久动态、细粒度可控性与统一分类/评测框架；证据处于当前前沿。
  - 开放问题：开环指标能否预测闭环执行质量；如何处理训练中未见的新原语或实体；分类法是否经过实证验证；跨数据集与指标是否兼容；物理规律理解是真实模拟还是视觉合理性。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented generative world-model work into design spaces,
        internal mechanics, milestones, and evaluation gaps, especially for autonomous
        driving and general video simulators.
      what_remains_open: Frameworks are often conceptual or selective; empirical validation
        and comprehensive coverage of existing and future methods are not yet established.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how benchmarks, datasets, and metrics for controllability,
        temporal consistency, instruction following, motion realism, and georeferencing
        shape cross-method conclusions.
      what_remains_open: Results are not clearly compatible across simulation, real-world,
        and closed-loop settings; open-loop metrics may not predict decision readiness.
    - line: World-model design and benchmark construction
      what_it_solves: Builds controllable generative video/latent simulators and associated
        datasets for robot imagination, ego-vision, and autonomous driving.
      what_remains_open: Many papers leave limitation details empty; generalization
        beyond seen primitives or environments and open-loop versus closed-loop alignment
        remain unresolved.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad world-model coverage into concrete targets such
        as out-of-sight persistence, compositional generalization, long-horizon memory,
        and real-time interactivity.
      what_remains_open: Prioritization of gaps for downstream progress is uncertain,
        and proposed mechanisms lack empirical evidence across unseen primitives,
        entities, or deployment settings.
    consensus:
    - Research is converging on generative video/latent world models that must maintain
      temporal consistency and support controllable generation rather than only short-term
      frame prediction.
    - Evaluation is treated as a core bottleneck, with datasets, benchmarks, metrics,
      or evaluation frameworks proposed for controllability, long-horizon consistency,
      instruction following, and spatial-temporal reasoning.
    - Persistent world state and memory are increasingly seen as necessary for moving
      from short video generation to simulation, including out-of-sight dynamics and
      minute-level horizons.
    - Visual plausibility alone is considered insufficient; downstream robot execution,
      motion prediction, autonomous self-control, or decision readiness requires more
      grounded evaluation.
    disagreements:
    - 'Representation differs: some approaches use language-composed primitives, others
      use unified autoregressive transformers, and others use persistent global/3D
      states or latent continuous, discrete, or hybrid spaces.'
    - Evaluation targets differ across video simulation success, motion prediction,
      georeferencing, fine-grained ego-motion/object/human pose control, and closed-loop
      driving metrics.
    - 'Interaction and deployment settings differ: offline generation, real-time interactive
      simulation, multi-agent traffic simulation, and robot or ego-vision applications
      coexist.'
    - 'Evidence completeness differs: some work contributes large real-world datasets
      and metrics; some is conceptual taxonomy without empirical validation; several
      method papers leave limitation details empty.'
    open_questions:
    - Do open-loop generation metrics predict closed-loop execution quality for robots
      and autonomous agents?
    - Can world models handle entirely new primitives, entities, or environments not
      seen during training, instead of only recombining previously seen ones?
    - How can taxonomies and evaluation frameworks be empirically validated against
      actual model behavior?
    - What minimal state representations and memory mechanisms support persistent
      out-of-sight dynamics while preserving real-time interactivity?
    - Are reported physical-law comprehension and spatial-temporal reasoning real
      simulation capabilities, or visual plausibility under narrow benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的生成式世界模型工作整合为设计空间、内部机制、里程碑和评估缺口，尤其面向自动驾驶和通用视频模拟器。
      尚未覆盖: 框架多偏概念性或选择性；对现有与未来方法的实证验证和系统覆盖尚未建立。
    - 路线: 对比评测综合
      解决的问题: 总结基准、数据集和指标如何影响可控性、时间一致性、指令跟随、运动真实感和地理参考等跨方法结论。
      尚未覆盖: 不同仿真、真实世界和闭环设置下的结果是否兼容尚不明确；开环指标未必预测决策就绪。
    - 路线: 世界模型设计与基准构建
      解决的问题: 构建可控的生成式视频/潜在模拟器，以及面向机器人想象、自我中心视觉和自动驾驶的数据集。
      尚未覆盖: 许多论文未给出局限性；对未见原语或环境的泛化、开环与闭环一致性仍未解决。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛的世界模型覆盖转化为具体目标，如视线外持久性、组合泛化、长时记忆和实时交互。
      尚未覆盖: 哪些缺口对进展最重要仍缺少排序；所提机制在未见原语、实体或部署场景下缺乏实证支持。
    共识:
    - 研究正汇聚到生成式视频/潜在世界模型，强调时间一致性和可控生成，而不仅是短期帧预测。
    - 评测被视为核心瓶颈，论文提出数据集、基准、指标或评估框架来覆盖可控性、长时一致性、指令跟随和时空推理。
    - 持久世界状态与记忆越来越多被视为从短视频生成走向模拟的必要条件，包括视线外动态和分钟级时间跨度。
    - 视觉真实感不足够，机器人执行、运动预测或自主控制等下游任务需要更落地的评测。
    分歧:
    - 表示方式不同：有的使用语言组合原语，有的使用统一自回归Transformer，有的使用持久全局/3D状态或隐空间连续、离散、混合表示。
    - 评测目标不同：视频仿真成功、运动预测、地理参考、细粒度自我运动/物体/人体姿态控制与闭环驾驶指标并存。
    - 交互与部署不同：离线生成、实时交互、多智能体交通仿真以及机器人或自我中心视觉应用共存。
    - 证据完整性不同：部分工作提供大规模真实数据集与指标；部分只是概念分类且无实证验证；多篇方法论文局限性字段为空。
    开放问题:
    - 开环生成指标能否预测机器人与自主智能体的闭环执行质量？
    - 世界模型能否处理训练中从未见过的新原语、新实体或新环境，而不只是已有组合？
    - 分类法和评估框架如何用实际模型行为做实证验证？
    - 什么最小状态表示与记忆机制能支持视线外持久动态，同时保持实时交互？
    - 现有对物理规律理解或时空推理的报告是真实能力还是狭窄基准下的视觉合理性？
