  related_work_outline:
  - 'Mainstream direction: Current evidence centers on action-conditioned generative
    world models, especially diffusion/transformer designs, and on evaluating them
    beyond single-score image quality with benchmarks for consistency, control, and
    downstream utility.'
  - 'Shared research pattern: Papers pair generative dynamics models with standardized
    environments or benchmarks; they evaluate visual fidelity together with task-oriented
    metrics such as spatial consistency, memory consistency, action control, policy
    performance, or zero-shot generalization.'
  - 'Key differences: Evaluation targets differ across Atari policy performance, driving
    multi-view rollout, Minecraft spatial consistency, and robotic video/policy utility.
    Methods also differ in supervision and interaction, including latent context,
    pixel-space diffusion, physics/keypoint cues, unified video-action diffusion,
    and open-loop versus closed-loop evaluation.'
  - 'Trend evolution: Although the packet spans 2016-2026, the visible frontier evidence
    is concentrated in 2023-2026. The direction is moving from sample-efficient Atari
    and latent world-model scores toward diffusion-based world models plus stress-test
    benchmarks for long-horizon, spatial, memory, and action-control behavior.'
  - 'Open questions: Whether proxy metrics align with real downstream decisions; whether
    benchmark conclusions remain stable across implementations and compute budgets;
    and whether existing datasets cover the long-horizon closed-loop, cross-action-space,
    and physical settings where world models are expected to help.'
  related_work_outline_zh:
  - 主流方向：当前证据集中于动作条件生成式世界模型，尤其是扩散/Transformer设计，并试图用一致性、控制与下游效用基准超越单一图像质量评测。
  - 研究共性：论文将生成式动力学模型与标准化环境或基准配对，同时评估视觉保真度与任务导向指标，如空间一致性、记忆一致性、动作控制、策略表现或零样本泛化。
  - 关键差异：评测目标不同，包括Atari策略表现、驾驶多视角推演、Minecraft空间一致性与机器人视频/策略效用；方法在监督与交互上也有差异，例如潜上下文、像素扩散、物理/关键点信号、统一视频-动作扩散、开环或闭环。
  - 趋势演进：尽管证据包跨越2016–2026，但可见前沿证据集中在2023–2026；方向正从Atari样本效率与潜世界模型分数转向扩散世界模型和针对长时域、空间、记忆与动作控制的压力测试基准。
  - 开放问题：代理指标是否与真实下游决策一致；基准结论在不同实现和算力下是否稳定；现有数据集是否覆盖长时域闭环、跨动作空间与物理场景等世界模型预期发挥作用的设置。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets so world-model claims become
        comparable; examples include loop-based navigation data for spatial consistency
        and open-domain closed-loop clips for memory/action control.
      what_remains_open: Whether current task distributions cover the long-horizon,
        cross-action-space, physically varied, and deployment-like settings where
        world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, controllability, robustness, and
        decision utility beyond aggregate image scores, including scene-graph consistency,
        memory consistency, action control, and policy performance.
      what_remains_open: Whether these proxy metrics align with downstream decisions
        users actually care about, and whether they remain sensitive to the right
        failures without overfitting to visual or action priors.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through shared baselines and artifact
        signals; several works compare against established prior world models or policy
        baselines in Atari, Dreamer, driving, or robotic settings.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and hidden distributions; some visible records lack limitation
        details, making negative evidence and reproducibility boundaries incomplete.
    consensus:
    - World-model evaluation is expanding from single-score visual or game performance
      toward multi-faceted probes of consistency, controllability, and downstream
      utility.
    - Generative dynamics models are typically validated in standardized environments
      such as Atari, driving, Minecraft, or robotic manipulation across multiple views
      or action spaces.
    - Pixel-level similarity alone is treated as insufficient; researchers add physical
      plausibility, spatial consistency, memory consistency, action control, or policy
      training/evaluation signals.
    disagreements:
    - 'Evaluation targets diverge: sample-efficient Atari policy scores, driving multi-view
      long-horizon rollout, Minecraft loop-navigation spatial consistency, and robotic
      video plus policy utility.'
    - 'Interaction and supervision differ: some methods rely on open-loop generation,
      others on closed-loop action-conditioned revisits; some use observable context,
      physics/keypoint cues, or coupled video-action diffusion.'
    - 'Representation choices differ with implications for what should be measured:
      latent world-model abstraction versus pixel-space visual detail versus keypoint/depth
      or unified action-video diffusion.'
    open_questions:
    - How well do current consistency, control, and policy metrics predict real-world
      downstream decisions when benchmark conditions shift?
    - What is the minimal benchmark coverage needed to test long-horizon memory, cross-action-space
      generalization, and physical plausibility without domain overfitting?
    - How do state-of-the-art conclusions change under matched compute budgets, multiple
      implementations, and released artifacts, given visible gaps in limitation and
      reproducibility evidence?
    - Can a single evaluation suite fairly compare latent world models, pixel-space
      diffusion models, and physics-informed models without favoring one representation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，让世界模型主张具备可比性；例如环状导航数据用于空间一致性，开放域闭环片段用于记忆与动作控制。
      尚未覆盖: 当前任务分布是否覆盖长时域、跨动作空间、物理多样和接近部署的世界模型预期场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、可控性、鲁棒性和决策效用，包括场景图一致性、记忆一致性、动作控制与策略表现。
      尚未覆盖: 这些代理指标是否与用户真正关心的下游决策一致，以及是否会在不过度拟合视觉或动作先验的前提下暴露正确失败模式。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线和工件信号让结果可审计；若干工作在与既有世界模型或策略基线比较时使用Atari、Dreamer、驾驶或机器人设置。
      尚未覆盖: 结论在不同实现、算力预算和隐藏分布下是否稳定；部分可见记录缺少局限性细节，负证据与可复现边界不完整。
    共识:
    - 世界模型评测正从单一视觉或游戏得分扩展为对一致性、可控性和下游效用的多面探测。
    - 生成式动力学模型通常在标准化环境中验证，如Atari、驾驶、Minecraft或机器人操作，并覆盖多视角或动作空间。
    - 像素级相似度单独被认为不足，研究者补充物理合理性、空间一致性、记忆一致性、动作控制或策略训练/评估信号。
    分歧:
    - 评测目标不同：Atari样本效率分数、驾驶多视角长时域推演、Minecraft环状导航空间一致性，以及机器人视频与策略效用。
    - 交互和监督不同：开环生成与闭环动作条件复访、可观测上下文、物理/关键点线索或视频-动作耦合扩散。
    - 表示选择不同，隐含影响测量重点：潜在世界模型抽象、像素空间视觉细节、关键点/深度或统一动作-视频扩散。
    开放问题:
    - 当前一致性、控制与策略指标在基准条件变化时能否预测真实下游决策？
    - 测试长时域记忆、跨动作空间泛化与物理合理性所需的最小基准覆盖是什么，同时避免领域过拟合？
    - 在匹配算力、多实现和发布工件的情况下，最先进结论会如何变化？可见的局限性与复现证据存在缺口。
    - 单一评测套件能否公平比较潜在世界模型、像素空间扩散模型和物理信息模型，而不偏向某种表示？
