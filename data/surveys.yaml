  related_work_outline:
  - 'Mainstream direction: Building controllable, interactive world simulators from
    video generative models, with emphasis on action fidelity, spatial consistency,
    and physical plausibility for downstream tasks like autonomous driving and robotics.'
  - 'Shared research pattern: Augmenting pre-trained or purpose-built video generation
    models with action-conditioning, physics-informed losses, or context modules,
    then evaluating on domain-specific benchmarks beyond visual quality.'
  - 'Key differences: Evaluation targets diverge—spatial consistency (LoopNav), action
    fidelity (ACT-Bench), physical plausibility (RoboScape), and closed-loop controllability
    (FAR-Drive, DWS); architectures range from Dreamer variants to diffusion transformers.'
  - 'Trend evolution: From 2024 to 2026, the field shifted from open-loop video generation
    toward closed-loop, interactive systems with real-time constraints, accompanied
    by a rise in dedicated benchmarks and open-source artifacts.'
  - 'Open questions: How to unify multi-dimensional evaluation (spatial, temporal,
    physical, action) across domains; how to prevent compounding errors in long-horizon
    autoregressive rollouts; and how to balance real-time latency with model fidelity.'
  related_work_outline_zh:
  - 主流方向：从视频生成模型构建可控、交互式世界模拟器，强调动作保真度、空间一致性和物理合理性，服务于自动驾驶和机器人等下游任务。
  - 研究共性：通过动作条件、物理信息损失或上下文模块增强预训练或专用视频生成模型，并在超越视觉质量的领域特定基准上评估。
  - 关键差异：评测目标分化——空间一致性（LoopNav）、动作保真度（ACT-Bench）、物理合理性（RoboScape）和闭环可控性（FAR-Drive、DWS）；架构从Dreamer变体到扩散Transformer各异。
  - 趋势演进：2024至2026年，领域从开环视频生成转向具有实时约束的闭环交互系统，专用基准和开源工件随之增多。
  - 开放问题：如何跨领域统一多维评估（空间、时间、物理、动作）；如何防止长时域自回归推演中的误差累积；如何平衡实时延迟与模型保真度。
  literature_review:
    line_of_work_matrix:
    - line: World model benchmarks and evaluation suites
      what_it_solves: Quantifying spatial consistency, action fidelity, and physical
        plausibility of world models through dedicated datasets and metrics, moving
        beyond generic video quality scores.
      what_remains_open: A unified, cross-domain evaluation protocol covering long-horizon
        dynamics, multi-sensor consistency, and real-time constraints is still missing;
        most benchmarks focus on a single aspect.
    - line: Conditional world model architectures (context-aware, physics-informed,
        action-conditioned)
      what_it_solves: Enabling world models to generate future states conditioned
        on actions, context variables, or physical properties, thus supporting policy
        learning and planning in reinforcement learning and robotics.
      what_remains_open: Generalization to out-of-distribution actions and unseen
        physical parameters remains fragile; trade-offs between physical accuracy,
        visual fidelity, and computational cost are not systematically explored.
    - line: Interactive closed-loop simulation systems
      what_it_solves: Deploying world models as real-time, interactive simulators
        for autonomous driving and embodied AI, where the model's output influences
        subsequent inputs in a feedback loop.
      what_remains_open: Compounding errors in autoregressive rollouts degrade long-term
        consistency; low-latency requirements constrain model capacity; cross-view
        and cross-sensor geometric consistency under closed-loop control is not fully
        solved.
    consensus:
    - World models are transitioning from passive video generators to interactive
      simulators that must respond to actions and maintain temporal consistency.
    - Evaluation is shifting from distribution-level metrics (FID, FVD) to task-specific
      measures of action controllability, spatial memory, and physical plausibility.
    - Open-source datasets, benchmarks, and code are becoming standard practice to
      enable reproducible comparisons across world model implementations.
    disagreements:
    - 'Evaluation priorities differ: some works target spatial consistency in navigation,
      others action fidelity in driving, and others physical plausibility in robot
      manipulation, with no agreed-upon primary metric.'
    - Architectural choices vary between diffusion-based models, autoregressive transformers,
      and recurrent state-space models, each with different strengths in long-horizon
      coherence versus controllability.
    - Whether to build world models from scratch or adapt large pre-trained video
      models remains debated, as pre-training offers visual richness but may introduce
      uncontrollable biases.
    - Real-time deployment is a requirement in some systems (FAR-Drive) but not addressed
      in others, leading to different assumptions about acceptable latency and model
      complexity.
    open_questions:
    - How can we design a unified benchmark that jointly measures spatial consistency,
      action fidelity, physical plausibility, and long-horizon stability across diverse
      domains?
    - What mechanisms can prevent error accumulation in autoregressive world model
      rollouts without sacrificing responsiveness or visual quality?
    - How do world models trained in simulation transfer to real-world sensor data
      and physical interactions, and what domain gaps are most critical?
    - What is the minimal set of inductive biases (physics, geometry, memory) needed
      for a world model to serve as a reliable simulator for downstream decision-making?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准与评估套件
      解决的问题: 通过专用数据集和指标量化世界模型的空间一致性、动作保真度和物理合理性，超越通用视频质量评分。
      尚未覆盖: 仍缺乏覆盖长时域动态、多传感器一致性和实时约束的统一跨领域评估协议；多数基准仅关注单一维度。
    - 路线: 条件世界模型架构（上下文感知、物理信息、动作条件）
      解决的问题: 使世界模型能够根据动作、上下文变量或物理属性生成未来状态，从而支持强化学习和机器人中的策略学习与规划。
      尚未覆盖: 对分布外动作和未见物理参数的泛化仍脆弱；物理准确性、视觉保真度和计算成本之间的权衡尚未系统探索。
    - 路线: 交互式闭环模拟系统
      解决的问题: 将世界模型部署为实时交互式模拟器，用于自动驾驶和具身智能，其中模型输出在反馈循环中影响后续输入。
      尚未覆盖: 自回归推演中的误差累积会降低长期一致性；低延迟要求限制模型容量；闭环控制下的跨视图和跨传感器几何一致性尚未完全解决。
    共识:
    - 世界模型正从被动视频生成器转变为必须响应动作并保持时间一致性的交互式模拟器。
    - 评估正从分布级指标（FID、FVD）转向动作可控性、空间记忆和物理合理性的任务特定度量。
    - 开源数据集、基准和代码正成为标准实践，以实现不同世界模型实现间的可复现比较。
    分歧:
    - 评估优先级不同：一些工作针对导航中的空间一致性，另一些针对驾驶中的动作保真度，还有针对机器人操作中的物理合理性，缺乏公认的主要指标。
    - 架构选择在基于扩散的模型、自回归Transformer和循环状态空间模型之间分化，各自在长时域连贯性与可控性方面具有不同优势。
    - 是从头构建世界模型还是适配大型预训练视频模型仍存在争议，预训练提供视觉丰富性但可能引入不可控的偏差。
    - 实时部署在某些系统中是必需条件（如FAR-Drive），但在其他工作中未被考虑，导致对可接受延迟和模型复杂度的假设不同。
    开放问题:
    - 如何设计一个统一基准，跨不同领域联合测量空间一致性、动作保真度、物理合理性和长时域稳定性？
    - 何种机制能在不牺牲响应速度或视觉质量的前提下，防止自回归世界模型推演中的误差累积？
    - 在仿真中训练的世界模型如何迁移到真实传感器数据和物理交互，哪些领域差距最为关键？
    - 世界模型作为可靠的下游决策模拟器，所需的最小归纳偏置集（物理、几何、记忆）是什么？
