  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for embodied prediction and
    control, especially driving and robotics, built on diffusion transformers or generative
    video models that predict future observations from actions, language, or context.'
  - 'Shared research pattern: World models are trained on trajectories or videos and
    evaluated by generation quality, consistency, control accuracy, downstream policy
    utility, or zero-shot generalization, with increasing benchmark use.'
  - 'Key differences: Work differs in domain, representation such as latent recurrent
    state-space, VAE-transformer, diffusion transformer, or video-action diffusion;
    grounding signals such as physics, compositionality, or context; and evaluation
    targets from driving to games to robot policy.'
  - 'Trend evolution: From sample-efficient model-based reinforcement learning in
    visual game settings around 2023-2024 toward large-scale driving and robot video
    generation, unified action-video pretraining, physics-informed embodied models,
    and consistency/control benchmarks around 2025-2026.'
  - 'Open questions: Cross-embodiment, cross-dataset, and physical-environment transfer;
    long-horizon memory and action control; sim-to-real safety alignment; and generalization
    to unseen primitives, contexts, or dynamics remain unresolved.'
  related_work_outline_zh:
  - 主流方向：面向具身预测与控制的领域世界模型，尤其集中在驾驶和机器人，采用扩散Transformer或生成式视频模型，从动作、语言或上下文预测未来观测。
  - 研究共性：在轨迹或视频上训练世界模型，并以生成质量、一致性、控制精度、下游策略效用或零样本泛化作为评测重点，越来越多引入基准。
  - 关键差异：工作在领域、表示上分化，如潜在循环状态空间、VAE-Transformer、扩散Transformer或视频-动作扩散；接地信号包括物理、组合性或上下文；评测目标从驾驶、游戏到机器人策略各不相同。
  - 趋势演进：从2023-2024年左右视觉游戏场景中的样本高效模型强化学习，走向2025-2026年大规模驾驶和机器人视频生成、统一动作-视频预训练、物理信息具身模型及一致性和控制基准。
  - 开放问题：跨本体、跨数据集和物理环境迁移，长时记忆与动作控制，仿真到真实的安全对齐，以及对未见原语、上下文或动力学的泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to domain-specific states, actions, and
        constraints so they can support downstream prediction or policy learning in
        robot and control settings.
      what_remains_open: Whether gains transfer across embodiments, datasets, or physical
        environments remains unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view scene prediction, long-horizon
        rollout, and zero-shot driving validation across datasets.
      what_remains_open: Alignment between simulator gains and real-world safety or
        operational outcomes is not established.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in interactive environments and measures
        spatial, memory, and action consistency through loop-based or closed-loop
        benchmarks.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change, and long-term memory, remain difficult.
    - line: Model-based reinforcement learning with visual world models
      what_it_solves: Learns compact world models for sample-efficient policy optimization
        in visual control and game tasks.
      what_remains_open: Evidence is limited to small visual benchmarks; transfer
        to complex embodied domains and unseen dynamics is unresolved.
    - line: Generative robot video and action pretraining
      what_it_solves: Couples video and action generation for multitask robot datasets
        to learn policy, forward or inverse dynamics, or plan imagination.
      what_remains_open: Physical plausibility, real-robot execution beyond simulation,
        and support for unseen primitives or actions remain open.
    consensus:
    - Application-oriented world models are increasingly framed as generative predictors
      of future observations conditioned on actions, language, or context.
    - Training commonly uses trajectory or video data, and evaluation spans visual
      quality, temporal or spatial consistency, action control, and downstream policy
      utility.
    - Domain-specific evaluation is becoming central, with driving, robotics, and
      interactive game settings each stressing different consistency and control properties.
    - There is growing recognition that per-frame generation quality is insufficient;
      benchmarks increasingly probe long-horizon memory, closed-loop control, and
      physical plausibility.
    disagreements:
    - 'Representation choices diverge: recurrent latent state-space or VAE-transformer
      models compete with diffusion transformer and video-action diffusion designs.'
    - Grounding signals differ across context conditioning, physics-informed depth
      and keypoint learning, compositional language primitives, and unified action
      diffusion.
    - 'Evaluation targets differ: driving scene prediction and cross-dataset transfer,
      game memory and action consistency, robot task generalization, or sample-efficient
      policy performance.'
    - 'Deployment and interaction settings differ: offline video prediction, closed-loop
      interactive benchmarks, simulation-based policy evaluation, and real-world safety
      alignment are not equally addressed.'
    open_questions:
    - Can driving world models generalize across datasets and improve real-world safety
      or operational outcomes rather than only simulator metrics?
    - How should memory consistency, action control, and physical plausibility be
      evaluated in open-domain closed-loop settings?
    - Do contextual, compositional, and physics-informed world models transfer to
      unseen primitives, dynamics, or embodiments beyond the evaluated tasks?
    - Are improvements on game or small control benchmarks indicative of performance
      in embodied, high-dimensional domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到具有领域状态、动作和约束的具体任务，以支持机器人或控制场景中的预测和策略学习。
      尚未覆盖: 改进能否跨本体、数据集或物理环境迁移仍未得到验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 用世界模型进行多视角场景预测、长时域展开和跨数据集的零样本驾驶验证。
      尚未覆盖: 仿真收益与真实安全或运营结果之间是否一致尚未确定。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落实到交互环境，并通过循环或闭环基准评测空间、记忆和动作一致性。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化，以及长期记忆仍很难。
    - 路线: 基于模型的视觉强化学习
      解决的问题: 学习紧凑世界模型，用于视觉控制和游戏任务中的样本高效策略优化。
      尚未覆盖: 证据局限于小规模视觉基准，向复杂具身领域和未见动力学的迁移尚未解决。
    - 路线: 生成式机器人视频与动作预训练
      解决的问题: 将视频与动作生成耦合到多任务机器人数据集中，学习策略、前向或逆动力学或想象规划。
      尚未覆盖: 物理合理性、仿真之外的真实机器人执行，以及对未见原语或动作的支持仍然开放。
    共识:
    - 面向应用的世界模型越来越多被表述为以动作、语言或上下文为条件的未来观测生成预测器。
    - 训练通常使用轨迹或视频数据，评测覆盖视觉质量、时间或空间一致性、动作控制和下游策略效用。
    - 领域特定评测日益重要，驾驶、机器人和交互式游戏场景分别强调不同的一致性和控制属性。
    - 越来越多工作认识到单帧生成质量不足，基准开始探测长时记忆、闭环控制和物理合理性。
    分歧:
    - 表示选择不同：循环潜在状态空间或VAE-Transformer模型与扩散Transformer、视频-动作扩散设计并存。
    - 接地信号不同：上下文条件、物理信息的深度和关键点学习、组合语言原语、统一动作扩散各有侧重。
    - 评测目标不同：驾驶场景预测与跨数据集迁移、游戏记忆与动作一致性、机器人任务泛化或样本高效策略性能分别被强调。
    - 部署与交互设置不同：离线视频预测、闭环交互基准、仿真策略评估和真实安全对齐未被同等处理。
    开放问题:
    - 驾驶世界模型能否跨数据集泛化，并改善真实安全或运营结果，而不只是提升仿真指标？
    - 如何在开放域闭环环境中评测记忆一致性、动作控制和物理合理性？
    - 上下文、组合式和物理信息世界模型能否迁移到评测任务之外的未见原语、动力学或本体？
    - 游戏或小规模控制基准上的改进是否代表其在具身高维领域中的表现？
