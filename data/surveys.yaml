  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from generic generation
    quality metrics toward specialized benchmarks that probe spatial, temporal, and
    memory consistency, often in closed-loop or interactive settings.'
  - 'Shared research pattern: All works aim to quantify and improve the fidelity of
    world-model predictions, but they differ in which dimension of consistency they
    measure—action control, scene geometry, physics, or agent performance.'
  - 'Key differences: Evaluation targets range from agent return in standard games
    (Atari) to physical plausibility of rendered videos (RoboScape) and memory-consistency
    over long trajectories (MIND); interaction modes vary between open-loop prediction
    and closed-loop action-conditioned generation.'
  - 'Trend evolution: The field in 2020–2023 relied heavily on established RL benchmarks
    like Atari 100k; by 2025–2026, dedicated datasets and metrics (LoopNav, MIND)
    have emerged that directly test world-model-specific capabilities, reflecting
    a move toward auditable and reproducible evaluation.'
  - 'Open questions: Whether proxy metrics such as scene-graph consistency scores
    align with downstream task success, how benchmark conclusions hold under varying
    compute budgets, and whether existing task distributions cover real-world deployment
    settings where world models are expected to help.'
  related_work_outline_zh:
  - 主流方向：世界模型的评估正从通用生成质量指标转向专门的一致性、记忆和物理测试基准，常采用闭环或交互式设置。
  - 研究共性：所有工作都试图量化和改进世界模型预测的保真度，但测量的维度不同——动作控制、场景几何、物理合理性或智能体性能。
  - 关键差异：评估目标从标准游戏（Atari）中的智能体回报，到生成视频的物理合理性（RoboScape），以及长轨迹下的记忆一致性（MIND）；交互模式在开环预测和闭环动作条件生成之间有所不同。
  - 趋势演进：2020-2023年主要依赖Atari 100k等成熟RL基准；到2025-2026年，专门针对世界模型能力的数据集与指标（如LoopNav, MIND）出现，标志着向可审计、可复现的评估方向演进。
  - 开放问题：场景图一致性分数等代理指标是否与下游任务成功对齐，基准结论在不同计算预算下是否稳定，以及现有任务分布是否覆盖了世界模型预期发挥作用的真实部署场景。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets (e.g., LoopNav for Minecraft
        navigation, MIND for open-domain video, and reuse of Atari 100k / Nuscenes)
        that make world-model claims comparable across different architectures.
      what_remains_open: Whether the task distribution covers real-world settings
        where world models are expected to help, such as long-horizon robot manipulation
        or multi-agent scenarios, and whether datasets are diverse enough across action
        spaces and visual domains.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores, using metrics like Scene Graph Consistency
        Score (LoopNav) and memory-consistency/action-control frameworks (MIND), as
        well as long-horizon and zero-shot evaluations.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; the comprehensiveness of stress tests for physical
        plausibility and safety-critical failures remains unverified.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines (Atari 100k,
        Nuscenes), open-source artifacts, and reporting conventions that enable fair
        comparison of methods like DIAMOND, STORM, and MaskGWM.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; many papers lack detailed limitation sections, and there
        is no standardized protocol for reporting training variance or failure modes.
    consensus:
    - World-model evaluation is moving beyond pixel-level reconstruction quality to
      measure spatial, temporal, and memory consistency, often through closed-loop,
      interactive benchmarks.
    - New benchmarks introduce fine-grained metrics that capture specific world-model
      capabilities such as action control, long-term memory, and scene geometry invariance,
      rather than relying solely on task-level return.
    - Standardized benchmarks like Atari 100k and Nuscenes remain widely used for
      comparability, but they are increasingly complemented by dedicated datasets
      that stress-test generalization and coherence.
    disagreements:
    - 'Evaluation targets differ: some works focus on agent performance in a task
      (e.g., DIAMOND and STORM on Atari), others on physical plausibility of generated
      videos (RoboScape), and still others on memory consistency across viewpoints
      (MIND).'
    - 'Interaction modes vary: closed-loop action-conditioned generation is used by
      LoopNav and MIND to evaluate controllability, while open-loop video prediction
      benchmarks like MaskGWM emphasize long-horizon visual quality without interactive
      feedback.'
    - Task settings range from simulated environments (Minecraft, Atari, CARL) to
      driving datasets (Nuscenes, Waymo), which affects the types of consistency that
      can be measured and the relevance to real-world deployment.
    open_questions:
    - Do existing proxy metrics, such as Scene Graph Consistency Score, correlate
      with downstream task success or human judgments of spatial coherence?
    - How stable are benchmark conclusions across different implementations and compute
      budgets, given the lack of standardized reporting on training variance and failure
      modes?
    - To what extent do current benchmarks cover the long-horizon, multi-agent, and
      safety-critical settings where world models are expected to provide the most
      value?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集（如用于Minecraft导航的LoopNav、用于开放域视频的MIND，以及Atari 100k/Nuscenes的复用），使不同架构的世界模型主张具有可比性。
      尚未覆盖: 任务分布是否覆盖了世界模型预期发挥作用的真实设置，如长时域机器人操作或多智能体场景；数据集在动作空间和视觉域上的多样性是否足够。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，使用场景图一致性分数（LoopNav）和记忆一致性/动作控制框架（MIND）等指标，以及长时域和零样本评估。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致；物理合理性和安全关键故障的压力测试全面性尚未验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（Atari 100k, Nuscenes）、开源工件和报告惯例，使DIAMOND、STORM、MaskGWM等方法的结果可审计。
      尚未覆盖: 基准结论在不同实现和计算预算下是否稳定；许多论文缺乏详细的局限性分析，缺少报告训练方差或故障模式的标准化协议。
    共识:
    - 世界模型评估正从像素级重建质量转向测量空间、时间和记忆一致性，通常通过闭环、交互式基准实现。
    - 新基准引入了细粒度指标，捕捉特定世界模型能力，如动作控制、长期记忆和场景几何不变性，而非仅依赖任务级回报。
    - Atari 100k和Nuscenes等标准化基准仍被广泛用于可比性，但正越来越多地被专门的数据集所补充，这些数据集对泛化性和连贯性进行压力测试。
