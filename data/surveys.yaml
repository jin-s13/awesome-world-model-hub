  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from open-loop generation
    quality toward closed-loop consistency, action controllability, and long-horizon
    or zero-shot generalization, anchored by LoopNav, MIND, and method evaluations
    on driving, robot, game, and control suites.'
  - 'Shared research pattern: Papers pair targeted evaluation signals such as spatial
    scene-graph consistency, memory/action control, physical plausibility, visual
    detail, or contextual zero-shot dynamics with standardized environments and baseline
    comparisons.'
  - 'Key differences: Research divides between constructing new benchmarks/metrics
    and using existing suites to improve model architectures; representations also
    diverge across diffusion, VAE-transformer, recurrent state-space, and coupled
    video-action diffusion.'
  - 'Trend evolution: Across 2023-2026, the evidence moves from Atari 100k and small
    contextual RL evaluations toward open-domain, multi-view, long-horizon, physics-informed,
    and memory/action-centered benchmark designs.'
  - 'Open questions: Metric-to-downstream-decision alignment, coverage beyond curated
    scenes, stability under missing limitation and artifact metadata, and generalization
    beyond small or selected task suites remain unresolved verification gaps.'
  related_work_outline_zh:
  - 主流方向：世界模型评价从开放生成质量转向闭环一致性、动作控制和长时域/零样本泛化，证据集中于 LoopNav、MIND 及驾驶、机器人、游戏、控制套件。
  - 研究共性：多篇工作将空间一致性、记忆/动作控制、物理合理性、视觉细节或上下文零样本动力学等评测信号与标准环境和基线比较结合。
  - 关键差异：一部分工作专注于基准/指标构建，另一部分借现有套件改进模型架构；表示方式涵盖扩散、VAE-Transformer、循环状态空间和视频-动作耦合扩散。
  - 趋势演进：在 2023-2026 年内，证据从 Atari 100k 和小型上下文 RL 评测，走向开放域、多视角、长时域、物理引导和记忆/动作为中心的基准设计。
  - 开放问题：指标与下游决策一致性、策划场景之外的覆盖、缺失 limitations 与工件元数据时的结论稳定性，以及小规模任务上的泛化边界仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for spatiotemporal consistency and action
        control
      what_it_solves: Creates reusable evaluation protocols for loop-based spatial
        consistency, memory stability, and action-controllable generation, as in LoopNav
        and MIND.
      what_remains_open: Whether their curated scenes, actions, and closed-loop tasks
        cover deployment settings is not demonstrated; abstracts do not report benchmark
        discrimination across many models.
    - line: Metric and stress-test design beyond aggregate visual quality
      what_it_solves: Introduces scene-graph consistency, memory/action-control, long-horizon
        rollout, zero-shot, and physical-plausibility signals that expose failures
        hidden by reconstruction or visual fidelity alone.
      what_remains_open: Alignment between these proxy metrics and downstream robot/driving
        decisions remains unmeasured, and threshold sensitivity across settings is
        missing.
    - line: Comparable baselines and reporting for world-model methods
      what_it_solves: Evaluates architecture choices on Atari 100k, nuScenes, OpenDV-2K,
        Waymo, CARL, and robot/driving video suites using common baselines and training-efficiency
        measures.
      what_remains_open: Multiple visible limitation fields are empty and OpenAlex
        citation/artifact metadata is absent, leaving stability across implementations
        and compute budgets unverified.
    consensus:
    - World models are increasingly evaluated through closed-loop or rollout-based
      protocols rather than only open-loop reconstruction.
    - Specialized consistency signals such as spatial scene-graph stability, long-term
      memory, action control, zero-shot generalization, and physical plausibility
      are gaining attention.
    - Standardized datasets and benchmark suites are treated as the main basis for
      comparing generative world-model methods.
    disagreements:
    - Some works contribute benchmark construction and metric validity, while others
      contribute model architectures evaluated on existing suites; the evidence emphasis
      therefore differs.
    - Evaluation targets diverge across navigation spatial consistency, cross-view
      memory/action control, visual details and physical plausibility, and contextual
      zero-shot dynamics.
    - 'Model representations differ substantially: diffusion-based generation, VAE-transformer
      stochastic models, recurrent state-space with context, and coupled video-action
      diffusion are all present.'
    - Evaluation settings and supervision differ across open-domain curated videos,
      standard game/control environments, driving video datasets, and large robotic
      datasets.
    open_questions:
    - Do scene-graph consistency and memory/action-control metrics predict downstream
      policy performance or real deployment reliability?
    - What benchmark coverage is needed beyond curated Minecraft, video, game, and
      driving scenes for long-horizon, multi-view, cross-action, and physics-rich
      settings?
    - Can reported results be reproduced across implementations and compute budgets
      when many limitation fields and citation/artifact metadata are missing?
    - Does zero-shot generalization evidence from two CARL tasks or selected driving/robot
      datasets transfer to broader unseen dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向时空一致性与动作控制的基准任务与数据集设计
      解决的问题: 通过 LoopNav 的 Minecraft 循环导航和 MIND 的开放域回访视频，定义空间一致性、记忆一致性和动作控制的可复用评测。
      尚未覆盖: 策划场景、动作空间和闭环任务是否覆盖真实部署未经验证；摘要缺少对多模型的区分度证据。
    - 路线: 超越视觉质量的指标与压力测试设计
      解决的问题: 引入场景图一致性、记忆/动作控制、长时域展开、零样本和物理合理性等信号，揭示仅靠重建或视觉质量无法暴露的失败。
      尚未覆盖: 这些代理指标与下游机器人/驾驶决策的一致性尚未测量，跨设置阈值敏感度也缺失。
    - 路线: 世界模型方法的可比基线与报告规范
      解决的问题: 在 Atari 100k、nuScenes、OpenDV-2K、Waymo、CARL 及机器人/驾驶视频套件上，用统一基线和训练效率指标比较架构选择。
      尚未覆盖: 多处 limitations 字段为空且 OpenAlex 引文/工件元数据缺失，跨实现与算力预算的稳定性未验证。
    共识:
    - 世界模型评价正从开放循环重建走向闭环或展开式协议。
    - 空间场景图稳定性、长期记忆、动作控制、零样本泛化和物理合理性等专门一致性信号受到关注。
    - 标准数据集和基准套件被视为比较生成式世界模型方法的主要基础。
    分歧:
    - 部分工作贡献基准构建和指标有效性，部分工作借现有套件推进模型架构，证据重点不同。
    - 评测目标分别在导航空间一致性、跨视角记忆/动作控制、视觉细节与物理合理性、上下文零样本动力学上存在分歧。
    - 模型表示差异明显：扩散生成、VAE-Transformer 随机模型、带上下文的循环状态空间、视频-动作耦合扩散并存。
    - 评测设置和监督不同，涵盖开放域策划视频、标准游戏/控制环境、驾驶视频和大规模机器人数据集。
    开放问题:
    - 场景图一致性和记忆/动作控制指标能否预测下游策略性能或实际部署可靠性？
    - 在策划的 Minecraft、视频、游戏和驾驶场景之外，长时域、多视角、跨动作空间和物理丰富设置需要哪些基准覆盖？
    - 当许多 limitations 字段和引文/工件元数据缺失时，报告结果能否跨实现和算力预算复现？
    - 来自两个 CARL 任务或特定驾驶/机器人数据集上的零样本泛化证据能否迁移到更广泛的未见动态？
