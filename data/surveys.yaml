  related_work_outline:
  - 'Mainstream direction: Generative video world models built on diffusion transformers
    dominate recent evidence, especially for driving and robot settings, with coupled
    action-video modeling and auxiliary objectives such as mask reconstruction, depth,
    or keypoint dynamics.'
  - 'Shared research pattern: Papers learn forward dynamics from visual observations
    and train with self-supervised or generative objectives, then evaluate on standardized
    datasets using video fidelity, policy performance, or consistency metrics.'
  - 'Key differences: Work splits between latent model-based reinforcement learning
    for sample-efficient policy learning and full-frame generative world models; supervision
    and interaction interfaces differ across context values, language primitives,
    physics signals, and action diffusion.'
  - 'Trend evolution: Evidence is concentrated in 2023-2026, moving from latent RL
    world models toward large-scale diffusion/transformer world models and explicit
    benchmarks for memory consistency and action control within the current frontier.'
  - 'Open questions: Transferability beyond reported task families, whether gains
    come from model versus planner/data/protocol, and missing limitation or reproducibility
    details remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：生成式视频世界模型以扩散Transformer为主，尤其在驾驶和机器人场景中，并逐步耦合动作与视频建模，加入掩码重建、深度或关键点动力学等辅助目标。
  - 研究共性：多数工作从视觉观察中学习前向动力学，采用自监督或生成式训练，在标准数据集上以视频保真度、策略表现或一致性指标进行评估。
  - 关键差异：已有工作分为面向样本效率的潜在模型式强化学习，以及面向逼真生成的完整视频世界模型；监督信号和动作接口在上下文值、语言原语、物理信号与动作扩散之间存在不同。
  - 趋势演进：证据集中在2023至2026年，研究从潜在RL世界模型走向大规模扩散/Transformer世界模型，并出现更明确的记忆一致性与动作控制基准，属于当前前沿内的演进。
  - 开放问题：方法能否迁移到报告任务族之外、收益来自模型还是规划器/数据/协议，以及缺失的局限性与可复现信息仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world model representation and objective design
      what_it_solves: Builds forward models that synthesize future RGB frames from
        observations and actions, using diffusion transformers, mask reconstruction,
        physics-informed depth/keypoints, or compositional conditioning.
      what_remains_open: Evidence mainly covers driving or robot video domains; transfer
        beyond those tasks and real-world deployment are underexplored, and several
        records omit limitations.
    - line: Latent model-based reinforcement learning and context-conditioned dynamics
      what_it_solves: Learns compact stochastic latent dynamics for sample-efficient
        policy learning on imagined trajectories, with context conditioning for zero-shot
        generalization under changing dynamics.
      what_remains_open: Public evidence is limited to Atari-like or CARL tasks; context-based
        generalization assumes observable context, leaving hidden-context settings
        and broader benchmarks unverified.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to downstream actions through language-primitive
        video plans, coupled action-video diffusion, or policy training and evaluation
        on generated rollouts.
      what_remains_open: It is unclear how much gain comes from the model versus the
        planner, controller, pretraining data, or task prior; some evaluation remains
        simulation-only or sensitive to parsing assumptions.
    - line: Benchmarking and evaluation protocols for world-model capabilities
      what_it_solves: Provides datasets and metrics for spatial consistency, memory
        consistency, and action control, enabling comparison across world models beyond
        per-pixel generation quality.
      what_remains_open: Available benchmark abstracts have limited result evidence,
        and selected scenes, action spaces, and data scale may not cover long-horizon
        or cross-embodiment boundaries.
    consensus:
    - Recent world-model research treats learning future dynamics from visual experience
      as central, often combining generative objectives with downstream action or
      policy signals.
    - Diffusion and transformer-based backbones appear across driving, robot, and
      navigation-oriented evidence, indicating a shared architectural direction.
    - Auxiliary self-supervised tasks such as mask reconstruction, depth prediction,
      and keypoint dynamics are used to improve visual fidelity, temporal coherence,
      or physical plausibility.
    - Benchmarks and standardized datasets are gaining importance for measuring world-model
      abilities beyond single-task reward or perceptual quality.
    disagreements:
    - Representation differs between compact latent states for sample-efficient reinforcement
      learning and full-frame generative video models.
    - 'Supervision signals differ: observable context values, language-decomposed
      primitives, physics-informed depth and keypoints, or coupled action-video diffusion.'
    - Evaluation targets differ across driving video quality, Atari human-normalized
      performance, robot video synthesis and execution, and memory/spatial consistency
      benchmarks.
    - Interaction modes differ from policy learning on imagined rollouts to language-primitive
      video planning and domain-specific action diffusion.
    - Generalization assumptions differ, including known observable context, composition
      of seen primitives, and zero-shot transfer across datasets or scenes.
    open_questions:
    - Which representation and training objectives transfer beyond the reported driving,
      robot, Atari-like, or navigation task families?
    - How much of reported improvement is attributable to the proposed model rather
      than the planner, controller, pretraining data, or evaluation protocol?
    - Can current benchmarks measure real-world physical plausibility, long-term memory
      consistency, and cross-action-space generalization?
    - Do context-conditioned or composition-based models still work when context is
      not observable or instructions require novel primitives?
    - Where are code, datasets, metrics, baselines, or limitations missing, and how
      does that affect reproducibility and method comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频世界模型表示与目标设计
      解决的问题: 构建从观测与动作合成未来RGB帧的前向模型，使用扩散Transformer、掩码重建、物理信息深度/关键点或组合条件。
      尚未覆盖: 证据主要覆盖驾驶或机器人视频领域；这些任务外与真实部署的迁移不足，且部分记录缺少局限性。
    - 路线: 潜在模型式强化学习与上下文条件动力学
      解决的问题: 学习紧凑随机潜在动力学，在想象轨迹上实现样本高效策略学习，并以上下文条件实现变化动力学下的零样本泛化。
      尚未覆盖: 公开证据限于Atari类或CARL任务；基于上下文的泛化假设上下文可观测，隐藏上下文和更广泛基准仍未验证。
    - 路线: 规划与动作接口方法
      解决的问题: 通过语言原语视频计划、耦合动作-视频扩散或在生成轨迹上训练与评估策略，将学习到的动力学连接到下游行动。
      尚未覆盖: 收益有多少来自模型而不是规划器、控制器、预训练数据或任务先验尚不清晰；部分评估仅仿真或依赖解析假设。
    - 路线: 世界模型能力基准与评估协议
      解决的问题: 提供空间一致性、记忆一致性和动作控制的数据集与指标，使世界模型能在像素级生成质量之外进行比较。
      尚未覆盖: 现有基准摘要实验证据有限，所选场景、动作空间和数据规模可能无法覆盖长时域或跨具身边界。
    共识:
    - 近期世界模型研究把从视觉经验中学习未来动力学视为核心，并常将生成目标与下游动作或策略信号结合。
    - 扩散与Transformer类骨干在驾驶、机器人和导航类证据中反复出现，代表共享的架构方向。
    - 掩码重建、深度预测和关键点动力学等辅助自监督任务被用来改善视觉保真度、时序一致性或物理合理性。
    - 基准和标准数据集在测量单任务奖励或感知质量之外的世界模型能力上越来越重要。
    分歧:
    - 表示不同：既有面向样本效率强化学习的紧凑潜在状态，也有面向合成的完整视频生成模型。
    - 监督信号不同：可观测上下文值、语言分解原语、物理信息深度和关键点，或耦合动作-视频扩散。
    - 评测目标不同：驾驶视频质量、Atari人类标准化表现、机器人视频合成与执行、记忆与空间一致性基准。
    - 交互模式不同：在想象轨迹上学习策略、基于语言原语的视频规划，或域特定动作扩散。
    - 泛化假设不同：已知可观测上下文、已见原语的组合，或跨数据集/场景的零样本迁移。
    开放问题:
    - 哪些表示与训练目标能迁移到所报告驾驶、机器人、Atari类或导航任务族之外？
    - 改进中有多少来自模型本身，而不是规划器、控制器、预训练数据或评估协议？
    - 当前基准能否测量真实物理合理性、长期记忆一致性和跨动作空间泛化？
    - 当上下文不可观测或指令需要全新原语时，上下文条件或组合式模型是否仍有效？
    - 代码、数据集、指标、基线或局限性缺失的部分如何影响可复现性和方法对比？
