  related_work_outline:
  - 'Mainstream direction: Evaluation and dataset design for world models, especially
    in embodied, driving, and control settings. Benchmarks such as LoopNav and MIND
    use curated video-plus-action tasks to measure spatial consistency, memory, or
    action control, while model papers rely on Atari 100k, CARL, NuScenes/OpenDV-2K/Waymo
    as evidence.'
  - 'Shared research pattern: Work couples a generative or predictive model with explicit
    evaluation protocols and metrics to make claims about visual fidelity, dynamics,
    generalization, or decision utility testable rather than assuming visual realism
    is sufficient.'
  - 'Key differences: Evaluation targets differ from sample-efficient Atari agents
    to long-horizon driving video, zero-shot contextual dynamics, physics plausibility,
    and action-conditioned robot pretraining. Supervision and evaluation modes also
    differ: open-loop visual prediction, closed-loop action-conditioned rollout, or
    downstream policy training.'
  - 'Trend evolution: The top evidence is concentrated in 2023-2026, so the visible
    trend is within the current frontier: from Atari/sample-efficiency world-model
    benchmarks toward open-domain embodied and driving benchmarks with consistency
    metrics and baselines.'
  - 'Open questions: Metric alignment with downstream decisions, coverage under deployment
    shifts, stability across compute/implementation budgets, and incomplete limitation
    or baseline reporting remain open; missing details should be treated as verification
    gaps.'
  related_work_outline_zh:
  - 主流方向：面向世界模型的评测与数据集设计，尤其是具身、驾驶和控制场景。LoopNav、MIND等基准用精选的视频加动作任务衡量空间一致性、记忆或动作控制，而模型论文仍以Atari
    100k、CARL、NuScenes/OpenDV-2K/Waymo作为证据。
  - 研究共性：工作将生成或预测模型与显式评测协议和指标结合，使视觉保真度、动力学、泛化或决策效用等主张可检验，而不再假设视觉真实感足够。
  - 关键差异：评测目标从样本高效Atari智能体到长时域驾驶视频、零样本上下文动力学、物理合理性以及动作条件机器人预训练各不相同。监督和评测模式也不同：开环视觉预测、闭环动作条件展开或下游策略训练。
  - 趋势演进：头部证据集中在2023-2026年，可见趋势处于当前前沿内：从Atari/样本效率世界模型基准，走向开放域具身和驾驶基准，并引入一致性指标和基线。
  - 开放问题：指标与下游决策的一致性、部署偏移下的覆盖、跨算力/实现预算的稳定性，以及局限性和基线报告不完整仍有待解决；缺失细节应视为验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets, for example loop-navigation
        or memory/action-control suites, to make world-model claims about spatial,
        temporal, and action consistency comparable.
      what_remains_open: Coverage of deployment settings is unresolved; curated scenes
        or game environments may not represent the full distribution where world models
        are expected to operate.
    - line: Metric and stress-test design
      what_it_solves: Probes visual fidelity, long-horizon prediction, zero-shot dynamics
        transfer, spatial consistency, memory consistency, action control, or physics
        plausibility beyond aggregate scores.
      what_remains_open: Proxy metrics may not align with downstream decision utility;
        robustness to pixel variation, action-space mismatch, and distribution shift
        is not fully established.
    - line: Comparable baselines and reporting
      what_it_solves: Uses baselines, datasets, code, and benchmark protocols to make
        model results auditable across different architectures and training budgets.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and unseen datasets remains unverified; many papers omit
        explicit limitations.
    consensus:
    - Recent world-model work treats evaluation as central, using named benchmarks
      and task protocols instead of relying only on visual inspection.
    - 'Benchmark construction and model evaluation are tightly coupled: new tasks
      reveal failures in memory, action control, or long-horizon dynamics that generic
      visual-generation metrics miss.'
    - Reproducibility artifacts such as open datasets, code, or baseline models are
      valued, even when coverage and standardization remain incomplete.
    disagreements:
    - 'Evaluation targets differ: some work targets sample-efficient Atari control,
      some zero-shot contextual dynamics, some driving video prediction, and some
      embodied action-conditioned generation.'
    - 'Representation choices differ: diffusion-based video models, recurrent state-space
      models, and transformer/VAE stochastic models are used across the evidence.'
    - 'Supervision and interaction modes differ: some evaluations use action-free
      pixel-only video, some require paired actions or observable contexts, and some
      use closed-loop action-conditioned protocols.'
    - 'Evaluation settings differ: curated Minecraft/driving/robotic scenes versus
      simulated control tasks versus real-world driving datasets.'
    open_questions:
    - Do spatial consistency, memory consistency, and action-control metrics predict
      downstream policy quality in robotics or driving?
    - Do curated benchmark scenes and tasks cover the long-tail deployment conditions
      where world models are expected to help?
    - Are current benchmark conclusions stable across implementation choices, compute
      budgets, and distribution shifts?
    - What level of limitation, baseline, and metric reporting is needed to make world-model
      evaluations auditable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务与数据集，例如循环导航或记忆/动作控制评测，让世界模型在空间、时间和动作一致性方面的能力可比较。
      尚未覆盖: 部署场景覆盖仍不明确；精选场景或游戏环境未必代表世界模型预期运行的全部分布。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验视觉保真度、长时域预测、零样本动力学迁移、空间一致性、记忆一致性、动作控制或物理合理性。
      尚未覆盖: 代理指标与下游决策效用是否一致尚未解决；对像素变化、动作空间不匹配和分布偏移的鲁棒性尚未完全建立。
    - 路线: 可比基线与报告规范
      解决的问题: 通过基线、数据集、代码和评测协议，让不同架构和训练预算下的模型结果可审计。
      尚未覆盖: 结论在实现、算力预算和未见数据集上的稳定性尚未验证；许多工作缺少明确局限性说明。
    共识:
    - 近期世界模型工作把评测放在核心位置，使用命名基准和任务协议，而不再只依赖视觉检查。
    - 基准构建与模型评测紧密耦合：新任务暴露了记忆、动作控制或长时域动力学方面通用视觉生成指标遗漏的失败。
    - 开放数据集、代码或基线模型等可复现工件受到重视，但覆盖范围和标准化仍不完整。
    分歧:
    - 评测目标不同：有的关注样本高效Atari控制，有的关注零样本上下文动力学，有的关注驾驶视频预测，有的关注具身动作条件生成。
    - 表示方式不同：证据中同时出现基于扩散的视频模型、循环状态空间模型和Transformer/VAE随机模型。
    - 监督与交互模式不同：有的评测使用无动作像素视频，有的需要成对动作或可观测上下文，有的采用闭环动作条件协议。
    - 评测场景不同：精选Minecraft/驾驶/机器人场景、模拟控制任务和真实驾驶数据集各有侧重。
    开放问题:
    - 空间一致性、记忆一致性和动作控制指标能否预测机器人或驾驶策略的下游质量？
    - 精选基准场景和任务是否覆盖世界模型预期帮助的长尾部署条件？
    - 当前基准结论在不同实现、算力预算和分布偏移下是否稳定？
    - 需要怎样的局限性、基线和指标报告才能让世界模型评测可审计？
