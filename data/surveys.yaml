  related_work_outline:
  - 'Mainstream direction: Benchmark-oriented world-model evaluation is centered on
    action-conditioned video prediction and control, with dedicated datasets such
    as LoopNav and MIND testing spatial consistency, memory, and action control in
    driving, robotics, and game settings.'
  - 'Shared research pattern: Work moves beyond visual reconstruction scores toward
    targeted stress tests: long-horizon rollout, zero-shot transfer, scene-graph consistency,
    memory persistence, and action-conditioned generalization.'
  - 'Key differences: Some submissions build datasets and metrics, while others report
    model results on existing benchmarks; evaluation targets span Atari scores, CARL
    zero-shot transfer, driving multi-view rollout, robotic physics plausibility,
    and Minecraft/video memory tests.'
  - 'Trend evolution: Evidence from 2023-2026 shows a shift from transformer/VAE world-model
    methods toward diffusion-based world models and, in parallel, stronger public
    benchmark artifacts for consistency and control. The available span is too narrow
    to infer older evolution.'
  - 'Open questions: Whether proxy metrics align with downstream policy utility; whether
    memory and cross-action-space generalization hold beyond current scenes; and whether
    conclusions stay stable across missing baseline, limitation, and compute details.'
  related_work_outline_zh:
  - 主流方向：围绕动作条件视频预测与控制开展世界模型基准评测，LoopNav、MIND 等数据集在驾驶、机器人和游戏环境中测试空间一致性、记忆和动作控制。
  - 研究共性：研究越过视觉重建分数，转向长时域 rollout、零样本迁移、场景图一致性、记忆保持和动作条件泛化等压力测试。
  - 关键差异：部分工作构建数据集和指标，部分在已有基准上报告模型结果；评测目标覆盖 Atari 分数、CARL 零样本迁移、驾驶多视角 rollout、机器人物理合理性以及
    Minecraft/视频记忆测试。
  - 趋势演进：2023-2026 证据显示从 Transformer/VAE 世界模型方法向扩散世界模型演进，同时出现更强的公开一致性与控制基准；时间跨度较窄，难以推断更早趋势。
  - 开放问题：代理指标是否与下游策略效用一致；记忆与跨动作空间泛化能否超出当前场景；在缺失基线、局限性和算力细节时结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for spatial and memory consistency (e.g.,
        LoopNav, MIND)
      what_it_solves: Creates shared tasks and datasets for evaluating world models
        on spatial consistency, memory consistency, and action control beyond single-frame
        quality.
      what_remains_open: Coverage is limited to Minecraft navigation and open-domain
        video scenes; transfer to real driving, robotics, and longer closed-loop settings
        is unverified.
    - line: Metric and stress-test design for long-horizon and zero-shot evaluation
      what_it_solves: Provides metrics or protocols such as scene-graph consistency,
        long-horizon rollout, and zero-shot contextual generalization to probe robustness.
      what_remains_open: Alignment between these proxy scores and downstream decision
        utility or physical plausibility is not established from the available evidence.
    - line: Architecture-level benchmarking with transformer and diffusion world models
      what_it_solves: Establishes state-of-the-art world-model results on Atari 100k,
        driving datasets, CARL, and robotic scenarios using VAE/transformer or diffusion
        formulations.
      what_remains_open: Common protocols and baselines are incomplete; many visible
        records omit limitations or direct stability comparisons across implementations
        and compute budgets.
    - line: Comparable baselines and reporting artifacts
      what_it_solves: Makes evaluation auditable through released datasets, code,
        and benchmark frameworks in several benchmark-focused papers.
      what_remains_open: Reproducibility evidence is uneven across method papers,
        and the packet lacks enough citation or artifact metadata to verify stability.
    consensus:
    - World models are increasingly judged by action-conditioned generation and control-oriented
      behavior rather than reconstruction quality alone.
    - Targeted stress tests are preferred over aggregate visual scores, including
      memory consistency, spatial consistency, zero-shot transfer, and long-horizon
      rollout.
    - Diffusion and transformer variants are central architectures for current world-model
      evaluation across driving, robotics, and game domains.
    - Public benchmark artifacts and datasets are treated as important for comparable
      evaluation, though not universally provided.
    disagreements:
    - 'Evaluation target differs: game performance on Atari 100k, zero-shot CARL dynamics,
      driving multi-view and long-horizon rollout, robotic physical plausibility,
      and open-domain memory or action control.'
    - 'Interaction mode differs: some work uses action-free video pretraining, some
      uses closed-loop action-conditioned rollouts, and some uses context-conditioned
      latent dynamics.'
    - 'Representation differs: discrete or VAE transformer world models, diffusion-based
      world models, and physics-informed depth or keypoint training coexist.'
    - 'Deployment setting differs: simulated RL or game, real driving datasets, robotic
      manipulation datasets, Minecraft navigation, and open-domain video scenes.'
    open_questions:
    - Do current consistency and control metrics correlate with downstream policy
      performance or human judgments?
    - Can world models preserve long-term memory consistency and generalize across
      action spaces outside the benchmark's selected scenes?
    - Are benchmark conclusions stable when implementations, baselines, limitation
      reporting, and compute budgets are varied?
    - Does the task distribution in available benchmarks cover the real-world settings
      where world models are actually expected to assist?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向空间和记忆一致性的基准任务与数据集设计（如 LoopNav、MIND）
      解决的问题: 建立共享任务和数据集，评估世界模型在空间一致性、记忆一致性和动作控制方面的能力，超越单帧质量。
      尚未覆盖: 覆盖主要限于 Minecraft 导航和开放域视频场景；能否迁移到真实驾驶、机器人和更长闭环设置尚未验证。
    - 路线: 面向长时域与零样本评测的指标和压力测试设计
      解决的问题: 提供场景图一致性、长时域 rollout、零样本上下文泛化等指标或协议，检验鲁棒性。
      尚未覆盖: 这些代理分数与下游决策效用或物理合理性之间的一致性在现有证据中尚未建立。
    - 路线: 基于 Transformer 和扩散世界模型的架构级基准评测
      解决的问题: 在 Atari 100k、驾驶数据集、CARL 和机器人场景上建立 VAE/Transformer 或扩散世界模型的最新结果。
      尚未覆盖: 统一协议和基线仍不完整；大量可见记录缺少局限性说明，也未充分比较不同实现和算力预算下的稳定性。
    - 路线: 可比基线与报告工件
      解决的问题: 通过多个基准工作发布数据集、代码和评测框架，使结果可审计。
      尚未覆盖: 方法论文的复现证据不均衡，证据包缺少足够的引用或工件元数据来验证稳定性。
    共识:
    - 世界模型越来越以动作条件生成和控制导向行为来评判，而非仅看重建质量。
    - 相比整体视觉分数，更偏好针对性压力测试，包括记忆一致性、空间一致性、零样本迁移和长时域 rollout。
    - 扩散和 Transformer 变体是当前驾驶、机器人和游戏领域世界模型评测的核心架构。
    - 公开基准工件和数据集被视为可比评测的重要基础，但尚未普遍提供。
    分歧:
    - 评测目标不同：Atari 100k 游戏表现、CARL 零样本动力学、驾驶多视图与长时域 rollout、机器人物理合理性、开放域记忆与动作控制。
    - 交互模式不同：部分使用无动作视频预训练，部分使用闭环动作条件 rollout，部分使用上下文条件潜在动力学。
    - 表示方式不同：离散或 VAE Transformer 世界模型、扩散世界模型、物理信息深度或关键点训练并存。
    - 部署场景不同：模拟强化学习或游戏、真实驾驶数据集、机器人操作数据集、Minecraft 导航和开放域视频场景。
    开放问题:
    - 当前一致性和控制指标是否与下游策略性能或人类判断相关？
    - 世界模型能否在基准所选场景之外维持长期记忆一致性并跨动作空间泛化？
    - 当实现、基线、局限性报告和算力预算变化时，基准结论是否仍然稳定？
    - 现有基准的任务分布是否覆盖世界模型预期发挥作用的真实场景？
