    for driving, robot manipulation, and consistency benchmarking.'
  - 'Open questions: Whether improved video or action generation transfers to real-world
    safety and operational outcomes, whether generalization holds beyond seen tasks,
    contexts, or datasets, and how consistency benchmark metrics connect to downstream
