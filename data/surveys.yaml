  related_work_outline:
  - 'Mainstream direction: Generative video world models built on diffusion transformers
    are the dominant line, used for driving, robotics, and visual control prediction,
    often with auxiliary objectives for long-horizon or multi-view consistency.'
  - 'Shared research pattern: Learn a dynamics or world representation from visual
    trajectories with self-supervised or generative losses, condition on action, language,
    context, or physics, and evaluate via prediction fidelity, downstream policy utility,
    or consistency metrics.'
  - 'Key differences: Methods differ in representation and training objective—VAE-Transformer,
    masked diffusion, physics-informed auxiliary tasks, unified video-action diffusion—as
    well as conditioning source and evaluation target from Atari to embodied benchmarks.'
  - 'Trend evolution: The evidence concentrates in 2023-2026: from model-based RL
    with stochastic VAE-Transformer world models toward large-scale video-action diffusion
    and embodied world models, with emerging benchmarks for spatial, memory, and action
    consistency.'
  - 'Open questions: Whether reported gains transfer beyond narrow datasets or task
    families, whether model or planner contributes more, how to evaluate physical
    plausibility and long-term consistency, and whether empty limitation or ablation
    evidence hides verification gaps.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer为核心的生成式视频世界模型是主线，用于驾驶、机器人和视觉控制预测，常引入辅助目标以提升长时域或多视角一致性。
  - 研究共性：从视觉轨迹中自监督或生成式地学习动力学表示，并以动作、语言、上下文或物理信息为条件；通过预测保真度、下游策略效用或一致性指标评估。
  - 关键差异：表示与训练目标不同，如VAE-Transformer、掩码扩散、物理信息辅助任务、视频-动作联合扩散；条件来源和评测目标也从Atari到具身基准不等。
  - 趋势演进：证据集中在2023-2026年：从基于模型强化学习的随机VAE-Transformer世界模型，走向大规模视频-动作扩散和具身世界模型，并出现空间、记忆与动作一致性基准。
  - 开放问题：报告收益是否跨数据集或任务迁移，模型与规划器贡献是否被隔离，如何评测物理合理性与长期一致性，以及缺失的局限性或消融证据是否构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Masked diffusion video world modeling with auxiliary reconstruction
      what_it_solves: Long-horizon and multi-view visual prediction for driving-style
        environments by coupling diffusion generation with MAE-like mask reconstruction.
      what_remains_open: Evidence is focused on NuScenes, OpenDV-2K, and Waymo; no
        visible limitation or cross-domain evaluation for non-driving scenes.
    - line: Context-conditioned recurrent state-space world models
      what_it_solves: Zero-shot generalization to observed dynamics variations in
        contextual model-based RL by conditioning latent inference and latent dynamics.
      what_remains_open: Assumes observable context and is tested on only two CARL
        tasks, leaving partially observable or broader settings unverified.
    - line: Efficient stochastic Transformer-VAE world models
      what_it_solves: Sample-efficient visual control on Atari 100k without lookahead
        search by combining Transformer sequence modeling and stochastic latent generation.
      what_remains_open: Reported on Atari only; no limitation details, and transfer
        to embodied or real-world control is not shown.
    - line: Compositional language-conditioned video world models
      what_it_solves: Generalization to unseen combinations of seen primitives for
        robot video planning by factorizing language instructions into lower-level
        generative models.
      what_remains_open: Depends on parsing into known primitives; novel primitives
        are uncovered, and evaluation remains simulation-only.
    - line: Physics-informed embodied world models
      what_it_solves: More visually faithful and physically plausible robotic video
        synthesis by jointly learning temporal depth and keypoint dynamics.
      what_remains_open: Physical plausibility metrics and downstream protocol details
        are not fully specified in the packet; limitation evidence is absent.
    - line: Unified video-action diffusion world models
      what_it_solves: Pretraining policy, forward and inverse dynamics, and video
        generation in one transformer over large multitask robot datasets, including
        action-free video.
      what_remains_open: Detailed baseline and metric comparisons are not visible
        here; real-robot or long-horizon execution evidence is not established.
    - line: World-model consistency and control evaluation protocols
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control through loop navigation or revisited open-domain video benchmarks.
      what_remains_open: LoopNav reports no experimental results; benchmarks reveal
        but do not solve long-term memory and cross-action-space generalization gaps.
    - line: Method evidence and ablation protocols
      what_it_solves: Separating algorithmic contribution from dataset, baseline,
        metric, and implementation effects through benchmarks and ablations.
      what_remains_open: Visible evidence often lacks limitations or ablations, making
        method-level attribution unverified across several top papers.
    consensus:
    - World-model research is converging on generative visual dynamics models trained
      with self-supervised objectives over trajectory or video data.
    - Conditioning on actions, language, context, or physics signals is treated as
      necessary for controllable prediction and downstream policy utility.
    - Evaluation increasingly combines visual fidelity with task-oriented measures
      such as zero-shot generalization, physical plausibility, and spatial or memory
      consistency.
    - Transformer and diffusion backbones are recurring architectural choices in recent
      evidence, replacing or extending earlier recurrent state-space formulations.
    disagreements:
    - 'Representation and objective: stochastic VAE-Transformer, masked diffusion,
      physics-informed auxiliary tasks, and joint video-action diffusion make different
      assumptions about latent structure and generation.'
    - 'Interaction and conditioning: some methods condition on explicit context variables,
      some parse language into primitives, some couple action diffusion, and others
      rely on action-free video.'
    - 'Evaluation target: Atari sample efficiency, driving video prediction, robot
      plan synthesis, and consistency or action-control benchmarks measure different
      capabilities.'
    - 'Deployment setting: evidence spans visual game control, autonomous driving
      perception, robotic manipulation, and open-domain embodied video scenes, with
      different generalization demands.'
    - 'Evidence completeness: some papers report dataset, code, metrics, and downstream
      results, while others provide benchmark construction only or leave limitations
      empty, creating uneven verification.'
    open_questions:
    - Can the reported methods transfer beyond their narrow datasets or task families,
      especially to unseen dynamics, embodiments, or action spaces?
    - How much downstream gain comes from the learned dynamics model versus the planner,
      controller, language parser, or task prior?
    - What quantitative metrics can reliably capture physical plausibility, long-term
      memory consistency, and cross-action-space control?
    - Do absent limitations, ablation details, or baselines indicate hidden verification
      gaps rather than missing contributions?
    - How can world models move from generating realistic video to certified policy-relevant
      dynamics under partial observability and real-world deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码扩散视频世界建模与辅助重建
      解决的问题: 面向驾驶类环境的长时域和多视角视频预测，以扩散生成结合MAE式掩码重建。
      尚未覆盖: 证据集中于NuScenes、OpenDV-2K和Waymo；未见非驾驶场景的跨域评估，局限信息缺失。
    - 路线: 上下文条件的循环状态空间世界模型
      解决的问题: 在上下文模型型强化学习中，通过条件化潜在推断与潜在动力学，实现对未见动力学变化的零样本泛化。
      尚未覆盖: 假设上下文可观测，且仅在CARL两个任务上测试，部分可观测或更广泛设置未验证。
    - 路线: 高效随机Transformer-VAE世界模型
      解决的问题: 在Atari 100k上通过Transformer序列建模与随机潜在生成实现无前瞻搜索的高样本效率视觉控制。
      尚未覆盖: 仅在Atari上报告；缺少局限性说明，向具身或真实控制迁移未展示。
    - 路线: 组合式语言条件视频世界模型
      解决的问题: 通过将语言指令分解为低级原语生成模型，实现机器人视频规划中对已见原语新组合的泛化。
      尚未覆盖: 依赖解析为已知原语；全新原语未被覆盖，且评估仅在仿真中进行。
    - 路线: 物理信息具身世界模型
      解决的问题: 通过联合学习时间深度和关键点动力学，生成视觉保真度更高、物理更合理的机器人视频。
      尚未覆盖: 物理合理性指标与下游协议细节未充分说明；局限性证据缺失。
    - 路线: 统一视频-动作扩散世界模型
      解决的问题: 在单个Transformer中统一表示策略、前向和逆动力学以及视频生成，可在大规模多任务机器人数据及无动作视频上预训练。
      尚未覆盖: 此处未见详细基线与指标比较；真实机器人或长时域执行证据尚未建立。
    - 路线: 世界模型一致性与控制评测协议
      解决的问题: 通过循环导航或开放域回访视频基准，评测空间一致性、记忆一致性和动作控制。
      尚未覆盖: LoopNav未报告实验结果；基准揭示但未解决长期记忆和跨动作空间泛化缺口。
    - 路线: 方法证据与消融协议
      解决的问题: 通过基准和消融，区分算法贡献与数据集、基线、指标及实现因素的影响。
      尚未覆盖: 现有可见证据常缺失局限性或消融，若干方法的方法级归因无法确认。
    共识:
    - 世界模型研究正汇聚到以自监督目标在轨迹或视频数据上训练生成式视觉动力学模型。
    - 动作、语言、上下文或物理信号的条件化被视为实现可控预测和下游策略效用的关键。
    - 评测越来越多地同时纳入视觉保真度与任务导向指标，如零样本泛化、物理合理性、空间或记忆一致性。
    - Transformer和扩散主干在近期证据中反复出现，正在替代或扩展较早的循环状态空间形式。
    分歧:
    - 表示与目标不同：随机VAE-Transformer、掩码扩散、物理信息辅助任务和视频-动作联合扩散对潜在结构与生成方式有不同假设。
    - 交互与条件方式不同：显式上下文变量、语言解析为原语、动作扩散耦合、无动作视频利用各有不同接口。
    - 评测目标不同：Atari样本效率、驾驶视频预测、机器人计划合成、一致性与动作控制基准衡量不同能力。
    - 部署场景不同：视觉游戏控制、自动驾驶感知、机器人操作和开放域具身视频对泛化要求不同。
    - 证据完整性不同：部分论文报告数据集、代码和下游结果，部分仅给出基准构建或缺失局限性，验证强度不均。
    开放问题:
    - 已报告方法能否迁移到窄数据集或任务族之外，尤其是未见动力学、具身形态或动作空间？
    - 下游性能提升有多少来自学习到的动力学模型，多少来自规划器、控制器、语言解析器或任务先验？
    - 哪种量化指标能可靠衡量物理合理性、长期记忆一致性和跨动作空间控制？
    - 缺失的局限性、消融或基线是否意味着验证缺口，而不是方法本身没有贡献？
    - 世界模型如何从生成逼真视频走向在部分可观测和真实部署环境中提供策略相关的动力学保证？
