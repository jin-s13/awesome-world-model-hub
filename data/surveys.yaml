  related_work_outline:
  - 'Mainstream direction: sampled application work centers on driving and robot manipulation,
    using generative world models built from diffusion transformers, video generation
    backbones, or unified video-action diffusion; examples include MaskGWM, RoboDreamer,
    RoboScape, and Unified World Models.'
  - 'Shared research pattern: most approaches structure world models around future
    observation or action prediction and add conditioning signals such as mask reconstruction,
    language primitives, context variables, physics cues, or action spaces to improve
    generalization and controllability.'
  - 'Key differences: the papers diverge in representation, supervision, and evaluation;
    some use compact latent dynamics for sample-efficient reinforcement learning,
    while others prioritize realistic video generation, physical plausibility, or
    benchmark-based consistency and action control.'
  - 'Trend evolution: within the available 2023-2026 frontier evidence, the direction
    is moving from model-based reinforcement learning and Dreamer-style contexts toward
    large-scale robot video/action pretraining, physics-informed generation, and dedicated
    evaluation benchmarks.'
  - 'Open questions: real-world safety transfer, generalization to unseen primitives
    or embodiments, long-term memory consistency, and coverage of healthcare or scientific
    simulation remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：采样到的应用研究集中在驾驶与机器人操作，使用扩散Transformer、视频生成骨干或统一视频-动作扩散构建世界模型；典型工作如MaskGWM、RoboDreamer、RoboScape和Unified
    World Models。
  - 研究共性：多篇工作围绕未来观测或动作预测构建世界模型，并通过掩码重建、语言原语、上下文变量、物理线索或动作空间等条件提升泛化与可控性。
  - 关键差异：表示方式、监督信号和评测目标分化明显；一些方法使用紧凑潜在动力学做样本高效强化学习，另一些更关注逼真视频生成、物理合理性或一致性与动作控制评测。
  - 趋势演进：在2023至2026年的前沿证据中，方向从基于模型的强化学习和Dreamer类上下文方法，转向大规模机器人视频/动作预训练、物理信息生成和专用评测基准。
  - 开放问题：真实安全迁移、对未见原语或本体的泛化、长期记忆一致性，以及医疗和科学模拟应用的覆盖仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view, long-horizon scene prediction
        and zero-shot transfer across driving datasets.
      what_remains_open: Whether dataset-level video prediction gains translate into
        closed-loop real-world driving safety or operational improvement.
    - line: Embodied robot task transfer
      what_it_solves: Adapts generative world models to robot observation-action data
        for video planning, physics-informed synthesis, and policy learning or evaluation.
      what_remains_open: Generalization beyond seen language primitives, simulation-only
        validation, and transfer to unseen embodiments or physical environments.
    - line: Interactive agents and model-based reinforcement learning
      what_it_solves: Builds latent or contextual dynamics models for sample-efficient
        policy learning and zero-shot generalization in interactive environments.
      what_remains_open: Broader environment-rule, goal, or interaction shifts beyond
        limited benchmark tasks and observed context settings.
    - line: Evaluation benchmarks for consistency and action control
      what_it_solves: Measures spatial consistency, memory consistency, and action
        control in open-loop or loop-based video settings.
      what_remains_open: Alignment between benchmark scores and downstream task utility
        or real-world deployment remains unverified.
    consensus:
    - Applications increasingly treat world models as learned simulators that generate
      future observations or actions rather than only encoding compact latent state
      for a single task.
    - Structured conditioning is common, including actions, language instructions,
      context variables, physical cues, and multi-view constraints.
    - Evaluation is expanding from pixel-level realism toward long-term consistency,
      action controllability, and downstream policy utility.
    - Several works use world models for both policy training and policy evaluation,
      making them more than standalone predictors.
    disagreements:
    - 'Representation differs: compact recurrent state-space or VAE latent dynamics
      versus generative video/diffusion transformers versus unified video-action diffusion.'
    - 'Auxiliary supervision differs: mask reconstruction, temporal depth and keypoint
      dynamics, language-primitive factorization, and action diffusion timesteps encode
      different inductive biases.'
    - Evaluation targets differ across driving video metrics, human-normalized Atari
      scores, loop-consistency metrics, and simulated robot execution success.
    - 'Deployment assumptions differ: some methods rely on observed context values
      or simulator-only evaluation, while others pretrain on action-free video or
      require shared action spaces.'
    open_questions:
    - Do driving world-model gains transfer beyond held-out driving datasets to closed-loop
      real-world safety outcomes?
    - Can robot world models generalize to unseen primitive combinations, embodiments,
      or physical environments beyond curated datasets and simulation?
    - How do consistency and action-control benchmark scores relate to downstream
      task performance?
    - The provided evidence lacks healthcare and scientific simulation applications,
      leaving domain coverage an open verification gap.
    - Several top papers have empty limitation fields, so known failure boundaries
      remain underreported even when methodology evidence is strong.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于多视角、长时域场景预测，并在驾驶数据集之间进行零样本迁移。
      尚未覆盖: 数据集视频预测提升能否转化为闭环真实驾驶安全或运营改进尚无证据。
    - 路线: 具身机器人任务迁移
      解决的问题: 将生成式世界模型适配到机器人观察-动作数据，用于视频规划、物理一致性合成以及策略学习或评估。
      尚未覆盖: 对未见语言原语、真实物理环境和未见本体的泛化，以及超出仿真的验证仍不足。
    - 路线: 交互式智能体与基于模型的强化学习
      解决的问题: 构建潜在或上下文动力学模型，在交互环境中实现样本高效策略学习与零样本泛化。
      尚未覆盖: 环境规则、目标或交互更大变化时的泛化，以及有限基准任务之外的迁移。
    - 路线: 一致性与动作控制评测基准
      解决的问题: 通过视频或循环导航套件量化世界模型的空间一致性、记忆一致性和动作控制。
      尚未覆盖: 基准分数与下游任务效能或真实部署之间的关系尚未建立。
    共识:
    - 应用研究越来越把世界模型视为可学习的仿真器，生成未来观测或动作，而不仅为单一任务编码紧凑潜在状态。
    - 通过动作、语言指令、上下文变量、物理线索或多视角约束进行结构化条件建模是常见做法。
    - 评测正从像素级质量扩展到长期一致性、动作可控性和下游策略效用。
    - 多篇工作同时把世界模型用于策略训练和策略评估，而不只是单独预测器。
    分歧:
    - 表示方式不同：紧凑循环状态空间或VAE潜在动力学，对比生成式视频/扩散Transformer，对比统一视频-动作扩散。
    - 辅助监督不同：掩码重建、时间深度与关键点动力学、语言原语分解、动作扩散时间步各自编码不同归纳偏置。
    - 评测目标不同：驾驶视频指标、Atari人类归一化分数、循环一致性指标和仿真机器人执行成功难以直接比较。
    - 部署假设不同：一些方法依赖可观测上下文或仿真验证，另一些用无动作视频预训练或要求共享动作空间。
    开放问题:
    - 驾驶世界模型的增益能否从保留数据集迁移到闭环真实安全结果？
    - 机器人世界模型能否泛化到未见原语组合、本体或物理环境？
    - 一致性和动作控制基准分数与下游任务性能有何关系？
    - 证据包缺少医疗和科学模拟应用，领域覆盖仍是验证缺口。
    - 多篇论文的局限性字段为空，因此已知失败边界仍未被充分报告。
