  - 'Mainstream direction: consolidating world-model research into surveys, taxonomies,
    and roadmap-style frameworks that connect generative video, autonomous driving,
    robotics, and embodied agents under shared simulation and evaluation questions.'
  - 'Shared research pattern: treating world models as generative simulators that
    factor perception, dynamics, and control while emphasizing compositionality, memory,
    temporal consistency, controllability, and evaluation quality.'
  - 'Key differences: papers differ in representation choices, deployment setting,
    evaluation style, and whether they prioritize conceptual synthesis or empirical
    system validation.'
  - 'Trend evolution: the evidence moves from 2023 driving-specific simulators to
    2024 broad world-model surveys and robot imagination, then to 2025-2026 persistent
    out-of-sight dynamics, fine-grained multimodal control, and open-source interactive
    simulators; the trend remains within the current frontier.'
  - 'Open questions: how to validate taxonomies empirically, how to measure out-of-sight
    and long-horizon dynamics, how to unify controllability evaluation, and whether
    open-source claims are reproducible.'
  related_work_outline_zh:
  - 主流方向：将世界模型研究整合为综述、分类与路线图式框架，连接生成视频、自动驾驶、机器人和具身智能，形成共享的模拟与评测问题。
  - 研究共性：将世界模型视为生成式模拟器，分解感知、动力学和控制，并强调组合性、记忆、时间一致性、可控性和评测质量。
  - 关键差异：论文在表示选择、部署场景、评测方式以及概念综合与经验系统验证之间的侧重点不同。
  - 趋势演进：证据从2023年驾驶特定模拟器，发展到2024年通用世界模型综述与机器人想象，再到2025-2026年视线外动态、细粒度多模态控制和开源交互模拟；仍属于当前前沿内演进。
  - 开放问题：如何实证验证分类法，如何测量视线外与长时程动态，如何统一可控性评测，以及开源声明是否可复现。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world-model progress in video generation,
        autonomous driving, robotics, and embodied agents into shared design dimensions
        and future directions.
      what_remains_open: Whether the synthesis is backed by systematic evidence rather
        than selective examples; conceptual taxonomies may not cover all methods or
        future development.
    - line: Empirical world-model system validation
      what_it_solves: Demonstrates generative simulation for robot plan synthesis,
        interactive video, fine-grained motion and pose control, and multi-agent traffic
        prediction.
      what_remains_open: Evaluations differ across datasets, simulators, and metrics;
        several papers leave limitations and failure boundaries underspecified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as open-loop generation
        versus closed-loop planning and frame quality versus controllability shape
        conclusions.
      what_remains_open: Compatibility of compared results across video, driving,
        and robot settings is unresolved; resource-aware and closed-loop metrics are
        proposed but not implemented.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete gaps around out-of-sight
        dynamics, long-horizon consistency, compositional generalization, and real-time
        interactivity.
      what_remains_open: Prioritization of which gaps most constrain real-world deployment
        remains evidence-free.
    consensus:
    - World models are treated as generative simulators that can unify perception,
      prediction, and planning across video, driving, and robotics.
    - Compositionality, memory, temporal consistency, and controllability are recurring
      requirements, but they are usually evaluated separately rather than through
      a shared protocol.
    - Recent surveys converge on the need for unified taxonomies and closed-loop evaluation
      frameworks to organize fragmented design choices.
    - Open-source artifacts and real-world datasets are seen as enabling validation,
      but some work remains conceptual without empirical confirmation.
    disagreements:
    - 'Representation choices differ: continuous latent states, discrete tokens, language-derived
      compositional primitives, and persistent global dynamic state.'
    - 'Supervision and evaluation targets differ: some work targets robot plan generation
      in simulation, others traffic simulation or open-world video prediction; some
      use closed-loop planning while others use frame-quality metrics.'
    - 'Interaction mode differs: offline future prediction versus real-time interactive
      simulation with latency constraints.'
    - 'Deployment assumptions differ: open-source simulator work claims public code
      and low latency, while taxonomy work remains theoretical and lacks implemented
      evaluation.'
    open_questions:
    - How can proposed world-model taxonomies be empirically validated beyond conceptual
      mapping, and what evaluation suite would falsify them?
    - How should out-of-sight dynamics, minute-level memory, and long-horizon consistency
      be measured without relying only on generated video fidelity?
    - Which controllability metric can compare ego-motion, object dynamics, human
      pose, and robot plan generation under one protocol?
    - Do open-source real-time claims survive independent reproduction, given missing
      limitation details and uneven artifact availability?
    - How should synthesis interpret papers whose citation or graph signals are absent,
      so topical relevance and read-first score are not mistaken for validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将视频生成、自动驾驶、机器人和具身智能中碎片化的世界模型进展整理为共享设计维度与未来方向。
      尚未覆盖: 综合是否有系统证据而非选择性示例；概念分类未必覆盖所有方法或未来变化。
    - 路线: 世界模型系统的经验验证
      解决的问题: 展示用于机器人规划、交互视频、细粒度运动和姿态控制以及多智能体交通预测的生成式模拟。
      尚未覆盖: 评测依赖不同数据集、模拟器和指标；部分工作未充分说明局限与失效边界。
    - 路线: 对比评测综合
      解决的问题: 总结开环生成与闭环规划、帧质量与可控性等评测选择如何影响跨论文结论。
      尚未覆盖: 视频、驾驶和机器人设定下的结果兼容性尚未解决；资源感知与闭环指标被提出但未实现。
    - 路线: 开放问题与缺口映射
      解决的问题: 将文献覆盖转化为视线外动态、长时程一致性、组合泛化和实时交互等具体缺口。
      尚未覆盖: 哪些缺口最制约真实部署仍未基于证据排序。
    共识:
    - 世界模型被视为生成式模拟器，可在视频、驾驶与机器人中统一感知、预测和规划。
    - 组合性、记忆、时间一致性与可控性是反复出现的要求，但通常被分别评测，缺乏共享协议。
    - 近期综述倾向于需要统一分类法和闭环评测框架来组织分散的设计选择。
    - 开放源码工件和真实数据集被视为验证前提，但部分研究仍停留在概念框架而缺乏实证确认。
    分歧:
    - 表示选择不同：连续潜在状态、离散令牌、语言派生的组合原语以及持久全局动态状态。
    - 监督与评测目标不同：有的面向机器人仿真规划，有的面向交通仿真或开放世界视频预测；有的采用闭环规划，有的采用帧质量指标。
    - 交互模式不同：离线未来预测与带延迟约束的实时交互模拟不同。
    - 部署假设不同：开源模拟器声称公开代码和低延迟，而分类研究仍偏理论且未实施评测。
    开放问题:
    - 如何将世界模型分类法从概念映射推进到可证伪的实证验证，并采用何种评测套件？
    - 如何在不只依赖生成视频保真度的情况下测量视线外动态、分钟级记忆和长时程一致性？
    - 哪种可控性指标能在自我运动、物体动态、人体姿态和机器人规划之间跨场景可比？
    - 在缺失局限性细节和工件可得性不均的情况下，开源实时声明能否通过独立复现？
    - 当引用或图谱信号缺失时，如何避免把主题相关性和阅读优先分当作有效性证据？
