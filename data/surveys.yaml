  related_work_outline:
  - 'Mainstream direction: The evidence clusters around generative world models for
    embodied applications: driving scene prediction, robot video planning, and model-based
    control. Recent work favors diffusion transformers or recurrent state-space models
    that generate videos or imagined trajectories conditioned on actions, goals, or
    context, with benchmarks targeting memory and action consistency.'
  - 'Shared research pattern: Most papers learn a latent or video predictive model
    from sequential observations, condition generation on task-relevant controls or
    context, and evaluate via visual quality, downstream policy success, sample efficiency,
    or consistency metrics rather than only static prediction error.'
  - 'Key differences: Formulations differ in supervision and output: multi-view/long-horizon
    driving video prediction; robot video generation grounded by language or physics;
    stochastic latent world models for sample-efficient RL; and benchmark-only evaluations
    of spatial memory and action control. Evaluation settings also split across driving
    datasets, robot datasets, Atari, CARL, Minecraft, and open-domain videos.'
  - 'Trend evolution: The evidence moves from efficient model-based RL and contextual
    world models around 2023-2024 toward larger video-centric and embodied world models
    in 2025-2026, with increased use of diffusion, multimodal conditioning, and dedicated
    consistency benchmarks.'
  - 'Open questions: Evidence does not yet show whether simulation or benchmark gains
    transfer to real-world safety, physical robot execution, unseen dynamics, or long-horizon
    memory. Several papers lack reported limitations, code, dataset, baseline, or
    metric details, so reproducibility remains partially unverified.'
  related_work_outline_zh:
  - 主流方向：证据集中在面向具身应用的生成式世界模型：驾驶场景预测、机器人视频规划、基于模型的控制。近期工作多采用扩散Transformer或循环状态空间模型，根据动作、目标或上下文生成视频或想象轨迹，并出现针对记忆与动作一致性的基准。
  - 研究共性：多数工作从序列观察中学习潜在或视频预测模型，以任务相关的控制或上下文为条件，并通过视觉质量、下游策略成功率、样本效率或一致性指标评估，而非仅依赖静态预测误差。
  - 关键差异：监督信号与输出不同：多视角或长时域驾驶视频预测；语言或物理引导的机器人视频生成；用于样本高效强化学习的随机潜在世界模型；以及仅做空间记忆与动作控制评测的基准。评测设置也分属驾驶、机器人、Atari、CARL、Minecraft和开放域视频。
  - 趋势演进：证据从2023-2024年的高效模型基强化学习和上下文世界模型，发展到2025-2026年更大规模的视频中心和具身世界模型，扩散、多模态条件和专门一致性基准使用增多。
  - 开放问题：证据尚未显示仿真或基准提升能否迁移到真实安全、物理机器人执行、未知动力学或长时记忆。多篇论文缺少局限性、代码、数据集、基线或指标细节，可复现性有待验证。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon scene prediction
      what_it_solves: Extend driving scene prediction beyond short single-view video
        by using mask reconstruction, diffusion transformers, and multi-view modules
        for normal, long-horizon, and zero-shot driving benchmarks.
      what_remains_open: Mapping improved video prediction to real driving safety,
        planning, and closed-loop operational outcomes remains unverified in the available
        evidence.
    - line: Embodied and robot world models for video-based planning and control
      what_it_solves: Generate task- or goal-conditioned robot videos or imagined
        transitions by combining language primitives, physics-informed auxiliary tasks,
        or coupled video-action diffusion for policy learning and data utilization.
      what_remains_open: Generalization beyond seen primitive combinations or trained
        embodiments, physical plausibility under novel object interactions, and evidence
        from physical execution rather than simulation or visual evaluation.
    - line: Model-based reinforcement learning with recurrent or stochastic world
        models
      what_it_solves: Improve sample efficiency and zero-shot generalization in control
        and game tasks by learning latent dynamics and training policies on imagined
        trajectories.
      what_remains_open: Coverage is limited to narrow benchmark contexts such as
        CARL tasks or Atari 100k without lookahead; assumptions such as observable
        context restrict transfer to less observed settings.
    - line: Benchmarks for spatial, memory, and action consistency in world models
      what_it_solves: Quantify whether world models maintain scene graph consistency,
        long-term memory, and action-following across views, loops, or open-domain
        video conditions.
      what_remains_open: The packet reports benchmark construction but limited or
        no experimental baselines in one case; current models still struggle with
        long-term consistency and cross-action-space generalization.
    consensus:
    - 'Generative sequence models are the shared substrate: papers use transformers,
      diffusion, recurrent state-space models, or VAE-style stochastic latents to
      predict future observations.'
    - Conditioning on action, context, language, or goal is treated as necessary for
      turning predictive generation into usable policies or domain-specific simulation.
    - Evaluation increasingly includes downstream task utility such as policy training,
      robot execution, long-horizon rollout, and zero-shot transfer, not solely pixel-level
      reconstruction.
    - Benchmarks are emerging to probe consistency properties that static loss cannot
      capture, especially memory, loop closure, and action control.
    disagreements:
    - One branch targets full-frame driving or robot video generation, while another
      models low-dimensional latent dynamics for control, leading to different assumptions
      about observation space and reconstruction need.
    - 'Supervision differs: some use physics-informed auxiliary tasks or mask reconstruction;
      others rely on language-only decomposition, observable context variables, or
      independent action and video diffusion timesteps.'
    - Evaluation targets differ substantially across driving datasets, robot datasets,
      Atari, contextual RL tasks, Minecraft navigation, and open-domain video, so
      reported gains are not directly comparable.
    - 'Treatment of physics and long-term consistency is uneven: some works inject
      physical or spatial consistency objectives, while benchmark-only works show
      these properties remain challenging.'
    open_questions:
    - How do simulator or benchmark gains translate to real-world closed-loop safety,
      physical robot execution, and operational outcomes?
    - Can current world models generalize to unseen dynamics, unseen primitive combinations,
      or novel embodiments beyond narrow training distributions?
    - What evaluation protocol can fairly compare video-centric and latent-dynamics
      world models across different action spaces, horizons, and camera viewpoints?
    - What evidence gaps remain from missing limitation reports, baselines, metrics,
      code, or datasets, and how should reproducibility be weighted in this topic?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型的多视角与长时域场景预测
      解决的问题: 利用掩码重建、扩散Transformer和多视角模块，在常规、长时域和零样本驾驶基准上扩展单视角短时预测。
      尚未覆盖: 视频预测提升能否映射到真实驾驶安全、规划和闭环运行结果，当前证据尚未验证。
    - 路线: 具身与机器人世界模型的视频规划和动作控制
      解决的问题: 通过语言原语组合、物理信息辅助任务或视频-动作扩散耦合，生成任务或目标条件视频或想象转移，用于策略学习与数据利用。
      尚未覆盖: 超越已见原语组合或训练本体的泛化、新物体交互下的物理合理性，以及物理执行而非仿真的证据。
    - 路线: 基于模型的强化学习与递归或随机世界模型
      解决的问题: 通过潜在动力学建模并在想象轨迹上训练策略，提升控制与游戏任务中的样本效率和零样本泛化。
      尚未覆盖: 评估局限于CARL和Atari 100k等窄基准；可观测上下文等假设限制了向更真实环境的迁移。
    - 路线: 面向空间、记忆与动作一致性的世界模型基准
      解决的问题: 量化世界模型在跨视角、循环或开放域视频条件下是否保持场景图一致性、长时记忆与动作跟随。
      尚未覆盖: 其中一项证据主要是基准构建，实验基线有限或缺失；当前模型仍难以维持长期一致性和跨动作空间泛化。
    共识:
    - 生成式序列模型是共同基础：论文使用Transformer、扩散、循环状态空间或VAE式随机潜在表达预测未来观测。
    - 动作、上下文、语言或目标条件被普遍视为将预测生成转化为可用策略或领域仿真的关键。
    - 评测越来越多覆盖下游任务收益，如策略训练、机器人执行、长时域展开和零样本迁移，而非仅像素级重建。
    - 基准开始关注静态损失无法反映的一致性属性，尤其是记忆、闭环和动作控制。
    分歧:
    - 一部分研究面向驾驶或机器人全帧视频生成，另一部分建模控制用低维潜在动力学，因而观测空间和重建需求假设不同。
    - 监督方式不同：物理信息辅助任务、掩码重建、语言原语分解、可观测上下文变量或独立动作与视频扩散时间步。
    - 评测目标差异明显：驾驶、机器人、Atari、上下文RL、Minecraft导航和开放域视频之间报告的性能难以直接比较。
    - 对物理与长期一致性的处理不均衡：部分模型显式加入物理或空间一致性目标，而基准证据显示这些性质仍有挑战。
    开放问题:
    - 仿真或基准提升如何转化为现实闭环安全、物理机器人执行和运行结果？
    - 当前世界模型能否泛化到未知动力学、未见原语组合或训练本体之外？
    - 应如何公平比较视频中心与潜在动力学世界模型在不同动作空间、时间和视角下的表现？
    - 缺失局限性、基线、指标、代码或数据集报告留下哪些证据缺口，可复现性在本主题中应如何加权？
