  - 'Mainstream direction: Recent evidence concentrates on action-conditioned video
    world models for robot manipulation, using diffusion or masked autoregression
    to couple visual and action dynamics and post-training toward physical plausibility.'
  - 'Shared research pattern: Models convert past observations and action trajectories
    into future video rollouts, then use those rollouts for policy learning, planning,
    evaluation, or synthetic data generation.'
  - 'Key differences: Work differs in conditioning architecture, reuse of frozen versus
    trained generators, supervision signal, and evaluation target—visual fidelity,
    action-frame alignment, physical realism, or spatial reasoning.'
  - 'Trend evolution: The available high-ranking papers span 2024–2026; the trend
    moves from isolated video-action generators toward unified pretraining, preference-based
    alignment, test-time verification, and zero-shot evaluation within the current
    frontier.'
  - 'Open questions: Whether visual fidelity predicts control success, whether formal
    assumptions match empirical world-model behavior, and how guarantees transfer
    across embodiments and tasks remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：近期证据集中于机器人操作的动作条件视频世界模型，以扩散或掩码自回归耦合视觉与动作动态，并后训练对齐物理合理性。
  - 研究共性：模型将过去观测与动作轨迹转化为未来视频轨迹，再用于策略学习、规划、评测或合成数据生成。
  - 关键差异：差异体现在条件架构、是否复用冻结生成器、监督信号与评测目标，如视觉保真度、动作-帧对齐、物理真实性或空间推理。
  - 趋势演进：可见高排序论文集中于2024–2026年；趋势从单一视频-动作生成器走向统一预训练、偏好对齐、测试时验证和零样本评测，属于当前前沿内。
  - 开放问题：视觉保真度是否预测控制成功、形式假设是否符合经验行为，以及保证如何跨本体和任务迁移，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models for robot manipulation
      what_it_solves: Couples video observations and action trajectories inside a
        generative model to synthesize future frames for policy pretraining, planning,
        and evaluation.
      what_remains_open: Visual quality and controllability are not directly tied
        to formal guarantees; long-horizon physical consistency and cross-embodiment
        transfer remain under-evidenced.
    - line: Adapter-based reuse of pretrained video generators
      what_it_solves: Enables action-conditioned world modeling without access to
        pretrained model parameters by training a lightweight mask or adapter on domain-specific
        action-labelled videos.
      what_remains_open: Depends on scarce action-labelled videos and inherited pretrained
        biases; generalization beyond video game and real-world robot domains is not
        shown.
    - line: Verifier-guided test-time scaling for spatial reasoning
      what_it_solves: Grounds test-time reward in frame-anchored assertions to improve
        selection among world-model-generated trajectories and to uncover verifier
        calibration failures.
      what_remains_open: Current world models form an information bottleneck; verifier
        improvements do not consistently scale across evaluation settings.
    - line: Reward and preference alignment for embodied world models
      what_it_solves: Post-trains video world models with multi-dimensional reward
        models or preference-based optimization to improve physical realism, task
        logic, embodiment plausibility, and visual quality.
      what_remains_open: Evidence is concentrated on contact-rich manipulation; human-preference
        supervision may be subjective, costly, and not yet validated for broader domains.
    - line: Conceptual taxonomy via state construction and dynamics
      what_it_solves: Clarifies world-model assumptions by separating state construction
        from dynamics modeling and by proposing functional evaluation of persistence
        and causality.
      what_remains_open: The taxonomy is conceptual; it has not been operationalized
        into validated metrics, formal conditions, or controlled empirical comparisons.
    consensus:
    - Action-conditioned video generation is treated as a candidate world model by
      mapping past observations and actions to future visual rollouts.
    - Improving action-frame alignment and physical plausibility is a shared objective,
      not just raw visual fidelity.
    - Model-generated rollouts are used as a substrate for policy learning, planning,
      evaluation, or synthetic data generation.
    - Current evidence separates visual generation quality from functional usefulness;
      quality improvements do not automatically remove reasoning or control reliability
      gaps.
    - Large-scale pretraining or adaptation on robot video-action data is seen as
      a path to more generalizable and controllable dynamics models.
    disagreements:
    - 'Conditioning representation differs: some models couple action and video modalities
      in a unified transformer with independent timesteps, some use frame-level action-conditioning
      modules, and others adapt frozen pretrained video generators through learned
      masks.'
    - 'Training strategy differs: end-to-end pretraining from heterogeneous robot
      data versus post-training alignment through reinforcement learning or preference-based
      optimization versus lightweight adapter training on closed-source generators.'
    - 'Evaluation target differs: one line targets visual fidelity and action controllability,
      another targets physical plausibility and task logic, and another targets test-time
      spatial reasoning and verifier calibration.'
    - 'Deployment setting differs: closed-source parameter-free adaptation, open large
      diffusion transformer pretraining, and flow-based model alignment create different
      assumptions about model access and data requirements.'
    - Generalization claims are incomparable because evidence is reported on different
      robot manipulation, video game, or spatial reasoning protocols and does not
      consistently measure cross-domain transfer.
    open_questions:
    - Do improvements in visual fidelity, action-frame alignment, or physical realism
      transfer to better closed-loop control, planning, and synthetic data generation
      on unseen embodiments?
    - What formal conditions on state construction and dynamics are sufficient for
      long-horizon physical persistence and causal reasoning?
    - Can test-time verifiers scale reliably when world-model-generated views lose
      fine-grained information needed for reasoning?
    - How far do human-preference-based reward models generalize beyond contact-rich
      manipulation tasks and subjective preference annotations?
    - What missing code, datasets, baselines, metrics, and limitation reports prevent
      verification of the reproducibility and guarantee claims in this evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 机器人操作的动作条件视频世界模型
      解决的问题: 在生成模型中耦合视频观测与动作轨迹，合成未来帧，以支持策略预训练、规划与评测。
      尚未覆盖: 视觉质量与可控性尚未关联形式化保证；长时程物理一致性与跨本体迁移证据不足。
    - 路线: 基于适配器复用预训练视频生成器
      解决的问题: 在不访问预训练模型参数的条件下，通过轻量掩码或适配器实现动作条件世界建模。
      尚未覆盖: 依赖稀缺的动作标签视频并继承预训练偏差；未展示超出视频游戏与真实机器人领域的泛化。
    - 路线: 验证器引导的测试时缩放空间推理
      解决的问题: 将测试时奖励锚定到帧级断言，以改进轨迹选择并揭示验证器校准失败。
      尚未覆盖: 当前世界模型构成信息瓶颈；验证器改进不能在多个评测设置下一致缩放。
    - 路线: 具身世界模型的奖励与偏好对齐
      解决的问题: 用多维奖励或偏好优化后训练视频世界模型，以提升物理真实、任务逻辑、具身合理性与视觉质量。
      尚未覆盖: 证据集中在接触丰富操作；人类偏好监督可能主观、昂贵且未在更广领域验证。
    - 路线: 基于状态构建与动态建模的概念分类
      解决的问题: 通过分离状态构建与动态建模，并倡导持久性与因果性的功能评测，澄清世界模型假设。
      尚未覆盖: 该分类仍偏概念；尚未转化为可验证指标、形式条件或受控实证比较。
    共识:
    - 动作条件视频生成被作为候选世界模型，将过去观测与动作映射到未来视觉轨迹。
    - 改进动作-帧对齐与物理合理性是共同目标，而不仅仅追求视觉保真度。
    - 模型生成的轨迹被用于策略学习、规划、评测或合成数据生成。
    - 现有证据区分了视觉生成质量与功能有用性；质量提升并不自动消除推理或控制可靠性缺口。
    - 在机器人视频-动作数据上大规模预训练或适配，被视为提升泛化性与可控性的路径。
    分歧:
    - 条件表示不同：有的在统一Transformer中用独立时间步耦合动作与视频，有的用帧级动作条件模块，有的通过掩码适配冻结的预训练视频生成器。
    - 训练策略不同：异构数据端到端预训练、强化学习或偏好后训练、以及闭源生成器上的轻量适配，隐含不同数据与模型访问假设。
    - 评测目标不同：一条路线关注视觉保真度与动作可控性，另一条关注物理合理性与任务逻辑，还有路线关注测试时空间推理与验证器校准。
    - 部署设置不同：无参数的闭源适配、开放大规模扩散Transformer预训练和基于流模型的对齐，对模型访问与资源提出不同要求。
    - 泛化声明难以比较，因为证据来自不同的机器人操作、视频游戏或空间推理协议，且未一致测量跨领域迁移。
