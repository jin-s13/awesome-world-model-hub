  related_work_outline:
  - 'Mainstream direction: Action-conditioned video generation is used as the dominant
    world-model substrate for embodied robot control, with examples such as UWM, IRASim,
    and HMA; formal theoretical guarantees remain sparse.'
  - 'Shared research pattern: Models couple future video prediction with explicit
    action conditioning and evaluate through visual quality, controllability, and
    downstream policy or planning correlation.'
  - 'Key differences: They differ in generative backbone, action-conditioning mechanism,
    adaptation strategy, reward or verifier supervision, and evaluation target ranging
    from visual fidelity to physical plausibility and spatial reasoning.'
  - 'Trend evolution: Evidence concentrates in 2024-2026, moving from action-conditioned
    manipulation video models toward physical alignment, test-time verification, and
    zero-shot functional benchmarks; earlier years are underrepresented.'
  - 'Open questions: Formal state/dynamics definitions, reliable functional benchmarks,
    calibrated test-time verifiers, cross-domain generalization, and validated scaling
    guarantees remain unresolved.'
  related_work_outline_zh:
  - 主流方向：动作条件视频生成被用作具身机器人控制的主要世界模型形态，例如 UWM、IRASim、HMA；形式化理论保证仍然较少。
  - 研究共性：模型将未来视频预测与显式动作条件耦合，并通过视觉质量、可控性及下游策略/规划相关性进行评测。
  - 关键差异：生成骨干、动作条件注入方式、适配策略、奖励或验证器监督、评测目标均有不同，从视觉保真到物理合理性和空间推理。
  - 趋势演进：证据集中在2024-2026年，从动作条件操控视频模型转向物理对齐、测试时验证和零样本功能基准；更早年份代表性不足。
  - 开放问题：形式化状态/动态定义、可靠功能基准、校准的测试时验证器、跨领域泛化和可验证的缩放保证仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual taxonomy of state construction and dynamics modeling
      what_it_solves: Clarifies that video-based world models need implicit or explicit
        state and dynamics; organizes architectural and knowledge-integration choices
        and calls for functional benchmarks.
      what_remains_open: No new experiments are provided; whether the taxonomy changes
        model design or evaluation remains unclear, and formal conditions for persistence
        and causality are unvalidated.
    - line: Unified action-video generative modeling for robot dynamics and policy
      what_it_solves: Learns action-conditioned future video and policy/dynamics representation
        from multitask robot data, enabling planning, synthetic rollouts, and stronger
        controllability.
      what_remains_open: Physical persistence, long-horizon causal behavior, and cross-domain
        generalization are not guaranteed; results concentrate on manipulation settings.
    - line: Efficient adaptation of pretrained video models into world models
      what_it_solves: Adds action conditioning to frozen or pretrained video generators
        with limited domain data or faster masked autoregression, lowering training
        cost and enabling real-time simulation.
      what_remains_open: Depends on domain-specific action-labeled videos or closed-source
        base models; transfer beyond evaluated robotic or video-game settings is unverified.
    - line: Reward alignment and test-time verification for world-model rollouts
      what_it_solves: Aligns generated trajectories to physical realism, task logic,
        and visual quality via human preferences, DPO-style post-training, or frame-anchored
        verifiers.
      what_remains_open: Verifier calibration and reward reliability vary across benchmarks;
        test-time scaling is inconsistent, and current models may form an information
        bottleneck.
    - line: Scaling and verifier guarantees for spatial reasoning
      what_it_solves: Probes whether model size or test-time compute yields predictable
        gains in spatial reasoning, and uses frame-anchored assertions to ground rewards.
      what_remains_open: Improvements on one benchmark do not transfer to another;
        no formal guarantee or consistently calibrated verifier is shown.
    consensus:
    - Action-conditioned video prediction is a common substrate for building world
      models that support policy learning, planning, or evaluation.
    - Explicit action-to-frame conditioning and stronger controllability are treated
      as necessary for useful embodied world models.
    - Visual fidelity alone is insufficient; the field is moving toward physical plausibility,
      trajectory consistency, and functional evaluation.
    - Pretraining or adapting large video models is preferred over training from scratch,
      especially for robot manipulation data.
    - Aligning or verifying generated rollouts remains an unsolved reliability problem
      across benchmarks and verifiers.
    disagreements:
    - 'Generative formulation differs: some approaches use diffusion transformers,
      others masked autoregression or flow-based post-training, and some adapt frozen
      pretrained video models.'
    - 'Conditioning mechanism differs: independent modality timesteps, per-frame action
      modules, learned intermediate masks, parallel spatial action blocks, or frame-anchored
      assertions.'
    - 'Supervision and alignment signal differ: prediction or imitation objectives,
      human preference datasets with hierarchical reward models, decoupled DPO-style
      discriminators, or heuristic verifiers.'
    - 'Evaluation targets differ: visual quality, action-frame alignment, policy-simulator
      correlation, physical plausibility, or spatial reasoning benchmark improvement.'
    - 'Deployment assumptions differ: some require small action-labeled domain datasets
      or closed-source base models, while others train large unified models on curated
      robot data.'
    open_questions:
    - Which formal state and dynamics definitions capture what current video world
      models actually learn?
    - Do visual generation quality and controllability metrics predict policy success
      and long-horizon physical behavior?
    - Why do test-time verifiers improve some spatial reasoning benchmarks but fail
      to scale consistently on others?
    - Can reward-aligned world models generalize beyond contact-rich manipulation
      and curated robot datasets?
    - How can scaling laws or guarantees be validated when current evidence lacks
      formal bounds and consistent cross-domain benchmarking?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 状态构建与动态建模的概念分类
      解决的问题: 将视频世界模型分解为隐式/显式状态构建与动态建模，倡导从视觉保真转向功能性基准。
      尚未覆盖: 未提供新实验，分类是否改变设计或评测仍未知；持久性与因果性的形式化条件未验证。
    - 路线: 动作-视频统一生成式建模用于机器人动态与策略
      解决的问题: 从多任务机器人数据学习动作条件未来视频，同时表示策略、动力学和视频生成，支持规划与合成数据。
      尚未覆盖: 物理持久性、长时程因果和跨领域泛化无保证；主要证据集中在机器人操控。
    - 路线: 预训练视频模型的高效适配
      解决的问题: 在不访问参数或有限领域数据下加入动作条件，或以高效掩码自回归实现实时视频模拟。
      尚未覆盖: 依赖领域动作标注视频或闭源基座模型，未验证在评估领域之外的任务迁移。
    - 路线: 奖励对齐与测试时验证
      解决的问题: 利用人类偏好、DPO式后训练或帧锚定断言，使生成轨迹更物理合理、逻辑一致并支持空间推理。
      尚未覆盖: 验证器校准和奖励可靠性在基准间不一致；测试时缩放不稳定，可能受信息瓶颈限制。
    - 路线: 缩放与验证器保证
      解决的问题: 检验模型规模或测试时计算能否可预期地提升空间推理，并通过帧锚定断言提供可验证奖励。
      尚未覆盖: 一个基准上有效不迁移到另一基准；缺少正式保证和一致校准的验证器。
    共识:
    - 动作条件视频预测被广泛用作世界模型的共同基础，以支撑策略学习、规划或评测。
    - 明确的动作到帧条件注入与更强可控性被视为具身世界模型有用的关键。
    - 仅凭视觉保真不足，领域正在转向物理合理性、轨迹一致性和功能性评测。
    - 更常见的是预训练或适配大型视频模型，而不是从头训练，尤其在机器人操作数据上。
    - 生成轨迹的对齐或验证仍不可靠，不同基准和验证器表现不一致。
    分歧:
    - 生成范式不同：扩散Transformer、掩码自回归、基于流的后训练或冻结预训练视频模型适配。
    - 条件注入方式不同：独立模态时间步、逐帧动作模块、学习到的中间掩码、并行空间动作块或帧锚定断言。
    - 监督与对齐信号不同：预测或模仿目标、人类偏好数据的分层奖励模型、解耦DPO式判别器或启发式验证器。
    - 评测目标不同：视觉质量、动作-帧对齐、策略与模拟器相关性、物理合理性或空间推理基准提升。
    - 部署假设不同：部分依赖小规模动作标注域数据或闭源基座模型，部分训练大型统一模型于策展机器人数据。
    开放问题:
    - 哪些形式化的状态与动态定义能刻画当前视频世界模型实际学到的内容？
    - 视觉生成质量与可控性指标能否预测策略成功率和长时程物理行为？
    - 为什么测试时验证器在某些空间推理基准上有效，在另一些上无法一致缩放？
    - 奖励对齐的世界模型能否泛化到接触丰富操作和策展机器人数据集之外？
    - 在缺少正式边界和一致跨域基准时，如何验证缩放规律或保证？
