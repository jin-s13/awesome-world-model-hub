  related_work_outline_zh:
  - 主流方向：近期应用工作集中于生成式视频/扩散/Transformer世界模型，用于自动驾驶场景预测和具身机器人学习，并出现面向记忆、空间和动作一致性的基准。
  - 研究共性：模型从视觉-动作序列或视频轨迹学习，生成未来帧或想象轨迹，并通过下游策略学习、预测指标或一致性基准进行测试。
  - 关键差异：差异体现在模态耦合和训练目标——掩码重建、物理信息深度/关键点、组合语言分解、统一视频-动作扩散、潜在上下文动力学，以及从Atari得分到驾驶rollout和机器人执行的评测目标。
  - 趋势演进：证据显示从2023年左右的高效游戏域模型强化学习，走向2024–2025的具身与驾驶扩散模型，2025–2026基准更关注空间记忆和动作控制而非仅视觉保真。
  - 开放问题：真实安全与运营对齐、跨本体泛化、长期一致性，以及新基准是否验证当前模型仍未解决；多篇论文未披露局限性或代码/数据细节。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene world models
      what_it_solves: Long-horizon and multi-view future video prediction for driving
        benchmark evaluation on Nuscenes, OpenDV-2K, and Waymo.
      what_remains_open: Whether driving benchmark improvements align with real-world
        safety or operational outcomes remains unverified; missing limitation details
        leave failure modes unclear.
    - line: Embodied robot video and action world models
      what_it_solves: Generates robot imagination, video plans, or policies by combining
        language goals, physics knowledge, action/video diffusion, or compositional
        primitives for simulation and robot execution.
      what_remains_open: Generalization beyond seen primitive combinations, novel
        embodiments, or datasets remains uncertain; sim-to-real transfer and physical
        plausibility beyond visual fidelity are not fully evidenced.
    - line: Contextual and efficient model-based RL world models
      what_it_solves: Improves zero-shot generalization to unseen dynamics in contextual
        RL and sample-efficient Atari learning using latent or stochastic sequence
        world models.
      what_remains_open: Contextual transfer is tested on only two CARL tasks and
        assumes observable context; Atari efficiency is reported, but broader transfer
        and limitation evidence are absent.
    - line: Spatial memory and action-consistency benchmarks
      what_it_solves: Evaluates world models for closed-loop spatial consistency,
        memory, and action control in interactive environments such as Minecraft and
        open-domain videos.
      what_remains_open: Benchmark construction is described, but model validation
        results are limited or not reported; how these metrics predict downstream
        task success is not yet shown.
    consensus:
    - World-model applications are converging on generative video/diffusion or sequence
      models trained from visual-action experience for control or prediction.
    - Evaluation is moving beyond frame quality toward downstream policy utility,
      long-horizon rollout, physical plausibility, and consistency under action.
    - Multiple works use large or diverse visual datasets to learn dynamics, but real-world
      transfer or safety alignment remains an unresolved shared concern.
    disagreements:
    - 'Representation differs: some use latent state-space models for imagined rollouts,
      while others use diffusion video generation or transformer action-video coupling.'
    - 'Supervision differs: mask reconstruction, temporal depth and keypoint dynamics,
      compositional language primitives, forward/inverse action dynamics, and context-conditioned
      latent dynamics.'
    - 'Evaluation targets differ: Atari human-normalized scores, Nuscenes/OpenDV-2K/Waymo
      rollout performance, robot simulation execution, and Minecraft spatial/memory
      consistency.'
    - 'Deployment settings differ: game/Atari, contextual RL, robotic datasets, driving
      datasets, and interactive open-domain benchmarks create different generalization
      boundaries.'
    open_questions:
    - Do driving world model gains on Nuscenes, OpenDV-2K, and Waymo transfer to real-world
      safety or operational outcomes?
    - Can embodied world models handle novel low-level primitives, unseen embodiments,
      or dataset shifts beyond training combinations?
    - Do LoopNav and MIND benchmarks provide enough reported model validation to compare
      current world models, and do their consistency metrics predict downstream task
      success?
    - What are the failure modes and limitations of methods with missing limitation
      sections, and are code, datasets, and baselines sufficiently available for verification?
