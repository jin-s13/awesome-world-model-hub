  related_work_outline:
  - 'Mainstream direction: Recent top work concentrates on scalable action-conditioned
    generative world models, especially diffusion-transformer and stochastic latent
    architectures, while new benchmarks target long-term consistency and action controllability.'
  - 'Shared research pattern: Papers combine video or latent prediction with auxiliary
    tasks or control signals—mask reconstruction, physics-informed depth/keypoints,
    language-primitive decomposition, context conditioning, or action-video diffusion—to
    improve realism, generalization, or control.'
  - 'Key differences: Representations and supervision diverge: stochastic state-space
    models for model-based RL, diffusion video generation, compositional generators,
    physics-informed auxiliary losses, and benchmark-only versus policy/planning evaluation
    settings.'
  - 'Trend evolution: From 2023 efficient Atari world models such as STORM to 2024-2025
    contextual, compositional, physics-informed, driving, and robotic video models,
    then 2025-2026 spatial/memory consistency benchmarks; this topic appears to be
    within the current frontier.'
  - 'Open questions: Transfer beyond reported tasks, isolating model contribution
    from planner/controller/task prior, support for novel primitives and action spaces,
    and whether consistency benchmarks reflect deployment remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期重点集中在可扩展的动作条件生成式世界模型，尤其是扩散Transformer和随机潜在架构，并开始系统评估长期一致性与动作可控性。
  - 研究共性：论文通常将视频或潜在预测与辅助任务或控制信号结合，如掩码重建、深度-关键点物理约束、语言原语组合、上下文条件或动作-视频扩散。
  - 关键差异：表示与监督信号不同：随机状态空间用于基于模型的强化学习、扩散视频生成、组合式生成、物理信息辅助损失；评测也从Atari延伸到驾驶、机器人和一致性基准。
  - 趋势演进：从2023年Atari高效世界模型到2024-2025上下文、组合、物理信息以及驾驶与机器人视频模型，再到2025-2026空间与记忆一致性基准；整体仍处于当前前沿。
  - 开放问题：方法在已报告任务外的迁移性、模型与规划器/控制器贡献分离、对未见原语/动作空间的泛化，以及一致性基准的部署有效性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Representation and generative objective design
      what_it_solves: Converts world-model ideas into diffusion transformers, stochastic
        latent state-space models, compositional video generators, and auxiliary objectives
        such as mask reconstruction, depth prediction, or keypoint dynamics.
      what_remains_open: Which representations and objectives transfer beyond the
        reported driving, robot, game, or benchmark settings is unclear, and several
        papers lack detailed limitations or ablations.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to policy training over imagined trajectories,
        contextual zero-shot policies, video plan synthesis, or coupled action-video
        diffusion for decision-time use.
      what_remains_open: The evidence does not fully isolate how much gain comes from
        the world model itself versus the planner, controller, task prior, context,
        or data scale.
    - line: Method evidence and evaluation protocols
      what_it_solves: Adds evaluation surfaces beyond visual fidelity or game score,
        including spatial consistency, memory consistency, action control, and long-horizon
        rollout through benchmarks.
      what_remains_open: Whether these benchmarks capture real deployment conditions,
        long-term memory, novel action spaces, and broad generalization remains an
        open verification gap.
    consensus:
    - World-model methods increasingly use action-conditioned generation or latent
      dynamics, treating models as controllable simulators rather than passive predictors.
    - Diffusion transformers and stochastic latent state-space models are common;
      auxiliary tasks such as mask reconstruction, depth prediction, and keypoint
      dynamics are used to improve consistency.
    - Evaluation is shifting from single-task visual quality or game score toward
      spatial consistency, memory consistency, and action controllability across video
      sequences.
    - Several methods exploit unlabeled video or large demonstration datasets, with
      self-supervised generation or context prediction as a core training signal.
    disagreements:
    - 'Representation differs: stochastic latent state-space for model-based reinforcement
      learning versus diffusion video generation versus factorized compositional generation.'
    - 'Supervision differs: explicit context values, language-primitive decomposition,
      physics-informed auxiliary objectives, or unified action-video diffusion.'
    - 'Evaluation settings differ: efficient Atari 100k, CARL contextual control,
      driving datasets, robot manipulation videos, and open-domain Minecraft-style
      videos.'
    - 'Deployment mode differs: policy training over imagined trajectories, video
      plan synthesis, or benchmark scoring without a deployed policy or simulator.'
    open_questions:
    - Which auxiliary objective or representation transfers beyond the specific driving,
      robot, game, or benchmark scenario in which it was tested?
    - How much of the reported policy improvement is due to the world model rather
      than the planner, controller, context prior, or data scale?
    - Can compositional world models support novel language primitives or action spaces
      not seen during training?
    - Do spatial and memory consistency benchmarks sufficiently cover real deployment
      needs for long-horizon memory and cross-action-space generalization?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 表示与生成目标设计
      解决的问题: 将世界模型想法落实为扩散Transformer、随机潜在状态空间、组合视频生成器，以及掩码重建、深度预测、关键点动力学等辅助目标。
      尚未覆盖: 哪些表示和目标能迁移到已报告的驾驶、机器人、游戏和基准之外仍不清楚，且多篇论文缺少限制与消融证据。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学接入想象轨迹上的策略训练、上下文零样本策略、视频计划合成或动作-视频联合扩散。
      尚未覆盖: 证据尚未充分隔离收益有多少来自世界模型本身，而不是规划器、控制器、任务先验、上下文或数据规模。
    - 路线: 方法证据与评测协议
      解决的问题: 补充视觉保真度或游戏分数之外的评测面，包括空间一致性、记忆一致性、动作控制和长时域展开。
      尚未覆盖: 这些基准能否代表真实部署条件，并覆盖长期记忆、新动作空间和广泛泛化，仍是验证缺口。
    共识:
    - 世界模型方法越来越多地采用动作条件生成或潜在动力学，将模型当作可控模拟器而非被动预测器。
    - 扩散Transformer和随机潜在状态空间模型常见；掩码重建、深度预测和关键点动力学等辅助任务被用于提升一致性。
    - 评测正从单一任务的视觉质量或游戏分数，转向跨视频的空间一致性、记忆一致性和动作可控性。
    - 多篇方法利用无动作视频或大规模示范数据，以自监督生成或上下文预测作为核心训练信号。
    分歧:
    - 表示不同：有的用随机潜在状态空间做基于模型的强化学习，有的用扩散视频生成，有的用组合式生成。
    - 监督信号不同：显式上下文值、语言原语分解、物理信息辅助目标或动作-视频联合扩散。
    - 评测场景不同：Atari 100k、CARL上下文控制、驾驶数据、机器人操作视频和Minecraft风格开放域视频。
    - 部署模式不同：在想象轨迹上训练策略、合成视频计划，或仅做基准评分而未部署策略或模拟器。
    开放问题:
    - 哪些辅助目标或表示能迁移到已报告的驾驶、机器人、游戏和基准场景之外？
    - 已报告的策略提升有多少来自世界模型，而不是规划器、控制器、上下文先验或数据规模？
    - 组合世界模型能否处理训练中未见的新语言原语或动作空间？
    - 空间与记忆一致性基准是否足够覆盖真实部署所需的长期记忆和跨动作空间泛化？
