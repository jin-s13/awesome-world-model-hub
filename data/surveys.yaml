  related_work_outline:
  - 'Mainstream direction: Building generative world models that combine video prediction
    with action control using diffusion models, Transformers, and self-supervised
    objectives, tested on robotic, driving, and game environments.'
  - 'Shared research pattern: Jointly learning visual dynamics and action-conditioned
    transitions through unified architectures, leveraging large-scale pretraining
    and task-specific finetuning.'
  - 'Key differences: Works diverge in whether they explicitly encode physical priors,
    how they couple action and video modalities, the type of generalization targeted
    (compositional, contextual, spatial), and the evaluation metrics used (pixel fidelity,
    physical plausibility, downstream task success).'
  - 'Trend evolution: The field is moving from sample-efficient RL in simple games
    (2023) toward physically informed, multi-view, long-horizon video generation in
    complex embodied settings (2024-2025), with a recent emphasis on systematic benchmarks
    for memory, consistency, and action control (2025-2026).'
  - 'Open questions: How to quantify physical accuracy and long-term consistency apart
    from visual quality, how to transfer world models from simulation to real-world
    deployment, and whether current architectures can learn causal structure rather
    than statistical correlations.'
  related_work_outline_zh:
  - 主流方向：构建结合视频预测与动作控制的生成式世界模型，采用扩散模型、Transformer和自监督目标，并在机器人、驾驶和游戏环境中测试。
  - 研究共性：通过统一架构联合学习视觉动力学和动作条件转移，利用大规模预训练和任务特定微调。
  - 关键差异：工作之间在是否显式编码物理先验、如何耦合动作与视频模态、目标泛化类型（组合、上下文、空间）以及评估指标（像素保真度、物理合理性、下游任务成功）上存在分歧。
  - 趋势演进：领域正从简单游戏中的样本高效强化学习（2023年）转向复杂具身场景中物理知情、多视角、长时域的视频生成（2024-2025年），最近强调针对记忆、一致性和动作控制的系统化基准（2025-2026年）。
  - 开放问题：如何在视觉质量之外量化物理准确性和长期一致性，如何将世界模型从仿真迁移到真实世界部署，以及当前架构能否学习因果结构而非统计相关性。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures and training objectives
      what_it_solves: Designing neural architectures (e.g., diffusion Transformers,
        VAEs, conditioned video generators) and self-supervised losses (mask reconstruction,
        temporal depth, keypoint dynamics) to produce high-fidelity, physics-aware
        video predictions and latent dynamics.
      what_remains_open: Trade-offs between visual quality, physical consistency,
        and training efficiency; whether explicit physics priors generalize better
        than purely data-driven ones; and how to handle out-of-distribution dynamics.
    - line: Action-conditional world models for planning and decision-making
      what_it_solves: Integrating action signals into world models (via coupled diffusion,
        contextual RNNs, or compositional primitives) to enable policy learning, video
        planning, or zero-shot generalization to unseen tasks or dynamics.
      what_remains_open: How to disentangle contributions of the model, planner, and
        task prior; generalization across diverse action spaces and embodiments; and
        leveraging action-free video data effectively.
    - line: Evaluation protocols and benchmarks for world model capabilities
      what_it_solves: Creating standardized datasets and metrics (e.g., spatial consistency,
        memory consistency, action controllability) to systematically assess world
        model performance beyond pixel-level reconstruction.
      what_remains_open: Gap between benchmark metrics and real-world deployment requirements;
        limited coverage of open-domain physical reasoning; and the absence of unified
        evaluation across different model families.
    consensus:
    - World models benefit from joint modeling of visual observations and action dynamics,
      rather than treating them separately.
    - Diffusion-based and Transformer-based architectures are becoming the dominant
      backbone for video generation and latent dynamics.
    - Large-scale pretraining on diverse datasets improves generalization and robustness,
      but task-specific finetuning remains necessary.
    - Self-supervised objectives such as masked reconstruction, variational inference,
      and dynamics prediction are effective for training world models without explicit
      labels.
    disagreements:
    - Explicit physics-informed design (e.g., temporal depth, keypoint dynamics) vs.
      purely data-driven, implicit physics learning.
    - Coupling video and action diffusion in a single unified model vs. using separate
      modules or conditioning mechanisms.
    - 'Target evaluation: pixel-level video fidelity vs. downstream task performance
      vs. abstract consistency metrics (spatial, memory).'
    - 'Generalization emphasis: compositional generalization to novel primitive combinations
      vs. contextual generalization to unseen physical parameters vs. open-domain
      spatial consistency.'
    open_questions:
    - How can we measure long-term physical consistency and causal behavior in world
      models beyond short-term visual prediction?
    - What are the minimal physical priors needed to achieve robust generalization
      across diverse real-world environments?
    - To what extent do current world model architectures capture reusable causal
      mechanisms, rather than relying on dataset correlations?
    - How can evaluation protocols be standardized to compare world models that differ
      in output modality, action interface, and training data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构与训练目标
      解决的问题: 设计神经架构（如扩散Transformer、VAE、条件视频生成器）和自监督损失（掩码重建、时间深度、关键点动力学），以产生高保真、物理感知的视频预测和潜动力学。
      尚未覆盖: 视觉质量、物理一致性和训练效率之间的权衡；显式物理先验是否比纯数据驱动方法泛化更好；以及如何处理分布外动力学。
    - 路线: 面向规划与决策的动作条件世界模型
      解决的问题: 将动作信号整合到世界模型中（通过耦合扩散、上下文RNN或组合原语），以实现策略学习、视频规划或对未见任务或动力学的零样本泛化。
      尚未覆盖: 如何分离模型、规划器和任务先验的贡献；跨多样化动作空间和具身形态的泛化；以及有效利用无动作视频数据。
    - 路线: 世界模型能力的评估协议与基准
      解决的问题: 创建标准化数据集和指标（如空间一致性、记忆一致性、动作可控性），以系统性地评估超越像素级重建的世界模型性能。
      尚未覆盖: 基准指标与真实世界部署需求之间的差距；开放域物理推理的覆盖有限；以及缺乏不同模型家族的统一评估。
    共识:
    - 世界模型受益于联合建模视觉观察和动作动力学，而非分别处理。
    - 基于扩散和Transformer的架构正成为视频生成和潜动力学的主流骨干。
    - 在多样化数据集上的大规模预训练能提升泛化性和鲁棒性，但任务特定微调仍然必要。
    - 自监督目标（如掩码重建、变分推理和动力学预测）能有效训练世界模型，无需显式标签。
    分歧:
    - 显式物理知情设计（如时间深度、关键点动力学）与纯数据驱动、隐式物理学习。
    - 在单一统一模型中耦合视频与动作扩散，还是使用独立模块或条件机制。
    - 评估目标：像素级视频保真度 vs. 下游任务性能 vs. 抽象一致性指标（空间、记忆）。
    - 泛化重点：对新原语组合的组合泛化 vs. 对未见物理参数的上下文泛化 vs. 开放域空间一致性。
    开放问题:
    - 如何在短期视觉预测之外，衡量世界模型的长期物理一致性和因果行为？
    - 在多样化真实环境中实现鲁棒泛化所需的最小物理先验是什么？
    - 当前世界模型架构在多大程度上捕获了可复用的因果机制，而非依赖数据集相关性？
    - 如何标准化评估协议，以比较输出模态、动作接口和训练数据各不相同世界模型？
