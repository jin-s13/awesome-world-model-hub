    and Minecraft/open-domain navigation.'
  - 'Trend evolution: evidence moves from efficient model-based RL world models around
    2023 toward diffusion/video world models for embodied driving and robot applications
    in 2024-2025, with 2025-2026 adding specialized memory-consistency and action-control
    benchmarks; the sample remains strongly within the current frontier.'
  - 'Open questions: key gaps include cross-embodiment and sim-to-real transfer, long-horizon
    memory, compositional generalization beyond training primitives or observed context,
    alignment between simulation gains and real safety, and incomplete reproducibility
    or limitation evidence across the packet.'
  related_work_outline_zh:
  - 主流方向：面向机器人与自动驾驶等应用的世界模型以生成式视频和扩散方法为主，近期基准关注记忆、空间一致性和动作控制。
  - 研究共性：从视频、动作和任务上下文学习预测模型，用于仿真、策略训练或长时域生成，并引入掩码、物理损失、语言原语或视频-动作统一扩散等结构。
  - 关键差异：表示方式包括潜在状态空间、VAE、扩散Transformer和组合生成器；监督信号涵盖上下文RL、语言解析、物理任务、掩码重建和动作-视频耦合；评测场景从Atari、CARL到机器人、驾驶和Minecraft。
  - 趋势演进：证据从2023年前后的高效模型基RL世界模型，演进到2024-2025年面向机器人与驾驶的扩散/视频世界模型，2025-2026年出现专门的记忆一致性和动作控制基准，整体仍处于当前前沿。
  - 开放问题：跨本体和从仿真到真实的迁移、长时域记忆、跨出训练原语或可观测上下文的组合泛化、仿真收益与真实安全的对应关系，以及部分证据包中可复现性和局限信息不完整。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models and simulation
      what_it_solves: Multi-view, long-horizon driving scene prediction and cross-dataset
        validation using video mask reconstruction and diffusion transformers.
      what_remains_open: Whether simulator or validation improvements transfer to
        real-world driving safety and operational outcomes; limitation evidence is
        not fully reported.
    - line: Embodied and domain task transfer
      what_it_solves: Learning action-conditioned video or dynamics models for robot
        imagination, policy training, and zero-shot task transfer using language primitives,
        physics-informed tasks, context conditioning, or unified video-action diffusion.
      what_remains_open: Generalization to unseen objects or actions beyond training
        primitives or observed context; real-robot execution evidence is limited or
        simulation-bound.
    - line: Interactive agent and game world models
      what_it_solves: Efficient model-based reinforcement learning and open-domain
        evaluation of spatial consistency, memory consistency, and action control
        in game-like interactive environments.
      what_remains_open: Generalization across environment rules, goals, camera/action
        spaces, and long-horizon memory under closed-loop interaction; some benchmarks
        are dataset construction rather than full model comparison.
    consensus:
    - Application-focused world models are shifting from policy-centric model-based
      RL toward generative video/dynamics predictors reused for simulation, policy
      training, and long-horizon generation.
    - Many methods add domain-specific structure such as mask reconstruction, depth/keypoint
      physics tasks, language primitives, context conditioning, or coupled action-video
      diffusion to improve plausibility and control.
    - Evaluations increasingly combine visual quality with downstream or behavioral
      metrics such as zero-shot policy return, simulation execution success, spatial
      consistency, and action control.
    - Recent benchmark work treats memory and physical/spatial consistency as first-class
      evaluation targets rather than relying only on frame similarity.
    disagreements:
    - 'Representation differs: latent state-space/VAE models, diffusion Transformers,
      compositional video generators, and unified video-action diffusion models coexist.'
    - 'Supervision differs: explicit context values, natural-language primitive parsing,
      physics-informed auxiliary tasks, mask reconstruction, or joint video and action
      diffusion objectives.'
    - 'Evaluation target differs: Atari human-normalized scores, CARL zero-shot contextual
      generalization, driving multi-view/long-horizon prediction, robot video plans
      and physical plausibility, or Minecraft/open-domain loop consistency.'
    - 'Interaction mode differs: closed-loop game agents, robot imagination/policy
      training, open-domain video-to-world navigation, and multi-camera driving simulation
      create different demands on memory and action control.'
    open_questions:
    - What evidence is missing to connect driving simulator or video prediction improvements
      to real-world safety and operational outcomes?
    - How can world models maintain long-horizon memory consistency and action control
      across unseen scenes, viewpoints, and action spaces without overfitting to benchmark-specific
      metrics?
    - Under what conditions can compositional or contextual world models generalize
      to novel objects, actions, or dynamics beyond observed context or training primitives?
    - Which auxiliary signals such as physics, depth, language, or action-video coupling
      are necessary and sufficient for downstream policy robustness across embodiments?
    - How should verification gaps be handled when top papers lack visible limitation
      statements, full baseline details, or reproducible artifacts despite high read-first
      scores?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与仿真
      解决的问题: 使用视频掩码重建和扩散Transformer进行多视角、长时域驾驶场景预测及跨数据集验证。
      尚未覆盖: 仿真或验证指标提升是否能迁移到真实驾驶安全与运营结果；局限性证据报告不完整。
    - 路线: 具身与领域任务迁移
      解决的问题: 学习动作条件视频或动力学模型，以支持机器人想象、策略训练和零样本任务迁移，并引入语言原语、物理任务、上下文条件或统一视频-动作扩散。
      尚未覆盖: 对训练原语或可观测上下文之外的新物体/动作的泛化；真实机器人执行证据有限或仅限于仿真。
    - 路线: 交互式智能体与游戏世界模型
      解决的问题: 在游戏类交互环境中进行高效模型基强化学习，并评测空间一致性、记忆一致性和动作控制。
      尚未覆盖: 环境规则、目标、相机/动作空间变化及闭环交互下的长时域记忆泛化；部分基准仅构建数据集而未做全面模型比较。
    共识:
    - 应用导向的世界模型正从以策略为中心的模型基强化学习，转向可复用于仿真、策略训练和长时域生成的生成式视频/动力学预测器。
    - 许多方法加入领域特定结构，如掩码重建、深度/关键点物理任务、语言原语、上下文条件或动作-视频耦合扩散，以提升合理性与控制性。
    - 评测越来越多地同时使用视觉质量与行为/下游指标，例如零样本策略回报、仿真执行成功率、空间一致性和动作控制。
    - 近期基准工作将记忆与物理/空间一致性作为一级评测目标，而不再仅依赖帧相似度。
    分歧:
    - 表示方式不同：潜在状态空间/VAE模型、扩散Transformer、组合视频生成器与统一视频-动作扩散模型并存。
    - 监督信号不同：显式上下文值、自然语言原语解析、物理信息辅助任务、掩码重建或视频与动作联合扩散目标。
    - 评测目标不同：Atari人类标准化得分、CARL零样本上下文泛化、驾驶多视角/长时域预测、机器人视频计划与物理合理性，或Minecraft/开放域闭环一致性。
    - 交互模式不同：闭环游戏智能体、机器人想象/策略训练、开放域视频到世界导航和多相机驾驶仿真对记忆与动作控制提出不同要求。
    开放问题:
    - 缺少哪些证据来连接驾驶仿真或视频预测提升与真实安全及运营结果？
    - 世界模型如何在不依赖单一基准指标的情况下，跨未见场景、视角和动作空间维持长时域记忆一致性与动作控制？
    - 组合或上下文世界模型在何种条件下能泛化到训练原语或可观测上下文之外的新物体、动作与动力学？
    - 哪些辅助信号——物理、深度、语言或动作-视频耦合——对跨本体的下游策略鲁棒性是必要且充分的？
    - 当高读先分数论文缺乏可见局限、完整基线或可复现工件时，应如何标记和处理验证缺口？
