  related_work_outline:
  - 'Mainstream direction: Scaling diffusion-based world models with Transformer backbones
    for video generation and multi-task pretraining, aiming to capture dynamics and
    visual fidelity simultaneously.'
  - 'Shared research pattern: Jointly model observations and actions through a unified
    architecture, then use the learned dynamics for planning, policy learning, or
    zero-shot generalization.'
  - 'Key differences: Methods diverge in whether they optimize for pixel-level video
    realism versus latent dynamics for decision-making, and whether they incorporate
    explicit physical knowledge or rely on data-driven priors.'
  - 'Trend evolution: From small-scale model-based RL with latent imagination (2023)
    toward large-scale diffusion world models and physics-informed video generation
    (2025–2026), with growing emphasis on memory and spatial consistency benchmarks.'
  - 'Open questions: How to decouple model gains from planner/controller contributions,
    and how to transfer large pretrained world models to real-world closed-loop control
    without catastrophic forgetting of physical constraints.'
  related_work_outline_zh:
  - 主流方向：以Transformer为骨干的扩散式世界模型，面向视频生成与多任务预训练，试图同时捕捉动力学和视觉保真度。
  - 研究共性：通过统一架构联合建模观测和动作，利用学习到的动力学进行规划、策略学习或零样本泛化。
  - 关键差异：方法在设计目标上分化——像素级视频真实感 vs. 面向决策的潜在动力学；在是否显式引入物理知识还是依赖数据驱动先验上存在分歧。
  - 趋势演进：从小规模、基于潜在想象的模型化RL（2023年）转向大规模扩散世界模型与物理信息视频生成（2025–2026年），对记忆和空间一致性基准的重视日益增加。
  - 开放问题：如何解耦模型增益与规划器/控制器的贡献，以及如何将大型预训练世界模型迁移到真实世界闭环控制而不丧失物理约束。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based video generation world models
      what_it_solves: Transforms world-model ideas into high-fidelity, multi-view,
        and long-horizon video predictors using diffusion transformers and mask reconstruction,
        enabling scalable pretraining on diverse robotics and driving data.
      what_remains_open: Whether pixel-level fidelity translates to better downstream
        control; how to maintain long-term physical consistency and memory beyond
        the training horizon; and the computational cost of scaling diffusion.
    - line: Latent dynamics models for model-based RL
      what_it_solves: Learns compact stochastic state representations and dynamics
        (e.g., RSSM, cRSSM, Transformer-VAE) for sample-efficient policy optimization
        through imagined trajectories, achieving strong performance on Atari and continuous
        control tasks.
      what_remains_open: Generalization to unseen dynamics relies on observability
        of context variables; evaluations are limited to a few standard benchmarks,
        leaving real-world sim-to-real transfer unverified.
    - line: Compositional and physics-informed world models
      what_it_solves: Factorizes video generation via language primitives or jointly
        learns depth/physics signals to improve generalization to unseen action combinations
        and enhance physical plausibility of generated videos.
      what_remains_open: Compositional approaches are bounded by predefined primitives
        and require accurate language parsing; physics-informed losses have not been
        shown to close the loop with real-world policy execution.
    - line: Unified action-video diffusion pretraining
      what_it_solves: Couples action and video diffusion in a single Transformer to
        simultaneously represent policy, forward/inverse dynamics, and video generation,
        enabling pretraining on large-scale multi-task robot datasets and leveraging
        action-free video.
      what_remains_open: Relative contributions of action and video modalities to
        downstream robustness are not isolated; the model's behavior under real-time
        closed-loop constraints remains unexplored.
    - line: Benchmarks for memory, spatial consistency, and action control
      what_it_solves: Provides standardized datasets and metrics (loop-based navigation,
        scene graph consistency, memory consistency scores) to evaluate world models'
        ability to maintain temporal coherence and generalize across action spaces.
      what_remains_open: Current benchmarks are limited to simulated or game environments
        (Minecraft, driving simulators) and do not yet cover real-world sensory noise,
        long-term autonomy, or safety-critical scenarios.
    consensus:
    - World models are moving toward unified architectures that jointly handle video
      generation and action prediction, replacing separate perception and dynamics
      modules.
    - Large-scale pretraining on diverse robot or driving datasets is widely adopted
      to improve generalization and robustness over single-task, small-data training.
    - There is a shared recognition that purely pixel-level reconstruction losses
      are insufficient; memory, spatial consistency, and physical plausibility must
      be explicitly evaluated or incorporated.
    - Model-based planning and policy learning can benefit from imagined rollouts,
      but the community agrees that the quality of the world model's dreams is critical
      to downstream performance.
    disagreements:
    - 'Representation: Some works model the world in pixel space via diffusion, while
      others compress to latent states for more efficient planning, creating a tension
      between visual fidelity and decision-oriented abstraction.'
    - 'Supervision: Methods differ in whether they use explicit physics losses (depth,
      keypoints), context-conditioned dynamics, or purely data-driven generative objectives,
      leading to different assumptions about what constitutes a good world model.'
    - 'Evaluation target: The community measures success by video quality, policy
      return, zero-shot generalization, or memory consistency, with no agreed-upon
      single metric, making cross-method comparison difficult.'
    - 'Interaction mode: Some models are designed for open-loop video generation or
      offline planning, while others target closed-loop, action-conditioned control,
      yet the evaluation rarely measures real-time control performance.'
    open_questions:
    - How much of the reported policy improvement is due to the world model architecture
      versus the planner or RL algorithm, and can we design ablation protocols that
      isolate this?
    - Can diffusion-based world models maintain consistent memory and physical plausibility
      over long horizons without explicit physics priors, and how should we measure
      failure?
    - What is the minimal set of supervision signals (image, action, physics) needed
      to transfer a pretrained world model to a real robot under domain shift?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的视频生成世界模型
      解决的问题: 将世界模型构想转化为高保真、多视角、长时域视频预测器，利用扩散Transformer和掩码重建，支持在多样化机器人和驾驶数据上的可扩展预训练。
      尚未覆盖: 像素级保真度是否转化为更好的下游控制；如何维持训练时域之外的长期物理一致性和记忆；扩散模型规模化的计算成本。
    - 路线: 面向模型化强化学习的潜在动力学模型
      解决的问题: 学习紧凑的随机状态表示和动力学（如 RSSM、cRSSM、Transformer-VAE），通过想象轨迹实现样本高效的策略优化，在 Atari
        和连续控制任务中取得强劲表现。
      尚未覆盖: 对未见动力学的泛化依赖于上下文变量的可观测性；评估局限于少数标准基准，真实世界的 sim-to-real 迁移尚未验证。
    - 路线: 组合式与物理信息世界模型
      解决的问题: 通过语言原语分解视频生成，或联合学习深度/物理信号，以提升对未见动作组合的泛化能力并增强生成视频的物理合理性。
      尚未覆盖: 组合方法受限于预定义原语，并要求准确的语言解析；物理信息损失尚未在实际机器人策略闭环中验证。
    - 路线: 统一动作-视频扩散预训练
      解决的问题: 在单一 Transformer 中耦合动作和视频扩散，同时表示策略、前向/逆向动力学和视频生成，支持在大规模多任务机器人数据集上预训练并利用无动作视频。
      尚未覆盖: 动作和视频模态对下游鲁棒性的相对贡献未隔离；模型在实时闭环约束下的行为尚未探索。
    - 路线: 记忆、空间一致性与动作控制基准
      解决的问题: 提供标准化数据集和指标（循环导航、场景图一致性、记忆一致性分数），评估世界模型维持时间连贯性和跨动作空间泛化的能力。
      尚未覆盖: 当前基准局限于模拟或游戏环境（Minecraft、驾驶模拟器），尚未覆盖真实世界传感噪声、长期自主运行或安全关键场景。
    共识:
    - 世界模型正朝着统一架构发展，联合处理视频生成与动作预测，替代分离的感知与动力学模块。
    - 大规模多任务机器人或驾驶数据预训练被广泛采用，以提升对单一任务小数据训练的泛化性和鲁棒性。
    - 社区普遍认识到单纯像素级重建损失不足，记忆、空间一致性和物理合理性必须被显式评估或纳入。
    - 基于模型的规划与策略学习可从想象轨迹中获益，但一致认为世界模型梦境的质量对下游性能至关重要。
    分歧:
    - 表示方式：一些工作通过扩散在像素空间建模世界，另一些压缩至潜在状态以进行更高效的规划，形成视觉保真度与决策导向抽象之间的张力。
    - 监督信号：方法在使用显式物理损失（深度、关键点）、上下文条件动力学还是纯数据驱动生成目标上存在分歧，导致对何为好世界模型的假设不同。
    - 评测目标：社区以视频质量、策略回报、零样本泛化或记忆一致性衡量成功，缺乏统一的单一指标，使跨方法比较困难。
    - 交互模式：部分模型设计用于开环视频生成或离线规划，其他则面向闭环、动作条件控制，但评估很少测量实时控制性能。
    开放问题:
    - 报告的策略改进有多少来自世界模型架构本身，有多少来自规划器或强化学习算法，能否设计消融协议加以隔离？
    - 基于扩散的世界模型能否在没有显式物理先验的情况下维持长时域的记忆和物理合理性，并如何衡量失效？
    - 在领域迁移下将预训练世界模型适配到真实机器人所需的最小监督信号集（图像、动作、物理）是什么？
