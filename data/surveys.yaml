  related_work_outline:
  - 'Mainstream direction: Generative world models applied to embodied tasks, autonomous
    driving, and interactive games, leveraging diffusion transformers, variational
    autoencoders, and large-scale pretraining for video prediction and dynamics learning.'
  - 'Shared research pattern: Models are trained to predict future frames or states
    conditioned on actions or language, then evaluated on visual fidelity, policy
    performance, or consistency metrics; recent works incorporate physical knowledge
    and compositional reasoning.'
  - 'Key differences: Architectural choices (diffusion vs. VAE/Transformer vs. Dreamer
    variants), supervision signals (actions, language, or pure video), evaluation
    targets (pixel-level quality vs. spatial/memory consistency vs. downstream task
    success), and deployment context (simulation vs. real-world, single domain vs.
    cross-domain).'
  - 'Trend evolution: From 2015–2020 model-based RL in games (e.g., Dreamer) to 2023–2025
    diffusion-based world models for driving and robotics, with growing emphasis on
    benchmarks for long-term memory, action control, and spatial consistency (2025–2026).'
  - 'Open questions: Real-world transferability of simulation-trained world models,
    standardized multi-domain evaluation, compositional generalization to unseen object/action
    combinations, precise integration of physical constraints, and scalable long-horizon
    consistency.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型应用于具身任务、自动驾驶和交互式游戏，使用扩散Transformer、变分自编码器和大规模预训练进行视频预测和动力学学习。
  - 研究共性：模型以动作或语言为条件预测未来帧或状态，通过视觉保真度、策略性能或一致性指标评估；近期工作融入物理知识和组合推理。
  - 关键差异：架构选择（扩散 vs. VAE/Transformer vs. Dreamer变体）、监督信号（动作、语言或纯视频）、评测目标（像素级质量 vs.
    空间/记忆一致性 vs. 下游任务成功率）、部署场景（仿真 vs. 真实世界，单一领域 vs. 跨领域）。
  - 趋势演进：从2015–2020年游戏中的模型基RL（如Dreamer）到2023–2025年基于扩散的驾驶和机器人世界模型，2025–2026年越来越关注长期记忆、动作控制和空间一致性基准。
  - 开放问题：仿真训练的世界模型向真实世界迁移，标准化的多领域评测，对未见物体/动作的组合泛化，物理约束的精确融合，以及可扩展的长期一致性。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics by learning video generation,
        dynamics, and physical properties from multimodal data, enabling policy learning,
        planning, and imagination in manipulation tasks.
      what_remains_open: Real-robot validation is rare; physical knowledge is often
        implicit and limited to rigid objects; compositionality relies on pre-parsed
        primitives, and cross-embodiment or cross-scene generalization remains unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using diffusion-based world models for multi-view, long-horizon
        scene prediction and closed-loop simulation, aiming to improve policy evaluation
        and data augmentation for driving.
      what_remains_open: Alignment between simulator-based metrics and real-world
        safety outcomes; handling of rare events, diverse weather, and interactive
        agents; zero-shot generalization across different sensor setups and cities.
    - line: Interactive agents and games
      what_it_solves: Building efficient world models for RL in Atari, Minecraft,
        and contextual control tasks, often with limited environment interactions,
        and benchmarking spatial consistency, memory, and action controllability.
      what_remains_open: Generalization when environment dynamics, goals, or action
        spaces change; long-term memory consistency remains a challenge; benchmark
        coverage is still narrow, and human-like common-sense physical reasoning is
        not tested.
    consensus:
    - World models are shifting from RNN-based latent dynamics to Transformer and
      diffusion architectures that capture longer-range dependencies.
    - Large-scale pretraining on diverse datasets (robot manipulation, driving logs,
      Minecraft) is a common strategy to improve robustness and generalization.
    - Beyond visual quality, recent works evaluate consistency properties such as
      spatial loop closure, memory across frames, and responsiveness to action inputs.
    - Incorporating auxiliary physical knowledge (depth, keypoints, dynamics) improves
      realism and downstream task performance.
    - Compositional or context-conditioned generation can help models generalize to
      unseen task configurations without retraining.
    disagreements:
    - 'Representation: Some models couple video and action diffusion in a single transformer,
      while others separate video generation from action-conditioned dynamics or use
      purely autoregressive VAE-Transformer hybrids.'
    - 'Supervision: Methods differ in reliance on action labels, natural language
      instructions, or unsupervised video-only training; this affects applicability
      to passive data.'
    - 'Evaluation target: Pixel-level reconstruction, FVD, and LPIPS are used alongside
      task-specific metrics like policy success rate, scene graph consistency, or
      memory accuracy, with no agreed-upon primary metric.'
    - 'Interaction mode: Works vary from open-loop video prediction for planning to
      closed-loop policy evaluation, with different assumptions about action availability
      and environment feedback.'
    - 'Deployment realism: Most studies are simulation-only; a few target real driving
      datasets but lack real-vehicle closed-loop testing, and no top paper validates
      world models on physical robots.'
    open_questions:
    - How can simulation-trained world models be transferred to real-world robotic
      and driving tasks with safety guarantees?
    - What standardized evaluation protocol can compare world models across domains,
      covering both visual fidelity and downstream decision-making?
    - Can world models generalize compositionally to novel object categories, actions,
      or physical properties not seen during training?
    - How can physical laws (contact, deformation, fluid dynamics) be explicitly integrated
      and verified in neural world models?
    - What architectures and training objectives are needed to maintain long-term
      memory consistency and controllable action effects over thousands of timesteps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人领域，通过多模态数据学习视频生成、动力学和物理属性，支持策略学习、规划和想象。
      尚未覆盖: 真实机器人验证不足；物理知识多为隐式且局限于刚体；组合性依赖预解析原语；跨本体和跨场景泛化未经证实。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 使用基于扩散的世界模型进行多视角、长时域场景预测和闭环仿真，旨在改善驾驶策略评估和数据增强。
      尚未覆盖: 仿真指标与真实安全结果之间的对应关系；对罕见事件、恶劣天气和交互式交通参与者的处理；跨传感器设置和城市的零样本泛化。
    - 路线: 交互式智能体与游戏
      解决的问题: 在Atari、Minecraft和上下文控制任务中构建高效世界模型用于RL，通常仅有少量环境交互，并评估空间一致性、记忆和动作可控性。
      尚未覆盖: 环境动力学、目标或动作空间变化时的泛化能力；长期记忆一致性仍是挑战；基准覆盖范围有限，未测试类人常识物理推理。
    共识:
    - 世界模型正从基于RNN的潜在动力学转向Transformer和扩散架构，以捕捉更长程依赖。
    - 在多样化数据集（机器人操作、驾驶日志、Minecraft）上进行大规模预训练是提升鲁棒性和泛化性的常用策略。
    - 除了视觉质量，近期工作评估一致性属性，如空间闭环、跨帧记忆和动作输入的响应性。
    - 融入辅助物理知识（深度、关键点、动力学）可提升真实感和下游任务性能。
    - 组合式或上下文条件生成有助于模型泛化到未见任务配置，无需重新训练。
    分歧:
    - 表示方式：有的模型在单一Transformer中耦合视频与动作扩散，有的将视频生成与动作条件动力学分离，或使用纯自回归VAE-Transformer混合体。
    - 监督信号：方法在依赖动作标签、自然语言指令或纯无监督视频训练上存在差异，影响对被动数据的适用性。
    - 评测目标：像素级重建、FVD和LPIPS与策略成功率、场景图一致性或记忆准确度等任务特定指标并存，没有公认的主要指标。
    - 交互模式：从用于规划的开环视频预测到闭环策略评估，各种工作对动作可用性和环境反馈的假设不同。
    - 部署现实性：多数研究限于仿真；少数使用真实驾驶数据集但缺乏实车闭环测试，且没有顶级论文在真实机器人上验证世界模型。
    开放问题:
    - 如何将仿真训练的世界模型安全地迁移到真实世界的机器人和驾驶任务中？
    - 什么样的标准化评估协议能够跨领域比较世界模型，同时涵盖视觉保真度和下游决策？
    - 世界模型能否组合泛化到训练中未见过的新物体类别、动作或物理属性？
