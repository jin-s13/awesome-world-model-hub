  related_work_outline:
  - 'Mainstream direction: Diffusion Transformer-based video generation dominates
    recent world model architectures, often integrating structural or physical priors
    and coupling action modeling for large-scale pretraining on embodied tasks.'
  - 'Shared research pattern: Models are pretrained via self-supervised generation
    objectives on large-scale video or trajectory datasets, then adapted for downstream
    planning, control, or policy learning, with a focus on generalization.'
  - 'Key differences: Representation granularity (pixel-space video vs. latent state-space),
    action interface (joint diffusion vs. latent policy vs. language primitives),
    type of structural prior (physical, spatial mask, compositional), and evaluation
    target (visual quality, task performance, consistency metrics).'
  - 'Trend evolution: The field moved from latent dynamics models (2023) to video
    diffusion architectures (2024-2025), and now toward dedicated benchmarks (2025-2026)
    that assess memory, consistency, and action control, indicating a push for standardization.'
  - 'Open questions: How to ensure long-horizon memory consistency and physical plausibility,
    achieve real-world zero-shot generalization under partial observability, and establish
    a unified evaluation protocol that correlates with downstream success.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer的视频生成在近期世界模型架构中占主导，通常融合结构或物理先验，并耦合动作建模以支持大规模预训练，应用于具身任务。
  - 研究共性：通过自监督生成目标在大规模视频或轨迹数据上预训练，然后适配到下游规划、控制或策略学习，重点关注泛化能力。
  - 关键差异：表示粒度（像素空间视频 vs. 潜在状态空间）、动作接口（联合扩散 vs. 潜在想象策略 vs. 语言原语）、结构先验类型（物理显式、空间掩码、组合式）以及评估目标（视觉质量、任务性能、一致性指标）。
  - 趋势演进：领域从潜在动力学模型（2023年）转向视频扩散架构（2024-2025年），并在2025-2026年出现专用基准测试，评估记忆、一致性和动作控制，推动标准化进程。
  - 开放问题：如何确保长时域记忆一致性与物理合理性，在部分可观测下实现真实世界零样本泛化，并建立与下游成功相关的统一评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures, loss
        functions, and training recipes, such as diffusion transformers with mask
        reconstruction, physics-informed joint learning, compositional video generation,
        or unified video-action diffusion.
      what_remains_open: Transferability of specific architectural choices beyond
        the reported task families (e.g., driving, Atari, robotic manipulation) is
        unverified; most designs are evaluated on narrow benchmarks without systematic
        ablation across design axes.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making through imagination-based
        policy learning, coupled action-video diffusion, or language-primitive decomposition
        for robot control, thereby enabling the model to serve as a simulator for
        planning.
      what_remains_open: It remains unclear how much performance gain originates from
        the model versus the planner or task prior; real-world uncertainty, partial
        observability, and action-space transfer are rarely addressed.
    - line: Method evidence and evaluation protocols
      what_it_solves: Proposing benchmarks and metrics (e.g., spatial consistency,
        memory consistency, action control) to isolate method contributions from dataset,
        baseline, and implementation effects, and to reveal failure modes of current
        world models.
      what_remains_open: Current benchmarks cover limited consistency dimensions and
        lack a consensus on which metrics predict downstream task performance; systematic
        ablation studies are often missing, and evaluation is mostly simulation-only.
    consensus:
    - World models should capture environment dynamics to support prediction, planning,
      or policy learning, typically through generative or self-supervised objectives.
    - Diffusion models and Transformers have become the dominant architectural backbones
      for recent world models, especially in video prediction tasks.
    - Pretraining on large-scale, diverse datasets (e.g., driving videos, multi-task
      robot data) improves generalization and robustness of the learned world model.
    - Incorporating structural priors, such as spatial masks, physical consistency
      losses, or compositional primitives, enhances the fidelity and plausibility
      of generated futures.
    - Action-conditioning is essential for using world models as interactive simulators;
      models without controlled action interfaces are limited to passive observation.
    disagreements:
    - 'Representation format: some works use pixel-level video generation as the world
      model, while others rely on compact latent state-space models, trading off reconstruction
      quality against computational efficiency.'
    - 'Action interface: joint diffusion of actions and frames versus learning a policy
      in the latent imagination space versus decomposing actions into language primitives,
      each with different assumptions about action granularity and optimization.'
    - 'Physical prior: explicit physics-informed training is used to enforce physical
      plausibility, whereas others incorporate implicit structural priors through
      masking or no explicit physical modeling at all.'
    - 'Evaluation target: visual fidelity metrics are prioritized in some works, while
      others emphasize task performance scores, and a third line advocates for specialized
      consistency benchmarks, revealing a lack of alignment on what makes a good world
      model.'
    - 'Generalization assumption: some methods require observable context variables
      for zero-shot transfer, while others assume compositional generalization from
      seen building blocks, and a few test zero-shot domain shift without such factors.'
    open_questions:
    - How to guarantee long-term memory consistency and physical plausibility in open-domain
      world models, especially over extended horizons and diverse action spaces?
    - Can world models trained in simulation or on curated datasets transfer to real-world
      settings with noisy, partial observations, and how can we verify such transfer?
    - What is the minimal set of evaluation metrics that reliably predicts downstream
      task performance across different embodiments, and how can we standardize them?
    - The current evidence is insufficient to disentangle contributions of the world
      model architecture from the training data scale, planner design, and implementation
      choices; how can we design ablation protocols that isolate these factors?
    - How to achieve true zero-shot generalization to unseen dynamics without relying
      on observable context or pre-segmented primitives, given the limited evidence
      of such generalization in current methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思想转化为具体架构、损失函数和训练配方，例如带掩码重建的扩散Transformer、物理信息联合学习、组合式视频生成或统一视频-动作扩散。
      尚未覆盖: 特定架构选择在报告任务族（如驾驶、Atari、机器人操作）之外的迁移性尚未验证；多数设计仅在狭窄基准上评估，缺乏跨设计维度的系统消融。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策，通过基于想象的策略学习、耦合动作-视频扩散或语言原语分解实现机器人控制，使模型成为规划用的模拟器。
      尚未覆盖: 性能增益有多少来自模型本身而非规划器或任务先验尚不明确；真实世界的不确定性、部分可观测性和动作空间迁移很少被处理。
    - 路线: 方法证据与评估协议
      解决的问题: 提出基准和指标（如空间一致性、记忆一致性、动作控制）以区分方法贡献与数据集、基线和实现因素，并揭示当前世界模型的失效模式。
      尚未覆盖: 当前基准覆盖的一致性维度有限，且缺乏关于哪些指标能预测下游任务成功的共识；系统消融研究常缺失，且评估大多仅在仿真中进行。
    共识:
    - 世界模型应捕捉环境动态以支持预测、规划或策略学习，通常通过生成或自监督目标实现。
    - 扩散模型和Transformer已成为近期世界模型（尤其是视频预测任务）的主导架构骨架。
    - 在大规模多样化数据集（如驾驶视频、多任务机器人数据）上预训练能提升学习到的世界模型的泛化性和鲁棒性。
    - 融入结构先验，如空间掩码、物理一致性损失或组合原语，能增强生成未来的保真度和合理性。
    - 动作条件化对于将世界模型用作交互式模拟器至关重要；缺乏受控动作接口的模型仅限于被动观察。
    分歧:
    - 表示格式：部分工作使用像素级视频生成作为世界模型，而其他工作依赖紧凑的潜在状态空间模型，在重建质量与计算效率之间取舍。
    - 动作接口：联合扩散动作与帧，与在潜在想象空间中学习策略，或分解动作为语言原语，各自对动作粒度和优化有不同的假设。
    - 物理先验：显式物理信息训练被用于强制物理合理性，而其他工作通过掩码隐式融入结构先验，或完全不进行显式物理建模。
    - 评估目标：一些工作优先考虑视觉保真度指标，另一些强调任务性能分数，还有一派倡导专门的一致性基准，揭示了对什么构成好的世界模型缺乏共识。
    - 泛化假设：部分方法需要可观测的上下文变量来实现零样本迁移，而其他方法假设从已见构建块组合泛化，少数方法在不依赖这些因素的零样本域迁移上进行测试。
    开放问题:
    - 如何在开放域世界模型中保证长时域记忆一致性和物理合理性，尤其是在扩展时间范围和多样化动作空间下？
    - 在仿真或精选数据集上训练的世界模型能否迁移到具有噪声、部分观测的真实世界环境，以及如何验证这种迁移？
    - 什么是最小的评估指标集，能够可靠地预测不同具身形态下的下游任务性能，以及如何标准化这些指标？
    - 当前证据不足以来区分世界模型架构的贡献与训练数据规模、规划器设计和实现选择的影响；如何设计消融协议以隔离这些因素？
    - 鉴于当前方法中零样本泛化证据有限，如何在不依赖可观测上下文或预分割原语的情况下实现对新动力学的真正零样本泛化？
