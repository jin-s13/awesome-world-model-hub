  - 研究共性：多数工作扩展预训练视频扩散或自回归模型，加入轻量动作条件模块，并评估视觉保真度以及动作忠实度或空间一致性。
  - 关键差异：评估范围从空间一致性、物理合理性到实时闭环延迟各不相同；部分工作侧重基准方法论，另一些优先考虑系统级可部署性。
