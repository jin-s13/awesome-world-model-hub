  related_work_outline:
  - 'Mainstream direction: Diffusion/Transformer world models with auxiliary reconstruction,
    physics-informed, or action-coupled objectives dominate recent work for driving,
    robotics, and model-based RL.'
  - 'Shared research pattern: Methods learn dynamics from high-dimensional video or
    interaction data, add self-supervised tasks such as mask reconstruction, depth/keypoint
    prediction, context conditioning, or action diffusion, and evaluate generation,
    control, or consistency.'
  - 'Key differences: Representation varies across latent state-space, stochastic
    Transformer, diffusion Transformer, and compositional primitives; supervision
    ranges from video-only generation to joint video-action diffusion and context-conditioned
    dynamics; evaluation targets include Atari sample efficiency, robot execution,
    and memory/action benchmarks.'
  - 'Trend evolution: 2023 focuses on sample-efficient stochastic Transformer world
    models; 2024 introduces contextual and compositional models for zero-shot robot/dynamics
    generalization; 2025-2026 shifts toward large-scale driving/robot video-action
    diffusion and dedicated consistency benchmarks.'
  - 'Open questions: Cross-domain transfer, long-horizon memory and spatial consistency,
    attribution of gains to model versus planner/task design, and stronger evidence
    isolating method contribution from dataset and baseline effects.'
  related_work_outline_zh:
  - 主流方向：以扩散/Transformer世界模型为主，配合掩码重建、物理先验或动作耦合目标，用于驾驶、机器人和基于模型的强化学习。
  - 研究共性：从高维视频或交互数据中学习动力学，增加自监督任务，如掩码重建、深度/关键点预测、上下文条件或动作扩散，并通过生成、控制或一致性指标评估。
  - 关键差异：表示方式包括潜在状态空间、随机Transformer、扩散Transformer和组合原语；监督信号从纯视频生成到视频-动作联合扩散和上下文条件动力学；评测目标涵盖Atari样本效率、机器人执行和记忆/动作基准。
  - 趋势演进：2023年侧重样本高效的随机Transformer世界模型；2024年出现上下文与组合世界模型用于零样本泛化；2025-2026年扩展到大规模驾驶/机器人视频-动作扩散和专门的一致性评测。
  - 开放问题：跨领域迁移、长时记忆与空间一致性、模型与规划器/任务设计的收益归因，以及更强的方法隔离证据。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion and reconstruction-based video world models
      what_it_solves: Learning scalable high-dimensional dynamics from visual observations
        for long-horizon, multi-view, or physically plausible video generation.
      what_remains_open: Whether auxiliary reconstruction and physics tasks transfer
        beyond reported driving or robot scenarios, and whether pixel-level realism
        equals dynamics correctness.
    - line: Stochastic latent and context-conditioned model-based RL
      what_it_solves: Sample-efficient policy learning and zero-shot dynamics generalization
        through latent state-space or Transformer-VAE world models.
      what_remains_open: Observable context assumptions and narrow benchmark coverage;
        gains may depend on task parameterization and policy training protocol.
    - line: Compositional and action-coupled world models for robotics
      what_it_solves: Connecting language/action interfaces to video generation, enabling
        unseen task combinations, multitask pretraining, and flexible policy or dynamics
        representations.
      what_remains_open: Generalization to entirely new primitives or action spaces,
        real-robot validation, and separation of action-interface effects from model
        quality.
    - line: World-model capability benchmarking
      what_it_solves: Measuring memory consistency, spatial consistency, and action
        control in closed-loop or loop-based navigation settings.
      what_remains_open: Current benchmarks reveal long-term memory and cross-action
        gaps, but some protocols lack broad experimental results and metrics may not
        isolate method contribution from dataset or baseline tuning.
    consensus:
    - Recent work converges on generative sequence models to learn video and action
      dynamics, often combining diffusion or transformer backbones with auxiliary
      tasks.
    - Auxiliary objectives such as mask reconstruction, depth or keypoint prediction,
      context conditioning, and action prediction are used to improve realism, consistency,
      or controllability.
    - Evaluation is expanding from static generation quality toward closed-loop control,
      memory consistency, spatial consistency, and action-conditioned generation.
    - Reported evidence often remains limited to specific task families, so cross-domain
      transfer and method isolation are not yet established.
    disagreements:
    - 'Representation differs: latent state-space models, stochastic transformer-VAE
      models, diffusion transformers, and compositional primitives.'
    - 'Supervision differs: pure video generation, joint video-action diffusion, context-conditioned
      model-based RL, or physics-informed auxiliary training.'
    - 'Evaluation target differs: Atari sample efficiency, driving video quality,
      robot policy execution, or benchmark consistency.'
    - 'Interaction mode differs: action-free video prediction, action-conditioned
      generation, closed-loop action control, or learning from action-free data for
      downstream policies.'
    open_questions:
    - Which auxiliary objectives or representations transfer across driving, robotics,
      embodied navigation, and game environments?
    - How much of policy or planning gain comes from the world model rather than the
      planner, controller, or task prior?
    - Can current models maintain long-term memory consistency and generalize across
      unseen action spaces without task-specific assumptions?
    - What benchmarks and ablation protocols are needed to isolate method contribution
      from dataset scale, baseline tuning, and implementation choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散与重建式视频世界模型
      解决的问题: 从视觉观测中学习可扩展的高维动力学，用于长时域、多视角或物理合理的视频生成。
      尚未覆盖: 辅助重建和物理任务是否能迁移到已报告的驾驶或机器人场景之外，以及像素级真实感是否等同于动力学正确性。
    - 路线: 随机潜在与上下文条件模型强化学习
      解决的问题: 通过潜在状态空间或Transformer-VAE世界模型实现样本高效策略学习和零样本动力学泛化。
      尚未覆盖: 上下文可观测假设和较窄的基准覆盖；收益可能依赖任务参数化和策略训练协议。
    - 路线: 组合式与动作耦合机器人世界模型
      解决的问题: 将语言/动作接口与视频生成连接，支持未见任务组合、多任务预训练和灵活的策略或动力学表示。
      尚未覆盖: 对全新原语或动作空间的泛化、真实机器人验证，以及动作接口效果与模型质量的分离。
    - 路线: 世界模型能力基准
      解决的问题: 在闭环或循环导航设置中衡量记忆一致性、空间一致性和动作控制能力。
      尚未覆盖: 当前基准揭示了长期记忆和跨动作差距，但部分协议缺乏广泛实验结果，指标可能无法隔离方法贡献与数据集或基线调优。
    共识:
    - 近期工作共同倾向于使用生成式序列模型学习视频和动作动力学，并常将扩散或Transformer骨干与辅助任务结合。
    - 掩码重建、深度或关键点预测、上下文条件和动作预测等辅助目标被用于提升真实感、一致性或可控性。
    - 评测正从静态生成质量扩展到闭环控制、记忆一致性、空间一致性和动作条件生成。
    - 已有证据通常仍限于特定任务族，因此跨领域迁移和方法隔离尚未得到确认。
    分歧:
    - 表示方式不同：潜在状态空间模型、随机Transformer-VAE模型、扩散Transformer和组合原语。
    - 监督信号不同：纯视频生成、视频-动作联合扩散、上下文条件基于模型的强化学习，或物理先验辅助训练。
    - 评测目标不同：Atari样本效率、驾驶视频质量、机器人策略执行或基准一致性。
    - 交互模式不同：无动作视频预测、动作条件生成、闭环动作控制，或从无动作数据中学习下游策略。
    开放问题:
    - 哪些辅助目标或表示能够跨驾驶、机器人、具身导航和游戏环境迁移？
    - 策略或规划增益中有多少来自世界模型本身，而不是规划器、控制器或任务先验？
    - 当前模型能否在不依赖任务特定假设的情况下维持长期记忆一致性并跨动作空间泛化？
    - 需要哪些基准和消融协议来隔离方法贡献与数据规模、基线调优和实现选择？
