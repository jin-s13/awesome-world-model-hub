  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video diffusion models as world
    models for embodied control, focusing on visual prediction for policy learning,
    planning, and simulation.'
  - 'Shared research pattern: Using transformer-based diffusion architectures, conditioning
    on robot actions, and evaluating through video quality plus task-specific metrics;
    a growing emphasis on physical plausibility and task alignment.'
  - 'Key differences: Action injection mechanisms (independent timesteps, frame-level
    modules, learned masks, parallel context blocks), alignment strategies (human-preference
    rewards, DPO), and reliance on pretrained video models versus training from scratch.'
  - 'Trend evolution: Rapid growth from 2024–2026, with models scaling up to 14B parameters
    and a shift from pure visual fidelity toward functional benchmarks and physical
    consistency; theoretical taxonomies are emerging but remain disconnected from
    empirical design.'
  - 'Open questions: Are formal definitions and assumptions satisfied by current world
