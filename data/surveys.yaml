  related_work_outline:
  - 'Mainstream direction: World-model evaluation is coalescing on closed-loop, action-conditioned
    benchmarks that probe spatial, memory, and control consistency rather than only
    aggregate task scores; examples include MIND and LoopNav.'
  - 'Shared research pattern: Recent work pairs diffusion/Transformer/VAE generative
    world models with auxiliary signals such as mask reconstruction, depth and keypoint
    physics, or coupled action-video diffusion, then validates on game, driving, robotic,
    or navigation suites.'
  - 'Key differences: Some contributions build new datasets and consistency metrics,
    while others contribute model architectures and report scores on existing benchmarks.
    Domains and evaluation targets range from Atari policy performance to embodied
    visual plausibility.'
  - 'Trend evolution: Within this frontier, evaluation moves from Atari 100k model-based
    RL results toward open-domain video benchmarks and physics-informed or multimodal
    robotic/driving world models, though evidence years are sparse and skewed toward
    2024-2026.'
  - 'Open questions: Whether consistency metrics align with downstream decision utility,
    whether cross-domain conclusions transfer, and whether missing limitation or reproducibility
    evidence undermines comparability remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正转向闭环、动作条件的基准，重点检验空间、记忆和控制一致性，而不仅是总分；例如MIND与LoopNav。
  - 研究共性：近期工作将扩散/Transformer/VAE生成式世界模型与掩码重建、深度/关键点物理、动作-视频扩散等辅助信号结合，并在游戏、驾驶、机器人或导航任务上验证。
  - 关键差异：部分工作提出新的数据集或一致性指标；另一些工作贡献模型架构并在既有基准上报告分数。评测目标和领域从Atari策略性能到具身视觉合理性不等。
  - 趋势演进：当前前沿从Atari 100k基于模型的强化学习结果，走向开放域视频基准以及物理信息或多模态机器人/驾驶世界模型；证据年份较窄且偏2024-2026。
  - 开放问题：一致性指标是否与下游决策效用对齐、跨领域结论是否可迁移、缺失局限性或复现证据是否削弱可比性，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: World-model benchmark task and dataset construction
      what_it_solves: Creates shared navigation and video tasks and datasets that
        make world-model consistency and controllability claims comparable across
        models.
      what_remains_open: Whether the covered navigation and video distributions reflect
        the deployment settings where world models are expected to help.
    - line: Metric and stress-test design for consistency and control
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        zero-shot dynamics, and visual details beyond aggregate scores.
      what_remains_open: Alignment between proxy metrics and downstream decisions,
        and whether scores remain stable across scenes, action spaces, and baselines.
    - line: Generative world-model architectures evaluated on shared benchmarks
      what_it_solves: Provides diffusion, Transformer, VAE, or physics-informed world
        models for sample-efficient policy learning, long-horizon video prediction,
        and embodied control.
      what_remains_open: Cross-benchmark transfer and reproducibility remain underreported;
        several papers lack visible limitations or comparable citation and compute
        evidence.
    consensus:
    - Generative world models are increasingly evaluated through action-conditioned
      generation and closed-loop tasks instead of static reconstruction or open-loop
      scores alone.
    - The evidence shows a shared shift toward fine-grained diagnostics of consistency,
      controllability, and generalization across video, navigation, game, driving,
      and robotic scenarios.
    - Public datasets, baselines, and open-source artifacts are treated as important
      for making world-model claims verifiable.
    disagreements:
    - 'Evaluation target differs: policy performance from imagined rollouts versus
      spatial or memory consistency of generated video versus physical plausibility
      of embodied video.'
    - 'Supervision and architecture differ: MAE-style mask reconstruction, physics-informed
      depth and keypoint learning, and coupled action-video diffusion encode different
      inductive biases.'
    - Deployment settings differ across Atari, Minecraft, driving, and robotics, and
      current metrics are not shown to transfer across these domains.
    open_questions:
    - How well do spatial consistency and memory/action-control scores predict downstream
      policy utility or real-world deployment robustness?
    - Do improvements observed on a single suite such as Atari 100k, CARL, or a video
      consistency benchmark transfer across domains, action spaces, and dataset scales?
    - What reporting standards and baselines are needed when limitations, compute
      budgets, and reproducibility evidence are missing or uneven?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集构建
      解决的问题: 构建共享导航和视频任务与数据集，使世界模型一致性和可控性在不同模型间可比。
      尚未覆盖: 所覆盖的导航和视频分布是否反映世界模型预期发挥作用的部署环境仍不明确。
    - 路线: 一致性与控制导向的指标和压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、零样本动力学和视觉细节。
      尚未覆盖: 代理指标与下游决策之间的对齐，以及分数跨场景、动作空间和基线是否稳定。
    - 路线: 在共享基准上评测的生成式世界模型架构
      解决的问题: 提供扩散、Transformer、VAE或物理信息驱动的世界模型，用于样本高效策略学习、长时域视频预测和具身控制。
      尚未覆盖: 跨基准迁移与可复现性证据不足；多篇论文未提供可见局限性或可比较的引文与算力信息。
    共识:
    - 生成式世界模型越来越多通过动作条件生成和闭环任务进行评测，而不是仅靠静态重建或开环分数。
    - 证据显示研究共同转向对一致性、可控性和泛化性的细粒度诊断，覆盖视频、导航、游戏、驾驶和机器人场景。
    - 公共数据集、基线和开源工件被视为让世界模型主张可验证的重要条件。
    分歧:
    - 评测目标不同：有的关注想象轨迹上的策略性能，有的关注生成视频的空间或记忆一致性，有的关注具身视频的物理合理性。
    - 监督信号与架构不同：MAE式掩码重建、物理信息深度和关键点学习以及动作-视频扩散的耦合方式带来不同归纳偏置。
    - 部署场景不同：Atari、Minecraft、驾驶和机器人的设置差异明显，当前指标尚未证明可跨领域迁移。
    开放问题:
    - 空间一致性、记忆一致性和动作控制分数在多大程度上可预测下游策略效用或实际部署鲁棒性？
    - 在Atari 100k、CARL或视频一致性基准等单一场景上的改进，是否跨领域、动作空间和数据规模迁移？
    - 当局限性、算力预算和可复现证据缺失或不均时，需要何种报告规范和基线才能保证可比性？
