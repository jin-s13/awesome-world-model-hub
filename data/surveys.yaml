  related_work_outline:
  - 'Mainstream direction: Adapting world models to domain-specific applications—autonomous
    driving, robotics, and interactive games—using diffusion, Transformer, or recurrent
    architectures to generate future states or videos for policy learning and evaluation.'
  - 'Shared research pattern: Most works frame world models as generative video predictors
    conditioned on actions or language, trained on large-scale domain datasets, and
    evaluated on visual fidelity, task success, or generalization to unseen conditions.'
  - 'Key differences: Representations differ in whether they couple or separate video,
    action, and physics; supervision ranges from pure video prediction to joint action-video
    pretraining; evaluation settings vary from closed-loop simulators to open-domain
    benchmarks, but few include real-world deployment.'
  - 'Trend evolution: The focus has shifted from small-scale game environments (Atari)
    to large-scale, multimodal robotic and driving datasets (2023–2026), with growing
    emphasis on explicit physical consistency, memory, and compositional generalization.'
  - 'Open questions: Whether simulation gains transfer to real-world safety; how to
    maintain long-horizon memory and spatial consistency; how to unify video, action,
    and physical knowledge without brittle assumptions; and how to design benchmarks
    that probe generalization beyond training priors.'
  related_work_outline_zh:
  - 主流方向：将世界模型适配到自动驾驶、机器人、交互式游戏等具体领域，利用扩散、Transformer或循环架构生成未来状态或视频，用于策略学习与评估。
  - 研究共性：多数工作将世界模型视为以动作或语言为条件的生成式视频预测器，在大规模领域数据集上训练，并以视觉保真度、任务成功率或对未见条件的泛化能力作为评估指标。
  - 关键差异：表示方式上，有的耦合视频与动作，有的分离；监督信号从纯视频预测到联合动作-视频预训练不等；评估场景涵盖闭环仿真器到开放域基准，但真实世界部署验证普遍缺失。
  - 趋势演进：重心从小规模游戏环境（Atari）转向大规模、多模态的机器人与驾驶数据集（2023–2026），越来越强调显式的物理一致性、记忆保持和组合泛化。
  - 开放问题：仿真收益能否迁移到真实世界安全中；如何维持长时域记忆与空间一致性；如何在不依赖脆弱假设的前提下统一视频、动作与物理知识；如何设计能探测训练先验之外泛化能力的基准。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based driving world models
      what_it_solves: Long-horizon, multi-view future scene prediction and closed-loop
        simulation for autonomous driving.
      what_remains_open: Transfer to real-world safety and operational outcomes; generalization
        across geographically diverse driving datasets remains unverified.
    - line: Contextual world models for zero-shot policy generalization
      what_it_solves: Adapting Dreamer-style world models to varying dynamics by conditioning
        on observable context, improving zero-shot policy performance.
      what_remains_open: Assumes context observability; evaluated on only two tasks
        from a single benchmark suite, leaving full unknown-dynamics generalization
        untested.
    - line: Efficient stochastic world models for limited-interaction RL
      what_it_solves: Fast and sample-efficient policy learning from pixels on Atari
        benchmarks using Transformer-VAE hybrids.
      what_remains_open: Only validated on Atari 100K; unclear whether the efficiency
        transfers to continuous control, physical robots, or open-ended environments.
    - line: Compositional world models for robot imagination
      what_it_solves: Generating video plans for unseen object-action combinations
        by factorizing language-conditioned video generation into reusable primitives.
      what_remains_open: Limited to known primitive combinations; relies on accurate
        language parsing; only evaluated in simulation, not on physical robots.
    - line: Physics-informed embodied world models
      what_it_solves: Jointly learning RGB video generation and implicit physical
        properties (depth, keypoint dynamics) for more realistic robotic video synthesis.
      what_remains_open: Physical properties are only implicit; no explicit physical
        reasoning or real-world physics validation; downstream policy evaluation is
        limited to sim-to-sim.
    - line: Unified video-action diffusion world models
      what_it_solves: Pretraining on large multi-task robot datasets by coupling video
        and action diffusion in a single Transformer, enabling flexible policy and
        dynamics representations.
      what_remains_open: Open-domain generalization to entirely novel robots or environments
        is not demonstrated; scaling to truly action-free, in-the-wild data remains
        unexplored.
    - line: Memory and spatial consistency benchmarks
      what_it_solves: Providing structured datasets (LoopNav, MIND) and metrics to
        evaluate long-term memory and spatial consistency of world models in interactive
        environments.
      what_remains_open: Current models struggle with maintaining consistency over
        long loops and across disparate action spaces; the benchmarks themselves are
        limited to synthetic or game environments.
    consensus:
    - World models are converging on generative architectures (diffusion, Transformers)
      that predict future observations as videos, conditioned on actions or language.
    - Large-scale, domain-specific datasets are seen as essential for training, but
      evaluation is still predominantly in simulation or on curated video clips.
    - Improving generalization beyond training conditions is a shared goal, whether
      through compositional primitives, context conditioning, or multi-task pretraining.
    disagreements:
    - Some works train only on video prediction, while others jointly model action
      and video, leading to different assumptions about the availability of action
      labels.
    - Physical plausibility is handled either implicitly through auxiliary losses
      (depth, keypoints) or not at all, with no consensus on how to measure or enforce
      it.
    - 'Evaluation protocols vary widely: some use closed-loop policy success in games,
      others use video similarity metrics, and new benchmarks propose scene-graph
      or memory-consistency scores, making direct comparison difficult.'
    open_questions:
    - Can world models trained purely in simulation be deployed for real-world decision-making
      without catastrophic failures in safety-critical domains?
    - How can long-horizon memory and spatial consistency be maintained without access
      to oracle state information, especially in open-world environments?
    - What is the minimal set of supervision signals (video, action, physics) needed
      to build a world model that generalizes across embodiments and tasks?
