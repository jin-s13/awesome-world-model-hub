  related_work_outline:
  - 'Mainstream direction: Action-conditioned video generation is being formalized
    as a world-model question, with diffusion and autoregressive models used to predict
    future observations from actions for embodied control and spatial reasoning.'
  - 'Shared research pattern: Work separates state construction from dynamics modeling;
    most methods couple observations and actions in a unified model, then evaluate
    generated rollouts through visual quality, policy value, or downstream benchmark
    performance.'
  - 'Key differences: The main splits are representation coupling, supervision signal,
    and evaluation target—unified diffusion versus adapter-based reuse versus masked
    autoregression, and reward alignment versus action-labeled generation versus test-time
    verification.'
  - 'Trend evolution: The visible frontier runs from 2024 action-conditioned video
    generation toward 2026 physics-aligned and functionally benchmarked world models,
    moving from visual plausibility to persistence, causality, and zero-shot embodied
    evaluation.'
  - 'Open questions: It remains unclear whether formal taxonomies and alignment signals
    predict long-horizon physical consistency or downstream policy success; several
    generalization and artifact gaps are unverified in the bounded evidence.'
  related_work_outline_zh:
  - 主流方向：动作条件视频生成被形式化为世界模型问题，扩散与自回归模型根据动作预测未来观测，用于具身控制和空间推理。
  - 研究共性：研究通常把状态构建与动态建模分开；多数方法在统一模型中耦合观测与动作，并通过视觉质量、策略价值或下游基准评估生成轨迹。
  - 关键差异：主要分歧在表示耦合、监督信号和评测目标——统一扩散、适配预训练骨干、掩码自回归共存；奖励对齐、动作标注生成与测试时验证被分别强调。
  - 趋势演进：可见前沿从2024年的动作条件视频生成走向2026年物理对齐和功能基准评估，重心由视觉合理性转向持久性、因果性和零样本具身评测。
  - 开放问题：形式化分类和对齐信号能否预测长程物理一致性或下游策略成功仍不清楚；多项泛化与工件缺口在现有证据中未验证。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent and under which
        assumptions claims about state and dynamics hold
      what_remains_open: Whether these formal conditions match realistic action-conditioned
        model behavior remains unverified; current video-based models are described
        as stateless or lacking explicit state construction
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size, test-time compute, or alignment objectives
        to expected improvements in world-model behavior
      what_remains_open: Direct predictive laws for failure and cross-task transfer
        are missing; test-time scaling shows inconsistent gains across benchmark types,
        suggesting an information bottleneck
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into categories such
        as implicit/explicit state construction and knowledge-integration versus architectural-reformulation
        dynamics
      what_remains_open: Whether this taxonomy changes evaluation or design is unknown;
        current metrics still emphasize visual fidelity rather than physical persistence
        and causal reasoning
    consensus:
    - World-model research is converging on a separation between state representation
      and dynamics prediction, even when the implementation is a single generative
      video model.
    - Action-conditioned generation is treated as a core mechanism for making video-based
      models useful for decision-making, policy evaluation, and planning.
    - Evaluation should move beyond visual fidelity toward functional evidence such
      as physical plausibility, action alignment, and downstream task performance.
    disagreements:
    - 'Modality coupling differs across lines: unified video-action diffusion, action-conditioning
      adapters over pretrained video backbones, and heterogeneous masked autoregression
      each make different representation choices.'
    - 'Supervision and alignment signals differ: some methods rely on action-labeled
      video and dynamics prediction, while others use human preference reward models,
      DPO-style post-training, or frame-anchored verifier rewards.'
    - 'Evaluation targets differ: visual quality and controllability, policy-value
      correlation with simulator results, physical plausibility on zero-shot benchmarks,
      and test-time spatial reasoning scaling are each foregrounded by different work.'
    open_questions:
    - Do formal state-and-dynamics taxonomies predict long-horizon persistence or
      causal consistency in action-conditioned video models?
    - Does test-time reward scaling only improve narrow spatial reasoning tasks because
      current world models form an information bottleneck?
    - Can human-preference reward alignment transfer beyond contact-rich manipulation
      settings evaluated in the available evidence?
    - Are zero-shot physical-plausibility benchmarks strongly connected to downstream
      policy success, or do they measure a separate model property?
    - Which missing artifacts, datasets, and limitation reports create verification
      gaps for the claimed generalization?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么，以及有关状态与动态的主张在哪些假设下成立
      尚未覆盖: 这些形式化条件是否匹配真实动作条件生成中的模型行为仍缺少验证；现有视频模型常被指出缺乏显式状态构建
    - 路线: 缩放规律与保证
      解决的问题: 连接模型规模、测试时计算或对齐目标与世界模型行为的预期改进
      尚未覆盖: 缺少可预测失败与跨任务迁移的规律；测试时缩放在不同基准上收益不一致，提示信息瓶颈
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为隐式/显式状态构建、知识整合与架构重构动态等类别和问题边界
      尚未覆盖: 分类是否改变研究者的评测与模型设计仍不清楚；现有指标仍偏向视觉保真度，而非物理持久性与因果推理
    共识:
    - 世界模型研究正在汇聚到状态表示与动态预测的分离上，即使实现形式是单个生成式视频模型。
    - 动作条件生成被视为让视频模型服务于决策、策略评估和规划的核心机制。
    - 评测应从视觉保真度转向物理合理性、动作对齐和下游任务表现等功能证据。
    分歧:
    - 模态耦合方式不同：统一视频-动作扩散、在预训练视频骨干上加入动作条件适配器、异构掩码自回归分别代表不同的表示选择。
    - 监督与对齐信号不同：部分方法依赖动作标注视频和动力学预测，另一些使用人类偏好奖励模型、DPO式后训练或帧锚定验证器奖励。
    - 评测目标不同：视觉质量与可控性、策略价值与模拟器结果的相关性、零样本物理合理性基准、测试时空间推理缩放被不同工作分别强调。
    开放问题:
    - 形式化的状态与动态分类能否预测动作条件视频模型的长程持久性和因果一致性？
    - 测试时奖励缩放是否只改善较窄的空间推理任务，因为当前世界模型构成了信息瓶颈？
    - 基于人类偏好的奖励对齐能否推广到现有证据中接触丰富操作以外的领域？
    - 零样本物理合理性基准与下游策略成功率之间是否存在强关联，还是在测量不同属性？
    - 缺失的工件、数据集和局限性报告在多大程度上构成声称泛化能力的验证缺口？
