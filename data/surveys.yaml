  related_work_outline:
  - 'Mainstream direction: Building self-contained world-model simulators and evaluation
    frameworks for autonomous driving, robotics, and interactive environments, with
    emphasis on action-conditioned video generation, closed-loop control, and reproducible
    benchmarks.'
  - 'Shared research pattern: Systems integrate dataset preparation, model training,
    action-controllable inference, and quantitative evaluation into a single runnable
    pipeline; most provide open-source code and datasets to enable reuse.'
  - 'Key differences: Architecture choices diverge between diffusion-based and recurrent
    state-space simulators; evaluation targets vary from visual fidelity and action
    fidelity to spatial consistency and zero-shot generalization; deployment settings
    span offline benchmarking, real-time closed-loop simulation, and lightweight plug-in
    modules.'
  - 'Trend evolution: From 2024–2026, the focus shifts from standalone benchmarks
    toward fully closed-loop, frame-level autoregressive simulators and from task-specific
    models toward universal action-conditioned modules that retrofit pre-trained video
    generators, with increasing attention to real-time latency and interactive memory.'
  - 'Open questions: How well these simulators generalize across domains, sensor configurations,
    and hardware; whether the trade-offs between realism, controllability, and latency
    can be formalized; and the extent to which independent cross-team reproduction
    validates claimed performance.'
  related_work_outline_zh:
  - 主流方向：构建面向自动驾驶、机器人和交互环境的自包含世界模型模拟器与评测框架，重点在于动作条件视频生成、闭环控制以及可复现基准。
  - 研究共性：系统将数据集准备、模型训练、动作可控推理与定量评估集成为单一可运行流水线；多数工作公开代码和数据集以支持复用。
  - 关键差异：架构选择在扩散模型和循环状态空间模型之间分化；评测目标涵盖视觉保真度、动作保真度、空间一致性以及零样本泛化；部署场景包括离线基准测试、实时闭环仿真和轻量级插件模块。
  - 趋势演进：2024–2026 年，焦点从独立基准转向完全闭环的帧级自回归模拟器，并从任务专用模型转向可改造预训练视频生成器的通用动作条件模块，实时延迟和交互记忆受到更多关注。
  - 开放问题：这些模拟器在领域、传感器配置和硬件上的泛化能力如何；保真度、可控性与延迟之间的权衡能否被形式化；跨团队独立复现能在多大程度上验证所声称的性能。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end runnable simulation pipelines
      what_it_solves: Transforms world models into executable workflows that bundle
        dataset, training, action-conditioned generation, and benchmarking, enabling
        reproducible evaluation of dynamic visual consistency and action fidelity
        in domains like driving and robotics.
      what_remains_open: Robustness to diverse deployment environments, hardware,
        and sensor setups is not tested; most pipelines are validated on a single
        dataset (e.g., nuScenes) and lack stress tests under real-world distribution
        shifts.
    - line: Real-time and interactive closed-loop systems
      what_it_solves: Addresses the latency and controllability requirements for interactive
        simulators, using lightweight action-conditioned modules, frame-level autoregression,
        and prioritized imagination to achieve sub-second generation and maintain
        long-horizon coherence.
      what_remains_open: The tension between generation speed, visual fidelity, and
        physical plausibility is not quantified; long-term memory across extended
        interactive sessions remains fragile, and the interactive capacity of plug-in
        modules on highly specialized domains is unproven.
    - line: Reproducible engineering and benchmark artifacts
      what_it_solves: Provides open-source code, datasets, and standardized metrics
        (e.g., FID, FVD, SGCS, action fidelity) to make world-model systems inspectable
        and comparable, reducing the barrier for reusing and extending simulation
        pipelines.
      what_remains_open: Independent reproduction across teams, compute environments,
        and alternative datasets is missing; metric choices are not consistently aligned
        with downstream task performance, and many artifacts lack explicit limitation
        reporting.
    consensus:
    - Action-controllable video generation is a core requirement for usable world-model
      simulators, and current systems address it through dedicated conditioning mechanisms,
      specialized losses, or structured control modules.
    - Open-source release of datasets, evaluation benchmarks, and training code is
      recognized as essential for advancing the field, yet the evidence shows that
      independent reproduction and cross-system generalizability remain underexplored.
    - Dynamic visual consistency and motion modeling are prioritized over static visual
      details, as the primary goal of these systems is simulating plausible futures
      rather than rendering photorealistic frames.
    disagreements:
    - 'Architecture: some systems adopt diffusion transformers with multi-view structured
      control, while others rely on recurrent state-space models (Dreamer variants),
      leading to different trade-offs in generation quality, rollout stability, and
      training efficiency.'
    - 'Evaluation targets: some works emphasize action fidelity (how well generated
      frames follow a given trajectory), others focus on spatial consistency (loop
      closure in navigation), zero-shot generalization to unseen dynamics, or downstream
      policy performance, creating a fragmented evaluation landscape with no unified
      protocol.'
    - 'Interaction mode: systems range from open-loop conditional generation (given
      a fixed action sequence) to fully closed-loop autoregressive simulation where
      the next action depends on the current generated state, with varying assumptions
      about real-time interactivity and the availability of ground-truth actions.'
    open_questions:
    - Can the current action-conditioned world models maintain spatial and temporal
      consistency when deployed in real-time, long-horizon interactive settings beyond
      the curated datasets they were trained on?
    - How should the field balance lightweight, plug-and-play action modules against
      the need for deep physical reasoning, and what metrics would adequately capture
      this trade-off?
    - What is the minimal set of evaluation dimensions (visual fidelity, action fidelity,
      physical plausibility, sample efficiency, latency) that reliably predicts downstream
      utility in policy training and closed-loop planning, and how can independent
      reproduction be incentivized?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端可运行仿真流水线
      解决的问题: 将世界模型转化为可执行的工作流，封装数据集、训练、动作条件生成和基准测试，使驾驶和机器人等领域的动态视觉一致性与动作保真度可复现地评估。
      尚未覆盖: 对多样化部署环境、硬件和传感器配置的鲁棒性未经验证；多数流水线仅在单一数据集（如 nuScenes）上验证，缺少真实分布偏移下的压力测试。
    - 路线: 实时与交互式闭环系统
      解决的问题: 满足交互式模拟器的延迟和可控性需求，通过轻量级动作条件模块、帧级自回归和优先想象实现亚秒级生成并维持长时域一致性。
      尚未覆盖: 生成速度、视觉保真度与物理合理性之间的张力未被量化；扩展交互会话中的长期记忆仍脆弱，插件模块在高度专业化领域中的交互能力未经验证。
    - 路线: 可复现工程与基准工件
      解决的问题: 提供开源代码、数据集和标准化指标（如 FID、FVD、SGCS、动作保真度），使世界模型系统可检查、可比较，降低复用和扩展仿真流水线的门槛。
      尚未覆盖: 跨团队、计算环境和替代数据集的独立复现缺失；指标选择与下游任务性能并非始终一致，且许多工件缺乏显式的局限性报告。
    共识:
    - 动作可控视频生成是可用世界模型模拟器的核心要求，当前系统通过专用条件机制、特殊损失函数或结构化控制模块来实现。
    - 开源发布数据集、评估基准和训练代码被认为是推动领域发展的关键，但证据显示独立复现和跨系统泛化性仍探索不足。
    - 动态视觉一致性和运动建模被优先于静态视觉细节，因为这些系统的主要目标是模拟合理的未来，而非渲染逼真的帧。
    分歧:
    - 架构：部分系统采用带多视图结构化控制的扩散变换器，另一些依赖循环状态空间模型（Dreamer 变体），导致生成质量、推演稳定性和训练效率方面的不同权衡。
    - 评测目标：部分工作强调动作保真度（生成帧遵循给定轨迹的程度），其他关注空间一致性（导航中的闭环）、对未见动态的零样本泛化或下游策略性能，形成碎片化的评测格局，缺乏统一协议。
    - 交互模式：系统范围从开环条件生成（给定固定动作序列）到完全闭环自回归模拟（下一步动作取决于当前生成状态），对实时交互性和真实动作标签可用性的假设各不相同。
    开放问题:
    - 当前动作条件世界模型在部署到超出训练数据集的实时、长时域交互环境时，能否维持时空一致性？
    - 领域应如何平衡轻量级即插即用动作模块与深度物理推理的需求，何种指标能充分捕捉这一权衡？
    - 能够可靠预测下游策略训练和闭环规划效能的最小评估维度集合（视觉保真度、动作保真度、物理合理性、样本效率、延迟）是什么，如何激励独立复现？
