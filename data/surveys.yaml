  related_work_outline:
  - 'Mainstream direction: Recent work centers on video-centric world models, especially
    diffusion transformers conditioned on actions or task context for driving and
    robotics. Representative examples include MaskGWM, RoboDreamer, RoboScape, and
    Unified World Models.'
  - 'Shared research pattern: Methods couple generative video prediction with auxiliary
    tasks—mask reconstruction, depth/keypoint dynamics, action diffusion, or language-primitive
    decomposition—to improve physical consistency, generalization, or controllability.'
  - 'Key differences: Some emphasize scalable diffusion backbones with masked feature
    learning; others modify latent recurrent state-space models for sample-efficient
    RL; others factorize generation into compositional primitives or benchmark memory/action
    control. Supervision, action interface, and evaluation domain differ.'
  - 'Trend evolution: Within the 2023–2026 window, the frontier moves from Atari/latent
    world models toward large driving and robot video pretraining, physics-informed
    objectives, and specialized consistency/controllability benchmarks. This is a
    current-frontier trend, not a mature historical progression.'
  - 'Open questions: How architectural choices transfer across domains; whether gains
    come from the model versus planner/controller or dataset; how to evaluate long-term
    spatial and memory consistency without narrow scenes; and whether context or primitive
    assumptions hold in real deployment remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：近期工作以视频为中心的世界模型为主，特别是面向驾驶与机器人的动作或任务条件扩散Transformer，如MaskGWM、RoboDreamer、RoboScape、Unified
    World Models等。
  - 研究共性：方法常把生成视频预测与掩码重建、深度/关键点动力学、动作扩散或语言原语分解等辅助任务结合，以提升物理一致性、泛化或可控性。
  - 关键差异：有的强调可扩展扩散骨干与掩码特征学习，有的修改潜在循环状态空间模型以提升样本效率，有的做组合式生成或记忆/控制基准；监督信号、动作接口和评测域不同。
  - 趋势演进：在2023–2026年窗口内，前沿从Atari/潜在世界模型转向大规模驾驶与机器人视频预训练、物理信息目标和专门的一致性/可控性基准；更多是当前前沿趋势。
  - 开放问题：架构选择能否跨域迁移，收益来自模型还是规划器/控制器或数据，长时空间与记忆一致性如何在不狭隘场景下评测，上下文或原语假设在真实部署是否成立，仍需证据。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based generative world modeling with auxiliary reconstruction
        or physics tasks
      what_it_solves: Scalable long-horizon and multi-view video prediction with improved
        physical, geometric, or temporal consistency.
      what_remains_open: Transfer beyond reported driving and robot video settings,
        and real closed-loop control, remains not fully verified.
    - line: Latent state-space and sequence world models for model-based reinforcement
        learning
      what_it_solves: Sample-efficient policy learning via imagined rollouts and zero-shot
        adaptation to observed context values.
      what_remains_open: Assumes observable context or narrow benchmark tasks; model
        contribution versus planner, controller, or training budget is not isolated.
    - line: Compositional and coupled action-video world modeling for robot tasks
      what_it_solves: Converts language, goal images, or action sequences into video
        plans or unified policy and dynamics representations.
      what_remains_open: Unseen primitive combinations and real-robot deployment beyond
        simulation or offline pretraining corpora have limited evidence.
    - line: Capability benchmarks for spatial consistency, memory, and action control
      what_it_solves: Measures long-term scene consistency and closed-loop action
        response in open-domain video settings.
      what_remains_open: Scene and action-space coverage is limited; consistency scores
        are not yet tied to downstream task success.
    - line: Evaluation and ablation protocols for world-model method claims
      what_it_solves: Separates proposed method contribution from dataset, baseline,
        metric, and implementation or system choices.
      what_remains_open: Several entries show only abstract-level evidence and lack
        full limitation, citation, or artifact verification signals.
    consensus:
    - The field is consolidating around video generation as a central learning objective,
      with conditioning on action, language, or context for control.
    - Auxiliary tasks—mask reconstruction, depth or keypoint dynamics, and action
      diffusion—are commonly added to improve consistency and controllability.
    - Open benchmarks and datasets are emerging alongside methods, especially for
      long-term memory and spatial or action consistency.
    - Generalization beyond training scenes, contexts, or primitive combinations is
      treated as a core challenge, but evidence remains largely simulated or offline.
    disagreements:
    - 'Representation: diffusion video backbones versus latent recurrent state-space
      models versus compositional primitive generators.'
    - 'Supervision: self-supervised reconstruction or physics signals versus explicit
      observable context versus language-parsed primitives versus coupled action diffusion.'
    - 'Evaluation target: long-horizon driving prediction, Atari sample efficiency,
      robot video planning, and open-domain memory/action consistency are optimized
      separately.'
    - 'Deployment setting: simulated policy learning and offline video evaluation
      are common, while real-robot closed-loop evaluation remains sparse.'
    open_questions:
    - Which auxiliary reconstruction or physics objectives transfer across substantially
      different embodiments and scene distributions beyond the reported driving and
      robotics datasets?
    - How much of the reported policy or video-planning success comes from the learned
      world model rather than the planner, controller, data scale, or task prior?
    - Can spatial and memory consistency metrics predict downstream closed-loop task
      performance, and what additional benchmarks are needed for long-horizon action
      control?
    - Which assumptions—observable context, primitive coverage, action-space alignment,
      or simulator fidelity—limit deployment outside current evaluation settings?
    - Where citation or artifact evidence is missing, how should the field treat the
      reproducibility and community-uptake claims of high-scoring entries?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的生成式世界建模，并加入辅助重建或物理任务
      解决的问题: 实现长时域和多视角视频预测，改善物理或几何一致性。
      尚未覆盖: 证据集中在驾驶或机器人视频生成，其他动作空间和真实闭环控制的迁移尚不充分。
    - 路线: 面向模型强化学习的潜在状态空间与序列世界模型
      解决的问题: 通过想象轨迹进行样本高效策略学习，并对可观测上下文进行零样本适应。
      尚未覆盖: 依赖可观测上下文或较窄基准任务；模型与规划器/训练预算的贡献未被充分隔离。
    - 路线: 面向机器人任务的组合式与动作-视频耦合世界模型
      解决的问题: 将语言、目标图像或动作序列转化为视频计划或统一的策略/动力学表示。
      尚未覆盖: 对全新原语和仿真之外的真实机器人部署泛化证据有限。
    - 路线: 世界模型记忆、空间一致性与动作控制能力基准
      解决的问题: 在受控开放域视频中量化长期一致性与闭环动作响应。
      尚未覆盖: 场景和动作空间覆盖有限；尚无一致性分数与下游任务成功的共识性映射。
    - 路线: 世界模型方法声明所需的评估与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和系统实现因素的影响。
      尚未覆盖: 可见摘要级证据不足，部分论文缺少完整局限性与引用/工件验证信号，存在验证缺口。
    共识:
    - 近期世界模型越来越多地把视频生成作为中心学习信号，并以动作、语言或上下文作为控制条件。
    - 常通过掩码重建、深度预测、关键点动力学或动作扩散等辅助任务改善物理一致性和长时稳定性。
    - 标准基准与开放数据集正被纳入方法评估，尤其用于空间/记忆一致性与闭环动作控制。
    - 普遍关注训练场景、上下文或原语组合之外的泛化，但现有证据主要来自仿真或离线视频评估。
    分歧:
    - 表示方式不同：有的采用像素/视频上的扩散Transformer，有的修改潜在循环状态空间模型以进行想象轨迹学习，还有的采用组合式原语生成器。
    - 监督信号不同：一路使用自监督掩码/几何/物理信号，另一路使用显式上下文值或语言原语解析，还有一路耦合动作与视频扩散。
    - 评测目标不同：分别侧重驾驶多视角/长时域预测、Atari样本效率、机器人视频计划，以及开放域记忆/动作一致性。
    - 部署场景不同：仿真策略学习和离线视频基准占主导，真实机器人闭环评估较少。
    开放问题:
    - 辅助重建或物理任务能否跨足不同实施例或场景分布，而不仅限于已报告的驾驶与机器人数据集？
    - 报告的策略或视频计划成功中，多少来自所学世界模型本身，多少来自规划器、控制器、数据规模或任务先验？
    - 空间/记忆一致性指标能否预测下游闭环任务性能，长时动作控制还需要哪些基准？
    - 哪些假设——可观测上下文、原语覆盖、动作空间对齐或仿真保真度——限制了当前评测之外的部署？
    - 当引用或工件证据缺失时，应如何看待高排序论文的可复现性与社区采纳声明？
