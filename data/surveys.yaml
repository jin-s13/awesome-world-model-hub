  literature_review:
    line_of_work_matrix:
    - line: Formal state and dynamics assumptions
      what_it_solves: Clarifies what a world model must represent as state and dynamics
        and under which conditions claims about prediction, planning, or causality
        hold.
      what_remains_open: Whether these formal conditions match the observed behavior
        of empirical video-action models in realistic settings, especially across
        domains.
    - line: Scaling laws and test-time verification
      what_it_solves: Connects model capacity, data, objectives, or test-time compute
        to expected behavior and reveals whether reward signals improve selection
        or reasoning.
      what_remains_open: Direct validation that scaling or verifier rewards predict
        failures and transfers; test-time scaling fails to consistently improve all
        spatial reasoning benchmarks.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model ideas into state construction,
        dynamics modeling, persistence, causality, and evaluation boundaries.
      what_remains_open: Whether these categories change evaluation design or model
        construction beyond a descriptive taxonomy.
    - line: Empirical action-video world-model training and alignment
      what_it_solves: Operationalizes world models as controllable video generators
        for robot manipulation, planning, and policy evaluation by coupling actions
        with visual dynamics.
      what_remains_open: Generalization beyond manipulation, formal guarantees, and
        whether visual realism or learned preference rewards track physically persistent
        and causally correct behavior.
    consensus:
    - Action-conditioned video generation is treated as a practical interface for
      world models in embodied control and spatio-temporal reasoning.
    - Fine-grained action conditioning, physical plausibility alignment, or verifier-based
      selection are used to improve rollouts beyond pixel-level quality.
    - Evaluation often uses downstream policy/planning alignment or benchmark success,
      but formal guarantees and persistent causal understanding remain underevidenced.
    - Several papers report strong empirical gains while limitation details and code/artifact
