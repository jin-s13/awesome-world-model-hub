  literature_review:
    line_of_work_matrix:
    - line: World-model taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented work on video generation, interactive world
        modeling, latent driving models, and robot learning into application, representation,
        or challenge-based roadmaps.
      what_remains_open: Whether the synthesis covers fast-moving work systematically;
        most taxonomies are conceptual and not yet empirically validated.
    - line: Comparative evaluation and benchmark synthesis
      what_it_solves: Compares benchmarks and metrics across robotics, autonomous
        driving, game engines, and open-world exploration; exposes gaps in closed-loop,
        long-horizon, and real-time evaluation.
      what_remains_open: Reported results and metrics are often not directly comparable
        across datasets, simulators, or deployment settings; missing baselines and
        metrics leave verification gaps.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad coverage into next research questions such as
        out-of-sight dynamics, compositional generalization, persistent memory, and
        reproducible open-source simulators.
      what_remains_open: Gap prioritization is not systematically grounded; several
        works do not state limitations, making it unclear which gaps most constrain
        progress.
    - line: Method and benchmark evidence synthesis
      what_it_solves: Ties survey-level claims to concrete systems, datasets, and
        metrics for compositional video plans, physical robot learning, ego-vision
        prediction, and real-time interactive generation.
      what_remains_open: 'Evidence is uneven: some systems are simulation-only, some
        omit limitations or code, and generalization beyond specific platforms or
        seen primitives is unproven.'
    consensus:
    - Recent work treats video generation as a central substrate for building and
      assessing world models.
    - Controllability, long-horizon consistency or memory, and real-time responsiveness
      recur as central challenges.
    - Synthesis efforts organize the field by application scenario, world-state evolution,
      scene modality, latent representation, or structural prior.
    - Benchmark coverage spans robotics, driving, open-world exploration, and game-like
      environments, but no single benchmark is accepted as sufficient.
    disagreements:
    - Conceptual survey and taxonomy contributions differ from method and system contributions
      in whether they provide empirical results, baselines, and metrics.
    - 'Control signals differ: some systems use language instructions and goal images,
      others use ego-motion, depth, and human pose, while robot learning uses camera
      images and sparse rewards.'
    - 'Representation choices differ: compositional primitive-conditioned video generation,
      continuous/discrete/hybrid latent states, and persistent 3D global state with
      dynamic entities.'
    - 'Evaluation target differs: simulated video plan execution, real physical robot
      learning, open-loop generation metrics, closed-loop driving metrics, and real-time
      latency.'
    - 'Deployment setting differs: offline simulation, online real-robot learning,
      open-source interactive simulator, and autonomous driving.'
    open_questions:
    - Can compositional generation handle entirely novel primitive combinations beyond
      those seen during training?
    - Do persistent out-of-sight state methods scale beyond their proposed benchmark
      and improve long-term consistency in real-world tasks?
    - Which metrics best capture physical plausibility, closed-loop utility, and long-horizon
      consistency without conflating visual quality with controllability?
    - Can latent-space taxonomies and evaluation prescriptions be empirically tested
      with open code, datasets, and baselines?
    - How can open-source real-time world models reduce reproducibility barriers without
      sacrificing dynamics accuracy or long-horizon memory?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型分类与路线图综合
      解决的问题: 将视频生成、交互式世界建模、潜在驾驶模型和机器人学习的碎片化工作，整理为按应用、表示或挑战组织的路线图。
      尚未覆盖: 综合是否系统性覆盖快速发展的文献；多数分类仍是概念性的，缺乏实证验证。
    - 路线: 对比评测与基准综合
      解决的问题: 比较机器人、自动驾驶、游戏引擎和开放世界探索中的基准与指标；揭示闭环、长时域和实时评测缺口。
      尚未覆盖: 各数据集、模拟器或部署设置下的结果和指标通常不可直接比较；缺失基线和指标造成验证缺口。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛覆盖转化为具体研究问题，如视线外动态、组合泛化、持久记忆和可复现开源模拟器。
      尚未覆盖: 缺口优先级缺乏系统依据；部分工作未说明局限，难以判断哪些缺口最制约进展。
    - 路线: 方法与基准证据综合
      解决的问题: 将综述级判断与具体系统、数据集和指标连接，覆盖组合视频计划、物理机器人学习、自我视觉预测和实时交互生成。
      尚未覆盖: 证据不均：一些系统仅在仿真中评估，一些省略局限或代码，未见原语外的泛化或跨平台验证。
    共识:
    - 近期工作将视频生成视为构建和评估世界模型的核心载体。
    - 可控性、长时一致性或记忆、实时响应反复出现为核心挑战。
    - 综合工作按应用场景、世界状态演化、场景模态、潜在表示或结构先验组织领域。
    - 基准覆盖机器人、驾驶、开放世界探索和游戏式环境，但没有单一基准被认为足够。
    分歧:
    - 概念性综述与分类工作和提供实证结果、基线及指标的方法/系统工作在证据强度上不同。
    - 控制信号不同：有的使用语言指令和目标图像，有的使用自我运动、深度和人体姿态，机器人学习则使用摄像头图像和稀疏奖励。
    - 表示选择不同：组合原语条件视频生成、连续/离散/混合潜在状态、持久3D全局状态加动态实体。
    - 评测目标不同：仿真视频计划执行、真实物理机器人学习、开环生成指标、闭环驾驶指标和实时延迟。
    - 部署场景不同：离线仿真、在线真实机器人学习、开源交互式模拟器和自动驾驶。
    开放问题:
    - 组合生成能否处理训练中从未见过的全新原语组合？
    - 持久视线外状态方法能否超越所提基准，并在真实世界任务中改善长期一致性？
    - 哪些指标最能同时衡量物理合理性、闭环效用和长时一致性，而不会把视觉质量与可控性混为一谈？
    - 潜在空间分类法和评估建议能否通过开放代码、数据集和基线进行实证检验？
    - 开源实时世界模型如何在降低复现门槛的同时保持动态精度或长时记忆？
