  - 'Shared research pattern: Methods condition dynamics on actions, context, or language,
    then train via auxiliary reconstruction/physics objectives or diffusion losses
    and evaluate on downstream policy, zero-shot, or video quality.'
  - 'Key differences: Representations vary among stochastic latent state-space models,
    diffusion transformers, and factorized primitive-conditioned generators; supervision
    and evaluation targets split across RL benchmarks, robot/driving video, and diagnostic
    consistency benchmarks.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2023-2026: from
    sample-efficient Atari world models to contextual zero-shot generalization, then
    to large-scale embodied/driving generative world models and consistency/action-control
    benchmarks.'
  - 'Open questions: Whether reported gains transfer beyond narrow benchmarks, how
    to isolate model contribution from planner/task priors, and how to achieve long-term
