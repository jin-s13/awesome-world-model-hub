  related_work_outline:
  - 'Mainstream direction: Building action-controllable world simulators by extending
    video generative models into interactive, closed-loop systems for autonomous driving
    and robotics.'
  - 'Shared research pattern: Start from a pre-trained or purpose-built video generator,
    add action-conditioning and control mechanisms, and evaluate on domain-specific
    benchmarks that measure visual fidelity, action consistency, and sometimes downstream
    task performance.'
  - 'Key differences: Domains split between autonomous driving (nuScenes-based) and
    robotics/game environments; control interfaces range from high-level commands
    to low-level trajectories; some works prioritize real-time latency while others
    optimize long-horizon consistency or physical plausibility.'
  - 'Trend evolution: From 2024 onward, the focus shifts from pure video quality to
    action fidelity and interactive controllability, with increasing emphasis on closed-loop
    simulation, system-level efficiency, and benchmark-driven reproducible evaluation.'
  - 'Open questions: How to guarantee spatial-temporal consistency under distribution
    shifts and extremely long rollouts; trade-offs between speed, visual fidelity,
    and control precision in real-time serving; generalization of simulators across
    diverse embodiments and environments; and the lack of standardized, cross-domain
    benchmarks with open code and datasets for independent reproducibility.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型扩展为动作可控的交互式世界模拟器，构建面向自动驾驶和机器人等领域的闭环系统。
  - 研究共性：基于预训练或专用视频生成器，加入动作条件与控制机制，并在特定领域基准上评估视觉保真度、动作一致性，有时也评估下游任务性能。
  - 关键差异：应用领域分化为自动驾驶（基于nuScenes）和机器人/游戏环境；控制接口从高层指令到低层轨迹各不相同；部分工作优先考虑实时延迟，其他则优化长时域一致性或物理合理性。
  - 趋势演进：自2024年起，关注点从单纯视频质量转向动作忠实度和交互可控性，闭环模拟、系统级效率以及基于基准的可复现评估日益受到重视。
  - 开放问题：如何在分布偏移和超长推演下保证时空一致性；实时服务中速度、视觉保真度与控制精度之间的权衡；模拟器在不同具身形态和环境间的泛化；以及缺乏跨领域、代码与数据集开放的标准化基准以支持独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning video generation models into end-to-end, deployable
        world simulators that integrate data processing, training, inference, and
        evaluation for domain-specific tasks such as autonomous driving and robotic
        manipulation.
      what_remains_open: Robustness to external deployment conditions, hardware heterogeneity,
        and user-specific environment variations is rarely tested; most systems are
        validated on a single dataset or simulator.
    - line: Real-time and interactive serving
      what_it_solves: Meeting the latency and interactivity demands of closed-loop
        control by optimizing inference speed and enabling action-conditioned, frame-by-frame
        generation at sub-second rates.
      what_remains_open: The trade-off between speed, visual fidelity, and control
        precision is not systematically studied; long-horizon memory and action-response
        consistency remain fragile under iterative autoregressive rollouts.
    - line: Artifacts and reproducible engineering
      what_it_solves: Providing datasets, benchmarks, and open-source code to make
        world simulators inspectable, comparable, and reusable across research groups.
      what_remains_open: Independent reproduction across teams, compute environments,
        and custom sensor configurations is largely unverified; many leading systems
        lack released code or datasets, and existing benchmarks focus on narrow domains.
    consensus:
    - Action-conditioned video generation is the dominant paradigm for building interactive
      world simulators; control is typically injected via a separate module or latent
      replacement.
    - Visual quality alone is insufficient; action fidelity and dynamic consistency
      are emerging as primary evaluation criteria, often measured through specialized
      metrics like scene graph consistency or trajectory-conditional FID/FVD.
    - Pre-trained large-scale video models serve as effective backbones, reducing
      the need for training from scratch and enabling faster adaptation to new domains.
    - Closed-loop simulation, where the model's output conditions the next control
      input, is recognized as essential for realistic deployment but remains challenging
      due to compounding errors.
    disagreements:
    - 'Control granularity: some works use high-level intentions (e.g., command, goal
      point) while others rely on low-level signals (trajectory, steering angle, speed),
      leading to different assumptions about available input modalities.'
    - 'Evaluation benchmarks: autonomous driving papers primarily use nuScenes and
      task-specific metrics, whereas robotics and game-oriented works employ custom
      environments and prioritize physical plausibility or downstream task success
      over image similarity.'
    - 'Real-time constraints: works like FAR-Drive explicitly optimize for sub-second
      latency on a single GPU, while others accept higher latency in exchange for
      improved long-horizon consistency or multimodal generation.'
    - 'Supervision strategy: some methods fine-tune pre-trained models with motion-reinforced
      losses, while others design domain-specific architectures trained from scratch,
      impacting the balance between generalization and domain fidelity.'
    open_questions:
    - How can world simulators maintain spatial and temporal consistency over extremely
      long sequences without external correction, given that current methods exhibit
      degradation in autoregressive settings?
    - What are the minimal requirements for action representation and conditioning
      to enable simulators that generalize across diverse robots, vehicles, and interactive
      environments?
    - How should the community establish a common benchmark that evaluates both visual
      quality and downstream task performance in a reproducible, cross-domain, and
      code-accessible manner?
    - To what extent do the reported low-latency or high-fidelity results transfer
      to real-world deployment with off-the-shelf sensors and resource-constrained
      hardware?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将视频生成模型转化为端到端、可部署的世界模拟器，集成数据处理、训练、推理与评估，面向自动驾驶与机器人操作等特定任务。
      尚未覆盖: 外部部署条件、硬件异构性及用户特定环境变化下的鲁棒性很少被测试；多数系统仅在单一数据集或模拟器上验证。
    - 路线: 实时与交互式服务
      解决的问题: 通过优化推理速度并实现动作条件的逐帧生成，在亚秒级延迟下满足闭环控制的延迟与交互需求。
      尚未覆盖: 速度、视觉保真度与控制精度之间的权衡缺乏系统研究；长时记忆与动作响应一致性在迭代自回归推演中仍较脆弱。
    - 路线: 工件与可复现工程
      解决的问题: 提供数据集、基准及开源代码，使世界模拟器可检查、可比较且可跨研究组复用。
      尚未覆盖: 跨团队、计算环境及自定义传感器配置的独立复现基本未验证；许多领先系统未公开代码或数据集，现有基准集中在狭窄领域。
    共识:
    - 动作条件视频生成是构建交互式世界模拟器的主流范式；控制通常通过独立模块或潜在替换注入。
    - 仅视觉质量已不足够；动作忠实度与动态一致性正成为主要评估标准，常通过场景图一致性分数或轨迹条件FID/FVD等专用指标衡量。
    - 预训练大规模视频模型作为高效骨干，降低了从零训练的需求，并加速向新领域适配。
    - 闭环模拟（模型输出决定下一步控制输入）被普遍认为是真实部署的基础，但因累积误差而仍具挑战性。
    分歧:
    - 控制粒度：部分工作使用高层意图（如指令、目标点），另一些依赖低层信号（轨迹、转向角、速度），导致对可用输入模态的假设不同。
    - 评估基准：自动驾驶论文主要使用nuScenes及任务特定指标，而机器人与游戏导向的工作采用自定义环境，更重视物理合理性或下游任务成功率，而非图像相似度。
    - 实时约束：FAR-Drive等方法明确优化单GPU亚秒延迟，另一些则接受更高延迟以换取更好的长时域一致性或多模态生成。
    - 监督策略：部分方法用运动增强损失微调预训练模型，另一些设计专用架构从零训练，影响泛化与领域保真度之间的平衡。
    开放问题:
    - 当前方法在自回归设置下存在退化，世界模拟器如何在超长序列中不依赖外部校正而保持时空一致性？
    - 动作表示与条件化有哪些最低要求，才能使模拟器泛化到不同机器人、车辆及交互环境？
    - 社区应如何建立公共基准，以可复现、跨领域且代码可访问的方式同时评估视觉质量与下游任务性能？
    - 所报告的低延迟或高保真结果在多大程度上可迁移到使用现成传感器与资源受限硬件的真实部署场景？
