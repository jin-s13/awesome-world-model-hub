    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于多视角、长时域驾驶场景预测，并在多个驾驶数据集上验证泛化和零样本能力。
      尚未覆盖: 视频预测与仿真收益能否映射到真实驾驶安全或运营结果；对多样化道路环境的假设是否成立。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落到动作会影响未来观测的交互环境中，并评估记忆一致性和动作控制能力。
      尚未覆盖: 跨环境规则、目标和动作空间的泛化；长期记忆一致性；部分基准仅报告构建证据而非完整实验结果。
    共识:
    - 共同模式是用生成式视频或序列模型耦合动作、语言、上下文或物理信号，产生动作条件 rollout，并评价下游控制或预测质量。
    - 新工作越来越强调闭环评测、领域特定泛化、记忆与空间一致性，而不仅是单帧视觉保真度。
    - 多篇工作使用大规模或多样领域数据并开放部分工件，但一些论文未报告局限性或评测套件较窄，构成可复现与负结果缺口。
    分歧:
    - 表示方式：一些方法使用循环状态空间潜在动力学，另一些使用 Transformer 或扩散视频模型或掩码重建。
    - 监督信号：一些依赖可观测上下文、语言原语、深度或关键点动力学，另一些从视频/动作数据中学习而不显式注入这些结构。
    - 评测目标：各自优化零样本上下文强化学习、Atari 人类标准化得分、驾驶多视角/长时域预测、机器人执行或记忆/动作一致性基准。
    - 交互与部署场景：从离线视频生成和仿真 rollout 到闭环动作条件基准不等；真实世界运行验证通常缺失。
    开放问题:
    - 在仿真或数据集上训练的具身和驾驶世界模型能否迁移到真实机器人和安全性关键的驾驶运行中？
    - 模型如何超越已见上下文值、原语组合、动作空间或环境规则进行泛化？
    - 应采用何种指标来操作性衡量长时域开放场景中的记忆一致性、空间一致性和动作控制？
    - 显式注入物理/上下文结构与扩展到大规模异构且缺失标签的数据集之间存在怎样的权衡？
