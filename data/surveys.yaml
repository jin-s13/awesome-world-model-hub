  related_work_outline:
  - 'Mainstream direction: Diffusion Transformer and sequence-based world models for
    high-dimensional prediction and model-based RL, increasingly unified with action,
    language, context, or physics objectives.'
  - 'Shared research pattern: Learn generative dynamics from interaction or video,
    then use the model for rollout, policy training, planning, or evaluation; advance
    either model design or benchmark protocols.'
  - 'Key differences: Representation spans compact latent rollouts to pixel-level
    video; action interfaces, supervision signals, and evaluation targets differ across
    control, driving, robotic, and open-domain settings.'
  - 'Trend evolution: Top evidence spans 2023-2026 only; it moves from latent stochastic
    RL world models toward unified video-action diffusion and physics-informed embodied/driving
    models, with consistency benchmarks emerging later.'
  - 'Open questions: Attribution of gains to model versus planner/data, generalization
    beyond observed contexts or primitives, long-term memory and action consistency,
    and whether new benchmarks isolate method contribution.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer和序列模型的世界模型用于高维预测与基于模型的强化学习，并日益统一动作、语言、上下文或物理目标。
  - 研究共性：从交互或视频中学习生成式动力学，再将模型用于rollout、策略训练、规划或评测；推进模型设计或评测协议。
  - 关键差异：表示从紧凑潜在rollout到像素级视频不等；动作接口、监督信号和评测目标在控制、驾驶、机器人与开放域设定中存在差异。
  - 趋势演进：顶部证据仅覆盖2023-2026年；从潜在随机强化学习世界模型走向统一视频-动作扩散与物理信息具身/驾驶模型，随后出现一致性基准。
  - 开放问题：收益中模型与规划器/数据的归因、对未见上下文或原语的泛化、长期记忆与动作一致性，以及新基准是否隔离了方法贡献。
  literature_review:
    line_of_work_matrix:
    - line: Latent-state stochastic dynamics and sequence modeling for model-based
        control
      what_it_solves: Learning compact world representations and imagined rollouts
        to reduce real interaction or improve policy learning under visual inputs.
      what_remains_open: Transfer outside reported control suites is uncertain; context-sensitive
        variants assume observable context and limited task variation.
    - line: High-dimensional video-generation world models for embodied and driving
        scenes
      what_it_solves: Generating future video conditioned on actions, language, context,
        depth, or keypoints for planning and simulation.
      what_remains_open: Long-horizon physical plausibility, novel primitive/task
        generalization, cross-dataset and real-robot transfer remain only partially
        verified.
    - line: World-model evaluation protocols for memory, spatial consistency, and
        action control
      what_it_solves: Measuring properties not captured by standard task scores, such
        as loop consistency and closed-loop action responsiveness.
      what_remains_open: Benchmarks are new and often do not yet isolate model contributions
        from dataset baselines or surrounding system design.
    consensus:
    - Current methods converge on generative learned dynamics from visual or interaction
      data for prediction, policy training, or planning.
    - There is a shift toward unified architectures that couple multiple modalities
      or side objectives, such as actions, language, context, depth, keypoints, or
      masks.
    - Evaluation increasingly includes open-domain or closed-loop properties beyond
      a single scalar task score, such as memory consistency and spatial consistency.
    - Reported gains often appear on strong baselines or benchmarks, but limitation
      and ablation evidence is uneven.
    disagreements:
    - 'Representation choice differs: compact latent rollouts for sample-efficient
      policy learning versus high-dimensional video generation for scene or task planning.'
    - 'Action interface differs: action-conditioned dynamics and imagined rollouts
      versus joint action-video diffusion versus language-primitive composition.'
    - 'Supervision differs: context-conditioned latent dynamics, MAE-style mask objectives,
      physics-informed depth/keypoint tasks, or action-free video pretraining.'
    - Evaluation target differs across standard control, driving multi-view prediction,
      robotic simulation, and open-domain memory/action-control benchmarks.
    open_questions:
    - How much of reported performance comes from the learned world model rather than
      the choice of planner, policy learner, task prior, or pretraining data?
    - Can context- and primitive-based world models extrapolate to unseen contexts,
      primitives, action spaces, or dataset distributions beyond those evaluated?
    - Do high-dimensional video world models retain long-term memory and spatial consistency
      under repeated closed-loop control?
    - Are new consistency benchmarks sufficient to separate world-model quality from
      dataset, baseline, and implementation effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向模型控制的潜在状态随机动力学与序列建模
      解决的问题: 学习紧凑世界表示和想象 rollout，以减少真实交互或提升视觉输入下的策略学习。
      尚未覆盖: 向已报告控制套件之外迁移不确定；上下文敏感变体假设上下文可观测且任务变化有限。
    - 路线: 面向具身与驾驶场景的高维视频生成世界模型
      解决的问题: 在动作、语言、上下文、深度或关键点条件下生成未来视频，用于规划与仿真。
      尚未覆盖: 长时域物理合理性、新原语/任务泛化、跨数据集与真实机器人迁移尚未充分验证。
    - 路线: 面向记忆、空间一致性和动作控制的世界模型评测协议
      解决的问题: 测量标准任务分数未覆盖的性质，如循环一致性和闭环动作响应。
      尚未覆盖: 基准较新，往往尚未隔离模型贡献与数据集基线和周边系统设计的影响。
    共识:
    - 当前方法普遍从视觉或交互数据中学习生成式动力学，用于预测、策略训练或规划。
    - 存在向统一架构发展的趋势，将动作、语言、上下文、深度、关键点或掩码等多个模态或辅助目标耦合。
    - 评测日益纳入单一任务分数之外的开放域或闭环性质，如记忆一致性和空间一致性。
    - 报告的性能提升常出现在强基线或基准上，但局限性和消融证据不均衡。
    分歧:
    - 表示选择不同：面向样本高效策略学习的紧凑潜在 rollout，相对面向场景或任务规划的高维视频生成。
    - 动作接口不同：动作条件动力学与想象 rollout、联合动作-视频扩散、语言原语组合。
    - 监督信号不同：上下文条件潜在动力学、MAE式掩码目标、物理信息深度/关键点任务或无动作视频预训练。
    - 评测目标不同：标准控制、驾驶多视角预测、机器人仿真和开放域记忆/动作控制基准。
    开放问题:
    - 报告性能中有多少来自所学世界模型，而不是规划器、策略学习器、任务先验或预训练数据的选择？
    - 基于上下文和原语的世界模型能否外推到未见上下文、原语、动作空间或数据集分布之外？
    - 高维视频世界模型能否在反复闭环控制下保持长期记忆和空间一致性？
    - 新的一致性基准是否足以将世界模型质量与数据集、基线和实现效应分开？
