  related_work_outline:
  - 'Mainstream direction: World-model benchmarking and method development center
    on video dynamics and action-conditioned generation; benchmark datasets such as
    LoopNav and MIND target memory and spatial consistency, while model papers report
    on Atari 100k, CARL, Nuscenes, OpenDV-2K, Waymo, and robotics data.'
  - 'Shared research pattern: Works combine generative world-model training with targeted
    probes: auxiliary mask, depth, keypoint, scene-graph, or loop-consistency tasks,
    zero-shot context control, or coupled video-action diffusion. Evaluation usually
    compares against prior methods on fixed datasets, with code or dataset artifacts
    often provided.'
  - 'Key differences: Representation families include discrete latent stochastic models,
    diffusion-based video models, contextual state-space models, and physics-informed
    models. Evaluation targets range from closed-loop game performance and contextual
    control to driving prediction and open-domain memory/action control. Supervision
    differs across mask reconstruction, physical priors, context conditioning, and
    downstream policy return.'
  - 'Trend evolution: Available top evidence concentrates in 2023-2026, so the trend
    is within the current frontier. Efficient RL world models around 2023-2024 give
    way to more open-world, memory-augmented, physics-informed, and robot-pretraining
    benchmarks by 2025-2026, with more multi-view, long-horizon, and action-aware
    evaluation.'
  - 'Open questions: Evidence is still missing on whether consistency and control
    metrics align with real driving or robot decisions, on long-term memory and cross-action-space
    generalization, and on stability across implementations, compute budgets, and
    unreported limitation details.'
  related_work_outline_zh:
  - 主流方向：世界模型的基准与建模工作集中在视频动力学和动作条件生成；LoopNav、MIND 等基准关注记忆与空间一致性，模型论文则在 Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo
    和机器人数据上报告结果。
  - 研究共性：工作通常将生成式世界模型训练与定向探针结合，例如掩码、深度、关键点、场景图或循环一致性任务、零样本上下文控制、视频-动作耦合扩散。评测多在固定数据集上与先前方法比较，并常开源代码或数据。
  - 关键差异：表示方式包括离散隐变量随机模型、扩散视频模型、上下文状态空间模型和物理信息模型。评测目标覆盖闭环游戏表现、上下文控制、驾驶预测和开放域记忆/动作控制。监督信号在掩码重建、物理先验、上下文条件和下游策略回报之间存在差异。
  - 趋势演进：现有高相关证据集中在 2023-2026 年，因此趋势属于当前前沿。2023-2024 年前后的高效强化学习世界模型，到 2025-2026 年逐渐转向更开放世界、记忆增强、物理信息和机器人预训练基准，并更多采用多视角、长时域和动作感知评测。
  - 开放问题：一致性指标和控制指标能否预测真实驾驶或机器人决策仍缺少证据；长期记忆、跨动作空间泛化、不同实现与算力预算下的结论稳定性，以及未报告局限性所掩盖的边界条件也仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable, especially for spatial consistency, memory consistency, and action
        control in navigation or open-domain video settings.
      what_remains_open: Whether task distributions and scenes cover driving, robotics,
        and open-world settings where world models are expected to help, and whether
        evaluation transfers across action spaces.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial consistency, physical plausibility,
        memory, controllability, and downstream policy utility beyond aggregate generation
        scores.
      what_remains_open: Alignment between proxy metrics and real downstream decisions
        remains unclear; long-horizon and cross-action-space failure modes are not
        fully measured.
    - line: Comparable baselines and reporting
      what_it_solves: Provides fixed comparisons on datasets such as Atari 100k, CARL,
        Nuscenes, OpenDV-2K, Waymo, and robotics suites, allowing state-of-the-art
        claims to be checked.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and missing limitation or baseline details is under-reported.
    consensus:
    - Evaluation is shifting from aggregate generation quality toward probes of spatial
      consistency, memory, action control, and downstream policy utility.
    - Diffusion and transformer architectures appear frequently for video dynamics,
      often combined with auxiliary tasks or action conditioning.
    - Fixed benchmarks such as Atari 100k, CARL, Nuscenes, OpenDV-2K, Waymo, and Minecraft/open-domain
      video suites serve as common comparison points across studies.
    disagreements:
    - 'Representation families differ: discrete latent stochastic models, diffusion-based
      video models, contextual state-space models, and physics-informed models coexist.'
    - 'Supervision signals differ: mask reconstruction, temporal depth and keypoint
      dynamics, scene-graph consistency, context conditioning, or downstream policy
      return are used in different combinations.'
    - 'Evaluation targets differ: closed-loop game performance, contextual zero-shot
      control, long-horizon driving prediction, open-domain memory/action control,
      or robot visual generation are emphasized by different works.'
    - 'Interaction mode differs: action-free video prediction, action-conditioned
      generation, multi-view prediction, and coupled video-action diffusion create
      different task boundaries.'
    open_questions:
    - How well do spatial consistency and action-control metrics align with real driving
      or robot decisions?
    - Can current models maintain long-term memory and generalize across varied action
      spaces without task-specific tuning?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      missing limitation or baseline details?
    - What level of visual detail is necessary for decision-making, as opposed to
      perceptual realism or aggregate scores?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型在空间一致性、记忆一致性和动作控制上可比较，尤其在导航或开放域视频环境中。
      尚未覆盖: 任务分布和场景是否覆盖驾驶、机器人与开放世界等世界模型预期发挥作用的设置，以及评测能否跨动作空间迁移。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体生成分数之外，检验预测质量、空间一致性、物理合理性、记忆、可控性和下游策略效用。
      尚未覆盖: 代理指标与真实下游决策之间的对应关系仍不清楚；长时域和跨动作空间失效模式尚未被充分测量。
    - 路线: 可比基线与报告规范
      解决的问题: 在 Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo 和机器人评测集上提供固定比较，使最先进主张可核查。
      尚未覆盖: 基准结论在不同实现、算力预算以及缺失局限性或基线细节时是否稳定，报告中仍不充分。
    共识:
    - 评测正从总体生成质量转向对空间一致性、记忆、动作控制和下游策略效用的探测。
    - 扩散模型和 Transformer 常见于视频动力学建模，并常与辅助任务或动作条件结合。
    - Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo 及 Minecraft/开放域视频等固定评测集被用作跨研究的共同比较点。
    分歧:
    - 表示方式不同：离散隐变量随机模型、基于扩散的视频模型、上下文状态空间模型和物理信息模型并存。
    - 监督信号不同：掩码重建、时序深度与关键点动力学、场景图一致性、上下文条件或下游策略回报被不同工作分别采用。
    - 评测目标不同：闭环游戏表现、上下文零样本控制、长时域驾驶预测、开放域记忆/动作控制或机器人视频生成各有侧重。
    - 交互模式不同：无动作视频预测、动作条件生成、多视角预测和视频-动作耦合扩散形成了不同的任务边界。
    开放问题:
    - 空间一致性和动作控制指标在多大程度上能预测真实驾驶或机器人决策？
    - 当前模型能否在无任务特定调优的情况下维持长期记忆并跨不同动作空间泛化？
    - 基准结论在不同实现、算力预算以及缺少局限性或基线细节的情况下是否稳定？
    - 决策所需的视觉细节水平是什么，它如何区别于感知真实感或总体得分？
