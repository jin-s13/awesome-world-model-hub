  related_work_outline:
  - 'Mainstream direction: Designing generative world model architectures (diffusion
    Transformers, VAEs, unified video-action models) that produce high-fidelity future
    predictions for embodied tasks.'
  - 'Shared research pattern: Scaling up models with self-supervised learning on large
    video or interaction datasets, then evaluating via reconstruction quality or downstream
    policy performance.'
  - 'Key differences: Architectures diverge between diffusion-only, transformer-VAE
    hybrids, and explicit physics-informed models; evaluation targets range from visual
    realism to memory consistency and compositional generalization.'
  - 'Trend evolution: Within the 2023–2026 frontier, work moved from single-task Atari
    benchmarks to complex driving and robotics, with growing emphasis on context,
    compositionality, physics priors, and closed-loop memory benchmarks.'
  - 'Open questions: Whether current architectural choices transfer beyond reported
    domains, how to isolate model contribution from planner or controller, and how
    to unify evaluation protocols across diverse action spaces.'
  related_work_outline_zh:
  - 主流方向：设计生成式世界模型架构（扩散Transformer、VAE、视频-动作统一模型），为具身任务产生高保真未来预测。
  - 研究共性：在大规模视频或交互数据上通过自监督学习扩展模型，然后通过重建质量或下游策略性能进行评估。
  - 关键差异：架构分化于纯扩散、Transformer-VAE混合和显式物理信息模型；评估目标从视觉真实感到记忆一致性和组合泛化各不相同。
  - 趋势演进：在2023–2026前沿内，工作从单任务Atari转向复杂驾驶和机器人，越来越强调上下文、组合性、物理先验和闭环记忆基准。
  - 开放问题：当前架构选择能否迁移到报告领域之外，如何将模型贡献与规划器或控制器隔离，以及如何在多样化动作空间上统一评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures (diffusion Transformers, VAE-based,
        unified video-action)
      what_it_solves: Transforms high-dimensional visual observations into future
        predictions, enabling model-based planning and policy learning from imagined
        trajectories.
      what_remains_open: Transferability across dynamics and visual domains, computational
        efficiency trade-offs, and the extent to which gains come from the model versus
        the planner.
    - line: Contextual and memory-enhanced world models
      what_it_solves: Handles non-stationary dynamics and long-term dependencies by
        conditioning on context or memory, improving zero-shot generalization to unseen
        conditions.
      what_remains_open: Scalability of memory mechanisms, automatic context discovery
        from unlabeled data, and verification of spatial consistency beyond simple
        navigation loops.
    - line: Compositional and structured factorization
      what_it_solves: Decomposes complex tasks into reusable primitives, enabling
        generalization to novel combinations of objects and actions from language
        or visual goals.
      what_remains_open: Robustness to unseen primitives, reliance on accurate language
        parsing, and extension to continuous control without predefined action primitives.
    - line: Physics-informed world models
      what_it_solves: Incorporates physical knowledge (depth, keypoint dynamics) to
        improve visual realism and motion plausibility in generated videos.
      what_remains_open: Whether physics priors generalize to novel object categories
        and materials, and how to balance data-driven learning with explicit physics
        constraints.
    - line: Benchmarks for spatial, memory, and action consistency
      what_it_solves: Provides standardized evaluation for closed-loop consistency
        and action controllability in world models, exposing common failure modes.
      what_remains_open: Alignment with real-world task performance, cross-domain
        benchmark unification, and sensitivity to pixel-level variations versus structural
        consistency.
    consensus:
    - World models should predict future states from sensory input, with generative
      models as the enabling backbone.
    - Large-scale pretraining on diverse datasets improves generalization and visual
      fidelity.
    - Video generation quality is a primary proxy for model capability, with downstream
      policy or planning performance as a realization target.
    - Temporal depth and spatial consistency are emerging as important dimensions
      beyond raw pixel accuracy.
    disagreements:
    - 'Architecture: diffusion-only models (e.g., MaskGWM) versus VAE-transformer
      hybrids (e.g., STORM) versus unified video-action diffusion (e.g., UWM).'
    - 'Physics integration: RoboScape explicitly injects physics knowledge, while
      others rely purely on data-driven learning.'
    - 'Evaluation framework: visual metrics (FVD, SSIM) vs. downstream task success
      vs. specialized memory-consistency scores (SGCS, MIND).'
    - 'Domain specificity: driving, robotics, Atari, and Minecraft each impose different
      action spaces, visual complexity, and dynamics, making direct comparison difficult.'
    open_questions:
    - How can long-term memory consistency be quantified and improved without sacrificing
      computational efficiency?
    - What is the minimal architecture and training recipe that transfers across visually
      distinct domains and action spaces?
    - Can we separate the benefit of a world model from the policy or planner that
      uses it, using controlled ablation protocols?
    - How should world models incorporate physical reasoning without over-constraining
      to known physics, especially for deformable or novel objects?
    - What benchmarks can evaluate both open-loop generation quality and closed-loop
      control reliability in a unified way?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构（扩散Transformer、VAE、视频-动作统一）
      解决的问题: 将高维视觉观测转化为未来预测，实现基于模型的规划与从想象轨迹中学习策略。
      尚未覆盖: 跨动力学和视觉域的可迁移性、计算效率权衡，以及收益有多少来自模型而非规划器。
    - 路线: 上下文与记忆增强的世界模型
      解决的问题: 通过条件化上下文或记忆处理非平稳动力学和长期依赖，提升对未见条件的零样本泛化。
      尚未覆盖: 记忆机制的可扩展性、从无标签数据自动发现上下文，以及空间一致性在简单导航回路之外的验证。
    - 路线: 组合式与结构化分解
      解决的问题: 将复杂任务分解为可重用原语，实现对未见物体和动作组合的泛化。
      尚未覆盖: 对全新原语的鲁棒性、依赖准确的语言解析，以及扩展到无预定义动作原语的连续控制。
    - 路线: 物理信息驱动的世界模型
      解决的问题: 引入物理知识（深度、关键点动力学）以提升生成视频的视觉真实感和运动合理性。
      尚未覆盖: 物理先验能否泛化到新物体类别和材料，以及如何平衡数据驱动学习与显式物理约束。
    - 路线: 空间、记忆与动作一致性基准
      解决的问题: 提供世界模型闭环一致性和动作可控性的标准化评估，暴露常见失败模式。
      尚未覆盖: 与真实任务性能的对齐、跨领域基准统一，以及对像素级变化与结构一致性的敏感性。
    共识:
    - 世界模型应能从感官输入预测未来状态，生成模型是核心支撑。
    - 在大规模多样化数据集上预训练可提升泛化能力和视觉保真度。
    - 视频生成质量是模型能力的主要代理指标，下游策略或规划性能是最终目标。
    - 时间深度和空间一致性正成为超越像素精度的关键维度。
    分歧:
    - 架构选择：纯扩散模型（如MaskGWM）、VAE-Transformer混合（如STORM）与统一视频-动作扩散（如UWM）之间存在分歧。
    - 物理集成：RoboScape显式注入物理知识，而其他方法完全依赖数据驱动。
    - 评估框架：视觉指标（FVD、SSIM）与下游任务成功率、专门记忆一致性分数（SGCS、MIND）形成对比。
    - 领域特异性：驾驶、机器人、Atari和Minecraft各自的动作空间、视觉复杂度和动力学差异显著，难以直接比较。
    开放问题:
    - 如何在牺牲计算效率的情况下量化并改进长期记忆一致性？
    - 什么样的最小架构和训练方案能够跨视觉差异大的领域和动作空间迁移？
    - 能否通过严格的消融协议分离世界模型与其上层策略或规划器的贡献？
    - 世界模型应该如何融入物理推理，既不过度约束已知物理，又能处理可变形或新物体？
    - 哪些基准可以统一评估开环生成质量与闭环控制可靠性？
