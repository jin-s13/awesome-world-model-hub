  related_work_outline:
  - 'Mainstream direction: Generating future video frames or latent states using diffusion
    transformers and hybrid architectures, often combined with physics-informed or
    action-coupled objectives, to support decision-making in autonomous driving, robotics,
    and embodied AI.'
  - 'Shared research pattern: World models are framed as video prediction or latent
    dynamics learning problems, trained with self-supervised objectives on large-scale
    simulation or real-world datasets, and evaluated via fidelity, consistency, and
    downstream policy performance.'
  - 'Key differences: Architectures range from pure latent state-space models to diffusion-based
    pixel generators; some inject physical priors through depth or keypoints, while
    others couple action and video diffusion in a unified transformer; evaluation
    settings span Atari, driving, robotic manipulation, and open-world navigation.'
  - 'Trend evolution: The field moved from efficient latent models for games (2023)
    to context-aware dynamics and compositional video generation for robotics (2024),
    then to physics-informed diffusion models and unified video-action pretraining
    (2025), with benchmarks now targeting memory consistency and action controllability
    (2026).'
  - 'Open questions: How to maintain long-term memory consistency across viewpoints;
    how to generalize across unseen action spaces or new primitive combinations; how
    to quantify physical plausibility without ground-truth physics; whether these
    models transfer to real-world deployment without observable context assumptions.'
  related_work_outline_zh:
  - 主流方向：利用扩散变换器与混合架构生成未来视频帧或潜在状态，常结合物理信息或动作耦合目标，支撑自动驾驶、机器人及具身智能的决策。
  - 研究共性：世界模型被构建为视频预测或潜在动力学学习问题，通过自监督目标在大规模仿真或真实数据上训练，并通过保真度、一致性及下游策略性能进行评估。
  - 关键差异：架构从纯潜在状态空间模型到基于扩散的像素生成器不等；部分通过深度或关键点注入物理先验，而另一些在统一Transformer中耦合动作与视频扩散；评估场景涵盖Atari、驾驶、机器人操作和开放世界导航。
  - 趋势演进：从2023年面向游戏的高效潜在模型，到2024年上下文感知动力学与面向机器人的组合视频生成，再到2025年物理信息驱动的扩散模型与统一视频-动作预训练，当前基准（2026年）开始关注记忆一致性与动作可控性。
  - 开放问题：如何维持跨视角的长期记忆一致性；如何泛化到未见动作空间或全新原语组合；如何在没有真值物理的情况下量化物理合理性；这些模型能否在无需可观测上下文假设下迁移到真实世界部署。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model ideas into concrete architectures, training
        losses, and generation recipes, enabling learning of environment dynamics
        from pixels or latent states.
      what_remains_open: Which representation family (diffusion, VAE, or hybrid) transfers
        best beyond the reported task family, and whether injected physics priors
        consistently improve downstream control.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention, planning, and decision-time
        interfaces, letting agents train policies or compose plans inside imagined
        rollouts.
      what_remains_open: Decomposing gain between model fidelity and the planner/controller,
        and enabling planning without accurate action labels or observable context
        variables.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects, and provides standardized benchmarks for core
        capabilities like consistency and controllability.
      what_remains_open: Existing benchmarks do not fully disentangle model capability
        from surrounding system choices, and long-term memory evaluation still lacks
        a unified protocol.
    consensus:
    - Learning a generative model of future observations or latent states is a useful
      proxy for environment dynamics.
    - Self-supervised pretraining on large-scale video or trajectory data improves
      generalization and robustness.
    - Spatial and temporal consistency, as well as action controllability, are emerging
      as necessary evaluation dimensions beyond visual fidelity.
    - Architectures should support flexible conditioning, including language instructions,
      goal images, and action sequences.
    disagreements:
    - Whether to operate directly in pixel space via video diffusion or in a compact
      latent state space for efficiency, which dictates the trade-off between visual
      quality and sample speed.
    - Whether physical knowledge should be injected as explicit auxiliary losses (depth,
      keypoints) or left to emerge from data, reflecting different assumptions about
      the availability of physics annotations.
    - Whether action and video generation should be tightly coupled inside a single
      diffusion process or treated as separate modules, influencing the model's ability
      to leverage action-free data.
    - 'Evaluation settings differ substantially: some rely on closed-loop policy returns
      in fixed simulators, while others emphasize open-loop visual consistency or
      zero-shot transfer to unseen dynamics.'
    open_questions:
    - Can current world models maintain memory consistency over long horizons and
      across large viewpoint changes without explicit scene graphs?
    - How do methods generalize to entirely novel action spaces or task primitives
      not seen during training?
    - What is the minimal supervision needed—pixels, actions, physics annotations—to
      achieve physically plausible rollouts?
    - To what extent do gains observed in simulation transfer to real-world robots,
      especially when context variables are unobservable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体架构、训练损失和生成配方，从像素或潜在状态中学习环境动力学。
      尚未覆盖: 哪种表示族（扩散、VAE或混合）在报告任务族之外迁移性最佳，以及注入物理先验是否一致地改善下游控制。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，使智能体在想象轨迹中训练策略或组合规划。
      尚未覆盖: 区分模型保真度与规划器/控制器的收益，并在缺乏精确动作标注或可观测上下文变量时实现规划。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素，并为核心能力（如一致性和可控性）提供标准化基准。
      尚未覆盖: 现有基准未能完全解耦模型能力与周边系统选择，长期记忆评估仍缺乏统一协议。
    共识:
    - 学习未来观测或潜在状态的生成模型是环境动力学的有效代理。
    - 在大规模视频或轨迹数据上进行自监督预训练能够提升泛化性和鲁棒性。
    - 空间和时间一致性以及动作可控性正成为超越视觉保真度的必要评估维度。
    - 架构应支持灵活的条件化，包括语言指令、目标图像和动作序列。
    分歧:
    - 在像素空间通过视频扩散直接操作还是在紧凑的潜在状态空间中操作，决定了视觉质量与采样效率的权衡。
    - 物理知识应作为显式辅助损失（深度、关键点）注入还是从数据中涌现，反映了对物理标注可获得性的不同假设。
    - 动作与视频生成应在单一扩散过程中紧密耦合还是作为独立模块处理，影响模型利用无动作数据的能力。
    - 评估场景差异显著：部分依赖固定模拟器中的闭环策略回报，而其他则强调开环视觉一致性或对未见动力学的零样本迁移。
    开放问题:
    - 当前世界模型能否在长时域和跨大视角变化中维持记忆一致性，而无需显式场景图？
    - 方法如何泛化到训练中未见的全新动作空间或任务原语？
    - 实现物理合理推演所需的最低监督信号（像素、动作、物理标注）是什么？
    - 仿真中观察到的收益在多大程度上能迁移到真实机器人，特别是在上下文变量不可观测的情况下？
