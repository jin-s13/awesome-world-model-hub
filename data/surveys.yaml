  literature_review:
    line_of_work_matrix:
    - line: Closed-loop driving simulators and action-following video generation
      what_it_solves: Generates future driving frames conditioned on commands or trajectories
        for simulation, action-fidelity evaluation, and policy reward.
      what_remains_open: Evidence is limited mainly to nuScenes; long-horizon cross-view
        consistency and multi-GPU or complex-scene deployment remain uncertain.
    - line: Physics-informed embodied world models
      what_it_solves: Jointly learns RGB video generation and physics-like information
        to improve visual fidelity and physical plausibility in robotic scenarios.
      what_remains_open: No explicit limitation evidence is provided; transfer beyond
        trained robotic scenarios, hardware changes, and independent physical metric
        validation are unverified.
    - line: Contextual and cross-embodiment world models
      what_it_solves: Uses observable context or universal latent actions to improve
        zero-shot generalization and reuse human, robot, and simulation interaction
        data.
      what_remains_open: Assumes observable context in some cases; CARL evaluation
        covers only two tasks, and cross-embodiment latent-action transfer boundaries
        are not fully validated.
    - line: Benchmarks and reproducible evaluation artifacts for world-model consistency
      what_it_solves: Provides datasets and metrics for spatial consistency or action
        fidelity to make world-model claims comparable.
      what_remains_open: Some artifacts lack reported baseline results or limitation
        sections; independent reproduction across teams, datasets, and infrastructure
        is still a verification gap.
    consensus:
    - Generative world models are treated as closed-loop simulators and policy-evaluation
      environments, not merely as video predictors.
    - Action, trajectory, context, or physics conditioning is used to improve controllability,
      fidelity, or zero-shot generalization.
    - Evaluation combines visual fidelity metrics with downstream policy or reward
      performance to measure practical utility.
    - Recent system-oriented work increasingly exposes benchmarks, datasets, or latency
      claims, but many papers still omit full limitation and independent reproduction
      evidence.
    disagreements:
    - 'Representation choices differ: recurrent state-space models, diffusion transformers,
      and pretrained video transformers with latent actions.'
    - 'Supervision strategies differ: observable context values, auxiliary physics
      tasks, trajectory-conditioned control, and universal latent actions.'
    - 'Evaluation targets differ: open-world spatial consistency, driving action fidelity,
      robotic visual and physical plausibility, and cross-embodiment policy success.'
    - 'Deployment settings differ: offline benchmark evaluation, closed-loop single-GPU
      driving inference, and large-scale cross-embodiment pretraining.'
    open_questions:
    - Does short-horizon action fidelity measured by current benchmarks predict closed-loop
      long-horizon behavior?
    - Can physics-informed and cross-embodiment world models transfer beyond trained
      environments and hardware without assuming annotated context or shared action
      spaces?
    - What unified protocol can compare spatial consistency, action fidelity, physical
      plausibility, and real-time deployment under a single reproducible benchmark?
    - Which missing code, dataset, baseline-result, or limitation details are verification
      gaps that currently prevent independent cross-team reproduction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环驾驶模拟器与动作跟随视频生成系统
      解决的问题: 根据指令或轨迹生成未来驾驶帧，用于模拟、动作忠实度评测和策略奖励。
      尚未覆盖: 证据主要限于nuScenes；长时域跨视角一致性及多GPU或复杂场景部署仍不确定。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 联合学习RGB视频生成与物理知识，以提升机器人场景中的视觉保真度和物理合理性。
      尚未覆盖: 未提供明确局限性证据；训练场景之外的迁移、硬件变化和独立物理指标验证尚未覆盖。
    - 路线: 上下文与跨具身世界模型
      解决的问题: 利用可观测上下文或通用潜在动作改善零样本泛化，并复用人类、机器人和仿真交互数据。
      尚未覆盖: 部分方法假设上下文可观测；CARL评估仅覆盖两个任务，跨具身潜在动作迁移边界未充分验证。
    - 路线: 面向世界模型一致性的基准与可复现评测工件
      解决的问题: 提供数据集和指标，用于比较空间一致性或动作忠实度。
      尚未覆盖: 部分工件未报告基线结果或局限性；跨团队、数据集和基础设施的独立复现仍是验证缺口。
    共识:
    - 生成式世界模型被作为闭环模拟器和策略评估环境使用，而不仅是视频预测器。
    - 通过动作、轨迹、上下文或物理条件提升可控性、保真度或零样本泛化。
    - 评测通常同时采用视觉保真度指标与下游策略或奖励表现，以衡量实际效用。
    - 近期面向系统的研究越来越多开放基准、数据集或延迟声明，但许多论文仍缺少完整局限性与独立复现证据。
    分歧:
    - 表示方式不同：循环状态空间模型、扩散Transformer和含潜在动作的预训练视频Transformer。
    - 监督策略不同：可观测上下文值、物理辅助任务、轨迹条件控制和通用潜在动作。
    - 评测目标不同：开放世界空间一致性、驾驶动作忠实度、机器人视觉与物理合理性，以及跨具身策略成功率。
    - 部署场景不同：离线基准评测、闭环单GPU驾驶推理，以及大规模跨具身预训练。
    开放问题:
    - 当前基准测得的短时域动作忠实度能否预测闭环长时域行为？
    - 物理信息与跨具身世界模型能否在无需标注上下文或共享动作空间的条件下，迁移到训练环境与硬件之外？
    - 何种统一协议能在单一可复现基准下同时比较空间一致性、动作忠实度、物理合理性与实时部署能力？
    - 哪些缺失的代码、数据集、基线结果或局限性细节构成了当前独立跨团队复现的验证缺口？
