    and policy execution.'
  - 'Key differences: They differ in target domain (driving, robot, interactive/game),
    modeling backbone (Diffusion Transformer, recurrent state-space, unified video-action
    diffusion), auxiliary supervision, and evaluation target (video fidelity, zero-shot
    policy generalization, or memory/action consistency).'
  - 'Trend evolution: Top evidence spans 2023-2026, so the observable trend is within
    the current frontier: from efficient RL world models toward contextual, compositional,
    physics-informed, unified video-action, and benchmark-driven work.'
  - 'Open questions: Evidence is missing on transfer across embodiments, datasets,
    and physical environments; real-world safety outcomes; unseen primitive or context
    generalization; long-term memory consistency and cross-action-space control; and
    several works lack explicit limitation analysis.'
  related_work_outline_zh:
  - 主流方向：世界模型的应用集中在具身机器人和自动驾驶，近期方法以扩散Transformer或潜在动力学进行视频预测和策略学习。
  - 研究共性：从视觉和动作上下文学习预测或生成动力学，常加入掩码、物理、语言原语或上下文变量等辅助信号；评测依赖领域基准和策略执行。
  - 关键差异：目标领域（驾驶、机器人、交互/游戏）、模型骨架（扩散Transformer、循环状态空间、统一视频-动作扩散）、辅助监督和评测目标不同。
  - 趋势演进：顶部证据集中在2023-2026年，可观察趋势处于当前前沿：从高效RL世界模型走向上下文、组合式、物理信息、统一视频-动作和基准驱动的方向。
  - 开放问题：跨本体、数据集和物理环境的迁移证据缺失；真实安全结果未验证；未见原语或上下文泛化不明确；长期记忆一致性与跨动作空间控制仍是难题；若干工作缺少显式局限性分析。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot and control tasks by coupling language,
        actions, context, or physics with video or latent dynamics; examples include
        RoboDreamer, RoboScape, Unified World Models, and cRSSM on CARL.
      what_remains_open: Transfer across embodiments, datasets, institutions, or physical
        environments is not shown; unseen primitives and unobserved context remain
        unresolved; real robot execution is often not verified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses driving world models for generalizable multi-view and long-horizon
        video prediction; MaskGWM demonstrates improvement on NuScenes, OpenDV-2K,
        and zero-shot Waymo.
      what_remains_open: Whether simulator gains align with real-world safety or operational
        outcomes is unproven; cross-dataset and long-horizon evaluation is still limited
        to reported benchmarks.
    - line: Interactive agents, games, and capability benchmarks
      what_it_solves: Builds efficient stochastic world models for agent learning
        and constructs benchmarks for spatial consistency, memory consistency, and
        action control; examples include STORM, LoopNav, and MIND.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change is insufficiently tested; long-term memory consistency and cross-action-space
        control remain open challenges.
    consensus:
    - Many recent works treat world models as generative video or latent dynamics
      predictors conditioned on action, language, or context rather than as passive
      scene recognizers.
    - There is a shared shift toward unifying prediction with control or policy learning
      so the same model can produce observations and actions.
    - Evaluation increasingly requires domain-specific indicators beyond visual fidelity,
      including zero-shot generalization, physical plausibility, spatial consistency,
      memory consistency, and action control.
    - Self-supervised or auxiliary tasks such as mask reconstruction, keypoint dynamics,
      depth prediction, and context conditioning are common for improving world-model
      training.
    - Several works report methods or benchmarks without complete limitation analysis,
      leaving verification gaps around failure modes and deployment boundaries.
    disagreements:
    - Some methods rely on explicit context values or predefined primitives, while
      others learn implicit physics or unify modalities without requiring such decomposition.
    - 'Representations differ: driving and robot video generation favor diffusion
      transformers or unified video-action diffusion, whereas efficient RL agents
      may use recurrent state-space or VAE-Transformer stochastic models.'
    - Supervision differs among action-free video data, action-conditioned rollouts,
      language instructions, goal images, context variables, and auxiliary physics
      tasks.
    - 'Evaluation targets differ: some optimize dataset-level video prediction metrics,
      others policy performance on Atari or CARL, and others introduce benchmarks
      for spatial consistency, memory consistency, or action control.'
    - Deployment settings differ from simulation-only robot execution and offline
      driving benchmarks to open-domain interactive video probes, with different evidence
      for real-world transfer.
    open_questions:
    - Can improvements demonstrated on NuScenes, OpenDV-2K, Waymo, Atari, or CARL
      transfer across different embodiments, institutions, and physical environments?
    - Do simulator or video-generation gains in driving and robot settings translate
      into real-world safety and operational outcomes?
    - How can world models handle entirely new task primitives, novel dynamics, or
      unobserved context beyond combinations or contexts represented in training?
    - Several top methods lack explicit limitation analysis; what failure modes do
      existing benchmarks not yet capture?
    - Can long-term memory consistency, spatial consistency, and cross-action-space
      control be maintained without sacrificing visual fidelity or training efficiency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人和控制任务，通过语言、动作、上下文或物理信号与视频或潜在动力学耦合；例如 RoboDreamer、RoboScape、Unified
        World Models、cRSSM（CARL）。
      尚未覆盖: 跨本体、数据集、机构或物理环境的迁移未展示；未见原语与不可观测上下文仍未解决；真实机器人执行常未验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用驾驶世界模型进行可泛化的多视角和长时域视频预测；MaskGWM 在 NuScenes、OpenDV-2K 和零样本 Waymo 上展示提升。
      尚未覆盖: 仿真收益与真实安全或运营结果是否一致未证明；跨数据集和长时域评估仍限于所报告基准。
    - 路线: 交互式智能体、游戏与能力基准
      解决的问题: 构建高效随机世界模型用于智能体学习，并建立空间一致性、记忆一致性和动作控制基准；例如 STORM、LoopNav、MIND。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化测试不足；长期记忆一致性与跨动作空间控制仍是开放挑战。
    共识:
    - 近年许多工作将世界模型视为以动作、语言或上下文为条件的生成式视频或潜在动力学预测器，而非被动场景识别器。
    - 出现将预测与控制或策略学习统一的趋势，使同一模型既能生成观测也能输出动作。
    - 评测越来越需要超越视觉保真度的领域指标，包括零样本泛化、物理合理性、空间一致性、记忆一致性和动作控制。
    - 掩码重建、关键点动力学、深度预测和上下文条件等自监督或辅助任务被广泛用于改善世界模型训练。
    - 部分工作报告方法或基准但缺少完整局限性分析，仍留下失败模式和部署边界的验证缺口。
    分歧:
    - 有的方法依赖显式上下文值或预定义原语，有的学习隐式物理或统一模态，无需此类分解。
    - 表示方式不同：驾驶与机器人视频生成偏向扩散Transformer或统一视频-动作扩散，而高效RL智能体可能采用循环状态空间或VAE-Transformer随机模型。
    - 监督信号不同：分别关注无动作视频数据、动作条件轨迹、语言指令、目标图像、上下文变量或辅助物理任务。
    - 评测目标不同：有的优化数据集级视频预测指标，有的优化Atari或CARL策略性能，有的构建空间一致性、记忆一致性或动作控制基准。
    - 部署场景不同：从纯仿真机器人执行和离线驾驶基准，到开放域交互视频探测；真实世界迁移证据各不相同。
    开放问题:
    - 在 NuScenes、OpenDV-2K、Waymo、Atari 或 CARL 上的改进能否跨不同本体、机构与物理环境迁移？
    - 驾驶和机器人场景下的仿真或视频生成收益能否转化为真实安全与运营结果？
    - 世界模型如何处理训练中未见过的全新原语、新动力学或不可观测上下文？
    - 若干顶部方法缺少显式局限性分析；现有基准未覆盖哪些失败模式？
    - 能否在不牺牲视觉保真度或训练效率的情况下维持长期记忆一致性、空间一致性与跨动作空间控制？
