  related_work_outline_zh:
  - 主流方向：构建支持动作条件化预测和交互式决策的视频世界模型，特别强调物理合理性和任务目标的对齐。
  - 研究共性：采用可扩展的扩散Transformer耦合动作和视频模态，在大规模机器人数据集上预训练，并通过后训练或奖励驱动对齐来提升物理真实性和任务一致性。
