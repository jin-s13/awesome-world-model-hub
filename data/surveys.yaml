  related_work_outline_zh:
  - 主流方向：证据集中在动作条件视频生成作为具身世界模型，以扩散或掩码自回归架构用于机器人操作和空间推理。
  - 研究共性：多篇工作将视觉状态与动作耦合，试图改善动作-帧对齐、物理合理性以及对策略、规划或推理的下游效用。
  - 关键差异：生成骨干、适配方式、对齐信号、评测目标不同；预测分别用于控制、规划或推理，采用的奖励或验证器设置也不同。
  - 趋势演进：从细粒度动作条件生成走向更大规模统一模型和偏好/DPO对齐，并出现机制分类与测试时缩放研究。
  - 开放问题：视觉保真度是否反映物理与因果正确性；验证器和奖励模型的偏差；形式化状态/动态假设是否跨基准和本体迁移；缩放规律与保证缺少验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation for embodied world models
      what_it_solves: Learning observation-action dynamics so simulated future video
        can support robot policy learning, planning, or evaluation.
      what_remains_open: Evidence shows improved visual quality and controllability,
        but limited proof that visual prediction quality alone transfers to physical,
        causal, and cross-embodiment correctness.
    - line: Adaptation of pretrained video diffusion models to action-conditioned
        world models
      what_it_solves: Enables closed or pretrained video generators to become action-conditioned
        simulators without full parameter access.
      what_remains_open: Still assumes a small domain-specific action-labelled dataset
        and a suitable pretrained model; generalization beyond video games and robotics
        is not demonstrated.
    - line: Human-preference and physics alignment for generated rollouts
      what_it_solves: Post-trains world models to improve physical realism, task logic,
        embodiment plausibility, and visual quality.
      what_remains_open: Evaluated mainly on contact-rich manipulation; reward modeling
        depends on human preferences, whose subjectivity and collection cost are unresolved.
    - line: Conceptual taxonomy and mechanistic evaluation of video world models
      what_it_solves: Clarifies state construction and dynamics modeling dimensions
        and argues for functional benchmarks over visual fidelity alone.
      what_remains_open: Remains conceptual without new experiments or datasets, so
        it does not yet show whether the taxonomy changes design, evaluation, or formal
        guarantees.
    - line: Test-time verification and reward grounding for spatial reasoning
      what_it_solves: Attempts to improve reasoning by selecting or scoring world-model-generated
        views with frame-anchored assertions.
      what_remains_open: Verifier calibration is poor and scaling is benchmark-dependent;
        current models may form an information bottleneck for fine-grained reasoning.
    consensus:
    - Multiple papers treat action-conditioned future video prediction as a useful
      proxy for embodied dynamics and policy or planning performance.
    - 'There is shared concern that visual fidelity alone is not enough: physical
      plausibility, action-frame alignment, and downstream utility require explicit
      evaluation.'
    - Recent work increasingly combines generative world models with an external alignment
      or selection signal, whether reward models, DPO-style post-training, or test-time
      verifiers.
    disagreements:
    - 'Representation differs: unified diffusion over video and action versus heterogeneous
      masked autoregression over tokenized observations and actions.'
    - 'Supervision and alignment differ: some use action-labelled video with standard
      generation loss, while others use human preferences, DPO-style post-training,
      or heuristic verifiers.'
    - 'Interaction mode differs: models target robot policy or planning, closed-model
      adaptation for embodied control, or visual spatial reasoning rather than the
      same downstream task.'
    - 'Evaluation target differs: one benchmark may reward physical plausibility and
      trajectory consistency, while another tests spatial reasoning under test-time
      scaling; results do not transfer uniformly.'
    open_questions:
    - Can formal state-construction and dynamics conditions be operationalized as
      functional benchmarks that predict physical persistence and causal reasoning?
    - What causes verifier and reward signals to be miscalibrated or biased, and which
      evaluation settings expose those failures?
    - Do scaling laws and theoretical guarantees hold when these world models transfer
      across embodiments, domains, and tasks?
    - How can human-preference alignment scale beyond contact-rich manipulation without
      encoding subjective or costly reward assumptions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频生成作为具身世界模型
      解决的问题: 学习观测-动作动态，使模拟的未来视频支持机器人策略学习、规划或评估。
      尚未覆盖: 证据显示视觉质量和可控性提升，但视觉预测质量是否迁移到物理、因果和跨本体正确性仍缺少证明。
    - 路线: 将预训练视频扩散模型适配为动作条件世界模型
      解决的问题: 在不访问完整参数的情况下，使闭源或预训练视频生成器成为动作条件模拟器。
      尚未覆盖: 仍依赖小型特定领域动作标注数据和合适的预训练模型；未展示超出视频游戏和机器人领域的泛化。
    - 路线: 基于人类偏好和物理一致性的生成轨迹对齐
      解决的问题: 后训练世界模型以改善物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 主要在接触丰富操作上评测；奖励模型依赖人类偏好，主观性和收集成本尚未解决。
    - 路线: 视频世界模型的概念分类与机制评测
      解决的问题: 澄清状态构建和动态建模维度，并主张从视觉保真转向功能基准。
      尚未覆盖: 仍为概念性工作，没有新实验或数据集；尚不能证明该分类会改变设计、评测或形式保证。
    - 路线: 面向空间推理的测试时验证与奖励接地
      解决的问题: 通过帧锚定断言对世界模型生成的视图进行选择或评分，以改进推理。
      尚未覆盖: 验证器校准不良且缩放依赖基准；当前模型可能构成细粒度推理的信息瓶颈。
    共识:
    - 多篇工作把动作条件未来视频预测视为具身动态以及策略或规划性能的有用代理。
    - 共同关注视觉保真度不够：物理合理性、动作-帧对齐和下游效用需要显式评测。
    - 近期工作越来越多地在生成世界模型之外引入奖励模型、DPO 或测试时验证器等外部对齐或选择信号。
    分歧:
    - 表示方式不同：统一的视频-动作扩散与异构掩码自回归对观测和动作令牌建模。
    - 监督与对齐不同：有的使用标准生成损失和动作标注视频，有的使用人类偏好、DPO 风格后训练或启发式验证器。
    - 交互模式不同：分别面向机器人策略或规划、闭源模型适配的具身控制、或视觉空间推理等不同下游任务。
    - 评测目标不同：一类基准侧重物理合理性和轨迹一致性，另一类侧重测试时缩放下的空间推理，结论不能直接迁移。
    开放问题:
    - 能否将形式化的状态构建与动态条件操作化为功能基准，以预测物理持久性和因果推理？
    - 验证器和奖励信号为何会出现校准不良或偏差，哪些评测设置能可靠暴露这些失效？
    - 当世界模型跨本体、领域和任务迁移时，缩放规律和理论保证是否仍然成立？
    - 人类偏好对齐如何超越接触丰富操作，同时避免主观或高成本奖励假设？
