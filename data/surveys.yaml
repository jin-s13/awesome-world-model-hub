  related_work_outline_zh:
  - 主流方向：生成式世界模型主要应用于驾驶、机器人和交互环境，多以动作或指令为条件，用扩散或Transformer架构预测未来视频。
  - 研究共性：多数工作从领域数据学习动作条件化的未来预测，并用视觉保真、策略性能或一致性指标进行评测。
  - 关键差异：应用场景分为驾驶仿真、机器人想象和RL/游戏控制；表示方式、辅助物理或记忆信号以及评测目标不同。
  - 趋势演进：可见前沿从循环状态空间模型的RL和高效Atari训练，转向2024-2026年的大规模视频扩散与显式记忆、空间一致性和动作控制基准。
  - 开放问题：跨域与跨本体迁移、长期空间和记忆一致性、物理合理性以及与真实结果的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and multi-view simulation
      what_it_solves: Long-horizon, multi-view future video prediction for driving
        simulation and zero-shot scene validation across datasets.
      what_remains_open: Whether improvements on NuScenes/OpenDV/Waymo translate to
        real-world driving safety or operational outcomes.
    - line: Embodied robot video generation from language and actions
      what_it_solves: Compositional or physics-informed video generation for robot
        task planning, policy training, and action-free pretraining.
      what_remains_open: Evidence is limited for generalization to novel primitives,
        real-robot execution, and cross-embodiment transfer.
    - line: Model-based reinforcement learning with world models
      what_it_solves: Sample-efficient policy learning through latent imagination
        and contextual dynamics, including zero-shot generalization to unseen context
        values.
      what_remains_open: Observable context assumptions and narrow task suites leave
        broader generalization and deployment boundaries unclear.
    - line: Interactive world model benchmarks for memory and action
      what_it_solves: Datasets and metrics for spatial consistency, memory consistency,
        and action control in navigation and video-to-world settings.
      what_remains_open: Benchmark evidence does not yet identify which model improvements
        produce robust closed-loop agents across action spaces.
    consensus:
    - Recent work agrees on using action- or instruction-conditioned generative models
      to predict future observations or latent states, especially for robotics and
      driving.
    - Evaluation interest is shifting beyond single-scene visual quality toward cross-scene
      generalization, downstream policy utility, and consistency metrics.
    - Several works provide open datasets, code, or standard benchmark results, but
      some method papers do not report limitations or deployment failures.
    disagreements:
    - 'Representation choices differ: recurrent state-space or VAE-transformer models
      for RL contrast with diffusion transformer video models for scene generation.'
    - Supervision and auxiliary objectives differ across mask reconstruction, depth/keypoint
      dynamics, language-compositional primitives, and coupled action-video diffusion.
    - Evaluation targets diverge among driving metrics, robot video fidelity and downstream
      policy use, Atari human-normalized score, and memory or spatial consistency
      benchmarks.
    - Some approaches assume observable context or pre-defined primitives, while others
      learn from raw video and action data without explicit factorization.
    - Benchmark contributions prioritize dataset and metric construction, while method
      contributions report comparative gains, making direct evidence alignment difficult.
    open_questions:
    - Do gains in driving world models on NuScenes/OpenDV/Waymo predict safer closed-loop
      deployment?
    - Can robot world models generalize beyond training primitive combinations and
      simulated execution?
    - How should memory, spatial consistency, and action-control benchmarks be linked
      to downstream task success?
    - What level of physical or contextual supervision is needed without sacrificing
      transfer across domains?
    - Can shared pretraining deliver cross-embodiment and cross-domain improvements?
