  - 趋势演进：可用高排名论文证据集中在 2022-2026 年，从物理机器人 Dreamer 在线学习转向可控驾驶/世界视频模拟器与闭环自动驾驶，更多基准开始出现。
  - 开放问题：跨数据集与平台的泛化、长时域一致性、真实世界部署稳健性，以及独立复现缺口仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: World-model-based robot learning and deployment
      what_it_solves: Enables robots to learn control policies online from real interaction
        without hand-built simulators, using imagined rollouts for planning.
      what_remains_open: Hardware and task generalization, reset and infrastructure
        assumptions, and independent replication beyond a few robot systems.
    - line: Action-controllable video generative simulation
      what_it_solves: Turns video generative models into future-frame simulators conditioned
        on actions, trajectories, or high-level commands for driving and robotics.
      what_remains_open: Long-horizon action and cross-view consistency, distribution
        shift beyond training datasets, and scalable sub-second deployment.
    - line: Contextual and physics-informed dynamics modeling
      what_it_solves: Improves zero-shot or physically plausible rollouts by conditioning
        latent dynamics on context or joint physics tasks such as depth and keypoints.
      what_remains_open: Assumes observable context or task-specific physics cues;
        broader evaluation beyond limited benchmark tasks remains missing.
    - line: Benchmarks and evaluation frameworks for world models
      what_it_solves: Quantifies spatial consistency, action fidelity, visual quality,
        or dynamic consistency so different simulators can be compared.
      what_remains_open: Independent verification across datasets, environments, and
        metrics is still sparse; several claims rely on single benchmarks or incomplete
        result details.
    - line: Real-time closed-loop serving
      what_it_solves: Meets latency and interactivity requirements for online evaluation,
        policy training, or autonomous-driving simulation.
      what_remains_open: Scalability to multi-GPU or complex multi-camera scenes and
        robustness under out-of-distribution conditions are underexplored.
    consensus:
    - Recent work converges on learned world simulators as a shared substrate for
      embodied control and driving tasks.
    - Systems typically combine a dynamics or video prior with conditioning on actions,
      context, or physics and evaluate through quantitative benchmarks.
    - There is a common emphasis on producing runnable artifacts such as datasets,
      benchmarks, or systems, even though reproducibility evidence varies.
    - Downstream policy training or evaluation is treated as a practical validation
      target for simulator quality.
    disagreements:
    - 'Representation differs: some systems use recurrent state-space dynamics for
      latent imagination, while others use diffusion or autoregressive generation
      over pixels.'
    - 'Evaluation targets differ: spatial consistency, action fidelity, visual FID/FVD
      quality, zero-shot reinforcement-learning generalization, physical plausibility,
      and closed-loop latency are each privileged by different lines.'
    - 'Control and supervision signals differ: explicit observable context, trajectory
      or action instructions, keypoint and depth tasks, or historical-frame priors.'
    - 'Deployment setting differs: online physical-robot learning without a simulator
      versus dataset-driven game or autonomous-driving simulation creates different
      assumptions and constraints.'
    open_questions:
    - How well do these simulators generalize beyond nuScenes, Minecraft, CARL, or
      the few robot platforms in the evidence?
    - Can long-horizon rollouts maintain spatial and action consistency without the
      degradation noted in autoregressive or closed-loop settings?
    - What real-world deployment evidence exists for assumptions such as observable
      context, low-latency single-GPU serving, or sparse-reward robot learning?
    - Which benchmark metrics are sufficient to establish downstream policy improvement
      when several high-ranked papers lack full result, limitation, or code verification
      details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于世界模型的机器人学习与部署
      解决的问题: 让机器人在没有手工模拟器的情况下，从真实交互中在线学习控制策略，并利用想象轨迹进行规划。
      尚未覆盖: 跨硬件和任务的泛化、重置与基础设施假设，以及超越少数机器人平台的独立复现。
    - 路线: 动作可控的视频生成式模拟
      解决的问题: 将视频生成模型转化为由动作、轨迹或高层指令条件化的未来帧模拟器，用于驾驶和机器人任务。
      尚未覆盖: 长时域动作和跨视角一致性、训练数据集之外的分布偏移，以及可扩展的亚秒级部署。
    - 路线: 上下文与物理信息驱动的动力学建模
      解决的问题: 通过对潜在动力学加入上下文条件，或联合深度、关键点等物理任务，改善零样本或物理合理的推演。
      尚未覆盖: 假设上下文可观测或依赖任务特定的物理线索；在有限基准任务之外的更广泛评测仍缺失。
    - 路线: 世界模型基准与评估框架
      解决的问题: 量化空间一致性、动作忠实度、视觉质量或动态一致性，使不同模拟器可相互比较。
      尚未覆盖: 跨数据集、环境和指标的独立验证仍少；部分结论依赖单一基准或结果细节不完整。
    - 路线: 实时闭环服务
      解决的问题: 满足在线评测、策略训练或自动驾驶模拟中的延迟和交互性需求。
      尚未覆盖: 多GPU或复杂多相机场景的可扩展性，以及分布外条件下的稳健性尚未充分探索。
    共识:
    - 近期工作趋向于将学习到的世界模拟器作为具身控制和驾驶任务的共同基座。
    - 系统通常将动力学或视频先验与动作、上下文或物理条件结合，并通过量化基准进行评估。
    - 普遍强调产出数据集、基准或系统等可运行工件，尽管可复现性证据参差不齐。
    - 下游策略训练或评估被视为验证模拟器质量的实际目标。
    分歧:
    - 表示方式不同：有的系统使用循环状态空间动力学进行潜在想象，有的则对像素使用扩散或自回归视频生成。
    - 评测目标不同：空间一致性、动作忠实度、FID/FVD 视觉质量、零样本强化学习泛化、物理合理性和闭环延迟分别被不同路线优先关注。
    - 控制与监督信号不同：显式可观测上下文、轨迹或动作指令、关键点与深度任务，或历史帧先验。
    - 部署场景不同：无模拟器的在线物理机器人学习，与数据集驱动的游戏或自动驾驶模拟，带来了不同假设和约束。
    开放问题:
    - 这些模拟器在超出 nuScenes、Minecraft、CARL 或证据中的少数机器人平台后泛化能力如何？
    - 长时域推演能否在自回归或闭环设置中避免已提及的空间和动作退化？
    - 对于可观测上下文、单GPU低延迟服务或稀疏奖励机器人学习等假设，存在哪些真实部署证据？
    - 当若干高排名论文缺少完整结果、局限性或代码验证细节时，哪些基准指标足以支撑下游策略改进的结论？
