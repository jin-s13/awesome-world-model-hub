  related_work_outline_zh:
  - 主流方向：世界模型相关的综述与分类工作集中在生成式视频、自动驾驶和机器人想象，重点是把未来观测预测和闭环评测组织成清晰方向。
  - 研究共性：论文通过语言原语、持久全局状态、多模态控制信号或统一潜在设计分类引入结构，以提升一致性与可控性。
