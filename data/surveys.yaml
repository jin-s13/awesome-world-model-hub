  - 趋势演进：2023至2026年的证据显示，领域从宽泛综述和驾驶/机器人模拟器转向多模态可控预测、开源系统、持久视线外动态和资源感知评测，属于当前前沿内的演进。
  - 开放问题：哪些结构设计能超越训练组合泛化；闭环和视线外基准是否已实现且可比较；如何在真实世界中验证综述判断。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis of world models
      what_it_solves: Maps fragmented world-model directions across generative video,
        autonomous driving, and agents into design axes, milestones, and evaluation
        prescriptions.
      what_remains_open: Whether the synthesis is systematic and reproducible rather
        than selective, and whether conceptual taxonomies can be empirically validated.
    - line: Compositional and controllable world model construction
      what_it_solves: Introduces structured generation mechanisms such as language-based
        primitives, persistent global state, RGB/depth multimodal control, and open-source
        real-time simulation.
      what_remains_open: Generalization beyond training-seen compositions and standardized
        evidence for long-horizon, out-of-sight, or fine-grained control remain under-supported.
    - line: Simulation and closed-loop driving evaluation
      what_it_solves: Frames traffic simulation and autonomous driving as world models,
        unifying perception, prediction, and planning or configurable multi-agent
        motion prediction.
      what_remains_open: Closed-loop and resource-aware metric proposals are not yet
        implemented or validated, and several systems lack visible baseline, code,
        or real-world limitation evidence.
    - line: Open problem and gap mapping for benchmark design
      what_it_solves: Turns broad literature coverage into concrete evaluation gaps
        such as out-of-sight dynamics benchmarks and fine-grained object-control metrics.
      what_remains_open: Prioritization of which gaps matter most and cross-setting
        compatibility of benchmarks remain unresolved.
    consensus:
    - World models are treated as generative predictors of future visual or multimodal
      observations, with driving, robotics, and agent simulation as recurring application
      areas.
    - Explicit structure, such as language-derived primitives, persistent state, sparse
      features, ego-trajectories, or latent taxonomies, is used to improve consistency
      or controllability.
    - 'Evaluation is a shared weak point: papers call for closed-loop, long-horizon,
      and out-of-sight benchmarks while several method works omit systematic baselines
      or limitations.'
    disagreements:
    - 'Contribution type differs: conceptual taxonomy and roadmap works provide no
      experimental validation, while other works provide models, datasets, or quantitative
      benchmarks.'
    - 'Representation choices differ: continuous RGB/depth multimodal outputs, discrete
      next-token perception-prediction-planning, and persistent 3D entity/background
      state representations coexist.'
    - 'Evaluation targets differ: robot imagination in simulation, real-time open-source
      video generation, fine-grained ego-motion and object control, autonomous driving
      planning, and out-of-sight temporal dynamics.'
    - 'Deployment setting differs: some results are simulation-only, some target driving
      data and closed-loop behavior, and one emphasizes an open-source interactive
      ecosystem.'
    open_questions:
    - Which world-model design choices generalize beyond training-seen primitive combinations
      or fixed driving datasets?
    - Are proposed closed-loop, resource-aware, and out-of-sight benchmark metrics
      actually implemented and comparable across settings?
    - What evidence would turn survey claims about physical-law comprehension or persistent-state
      simulation into verified real-world conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的分类与路线图综合
      解决的问题: 将生成式视频、自动驾驶和自主智能体等碎片化方向整理成设计轴、里程碑和评测建议。
      尚未覆盖: 综合是否基于系统证据和可复现流程，以及概念分类能否得到实证验证。
    - 路线: 组合式与可控世界模型构建
      解决的问题: 通过语言原语、持久全局状态、RGB/深度多模态控制和开源实时模拟引入结构，提升一致性或可控性。
      尚未覆盖: 训练组合之外的泛化，以及长时程、视线外和细粒度控制的标准化证据仍不足。
    - 路线: 自动驾驶仿真与闭环评测
      解决的问题: 将交通仿真和自动驾驶建为世界模型，统一感知、预测和规划，或配置多智能体运动预测。
      尚未覆盖: 闭环与资源感知指标尚未实施或验证，部分系统缺少基线、代码和真实世界限制说明。
    - 路线: 基准设计的开放问题与缺口映射
      解决的问题: 把文献覆盖转化为具体评测缺口，如视线外动态基准和细粒度物体控制指标。
      尚未覆盖: 哪些缺口应优先解决，以及不同基准之间是否可比较仍不明确。
    共识:
    - 世界模型被普遍视为未来视觉或多模态观测的生成式预测器，驾驶、机器人和智能体仿真是常见应用领域。
    - 显式结构被用于提高一致性或可控性，包括语言原语、持久状态、稀疏特征、自我轨迹和潜在分类。
    - 评测是共同薄弱环节：论文呼吁闭环、长时程和视线外基准，但不少方法文献缺少系统基线或限制说明。
    分歧:
    - 贡献类型不同：概念分类和路线图工作没有实验验证，而其他工作提供模型、数据集或量化基准。
    - 表示方式不同：连续RGB/深度多模态输出、离散下一令牌感知-预测-规划和持久3D实体/背景状态共存。
    - 评测目标不同：机器人想象、实时视频生成、细粒度自运动与物体控制、自动驾驶规划和视线外动态分别被强调。
    - 部署场景不同：有仿真为主，有驾驶数据闭环，也有强调开源交互生态的方案。
    开放问题:
    - 哪些世界模型设计选择能泛化到训练期原语组合或固定驾驶数据之外的场景？
    - 所提出的闭环、资源感知和视线外基准指标是否真正实现并跨设置可比？
    - 需要何种证据才能将关于物理规律理解或持久状态模拟的综述判断转化为真实世界可验证结论？
