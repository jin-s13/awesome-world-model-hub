  related_work_outline_zh:
  - 主流方向：主流工作将生成式未来视频世界模型作为可运行系统组件，用于仿真、策略训练和策略评测；代表工作包括Vista、Terra ACT-Bench、FAR-Drive、RynnWorld-Latent。
  - 研究共性：论文通常将条件生成模型与特定基准或下游任务配对，通过动作、上下文、结构化控制或物理侧信号来改善可控性与保真度。
  - 关键差异：表示与监督方式不同：cRSSM使用上下文潜在动力学，RoboScape使用物理信息深度与关键点任务，RynnWorld-Latent使用通用潜在动作，FAR-Drive采用帧级多相机自回归并强调低延迟。
  - 趋势演进：可见高排序证据集中在2024-2026前沿，从基准构建和动作保真度诊断走向闭环、跨具身和低延迟系统级生成。
  - 开放问题：一致性或保真度基准能否预测真实部署，跨具身迁移能否跨机器人复现，以及长时程闭环生成在窄数据集之外是否仍然鲁棒。
  literature_review:
    line_of_work_matrix:
    - line: Action- and context-conditioned world models for closed-loop future prediction
      what_it_solves: Generates future observations under specified controls or contexts,
        enabling policy training and evaluation in simulated rollouts.
      what_remains_open: Assumes observable context or a shared action interface;
        cross-environment generalization is tested only on selected tasks and not
        independently reproduced across teams.
    - line: Benchmark and dataset construction for world-model consistency and action
        fidelity
      what_it_solves: Creates reusable datasets and quantitative metrics to reveal
        when generated video violates spatial or action-following constraints.
      what_remains_open: Metrics are domain-specific and no cross-benchmark agreement
        exists; artifact availability is stronger than independent methodological
        verification.
    - line: Physics-informed and cross-embodiment generative models
      what_it_solves: Improves generated motion plausibility and transfer across human,
        robot, and simulation interaction data via physics signals or latent action
        alignment.
      what_remains_open: Physical knowledge often remains implicit, and cross-embodiment
        gains are shown on selected platforms with limited visible code or defect
        reporting.
    - line: Real-time autonomous driving simulation and deployment stacks
      what_it_solves: Produces multi-camera closed-loop future video with low inference
        latency for driving simulation and reward evaluation.
      what_remains_open: Evaluation is concentrated on nuScenes and single-GPU deployment;
        long-horizon consistency and out-of-distribution sensor/environment robustness
        remain unresolved.
    consensus:
    - Generative future-video models are treated as system-like components that can
      support policy training, policy evaluation, or closed-loop simulation.
    - Conditioning on actions, context, structured control, or physics side signals
      is considered necessary for controllability and deployable fidelity.
    - Evaluation combines visual quality with domain-specific consistency, action
      following, or downstream policy success rather than a unified metric.
    - 'Reproducibility evidence is uneven: benchmark-oriented work tends to show stronger
      dataset and artifact signals, while large-scale method/system work often lacks
      visible code or limitation details.'
    disagreements:
    - 'Representation: structured multi-camera video, 3D-grounded universal latent
      actions, contextual recurrent states, or physics-informed depth and keypoint
      signals.'
    - 'Evaluation target: spatial consistency, action fidelity, video quality, downstream
      policy success, or closed-loop inference latency.'
    - 'Deployment setting: single-GPU low-latency driving simulation versus large
      multi-dataset cross-embodiment pretraining versus benchmark-driven diagnostic
      evaluation.'
    - 'Controllability interface: high-level commands, trajectories and angles, observed
      context parameters, or learned latent action tokens.'
    open_questions:
    - Does benchmark-level spatial or action consistency predict real closed-loop
      deployment performance across hardware, sensors, and environments?
    - Which action or physics representation best transfers across embodiments without
      requiring native shared action spaces?
    - Can low-latency driving simulators maintain long-horizon cross-view consistency
      beyond nuScenes-like settings and standard conditions?
    - What independent reproduction would be needed given missing code, dataset, baseline,
      or limitation details in several top-ranked papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向闭环预测的动作与上下文条件世界模型
      解决的问题: 在指定控制或上下文中生成未来观测，支持策略在模拟轨迹中的训练和评估。
      尚未覆盖: 假设上下文可观测或存在共享动作接口；跨环境泛化只在选定任务上验证，缺少跨团队独立复现。
    - 路线: 用于世界模型一致性和动作保真度的基准与数据集构建
      解决的问题: 通过可复用数据集和定量指标，发现生成视频是否违反空间或动作跟随约束。
      尚未覆盖: 指标具有领域特异性且缺少跨基准共识；工件可用性较强，但不等于方法得到独立验证。
    - 路线: 物理信息驱动与跨具身生成模型
      解决的问题: 通过物理信号或潜在动作对齐，改善生成运动的合理性以及人类、机器人和仿真交互数据之间的迁移。
      尚未覆盖: 物理知识常为隐式表示，跨具身提升只在选定平台展示，代码和缺陷报告可见度有限。
    - 路线: 实时自动驾驶仿真与部署栈
      解决的问题: 生成多相机闭环未来视频，并以低推理延迟支撑驾驶仿真和奖励评估。
      尚未覆盖: 评估集中在nuScenes和单GPU部署；长时程一致性以及分布外传感器与环境鲁棒性仍未解决。
    共识:
    - 生成式未来视频模型被视为类系统组件，可用于策略训练、策略评估或闭环仿真。
    - 通过动作、上下文、结构化控制或物理侧信号进行条件化，被认为是可控性和可部署保真度所必需。
    - 评估通常结合视觉质量与领域特定一致性、动作跟随或下游策略成功率，而非统一指标。
    - 复现证据不均衡：以基准为主的工作通常有更强数据集和工件信号，而大规模方法或系统工作常缺少可见代码或局限性说明。
    分歧:
    - 表示方式：结构化多相机视频、3D接地的通用潜在动作、上下文循环状态，或物理信息深度与关键点信号。
    - 评测目标：空间一致性、动作保真度、视频质量、下游策略成功率或闭环推理延迟。
    - 部署场景：单GPU低延迟驾驶仿真，大规模多数据集跨具身预训练，或基准驱动的诊断评估。
    - 可控性接口：高层指令、轨迹与角度、观测上下文参数，或学习到的潜在动作token。
    开放问题:
    - 基准层面的空间一致性或动作跟随是否预测跨硬件、传感器和环境的真实闭环部署性能？
    - 哪种动作或物理表示最能在不依赖原生共享动作空间的情况下跨具身迁移？
    - 低延迟驾驶仿真能否在类似nuScenes的设置和标准条件之外保持长时程跨视角一致性？
    - 在多篇高排序论文缺少代码、数据集、基线或局限性细节时，需要何种独立复现才能验证可靠性？
