    rather than visual quality alone; open-source datasets or benchmarks are common
    but reproducibility signals vary.'
  - 'Key differences: Work divides between evaluation-artifact emphasis, model-centric
    conditioning, and system-level real-time serving. Supervision varies from explicit
    context and action trajectories to physics auxiliary losses and universal latent
    actions.'
  - 'Trend evolution: Visible top papers move from contextual world models for zero-shot
    generalization in 2024 toward physics-informed and driving/cross-embodiment systems
    with closed-loop or low-latency constraints in 2024-2026. Older years appear in
    the span but are absent from top evidence.'
  - 'Open questions: Generalization beyond narrow datasets, long-horizon degradation,
    multi-GPU deployment scalability, reproducibility of artifact-light systems, and
    whether conditioning assumptions survive real-world setting changes remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建和评测生成式世界模型作为仿真、策略训练和闭环部署的系统级工件，尤其用于自动驾驶与机器人。示例包括动作可控驾驶仿真器和物理信息具身预测器。
  - 研究共性：将大规模视频或帧数据与条件生成结合，并通过基准指标和下游任务成功率进行评测，而非只看视觉质量；常发布开源数据集或基准，但复现信号参差。
  - 关键差异：工作分为评测工件导向、模型中心条件建模、以及系统级实时服务；监督信号从显式上下文、动作轨迹到物理辅助损失和通用潜在动作不等。
  - 趋势演进：可见顶会论文从面向零样本泛化的上下文世界模型（2024）转向物理信息和驾驶/跨具身系统，强调闭环或低延迟（2024-2026）；年份范围包含早期，但顶部证据中缺失。
  - 开放问题：窄数据集之外的泛化、长时域退化、多GPU部署扩展性、低工件系统复现性，以及条件假设在真实世界变化下是否成立仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model evaluation protocols
      what_it_solves: Measures whether generated rollouts preserve spatial consistency
        or action fidelity under loop navigation and driving trajectories.
      what_remains_open: Evaluation is limited mainly to Minecraft or nuScenes; abstract
        and limitation details are often incomplete, so deployment-boundary testing
        is not established.
    - line: Context- and physics-conditioned world models for policy learning
      what_it_solves: Conditions latent dynamics or video generation on context, depth,
        and keypoint physics to improve zero-shot generalization or downstream robot
        policy training.
      what_remains_open: Assumes meaningful context observability or useful physics
        cues; evidence covers only a few tasks, and model limitations are not fully
        reported.
    - line: Closed-loop driving simulation and low-latency video generation systems
      what_it_solves: Produces controllable multi-camera driving video for simulation
        and policy evaluation while maintaining sub-second single-GPU latency.
      what_remains_open: Demonstrated mainly on nuScenes; long-horizon cross-view
        consistency and multi-GPU or distributed deployment remain unresolved.
    - line: Cross-embodiment video generation and synthetic demonstration pipelines
      what_it_solves: Uses shared 3D-grounded latent actions to pretrain across human,
        robot, and simulation data, then generates demonstrations for downstream policy
        improvement.
      what_remains_open: Artifact availability is weak; independent reproduction and
        scaling to unseen embodiments or action spaces remain unverified.
    consensus:
    - Treats world models as full systems in which generation, conditioning, data,
      and evaluation are addressed together.
    - Uses benchmark metrics or downstream task success as evidence, not only qualitative
      video fidelity.
    - Values open-access datasets, benchmarks, or code, though reproducibility signals
      vary across systems.
    - Improves control fidelity through explicit actions, context, physics, or latent
      interfaces rather than relying on unconditional generation alone.
    disagreements:
    - Some contributions emphasize evaluation artifacts, others model architecture,
      and others deployment-serving constraints.
    - 'Conditioning choices differ: scalar context, trajectory or action control,
      physics auxiliary tasks, and universal latent actions.'
    - 'Evaluation targets differ: spatial navigation consistency, driving action adherence,
      and robot policy success.'
    - 'Deployment settings differ: offline open-loop metrics, low-latency closed-loop
      serving, and synthetic demonstration generation.'
    - 'Base models differ: video transformer, diffusion transformer, recurrent state-space
      model, and physics-informed architectures.'
    open_questions:
    - Do results transfer beyond the narrow evaluation environments such as nuScenes,
      CARL, Minecraft, and LIBERO?
    - What failure modes emerge under long-horizon closed-loop rollout, and which
      training or inference strategies best control them?
    - Can low-latency serving be maintained under multi-GPU or distributed deployment
      without losing controllability?
    - How reproducible are methods with weak or missing artifact signals, especially
      cross-embodiment and closed-loop system papers?
    - Which conditioning assumptions remain valid when context is partially observed
      or action spaces change across robots?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型评测协议
      解决的问题: 衡量生成推演是否在循环导航和驾驶轨迹中保持空间一致性或动作忠实度。
      尚未覆盖: 评测主要集中在Minecraft或nuScenes；摘要与局限性细节常不完整，部署边界测试不足。
    - 路线: 面向策略学习的上下文与物理条件世界模型
      解决的问题: 通过上下文、深度和关键点物理条件化潜在动力学或视频生成，提升零样本泛化或下游机器人策略训练。
      尚未覆盖: 假设有意义上下文或物理线索可观测；证据覆盖任务较少，模型局限性报告不完整。
    - 路线: 闭环驾驶仿真与低延迟视频生成系统
      解决的问题: 生成可控多相机驾驶视频用于仿真和策略评估，同时保持单GPU亚秒级延迟。
      尚未覆盖: 主要在nuScenes上展示；长时域跨视角一致性和多GPU或分布式部署未解决。
    - 路线: 跨具身视频生成与合成演示流水线
      解决的问题: 使用共享3D潜在动作在人类、机器人和仿真数据上预训练，并生成演示以改进下游策略。
      尚未覆盖: 工件可用性弱；独立复现与扩展至未见具身或动作空间仍未验证。
    共识:
    - 将世界模型视为完整系统，同时处理生成、条件、数据和评测。
    - 使用基准指标或下游成功率作为证据，而非只依赖定性视频保真度。
    - 重视开放数据、基准或代码，但复现信号参差不齐。
    - 通过显式动作、上下文、物理或潜在接口改善控制保真度，而不是仅做无条件生成。
    分歧:
    - 部分工作侧重评测工件，部分侧重模型架构，部分侧重部署服务约束。
    - 条件方式不同：标量上下文、轨迹或动作控制、物理辅助任务和通用潜在动作。
    - 评测目标不同：空间导航一致性、驾驶动作遵循和机器人策略成功率。
    - 部署设置不同：离线开环指标、低延迟闭环服务和合成演示生成。
    - 基础模型不同：视频Transformer、扩散Transformer、循环状态空间模型和物理信息架构。
    开放问题:
    - 结果能否迁移到nuScenes、CARL、Minecraft和LIBERO之外的窄评估环境？
    - 长时域闭环推演会出现哪些失败模式，哪些训练或推理策略最有效？
    - 多GPU或分布式部署下能否在不损失可控性的同时保持低延迟服务？
    - 工件信号弱或缺失的方法，特别是跨具身和闭环系统论文，复现性如何？
    - 当上下文部分可观测或动作空间跨机器人变化时，哪些条件假设仍然成立？
