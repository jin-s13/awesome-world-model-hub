  related_work_outline:
  - 'Mainstream direction: Current high-scoring evidence centers on evaluating world
    models through closed-loop, action-conditioned video and downstream control tasks,
    with driving, robotics, games, and open-domain navigation as recurring testbeds.'
  - 'Shared research pattern: Work tends to introduce evaluation data or protocols
    that probe consistency and control, such as loop closure, long-horizon rollout,
    memory persistence, and zero-shot transfer, rather than only frame-level realism.'
  - 'Key differences: Evaluations differ in control modality, metric target, and supervision
    type, including driving multi-view prediction, first-person navigation, robot
    manipulation, human-normalized game scores, scene-graph consistency, paired video-action,
    action-free video, and context-conditioned dynamics.'
  - 'Trend evolution: In the visible top evidence, the frontier shifts from 2023-2024
    sample-efficient game world models toward 2025-2026 benchmark constructions for
    spatial, memory, and action-control consistency in open-ended video.'
  - 'Open questions: It remains unclear whether proxy consistency metrics predict
    downstream policy quality, whether benchmark claims generalize across domains
    and compute budgets, and how much reproducibility can be verified given missing
    limitation and metadata evidence.'
  related_work_outline_zh:
  - 主流方向：当前高分工作聚焦于通过闭环、动作条件视频和下游控制任务评估世界模型；驾驶、机器人、游戏和开放域导航是常见测试场景。
  - 研究共性：评估数据或协议通常检验一致性与控制能力，如循环闭合、长时域推演、记忆保持和零样本泛化，而非仅关注帧级真实感。
  - 关键差异：评估在控制模态、指标目标和监督类型上不同，包括驾驶多视角预测、第一人称导航、机器人操作、人类归一化游戏分数、场景图一致性、成对视频-动作、无动作视频和上下文条件动力学。
  - 趋势演进：在可见的高分证据中，前沿从2023-2024年的样本高效游戏世界模型，转向2025-2026年针对空间一致性、记忆与动作控制一致性的开放域视频基准构建。
  - 开放问题：代理一致性指标与下游策略质量是否一致仍不清楚；基准结论在不同任务域和算力预算下是否稳定；由于缺乏局限性与元数据证据，可复现性存在验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop video-action benchmark and dataset design
      what_it_solves: Creates shared navigation, robotic, or open-domain video-action
        tasks for testing memory consistency, action control, and spatial loop closure
        in world models.
      what_remains_open: Whether these collections cover long-horizon, cross-action-space,
        and multi-domain conditions where world models are expected to be deployed
        remains unclear.
    - line: Metric and stress-test design for consistency and control
      what_it_solves: Moves beyond aggregate realism by probing scene-graph consistency,
        loop closure, action controllability, zero-shot transfer, and human-normalized
        control scores.
      what_remains_open: Proxy scores are not yet clearly aligned with downstream
        decision utility or shown to be stable across pixel variation, viewpoint change,
        and evaluation implementations.
    - line: Comparable baselines and downstream evaluation suites
      what_it_solves: Provides shared game, driving, contextual control, and large-scale
        robot evaluation settings for comparing model-based control and video generation.
      what_remains_open: Many evaluations use few tasks or report only aggregate wins,
        and sparse limitation sections or metadata leave stability across compute
        and implementations uncertain.
    consensus:
    - World-model evaluation increasingly uses closed-loop or action-conditioned generation
      rather than only open-loop frame prediction.
    - There is shared emphasis on long-horizon consistency such as spatial closure,
      temporal stability, zero-shot transfer, or memory persistence.
    - Benchmarks often combine visual quality with downstream control metrics, including
      human-normalized reward or task success, to avoid relying only on aggregate
      realism.
    - Large-scale video-action data are treated as a route to more generalizable and
      reusable evaluation across environments.
    disagreements:
    - 'Evaluation targets differ: some work optimizes sample-efficient game control,
      while others stress long-horizon driving transfer or open-domain memory and
      action control.'
    - 'Representation and supervision differ: some evaluations rely on paired video-action
      trajectories, while others use action-free video, context-conditioned dynamics,
      or multi-view driving data.'
    - 'Metric priorities differ: visual fidelity, physics plausibility, scene-graph
      consistency, and downstream policy reward are not fully aligned across studies.'
    - 'Interaction and deployment settings differ: first-person navigation, third-person
      video, driving scenes, and robot manipulation create different evaluation boundaries.'
    open_questions:
    - Do improvements in spatial consistency, visual detail, or memory scores lead
      to better downstream robot or driving policies?
    - Can current benchmarks separate long-term world-model memory from short-horizon
      visual prediction under distribution shift and unseen action spaces?
    - Are benchmark rankings stable across datasets, evaluation code, and compute
      budgets when limitation and reproducibility metadata are sparse?
    - How should evaluation balance open-loop realism against closed-loop decision
      utility in safety-relevant deployment settings?
    - Which reproducibility and impact claims remain unverified when limitation sections
      and citation metadata are absent from the visible top evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环视频-动作基准与数据集设计
      解决的问题: 构建共享导航、机器人或开放域视频-动作任务，测试世界模型的记忆一致性、动作控制和空间循环闭合。
      尚未覆盖: 这些集合是否覆盖长时域、跨动作空间和多域部署设置仍不清楚。
    - 路线: 一致性与控制的指标和压力测试设计
      解决的问题: 在聚合真实感之外，检验场景图一致性、循环闭合、动作可控性、零样本迁移和人类归一化控制分数。
      尚未覆盖: 代理分数尚未与下游决策效用对齐，且对像素变化、视角改变和评估实现是否稳定缺乏证据。
    - 路线: 可比基线与下游评估套件
      解决的问题: 提供共享游戏、驾驶、上下文控制和大规模机器人评估设置，以比较基于模型的控制与视频生成。
      尚未覆盖: 许多评估只覆盖少量任务或仅报告总体提升；局限性说明和元数据稀疏，使跨算力和实现稳定性不确定。
    共识:
    - 世界模型评估越来越多采用闭环或动作条件生成，而非仅进行开放帧预测。
    - 共同关注长时域一致性，包括空间闭合、时间稳定性、零样本迁移或记忆保持。
    - 基准常将视觉质量与下游控制指标结合，如人类归一化奖励或任务成功率，以避免只依赖总体真实感。
    - 大规模视频-动作数据被视为跨环境更可泛化、可复用评估的路径。
    分歧:
    - 评估目标不同：有的优化样本高效游戏控制，有的强调长时域驾驶迁移或开放域记忆与动作控制。
    - 表示和监督不同：有的依赖成对视频-动作轨迹，有的使用无动作视频、上下文条件动力学或多视角驾驶数据。
    - 指标优先级不同：视觉保真、物理合理性、场景图一致性和下游策略奖励并不完全一致。
    - 交互和部署场景不同：第一人称导航、第三人称视频、驾驶场景和机器人操作形成不同的评估边界。
    开放问题:
