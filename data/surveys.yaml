  - 开放问题：基准一致性与视频预测提升能否转化为真实安全与机器人执行；不可见上下文、原语、本体与动作空间如何泛化；物理/动作耦合生成如何超越视觉保真度评测。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for long-horizon and multi-view scene prediction
      what_it_solves: Generates future driving video across datasets and viewpoints,
        using video mask reconstruction and diffusion transformers to improve generalization
        beyond training scenes.
      what_remains_open: Evidence covers video prediction improvements on NuScenes,
        OpenDV-2K, and Waymo but does not connect them to closed-loop driving safety
        or real deployment outcomes.
    - line: Embodied robot world models with action and video coupling
      what_it_solves: Learns task-conditioned video generation or action-video dynamics
        for robot policy learning, compositional goal generalization, and physics-informed
        visual realism.
      what_remains_open: Generalization is bounded by seen primitives and simulation
        evaluation; real-robot transfer and novel primitive/embodiment coverage remain
        unverified.
    - line: Model-based reinforcement learning world models for control and zero-shot
        generalization
      what_it_solves: Uses latent world models to train policies from imagined rollouts
        and improve sample efficiency or zero-shot context generalization on Atari
        and contextual control benchmarks.
      what_remains_open: Assumes observable context in contextual RL and is evaluated
        on narrow task sets; broader task, dynamics, and real-world transfer are not
        shown.
    - line: World-model evaluation benchmarks for consistency and action control
      what_it_solves: Provides datasets and metrics for spatial consistency, memory
        consistency, and action controllability in open interactive environments.
      what_remains_open: Benchmark scores are not yet linked to downstream policy
        or deployment performance, and long-horizon/cross-action-space generalization
        remains difficult.
    consensus:
    - World models are treated as learned generative or dynamics models conditioned
      on task-relevant signals such as actions, goals, language, context, or physics.
    - Recent methods favor scalable sequence or diffusion architectures for high-dimensional
      visual prediction and policy learning.
    - Evaluation is moving beyond pixel-level generation quality toward consistency,
      controllability, zero-shot transfer, and downstream policy utility.
    - Most evidence remains based on simulated, offline, or benchmark data rather
      than real-world deployment.
    disagreements:
    - Representation choices span recurrent state-space latent dynamics, Transformer/VAE
      stochastic models, diffusion transformers, and physics-informed video models.
    - 'Supervision differs: some use self-supervised mask reconstruction or video
      generation, others use model-based RL imagined rollouts, and others couple action
      and video diffusion.'
    - Evaluation targets differ across Atari human-normalized control, contextual
      zero-shot generalization, driving video prediction, robot simulation, and open-domain
      memory/action benchmarks.
    - Interaction settings differ from closed-loop policy learning and action-conditioned
      generation to open-loop future video prediction and benchmark-only consistency
      tests.
    open_questions:
    - Do spatial and memory consistency metrics predict downstream robot or driving
      policy success in real settings?
    - What assumptions limit transfer when context variables are unobservable, primitives
      are unseen, or action spaces and embodiments change?
    - How should physics-informed and action-coupled generative models be evaluated
      beyond visual fidelity to capture physical plausibility and safety?
    - Can multi-dataset driving video improvements translate into closed-loop safety
      outcomes across vehicles, sensors, and regions?
