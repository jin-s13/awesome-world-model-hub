  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    and VAE-Transformer hybrids, trained via self-supervised video prediction with
    auxiliary tasks such as mask reconstruction, physics-informed losses, or joint
    action-video diffusion, targeting driving and robotic domains with emphasis on
    generalization and physical plausibility.'
  - 'Shared research pattern: All works learn environment dynamics through generative
    modeling of visual sequences, leverage large-scale datasets for pretraining, and
    aim to produce rollouts that support downstream policy learning or planning.'
  - 'Key differences: Architectures diverge between pure diffusion (MaskGWM, UWM),
    VAE-Transformer (STORM), and physics-augmented designs (RoboScape); action interfaces
    range from explicit conditioning (UWM) to latent imagination (cRSSM); evaluation
    targets split among visual fidelity, policy performance, spatial consistency,
    and memory-action control.'
  - 'Trend evolution: From 2018–2020 foundational world models (e.g., Dreamer lineage)
    to 2023–2025 diffusion-based and compositional models, and toward 2025–2026 physics-informed,
    unified action-video, and dedicated benchmarks for memory and closed-loop control,
    reflecting a shift from open-loop generation to controllable, evaluable world
    simulators.'
  - 'Open questions: How to achieve zero-shot generalization without assuming observable
    context; whether compositional generation can extend to entirely novel primitives;
    how to unify evaluation of long-term memory, action control, and physical plausibility;
    and to what extent reported gains are attributable to the model architecture versus
    the planner, data scale, or task prior.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和VAE-Transformer混合架构为核心的生成式世界模型，通过自监督视频预测辅以掩码重建、物理信息损失或动作-视频联合扩散等辅助任务进行训练，面向驾驶与机器人场景，强调泛化能力与物理合理性。
  - 研究共性：均通过视觉序列的生成建模学习环境动力学，利用大规模数据集预训练，并旨在生成可支持下游策略学习或规划的视频推演。
  - 关键差异：架构在纯扩散（MaskGWM、UWM）、VAE-Transformer（STORM）和物理增强设计（RoboScape）之间分化；动作接口从显式条件化（UWM）到潜在想象（cRSSM）不等；评测目标分为视觉保真度、策略性能、空间一致性以及记忆-动作控制。
  - 趋势演进：从2018–2020年基础世界模型（如Dreamer系列）到2023–2025年基于扩散和组合式的模型，再到2025–2026年物理信息驱动、统一动作-视频框架以及针对记忆和闭环控制的专用基准，反映出从开环生成向可控、可评估的世界模拟器转变。
  - 开放问题：如何在不假设上下文可观测的前提下实现零样本泛化；组合式生成能否扩展到全新原语；如何统一评估长期记忆、动作控制和物理合理性；以及所报告的性能增益在多大程度上归因于模型架构本身而非规划器、数据规模或任务先验。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model concepts into concrete architectures, loss
        functions, and training recipes, e.g., diffusion transformers with mask reconstruction,
        VAE-Transformer hybrids, compositional video generation from language, physics-informed
        joint learning, and unified video-action diffusion.
      what_remains_open: Which design choices transfer beyond the reported task family;
        whether mask reconstruction or physics losses generalize to non-driving/non-robotic
        domains; and how to handle unobservable context or novel primitives without
        retraining.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decision-time interfaces by training
        policies on imagined rollouts, flexibly representing policies and forward/inverse
        dynamics within a single model, or generating video plans for robot execution.
      what_remains_open: How much of the performance gain originates from the world
        model versus the planner, controller, or task-specific prior; and whether
        these interfaces support closed-loop control under long-horizon memory constraints.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects through dedicated benchmarks for spatial consistency,
        memory, and action control, and through explicit limitation statements.
      what_remains_open: Whether evidence isolates the proposed method rather than
        surrounding system choices; many works lack ablation studies or limitation
        analysis, and existing benchmarks have not yet been widely adopted to compare
        across model families.
    consensus:
    - Generative video prediction is the dominant paradigm for learning world dynamics,
      with diffusion models and Transformers becoming the default backbone.
    - Large-scale pretraining on diverse datasets improves generalization and robustness
      of the learned dynamics.
    - Incorporating auxiliary tasks or modalities (mask reconstruction, depth, keypoints,
      language, actions) enhances visual fidelity and physical plausibility.
    - World models are increasingly evaluated not only on generation quality but also
      on downstream task performance such as policy learning or planning.
    disagreements:
    - 'Architecture choice: some works favor VAE-based stochastic models for efficiency
      and latent planning, while others adopt diffusion-based deterministic or conditional
      generation for higher visual quality.'
    - 'Action integration: actions are either treated as explicit conditioning inputs
      to the video generator or implicitly modeled through latent dynamics and imagination,
      with no consensus on which yields better control.'
    - 'Evaluation focus: benchmarks emphasize different axes—visual realism, zero-shot
      policy generalization, spatial consistency, or memory-action control—making
      cross-paper comparison difficult.'
    - 'Physical grounding: some models inject explicit physics signals (depth, keypoints),
      while others rely purely on data-driven generation, leaving open whether explicit
      physics is necessary for real-world transfer.'
    open_questions:
    - Can world models achieve zero-shot generalization to unseen dynamics without
      assuming observable context variables?
    - How can compositional generation be extended to entirely novel object-action
      combinations beyond the training primitive set?
    - What is the minimal evaluation protocol that simultaneously measures long-term
      memory consistency, closed-loop action control, and physical plausibility?
    - To what extent do reported improvements stem from the world model architecture
      versus the scale and diversity of the pretraining data or the downstream policy
      optimizer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念落实为具体架构、损失函数和训练配方，例如扩散Transformer加掩码重建、VAE-Transformer混合、基于语言的组合视频生成、物理信息联合学习以及统一视频-动作扩散。
      尚未覆盖: 哪些设计选择能迁移到报告任务族之外；掩码重建或物理损失能否泛化到非驾驶、非机器人领域；以及如何在不重新训练的情况下处理不可观测上下文或全新原语。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策时接口，通过在想象轨迹上训练策略、在单一模型中灵活表示策略和前向/逆向动力学，或生成视频计划用于机器人执行。
      尚未覆盖: 性能增益有多少来自世界模型本身，而非规划器、控制器或任务特定先验；这些接口是否支持长时域记忆约束下的闭环控制。
    - 路线: 方法证据与消融协议
      解决的问题: 通过针对空间一致性、记忆和动作控制的专用基准，以及明确的局限性声明，区分方法贡献与数据集、基线、指标和实现因素的影响。
      尚未覆盖: 证据是否真正隔离了所提方法而非周边系统选择；许多工作缺乏消融研究或局限性分析，现有基准尚未被广泛采用以跨模型族进行比较。
    共识:
    - 生成式视频预测是学习世界动力学的主导范式，扩散模型和Transformer正成为默认骨干。
    - 在多样化数据集上进行大规模预训练可提升所学动力学的泛化性和鲁棒性。
    - 引入辅助任务或模态（掩码重建、深度、关键点、语言、动作）能增强视觉保真度和物理合理性。
    - 世界模型的评估日益超越生成质量，延伸至策略学习或规划等下游任务表现。
    分歧:
    - 架构选择：部分工作偏好基于VAE的随机模型以追求效率和潜在规划，而另一些采用基于扩散的确定性或条件生成以获得更高视觉质量。
    - 动作整合：动作或被作为显式条件输入视频生成器，或通过潜在动力学和想象隐式建模，尚未就哪种方式能提供更好的控制达成共识。
    - 评估重心：各基准强调不同维度——视觉真实感、零样本策略泛化、空间一致性或记忆-动作控制——导致跨论文比较困难。
    - 物理基础：一些模型注入显式物理信号（深度、关键点），而其他模型完全依赖数据驱动生成，显式物理对于真实世界迁移是否必要仍无定论。
    开放问题:
    - 世界模型能否在不假设上下文变量可观测的情况下实现对未见动力学的零样本泛化？
    - 组合式生成如何扩展到训练原语集之外的全新物体-动作组合？
    - 能够同时衡量长期记忆一致性、闭环动作控制和物理合理性的最小评估协议是什么？
    - 所报告的性能提升在多大程度上源于世界模型架构，而非预训练数据的规模和多样性或下游策略优化器？
