  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from single-dimensional
    visual quality (e.g., Atari normalized scores) to multi-dimensional benchmarks
    that jointly assess spatial consistency, memory, action control, and physical
    plausibility across diverse domains.'
  - 'Shared research pattern: All works use video generation or state prediction as
    the core evaluation task, adopt standardized benchmarks or propose new datasets,
    and emphasize open-source code and artifacts to enable reproducibility.'
  - 'Key differences: Domains vary widely (autonomous driving, robotics, games, open-world),
    evaluation dimensions differ (visual detail, spatial consistency, memory, action
    control), and metrics are not unified (FVD, human-normalized score, scene graph
    consistency score).'
  - 'Trend evolution: From 2023–2024 Atari-focused benchmarks emphasizing training
    efficiency and visual fidelity, the field moved in 2025–2026 to driving, robotics,
    and open-world settings with stress tests for long-term memory, cross-view consistency,
    and physics-informed generation.'
  - 'Open questions: There is no unified cross-domain evaluation protocol; the alignment
    between proxy metrics and downstream decision utility remains unverified; and
    long-term physical consistency evaluation is still immature.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从单一维度视觉质量（如Atari归一化得分）转向多维度基准，联合评估空间一致性、记忆、动作控制和物理合理性，覆盖多个领域。
  - 研究共性：所有工作均以视频生成或状态预测为核心评估任务，采用标准化基准或提出新数据集，并强调开源代码和工件以提升可复现性。
  - 关键差异：评估领域差异显著（自动驾驶、机器人、游戏、开放世界），评估维度不同（视觉细节、空间一致性、记忆、动作控制），指标不统一（FVD、人类归一化得分、场景图一致性分数）。
  - 趋势演进：从2023–2024年以Atari为焦点的基准（关注训练效率与视觉保真度），演进到2025–2026年面向驾驶、机器人和开放世界的基准，引入长期记忆、跨视角一致性和物理驱动生成的应力测试。
  - 开放问题：缺乏统一的跨领域评估协议；代理指标与下游决策效用的对齐尚未验证；长期物理一致性评估方法仍不成熟。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world-model evaluation
      what_it_solves: Creating shared tasks and datasets that enable comparable measurement
        of world-model capabilities beyond simple video prediction, such as spatial
        consistency and memory.
      what_remains_open: Whether the task distributions cover the full range of real-world
        deployment settings, and whether the datasets are large and diverse enough
        to prevent overfitting.
    - line: Metric and stress-test design for multi-dimensional evaluation
      what_it_solves: Probing prediction quality, controllability, robustness, and
        decision utility through disaggregated metrics (e.g., scene graph consistency,
        memory consistency, action control) rather than aggregate scores alone.
      what_remains_open: The alignment between these proxy metrics and the downstream
        decisions that users actually care about has not been systematically validated.
    - line: Comparable baselines and reporting practices
      what_it_solves: Making world-model results auditable and reproducible by providing
        common model baselines, open-source artifacts, and standardized evaluation
        protocols.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and hyperparameter configurations is largely
        untested.
    consensus:
    - Video generation quality is the dominant but insufficient evaluation axis; the
      community is converging on the need for multi-dimensional assessment.
    - Open-source code, datasets, and model weights are widely recognized as essential
      for reproducible and comparable world-model research.
    - Offline evaluation on fixed benchmarks is the primary mode of comparison, with
      real-world or downstream task validation still limited.
    disagreements:
    - The choice of evaluation domain (Atari, driving, robotics, Minecraft) reflects
      fundamentally different assumptions about what world models should simulate,
      making cross-domain comparison difficult.
    - 'Metrics are not standardized: some works use FVD or human-normalized scores,
      while others propose custom scores (scene graph, memory) tailored to specific
      properties.'
    - There is a split between works that evaluate world models purely as generative
      models versus those that evaluate them through policy learning or downstream
      task performance.
    open_questions:
    - How can we design a unified evaluation protocol that spans multiple domains
      and interaction modes without losing specificity?
    - To what extent do improvements in video prediction metrics translate to better
      decision-making in downstream tasks?
    - What are the minimal requirements for a stress test to reliably detect failures
      in long-term memory and physical consistency of world models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 以世界模型评估为导向的基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，以便在视频预测之外，对空间一致性和记忆等世界模型能力进行可比测量。
      尚未覆盖: 任务分布是否覆盖真实世界部署的全部场景，数据集是否足够大且多样以避免过拟合。
    - 路线: 面向多维度评估的指标与压力测试设计
      解决的问题: 通过分解指标（如场景图一致性、记忆一致性、动作控制）而非仅聚合分数，检验预测质量、可控性、鲁棒性和决策效用。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的一致性尚未得到系统验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过提供通用模型基线、开源工件和标准化评估协议，使世界模型结果可审计和可复现。
      尚未覆盖: 基准结论在不同实现、算力预算和超参数配置下是否稳定，基本未经验证。
    共识:
    - 视频生成质量是主要但不够的评估轴，社区正趋向于认为需要多维度评估。
    - 开源代码、数据集和模型权重被广泛视为可复现和可比较的世界模型研究的基础。
    - 离线评估固定基准是主要对比模式，真实世界或下游任务验证仍然有限。
    分歧:
    - 评估领域的选择（Atari、驾驶、机器人、Minecraft）反映了对世界模型应模拟什么的基本假设不同，导致跨领域比较困难。
    - 指标不统一：部分工作使用FVD或人类归一化得分，另一些工作提出针对特定属性的自定义分数（场景图、记忆）。
    - 存在分歧：将世界模型纯粹作为生成模型评估，还是通过策略学习或下游任务性能来评估。
    开放问题:
    - 如何设计一个覆盖多个领域和交互模式而又不丧失特异性的统一评估协议？
    - 视频预测指标的改善在多大程度上能转化为下游任务中更好的决策？
    - 可靠检测世界模型长期记忆和物理一致性失效的应力测试的最低要求是什么？
