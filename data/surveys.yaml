    - 上下文世界模型能否超越可观测上下文假设和两个CARL任务的评估，处理未见动力学？
    - 跨具身隐动作训练能否扩展到LIBERO/LIBERO-Plus和两个真实机器人平台之外，并在更大具身多样性下保持有效？
