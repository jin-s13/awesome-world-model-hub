  related_work_outline:
  - 'Mainstream direction: The evidence centers on building runnable world-model systems
    that turn generative video or latent dynamics models into controllable simulators
    for embodied agents, with strongest concentration in autonomous driving and robot
    learning.'
  - 'Shared research pattern: Work couples learned dynamics or video generation with
    explicit conditioning and evaluation artifacts for actions, physical properties,
    spatial consistency, or task context, then tests closed-loop or downstream use
    rather than visual quality alone.'
  - 'Key differences: Systems differ in representation—recurrent state-space, diffusion/autoregressive
    video, or physics-informed joint prediction—and in evaluation target—spatial consistency,
    action fidelity, physical plausibility, or zero-shot generalization.'
  - 'Trend evolution: From 2022 real-robot Dreamer deployment, the frontier has shifted
    toward 2024–2026 action-controllable driving simulators and pre-trained video
    world simulators with latency, controllability, and evaluation artifacts becoming
    central.'
  - 'Open questions: Evidence gaps remain on whether evaluation metrics predict downstream
    policy utility, how single-GPU low-latency systems scale beyond one dataset, and
    whether open artifacts support independent reproduction.'
  related_work_outline_zh:
  - 主流方向：证据集中在构建可运行的世界模型系统，将生成式视频或潜在动力学模型转化为面向具身智能体的可控模拟器，最集中于自动驾驶和机器人学习。
  - 研究共性：工作将学习到的动力学或视频生成与动作、物理属性、空间一致性或任务上下文显式结合，并以闭环或下游使用评估，而非只看视觉质量。
  - 关键差异：系统在表示上不同——循环状态空间、扩散/自回归视频或物理信息联合预测；在评测目标上不同——空间一致性、动作忠实度、物理合理性或零样本泛化。
  - 趋势演进：从2022年真实机器人Dreamer部署，前沿转向2024–2026年动作可控驾驶模拟器和预训练视频世界模拟器，延迟、可控性和评测工件成为核心。
  - 开放问题：评测指标能否预测下游策略效用仍缺证据；单GPU低延迟系统能否跨数据集扩展；开放工件能否支持独立复现。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end simulation and deployment stacks
      what_it_solves: Converts learned dynamics or video generation into runnable
        workflows for data, training, inference, and evaluation in driving and robot
        settings.
      what_remains_open: External deployment robustness beyond limited platforms and
        datasets such as nuScenes, CARL, or specific robot hardware is not demonstrated.
    - line: Real-time and interactive world-model serving
      what_it_solves: Meets closed-loop latency and interactivity requirements through
        single-GPU optimization, online real-robot learning, or action-conditioned
        generation.
      what_remains_open: Trade-offs among speed, visual fidelity, physical plausibility,
        controllability, and long-horizon consistency remain partially quantified,
        and multi-GPU or edge deployment is unverified.
    - line: Evaluation artifacts and reproducible engineering
      what_it_solves: Creates datasets, metrics, and open-access frameworks for spatial
        consistency, action fidelity, physical plausibility, and contextual zero-shot
        generalization.
      what_remains_open: Independent reproduction across teams and infrastructure
        is uncertain; several abstracts lack full limitation details, and metric-to-downstream-policy
        utility is not consistently established.
    consensus:
    - Visual quality alone is insufficient; systems are evaluated with explicit spatial,
      action, physical, or generalization criteria.
    - Action or control conditioning is treated as a core requirement for making learned
      simulators useful to downstream agents.
    - Closed-loop, long-horizon behavior and low-latency or real-time operation are
      recurring deployment concerns across robot and driving settings.
    - There is a shared turn toward open datasets and evaluation artifacts, though
      the level of verified independent reproducibility varies.
    disagreements:
    - 'Representation differs: some systems use recurrent latent state-space dynamics,
      while others use diffusion or autoregressive video generation, and one uses
      physics-informed keypoint and depth learning.'
    - 'Evaluation targets differ: spatial consistency in loop navigation, action fidelity
      in driving simulators, physical plausibility for robot video, and zero-shot
      generalization under context shift.'
    - 'Interaction mode differs: real physical robots learning online without simulators
      versus off-line driving simulation and modular action-conditioned pre-trained
      video simulators.'
    - 'Deployment setting differs: single-GPU closed-loop driving, robot hardware
      learning, and evaluation-only artifacts imply different latency, safety, and
      infrastructure assumptions.'
    open_questions:
    - Do spatial consistency and action fidelity metrics predict downstream policy
      performance or real-world transfer?
    - Can single-GPU closed-loop simulators maintain long-horizon cross-view consistency
      and generalize beyond one driving dataset or sensor setup?
    - Can context-conditioned and physics-informed models preserve visual detail while
      scaling beyond two evaluation tasks or specialized robotic domains?
    - Are released datasets, code, and baseline implementations sufficient for independent
      reproduction across teams, especially for works with low reproducibility signals
      or missing limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端模拟与部署栈
      解决的问题: 将学习到的动力学或视频生成转化为覆盖数据、训练、推理和评测的可运行工作流，面向驾驶和机器人场景。
      尚未覆盖: 在nuScenes、CARL或特定机器人硬件之外的部署鲁棒性尚未得到证明。
    - 路线: 实时与交互式世界模型服务
      解决的问题: 通过单GPU优化、真实机器人在线学习或动作条件生成，满足闭环延迟和交互需求。
      尚未覆盖: 速度、视觉保真度、物理合理性、可控性和长时域一致性间的权衡只被部分量化，多GPU或边缘部署未获验证。
    - 路线: 评测工件与可复现工程
      解决的问题: 创建用于空间一致性、动作忠实度、物理合理性和上下文零样本泛化的数据集、指标与开放访问框架。
      尚未覆盖: 跨团队和基础设施的独立复现不确定；多个摘要缺少完整局限性说明，指标到下游策略效用的关系并未一致建立。
    共识:
    - 仅看视觉质量不够；系统通过显式的空间、动作、物理或泛化标准被评估。
    - 动作或控制条件被视为使学习模拟器对下游智能体可用的核心要求。
    - 闭环、长时域行为和低延迟或实时操作是机器人与驾驶场景中反复出现的部署关切。
    - 出现向开放数据集和评测工件的转变，但已获验证的独立复现程度不一。
    分歧:
    - 表示方式不同：有的系统使用循环潜在状态空间动力学，有的使用扩散或自回归视频生成，还有的采用物理信息关键点和深度学习。
    - 评测目标不同：循环导航中的空间一致性、驾驶模拟器中的动作忠实度、机器人视频中的物理合理性，以及上下文变化下的零样本泛化。
    - 交互模式不同：真实物理机器人在无模拟器情况下在线学习，相对离线驾驶模拟和模块化动作条件预训练视频模拟器。
    - 部署场景不同：单GPU闭环驾驶、机器人硬件学习和仅评测工件对延迟、安全和基础设施有不同假设。
    开放问题:
    - 空间一致性和动作忠实度指标能否预测下游策略表现或真实迁移？
    - 单GPU闭环模拟器能否保持长时域跨视角一致性，并泛化到单一驾驶数据集或传感器配置之外？
    - 上下文条件和物理信息模型能否在保留视觉细节的同时，扩展到两个评测任务或专业机器人领域之外？
    - 已发布的数据集、代码和基线实现是否足以支持跨团队独立复现，尤其是低复现信号或局限性细节缺失的工作？
