  - 研究共性：它们按应用场景、世界状态表示或潜在空间设计对现有工作进行分类，然后识别跨领域的技术挑战并提出未来研究方向。
  - 关键差异：范围从通用视频生成和自主智能体到特定领域的自动驾驶不等；评估方案从概念性指标套件到未实施的建议，部分综述强调交互可控性，另一些则侧重潜在表示设计。
  - 趋势演进：从2024年以单一旗舰模型（Sora）为叙事锚点的综述，到2026年提出统一分类法和评估框架并明确内部机制的综述，表明该领域正走向系统化、可比较的分析。
  - 开放问题：如何实证验证所提出的分类法和评估框架，如何确保跨领域基准的兼容性，以及如何优先排序哪些开放挑战对实现决策就绪的世界模型最为关键。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes a fragmented field into coherent directions, design
        dimensions, and future milestones, enabling researchers to see the structure
        of world model research across domains.
      what_remains_open: Taxonomies are proposed without empirical validation; coverage
        may miss recent work due to rapid field evolution, and the relative importance
        of identified directions is not quantitatively assessed.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different evaluation choices (metrics, benchmarks,
        protocols) shape conclusions across world model papers, and proposes unified
        evaluation frameworks to reduce open-loop/closed-loop mismatches.
      what_remains_open: Proposed evaluation frameworks remain unimplemented and untested;
        compatibility of results across different domains and settings is assumed
        rather than demonstrated, and resource-aware inference cost metrics are not
        yet standardized.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into concrete research questions,
        such as action-conditioned controllability, long-horizon memory, and real-time
        interactivity, guiding next-step research investments.
      what_remains_open: Prioritization of gaps is based on current trends rather
        than systematic evidence; the mapping does not quantify which gaps most impede
        progress, and entirely novel challenges may emerge as the field advances.
    consensus:
    - World models are pivotal across video generation, autonomous driving, robotics,
      and autonomous agents, serving as a unifying abstraction for synthesizing realistic
      dynamics and enabling intelligent interaction.
    - 'Current world models face shared technical challenges: long-horizon temporal
      consistency, action-conditioned controllability, and real-time interactivity
      or responsiveness.'
    - Evaluation remains a critical weakness; existing benchmarks are fragmented,
      and there is a need for closed-loop, decision-oriented metrics that account
      for inference cost and out-of-sight dynamics.
    - Future progress requires tighter integration of structural priors (geometry,
      topology, semantics) with learned latent representations to improve physical
      plausibility and generalization.
    disagreements:
    - 'Scope and domain focus: one survey targets interactive video world modeling
      across open-world exploration, games, driving, and robotics; another focuses
      exclusively on latent world models for automated driving; a third uses Sora
      as a lens for general world models spanning video, driving, and agents.'
    - 'Representation emphasis: the autonomous driving survey centers on latent space
      design (continuous states, discrete tokens, hybrids) and structural priors,
      while the interactive video survey emphasizes action-conditioned generation
      and scene modality without a unified latent framework.'
    - 'Evaluation maturity: the autonomous driving survey proposes a detailed closed-loop
      metric suite and resource-aware cost but does not implement it; the interactive
      video survey compares existing benchmarks without proposing new unified metrics;
      the Sora survey discusses challenges without a concrete evaluation framework.'
    - 'Interaction paradigm: the interactive video survey treats real-time action-following
      as a core challenge, whereas the autonomous driving survey frames interaction
      through planning and decision-making within a latent world model, reflecting
      different deployment assumptions.'
    open_questions:
    - How can proposed taxonomies and evaluation frameworks be empirically validated
      to ensure they capture the true structure of the field and predict meaningful
      performance differences?
    - What is the minimal set of cross-domain benchmarks and metrics that can reliably
      compare world models across video generation, robotics, and autonomous driving
      without losing domain-specific fidelity?
    - Which of the identified open challenges (controllability, long-horizon memory,
      real-time interactivity, out-of-sight dynamics) most critically limits the deployment
      of world models in safety-critical applications, and how should research effort
      be prioritized?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为连贯的方向、设计维度和未来里程碑，使研究者能够看清跨领域的研究结构。
      尚未覆盖: 分类法缺乏实证验证；由于领域发展迅速，可能遗漏最新工作；各方向的相对重要性未经过量化评估。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（指标、基准、协议）如何影响世界模型论文的结论，并提出统一评估框架以减少开环/闭环不匹配。
      尚未覆盖: 所提评估框架尚未实施和测试；跨领域和跨设置的结果兼容性仅为假设而非证明；资源感知的推理成本指标尚未标准化。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛的文献覆盖转化为具体的研究问题，如动作条件可控性、长时记忆和实时交互性，为下一步研究投入提供指引。
      尚未覆盖: 缺口的优先级排序基于当前趋势而非系统证据；映射未量化哪些缺口最阻碍进展；随着领域发展可能出现全新挑战。
    共识:
    - 世界模型在视频生成、自动驾驶、机器人学和自主智能体等领域至关重要，是合成逼真动态和实现智能交互的统一抽象。
    - 当前世界模型面临共同的技术挑战：长时域时间一致性、动作条件可控性以及实时交互或响应能力。
    - 评估仍是关键弱点；现有基准碎片化，需要闭环、面向决策的指标，并考虑推理成本和视线外动态。
    - 未来进展需要将结构先验（几何、拓扑、语义）与学习的潜在表示更紧密地结合，以提升物理合理性和泛化能力。
    分歧:
    - 范围与领域聚焦：一篇综述针对跨开放世界探索、游戏、驾驶和机器人学的交互式视频世界建模；另一篇专注于自动驾驶的潜在世界模型；第三篇以Sora为透镜，覆盖视频、驾驶和智能体的通用世界模型。
    - 表示侧重：自动驾驶综述以潜在空间设计（连续状态、离散令牌、混合体）和结构先验为中心，而交互式视频综述强调动作条件生成和场景模态，未提出统一的潜在框架。
    - 评估成熟度：自动驾驶综述提出了详细的闭环指标套件和资源感知成本但未实现；交互式视频综述比较了现有基准但未提出新的统一指标；Sora综述讨论了挑战但缺乏具体评估框架。
    - 交互范式：交互式视频综述将实时动作跟随视为核心挑战，而自动驾驶综述通过潜在世界模型中的规划与决策来构建交互，反映了不同的部署假设。
    开放问题:
    - 如何对所提出的分类法和评估框架进行实证验证，以确保它们能捕捉领域的真实结构并预测有意义的性能差异？
    - 能够可靠比较视频生成、机器人学和自动驾驶领域世界模型的最小跨领域基准和指标集是什么，同时不丢失领域特定的保真度？
    - 在已识别的开放挑战（可控性、长时记忆、实时交互性、视线外动态）中，哪一个对安全关键应用中的世界模型部署限制最大，研究努力应如何优先分配？
