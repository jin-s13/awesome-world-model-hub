  related_work_outline:
  - 'Mainstream direction: World model evaluation is shifting from generic game benchmarks
    toward specialized benchmarks that probe spatial consistency, memory consistency,
    and action controllability, with dedicated datasets and metrics replacing aggregate
    scores.'
  - 'Shared research pattern: The community builds closed-loop navigation or interactive
    video datasets and designs quantitative metrics that measure how well world models
    preserve spatial and temporal coherence under varying viewpoints and actions.'
  - 'Key differences: Deployed environments differ substantially (autonomous driving,
    Minecraft, robotic manipulation, Atari) and action spaces range from first-person
    navigation to multi-view control, while evaluation metrics diverge between scene-graph
    consistency, pixel-level reconstruction, and dynamics prediction accuracy.'
  - 'Trend evolution: Across 2023–2026, the field moved from reusing existing RL benchmarks
    to creating custom benchmarks such as LoopNav and MIND that explicitly target
    long-term memory and action grounding, with a growing emphasis on open-domain,
    video-based evaluation.'
  - 'Open questions: How to design a unified benchmark suite that covers diverse world
    model applications; the alignment between proxy metrics and downstream decision
    utility; feasibility of long-horizon consistency evaluation; and stability of
    conclusions across different implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评估从通用游戏基准转向专门探测空间一致性、记忆一致性和动作控制能力的基准，以专用数据集和指标取代总分。
  - 研究共性：构建闭环导航或交互视频数据集，并设计量化指标，衡量世界模型在不同视角和动作下保持时空一致性的能力。
  - 关键差异：部署环境（自动驾驶、Minecraft、机器人操作、Atari 游戏）和动作空间（第一人称导航、多视角控制）差异显著，评测度量在场景图一致性、像素重建和动力学预测准确度之间分化。
  - 趋势演进：2023–2026 年间，领域从复用现有 RL 基准转向创建专门的基准（如 LoopNav 和 MIND），明确针对长期记忆和动作对齐，并逐步强调开放域、基于视频的评估。
  - 开放问题：如何设计覆盖多样世界模型应用的统一基准套件；代理指标与下游决策效用的对齐；长时域一致性评估的可行性；结论在不同实现和算力预算下的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model capabilities
        comparable, such as loop-based navigation in Minecraft (LoopNav) and multi-scene
        video clips with varied action spaces (MIND).
      what_remains_open: Whether the task distribution covers all deployment settings
        where world models are expected to help, and whether the datasets are large
        and diverse enough to represent real-world open-domain interactions.
    - line: Metric and stress-test design
      what_it_solves: Probing specific world-model properties beyond aggregate scores,
        such as spatial consistency via Scene Graph Consistency Score (SGCS) and memory
        consistency and action control via a closed-loop revisited benchmark.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decision quality users actually care about; sensitivity of metrics to pixel-level
        artifacts versus semantic consistency.
    - line: Comparable baselines and reporting
      what_it_solves: Using established benchmarks (Atari 100k, Nuscenes, CARL) to
        compare model-based RL agents, enabling some level of cross-paper comparability.
      what_remains_open: Benchmark conclusions may not be stable across different
        implementations, compute budgets, or uncontrolled data preprocessing choices,
        and the community lacks standardized reporting conventions for world model
        evaluation.
    consensus:
    - There is a growing agreement that evaluating world models requires moving beyond
      raw visual fidelity or game score to targeted assessments of spatial, temporal,
      and causal consistency.
    - The community acknowledges that specialized datasets and metrics are necessary
      to reveal failures in long-term memory and action-conditioned generation that
      remain hidden in standard benchmarks.
    disagreements:
    - 'The choice of environment and action space splits the field: highway driving,
      block-world navigation, robotic manipulation, and 2D Atari games probe different
      facets of world models, and no single suite is accepted as universal.'
    - 'Metric design varies: some works favor scene-graph-based scores that abstract
      away pixel-level details, while others rely on reconstruction or prediction
      error, leading to debates about what constitutes a meaningful world model failure.'
    open_questions:
    - How can we construct a unified evaluation protocol that spans the diverse action
      spaces and visual domains of current world model applications without overfitting
      to a single scenario?
    - Do the proposed consistency metrics (SGCS, memory-action control scores) correlate
      with the eventual performance of downstream policies trained inside those world
      models?
    - What are the limits of existing benchmarks in testing long-horizon memory consistency,
      and how can we scale evaluation to thousands of steps without excessive computational
      cost?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型各类能力可比较，例如基于 Minecraft 循环导航的 LoopNav 和多场景多动作空间的 MIND
        视频集。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部真实部署设置，以及数据集是否足够大和多样以代表开放域交互。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外探测世界模型的特定属性，例如通过场景图一致性分数（SGCS）评估空间一致性，以及通过闭环可复现基准评估记忆一致性和动作控制。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策质量之间的一致性，以及指标对像素级伪影与语义差异的敏感度。
    - 路线: 可比基线与报告规范
      解决的问题: 使用已建立的基准（Atari 100k、Nuscenes、CARL）来比较基于模型的 RL 智能体，实现一定程度的跨论文可比性。
      尚未覆盖: 基准结论在不同实现、算力预算或非受控数据预处理选择下是否稳定，且社区缺乏统一的世界模型评估报告规范。
    共识:
    - 越来越多的共识认为，评估世界模型需要超越原始视觉保真度或游戏分数，转向对空间、时间和因果一致性的针对性评估。
    - 社区认识到，专用数据集和指标对于揭示长期记忆和动作条件生成中的失败是必要的，这些失败在标准基准中仍然隐藏。
    分歧:
    - 环境和动作空间的选择将领域分割：高速驾驶、积木世界导航、机器人操作和 2D  Atari 游戏探测世界模型的不同方面，尚无单一套件被接受为通用标准。
    - 指标设计存在差异：一些工作倾向于使用场景图分数来抽象掉像素级细节，而另一些则依赖重建或预测误差，导致对什么构成有意义的世界模型失败的争论。
    开放问题:
    - 如何构建一个统一的评估协议，跨越当前世界模型应用的多样化动作空间和视觉域，而不对单一场景过拟合？
    - 所提出的一致性指标（SGCS、记忆-动作控制分数）是否与在世界模型内部训练的下游策略的最终性能相关？
    - 现有基准在测试长时域记忆一致性方面的极限是什么，以及如何在不产生过高计算成本的情况下将评估扩展到数千步？
