  - 主流方向：围绕生成式世界模型形成综述、分类体系与评估框架，覆盖交互视频、自动驾驶、机器人等方向。
  - 研究共性：多按应用场景、世界状态演化、模态和可控性整理碎片化研究，并提炼动作条件控制、长时记忆、实时交互等关键挑战。
