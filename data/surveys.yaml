    研究路线矩阵:
    - 路线: 驾驶场景生成与仿真用例
      解决的问题: 通过掩码重建和扩散进行多视角、长时域驾驶视频预测与零样本场景生成
      尚未覆盖: 视频预测改善能否转化为真实驾驶安全或运营结果尚未验证
