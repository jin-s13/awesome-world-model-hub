  related_work_outline:
  - 'Mainstream direction: Building action-controllable world models that serve as
    interactive simulators for autonomous driving, robotics, and game environments,
    with a strong emphasis on video generation fidelity and physical plausibility.'
  - 'Shared research pattern: Most works augment pre-trained video generative models
    (diffusion or autoregressive transformers) with action-conditioning modules, physics-informed
    losses, or structured control to improve dynamic consistency and downstream task
    utility.'
  - 'Key differences: Approaches diverge in how they inject control (latent replacement,
    adaptive horizon conditioning, lightweight adapter modules), what physical or
    contextual knowledge they encode (depth, keypoints, scene graphs, context variables),
    and whether they target open-loop visual quality or closed-loop interactive deployment.'
  - 'Trend evolution: From 2020–2023 foundational world model architectures, the frontier
    in 2024–2026 has shifted toward real-time, high-fidelity, action-following simulators
    with dedicated benchmarks (e.g., LoopNav, ACT-Bench) and system-level optimizations
    for low-latency inference on single GPUs.'
  - 'Open questions: How to unify evaluation metrics across spatial consistency, action
    fidelity, and long-horizon stability; how to achieve robust closed-loop performance
    without distributional collapse; and how to generalize world models beyond curated
    driving or game datasets to open-world physical interaction.'
  related_work_outline_zh:
  - 主流方向：构建动作可控的世界模型，作为自动驾驶、机器人和游戏环境的交互式模拟器，重点关注视频生成保真度和物理合理性。
  - 研究共性：多数工作通过动作条件模块、物理信息损失或结构化控制来增强预训练视频生成模型（扩散或自回归Transformer），以改善动态一致性和下游任务效用。
  - 关键差异：方法在控制注入方式（潜在替换、自适应视界条件化、轻量适配器）、编码的物理或上下文知识（深度、关键点、场景图、上下文变量）以及目标（开环视觉质量 vs.
    闭环交互部署）上存在分歧。
  - 趋势演进：从2020–2023年的基础世界模型架构，到2024–2026年的前沿已转向实时、高保真、动作跟随的模拟器，并出现了专用基准（如LoopNav、ACT-Bench）和面向单GPU低延迟推理的系统优化。
  - 开放问题：如何统一空间一致性、动作忠实度和长时域稳定性的评估指标；如何在不发生分布崩溃的情况下实现鲁棒的闭环性能；以及如何将世界模型从精心策划的驾驶或游戏数据集泛化到开放世界的物理交互。
  literature_review:
    line_of_work_matrix:
    - line: World model evaluation benchmarks and datasets
      what_it_solves: Provides standardized protocols and metrics to quantify spatial
        consistency, action fidelity, and long-horizon coherence of world models,
        moving beyond generic video quality scores.
      what_remains_open: Existing benchmarks (e.g., LoopNav for spatial consistency,
        ACT-Bench for action fidelity) are domain-specific and lack a unified metric
        that correlates with downstream task performance; cross-benchmark generalization
        is unverified.
    - line: Action-controllable world models via generative architectures
      what_it_solves: Enables video generation that faithfully follows high-level
        commands or low-level trajectories, supporting applications like closed-loop
        driving simulation and model-based RL.
      what_remains_open: Long-horizon rollouts still suffer from error accumulation
        and distribution shift; real-time interactivity often trades off visual fidelity;
        most methods assume access to action labels during training.
    - line: Physics-informed and context-aware world models
      what_it_solves: Incorporates physical properties (depth, keypoint dynamics,
        scene graphs) or contextual variables (mass, dimensions) to improve the realism
        and zero-shot generalization of simulated rollouts.
      what_remains_open: These models typically assume observability of physical or
        contextual parameters, which is unrealistic in many deployment scenarios;
        evaluation is limited to narrow task suites (e.g., CARL, specific robotic
        setups).
    - line: System-level deployment of world simulators
      what_it_solves: Optimizes inference latency and memory footprint to enable sub-second,
        single-GPU closed-loop simulation for autonomous driving or interactive applications.
      what_remains_open: Scalability to multi-GPU or edge devices, robustness to sensor
        configuration changes, and integration with real-world control stacks remain
        largely unaddressed.
    consensus:
    - Pre-trained video generative models serve as effective backbones for building
      world simulators, but require additional conditioning mechanisms to achieve
      action-following behavior.
    - Temporal consistency and physical plausibility are critical for downstream tasks
      such as policy training and evaluation, and cannot be captured by frame-wise
      reconstruction losses alone.
    - Open-source code, datasets, and benchmarks are essential for reproducible progress,
      as evidenced by the release of artifacts in most recent works.
    disagreements:
    - 'Representation of control: some methods use latent replacement or adaptive
      reference frames, while others employ lightweight adapter modules or fine-grained
      structured control; there is no consensus on the most effective conditioning
      strategy.'
    - 'Evaluation target: works like LoopNav prioritize spatial consistency via scene
      graphs, whereas ACT-Bench and Vista emphasize action fidelity measured by trajectory-following
      accuracy; these objectives are not always aligned.'
    - 'Interaction mode: several systems target open-loop video prediction with post-hoc
      action conditioning, while FAR-Drive and the interactive world modeling survey
      advocate for closed-loop, frame-level autoregressive generation with real-time
      constraints.'
    - 'Domain specificity: driving-focused models (Vista, FAR-Drive) leverage multi-camera
      setups and traffic constraints, while generalist approaches (DWS, cRSSM) aim
      for cross-domain transfer but show limited evaluation breadth.'
    open_questions:
    - Can a single world model maintain high fidelity and controllability across diverse
      embodiments and environments without per-domain fine-tuning?
    - How should the research community define a unified evaluation suite that jointly
      measures visual quality, action responsiveness, physical consistency, and long-horizon
      stability?
    - What are the minimal sensory and contextual inputs required for a world model
      to achieve robust closed-loop performance in previously unseen real-world settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评估基准与数据集
      解决的问题: 提供标准化协议和指标，量化世界模型的空间一致性、动作忠实度和长时域连贯性，超越通用的视频质量评分。
      尚未覆盖: 现有基准（如面向空间一致性的LoopNav、面向动作忠实度的ACT-Bench）领域特定，缺乏与下游任务性能相关的统一指标；跨基准泛化性未经验证。
    - 路线: 基于生成架构的动作可控世界模型
      解决的问题: 实现忠实遵循高层指令或低层轨迹的视频生成，支持闭环驾驶模拟和基于模型的强化学习等应用。
      尚未覆盖: 长时域推演仍存在误差累积和分布偏移；实时交互性常以牺牲视觉保真度为代价；多数方法假设训练期间可获取动作标签。
    - 路线: 物理信息与上下文感知的世界模型
      解决的问题: 融入物理属性（深度、关键点动力学、场景图）或上下文变量（质量、尺寸），提升模拟推演的真实感和零样本泛化能力。
      尚未覆盖: 这些模型通常假设物理或上下文参数可观测，在许多部署场景中不现实；评估局限于狭窄的任务套件（如CARL、特定机器人设置）。
    - 路线: 世界模拟器的系统级部署
      解决的问题: 优化推理延迟和内存占用，实现自动驾驶或交互式应用的单GPU亚秒级闭环模拟。
      尚未覆盖: 多GPU或边缘设备的可扩展性、对传感器配置变化的鲁棒性以及与真实世界控制栈的集成仍基本未解决。
    共识:
    - 预训练视频生成模型是构建世界模拟器的有效骨干，但需要额外的条件机制来实现动作跟随行为。
    - 时间一致性和物理合理性对策略训练与评估等下游任务至关重要，仅靠逐帧重建损失无法捕捉。
    - 开源代码、数据集和基准对可复现的进展不可或缺，近期多数工作均发布了相关工件。
    分歧:
    - 控制表示：部分方法使用潜在替换或自适应参考帧，其他方法采用轻量适配器模块或细粒度结构化控制；尚未就最有效的条件策略达成共识。
    - 评测目标：LoopNav等工作通过场景图优先考虑空间一致性，而ACT-Bench和Vista强调以轨迹跟随精度衡量的动作忠实度；这些目标并不总是一致的。
    - 交互模式：若干系统针对开环视频预测并附加事后动作条件，而FAR-Drive和交互式世界建模综述则倡导具有实时约束的闭环、帧级自回归生成。
    - 领域特异性：驾驶聚焦模型（Vista、FAR-Drive）利用多相机设置和交通约束，而通用方法（DWS、cRSSM）旨在跨领域迁移，但评估广度有限。
    开放问题:
    - 单一世界模型能否在无需逐领域微调的情况下，在多样化具身形态和环境中保持高保真度和可控性？
    - 研究社区应如何定义一套统一的评估套件，联合衡量视觉质量、动作响应性、物理一致性和长时域稳定性？
    - 世界模型在未见过的真实场景中实现鲁棒闭环性能所需的最小感知和上下文输入是什么？
