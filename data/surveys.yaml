  related_work_outline_zh:
  - 主流方向：证据聚集在生成式世界模型这一核心对象上；综述与分类工作把视频生成、自动驾驶和具身智能体纳入统一框架，方法论文则推进组合式、持久化、多模态和开源仿真。
  - 研究共性：多篇论文将未来视觉或状态生成视为可控仿真问题，并以语言、动作、自运动、目标或潜在状态作为条件，通过视频预测、运动预测、驾驶或机器人控制任务进行评估。
  - 关键差异：表示方式（语言派生原语、持久全局状态、潜在空间、自回归Transformer）、适用范围（通用分类与驾驶、自我视觉或机器人设置）以及评估深度（实证基准与概念框架）存在明显分化。
  - 趋势演进：从2023年驾驶仿真，到2024年Sora相关综述与组合式机器人世界模型，再到2025年多模态数据集和2026年视线外动态、实时开源与驾驶潜在空间分类，趋势是强调一致性、交互性、开放性和评估驱动的综合。
  - 开放问题：真实机器人与分布外泛化、闭环比对开环评估的标准化、所提分类法的实证验证，以及持久长时程状态与实时交互之间的平衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Survey, taxonomy, and roadmap synthesis for world models
      what_it_solves: Maps fragmented video-generation, driving, and agent world-model
        research into conceptual frameworks, design-space dimensions, and open challenges.
      what_remains_open: The proposed taxonomies and evaluation prescriptions are
        largely conceptual; empirical validation and metric implementation are missing
        in visible evidence.
    - line: Compositional video world modeling from language and multimodal goals
      what_it_solves: Improves generalization to unseen object-action-goal combinations
        by decomposing video generation into language-derived primitives and conditioning
        separate models.
      what_remains_open: Generalization is bounded by primitives seen in training;
        it depends on reliable language parsing, and only simulation-based robot execution
        is shown.
    - line: Persistent, real-time, and open-source world simulation
      what_it_solves: Addresses long-horizon consistency, out-of-sight dynamics, and
        interactive latency via global states, monitors, memory, and public artifacts.
      what_remains_open: Visible evidence lacks limitation details for some systems;
        cross-environment robustness and reproduced real-world deployment are not
        fully established.
    - line: Driving-specific world models and spatio-temporal datasets
      what_it_solves: Supports controllable photorealistic synthesis, motion prediction,
        georeferencing, and multi-agent traffic simulation for autonomous settings.
      what_remains_open: Closed-loop versus open-loop evaluation compatibility and
        simulation-to-real transfer remain unresolved; several papers omit explicit
        limitations.
    - line: Multimodal ego-vision world models for fine-grained control
      what_it_solves: Enables future frame and depth prediction with control over
        ego-motion, object dynamics, human pose, and scene composition from large
        real-world video.
      what_remains_open: Long-horizon stability and object-control metrics require
        broader validation beyond the reported evaluations.
    consensus:
    - Generative world models are treated as a unifying mechanism for simulating visual
      dynamics, agent environments, and driving scenes.
    - Controllable generation requires explicit conditioning signals such as language
      instructions, actions, goals, ego-motion, or latent states.
    - Temporal consistency, long-horizon behavior, and persistent state are recognized
      as central weaknesses of current video world models.
    - Evaluation remains fragmented, with simulation, video prediction, motion prediction,
      and control metrics used across different works.
    disagreements:
    - 'Representation: language-derived primitive factorization, persistent global
      state, latent-space autoregressive models, and transformer-based spatio-temporal
      modeling offer competing routes.'
    - 'Scope: some work aims for general world-model synthesis, while others target
      driving, robotics, or ego-vision applications, shifting dataset and evaluation
      priorities.'
    - 'Evaluation: some papers report empirical benchmarks or robot-execution results;
      some propose closed-loop metric suites and resource-aware inference costs but
      do not implement them.'
    - 'Reproducibility: public code and model access are present in some systems,
      whereas visible links and limitation fields are absent or uneven elsewhere.'
    open_questions:
    - Can compositional world models move beyond combinations of training primitives
      and support genuinely novel objects, actions, or real-robot execution?
    - How can open-loop and closed-loop evaluation be aligned when datasets, baselines,
      and metrics differ across driving, robot, and ego-vision settings?
    - Do conceptual taxonomies and latent-space frameworks translate into measurable
      model improvements, or do they remain unvalidated roadmaps?
    - What state representation best preserves out-of-sight or long-horizon dynamics
      while keeping generation real-time and memory bounded?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 针对世界模型的综述、分类与路线图综合
      解决的问题: 把分散的视频生成、自动驾驶和智能体世界模型研究映射为概念框架、设计空间维度与开放挑战。
      尚未覆盖: 所提出的分类法和评估方案大多停留在概念层面；可见证据缺少实证验证与指标实现。
    - 路线: 基于语言与多模态目标的组合式视频世界建模
      解决的问题: 通过把视频生成分解为语言派生原语并分别条件化模型，提高对未见过物体-动作-目标组合的泛化能力。
      尚未覆盖: 泛化受限于训练中见过的原语；依赖可靠的语言解析，且仅展示仿真中的机器人执行。
    - 路线: 持久化、实时和开源世界仿真
      解决的问题: 通过全局状态、监控机制、长期记忆和公开工件，解决长时程一致性、视线外动态和交互延迟问题。
      尚未覆盖: 可见证据中部分系统缺少局限性说明；跨环境鲁棒性与真实世界部署复现尚不充分。
    - 路线: 面向自动驾驶的世界模型与时空数据集
      解决的问题: 为自主场景提供可控真实感合成、运动预测、地理参考和多智能体交通仿真能力。
      尚未覆盖: 开环与闭环评估的兼容性以及从仿真到真实的迁移仍未解决；多篇论文未给出明确局限。
    - 路线: 用于细粒度控制的自我视觉多模态世界模型
      解决的问题: 利用大规模真实视频实现未来帧和深度预测，并控制自运动、物体动态、人体姿态与场景组成。
      尚未覆盖: 长时程稳定性和物体控制指标需要在报告评测之外得到更广泛验证。
    共识:
    - 生成式世界模型被视作仿真视觉动态、智能体环境和驾驶场景的统一机制。
    - 可控生成通常需要显式条件信号，例如语言指令、动作、目标、自运动或潜在状态。
    - 时间一致性、长时程行为与持久状态被认为是当前视频世界模型的主要弱点。
    - 评估仍较为分散，仿真、视频预测、运动预测和控制指标在不同工作中混用。
    分歧:
    - 表示方式：语言派生原语分解、持久全局状态、潜在空间自回归模型和基于Transformer的时空模型提供了不同路线。
    - 范围：部分工作面向通用世界模型综合，另一些面向驾驶、机器人或自我视觉应用，导致数据集与评测重心不同。
    - 评测：部分论文报告实证基准或机器人执行结果；部分提出闭环度量套件和资源感知推理成本，但未实际实施。
    - 可复现性：部分系统公开代码和模型，其他工作的可见链接与局限性字段缺失或不完整。
    开放问题:
    - 组合式世界模型能否超越训练原语组合，支持全新物体、动作或真实机器人执行？
    - 当数据集、基线和指标在驾驶、机器人和自我视觉设置中存在差异时，如何对齐开环与闭环评估？
    - 概念性分类法和潜在空间框架能否转化为可度量的模型改进，还是仍然只是未经验证的路线图？
    - 哪种状态表示最能在保持生成实时性和内存可控的同时，保留视线外或长时程动态？
