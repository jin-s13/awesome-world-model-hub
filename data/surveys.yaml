  literature_review:
    line_of_work_matrix:
    - line: Controllable world-model simulation for embodied and driving settings
      what_it_solves: Generating future video states conditioned on actions, trajectories,
        or context for planning, policy training, and evaluation.
      what_remains_open: Long-horizon consistency, physical plausibility, context
        observability, and generalization beyond limited datasets remain uncertain.
    - line: Real-time closed-loop serving and scalable deployment
      what_it_solves: Producing multi-camera or interactive future frames at low latency
        for autonomous driving and simulator-based control loops.
      what_remains_open: Single-GPU latency is reported, but multi-GPU scaling, extended
        sequences, and out-of-distribution sensor or environment changes are not verified.
    - line: Reproducible benchmark and dataset artifacts
      what_it_solves: Providing datasets, metrics, and evaluation harnesses to quantify
        spatial consistency or action fidelity of world models.
      what_remains_open: Independent reproduction across teams, baselines, and infrastructure,
        and whether metrics predict downstream system utility, remain open.
    consensus:
    - Most works treat conditional video generation as a core mechanism for world
      simulation.
    - They evaluate generated futures through fidelity, action adherence, physical
      plausibility, or downstream planning utility.
    - Several include artifacts such as datasets, benchmarks, or model checkpoints,
      but score-based evidence differs from methodological evidence.
    - Closed-loop utility and controllability are recurring goals across driving,
      robotics, and game-like navigation.
    disagreements:
    - One line conditions latent dynamics on observable context for zero-shot generalization,
      while another injects action conditions into pre-trained video generators.
    - 'Evaluation targets differ: spatial consistency in loop navigation, action fidelity
      in driving, visual-physical realism for robot video, and downstream reinforcement
      learning performance.'
    - Architectures differ between recurrent state-space models, diffusion transformers,
      and frame-level autoregressive generation.
    - 'Deployment settings differ: offline benchmark evaluation, model-based reinforcement
      learning training, and single-GPU closed-loop simulation.'
    open_questions:
    - How well do these systems generalize beyond the reported datasets such as nuScenes,
      CARL, Minecraft, or specific robotic scenarios?
    - What are the concrete trade-offs between low-latency deployment and long-horizon
      spatial or temporal consistency?
    - Do spatial or action fidelity metrics predict downstream planning and policy
      quality across independent environments?
    - Which context assumptions or physical priors are necessary when observations
      are partial or context values are unavailable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向具身智能与驾驶的可控世界模型仿真
      解决的问题: 根据动作、轨迹或上下文生成未来视频状态，用于规划、策略训练和评估。
      尚未覆盖: 长时程一致性、物理合理性、上下文可观测性，以及超出有限数据集的泛化仍不确定。
    - 路线: 实时闭环服务与可扩展部署
      解决的问题: 以低延迟生成多相机或交互式未来帧，支撑自动驾驶和基于仿真器的控制闭环。
      尚未覆盖: 单GPU延迟已有报告，但多GPU扩展、超长序列和分布外传感器或环境变化的验证不足。
    - 路线: 可复现基准与数据集工件
      解决的问题: 提供数据集、度量和评测框架，量化世界模型的空间一致性或动作保真度。
      尚未覆盖: 跨团队、基线和基础设施的独立复现，以及度量是否能预测下游系统效用仍未解决。
    共识:
    - 多数工作将条件视频生成作为世界仿真的核心机制。
    - 生成未来状态的评测覆盖视觉保真度、动作遵循、物理合理性或下游规划效用。
    - 多项工作提供数据集、基准或模型工件，但评分证据不同于方法学证据。
    - 闭环效用和可控性是驾驶、机器人与游戏类导航中的共同目标。
    分歧:
    - 一类方法在可观测上下文上条件化潜在动态以实现零样本泛化，另一类将动作条件注入预训练视频生成器。
    - 评测目标不同：循环导航中的空间一致性、驾驶中的动作保真度、机器人视频的视觉物理真实性，以及下游强化学习性能。
    - 架构不同：循环状态空间模型、扩散Transformer和帧级自回归生成共存。
    - 部署设置不同：离线基准评测、基于模型的强化学习训练和单GPU闭环仿真并存。
    开放问题:
    - 这些系统在nuScenes、CARL、Minecraft或特定机器人场景之外能否保持泛化？
    - 低延迟部署与长时程空间或时间一致性之间的具体权衡是什么？
    - 空间或动作保真度度量能否在独立环境中预测下游规划与策略质量？
    - 当观测部分缺失或上下文值不可用时，需要哪些上下文假设或物理先验？
