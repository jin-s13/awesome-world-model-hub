    or build conceptual taxonomies.'
  - 'Trend evolution: The available read-first evidence concentrates in 2024-2026,
    shifting from action-video generation quality and policy correlation toward post-training
    alignment, test-time verifiers, and functional physical/causal benchmarks.'
  - 'Open questions: Current papers leave unresolved whether these systems satisfy
    formal state-and-dynamics definitions, which verifiers can scale consistently,
    and how to close the evidence gap around physical persistence, causality, and
    generalizable guarantees.'
  related_work_outline_zh:
  - 主流方向：动作条件化视频生成是当前证据中最主要的世界模型路线，尤其用于机器人操作和具身模拟，重点在物理合理性与可控性，而非纯形式化分析。
  - 研究共性：多数工作将观测视频与动作/动力学建模耦合，使用扩散Transformer、自回归或适配器式后训练，并评估生成轨迹用于规划、策略评估或推理支持。
  - 关键差异：研究在状态表示、动作条件注入机制、监督信号（偏好数据、动作标注视频、零样本物理检查）以及训练方式（闭源适配、大规模预训练、概念分类）上不同。
  - 趋势演进：现有读优先证据集中在2024-2026年，从动作-视频生成质量和策略相关性，逐渐转向后训练对齐、测试时验证器及物理/因果功能基准。
  - 开放问题：这些系统是否满足形式化的状态-动态定义、哪种验证器能一致缩放、以及如何补足物理持久性、因果性与可泛化保证的证据缺口，仍无答案。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world modeling for robot learning
      what_it_solves: Couples action and observation dynamics to generate future states
        and support policy learning, planning, simulation, and policy evaluation.
      what_remains_open: Formal state/dynamics definitions, out-of-distribution boundary
        tests, and consistent gains in harder reasoning remain missing.
    - line: Adapter-based or preference-aligned reuse of pretrained video generators
      what_it_solves: Makes pretrained video generation controllable and physically
        plausible using small domain data, learned masks, reward models, or preference
        post-training.
      what_remains_open: Generalization beyond manipulation, subjective or costly
        reward collection, and dependence on closed or biased pretrained generators
        are not settled.
    - line: Functional evaluation and test-time verification
      what_it_solves: Diagnoses whether generated rollouts support spatial reasoning,
        physical plausibility, trajectory consistency, and action alignment via verifiers,
        zero-shot benchmarks, or uncertainty analysis.
      what_remains_open: Verifier calibration, action biases, inconsistent scaling,
        and a gap between visual fidelity and physical persistence/causal reasoning
        remain open.
    - line: Scaling, pretraining, and post-training alignment
      what_it_solves: Connects larger models, heterogeneous robotic data, faster generation,
        and preference-based post-training to more controllable or physically plausible
        rollouts.
      what_remains_open: Formal scaling laws or guarantees that predict failure, transfer,
        and reasoning limits are absent; current evidence is mainly empirical speed
        and benchmark improvement.
    - line: Conceptual taxonomy and formal state-and-dynamics framing
      what_it_solves: Organizes world-model claims into state construction and dynamics
        modeling, and clarifies the gap between stateless generation and classic world-model
        assumptions.
      what_remains_open: The formal conditions are not yet matched to empirical model
        behavior, and persistence/causality frontiers lack experimental validation.
    consensus:
    - There is broad agreement that world-model quality should be judged by downstream
      decision-making usefulness, not solely by generated video fidelity.
    - The evidence converges on action-conditioned video generation as a practical
      proxy for forward dynamics and policy evaluation in embodied settings.
    - 'Papers consistently identify a gap: current learned models lack reliable physical
      persistence, causal reasoning, or formal guarantees, and evaluation metrics
      remain insufficiently functional.'
    - Across methods, alignment or conditioning beyond visual generation is seen as
      necessary for robot manipulation and zero-shot transfer.
    disagreements:
    - 'Conditioning representation differs: some models inject action through frame-level
      modules or parallel context blocks; others couple diffusion timesteps, use learned
      masks on pretrained outputs, or token-level masked autoregression.'
    - 'Supervision and evaluation targets diverge: some rely on human preference reward
      to suppress unphysical rollouts, others use action-labelled adaptation data,
      policy-to-simulator correlation, or zero-shot physics/action-alignment protocols.'
    - 'Deployment and scale assumptions differ: some methods fine-tune or adapt closed
      pretrained generators with small domain data, while others train large heterogeneous
      models from scratch and rely on massive robotic video datasets.'
    - 'Theoretical depth differs: one conceptual survey calls for state/dynamics taxonomies
      and functional benchmarks, while most method papers provide empirical gains
      but no comparative formal analysis.'
    open_questions:
    - Can current action-conditioned video world models satisfy a formal state-and-dynamics
      condition under realistic distribution shift, and which assumptions must be
      tested?
    - What test-time verifier or reward signal produces consistent scaling across
      harder spatial reasoning benchmarks beyond SAT-Real, given observed bias and
      calibration failures?
    - Which functional benchmarks can separate physical persistence, causal reasoning,
      and action alignment from visual quality, and do current gains transfer outside
      manipulation domains?
    - Do the reported scaling, speed, and post-training gains imply any generalizable
      guarantee, or are they mainly empirical improvements with missing code, data,
      and limitation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件化视频世界模型用于机器人学习
      解决的问题: 把动作与视频/动力学耦合起来，生成未来状态以支持策略学习、规划、模拟和策略评估。
      尚未覆盖: 仍缺少对状态/动态的形式化定义、分布外边界验证以及对推理能力的稳定提升。
    - 路线: 预训练视频生成器的适配与对齐
      解决的问题: 通过小型领域数据、适配器、偏好奖励或直接偏好后训练，使预训练视频生成可控且物理上更合理。
      尚未覆盖: 在操作任务之外的泛化、奖励主观性与规模化成本、以及对闭源预训练偏见的依赖仍未厘清。
    - 路线: 世界模型能力的评估与测试时验证
      解决的问题: 用验证器、零样本基准或不确定性分析判断生成轨迹是否支持空间推理、物理合理性和动作对齐。
      尚未覆盖: 验证器校准、动作偏差和不一致缩放未解决；视觉保真与物理持久性/因果推理之间的评估缺口仍存在。
    - 路线: 缩放、预训练与后训练对齐
      解决的问题: 将更大模型、异构数据、偏好式后训练或更快生成与更可控/更物理合理的轨迹联系起来。
      尚未覆盖: 缺乏能预测失败、迁移和推理极限的缩放规律或形式保证；现有证据主要是经验性的速度与基准提升。
    - 路线: 状态构建与动态建模的概念分类
      解决的问题: 从状态构建和动态建模角度弥合视频生成与经典世界模型理论，并澄清无状态生成与经典假设之间的差距。
      尚未覆盖: 形式条件与经验模型行为之间的匹配尚未验证；持久性和因果性前沿仍缺少实验证据。
    共识:
    - 多数工作认为，世界模型质量应依据下游决策有用性而非仅凭生成视频的视觉保真度来判断。
    - 证据收敛于一个做法：把动作条件化视频生成作为具身环境中前向动力学、规划和策略评估的实用替代。
    - 论文普遍承认，当前学习模型缺乏可靠的物理持久性、因果推理或形式保证，且评估指标仍不够功能性。
    - 各方法都认为，仅靠视觉生成不足以支撑机器人操作和零样本迁移，必须加入动作、物理或任务逻辑等对齐机制。
    分歧:
    - 动作条件注入的表示机制不同：来自帧级模块、并行上下文块、独立扩散时间步、学习掩码或掩码自回归令牌预测。
    - 监督和评测目标不同：分别依赖人类偏好奖励、动作标注数据、策略与模拟器相关性、或零样本物理/动作对齐协议。
    - 部署和规模假设不同：有些方法适配闭源预训练生成器并依赖小型领域数据，另一些从零训练大型异构模型并依赖大规模机器人视频。
    - 理论与实证深度不同：一篇概念性分析主张建立状态/动态分类和功能基准，多数方法论文主要报告经验收益，缺少可比较的形式分析。
    开放问题:
    - 当前动作条件化视频世界模型能否在真实分布偏移下满足形式化的状态-动态条件，哪些假设需要被检验？
    - 在面对更困难的空间推理基准时，何种测试时验证器或奖励信号能避免已观察到的偏差和校准失败并实现一致缩放？
    - 哪些功能基准能把物理持久性、因果推理和动作对齐与视觉质量区分开，并且其提升能否迁移到操作任务之外？
    - 已报告的缩放、速度和后训练收益是经验改进还是可泛化保证，相关代码、数据和局限性证据不足如何影响验证？
