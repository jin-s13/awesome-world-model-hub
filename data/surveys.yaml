  related_work_outline_zh:
  - 主流方向：以具身和驾驶等场景为中心的应用型世界模型，生成式视频/扩散与动作耦合预训练在近期证据中占主导。
  - 研究共性：在领域条件下学习观测动力学，再将模型用于预测、策略训练或闭环评测；记忆和动作可控性基准开始出现。
  - 关键差异：表示从潜在状态空间模型到显式视频扩散；监督信号从无动作视频、动作-视频配对到可观测上下文；评测目标跨驾驶、机器人、游戏和基准指标。
  - 趋势演进：可见论文集中在2023-2026年，从Atari样本高效RL向大规模驾驶/机器人世界模型及专门的记忆一致性、动作控制基准演进；更早年份在本包中缺少代表性证据。
  - 开放问题：现实迁移、隐藏上下文泛化、长期记忆一致性、跨动作空间控制以及物理合理性度量仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation use cases
      what_it_solves: Learns multi-view, long-horizon video prediction for driving
        scenes and closed-loop simulation evaluation.
      what_remains_open: Whether simulation or validation gains transfer to real-world
        safety and operational outcomes across unseen driving datasets.
    - line: Embodied robot world models
      what_it_solves: Generates robot action-conditioned video and dynamics for policy
        training, evaluation, and task planning from multimodal instructions.
      what_remains_open: Generalization beyond seen primitive combinations and unseen
        embodiments; physical plausibility is only partially measured.
    - line: Contextual and recurrent world models for control
      what_it_solves: Learns latent dynamics from observations and actions for sample-efficient
        policy learning and zero-shot generalization to context changes.
      what_remains_open: Assumes visible context in some settings and is validated
        on few tasks, leaving hidden-context and long-horizon control unverified.
    - line: World-model evaluation benchmarks
      what_it_solves: Measures spatial memory consistency, action control, and closed-loop
        revisiting behavior in open-domain interactive environments.
      what_remains_open: Current models struggle with long-term memory consistency
        and cross-action-space generalization; benchmark results are not connected
        to deployment outcomes.
    consensus:
    - World-model research in these applications increasingly treats video or observation
      generation as a central capability, not only latent dynamics.
    - Several methods add auxiliary tasks or conditioning signals such as action,
      context, physics, keypoints, or mask reconstruction to improve downstream policy
      learning or generation quality.
    - There is growing recognition that spatial and temporal memory consistency and
      action controllability need explicit benchmark evaluation.
    disagreements:
    - 'Representation differs: latent recurrent/state-space dynamics for control versus
      explicit diffusion-based video generation for driving or robot imagination.'
    - 'Supervision differs: some models rely on paired action-video data, some use
      action-free video with controlled diffusion timesteps, and others assume observable
      context variables.'
    - 'Evaluation targets differ: Atari human-normalized scores, driving video prediction
      metrics on NuScenes/OpenDV-2K/Waymo, robot policy execution, and scene-graph
      or memory/action consistency benchmarks.'
    - 'Physical grounding differs: some methods impose physics-related tasks such
      as depth and keypoint dynamics, while others learn from mask reconstruction
      or generative diffusion without explicit physical constraints.'
    open_questions:
    - Do improvements in driving video prediction and robotic video fidelity translate
      to safer or more reliable real-world operation?
    - Can contextual world models generalize when context variables are hidden rather
      than given?
    - How should long-term memory consistency and cross-action-space control be evaluated
      in open-domain environments?
    - What physical plausibility metrics and generalization tests would connect generative
      world models to downstream policy success?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与闭环仿真应用
      解决的问题: 学习驾驶场景的多视角、长时域视频预测，用于场景推演和闭环仿真评测。
      尚未覆盖: 仿真或验证指标提升能否迁移到真实安全与运营结果，以及跨驾驶数据集的零样本泛化尚未验证。
    - 路线: 具身机器人与机器人世界模型
      解决的问题: 生成以动作或语言为条件的机器人视频和动力学，用于策略训练、策略评估和任务想象。
      尚未覆盖: 泛化受限于已见原语组合；未见本体和物理合理性指标尚未充分覆盖。
    - 路线: 上下文与循环世界模型用于控制
      解决的问题: 从观测和动作学习潜在动力学，提升样本效率，并在上下文变化时实现零样本泛化。
      尚未覆盖: 部分方法假设上下文可观测且仅在少数任务上验证，隐藏上下文和长时域控制尚未覆盖。
    - 路线: 世界模型评估基准
      解决的问题: 在开放交互环境中测量空间记忆一致性、动作可控性和闭环重访行为。
      尚未覆盖: 当前模型仍难以保持长期记忆一致性和跨动作空间泛化，基准结果也未与部署结果关联。
    共识:
    - 这些应用中的世界模型研究越来越把视频或观测生成作为核心能力，而不仅是潜在动力学建模。
    - 多种方法通过增加动作、上下文、物理、关键点或掩码重建等辅助任务或条件，提升下游策略学习或生成质量。
    - 研究开始认识到空间和时间记忆一致性以及动作可控性需要显式的基准评估。
    分歧:
    - 表示方式不同：潜在循环/状态空间动力学用于控制，对比显式扩散视频生成用于驾驶或机器人想象。
    - 监督信号不同：依赖动作-视频配对数据、利用无动作视频和扩散时间步控制、或假设可观测上下文变量。
    - 评测目标不同：Atari人类标准化得分、驾驶视频预测指标（如NuScenes/OpenDV-2K/Waymo）、机器人策略执行、以及场景图或记忆/动作一致性基准。
    - 物理先验不同：部分方法通过深度和关键点动力学施加物理约束，另一些则依赖掩码重建和生成扩散，缺少显式物理约束。
    开放问题:
    - 驾驶视频预测和机器人视频保真度的提升能否转化为更安全或更可靠的现实部署？
    - 当上下文变量隐藏而不可观测时，上下文世界模型如何泛化？
    - 如何在开放域环境中评测长期记忆一致性和跨动作空间控制？
    - 哪些物理合理性指标和泛化测试能将生成世界模型与下游策略成功关联起来？
