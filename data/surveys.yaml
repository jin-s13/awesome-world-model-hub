  related_work_outline_zh:
  - 主流方向：构建可运行的世界模型模拟器与视频生成流水线，用于自动驾驶、机器人、游戏等领域的闭环评估。
  - 研究共性：以预训练视频生成模型为基础，添加动作条件模块，利用大规模标注数据集训练，并在特定领域基准上评估可控性、一致性和保真度。
  - 关键差异：部分工作聚焦实时交互服务（亚秒级延迟），部分关注动力学零样本泛化，还有一部分构建基准套件以量化空间一致性或动作准确性等特定属性。
  - 趋势演进：2024–2026年间，领域从基于模型的强化学习（Dreamer）算法扩展，转向基于扩散和Transformer的视频模拟器，并逐步强调开源基准和实时闭环系统。
  - 开放问题：长时域时间与跨视图一致性、对未见硬件与传感器配置的泛化、速度与物理合理性之间的权衡，以及跨团队的独立复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Deployable world simulators and closed-loop simulation pipelines
      what_it_solves: Transforms video generative models into runnable simulators
        for closed-loop training and policy evaluation in autonomous driving and robotics.
      what_remains_open: Generalization to real-world deployment, long-horizon consistency
        degradation beyond training sequences, and robustness to varied sensor setups.
    - line: Benchmarking and evaluation frameworks for world models
      what_it_solves: Provides standardized datasets and metrics to quantify spatial
        consistency, action fidelity, and video quality, enabling fair comparison
        across world models.
      what_remains_open: Existing benchmarks are limited to specific domains (Minecraft,
        nuScenes) and lack comprehensive evaluation of physical realism, interactive
        diversity, and open-world scenarios.
    - line: Real-time interactive world-model serving
      what_it_solves: Achieves low-latency, high-frame-rate action-conditioned video
        generation to support real-time feedback in closed-loop control systems.
      what_remains_open: Trade-offs between inference speed, visual fidelity, and
        physical accuracy; scalability to multi-GPU and complex multi-agent environments
        is unverified.
    - line: Context-aware world models for zero-shot generalization
      what_it_solves: Incorporates observable context into world-model dynamics to
        enable policy transfer to unseen environmental parameters without retraining.
      what_remains_open: Assumes context observability, which is often unavailable
        in practice; evaluation is limited to a small set of tasks, leaving broader
        dynamic generalization unaddressed.
    consensus:
    - Video generative models pretrained on large-scale data are the dominant backbone
      for building world simulators.
    - Action-conditioned control is essential for turning a video generator into a
      usable world model, and is achieved through lightweight plug-in modules and
      motion-focused losses.
    - Quantitative evaluation on curated datasets with task-specific metrics (e.g.,
      FID, FVD, scene graph consistency) is the shared methodology for validating
      system performance.
    - Open-source release of code, datasets, and benchmarks is increasingly treated
      as a necessary component of system-level contributions.
    disagreements:
    - 'Representation: diffusion-based generation (Vista, FAR-Drive) vs. autoregressive
      transformers (DWS) vs. recurrent state-space models (cRSSM).'
    - 'Supervision signal: some systems rely on trajectory-annotated driving data,
      others inject physics priors like depth and keypoints, and a third group uses
      context labels for dynamics.'
    - 'Evaluation target: spatial consistency (LoopNav) vs. action fidelity (ACT-Bench)
      vs. zero-shot generalization (cRSSM) vs. visual quality and controllability
      (Vista).'
    - 'Interaction mode: offline generation for simulation rollouts (DWS) vs. real-time
      closed-loop serving with sub-second latency (FAR-Drive).'
    - 'Deployment setting: single-camera game environments vs. multi-view driving
      scenarios vs. embodied robotic manipulation, each imposing different system
      constraints.'
    open_questions:
    - How can long-horizon consistency be maintained in autoregressive video generation
      without error accumulation across thousands of frames?
    - What is the minimal set of physics priors needed to guarantee physical plausibility
      while keeping inference latency low enough for real-time control?
    - Can world-model simulators trained on one sensor configuration (e.g., nuScenes
      cameras) transfer to different vehicle platforms or weather conditions without
      retraining?
    - What evaluation protocols can capture the interactive richness and open-endedness
      of real-world environments beyond existing domain-specific benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可部署的世界模拟器与闭环仿真流水线
      解决的问题: 将视频生成模型转化为可运行的模拟器，用于自动驾驶和机器人领域的闭环训练与策略评估。
      尚未覆盖: 对真实部署的泛化能力、超出训练序列的长时域一致性退化，以及跨传感器配置的鲁棒性。
    - 路线: 世界模型的基准测试与评估框架
      解决的问题: 提供标准化数据集和指标，量化空间一致性、动作准确性和视频质量，实现世界模型的公平比较。
      尚未覆盖: 现有基准仅限于特定领域（Minecraft、nuScenes），缺乏对物理真实性、交互多样性和开放场景的全面评估。
    - 路线: 实时交互式世界模型服务
      解决的问题: 实现低延迟、高帧率的动作条件视频生成，以支撑闭环控制系统的实时反馈。
      尚未覆盖: 推理速度、视觉保真度与物理准确性之间的权衡；多GPU扩展及复杂多智能体环境下的可扩展性尚未验证。
    - 路线: 上下文感知世界模型与零样本泛化
      解决的问题: 将可观测上下文纳入世界模型动力学，使策略能在未见环境参数下零样本迁移，无需重新训练。
      尚未覆盖: 假设上下文可观测，实践中常不成立；评估任务少，更广泛的动态泛化未解决。
    共识:
    - 大规模预训练的视频生成模型是构建世界模拟器的主流基础架构。
    - 动作条件控制是将视频生成器转化为可用世界模型的关键，通过轻量级插件模块和运动增强损失实现。
    - 在精心构建的数据集上使用任务特定指标（如FID、FVD、场景图一致性）进行定量评估，是验证系统性能的共同方法。
    - 代码、数据集和基准的开源发布，正日益被视为系统级贡献的必要组成部分。
    分歧:
    - 表示方式：基于扩散的生成（Vista、FAR-Drive）与自回归Transformer（DWS）及循环状态空间模型（cRSSM）之间的差异。
    - 监督信号：部分系统依赖轨迹标注的驾驶数据，部分注入深度和关键点等物理先验，还有部分使用上下文标签描述动力学。
    - 评测目标：空间一致性（LoopNav）与动作准确性（ACT-Bench）、零样本泛化（cRSSM）及视觉质量与可控性（Vista）各有侧重。
    - 交互模式：纯离线生成用于仿真推演（DWS）与亚秒级延迟的实时闭环服务（FAR-Drive）形成对比。
    - 部署场景：单摄像头游戏环境、多视角驾驶场景、具身机器人操作，各自施加不同的系统约束。
    开放问题:
    - 如何在自回归视频生成中维持长时域一致性，避免数千帧以上的误差累积？
    - 保证物理合理性的最小物理先验集合是什么，同时将推理延迟控制在实时控制所需的范围内？
    - 在一种传感器配置（如nuScenes相机）上训练的世界模型模拟器，能否不经重新训练就迁移到不同的车辆平台或天气条件？
    - 哪些评估协议能够捕捉真实环境中的交互丰富性和开放性，突破现有领域特定基准的局限？
