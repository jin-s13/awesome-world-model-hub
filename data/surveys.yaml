  related_work_outline_zh:
  - 主流方向：当前前沿集中于为具身、游戏和自动驾驶场景构建可控世界模型模拟器，强调动作或轨迹条件、闭环推演以及下游策略或规划用途。
  - 研究共性：贡献通常将学习到的动力学或视频生成模型与评测工件结合；在视觉保真之外，引入控制接口、运动或物理目标以及更多指标。
  - 关键差异：系统在控制接口、领域与传感器假设、建模主干和评测目标上不同，例如空间一致性、动作忠实度、物理合理性、规划质量或策略学习。
  - 趋势演进：从现有2024-2026证据看，研究正从开环生成走向闭环动作可控仿真，提出实时推理主张，评测也更重视下游效用而非仅图像质量。
  - 开放问题：跨数据集和跨具身泛化、长时域自回归稳定性、仿真到真实迁移基础，以及真实部署约束下的独立可复现性仍缺乏证据。
  literature_review:
    line_of_work_matrix:
    - line: Evaluating world-model systems through specialized benchmarks
      what_it_solves: Provides datasets and metrics for spatial consistency, action
        fidelity, and task-specific simulation realism beyond output appearance.
      what_remains_open: Coverage is narrow in environment and sensory setting; long-horizon,
        cross-embodiment, and safety-critical validity are not established.
    - line: Action-controllable video generation and simulation
      what_it_solves: Converts generative video models into runnable simulators with
        action, trajectory, or context conditioning and structured multi-view or physics-aware
        generation.
      what_remains_open: Long-horizon consistency, trade-offs between motion fidelity
        and fine visual detail, and generalization beyond trained driving, game, and
        robot domains.
    - line: Learned dynamics for policy learning and planning
      what_it_solves: Uses world-model rollouts or generative futures for zero-shot
        contextual RL, model-based RL, scenario generation, and planning.
      what_remains_open: Reliance on observable context or action labels, limited
        task diversity, and uncertain sim-to-real policy transfer.
    - line: Real-time and reproducible simulator serving
      what_it_solves: Supports closed-loop use through training or inference efficiency,
        dual-mode generation, and released code or datasets.
      what_remains_open: Deployment evidence is often single-domain or single-GPU;
        multi-sensor, multi-agent, and infrastructure-independent reproduction remain
        unverified.
    consensus:
    - Learned world models are treated as systems that generate future observations
      under control, not merely as video synthesis models.
    - Evaluation is shifting toward control-sensitive metrics such as action fidelity,
      spatial consistency, physical plausibility, and downstream planning or RL performance.
    - Most contributions pair a modeling improvement with a dataset or benchmark artifact
      and use autoregressive or trajectory-conditioned rollouts.
    - Published experiments support strong in-domain results, while generalization
      and independent deployment evidence remain limited.
    disagreements:
    - 'Control interface differs: explicit observable context values for adaptation,
      action or trajectory conditioning for driving, and spatial loop cues for memory
      consistency.'
    - 'Evaluation target differs: 3D spatial consistency, action fidelity, visual
      and physical plausibility, downstream planning quality, or sample-efficient
      policy learning.'
    - 'Modeling backbone differs: recurrent state-space model modifications, multi-view
      diffusion transformers, frame-level autoregressive generation, and pre-trained
      video generative model adapters.'
    - 'Domain and sensor assumptions differ: single-agent Minecraft video, robot manipulation
      video, and multi-camera autonomous driving data create different deployment
      constraints.'
    - 'System success criteria differ: some optimize quantitative simulation metrics,
      others prioritize sub-second closed-loop latency, and others emphasize open
      artifacts or downstream policy utility.'
    open_questions:
    - How do these simulators perform outside their source datasets such as nuScenes,
      CARL, Minecraft, and the reported game or robotics settings?
    - Can long-horizon autoregressive rollouts preserve action fidelity, spatial consistency,
      and visual detail simultaneously without compounding errors?
    - What sim-to-real gap remains when policies are trained or evaluated inside these
      learned world models and then deployed physically?
    - How do real-time claims extend to multi-GPU, multi-sensor, safety-critical,
      or edge deployment settings beyond the reported single-GPU latency?
    - What evidence is missing for independent reproduction across teams, infrastructure,
      and task variations given incomplete limitation reporting and unavailable citation
      or prestige signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通过专用基准评估世界模型系统
      解决的问题: 提供数据集和指标，衡量空间一致性、动作忠实度及任务相关仿真真实感，而非只看输出外观。
      尚未覆盖: 环境和传感器覆盖较窄；长时域、跨具身和物理或安全关键场景的有效性尚未建立。
    - 路线: 可动作控制的视频生成与仿真
      解决的问题: 将生成式视频模型转化为可运行模拟器，通过动作、轨迹或上下文条件以及结构化多视图或物理感知生成。
      尚未覆盖: 长时域一致性、运动保真与细粒度视觉细节的权衡，以及向训练之外驾驶、游戏和机器人领域泛化仍不清晰。
    - 路线: 面向策略学习与规划的学习动力学
      解决的问题: 利用世界模型推演或生成式未来，实现零样本上下文强化学习、基于模型的强化学习、场景生成和规划。
      尚未覆盖: 依赖可观测上下文或动作标签，任务多样性有限，仿真到真实策略迁移存在不确定性。
    - 路线: 实时且可复现的模拟器服务
      解决的问题: 通过训练或推理效率、双模式生成及开源代码或数据集支持闭环使用。
      尚未覆盖: 部署证据多限于单一领域或单GPU；多传感器、多智能体和跨基础设施的独立复现仍未验证。
    共识:
    - 学习型世界模型被视为在控制条件下生成未来观测的系统，而不仅是视频合成模型。
    - 评估正转向对控制敏感的指标，例如动作忠实度、空间一致性、物理合理性和下游规划或强化学习表现。
    - 多数贡献将建模改进与数据集或基准工件配对，并采用自回归或轨迹条件推演。
    - 已发表实验支持较强的领域内结果，但泛化和独立部署证据仍然有限。
    分歧:
    - 控制接口不同：显式可观测上下文值适配、动作或轨迹条件驾驶，以及用于记忆一致性的空间环路线索。
    - 评测目标不同：三维空间一致性、动作忠实度、视觉与物理合理性、下游规划质量或样本高效策略学习。
    - 建模主干不同：循环状态空间模型修改、多视图扩散Transformer、帧级自回归生成以及预训练视频生成模型适配器。
    - 领域和传感器假设不同：单智能体Minecraft视频、机器人操作视频和多相机自动驾驶数据带来不同部署约束。
    - 系统成功标准不同：有的优化量化模拟指标，有的一优先亚秒级闭环延迟，还有的强调开放工件或下游策略效用。
    开放问题:
    - 这些模拟器在nuScenes、CARL、Minecraft以及所报告的游戏或机器人设置之外表现如何？
    - 长时域自回归推演能否同时保持动作忠实度、空间一致性和视觉细节，而不产生误差累积？
    - 当策略在这些学习世界模型内部训练或评估后再部署到物理环境时，仿真到真实的差距还有多少？
    - 实时性主张在超出所报告单GPU延迟的多GPU、多传感器、安全关键或边缘部署中如何扩展？
    - 鉴于限制报告不完整且引用或声望信号不可用，跨团队、基础设施和任务变化的独立复现还缺少哪些证据？
