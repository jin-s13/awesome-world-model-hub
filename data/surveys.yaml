  related_work_outline:
  - 'Mainstream direction: Generative, diffusion-based world models are being applied
    to embodied and interactive domains, especially robotics and driving; they predict
    video or latent rollouts conditioned on actions, language goals, or context to
    support policy training, planning, and simulation.'
  - 'Shared research pattern: Papers combine RGB or latent video generation with auxiliary
    tasks such as mask reconstruction, depth/keypoint prediction, explicit context
    conditioning, or joint action-video diffusion to improve generalization, efficiency,
    and physical or spatial consistency.'
  - 'Key differences: They differ by deployment domain such as driving, robot manipulation,
    games, or navigation; by representation and supervision, including unified diffusion,
    factorized primitives, and recurrent state-space models; and by evaluation target
    such as dataset realism, RL score, loop consistency, action controllability, or
    physical plausibility.'
  - 'Trend evolution: The top evidence concentrates in 2023-2026 and moves from model-based
    reinforcement learning with learned latent dynamics toward large-scale video and
    action diffusion world models for robotics and driving, plus newer consistency-oriented
    benchmarks; older foundations appear only indirectly in this sample.'
  - 'Open questions: Real-world transfer and safety alignment, generalization beyond
    seen combinations or observable context, long-horizon memory and action controllability,
    and reproducibility from limited artifact evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以生成式扩散世界模型为核心，将视频或潜在轨迹生成应用于机器人、驾驶和交互式环境，通过动作、语言目标或上下文条件支持策略训练、规划与仿真。
  - 研究共性：在RGB或潜在视频生成之外加入辅助监督，如掩码重建、深度/关键点预测、显式上下文条件或视频-动作联合扩散，以增强泛化、效率和时空一致性。
  - 关键差异：部署领域不同，涉及机器人操作、驾驶、游戏和导航；表示与监督方式不同，包括统一扩散、分解原语和循环状态空间模型；评测目标也不同，涵盖真实感、RL分数、回环一致性、动作可控性和物理合理性。
  - 趋势演进：主要证据集中在2023至2026年，从基于模型强化学习的潜在动力学向大规模视频与动作扩散世界模型演进，并出现针对一致性、记忆与动作控制的评测基准；更早趋势在此样本中只能间接观察。
  - 开放问题：真实世界迁移与安全对齐、未知组合或不可观测上下文的泛化、长时域记忆与动作可控性，以及有限工件证据下的可复现性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models and video generation
      what_it_solves: Learning to generate robot execution videos conditioned on language,
        goals, or actions for policy training and evaluation.
      what_remains_open: Generalization to unseen primitive combinations and real-robot
        transfer across embodiments remain limited; physical plausibility and deployment
        evidence are still sparse.
    - line: Autonomous driving world models and simulation
      what_it_solves: Predicting long-horizon, multi-view driving scenes and enabling
        closed-loop simulation for driving policy evaluation.
      what_remains_open: Whether benchmark gains on driving datasets translate to
        real-world safety or operational outcomes remains unclear; zero-shot transfer
        across driving domains is only partially demonstrated.
    - line: Model-based reinforcement learning with world models
      what_it_solves: Learning latent dynamics from limited interaction to train policies
        more efficiently in visual control and game environments.
      what_remains_open: Assumptions such as observable context and evaluation on
        few tasks leave zero-shot generalization under novel or unobserved dynamics
        under-tested.
    - line: Benchmarks for world-model memory, spatial consistency, and action control
      what_it_solves: Quantifying whether generated rollouts remain temporally stable,
        spatially consistent, and responsive to actions across loops and viewpoints.
      what_remains_open: Benchmarks are recent and mainly expose current model challenges;
        coverage of action spaces, scenes, and long-horizon consistency is not yet
        complete.
    consensus:
    - Recent applications center on generative video rollouts conditioned on actions,
      language goals, or task context for embodied and interactive settings.
    - Auxiliary supervision beyond RGB generation, such as mask reconstruction, depth/keypoint
      prediction, context conditioning, or joint action-video diffusion, is commonly
      used to improve consistency and generalization.
    - Evaluation is moving beyond visual fidelity toward long-horizon rollout stability,
      spatial or memory consistency, and action controllability.
    - Several top application papers report strong benchmark results while providing
      limited limitation statements or real-world deployment evidence, so verification
      gaps remain.
    disagreements:
    - 'Representation differs: unified video-action diffusion, factorized primitive-conditioned
      video generators, and recurrent state-space or latent dynamics models coexist
      in the evidence.'
    - 'Supervision and assumptions differ: some methods use action-free video or language
      goals, others require paired video-action data, and some assume observable context
      values.'
    - Evaluation targets differ, including driving dataset realism, Atari 100k human-normalized
      performance, Minecraft loop-based spatial consistency, robot simulation execution,
      and physical plausibility.
    - 'Interaction mode and deployment setting differ: closed-loop driving simulation,
      robot imagination and policy training, and game/navigation loop interactions
      imply different action spaces and timescales.'
    - 'Methods differ in how they enforce consistency: some use mask reconstruction,
      others use depth and keypoint dynamics, and benchmarks use scene-graph or revisited-loop
      metrics.'
    open_questions:
    - Do driving world model improvements on validation and zero-shot datasets translate
      into real-world safety or operational outcomes?
    - Can embodied world models generalize to unseen objects, actions, or embodiments
      without assuming observable context values?
    - Which metrics can jointly capture long-term memory consistency, action controllability,
      and physical plausibility across different deployment domains?
    - Does large-scale joint video-action diffusion pretraining improve real robot
      policies across hardware and embodiments compared with imitation learning?
