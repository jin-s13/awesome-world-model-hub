  related_work_outline_zh:
  - 主流方向：构建统一分类法和评估框架，将快速增长的世界模型文献系统化，从孤立方法走向结构化设计空间。
  - 研究共性：综述通过提出分类维度（潜在表示、应用场景、技术挑战）、识别核心挑战并比较基准来组织领域，揭示研究缺口。
  - 关键差异：覆盖范围从通用世界模型到特定领域（自动驾驶、交互式视频）不同；分类轴心各异（潜在空间 vs. 应用驱动）；评估框架从纯理论方案到已实施的基准对比，实证程度不一。
  - 趋势演进：从2022年早期单领域应用，到2024–2026年大量综合综述和统一框架涌现，显示领域正走向标准化和以缺口为导向的路线图。
  - 开放问题：如何实证验证分类法并保持其时效性；如何设计跨领域、闭环的基准以同时捕捉生成质量与决策性能；如何在物理推理、长时记忆和实时交互等已识别挑战中确定优先级。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing fragmented world model research into unified design
        spaces and roadmaps, e.g., latent-space taxonomies for driving or interactive
        video modeling frameworks.
      what_remains_open: Taxonomies often lack empirical validation and may miss emerging
        paradigms; proposed frameworks remain theoretical without implementation to
        confirm coverage.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices (open-loop vs.
        closed-loop, resource-aware metrics) shape conclusions across world model
        papers, e.g., comparing benchmarks in autonomous driving and robotics.
      what_remains_open: Cross-setting compatibility of results is unverified; existing
        benchmarks rarely capture closed-loop decision quality and real-time constraints
        simultaneously.
    - line: Open problem and gap mapping
      what_it_solves: Turning broad literature coverage into concrete next-step questions,
        such as action-conditioned controllability, long-horizon memory, and out-of-sight
        dynamics.
      what_remains_open: Prioritization of gaps is unclear; which challenges (e.g.,
        physical law comprehension vs. real-time interactivity) matter most for downstream
        tasks remains debated.
    consensus:
    - World model research is converging on the need for unified taxonomies and evaluation
      frameworks to manage rapid growth and avoid fragmentation.
    - Action-conditioned controllability, long-term memory, and real-time interactivity
      are widely recognized as core technical challenges across application domains.
    - Current benchmarks are insufficient for assessing closed-loop performance and
      resource efficiency, creating a gap between generation metrics and deployment
      readiness.
    disagreements:
    - 'Scope: some surveys target general world models spanning video generation,
      driving, and agents, while others focus narrowly on interactive video or autonomous
      driving.'
    - 'Taxonomy dimensions: one line uses latent representations and structural priors,
      another uses application scenarios and world state evolution, leading to incompatible
      organizational schemes.'
    - 'Evaluation maturity: frameworks range from purely conceptual proposals with
      no empirical backing to implemented benchmark comparisons, resulting in different
      levels of evidence for claimed gaps.'
    open_questions:
    - How can proposed taxonomies be empirically validated and kept up-to-date with
      the rapid pace of method development?
    - What metrics and benchmarks can fairly compare world models across diverse domains
      like robotics, driving, and open-world games under both open-loop and closed-loop
      settings?
    - How should the field balance open-loop generation fidelity with closed-loop
      decision-making performance under real-time constraints, and which gaps should
      be prioritized first?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为统一的设计空间和路线图，例如自动驾驶的潜在空间分类法或交互式视频建模框架。
      尚未覆盖: 分类法通常缺乏实证验证，可能遗漏新兴范式；所提框架多为理论性，未通过实施确认其完备性。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（开环 vs. 闭环、资源感知指标）如何影响跨论文结论，例如比较自动驾驶和机器人领域的基准。
      尚未覆盖: 不同设置下结果的兼容性未经验证；现有基准很少同时捕捉闭环决策质量和实时约束。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体的下一步研究问题，如动作条件可控性、长时记忆和视线外动态。
      尚未覆盖: 缺口的优先级不明确；哪些挑战（如物理规律理解 vs. 实时交互）对下游任务最重要仍存在争议。
    共识:
    - 世界模型研究正汇聚于对统一分类法和评估框架的需求，以管理快速增长并避免碎片化。
    - 动作条件可控性、长期记忆和实时交互被广泛认为是跨应用领域的核心技术挑战。
    - 当前基准不足以评估闭环性能和资源效率，导致生成指标与部署就绪之间存在差距。
    分歧:
    - 覆盖范围：部分综述针对涵盖视频生成、驾驶和智能体的通用世界模型，而另一些则聚焦于交互式视频或自动驾驶。
    - 分类维度：一条路线使用潜在表示和结构先验，另一条使用应用场景和世界状态演化，导致组织方案不兼容。
    - 评估成熟度：框架从纯概念性提议（无实证支持）到已实施的基准对比不等，导致所声称缺口的证据强度不同。
    开放问题:
    - 如何实证验证所提分类法，并使其跟上方法发展的快速步伐？
    - 哪些指标和基准能在开环和闭环设置下公平比较跨领域（如机器人、驾驶、开放世界游戏）的世界模型？
    - 领域应如何在实时约束下平衡开环生成保真度与闭环决策性能，以及应优先解决哪些缺口？
