    - line: Action-controllable closed-loop simulators
      what_it_solves: Generates future video from trajectory or action controls and
        supports low-latency closed-loop simulation, including sub-second driving
        video generation.
      what_remains_open: Generalization beyond nuScenes-like settings, long-horizon
        cross-view consistency, and multi-GPU deployment remain unverified.
    - line: Context/physics-informed world-model architectures
      what_it_solves: Adds context or physics constraints to latent dynamics or video
        generation to improve zero-shot generalization and physical plausibility.
      what_remains_open: Assumes observable context or relies on narrow benchmark
        tasks; limitation details and out-of-distribution behavior are not fully reported.
    - line: Cross-embodiment latent-action world models
      what_it_solves: Uses a shared latent action interface across heterogeneous interaction
