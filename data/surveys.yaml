    - 'Supervision and data sources differ: online physical interaction with sparse
      rewards, large-scale trajectory-annotated driving videos, context-conditioned
      reinforcement learning tasks, and pretrained video priors.'
    - 'Evaluation emphasis differs: some target zero-shot contextual generalization,
      others target action fidelity, spatial consistency, visual fidelity, physical
