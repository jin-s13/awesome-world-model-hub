  related_work_outline:
  - 'Mainstream direction: World models are shifting from passive video prediction
    to embodied, action-conditioned generative models that integrate physics, memory,
    and planning for robotics and autonomous driving.'
  - 'Shared research pattern: Recent methods embed structural priors (mask reconstruction,
    keypoint dynamics, compositional primitives, diffusion timestep coupling) into
    transformer or diffusion architectures to improve video fidelity, long-horizon
    consistency, and downstream task generalization.'
  - 'Key differences: Approaches differ in how they couple actions and observations—some
    use explicit action-conditioned latent dynamics (Dreamer variants), others jointly
    diffuse video and actions (Unified World Models), and some decompose language
    into primitives (RoboDreamer) or inject physics via auxiliary tasks (RoboScape).'
  - 'Trend evolution: From 2023–2026 the frontier moved from efficient stochastic
    world models for Atari (STORM) to large-scale pretraining on robotic datasets,
    multi-task generalization, and dedicated benchmarks for spatial and memory consistency
    (LoopNav, MIND).'
  - 'Open questions: How to isolate model contributions from planner/controller effects,
    whether compositional or physics-informed designs transfer to unseen real-world
    dynamics, and what evaluation protocols reliably measure long-term memory and
    action fidelity across diverse embodiments.'
  related_work_outline_zh:
  - 主流方向：世界模型正从被动视频预测转向具身、动作条件生成模型，融合物理、记忆和规划，用于机器人和自动驾驶。
  - 研究共性：近期方法将结构先验（掩码重建、关键点动力学、组合原语、扩散时间步耦合）嵌入Transformer或扩散架构，以提升视频保真度、长时域一致性和下游任务泛化。
  - 关键差异：方法在动作与观测的耦合方式上存在分歧——有的使用显式动作条件潜在动力学（Dreamer变体），有的联合扩散视频和动作（Unified World
    Models），有的将语言分解为原语（RoboDreamer），或通过辅助任务注入物理（RoboScape）。
  - 趋势演进：2023至2026年，前沿从Atari高效随机世界模型（STORM）转向大规模机器人数据集预训练、多任务泛化，以及针对空间和记忆一致性的专用基准（LoopNav、MIND）。
  - 开放问题：如何分离模型贡献与规划器/控制器效应，组合或物理信息设计能否迁移到未见真实动力学，以及何种评估协议能可靠衡量不同具身下的长时记忆和动作保真度。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforms world-model concepts into concrete architectures
        (diffusion transformers, Dreamer variants, VAE–transformer hybrids) and training
        objectives (mask reconstruction, keypoint dynamics, compositional primitives,
        physics-informed losses) to improve video generation fidelity and long-horizon
        consistency.
      what_remains_open: Most work is evaluated on narrow domains (driving, Atari,
        simulated robots); it is unclear which architectural and objective choices
        transfer when the visual domain, action space, or physical properties change
        significantly.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention by using world models
        for policy training (Dreamer, STORM), unified video–action diffusion (UWM),
        or compositional video planning (RoboDreamer), enabling generalization to
        unseen tasks or zero-shot contexts.
      what_remains_open: The gain attributable to the model versus the planner or
        controller is rarely isolated; moreover, generalization to novel action spaces
        or physical constraints beyond the training distribution remains weakly tested.
    - line: Method evidence and evaluation protocol
      what_it_solves: Provides targeted benchmarks (LoopNav for spatial consistency,
        MIND for memory consistency and action control) that move beyond aggregate
        scores to probe specific world-model capabilities, helping separate method
        contributions from dataset and baseline effects.
      what_remains_open: Existing benchmarks are limited to simulated or game environments
        (Minecraft, custom scenes); real-world dynamics, diverse embodiment, and standardized
        protocols for ablating model versus system components are still missing.
    consensus:
    - Transformer and diffusion-based backbones have become the dominant architecture
      for world models, replacing pure RNN/SSM designs in recent high-performing methods.
    - World models are increasingly evaluated on their ability to serve downstream
      robotics or control tasks, not solely on pixel-level reconstruction quality.
    disagreements:
    - 'Supervision signal: some methods rely purely on pixel reconstruction loss,
      while others inject explicit physics knowledge (depth, keypoints) or use language
      as a compositional scaffold.'
    - 'Interaction mode: models either operate in open-loop video prediction or are
      embedded in closed-loop policy training; the coupling between action and observation
      ranges from separate latent dynamics to fully joint diffusion processes.'
    open_questions:
    - Under what conditions do compositional or physics-informed world models improve
      zero-shot generalization beyond the training domain, and what evaluation protocols
      can reliably measure such improvement?
    - How can we disentangle the effect of the world model architecture from the planner,
      controller, or data regime, when reported gains appear on different benchmarks
      and tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型理念转化为具体架构（扩散Transformer、Dreamer变体、VAE-Transformer混合）和训练目标（掩码重建、关键点动力学、组合原语、物理信息损失），以提升视频生成保真度和长时域一致性。
      尚未覆盖: 大多数工作在狭窄领域（驾驶、Atari、仿真机器人）上评估；当视觉域、动作空间或物理特性显著变化时，哪些架构和训练目标选择可以迁移尚不清楚。
    - 路线: 规划与动作接口方法
      解决的问题: 通过学习到的动力学连接干预行为，使用世界模型进行策略训练（Dreamer、STORM）、统一视频-动作扩散（UWM）或组合视频规划（RoboDreamer），实现未见任务或零样本上下文的泛化。
      尚未覆盖: 模型相对于规划器或控制器的增益很少被分离；此外，对训练分布之外的新动作空间或物理约束的泛化能力缺乏充分测试。
    - 路线: 方法证据与评估协议
      解决的问题: 提供针对性基准（LoopNav针对空间一致性，MIND针对记忆一致性和动作控制），超越聚合分数，探测特定世界模型能力，有助于区分方法贡献与数据集、基线效应。
      尚未覆盖: 现有基准主要限于仿真或游戏环境（Minecraft、自定义场景）；真实世界动力学、多样化具身，以及用于消融模型与系统组件的标准化协议仍然缺失。
    共识:
    - Transformer和扩散基架已成为世界模型的主流架构，在近期高性能方法中取代了纯RNN/SSM设计。
    - 世界模型越来越多地根据其服务于下游机器人或控制任务的能力来评估，而不仅仅是像素级重建质量。
    分歧:
    - 监督信号：部分方法仅依赖像素重建损失，而其他方法注入显式物理知识（深度、关键点）或使用语言作为组合支架。
    - 交互模式：模型要么进行开环视频预测，要么嵌入闭环策略训练；动作与观测的耦合从分离的潜在动力学到完全联合的扩散过程各不相同。
    开放问题:
    - 在何种条件下，组合化或物理信息驱动的世界模型能提升训练域之外的零样本泛化，什么样的评估协议能可靠衡量这种提升？
    - 当在不同基准和任务上报告增益时，如何将世界模型架构的效果与规划器、控制器或数据规模的影响解耦？
