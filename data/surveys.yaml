  related_work_outline_zh:
  - 主流方向：证据集中在以动作条件视频生成作为机器人/具身任务的世界模型基础，扩散Transformer和动作-帧对齐建模占主导。
  - 研究共性：将视觉观测与动作轨迹耦合，用生成的轨迹支持策略学习、规划、评估或合成数据；物理合理性被当作可训练或可后训练属性。
  - 关键差异：方法分为全模型训练与无参数适配、扩散与掩码自回归；评测目标包括视觉保真度、策略相关性、规划、基准泛化或空间推理。
  - 趋势演进：从2024-2026可见论文看，重点从视频生成质量转向物理对齐、跨本体控制、零样本基准和功能性评测；更早年份未被代表。
