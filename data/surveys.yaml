  related_work_outline:
  - 'Mainstream direction: Proposing new world model architectures that combine video
    generation (diffusion, Transformers, VAE) with auxiliary tasks such as mask reconstruction,
    context conditioning, or physics-informed losses to improve generation quality,
    long-horizon coherence, and downstream task utility.'
  - 'Shared research pattern: World models are trained as video predictors on large-scale
    datasets, and then either used as learned simulators for policy imagination or
    jointly optimized with action/control modules to produce generalizable policies.'
  - 'Key differences: Architectures vary (diffusion Transformer, Transformer+VAE,
    compositional primitives); supervision ranges from pure RGB video to multi-modal
    signals (depth, keypoints, language, actions); evaluation targets include visual
    fidelity, spatial consistency, memory consistency, and action control.'
  - 'Trend evolution: From dedicated efficient architectures (2023) to diffusion-based
    and physics-informed models (2024–2025), then to unified video-action diffusion
    frameworks and the emergence of dedicated evaluation benchmarks (2025–2026), signaling
    a shift from pure generation towards controllable, assessable world models.'
  - 'Open questions: How to decouple model architecture gains from planner/controller
    contributions; how to achieve robust long-term memory and physical consistency
    in open domains; how to build standardized, real-world, closed-loop benchmarks
    that isolate the world model''s value for downstream tasks.'
  related_work_outline_zh:
  - 主流方向：提出新的世界模型架构，将视频生成（扩散模型、Transformer、VAE）与掩码重建、上下文条件化或物理信息损失等辅助任务结合，以提升生成质量、长时域连贯性和下游任务效用。
  - 研究共性：世界模型作为视频预测器在海量数据上训练，然后用做学习到的模拟器进行策略想象，或与动作/控制模块联合优化以产生泛化策略。
  - 关键差异：架构各异（扩散Transformer、Transformer+VAE、组合原语）；监督信号从纯RGB视频到多模态信号（深度、关键点、语言、动作）；评估目标涵盖视觉保真度、空间一致性、记忆一致性和动作控制。
  - 趋势演进：从2023年的高效专用架构，到2024–2025年基于扩散和物理信息的模型，再到2025–2026年统一的视频-动作扩散框架与专用评估基准的出现，标志着从纯生成向可控、可评估的世界模型转变。
  - 开放问题：如何解耦模型架构增益与规划器/控制器贡献；如何在开放域实现鲁棒的长期记忆与物理一致性；如何构建标准化、真实世界、闭环的基准，以隔离世界模型对下游任务的价值。
  literature_review:
    line_of_work_matrix:
    - line: Representation and objective design for video-generative world models
      what_it_solves: Turning world-model ideas into concrete architectures and training
        recipes (diffusion Transformers, Transformer-VAE hybrids, compositional video
        generation, physics-informed joint learning) that produce high-fidelity, generalizable
        video predictions.
      what_remains_open: Whether these architectural choices transfer beyond curated
        video datasets to real-world control; the causal effect of each design on
        downstream planning or policy learning; the fundamental limits of long-term
        physical consistency and memory under current objectives.
    - line: Coupling learned dynamics with action and policy interfaces
      what_it_solves: Connecting video-generative world models to action generation,
        policy learning, or planning by jointly modeling videos and actions, factorizing
        plans from language, or using imagined rollouts for policy optimization.
      what_remains_open: How much performance gain originates from the dynamics model
        versus the planner or task prior; how to prevent compounding model errors
        in closed-loop control; how to transfer imagined policies to real-world execution
        without large domain gaps.
    - line: Evaluation protocols and capability benchmarks for world models
      what_it_solves: Defining quantifiable proxies for world model quality beyond
        visual similarity, such as spatial consistency, memory consistency, and action
        controllability, and providing standardized datasets and metrics for comparison.
      what_remains_open: Existing benchmarks focus on simulated or narrow domains
        and lack real-world physical interaction, long-horizon closed-loop scenarios,
        and systematic ablation protocols that isolate the model's contribution from
        data and system-level choices.
    consensus:
    - World models are predominantly built as video generation systems trained on
      large-scale datasets, with increasing adoption of diffusion and Transformer
      backbones.
    - There is a shared goal of using the learned world model as a simulator for downstream
      decision-making, either via imagination-based policy training or direct action-video
      joint modeling.
    - Recent work acknowledges the need for evaluation beyond pixel-level reconstruction
      quality, moving toward metrics that capture temporal stability, spatial consistency,
      and action conditioning.
    disagreements:
    - 'Architectural choices diverge: some works rely on diffusion Transformers with
      mask reconstruction, others on Transformer-VAE combinations, and others on compositional
      video factorization from language.'
    - 'Supervision modalities differ: some models use only RGB video, while others
      incorporate depth prediction, keypoint dynamics, action signals, or language
      descriptions.'
    - 'Interaction mode varies: some treat the world model as a pure video generator
      for imagination, others tightly couple video and action diffusion to represent
      policies and dynamics within a single model.'
    - 'Evaluation targets are not aligned: one line emphasizes visual fidelity, another
      spatial consistency, and yet another memory and action control, with no single
      agreed-upon benchmark.'
    open_questions:
    - To what extent does a stronger video-generative world model directly improve
      downstream task performance versus the need for a tailored planner or controller?
    - How can long-term memory and physical consistency be maintained in open-domain,
      real-world settings where ground-truth states are not available?
    - What evaluation protocols, with systematic ablations, are needed to separate
      the world model's contribution from the effects of dataset scale, training budget,
      and control algorithm?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成世界模型的表示与目标设计
      解决的问题: 将世界模型理念转化为具体架构和训练配方（扩散Transformer、Transformer-VAE混合、组合视频生成、物理信息联合学习），以产生高保真、可泛化的视频预测。
      尚未覆盖: 这些架构选择能否迁移到真实世界控制任务；每个设计选择对下游规划或策略学习的因果影响；当前目标下长期物理一致性和记忆的基本极限。
    - 路线: 学习动力学与动作/策略接口的耦合
      解决的问题: 通过联合建模视频与动作、从语言分解计划或使用想象轨迹优化策略，将视频生成世界模型连接到动作生成、策略学习或规划。
      尚未覆盖: 性能增益有多少来自动力学模型，有多少来自规划器或任务先验；如何在闭环控制中防止模型误差累积；如何将想象策略迁移到真实世界执行而不产生大面积域差距。
    - 路线: 世界模型评估协议与能力基准
      解决的问题: 定义超越视觉相似性的世界模型质量可量化指标，如空间一致性、记忆一致性和动作可控性，并提供标准化数据集和指标用于比较。
      尚未覆盖: 现有基准聚焦于模拟或狭窄领域，缺乏真实世界物理交互、长时域闭环场景和系统性消融协议，难以隔离模型贡献与数据、系统层面选择。
    共识:
    - 世界模型主要构建为在海量数据集上训练的视频生成系统，越来越多地采用扩散模型和Transformer骨干。
    - 共同目标是利用学习到的世界模型作为下游决策的模拟器，或通过基于想象的策略训练，或通过直接的动作-视频联合建模。
    - 近期工作认识到需要超越像素级重建质量的评估，转向捕捉时间稳定性、空间一致性和动作条件化的指标。
    分歧:
    - 架构选择存在分歧：有的依赖扩散Transformer与掩码重建，有的使用Transformer-VAE组合，还有的基于语言组合视频分解。
    - 监督模态不同：有些模型仅使用RGB视频，而其他模型则融合深度预测、关键点动力学、动作信号或语言描述。
    - 交互模式多样：有的将世界模型视为纯视频生成器用于想象，有的则将视频与动作扩散紧密耦合，在单一模型中同时表示策略和动力学。
    - 评估目标未对齐：一条线强调视觉保真度，另一条强调空间一致性，还有一条强调记忆与动作控制，缺乏单一公认的基准。
    开放问题:
    - 更强的视频生成世界模型在多大程度上能直接提升下游任务性能，还是需要定制规划器或控制器？
    - 如何在缺乏真实状态信息的开放域真实世界环境中维持长期记忆和物理一致性？
    - 需要什么样的评估协议和系统性消融，才能将世界模型的贡献与数据集规模、训练预算和控制算法的影响分离开来？
