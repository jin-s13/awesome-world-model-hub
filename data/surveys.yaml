  related_work_outline:
  - 'Mainstream direction: Generative diffusion and transformer world models for video
    prediction, increasingly coupled with actions and embodied or driving data.'
  - 'Shared research pattern: Learn latent or video dynamics from visual-action experience,
    then use that model for prediction, policy training, or consistency evaluation.'
  - 'Key differences: Representation choices range from stochastic state-space to
    unified action-video diffusion, compositional generation, or physics-informed
    generation; evaluation targets include RL, driving, robot simulation, and open-domain
    memory and action control.'
  - 'Trend evolution: From efficient model-based RL in 2023, through contextual and
    compositional generalization in 2024, toward action-coupled and consistency-oriented
    embodied world models and benchmarks in 2025-2026.'
  - 'Open questions: Long-horizon spatial and memory consistency, unseen primitive
    and context transfer, separating model from planner or dataset effects, and missing
    real-robot and limitation evidence.'
  related_work_outline_zh:
  - 主流方向：生成式扩散与Transformer世界模型用于视频预测，并越来越多地与动作和具身或驾驶数据耦合。
  - 研究共性：从视觉-动作经验中学习潜在或视频动力学，再用于预测、策略训练或一致性评估。
  - 关键差异：表示选择涵盖随机状态空间、统一动作-视频扩散、组合式生成或物理信息生成；评测目标包括RL、驾驶、机器人仿真和开放域记忆与动作控制。
  - 趋势演进：从2023年高效基于模型的RL，到2024年上下文与组合泛化，再到2025-2026年动作耦合与一致性导向的具身世界模型及基准。
  - 开放问题：长时域空间与记忆一致性、未见原语与上下文迁移、模型与规划器或数据效应分离，以及真实机器人和局限性证据缺失。
  literature_review:
    line_of_work_matrix:
    - line: Generative diffusion and masked video world models
      what_it_solves: learning high-dimensional visual dynamics and producing multi-step
        or multi-view rollouts from driving or robot video.
      what_remains_open: long-horizon consistency, cross-view alignment, and whether
        gains transfer beyond the specific driving or robot scenarios.
    - line: Contextual, compositional, and physics-informed dynamics
      what_it_solves: using context, language primitives, depth, or keypoint signals
        to improve generalization and physical plausibility.
      what_remains_open: unseen primitive and context combinations, assumptions like
        observable context, and generalization to real-world physics.
    - line: Action-coupled and policy-interface world models
      what_it_solves: joining action prediction or action diffusion with video generation
        to support policy learning, forward or inverse dynamics, and closed-loop control.
      what_remains_open: isolating model contribution from planner, action data, and
        task prior, plus real-robot execution evidence.
    - line: Benchmarks for spatial, memory, and action consistency
      what_it_solves: measuring properties ignored by pixel-level generation quality,
        such as loop consistency, scene graph consistency, and action control.
      what_remains_open: standardized open-domain metrics, baseline breadth, and whether
        benchmarks isolate method effect from implementation and dataset factors.
    consensus:
    - World-model research is shifting from image reconstruction to generative video
      rollouts conditioned on action or control signals.
    - Multiple methods use self-supervised or generative objectives to learn dynamics
      without requiring explicit environment simulators.
    - Generalization is evaluated through unseen contexts, unseen primitive combinations,
      long-horizon rollouts, zero-shot datasets, or cross-view consistency.
    - Benchmarks increasingly treat pixel fidelity alone as insufficient and add spatial
      consistency, memory consistency, or action control metrics.
    - Several papers report code, dataset, or artifact release, but limitation statements
      are often absent or narrow.
    disagreements:
    - Stochastic state-space and VAE-style methods compress observations into latent
      states, while diffusion and transformer methods operate more directly on video
      or token sequences.
    - Physics-informed approaches impose depth and keypoint objectives, whereas other
      methods rely on data-driven video generation without explicit physical constraints.
    - Some systems support closed-loop action control or policy learning, while others
      evaluate open-loop video prediction or benchmark consistency only.
    - Compositional methods factor language into primitives, limiting support to seen
      primitive combinations; unified diffusion methods avoid that factorization but
      rely on large pretraining data.
    - Evaluation settings differ sharply across Atari and contextual RL, driving benchmarks,
      robot simulation or RT-X, and Minecraft or open-domain navigation, preventing
      direct comparison.
    open_questions:
    - Can current world models maintain spatial and memory consistency across long-horizon
      closed-loop rollouts in unseen scenes and action spaces?
    - Which inductive biases, such as masked reconstruction, context conditioning,
      physics objectives, or compositional primitives, transfer outside their reported
      task families?
    - How much of the reported policy or control improvement comes from learned dynamics
      versus the planner, action interface, or dataset scale?
    - What evaluation protocol can compare world models across RL, driving, robot,
      and open-domain settings without rewarding benchmark-specific tuning?
    - Where are the missing real-robot validations and limitation or ablation details
      for recent methods, and what negative results remain hidden?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式扩散与掩码视频世界模型
      解决的问题: 从未处理的驾驶或机器人视频中学习高维视觉动力学，并生成多步或多视角展开。
      尚未覆盖: 长时域一致性、跨视角对齐，以及这些方法在特定驾驶或机器人场景之外的迁移性。
    - 路线: 上下文、组合与物理信息动力学
      解决的问题: 利用上下文、语言原语、深度或关键点信号改善泛化能力和物理合理性。
      尚未覆盖: 未见原语与上下文组合、可观测上下文假设，以及向真实物理环境的泛化。
    - 路线: 动作耦合与策略接口世界模型
      解决的问题: 将动作预测或动作扩散与视频生成结合，以支持策略学习、正逆动力学或闭环控制。
      尚未覆盖: 模型贡献与规划器、动作数据和任务先验的隔离，以及真实机器人执行证据。
    - 路线: 空间、记忆与动作一致性基准
      解决的问题: 衡量像素级生成质量忽略的循环一致性、场景图一致性和动作控制等能力。
      尚未覆盖: 开放域标准化指标、基线广度，以及基准是否隔离方法效应与实现和数据集因素。
    共识:
    - 世界模型研究正从图像重建转向以动作或控制信号为条件的生成式视频展开。
    - 多种方法通过自监督或生成目标学习动力学，减少对显式环境模拟器的依赖。
    - 泛化评估正覆盖未见上下文、未见原语组合、长时域展开、零样本数据集和跨视角一致性等维度。
    - 基准越来越认为像素保真度不足，并加入空间一致性、记忆一致性或动作控制指标。
    - 方法证据主要集中在特定基准的提升，跨任务统一验证仍然有限。
    分歧:
    - 随机状态空间或VAE类方法压缩观测为潜在状态，而扩散或Transformer方法更直接地在视频或令牌序列上建模。
    - 物理信息方法加入深度和关键点目标，其他方法则依赖数据驱动的视频生成而没有显式物理约束。
    - 部分系统支持闭环动作控制或策略学习，其他系统只评估开环视频预测或一致性基准。
    - 组合式方法把语言分解为原语，但对未见原语组合支持有限；统一扩散方法避免该假设，但依赖大规模预训练数据。
    - 评测场景差异明显，包括Atari与上下文RL、驾驶基准、机器人仿真或RT-X、以及Minecraft或开放域导航，难以直接比较。
    开放问题:
    - 当前世界模型能否在未见场景和动作空间中维持长时域闭环展开的空间与记忆一致性？
    - 掩码重建、上下文条件、物理目标或组合原语等归纳偏置，哪些能迁移到报告任务族之外？
    - 报告的策略或控制提升中，有多少来自学到的动力学，而不是规划器、动作接口或数据规模？
    - 何种评测协议能跨RL、驾驶、机器人和开放域设置比较世界模型，同时避免奖励特定基准调参？
    - 最近的顶部方法缺少真实机器人验证、局限性和消融细节，这些验证缺口隐藏了哪些负结果？
