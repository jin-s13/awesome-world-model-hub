  related_work_outline:
  - 'Mainstream direction: Action-conditioned video generation is being reframed as
    learnable world models for robot manipulation and spatial reasoning, with generative
    sequence models as the dominant backbone and increasing emphasis on physical plausibility.'
  - 'Shared research pattern: Papers couple observations with actions in a generative
    sequence model, then evaluate by downstream planning, policy correlation, physical
    realism, or benchmark consistency rather than by visual fidelity alone.'
  - 'Key differences: Methods differ in action-conditioning mechanism—modality-specific
    diffusion timesteps, frame-level conditioning, learned masks over pretrained video
    outputs, or masked autoregression—and in alignment signal—imitation, human-preference
    reward, DPO, or test-time verification.'
  - 'Trend evolution: The sample moves from scalable pretraining and adaptation of
    video world models toward post-training alignment, uncertainty-aware verification,
    and conceptual/functional benchmarking; the top-paper evidence is concentrated
    in 2024-2026, so this is a frontier-current trend.'
  - 'Open questions: Whether formal state/dynamics assumptions match empirical rollouts,
    why verification gains fail to transfer across benchmarks, and whether physical-realism
    alignment generalizes beyond contact-rich manipulation remain open; direct scaling-law
    guarantees are not established by the sample.'
  related_work_outline_zh:
  - 主流方向：动作条件化视频生成正被重构为用于机器人操作和空间推理的可学习世界模型，生成式序列模型是主要骨干，并越来越强调物理合理性。
  - 研究共性：论文将观测与动作耦合到生成式序列模型中，并通过下游规划、策略相关性、物理真实性或基准一致性来评估，而不是只看视觉保真度。
  - 关键差异：动作条件化机制不同，包括模态特定扩散时间步、帧级条件化、预训练视频输出上的学习掩码或掩码自回归；对齐信号也不同，包括模仿、人类偏好奖励、DPO或测试时验证。
  - 趋势演进：样本从可扩展预训练与适配视频世界模型，转向后训练对齐、不确定性感知验证以及概念/功能基准；主要论文证据集中在2024-2026年，属于当前前沿趋势。
  - 开放问题：形式化状态/动态假设是否匹配经验轨迹、验证器收益为何无法跨基准迁移、物理真实性对齐能否泛化到接触丰富操作之外，以及缩放规律保证是否需要更强证据，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual decomposition and functional benchmarking of video world models
      what_it_solves: Clarifies world-model assumptions through state construction
        and dynamics modeling, and argues for functional benchmarks over visual fidelity.
      what_remains_open: No new experiments are offered; whether the taxonomy changes
        model design or evaluation remains unverified.
    - line: Unified action-video generative pretraining for robot dynamics
      what_it_solves: Learns flexible policy, forward dynamics, inverse dynamics,
        and video generation from large multitask robot datasets by coupling action
        and video modalities.
      what_remains_open: Limitations are not reported for several methods; generalization
        beyond manipulation benchmarks and low-level action inputs lacks direct evidence.
    - line: Adaptation of pretrained video diffusion models under parameter access
        constraints
      what_it_solves: Enables action-conditioned world modeling by modifying intermediate
        outputs of closed-source video diffusion models using a learned mask and small
        labeled datasets.
      what_remains_open: Requires domain-specific action-labeled data; generalization
        beyond game and robotics domains and robustness to pretrained-model biases
        are not shown.
    - line: Alignment of embodied world models with physical and task-oriented objectives
      what_it_solves: Post-trains video-based world models with multi-dimensional
        reward models or decoupled discriminators to improve physical plausibility,
        task logic, embodiment, and visual quality.
      what_remains_open: Evaluation centers on contact-rich manipulation; human-preference
        rewards may be subjective and costly, and cross-domain generalization is not
        demonstrated.
    - line: Test-time verification and scaling for world-model spatial reasoning
      what_it_solves: Analyzes whether heuristic verifiers or frame-anchored assertions
        can improve spatial reasoning when scaling test-time trajectory selection.
      what_remains_open: Current world models can form an information bottleneck;
        verifiers show poor calibration and no consistent scaling on all benchmarks.
    consensus:
    - World models are treated as controllable generative dynamics models that should
      support action conditioning, planning, or spatial reasoning.
    - Evaluation is shifting beyond visual quality to include action alignment, physical
      plausibility, task completion, policy correlation, or functional state/dynamics
      tests.
    - Large-scale pretraining or adaptation of video generation models is considered
      useful for learning world models under data constraints.
    - Several works converge on the need to align generated rollouts with human or
      physical criteria rather than relying only on prediction objectives.
    disagreements:
    - 'Action conditioning is realized through different mechanisms: modality-specific
      diffusion timesteps, frame-level action modules, learned masks over pretrained
      outputs, or masked autoregressive token prediction.'
    - 'Supervision and alignment signals differ: imitation-style action-video prediction,
      human-preference reward models, DPO-based post-training, or test-time verifiers.'
    - 'Evaluation targets differ: downstream policy/planning metrics, physical plausibility
      leaderboards, video quality, or conceptual functional benchmarks.'
    - 'Assumptions about model access differ: some methods train unified models from
      scratch, while one adapts a pretrained video diffusion model without accessing
      parameters.'
    open_questions:
    - Do the proposed state/dynamics taxonomies map to empirically measurable persistence
      and causality in current action-video world models?
    - Why do test-time verification gains appear on SAT-Real but not MMSI-Bench, and
      what bottleneck prevents imagined views from enriching fine-grained reasoning?
    - Can reward-model and DPO alignment transfer beyond contact-rich manipulation
      without large-scale human preference data?
    - What functional benchmark design can cleanly separate action alignment, physical
      plausibility, visual quality, and causal reasoning?
    - How much of the reproducibility picture is missing because several papers do
      not report limitations, code, or dataset availability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频世界模型的概念拆解与功能基准化
      解决的问题: 通过状态构建和动态建模澄清世界模型假设，并主张用功能基准替代纯视觉保真度评估。
      尚未覆盖: 未提供新实验；该分类是否真正改变模型设计或评测方式仍未验证。
    - 路线: 统一动作-视频生成式预训练用于机器人动力学
      解决的问题: 在大规模多任务机器人数据上耦合动作与视频模态，灵活表示策略、前向/逆向动态和视频生成。
      尚未覆盖: 部分方法未报告局限性；在操作基准和低级动作输入之外的泛化缺乏直接证据。
    - 路线: 在参数访问受限条件下适配预训练视频扩散模型
      解决的问题: 通过学习掩码修改闭源视频扩散模型的中间输出，以少量标注数据实现动作条件化世界建模。
      尚未覆盖: 依赖领域特定的动作标注数据；在游戏和机器人领域之外的泛化以及对预训练模型偏差的鲁棒性未展示。
    - 路线: 将具身世界模型与物理和任务目标对齐
      解决的问题: 用多维奖励模型或解耦判别器对视频世界模型进行后训练，以改善物理真实性、任务逻辑、具身性和视觉质量。
      尚未覆盖: 评估集中在接触丰富操作；人类偏好奖励可能主观且成本高，跨领域泛化未展示。
    - 路线: 用于世界模型空间推理的测试时验证与缩放
      解决的问题: 分析启发式验证器或以帧为锚点的断言能否在测试时轨迹选择缩放中改善空间推理。
      尚未覆盖: 当前世界模型可能形成信息瓶颈；验证器校准不良，且并非在所有基准上实现一致缩放。
    共识:
    - 世界模型被视作可控的生成式动态模型，应支持动作条件化、规划或空间推理。
    - 评估正从视觉质量扩展到动作对齐、物理合理性、任务完成、策略相关性或功能状态/动态测试。
    - 大规模预训练或适配视频生成模型被认为有助于在数据受限条件下学习世界模型。
    - 多项工作倾向于将生成轨迹与人类或物理标准对齐，而不只依赖预测目标。
    分歧:
    - 动作条件化机制不同：模态特定扩散时间步、帧级动作模块、预训练输出上的学习掩码或掩码自回归令牌预测。
