  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks that diagnose world models''
    spatial consistency, memory, and action controllability beyond aggregate task
    scores.'
  - 'Shared research pattern: Proposing new datasets with tailored metrics, then benchmarking
    existing world models to expose failure modes.'
  - 'Key differences: Evaluation targets range from pixel-level prediction quality
    to high-level semantic consistency; protocols vary between open-loop video prediction
    and closed-loop policy learning.'
  - 'Trend evolution: Moving from standard RL benchmarks (e.g., Atari 100k) to dedicated
    diagnostic suites (e.g., spatial consistency, memory benchmarks) and multi-dimensional
    stress tests.'
  - 'Open questions: Whether current benchmarks cover real-world open-domain settings,
    how proxy metrics align with downstream decision utility, and how to ensure comparability
    across different compute budgets.'
  related_work_outline_zh:
  - 主流方向：设计专门诊断世界模型空间一致性、记忆和动作控制能力的基准，超越汇总任务分数。
  - 研究共性：提出新数据集和定制指标，通过对现有世界模型进行基准测试来揭示其失败模式。
  - 关键差异：评估目标从像素级预测质量到高层语义一致性不等；评估协议有开环视频预测和闭环策略学习之分。
  - 趋势演进：从依赖标准RL基准（如Atari 100k）转向构建专用诊断套件（如空间一致性、记忆基准）和多维度压力测试。
  - 开放问题：现有基准是否覆盖真实开放域设置，代理指标与下游决策效用如何对齐，以及如何在不同计算预算下保证可比性。
  literature_review:
    line_of_work_matrix:
    - line: Diagnostic benchmarks for world model internal consistency
      what_it_solves: Detecting failures in spatial consistency, memory retention,
        and action controllability that aggregate task scores miss.
      what_remains_open: Benchmark scenarios are limited in diversity; alignment with
        real-world open-domain generalization and downstream task value is unverified.
    - line: Task-oriented world model evaluation via standard RL/video benchmarks
      what_it_solves: Providing reproducible proxy tasks (e.g., Atari 100k, nuScenes)
        to compare world-model-driven policy performance or prediction quality.
      what_remains_open: These benchmarks were designed for other purposes; the link
        between their metrics (e.g., human normalized score) and physical plausibility,
        long-term planning, or safety is unclear.
    - line: Metric and stress-test design for specific failure modes
      what_it_solves: Capturing robustness to perturbations (e.g., viewpoint changes,
        loop closures) via targeted metrics like scene graph consistency or memory
        scores.
      what_remains_open: Proxy metrics may not correlate with the decision quality
        users care about; stability across different implementations and compute budgets
        is unknown.
    consensus:
    - World models require multi-dimensional evaluation beyond single aggregate scores.
    - Standard RL/video benchmarks alone are insufficient to reveal core world model
      deficiencies.
    - Specialized datasets and metrics are needed to probe spatial, temporal, and
      physical consistency.
    - Incorporating context, memory, and action control into evaluation is important.
    disagreements:
    - Whether to use simulated environments (Minecraft, Atari) or real-world data
      (driving, robotics) as the evaluation platform.
    - Open-loop generation quality vs. closed-loop policy performance as the primary
      evaluation target.
    - Emphasis on pixel-level fidelity vs. high-level semantic or physical consistency.
    - Whether action-conditioned evaluation is required or if action-free data can
      be used.
    open_questions:
    - How to design a unified benchmark that spans diverse domains and interaction
      modes?
    - How well do proposed consistency metrics align with downstream decision-making
      utility?
    - Are conclusions from different benchmarks and metrics consistent and reproducible
      across implementations?
    - Can current benchmarks adequately stress-test world models under open-domain,
      long-horizon, and safety-critical settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型内部一致性诊断基准
      解决的问题: 检测聚合任务分数所遗漏的空间一致性、记忆保持和动作控制失败。
      尚未覆盖: 基准场景多样性有限；与真实开放域泛化及下游任务价值的对齐未经验证。
    - 路线: 基于标准RL/视频基准的任务导向世界模型评估
      解决的问题: 提供可复现的代理任务（如Atari 100k, nuScenes）以比较世界模型驱动的策略性能或预测质量。
      尚未覆盖: 这些基准为其他目的设计；其指标（如人类归一化得分）与物理合理性、长期规划或安全性的关联不明确。
    - 路线: 针对特定失败模式的度量与压力测试设计
      解决的问题: 通过场景图一致性或记忆分数等目标指标，捕获对扰动（如视角变化、环路闭合）的鲁棒性。
      尚未覆盖: 代理指标可能与用户关心的决策质量不相关；不同实现和计算预算下的稳定性未知。
    共识:
    - 世界模型需要超越单数汇总分数的多维度评估。
    - 仅靠标准RL/视频基准不足以揭示世界模型的核心缺陷。
    - 需要专门的数据集和指标来探测空间、时间和物理一致性。
    - 在评估中纳入上下文、记忆和动作控制很重要。
    分歧:
    - 使用模拟环境（Minecraft、Atari）还是真实世界数据（驾驶、机器人）作为评估平台。
    - 以开环生成质量还是闭环策略性能作为主要评估目标。
    - 侧重像素级保真度还是高层语义或物理一致性。
    - 是否要求动作条件评估，或者可利用无动作数据。
    开放问题:
    - 如何设计跨不同领域和交互模式的统一基准？
    - 所提出的一致性指标与下游决策效用之间的一致性如何？
    - 不同基准和指标的结论是否在不同实现间一致且可复现？
    - 当前基准能否在开放域、长时域和安全关键设置下充分压力测试世界模型？
