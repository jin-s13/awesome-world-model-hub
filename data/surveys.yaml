  related_work_outline:
  - 'Mainstream direction: World models are being applied to embodied domains (robotics,
    driving, games) by generating future video frames or latent states conditioned
    on actions, enabling policy learning, simulation, and evaluation.'
  - 'Shared research pattern: Most works combine diffusion or transformer architectures
    with self-supervised pre-training on large-scale domain-specific datasets, jointly
    modeling visual observations and actions to improve generalization.'
  - 'Key differences: Works diverge in target domain (driving vs. robot manipulation
    vs. game environments), the integration of physics priors (explicit depth/keypoints
    vs. implicit from data), and evaluation focus (visual fidelity, policy performance,
    memory consistency, or spatial coherence).'
  - 'Trend evolution: From 2023 efficient game-based world models to 2024-2025 robotic
    and driving models, with a shift toward unified multi-modal pretraining, physics-informed
    generation, and closed-loop interactive benchmarks in 2025-2026.'
  - 'Open questions: Real-world deployment validation remains scarce; long-term memory
    consistency and physical plausibility are not yet solved; cross-embodiment and
    cross-domain transfer are largely unverified.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于具身领域（机器人、驾驶、游戏），通过生成以动作为条件的未来视频帧或潜在状态，支持策略学习、仿真和评估。
  - 研究共性：多数工作将扩散模型或Transformer架构与在大规模领域数据集上的自监督预训练相结合，联合建模视觉观测和动作，以提升泛化性。
  - 关键差异：工作目标域不同（驾驶 vs 机器人操作 vs 游戏环境），物理先验的融入方式不同（显式深度/关键点 vs 从数据中隐式学习），评估重点不同（视觉保真度、策略性能、记忆一致性、空间连贯性）。
  - 趋势演进：从2023年基于游戏的高效世界模型，到2024-2025年机器人和驾驶模型，并向2025-2026年的统一多模态预训练、物理信息增强生成和闭环交互基准发展。
  - 开放问题：真实世界部署验证仍然稀缺；长期记忆一致性和物理合理性尚未解决；跨本体和跨领域迁移均未得到充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and embodied tasks by generating
        action-conditioned video plans or latent dynamics, enabling policy training
        and generalization to new task combinations.
      what_remains_open: Generalization beyond seen primitive combinations is limited;
        evaluation is mostly in simulation without real-robot validation; physical
        plausibility and long-term consistency are not guaranteed.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon scene prediction
        in driving, supporting closed-loop simulation and policy evaluation across
        datasets.
      what_remains_open: Alignment between improved simulation metrics and real-world
        safety or operational outcomes is unverified; cross-dataset zero-shot transfer
        has only been shown in limited settings.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments (Atari, Minecraft)
        for efficient policy learning and for benchmarking spatial consistency, memory,
        and action control.
      what_remains_open: Evaluations remain on fixed benchmarks; how well these models
        generalize to new game rules, continuous action spaces, or user interactions
        is not yet addressed.
    consensus:
    - World models for applications are predominantly built on generative architectures
      (diffusion, transformers) that predict future observations conditioned on actions.
    - Pre-training on large-scale, domain-specific visual-action datasets is a common
      strategy to improve generalization and robustness.
    - There is broad agreement that world models should support multiple downstream
      tasks, including policy learning, simulation, and evaluation.
    - Memory consistency and controllability are emerging as critical evaluation dimensions
      beyond short-term visual fidelity.
    disagreements:
    - 'Representation granularity: some works model pixel-level video (RoboDreamer,
      MaskGWM, UWM), while others use latent state-space models (cRSSM, STORM).'
    - 'Supervision signals: methods differ in whether they require explicit action
      labels (STORM, cRSSM), language instructions (RoboDreamer), or can leverage
      action-free video (UWM).'
    - 'Physics integration: RoboScape injects explicit physics knowledge (depth, keypoints),
      whereas other models rely on data-driven patterns to capture physical regularities.'
    - 'Evaluation targets: works prioritize different metrics—human-normalized score
      on Atari (STORM), zero-shot policy generalization (cRSSM), video quality and
      plan execution (RoboDreamer), spatial consistency (LoopNav), or memory and action
      control (MIND).'
    open_questions:
    - Can world models trained in simulation or on curated datasets transfer to real-world
      embodied setups without costly fine-tuning?
    - How can long-term memory consistency be maintained when generating sequences
      over hundreds of steps, and what metrics adequately capture it?
    - What is the minimal set of physical inductive biases needed to ensure plausible
      and safe predictions in open-world domains?
    - How should world models be evaluated to capture both generation quality and
      their utility for downstream control tasks in a unified framework?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 通过生成动作条件视频计划或潜在动力学，将世界模型适配到机器人及具身任务，支持策略训练和向新任务组合的泛化。
      尚未覆盖: 对训练中未见的原语组合泛化受限；评估主要在仿真中，缺乏真实机器人验证；物理合理性和长期一致性未得到保证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 使用世界模型进行驾驶场景中的多视角、长时域预测，支持跨数据集的闭环仿真和策略评测。
      尚未覆盖: 仿真指标的提升与真实世界安全或运营结果之间的一致性未经证实；跨数据集零样本迁移仅在有限场景下展示。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落地到交互式环境（Atari、Minecraft）中，用于高效策略学习，以及基准测试空间一致性、记忆和动作控制。
      尚未覆盖: 评估仍限于固定基准；模型在游戏规则、连续动作空间或用户交互变化时的泛化能力尚未得到解决。
    共识:
    - 应用世界模型主要建立在预测未来观测（以动作为条件）的生成式架构（扩散、Transformer）之上。
    - 在大规模、领域特定的视觉-动作数据集上进行预训练，是提升泛化性和鲁棒性的常用策略。
    - 普遍认为世界模型应支持多种下游任务，包括策略学习、仿真和评估。
    - 记忆一致性和可控性正成为超越短期视觉保真度的关键评估维度。
    分歧:
    - 表示粒度：部分工作建模像素级视频（RoboDreamer、MaskGWM、UWM），而其他工作使用潜在状态空间模型（cRSSM、STORM）。
    - 监督信号：方法在是否需要显式动作标签（STORM、cRSSM）、语言指令（RoboDreamer）或能利用无动作视频（UWM）上存在差异。
    - 物理融入：RoboScape注入显式物理知识（深度、关键点），而其他模型依赖数据驱动模式来捕捉物理规律。
    - 评测目标：工作优先考虑不同指标——Atari上的人类标准化得分（STORM）、零样本策略泛化（cRSSM）、视频质量与计划执行（RoboDreamer）、空间一致性（LoopNav）或记忆与动作控制（MIND）。
    开放问题:
    - 在仿真或精选数据集上训练的世界模型，能否无需昂贵的微调就迁移到真实世界具身设置中？
    - 在生成数百步的序列时，如何维持长期记忆一致性，以及哪些指标能充分捕捉它？
    - 确保在开放世界领域中生成合理且安全的预测，所需的最小物理归纳偏置集合是什么？
    - 应如何评估世界模型，以在统一框架中同时捕捉生成质量及其对下游控制任务的效用？
