  related_work_outline_zh:
  - 主流方向：以动作可控世界模型和闭环模拟器为核心，聚焦自动驾驶与机器人视频生成，并配套可复用基准。
  - 研究共性：通过动作、上下文或物理条件提升生成保真度和下游策略价值；模型常与动作忠实度、空间一致性或策略成功率等数据/指标绑定。
  - 关键差异：表示与监督从显式物理、深度、关键点任务，到通用潜在动作和帧级自回归扩散各不相同；评测目标覆盖Minecraft导航、自动驾驶和机器人操作；部署假设在上下文可观测性和实时约束上存在差别。
  - 趋势演进：高排名证据集中在2024-2026年，从视觉生成质量转向闭环可控性、跨具身预训练和亚秒级服务；更早年份仅提供时间跨度背景，趋势为当前前沿。
  - 开放问题：能否泛化到nuScenes/CARL/Minecraft之外的场景、自回归长时程一致性、基准指标与真实策略成功率的对齐、以及跨基础设施独立复现仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turns world-model/video-generation ideas into end-to-end workflows
        that cover data, training, inference, and evaluation; examples include closed-loop
        driving simulation and action-controllable generation stacks.
      what_remains_open: External generalization beyond specific datasets such as
        nuScenes is not shown; long-horizon and cross-view consistency may degrade
        over extended sequences, and multi-sensor or multi-GPU deployment is underevidenced.
    - line: Real-time and interactive serving
      what_it_solves: Meets latency and interactivity requirements for closed-loop
        use by optimizing autoregressive generation to sub-second single-GPU inference
        and supporting varied controls from high-level commands to low-level maneuvers.
      what_remains_open: The trade-off between speed, fidelity, controllability, and
        system complexity is not fully quantified under out-of-distribution or extreme
        conditions; scaling beyond single-GPU settings remains a deployment gap.
    - line: Artifacts and reproducible engineering
      what_it_solves: Provides open datasets, benchmarks, metrics, and code-like artifacts
        for evaluating action fidelity, spatial consistency, physics plausibility,
        or policy utility; examples include loop-based navigation and trajectory-conditioned
        evaluation sets.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        is not yet demonstrated; several papers lack visible limitation reporting
        or cover only a small number of tasks, and some reproducibility signals are
        weak or absent.
    consensus:
    - Action, context, or control conditioning is treated as necessary for making
      generated video useful as simulation or policy training data.
    - Visual fidelity alone is insufficient; the field increasingly reports task-specific
      evidence such as action fidelity, spatial consistency, physics plausibility,
      or policy success.
    - Large-scale pretraining or post-training across varied trajectory/video sources
      is used to improve prediction metrics and downstream robot policy success.
    - Benchmarks and datasets are paired with models to make controllable world models
      comparable, often through open evaluation frameworks or public metrics.
    disagreements:
    - 'Representation differs: some systems learn explicit physics/depth/keypoint
      signals, while others use latent universal action interfaces or frame-level
      autoregressive diffusion.'
    - 'Supervision assumptions differ: one line assumes observable context values
      for zero-shot transfer, while others condition on trajectory annotations, latent
      actions, or implicit physics learned from video.'
    - 'Evaluation targets differ: Minecraft navigation consistency, autonomous driving
      action fidelity, closed-loop nuScenes simulation, and robot manipulation policy
      success are used separately rather than unified.'
    - 'Deployment settings differ: some optimize for sub-second single-GPU closed-loop
      serving, while others prioritize offline visual/action fidelity, policy rollouts,
      or cross-embodiment pretraining.'
    open_questions:
    - Do current action-fidelity and spatial-consistency metrics predict real-world
      closed-loop driving or robot policy success across new environments?
    - How far can autoregressive world-model rollouts remain stable before temporal
      or cross-view consistency degrades?
    - Can physics-informed or latent-action world models generalize beyond their narrow
      evaluation domains, such as two contextual RL tasks or a single driving dataset?
    - Which reproducibility gaps, such as missing code or absent limitation reports,
      matter most for independent verification across teams and infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 把世界模型或视频生成思路转化为覆盖数据、训练、推理和评测的端到端工作流，例如闭环驾驶模拟和动作可控生成栈。
      尚未覆盖: 尚未展示对nuScenes等特定数据集之外环境的泛化；长时程与跨视角一致性在超长序列上可能退化；多传感器或多GPU部署证据不足。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟与交互需求，通过自回归生成优化实现单GPU亚秒级推理，并支持从高层指令到低层操控的多样化控制。
      尚未覆盖: 在分布外或极端条件下，速度、保真度、可控性和系统复杂度之间的权衡尚未充分量化；单GPU之外的扩展仍是部署缺口。
    - 路线: 工件与可复现工程
      解决的问题: 提供开放数据集、基准、指标和代码类工件，用于评估动作忠实度、空间一致性、物理合理性或策略效用；例如循环导航和轨迹条件评测集。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现尚未得到证明；部分工作缺少可见的局限性报告或仅覆盖少量任务；一些可复现信号较弱或缺失。
    共识:
    - 动作、上下文或控制条件被认为是让生成视频可用于模拟或策略训练的必要条件。
    - 仅看视觉保真度不够；领域越来越多地报告动作忠实度、空间一致性、物理合理性或策略成功率等任务相关证据。
    - 在多源轨迹或视频上的大规模预训练或后训练被用于提升预测指标和下游机器人策略成功率。
    - 基准和数据集与模型配对，通过开放评测框架或公开指标让可控世界模型具备可比性。
    分歧:
    - 表示方式不同：一些系统学习显式的物理、深度或关键点信号，另一些使用通用潜在动作接口或帧级自回归扩散。
    - 监督假设不同：一条路线假设上下文值可观测以支持零样本迁移，另一些依赖轨迹标注、潜在动作或从视频隐式学习物理。
    - 评测目标不同：Minecraft导航一致性、自动驾驶动作忠实度、闭环nuScenes模拟和机器人操作策略成功率被分别使用，尚未统一。
    - 部署设置不同：一些工作优化单GPU亚秒级闭环服务，另一些优先离线视觉/动作忠实度、策略推演或跨具身预训练。
    开放问题:
    - 当前动作忠实度和空间一致性指标能否预测新环境下真实闭环驾驶或机器人策略成功率？
    - 自回归世界模型推演在多长时间范围内仍能保持稳定，而不出现时间或跨视角一致性退化？
    - 物理信息或潜在动作世界模型能否泛化到其狭窄评测域之外，例如两个上下文强化学习任务或单一驾驶数据集之外？
    - 哪些可复现缺口，如代码缺失或局限性报告缺失，对跨团队、跨基础设施独立验证影响最大？
