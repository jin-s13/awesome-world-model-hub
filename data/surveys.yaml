  literature_review:
    line_of_work_matrix:
    - line: Driving scene generation and multi-view prediction
      what_it_solves: Long-horizon, multi-view driving video prediction and zero-shot
        transfer across driving datasets.
      what_remains_open: Closed-loop safety and real-world operational outcomes are
        not evidenced; limitation details are absent in the supplied record.
    - line: Robot video imagination and action-video pretraining
      what_it_solves: Language-, physics-, or action-conditioned video generation
        for robot tasks, and pretraining of policies and dynamics on large robot datasets.
      what_remains_open: Generalization beyond seen primitive combinations or training
        embodiments, and real-robot execution, remain underevidenced.
    - line: Contextual and sample-efficient model-based reinforcement learning
      what_it_solves: Zero-shot generalization to unseen dynamics given context, and
