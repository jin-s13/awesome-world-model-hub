    - 'Conditioning differs: one line uses observed context values, another action
      or trajectory instructions, and another hierarchical controls from goals to
      low-level maneuvers.'
    - 'Training signals differ: physics-informed depth or keypoint objectives, motion-reinforced
      losses, and context-conditioned latent dynamics encode different assumptions
      about what matters for realism.'
    - 'Evaluation settings differ: navigation spatial consistency, driving action
      fidelity, real-robot online learning, and model-based policy training create
