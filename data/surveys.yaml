  related_work_outline_zh:
  - 主流方向：该综述证据围绕通用世界模型作为统一视角，覆盖视频生成、自动驾驶、机器人想象与具身交互；2024-2026年最突出的重点是生成式视频世界模型与可控自动驾驶仿真。
  - 研究共性：工作将分散的设计选择整理为表示、状态与记忆、时间一致性、可控性和评测维度，并常将概念综合与基准、仿真器或开源模型结合。
  - 关键差异：部分工作提供分类法或综述框架但缺少实证测试；部分在领域基准上报告定量结果。它们在表示、监督信号、交互模式和部署设置上不同。
  - 趋势演进：证据显示从2023年交通仿真世界模型和2024年围绕Sora的综述，转向2025-2026年的开源实时模拟、视线外持久动态和面向自动驾驶的统一潜在空间分类法。
  - 开放问题：分类法背后的系统证据、跨基准评测结果兼容性、所提评测框架的实验验证以及可复现性缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: General world-model survey synthesis
      what_it_solves: Links video generation, autonomous driving, and autonomous agents
        under a shared world-model framing and summarizes simulation capabilities
        and challenges.
      what_remains_open: The survey-level synthesis lacks a visible systematic protocol
        for paper inclusion, exclusion, and comparison across heterogeneous settings.
    - line: Unified taxonomy and roadmap for latent world models
      what_it_solves: Organizes latent representations, structural priors, and internal
        mechanics into an evaluation-oriented design space for automated driving.
      what_remains_open: The taxonomy and evaluation prescriptions are conceptual
        and not empirically validated, and their completeness across existing methods
        is not tested.
    - line: Empirical world-model benchmark and simulator construction
      what_it_solves: Supplies concrete models, datasets, and metrics for robot imagination,
        autonomous simulation, ego-motion and object dynamics control, open-source
        real-time simulation, and out-of-sight persistence.
      what_remains_open: Several reports omit limitations, real-robot transfer, code
        or dataset access, and cross-benchmark compatibility remains uncertain.
    - line: Open problem and gap mapping within embodied autonomy
      what_it_solves: Turns literature coverage into targeted gaps around long-term
        memory, real-time interactivity, fine-grained control, and simulation-to-reality
        transfer.
      what_remains_open: Gap prioritization is not quantified, so which open problems
        most improve downstream autonomy is still unclear.
    consensus:
    - World models are treated as a unifying substrate for realistic visual synthesis,
      autonomous interaction, and environment dynamics forecasting.
    - Long-term temporal consistency and persistent state or memory are recurring
      requirements across the analyzed methods and surveys.
    - Evaluation should move beyond image quality toward closed-loop, controllable,
      embodied, or resource-aware evidence.
    - Open-source artifacts and benchmark datasets improve verification and comparison,
      but their availability is inconsistent.
    disagreements:
    - 'Representation choices differ: compositional language-conditioned video generation,
      persistent global 3D and dynamic-entity states, unified autoregressive transformers
      over observation-state-action nodes, and latent continuous/discrete hybrids.'
    - 'Supervision and evaluation targets differ: simulation-based robot execution,
      photorealistic synthesis and georeferencing, fine-grained ego-motion and object
      dynamics control, and out-of-sight persistence.'
    - Interaction and deployment settings differ from open-source real-time video
      simulation to automated driving datasets and multi-agent traffic simulation.
    - Theoretical taxonomies lack empirical validation, while method and benchmark
      papers report quantitative results, creating differences in verifiability rather
      than necessarily in contribution.
    open_questions:
    - Which representation and state-memory choices can simultaneously support long-horizon
      consistency, out-of-sight dynamics, and real-time interaction across different
      domains?
    - Are evaluation results comparable across robot simulation, driving motion, road
      imagery, and video-world persistence benchmarks?
    - How can survey taxonomies and proposed evaluation frameworks be systematically
      validated and continuously updated as new world-model architectures emerge?
    - Which missing code, dataset, baseline, and limitation details most affect the
      reproducibility and trustworthiness of current claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用世界模型综述综合
      解决的问题: 在统一世界模型框架下连接视频生成、自动驾驶和自主智能体，并梳理模拟能力与挑战。
      尚未覆盖: 综述层面缺少可见的系统纳入、排除和跨异构设置比较协议。
    - 路线: 潜在世界模型统一分类法与路线图
      解决的问题: 围绕潜在表示、结构先验与内部机制，组织自动驾驶世界模型的设计空间和评测方向。
      尚未覆盖: 分类法与评测建议仍为概念性，未获实验验证，覆盖面是否完整也未测试。
    - 路线: 世界模型经验基准与仿真器构建
      解决的问题: 提供具体模型、数据集和指标，用于机器人想象、自动驾驶仿真、自我运动与物体动态控制、开源实时模拟及视线外持久性。
      尚未覆盖: 部分报告省略局限性、真实机器人迁移、代码或数据集访问；跨基准可比较性仍不明确。
    - 路线: 具身自主中的开放问题与缺口映射
      解决的问题: 将文献覆盖转化为长期记忆、实时交互、细粒度控制和仿真到现实迁移等具体缺口。
      尚未覆盖: 缺口优先级未量化，哪些问题对下游自主能力提升最大仍不清楚。
    共识:
    - 世界模型被视为统一的底层能力，用于逼真视觉合成、自主交互与环境动态预测。
    - 长期时间一致性与持续状态或记忆是所分析方法和综述反复出现的要求。
    - 评测应从图像质量转向闭环、可控、具身或资源感知证据。
    - 开源工件和基准数据集可改善验证和比较，但可用性不一致。
    分歧:
    - 表示选择不同：基于语言组合的视频生成、持久全局3D与动态实体状态、对观测-状态-动作节点进行统一自回归建模、以及潜在连续/离散混合表示。
    - 监督与评测目标不同：仿真机器人执行、逼真合成与地理参考、细粒度自我运动与物体动态控制、视线外持久性。
    - 交互与部署场景不同：从开源实时视频模拟到自动驾驶数据集和多智能体交通仿真。
    - 理论分类法缺少实证验证，方法与基准论文报告量化结果，这造成可验证性差异而非必然是贡献差异。
    开放问题:
    - 哪些表示与状态记忆选择能同时支持长时域一致性、视线外动态和跨领域实时交互？
    - 在不同基准之间，机器人仿真、驾驶运动、道路图像和视频世界持久性评测结果是否可比较？
    - 如何系统验证并持续更新综述分类法和评测框架，以适应新出现的世界模型架构？
    - 哪些缺失的代码、数据集、基线和局限性细节最影响当前声明的可复现性和可信度？
