  related_work_outline:
  - 'Mainstream direction: Benchmarking world models through controlled rollouts and
    action-conditioned video prediction; recent datasets and metrics target spatial
    consistency, memory consistency, and action control. Top evidence mixes benchmark
    artifacts with model methods evaluated on standard driving, Atari, and robotic
    suites.'
  - 'Shared research pattern: Build or reuse a standardized environment or rollout
    set, define an evaluation metric beyond visual quality such as consistency, normalized
    control score, or zero-shot rollout, and compare representative models. Several
    works release datasets or code to support comparability.'
  - 'Key differences: Benchmark construction differs from evaluated model method;
    target domains include driving, Minecraft, Atari, and robotic video; metrics include
    scene-graph consistency, memory/action control, human-normalized score, and rollout
    accuracy; representations range from diffusion transformers to transformer-VAE,
    context-conditioned state-space models, and physics-informed keypoint/depth.'
  - 'Trend evolution: Top evidence spans 2023-2026, within the current frontier. It
    moves from single-task RL aggregate benchmarks such as Atari 100k and CARL toward
    embodied/open-domain consistency and action-control benchmarks; diffusion-based
    world models increasingly become evaluation targets.'
  - 'Open questions: Whether consistency metrics transfer to real deployment and downstream
    decision utility; whether task distributions cover expected world-model use; stability
    across implementations and compute budgets; long-horizon memory and cross-action-space
    generalization. Missing limitation and artifact details in several papers remain
    verification gaps.'
  related_work_outline_zh:
  - 主流方向：通过受控 rollout 和动作条件视频预测对世界模型进行基准测试；新数据集与指标关注空间一致性、记忆一致性和动作控制。当前高证据样本同时包含基准工件和模型方法，并在驾驶、Atari、机器人等标准套件上被评测。
  - 研究共性：构建或复用标准化环境与轨迹，定义超越视觉质量的指标，如一致性、归一化控制分或零样本 rollout，并对比代表性模型；多篇工作同时发布数据集或代码以提升可比性。
  - 关键差异：基准构建区别于模型方法；目标域包括驾驶、Minecraft、Atari 和机器人视频；指标包括场景图一致性、记忆/动作控制、人类归一化分和 rollout
    精度；表示方式涉及扩散 Transformer、Transformer-VAE、带上下文的状态空间模型及物理关键点/深度。
  - 趋势演进：高证据集中于 2023-2026，处于当前前沿；从 Atari 100k、CARL 等单任务 RL 总分基准，转向具身或开放域一致性与动作控制基准；扩散世界模型越来越多成为评测对象。
  - 开放问题：一致性指标能否迁移到真实部署和下游决策效用；任务分布是否覆盖预期用途；结论在不同实现和算力预算下是否稳定；长时记忆与跨动作空间泛化仍难；若干论文缺少局限与工件细节，属于验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets such as loop-navigation video
        in Minecraft and multi-scene controlled video clips, making world-model spatial,
        memory, and action-control abilities comparable.
      what_remains_open: Whether these task distributions transfer to real deployment
        settings and cover the full range of world-model use, especially long-horizon
        and cross-action-space cases.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, spatial consistency, temporal stability,
        contextual coherence, and action control beyond aggregate scores; for example,
        Scene Graph Consistency Score and memory/action-control metrics.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility is not proven; long-term memory consistency and cross-action-space
        generalization remain difficult.
    - line: Comparable baselines and reporting
      what_it_solves: Establishes common evaluation targets through standard datasets
        and metrics such as driving datasets, Atari 100k, CARL, and robotic pretraining
        data, enabling auditability and comparison.
      what_remains_open: Stability of benchmark conclusions across implementations
        and compute budgets is not shown; several sources lack full limitation or
        artifact reporting, leaving verification gaps.
    consensus:
    - Shared tasks and standardized rollouts are treated as necessary for comparing
      world-model abilities beyond qualitative video samples.
    - 'Action-conditioned evaluation is a common focus: models are probed on whether
      control inputs produce consistent future observations across viewpoints and
      time.'
    - Aggregate scores alone are viewed as insufficient; recent evidence adds spatial
      consistency, memory consistency, physical plausibility, or normalized downstream
      control metrics.
    - Reproducibility is signaled through released datasets or code, but several sources
      omit limitation and reporting details, so comparability remains partial.
    disagreements:
    - 'Representation: diffusion-based generation, transformer-VAE stochastic models,
      recurrent state-space models with observable context, and physics-informed depth/keypoint
      supervision differ sharply.'
    - 'Evaluation target: single-task RL performance, open-domain loop navigation,
      driving multi-view prediction, robotic video-action pretraining, or physics
      plausibility.'
    - 'Interaction mode: action-free video generation, action-conditioned control,
      and closed-loop revisited evaluation are used across different studies.'
    - 'Deployment setting: simulated game environments versus real-world-scale driving
      and robotic data; this changes what consistency and control metrics can claim.'
    open_questions:
    - Can spatial consistency scores from loop navigation and memory/action-control
      videos predict utility in real driving or robotic deployment?
    - Do current task distributions cover the settings where world models are expected
      to help, especially long-horizon memory and cross-action-space generalization?
    - Which representation or supervision signal best supports memory consistency
      under comparable compute and implementation choices?
    - How stable are benchmark conclusions across implementations and compute budgets
      when several top sources lack full limitation or artifact reports?
    - How should proxy metrics be aligned with downstream decisions rather than pixel-level
      or aggregate benchmark performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务与数据集，例如 Minecraft 循环导航视频和多场景受控视频片段，使世界模型的空间、记忆与动作能力可比。
      尚未覆盖: 这些任务分布是否迁移到真实部署设置并覆盖世界模型预期用途，尤其是长时域与跨动作空间场景，仍待验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、空间一致性、时间稳定性、上下文连贯性与动作控制；例如场景图一致性分数和记忆/动作控制指标。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间的一致性尚未证明；长时记忆一致性和跨动作空间泛化仍然困难。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准化数据集和指标建立共同评测目标，如驾驶数据集、Atari 100k、CARL 与机器人预训练数据，使结果可审计和可比。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定尚未显示；若干来源缺少完整局限与工件报告，形成验证缺口。
    共识:
    - 共享任务与标准化 rollout 被视为比较世界模型能力、超越定性视频样本的必要条件。
    - 动作条件评测是共同焦点：模型是否能在控制输入下产生跨视角、跨时间一致的未来观察。
    - 仅看总分被认为不足；近期证据加入空间一致性、记忆一致性、物理合理性或归一化下游控制指标。
    - 可复现性通过发布数据集或代码来体现，但部分来源缺少局限与报告细节，可比性仍有限。
    分歧:
    - 表示方式：基于扩散的生成、Transformer-VAE 随机模型、带可观测上下文的循环状态空间模型，以及物理信息深度/关键点监督，差异明显。
    - 评测目标：单任务强化学习性能、开放域循环导航、驾驶多视角预测、机器人视频-动作预训练或物理合理性。
    - 交互模式：无动作视频生成、动作条件控制和闭环复现评测在不同研究中使用。
    - 部署场景：模拟游戏环境与真实世界规模的驾驶和机器人数据；这改变了一致性与控制指标可支撑的结论。
    开放问题:
    - 循环导航的空间一致性分数和记忆/动作控制视频能否预测真实驾驶或机器人部署中的效用？
    - 当前任务分布是否覆盖世界模型预期帮助的设置，尤其是长时记忆与跨动作空间泛化？
    - 在可比算力和实现条件下，哪种表示或监督信号更利于记忆一致性？
    - 当若干高证据来源缺少完整局限与工件报告时，基准结论在不同实现和算力预算下是否稳定？
    - 代理指标应如何与下游决策而非像素级或聚合基准对齐？
