      尚未覆盖: 预测改进与真实闭环驾驶决策或安全结果之间的关联未在证据中展示。
    - 路线: 面向机器人的组合式与物理信息世界模型
      解决的问题: 从语言原语进行视频规划，借助深度或关键点增强物理合理性，并在机器人数据上联合预训练视频与动作。
      尚未覆盖: 真实机器人执行证据不足；超出已见原语或物理交互组合的泛化仍不确定。
    - 路线: 世界模型的一致性与可控性基准
      解决的问题: 通过循环导航和闭环复访量化长期记忆、空间一致性和动作控制能力。
      尚未覆盖: 基准指标与下游任务成功之间的关系尚未建立；长期记忆和跨动作空间泛化仍是挑战。
    共识:
    - 近期研究将世界模型视为动作条件生成式仿真器，从潜在下一步状态预测转向视频/动作生成与大规模预训练。
    - 许多模型加入辅助自监督或物理信息目标，如深度预测、关键点动力学、掩码重建或指令解析，以改善一致性和泛化。
    - 评估正从仅关注图像质量转向衡量空间一致性、记忆一致性、物理合理性和动作可控性。
    分歧:
