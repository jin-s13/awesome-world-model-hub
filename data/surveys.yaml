    training and evaluation.'
  - 'Shared research pattern: Recent work uses video generation, diffusion, and Transformer-style
    architectures with auxiliary objectives for multi-view, long-horizon, or physical
    consistency; evaluation relies on domain benchmarks and datasets, while several
    papers report gains over prior or monolithic baselines.'
  - 'Key differences: Model representations range from recurrent state-space/VAE to
    diffusion Transformers or unified video-action diffusion; supervision includes
    self-supervised reconstruction, physics-informed depth/keypoints, context-conditioned
    reinforcement learning, and action diffusion; evaluation targets span driving,
    robot execution, Atari, Minecraft, and open-domain consistency.'
  - 'Trend evolution: Available top-paper years cluster in 2023-2026, so the observed
    evolution is within the current frontier: from efficient stochastic game-world
    policy learning toward large-scale robot/driving video world models, then toward
    consistency and action-control benchmarks.'
  - 'Open questions: Whether benchmark gains transfer to real safety or operations;
    how to maintain long-term memory, spatial consistency, and cross-action generalization;
    which context or physics assumptions hold in open domains; and whether missing
    limitation/reproducibility details hide boundary conditions.'
  related_work_outline_zh:
  - 主流方向：将世界模型作为驾驶、机器人和交互环境的领域化可学习仿真器，通过动作、语言或目标条件生成未来观测，支撑策略训练与评测。
  - 研究共性：近期工作多用视频生成、扩散或Transformer结构，并加入辅助目标提升多视角、长期或物理一致性；评估依赖领域基准，常与已有或单体基线比较。
  - 关键差异：表示层从循环状态空间/VAE到扩散Transformer或统一视频-动作扩散；监督与评测目标跨驾驶、机器人、Atari、Minecraft和开放域视频；交互方式从开环预测到闭环动作控制不同。
  - 趋势演进：证据集中在2023-2026年前沿，由Atari高效游戏策略学习转向大规模机器人/驾驶视频世界模型，再转向一致性与动作控制基准。
  - 开放问题：基准收益能否迁移到真实安全与操作；长期记忆、空间一致性与跨动作泛化仍难；上下文和物理先验假设是否在开放域失效；多项工作缺少局限性与复现细节。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific driving simulation and scene prediction
      what_it_solves: Generates future driving observations with multi-view, long-horizon
        video prediction and is evaluated on normal, long-horizon rollout, and zero-shot
        driving datasets.
      what_remains_open: Closed-loop or real-world safety/operational outcomes are
        not shown; limitation evidence is missing, and simulator-to-road alignment
        remains unverified.
    - line: Robot video generation from language, goals, and physics priors
      what_it_solves: Synthesizes robot future videos for planning and policy evaluation
        by factorizing language primitives or adding depth/keypoint physics signals.
      what_remains_open: Real-robot generalization beyond simulation, support for
        novel language primitives, and robustness of physical plausibility across
        diverse robots and scenes remain open.
    - line: Unified video-action diffusion for large robot datasets
      what_it_solves: Pretrains a single model that can represent policy, forward
        or inverse dynamics, or video generation using modality-specific diffusion
        timesteps on multitask robot data.
      what_remains_open: No limitation details are given; evidence beyond large robot
        datasets, deployment on physical robots, and robustness to action-free video
        scaling is needed.
    - line: Efficient stochastic and contextual model-based reinforcement learning
      what_it_solves: Learns compact latent dynamics or context-conditioned world
        models to train policies in imagined rollouts, improving Atari sample efficiency
        or zero-shot contextual generalization.
      what_remains_open: 'Evaluation is narrow: Atari-only for one route and two CARL
        tasks with observable context for another; transfer to broader embodied tasks
        is unverified.'
    - line: Interactive/open-domain world-model consistency and action-control benchmarks
      what_it_solves: Provides datasets and metrics, including loop navigation and
        revisited videos, to test spatial or memory consistency and action conditioning
        across viewpoints and action spaces.
      what_remains_open: The benchmarks reveal long-term consistency and cross-action-space
        generalization are difficult; evidence on how different model families overcome
        these limitations is still missing.
    consensus:
    - World models are treated as domain-specific learned simulators that generate
      future observations and support policy training, planning, or evaluation.
    - Recent work converges on video generation, diffusion, and Transformer-style
      architectures, with auxiliary objectives targeting multi-view, long-horizon,
      or physical consistency.
    - Evaluation depends on domain-specific datasets and metrics for driving, robotics,
      Atari, Minecraft, or open-domain video, with attention to controllability and
      generalization to unseen context or goals.
    - Multiple lines condition generation on multimodal signals such as actions, language,
      goal images, or context to map observations to policy and dynamics.
    - Several papers lack explicit limitation details, so reported results should
      be read with reproducibility and boundary-condition verification gaps in mind.
    disagreements:
    - 'Representation choices differ: recurrent state-space or VAE-style latent dynamics,
      diffusion Transformers, and unified video-action diffusion are used across lines.'
    - 'Supervision signals differ: self-supervised video reconstruction, MAE-style
      masked generation, physics-informed depth and keypoint prediction, action diffusion,
      and context-conditioned RL coexist.'
    - Evaluation targets differ across driving video quality, robot task execution
      or simulation, Atari human-normalized score, spatial consistency, memory consistency,
      and action control.
    - 'Interaction modes differ: open-loop future video prediction, closed-loop action-conditioned
      control, language or goal-image composition, and shared versus varied action
      spaces.'
    - 'Deployment settings differ: simulation-only evaluation, real driving or robot
      datasets, open-domain video clips, and some work aiming at zero-shot or real-robot
      transfer while others stay in controlled benchmarks.'
    open_questions:
    - Can improvements in simulated or generated video quality transfer to real driving
      safety, robot operation success, and downstream policy performance?
    - How can world models maintain long-term spatial and memory consistency and generalize
      to new action spaces without relying on loop trajectories, known primitives,
      or observable context?
    - Which assumptions about context, physics priors, or predefined action spaces
      fail when applied to open-domain environments?
    - What boundary conditions are hidden by missing limitation, code, dataset, metric,
      and baseline details in the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶领域仿真与场景预测
      解决的问题: 生成未来驾驶观测，支持多视角、长时域预测，并在常规、长时域和零样本驾驶数据上评估。
