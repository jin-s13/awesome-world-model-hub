  related_work_outline:
  - 'Mainstream direction: Diffusion- and transformer-based world models dominate
    recent method research, especially for driving and robot video generation and
    for learned dynamics.'
  - 'Shared research pattern: Researchers encode actions or context and generate future
    visual or latent states, then evaluate generalization, visual fidelity, action
    control, or downstream policy quality.'
  - 'Key differences: Methods split between compact latent dynamics for RL, task-conditioned
    video generation, physics-informed auxiliary objectives, unified video-action
    diffusion, and benchmark-only evaluation.'
  - 'Trend evolution: Work is moving from stochastic latent world models for Atari/CARL
    toward large-scale multimodal generative world models, with newer benchmarks formalizing
    memory consistency and action control.'
  - 'Open questions: Long-horizon memory, physical plausibility, cross-action-space
    generalization, real-world transfer, and isolating model contribution from surrounding
    system choices remain unresolved.'
  related_work_outline_zh:
  - 主流方向：扩散和 Transformer 类世界模型在近期方法研究中占主导，尤其用于驾驶与机器人视频生成及学习动力学。
  - 研究共性：研究者将动作或上下文编码后生成未来视觉或隐状态，并以泛化、保真度、动作控制或下游策略质量作为评估重心。
  - 关键差异：方法分别偏向紧凑隐动力学、任务条件视频生成、物理信息辅助目标、统一视频-动作扩散或评测基准路径。
  - 趋势演进：研究正从 Atari/CARL 等随机隐世界模型转向大规模多模态生成世界模型，新的基准也在形式化记忆一致性与动作控制评测。
  - 开放问题：长时记忆、物理合理性、跨动作空间泛化、真实世界迁移，以及模型贡献与系统选择的隔离仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic latent-dynamics world models for model-based RL
      what_it_solves: Learning compact state representations and latent transition
        models for sample-efficient policy optimization
      what_remains_open: Whether the latent representation and context assumptions
        transfer beyond reported control benchmarks, and whether downstream gains
        are attributable to learned dynamics rather than planning.
    - line: Diffusion and transformer video world models for driving and robot imagination
      what_it_solves: Generating future visual observations from action, language,
        or goal conditioning for long-horizon, multi-view, and compositional prediction
      what_remains_open: Long-term spatial and memory consistency, physical plausibility,
        and generalization to novel primitives or scenes beyond training combinations.
    - line: Physics-informed and unified video-action world models
      what_it_solves: Adding auxiliary depth, keypoint, or action-diffusion objectives
        to align video generation with geometry, physics, and policy learning
      what_remains_open: Whether gains come from the auxiliary signal, architecture,
        or surrounding system choices, and whether models transfer to real execution.
    - line: Benchmark-driven evaluation of world-model consistency and action control
      what_it_solves: Measuring closed-loop spatial consistency, memory consistency,
        and action-conditioned generation across standardized data
      what_remains_open: Linking benchmark scores to downstream task success, expanding
        scene and action space coverage, and establishing sensitivity to architecture
        choices.
    consensus:
    - Recent methods converge on using generative sequence models, especially transformers
      and diffusion, as the core of world-model learning.
    - Most methods condition learned dynamics on actions or context and evaluate future
      prediction quality, generalization, visual fidelity, or downstream policy performance.
    - Generalization evidence is increasingly collected beyond training observations,
      including zero-shot contexts, unseen goals, long-horizon rollouts, memory consistency,
      and action control.
    - Auxiliary training signals such as reconstruction, mask prediction, depth, keypoint
      dynamics, or action prediction are widely used to regularize world-model learning.
    disagreements:
    - 'Representation choices differ: compact latent states for RL dynamics, high-dimensional
      generated video frames, or unified video-action tokens.'
    - 'Supervision differs: policy return optimization, self-supervised diffusion/mask/reconstruction,
      physics-informed depth/keypoint signals, or benchmark consistency metrics.'
    - 'Evaluation targets differ: Atari 100k and CARL control, driving video datasets,
      robot video datasets such as RT-X, and open-domain navigation or video benchmarks.'
    - 'Interaction modes differ: training policies in imagined latent rollouts, synthesizing
      video plans for execution, or jointly diffusing actions and video.'
    - 'Deployment evidence differs: some work reports only simulation or benchmark
      results, while other work targets driving or robotic settings, leaving real-world
      transfer unclear.'
    open_questions:
    - Which representation and training objective choices transfer beyond the specific
      datasets and task families reported?
    - How can world models maintain long-horizon spatial and memory consistency while
      generalizing across action spaces?
    - How much of reported downstream gain comes from the learned dynamics rather
      than the controller, planner, or task-specific prior?
    - Can physics-informed or benchmark-driven evaluation be linked to downstream
      robot/driving task success and real-world deployment?
    - What evidence is still missing because several papers do not report limitations,
      baseline ablations, or real-world execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向模型强化学习的随机隐状态世界模型
      解决的问题: 学习紧凑状态表示和隐式转移模型，以支持低样本下的策略优化
      尚未覆盖: 隐状态表示和上下文假设能否迁移到已报告控制基准之外，以及下游收益是否来自动力学而非规划。
    - 路线: 面向驾驶与机器人想象的高保真视频世界模型
      解决的问题: 从动作、语言或目标条件生成未来视觉观测，支持长时域、多视角和组合预测
      尚未覆盖: 长期空间与记忆一致性、物理合理性，以及对训练组合之外的新原语或场景的泛化。
    - 路线: 物理信息与统一视频-动作世界模型
      解决的问题: 加入深度、关键点或动作扩散等辅助目标，使视频生成对齐几何、物理和策略学习
      尚未覆盖: 收益来自辅助信号、架构还是周边系统选择，以及模型能否迁移到真实执行。
    - 路线: 世界模型一致性与动作控制评测协议
      解决的问题: 在标准化数据上测量闭环空间一致性、记忆一致性和动作条件生成
      尚未覆盖: 将基准分数与下游任务成功关联，扩展场景与动作空间覆盖，并验证对架构选择的敏感性。
    共识:
    - 近期方法趋向于使用 Transformer 或扩散等生成式序列模型作为世界模型学习的核心。
    - 多数方法以动作或上下文为条件学习动力学，并评估未来预测质量、泛化性、视觉保真度或下游策略表现。
    - 研究越来越强调超出训练分布的证据，包括零样本上下文、未见目标、长时域推演、记忆一致性和动作控制。
    - 重建、掩码预测、深度、关键点动力学或动作预测等辅助训练信号被广泛用于正则化世界模型学习。
    分歧:
    - 表示选择不同：用于强化学习动力学的紧凑隐状态、高维生成视频帧、或统一视频-动作 token 等路径并存。
    - 监督信号不同：策略回报优化、自监督扩散/掩码/重建、物理信息深度/关键点信号、或基准一致性指标。
    - 评测目标不同：Atari 100k 与 CARL 控制、驾驶视频数据集、RT-X 等机器人视频数据集、以及开放域导航或视频基准。
    - 交互模式不同：在想象轨迹中训练策略，先合成视频计划再执行，或联合扩散动作与视频。
    - 部署证据不同：部分工作仅报告仿真或基准结果，另一些面向驾驶或机器人场景，真实世界迁移仍不清晰。
    开放问题:
    - 哪些表示和训练目标能迁移到已报告数据集和任务族之外？
    - 世界模型如何在跨动作空间泛化的同时保持长时域空间与记忆一致性？
    - 报告的下游增益中，有多少来自学习到的动力学，而不是控制器、规划器或任务特定先验？
    - 物理信息驱动或基准驱动的评估能否与下游机器人/驾驶任务成功和真实部署建立联系？
    - 当前证据仍有哪些缺口，例如部分论文未报告局限性、基线消融或真实世界执行？
