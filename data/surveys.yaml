  related_work_outline:
  - 'Mainstream direction: Driving and embodied robot world models dominate recent
    evidence, especially generative video/diffusion transformer models with domain-specific
    auxiliary tasks for prediction, control, and pretraining.'
  - 'Shared research pattern: Most works learn dynamics from high-dimensional observations
    and add inductive biases—mask reconstruction, context conditioning, language composition,
    physics losses, or action-video diffusion—to improve generalization, consistency,
    or efficiency.'
  - 'Key differences: They diverge in representation and supervision: compact latent
    rollouts for RL versus pixel/latent video diffusion; explicit contexts, language
    primitives, physics priors, or coupled actions; evaluation spans Atari, driving,
    robot manipulation, and consistency benchmarks.'
  - 'Trend evolution: Available top-paper evidence from 2023–2026 moves from efficient
    model-based RL on game benchmarks toward domain-specific generative applications
    in driving and robotics, then toward dedicated benchmarks for spatial consistency,
    memory consistency, and action control.'
  - 'Open questions: Cross-embodiment and sim-to-real transfer, long-horizon memory
    and action controllability, inference of context from raw observations, and alignment
    between generative realism and real-world task performance remain open.'
  related_work_outline_zh:
  - 主流方向：驾驶和具身机器人世界模型在近期证据中占主导，尤其是生成式视频/扩散Transformer模型，并结合领域专用辅助任务用于预测、控制与预训练。
  - 研究共性：多数工作从高维观测学习动力学，并引入掩码重建、上下文条件、语言组合、物理损失或动作-视频扩散等归纳偏置，以提升泛化、一致性或效率。
  - 关键差异：表示与监督信号出现分化：面向强化学习的紧凑潜在推演与像素/潜在视频扩散；显式上下文、语言原语、物理先验或耦合动作；评测目标从Atari、驾驶到机器人操作和一致性基准。
  - 趋势演进：可用高排序论文证据从游戏基准上的高效模型强化学习，转向驾驶与机器人领域的生成式应用，再转向面向空间一致性、记忆一致性与动作控制的专用基准。
  - 开放问题：跨本体与虚实迁移、长时域记忆和动作可控性、从原始观测推断上下文，以及生成真实感与真实任务性能之间的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative driving world models
      what_it_solves: Long-horizon and multi-view scene prediction for autonomous
        driving simulation and policy evaluation.
      what_remains_open: Whether validation and long-horizon metrics on NuScenes,
        OpenDV-2K, or Waymo transfer to closed-loop real-world safety and operational
        outcomes; limitation details are absent.
    - line: Embodied robot video/action world models
      what_it_solves: Video-based robot imagination, policy training, and action-conditioned
        dynamics learning from robot datasets.
      what_remains_open: Generalization to unseen language-primitive combinations
        or embodiments, real-robot execution beyond simulation, and long-horizon physical
        plausibility remain underevidenced.
    - line: Contextual model-based reinforcement learning
      what_it_solves: Zero-shot generalization to unseen dynamics by conditioning
        latent state inference and dynamics on observable context variables.
      what_remains_open: Evidence covers only two CARL benchmark tasks with observable
        context; partially observable or inferred-context settings are not verified.
    - line: Efficient stochastic game world models
      what_it_solves: Sample-efficient policy learning on visual control benchmarks
        by combining sequence modeling with variational inference.
      what_remains_open: Evidence is concentrated on Atari 100k; scaling to more complex
        domain applications without lookahead search remains open.
    - line: World-model evaluation benchmarks
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control in interactive environments such as Minecraft or open-domain videos.
      what_remains_open: Current models still struggle with long-term consistency
        and cross-action-space generalization; some benchmark summaries report limited
        or no baseline results.
    consensus:
    - World models are increasingly treated as action-conditioned simulators, not
      only as passive next-frame predictors.
    - Auxiliary objectives and structural priors—mask reconstruction, physics cues,
      context conditioning, language factorization, or multimodal diffusion—are used
      to improve realism, consistency, or generalization.
    - Current evaluations emphasize visual quality, benchmark metrics, or downstream
      policy success while treating long-horizon memory and cross-domain transfer
      as central challenges.
    disagreements:
    - 'Representation differs: some methods learn compact latent state-space dynamics
      for model-based RL, while others generate high-dimensional video through diffusion
      or transformer decoders.'
    - 'Supervision differs: conditioning may use explicit context values, language-instruction
      primitives, physics-related auxiliary tasks, or paired action-video diffusion.'
    - 'Evaluation targets differ: Atari human-normalized scores, driving multi-view/long-horizon
      prediction metrics, robot video fidelity plus policy execution, and dedicated
      memory/spatial consistency scores are not directly comparable.'
    - 'Interaction mode differs: some methods are evaluated with closed-loop action
      control or robot execution, while others remain open-loop video prediction or
      pretraining pipelines.'
    - 'Deployment setting differs: several studies evaluate only in simulation or
      benchmark datasets, leaving real-world safety and operational outcomes unverified.'
    open_questions:
    - Can improved driving or robot video prediction metrics be shown to improve real-world
      safety, task success, and operational reliability rather than benchmark scores
      alone?
    - What world-model designs can maintain long-term memory consistency and action
      controllability across unseen viewpoints, action spaces, and environments?
    - How can context be inferred from raw high-dimensional observations when explicit
      context variables are unavailable?
    - What evaluation protocols can separate pixel-level realism from physically plausible,
      causally correct dynamics for downstream policy training?
    - Do current benchmarks provide enough closed-loop, cross-embodiment, or multi-domain
      evidence to support claims of generalizable world models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式驾驶世界模型
      解决的问题: 面向自动驾驶仿真和策略评估的长时域、多视角场景预测。
      尚未覆盖: NuScenes、OpenDV-2K、Waymo等验证或长时域指标能否迁移到真实闭环安全与运行结果仍不明确，且缺少局限性说明。
    - 路线: 具身机器人视频/动作世界模型
      解决的问题: 基于视频的机器人想象、策略训练，以及动作条件下的动力学学习。
      尚未覆盖: 对未见语言原语组合或本体的泛化、仿真之外的实体机器人执行，以及长时域物理合理性尚未充分验证。
    - 路线: 上下文模型化强化学习
      解决的问题: 通过让潜在状态推断与动力学条件化于可观测上下文变量，提升对未见动力学的零样本泛化。
      尚未覆盖: 仅在CARL基准的两个任务上验证，且假设上下文可观测；部分可观测或推断上下文的场景未覆盖。
    - 路线: 高效随机游戏世界模型
      解决的问题: 通过序列建模与变分推断结合，在视觉控制基准上实现样本高效策略学习。
      尚未覆盖: 证据集中在Atari 100k；向更复杂领域应用扩展以及无前瞻搜索下的能力边界仍开放。
    - 路线: 世界模型评测基准
      解决的问题: 在Minecraft或开放域视频中衡量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 现有模型仍难以维持长期一致性与跨动作空间泛化；部分基准在包内摘要中未报告完整基线结果。
    共识:
    - 世界模型越来越多被要求作为可动作控制的条件化模拟器，而不仅是下一帧预测器。
    - 通过掩码重建、物理线索、上下文条件、语言分解或多模态扩散等辅助目标与结构先验，改善真实性、一致性或泛化性。
    - 当前评测普遍关注视觉质量、基准指标或下游策略成功率，同时把长时记忆与跨域迁移视为核心挑战。
    分歧:
    - 表示差异：部分方法学习紧凑潜在状态空间以支持基于模型的强化学习，另一些通过扩散或Transformer解码器生成高维视频。
    - 监督信号差异：条件化可能采用显式上下文值、语言原语、物理相关辅助任务或配对动作-视频扩散。
    - 评测目标差异：Atari人类标准化得分、驾驶多视角/长时域预测指标、机器人视频保真度与策略执行、以及记忆/空间一致性分数不可直接比较。
    - 交互模式差异：一些方法采用闭环动作控制或机器人执行，另一些仍停留在开环视频预测或预训练流程。
    - 部署场景差异：部分研究仅在仿真或基准数据集上评估，真实世界安全与运营结果仍未被验证。
    开放问题:
    - 驾驶或机器人视频预测指标的提升能否证明真实世界安全性、任务成功率和运行可靠性同步改善？
    - 何种世界模型设计能在未见视角、动作空间和环境中长期保持记忆一致性与动作可控性？
    - 当显式上下文变量不可用时，如何从高维原始观测中推断上下文并泛化动力学？
    - 需要哪些评测协议来区分像素级真实感与物理可靠、因果正确的动力学对下游策略训练的作用？
    - 现有基准是否提供足够的闭环、跨本体或多领域证据，足以支撑通用世界模型的可信声明？
