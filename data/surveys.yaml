  related_work_outline:
  - 'Mainstream direction: Evaluation-driven world-model benchmarking dominates, with
    datasets and suites comparing visual fidelity, dynamics prediction, long-horizon
    rollout, spatial/memory consistency, action control, and downstream policy utility.
    Main sub-directions are task/dataset design, metric/stress-test design, and comparable
    baseline/reporting.'
  - 'Shared research pattern: Papers construct or reuse video-action datasets, train
    generative world models or baselines, then evaluate rollouts with visual quality,
    policy scores, consistency metrics, and zero-shot generalization. Benchmark-focused
    papers contribute open datasets and quantitative probes rather than model innovations.'
  - 'Key differences: They differ in evaluation targets: Atari policy performance
    and training efficiency, CARL zero-shot context generalization, driving video
    rollout quality, Minecraft scene-graph spatial consistency, and open-domain memory/action
    control. Some rely on action-conditioned data, others on context values or action-free
    video.'
  - 'Trend evolution: The packet''s representative papers fall in 2023-2026; they
    reuse established benchmarks with older roots such as Atari 100k and CARL. Within
    this frontier, work is shifting toward specialized world-model consistency benchmarks
    built from navigation and multi-view video, with diffusion and transformer models
    as common subjects.'
  - 'Open questions: Whether benchmark distributions cover real deployment settings,
    whether proxy metrics align with downstream decisions, and whether conclusions
    remain stable across implementations, compute budgets, and action spaces. Missing
    limitation and reproducibility details in several packet entries are verification
    gaps.'
  related_work_outline_zh:
  - 主流方向：以评测驱动世界模型研究为主，围绕视觉保真、动态预测、长时域滚动、空间与记忆一致性、动作控制和下游策略效用构建数据集或基准。主要子方向为任务与数据集设计、指标与压力测试设计、可比基线与报告。
  - 研究共性：论文构建或复用视频-动作数据，训练生成式世界模型或基线，再看滚动视觉质量、策略分数、一致性指标和零样本泛化；基准类工作更侧重公开数据集与量化探针，而非模型创新。
  - 关键差异：评测目标不同，包括Atari策略表现与训练效率、CARL零样本上下文泛化、驾驶视频滚动质量、Minecraft场景图空间一致性、开放域记忆与动作控制；数据条件也不同，有的用动作条件，有的用上下文或动作无关视频。
  - 趋势演进：代表性论文集中在2023-2026，复用Atari 100k和CARL等更早基础基准；当前前沿正转向从导航和多视角视频构建更专门的世界模型一致性基准，扩散与Transformer模型成为常见评测对象。
  - 开放问题：基准分布是否覆盖真实部署场景，代理指标是否对齐下游决策，结论在不同实现、算力预算和动作空间下是否稳定；若干论文缺少局限说明或复现细节，应视为验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video-action tasks and datasets that make world-model
        claims comparable across loop navigation, multi-view video, driving, and game
        environments.
      what_remains_open: Whether designed task distributions cover deployment settings
        where world models should help, and whether scoring remains valid across pixel
        variation and action-space shifts.
    - line: Metric and stress-test design
      what_it_solves: Probes properties beyond aggregate scores, including spatial
        consistency, memory consistency, action control, visual detail, and downstream
        policy generalization.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        users actually care about, especially under long-horizon and cross-action-space
        conditions.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common evaluation protocols and baselines such as Dreamer-style
        agents, Atari human-normalized scores, and state-of-the-art driving world
        model comparisons.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets, and whether missing limitation, baseline, or artifact
        details can support auditability.
    consensus:
    - 'World-model evaluation is treated as a multi-signal problem: visual plausibility,
      temporal consistency, action controllability, and downstream policy utility
      are jointly considered rather than a single aggregate score.'
    - Video generation and action-conditioned rollout form the main substrate for
      world-model benchmarks, usually combined with visual quality scores, policy
      scores, or consistency metrics.
    - Long-horizon stability and generalization are consistently identified as weak
      points that current evaluations need to stress.
    disagreements:
    - 'Representation: some works evaluate pixel-level generation quality, while others
      use pixel-invariant scene-graph consistency or semantic memory consistency.'
    - 'Supervision and evaluation target: some rely on action-conditioned driving
      or game rollouts, while contextual reinforcement learning studies evaluate zero-shot
      policy generalization under observed context values.'
    - 'Interaction mode and deployment setting: settings range from closed-loop navigation
      and multi-view video with shared or varied action spaces to fixed-action driving
      and Atari-like environments.'
    - 'Evidence completeness: several papers state strong results without full limitation
      sections or comparable baseline/artifact details, limiting cross-paper comparability.'
    open_questions:
    - Do current benchmark task distributions cover the real deployment settings where
      world models are expected to improve decision-making and long-horizon control?
    - How well do proxy metrics such as visual quality, scene-graph consistency, and
      aggregate policy scores align with downstream decisions users care about?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      action-space variations?
    - Can long-term memory consistency and zero-shot generalization be measured without
      assuming observable context values or fixed action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的视频-动作任务和数据集，使世界模型主张在循环导航、多视角视频、驾驶和游戏环境中可比较。
      尚未覆盖: 任务分布是否覆盖世界模型应发挥作用的真实部署设置，评分在像素变化和动作空间迁移下是否仍有效。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、视觉细节和下游策略泛化。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致，尤其是长时域和跨动作空间条件。
    - 路线: 可比基线与报告规范
      解决的问题: 提供统一评测协议和基线，如Dreamer风格智能体、Atari人类归一化分数、驾驶世界模型对比。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定，缺失的局限性、基线或工件细节是否影响可审计性。
    共识:
    - 世界模型评估被视作多信号问题：视觉合理性、时序一致性、动作可控性和下游策略效用共同作为证据，而非单一总分。
    - 视频生成和动作条件滚动是世界模型基准的主要载体，通常结合视觉质量、策略分数或一致性指标。
    - 长时域稳定性和泛化被一致视为当前评估需要施压的薄弱点。
    分歧:
    - 表示方式不同：一部分研究评测像素级生成质量，另一些使用对像素变化不变的场景图一致性或语义记忆一致性。
    - 监督信号和评测目标不同：有的依赖动作条件驾驶或游戏滚动，上下文强化学习研究则评测可观测上下文下的零样本策略泛化。
    - 交互模式与部署场景不同：从闭环导航和多视角视频，到共享或变化动作空间，再到固定动作空间的驾驶和Atari类环境。
    - 证据完备性不同：若干研究给出强结果但缺少完整局限说明或可比基线与工件细节，跨论文可比较性受限。
    开放问题:
    - 当前基准任务分布是否覆盖世界模型应改善决策与长时域控制的真实部署设置？
    - 视觉质量、场景图一致性和聚合策略分数等代理指标，是否与用户关心的下游决策一致？
    - 基准结论在实现差异、算力预算和动作空间变化下是否稳定？
    - 能否在不假设上下文可观测或固定动作空间的前提下，测量长期记忆一致性和零样本泛化？
