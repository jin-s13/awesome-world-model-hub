  related_work_outline:
  - 'Mainstream direction: Specialized benchmarks for world models are emerging, focusing
    on spatial consistency, memory, and action control beyond conventional frame prediction.'
  - 'Shared research pattern: Proposing a new dataset with task-specific metrics (e.g.,
    scene graph consistency, memory consistency) and a baseline to diagnose a specific
    model capability.'
  - 'Key differences: Environments span driving, Minecraft, and robotics; evaluation
    varies from open-loop pixel reconstruction to closed-loop interaction; metrics
    target spatial, temporal, or decision-level consistency.'
  - 'Trend evolution: From 2023''s reliance on Atari 100k as a de facto standard,
    2025–2026 shifts to diagnostic benchmarks explicitly designed for world-model
    capabilities, with increasing focus on long-term memory and action-conditioned
    rollouts.'
  - 'Open questions: Whether proxy metrics align with downstream decision utility;
