  related_work_outline_zh:
  - 主流方向：世界模型的领域化应用当前集中在具身机器人与自动驾驶，视频预测、动作条件生成和下游策略学习是主要用途。
  - 研究共性：多数工作以动作、语言或上下文为条件，在视觉或视频数据上训练世界模型，并以视觉质量、下游策略表现或一致性指标进行评测。
  - 关键差异：差异主要体现在表示方式（潜在状态空间 vs 视频扩散）、监督信号（无动作视频、动作条件强化学习、语言/上下文）和评测目标（驾驶 rollout、机器人仿真执行、一致性基准）。
  - 趋势演进：可用 top 证据集中在 2023–2026，从 Atari/CARL 模型驱动强化学习转向大规模机器人预训练、驾驶视频世界模型和开放域一致性基准；更早年份证据稀疏。
  - 开放问题：仿真和数据集之外的现实迁移、长期记忆一致性、跨动作空间控制，以及对未见上下文或新原语的泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot task transfer and video planning
      what_it_solves: Adapting world models to robot state-action spaces for video
        plan synthesis, policy training, policy evaluation, and generalization to
        unseen task combinations.
      what_remains_open: Generalization beyond seen primitive combinations or observable
        contexts, evidence of real-robot execution, and alignment between simulation
        gains and physical deployment remain limited.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for long-horizon, multi-view driving scene
        prediction and zero-shot evaluation across driving datasets.
      what_remains_open: Whether dataset-level improvements such as those on NuScenes,
        OpenDV-2K, or Waymo correspond to real-world safety or operational outcomes
        is still unverified.
    - line: Interactive agents and games via model-based RL
      what_it_solves: Training agents in compact visual control tasks and contextual
        reinforcement learning settings by rolling out imagined trajectories from
        world models.
      what_remains_open: The contextual approach assumes observable context and tests
        only two CARL tasks; broader generalization under changing rules, goals, or
        user interactions is underexplored.
    - line: World model consistency and controllability benchmarking
      what_it_solves: Quantifying spatial consistency, memory consistency, and action
        control in loop-based navigation and revisited open-domain video settings.
      what_remains_open: Benchmark construction is ahead of model improvement; LoopNav
        reports no experimental results in the abstract, while MIND frames long-term
        memory consistency and cross-action-space control as open challenges.
    consensus:
    - World models are being specialized to embodied and interactive domains by conditioning
      on actions, language, or context.
    - Visual generation and diffusion transformers now serve as a common substrate
      for many application-oriented world models.
    - Evaluation is moving beyond visual fidelity toward downstream policy training,
      policy evaluation, and spatial or memory consistency.
    - Recent work emphasizes zero-shot, long-horizon, or multi-view generalization,
      though deployment evidence remains incomplete.
    disagreements:
    - Representation differs between stochastic latent state-space models and video
      diffusion or generative transformer models.
    - Supervision differs across action-conditioned closed-loop learning, action-free
      video pretraining, and language- or context-conditioned generation.
    - Evaluation targets differ across game/control benchmarks, driving scene prediction,
      robot video planning, and open-domain consistency benchmarks.
    - Deployment settings differ from small visual RL environments to large multitask
      robot datasets, driving datasets, and open-ended interactive worlds.
    open_questions:
    - Do driving world-model gains on NuScenes, OpenDV-2K, and Waymo transfer to real-world
      safety or operational outcomes?
    - Can robot world models trained or evaluated in simulation produce policies that
      transfer reliably to physical hardware?
    - How can long-term memory consistency and cross-action-space control be maintained,
      given that current benchmarks identify them as unresolved?
    - How can methods relying on observable context or known primitive combinations
      extend to unseen contexts or entirely novel primitives?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人任务迁移与视频规划
      解决的问题: 将世界模型适配到机器人状态-动作空间，用于合成视频计划、训练策略、评测策略，并泛化到未见任务组合。
      尚未覆盖: 超出已见原语组合或可观测上下文范围的泛化、真实机器人执行证据，以及仿真收益与物理部署之间的一致性仍然有限。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型在驾驶数据上做长时域、多视角场景预测，并进行跨数据集零样本验证。
      尚未覆盖: NuScenes、OpenDV-2K 和 Waymo 等数据集上的改进是否对应真实安全或运营结果仍未验证。
    - 路线: 交互式智能体与游戏中的模型驱动强化学习
      解决的问题: 在视觉控制任务和上下文强化学习设置中，通过世界模型生成的想象轨迹训练智能体策略。
      尚未覆盖: 上下文方法假设上下文可观测，且仅在两个 CARL 任务上验证；规则、目标或用户交互变化时的更广泛化仍探索不足。
    - 路线: 世界模型一致性与可控性基准评测
      解决的问题: 在循环导航和开放域重访视频设置中，量化空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 基准构建先于模型改进；LoopNav 摘要未报告实验结果，MIND 将长期记忆一致性和跨动作空间控制列为开放挑战。
    共识:
    - 世界模型正被动作、语言或上下文条件化，以适配具身和交互领域的具体任务。
    - 视觉生成和扩散 Transformer 在多个应用导向的世界模型中逐渐成为共同技术基础。
    - 评测正在从单纯视觉保真度扩展到下游策略训练、策略评测以及空间或记忆一致性。
    - 近期工作普遍重视零样本、长时域或多视角泛化，但部署证据仍不完整。
    分歧:
    - 表示方式存在差异：随机潜在状态空间模型与视频扩散/生成式 Transformer 模型。
    - 监督信号存在差异：动作条件闭环学习、无动作视频预训练，以及语言或上下文条件生成。
    - 评测目标存在差异：游戏/控制基准、驾驶场景预测、机器人视频计划和开放域一致性基准。
    - 部署场景存在差异：从小规模视觉强化学习环境到大规模多任务机器人数据集、驾驶数据集和开放式交互世界。
    开放问题:
    - 在 NuScenes、OpenDV-2K 和 Waymo 上取得的驾驶世界模型提升能否迁移到现实安全或运营结果？
    - 在仿真中训练或评测的机器人世界模型，其策略能否可靠迁移到物理硬件？
    - 既然当前基准指出长期记忆一致性和跨动作空间控制尚未解决，应如何系统性地改善？
    - 依赖可观测上下文或已知原语组合的方法，如何扩展到未知上下文或全新原语？
