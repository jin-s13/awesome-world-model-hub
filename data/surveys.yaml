  related_work_outline:
  - 'Mainstream direction: Diffusion- or Transformer-based generative world models
    for video prediction and action-conditioned synthesis, especially in driving and
    robotics.'
  - 'Shared research pattern: World models are trained with auxiliary objectives such
    as mask reconstruction, physics-informed tasks, context conditioning, or action-video
    diffusion to improve fidelity, consistency, or policy learning.'
  - 'Key differences: Representation choices range from recurrent state-space latent
    models for model-based RL to unified diffusion Transformers; supervision signals
    and evaluation targets also differ substantially.'
  - 'Trend evolution: Available top papers concentrate in 2023-2026, moving from efficient
    stochastic RL world models toward large-scale generative video world models and
    explicit consistency/action-control benchmarks.'
  - 'Open questions: Transfer beyond reported tasks, separation of model contributions
    from surrounding system choices, and reliable measurement of long-term memory
    consistency and action-space generalization remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散或Transformer的生成式世界模型，用于视频预测和动作条件合成，尤其集中在驾驶与机器人场景。
  - 研究共性：世界模型通过掩码重建、物理信息任务、上下文条件或动作-视频扩散等辅助目标，提升保真度、一致性或策略学习能力。
  - 关键差异：表示选择从循环状态空间潜在模型到统一扩散Transformer不等；监督信号和评测目标也存在显著差异。
  - 趋势演进：可见重点论文集中在2023-2026年，从高效随机强化学习世界模型走向大规模生成式视频世界模型和显式一致性/动作控制基准。
  - 开放问题：跨任务迁移、模型贡献与系统选择的隔离、长期记忆一致性及动作空间泛化的可靠评测仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models with masked or diffusion objectives
      what_it_solves: Learning high-fidelity, long-horizon, or multi-view video prediction
        from visual interaction data for driving and robotics.
      what_remains_open: Whether the auxiliary mask, physics, or compositional objectives
        transfer outside reported datasets and domains, and whether fidelity gains
        reflect model design versus data scale.
    - line: Latent dynamics and action-interface models for model-based reinforcement
        learning
      what_it_solves: Connecting learned latent dynamics to policy optimization or
        zero-shot generalization in control tasks.
      what_remains_open: Separating model contribution from planner or task prior;
        context observability assumptions and narrow task coverage leave broader generalization
        unverified.
    - line: World-model evaluation benchmarks for spatial, memory, and action consistency
      what_it_solves: Measuring spatial or temporal consistency, memory, and action
        responsiveness under curated navigation or open-domain video conditions.
      what_remains_open: Benchmarks provide structured evaluation but limited comparative
        baseline results; it remains unclear whether they isolate model quality from
        dataset and action-space design.
    consensus:
    - World models are shifting toward generative video prediction with diffusion
      or Transformer backbones and auxiliary training objectives.
    - Action conditioning or action-video coupled training is used across model-based
      RL and robotics to support policy learning from imagined or predicted trajectories.
    - Explicit evaluation of long-term consistency and action control is emerging
      as a shared concern, with benchmarks designed to expose these limitations.
    disagreements:
    - 'Representation differs: recurrent state-space latent models for control tasks
      versus diffusion Transformers for high-dimensional video generation.'
    - 'Supervision differs: context-conditioned dynamics, language-primitive composition,
      physics-informed auxiliary tasks, and unified action-video diffusion impose
      different training assumptions.'
    - 'Evaluation target differs: Atari human-normalized performance, driving video
      quality, robot task execution, and spatial or memory consistency metrics are
      not directly comparable.'
    - Assumption differences exist around observable context values, reliable language
      parsing, action-free video use, and multimodal goal availability.
    open_questions:
    - How much of reported improvement comes from the proposed representation or objective
      versus dataset scale, planner, controller, or evaluation protocol?
    - Do mask reconstruction, physics-informed auxiliary tasks, or context-conditioned
      dynamics transfer to unseen domains outside their reported benchmark families?
    - Can current consistency and action-control benchmarks produce standardized metrics
      that isolate model limitations in long-term memory and cross-action-space generalization?
    - Several top papers lack visible limitation statements or full artifact evidence,
      leaving reproducibility and boundary conditions as verification gaps rather
      than confirmed strengths.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频世界模型（掩码或扩散目标）
      解决的问题: 从视觉交互数据学习高保真、长时域或多视角视频预测，服务于驾驶和机器人任务。
      尚未覆盖: 辅助掩码、物理或组合目标能否迁移到报告数据集和领域之外，以及保真度提升是否主要来自模型设计而非数据规模。
    - 路线: 面向基于模型强化学习的潜在动力学与动作接口模型
      解决的问题: 把学习到的潜在动力学连接到策略优化或控制任务中的零样本泛化。
      尚未覆盖: 收益中有多少来自模型本身而不是规划器或任务先验；上下文可观测假设和较窄任务覆盖限制更广泛泛化验证。
    - 路线: 面向空间、记忆与动作一致性的世界模型评测基准
      解决的问题: 在导航或开放域视频条件下，测量空间或时间一致性、记忆和动作响应能力。
      尚未覆盖: 基准提供结构化评测，但对比基线结果有限；能否隔离模型质量与数据集及动作空间设计仍不清楚。
    共识:
    - 世界模型正转向基于扩散或Transformer的生成式视频预测，并引入辅助训练目标。
    - 动作条件或动作-视频耦合训练被用于基于模型的强化学习和机器人场景，以支持从想象轨迹中学习策略。
    - 显式评估长期一致性和动作控制正成为共同关注点，基准被设计用于暴露这些局限。
    分歧:
    - 表示方式不同：用于控制任务的循环状态空间潜在模型，与用于高维视频生成的扩散Transformer。
    - 监督信号不同：上下文条件动力学、语言原语组合、物理信息辅助任务和统一动作-视频扩散形成不同训练假设。
    - 评测目标不同：Atari人类表现、驾驶视频质量、机器人执行成功率和空间或记忆一致性指标不可直接比较。
    - 假设差异包括上下文值是否可观测、语言解析是否可靠、是否利用无动作视频以及是否提供多模态目标。
    开放问题:
    - 报告中的改进有多少来自所提表示或目标，而不是数据规模、规划器、控制器或评测协议？
    - 掩码重建、物理信息辅助任务或上下文条件动力学能否迁移到报告基准族之外的未见领域？
    - 当前一致性和动作控制基准能否产生标准化指标，以隔离模型在长期记忆和跨动作空间泛化上的局限？
    - 若干重点论文缺少可见的局限性说明或完整工件证据，因此可复现性和方法边界仍属于验证缺口。
