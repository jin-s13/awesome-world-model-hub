  related_work_outline:
  - 'Mainstream direction: World model architectures are shifting from recurrent state-space
    models to diffusion transformers and Transformer-VAE hybrids, emphasizing high-fidelity
    video generation and scalable pretraining on large robotic and driving datasets.'
  - 'Shared research pattern: Most works augment the training objective with auxiliary
    tasks—such as mask reconstruction, depth prediction, keypoint dynamics, or action
    diffusion—to inject inductive biases (geometry, physics, compositionality) into
    the learned dynamics.'
  - 'Key differences: Representations diverge into pure diffusion, hybrid VAE-Transformer,
    and context-conditioned state-space models; action interfaces range from unified
    video-action diffusion to compositional video planning; evaluation metrics span
    pixel-level fidelity, spatial consistency, and human-normalized scores without
    a common benchmark.'
  - 'Trend evolution: The field is moving from single-task Atari benchmarks toward
    multi-task, multi-domain generalization (driving, robotics, Minecraft), with growing
    attention to long-term memory consistency and physically plausible generation,
    driven by new benchmarks released between 2025 and 2026.'
  - 'Open questions: How to decouple the contribution of the world model from the
    planner or controller; whether physics-informed representations transfer to real-world
    settings; and how to design a unified evaluation protocol that captures memory,
    action control, and task-agnostic generalization.'
  related_work_outline_zh:
  - 主流方向：世界模型架构从循环状态空间模型转向扩散Transformer和Transformer-VAE混合架构，追求高保真视频生成和在大型机器人、驾驶数据集上的可扩展预训练。
  - 研究共性：多数工作通过辅助任务（如掩码重建、深度预测、关键点动力学、动作扩散）增强训练目标，为学习到的动力学注入几何、物理或组合性等归纳偏置。
  - 关键差异：表示方式分为纯扩散、VAE-Transformer混合和上下文条件状态空间模型；动作接口从统一视频-动作扩散到组合式视频规划不等；评估指标涉及像素级保真度、空间一致性和人类归一化分数，缺乏统一基准。
  - 趋势演进：领域正从单任务Atari基准向多任务、多领域泛化（驾驶、机器人、Minecraft）演进，越来越关注长期记忆一致性和物理合理生成，并由2025-2026年新基准驱动。
  - 开放问题：如何解耦世界模型与规划器/控制器的贡献；物理信息表示是否能迁移到真实场景；如何设计统一的评估协议以捕捉记忆、动作控制和任务无关的泛化能力。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converting world-model ideas into concrete representations,
        losses, architectures, and training recipes that can generate high-fidelity
        future frames and support downstream decision-making.
      what_remains_open: Which algorithmic choices (e.g., diffusion vs. VAE, mask
        tokens, physics losses) transfer beyond the reported task family; whether
        the gains come from the generative model quality or the auxiliary objectives,
        and how to achieve long-term memory consistency without prohibitive cost.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to intervention, planning, and decision-time
        interfaces, such as policy training inside imagined rollouts, video planning
        via compositional primitives, or unified action-video diffusion.
      what_remains_open: How much of the performance gain is attributable to the world
        model versus the planner, controller, or task prior; whether action interfaces
        generalize across action spaces and embodiments, and how to isolate the model's
        contribution from the surrounding decision algorithm.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects, and providing reproducible benchmarks for evaluating
        world-model capabilities beyond per-frame quality.
      what_remains_open: Whether the evaluation evidence truly isolates the proposed
        method rather than surrounding system choices; the absence of standardized
        benchmarks for memory consistency and action control, and the limited ablation
        of individual components in most current works.
    consensus:
    - World models are increasingly built on generative architectures (diffusion,
      Transformers) rather than purely deterministic or recurrent backbones, enabling
      higher-quality video prediction.
    - Multi-task auxiliary losses—such as mask reconstruction, depth prediction, and
      keypoint dynamics—are widely adopted to encode geometric and physical priors
      into the latent space.
    - Downstream evaluation is moving beyond Atari toward real-world domains like
      robotics and autonomous driving, with a growing emphasis on generalization and
      zero-shot transfer.
    - There is a shared recognition that current metrics are insufficient; new benchmarks
      explicitly target long-term memory consistency and action controllability to
      complement pixel-level fidelity.
    disagreements:
    - 'Representation choices: Some works use diffusion-based video generation (MaskGWM,
      UWM, RoboScape), while others use VAE-Transformer hybrids (STORM) or context-conditioned
      state-space models (cRSSM), leading to trade-offs in training efficiency and
      fidelity.'
    - 'Action interface: UWM couples action and video diffusion in a single transformer,
      RoboDreamer generates video plans from compositional primitives, and cRSSM/STORM
      train policies inside imagined rollouts, making it unclear which interface is
      most effective for a given task.'
    - 'Physical knowledge injection: RoboScape explicitly learns temporal depth and
      keypoint dynamics to encode physics, whereas other models rely on data-driven
      patterns without explicit physical constraints, resulting in different assumptions
      about the necessary inductive bias.'
    - 'Evaluation scope: Atari 100k uses human-normalized scores, driving benchmarks
      test multi-dataset generalization, and Minecraft/MIND measure spatial and memory
      consistency; these disparate settings prevent direct comparison and obscure
      method-level progress.'
    open_questions:
    - How can world models maintain long-term memory consistency across hundreds of
      steps without resorting to excessively large context windows or expensive recurrent
      mechanisms?
    - What is the minimal set of physical inductive biases needed for a world model
      to transfer from simulation to real-world robotic tasks, and can those biases
      be learned from unlabeled video?
    - Can the contribution of the world model be isolated from the planner or policy
      optimizer so that improvements in the model translate reliably to better decision-making,
      rather than being confounded by the algorithm?
    - How to design a unified evaluation protocol that spans diverse action spaces,
      visual domains, and temporal horizons, and that measures both generative quality
      and downstream task utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体表示、损失函数、架构和训练配方，以生成高保真未来帧并支持下游决策。
      尚未覆盖: 哪些算法选择（如扩散 vs. VAE、掩码令牌、物理损失）能迁移到报告任务族之外；收益来自生成模型质量还是辅助目标，以及如何在不增加过高成本的情况下实现长期记忆一致性。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，例如在想象轨迹中训练策略、通过组合原语进行视频规划，或统一动作-视频扩散。
      尚未覆盖: 性能提升有多大比例来自世界模型而非规划器、控制器或任务先验；动作接口是否能跨动作空间和具身形态泛化，以及如何将模型贡献与决策算法解耦。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素，并提供可复现的基准来评估世界模型超越单帧质量的能力。
      尚未覆盖: 评估证据是否真正隔离了方法贡献而非周边系统选择；缺乏针对记忆一致性和动作控制的标准化基准，以及当前多数工作对各个组件的消融有限。
    共识:
    - 世界模型越来越多地采用生成式架构（扩散、Transformer），而非纯确定性或循环骨干，以实现更高质量的视频预测。
    - 多任务辅助损失——如掩码重建、深度预测和关键点动力学——被广泛采用，以将几何和物理先验编码到潜空间中。
    - 下游评估正从Atari向机器人、自动驾驶等真实世界领域扩展，越来越强调泛化性和零样本迁移。
    - 研究者普遍认识到当前指标不足；新基准明确针对长期记忆一致性和动作可控性，以补充像素级保真度评估。
    分歧:
    - 表示选择：有的采用扩散视频生成（MaskGWM、UWM、RoboScape），有的使用VAE-Transformer混合（STORM）或上下文条件状态空间模型（cRSSM），导致训练效率与保真度的不同权衡。
    - 动作接口：UWM在单一Transformer中耦合动作和视频扩散，RoboDreamer从组合原语生成视频计划，cRSSM/STORM在想象轨迹中训练策略，难以判断哪种接口对特定任务最有效。
    - 物理知识注入：RoboScape显式学习时间深度和关键点动力学以编码物理，其他模型则依赖数据驱动模式，缺乏显式物理约束，对所需归纳偏置的假设不同。
    - 评估范围：Atari 100k使用人类归一化分数，驾驶基准测试跨数据集泛化，Minecraft和MIND测量空间和记忆一致性，这些差异化的设置阻碍了直接比较，掩盖了方法层面的进展。
    开放问题:
    - 世界模型如何在不需要过大上下文窗口或昂贵循环机制的情况下，在数百步内保持长期记忆一致性？
    - 世界模型从仿真迁移到真实世界机器人任务所需的最小物理归纳偏置集是什么？这些偏置能否从未标注视频中学习？
    - 能否将世界模型的贡献与规划器或策略优化器分离，使模型改进可靠地转化为更好的决策，而非与算法效应混淆？
    - 如何设计一个统一的评估协议，涵盖不同的动作空间、视觉域和时间跨度，并同时衡量生成质量和下游任务效用？
