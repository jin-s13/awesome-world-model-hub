  related_work_outline:
  - 'Mainstream direction: Building benchmarks for world models in complex, open-domain
    environments (e.g., driving, robotics, Minecraft) with fine-grained metrics that
    go beyond aggregate scores, targeting spatial consistency, memory, action control,
    and physical plausibility.'
  - 'Shared research pattern: Most works either propose new datasets/tasks (LoopNav,
    MIND) or evaluate methods on established benchmarks (Atari 100k, Nuscenes) while
    introducing metrics to probe specific failures, often emphasizing visual fidelity
    and long-horizon coherence.'
  - 'Key differences: Benchmarks differ in evaluation target—video generation quality
    vs. policy learning performance vs. long-term memory consistency; metric choices
    range from pixel-level similarity to scene-graph consistency and human-normalized
    scores; task settings vary from discrete control to continuous robotic interaction.'
  - 'Trend evolution: The timeline shows a shift from early game-based benchmarks
    (Atari) toward more realistic, interactive settings (driving worlds, reasoning
    over long loops, physical robot scenarios) and a growing emphasis on memory and
    action-controllable evaluation, while still anchored in standardized reporting.'
  - 'Open questions: Whether current benchmarks capture real-world diversity and long-tail
    physics, how well proxy metrics align with downstream decision utility, and how
    stable benchmark conclusions remain across different implementations and compute
    budgets.'
  related_work_outline_zh:
  - 主流方向：在复杂开放环境（驾驶、机器人、Minecraft）中构建世界模型基准，采用超越聚合分数的细粒度指标，衡量空间一致性、记忆、动作控制和物理合理性。
  - 研究共性：多数工作要么提出新任务/数据集（如LoopNav、MIND），要么在既定基准（Atari 100k、Nuscenes）上评估方法，并引入指标探查特定失败模式，同时强调视觉保真度和长时域一致性。
  - 关键差异：基准在评估目标上有分歧——视频生成质量、策略学习表现或长期记忆一致性；指标选择从像素级相似度到场景图一致性、人类归一化得分不等；任务设置涵盖离散控制到连续机器人交互。
  - 趋势演进：从早期基于游戏的基准（Atari）向更真实的交互式场景（驾驶世界、长循环推理、物理机器人）演进，越来越强调记忆和动作可控性评估，同时仍保持标准化报告。
  - 开放问题：现有基准是否覆盖真实世界多样性和长尾物理现象，代理指标与下游决策效用的契合度如何，以及不同实现和算力预算下基准结论的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared evaluation tasks and datasets (e.g., LoopNav
        for spatial consistency, MIND for memory and action control, Atari 100k, Nuscenes)
        so that world model claims become comparable across diverse conditions.
      what_remains_open: Coverage of real-world dynamics, physical interactions, and
        long-horizon scenarios is limited; task diversity and action spaces are still
        narrow, and many benchmarks simplify contextual variations.
    - line: Metric and stress-test design
      what_it_solves: Probes specific world model abilities beyond aggregate scores—spatial
        consistency via Scene Graph Consistency Score, memory and action control via
        MIND's framework, and visual detail impacts via DIAMOND—to reveal failure
        modes.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        performance (e.g., policy training success) is not rigorously validated; stress
        tests for out-of-distribution generalization remain rare.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditability through standardized benchmarks (Atari
        100k, Nuscenes) and open-source artifacts; many papers report results on these
        benchmarks, setting performance baselines for method comparison.
      what_remains_open: Stability of conclusions across different implementations
        and compute budgets is unverified; several studies lack explicit limitation
        documentation, which hampers reproducibility and fair comparison.
    consensus:
    - World model evaluation is moving from simple game environments to more complex
      visual and interactive tasks.
    - There is growing recognition that fine-grained metrics are needed to capture
      spatial consistency, memory, and action control, not just aggregate scores.
    - Open-source benchmarks and metrics facilitate reproducible comparisons and drive
      progress.
    - Visual fidelity and physical plausibility are widely considered essential for
      effective world models.
    disagreements:
    - 'Evaluation target: some works prioritize video generation visual quality, while
      others focus on policy learning efficiency or long-term memory consistency.'
    - 'Metric choice: pixel-level metrics (e.g., FID) vs. semantic-level metrics (e.g.,
      scene graph consistency) are prioritized differently, leading to potentially
      conflicting conclusions about model superiority.'
    - 'Task setting: discrete action spaces (e.g., Atari) versus continuous control
      or robotic manipulation, and closed-loop navigation versus open-loop video generation,
      create divergent evaluation conditions.'
    - 'Context dependency: some approaches assume observable context variables (e.g.,
      cRSSM), while benchmarks do not always control for context shifts, affecting
      zero-shot generalization claims.'
    open_questions:
    - How well do existing benchmarks represent the full diversity of real-world dynamics,
      including physical interactions and long-tail scenarios?
    - What is the measured correlation between proxy metrics (e.g., spatial consistency
      scores) and actual downstream decision utility in robotic or driving tasks?
    - Can a world model that excels on one benchmark (e.g., Atari) maintain comparable
      performance on a substantially different benchmark (e.g., long-horizon driving)?
    - Does the absence of systematic limitation reporting in many studies impede the
      identification of benchmark weaknesses and the design of more robust evaluation
      protocols?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享评估任务和数据集（如用于空间一致性的LoopNav，用于记忆和动作控制的MIND，Atari 100k、Nuscenes），使世界模型的能力声明在不同条件下可比较。
      尚未覆盖: 真实世界动态、物理交互和长时域场景的覆盖有限；任务多样性和动作空间仍然较窄，许多基准简化了上下文变化。
    - 路线: 指标与压力测试设计
      解决的问题: 探查超越聚合分数的特定世界模型能力——通过场景图一致性分数衡量空间一致性，通过MIND框架衡量记忆和动作控制，通过DIAMOND展示视觉细节影响——以揭示失败模式。
      尚未覆盖: 这些代理指标与下游决策性能（如策略训练成功）之间的对齐尚未严格验证；分布外泛化的压力测试仍然稀少。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准化基准（Atari 100k、Nuscenes）和开源工件实现可审计性；许多论文在这些基准上报告结果，为方法比较设定性能基线。
      尚未覆盖: 不同实现和算力预算下结论的稳定性未经验证；若干研究缺乏明确的局限性文档，妨碍可复现性和公平比较。
    共识:
    - 世界模型评估正从简单游戏环境转向更复杂的视觉和交互任务。
