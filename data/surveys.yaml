  related_work_outline:
  - 'Mainstream direction: Generative video prediction models with action conditioning,
    dominated by diffusion transformers and hybrid VAE-transformer architectures,
    targeting robotics and autonomous driving.'
  - 'Shared research pattern: Combining scalable generative architectures with self-supervised
    or reinforcement learning objectives to learn dynamics, then using the learned
    world model for planning, policy optimization, or data augmentation.'
  - 'Key differences: Models diverge in how they incorporate physical priors, handle
    compositional generalization, support long-horizon memory, and interface with
    actions—ranging from integrated action-video diffusion to separate context-conditioned
    latent dynamics.'
  - 'Trend evolution: Moving from single-task Atari benchmarks (2023) to large-scale
    multi-task robot pretraining (2024–2025) and standardized memory/action benchmarks
    (2025–2026), with a growing emphasis on physics-informed and compositional approaches.'
  - 'Open questions: How to isolate the contribution of the world model from the planner
    or policy, how to enforce long-term spatial and temporal consistency, and whether
    physics-informed losses genuinely improve downstream task performance remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以动作条件驱动的生成式视频预测模型为主，扩散Transformer和混合VAE-Transformer架构占主导，目标领域为机器人和自动驾驶。
  - 研究共性：组合可扩展生成架构与自监督或强化学习目标来学习动力学，再利用世界模型进行规划、策略优化或数据增强。
  - 关键差异：模型在整合物理先验、处理组合泛化、支持长时域记忆及与动作接口的方式上有所分化——从动作-视频联合扩散到分离的上下文条件潜变量动力学。
  - 趋势演进：从单任务Atari基准（2023年）转向大规模多任务机器人预训练（2024–2025年）和标准化记忆/动作基准（2025–2026年），物理信息与组合式方法日益受到重视。
  - 开放问题：如何分离世界模型本身与规划器/策略的贡献，如何保证长时域时空一致性，物理信息损失是否真正提升下游任务表现，这些问题仍悬而未决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based video world models with action conditioning
      what_it_solves: Generates high-fidelity future frames conditioned on actions,
        supporting multi-view and long-horizon prediction for driving and robotics.
      what_remains_open: Long-term memory consistency and physical plausibility beyond
        pixel-level fidelity; the benefit of mask reconstruction or joint action-video
        diffusion over simpler baselines is not fully isolated.
    - line: Stochastic latent dynamics models with RL objectives
      what_it_solves: Provides sample-efficient policy learning via latent imagination
        and zero-shot generalization to unseen dynamics in contextual settings.
      what_remains_open: Scalability to high-dimensional visual domains and real-world
        tasks; reliance on observable context values limits applicability to partially
        observable environments.
    - line: Compositional and physics-informed world models
      what_it_solves: Enables generalization to new object/action combinations and
        improves visual rendering by encoding physical properties like depth and keypoint
        dynamics.
      what_remains_open: Compositional generalization is bounded by the set of primitives
        seen during training; physics-informed losses have not been shown to consistently
        improve downstream policy performance.
    - line: Standardized benchmarks for world model evaluation
      what_it_solves: Provides reusable datasets and metrics for memory consistency,
        action control, and spatial coherence, moving beyond task-specific scores.
      what_remains_open: Coverage of diverse real-world scenarios is still limited;
        the relationship between benchmark scores and real robot or driving performance
        is not yet established.
    consensus:
    - World models are increasingly framed as generative video prediction problems
      with action-conditioned inputs.
    - Diffusion transformers and transformer-based VAEs have become the dominant architectural
      choices for learning dynamics.
    - Large-scale pretraining on diverse datasets is a common strategy to improve
      generalization and robustness.
    - Evaluation is shifting from isolated task metrics to structured benchmarks that
      assess memory, action control, and spatial consistency.
    disagreements:
    - 'Representation: Some methods learn a compact latent state (e.g., cRSSM, STORM),
      while others operate directly in pixel space with diffusion (e.g., MaskGWM,
      UWM).'
    - 'Supervision: Physics-informed approaches add explicit depth and keypoint losses
      (RoboScape), whereas others rely purely on next-frame prediction or RL signals.'
    - 'Evaluation target: Atari game scores (STORM) vs. driving video fidelity (MaskGWM)
      vs. robot execution success (RoboDreamer) vs. memory consistency scores (MIND).'
    - 'Interaction mode: Open-loop video prediction (MaskGWM, RoboScape) vs. closed-loop
      policy learning inside the world model (STORM, cRSSM) vs. unified action-video
      generation (UWM).'
    - 'Deployment setting: Task-specific models trained from scratch (STORM) vs. models
      pretrained on large multi-task datasets and fine-tuned (UWM, RoboDreamer).'
    open_questions:
    - How much of the reported performance gain is attributable to the world model
      architecture versus the choice of planner, controller, or training data scale?
    - Can memory-augmented or physics-informed world models maintain long-term consistency
      across hundreds of steps without compounding errors?
    - Do compositional world models truly generalize to novel primitives, or are they
      merely interpolating within the training distribution?
    - What are the minimal evaluation protocols needed to predict real-world deployment
      success, given the gap between current benchmarks and physical environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的动作条件视频世界模型
      解决的问题: 根据动作生成高保真未来帧，支持驾驶与机器人场景下的多视角和长时域预测。
      尚未覆盖: 长期记忆一致性与像素级保真度之外的物理合理性；掩码重建或联合扩散相比简单基线的增益未被充分隔离。
    - 路线: 随机潜变量动力学模型与强化学习目标
      解决的问题: 通过潜想象实现样本高效策略学习，并在上下文设定下实现零样本泛化。
      尚未覆盖: 向高维视觉域和真实任务的扩展能力；依赖可观测上下文值限制了在部分可观测环境中的适用性。
    - 路线: 组合式与物理信息驱动的世界模型
      解决的问题: 实现对新的物体/动作组合的泛化，并通过编码深度和关键点动力学等物理属性提升视觉渲染。
      尚未覆盖: 组合泛化受限于训练中见过的原语集合；物理信息损失尚未被证明能一致提升下游策略性能。
    - 路线: 世界模型评估的标准化基准
      解决的问题: 提供可复用的数据集和指标，用于评估记忆一致性、动作控制和空间连贯性，超越任务特定分数。
      尚未覆盖: 对多样化真实场景的覆盖仍然有限；基准分数与真实机器人或驾驶性能之间的关系尚未建立。
    共识:
    - 世界模型越来越多地被构建为带有动作条件的生成式视频预测问题。
    - 扩散Transformer和基于Transformer的VAE已成为学习动力学的主流架构选择。
    - 在多样化数据集上进行大规模预训练是提升泛化性和鲁棒性的常见策略。
    - 评估正从孤立的任务指标转向评估记忆、动作控制和空间一致性的结构化基准。
    分歧:
    - 表示方式：部分方法学习紧凑潜变量状态（如cRSSM、STORM），而其他方法直接在像素空间用扩散操作（如MaskGWM、UWM）。
    - 监督信号：物理信息方法加入显式深度和关键点损失（RoboScape），而其他方法仅依赖下一帧预测或强化学习信号。
    - 评测目标：Atari游戏分数（STORM）对比驾驶视频保真度（MaskGWM）对比机器人执行成功率（RoboDreamer）对比记忆一致性分数（MIND）。
    - 交互模式：开环视频预测（MaskGWM、RoboScape）对比在世界模型内闭环学习策略（STORM、cRSSM）对比统一动作-视频生成（UWM）。
    - 部署设定：从零训练的任务特定模型（STORM）对比在大规模多任务数据集上预训练并微调（UWM、RoboDreamer）。
    开放问题:
    - 报告的性能增益有多少归因于世界模型架构本身，而非规划器、控制器或训练数据规模的选择？
    - 记忆增强或物理信息驱动的世界模型能否在数百步内保持长期一致性而不产生复合误差？
    - 组合式世界模型是否真正泛化到全新原语，还是仅在训练分布内进行插值？
    - 鉴于当前基准与物理环境之间的差距，哪些最小评估协议足以预测真实部署的成功？
