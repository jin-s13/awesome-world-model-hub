      尚未覆盖: 对训练中未见原语、仅仿真评估、上下文可观测性以及跨本体迁移的验证仍较稀疏。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 构建能预测多视角、长时域驾驶视频并可跨驾驶数据集迁移的生成式驾驶世界模型。
      尚未覆盖: 跨数据集视频预测提升是否转化为闭环安全或真实运营收益尚未得到验证。
    - 路线: 交互式智能体与游戏中的记忆/动作评测
      解决的问题: 开发高效基于模型的强化学习智能体，以及用于评估空间一致性、记忆一致性和动作控制世界模型的游戏与开放域基准。
      尚未覆盖: 长期记忆一致性、跨动作空间泛化，以及超越受控游戏或基准环境的迁移仍需更强证据。
    共识:
    - 世界模型越来越被视为从视觉和动作数据中学习的任务域模拟器或生成式预测器。
    - 自监督生成、重建和扩散目标是这些应用中的主要学习机制。
    - 评测正从单一任务奖励转向长时域、多视角、零样本、物理、空间和记忆一致性指标。
    - 公共领域数据集和基准被用于比较泛化能力，但许多论文没有报告完整局限或真实部署证据。
    分歧:
