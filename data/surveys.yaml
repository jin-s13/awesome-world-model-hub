  related_work_outline_zh:
  - 主流方向：以自动驾驶和具身控制为主的动作可控世界模型模拟器，基于视频生成或循环潜在动力学构建，并配套新基准进行评测。
  - 研究共性：系统通常将生成主干与条件信号、辅助损失结合，以提升动作忠实度、空间一致性、物理合理性或长时一致性。
  - 关键差异：工作分为显式上下文条件循环模型、物理信息视频模型、帧级闭环驾驶栈，以及以基准为先的评测工件。
  - 趋势演进：前沿正从开环视频质量转向闭环、实时、动作忠实的模拟，2024-2026 年基准构建与下游策略训练更受重视。
  - 开放问题：跨域迁移、统一动作/空间度量、长时稳定性和延迟-保真度权衡在当前数据集与单GPU设定之外仍未验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world-model simulation pipelines
      what_it_solves: Turns pretrained video generative models or recurrent world
        models into controllable simulators for driving, robotics, and game-like control
        by conditioning on actions, trajectories, or context.
      what_remains_open: Evidence for transfer across environments and sensor settings
        is thin; current claims rely mainly on nuScenes, CARL, Minecraft, games, and
        robotics tasks used in each paper.
    - line: Benchmark and evaluation frameworks for action and spatial fidelity
      what_it_solves: Provides open datasets, metrics, and protocols that measure
        whether rollouts preserve spatial consistency or follow action instructions
        rather than only comparing visual quality.
      what_remains_open: Metrics remain task-specific, and independent validation
        across other interactive environments, sensor configurations, and downstream
        policy training is missing.
    - line: Physics-informed and geometry-consistent video generation
      what_it_solves: Adds temporal depth, keypoint dynamics, structural and moving-instance
        losses, or multi-view geometric constraints to improve physical plausibility
        and 3D consistency.
      what_remains_open: Physical plausibility is mostly demonstrated by visual comparisons;
        formal guarantees and behavior under unseen contacts, materials, and long
        sequences are not established.
    - line: Real-time closed-loop deployment stacks
      what_it_solves: Packages frame-level autoregressive or diffusion systems to
        meet sub-second, single-GPU latency for interactive or closed-loop autonomous
        simulation.
      what_remains_open: Scalability to multi-GPU or complex multi-agent scenes, and
        the trade-off between latency, fidelity, and control frequency, remain unresolved.
    - line: Open-access artifacts and reproducible engineering
      what_it_solves: Releases datasets, code, baselines, or evaluation frameworks
        to make simulator systems inspectable and comparable.
      what_remains_open: Several top papers in the packet do not show code or dataset
        links, and independent reproduction across teams and infrastructure environments
        is not verified.
    consensus:
    - Works agree that action-conditioned or context-conditioned world models should
      be judged beyond visual quality, using action fidelity, spatial consistency,
      physical plausibility, or downstream control performance.
    - Pretrained video generators and recurrent world models are both treated as reusable
      backbones that can be adapted into controllable simulators.
    - Benchmarks and datasets have become first-class contributions, often paired
      with a baseline model or evaluation protocol.
    - The field is converging on interactive or closed-loop settings as the main deployment
      target, with explicit attention to long-horizon rollouts and real-time requirements.
    disagreements:
    - 'Conditioning representation differs: explicit observable context values in
      recurrent latent dynamics versus action/trajectory instructions in video diffusion
      versus auxiliary depth and keypoint signals.'
    - 'Evaluation target differs: spatial loop consistency, action fidelity for driving,
      physical plausibility for robotic videos, or zero-shot policy generalization
      under changed dynamics.'
    - 'Architectural choice differs: recurrent state-space latent models compete with
      diffusion transformers and frame-level autoregressive video generators.'
    - 'Deployment and interaction settings differ: closed-loop driving simulation,
      open-world navigation, contextual control tasks, and game/robotics domains impose
      different latency and control assumptions.'
    - 'Reproducibility and artifact release differ: some contributions are open access
      with datasets and code, while others report system-level latency results without
      visible artifact links.'
    open_questions:
    - Can action-fidelity and spatial-consistency metrics be unified across navigation,
      driving, robotics, and open-world game settings?
    - How well do these simulators transfer beyond their training distributions, especially
      to unseen sensors, environments, and dynamics parameters?
    - What are the failure modes of long-horizon frame-level autoregressive rollouts
      under self-conditioning, and can they be bounded?
    - What latency-fidelity-controllability trade-offs are acceptable for real-time
      closed-loop deployment beyond single-GPU nuScenes-style setups?
    - Does improved physical plausibility or action faithfulness in generated video
      translate into measurable gains in downstream policy learning and real-world
      deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控世界模型模拟流水线
      解决的问题: 将预训练视频生成模型或循环世界模型转化为面向驾驶、机器人和游戏控制的模拟器，通过动作、轨迹或上下文条件进行控制。
      尚未覆盖: 跨环境和传感器设置的迁移证据不足，结论主要依赖各论文使用的 nuScenes、CARL、Minecraft、游戏和机器人任务。
    - 路线: 动作与空间忠实度基准和评测框架
      解决的问题: 提供公开数据集、指标和协议，衡量生成推演是否保持空间一致性或遵循动作指令，而不仅仅比较视觉质量。
      尚未覆盖: 指标仍针对特定任务；在其他交互环境、传感器配置和下游策略训练上的独立验证缺失。
    - 路线: 物理信息与几何一致视频生成
      解决的问题: 通过时间深度、关键点动力学、结构与运动实例损失或多视角几何约束，提高生成世界状态的物理合理性和 3D 一致性。
      尚未覆盖: 物理合理性多由视觉对比证明；未见正式保证，也未覆盖未知接触、材料和长序列失败模式。
    - 路线: 实时闭环部署栈
      解决的问题: 将帧级自回归或扩散系统封装为满足亚秒级、单GPU延迟的交互式或闭环自动驾驶模拟。
      尚未覆盖: 多GPU或复杂多智能体场景的可扩展性，以及延迟、保真度和控制频率之间的权衡仍未解决。
    - 路线: 开放工件与可复现工程
      解决的问题: 发布数据集、代码、基线或评测框架，使模拟器系统可检查、可比较。
      尚未覆盖: 证据包中若干高排名论文未显示代码或数据集链接；跨团队和基础设施环境的独立复现尚未验证。
    共识:
    - 研究共同认为，动作或上下文条件世界模型不能只凭视觉质量评价，还需考察动作忠实度、空间一致性、物理合理性或下游控制表现。
    - 预训练视频生成器和循环世界模型都被视为可复用的主干，可改造成可控模拟器。
    - 基准和数据集已成为一类主要贡献，通常与基线模型或评测协议一起发布。
    - 领域正趋向以交互式或闭环设置为部署目标，并明确关注长时推演和实时要求。
    分歧:
    - 条件表示不同：循环潜在动力学使用显式上下文值，视频扩散使用动作/轨迹指令，另一些使用深度和关键点等辅助信号。
    - 评测目标不同：空间回路一致性、驾驶动作忠实度、机器人视频物理合理性、或动力学变化下的零样本策略泛化。
    - 架构选择不同：循环状态空间潜模型、扩散Transformer和帧级自回归视频生成器并存。
    - 部署与交互设置不同：闭环驾驶模拟、开放世界导航、上下文控制任务、游戏与机器人领域对延迟和控制有不同的假设。
    - 工件发布和可复现性不同：一些工作开放数据集与代码，另一些报告系统延迟但没有可见工件链接。
    开放问题:
    - 动作忠实度和空间一致性指标能否在导航、驾驶、机器人和开放世界游戏设置中统一？
    - 这些模拟器在训练分布之外，尤其是未知传感器、环境和动力学参数下迁移能力如何？
    - 帧级自回归推演在自条件作用下的长时失败模式是什么，能否被界定或限制？
    - 在超出单GPU、nuScenes 风格设置的真实闭环部署中，可接受的延迟、保真度和可控性权衡是什么？
    - 生成视频中物理合理性或动作忠实度的提升，能否转化为下游策略学习和真实部署的可测量收益？
