  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    and VAEs dominate, with a strong focus on video prediction for robotics and autonomous
    driving.'
  - 'Shared research pattern: Most works learn latent dynamics or video generation
    via self-supervised objectives, then use the model for policy learning, planning,
    or evaluation.'
  - 'Key differences: Some methods emphasize pixel-level fidelity and physical consistency,
    while others prioritize latent state disentanglement, compositional generalization,
    or unified action-video modeling.'
  - 'Trend evolution: From efficient transformer-based architectures (2023) to diffusion-based,
    physics-informed, and compositionally generalizable models (2024–2025), and now
    toward systematic benchmarks for memory and action control (2025–2026).'
  - 'Open questions: How to achieve long-term memory consistency without sacrificing
    efficiency; whether physical knowledge should be explicitly injected or implicitly
    learned; and how to isolate model contributions from planner or controller effects.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer和VAE的生成式世界模型占主导，重点关注机器人和自动驾驶的视频预测。
  - 研究共性：多数工作通过自监督目标学习潜在动力学或视频生成，然后将模型用于策略学习、规划或评估。
  - 关键差异：部分方法强调像素级保真度和物理一致性，其他方法侧重潜在状态解耦、组合泛化或统一动作-视频建模。
  - 趋势演进：从高效Transformer架构（2023）到基于扩散、物理信息和组合泛化的模型（2024–2025），再到面向记忆和动作控制的系统基准（2025–2026）。
  - 开放问题：如何在不牺牲效率的情况下实现长期记忆一致性；物理知识应显式注入还是隐式学习；如何分离模型贡献与规划器或控制器的影响。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures
      what_it_solves: Designing diffusion transformers, VAEs, and unified frameworks
        to generate high-fidelity video predictions and latent state rollouts for
        model-based RL and planning.
      what_remains_open: Whether architectural choices (e.g., mask reconstruction,
        independent diffusion timesteps) transfer across diverse task families beyond
        the reported driving, gaming, or robotic manipulation settings.
    - line: Contextual and compositional generalization
      what_it_solves: Enabling world models to adapt to varying dynamics or unseen
        task compositions by conditioning on context variables or factorizing generation
        via language primitives.
      what_remains_open: Generalization to entirely novel primitives or contexts not
        seen during training, and robustness when context observability is limited
        or noisy.
    - line: Physics and geometry consistency
      what_it_solves: Improving physical plausibility and 3D geometric coherence of
        generated videos through auxiliary tasks like depth prediction, keypoint dynamics,
        or spatial-temporal mask construction.
      what_remains_open: Whether the model truly learns generalizable physical laws
        or merely overfits to visual regularities in the training distribution, and
        how to validate this beyond visual inspection.
    - line: Unified action-video modeling
      what_it_solves: Coupling action and video diffusion in a single transformer
        to jointly represent policy, forward/inverse dynamics, and video generation,
        enabling pretraining on large-scale robot datasets.
      what_remains_open: How much of the policy improvement comes from the unified
        representation versus the scale of pretraining data, and whether the framework
        can handle continuous, high-dimensional action spaces in real-world deployment.
    - line: World model evaluation benchmarks
      what_it_solves: Systematically measuring memory consistency, action controllability,
        and spatial coherence in world models through curated datasets and metrics
        like scene graph consistency or closed-loop navigation.
      what_remains_open: The correlation between benchmark scores and downstream task
        performance, and the coverage of real-world diversity, noise, and long-tail
        scenarios.
    consensus:
    - World models are shifting from pure video prediction to multi-modal, action-conditioned,
      and physics-aware unified frameworks.
    - Generative models, especially diffusion and transformer variants, are the dominant
      architectural backbone.
    - Generalization—zero-shot, compositional, or cross-domain—is a central evaluation
      criterion beyond visual quality.
    - Self-supervised or generative pretraining on large-scale interaction or video
      data is a common strategy for building capable world models.
    disagreements:
    - 'Representation level: Some works operate directly in pixel space for video
      generation, while others learn compact latent states for dynamics modeling.'
    - 'Supervision signal: Methods differ in whether they inject explicit physical
      knowledge (depth, keypoints) or rely purely on data-driven reconstruction losses.'
    - 'Interaction mode: Some models treat actions as conditioning inputs for video
      prediction, while others jointly diffuse actions and frames in a unified space.'
    - 'Evaluation target: Benchmarks emphasize different aspects—visual fidelity,
      policy performance, memory consistency, or spatial coherence—making direct comparison
      difficult.'
    open_questions:
    - How can world models maintain long-horizon memory consistency without prohibitive
      computational cost?
    - What is the most effective way to incorporate physical knowledge—explicit auxiliary
      losses or implicit learning from data—and how do we verify physical understanding?
    - How can we disentangle the contributions of the world model from those of the
      downstream planner, controller, or policy optimization algorithm?
    - Do current benchmarks adequately capture the challenges of real-world deployment,
      such as partial observability, sensor noise, and dynamic scene changes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构
      解决的问题: 设计扩散Transformer、VAE和统一框架，生成高保真视频预测和潜在状态展开，用于基于模型的强化学习和规划。
      尚未覆盖: 架构选择（如掩码重建、独立扩散时间步）是否能迁移到驾驶、游戏或机器人操作之外的多样化任务族。
    - 路线: 上下文与组合泛化
      解决的问题: 通过条件化上下文变量或利用语言原语分解生成，使世界模型适应变化的动力学或未见任务组合。
      尚未覆盖: 对训练中完全未见的原语或上下文的泛化，以及上下文可观测性受限或存在噪声时的鲁棒性。
    - 路线: 物理与几何一致性
      解决的问题: 通过深度预测、关键点动力学或时空掩码构建等辅助任务，提升生成视频的物理合理性和三维几何连贯性。
      尚未覆盖: 模型是否真正学到了可泛化的物理规律，还是仅过拟合于训练分布的视觉规律，以及如何超越视觉检查进行验证。
    - 路线: 统一动作-视频建模
      解决的问题: 在单个Transformer中耦合动作和视频扩散，联合表示策略、前向/逆向动力学和视频生成，支持大规模机器人数据预训练。
      尚未覆盖: 策略提升有多少来自统一表示而非预训练数据规模，以及该框架能否处理真实部署中的连续高维动作空间。
    - 路线: 世界模型评估基准
      解决的问题: 通过精心设计的数据集和场景图一致性分数或闭环导航等指标，系统衡量世界模型的记忆一致性、动作可控性和空间连贯性。
      尚未覆盖: 基准分数与下游任务性能的相关性，以及对真实世界多样性、噪声和长尾场景的覆盖程度。
    共识:
    - 世界模型正从单纯视频预测转向多模态、动作条件化和物理感知的统一框架。
    - 生成式模型，尤其是扩散和Transformer变体，是主导的架构基础。
    - 泛化能力——零样本、组合或跨域——已成为超越视觉质量的核心评估标准。
    - 在大规模交互或视频数据上进行自监督或生成式预训练是构建强大世界模型的通用策略。
    分歧:
    - 表示层面：部分工作直接在像素空间进行视频生成，其他工作则学习紧凑的潜在状态用于动力学建模。
    - 监督信号：方法在注入显式物理知识（深度、关键点）还是纯粹依赖数据驱动的重建损失上存在差异。
    - 交互模式：一些模型将动作作为视频预测的条件输入，另一些则在统一空间中联合扩散动作和帧。
    - 评估目标：基准强调不同方面——视觉保真度、策略性能、记忆一致性或空间连贯性——导致直接比较困难。
    开放问题:
    - 世界模型如何在不过度增加计算成本的情况下保持长时域记忆一致性？
    - 融入物理知识的最有效方式是什么——显式辅助损失还是从数据中隐式学习——以及如何验证物理理解？
    - 如何解耦世界模型的贡献与下游规划器、控制器或策略优化算法的贡献？
    - 当前基准是否充分捕捉了真实部署的挑战，如部分可观测性、传感器噪声和动态场景变化？
