  related_work_outline:
  - 'Mainstream direction: Building generative video world models with diffusion transformers
    and auxiliary objectives for driving, robotics, and embodied settings, while strengthening
    spatial-temporal consistency and action controllability.'
  - 'Shared research pattern: Most work learns to predict future video frames or states
    from observations, actions, or context, using auxiliary signals such as masks,
    physics, language primitives, or coupled action diffusion.'
  - 'Key differences: Methods diverge in representation and training objectives—masked
    reconstruction, stochastic recurrent state spaces, physics-informed losses, compositional
    language primitives, or unified action-video diffusion—and in evaluation from
    task-specific suites to general consistency protocols.'
  - 'Trend evolution: Evidence is concentrated in 2023–2026, moving from efficient
    stochastic model-based RL toward large-scale video diffusion and embodied or driving
    world models, with newer evaluation protocols targeting memory consistency and
    action control.'
  - 'Open questions: Whether gains reflect the model rather than surrounding system
    choices, how well findings transfer beyond curated benchmarks, and how to improve
    long-horizon memory and cross-action-space control remain unresolved.'
  related_work_outline_zh:
  - 主流方向：围绕扩散Transformer与生成式视频预测构建世界模型，广泛用于驾驶、机器人和具身场景，并强化时空一致性与动作可控性。
  - 研究共性：多数工作以未来视频帧或状态预测为核心，利用掩码、物理、语言原语或动作-视频扩散等辅助信号训练，并以视觉保真度、物理合理性、下游策略或泛化能力作为评测依据。
  - 关键差异：表示与训练目标不同，如掩码重建、随机状态空间、物理信息损失、组合语言原语或动作-视频统一扩散；评测也从任务套件扩展到通用一致性与控制协议。
  - 趋势演进：证据集中在2023–2026年，从高效随机模型式强化学习扩展到大规模视频扩散与具身/驾驶世界模型，新的评测协议更关注记忆一致性和动作控制。
  - 开放问题：方法收益是否来自模型本身而非系统选择、跨任务迁移是否可靠、长期记忆与跨动作空间一致性如何提升，仍未充分解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative next-frame and multi-view video world models with diffusion
        transformers and auxiliary reconstruction objectives
      what_it_solves: Turns world-model ideas into long-horizon, multi-view, or physically
        informed video prediction for driving and robotic scenes; e.g., MaskGWM uses
        mask reconstruction, RoboScape uses depth and keypoint signals.
      what_remains_open: Generalization beyond seen combinations or scene types, and
        method-specific failure modes are often not stated.
    - line: Stochastic and contextual recurrent dynamics models for model-based reinforcement
        learning
      what_it_solves: Learns compact latent dynamics for imagined rollouts and zero-shot
        context shifts under limited interaction; e.g., STORM and cRSSM.
      what_remains_open: Assumes observable context or narrow task coverage, making
        it unclear whether gains come from the learned dynamics or the surrounding
        policy or controller.
    - line: Unified action-video diffusion models for planning and control interfaces
      what_it_solves: Couples action and video generation so policy, forward dynamics,
        inverse dynamics, and video prediction can share one representation; e.g.,
        UWM.
      what_remains_open: Real-robot closed-loop control evidence is absent, and the
        benefit of independent modality timesteps versus simpler interfaces remains
        unresolved.
    - line: Consistency and action-control evaluation protocols for world models
      what_it_solves: Measures whether generated rollouts preserve spatial or memory
        consistency and respond correctly to actions across viewpoints and action
        spaces; e.g., LoopNav and MIND.
      what_remains_open: Some evaluation papers report no experimental conclusions,
        and the robustness of metrics or their link to downstream task performance
        is not yet established.
    consensus:
    - Recent work converges on learning generative future-frame or future-state predictors
      from interaction or video data rather than using analytic simulators.
    - Diffusion transformers, variational sequence models, or recurrent state-space
      representations are used to manage stochasticity, long-horizon stability, and
      sample efficiency.
    - World-model quality is increasingly assessed through downstream policy learning,
      generalization, physical plausibility, or consistency rather than pixel reconstruction
      alone.
    - Physics, geometry, or spatial consistency is used as either an inductive bias
      or an evaluation criterion, such as depth, keypoint, scene graph, or closed-loop
      consistency.
    disagreements:
    - 'Representation choices differ: pixel or latent diffusion, stochastic recurrent
      state space, compositional language primitives, or unified action-video tokens.'
    - 'Training objectives differ: masked reconstruction, variational sequence modeling,
      physics-informed auxiliary losses, or coupled action-video diffusion.'
    - 'Interaction and deployment modes differ: open-loop video prediction, action-conditioned
      closed-loop rollout, or joint policy and dynamics modeling.'
    - 'Evaluation settings differ: task-specific suites such as Atari 100k, CARL,
      RT-X, and nuScenes/Waymo versus general consistency and action-control evaluation
      protocols.'
    open_questions:
    - Can representation and objective choices shown on driving or robotic video prediction
      transfer to unrelated embodied settings or planning tasks?
    - Does the available evidence isolate the proposed method from dataset, baseline,
      planner, or implementation effects?
    - How should long-horizon memory consistency and cross-action-space control be
      measured and improved beyond the current curated videos?
    - What mixture of action-free video pretraining and action-conditioned closed-loop
      training most reliably improves real-world control policies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散Transformer与辅助重建目标的生成式视频世界模型
      解决的问题: 把世界模型落实为驾驶和机器人场景中的长时域、多视角或物理合理视频预测；例如MaskGWM使用掩码重建，RoboScape使用深度与关键点信号。
      尚未覆盖: 对未见场景或组合的泛化证据有限，部分方法未报告失败模式或局限性。
    - 路线: 基于随机/上下文循环动力学的模型式强化学习世界模型
      解决的问题: 在有限交互或上下文变化下学习紧凑潜在动力学，用于想象轨迹和零样本策略训练；例如STORM、cRSSM。
      尚未覆盖: 假设上下文可观测或任务覆盖较窄，难以确认收益来自动力学模型还是策略或规划器。
    - 路线: 动作-视频扩散统一的规划与控制接口
      解决的问题: 将策略、前向动力学、逆动力学和视频生成耦合到同一表示中，用于大规模预训练；例如UWM。
      尚未覆盖: 缺少真实机器人闭环控制证据，独立模态时间步设计相对更简单接口的增益仍未确定。
    - 路线: 世界模型一致性与动作控制评估协议
      解决的问题: 度量生成轨迹是否保持空间或记忆一致性，并能否在不同视角和动作空间下正确响应动作；例如LoopNav和MIND。
      尚未覆盖: 部分评估工作未报告实验结论，指标稳健性及其与下游任务性能的关系尚未建立。
    共识:
    - 研究普遍从分析式模拟器转向从交互或视频数据学习生成式未来帧或未来状态预测器。
    - 使用扩散Transformer、变分序列模型或循环状态空间表示来平衡随机性、长时程稳定性和样本效率。
    - 世界模型质量越来越多地通过下游策略、泛化能力、物理合理性或一致性来评估，而非仅看像素重建。
    - 物理、几何或空间一致性被用作归纳偏置或评测标准，例如深度、关键点、场景图或闭环一致性。
    分歧:
    - 表示选择不同：像素或潜在扩散、随机循环状态空间、组合语言原语或统一动作-视频表示。
    - 训练目标不同：掩码重建、变分序列建模、物理信息辅助损失或动作-视频耦合扩散。
    - 交互与部署模式不同：开环视频预测、动作条件闭环生成、策略与动力学联合建模。
    - 评测设置不同：Atari 100k、CARL、RT-X、nuScenes/Waymo等任务套件与通用一致性和动作控制评估协议。
    开放问题:
    - 在驾驶或机器人视频预测上有效的表示与目标，能否迁移到无关的具身设置或规划任务？
    - 当前证据是否隔离了所提方法，而不是数据集、基线、规划器或实现选择的影响？
    - 如何在现有精选视频之外可靠度量和改进长时程记忆一致性与跨动作空间控制？
    - 无动作视频预训练与动作条件闭环训练应如何组合，才能最稳定地提升真实控制策略？
