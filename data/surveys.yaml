  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for robotics and driving are
    dominant, using action-conditioned video generation for planning, policy training,
    and simulation evaluation.'
  - 'Shared research pattern: Work couples video generation with actions, language,
    context, or physics; common architectures include diffusion transformers and transformer
    or state-space models, with auxiliary tasks for consistency.'
  - 'Key differences: Representations range from language-primitive factorization
    and unified video-action diffusion to physics-informed auxiliary tasks; evaluation
    targets include zero-shot dynamics, long-horizon driving, spatial consistency,
    and memory/action control.'
  - 'Trend evolution: Research moved from model-based RL on Atari toward embodied
    robots, autonomous driving, and specialized consistency benchmarks between 2023
    and 2026, emphasizing multimodal pretraining and closed-loop evaluation.'
  - 'Open questions: Cross-domain and cross-embodiment transfer, alignment of simulation
    gains with real outcomes, long-term memory consistency, context-observability
    assumptions, and reproducibility gaps remain unresolved.'
  related_work_outline_zh:
  - 主流方向：领域化世界模型集中在机器人和自动驾驶，以动作条件的视频生成支持规划、策略训练和仿真评测。
  - 研究共性：将视频生成与动作、语言、上下文或物理信号耦合，常用扩散Transformer或Transformer+VAE，并增加掩码重建、深度、关键点等辅助任务。
  - 关键差异：表示方式包括语言原语分解、统一视频-动作扩散和物理信息辅助任务；评测目标覆盖零样本动力学、长时域驾驶、空间一致性以及记忆与动作控制。
  - 趋势演进：从Atari模型RL效率优化，演进到机器人想象、驾驶世界模型，以及2025-2026年的空间一致性、记忆一致性与动作控制基准。
  - 开放问题：跨场景、本体和动作空间泛化，仿真与真实结果对齐，长时记忆一致性，上下文可观测假设，以及可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to embodied domains by grounding video
        generation in language goals, context variables, or physics constraints for
        robot imagination and policy learning.
      what_remains_open: Generalization beyond seen language primitives and simulation-only
        evaluation; real-robot execution and transfer across embodiments remain largely
        unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Multi-view and long-horizon driving video prediction for scene
        modeling and closed-loop simulation across driving datasets.
      what_remains_open: Whether benchmark improvements on driving datasets translate
        to real-world safety or operational outcomes and cross-dataset robustness.
    - line: Interactive agents and games
      what_it_solves: Efficient stochastic world models for model-based reinforcement
        learning in visual interactive environments, including Atari and Minecraft
        navigation.
      what_remains_open: Generalization when environment rules, goals, user interactions,
        or action spaces change; long-term memory and spatial consistency under closed-loop
        revisiting are unresolved.
    - line: World-model evaluation and consistency benchmarks
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control with loop-based navigation and scene-graph or closed-loop revisited
        protocols.
      what_remains_open: Connecting benchmark metrics to downstream policy success
        or physical deployment, and standardized real-world evaluation across domains.
    consensus:
    - World models are being specialized for domain applications by coupling video
      generation with actions, language goals, context variables, or physics constraints.
    - Transformer-based and diffusion-based architectures dominate recent work, often
      with auxiliary reconstruction, depth, or keypoint tasks to improve temporal
      and geometric consistency.
    - Large-scale domain datasets and model-generated imagination are repeatedly used
      to train policies or improve zero-shot generalization.
    - Evaluation is moving beyond pixel-level video quality toward closed-loop capabilities
      such as spatial consistency, memory consistency, action control, and zero-shot
      dynamics.
    disagreements:
    - 'Representation choices differ: language instructions may be factorized into
      primitives, video and actions may be modeled as a unified diffusion process,
      or physics may be injected through auxiliary depth and keypoint tasks.'
    - 'Supervision and evaluation targets differ: some emphasize zero-shot dynamics
      generalization under changing context, others long-horizon driving prediction,
      spatial consistency, or memory and action control.'
    - 'Interaction assumptions differ: some methods require observable context values,
      while others learn from action-free video, language goals, or shared action
      spaces.'
    - 'Deployment settings differ: evaluation ranges from controlled simulation and
      game benchmarks to large real driving or robot datasets, but real-world closed-loop
      validation is often missing.'
    open_questions:
    - Can driving simulation gains on Nuscenes, OpenDV-2K, and Waymo be causally linked
      to safer or more operationally reliable driving?
    - Can robot world models move beyond combinations of previously seen primitives
      and simulation-only success to real-robot execution and novel-task generalization?
    - Do spatial consistency, memory consistency, and action-control benchmark scores
      predict downstream policy success or physical deployment reliability?
    - Will context-conditioned world models remain effective when relevant context
      variables are unobservable or when evaluated beyond two CARL tasks?
    - To what extent do missing code, dataset, baseline, and limitation details in
      some papers limit independent verification and cross-system comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 把世界模型适配到机器人等具体任务，通过语言目标、上下文变量或物理约束生成想象视频并辅助策略学习。
      尚未覆盖: 对未见语言原语和仿真外真实执行的泛化，以及跨本体、机构和数据集的迁移证据仍不足。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 面向驾驶场景的多视角、长时域视频预测和闭环仿真，用于场景建模与策略评估。
      尚未覆盖: 基准分数提升与真实安全或运营结果之间的关系，以及跨数据集和跨地域鲁棒性尚未验证。
    - 路线: 交互式智能体与游戏
      解决的问题: 在Atari和Minecraft等需要持续行动的视觉环境中训练高效随机世界模型，支持基于模型的强化学习。
      尚未覆盖: 环境规则、目标、用户交互或动作空间变化时的泛化，以及闭环重访下的长期记忆和空间一致性。
    - 路线: 世界模型评测与一致性基准
      解决的问题: 用循环导航、场景图一致性、记忆一致性和动作控制等协议衡量世界模型的时空稳定性。
      尚未覆盖: 评测指标与下游策略成功或真实部署之间的关联，以及跨领域标准化真实评测。
    共识:
    - 研究正从通用生成模型转向以动作、语言、上下文或物理为条件的领域世界模型。
    - 扩散Transformer和Transformer+VAE是常见骨架，并常借助掩码重建、深度预测或关键点动力学等辅助任务增强一致性。
    - 大规模领域数据和模型生成的想象轨迹被广泛用于策略训练、预训练或零样本泛化提升。
    - 评测重心从单帧视频质量转向零样本动力学、空间一致性、记忆一致性与动作控制等闭环能力。
    分歧:
    - 表示选择不同：有的把语言分解为可组合原语，有的统一扩散建模视频与动作，有的通过深度和关键点任务注入物理先验。
    - 监督与评测目标不同：分别强调上下文变化下的零样本动力学、长时域驾驶预测、空间一致性或记忆与动作控制。
    - 交互假设不同：有的依赖可观测上下文，有的从无动作视频中学习，有的需要语言目标或共享动作空间。
    - 部署场景不同：从受控仿真和游戏基准到大规模真实驾驶/机器人数据均存在，但真实闭环验证常缺失。
    开放问题:
    - 在Nuscenes、OpenDV-2K和Waymo等数据集上的驾驶仿真提升能否转化为真实驾驶安全或运营可靠性？
    - 机器人世界模型能否超越已见原语组合和仿真成功，实现真实机器人执行与全新任务泛化？
    - 空间一致性、记忆一致性和动作控制等基准分数能否预测下游策略成功或物理部署可靠性？
    - 当上下文变量不可观测，或仅在CARL的两个任务之外测试时，上下文条件世界模型能否保持零样本泛化？
    - 部分工作缺少代码、数据集、基线和局限性，这会造成多大的复现和跨系统比较验证缺口？
