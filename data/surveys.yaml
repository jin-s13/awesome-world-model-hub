  - 'Mainstream direction: Survey and method papers converge on world models as a
    common substrate for future prediction, simulation, planning, and control across
    video generation, robotics, and autonomous driving; the dominant sub-direction
    pushes generative video world models toward long-horizon, controllable, persistent
    simulation.'
  - 'Shared research pattern: Researchers define a state representation, compositional,
    latent, global 3D, or per-agent, and use it to condition future frames, actions,
    or traffic behavior; evaluation focuses on task-specific generation quality, control,
    or planning success.'
  - 'Key differences: Papers differ in state representation, supervision and evaluation
    target, interaction or deployment setting, and contribution type. Survey or taxonomy
    work is mostly conceptual, while method, system, and benchmark work provides simulation,
    real-robot, or benchmark evidence.'
  - 'Trend evolution: The evidence moves from physical robot world-model reinforcement
    learning in 2022, through general world-model survey and Sora simulation questions
    in 2024, to 2025-2026 work on out-of-sight persistence, open-source real-time
    simulation, and domain-specific evaluation frameworks.'
  - 'Open questions: Standardized benchmarks and metrics across robot, driving, and
    video settings; empirical validation of taxonomies; generalization boundaries
    for compositional, persistent, and physical world models; reproducibility gaps
    due to uneven code, dataset, and limitation reporting.'
  related_work_outline_zh:
  - 主流方向：世界模型作为统一框架，试图连接生成视频、机器人学习、自动驾驶仿真与智能体交互；综述和分类工作梳理设计空间，方法工作强调可控制、长时间一致的视频世界模型。
  - 研究共性：通常围绕组合、潜在、全局三维或个体化状态构建，用于未来预测、仿真、规划或控制，并关注长期时间一致性、可控性和泛化边界。
  - 关键差异：表征选择不同，如组合原语、连续或离散潜在状态、静态三维背景加动态实体、个体潜在个性；监督与评测目标不同；贡献类型与部署设置也不同。
  - 趋势演进：从 2022 年物理机器人世界模型在线学习，到 2024 年围绕 Sora 的通用世界模型综述和生成视频模型，再到 2025-2026 年视线外状态、实时开源模拟与自动驾驶潜在空间分类和评估框架，前沿更强调持久状态、开源可复现和专用评测。
  - 开放问题：如何统一跨机器人、驾驶和视频的评测基准并验证分类法；组合泛化、视线外状态演化与物理平台边界仍未充分测试；开源代码、数据与限制报告不完整，形成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Survey and taxonomy synthesis for world models
      what_it_solves: Integrates fragmented work on generative video, autonomous driving,
        and embodied agents into conceptual frameworks, design dimensions, and roadmaps.
      what_remains_open: Coverage is often conceptual or selective; systematic empirical
        backing and detailed limitation analysis are not consistently provided.
    - line: Comparative evaluation synthesis across world-model settings
      what_it_solves: Identifies task-specific evaluation targets such as real-robot
        rewards, simulation success, future-frame control, closed-loop driving metrics,
        and benchmark performance.
      what_remains_open: Cross-paper comparability is limited by differing platforms,
        metrics, and uneven code, dataset, or artifact reporting.
    - line: Domain-specific latent-space taxonomy and evaluation frameworks
      what_it_solves: Organizes design choices such as latent representation form
        and structural priors for automated-driving world models and proposes closed-loop
        evaluation criteria.
      what_remains_open: The framework remains theoretical; no empirical implementation,
        baseline comparison, or validation is reported.
    - line: World-model-driven robot learning and compositional control
      what_it_solves: Uses learned world models for physical robot online learning
        or language-conditioned video planning, reducing simulator reliance and supporting
        unseen task combinations.
      what_remains_open: Generalization is bounded by seen primitives, limited robot
        platforms, and simulation-only evidence; transfer to new hardware or unseen
        primitives is unproven.
    - line: Generative video world models with persistent, controllable state
      what_it_solves: Extends video generation to long-horizon consistency, out-of-sight
        entity evolution, controllable future frames, and real-time interactive open-source
        simulation.
      what_remains_open: Some papers leave limitations unreported; code, data, and
        benchmark availability varies, leaving reproducibility and failure modes unverified.
    - line: Data-driven multi-agent traffic simulation as world models
      what_it_solves: Treats traffic simulation as a world model to support configurable
        multi-agent behaviors and motion prediction.
      what_remains_open: Evaluation is concentrated on one motion dataset; explicit
        limitations and broader deployment boundaries are absent from the evidence.
    consensus:
    - World models are framed as a shared substrate for future prediction, simulation,
      planning, and control across video, robotics, and driving.
    - Survey and taxonomy contributions emphasize organizing design axes such as latent
      representation form, structural priors, temporal consistency, and evaluation
      criteria.
    - Empirical contributions stress controllability and long-horizon consistency
      through conditional generation, physical online learning, or multi-agent simulation.
    - Evaluation evidence is mostly task-specific and benchmark-specific; code, dataset,
      and limitation reporting is uneven and should be treated as verification gaps.
    - No single representation or evaluation setup dominates; papers differ in state
      persistence, supervision, and deployment context.
    disagreements:
    - 'Supervision target: sparse rewards from real robot interactions, language-conditioned
      video planning, future-frame control signals, or driving motion prediction.'
    - 'Representation choice: compositional language primitives, continuous or discrete
      latent states, static 3D background plus dynamic entities, or per-agent latent
      personality and destination.'
    - 'Evaluation setting: real physical robots, simulation-only visual planning,
      ego-vision future prediction, open motion datasets, and benchmark-based out-of-sight
      simulation.'
    - 'Contribution type: conceptual survey or taxonomy work without experiments versus
      empirical method, system, and benchmark evaluations.'
    - 'Deployment and interaction mode: online real-world learning without resets,
      real-time interactive generation, offline data-driven simulation, and generative
      video planning.'
    open_questions:
    - What standardized metrics and shared benchmarks would make world-model surveys
      and methods comparable across robot, driving, and video settings?
    - How can conceptual taxonomies be converted into testable evaluation protocols
      with reported baselines and failure modes?
    - What are the concrete generalization boundaries for compositional primitives,
      out-of-sight state persistence, and physical robot learning beyond current platforms?
    - How should open-source code, datasets, and benchmark access be reported to close
      reproducibility gaps and reveal limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型综述与分类体系综合
      解决的问题: 将生成视频、自动驾驶和具身智能体等碎片化工作整合为概念框架、设计维度和研究路线。
      尚未覆盖: 综合多为概念性或选择性举例，局限细节与系统实证支撑不一致。
    - 路线: 跨设置对比评测综合
      解决的问题: 梳理真实机器人奖励、仿真成功、未来帧控制、闭环驾驶指标和基准性能等评测目标，进行跨论文比较。
      尚未覆盖: 各平台、指标和可复现信号缺少标准化，结果兼容性仍不确定。
    - 路线: 领域特定的潜在空间分类与评估框架
      解决的问题: 为自动驾驶世界模型组织潜在表示形式、结构先验和闭环评测标准。
      尚未覆盖: 框架仍为理论性，未报告实证实现、基线对比或验证。
    - 路线: 世界模型驱动的机器人学习与组合控制
      解决的问题: 用已学习世界模型进行物理机器人在线学习或语言条件视频规划，减少对模拟器的依赖并处理未见任务组合。
      尚未覆盖: 泛化受限于已见原语、有限机器人平台和仿真证据，迁移到新硬件或新原语尚未证明。
    - 路线: 具备持久、可控状态的生成式视频世界模型
      解决的问题: 把视频生成扩展到长时程一致性、视线外实体演化、可控未来帧和实时交互式开源模拟。
      尚未覆盖: 部分论文未报告局限；代码、数据和基准可用性不一，可复现性和失效模式尚未充分验证。
    - 路线: 数据驱动的多智能体交通仿真世界模型
      解决的问题: 把交通仿真视为世界模型，以支持可配置多智能体行为和运动预测。
      尚未覆盖: 评测集中在一个运动数据集，显式局限和更广泛的部署边界在证据中缺失。
    共识:
    - 世界模型被共同视为未来预测、仿真、规划和控制的基础，覆盖视频、机器人和驾驶等场景。
    - 综述与分类工作倾向于围绕潜在表示形式、结构先验、时间一致性和评测标准组织设计空间。
    - 实证工作强调通过条件生成、物理在线学习或多智能体仿真实现可控性和长时程一致性。
    - 评测证据大多是任务特定和基准特定的；代码、数据集和局限报告不均衡，应视为验证缺口。
    - 尚无单一表征或评测设置占据主导，研究方法在状态持久性、监督方式和部署环境上存在差异。
    分歧:
    - 监督目标不同：真实机器人的稀疏奖励、语言条件视频规划、未来帧控制信号、驾驶运动预测。
    - 表征方式不同：组合语言原语、连续或离散潜在状态、静态三维背景加动态实体、个体潜在个性和目的地。
    - 评测设置不同：真实物理机器人、仿真视觉规划、以自我为中心的未来预测、开放运动数据集和基于基准的视线外模拟。
    - 贡献类型不同：概念综述或分类工作缺少实验，而方法、系统和基准工作提供实证评估。
    - 部署与交互模式不同：无重置的真实在线学习、实时交互生成、离线数据驱动仿真和生成式视频规划。
    开放问题:
    - 需要哪些标准化指标和共享基准，才能让世界模型综述与方法在机器人、驾驶和视频设定下可比？
    - 如何把概念性分类体系转化为可测试的评测协议，并报告基线和失效模式？
    - 对组合原语、视线外状态持久性以及物理机器人学习而言，当前平台之外的具体泛化边界是什么？
    - 如何通过开源代码、数据集和基准的规范报告来缩小可复现性缺口并暴露限制？
