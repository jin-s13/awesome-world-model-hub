  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks and metrics to evaluate
    grounded capabilities of world models, moving beyond aggregate task scores to
    probe spatial consistency, memory, and action controllability.'
  - 'Shared research pattern: All works construct or utilize evaluation protocols
    where world models generate future frames or states under action conditioning,
    and measure fidelity, consistency, or downstream task performance.'
  - 'Key differences: Benchmarks diverge in the capability they isolate (spatial loop
    consistency vs. long-term memory vs. visual detail vs. physical plausibility),
    the domain (autonomous driving, Minecraft, Atari, robotics), and whether evaluation
    is open-loop or closed-loop.'
  - 'Trend evolution: Evaluation has shifted from fixed environment benchmarks (Atari
    100k) to open-domain, multi-view, and interaction-rich scenarios, with a recent
    emphasis on diagnostic metrics that decompose model behavior rather than relying
    on a single score.'
  - 'Open questions: It remains unclear whether proxy metrics like spatial consistency
    or generation fidelity align with downstream decision quality, and how to design
    benchmarks that cover the long-tail of real-world dynamics without overfitting
    to a specific simulator.'
  related_work_outline_zh:
  - 主流方向：设计专门基准和指标来评估世界模型的基础能力，从总分转向探查空间一致性、记忆和动作可控性。
  - 研究共性：所有工作都构建或使用评估协议，让世界模型在动作条件下生成未来帧或状态，并衡量保真度、一致性或下游任务表现。
  - 关键差异：基准在隔离的能力（空间循环一致性、长期记忆、视觉细节、物理合理性）、领域（自动驾驶、Minecraft、Atari、机器人）以及评估是开环还是闭环上存在分歧。
  - 趋势演进：评估从固定环境基准（Atari 100k）转向开放域、多视图和交互丰富的场景，近期强调诊断性指标来分解模型行为，而非依赖单一分数。
  - 开放问题：代理指标（如空间一致性或生成保真度）是否与下游决策质量对齐，以及如何设计基准以覆盖真实世界动态的长尾分布而不对特定模拟器过拟合，仍不清楚。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared, reproducible evaluation setups for world models,
        moving beyond isolated environment runs to controlled tests of core capabilities
        such as spatial consistency, memory, and action following.
      what_remains_open: Existing datasets like LoopNav and MIND cover only a few
        domains and action spaces; it is unknown whether conclusions transfer to unseen
        physical environments or broader task distributions.
    - line: Metric and stress-test design
      what_it_solves: Introduces diagnostic metrics (e.g., Scene Graph Consistency
        Score, memory consistency, action control scores) that isolate specific failure
        modes of world models instead of relying on a single task reward.
      what_remains_open: The alignment between these diagnostic metrics and the actual
        utility of world models for downstream planning or control remains unverified;
        sensitivity to metric implementation choices is not yet characterized.
    - line: Comparable baselines and reporting
      what_it_solves: Establishes common reference points by reusing benchmarks like
        Atari 100k, Nuscenes, and CARL, enabling relative comparison of world model
        architectures such as DIAMOND, STORM, and cRSSM.
      what_remains_open: Benchmark rankings can change with compute budget, hyperparameter
        tuning, or data preprocessing; no standard reporting protocol exists to make
        these comparisons auditable across different implementations.
    consensus:
    - World models should be evaluated on their ability to generate consistent future
      states under action conditioning, not solely on perceptual quality.
    - Diagnostic benchmarks that decompose performance into multiple capabilities
      (spatial, temporal, memory) are more informative than aggregate scores.
    - Open-source datasets and evaluation code are critical for reproducibility and
      fair comparison.
    disagreements:
    - Some works evaluate in open-loop settings by comparing generated sequences against
      ground-truth, while others advocate closed-loop interactive evaluation where
      the model's own outputs condition future steps.
    - 'The choice of evaluation domain varies: driving benchmarks emphasize multi-view
      geometry and long horizons, game benchmarks emphasize fast visual dynamics and
      score optimization, and robotic benchmarks emphasize physical interaction and
      action space diversity.'
    - 'Metrics differ in their level of abstraction: pixel-level reconstruction error,
      scene-graph consistency, policy success rate, and human-normalized game scores
      capture different aspects, and no single metric is accepted as primary.'
    open_questions:
    - How can we design benchmarks that test world models' ability to generalize across
      diverse action spaces and embodiment without requiring exhaustive real-world
      collection?
    - What is the minimal set of diagnostic metrics that reliably predicts downstream
      task performance across different application domains?
    - To what extent do current benchmark results reflect the true capabilities of
      world models, versus overfitting to dataset-specific artifacts or simulation
      shortcuts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 为世界模型提供可复现的共享评估设置，超越孤立环境运行，对空间一致性、记忆和动作跟随等核心能力进行受控测试。
      尚未覆盖: 现有数据集如LoopNav和MIND仅覆盖少数领域和动作空间，结论是否能迁移到未见的物理环境或更广泛的任务分布尚不可知。
    - 路线: 指标与压力测试设计
      解决的问题: 引入诊断性指标（如场景图一致性分数、记忆一致性、动作控制分数），用于隔离世界模型的特定失效模式，而非依赖单一任务奖励。
      尚未覆盖: 这些诊断指标与世界模型在下游规划或控制中的实际效用之间的对齐尚未验证；指标对实现细节的敏感性尚未被刻画。
    - 路线: 可比基线与报告规范
      解决的问题: 通过复用Atari 100k、Nuscenes和CARL等基准建立共同参考点，使得DIAMOND、STORM和cRSSM等世界模型架构能够相对比较。
      尚未覆盖: 基准排名可能随算力预算、超参数调优或数据预处理而变化；尚无标准报告协议使这些比较在不同实现间可审计。
    共识:
    - 世界模型应基于其在动作条件下生成一致未来状态的能力来评估，而不仅仅是感知质量。
    - 将性能分解为多种能力（空间、时间、记忆）的诊断性基准比总分更具信息量。
    - 开源数据集和评估代码对于可复现性和公平比较至关重要。
    分歧:
    - 部分工作在开环设置下评估，将生成序列与真实值对比，而其他工作倡导闭环交互评估，模型自身的输出会条件化未来步骤。
    - 评估领域的选择不同：驾驶基准强调多视图几何和长时域，游戏基准强调快速视觉动态和得分优化，机器人基准强调物理交互和动作空间多样性。
    - 指标在抽象层次上存在差异：像素级重建误差、场景图一致性、策略成功率以及人类归一化游戏得分捕捉了不同方面，尚无单一指标被接受为主要标准。
    开放问题:
    - 如何设计基准，以测试世界模型在不同动作空间和具身形态上的泛化能力，而不需要进行耗时的真实世界采集？
    - 能够可靠预测不同应用领域下游任务性能的最少诊断性指标集合是什么？
    - 当前基准结果在多大程度上反映了世界模型的真实能力，而非对数据集特有伪影或模拟捷径的过拟合？
