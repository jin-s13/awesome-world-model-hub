  related_work_outline:
  - 'Mainstream direction: Generative video world models built on diffusion transformers
    or stochastic sequence models dominate recent method work, often adding auxiliary
    objectives for geometry, memory, or control.'
  - 'Shared research pattern: Works combine learned prediction with structural priors—mask
    reconstruction, depth/keypoint tasks, context conditioning, or action-video diffusion—then
    assess generation quality, policy learning, or consistency.'
  - 'Key differences: Representation choices range from latent recurrent state-space
    models to unified diffusion transformers; action interfaces vary from passive
    video prediction to coupled action generation; evaluation targets span Atari,
    driving, robotic manipulation, and Minecraft.'
  - 'Trend evolution: The evidence moves from sample-efficient model-based RL in 2023
    toward contextual and compositional world models in 2024, then open-domain driving
    and embodied benchmarks in 2025–2026 emphasizing memory consistency and action
    control.'
  - 'Open questions: Which objectives transfer across domains, how much gain comes
    from the model versus the planner, and how to standardize evidence for physical
    plausibility, spatial consistency, and generalization remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer或随机序列模型的生成式视频世界模型是近期方法主线，并常加入几何、记忆或控制相关的辅助目标。
  - 研究共性：多数工作将学习式预测与结构先验结合，如掩码重建、深度/关键点任务、上下文条件或动作-视频扩散，再评估生成质量、策略学习或一致性。
  - 关键差异：表示选择从潜在循环状态空间模型到统一扩散Transformer不等；动作接口从被动视频预测到耦合动作生成；评测目标覆盖Atari、驾驶、机器人操作和Minecraft。
  - 趋势演进：证据从2023年样本高效模型强化学习，发展到2024年上下文与组合世界模型，再到2025–2026年强调记忆一致性和动作控制的开放域驾驶与具身基准。
  - 开放问题：哪些目标可跨域迁移、收益多大来自模型而非规划器，以及如何标准化物理合理性、空间一致性和泛化性证据仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-transformer and stochastic-sequence world-model architectures
      what_it_solves: Converts high-dimensional visual observation sequences into
        predictive world models for video generation and model-based reinforcement
        learning.
      what_remains_open: Which architectural choices and auxiliary objectives transfer
        beyond the reported visual domains and benchmarks, and whether long-horizon
        or multi-view consistency is guaranteed.
    - line: Context-conditioned and compositional dynamics for model-based control
      what_it_solves: Improves zero-shot or compositional generalization by conditioning
        latent dynamics on task context or decomposing language goals into reusable
        primitives.
      what_remains_open: Observability of context, support for entirely novel primitives,
        and separation of gains from the dynamics model versus the policy or planner
        remain unclear.
    - line: Unified action-video interfaces for embodied pretraining
      what_it_solves: Couples action and video diffusion so a single model can represent
        policy, forward dynamics, inverse dynamics, or a video generator for robot
        learning.
      what_remains_open: Evidence is mostly limited to simulation or dataset-level
        policies; real-world deployment and failure modes under new action spaces
        are not established.
    - line: Consistency-oriented evaluation protocols for world models
      what_it_solves: Introduces datasets and metrics for spatial consistency, memory
        consistency, and action control that go beyond pixel-level video fidelity.
      what_remains_open: Metric validity, dataset scale, baseline completeness, and
        whether improved benchmark scores translate into better downstream planning
        or control remain verification gaps.
    consensus:
    - 'Recent world-model research is strongly generative: video prediction or reconstruction
      is used as a core learning signal.'
    - Adding structural or physics-related auxiliary objectives can improve visual
      fidelity, physical plausibility, spatial consistency, or generalization.
    - World models are increasingly treated as action- or policy-relevant systems
      rather than passive future predictors.
    - Evaluation is expanding from image quality and sample efficiency toward controllability,
      long-term memory, and consistency under viewpoint or action changes.
    disagreements:
    - 'Representation differs: some methods use latent recurrent state-space models,
      while others use diffusion transformers or compositional video generation modules.'
    - 'Supervision differs: self-supervised video prediction, context-conditioned
      reinforcement learning, physics-informed auxiliary tasks, and coupled action-video
      diffusion impose different learning signals.'
    - 'Action interface differs: some models generate future video without direct
      action generation, while others jointly diffuse actions or learn policy through
      imagined latent rollouts.'
    - 'Evaluation target differs: sample-efficient Atari performance, driving video
      generalization, robot task execution, and open-domain Minecraft memory/action
      benchmarks define success differently.'
    - 'Deployment evidence differs: some results are simulation-only or dataset-level,
      while others rely on real interaction data or zero-shot validation, making cross-comparison
      uncertain.'
    open_questions:
    - Which world-model representations and training objectives transfer robustly
      across driving, robotics, game, and open-domain video settings?
    - How much of reported model-based control improvement comes from the learned
      dynamics model rather than the policy, planner, or task-specific structure?
    - Can physics-informed, memory-consistency, or spatial-consistency objectives
      improve downstream planning and control, or only benchmark metrics?
    - Do unified video-action models generalize to action spaces and primitive combinations
      not seen during training?
    - What standardized protocols can isolate method contributions from dataset, baseline,
      metric, and implementation choices in world-model evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散Transformer与随机序列世界模型架构
      解决的问题: 将高维视觉观测序列转化为可用于视频生成和基于模型的强化学习的预测世界模型。
      尚未覆盖: 哪些架构选择和辅助目标能迁移到报告之外的视觉领域与基准，以及长时域或多视角一致性是否稳定。
    - 路线: 上下文条件与组合动力学用于基于模型的控制
      解决的问题: 通过将潜在动力学条件化于任务上下文，或将语言目标分解为可复用原语，提升零样本或组合泛化。
      尚未覆盖: 上下文可观测性、全新原语支持，以及动力学模型收益与策略或规划器收益的分离仍不明确。
    - 路线: 统一动作-视频接口用于具身预训练
      解决的问题: 耦合动作与视频扩散，使单一模型可表示策略、前向动力学、逆动力学或视频生成器，以支持机器人学习。
      尚未覆盖: 证据主要来自仿真或数据集层面；真实部署和在新动作空间下的失败模式尚未建立。
    - 路线: 面向一致性的世界模型评估协议
      解决的问题: 引入超越像素级视频保真度的数据集和指标，衡量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 指标有效性、数据集规模、基线完整性，以及基准分数提升是否转化为下游规划或控制改善仍是验证缺口。
    共识:
    - 近期世界模型研究高度依赖生成式信号，将视频预测或重建作为核心学习目标。
    - 加入结构或物理相关辅助目标能够改善视觉保真度、物理合理性、空间一致性或泛化能力。
    - 世界模型正越来越多地被视作与动作或策略相关的系统，而非被动未来预测器。
    - 评估正从图像质量和样本效率扩展到可控性、长期记忆以及视角或动作变化下的一致性。
    分歧:
    - 表示方式不同：有的采用潜在循环状态空间模型，有的采用扩散Transformer或组合式视频生成模块。
    - 监督信号不同：自监督视频预测、上下文条件强化学习、物理信息辅助任务和耦合动作-视频扩散施加了不同学习目标。
    - 动作接口不同：有的只生成未来视频而不直接生成动作，有的联合扩散动作或通过想象潜在轨迹学习策略。
    - 评测目标不同：Atari样本效率、驾驶视频泛化、机器人任务执行和开放域Minecraft记忆/动作基准定义的成功标准不同。
    - 部署证据不同：部分结果仅来自仿真或数据集，部分基于真实交互数据或零样本验证，导致跨比较不确定。
    开放问题:
    - 哪些世界模型表示和训练目标能够稳健迁移到驾驶、机器人、游戏和开放域视频等不同场景？
    - 报告中的基于模型的控制改进有多大来自学习到的动力学模型，而不是策略、规划器或任务特定结构？
    - 物理信息、记忆一致性或空间一致性目标能否改善下游规划与控制，还是仅仅提升基准分数？
    - 统一视频-动作模型能否泛化到训练中未见过的动作空间和原语组合？
    - 哪些标准化协议能够在世界模型评估中隔离方法贡献与数据集、基线、指标和实现选择？
