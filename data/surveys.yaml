  related_work_outline:
  - 'Mainstream direction: building evaluation datasets, metrics, and baselines for
    world models rather than only reporting aggregate task scores; recent work targets
    spatial consistency, memory, action control, and physical plausibility across
    gaming, driving, and robotic settings.'
  - 'Shared research pattern: combine a curated task or dataset with a dedicated metric
    and a baseline, then use standard benchmarks such as Atari 100k, CARL, driving
    suites, or Minecraft-style navigation to compare world-model quality.'
  - 'Key differences: evaluation targets split among sample-efficient game agents,
    zero-shot generalization, long-horizon and multi-view prediction, physics-aware
    video synthesis, and memory/action consistency; supervision and interaction settings
    vary accordingly.'
  - 'Trend evolution: from aggregate reinforcement-learning scores toward diagnostic
    stress tests that separate visual fidelity from long-horizon dynamics, spatial
    coherence, and downstream policy utility; the visible 2023-2026 frontier is dominated
    by diffusion- and Transformer-based world models.'
  - 'Open questions: how well proxy metrics align with downstream decisions, whether
    benchmark rankings remain stable across implementations and compute budgets, and
    whether task distributions cover real-world deployment conditions.'
  related_work_outline_zh:
  - 主流方向：构建面向世界模型的评测数据集、指标和基线，而不仅是看任务总分；近期工作关注空间一致性、记忆、动作控制和物理合理性，覆盖游戏、驾驶和机器人等设置。
  - 研究共性：将任务或数据集与专门指标、基线组合，并在 Atari 100k、CARL、驾驶套件或 Minecraft 式导航等标准基准上比较世界模型质量。
  - 关键差异：评测目标分为采样效率、零样本泛化、长时域与多视角预测、物理感知视频生成以及记忆/动作一致性；监督信号和交互设置随之不同。
  - 趋势演进：从聚合强化学习分数转向诊断性压力测试，区分视觉保真度与长时域动力学、空间连贯性和下游策略效用；可见的2023-2026前沿主要由扩散和Transformer世界模型主导。
  - 开放问题：代理指标与下游决策是否一致，基准排名在实现和算力预算下是否稳定，任务分布是否覆盖真实部署条件。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable across navigation, driving, gaming, and robotic settings; examples
        include loop-based Minecraft navigation and open-domain closed-loop video
        benchmarks.
      what_remains_open: Task distributions are still limited in scene diversity,
        action-space coverage, and realism; available evidence does not confirm coverage
        of real deployment conditions where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, spatial consistency,
        memory consistency, action control, zero-shot generalization, and physical
        plausibility beyond aggregate visual or task scores.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        users care about remains unverified; several metrics are new or reported without
        sufficient experimental validation.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through standard benchmarks, baselines,
        and reproducibility signals such as code and dataset artifacts; example suites
        include Atari 100k, CARL, Nuscenes, OpenDV-2K, Waymo, and MIND-World.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and broader baselines is not established; high-ranking paper
        evidence often lacks limitation details or full experimental reporting.
    consensus:
    - World-model evaluation is moving from aggregate task scores toward diagnostic
      probes of consistency, controllability, memory, physical plausibility, and generalization.
    - Evaluation packages tend to pair a curated dataset or task with one or more
      dedicated metrics and at least one baseline, where code and data artifacts are
      treated as part of comparability.
    - Visual quality alone is not enough; several works evaluate long-horizon dynamics
      or downstream policy utility to judge whether generated or imagined trajectories
      are useful.
    - Recent method papers rely on standard RL and control benchmarks, suggesting
      that shared benchmark suites are becoming a common proving ground even for model-focused
      work.
    disagreements:
    - 'Evaluation targets differ: sample efficiency on image-based game benchmarks,
      zero-shot generalization under context shift, driving long-horizon or multi-view
      prediction, physics-informed video generation, and memory/action consistency
      in navigation.'
    - 'Interaction mode and deployment setting differ: simulated games, Minecraft-style
      open-world navigation, robotic manipulation, and driving suites impose different
      action spaces and failure modes.'
    - 'Supervision signals differ: action-conditional video generation, auxiliary
      depth/keypoint physics tasks, context-conditioned latent dynamics, and unified
      video-action diffusion lead to different evaluation priorities.'
    - Representation choices differ, with diffusion-based, Transformer-VAE, and recurrent
      state-space world models evaluated under different budgets and metrics, making
      cross-paper comparison indirect.
    open_questions:
    - How well do new proxy metrics, such as spatial consistency or memory consistency
      scores, predict downstream policy success and user-relevant decisions outside
      the constructed benchmark?
    - Are benchmark rankings stable across implementation quality, compute budgets,
      and baseline selection when many top papers omit limitation details or full
      reporting?
    - Do current world-model benchmarks cover enough deployment diversity, including
      real-world action noise, long-horizon memory, multi-agent or safety-critical
      settings, given the evidence is concentrated in games, driving, and simulated
      robotics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型在导航、驾驶、游戏和机器人等设置中的主张可比；例如循环式Minecraft导航和开放域闭环视频基准。
      尚未覆盖: 任务分布在场景多样性、动作空间覆盖和现实性方面仍然有限；现有证据不足以确认其覆盖世界模型预期发挥作用的真实部署条件。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性、空间一致性、记忆一致性、动作控制、零样本泛化和物理合理性。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致尚未验证；部分指标较新或缺乏足够实验验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准基准、基线和代码、数据集等可复现信号使结果可审计；示例套件包括 Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo
        和 MIND-World。
      尚未覆盖: 基准结论在不同实现、算力预算和更广泛基线下的稳定性尚不明确；高排名论文的证据常缺少限制说明或完整实验报告。
    共识:
    - 世界模型评估正从总分转向对一致性、可控性、记忆、物理合理性和泛化的诊断性探测。
    - 评估方案通常将数据集或任务与专门指标及至少一个基线组合，并把代码和数据工件视为可比性的一部分。
    - 视觉质量本身不够；多项工作通过长时域动力学或下游策略效用来判断生成轨迹是否有用。
    - 近期方法常依赖标准强化学习与控制基准，说明共享基准正成为模型工作的公共验证场。
    分歧:
    - 评测目标不同：图像游戏基准的采样效率、上下文变化下的零样本泛化、驾驶长时域或多视角预测、物理信息视频生成，以及导航中的记忆和动作一致性。
    - 交互模式与部署设置不同：模拟游戏、Minecraft式开放世界导航、机器人操作和驾驶环境带来不同的动作空间与失败模式。
    - 监督信号不同：动作条件视频生成、深度或关键点物理辅助任务、上下文条件潜动力学，以及视频-动作扩散联合训练导致评估重点不同。
    - 表示选择不同：基于扩散、Transformer-VAE或循环状态空间的世界模型在不同预算和指标下评估，跨论文比较不直接。
    开放问题:
    - 空间一致性、记忆一致性等新兴代理指标，在多大程度上能预测下游策略成功与用户关心决策？
    - 当许多高排名论文缺少限制说明或完整报告时，基准排名在实现质量、算力预算和基线选择下是否稳定？
    - 现有证据集中在游戏、驾驶和模拟机器人上，当前基准是否覆盖足够的真实部署多样性，包括动作噪声、长时域记忆、多智能体或安全关键场景？
