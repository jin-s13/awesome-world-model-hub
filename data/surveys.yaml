  related_work_outline:
  - 'Mainstream direction: Designing diagnostic benchmarks that probe structured world-model
    capabilities—spatial consistency, memory, action control—beyond aggregate task
    scores.'
  - 'Shared research pattern: Proposing a new dataset with tailored metrics, then
    using it to reveal failure modes of current world models under controlled conditions.'
  - 'Key differences: Evaluation focus varies from spatial loop consistency (LoopNav)
    to memory-action coupling (MIND), visual fidelity for policy learning (DIAMOND),
    and physical plausibility (RoboScape); domains span driving, games, and robotics.'
  - 'Trend evolution: From 2020–2026, benchmarks shifted from generic game scores
    (Atari 100k) to specialized diagnostic suites (LoopNav, MIND) with closed-loop
    protocols, reflecting a maturation from method-centric to evaluation-centric research.'
  - 'Open questions: How to align proxy metrics with downstream decision utility,
    ensure benchmark stability across implementations, and cover real-world complexity
    in a single suite.'
  related_work_outline_zh:
  - 主流方向：设计诊断性基准，探测世界模型的结构化能力（空间一致性、记忆、动作控制），而非仅看总分。
  - 研究共性：提出新数据集并配以定制指标，然后在受控条件下揭示当前世界模型的失效模式。
  - 关键差异：评估焦点从空间循环一致性（LoopNav）到记忆-动作耦合（MIND）、视觉保真度对策略学习的影响（DIAMOND）以及物理合理性（RoboScape）各不相同；领域覆盖驾驶、游戏和机器人。
  - 趋势演进：2020–2026年间，基准从通用游戏分数（Atari 100k）转向专门诊断套件（LoopNav、MIND）并采用闭环协议，反映从以方法为中心到以评估为中心的研究成熟化。
  - 开放问题：如何对齐代理指标与下游决策效用，确保基准在不同实现下的稳定性，以及在单一套件中覆盖真实世界复杂性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable on structured dimensions like spatial consistency, memory, and
        action control.
      what_remains_open: Whether the task distribution covers the diverse real-world
        settings where world models are expected to help, and whether the datasets
        capture long-tail failure cases.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., scene graph consistency or memory-action
        coherence metrics.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; sensitivity to hyperparameters and stochasticity.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines (e.g., MIND-World),
        standard benchmarks (Atari 100k, Nuscenes), and open-source artifacts.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and random seeds.
    consensus:
    - World-model evaluation must go beyond visual reconstruction quality and include
      structured capability tests such as spatial consistency, long-term memory, and
      action controllability.
    - Standardized benchmarks are essential for fair comparison, and the community
      is converging on a few suites like Atari 100k and Nuscenes for driving.
    - Diffusion-based world models are becoming the dominant generative backbone,
      and their evaluation requires protocols that account for stochastic generation.
    - Closed-loop evaluation, where the model's own predictions condition future inputs,
      is more informative than open-loop next-frame prediction.
    disagreements:
    - 'Evaluation focus: some works prioritize spatial consistency (loop-based navigation),
      others emphasize memory and action control, while yet others focus on visual
      detail impact on policy learning or physical plausibility.'
    - 'Domain scope: benchmarks are fragmented across driving, Minecraft, Atari, and
      robotic manipulation, with no unified cross-domain protocol.'
    - 'Metric design: task-agnostic consistency scores (SGCS) vs. task-specific normalized
      scores (human-normalized Atari score) vs. physical plausibility metrics; there
      is no agreement on a single evaluation axis.'
    - 'Interaction mode: some benchmarks use open-loop video prediction, others use
      closed-loop agent interaction, leading to different conclusions about model
      capability.'
    open_questions:
    - How can we design a single benchmark suite that covers the diverse real-world
      scenarios (driving, manipulation, navigation) where world models are deployed?
    - What is the correlation between diagnostic metrics (e.g., memory consistency)
      and downstream task performance in reinforcement learning or planning?
    - How stable are benchmark rankings under different training seeds, compute budgets,
      and implementation details, given that most papers report single-run results?
    - Can we develop zero-shot generalization benchmarks that test world models on
      entirely unseen dynamics without assuming observable context variables?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集，使世界模型在空间一致性、记忆和动作控制等结构化维度上可比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的多样化真实场景，以及数据集是否捕获长尾失败案例。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性或记忆-动作连贯性指标。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致；对超参数和随机性的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（如MIND-World）、标准基准（Atari 100k、Nuscenes）和开源工件使结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和随机种子下是否稳定。
    共识:
    - 世界模型评估必须超越视觉重建质量，纳入结构化能力测试，如空间一致性、长期记忆和动作可控性。
    - 标准化基准对于公平比较至关重要，社区正围绕Atari 100k和Nuscenes等少数套件收敛。
    - 基于扩散的世界模型正成为主流生成骨干，其评估需要能处理随机生成的协议。
    - 闭环评估（模型自身预测作为未来输入）比开环下一帧预测更具信息量。
    分歧:
    - 评估焦点：有的工作优先考虑空间一致性（基于循环的导航），有的强调记忆和动作控制，还有的关注视觉细节对策略学习的影响或物理合理性。
    - 领域范围：基准分散在驾驶、Minecraft、Atari和机器人操作中，缺乏统一的跨领域协议。
    - 指标设计：任务无关的一致性分数（SGCS）对比任务特定的归一化分数（人类归一化Atari分数）对比物理合理性指标；尚未就单一评估轴达成一致。
    - 交互模式：一些基准使用开环视频预测，另一些使用闭环智能体交互，导致对模型能力的不同结论。
    开放问题:
    - 如何设计一个覆盖世界模型部署的多样化真实场景（驾驶、操作、导航）的单一基准套件？
    - 诊断指标（如记忆一致性）与强化学习或规划中的下游任务性能之间的相关性如何？
    - 在大多数论文仅报告单次运行结果的情况下，基准排名在不同训练种子、算力预算和实现细节下的稳定性如何？
    - 能否开发零样本泛化基准，在不假设可观测上下文变量的情况下测试世界模型对完全未知动力学的适应能力？
