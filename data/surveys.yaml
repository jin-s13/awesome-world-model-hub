  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by world-model evaluation and
    creation. Dedicated benchmarks such as LoopNav and MIND test spatial, memory,
    and action consistency, while method papers report on Atari 100k, Nuscenes, CARL,
    and robotic video suites. Diffusion- and Transformer-based world models are the
    main model family under test.'
  - 'Shared research pattern: Claims are validated on shared datasets or tasks, with
    metrics probing beyond aggregate fidelity: human-normalized scores, rollout performance,
    zero-shot generalization, scene-graph consistency, memory consistency, and action
    control. Many artifacts include code or dataset release, but several top papers
    omit limitations.'
  - 'Key differences: Some contributions are benchmark-first, defining datasets and
    consistency metrics; others are model-first, improving a world model and evaluating
    on existing suites. Evaluation targets differ among visual fidelity, policy utility,
    long-horizon driving rollout, zero-shot dynamics, and action controllability.'
  - 'Trend evolution: Top-ranked evidence concentrates in 2023-2026, moving from discrete-latent
    RL world models toward diffusion-based video world models and unified video-action
    pretraining, with newer dedicated benchmarks for memory consistency and action
    control appearing at the frontier.'
  - 'Open questions: How consistency and action-control metrics map to downstream
    decisions, whether findings transfer beyond Minecraft/Atari/driving/robot datasets,
    and whether benchmark conclusions stay stable across implementations and compute
    remain unverified.'
  related_work_outline_zh:
  - 主流方向：证据主要围绕世界模型评测与构建。LoopNav、MIND等基准测试空间、记忆和动作一致性；同时，方法论文在Atari 100k、Nuscenes、CARL和机器人视频等套件上报告结果。扩散与Transformer世界模型是主要被测对象。
  - 研究共性：以共享数据集或任务验证主张，指标超出总体分数，涵盖人类归一化得分、rollout、零样本泛化、场景图一致性、记忆一致性和动作控制。多数工作提供代码或数据集，但多篇论文未报告限制。
  - 关键差异：部分工作是基准优先，定义数据集与一致性指标；部分是模型优先，在已有套件上改进世界模型。评测目标在视觉保真、策略效用、长时域驾驶、零样本动力学和动作可控性之间存在差异。
  - 趋势演进：高排名证据集中在2023-2026年，从离散潜变量RL世界模型走向扩散视频世界模型和统一视频-动作预训练，并出现针对记忆一致性与动作控制的新基准。
  - 开放问题：一致性与动作控制指标如何映射到下游决策，结论能否迁移到Minecraft/Atari/驾驶/机器人之外，以及基准结论在不同实现与算力下是否稳定，仍未验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared navigation and video tasks that make world-model
        memory, spatial consistency, and action control comparable.
      what_remains_open: 'Coverage is narrow: Minecraft-based navigation or a fixed
        video set appears in the evidence, with no broad real-world or long-horizon
        generalization shown.'
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility through consistency scores, action-control tests, and human-normalized
        scores rather than aggregate fidelity alone.
      what_remains_open: Whether proxy metrics such as scene-graph or memory consistency
        align with downstream policy or deployment quality is not established.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditability through shared baselines, datasets, and
        code, including Dreamer v3, Atari 100k, Nuscenes, CARL, and robotic datasets.
      what_remains_open: Stability across implementations and compute budgets is unverified;
        several top papers omit limitations and citation/impact signals, making reproduction
        and failure evidence incomplete.
    consensus:
    - World-model evaluation is moving beyond aggregate scores toward closed-loop,
      long-horizon, or action-conditioned probes of consistency.
    - Diffusion-based and Transformer-based world models are widely used for visual
      prediction, with visual detail treated as important for agent or robot policy
      learning.
    - Benchmarks, datasets, and code are frequently released, but negative findings
      and limitation statements are often absent.
    disagreements:
    - 'Representation differs: discrete-latent stochastic models, diffusion video
      models, physics-informed keypoint/depth constraints, and unified video-action
      diffusion impose different evaluation assumptions.'
    - 'Evaluation targets differ: human-normalized Atari performance, driving rollout,
      robotic policy utility, physical plausibility, and zero-shot generalization
      are not directly comparable.'
    - 'Interaction mode differs: open-loop video generation, closed-loop action-conditioned
      navigation, and coupled video-action pretraining create different validity criteria
      for world models.'
    - 'Deployment setting differs: simulated RL/game environments, Minecraft navigation,
      driving datasets, and robot manipulation datasets stress different competence
      boundaries.'
    open_questions:
    - How should memory and spatial consistency metrics be connected to downstream
      policy performance or real-world deployment quality?
    - Do current world-model benchmark conclusions remain stable across independent
      implementations, compute budgets, and unseen domains?
    - How can action-control and long-term memory consistency be tested without overfitting
      to a single navigation environment or fixed video collection?
    - What evaluation protocol is appropriate when a single diffusion model acts simultaneously
      as policy, forward dynamics, inverse dynamics, and video generator?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 通过共享导航和视频任务，比较世界模型的记忆、空间一致性与动作控制能力。
      尚未覆盖: 覆盖场景较窄，证据中主要为Minecraft导航或固定视频集，缺少广泛的真实环境与长时域泛化验证。
    - 路线: 指标与压力测试设计
      解决的问题: 通过一致性分数、动作控制测试和人类归一化得分，在总体分数之外检验预测、可控性、鲁棒性和决策效用。
      尚未覆盖: 场景图或记忆一致性等代理指标与下游策略或部署质量之间的一致性尚未建立。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线、数据集和代码使结果可审计，涉及Dreamer v3、Atari 100k、Nuscenes、CARL和机器人数据集。
      尚未覆盖: 不同实现和算力预算下的结论稳定性未验证；多篇论文缺少限制说明和引用信号，复现与失败证据不完整。
    共识:
    - 世界模型评估正从单一总分转向闭环、长时域或动作条件的一致性探测。
    - 扩散和Transformer世界模型被广泛用于视觉预测，视觉细节被视为影响智能体或机器人策略学习的重要因素。
    - 基准、数据集和代码常被发布，但负结果和限制说明普遍缺失。
    分歧:
    - 表示方式不同：离散潜变量随机模型、扩散视频模型、物理信息关键点/深度约束和统一视频-动作扩散带来不同的评估假设。
    - 评测目标不同：Atari人类归一化性能、驾驶rollout、机器人策略效用、物理合理性和零样本泛化之间不可直接比较。
    - 交互模式不同：开环视频生成、闭环动作条件导航和耦合视频-动作预训练产生不同的世界模型有效性标准。
    - 部署场景不同：模拟RL/游戏环境、Minecraft导航、驾驶数据集和机器人操作数据集施加不同的能力边界压力。
    开放问题:
    - 记忆和空间一致性指标应如何与下游策略性能或真实部署质量关联？
