  related_work_outline:
  - 'Mainstream direction: Transforming pre-trained video generative models into action-controllable
    world simulators that serve as runnable systems for training and evaluating embodied
    agents in autonomous driving, robotics, and gaming.'
  - 'Shared research pattern: All systems introduce action-conditioning modules, multi-modal
    consistency losses, and open-source pipelines to generate temporally coherent
    videos, using large-scale datasets and standardized metrics.'
  - 'Key differences: Supervision signals vary from physics-informed depth/keypoints
    to motion-enhanced losses; evaluation targets differ among spatial consistency,
    action fidelity, and visual quality; interaction modes range from open-loop generation
    to closed-loop autoregressive simulation.'
  - 'Trend evolution: The field is moving from static dataset evaluation to real-time
    closed-loop interaction, from single-domain models to multi-domain modular designs,
    and from heavy offline rendering to low-latency single-GPU deployment.'
  - 'Open questions: Long-horizon autoregressive degradation, cross-domain generalization,
    trade-offs between physical plausibility and visual fidelity, latency scalability
    under resource constraints, and the lack of independent reproducibility across
    diverse infrastructure.'
  related_work_outline_zh:
  - 主流方向：将预训练视频生成模型转化为动作可控的世界模拟器，构建可运行系统，用于自动驾驶、机器人、游戏等具身智能体的训练与评估。
  - 研究共性：所有系统均引入动作条件化模块、多模态一致性损失，并开源流水线，利用大规模数据集和标准化指标生成时间连贯的视频。
  - 关键差异：监督信号包括物理信息（深度、关键点）和运动增强损失；评估目标分为空间一致性、动作忠实度和视觉质量；交互模式从开环生成到闭环自回归仿真。
  - 趋势演进：从静态数据集评估转向实时闭环交互，从单领域模型转向多领域模块化设计，从重离线渲染转向低延迟单GPU部署。
  - 开放问题：长时域自回归退化、跨域泛化、物理合理性与视觉保真度平衡、资源受限下的延迟可扩展性、以及跨基础设施的独立复现缺失。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable simulator pipelines
      what_it_solves: Turning pre-trained video generators into end-to-end simulators
        that integrate data, training, and inference to support agent policy learning
        and evaluation.
      what_remains_open: Cross-domain generalization beyond the training environment
        (e.g., from nuScenes to other sensor setups), long-horizon temporal consistency,
        and validation of physical realism in unseen scenarios.
    - line: Real-time closed-loop serving
      what_it_solves: Meeting low-latency, interactive requirements for autonomous
        driving and robotics simulation, enabling frame-level autoregressive generation
        or action-conditioned rollout on a single GPU.
      what_remains_open: Latency guarantees under extreme conditions, scalability
        to multi-GPU or complex real-world deployments, and integration with hardware-in-the-loop
        testing.
    - line: Standardized benchmarks and reproducible artifacts
      what_it_solves: Providing open datasets, evaluation frameworks, and code to
        quantify spatial consistency, action fidelity, and visual quality across different
        world models.
      what_remains_open: Independent reproduction across teams and infrastructure,
        generalization of benchmark metrics to diverse domains, and the gap between
        benchmark scores and real-world system reliability.
    consensus:
    - All systems leverage pre-trained video generative models (diffusion or autoregressive)
      and add lightweight action-conditioning modules to enable controllable video
      synthesis.
    - Temporal and multi-view consistency is enforced through specialized loss functions
      (e.g., motion-enhanced, structural, or depth-based losses).
    - Large-scale driving or robotics datasets (nuScenes, Minecraft, CARL) are used
      for training and evaluation, with FID and FVD as common visual quality metrics.
    - Code and datasets are publicly released to promote reproducibility, though completeness
      varies.
    - The end goal is to serve as a simulator for model-based reinforcement learning
      or closed-loop evaluation of autonomous agents.
    disagreements:
    - 'Supervision signals: Physics-informed approaches (e.g., RoboScape) use depth
      prediction and keypoint dynamics, while others (e.g., DWS) rely on motion-reinforced
      losses or scene graph consistency (LoopNav).'
    - 'Evaluation focus: Some works optimize spatial consistency (LoopNav), others
      measure action fidelity (Terra ACT-Bench, Vista) or visual quality, and a few
      combine both for downstream task performance.'
    - 'Interaction paradigm: Open-loop conditional generation (Vista) versus closed-loop
      autoregressive simulation (FAR-Drive, cRSSM in Dreamer dreams) versus prioritized
      imagination for model-based RL (DWS).'
    - 'Deployment constraints: High-fidelity offline generation (RoboScape, Vista)
      versus real-time single-GPU inference with sub-second latency (FAR-Drive).'
    - 'Model architecture: Latent state-space models (cRSSM) versus pixel-level diffusion
      transformers (FAR-Drive) versus general-purpose video generators (DWS).'
    open_questions:
    - How can long-horizon autoregressive generation be maintained without severe
      degradation, even with blend-forcing or adaptive horizon conditioning?
    - What mechanisms enable a simulator trained on a single dataset (e.g., nuScenes)
      to generalize to unseen environments, weather, or sensor configurations?
    - How to jointly optimize physical plausibility and visual fidelity without sacrificing
      either, especially for deformable objects or complex interactions?
    - Can real-time closed-loop simulators scale to multi-agent or multi-sensor setups
      while preserving sub-100ms latency, and what hardware-software co-design is
      needed?
    - To what extent do current benchmark scores (FID, FVD, SGCS) correlate with practical
      policy performance when simulators are deployed in downstream tasks, and how
      can independent replication be standardized?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的模拟器流水线
      解决的问题: 将预训练视频生成器转变为端到端模拟器，整合数据、训练和推理，支持智能体策略学习与评估。
      尚未覆盖: 训练环境外的跨域泛化（如从nuScenes到其他传感器配置）、长时域一致性，以及未见过场景中物理真实性的验证。
    - 路线: 实时闭环服务
      解决的问题: 满足自动驾驶和机器人仿真对低延迟交互的要求，在单GPU上实现帧级自回归生成或动作条件推演。
      尚未覆盖: 极端条件下的延迟保证、扩展到多GPU或复杂真实部署，以及与硬件在环测试的集成。
    - 路线: 标准化基准与可复现工件
      解决的问题: 提供开放数据集、评估框架和代码，量化不同世界模型的空间一致性、动作忠实度和视觉质量。
      尚未覆盖: 跨团队和基础设施的独立复现、基准指标对多样化领域的泛化，以及基准分数与实际系统可靠性的差距。
    共识:
    - 所有系统均利用预训练视频生成模型（扩散或自回归），并添加轻量级动作条件模块以实现可控视频合成。
    - 通过专门的损失函数（如运动增强、结构或深度损失）强制时间与多视图一致性。
    - 使用大规模驾驶或机器人数据集（nuScenes、Minecraft、CARL）进行训练和评估，FID和FVD是通用的视觉质量度量。
    - 代码和数据集公开以促进可复现性，但完整程度各有不同。
    - 最终目标是为基于模型的强化学习或自主智能体的闭环评估提供模拟器。
    分歧:
    - 监督信号：物理信息方法（如RoboScape）使用深度预测和关键点动力学，而其他方法（如DWS）依赖运动增强损失或场景图一致性（LoopNav）。
    - 评估重点：部分工作优化空间一致性（LoopNav），另一些衡量动作忠实度（Terra ACT-Bench、Vista）或视觉质量，少数将两者结合用于下游任务。
    - 交互范式：开环条件生成（Vista）与闭环自回归仿真（FAR-Drive、cRSSM梦境）与基于模型的RL的优先想象（DWS）。
    - 部署约束：高保真离线生成（RoboScape、Vista）与实时单GPU亚秒级推理（FAR-Drive）。
    - 模型架构：潜在状态空间模型（cRSSM）与像素级扩散变换器（FAR-Drive）与通用视频生成器（DWS）。
    开放问题:
    - 即使用混合强制或自适应视界条件化，如何避免长时域自回归生成的严重退化？
    - 何种机制能使在单一数据集（如nuScenes）上训练的模拟器泛化到未见环境、天气或传感器配置？
    - 如何在不牺牲任一方面的情况下联合优化物理合理性与视觉保真度，特别是对可变形物体或复杂交互？
    - 实时闭环模拟器能否在多智能体或多传感器设置下保持亚100毫秒延迟，需要怎样的软硬件协同设计？
    - 当前基准分数（FID、FVD、SGCS）与模拟器部署于下游任务时的实际策略性能之间有多大相关性，如何将独立复现标准化？
