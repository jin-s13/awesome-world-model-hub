  related_work_outline_zh:
  - 主流方向：证据包集中在以世界模型为中心的综述、分类法和一手证据，尤其偏向生成式视频世界模型、具身机器人学习和自动驾驶仿真。
  - 研究共性：多数工作把世界模型视为连接表示或原语到未来观测的预测模拟器，并暴露时间一致性、可控性、泛化和评测等缺口。
  - 关键差异：证据从无实证验证的概念分类法，到在物理机器人、仿真、视频基准、交通仿真和自动驾驶指标上评估的部署方法，差异明显。
  - 趋势演进：在2022-2026的窄前沿窗口中，工作从真实机器人在线世界模型学习，走向生成式视频、细粒度控制、开源实时仿真、长程/视线外动态和正式评估框架。
  - 开放问题：现有证据仍未回答所提世界模型是否真的能模拟物理或视线外动态，以及如何标准化闭环、资源感知和可复现性证据。
  literature_review:
    line_of_work_matrix:
    - line: Unified taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world-model research around generative
        video, embodied agents, and automated driving; separates latent representations,
        structural priors, internal mechanics, and research milestones.
      what_remains_open: The taxonomies are mostly conceptual and lack systematic
        empirical validation or evidence of coverage; future methods may fall outside
        the proposed design spaces.
    - line: Comparative evaluation synthesis
      what_it_solves: Makes explicit how evaluation choices such as simulation versus
        physical robots, open-loop generation versus closed-loop control, motion prediction,
        and resource-aware inference affect conclusions about world-model quality.
      what_remains_open: The packet does not provide enough comparable baselines or
        metrics across settings; several recent works omit limitations and reproducible
        artifacts, so cross-setting compatibility remains a verification gap.
    - line: Open problem and gap mapping
      what_it_solves: 'Turns broad world-model coverage into concrete gaps: compositionality
        beyond seen primitives, real-time open-source simulation, long-horizon memory,
        out-of-sight dynamics, fine-grained control, and real-robot transfer.'
      what_remains_open: Which gaps matter most for progress is not prioritized, and
        some strong capability claims are not paired with empirical limitations or
        reproducibility evidence.
    consensus:
    - World models are consistently framed as predictive or simulative components
      that should support downstream tasks such as control, planning, video generation,
      traffic simulation, or driving.
    - Long-horizon temporal consistency, controllable generation, and generalization
      beyond behavior seen at training time are treated as central unsolved issues.
    - Evaluation should move beyond short-horizon or open-loop generation toward persistent,
      closed-loop, physically grounded, or interactive settings.
    disagreements:
    - 'Representation choices differ: some use language-derived compositional primitives,
      others persistent global 3D entity states, continuous or discrete latent states,
      or per-agent latent personalities.'
    - 'Supervision and evaluation targets differ: sparse rewards on physical robots,
      simulated video-plan success, motion prediction metrics, future-frame controllability,
      and proposed closed-loop driving metrics are not directly equivalent.'
    - 'Deployment and interaction modes differ: online real-world learning, offline
      video generation, real-time interactive simulation, and multi-agent traffic
      simulation impose different constraints and evidence standards.'
    open_questions:
    - Do proposed world models simulate physical laws or out-of-sight dynamics robustly
      for truly unseen primitives and scenes, or only for combinations seen during
      training?
    - How can taxonomy and evaluation frameworks be validated beyond conceptual coverage
      with systematic, comparable benchmarks and metrics?
    - What would a shared evaluation protocol need to connect physical-robot learning,
      video generation, and autonomous-driving world models without collapsing their
      different deployment assumptions?
    - Which recent claims can be reproduced given the absence or sparsity of code,
      dataset, baseline, metric, and limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一分类法与路线图综合
      解决的问题: 将碎片化的世界模型研究围绕生成式视频、具身智能体和自动驾驶进行组织；区分潜在表示、结构先验、内部机制和研究里程碑。
      尚未覆盖: 分类法多为概念性，缺乏系统性实证验证或覆盖性证据；未来方法可能落在所提设计空间之外。
    - 路线: 对比评测综合
      解决的问题: 明确评测选择如何影响世界模型质量结论，例如仿真还是物理机器人、开环生成还是闭环控制、运动预测和资源感知推理。
      尚未覆盖: 证据包未提供跨设置的足够可比较基线或指标；若干近期工作省略局限性和可复现工件，跨设置兼容性仍是验证缺口。
    - 路线: 开放问题与缺口映射
      解决的问题: 把宽泛的世界模型覆盖转化为具体缺口：已见原语之外的组合泛化、实时开源仿真、长程记忆、视线外动态、细粒度控制和真实机器人迁移。
      尚未覆盖: 哪些缺口对进展最需要优先解决尚未排序；一些强能力声明未配对实证局限或可复现证据。
    共识:
    - 世界模型被一致描述为预测或模拟组件，应支撑控制、规划、视频生成、交通仿真或驾驶等下游任务。
    - 长程时间一致性、可控生成和训练时行为之外的泛化被视为尚未解决的核心问题。
    - 评估应超越短程或开环生成，走向持续、闭环、物理接地或交互式设置。
    分歧:
    - 表示选择不同：有的使用语言派生的组合原语，有的使用持久全局三维实体状态、连续或离散潜在状态，或每个智能体的潜在个性。
    - 监督信号和评测目标不同：物理机器人上的稀疏奖励、仿真视频计划成功、运动预测指标、未来帧可控性和所提闭环驾驶指标不能直接等同。
    - 部署与交互模式不同：在线真实世界学习、离线视频生成、实时交互仿真和多智能体交通仿真带来不同的约束和证据标准。
    开放问题:
    - 所提世界模型是否能在真正未见原语和场景中稳健模拟物理规律或视线外动态，还是只能处理训练中见过的组合？
    - 分类法和评估框架如何超越概念覆盖，通过系统、可比较的基准与指标得到验证？
    - 共享评估协议需要如何设计，才能连接物理机器人学习、视频生成和自动驾驶世界模型，同时不抹去其不同的部署假设？
    - 在代码、数据集、基线、指标和局限性信息缺失或稀疏的情况下，哪些近期声明可以被复现？
