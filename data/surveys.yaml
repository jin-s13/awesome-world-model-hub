  related_work_outline:
  - 'Mainstream direction: World-model evaluation is consolidating around standardized
    video-prediction and control benchmarks, spanning driving, robotics, Minecraft,
    and Atari. Recent work focuses on diffusion/transformer generators and diagnostic
    metrics for spatial consistency, memory, action control, and downstream policy
    utility.'
  - 'Shared research pattern: Most studies choose a defined observation-action setting,
    train or test a generative world model, and compare using either aggregate scores
    or targeted consistency checks. Open datasets and baseline model families such
    as Dreamer-style or diffusion world models appear repeatedly.'
  - 'Key differences: Work splits between constructing benchmark tasks and improving
    model architectures. Evaluation targets differ: sample-efficient Atari scores,
    long-horizon multi-view driving prediction, zero-shot contextual RL, physics-informed
    robotic video, and Minecraft spatial consistency. Supervision ranges from action-free
    video to action-conditioned trajectories.'
  - 'Trend evolution: Within the visible 2023-2026 frontier, the field is moving from
    discrete latent world models toward diffusion/transformer world models and from
    aggregate normalized scores toward stress-test metrics for memory, physical plausibility,
    and cross-action-space generalization.'
  - 'Open questions: Whether proxy metrics align with downstream decision quality,
    whether conclusions remain stable across implementations and compute, and whether
    current datasets cover long-horizon open-domain settings remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正在围绕标准化视频预测与控制基准收敛，覆盖驾驶、机器人、Minecraft和Atari；近期工作聚焦扩散/Transformer生成器以及空间一致性、记忆、动作控制和下游策略效用等诊断指标。
  - 研究共性：多数研究选择一个明确的观测-动作设置，训练或测试生成式世界模型，并通过总分或定向一致性检查进行比较；开放数据集和Dreamer式、扩散式世界模型等基线反复出现。
  - 关键差异：工作分为构建基准任务与改进模型架构；评测目标覆盖Atari样本效率、长时域多视角驾驶预测、零样本上下文RL、物理信息机器人视频和Minecraft空间一致性；监督信号从无动作视频到动作条件轨迹不等。
  - 趋势演进：在可见的2023-2026前沿内，领域正从离散潜变量世界模型转向扩散/Transformer世界模型，并从聚合归一化分数转向记忆、物理合理性与跨动作空间泛化的压力测试。
  - 开放问题：代理指标是否与下游决策质量一致、结论在不同实现和算力预算下是否稳定、当前数据集是否覆盖长时域开放域设置，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared observation-action datasets and tasks for evaluating
        world-model generalization; representative datasets include LoopNav for Minecraft
        navigation and MIND for open-domain revisited video.
      what_remains_open: Coverage is still limited to specific scenes, embodiment
        assumptions, and action spaces; these benchmarks have not yet shown whether
        the task distribution matches real-world settings where world models are expected
        to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality and controllability beyond aggregate
        reconstruction error, such as spatial consistency, memory consistency, action
        control, visual fidelity, and physical plausibility.
      what_remains_open: The alignment between these proxy metrics and downstream
        decisions or policy performance is not demonstrated, and no cross-domain metric
        appears consistently accepted.
    - line: Comparable baselines and reporting
      what_it_solves: Standardizes evaluation through shared benchmarks such as Atari
        100k, CARL, nuScenes, OpenDV-2K, and Waymo, and through reported baselines
        and released artifacts.
      what_remains_open: Stability across implementations, compute budgets, and baseline
        tuning is underexplored; several papers lack visible limitation details or
        enough reporting evidence to fully audit this.
    consensus:
    - World-model evaluation is moving beyond single reconstruction scores toward
      consistency, controllability, and downstream-task usefulness.
    - Shared benchmark suites enable comparison across different model families, but
      the relevant metric depends heavily on the deployment setting.
    - Diffusion- or transformer-based generative world models are becoming common
      baselines across controlled game, driving, and robotic domains.
    disagreements:
    - 'Representation choice differs: some work compresses observations into discrete
      latent states for control, while other work preserves visual detail through
      diffusion-based generation.'
    - 'Supervision and interaction modes differ: action-conditioned trajectories,
      action-free video pretraining, and context-labeled reinforcement learning impose
      different assumptions on available data.'
    - 'Evaluation target differs: aggregate human-normalized scores on Atari 100k
      versus targeted spatial, memory, or action-control diagnostics versus driving
      or robotic task-specific validation.'
    - 'Deployment setting differs: simulated game or Minecraft environments versus
      driving and robotic scenarios, leading to different emphasis on generalization
      and physical plausibility.'
    open_questions:
    - Are consistency-based metrics such as scene-graph or action-control scores predictive
      of downstream policy success in realistic deployments?
    - How stable are benchmark conclusions across world-model implementations, compute
      budgets, and baseline tuning when many reports do not include visible limitation
      or negative-result details?
    - Do current open-domain benchmarks cover long-horizon memory, repeated trajectories,
      and cross-action-space generalization beyond small curated video collections?
    - Can physics-informed and video-action diffusion world models transfer to unseen
      embodiments or environments not represented in their training datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的观测-动作数据集和任务，用于评估世界模型泛化；代表性数据集包括Minecraft导航的LoopNav和开放域可复现视频的MIND。
      尚未覆盖: 覆盖仍限于特定场景、具身假设和动作空间；这些基准尚未证明任务分布能匹配世界模型预期发挥作用的真实设置。
    - 路线: 指标与压力测试设计
      解决的问题: 超越聚合重建误差，检验预测质量和可控性，例如空间一致性、记忆一致性、动作控制、视觉保真度和物理合理性。
      尚未覆盖: 这些代理指标与下游决策或策略性能之间的一致性尚未被证明，也没有跨域一致接受的指标。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、nuScenes、OpenDV-2K、Waymo等共享基准以及报告的基线和发布工件来标准化评测。
      尚未覆盖: 结论在不同实现、算力预算和基线调优下的稳定性未被充分探索；若干论文缺少可见的局限性说明或足以审计的报告证据。
    共识:
    - 世界模型评测正从单一重建分数转向一致性、可控性和下游任务效用。
    - 共享基准套件使不同模型族之间能够比较，但相关指标高度依赖部署设置。
    - 在受控游戏、驾驶和机器人领域中，基于扩散或Transformer的生成式世界模型正成为常见基线。
    分歧:
    - 表示方式不同：一些工作将观测压缩为离散潜状态以进行控制，另一些工作通过基于扩散的生成保留视觉细节。
    - 监督与交互模式不同：动作条件轨迹、无动作视频预训练和上下文标注强化学习对可用数据提出了不同假设。
    - 评测目标不同：Atari 100k上的聚合人类归一化分数，对比针对空间、记忆或动作控制的诊断指标，或者驾驶与机器人任务特定验证。
    - 部署场景不同：模拟游戏或Minecraft环境对比驾驶和机器人场景，导致对泛化和物理合理性的强调不同。
    开放问题:
    - 基于一致性的指标，如场景图分数或动作控制分数，是否能够预测真实部署中的下游策略成功？
    - 当许多报告未提供可见的局限性或负面结果细节时，基准结论在不同世界模型实现、算力预算和基线调优下能保持多稳定？
    - 当前开放域基准是否覆盖了长时域记忆、重复轨迹和跨动作空间泛化，而不仅限于小型人工策划的视频集合？
    - 物理信息与视频-动作扩散世界模型能否迁移到训练数据中未出现的具身或环境？
