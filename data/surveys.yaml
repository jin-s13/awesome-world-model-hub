  related_work_outline:
  - 'Mainstream direction: Adapting large-scale video diffusion models as action-conditioned
    world models for robotics and embodied decision-making, with emphasis on physical
    alignment, multi-modal pretraining, and test-time verification.'
  - 'Shared research pattern: Use a Transformer-based diffusion architecture to jointly
    model video and action sequences, pretrain on diverse robotic datasets, and apply
    post-training or test-time mechanisms to improve realism and task consistency.'
  - 'Key differences: Some train unified world models from scratch, while others adapt
    pretrained video models without full parameter access; physical alignment is achieved
    via DPO, RL-based reward modeling, or assertion-based verifiers; evaluation ranges
    from visual fidelity to functional benchmarks for spatial reasoning.'
  - 'Trend evolution: In 2024–2026, the focus shifts from pure video generation to
    physically plausible, action-conditioned simulation, then to multi-dimensional
    reward alignment and test-time scaling, with a growing call for mechanistic taxonomies
    and functional benchmarks.'
  - 'Open questions: Whether current video models can construct explicit states for
    persistent and causal reasoning; how to scale verification to complex, multimodal
    tasks; and the generalizability of learned physical priors beyond manipulation
    domains.'
  related_work_outline_zh:
  - 主流方向：将大规模视频扩散模型适配为动作条件化的世界模型，用于机器人和具身决策，重点包括物理对齐、多模态预训练和测试时验证。
  - 研究共性：基于Transformer的扩散架构联合建模视频和动作序列，在多样化机器人数据集上预训练，并通过后训练或测试时机制提升真实性和任务一致性。
  - 关键差异：部分工作从零训练统一模型，部分通过掩码适配预训练模型；物理对齐方式涵盖DPO、基于RL的奖励建模和断言验证器；评估从视觉保真度转向空间推理的功能基准。
  - 趋势演进：2024至2026年，焦点从纯视频生成转向物理合理、动作条件化的仿真，进而到多维奖励对齐和测试时缩放，同时出现对机制分类和功能基准的呼吁。
  - 开放问题：当前视频模型能否构建显式状态以支持持久和因果推理；如何在复杂多模态任务上扩展验证；以及学习到的物理先验在操作任务之外的泛化性。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and conceptual taxonomy
      what_it_solves: Clarifies what a world model should represent by decomposing
        video generation into state construction (implicit/explicit) and dynamics
        modeling, bridging to classic world model theory.
      what_remains_open: Whether the taxonomy leads to measurable improvements in
        state persistence and causal reasoning, and whether benchmarks can operationalize
        the proposed categories beyond visual fidelity.
    - line: Action-conditioned video generation for embodied simulation
      what_it_solves: Enables policy learning, planning, and evaluation by generating
        future video frames conditioned on robot actions, often via unified transformers
        or pretrained model adapters.
      what_remains_open: Physical plausibility and long-horizon consistency remain
        challenging; current models may lack explicit state representations, limiting
        generalization to unseen tasks and embodiments.
    - line: Post-training alignment and reward modeling
      what_it_solves: Improves physical realism and task logic of generated rollouts
        by aligning models with human preferences or spatial assertions, using DPO,
        RL, or test-time verifiers.
      what_remains_open: Reward signals can be subjective, costly, or unreliable;
        test-time verifiers may fail to scale on complex benchmarks, and alignment
        methods are not yet validated across diverse domains.
    consensus:
    - World models in embodied AI must incorporate both visual prediction and action
      conditioning to serve as usable simulators.
    - Pretraining on large-scale, heterogeneous robot datasets consistently improves
      generalization and controllability.
    - Evaluation should move beyond perceptual quality to include task completion,
      physical consistency, and trajectory reliability.
    - Current video generation models are inherently stateless and need explicit mechanisms
      for state construction and dynamics to match classical world model desiderata.
    disagreements:
    - 'How to inject action information: frame-level conditioning modules inside transformers
      vs. learned masks on pretrained model outputs vs. parallel context blocks.'
    - 'How to ensure physical plausibility: DPO-based post-training with decoupled
      discriminators vs. RL-based multi-dimensional reward modeling vs. test-time
      assertion-based verification.'
    - Whether to train a unified model from scratch or adapt existing video diffusion
      models without fine-tuning their parameters.
    - 'What constitutes a valid evaluation: zero-shot generalization benchmarks with
      decoupled physics and action alignment vs. visual fidelity metrics vs. functional
      causal reasoning tests.'
    open_questions:
    - Can explicit state representations be extracted from video diffusion models
      to enable persistent, causal reasoning over long time horizons?
    - How can test-time verifiers be designed to provide consistent, calibrated rewards
      across diverse spatial reasoning tasks?
    - What is the most cost-effective way to collect and scale human preference data
      for physical alignment without introducing subjective biases?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与概念分类
      解决的问题: 通过将视频生成分解为状态构建（隐式/显式）和动态建模，澄清世界模型应表示的内容，并与经典世界模型理论衔接。
      尚未覆盖: 该分类法能否带来状态持久性和因果推理的可衡量提升，以及基准能否在视觉保真度之外操作化这些类别。
    - 路线: 面向具身仿真的动作条件视频生成
      解决的问题: 通过生成以机器人动作为条件的未来视频帧，实现策略学习、规划和评估，通常采用统一Transformer或预训练模型适配器。
      尚未覆盖: 物理合理性和长期一致性仍具挑战；当前模型可能缺乏显式状态表示，限制了对未知任务和本体的泛化。
    - 路线: 后训练对齐与奖励建模
      解决的问题: 通过将模型与人类偏好或空间断言对齐，使用DPO、RL或测试时验证器，提升生成轨迹的物理真实性和任务逻辑。
      尚未覆盖: 奖励信号可能主观、昂贵或不可靠；测试时验证器在复杂基准上可能无法缩放，且对齐方法未在多样化领域得到验证。
    共识:
    - 具身AI中的世界模型必须同时包含视觉预测和动作条件化，才能作为可用的仿真器。
    - 在大规模异构机器人数据集上预训练能持续提升泛化性和可控性。
    - 评估应超越感知质量，同时考虑任务完成、物理一致性和轨迹可靠性。
    - 当前视频生成模型本质上是无状态的，需要显式的状态构建和动态机制才能满足经典世界模型的要求。
    分歧:
    - 动作信息注入方式：Transformer内部的帧级条件模块 vs. 对预训练模型输出的学习掩码 vs. 并行上下文块。
    - 物理确保方式：基于DPO的解耦判别器后训练 vs. 基于RL的多维奖励建模 vs. 测试时基于断言的验证。
    - 是否从头训练统一模型，还是在不微调参数的情况下适配现有视频扩散模型。
    - 有效评估的构成：解耦物理和动作对齐的零样本泛化基准 vs. 视觉保真度指标 vs. 功能性因果推理测试。
    开放问题:
    - 能否从视频扩散模型中提取显式状态表示，以支持长时间范围内的持久因果推理？
    - 如何设计测试时验证器，使其在多样化空间推理任务中提供一致、校准的奖励？
    - 在最小化主观偏差的前提下，收集和扩展用于物理对齐的人类偏好数据的最经济方法是什么？
