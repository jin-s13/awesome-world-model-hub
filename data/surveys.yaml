  related_work_outline:
  - 'Mainstream direction: The evidence clusters around action-conditioned video world
    models for robotics, using diffusion or masked autoregressive transformers to
    couple visual dynamics with actions, with growing attention to physical plausibility
    and functional evaluation.'
  - 'Shared research pattern: Most work frames a world model as an action-conditioned
    video generator, then evaluates it through visual fidelity, action-frame alignment,
    planning utility, or physics and reasoning benchmarks.'
  - 'Key differences: Methods differ by training strategy from unified generative
    pretraining to adapter-based reuse of frozen video diffusion, by alignment signal
    from preference rewards to DPO or verifiers, and by evaluation target from spatial
    QA to contact-rich manipulation.'
  - 'Trend evolution: The visible 2024-2026 evidence moves from fine-grained action
    conditioning and adapters toward large unified or foundation-style models, explicit
    physics and reward alignment, and benchmark-driven diagnosis of world-model bottlenecks.'
  - 'Open questions: Formal guarantees and scaling laws remain largely absent; current
    evidence leaves open whether state and dynamics taxonomies, functional benchmarks,
    and alignment methods generalize beyond narrow manipulation and visual evaluation.'
  related_work_outline_zh:
  - 主流方向：当前论文集中于面向机器人的动作条件化视频世界模型，使用扩散或掩码自回归Transformer耦合视觉动态与动作，并日益强调物理合理性与功能评测。
  - 研究共性：多数工作将世界模型定义为以动作为条件的视频生成器，并通过视觉保真、动作-帧对齐、规划效用或物理/推理基准进行评测。
  - 关键差异：训练策略从统一生成式预训练到冻结视频扩散适配器；对齐信号从偏好奖励到DPO或验证器；评测目标从空间问答到接触丰富的操作任务。
  - 趋势演进：可见的2024-2026证据从细粒度动作条件化和适配器走向大型统一或基础模型、显式物理与奖励对齐，以及以基准诊断世界模型瓶颈。
  - 开放问题：形式化保证与缩放规律仍基本缺失；状态/动态分类、功能基准和对齐方法能否泛化到狭窄操作与视觉评测之外仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models with unified generative architectures
      what_it_solves: Learning a joint model over visual dynamics and actions so the
        same model can represent policies, forward and inverse dynamics, and video
        generation for robot learning.
      what_remains_open: Evidence is limited to specific robotic datasets; formal
        conditions for when action-video coupling improves policy transfer and long-horizon
        dynamics are not established.
    - line: Frozen video diffusion adaptation for embodied dynamics
      what_it_solves: Reusing pretrained video models as action-conditioned world
        models without full parameter access or finetuning.
      what_remains_open: Requires domain-specific action-labeled videos, depends on
        the pretrained model availability and biases, and has not been shown to generalize
        across sequential decision tasks.
    - line: Reward and physics alignment for video world models
      what_it_solves: Post-training or aligning generated rollouts to physical realism,
        task logic, embodiment plausibility, and visual quality via preference or
        DPO-style signals.
      what_remains_open: Human preference is subjective and costly to collect; evaluations
        concentrate on contact-rich manipulation, leaving other embodiment and domain
        boundaries untested.
    - line: Functional benchmarks and test-time verification for world-model reasoning
      what_it_solves: Diagnosing whether world models support spatial reasoning, calibration,
        and trajectory selection beyond visual quality; proposes verifiers grounded
        in frame-anchored assertions.
      what_remains_open: Current models may form an information bottleneck; verifier-based
        scaling works on some benchmarks but not others, so no consistent evaluation
        protocol is established.
    - line: Conceptual taxonomies of state construction and dynamics modeling
      what_it_solves: Organizing video-generation-as-world-model approaches into implicit
        and explicit state construction and dynamics modeling, and advocating functional
        benchmarks for persistence and causality.
      what_remains_open: The taxonomy is conceptual and not empirically validated;
        it does not yet show that this framing changes model design or predicts failures.
    consensus:
    - Action-conditioned video generation is a central mechanism for turning video
      models into world models for robot and embodied control.
    - Visual quality alone is insufficient; authors increasingly pair it with action
      alignment, planning correlation, physical plausibility, or task and reasoning
      evaluation.
    - Large-scale pretraining or adapter-based reuse of pretrained video diffusion
      can provide useful world-model dynamics without training from scratch.
    - Functional evaluation is shifting toward physics persistence, causal reasoning,
      and benchmark-grounded diagnostics rather than only generation fidelity.
    disagreements:
    - Unified action-video training from scratch competes with adapter-based reuse
      of frozen, sometimes closed, pretrained video diffusion models.
    - State can be represented implicitly in context or explicitly as latent compression,
      with no empirical consensus on which supports long-horizon persistence and causal
      reasoning.
    - 'Alignment signals differ: human video preferences and PPO-style alignment,
      DPO with decoupled discriminators, and test-time verifiers grounded in spatial
      assertions.'
    - 'Evaluation targets differ: robot manipulation and planning correlation, spatial
      reasoning benchmarks, physical plausibility benchmarks, and cross-embodiment
      zero-shot benchmarks.'
    - 'Test-time verifier evidence conflicts: one benchmark improves with grounded
      assertions while another shows no verifier achieves consistent scaling.'
    open_questions:
    - Which formal assumptions connect action-conditioned video generation to reliable
      policy, forward dynamics, and inverse dynamics behavior?
    - How can current video world models achieve long-horizon physical persistence
      and causal reasoning without becoming an information bottleneck?
    - What evaluation protocol, metric, or benchmark predicts real robot transfer
      across embodiments and domains?
    - Can reward and physics alignment and functional taxonomies be validated beyond
      contact-rich manipulation and curated visual datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一生成式架构下的动作条件化视频世界模型
      解决的问题: 联合建模视觉动态与动作，使同一模型可表示策略、前向/逆动力学及视频生成，以用于机器人学习。
      尚未覆盖: 证据限于特定机器人数据集；动作-视频耦合改善策略迁移与长时程动力学的形式条件尚未建立。
    - 路线: 冻结视频扩散模型适配为具身动态模型
      解决的问题: 无需完整参数访问或微调，将预训练视频模型复用为动作条件化世界模型。
      尚未覆盖: 依赖领域特定的动作标注视频和预训练模型的可用性与偏差；未展示跨序列决策任务的泛化。
    - 路线: 视频世界模型的奖励与物理对齐
      解决的问题: 通过偏好或DPO类信号将生成轨迹对齐到物理真实性、任务逻辑、具身合理性与视觉质量。
      尚未覆盖: 人类偏好主观且采集成本高；评测集中于接触丰富操作，其他本体和领域边界未经测试。
    - 路线: 功能基准与测试时验证
      解决的问题: 诊断世界模型在空间推理、校准和轨迹选择上的能力；提出基于帧锚定断言的验证器。
      尚未覆盖: 当前模型可能形成信息瓶颈；验证器缩放在某些基准有效，在其他基准无效，缺少一致评测协议。
    - 路线: 状态构建与动态建模的概念分类
      解决的问题: 将视频生成作为世界模型的方法组织为隐式/显式状态构建与动态建模，倡导针对持久性和因果性的功能基准。
      尚未覆盖: 该分类是概念性的，未经经验验证；尚未证明它能改变设计或预测失败。
    共识:
    - 动作条件化视频生成是将视频模型转为机器人/具身控制世界模型的核心机制。
    - 仅凭视觉质量不足；研究者越来越多结合动作对齐、规划相关性、物理合理性或任务/推理评测。
    - 大规模预训练或基于适配器的预训练视频扩散复用可提供有用的世界模型动态，而无需从零训练。
    - 功能评测正在从生成保真度转向物理持久性、因果推理和基准驱动诊断。
    分歧:
    - 从零训练的统一动作-视频模型与基于冻结预训练视频扩散的适配器复用形成竞争。
    - 状态可隐式表示在上下文中，也可显式为潜在压缩；哪种支持长时程持久性与因果推理尚无经验共识。
    - 对齐信号不同：人类视频偏好与PPO式对齐、解耦判别器DPO、以及基于空间断言的测试时验证器。
    - 评测目标不同：机器人操作与规划相关性、空间推理基准、物理合理性基准和跨本体零样本基准。
    - 测试时验证证据冲突：一个基准在接地断言下改善，另一个基准没有任何验证器实现一致缩放。
    开放问题:
    - 哪些形式假设能将动作条件化视频生成与可靠的策略、前向动力学和逆动力学行为联系起来？
    - 当前视频世界模型如何在不成为信息瓶颈的情况下实现长时程物理持久性与因果推理？
    - 哪种评测协议、指标或基准能预测跨本体和领域的真实机器人迁移？
    - 奖励/物理对齐与功能分类能否在接触丰富操作和精选视觉数据集之外得到验证？
