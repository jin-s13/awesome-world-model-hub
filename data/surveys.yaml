  - 'Mainstream direction: action-controllable generative world models and video simulators
    are being assembled into runnable closed-loop systems for driving, robotics, and
    interactive evaluation.'
  - 'Shared research pattern: papers propose a model or dataset/benchmark, condition
    generation on actions or context, and evaluate action fidelity, physical or spatial
    consistency, or downstream planning performance.'
  - 'Key differences: underlying generation varies from latent recurrent world models
    to diffusion/autoregressive video generation and physics-informed keypoint/depth
    methods; evaluation targets also vary from scene-graph consistency to FID/FVD
    and planning metrics.'
  - 'Trend evolution: visible evidence clusters in 2024–2026, shifting from single-model
    visual quality toward open benchmarks, system-level latency, and closed-loop deployment;
    earlier years are not represented in the top sample.'
  - 'Open questions: long-horizon consistency, generalization beyond nuScenes/CARL/Minecraft,
    speed-fidelity-controllability trade-offs, and independent reproduction remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：动作可控的生成式世界模型与视频模拟器被组装为面向驾驶、机器人和交互评测的可运行闭环系统。
  - 研究共性：论文提出模型或数据集/基准，以动作或上下文为条件生成未来，并评测动作忠实度、物理或空间一致性或下游规划表现。
  - 关键差异：底层生成从潜在循环世界模型、扩散/自回归视频生成到物理信息关键点/深度方法各不相同；评测目标也从场景图一致性、FID/FVD到规划指标不等。
  - 趋势演进：可见证据集中在2024–2026年，从单一视觉质量转向开放基准、系统级延迟与闭环部署；较早年份未进入顶部样本。
  - 开放问题：长时域一致性、对nuScenes/CARL/Minecraft之外的泛化、速度-保真-可控性权衡及独立复现仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks, such as Terra ACT-Bench and
        FAR-Drive
      what_it_solves: Turns generative world-model methods into end-to-end workflows
        that couple data, training, inference, and evaluation for closed-loop simulation.
      what_remains_open: Whether the stack survives external deployment, hardware
        changes, and user-specific settings; current evidence is limited mainly to
        nuScenes or single-GPU inference.
    - line: Real-time and interactive serving
      what_it_solves: Meets latency and interactivity requirements for closed-loop
        use, including action-conditioned control and sub-second simulation steps.
      what_remains_open: Trade-offs among speed, fidelity, controllability, and system
        complexity; long-horizon autoregressive rollout degradation is not fully resolved.
    - line: Artifacts and reproducible engineering, such as LoopNav and ACT-Bench
      what_it_solves: Makes systems inspectable and reusable through open benchmarks,
        datasets, and code artifacts.
      what_remains_open: Independent reproduction across teams and infrastructure;
        many top papers lack reported limitations or identifiable citation data, creating
        verification gaps.
    consensus:
    - Generative world-model systems are being built as conditionable simulators rather
      than isolated predictive models, using action, context, or trajectory inputs
      to generate future states or videos.
    - Evaluation is moving beyond image realism to include action fidelity, spatial
      consistency, physical plausibility, and downstream planning or policy value.
    - Reproducible artifacts such as datasets, benchmarks, and code are treated as
      central to making system-level claims inspectable, even when independent reuse
      is not yet demonstrated.
    disagreements:
    - 'Representation: contextual latent state-space dynamics differ from diffusion
      or autoregressive video generation and from physics-informed keypoint/depth-based
      generation.'
    - 'Evaluation target: some work scores scene-graph spatial consistency, others
      emphasize FID/FVD or action fidelity, and others evaluate downstream planner
      or policy performance.'
    - 'Interaction mode and deployment: offline benchmark evaluation differs from
      closed-loop sub-second serving and prioritized model-based imagination; settings
      span driving, robotics, and Minecraft-style navigation.'
    open_questions:
    - Can action-controllable world models remain spatially and dynamically consistent
      across very long closed-loop rollouts and under distribution shifts not covered
      by current benchmarks?
    - Do current systems transfer beyond nuScenes, CARL tasks, and Minecraft-style
      environments to other sensor configurations or embodiments?
    - What latency-fidelity-controllability trade-offs emerge when reproducible systems
      are deployed on varied GPU and hardware setups?
    - Where limitations and independent reproduction are absent, which claims should
      be treated as verification gaps rather than established system capabilities?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈，如Terra ACT-Bench、FAR-Drive
      解决的问题: 将生成式世界模型方法转化为端到端工作流，覆盖数据、训练、推理与评测，用于闭环仿真。
      尚未覆盖: 外部部署、硬件变化和用户特定设置下是否仍可靠；现有证据主要限于nuScenes或单GPU推理。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟与交互要求，包括动作条件控制与亚秒级仿真步。
      尚未覆盖: 速度、保真度、可控性与系统复杂度之间的权衡；长时域自回归推演退化尚未完全解决。
    - 路线: 工件与可复现工程，如LoopNav、ACT-Bench
      解决的问题: 通过开放基准、数据集与代码工件使系统可检查、可复用。
      尚未覆盖: 跨团队与基础设施的独立复现；多篇顶部论文未报告局限性或缺少可识别引用数据，构成验证缺口。
    共识:
    - 生成式世界模型系统正被构建为可条件化的模拟器，而非孤立预测模型，以动作、上下文或轨迹输入生成未来状态或视频。
    - 评测正从图像真实感扩展到动作忠实度、空间一致性、物理合理性与下游规划或策略价值。
    - 数据集、基准和代码等可复现工件对系统级主张的可检查性至关重要，尽管其独立复用尚未充分证明。
    分歧:
    - 表示方式：上下文潜在状态空间动力学不同于扩散或自回归视频生成，也不同于基于关键点/深度的物理信息生成。
    - 评测目标：有的工作评场景图空间一致性，有的以FID/FVD或动作忠实度为主，有的评下游规划器或策略性能。
    - 交互模式与部署：离线基准评测不同于闭环亚秒级服务与优先模型想象；场景涵盖驾驶、机器人和Minecraft式导航。
    开放问题:
    - 动作可控世界模型能否在很长的闭环推演中以及在当前基准未覆盖的分布偏移下仍保持空间和动态一致性？
    - 现有系统能否从nuScenes、CARL任务和Minecraft式环境迁移到其他传感器配置或具身形态？
    - 当可复现系统部署到不同GPU/硬件设置时，会出现哪些延迟-保真-可控性权衡？
    - 在缺少局限性与独立复现证据的情况下，哪些主张应被视为验证缺口而非已确立的系统能力？
