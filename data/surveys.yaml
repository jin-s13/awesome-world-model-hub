  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks that probe specific world
    model capabilities—spatial consistency, memory, action controllability, and long-horizon
    prediction—in embodied and driving domains, complementing existing RL suites like
    Atari 100k.'
  - 'Shared research pattern: Benchmark papers introduce curated datasets with task-specific
    metrics (e.g., scene graph consistency, memory consistency scores) to evaluate
    world models beyond pixel-level reconstruction, while method papers report results
    on both traditional and new benchmarks.'
  - 'Key differences: Benchmarks vary in domain (driving, Minecraft, robotic, Atari),
    sensory modality (video, depth, action), the type of consistency tested (spatial,
    temporal, memory), and the action space considered (fixed, variable, or absent).'
  - 'Trend evolution: From 2023–2025, world model evaluation shifted from relying
    solely on Atari 100k to purpose-built video benchmarks targeting spatial and physical
    plausibility; by 2026 benchmarks are explicitly testing memory and action control
    across diverse viewpoints, indicating a move toward closed-loop, interactive evaluation.'
  - 'Open questions: Whether proxy metrics (e.g., SGCS, mean human normalized score)
    align with downstream task utility; how to ensure benchmark coverage across the
    full range of real-world dynamics; and the stability of conclusions when models
    differ in implementation, compute budget, or training data.'
  related_work_outline_zh:
  - 主流方向：设计专用基准测试，检测世界模型在空间一致性、记忆、动作可控性和长时域预测等方面的特定能力，覆盖具身和驾驶领域，同时延续 Atari 100k 等现有
    RL 套件。
  - 研究共性：基准论文引入精心策划的数据集与任务特异性指标（如场景图一致性、记忆一致性分数），以评估世界模型在像素重建之外的性能；方法论文则同时在传统与新型基准上报告结果。
  - 关键差异：基准在领域（驾驶、Minecraft、机器人、Atari）、感知模态（视频、深度、动作）、所测试的一致性类型（空间、时序、记忆）以及动作空间（固定、可变或缺失）上存在差异。
  - 趋势演进：2023–2025 年，世界模型评估从仅依赖 Atari 100k 转向针对空间与物理合理性的专用视频基准；到 2026 年，基准已明确测试跨视角的记忆一致性与动作控制，表明向闭环交互式评估的转变。
  - 开放问题：代理指标（如 SGCS、人类归一化得分）与下游任务效用的对齐程度；基准任务分布是否覆盖真实世界动力学全貌；当模型在实现、算力预算或训练数据上不同时，结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Specialized world model benchmark suites
      what_it_solves: Creates shared tasks and datasets (e.g., LoopNav, MIND) that
        probe capabilities like spatial consistency, memory, and action control, enabling
        systematic comparison of world models beyond pixel-level metrics.
      what_remains_open: Whether the benchmarks capture the distribution of real-world
        deployment scenarios; the limited diversity of tasks and action spaces may
        not cover all intended use cases.
    - line: Metric design for consistency and control
      what_it_solves: Introduces metrics such as Scene Graph Consistency Score and
        memory consistency measures that are invariant to pixel-level variation, providing
        a more semantic evaluation of world model predictions.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decision quality users actually care about; the sensitivity of metrics to
        model hyperparameters and training data has not been fully characterized.
    - line: Adoption and extension of standard RL benchmarks
      what_it_solves: Leverages established benchmarks like Atari 100k and NuScenes
        to compare world model-based agents, providing a common reference point and
        enabling progress tracking with human-normalized scores.
      what_remains_open: Standard benchmarks may not isolate world model quality from
        policy learning; differences in compute budgets and implementation details
        can lead to unreproducible rankings.
    consensus:
    - World model evaluation must go beyond frame prediction accuracy to include spatial
      consistency, long-term memory, and action controllability.
    - Benchmarks with curated scenarios and task-specific metrics are necessary to
      expose failure modes that aggregate scores conceal.
    - Open-source datasets and evaluation frameworks are critical for reproducibility
      and fair comparison across different world model architectures.
    disagreements:
    - Whether benchmarks should target narrow, well-defined domains (e.g., driving)
      or more general environments (e.g., Minecraft) to test transferable capabilities.
    - 'The choice of evaluation metric: pixel-level reconstruction error vs. semantic
      consistency scores vs. downstream task performance as a proxy for world model
      quality.'
    - 'The role of action spaces in benchmarking: some benchmarks require a fixed
      shared action space, while others decouple evaluation from action control to
      isolate visual prediction fidelity.'
    open_questions:
    - How can benchmarks be designed to cover the diverse real-world dynamics where
      world models are expected to aid decision-making, given that current datasets
      are limited to specific simulated environments?
    - To what extent do improvements on benchmark-specific metrics translate to better
      performance in downstream tasks such as policy learning or model-based planning?
    - What are the minimal requirements for a benchmark to ensure that conclusions
      about world model superiority remain stable across different implementations,
      training budgets, and hyperparameter choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 专用世界模型基准套件
      解决的问题: 创建共享任务与数据集（如 LoopNav、MIND），检测空间一致性、记忆、动作控制等能力，使世界模型在像素级指标之外也能进行系统比较。
      尚未覆盖: 基准的任务分布是否覆盖真实部署场景；当前有限的任务和动作空间多样性可能无法涵盖所有预期用例。
    - 路线: 一致性与控制指标设计
      解决的问题: 引入场景图一致性分数、记忆一致性等指标，对像素变化保持不变，提供更语义化的世界模型预测评估。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策质量之间的对齐程度；指标对模型超参数和训练数据的敏感性尚未充分刻画。
    - 路线: 标准 RL 基准的采用与扩展
      解决的问题: 利用 Atari 100k、NuScenes 等既有基准比较基于世界模型的智能体，提供共同参照，并通过人类归一化得分追踪进展。
      尚未覆盖: 标准基准可能无法将世界模型质量与策略学习分离；算力预算和实现细节的差异可能导致难以复现的排名。
    共识:
    - 世界模型评估必须超越帧预测精度，涵盖空间一致性、长期记忆和动作可控性。
    - 具有精心设计场景和任务特异性指标的基准，对于揭示总体分数所掩盖的失效模式至关重要。
    - 开源数据集和评估框架对不同世界模型架构的公平比较与可复现性不可或缺。
    分歧:
    - 基准应面向狭窄、明确的领域（如驾驶）还是更通用的环境（如 Minecraft），以测试可迁移能力的差异。
    - 评价指标的选择：像素级重建误差 vs. 语义一致性分数 vs. 下游任务表现作为世界模型质量的代理。
    - 动作空间在基准中的角色：部分基准要求固定共享动作空间，而其他基准则将评估与动作控制解耦，以孤立视觉预测保真度。
