  literature_review:
    line_of_work_matrix:
    - line: Action-controllable closed-loop world simulation
      what_it_solves: Generating future video frames conditioned on actions or trajectories
        in driving and robotics settings, including multi-camera geometric consistency
        and low-latency serving.
      what_remains_open: Generalization beyond nuScenes-like or current domains, long-horizon
        consistency under distribution shift, scaling beyond single-GPU serving, and
        preserving fine-grained visual detail while improving controllability.
    - line: Context-aware model-based reinforcement learning and physical robot learning
      what_it_solves: Using learned dynamics models to train policies via imagination,
        adapt to unseen context values, and learn physical robot behaviors from camera
        pixels and sparse rewards without simulators.
      what_remains_open: Assumes context observability or controlled interaction conditions;
        evidence is limited to specific benchmarks or robot platforms, and independent
        cross-platform reproduction under real-world variability is not fully demonstrated.
    - line: Evaluation infrastructure for world-model consistency and action fidelity
      what_it_solves: Providing datasets, metrics, and open-source benchmarks that
        quantify spatial consistency or action adherence of generative world models.
      what_remains_open: Some contributions focus on dataset and benchmark construction
        with limited result baselines; metric sensitivity, broader model coverage,
        and independent validation remain verification gaps.
    consensus:
    - Several approaches condition learned dynamics or video models on explicit action,
      trajectory, or context inputs to improve controllability and generalization.
    - Generated future frames or imagined rollouts are used for downstream policy
      training or evaluation, not only for visual generation quality.
    - Recent work increasingly treats open-source datasets, evaluation scores, and
      reproducible artifacts as part of the contribution, especially for spatial or
      action consistency.
    disagreements:
    - Closed-loop autonomous driving simulation and physical robot learning differ
      in deployment setting and interaction mode.
    - 'Supervision signals differ: explicit context or trajectory priors, implicit
      physics learning through depth and keypoint tasks, or adaptation of pre-trained
      video generators with action modules.'
    - Evaluation targets vary across visual fidelity, action adherence, spatial consistency,
      or downstream policy performance, without a common standard.
    - 'Deployment and reproducibility evidence varies: some systems report single-GPU
      latency or open artifacts, while others provide limited infrastructure-level
      or cross-platform verification.'
    open_questions:
    - Can action-controllable driving simulators maintain geometric and temporal consistency
      over long closed-loop rollouts beyond the reported datasets and sensor configurations?
    - How does the assumption of observable context values limit zero-shot generalization
      in partially observable real-world tasks?
    - What benchmark design can jointly measure physical plausibility, visual fidelity,
      action adherence, and downstream policy utility across domains?
    - Are reported single-GPU latency and real-robot learning results reproducible
      across different hardware, datasets, teams, and infrastructure environments
      given the limited independent verification in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的闭环世界模拟
      解决的问题: 在驾驶与机器人等环境中根据动作或轨迹生成未来视频帧，兼顾多相机几何一致性和低延迟服务。
      尚未覆盖: nuScenes 等当前域之外的泛化、长时域一致性、单 GPU 之外的扩展，以及提升可控性时保持细粒度视觉细节。
    - 路线: 上下文感知的基于模型强化学习与真实机器人学习
      解决的问题: 利用学习到的动力学模型进行想象训练，适应未见上下文值，并从相机像素与稀疏奖励中学习物理机器人行为。
      尚未覆盖: 假设上下文可观测或交互条件受控；证据限于特定基准或机器人平台；跨平台独立复现和真实世界扰动鲁棒性未充分展示。
    - 路线: 面向世界模型一致性与动作保真度的评估基础设施
      解决的问题: 提供数据集、指标和开源基准，衡量生成式世界模型的空间一致性或动作遵循能力。
      尚未覆盖: 部分工作侧重数据集与基准构建，结果基线有限；指标敏感性、更广泛模型覆盖和独立验证仍是验证缺口。
    共识:
    - 多项工作将显式动作、轨迹或上下文输入作为条件，以改善可控性与泛化。
    - 生成未来帧或想象轨迹被用于下游策略训练或评估，而不仅用于视觉生成质量。
    - 近期工作倾向把开源数据集、评测分数和可复现工件作为贡献的一部分，尤其针对空间一致性与动作一致性。
    分歧:
    - 闭环自动驾驶模拟与真实机器人学习在部署场景和交互模式上存在差异。
    - 监督信号不同：显式上下文或轨迹先验、通过深度和关键点任务隐式学习物理知识，或通过动作模块适配预训练视频生成模型。
    - 评测目标不统一，包括视觉保真度、动作遵循、空间一致性或下游策略性能，缺乏共同标准。
    - 部署与复现证据不同：部分系统报告单 GPU 延迟或开放工件，另一些仅提供有限的基础设施级或跨平台验证。
    开放问题:
    - 动作可控的驾驶模拟能否在所报告数据集和传感器配置之外的长时间闭环中保持几何与时序一致性？
    - 显式上下文可观测假设会在多大程度上限制部分可观测真实任务中的零样本泛化？
    - 何种基准设计能够跨域同时衡量物理合理性、视觉保真度、动作遵循和下游策略效用？
    - 报告的单 GPU 延迟和真实机器人学习结果能否在不同硬件、数据集、团队和基础设施环境中独立复现？
