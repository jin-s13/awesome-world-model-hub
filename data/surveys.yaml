  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks that evaluate world models
    beyond visual fidelity, focusing on spatial consistency, memory, and action controllability
    in interactive environments.'
  - 'Shared research pattern: Proposing new datasets and metrics (e.g., Scene Graph
    Consistency Score, loop-based navigation tasks) to quantify properties that general-purpose
    benchmarks like Atari or CARL do not measure.'
  - 'Key differences: Benchmarks prioritize closed-loop, memory-consistent navigation
    (LoopNav, MIND) versus open-loop prediction or game performance (Atari 100k, CARL).
    Evaluation targets diverge between generation quality and downstream policy utility.'
  - 'Trend evolution: From 2023–2024, methods were evaluated on established benchmarks;
    from 2025 onward, new benchmarks (LoopNav, MIND) emerged that explicitly test
    spatial and memory consistency, shifting toward more realistic, interactive scenarios.'
  - 'Open questions: How well do benchmark metrics correlate with real-world robotics
    or driving safety; how to ensure reproducibility across compute and data budgets;
    and whether designed tasks cover the full range of world model capabilities needed
    for deployment.'
  related_work_outline_zh:
  - 主流方向：设计专门基准，超越视觉保真度评估世界模型，重点关注交互环境中的空间一致性、记忆和动作控制。
  - 研究共性：提出新数据集和指标（如场景图一致性分数、回路导航任务），量化通用基准（Atari、CARL）无法衡量的属性。
  - 关键差异：基准优先考虑闭环、记忆一致性导航（LoopNav、MIND），还是开放环预测或游戏表现（Atari 100k、CARL）。评估目标在生成质量与下游策略效用之间存在分歧。
  - 趋势演进：2023-2024年方法在现有基准上评估；2025年起出现新基准（LoopNav、MIND），明确测试空间和记忆一致性，转向更真实、交互的场景。
  - 开放问题：基准指标与真实机器人或驾驶安全的相关性如何；如何在不同计算和数据预算下确保可重复性；设计的任务是否覆盖世界模型部署所需的全部能力。
  literature_review:
    line_of_work_matrix:
    - line: Specialized world model benchmark construction
      what_it_solves: Designing tasks and datasets that specifically measure world
        model capabilities such as spatial consistency, long-term memory, and action
        controllability, which are not captured by standard benchmarks.
      what_remains_open: Coverage of real-world domains (e.g., autonomous driving,
        manipulation) is limited; the relationship between benchmark scores and downstream
        task performance is not yet established.
    - line: Evaluation on established general-purpose benchmarks
      what_it_solves: Providing a common ground for comparing world model architectures
        using widely recognized tasks (Atari 100k, CARL) and metrics (human normalized
        score), enabling rapid progress in sample efficiency and visual prediction.
      what_remains_open: These benchmarks may not reflect critical world model properties
        like physical plausibility or causal reasoning; risk of overfitting to specific
        environments without guaranteeing generalization.
    consensus:
    - Visual reconstruction quality or game score alone is insufficient for evaluating
      world models; finer-grained capability dimensions are needed.
    - Interactive, closed-loop evaluation is emerging as a necessary complement to
      open-loop prediction, emphasizing long-term consistency and physical plausibility.
    - New benchmarks explicitly introduce metrics that are invariant to pixel-level
      variation, such as scene graph consistency, to probe structural understanding.
    disagreements:
    - 'Evaluation target: some works optimize for sample efficiency in policy learning,
      while others measure spatial and memory consistency, with no unified metric
      combining both.'
    - 'Evaluation modality: methods rely on video generation quality, 3D geometry
      consistency, or action controllability as primary signals, leading to incomparable
      results.'
    - 'Environment complexity: simple games (Atari), controlled physics simulations
      (CARL), and open-world navigation (Minecraft) stress different aspects of world
      models, and conclusions do not transfer directly.'
    open_questions:
    - How can benchmark metrics be aligned with real-world task success, such as autonomous
      driving safety or robot manipulation accuracy?
    - What constitutes a sufficiently diverse and challenging benchmark that avoids
      overfitting while remaining reproducible under limited compute budgets?
    - How should world models be evaluated for physical reasoning under partial observability
      when action spaces differ from real-world affordances?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 专门的世界模型基准构建
      解决的问题: 设计任务和数据集，专门衡量世界模型的空间一致性、长期记忆和动作可控性等能力，这些能力在标准基准中未被覆盖。
      尚未覆盖: 真实世界领域（如自动驾驶、操作）的覆盖有限；基准分数与下游任务性能之间的关系尚未建立。
    - 路线: 在现有通用基准上进行评估
      解决的问题: 利用广泛认可的任务（如Atari 100k、CARL）和指标（如人类归一化得分），为比较世界模型架构提供共同基础，推动样本效率和视觉预测的快速进步。
      尚未覆盖: 这些基准可能无法反映世界模型的关键属性，如物理合理性或因果推理；存在过拟合特定环境的风险，无法保证泛化。
    共识:
    - 仅凭视觉重建质量或游戏分数不足以评估世界模型，需要更细粒度的能力维度。
    - 交互式、闭环评估正成为开放环预测的必要补充，强调长期一致性和物理合理性。
    - 新基准明确引入对像素级变化不变的指标，如场景图一致性，以探测结构理解。
    分歧:
    - 评估目标：一些工作优化策略学习的样本效率，另一些衡量空间和记忆一致性，尚无统一指标将两者结合。
    - 评估模态：方法依赖视频生成质量、3D几何一致性或动作可控性作为主要信号，导致结果不可比较。
    - 环境复杂度：简单游戏（Atari）、受控物理模拟（CARL）和开放世界导航（Minecraft）对世界模型的不同方面施加压力，结论无法直接迁移。
    开放问题:
    - 基准指标如何与真实世界任务成功（如自动驾驶安全或机器人操作精度）对齐？
    - 什么构成一个足够多样且具有挑战性的基准，既能避免过拟合，又能在有限计算预算下保持可重复性？
    - 在部分可观测条件下，当动作空间与真实世界可供性不一致时，如何评估世界模型的物理推理能力？
