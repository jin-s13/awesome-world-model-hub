  related_work_outline:
  - 'Mainstream direction: Recent work treats action-conditioned video generation
    as a candidate world-model substrate for embodied manipulation, using transformer
    or diffusion backbones to produce future frames for policy learning, planning,
    or simulator-style evaluation.'
  - 'Shared research pattern: Papers couple actions with observations and generated
    future frames, then evaluate visual quality, action-frame alignment, controllability,
    physical plausibility, or downstream decision-making improvement.'
  - 'Key differences: Methods differ in action injection, post-training or alignment
    signal, and evaluation target such as robot manipulation fidelity, spatial reasoning,
    physical consistency, or zero-shot cross-embodiment performance.'
  - 'Trend evolution: Top-packet evidence concentrates in 2024-2026, moving from adapting
    pretrained video diffusion models toward unified large-scale pretraining, reward
    or physics alignment, and functional or training-independent benchmarks; earlier
    foundations are not represented in the top evidence.'
  - 'Open questions: Persistent and causal dynamics, verifier calibration and test-time
    scaling, generalization beyond contact-rich manipulation, and the gap between
    formal definitions and empirical world-model behavior remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于面向具身操作的动作条件视频世界模型，用大型Transformer或扩散骨干生成未来帧，以支持策略评估与规划。
  - 研究共性：论文将动作轨迹与观察预测耦合，并在视觉质量、可控性、物理合理性或下游决策性能上评估生成轨迹。
  - 关键差异：差异体现在动作到帧的条件注入机制、后训练或对齐信号，以及评估目标，如机器人模拟保真度、空间推理、物理一致性或零样本跨本体性能。
  - 趋势演进：主要证据集中在2024-2026年前沿：从适配预训练视频扩散模型，到统一大规模预训练与奖励/物理对齐，再到机制分类和训练无关基准。
  - 开放问题：持续/因果动态、可靠验证器校准与测试时缩放、超出接触丰富操作的泛化，以及形式定义与经验世界模型行为的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation as testable world models
      what_it_solves: Links action trajectories to predicted video futures and uses
        the generated rollouts for policy learning, planning, or simulator-style evaluation
        in embodied manipulation.
      what_remains_open: Whether visual fidelity and short-horizon controllability
        translate to long-horizon physical persistence, causality, and generalization
        outside trained domains remains open.
    - line: State construction and dynamics modeling taxonomy
      what_it_solves: Clarifies the gap between stateless video generation and world
        models by separating implicit or explicit state construction from dynamics
        modeling.
      what_remains_open: The formal categories are not yet connected to functional
        benchmarks of persistence and causality, so their design consequences remain
        unvalidated.
    - line: Reward, preference, and test-time verification for imagined rollouts
      what_it_solves: Aligns generated trajectories with physical realism, task logic,
        embodiment plausibility, or verifiable frame-anchored spatial claims.
      what_remains_open: Verifiers can be poorly calibrated and action-biased, and
        gains on one benchmark do not consistently transfer, leaving test-time scaling
        reliability unclear.
    - line: Scaling and speed observations for video world models
      what_it_solves: Connects model size and inference speed to generated video quality
        or controllability in action-conditioned generation.
      what_remains_open: The packet does not provide direct validation that these
        scaling observations predict failures, transfers, or long-horizon dynamics.
    consensus:
    - Recent work converges on treating action-and-observation-conditioned video generation
      as a candidate world-model substrate for embodied tasks.
    - Visual quality, action-frame alignment, controllability, and physical plausibility
      are increasingly treated as separate evaluation axes rather than a single generative
      score.
    - Large transformer or diffusion backbones can be adapted or post-trained for
      action-conditioned generation, with policy evaluation and planning as downstream
      uses.
    - Visual fidelity alone is considered insufficient evidence of world-model capability;
      persistence, causality, and calibration require separate evaluation.
    disagreements:
    - 'Representation: some methods use frame-level action conditioning, while others
      use independent diffusion timesteps, learned masks, or heterogeneous masked
      autoregression.'
    - 'Supervision or alignment: some rely on pretraining objectives or direct conditioning,
      while others post-train with human-preference rewards, DPO-based physics suppression,
      or verifier-grounded micro-claims.'
    - 'Evaluation target: papers optimize for robot-manipulation simulation or policy
      evaluation, spatial reasoning benchmarks, physical consistency, or zero-shot
      cross-embodiment performance; these settings are not interchangeable.'
    - 'State assumption: a conceptual analysis treats current video models as largely
      stateless and lacking explicit state construction, while method papers implicitly
      treat context or latent rollouts as sufficient state for control.'
    open_questions:
    - Which formal assumptions about state and dynamics are required for action-conditioned
      video models to support trustworthy planning and policy evaluation?
    - How can persistence and causality be measured with functional benchmarks beyond
      short-horizon visual fidelity?
    - Why do test-time verifiers improve spatial reasoning on one benchmark but not
      another, and when do imagined views provide information instead of becoming
      a bottleneck?
    - Do alignment signals such as human preferences or DPO generalize beyond contact-rich
      manipulation domains?
    - What are the failure boundaries and reproducibility conditions for methods whose
      limitation, code, or dataset details are missing from the available evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频生成作为可测试的世界模型
      解决的问题: 将动作轨迹与预测视频未来连接，并把生成轨迹用于策略学习、规划或模拟器式评估。
      尚未覆盖: 视觉保真度和短时程可控性能否转化为训练领域外的长期物理持久性、因果性和泛化仍不清楚。
    - 路线: 状态构建与动态建模分类
      解决的问题: 通过区分隐式或显式状态构建和动态建模，澄清无状态视频生成与世界模型之间的差距。
      尚未覆盖: 形式分类尚未与衡量持久性和因果性的功能基准绑定，因此其设计影响未经验证。
    - 路线: 想象轨迹的奖励、偏好与测试时验证
      解决的问题: 将生成轨迹与物理真实性、任务逻辑、具身合理性或可验证的帧锚定空间断言对齐。
      尚未覆盖: 验证器可能校准不良且存在动作偏差；单一基准上的提升不一定迁移，测试时缩放可靠性仍不清楚。
    - 路线: 视频世界模型的规模与速度观察
      解决的问题: 将模型规模和推理速度与动作条件生成中的视频质量或可控性联系起来。
      尚未覆盖: 证据包未直接验证这些规模观察能否预测失败、迁移或长期动态。
    共识:
    - 近期工作趋向于把以动作和观察为条件的视频生成视为具身任务世界模型的候选基底。
    - 视觉质量、动作-帧对齐、可控性和物理合理性越来越被视为不同评估轴，而非单一生成分数。
    - 大型Transformer或扩散骨干可被适配或后训练用于动作条件生成，并以下游策略评估和规划作为应用场景。
    - 已有共识是视觉保真度本身不足以证明世界模型能力，持久性、因果性和校准需要单独评估。
    分歧:
    - 表示方式：有些方法在每帧层级显式注入动作，有些使用独立扩散时间步、学习掩码或异构掩码自回归来耦合动作与视频。
    - 监督/对齐：部分依赖预训练目标或直接条件化，另一部分使用人类偏好奖励、基于DPO的物理抑制或验证器锚定的微断言进行后训练。
    - 评测目标：论文分别面向机器人操作仿真或策略评估、空间推理基准、物理一致性或零样本跨本体性能，这些设置不可互换。
    - 状态假设：概念分析认为当前视频模型大多无状态、缺乏显式状态构建，而方法论文隐含地把上下文或潜在轨迹视为控制任务的充分状态。
    开放问题:
    - 动作条件视频模型需要哪些关于状态和动态的形式假设，才能支持可信的规划与策略评估？
    - 如何超越短时程视觉保真度，用功能基准衡量持久性和因果性？
    - 为何测试时验证器在一个空间推理基准上有改善而在另一个基准上无效？想象视图何时能提供信息而非形成信息瓶颈？
    - 基于人类偏好或DPO的对齐信号能否推广到接触丰富操作之外的领域？
    - 在可用证据中缺少限制说明、代码或数据集细节的方法，其失败边界与可复现条件是什么？
