    - 路线: 实时闭环服务与部署栈
      解决的问题: 降低推理延迟并提供系统级可复现性，使生成式模拟器可用于闭环或交互式场景。
      尚未覆盖: 超出单GPU、多相机或特定部署场景的可扩展性，以及极长序列稳健性仍不确定。
    共识:
    - 高相关度工作正从单纯视频生成转向将世界模型作为可交互模拟器，并以策略训练、评测或闭环控制为目标。
    - 评测重心从像素级视觉质量扩展到动作忠实度、动态一致性、空间一致性和物理合理性。
    - 数据集、基准和开放评测框架被视为核心贡献，尤其在支持跨模型比较时。
    - 长时程一致性和分布转移被反复视为未解决挑战，结果多局限于少数基准领域。
    分歧:
    - 一些方法训练循环世界模型并通过想象轨迹实现零样本迁移，另一些方法通过轻量动作条件模块适配预训练视频扩散或自回归生成模型，这改变了表示、训练成本和可控性。
    - 评测目标不同：有的用Minecraft闭环导航和场景图一致性，有的用nuScenes轨迹条件未来帧生成，有的用机器人视频物理合理性，还有的用上下文强化学习零样本回报。
    - 交互模式不同：有的强调单GPU亚秒级闭环帧自回归服务，有的侧重离线数据集与基准构建，还有的用于基于模型的强化学习优先想象。
    - 对上下文和动作的假设不同：有的假设上下文可观测，有的以显式轨迹或动作命令为条件，还有的通过深度和关键点任务隐式嵌入物理信息。
    开放问题:
