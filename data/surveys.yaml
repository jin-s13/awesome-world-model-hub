  related_work_outline:
  - 'Mainstream direction: Generative diffusion-Transformer world models with auxiliary
    self-supervised or physics-informed objectives are dominant, increasingly aimed
    at embodied robotics, driving, and multi-view video prediction.'
  - 'Shared research pattern: Papers use video prediction or learned latent dynamics
    as the core, add conditioning signals such as context, language, action, or physics,
    and validate through downstream policy training or benchmark rollout.'
  - 'Key differences: Representations range from stochastic latent state-space models
    to pixel-space video diffusion and unified action-video diffusion; supervision,
    evaluation targets, interaction mode, and deployment settings differ.'
  - 'Trend evolution: The evidence moves from model-based RL world models to contextual
    and embodied generative world models, with 2025-2026 benchmarks emphasizing memory
    consistency and action control.'
  - 'Open questions: Whether reported gains isolate the model from surrounding system
    choices, how to achieve long-term memory consistency, and how to generalize to
    novel primitives or unobserved contexts remain open.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer视频世界模型为主，辅以自监督或物理信息目标，越来越多地用于具身机器人、驾驶和多视角视频预测。
  - 研究共性：以视频预测或潜在动力学为核心，加入上下文、语言、动作或物理条件进行条件化，并通过下游策略训练或基准展开来验证。
  - 关键差异：表示方式从随机潜在状态空间到像素级视频扩散和动作-视频统一扩散各不相同；监督信号、评测目标、交互模式和部署场景也不同。
  - 趋势演进：证据从基于模型的强化学习世界模型转向上下文和具身生成世界模型，2025-2026年基准更强调记忆一致性和动作控制。
  - 开放问题：报告增益是否真正隔离了模型贡献，长期记忆一致性如何实现，以及如何泛化到新原语或未观测上下文。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion transformer video world models with masked or auxiliary reconstruction
        objectives
      what_it_solves: Generating long-horizon and multi-view driving video by combining
        diffusion transformers with feature-level mask reconstruction.
      what_remains_open: Evidence is centered on driving datasets; the reported improvement
        is not fully separated from the auxiliary mask task and cross-view module.
    - line: Contextual latent world models for model-based reinforcement learning
      what_it_solves: Improving zero-shot generalization of policies by conditioning
        recurrent state-space world models on observable context values.
      what_remains_open: Assumes observable context and evaluates only two contextual
        RL tasks, leaving broader dynamics and hidden-context settings unverified.
    - line: Efficient stochastic transformer world models for visual control
      what_it_solves: Combining sequence modeling and variational stochasticity to
        train visual RL world models efficiently on limited interaction data.
      what_remains_open: The contribution of the stochastic Transformer design versus
        training recipe is not isolated, and evidence is limited to Atari-style visual
        control.
    - line: Compositional language-conditioned generative world models for robot imagination
      what_it_solves: Enabling generalization to unseen task and goal combinations
        by factorizing video generation according to language primitives.
      what_remains_open: Generalization is bounded by previously seen primitives and
        accurate language parsing; evaluation is limited to simulated robot execution.
    - line: Physics-informed embodied video world models
      what_it_solves: Improving visual fidelity and physical plausibility by jointly
        learning RGB video, temporal depth, and keypoint dynamics.
      what_remains_open: The relative benefit of depth versus keypoint auxiliary tasks
        is not isolated, and limitation or failure analysis is missing.
    - line: Unified action-video diffusion world models for robot pretraining
      what_it_solves: Coupling action and video diffusion in one transformer to pretrain
        policies, forward/inverse dynamics, and video generation from robot data.
      what_remains_open: The absence of visible ablations makes it unclear when action-free
        video, action prediction, or unified diffusion contributes most.
    - line: Benchmarks and metrics for world-model memory consistency and action control
      what_it_solves: Providing datasets and metrics to evaluate spatial consistency,
        memory consistency, and action controllability beyond short-horizon generation
        quality.
      what_remains_open: Benchmarks reveal current models struggle with long-term
        memory and cross-action-space generalization; standardized baselines and downstream
        links are still needed.
    consensus:
    - Recent methods treat world-model learning as generative dynamics learning, often
      using video prediction or latent imagination as the core training signal.
    - There is a broad shift toward conditioning on additional structure such as language,
      context variables, actions, or physics signals to improve generalization.
    - Evaluation is moving beyond visual fidelity to include downstream policy training,
      zero-shot rollout, and consistency or controllability metrics.
    - Several works report that auxiliary objectives or structured conditioning improve
      over monolithic generation, although the evidence is often from a narrow family
      of tasks.
    disagreements:
    - 'Representation choices differ: stochastic latent state-space models, pixel-space
      video diffusion, and unified action-video diffusion make different assumptions
      about where dynamics should be modeled.'
    - 'Supervision signals differ: observable context values, natural language primitives,
      physics auxiliary tasks, and action tokens are used as conditioning or learning
      targets.'
    - 'Evaluation targets differ: some measure RL scores on visual benchmarks, others
      measure video fidelity and physical plausibility, and others measure closed-loop
      memory consistency and action control.'
    - 'Interaction mode differs: many models generate open-loop video or latent rollouts,
      while newer benchmarks and models emphasize closed-loop action-conditioned control.'
    - Deployment assumptions differ across driving datasets, simulated robot tasks,
      and open-domain videos, especially regarding observable context and action-interface
      availability.
    open_questions:
    - What proportion of reported improvements comes from the proposed representation
      or objective versus the surrounding planner, policy, dataset, and implementation
      choices?
    - How can world models maintain long-term memory consistency and generalize across
      action spaces, given benchmark evidence that these remain challenging?
    - Can compositional or contextual world models extend to entirely new primitives
      or unobserved physical contexts beyond combinations seen during training?
    - Which evaluation protocols can separate model contribution from visual quality,
      downstream policy gains, and consistency metrics in a comparable way?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带掩码或辅助重建目标的扩散Transformer视频世界模型
      解决的问题: 通过将扩散Transformer与特征级掩码重建结合，生成长时域和多视角驾驶视频。
      尚未覆盖: 证据集中在驾驶数据集，报告提升尚未与掩码辅助任务和跨视角模块完全解耦。
    - 路线: 用于模型强化学习的上下文潜在世界模型
      解决的问题: 通过将循环状态空间世界模型条件化于可观测上下文值，提升策略的零样本泛化。
      尚未覆盖: 假设上下文可观测，仅在两个上下文强化学习任务上评估，隐藏上下文和更广泛动力学仍未验证。
    - 路线: 用于视觉控制的高效随机Transformer世界模型
      解决的问题: 结合序列建模和变分随机性，在有限交互数据上高效训练视觉强化学习世界模型。
      尚未覆盖: 随机Transformer设计与训练配方的贡献未隔离，证据主要限于Atari类视觉控制。
    - 路线: 面向机器人想象的语言条件组合生成世界模型
      解决的问题: 通过按语言原语分解视频生成，实现对未见任务和目标组合的泛化。
      尚未覆盖: 泛化受限于已见原语和准确语言解析，评估仅限于仿真机器人执行。
    - 路线: 物理信息具身视频世界模型
      解决的问题: 通过联合学习RGB视频、时间深度和关键点动力学，提升视觉保真度和物理合理性。
      尚未覆盖: 深度与关键点辅助任务的相对收益未隔离，局限或失败分析缺失。
    - 路线: 用于机器人预训练的统一动作-视频扩散世界模型
      解决的问题: 在单个Transformer中耦合动作和视频扩散，预训练策略、前向/逆向动力学和视频生成。
      尚未覆盖: 可见消融不足，难以判断无动作视频、动作预测或统一扩散在何时贡献最大。
    - 路线: 世界模型记忆一致性与动作控制的基准和指标
      解决的问题: 提供数据集和指标，在短时域生成质量之外评估空间一致性、记忆一致性和动作可控性。
      尚未覆盖: 基准显示当前模型在长期记忆和跨动作空间泛化上仍困难，还需标准化基线和下游连接。
    共识:
    - 近年方法将世界模型学习视为生成动力学学习，常以视频预测或潜在想象作为核心训练信号。
    - 普遍转向加入语言、上下文变量、动作或物理信号等额外结构来提升泛化。
    - 评测正从视觉保真度扩展到下游策略训练、零样本展开以及一致性或可控性指标。
    - 多项工作报告辅助目标或结构化条件优于单一生成，但证据常来自较窄的任务族。
    分歧:
    - 表示选择不同：随机潜在状态空间、像素级视频扩散和统一动作-视频扩散对动力学建模位置有不同假设。
    - 监督信号不同：可观测上下文值、自然语言原语、物理辅助任务和动作令牌被用作条件或学习目标。
    - 评测目标不同：一些衡量视觉基准上的强化学习分数，一些衡量视频保真度和物理合理性，另一些衡量闭环记忆一致性和动作控制。
    - 交互模式不同：许多模型生成开环视频或潜在展开，而较新基准和模型强调闭环动作条件控制。
    - 部署假设不同：驾驶数据、仿真机器人任务和开放域视频在可观测上下文和动作接口可用性上存在差异。
    开放问题:
    - 报告提升中有多少来自所提表示或目标，而不是周边规划器、策略、数据集和实现选择？
    - 世界模型如何维持长期记忆一致性并跨动作空间泛化？基准证据表明这些仍是挑战。
    - 组合或上下文世界模型能否扩展到训练中未见过的全新原语或未观测物理上下文？
    - 哪些评测协议能够以可比方式区分模型贡献、视觉质量、下游策略增益和一致性指标？
