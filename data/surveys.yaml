  related_work_outline:
  - 'Mainstream direction: Domain-specific world models are concentrating in embodied,
    driving, and interactive applications, with recent work coupling video generation
    to actions, context, or physics for long-horizon and multi-view prediction, exemplified
    by MaskGWM, UWM, RoboScape, and RoboDreamer.'
  - 'Shared research pattern: Adapt generative sequence or diffusion architectures
    to a task by adding conditioning signals such as actions, language primitives,
    context, or physics auxiliary tasks, then evaluate on domain benchmarks or newly
    introduced consistency benchmarks.'
  - 'Key differences: Some work targets driving scene rollout, some robot video-action
    co-modeling, some contextual generalization in reinforcement learning, and some
    memory or action-control evaluation; supervision ranges from paired actions to
    action-free video and observable context variables.'
  - 'Trend evolution: Within the 2023-2026 frontier visible in this packet, work is
    moving from efficient Atari world models toward driving and robotics, and toward
    memory, spatial consistency, and action-control benchmarks; the trend emphasizes
    controllability, consistency, and generalization more than visual quality alone.'
  - 'Open questions: Real-world closed-loop transfer, long-term memory consistency,
    scalable evaluation of physical plausibility, generalization beyond seen primitives
    or contexts, and training under limited or unobservable supervision remain unresolved.'
  related_work_outline_zh:
  - 主流方向：领域化世界模型向具身、驾驶与交互应用集中，近期工作将视频生成与动作、上下文或物理信息耦合，用于长时域、多视角预测，如MaskGWM、UWM、RoboScape和RoboDreamer。
  - 研究共性：在通用生成序列或扩散架构上加入条件信号，如动作、语言原语、上下文或物理辅助任务，并以领域基准或新建一致性基准评测。
  - 关键差异：驾驶场景回放、机器人视频-动作联合建模、强化学习上下文泛化、记忆与动作控制评测并存；监督信号从配对动作到无动作视频和可观测上下文变量不同。
  - 趋势演进：在证据包可见的2023-2026前沿中，工作从高效Atari世界模型转向驾驶与机器人，并转向记忆、空间一致性和动作控制基准；趋势由视觉质量转向可控性、一致性和泛化。
  - 开放问题：真实闭环迁移、长期记忆一致性、物理合理性可扩展评测、超越已见原语或上下文组合的泛化，以及有限或不可观测监督下的训练仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving simulation and multi-view scene prediction
      what_it_solves: Long-horizon and multi-view driving scene video prediction using
        diffusion transformers and mask reconstruction for scene modeling and policy
        evaluation.
      what_remains_open: Whether validation and rollout gains align with real-world
        driving safety or operational outcomes; limitation details are often not stated.
    - line: Embodied robot video-action world modeling
      what_it_solves: Generating action-conditioned or language-conditioned robot
        videos and learning policy or dynamics from large robot datasets, with physics
        or compositional signals to improve plausibility.
      what_remains_open: Real-robot transfer is often unevaluated; compositional generalization
        depends on seen primitive combinations and accurate instruction parsing; several
        works omit limitations.
    - line: Contextual and memory-consistent model-based control
      what_it_solves: Improving zero-shot generalization to observable context changes
        and evaluating long-term spatial or memory consistency in interactive environments
        such as games and open-world navigation.
      what_remains_open: Assumes context observability and uses narrow task coverage;
        long-term memory consistency across action spaces and viewpoints remains unresolved.
    - line: Benchmarks for consistency and action control
      what_it_solves: Building loop-based navigation or closed-loop revisited datasets
        and metrics to measure spatial consistency, memory consistency, and action
        control in world models.
      what_remains_open: Some benchmarks are new and report limited or no baseline
        results; generalization beyond specific scenes, action spaces, or game environments
        is uncertain.
    consensus:
    - Domain application work is shifting evaluation emphasis from short visual generation
      quality toward long-horizon controllability, consistency, and policy usefulness.
    - Conditioning video or dynamics models on actions, language, context, or auxiliary
      physical signals is a common adaptation strategy.
    - Scalable generative architectures, especially diffusion transformers, recur
      across driving, robotics, and reinforcement learning world models.
    - Several works report improved generalization on domain benchmarks, but real-world
      closed-loop evidence is frequently absent or unstated.
    - Missing limitation sections and partial evaluation details create reproducibility
      and verification gaps.
    disagreements:
    - Some approaches predict video only, while others jointly model video and actions
      or latent state dynamics.
    - 'Supervision signals differ: paired actions, action-free video, observable context
      values, physics auxiliary tasks, and language-primitive decomposition.'
    - 'Evaluation targets differ: driving dataset metrics, robot task success or policy
      transfer, Atari human-normalized scores, spatial and memory consistency, and
      action-control benchmarks.'
    - 'Interaction settings differ: game and reinforcement learning benchmarks, driving
      logs, robot datasets, simulation, or open-world navigation.'
    - Assumptions about context observability, primitive availability, and real-robot
      deployment vary, leading to different generalization claims.
    open_questions:
    - What evidence links improved driving, robot, or game world-model metrics to
      real-world safety or operational outcomes?
    - How can world models maintain long-term spatial and memory consistency over
      horizons longer than current benchmarks?
    - Which physically grounded or policy-relevant metrics are needed when visual
      fidelity alone is insufficient?
    - To what extent can methods generalize beyond observed contexts, primitive combinations,
      or action spaces?
    - What supervision is minimal or necessary when action labels are scarce, context
      is unobservable, or environments change?
    - The evidence packet contains no healthcare or scientific simulation application
      examples, so domain generalization beyond driving, robotics, and game or reinforcement
      learning settings cannot be assessed.
