  related_work_outline:
  - 'Mainstream direction: Generative world models are being adapted to concrete domains,
    especially driving and robotics, using diffusion or transformer architectures
    for video prediction, action-coupled dynamics, and policy learning.'
  - 'Shared research pattern: Most works learn a latent or video dynamics model from
    high-dimensional observations, then evaluate it through generation quality, downstream
    policy performance, or consistency protocols; recent methods add auxiliary objectives
    or benchmarks to expose memory, spatial, and action-control failures.'
  - 'Key differences: Representation and supervision diverge across recurrent state-space
    RL models, transformer-VAEs, diffusion transformers, physics-informed joint training,
    and coupled video-action diffusion; evaluation settings range from Atari and contextual
    RL to driving, Minecraft, and robot datasets.'
  - 'Trend evolution: From efficient model-based RL on Atari around 2023 toward large-scale
    embodied generative world models and evaluation protocols in 2024-2026, with growing
    attention to long-horizon, multi-view, memory, and action-consistency behavior.'
  - 'Open questions: Real-world transfer, long-term consistency, zero-shot generalization
    to unseen dynamics or primitives, and robust evaluation protocols remain unresolved;
    several high-ranked works have missing limitation or reproducibility details that
    create verification gaps.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型正被适配到驾驶和机器人等具体应用领域，采用扩散或Transformer架构进行视频预测、动作耦合动力学和策略学习。
  - 研究共性：多数工作从高维观测中学习潜在或视频动力学模型，并通过生成质量、下游策略性能或一致性协议评估；近期方法增加辅助任务或基准以揭示记忆、空间和动作控制失败。
  - 关键差异：表示和监督信号不同，如循环状态空间、Transformer-VAE、扩散Transformer、物理信息联合训练和视频-动作耦合扩散；评测场景从Atari和上下文RL扩展到驾驶、Minecraft和机器人数据。
  - 趋势演进：从2023年前后高效模型基强化学习，转向2024-2026年大规模具身生成世界模型和评测协议，更关注长时域、多视角、记忆和动作一致性。
  - 开放问题：真实环境迁移、长期一致性、对未知动力学或原语的零样本泛化及稳健评测协议仍未解决；部分高排名工作缺少局限性与可复现细节，构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and simulation world models
      what_it_solves: Uses diffusion-based generative world models for long-horizon
        and multi-view driving video prediction, supporting scene forecasting and
        closed-loop simulation.
      what_remains_open: Evidence mainly covers video prediction quality on existing
        driving datasets; real-world safety, operational alignment, and limitation
        details remain verification gaps.
    - line: Robot video generation and policy learning
      what_it_solves: Learns conditional video generation from language, goals, and
        temporal physics signals to synthesize robot plans or support policy training
        and evaluation.
      what_remains_open: Generalization is constrained to seen language primitives
        or trained robot scenarios; real-robot execution and cross-embodiment transfer
        are not established.
    - line: Model-based reinforcement learning with world models
      what_it_solves: Trains policies on imagined trajectories from learned dynamics
        for sample-efficient control, with contextual variants targeting zero-shot
        dynamics transfer.
      what_remains_open: Context observability and small benchmark coverage limit
        claims; broader real-world or non-stationary dynamics remain untested.
    - line: Unified action-video diffusion pretraining
      what_it_solves: Couples action and video generation in one transformer so the
        same model can represent policy, forward or inverse dynamics, or a generative
        world model for multitask robot data.
      what_remains_open: Long-term memory consistency, action-control boundaries,
        and deployment beyond pretraining datasets are not resolved in the provided
        evidence.
    - line: Consistency and control evaluation protocols for open-domain world models
      what_it_solves: Constructs loop-based navigation and open-domain video evaluation
        sets to quantify spatial consistency, memory consistency, and action control.
      what_remains_open: These protocols define evaluation metrics but do not yet
        show how scores transfer to downstream task performance or real safety outcomes.
    consensus:
    - Applications increasingly adopt generative video-dynamics formulations that
      jointly model observations and actions rather than only learning from abstract
      state transitions.
    - Transformer and diffusion-based architectures dominate recent embodied world
      model designs, while recurrent state-space or token-efficient alternatives persist
      for sample-efficient RL.
    - Beyond visual fidelity, papers converge on the need to evaluate temporal stability,
      spatial consistency, and action responsiveness, not merely frame quality.
    - Most top-paper evidence treats downstream policy utility or evaluation metrics
      as the application value signal, though several works lack explicit limitation
      statements.
    disagreements:
    - Representation differs between recurrent state-space latent dynamics, VAE-transformer
      world models, diffusion transformers, and unified video-action diffusion transformers.
    - Supervision ranges from next-frame or video reconstruction and physics auxiliary
      tasks to context-conditioned RL optimization and coupled video-action denoising.
    - 'Evaluation targets diverge: sample efficiency on Atari, contextual zero-shot
      on two CARL tasks, driving datasets such as nuScenes, OpenDV-2K and Waymo, Minecraft
      loop navigation, and large robot datasets.'
    - 'Interaction mode differs: some models generate passive observations, some accept
      language or image goals, and others condition on explicit actions or context
      values.'
    - Assumption boundaries differ, including observable context values, parseable
      language primitives, deterministic navigation loops, and availability of large-scale
      action-annotated robot or driving data.
    open_questions:
    - Do driving world-model gains on nuScenes, OpenDV-2K, or Waymo translate to better
      closed-loop driving safety and operational outcomes?
    - Can robot video world models generalize beyond seen primitive combinations,
      observable contexts, or simulation-only execution to real robot settings?
    - How should memory consistency and action control be measured without overfitting
      to pixel-level or scene-graph shortcuts?
    - What is the real cross-embodiment and cross-domain transfer capability of physics-informed
      or unified action-video models?
    - 'Which evidence gaps matter most: missing limitations, missing code/data links,
      or absent baseline metrics in high-ranked application papers?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶场景预测与仿真世界模型
      解决的问题: 使用扩散生成式世界模型进行长时域和多视角驾驶视频预测，以支持场景预测和闭环仿真。
      尚未覆盖: 证据主要集中在现有驾驶数据集上的视频预测质量；真实安全性、运营对齐和局限性说明仍为验证缺口。
    - 路线: 机器人视频生成与策略学习
      解决的问题: 通过语言、目标和时间物理信号进行条件视频生成，合成机器人计划或支持策略训练与评估。
      尚未覆盖: 泛化受限于已见语言原语或已训练机器人场景；真实机器人执行和跨本体迁移尚未被证实。
    - 路线: 基于模型的强化学习世界模型
      解决的问题: 在想象轨迹上训练策略，以实现样本高效的视觉控制；上下文变体针对零样本动力学迁移。
      尚未覆盖: 上下文可观测假设和较小基准覆盖限制结论；更广泛真实或非平稳动力学未验证。
    - 路线: 统一视频-动作扩散预训练
      解决的问题: 在单个Transformer中耦合动作与视频生成，使同一模型可表示策略、前向或逆向动力学或生成器。
      尚未覆盖: 长期记忆一致性、动作控制边界以及超出预训练数据集的部署能力未解决。
    - 路线: 开放域世界模型一致性与控制评测协议
      解决的问题: 构建循环导航和开放域视频评测集，量化空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些协议定义评测指标，但未显示分数如何迁移到下游任务表现或真实安全结果。
    共识:
    - 应用研究正采用生成式视频动力学形式，联合建模观测与动作，而非仅学习抽象状态转移。
    - Transformer与扩散架构在近期具身世界模型中占主导，但循环状态空间或令牌高效模型仍用于样本效率强化学习。
    - 除了视觉保真度，论文越来越关注时间稳定性、空间一致性和动作响应性评估。
    - 多数高排名证据把下游策略效用或评测指标作为应用价值信号，但若干工作缺少明确局限性说明。
    分歧:
    - 表示方式不同：循环状态空间潜在动力学、VAE-Transformer、扩散Transformer以及统一视频-动作扩散Transformer。
    - 监督信号不同：从下一帧或视频重建、物理辅助任务到上下文条件强化学习和视频-动作联合去噪。
