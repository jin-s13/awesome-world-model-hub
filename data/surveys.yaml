  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative and self-supervised world
    models that learn visual dynamics from video, often with diffusion or transformer
    objectives, to support long-horizon prediction, robot control, and driving simulation.'
  - 'Shared research pattern: Papers couple visual prediction with an auxiliary signal—context
    variables, mask reconstruction, depth/keypoint dynamics, language primitives,
    or action diffusion—to improve generalization beyond short-horizon reconstruction.'
  - 'Key differences: They differ in representation (stochastic state-space, VAE,
    diffusion transformer, unified video-action diffusion), supervision target, interaction
    mode, and evaluation setting; some measure control/zero-shot policy, others memory/spatial
    consistency, visual fidelity, or physical plausibility.'
  - 'Trend evolution: Across 2023–2026, the field shifts from sample-efficient model-based
    RL on Atari toward large-scale video generation and closed-loop, action-controlled
    benchmarks for spatial memory, embodied control, and driving.'
  - 'Open questions: Whether reported gains transfer beyond small task sets and observed
    contexts; how to isolate model contribution from planner/system choices; how to
    evaluate long-term memory consistency and action generalization without metric
    shortcuts.'
  related_work_outline_zh:
  - 主流方向：近期研究以生成式与自监督世界模型为主，通过视频扩散或Transformer目标学习视觉动力学，支持长时域预测、机器人控制与驾驶仿真。
  - 研究共性：多数工作将视觉预测与辅助信号耦合，如上下文变量、掩码重建、深度/关键点、语言原语或动作扩散，以提升泛化。
  - 关键差异：表示方式、监督目标、交互模式与评估设置不同；有的测零样本策略或控制，有的测记忆一致性、空间一致性、视觉逼真度或物理合理性。
  - 趋势演进：从2023至2026年，领域由Atari样本高效模型强化学习转向大规模视频生成，并引入闭环、动作控制的时空记忆与具身基准。
  - 开放问题：报告增益是否迁移到小任务集和已观测上下文之外；如何隔离模型贡献与规划器/系统选择；如何稳健评测长期记忆一致性与动作泛化。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based visual world modeling
      what_it_solves: Generates long-horizon and multi-view video predictions for
        driving and embodied settings.
      what_remains_open: Transfer beyond reported driving datasets remains uncertain;
        missing limitation details leave failure modes unverified.
    - line: Masked reconstruction objectives for world models
      what_it_solves: Adds feature-level masked context learning to generative diffusion
        to strengthen spatial-temporal representation.
      what_remains_open: Whether mask design generalizes beyond driving-style videos
        and how it interacts with other architectures is not fully shown.
    - line: Contextual dynamics models for model-based RL
      what_it_solves: Conditions latent state inference and dynamics on observable
        context to improve zero-shot policy generalization.
      what_remains_open: Assumes observability of context values and is evaluated
        only on two CARL tasks; unobservable-context settings remain unchecked.
    - line: Stochastic transformer state-space world models
      what_it_solves: Efficiently learns visual dynamics and imagined policy training
        for sample-constrained control benchmarks.
      what_remains_open: Evidence does not fully separate model contribution from
        environment benchmark and training recipe effects; limitations are not reported.
    - line: Compositional language-conditioned video world models
      what_it_solves: Factorizes video generation through language primitives to synthesize
        plans for unseen goal combinations.
      what_remains_open: Generalization is bounded to seen primitive combinations;
        real-robot validation is absent.
    - line: Physics-informed embodied world models
      what_it_solves: Adds depth prediction and keypoint dynamics to improve visual
        fidelity and physical plausibility of generated robot video.
      what_remains_open: Downstream policy utility is reported but not causally isolated;
        no limitations or failure cases are provided.
    - line: Unified video-action diffusion world models
      what_it_solves: Couples video and action diffusion in one transformer to pretrain
        policies and dynamics on large robot data.
      what_remains_open: Flexibility is demonstrated, but trade-offs among policy,
        forward/inverse dynamics, and video generation remain underexplored.
    - line: Spatial consistency and memory benchmarks
      what_it_solves: Provides datasets and scores for long-horizon spatial consistency,
        memory, and action control in open/closed-loop settings.
      what_remains_open: Benchmark construction papers may lack baseline experimental
        results; metric validity across domains is still being established.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects.
      what_remains_open: Visible evidence often lacks limitation or ablation detail,
        leaving contribution attribution unresolved.
    consensus:
    - Recent world models treat video generation as a central training objective,
      not only a downstream output.
    - 'Several methods couple visual dynamics with an auxiliary signal to improve
      generalization: context, action, language primitives, or physics-related cues.'
    - There is a shared move toward evaluating beyond short-horizon reconstruction,
      including long-horizon rollout, spatial consistency, memory, and action control.
    - Self-supervised or generative pretraining on visual experience is used to learn
      policies, plans, or dynamics without relying only on expert demonstrations.
    - Reported gains are measured on standardized benchmarks or datasets, but methodology
      evidence often omits limitations and ablation detail.
    disagreements:
    - 'Representation choices differ: stochastic state-space models, VAE-transformer
      hybrids, diffusion transformers, and unified video-action transformers coexist.'
    - Some methods use explicit observed context conditioning for zero-shot dynamics
      generalization, while others use language-primitive decomposition or physics-informed
      auxiliary objectives.
    - 'Evaluation targets diverge: sample-efficient Atari control, zero-shot contextual
      RL, driving video prediction, robot plan synthesis, and closed-loop memory consistency.'
    - 'Interaction modes differ: open-loop video generation, closed-loop action-controlled
      rollout, imagined policy training, and video-based robot execution.'
    - Deployment and evidence settings vary from simulation and small benchmark suites
      to large multitask robot datasets and open-domain video collections.
    open_questions:
    - Can mask-reconstruction and diffusion objectives transfer to non-driving or
      less structured visual dynamics?
    - How much of reported zero-shot or control gains comes from the learned model
      rather than the planner, task prior, or benchmark-specific recipe?
    - Can unobservable context, novel language primitives, and unseen action spaces
      be handled without assuming predefined structure?
    - Which benchmark scores best capture long-term memory consistency and closed-loop
      action control without pixel-level shortcuts?
    - Does physics-informed video generation causally improve downstream policy learning
      and evaluation, or only visual plausibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散式视觉世界建模
      解决的问题: 为驾驶和具身场景生成长时域、多视角视频预测。
      尚未覆盖: 在已报告驾驶数据集之外的迁移仍不明确；缺少限制说明使失败模式未经验证。
    - 路线: 掩码重建世界模型目标
      解决的问题: 将特征级掩码上下文学习加入生成扩散，以强化时空表示。
      尚未覆盖: 掩码设计是否适用于驾驶视频之外的动态，以及与其他架构的相互作用仍未充分展示。
    - 路线: 上下文动力学模型
      解决的问题: 将潜在状态推断和动力学条件化于可观测上下文，以提升策略零样本泛化。
      尚未覆盖: 假设上下文值可观测，且仅在CARL两个任务上评估；不可观测上下文场景尚未覆盖。
    - 路线: 随机Transformer世界模型
      解决的问题: 在样本受限控制基准上高效学习视觉动力学并进行想象策略训练。
      尚未覆盖: 证据未完全分离模型贡献与环境基准、训练配方的影响；未报告局限性。
    - 路线: 组合式语言条件视频世界模型
      解决的问题: 通过语言原语分解视频生成，以合成未见目标组合的视频规划。
      尚未覆盖: 泛化受限于训练中见过的原语组合；缺乏真实机器人验证。
    - 路线: 物理信息具身世界模型
      解决的问题: 引入深度预测和关键点动力学，提高机器人视频的视觉保真度与物理合理性。
      尚未覆盖: 下游策略效用已报告但未进行因果隔离；未提供局限或失败案例。
    - 路线: 统一视频-动作扩散世界模型
      解决的问题: 在单个Transformer中耦合视频与动作扩散，以在大规模机器人数据上预训练策略和动力学。
      尚未覆盖: 策略、前向/逆向动力学与视频生成之间的权衡尚未充分探讨。
    - 路线: 空间一致性与记忆基准
      解决的问题: 为长时域空间一致性、记忆和动作控制提供数据集与评分。
      尚未覆盖: 基准构建论文可能缺乏基线实验结果；跨领域度量有效性仍需验证。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素的影响。
      尚未覆盖: 可见证据常缺少局限性与消融细节，导致贡献归因仍不明确。
    共识:
    - 近期世界模型普遍将视频生成作为核心训练目标，而不只是下游输出。
    - 多个方法通过上下文、动作、语言原语或物理相关线索等辅助信号来提升泛化。
    - 评估正在超越短时域重建，转向长时域展开、空间一致性、记忆和动作控制。
    - 基于视觉经验的自监督或生成式预训练被用于学习策略、规划或动力学。
    - 报告增益通常在标准化基准上测量，但方法学证据常缺少局限性与消融细节。
    分歧:
    - 表示选择不同：随机状态空间、VAE-Transformer、扩散Transformer和统一视频-动作Transformer并存。
    - 监督方式不同：显式上下文条件、语言原语分解、物理信息辅助目标或掩码重建。
    - 评测目标不同：样本高效Atari控制、零样本上下文强化学习、驾驶视频预测、机器人规划合成和闭环记忆一致性。
    - 交互模式不同：开环视频生成、闭环动作控制展开、想象策略训练和基于视频的机器人执行。
    - 部署与证据环境不同：从仿真和小型基准到大规模多任务机器人数据集与开放域视频集合。
    开放问题:
    - 掩码重建与扩散目标能否迁移到非驾驶或结构更弱的视觉动力学？
    - 报告中的零样本或控制增益有多少来自学习模型，而非规划器、任务先验或基准特定配方？
    - 在不可观测上下文、新语言原语和未见动作空间条件下，能否不依赖预定义结构？
    - 哪些基准分数最能捕捉长期记忆一致性和闭环动作控制，同时避免像素级捷径？
    - 物理信息视频生成是否因果地改善下游策略学习与评估，而不只是视觉合理性？
