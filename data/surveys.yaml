  related_work_outline:
  - 'Mainstream direction: Building video-based world models that support action-conditioned
    prediction and interactive decision-making, with a strong emphasis on physical
    plausibility and alignment with task objectives.'
  - 'Shared research pattern: Using scalable diffusion transformers to couple action
    and video modalities, pretraining on large robotic datasets, and introducing post-training
    or reward-driven alignment to improve physical realism and task consistency.'
  - 'Key differences: Some works fine-tune model parameters end-to-end, while others
    adapt closed-source models via learned masks; alignment strategies range from
    multi-dimensional reward modeling to direct preference optimization; evaluation
    targets vary from visual fidelity to functional benchmarks for spatial reasoning
    and zero-shot generalization.'
  - 'Trend evolution: Within the 2024–2026 frontier, there is a clear shift from static
    video generation toward interactive, action-conditioned world models, accompanied
    by growing investment in physical plausibility, zero-shot evaluation, and conceptual
    taxonomies that bridge classical world model theory with modern video generation.'
  - 'Open questions: Whether current architectures can achieve persistent state representations
    and causal reasoning; how to design alignment methods that scale across diverse
    tasks and embodiments; and how to construct functional benchmarks that reliably
    predict real-world task performance.'
  related_work_outline_zh:
  - 主流方向：构建支持动作条件化预测和交互式决策的视频世界模型，特别强调物理合理性和任务目标的对齐。
  - 研究共性：采用可扩展的扩散Transformer耦合动作和视频模态，在大规模机器人数据集上预训练，并通过后训练或奖励驱动对齐来提升物理真实性和任务一致性。
  - 关键差异：部分工作端到端微调模型参数，另一些则通过学到的掩码适应闭源模型；对齐策略从多维奖励建模到直接偏好优化；评估目标从视觉保真度扩展到空间推理和零样本泛化的功能基准。
  - 趋势演进：在2024-2026年的前沿范围内，明显从静态视频生成转向交互式、动作条件化的世界模型，同时对物理合理性、零样本评估以及连接经典世界模型理论与现代视频生成的概念分类法投入增加。
  - 开放问题：当前架构能否实现持久状态表示和因果推理；如何设计能在多样化任务和实体上扩展的对齐方法；如何构建能可靠预测真实世界任务表现的功能基准。
  literature_review:
    line_of_work_matrix:
    - line: Action-video coupling and representation learning
      what_it_solves: Learning forward dynamics and policy from multimodal action-observation
        sequences, enabling controllable video prediction and flexible downstream
        use such as planning and policy evaluation.
      what_remains_open: Long-term persistence of objects and causal inference remain
        weak; explicit state construction is absent, and coupling methods often rely
        on curated datasets with dense action labels, limiting few-shot adaptation.
    - line: Physical plausibility and task alignment
      what_it_solves: Aligning generated rollouts with physical laws, task logic,
        and human preferences, reducing unphysical behaviors while preserving visual
        quality.
      what_remains_open: Alignment depends on human preference data that is subjective
        and costly to scale; methods are tested mainly on contact-rich manipulation,
        and generalization to broader domains is unverified.
    - line: Evaluation and verification of world model reasoning
      what_it_solves: Assessing whether world models enable reliable spatial reasoning
        and decision-making, and designing test-time verifiers that can select trajectories
        consistent with micro-claims about the world.
      what_remains_open: Current world models form an information bottleneck where
        imagined views do not enrich fine-grained reasoning; verifiers suffer from
        poor calibration and action biases, and no method achieves consistent scaling
        on harder benchmarks.
    - line: Conceptual taxonomies and theoretical grounding
      what_it_solves: Organizing the fragmented design space of video generation as
        world models into categories of state construction and dynamics modeling,
        and advocating for functional benchmarks over visual fidelity.
      what_remains_open: The taxonomy has not yet been validated through new model
        designs; it remains a conceptual framework with no direct empirical evidence
        that the proposed categories guide improvements in persistence or causality.
    consensus:
    - World models must move beyond passive video generation and support action-conditioned,
      interactive prediction for embodied tasks.
    - Physical realism and task consistency are critical for downstream utility, and
      simple visual fidelity metrics are insufficient.
    - Large-scale pretraining on diverse robotic datasets and diffusion transformer
      architectures are effective backbones.
    - There is a shared need for benchmarks that evaluate causal reasoning and physical
      persistence, not just short-term prediction accuracy.
    disagreements:
    - 'How to inject action control: fine-tuning a unified transformer end-to-end
      versus adapting a pretrained closed-source model through a learned mask or parallel
      context block.'
    - 'How to enforce physical plausibility: using multi-dimensional reward models
      trained on human preferences versus directly optimizing with DPO-style discriminators
      that suppress unphysical behaviors.'
    - 'What constitutes a meaningful evaluation: task-specific planning scores (e.g.,
      Push-T IoU) versus zero-shot physical consistency benchmarks that decouple visual
      quality from action alignment.'
    - Whether state representation should be implicit (context-based) or explicit
      (latent compression), and how this choice affects long-horizon persistence and
      causality.
    open_questions:
    - How can we incorporate explicit state construction into video diffusion models
      to achieve temporally persistent object representations and causal reasoning?
    - What alignment objective generalizes beyond contact-rich manipulation to other
      domains such as navigation or deformable object interaction, without requiring
      prohibitive amounts of human preference data?
    - Can test-time verifiers be made robust enough to produce consistent scaling,
      or does the information bottleneck in current world models require fundamentally
      different architectures?
    - How can the proposed conceptual taxonomies be translated into concrete design
      principles that demonstrably improve physical persistence and causal inference
      in real-world tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作-视频耦合与表示学习
      解决的问题: 从多模态动作-观测序列中学习前向动态和策略，实现可控视频预测，并灵活用于规划和策略评估等下游任务。
      尚未覆盖: 长期的对象持久性和因果推理能力仍然不足；缺乏显式状态构建，耦合方法通常依赖密集动作标注的精选数据集，限制了少样本适应能力。
    - 路线: 物理合理性与任务对齐
      解决的问题: 使生成的轨迹与物理定律、任务逻辑和人类偏好对齐，在保持视觉质量的同时抑制非物理行为。
      尚未覆盖: 对齐依赖人类偏好数据，主观且难以大规模扩展；方法主要在接触丰富的操作任务上测试，对其他领域的泛化能力未经验证。
    - 路线: 世界模型推理的评估与验证
      解决的问题: 评估世界模型是否支持可靠的空间推理和决策，并设计测试时验证器，能够选择与关于世界的微断言一致的轨迹。
      尚未覆盖: 当前世界模型形成信息瓶颈，想象的视图无法丰富细粒度推理；验证器存在校准不良和动作偏差，任何方法都未能在更难的基准上实现一致的缩放。
    - 路线: 概念分类与理论根基
      解决的问题: 将视频生成作为世界模型的碎片化设计空间组织为状态构建和动态建模的分类，并倡导从视觉保真度转向功能基准。
      尚未覆盖: 该分类法尚未通过新模型设计进行验证；它仍是一个概念框架，缺乏直接经验证据表明所提出的类别能指导持久性或因果性方面的改进。
    共识:
    - 世界模型必须超越被动视频生成，支持面向具身任务的动作条件化、交互式预测。
    - 物理真实性和任务一致性对下游应用至关重要，单纯的视觉保真度指标不足够。
    - 在多样化机器人数据集上进行大规模预训练，并采用扩散Transformer架构，是有效的技术路线。
    - 普遍需要能评估因果推理和物理持久性的基准，而不仅仅是短期预测精度。
    分歧:
    - 如何注入动作控制：端到端微调统一Transformer，还是通过学到的掩码或并行上下文块适应预训练闭源模型。
    - 如何强化物理合理性：使用基于人类偏好训练的多维奖励模型，还是直接使用DPO风格的判别器进行优化以抑制非物理行为。
    - 什么构成有意义的评估：特定任务的规划得分（如Push-T IoU）还是解耦视觉质量与动作对齐的零样本物理一致性基准。
    - 状态表示应该是隐式（基于上下文）还是显式（潜在压缩），以及这一选择如何影响长期持久性和因果性。
    开放问题:
    - 如何将显式状态构建融入视频扩散模型，以实现时间上持久的对象表示和因果推理？
    - 什么样的对齐目标能够泛化到接触丰富操作之外的领域，如导航或可变形物体交互，而不需要高成本的人类偏好数据？
    - 测试时验证器能否变得足够鲁棒以实现一致的缩放，还是当前世界模型的信息瓶颈需要根本不同的架构？
    - 如何将提出的概念分类法转化为具体的设计原则，从而在真实世界任务中显著提升物理持久性和因果推理？
