  related_work_outline:
  - 'Mainstream direction: Applying world models to embodied agents, autonomous driving,
    and interactive games, primarily through video prediction and latent dynamics
    to enable generalization across tasks and environments.'
  - 'Shared research pattern: Most works adopt diffusion-based or transformer-based
    video generation architectures, often combined with self-supervised tasks like
    mask reconstruction, and evaluate on visual fidelity and task success.'
  - 'Key differences: Domain-specific inductive biases (physics knowledge, contextual
    conditioning, compositional primitives) vs. generic architectures; supervision
    signals range from action-free video to coupled action-video diffusion; environments
    span driving, robotics, and games.'
  - 'Trend evolution: Starting from efficient game-based world models (Atari), the
    focus has shifted to complex driving and robotic scenarios, with increasing incorporation
    of physical and structural priors, and a growing emphasis on standardized benchmarks
    for memory and spatial consistency.'
  - 'Open questions: Cross-domain and cross-embodiment transfer remains unverified;
    physical plausibility and long-term memory consistency are not guaranteed; real-world
    deployment beyond simulation is largely unexplored.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于具身智能、自动驾驶和交互式游戏，主要通过视频预测和潜在动力学实现跨任务和环境的泛化。
  - 研究共性：大多采用基于扩散或Transformer的视频生成架构，结合掩码重建等自监督任务，并在视觉保真度和任务成功率上评估。
  - 关键差异：领域特定的归纳偏置（物理知识、上下文条件、组合原语）与通用架构；监督信号从无动作视频到耦合动作-视频扩散；环境覆盖驾驶、机器人和游戏。
  - 趋势演进：从高效的游戏世界模型（Atari）开始，转向复杂的驾驶和机器人场景，越来越多地引入物理和结构先验，并出现用于记忆和空间一致性的标准化基准。
  - 开放问题：跨域和跨本体迁移尚未验证；物理合理性和长期记忆一致性无法保证；从仿真到真实世界的部署仍未充分探索。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotic manipulation and loco-manipulation
        by learning compositional video generation, physics-informed dynamics, or
        unified action-video diffusion, enabling generalization to new instructions
        or objects.
      what_remains_open: Evaluation is largely confined to simulation; real-robot
        execution is rarely demonstrated; transfer across different robot morphologies,
        tasks, and datasets is not systematically validated.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Generating long-horizon, multi-view driving videos with mask
        reconstruction and diffusion transformers, achieving zero-shot generalization
        to new driving datasets.
      what_remains_open: No evidence that simulation improvements translate to real-world
        safety or closed-loop policy performance; alignment between visual fidelity
        and operational decision-making remains unmeasured.
    - line: Interactive agents and games
      what_it_solves: Building efficient world models for game environments (e.g.,
        Atari) and constructing benchmarks for spatial consistency, memory, and action
        controllability in open worlds like Minecraft.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change is not addressed; benchmarks reveal that current models struggle with
        long-term memory and cross-action-space generalization.
    consensus:
    - Video generation is the dominant output modality for world models, serving as
      a proxy for learned dynamics and forward prediction.
    - Diffusion and transformer architectures are widely adopted for their scalability
      and capacity to model long-range dependencies.
    - Evaluations emphasize visual fidelity and task-specific success rates, with
      a growing recognition of the need for dedicated benchmarks measuring consistency
      and control.
    - Finetuning or pretraining on multi-task datasets is a common strategy to improve
      policy robustness and generalization.
    disagreements:
    - 'Representation: Some models learn latent dynamics with variational autoencoders
      (e.g., stochastic state-space models), while others operate directly in pixel
      space with diffusion.'
    - 'Supervision: Works differ in whether they require action labels (coupled video-action
      diffusion), rely solely on video (mask reconstruction), or incorporate auxiliary
      physics signals (depth, keypoints).'
    - 'Evaluation target: Driving models target zero-shot cross-dataset generalization;
      robotics models target compositional task generalization; game-oriented works
      target human-normalized performance or memory consistency.'
    - 'Interaction mode: Some world models are used as rollout simulators for policy
      training, others as video planners for subgoal visualization, and still others
      as unified policy and dynamics models.'
    - 'Deployment setting: Driving, robotics, and game environments are treated as
      separate domains with distinct assumptions about action spaces, viewpoints,
      and physics.'
    open_questions:
    - Can a single world model generalize across driving, robotics, and gaming without
      domain-specific engineering?
    - How should physical plausibility and long-term memory consistency be measured
      and enforced in open-world settings?
    - What benchmarks and metrics can bridge the gap between simulated video quality
      and real-world task success or safety?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 通过组合式视频生成、物理信息动力学或统一动作-视频扩散，将世界模型适配到机器人操作和移动操作任务，实现对未见指令或物体的泛化。
      尚未覆盖: 评估主要限于仿真；真实机器人执行极少展示；跨不同机器人形态、任务和数据集的迁移尚未系统验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用掩码重建和扩散Transformer生成长时域、多视角驾驶视频，实现对新的驾驶数据集的零样本泛化。
      尚未覆盖: 没有证据表明仿真提升能转化为真实世界安全或闭环策略性能；视觉保真度与操作决策之间的一致性未被测量。
    - 路线: 交互式智能体与游戏
      解决的问题: 为游戏环境（如Atari）构建高效世界模型，并为Minecraft等开放世界中的空间一致性、记忆和动作可控性构建基准。
      尚未覆盖: 未解决环境规则、目标或用户交互变化时的泛化问题；基准测试表明当前模型难以维持长期记忆和跨动作空间泛化。
    共识:
    - 视频生成是主要的世界模型输出模态，作为学习动力学和进行前向预测的代理。
    - 扩散和Transformer架构因其可扩展性和建模长程依赖的能力而被广泛采用。
    - 评估以视觉保真度和任务特定成功率为重点，并逐渐认识到需要专门衡量一致性和控制能力的基准。
    - 在多任务数据集上微调或预训练是提升策略鲁棒性和泛化性的常见策略。
    分歧:
    - 表示方式：部分模型使用变分自编码器学习潜在动力学（如随机状态空间模型），而其他模型直接在像素空间用扩散模型操作。
    - 监督信号：有的依赖动作标签（耦合视频-动作扩散），有的仅用视频（掩码重建），有的融入辅助物理信号（深度、关键点）。
    - 评测目标：驾驶模型关注零样本跨数据集泛化；机器人模型关注组合任务泛化；游戏相关工作关注人类标准化性能或记忆一致性。
    - 交互模式：有的世界模型作为策略训练的走样模拟器，有的作为子目标可视化的视频规划器，还有的作为统一的策略与动力学模型。
    - 部署场景：驾驶、机器人和游戏环境被视为独立领域，各自具有不同的动作空间、视角和物理假设。
    开放问题:
    - 单个世界模型能否在没有领域特定工程的情况下同时泛化到驾驶、机器人和游戏？
    - 如何在开放世界环境中衡量和强制物理合理性与长期记忆一致性？
    - 哪些基准和指标能够弥合仿真视频质量与真实世界任务成功或安全之间的差距？
