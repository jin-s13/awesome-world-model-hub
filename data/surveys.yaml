  related_work_outline_zh:
  - 主流方向：世界模型被用作驾驶、机器人和游戏领域的生成式视频预测器或潜在动力学模型，并转向基于扩散的架构和统一多模态框架。
  - 研究共性：多数工作利用领域特定的离线数据（图像、视频、动作）训练世界模型，并通过视觉保真度、下游策略性能或一致性基准进行评估，常用 NuScenes、RT-X
    或 Atari 等数据集。
  - 关键差异：表示方式分化为纯视觉生成（MaskGWM、RoboDreamer）、物理信息联合学习（RoboScape）和动作-视频耦合扩散（UWM）；评测目标在视觉真实感、策略零样本泛化与空间/记忆一致性基准之间各有侧重。
  - 趋势演进：从 2023 年起，世界模型从 RSSM/Transformer 强化学习（STORM、cRSSM）演进到基于扩散的视频生成，再到物理信息与统一动作-视频预训练（2024–2025），最后出现专门的一致性基准（2025–2026），反映了从方法到评测的成熟过程。
  - 开放问题：特定平台的视觉质量或策略性能提升能否迁移到不同本体或真实环境；如何维持长期记忆一致性并跨动作空间泛化；物理信息训练能否可靠地缩小从仿真到真实世界的差距。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Long-horizon and multi-view video prediction for scene simulation
        and policy evaluation in driving, using diffusion transformers with mask reconstruction.
      what_remains_open: Zero-shot transfer to unseen sensor configurations or real-world
        operational safety outcomes remains unverified beyond standard benchmarks.
    - line: Embodied robot world models with compositionality and physics
      what_it_solves: Generalizable video generation for robotic tasks by factorizing
        language into primitives (RoboDreamer) or jointly learning RGB video and physical
        properties like depth and keypoint dynamics (RoboScape).
      what_remains_open: These models assume known primitives or offline data coverage;
        generalization to entirely novel physical objects or interactions is not demonstrated,
        and evaluations are mostly in simulation.
    - line: Unified action-video diffusion pretraining
      what_it_solves: Flexible representation of policies, forward/inverse dynamics,
        and video generation by coupling action and video diffusion in a single transformer,
        enabling pretraining on large multi-task robot datasets.
      what_remains_open: The approach is limited to the datasets used for pretraining;
        its ability to integrate novelty during fine-tuning or to handle completely
        unseen action spaces is not fully characterized.
    - line: Contextual and efficient world models for reinforcement learning
      what_it_solves: Improving zero-shot generalization to unseen dynamics in contextual
        RL (cRSSM) and achieving high sample efficiency on Atari without lookahead
        search (STORM).
      what_remains_open: cRSSM assumes observable context, and evaluation is limited
        to two CARL tasks; STORM's performance on more complex, continuous control
        tasks is not addressed.
    - line: Spatial and memory consistency benchmarks for world models
      what_it_solves: Quantifying how well world models maintain spatial coherence
        during loop navigation (LoopNav) and memory consistency/action control across
        diverse scenes and action spaces (MIND).
      what_remains_open: These benchmarks define new metrics but do not yet measure
        real-world deployment reliability; the connection between benchmark scores
        and downstream task success is not established.
    consensus:
    - World models in application domains are predominantly generative, learning to
      predict future visual observations or latent states from past context.
    - All works rely on offline datasets and standard benchmarks (NuScenes, Atari,
      RT-X, Minecraft) to demonstrate improvements, with a focus on either visual
      quality or policy performance.
    - Recent methods increasingly adopt diffusion models or transformers as the generative
      backbone, replacing earlier RNN-based world models.
    - There is a shared recognition that current models struggle with generalization—whether
      to unseen environments, tasks, or action spaces—and that dedicated benchmarks
      are needed to measure these gaps.
    disagreements:
    - Some works treat world models as pure video generators without explicit action
      conditioning (e.g., MaskGWM), while others tightly couple video and action diffusion
      for policy learning (UWM) or condition on language primitives (RoboDreamer).
    - Physical plausibility is addressed implicitly through pixel-level generation
      in most models, but RoboScape explicitly incorporates depth prediction and keypoint
      dynamics as auxiliary tasks, suggesting a divergence on whether physics should
      be learned jointly or left to data-driven generation.
    - 'Evaluation targets differ: STORM and cRSSM optimize for game scores and zero-shot
      RL performance, MaskGWM and RoboScape for visual realism, and LoopNav/MIND for
      spatial-temporal consistency, making cross-comparison difficult.'
    - 'The role of interaction varies: some models are used to imagine trajectories
      for policy training in closed-loop (STORM, cRSSM, UWM), while others generate
      open-loop forecasts for simulation or planning (MaskGWM, RoboDreamer).'
    open_questions:
    - How can world models trained on one robotic platform or driving dataset transfer
      to a different embodiment or sensor suite without additional fine-tuning?
    - What is the minimal set of inductive biases (e.g., physics, memory, compositionality)
      needed to make a world model reliable for real-world deployment?
    - Do improvements in visual fidelity or consistency metrics correlate with safer
      or more efficient policies when deployed in physical systems?
    - Can world models learn to handle novel objects, actions, or goals that are not
      represented in the training distribution, and what benchmarks would adequately
      measure this?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 利用扩散Transformer与掩码重建实现长时域多视角视频预测，用于驾驶场景仿真与策略评测。
      尚未覆盖: 对未见传感器配置或真实运营安全结果的零样本迁移尚未在标准基准之外得到验证。
    - 路线: 具身机器人组合与物理世界模型
      解决的问题: 通过将语言分解为原语（RoboDreamer）或联合学习RGB视频与深度/关键点等物理属性（RoboScape），生成可泛化的机器人任务视频。
      尚未覆盖: 这些模型假设已知原语或离线数据覆盖；对全新物理对象或交互的泛化未得到展示，且评测主要在仿真中进行。
    - 路线: 统一动作-视频扩散预训练
      解决的问题: 在单一Transformer中耦合动作与视频扩散，灵活表示策略、前向/逆向动力学和视频生成，从而在大规模多任务机器人数据集上预训练。
      尚未覆盖: 方法受限于预训练所用数据集，其在微调时整合新知识或处理完全未见动作空间的能力未被充分刻画。
    - 路线: 面向强化学习的上下文与高效世界模型
      解决的问题: 在上下文RL中提升对未见动力学的零样本泛化（cRSSM），并在Atari上实现高样本效率且无需前瞻搜索（STORM）。
      尚未覆盖: cRSSM假设上下文可观测且仅在两个CARL任务上评估；STORM在更复杂连续控制任务上的表现未涉及。
    - 路线: 世界模型的空间与记忆一致性基准
      解决的问题: 量化世界模型在循环导航中的空间一致性（LoopNav）以及跨场景和动作空间的记忆一致性/动作控制（MIND）。
      尚未覆盖: 这些基准定义了新指标，但尚未衡量真实世界部署的可靠性，基准得分与下游任务成功之间的关联未建立。
    共识:
    - 应用领域中的世界模型主要采用生成式方法，从历史上下文中预测未来视觉观测或潜在状态。
    - 所有工作均依赖离线数据集和标准基准（NuScenes、Atari、RT-X、Minecraft）来证明改进，关注点集中在视觉质量或策略性能。
    - 近期方法越来越多地采用扩散模型或Transformer作为生成骨干，替代早期的RNN式世界模型。
    - 研究普遍认识到当前模型在泛化方面存在困难——无论是到未见环境、任务还是动作空间——并且需要专门的基准来衡量这些差距。
    分歧:
    - 部分工作将世界模型视为无显式动作条件的纯视频生成器（如MaskGWM），而另一些则将视频与动作扩散紧密耦合以进行策略学习（UWM）或基于语言原语进行条件化（RoboDreamer）。
    - 物理合理性在多数模型中通过像素级生成隐式处理，但RoboScape显式加入深度预测和关键点动力学作为辅助任务，表明在物理应联合学习还是留给数据驱动生成上存在分歧。
    - 评测目标各异：STORM和cRSSM优化游戏得分和零样本RL性能，MaskGWM和RoboScape关注视觉真实感，LoopNav和MIND侧重时空一致性，导致难以横向比较。
    - 交互角色不同：部分模型在闭环中生成想象轨迹以训练策略（STORM、cRSSM、UWM），另一些则生成开环预测用于仿真或规划（MaskGWM、RoboDreamer）。
    开放问题:
    - 在一个机器人平台或驾驶数据集上训练的世界模型，如何在不进行额外微调的情况下迁移到不同本体或传感器套件？
    - 使世界模型在真实部署中可靠所需的最小归纳偏置（如物理、记忆、组合性）是什么？
    - 视觉保真度或一致性指标的提升是否与物理系统中更安全或更高效的策略相关？
    - 世界模型能否学会处理训练分布中未出现的新物体、新动作或新目标，什么样的基准能够充分衡量这一点？
