  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting toward purpose-built
    benchmarks that probe spatial consistency, memory, action control, visual fidelity,
    and physical plausibility in driving, robotics, Minecraft, and Atari settings.'
  - 'Shared research pattern: Works introduce a dataset or benchmark together with
    an evaluation metric or baseline, then validate world-model outputs through prediction,
    control, or downstream policy learning.'
  - 'Key differences: Evaluation targets, representations, interaction modes, and
    supervision signals differ. Some use diffusion for pixel detail; others use latent
    dynamics, physics priors, scene-graph scores, or paired video-action diffusion.'
  - 'Trend evolution: Evidence from 2023-2026 shows a move from model-centric RL benchmarks
    such as STORM and DIAMOND toward specialized evaluation suites such as LoopNav
    and MIND, plus unified video-action and physics-informed models.'
  - 'Open questions: Metric-to-decision alignment, long-horizon memory/action generalization,
    cross-domain transfer, reproducibility gaps, and stability across implementations
    and compute budgets remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正转向专用基准，覆盖空间一致性、记忆、动作控制、视觉保真和物理合理性，涉及驾驶、机器人、Minecraft和Atari环境。
  - 研究共性：论文通常同时提出数据集或基准、评估指标或基线，并通过预测、控制或下游策略学习来验证世界模型输出。
  - 关键差异：评测目标、表示方式、交互模式和监督信号不同；有的用扩散强调像素细节，有的用潜在动力学、物理先验、场景图分数或视频-动作配对扩散。
  - 趋势演进：从STORM、DIAMOND等以模型为中心的RL基准，扩展到LoopNav、MIND等专用评测，以及视频-动作统一和物理信息建模，仍处于当前前沿区间。
  - 开放问题：指标与下游决策是否一致；长时记忆和跨动作空间泛化；跨域迁移；可复现性缺口；不同实现和算力下结论的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video, navigation, and action-conditioned datasets
        and evaluation tasks so world-model claims become comparable across domains
        such as driving, robotics, Minecraft, and Atari.
      what_remains_open: Coverage of long-horizon, cross-action-space, and real-world
        deployment settings is not fully established; dataset limitation fields are
        often absent.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        physical plausibility, and visual fidelity beyond aggregate generation scores.
      what_remains_open: Alignment between proxy scores and downstream decisions is
        still unproven; stress-test thresholds and failure modes remain underexplored.
    - line: Comparable baselines and reporting
      what_it_solves: Provides shared baselines, open datasets or code, and evaluation
        protocols intended to make world-model results auditable.
      what_remains_open: Reproducibility evidence is uneven; stability across implementations,
        compute budgets, and metric choices is not fully checked.
    - line: World-model downstream policy evaluation
      what_it_solves: Uses benchmarks such as Atari 100k and contextual RL tasks to
        test whether learned world models improve sample efficiency, generalization,
        or policy performance.
      what_remains_open: Evidence is concentrated in narrow game or control settings;
        transfer to more realistic embodied settings is largely unverified.
    consensus:
    - Work in this sample converges on evaluating world models through shared tasks
      rather than isolated demonstrations, using video, navigation, action, or game
      environments.
    - Recent contributions tend to pair dataset creation with an evaluation metric
      or baseline, and several report open datasets or code.
    - There is a cross-paper shift from frame quality alone toward consistency, controllability,
      visual detail, and physical plausibility as evidence.
    disagreements:
    - 'Evaluation target differs: spatial consistency, memory and action control,
      visual fidelity, physics plausibility, and zero-shot policy generalization are
      prioritized differently.'
    - 'Representation differs: some methods use diffusion to preserve visual detail,
      while others use compact latent dynamics or recurrent state-space models.'
    - 'Interaction mode differs: open-loop video prediction, closed-loop action-conditioned
      generation, and policy training inside the learned model are used as validity
      criteria.'
    - 'Supervision differs: physics-informed losses, mask reconstruction, visible
      context conditioning, scene-graph consistency, and paired video-action diffusion
      impose different inductive biases.'
    - 'Deployment setting differs: driving, robotics, Minecraft, and Atari benchmarks
      introduce distinct action spaces, perspectives, and domain assumptions.'
    open_questions:
    - Do the proposed proxy metrics align with downstream driving, robotics, or control
      decisions that users actually care about?
    - Can world models maintain long-horizon memory consistency and generalize across
      action spaces without fitting benchmark-specific shortcuts?
    - How stable are reported conclusions across implementations, compute budgets,
      and metric alternatives?
    - Do results from game and simulation benchmarks transfer to real-world embodied
      settings?
    - Several top papers have missing limitation fields in the evidence packet; this
      is a verification gap rather than proof that limitations do not exist.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享视频、导航和动作条件数据集及评估任务，使驾驶、机器人、Minecraft和Atari等场景中的世界模型主张可比较。
      尚未覆盖: 长时程、跨动作空间和真实部署设置的覆盖不足；数据集局限性说明常缺失。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、物理合理性和视觉保真。
      尚未覆盖: 代理分数与下游决策的一致性尚未证实；压力测试阈值和失败模式探索不足。
    - 路线: 可比基线与报告规范
      解决的问题: 提供共同基线、开放数据集或代码及评估协议，使结果可审计。
      尚未覆盖: 可复现性证据不均衡；不同实现、算力预算和指标选择下的稳健性未充分检验。
    - 路线: 世界模型的下游策略评测
      解决的问题: 通过Atari 100k和上下文强化学习等基准，检验世界模型是否提升采样效率、泛化或策略表现。
      尚未覆盖: 证据集中在较窄的游戏或控制设置；向真实具身场景迁移基本未验证。
    共识:
    - 该样本中的工作倾向于通过共享任务而非单次演示来评估世界模型，使用视频、导航、动作或游戏环境。
    - 近期贡献通常同时提出数据集与评估指标或基线，并有不少工作报告开源数据集或代码。
    - 跨论文趋势是从单纯关注帧质量，转向同时考察一致性、可控性、视觉细节和物理合理性。
    分歧:
    - 评测目标不同：空间一致性、记忆与动作控制、视觉保真、物理合理性和零样本策略泛化的优先级不同。
    - 表示方式不同：一些方法用扩散保留视觉细节，另一些使用紧凑潜在动态或循环状态空间模型。
    - 交互模式不同：开环视频预测、动作条件闭环生成和在世界模型内训练策略被用作不同有效性标准。
    - 监督信号不同：物理信息损失、掩码重建、可观测上下文条件、场景图一致性和视频-动作配对扩散引入不同归纳偏好。
    - 部署场景不同：驾驶、机器人、Minecraft和Atari基准具有不同的动作空间、视角和领域假设。
