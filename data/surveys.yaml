  literature_review:
    line_of_work_matrix:
    - line: Latent-dynamics model-based reinforcement learning
      what_it_solves: Learns policies in imagined latent rollouts from sparse rewards,
        reducing simulator dependence and enabling zero-shot generalization to observed
        context changes.
      what_remains_open: Assumes observable context values and leaves broader task/platform
        generalization beyond CARL and the tested physical robots unverified.
    - line: Action-controllable visual simulation and real-time deployment
      what_it_solves: Generates future video from action or trajectory conditioning
        for closed-loop driving and robot simulation, with optimizations for controllability
        and sub-second inference.
      what_remains_open: Long-horizon temporal and cross-view consistency, generalization
        beyond nuScenes-style settings, and scalability beyond single-GPU latency
        are not systematically shown.
    - line: Physics-informed and geometry-consistent video generation
      what_it_solves: Injects depth, keypoint, structural, or geometric signals so
        generated future frames are more physically plausible and geometrically coherent.
      what_remains_open: Implicit physics representations lack independent physical-plausibility
        metrics and evidence across diverse materials, interactions, and sensor setups.
    - line: Benchmarks and reusable evaluation artifacts
      what_it_solves: Creates datasets, metrics, and open-access evaluation frameworks
        for spatial consistency and action fidelity, supporting comparison and reuse.
      what_remains_open: Existing benchmarks are anchored to specific worlds such
        as Minecraft or nuScenes; cross-team reproduction and limitation/failure-mode
        evidence remain sparse.
