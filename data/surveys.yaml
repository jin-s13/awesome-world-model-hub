  related_work_outline:
  - 'Mainstream direction: Current work concentrates on scalable world-model architectures—diffusion
    transformers, stochastic transformers, and coupled video-action models—for driving,
    robot control, and visual prediction.'
  - 'Shared research pattern: Methods improve generalization and controllability by
    conditioning learned dynamics on context, language, action, or physics and evaluating
    on standardized visual or interactive suites.'
  - 'Key differences: Papers differ in representation and supervision, including mask
    reconstruction, VAE-style stochastic latents, context-conditioned recurrent states,
    physics auxiliary tasks, and video-action diffusion.'
  - 'Trend evolution: The evidence is concentrated in 2023–2026; the frontier is shifting
    from compact RL world models toward generative and embodied models, and from capability-only
    claims toward consistency, memory, and action-control benchmarks.'
  - 'Open questions: Evidence gaps remain on cross-domain transfer, model-vs-planner
    attribution, long-term memory consistency, and whether benchmarks isolate method
    contribution.'
  related_work_outline_zh:
  - 主流方向：当前研究集中于可扩展世界模型架构——扩散Transformer、随机Transformer和视频-动作耦合模型，用于驾驶、机器人控制与视觉预测。
  - 研究共性：方法通过将学习动力学条件化于上下文、语言、动作或物理，并在标准化视觉/交互评测上验证，以改善泛化与可控性。
  - 关键差异：论文在表示与监督信号上不同，包括掩码重建、VAE式随机潜变量、上下文条件循环状态、物理辅助任务和视频-动作扩散。
  - 趋势演进：证据集中在2023–2026；前沿正从紧凑的强化学习世界模型转向生成式与具身模型，并从能力声称转向一致性、记忆和动作控制评测。
  - 开放问题：跨域迁移、模型与规划器/控制器收益归因、长期记忆一致性，以及基准是否隔离方法贡献，仍存在证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete representations, losses,
        architectures, and training recipes for video prediction and latent dynamics.
      what_remains_open: Which architecture, stochasticity, and auxiliary-task choices
        transfer beyond the reported driving, robotic, or Atari settings remains unclear;
        some papers omit limitations or controlled ablations.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to interventions, planning, and decision-time
        policy interfaces through context conditioning, language primitives, or coupled
        video-action diffusion.
      what_remains_open: How much of the reported gain comes from the world model
        rather than the planner, controller, or task prior is not isolated; context
        observability and real-robot transfer remain unresolved.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects via benchmarks for spatial consistency, memory
        consistency, and action control.
      what_remains_open: Some benchmark papers report construction without experimental
        results, and the available evidence cannot verify whether their metrics isolate
        the proposed method.
    consensus:
    - Recent world-model work treats learned generative dynamics as a shared substrate
      for prediction, planning, and policy learning.
    - Conditioning on context, language, action, or physics is a recurring mechanism
      for improving generalization and controllability.
    - Diffusion and transformer architectures have become common building blocks across
      visual, embodied, and reinforcement-learning world models.
    - Evaluation increasingly combines visual fidelity with downstream policy or planning
      performance on standardized datasets and benchmarks.
    disagreements:
    - Representation differs across stochastic latent state-space models, VAE-transformer
      hybrids, and diffusion-based video or action generators.
    - 'Supervision differs: mask reconstruction, physics-informed depth and keypoint
      objectives, context conditioning, and coupled video-action diffusion encode
      different inductive biases.'
    - Evaluation targets differ across Atari RL, contextual zero-shot generalization,
      robot video planning, multi-view driving prediction, and open-domain memory
      or action consistency.
    - Interaction mode differs from closed-loop policy dreams to language-parsed compositional
      video plans and action-conditioned rollout.
    - Deployment settings differ among simulation, driving datasets, Minecraft navigation,
      and robotic datasets, which affects which failure modes are visible.
    open_questions:
    - What architectural and objective choices transfer beyond the single task family
      or dataset used in each study?
    - Can the contribution of the learned dynamics be separated from the planner,
      controller, or task-specific prior?
    - How do world models maintain long-term memory consistency and generalize across
      unseen action spaces in open domains?
    - Do current benchmarks provide enough methodological evidence to isolate the
      method from dataset, baseline, metric, and implementation effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思想落实为具体表示、损失函数、架构和训练配方，用于视频预测与潜在动力学建模。
      尚未覆盖: 哪些架构、随机性和辅助任务选择能迁移到已报告的驾驶、机器人或Atari设置之外仍不清楚；部分论文缺少局限性或受控消融。
    - 路线: 规划与动作接口方法
      解决的问题: 通过上下文条件、语言原语或耦合视频-动作扩散，将学习动力学连接到干预、规划和决策时接口。
      尚未覆盖: 报告收益中有多少来自世界模型而非规划器、控制器或任务先验尚未隔离；上下文可观测性与真实机器人迁移仍未解决。
    - 路线: 方法证据与消融协议
      解决的问题: 通过空间一致性、记忆一致性和动作控制基准，区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 部分基准论文只报告数据或基准构建而无实验结果；现有证据无法验证其指标是否真正隔离方法贡献。
    共识:
    - 近期世界模型研究将学习到的生成动力学作为预测、规划和策略学习的共享基础。
    - 通过上下文、语言、动作或物理进行条件化，是提升泛化性和可控性的反复出现机制。
    - 扩散和Transformer架构已成为视觉、具身和强化学习世界模型中的常见构建模块。
    - 评测越来越多地在标准化数据集和基准上同时结合视觉保真度与下游策略或规划表现。
    分歧:
    - 表示方式不同：包括随机潜在状态空间模型、VAE-Transformer混合模型和基于扩散的视频或动作生成器。
    - 监督信号不同：掩码重建、物理信息深度与关键点目标、上下文条件化和耦合视频-动作扩散编码了不同归纳偏置。
    - 评测目标不同：从Atari强化学习、上下文零样本泛化、机器人视频规划、多视角驾驶预测到开放域记忆或动作一致性。
    - 交互模式不同：从闭环策略梦境到语言解析的组合式视频计划，再到动作条件展开。
    - 部署场景不同：包括仿真、驾驶数据集、Minecraft导航和机器人数据集，导致可见的失效模式不同。
    开放问题:
    - 哪些架构和目标选择能迁移到每项研究所用的单一任务族或数据集之外？
    - 学习动力学的贡献能否与规划器、控制器或任务特定先验分离开？
    - 世界模型如何在开放域中保持长期记忆一致性并泛化到未见动作空间？
    - 当前基准是否提供足够的方法证据，以隔离方法本身与数据集、基线、指标和实现因素？
