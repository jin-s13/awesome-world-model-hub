  related_work_outline:
  - 'Mainstream direction: Diffusion-transformer and stochastic-dynamics world models
    for video generation, robot policy, and dynamics learning, increasingly paired
    with auxiliary consistency tasks or physics-informed losses.'
  - 'Shared research pattern: Methods combine generative objectives with auxiliary
    conditioning, mask reconstruction, context, physics, or action-video coupling
    to improve generalization and consistency.'
  - 'Key differences: Representation, supervision, evaluation target, and interaction
    mode differ. For example, recurrent state-space models contrast with diffusion
    transformers and compositional primitives.'
  - 'Trend evolution: From 2023 efficient RL world models toward 2024-2025 contextual/compositional/physics-informed
    generative models, and 2025-2026 benchmarks for spatial and memory consistency
    and action control.'
  - 'Open questions: Long-horizon memory and cross-action-space generalization remain
    unproven; evidence does not isolate model contribution from auxiliary tasks or
    planners; benchmark metrics have not been tied to real-world robot execution.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和随机动力学世界模型为主，用于视频生成、机器人策略与动力学学习，并越来越多地加入一致性辅助任务或物理信息损失。
  - 研究共性：将生成目标与上下文条件、掩码重建、物理约束或视频-动作耦合相结合，以改进泛化和一致性。
  - 关键差异：表示方式、监督信号、评测目标和交互模式不同，例如循环状态空间、扩散Transformer、组合式原语等。
  - 趋势演进：从2023年高效强化学习世界模型走向2024-2025年上下文/组合/物理信息生成模型，2025-2026年出现空间与记忆一致性及动作控制基准。
  - 开放问题：长时域记忆和跨动作空间泛化尚待验证；证据难以区分模型本身与辅助任务或规划器的贡献；基准指标与真实机器人执行之间的关联不明确。
  literature_review:
    line_of_work_matrix:
    - line: Generative architecture and training-objective design
      what_it_solves: Turns world-model ideas into concrete representations, losses,
        and training recipes; examples include diffusion-mask reconstruction, stochastic
        transformers, and physics-informed depth or keypoint tasks.
      what_remains_open: Whether reported gains transfer beyond Nuscenes/OpenDV-2K/Waymo,
        Atari 100k, or the robot video settings, and whether auxiliary tasks are isolated
        as the causal factor.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to context policies, planning, or
        decision-time interfaces; cRSSM conditions Dreamer on context, UWM couples
        video/action diffusion, RoboDreamer composes language primitives for robot
        plans.
      what_remains_open: How much benefit comes from the model rather than the planner,
        controller, or task prior; real-robot execution and novel primitive or context
        coverage remain limited.
    - line: Method evidence and closed-loop benchmark protocol
      what_it_solves: Creates evaluation protocols for world-model capabilities such
        as spatial consistency, memory consistency, and action control; LoopNav provides
        Minecraft loop navigation and SGCS, MIND provides open-domain revisited videos
        and a baseline.
      what_remains_open: Whether consistency metrics predict downstream control or
        real-world transfer; evidence is mostly from constructed benchmarks, and ablation
        gaps persist for long-horizon memory and cross-action-space generalization.
    consensus:
    - Contemporary methods couple generative video objectives with auxiliary supervision
      to enforce temporal, spatial, or physical consistency.
    - Action conditioning or action-space control is treated as a central interface
      for robot, driving, and open-domain world models.
    - Evaluation increasingly includes generalization and consistency metrics beyond
      per-frame visual quality, such as zero-shot dynamics, long-horizon rollout,
      spatial consistency, memory consistency, and action control.
    disagreements:
    - 'Representation choices differ: stochastic recurrent state-space dynamics for
      sample-efficient RL versus diffusion transformers for high-dimensional video
      versus language-primitive compositional generators.'
    - 'Supervision differs: observable context conditioning, physics-informed depth/keypoint
      losses, mask reconstruction, and coupled video-action diffusion encode different
      inductive biases.'
    - 'Evaluation targets differ in robustness type: Atari sample efficiency, CARL
      zero-shot generalization, driving multi-view long-horizon prediction, simulated
      robot execution, and open-domain closed-loop memory tests.'
    - 'Interaction mode differs: some methods stop at video generation or simulation,
      while benchmarks demand closed-loop action control and sustained spatial or
      memory consistency.'
    open_questions:
    - Does improvement on current spatial, memory, or action-control metrics transfer
      to real robot execution or longer closed-loop tasks?
    - Can generative world models maintain consistent scene memory beyond the horizon
      and action spaces present in existing datasets and benchmarks?
    - How much of reported policy or planning improvement is attributable to the learned
      world model rather than the auxiliary objective, context prior, or planner/controller?
    - Can compositional or context-conditioned world models handle novel primitives,
      contexts, or action spaces that were not observed during training?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式架构与训练目标设计
      解决的问题: 将世界模型想法落实为具体表示、损失和训练配方；例如扩散掩码重建、随机Transformer、物理信息深度/关键点任务。
      尚未覆盖: 报告增益是否能迁移到现有驾驶、Atari、机器人视频之外；辅助任务是否被隔离为因果因素。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到上下文策略、规划或决策时接口；例如上下文Dreamer、视频-动作耦合扩散、语言原语组合式机器人规划。
      尚未覆盖: 受益中有多少来自模型而非规划器、控制器或任务先验；真实机器人执行与新颖原语/上下文覆盖仍有限。
    - 路线: 方法证据与闭环基准协议
      解决的问题: 建立空间一致性、记忆一致性和动作控制等能力的评估协议；LoopNav和MIND提供导航/开放域视频基准与指标。
      尚未覆盖: 一致性指标是否能预测下游控制或真实迁移；现有证据多来自构造基准，长时域记忆和跨动作空间泛化仍存缺口。
    共识:
    - 当前方法普遍将生成式视频目标与辅助监督结合，以强调时间、空间或物理一致性。
    - 动作条件或动作空间控制被视为机器人、驾驶和开放域世界模型的核心接口。
    - 评估越来越关注泛化和一致性指标，而不仅是逐帧视觉质量，例如零样本动力学、长时域展开、空间一致性、记忆一致性和动作控制。
    分歧:
    - 表示选择不同：样本高效强化学习使用随机循环状态空间，高维视频使用扩散Transformer，机器人想象使用语言原语组合式生成。
    - 监督信号不同：可观测上下文条件、物理信息深度/关键点损失、掩码重建以及耦合的视频-动作扩散引入了不同归纳偏置。
    - 评测目标不同：Atari样本效率、CARL零样本泛化、驾驶多视角长时域预测、机器人仿真执行、开放域闭环记忆测试各强调不同能力。
    - 交互模式不同：部分方法止于视频生成或仿真，而基准要求闭环动作控制和持续空间/记忆一致性。
    开放问题:
    - 当前空间、记忆和动作控制指标的改善是否迁移到真实机器人执行或更长的闭环任务？
    - 生成式世界模型能否在现有数据集和基准之外保持一致的场景记忆？
    - 报告的策略或规划提升中，多少来自世界模型本身，而不是辅助目标、上下文先验或规划器/控制器？
    - 组合式或上下文条件世界模型能否处理训练中未见过的新原语、新上下文或新动作空间？
