  related_work_outline_zh:
  - 主流方向：综述论文正汇聚于世界模型的分类体系与路线图，强调动作条件可控性、长时域一致性以及实时交互性，作为视频生成、自动驾驶与具身智能领域的核心挑战。
  - 研究共性：系统性地按表示、应用领域或结构先验对现有工作分类，继而识别技术挑战，提出评测框架与未来方向，但不提供新的实证结果。
  - 关键差异：分类体系的组织原则不同（潜在表示 vs. 应用场景），评测框架不同（多领域基准比较 vs. 领域特定的闭环指标），范围不同（如仅聚焦 Sora 单一标志性模型
    vs. 广泛交互式视频建模）。
  - 趋势演进：从 2024 年到 2026 年，综述从宽泛的领域全景综合（如 Sora 模拟能力）转向专用分类，并给出显式的设计空间分解和具体的评测方案（如自动驾驶的潜在世界模型、交互式视频建模基准）。
  - 开放问题：分类与评测框架的实证验证，实现实时可控长时域生成，弥合仿真到真实世界的差距，以及在多个开放挑战中确定优先级。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world model research into structured directions,
        milestones, and gaps, helping researchers navigate fast-growing literature
        across video generation, autonomous driving, and embodied agents.
      what_remains_open: Whether the taxonomy is exhaustive and empirically grounded;
        most proposed taxonomies (e.g., latent representations and structural priors
        in Latent World Models for Automated Driving) lack validation against real-world
        deployment constraints.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different evaluation protocols and metrics shape
        conclusions across world model papers, highlighting discrepancies and proposing
        unified benchmarks such as closed-loop metric suites or multi-domain benchmark
        comparisons.
      what_remains_open: Comparability of results across different settings (simulation
        vs. real, open-loop vs. closed-loop) remains unresolved; the proposed evaluation
        prescriptions are not yet implemented or tested in a reproducible way.
    - line: Open problem and gap mapping
      what_it_solves: 'Converts broad literature coverage into concrete research questions:
        action-conditioned controllability, long-horizon memory, real-time action-following
        responsiveness, and the integration of world models with decision-making.'
      what_remains_open: Prioritization of which gaps matter most for progress is
        still subjective; missing empirical evidence on the relative impact of each
        challenge, and how overcoming them would translate to downstream task performance.
    consensus:
    - 'World models must address three interconnected technical challenges: action-conditioned
      controllability, long-horizon temporal consistency, and real-time interactivity,
      regardless of the application domain.'
    - Standardized evaluation frameworks and benchmarks are urgently needed to enable
      fair comparison and to reduce the gap between open-loop generation metrics and
      closed-loop interactive performance.
    - The field is advancing so rapidly that any survey inevitably risks incompleteness;
      most surveys acknowledge that their analysis is a snapshot based on current
      trends and may not cover all recent works.
    disagreements:
    - 'Taxonomies adopt different organizing principles: one uses latent representations
      (continuous states, discrete tokens, hybrids) and structural priors (geometry,
      topology, semantics), while another categorizes by application scenarios (open-world
      exploration, game engines, autonomous driving, robotics) and scene modality.'
    - 'Evaluation frameworks differ in specificity: one proposes a closed-loop metric
      suite and resource-aware inference cost tailored to automated driving, while
      another compares existing benchmarks across four broad domains without introducing
      new metrics.'
    - 'Scope of synthesis varies: one survey centers on a single landmark model (Sora)
      and its simulation capabilities, linking video generation, autonomous driving,
      and agents; the others provide domain- or problem-spanning taxonomies without
      a single model focus.'
    open_questions:
    - How can proposed taxonomies and evaluation frameworks be empirically validated
      without access to the full range of world models and real-world robot platforms?
    - What is the minimum set of metrics that reliably predicts real-world interactive
      performance of world models, and how can they be measured in a reproducible
      manner?
    - Which technical challenge (controllability, long-horizon memory, or real-time
      responsiveness) is the bottleneck for scaling world models to embodied agents,
      and how should resources be prioritized in future research?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究整理为结构化的方向、里程碑与缺口，帮助研究者导航视频生成、自动驾驶与具身智能体等快速增长的文献。
      尚未覆盖: 分类是否穷尽且有实证支撑仍不明确；多数提出的分类体系（如 Latent World Models for Automated Driving
        中的潜在表示与结构先验）缺乏面向真实部署约束的验证。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测协议与指标如何影响世界模型论文的结论，揭示差异并提出统一基准，如闭环指标套件或多领域基准对比。
      尚未覆盖: 不同设置（仿真 vs. 真实、开环 vs. 闭环）下结果的可比性尚未解决；所提评测方案尚未以可复现方式实现或测试。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体研究问题：动作条件可控性、长时域记忆、实时动作跟随响应，以及世界模型与决策的集成。
      尚未覆盖: 哪些缺口最值得优先解决仍依赖主观判断；缺乏关于每个挑战相对影响的实证证据，以及克服它们如何转化为下游任务性能的量化分析。
    共识:
    - 世界模型必须同时应对三个相互关联的技术挑战：动作条件可控性、长时域时间一致性以及实时交互性，无论应用领域如何。
    - 迫切需要标准化评测框架与基准，以实现公平比较，并缩小开环生成指标与闭环交互性能之间的差距。
    - 该领域进展极快，任何综述都不可避免地存在覆盖不全的风险；多数综述承认其分析是基于当前趋势的快照，可能未涵盖所有最新工作。
    分歧:
    - 分类体系采用不同的组织原则：一种使用潜在表示（连续状态、离散令牌、混合体）与结构先验（几何、拓扑、语义），另一种按应用场景（开放世界探索、游戏引擎、自动驾驶、机器人）与场景模态分类。
    - 评测框架的专用性不同：一种针对自动驾驶提出了闭环指标套件与资源感知推理成本，另一种仅比较四个广泛领域的现有基准，未引入新指标。
    - 综合范围不同：一篇综述围绕单一标志性模型（Sora）及其模拟能力，连接视频生成、自动驾驶与智能体；其他综述则提供跨领域或跨问题的分类，不聚焦单一模型。
    开放问题:
    - 在无法访问全部世界模型与真实机器人平台的情况下，如何对提出的分类体系与评测框架进行实证验证？
    - 能够可靠预测世界模型真实交互性能的最小指标集是什么，如何以可复现方式测量？
    - 在可控性、长时域记忆与实时响应中，哪个技术挑战是制约世界模型向具身智能体扩展的瓶颈，未来研究应如何优先分配资源？
