  related_work_outline:
  - 'Mainstream direction: World-model evaluation is converging on generative diffusion/transformer
    models tested on driving, robotics, Atari, and Minecraft; recent work adds capability-specific
    benchmarks for spatial consistency, memory, action control, and zero-shot generalization.'
  - 'Shared research pattern: Papers construct or adopt shared datasets/benchmarks,
    compare against state-of-the-art baselines, and report visual fidelity, normalized
    scores, or consistency metrics while releasing code, datasets, or artifacts in
    some cases.'
  - 'Key differences: Evaluation targets range from Atari human-normalized policy
    performance to long-horizon driving prediction, spatial or memory consistency
    in navigation, and robotic video realism; assumptions differ around observable
    context, action-free video, closed-loop revisits, and auxiliary physics signals.'
  - 'Trend evolution: The available 2023–2026 evidence moves from aggregate RL world-model
    performance toward capability-specific stress tests and embodied/driving benchmarks;
    the trend is within the current frontier rather than a long historical shift.'
  - 'Open questions: Whether benchmark tasks cover real deployment settings; whether
    proxy fidelity/consistency metrics align with downstream decision utility; and
    whether reported conclusions remain stable across implementations, compute budgets,
    and missing baseline or limitation details.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正汇聚于生成式扩散/Transformer模型，在驾驶、机器人、Atari和Minecraft等场景上测试；近期工作新增针对空间一致性、记忆、动作控制和零样本泛化的专项基准。
  - 研究共性：论文构建或采用共享数据集/基准，与最先进基线比较，并报告视觉保真度、归一化得分或一致性指标；部分工作同时发布代码、数据集或工件。
  - 关键差异：评测目标从Atari人类归一化策略性能，到长时域驾驶预测、导航空间或记忆一致性，再到机器人视频真实感；假设在可观测上下文、无动作视频、闭环回访和辅助物理信号上各不相同。
  - 趋势演进：现有2023–2026证据显示，研究从聚合式RL世界模型表现转向能力专项压力测试和具身/驾驶基准；这一趋势属于当前前沿内的演进。
  - 开放问题：基准任务是否覆盖真实部署环境；代理保真度/一致性指标是否与下游决策效用一致；报告结论在不同实现、算力预算以及缺失基线和局限性证据下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model method comparison on shared RL/driving benchmarks
      what_it_solves: Compares diffusion and transformer world models on visual fidelity,
        policy performance, zero-shot generalization, and sample efficiency through
        Atari, CARL, or driving datasets.
      what_remains_open: Benchmark coverage is narrow; limitation reporting and cross-benchmark
        stability evidence are often missing.
    - line: Capability-specific benchmark dataset and metric construction
      what_it_solves: Builds navigation or multi-scene video data and consistency/action-control
        scores to probe spatial and memory consistency.
      what_remains_open: LoopNav reports no experimental results in the abstract;
        MIND's scenes and action spaces are limited, so open-domain generalization
        and metric alignment remain unverified.
    - line: Embodied and robotic world-model evaluation
      what_it_solves: Tests physics-informed or unified video-action models for visual
        fidelity, physical plausibility, policy training, and policy evaluation in
        robot scenarios.
      what_remains_open: RoboScape and UWM lack visible limitation and dataset details;
        real-robot deployment or cross-robot generalization evidence is absent.
    consensus:
    - Recent work treats visual generation quality as a central evaluation target
      and connects it to downstream policy or control utility.
    - There is a move toward capability-specific probes such as spatial consistency,
      memory consistency, action control, and zero-shot generalization rather than
      relying only on aggregate scores.
    - Shared baselines, datasets, or code artifacts are increasingly used, though
      reproducibility evidence remains uneven.
    disagreements:
    - 'Evaluation target differs: some optimize Atari human-normalized score, others
      driving or robotic video fidelity, and others navigation consistency and action
      controllability.'
    - 'Supervision and interaction assumptions differ: observable context, action-labeled
      video, action-free video, closed-loop revisits, or auxiliary physics signals.'
    - 'Modeling choice differs: discrete or VAE stochastic world models versus diffusion-based
      generation versus coupled video-action diffusion transformers, with different
      visual detail and efficiency tradeoffs.'
    - 'Metric preference differs: pixel-level fidelity-oriented evaluation versus
      consistency scores invariant to pixel variation versus memory and action-control
      metrics.'
    open_questions:
    - How well do Minecraft navigation or curated multi-scene videos transfer to open-domain
      driving, robotics, or real-world decision settings?
    - Which fidelity, consistency, or action-control metrics predict downstream policy
      robustness and task success?
    - Do current conclusions remain stable across datasets, compute budgets, implementation
      variants, and absent baseline or limitation details?
    - Can context-conditioned, action-free, and closed-loop evaluation assumptions
      be unified into a common benchmark framework?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于共享RL/驾驶基准的生成式世界模型方法比较
      解决的问题: 通过Atari、CARL或驾驶数据集比较扩散与Transformer世界模型的视觉保真度、策略表现、零样本泛化和样本效率。
      尚未覆盖: 基准覆盖范围较窄；局限性报告和跨基准稳定性证据常缺失。
    - 路线: 能力专项基准数据集与指标构建
      解决的问题: 构建导航或多场景视频数据以及一致性/动作控制分数，用于检验空间一致性和记忆一致性。
      尚未覆盖: LoopNav摘要未报告实验结果；MIND的场景与动作空间有限，开放域泛化和指标对齐仍未验证。
    - 路线: 具身与机器人世界模型评测
      解决的问题: 检验物理信息驱动或统一视频-动作模型的视觉保真度、物理合理性、策略训练和策略评估能力。
      尚未覆盖: RoboScape和UWM缺少可见的局限性与数据集细节；真实机器人部署或跨机器人泛化证据缺失。
    共识:
    - 近期工作将视觉生成质量视为核心评测目标，并将其与下游策略或控制效用联系起来。
    - 评测正从单一聚合分数转向空间一致性、记忆一致性、动作控制和零样本泛化等能力专项探测。
    - 共享基线、数据集或代码工件越来越常见，但可复现性证据仍不均衡。
    分歧:
    - 评测目标不同：有的优化Atari人类归一化得分，有的关注驾驶或机器人视频保真度，有的关注导航一致性与动作可控性。
    - 监督与交互假设不同：可观测上下文、带动作视频、无动作视频、闭环回访或辅助物理信号各有不同。
    - 建模选择不同：离散或VAE随机世界模型、扩散式生成模型、以及耦合视频-动作扩散Transformer在视觉细节和效率上取舍不同。
    - 指标偏好不同：面向像素级保真度、对像素变化不变的场景图一致性分数、或记忆与动作控制指标的偏好不一致。
    开放问题:
    - Minecraft导航或人工多场景视频基准能否迁移到开放域驾驶、机器人或真实决策环境？
    - 哪些保真度、一致性或动作控制指标能预测下游策略鲁棒性和任务成功？
    - 当前结论在不同数据集、算力预算、实现变体以及缺失基线与局限性细节时是否稳定？
    - 能否把上下文条件、无动作和闭环评测假设统一到一个基准框架中？
