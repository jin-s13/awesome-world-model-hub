  - 'Mainstream direction: Building world models as runnable systems that combine
    video generation with action-conditioned control, enabling closed-loop simulation
    for autonomous driving, robotics, and interactive environments.'
  - 'Shared research pattern: Works integrate a generative backbone (diffusion or
    autoregressive) with modular control signals and physical priors, then evaluate
    on purpose-built benchmarks that measure fidelity, consistency, and controllability.'
  - 'Key differences: Systems differ in the control interface (trajectory, command,
    keypoint), the physics injection method (explicit depth, implicit keypoint dynamics,
    or motion-reinforced loss), and the deployment target (offline benchmark vs. real-time
    closed-loop on a single GPU).'
  - 'Trend evolution: The field moved from single-task world models and open-loop
    evaluation toward interactive, multi-view, real-time simulators with standardized
    benchmarks (2024–2026), emphasizing action fidelity and spatial consistency alongside
    visual quality.'
  - 'Open questions: How to maintain long-horizon temporal and cross-view consistency
    under real-time latency constraints; how to generalize across sensor configurations,
    domains, and hardware without retraining; and whether these simulators can replace
    real-world data for policy learning.'
  related_work_outline_zh:
  - 主流方向：将世界模型构建为可运行系统，融合视频生成与动作条件控制，实现面向自动驾驶、机器人和交互环境的闭环仿真。
  - 研究共性：工作大多采用生成式主干（扩散或自回归）搭配模块化控制信号和物理先验，并在专门构建的基准上评估保真度、一致性和可控性。
  - 关键差异：系统在控制接口（轨迹、指令、关键点）、物理注入方式（显式深度、隐式关键点动力学、运动增强损失）以及部署目标（离线基准 vs. 单GPU实时闭环）上存在不同。
  - 趋势演进：从单任务世界模型和开环评估，转向交互式、多视图、实时的模拟器，并伴随标准化基准的出现（2024–2026），在视觉质量之外更强调动作忠实度和空间一致性。
  - 开放问题：如何在实时延迟约束下保持长时域和跨视图一致性；如何跨传感器配置、领域和硬件泛化而无需重训；这些模拟器能否替代真实世界数据用于策略学习。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Transforms generative model ideas into end-to-end workflows
        for data, training, inference, and evaluation, such as Dreamer-based world
        models, physics-informed video synthesis, and action-conditioned simulators.
      what_remains_open: Independent verification of whether these stacks survive
        external deployment, hardware changes, and user-specific settings beyond the
        original authors' environments.
    - line: Real-time and interactive serving
      what_it_solves: Meets latency and interactivity requirements for closed-loop
        use, e.g., sub-second multi-view generation for autonomous driving, and prioritized
        imagination for sample-efficient model-based RL.
      what_remains_open: Trade-offs between speed, long-horizon consistency, and fidelity
        under adversarial or out-of-distribution conditions; scalability to multi-GPU
        or resource-constrained settings.
    - line: Artifacts and reproducible engineering
      what_it_solves: Makes systems inspectable and reusable through open-source code,
        datasets, benchmarks, and evaluation protocols, exemplified by LoopNav, ACT-Bench,
        and the release of training pipelines.
      what_remains_open: Independent reproduction across different teams, datasets,
        and infrastructure environments; missing code or dataset links in several
        works limit reproducibility.
    consensus:
    - World models are treated as complete systems, not just models, requiring integration
      of generation, control, and evaluation.
    - Action-conditioned video generation is the dominant paradigm for building controllable
      simulators, with diffusion and autoregressive transformers as common backbones.
    - Task-specific benchmarks are necessary to measure spatial consistency, action
      fidelity, and physical plausibility beyond standard video quality metrics.
    - Low-latency, closed-loop operation is a desired property for autonomous driving
      and robotics applications.
    disagreements:
    - 'The control interface varies: some use explicit trajectory or command tokens,
      while others condition on keypoints or latent actions, affecting the granularity
      of human interaction.'
    - 'Physics grounding is approached differently: explicit depth supervision, implicit
      keypoint dynamics, or motion-reinforced losses, leading to different fidelity–efficiency
      trade-offs.'
    - 'Evaluation targets differ: some focus on spatial consistency in navigation,
      others on action fidelity in driving, and still others on visual quality and
      physical plausibility in robotic manipulation.'
    - 'Deployment assumptions diverge: real-time single-GPU inference is a goal for
      some, while others prioritize batch processing or offline benchmarking without
      latency constraints.'
    open_questions:
    - Can long-horizon temporal and cross-view consistency be maintained when the
      system operates at real-time inference speeds?
    - How do these world models generalize to unseen sensor setups, weather conditions,
      or physical environments without domain-specific retraining?
    - What is the evidence that policies trained in these simulators transfer to real-world
      robots and vehicles, given the absence of such transfer results in the majority
      of the reviewed works?
    - Are the lightweight action-conditioned modules universal enough to cover the
      full diversity of interactive tasks, or do they introduce capacity bottlenecks
      in highly specialized domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将生成式模型想法转化为面向数据、训练、推理和评估的端到端工作流，例如基于Dreamer的世界模型、物理信息视频合成和动作条件模拟器。
      尚未覆盖: 独立验证这些栈在外部部署、硬件变化和用户特定设置下是否仍然可靠，超出了原作者环境。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟和交互需求，例如面向自动驾驶的亚秒级多视图生成，以及用于基于模型的强化学习的优先想象以提升样本效率。
      尚未覆盖: 在对抗或分布外条件下，速度、长时域一致性和保真度之间的权衡；多GPU或资源受限环境下的可扩展性。
    - 路线: 工件与可复现工程
      解决的问题: 通过开源代码、数据集、基准和评估协议使系统可检查、可复用，例如LoopNav、ACT-Bench以及训练流水线的发布。
      尚未覆盖: 跨不同团队、数据集和基础设施环境的独立复现；若干工作中缺失的代码或数据集链接限制了可复现性。
    共识:
    - 世界模型被视为完整系统，而不仅仅是模型，需要整合生成、控制和评估。
    - 动作条件视频生成是构建可控模拟器的主导范式，扩散和自回归Transformer是常见主干。
    - 需要特定任务的基准来衡量空间一致性、动作忠实度和物理合理性，超越标准视频质量指标。
    - 低延迟、闭环运行是自动驾驶和机器人应用所期望的特性。
    分歧:
    - 控制接口各异：有的使用显式轨迹或指令令牌，有的则基于关键点或潜在动作，影响人机交互的粒度。
    - 物理注入方式不同：显式深度监督、隐式关键点动力学或运动增强损失，导致不同的保真度与效率权衡。
    - 评测目标不同：有的侧重导航中的空间一致性，有的侧重驾驶中的动作忠实度，还有的侧重机器人操作中的视觉质量和物理合理性。
    - 部署假设有分歧：有些工作以实时单GPU推理为目标，而另一些则优先考虑批次处理或离线基准测试，无延迟约束。
    开放问题:
    - 在系统以实时推理速度运行时，能否保持长时域和跨视图的一致性？
    - 这些世界模型如何泛化到未见过的传感器配置、天气条件或物理环境，而无需领域特定的重新训练？
    - 鉴于大多数综述工作缺乏迁移结果，证据是什么说明在这些模拟器中训练的策略可以迁移到真实世界机器人和车辆？
    - 轻量级动作条件模块是否足够通用以覆盖交互任务的多样性，还是在高度专业化领域会引入容量瓶颈？
