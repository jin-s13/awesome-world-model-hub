  literature_review:
    line_of_work_matrix:
    - line: Controllable world-model simulators for open-loop and closed-loop generation
      what_it_solves: Transforms actions, trajectories, context, or physics cues into
        future video or state rollouts for driving, robotics, games, and planning.
      what_remains_open: Evidence is concentrated on nuScenes, CARL two-task settings,
