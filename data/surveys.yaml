  - 'Mainstream direction: Application-focused world model research is converging
    on action-conditioned generative video or latent dynamics for robotics, driving,
    and interactive control, with auxiliary objectives for consistency and generalization.'
  - 'Shared research pattern: Most papers couple visual generation or latent dynamics
    with task-specific conditioning such as actions, context, or language, then evaluate
    generalization or consistency beyond short-range pixel quality.'
  - 'Key differences: Works differ in dynamics representation, from latent state-space
    models to diffusion-based video generators, and in supervision signals such as
    RL objectives, physics-informed auxiliary tasks, language-primitive decomposition,
    and benchmark-grounded consistency metrics.'
  - 'Trend evolution: Within the visible 2023-2026 frontier, the topic is moving from
    efficient model-based RL world models toward large-scale embodied generative models,
    followed by specialized benchmarks for memory, spatial, and action-control consistency.'
  - 'Open questions: Cross-domain zero-shot transfer, alignment between benchmark
    gains and real deployment outcomes, and generalization beyond observed context,
    primitives, or action spaces remain unresolved.'
  related_work_outline_zh:
  - 主流方向：应用型世界模型研究正集中于面向机器人、驾驶和交互控制的动作条件生成式视频或潜在动力学，并引入辅助目标提升一致性与泛化。
  - 研究共性：多数工作将视觉生成或潜在动力学与动作、上下文或语言等任务特定条件耦合，并在短程像素质量之外评估泛化或一致性。
  - 关键差异：差异体现在动力学表示（潜在状态空间模型与扩散视频生成器）以及监督信号（RL目标、物理信息辅助任务、语言原语分解和基准一致性指标）。
  - 趋势演进：在可见的2023-2026前沿期内，研究从高效基于模型的强化学习世界模型走向大规模具身生成模型，再转向面向记忆、空间和动作控制一致性的专用基准。
  - 开放问题：跨域零样本迁移、基准增益与真实部署结果的一致性、以及超越已见上下文、原语或动作空间的泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative driving world models
      what_it_solves: Scene prediction and multi-view video generation for driving
        simulation, using mask reconstruction to improve long-horizon and cross-dataset
        generalization.
      what_remains_open: Evidence that zero-shot driving predictions align with real-world
        safety outcomes is missing; evaluation remains primarily on offline datasets.
    - line: Embodied robot world models with video and action diffusion
      what_it_solves: Representing policy, forward dynamics, inverse dynamics, and
        video generation in unified or compositional architectures for robot learning
        and imagination.
      what_remains_open: Generalization beyond observed language primitives or action
        spaces and real-robot execution beyond simulation remain only partially verified.
    - line: Context-aware model-based reinforcement learning world models
      what_it_solves: Improving sample-efficient policy learning and zero-shot generalization
        under observable context or discrete game tasks.
      what_remains_open: The approach assumes observable context and has limited task
        coverage; broader unknown dynamics and cross-embodiment transfer are not established.
    - line: Benchmarks for world-model consistency
      what_it_solves: Measuring spatial consistency, memory, and action control in
        open-ended or loop-based environments rather than only short-range visual
        fidelity.
      what_remains_open: Benchmark scores are not yet linked to downstream task success
        or real-world deployment reliability.
    consensus:
    - Application-oriented world models increasingly use video generation or latent
      dynamics conditioned on actions, context, or language as a common substrate.
    - Auxiliary objectives such as mask reconstruction, depth or keypoint prediction,
      and latent-context disentanglement are added to improve consistency and generalization.
    - Evaluation is broadening beyond pixel quality to include long-horizon rollout,
      zero-shot transfer, spatial consistency, memory, and action control.
    - Many results are demonstrated in simulation or offline datasets; real-world
      safety and operational evidence remains limited.
    disagreements:
    - 'Dynamics representation: some works use recurrent or state-space latent models,
      while others use diffusion-based pixel or video generators.'
    - 'Supervision signal: RL return optimization, self-supervised reconstruction,
      physics-informed auxiliary tasks, and language-primitive composition emphasize
      different learning targets.'
    - 'Evaluation target: policy score and sample efficiency are compared against
      visual fidelity, physical plausibility, or memory and action-consistency benchmarks.'
    - 'Interaction mode: closed-loop policy training, offline video prediction, action-free
      video pretraining, and benchmark-based assessment coexist.'
    - 'Deployment setting: driving scenes, robot manipulation, and game or navigation
      environments impose different action spaces and constraints.'
    open_questions:
    - Do zero-shot improvements in driving world models transfer across datasets and
      to real safety outcomes?
    - Can compositional robot world models handle novel primitives and real-world
      execution beyond training combinations?
    - How well do spatial or memory consistency benchmark scores predict downstream
      embodied task performance?
    - What mechanisms enable long-term memory consistency and action-space generalization
      in open-domain world models?
    - How can context-conditioned world models relax the assumption of observable
      context in real deployments?
