      尚未覆盖: 超出仿真之外的实机迁移、训练中未见的新语言原语，以及更广泛的多本体数据证据。
    - 路线: 基于模型的强化学习与潜在世界模型
      解决的问题: 从有限交互中学习潜在环境动力学，并在想象中训练策略，用于游戏或控制。
      尚未覆盖: 上下文不可观测时对未见动力学的零样本泛化；评测任务和领域范围较窄。
    - 路线: 面向能力的世界模型基准
      解决的问题: 在像素级视频质量之外，独立测量空间一致性、记忆与动作控制。
      尚未覆盖: 基准分数与下游任务成功之间是否一致；仅有数据集构建而未报告完整实验结果时的诊断力。
    共识:
    - 世界模型被视为以动作、目标、语言或上下文为条件的环境动力学生成或预测模型。
    - 越来越多的研究引入辅助任务或结构化监督，以提升像素生成之外的空间、时间或物理一致性。
    - 评测更加关注泛化：零样本上下文、未见目标、长时域、多视角或开放域重访。
    - 专门的基准正在兴起，用以将记忆、空间一致性和动作控制与生成质量分开衡量。
    - 可复现证据参差不齐：部分论文报告了架构和评测，但缺少可见的局限性细节或完整结果表。
