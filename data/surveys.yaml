  related_work_outline:
  - 'Mainstream direction: Domain-specific generative world models for driving and
    robotics dominate, using diffusion transformers or transformer-VAE hybrids to
    predict video and actions.'
  - 'Shared research pattern: Methods learn controllable rollouts from domain datasets,
    conditioned on actions, language, context, depth, keypoints, or masks, then evaluate
    generation quality, policy utility, or consistency.'
  - 'Key differences: Driving targets multi-view long-horizon scene prediction; robotics
    splits into language-compositional, physics-informed, and unified action-video
    generation; benchmarks probe spatial memory, action control, or model-based RL
    sample efficiency.'
  - 'Trend evolution: From efficient model-based RL in games toward large-scale embodied/driving
    video generation and open-domain consistency benchmarks, with 2024-2026 emphasis
    on robotics and memory.'
  - 'Open questions: Cross-embodiment and simulator-to-real transfer, generalization
    to unseen primitives, contexts, and action spaces, and long-term memory consistency
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：驾驶与机器人等领域特定生成式世界模型为主流，采用扩散Transformer或Transformer-VAE混合架构预测视频与动作。
  - 研究共性：方法从领域数据集学习可控推演，以动作、语言、上下文、深度、关键点或掩码为条件，评估生成质量、策略效用或一致性。
  - 关键差异：驾驶关注多视角长时域场景预测；机器人分为语言组合、物理信息与统一动作-视频生成；基准关注空间记忆、动作控制或基于模型的强化学习样本效率。
  - 趋势演进：从游戏中的高效基于模型的强化学习，走向大规模具身/驾驶视频生成与开放域一致性基准，2024-2026年更强调机器人与记忆。
  - 开放问题：跨本体与仿真到真实迁移、对未见原语/上下文/动作空间的泛化，以及长期记忆一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models
      what_it_solves: Generating controllable multi-view driving video and long-horizon
        scene rollouts from real driving datasets.
      what_remains_open: Whether improvements on video benchmarks transfer to real-world
        safety and operational outcomes.
    - line: Embodied robot world models
      what_it_solves: Generating robot-imagination videos or rollouts from language,
        goal images, depth, keypoints, and actions for policy training and evaluation.
      what_remains_open: Generalization to entirely new primitives and physical deployment
        beyond simulation or curated robot datasets.
    - line: Unified action-video generative pretraining
      what_it_solves: Coupling video and action diffusion in one model to represent
        policy, forward/inverse dynamics, and video generation across robot datasets.
      what_remains_open: Cross-embodiment and cross-dataset robustness, plus whether
        action-free pretraining transfers broadly.
    - line: Model-based reinforcement learning with world models
      what_it_solves: Sample-efficient policy improvement from imagined trajectories
        in contextual RL and game environments.
      what_remains_open: Reliance on observed context and evaluation limited to narrow
        benchmark settings.
    - line: Interactive-world memory and consistency benchmarks
      what_it_solves: Measuring spatial consistency, memory, and action control in
        open-domain or game-like navigation videos.
      what_remains_open: Long-term memory consistency and generalization across action
        spaces; evidence remains benchmark-construction focused.
    consensus:
    - World models are being applied as controllable generative simulators or dynamics
      models for downstream control and evaluation.
    - Recent work favors transformer/diffusion-style components and multimodal conditioning
      by actions, language, context, depth, keypoints, or masks.
    - Evaluation increasingly includes domain-specific datasets and benchmarks, but
      evidence of cross-domain or real-world validity is scarce.
    - Many papers report reproducible artifacts or public datasets, yet limitations
      sections and real-world outcome data are often missing.
    disagreements:
    - 'Representation differs: latent recurrent state-space dynamics, transformer-VAE
      stochastic models, and diffusion-based video/action generation.'
    - 'Supervision differs: physics-informed depth/keypoint tasks, language-primitive
      factorization, mask reconstruction, or unified action-video diffusion objectives.'
    - 'Evaluation target differs: driving multi-view video quality, robot execution
      utility, Atari sample efficiency, spatial memory consistency, or memory and
      action control.'
    - 'Interaction mode differs: open-loop video prediction, closed-loop policy rollouts,
      and revisit-based benchmark navigation.'
    - 'Deployment setting differs: simulation-only robot evaluation, controlled driving
      datasets, large real robot datasets, and game or open-domain environments.'
    open_questions:
    - Do driving video metrics and rollout gains translate to real-world safety outcomes
      across datasets and conditions?
    - Can compositional robot world models handle novel language primitives and new
      physical interactions beyond seen combinations?
    - Are contextual world models effective when context is unobserved and beyond
      limited benchmark tasks?
    - How should memory consistency and action control be measured for long-horizon,
      open-domain world models across ego viewpoints and action spaces?
    - What is the evidence gap between reported benchmark performance and deployment
      robustness in robotics and driving?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型
      解决的问题: 从真实驾驶数据生成可控多视角视频和长时域场景推演。
      尚未覆盖: 视频基准提升能否转化为真实安全与运营结果仍不明确。
    - 路线: 具身机器人世界模型
      解决的问题: 根据语言、目标图像、深度、关键点和动作生成机器人想象视频或推演，以支持策略训练与评估。
      尚未覆盖: 向全新原语和仿真之外物理部署的泛化尚未充分验证。
    - 路线: 统一动作-视频生成预训练
      解决的问题: 在单一模型中耦合视频与动作扩散，表示策略、前向/逆动力学和视频生成。
      尚未覆盖: 跨本体、跨数据集鲁棒性及无动作视频预训练的广泛迁移仍需证据。
    - 路线: 基于模型的强化学习世界模型
      解决的问题: 从想象轨迹中实现样本高效策略改进，用于上下文强化学习和游戏环境。
      尚未覆盖: 依赖可观测上下文，且评估局限于较窄基准设置。
    - 路线: 交互世界记忆与一致性基准
      解决的问题: 测量开放域或游戏式导航视频中的空间一致性、记忆和动作控制。
      尚未覆盖: 长期记忆一致性和跨动作空间泛化仍是挑战；证据以基准构建为主。
    共识:
    - 世界模型被用作可控生成模拟器或动力学模型，以服务下游控制与评估。
    - 近期工作倾向采用扩散/Transformer组件，并以动作、语言、上下文、深度、关键点或掩码进行多模态条件化。
    - 评估越来越多使用领域专用数据集和基准，但跨领域或真实有效的证据仍少。
    - 多篇论文公开代码或数据集，但局限性与真实结果数据常缺失，构成验证缺口。
    分歧:
    - 表示方式不同：潜在循环状态空间动力学、Transformer-VAE随机模型与基于扩散的视频/动作生成。
    - 监督信号不同：物理信息深度/关键点任务、语言原语分解、掩码重建或统一动作-视频扩散目标。
    - 评测目标不同：驾驶多视角视频质量、机器人执行效用、Atari样本效率、空间记忆一致性或记忆与动作控制。
    - 交互模式不同：开环视频预测、闭环策略推演和基于回访的基准导航。
    - 部署场景不同：仅仿真机器人评估、受控驾驶数据集、大规模真实机器人数据集及游戏/开放域环境。
    开放问题:
    - 驾驶视频指标与推演收益能否在跨数据集和真实安全结果中成立？
    - 组合式机器人世界模型能否处理全新语言原语和新的物理交互？
    - 当上下文不可观测且超出有限基准任务时，上下文世界模型是否有效？
    - 如何评测长时域开放域世界模型在不同视角和动作空间下的记忆一致性与动作控制？
    - 报告基准性能与机器人/驾驶部署鲁棒性之间尚有多少证据缺口？
