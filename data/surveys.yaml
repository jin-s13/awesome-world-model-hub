    - 组合式机器人世界模型能否泛化到训练期间完全未见的新原语动作或物体，而不仅是重新组合已见原语？
    - 哪种指标或测试最能预测世界模型能否在未见场景和视角下保持长期记忆一致性和动作控制能力？
    - 当上下文或物理参数是潜在而非直接可观测时，零样本动力学泛化是否仍然可靠？
