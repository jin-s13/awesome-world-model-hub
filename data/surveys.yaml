    consensus:
    - World models are framed as a unifying abstraction connecting video generation,
      autonomous driving, and embodied agents.
    - Latent representation, temporal stability, and closed-loop versus open-loop
      evaluation are recurrent dimensions used to organize the field.
    - Existing surveys and taxonomies agree that evaluation gaps, especially long-horizon
      consistency and real-world transfer, remain major open issues.
    - The packet's citation scores are mostly unavailable, so the synthesis relies
      on visible abstract, methodology, results, and limitation evidence rather than
      citation prestige.
    disagreements:
    - Broad world-model surveys emphasize general video simulation and physical plausibility,
      while domain-specific syntheses prioritize decision-ready latent representations
      and structural priors for automated driving.
    - Some works validate claims through simulation or benchmark results such as traffic
      simulation, robot execution, or controllable frame prediction, whereas others
      only propose conceptual taxonomies without empirical testing.
    - 'Evaluation targets differ substantially: one line targets open-ended video
      realism, another targets closed-loop motion planning, and another targets fine-grained
      ego-motion, object, and pose control.'
    - Assumptions about how much structure is needed diverge, from continuous states
      and discrete tokens to hybrid latent worlds, but the packet does not contain
      enough implementation detail to resolve which assumption is preferable.
    open_questions:
    - Which taxonomy dimensions best predict downstream closed-loop performance instead
      of short-horizon generation quality?
    - Can a unified evaluation suite compare broad video world models with domain-specific
      latent world models without conflating observation spaces, action spaces, and
      resource constraints?
    - How do missing limitation details for novel primitive generalization, out-of-sight
      dynamics, and real-world execution affect current survey conclusions?
    - What minimal reporting standards for code, datasets, baselines, and metrics
      would make survey conclusions reproducible and non-selective?
