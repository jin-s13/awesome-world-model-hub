  related_work_outline_zh:
  - 主流方向：生成式视频/扩散世界模型（如 MaskGWM、RoboScape、UWM）占据证据主体，随机潜变量序列模型仍面向控制任务。
  - 研究共性：学习预测性动力学或视频推演，并用于策略搜索、预训练或预测质量评测。
  - 关键差异：表示从紧致潜状态序列模型到像素级扩散视频生成；监督包括控制回报、重建/生成损失、辅助物理任务和一致性指标。
  - 趋势演进：从 Atari/CARL 控制基准扩展到驾驶、Minecraft 和机器人视频基准，强调长时域、多视角、记忆一致性和动作控制。
  - 开放问题：跨任务族迁移、上下文可观测性、闭环长时记忆一致性、动作空间泛化，以及方法贡献与系统选择的隔离。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion and generative video world models with auxiliary objectives
      what_it_solves: Turning raw visual observations and conditioning signals into
        predictive video for driving, Minecraft, and robot settings, using reconstruction,
        physics, or mask tasks to improve fidelity.
      what_remains_open: Reported gains are not yet isolated from base diffusion architectures,
        dataset scale, or task priors; long-horizon physical plausibility and transfer
        beyond shown domains remain unverified.
    - line: Stochastic latent sequence models for model-based reinforcement learning
      what_it_solves: Learning compact latent dynamics and using imagined rollouts
        to train policies under limited environment interaction, including contextual
        dynamics for zero-shot generalization.
      what_remains_open: Evidence is concentrated on Atari 100k and two CARL tasks;
        context observability is assumed, and policy gains from the world model versus
        planner or task simplification are not separated.
    - line: Action-coupled video and dynamics models for robot policy pretraining
      what_it_solves: Jointly modeling actions and videos in one architecture to represent
        policies, forward dynamics, inverse dynamics, and video generation from multitask
        robot data.
      what_remains_open: Evaluation is mostly simulation or dataset synthesis; real-robot
        execution and generalization to truly novel primitives or unseen action spaces
        remain insufficiently evidenced.
    - line: Compositional and physics-informed embodied video generation
      what_it_solves: Factorizing language-conditioned video into primitives or adding
        depth and keypoint dynamics to improve compositional and physically plausible
        robot video synthesis.
      what_remains_open: Compositional generalization is bounded by seen primitive
        combinations and parsing accuracy; physical realism is judged on visual and
        plausibility metrics rather than robust closed-loop control.
    - line: World-model evaluation protocols for memory, spatial consistency, and
        action control
      what_it_solves: Benchmarking closed-loop recall, scene-graph-level spatial consistency,
        and action-conditioned control beyond pixel reconstruction quality.
      what_remains_open: Benchmarks primarily expose current model weaknesses; there
        is no evidence in this packet that proposed models surpass these protocols
        or that scores track downstream task success.
    consensus:
    - Predictive generation is now a core world-model objective, often coupled with
      auxiliary tasks such as mask reconstruction, depth prediction, keypoint dynamics,
      or language-based decomposition.
    - Model-based control methods rely on imagined or generated rollouts for policy
      learning or policy evaluation instead of only using real environment interactions.
    - Evaluation is expanding from short-horizon visual quality or episodic return
      toward long-horizon, multi-view, spatial consistency, memory, and action-control
      signals.
    - Reported strengths are usually demonstrated in curated simulations, game platforms,
      or driving and robot video datasets rather than in unconstrained physical deployment.
    disagreements:
    - 'Representation: compact latent state-space or Transformer-VAE models for control
      differ from pixel-space generative video models conditioned on language, action,
      or physics.'
    - 'Supervision: some methods optimize for control returns through imagined rollouts;
      others optimize video reconstruction or generation, auxiliary physics losses,
      or joint action-video diffusion.'
    - 'Evaluation target: Atari 100k and CARL measure episodic control performance,
      while driving benchmarks, Minecraft loop-navigation, and open-domain memory
      benchmarks measure video fidelity, spatial consistency, memory, and action control.'
    - 'Interaction assumption: observable context, predefined language primitives,
      shared action spaces, or action-free video data lead to different generalization
      boundaries.'
    - 'Deployment setting: simulated robot execution, open-loop video generation,
      and closed-loop navigation benchmarks imply different levels of grounding and
      readiness.'
    open_questions:
    - How effectively do auxiliary mask, depth, keypoint, or consistency objectives
      transfer across domains beyond driving and robot video?
    - How much of the reported policy or planning gain is attributable to the learned
      world model rather than dataset scale, planner, or controller choices?
    - Can current models maintain long-horizon memory and spatial consistency under
      closed-loop action-controlled evaluation?
    - Do contextual state-space methods remain effective when context variables are
      not observable or when tasks extend beyond two benchmark variants?
    - Are the new consistency and action-control benchmark scores predictive of downstream
      robot or agent success?
    - What verification is missing for real-robot execution and open-world generalization
      given that several papers report simulation or curated video results only?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散/生成式视频的世界模型与辅助目标
      解决的问题: 将原始视觉观测和条件信号转化为驾驶、Minecraft 和机器人场景中的预测视频，利用重建、物理或掩码任务提升保真度。
      尚未覆盖: 报告增益尚未与基础扩散架构、数据规模和任务先验隔离；长时域物理合理性与跨域迁移仍未验证。
    - 路线: 面向模型强化学习的随机潜变量序列模型
      解决的问题: 学习紧凑潜在动力学并通过想象轨迹训练策略，支持上下文动力学下的零样本泛化。
      尚未覆盖: 证据集中在 Atari 100k 和两个 CARL 任务；假设上下文可观测，且策略收益未与模型、规划器或任务简化因素分离。
    - 路线: 面向机器人策略预训练的动作-视频耦合模型
      解决的问题: 在单一架构中联合建模动作与视频，表示策略、前向动力学、逆动力学和视频生成。
      尚未覆盖: 评估多在仿真或数据集合成中完成；真实机器人执行及对全新原语或未知动作空间的泛化证据不足。
    - 路线: 组合式与物理信息驱动的具身视频生成
      解决的问题: 通过语言原语分解或深度和关键点动力学提高机器人视频的组合性与物理合理性。
      尚未覆盖: 组合泛化受限于已见原语组合和解析准确性；物理合理性评测替代了稳健闭环控制证据。
    - 路线: 面向记忆、空间一致性和动作控制的世界模型评测协议
      解决的问题: 测量闭环回忆、场景图级空间一致性以及动作条件控制，超越像素重建质量。
      尚未覆盖: 基准主要暴露模型弱点；目前证据未表明模型能超越这些协议，或评分与下游任务成功相关。
    共识:
    - 预测生成已成为核心世界模型目标，通常与掩码重建、深度预测、关键点动力学或语言分解等辅助任务耦合。
    - 基于模型的控制方法依赖想象或生成轨迹进行策略学习或评估，而非仅依赖真实环境交互。
    - 评测正从短时域视觉质量或回合回报扩展到长时域、多视角、空间一致性、记忆和动作控制。
    - 报告的优势通常在仿真、游戏平台或驾驶/机器人视频数据集中展示，而非无约束物理部署。
    分歧:
    - 表示不同：面向控制的紧凑潜状态序列模型与以语言、动作或物理信号为条件的像素级生成视频模型并存。
    - 监督不同：部分方法通过想象轨迹优化控制回报，其他方法优化视频重建/生成、辅助物理损失或联合动作-视频扩散。
    - 评测目标不同：Atari 100k 和 CARL 测量回合控制性能，而驾驶、Minecraft 闭环导航和开放域记忆基准测量视频保真度与一致性。
    - 交互假设不同：可观测上下文、预定义语言原语、共享动作空间或无动作视频数据导致不同的泛化边界。
    - 部署场景不同：仿真机器人执行、开环视频生成和闭环导航基准隐含不同的落地成熟度。
    开放问题:
    - 辅助掩码、深度、关键点或一致性目标在驾驶和机器人视频之外的跨域迁移效果如何？
    - 策略或规划收益中有多少来自学习到的世界模型，而非数据规模、规划器或控制器选择？
    - 当前模型能否在闭环动作控制评测下维持长时域记忆与空间一致性？
    - 当上下文变量不可观测或任务超出两个 CARL 变体时，上下文状态空间方法是否仍然有效？
    - 新的一致性和动作控制基准分数能否预测下游机器人或智能体任务成功？
    - 多篇论文仅在仿真或精选视频结果上展示，真实机器人执行和开放世界泛化缺少哪些验证？
