  - 主流方向：生成式世界模型集中于驾驶和具身控制，近期以扩散Transformer和视频生成为主，并出现用于一致性与动作控制的基准。
  - 研究共性：将视频预测与掩码重建、深度/关键点物理、语言原语、动作扩散或上下文等辅助信号耦合，并通过下游任务或基准指标评估。
  - 关键差异：监督信号和评测目标不同，涵盖驾驶长时域、机器人策略、Atari控制、记忆与动作一致性；交互方式也有开环、动作条件和闭环之分。
  - 趋势演进：顶级证据中2023–2024偏样本高效强化学习与上下文零样本；2025–2026转向物理信息机器人、统一视频-动作预训练和开放域一致性基准，早期年份证据不足。
  - 开放问题：仿真和基准收益能否转化为真实运营与安全；能否跨未见原语、上下文和本体泛化；如何统一物理合理性与长期一致性指标；以及局限性证据缺失。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and multi-view simulation
      what_it_solves: Long-horizon, multi-view driving video prediction and zero-shot
        transfer across driving datasets.
      what_remains_open: Evidence reports benchmark gains but not real-world safety
        or operational alignment; limitation details are not reported.
    - line: Language- and physics-grounded robot video generation
      what_it_solves: Generating robot action plans and videos with compositional
        language primitives or physical auxiliary tasks for policy training and evaluation.
      what_remains_open: Generalization beyond seen primitive combinations and simulation-only
        validation; real-robot transfer and physical plausibility metrics remain open.
    - line: Efficient stochastic model-based reinforcement learning for visual control
      what_it_solves: Sample-efficient policy learning from pixels using stochastic
        latent dynamics and imagined trajectories.
      what_remains_open: Demonstrated mainly on Atari in this evidence; transfer to
        broader interactive or real domains remains unverified.
    - line: Contextual world models for zero-shot dynamics generalization
      what_it_solves: Disentangling latent state from observable context to improve
        zero-shot control under novel context values.
      what_remains_open: Assumes observable context and uses narrow benchmark tasks;
        broader dynamics changes and real settings are unverified.
    - line: Interactive consistency and action-control benchmarks
      what_it_solves: Providing open-domain datasets and metrics for spatial consistency,
        memory consistency, and action control in world models.
      what_remains_open: Evidence focuses on dataset and benchmark construction; current
        models still struggle with long-term memory and cross-action generalization.
    consensus:
    - Across driving, robotics, games, and benchmark studies, world models are trained
      on video or visual states and evaluated by prediction quality plus downstream
      task performance.
    - Recent architectures rely on transformer or diffusion backbones and introduce
      auxiliary objectives such as mask reconstruction, physics signals, language
      parsing, action diffusion, or context conditioning to improve consistency, control,
      or generalization.
    - Public datasets and benchmarks are increasingly used to probe properties missing
      from single-step metrics, including spatial consistency, memory consistency,
      and action control.
    - Most evidence remains at benchmark or simulation level; real-world deployment
      evidence is limited.
    disagreements:
    - 'Supervision differs: some models use action-free video, while others couple
      video with action, language primitives, context values, or physics auxiliary
      tasks.'
    - 'Evaluation targets differ: long-horizon driving rollouts, robot policy success
      or video plausibility, Atari human-normalized scores, and consistency benchmark
      metrics coexist.'
    - 'Interaction mode differs: open-loop video generation, action-conditioned generation,
      closed-loop revisited navigation, and action-free pretraining with downstream
      policy fine-tuning.'
    - 'Grounding strategy differs: explicit observable context or language parsing
      versus implicit physics, depth, or keypoint constraints, which changes generalization
      assumptions.'
    open_questions:
    - Do reported driving and robot simulation gains transfer to real-world safety,
      operations, or deployment? This packet lacks that evidence.
    - Can compositional or contextual models handle unseen primitives, contexts, embodiments,
      and broader dynamics shifts beyond the limited benchmarks shown?
    - Which metrics should replace or complement video fidelity to capture physical
      plausibility, long-term memory consistency, and action control?
    - Several top papers leave limitations blank; are these actual absences or unreported
      verification gaps?
