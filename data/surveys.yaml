  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models that predict
    video or latent futures under action conditions, often using diffusion transformers
    or stochastic latent dynamics for driving, robotics, and reinforcement learning.'
  - 'Shared research pattern: Papers combine self-supervised video generation with
    auxiliary objectives such as mask reconstruction, depth or keypoint prediction,
    context conditioning, or action-video diffusion to improve generalization and
    downstream policy learning.'
  - 'Key differences: Representation choices include stochastic latent state-space
    models and diffusion over video tokens; supervision ranges from pure generation
    or reconstruction to physics-informed auxiliary signals; interaction modes range
    from unified action-video diffusion to separate planners or policies.'
  - 'Trend evolution: From 2023 stochastic transformer world models for sample-efficient
    reinforcement learning, the frontier moves toward 2024-2026 embodied and driving
    diffusion world models evaluated on memory, spatial consistency, and action-control
    benchmarks.'
  - 'Open questions: Long-horizon memory consistency, cross-action-space generalization,
    attribution of gains to model versus planner or pretraining, physical plausibility
    beyond training scenes, and whether observable-context assumptions can be relaxed
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中在以视频或潜在未来为预测对象的生成式世界模型，通常在动作条件下使用扩散Transformer或随机潜在动力学，面向驾驶、机器人学和强化学习。
  - 研究共性：论文将自监督视频生成与辅助目标结合，如掩码重建、深度或关键点预测、上下文条件化或动作-视频扩散，以改善泛化和下游策略学习。
  - 关键差异：表示方式包括随机潜在状态空间模型和对视频token建模的扩散模型；监督信号从纯生成或重建到物理信息辅助信号；交互模式从统一动作-视频扩散到分离的规划器或策略。
  - 趋势演进：从2023年面向样本高效强化学习的随机Transformer世界模型，发展到2024-2026年具身与驾驶扩散世界模型，并在记忆、空间一致性和动作控制基准上进行评测。
  - 开放问题：长时域记忆一致性、跨动作空间泛化、收益来自模型还是规划器或预训练、训练场景之外的物理合理性、以及可观测上下文假设能否放宽仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models with spatial-temporal objectives
      what_it_solves: Predicts long-horizon, multi-view, or physically plausible futures
        for driving and robot scenarios by combining diffusion or transformer architectures
        with mask, depth, or keypoint auxiliary tasks.
      what_remains_open: Transfer beyond reported datasets is not established; physical
        plausibility metrics and limitation analyses are often absent, leaving generalization
        boundaries unverified.
    - line: Stochastic latent dynamics and contextual recurrent state-space models
      what_it_solves: Enables sample-efficient model-based reinforcement learning
        and zero-shot generalization to unseen dynamics by conditioning latent state
        inference and imagined rollouts on context or stochastic transitions.
      what_remains_open: Observability and task coverage are narrow; known context
        values are assumed and evaluation is limited to a small number of contextual
        tasks, while long-term memory consistency is only partially benchmarked.
    - line: Unified action-video interfaces and compositional generation
      what_it_solves: Connects world-model predictions to actions by jointly modeling
        video and action diffusion, or by decomposing language instructions into primitives
        for compositional robot video plans.
      what_remains_open: Attribution between the learned model, planning or action
        prior, and pretraining remains unclear; compositional generalization appears
        limited to seen primitive combinations and simulation-based evaluation.
    - line: Closed-loop memory, spatial consistency, and action-control benchmarks
      what_it_solves: Provides datasets and metrics for evaluating long-term memory
        and action following in world models through loop navigation or scene revisiting.
      what_remains_open: Benchmark papers report limited or no model comparison results
        in the abstract, so their ability to isolate model quality and drive method
        improvement still needs evidence.
    consensus:
    - Self-supervised video or latent prediction is a core training signal across
      embodied, driving, and reinforcement-learning world models.
    - Recent systems increasingly treat memory, spatial consistency, or action control
      as quality targets rather than only short-horizon generation fidelity.
    - Many methods use pretraining or auxiliary objectives to improve generalization
      beyond imitation learning or non-contextual baselines.
    disagreements:
    - 'Representation choices diverge: stochastic latent state-space models versus
      diffusion transformers over video or latent tokens.'
    - 'Supervision strategies diverge: some methods add physics-informed signals such
      as depth and keypoints, while others rely only on generation, reconstruction,
      or action-conditioning losses.'
    - 'Interaction and planning interfaces diverge: some models couple actions and
      video in one diffusion process, while others keep the world model separate from
      downstream policy or planner.'
    - 'Evaluation settings diverge: sample-limited Atari, contextual reinforcement-learning
      tasks, driving open-loop or zero-shot benchmarks, Minecraft loop consistency,
      and robot video planning produce different generalization evidence.'
    open_questions:
    - How can world models maintain long-horizon memory consistency and action control
      across repeated viewpoints and action spaces?
    - Which auxiliary objectives or physics signals are necessary and sufficient for
      physically plausible generation outside training scenarios?
    - How much of reported policy or zero-shot gains is due to the learned world model
      rather than pretraining scale, task priors, planners, or evaluation selection?
    - Can context-conditioned and compositional methods generalize when context values
      are unobserved or when tasks require unseen primitive combinations?
    - Do closed-loop benchmarks without reported baseline results reflect model capability,
      or are they primarily dataset and metric proposals needing method comparison
      evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具有时空目标的生成式视频世界模型
      解决的问题: 通过扩散或Transformer架构结合掩码、深度或关键点辅助任务，为驾驶和机器人场景预测长时域、多视角或物理合理的未来。
      尚未覆盖: 迁移到报告数据集之外的证据不足；物理合理性度量和局限性分析常缺失，泛化边界尚未验证。
    - 路线: 随机潜在动力学与上下文循环状态空间模型
      解决的问题: 通过将潜在状态推断和想象轨迹条件化于上下文或随机转移，实现样本高效的基于模型强化学习和对未见动力学的零样本泛化。
      尚未覆盖: 上下文可观测性和任务覆盖较窄；方法假设上下文值已知且仅在少量上下文任务上评估，长期记忆一致性仅部分评测。
    - 路线: 统一动作-视频接口与组合式生成
      解决的问题: 通过联合建模视频与动作扩散，或将语言指令分解为原语来实现组合式机器人视频规划，从而连接世界模型预测与行动。
      尚未覆盖: 模型、规划或动作先验与预训练之间的贡献归属仍不清楚；组合泛化似乎限于见过的原语组合及仿真评估。
    - 路线: 闭环记忆、空间一致性与动作控制基准
      解决的问题: 通过循环导航或场景重访提供数据集和指标，评估世界模型的长期记忆和动作跟随能力。
      尚未覆盖: 基准论文摘要中报告有限或无模型对比结果，其隔离模型质量并推动方法改进的能力仍需证据。
    共识:
    - 自监督视频或潜在预测是具身、驾驶和强化学习世界模型中的核心训练信号。
    - 近期系统越来越多将记忆、空间一致性或动作控制作为质量目标，而不只是短时域生成保真度。
    - 许多方法利用预训练或辅助目标来超越模仿学习或非上下文基线的泛化。
    分歧:
    - 表示选择分化：随机潜在状态空间模型与对视频或潜在token建模的扩散Transformer并存。
    - 监督策略分化：一些方法加入深度和关键点等物理信息信号，而另一些仅依赖生成、重建或动作条件损失。
    - 交互与规划接口分化：有的模型在同一个扩散过程中耦合动作与视频，有的将世界模型与下游策略或规划器分离。
    - 评测场景分化：样本受限Atari、上下文强化学习任务、驾驶开环或零样本基准、Minecraft循环一致性、机器人视频规划产生不同的泛化证据。
    开放问题:
    - 世界模型如何在重复视角和动作空间中维持长期记忆一致性和动作控制？
    - 为了在训练场景之外实现物理合理生成，哪些辅助目标或物理信号是必要且足够的？
    - 报告的策略或零样本收益中，有多少来自学习到的世界模型，而非预训练规模、任务先验、规划器或评测选择？
    - 当上下文值不可观测或任务需要未见原语组合时，上下文条件化和组合式方法能否泛化？
    - 未报告基线结果的闭环基准能否反映模型能力，还是仅作为需要方法对比证据的数据集和指标提案？
