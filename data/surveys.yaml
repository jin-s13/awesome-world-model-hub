  related_work_outline:
  - 'Mainstream direction: Standardized evaluation of world models has shifted toward
    coupling action-conditioned video/dynamics prediction with consistency, memory,
    visual-detail, and downstream policy-utility metrics rather than single-frame
    generation quality alone.'
  - 'Shared research pattern: Papers introduce or rely on shared datasets and benchmark
    environments, use unified metrics for action controllability and long-horizon
    stability, and compare diffusion- or transformer-based world models against prior
    baselines.'
  - 'Key differences: Evaluation goals differ across pixel/control performance, spatial
    and memory consistency, driving or robotic cross-domain transfer, physical plausibility,
    and contextual generalization; supervision and interaction modes also differ.'
  - 'Trend evolution: The available top evidence is concentrated in 2023-2026, showing
    a progression from Atari training-efficiency and visual-generation benchmarks
    toward contextual generalization, diffusion-based visual details, large-scale
    driving/robotic evaluation, and explicit memory/spatial consistency benchmarks.'
  - 'Open questions: Proxy metrics may not align with real downstream decisions; benchmark
    coverage of real-world distribution shift and cross-action-space generalization
    is unclear; limited limitation and citation evidence leaves comparison stability
    uncertain.'
  related_work_outline_zh:
  - 主流方向：世界模型的标准化评测从单一图像质量转向动作控制、长时一致性、记忆、视觉细节与下游策略效用的联合衡量。
  - 研究共性：研究依赖共享数据集或基准环境，采用统一指标比较扩散或Transformer世界模型在动作控制和长时间稳定性上的表现。
  - 关键差异：评测目标包括像素/控制得分、空间与记忆一致性、驾驶或机器人跨域迁移、物理合理性以及上下文泛化，监督信号和交互方式并不相同。
  - 趋势演进：可见高证据集中在2023-2026年，从Atari训练效率与视觉生成基准，逐步转向上下文泛化、扩散视觉细节、大规模驾驶/机器人和记忆一致性评测。
  - 开放问题：代理指标是否对应真实决策价值，现有基准能否覆盖真实域漂移和跨动作空间泛化，以及结论在算力和基线变化下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Consistency-oriented dataset and metric construction
      what_it_solves: Creates loop-navigation, revisited-video, and memory-control
        evaluation sets for exposing spatial inconsistency and long-horizon memory
        failures in world models.
      what_remains_open: Whether curated environments transfer to real-world settings
        and whether consistency scores align with downstream policy or safety value.
    - line: Action-controlled video and dynamics benchmark suites
      what_it_solves: Evaluates whether generated video or latent dynamics obey actions
        and support policy learning on shared game, driving, or robot datasets.
      what_remains_open: Coverage across action spaces, scenes, and long-horizon tasks;
        aggregate scores may hide failures in local controllability and visual-physical
        alignment.
    - line: Control and contextual generalization benchmarks
      what_it_solves: Tests world-model-trained policies under distribution shift,
        including unseen contexts or dynamics, instead of only training-distribution
        performance.
      what_remains_open: Evidence is limited to few tasks and often assumes observable
        context; broader generalization beyond simplified settings remains unverified.
    - line: Physics- and geometry-aware evaluation for embodied generation
      what_it_solves: Adds depth, keypoint, or physics-oriented plausibility measures
        to video-world-model assessment for robotic and embodied scenarios.
      what_remains_open: There is no shared physical-plausibility metric or benchmark;
        validation mostly uses visual and downstream policy evidence rather than real-world
        physical interaction.
    consensus:
    - Current world-model benchmarks combine a dataset or environment with standardized
      metrics, emphasizing action-conditioned generation and long-horizon consistency.
    - Evaluation increasingly includes downstream policy or control utility, not only
      reconstruction or generation quality.
    - Diffusion- and transformer-based world models have become the main evaluation
      targets, with shared benchmarks used to compare controllability and visual realism.
    - Evidence is often benchmark-specific and relies on aggregate scores; limitation
      reporting and reproducibility signals vary across papers.
    disagreements:
    - 'Evaluation target differs: some work targets game score and training efficiency,
      others spatial or memory consistency, driving or robotic transfer, contextual
      generalization, or physical plausibility.'
    - 'Supervision and representation differ: some use paired action sequences, some
      learn from action-free video or independently timed action/video diffusion,
      and some assume observable context values.'
    - 'Interaction mode differs: open-loop prediction, closed-loop revisited navigation,
      and policy rollouts inside learned models coexist, producing conclusions that
      are not directly comparable.'
    - 'Metric granularity differs: aggregate human-normalized scores or validation
      SOTA coexist with per-ability scores such as scene-graph consistency, memory
      consistency, and action-control measures.'
    open_questions:
    - Do consistency metrics such as scene-graph or memory scores predict real downstream
      robot or driving policy success?
    - Can benchmark tasks cover multi-view, long-horizon, and cross-action-space distribution
      shifts without overfitting to curated environments?
    - What evaluation design can separate visual detail from physical causality and
      action controllability in diffusion-based world models?
    - Given missing OpenAlex citation evidence and uneven baseline or limitation reporting,
      how stable are benchmark rankings across implementations and compute budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 一致性导向的数据集与指标构建
      解决的问题: 构造循环导航、回访视频和记忆控制评测集，发现世界模型在空间一致性和长期记忆上的失效。
      尚未覆盖: 人工构建环境是否迁移到真实世界，一致性分数是否与下游策略或安全价值一致仍未验证。
    - 路线: 动作控制的视频与动力学基准套件
      解决的问题: 在共享游戏、驾驶或机器人数据上评估生成视频或潜在动力学是否服从动作并支持策略学习。
      尚未覆盖: 动作空间、场景和长时任务覆盖不足；汇总得分可能掩盖局部可控性和视觉-物理对齐失败。
    - 路线: 控制与上下文泛化基准
      解决的问题: 测试基于世界模型训练的策略在未见上下文或动力学下的泛化能力，而不是只看训练分布表现。
      尚未覆盖: 证据仅来自少量任务，且常假设上下文可观测，更广泛泛化仍未验证。
    - 路线: 物理与几何感知的具身生成评估
      解决的问题: 将深度、关键点或物理导向的合理性指标引入视频世界模型评测，用于机器人和具身场景。
      尚未覆盖: 缺乏共享的物理合理性指标或基准，验证主要依赖视觉和下游策略证据，而非真实物理交互。
    共识:
    - 当前世界模型基准通常将共享数据或环境与统一指标结合，重点考察动作条件生成和长时程一致性。
    - 评测越来越多纳入下游策略或控制效用，而不只看重建或生成质量。
    - 基于扩散和Transformer的世界模型成为主要评测对象，基准测试强调动作可控性和视觉真实性。
    - 证据多来自基准特定总分，局限性说明和可复现信号在不同论文间参差不齐。
    分歧:
    - 评测目标不同：有的关注游戏得分和训练效率，有的关注空间或记忆一致性、驾驶或机器人迁移、上下文泛化或物理合理性。
    - 监督和表示不同：有的使用成对动作序列，有的支持无动作视频或独立动作/视频扩散时间步，还有的假设上下文可观测。
    - 交互模式不同：开环预测、闭环回访导航和策略在学得模型中展开并存，导致结论难以直接比较。
    - 指标粒度不同：人类归一化得分或验证SOTA与场景图一致性、记忆一致性和动作控制等分项指标并存，可能掩盖不同失败模式。
    开放问题:
    - 场景图或记忆一致性指标能否预测真实机器人或驾驶策略的下游成功？
    - 基准任务能否覆盖多视角、长时程和跨动作空间的分布漂移，而不只是过度拟合人工场景？
    - 什么样的评测设计能区分扩散世界模型中的视觉细节与物理因果性、动作可控性？
    - 在OpenAlex引用证据缺失和基线或局限性报告不均的情况下，基准排名在不同实现和算力预算下是否稳定？
