  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world-model simulation pipelines
      what_it_solves: Turning pretrained or recurrent generative models into controllable
        future-frame simulators for driving, robotics, and games.
      what_remains_open: Long-horizon rollouts, cross-scene/cross-sensor generalization,
        and multi-GPU deployment are not yet demonstrated.
    - line: Physics- and geometry-informed simulation
      what_it_solves: Improving physical plausibility and geometric consistency via
        depth, keypoint, scene-graph, or structural learning signals.
      what_remains_open: Evaluation is often limited to selected domains; trade-offs
        with fine-grained visual detail and out-of-distribution behavior remain unclear.
    - line: Real-time interactive serving and closed-loop deployment
      what_it_solves: Meeting low-latency requirements for interaction; for example,
        sub-second single-GPU inference in closed-loop driving.
      what_remains_open: Scalability to complex scenes, multi-GPU settings, and live
        user-specific deployments is not established.
    - line: Open benchmarks and reproducible artifacts
      what_it_solves: Providing datasets, metrics, and code for action fidelity and
        spatial consistency, such as LoopNav and ACT-Bench.
      what_remains_open: Independent reproduction across teams and infrastructure,
        and coverage beyond Minecraft, nuScenes, CARL, or similar settings, remain
        verification gaps.
    consensus:
    - Controllable future-frame generation is treated as a core system capability
      for simulation and policy evaluation.
    - Evaluation should move beyond pixel-level fidelity to include action following,
      spatial consistency, and physical plausibility.
    - Combining generative learning with structured, geometric, or physics-oriented
      signals improves controllability and realism.
    - Reproducible datasets, metrics, and code are increasingly part of the system
      contribution.
    disagreements:
    - 'Representation: some systems use latent recurrent state-space models, while
      others adapt pretrained diffusion or autoregressive video generators.'
    - 'Supervision: works differ in using explicit physics tasks, motion-reinforced
      losses, explicit context conditioning, or benchmark-level consistency metrics.'
    - 'Evaluation target: zero-shot dynamics generalization, action fidelity, spatial
      consistency, and closed-loop driving metrics reflect different priorities.'
    - 'Deployment focus: some systems target offline benchmark quality, while others
      optimize sub-second single-GPU interactivity.'
    open_questions:
    - How well do current simulators preserve long-horizon, cross-view, and out-of-distribution
      behavior beyond nuScenes or limited CARL tasks?
    - Can the available benchmarks and artifacts support independent reproduction
      across hardware, teams, and user-specific settings?
    - What is the acceptable trade-off between dynamic controllability and fine-grained
      visual fidelity for downstream policy learning?
    - Does the assumption of observable context limit zero-shot generalization in
      real-world settings?
    - What failure boundaries are hidden when limitations are not reported in several
      system papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的世界模型模拟流水线
      解决的问题: 将预训练或循环生成模型转化为面向驾驶、机器人和游戏的可控未来帧模拟器。
      尚未覆盖: 长时域推演、跨场景/跨传感器泛化以及多GPU部署尚未得到验证。
    - 路线: 物理与几何信息驱动的模拟
      解决的问题: 通过深度、关键点、场景图或结构学习信号提升物理合理性与几何一致性。
      尚未覆盖: 评测常限于特定领域；细粒度视觉细节权衡与分布外行为仍不清晰。
    - 路线: 实时交互式服务与闭环部署
      解决的问题: 满足交互所需的低延迟，例如闭环驾驶中的单GPU亚秒级推理。
      尚未覆盖: 复杂场景、多GPU设置和实时用户特定部署的可扩展性尚未建立。
    - 路线: 开放基准与可复现工件
      解决的问题: 提供动作保真度和空间一致性的数据集、指标与代码，如 LoopNav 和 ACT-Bench。
      尚未覆盖: 跨团队/基础设施的独立复现，以及超越 Minecraft、nuScenes、CARL 等场景的覆盖仍是验证缺口。
    共识:
    - 可控未来帧生成被视为模拟和策略评估的核心系统能力。
    - 评测应超越像素级保真度，纳入动作跟随、空间一致性和物理合理性。
    - 生成式学习与结构化、几何或物理导向信号结合可提升可控性和真实感。
    - 可复现数据集、指标和代码日益成为系统贡献的一部分。
    分歧:
    - 表示方式：部分系统使用隐状态循环状态空间模型，另一些则改造预训练扩散或自回归视频生成器。
    - 监督信号：工作分别采用显式物理任务、运动增强损失、显式上下文条件或基准级一致性指标。
    - 评测目标：零样本动力学泛化、动作保真度、空间一致性和闭环驾驶指标反映不同侧重点。
    - 部署重点：一些系统关注离线基准质量，另一些优化单GPU亚秒级交互。
    开放问题:
    - 当前模拟器在 nuScenes 或有限的 CARL 任务之外，能否保持长时域、跨视角和分布外行为？
    - 现有基准和工件是否足以支持跨硬件、跨团队和用户特定环境的独立复现？
    - 下游策略学习中，动态可控性与细粒度视觉保真度之间的可接受权衡是什么？
    - 上下文可观测假设在真实场景中会如何限制零样本泛化？
    - 当系统论文未报告局限性时，哪些失效边界被隐藏？
