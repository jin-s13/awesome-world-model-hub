  related_work_outline:
  - 'Mainstream direction: Diffusion- and Transformer-based world models dominate
    embodied AI and autonomous driving, generating future video frames for planning
    and policy learning.'
  - 'Shared research pattern: Large-scale pretraining on video and action data with
    self-supervised objectives, evaluated via generation quality or downstream task
    performance.'
  - 'Key differences: Whether to explicitly inject physics knowledge, use compositional
    generation, couple action and video diffusion, or adopt closed-loop vs. open-loop
    evaluation.'
  - 'Trend evolution: From RNN-based latent dynamics to diffusion Transformers and
    unified multimodal architectures, with a recent surge of benchmarks targeting
    memory and consistency.'
  - 'Open questions: Safe deployment in real environments, generalization across embodiments
    and scenes, and alignment between evaluation metrics and real-world task utility.'
  related_work_outline_zh:
  - 主流方向：基于扩散和Transformer的世界模型在具身智能和自动驾驶中成为主流，生成未来视频帧以支持规划和策略学习。
  - 研究共性：在大规模视频和动作数据上通过自监督目标进行预训练，并通过生成质量或下游任务性能进行评估。
  - 关键差异：是否显式注入物理知识、是否采用组合式生成、是否耦合动作与视频扩散、以及采用闭环还是开环评估。
  - 趋势演进：从基于RNN的潜在动力学模型向扩散Transformer和统一多模态架构演进，近期涌现出针对记忆和一致性的基准。
  - 开放问题：真实环境中的安全部署、跨本体和场景的泛化、以及评估指标与实际任务效用的对齐。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion video world models for embodied and driving prediction
      what_it_solves: Generating future frames from high-dimensional visual inputs
        to support robot imagination and autonomous driving scene prediction.
      what_remains_open: Long-term physical consistency, generalization across environments
        and camera viewpoints, and measurable improvement of downstream policies from
        generated videos.
    - line: Latent world models for model-based reinforcement learning
      what_it_solves: Learning policies through imagined rollouts in sample-constrained
        settings such as Atari games and contextual control tasks.
      what_remains_open: Zero-shot generalization to unseen dynamics or tasks, and
        transfer from simulation to real-world embodiments.
    - line: Diagnostic benchmarks for world model capabilities
      what_it_solves: Providing standardized tests to quantify spatial consistency,
        memory, and action controllability of world models.
      what_remains_open: Correlation between benchmark scores and real task success,
        and coverage of more diverse interactive scenarios beyond navigation.
    consensus:
    - World models must capture environment dynamics and support action-conditioned
      prediction.
    - Diffusion models and Transformers have become the dominant architectural backbones.
    - Evaluation is shifting from pixel-level reconstruction quality toward structured
      capability tests such as memory consistency and action control.
    disagreements:
    - Whether to explicitly encode physics priors (e.g., depth, keypoints) into the
      model or rely purely on data-driven learning.
    - Whether to factorize video generation compositionally from language instructions
      or use monolithic generation.
    - Whether to unify action and video diffusion within a single Transformer or keep
      them separate.
    - Whether evaluation should use closed-loop interactive rollouts or open-loop
      video prediction metrics.
    open_questions:
    - How can we guarantee the predictive reliability of world models in safety-critical
      applications?
    - How can we learn transferable world models from large-scale heterogeneous robot
      datasets?
    - Can current benchmarks drive world models toward solving real-world long-horizon
      planning problems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散视频世界模型用于具身和驾驶预测
      解决的问题: 从高维视觉输入生成未来帧，支持机器人想象和自动驾驶场景预测。
      尚未覆盖: 长期物理一致性、跨环境和相机视角的泛化，以及生成视频对下游策略的可测量提升。
    - 路线: 基于模型强化学习的潜在世界模型
      解决的问题: 在样本受限的环境中通过想象轨迹学习策略，如Atari游戏和上下文控制任务。
      尚未覆盖: 对未见动力学或任务的零样本泛化，以及从模拟到真实本体的迁移。
    - 路线: 世界模型能力的诊断基准
      解决的问题: 提供标准化测试来量化世界模型的空间一致性、记忆和动作控制能力。
      尚未覆盖: 基准分数与真实任务成功率的关联，以及覆盖导航之外更多样化的交互场景。
    共识:
    - 世界模型需要捕捉环境动态并支持基于动作的条件预测。
    - 扩散模型和Transformer已成为主导架构。
    - 评估正从像素级重建质量转向结构化的能力测试，如记忆一致性和动作控制。
    分歧:
    - 是否将物理先验（如深度、关键点）显式编码进模型，还是完全依赖数据驱动学习。
    - 是否从语言指令中组合式地分解视频生成，还是使用单一生成模型。
    - 是否将动作和视频扩散统一在单个Transformer中，还是保持分离。
    - 评估应使用闭环交互式推演还是开环视频预测指标。
    开放问题:
    - 如何保证世界模型在安全关键应用中的预测可靠性？
    - 如何从大规模异质机器人数据集中学习可迁移的世界模型？
    - 现有基准能否推动世界模型解决真实世界的长期规划问题？
