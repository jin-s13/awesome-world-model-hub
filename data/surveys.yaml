  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models dominate the evidence,
    especially diffusion transformer and masked autoregression methods for robot manipulation
    and embodied decision making.'
  - 'Shared research pattern: Future-frame generation is conditioned on past observations
    and actions, then evaluated with visual quality plus task-oriented signals such
    as planning IoU, policy correlation, physical plausibility, or trajectory consistency.'
  - 'Key differences: Backbones range from diffusion transformers to masked autoregression
    and flow models. Adaptation differs across coupled pretraining, learned-mask adapters,
    and RL/DPO post-training. Evaluation targets split between robot manipulation
    and spatial reasoning.'
  - 'Trend evolution: The available top evidence concentrates in 2024-2026. The frontier
    moves from unified video-action pretraining and faster generation toward physics
    alignment, reward post-training, and functional benchmarks for persistence and
    causality.'
  - 'Open questions: Whether learned simulators satisfy formal world-model assumptions
    for policy transfer, when visual quality predicts downstream control, and how
    alignment generalizes beyond contact-rich manipulation and narrow spatial-reasoning
    benchmarks.'
  related_work_outline_zh:
  - 主流方向：以动作条件视频世界模型为主，多使用扩散Transformer或掩码自回归，面向机器人操作和具身决策，统一动力学、策略与规划模拟。
  - 研究共性：将未来帧预测置于历史观测与动作条件下，并用视觉质量与规划IoU、策略相关性、物理合理性等任务导向信号共同评估。
  - 关键差异：生成主干分扩散、掩码自回归和流模型；适配方式分联合预训练、学习掩码和RL/DPO后训练；评测目标跨机器人操作与空间推理，隐式/显式状态构建假设不同。
  - 趋势演进：证据集中在2024-2026年，从前沿的视频-动作预训练和加速生成，走向物理对齐、偏好奖励建模，以及强调物理持久性与因果推理的功能基准。
  - 开放问题：学到的模拟器是否满足形式化世界模型假设，视觉质量能否预测下游控制，以及物理对齐如何泛化到接触丰富操作之外的场景仍缺少验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics pretraining
      what_it_solves: Learns future-frame generation conditioned on past observations
        and actions, enabling policy, forward/inverse dynamics, and simulator-like
        rollouts for robot learning.
      what_remains_open: Evidence for cross-embodiment and cross-domain generalization
        is limited; formal conditions for reliable policy evaluation remain unspecified.
    - line: Adaptation of pretrained video generators into world models
      what_it_solves: Adds action conditioning to closed-source or pretrained generative
        video priors using small action-labeled data without full parameter access.
      what_remains_open: Depends on domain-specific action-labeled videos and inherits
        biases of the base generator; generalization beyond video-game and robotics
        domains is not demonstrated.
    - line: Alignment and reward post-training for physical plausibility
      what_it_solves: Shapes generated rollouts toward physical realism, task logic,
        embodiment, and visual quality using human preferences or physics-oriented
        discriminators.
      what_remains_open: Evaluations concentrate on contact-rich manipulation; human
        preference subjectivity, cost, and missing artifact details are verification
        gaps.
    - line: Mechanistic taxonomy and functional evaluation
      what_it_solves: Organizes video generation as world models by state construction
        and dynamics modeling, and advocates benchmarks for physical persistence and
        causal reasoning.
      what_remains_open: No new experiments are presented; whether the taxonomy changes
        model design or evaluation practice is not established.
    - line: Test-time verification for model-based reasoning
      what_it_solves: Examines verifier-guided trajectory selection and grounds rewards
        in frame-anchored spatial assertions to improve spatial reasoning.
      what_remains_open: Scaling is inconsistent across benchmarks and current world
        models may act as an information bottleneck for fine-grained reasoning.
    - line: Empirical scaling and simulation efficiency
      what_it_solves: Reports model-size scaling of generation quality and faster
        masked autoregression for policy evaluation and synthetic data generation.
      what_remains_open: No formal scaling-law or guarantee evidence is provided;
        validation that efficiency gains predict downstream failures is missing.
    consensus:
    - The dominant shared framing treats action-conditioned video generation as a
      learned world model for embodied decision making.
    - Most evidence uses historical observations plus actions as conditioning, and
      evaluates with both visual and downstream task-oriented signals.
    - There is broad agreement that pretraining or adaptation from large video data
      is reusable, but visual fidelity alone is insufficient for physical or causal
      validity.
    - Robotic manipulation is the primary evaluation setting, while formal guarantees
      and generalization remain underexplored.
    disagreements:
    - 'Backbone and tokenization: papers differ between diffusion transformers, masked
      autoregression over quantized or soft tokens, and flow-based models, implying
      different speed-control trade-offs.'
    - 'Conditioning and adaptation: coupled video-action pretraining, parameter-free
      learned-mask adapters, and post-training alignment via RL or DPO represent different
      assumptions about model access and modality coupling.'
    - 'Evaluation target: some use robot manipulation simulators and planning correlation,
      while others test spatial reasoning through test-time trajectory selection;
      benchmark validity differs.'
    - 'Alignment signal: human video preferences versus physics-aware discriminators
      or verifier-grounded assertions create different definitions of a good world-model
      rollout.'
    - 'State and dynamics formulation: one conceptual line argues video models are
      stateless and require explicit state construction, while method papers largely
      rely on implicit state via context or latent dynamics.'
    open_questions:
    - Under what conditions do action-conditioned video rollouts satisfy the formal
      assumptions needed for reliable planning, policy evaluation, and cross-task
      transfer?
    - Can physical plausibility and causal persistence be validated independently
      of visual quality, and what benchmark protocols would make that validation reproducible?
    - Which generative backbones or conditioning mechanisms generalize beyond contact-rich
      manipulation and narrow video-game or robotics domains?
    - Do reward-aligned world models reduce or hide biases when reward signals come
      from subjective human preferences?
    - What verification gaps exist from missing code, datasets, baselines, limitations,
      or standardized metrics, and how much do they affect reported gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频动力学预训练
      解决的问题: 学习在历史观测与动作条件下生成未来帧，使视频模型可用于策略、动力学和模拟器式推演。
      尚未覆盖: 跨本体、跨领域泛化证据有限；可靠策略评估所需的形式化条件尚未明确。
    - 路线: 将预训练视频生成器适配为世界模型
      解决的问题: 在不可见参数或黑盒预训练视频先验上加入动作条件，利用小规模动作标注数据实现动作可控生成。
      尚未覆盖: 依赖领域特定的动作标注视频，并继承基座模型偏差；在视频游戏与机器人之外的泛化未经验证。
    - 路线: 物理合理性对齐与奖励后训练
      解决的问题: 通过人类偏好或物理导向判别器，使生成轨迹在物理真实性、任务逻辑、具身性和视觉质量上更优。
      尚未覆盖: 评估集中在接触丰富操作；人类偏好主观性、数据成本以及代码/数据等验证缺口仍存在。
    - 路线: 机制化分类与功能评测
      解决的问题: 从状态构建与动态建模角度组织视频生成世界模型，并倡导测物理持久性和因果推理的功能基准。
      尚未覆盖: 没有新实验证据支撑；该分类是否实际改变模型设计或评测实践尚未确立。
    - 路线: 模型推演中的测试时验证
      解决的问题: 检查验证器引导的轨迹选择，并以帧锚定空间断言为奖励提供可验证基础，改善空间推理。
      尚未覆盖: 跨基准的测试时缩放不一致，当前世界模型可能在细粒度推理中构成信息瓶颈。
    - 路线: 经验缩放与模拟效率
      解决的问题: 报告生成质量随模型规模扩展以及更快掩码自回归模拟用于策略评估与合成数据生成。
      尚未覆盖: 缺少正式的缩放律或保证；效率提升是否能预测下游失败尚未验证。
    共识:
    - 主流框架把动作条件视频生成视为具身决策的学习世界模型。
    - 多数工作以历史观测和动作作为条件，并结合视觉质量与规划IoU、策略相关性、物理合理性等任务信号评估。
    - 证据普遍认为视觉保真度不足以单独证明物理或因果有效性，需要通过下游任务或物理对齐补充。
    - 机器人操作是主要测试域，正式保证与更广泛泛化仍不充分。
    分歧:
    - 生成主干不同：扩散Transformer、掩码自回归以及流模型在速度、控制力和生成质量上各有取舍。
    - 适配机制不同：视频-动作联合预训练、黑盒学习掩码适配以及RL/DPO后训练对模型访问和模态耦合假设不同。
    - 评测目标不同：机器人操作模拟和策略相关性与空间推理测试时轨迹选择关注的能力不同。
    - 对齐信号不同：人类视频偏好、物理导向判别器或可验证空间断言对好轨迹的定义不同。
    - 状态和动态表述不同：机制化分类认为当前视频模型无显式状态构建，而方法论文多依赖上下文或潜在动态。
    开放问题:
    - 动作条件视频推演在什么条件下能满足可靠规划、策略评估和跨任务迁移所需的形式化假设？
    - 物理合理性与因果持久性如何脱离视觉质量单独验证，并形成可复现的基准协议？
    - 哪类生成主干或条件机制能泛化到接触丰富操作、视频游戏和机器人平台之外的场景？
    - 当对齐信号来自主观人类偏好时，奖励对齐的世界模型是减少还是隐藏偏差？
    - 代码、数据、基线和标准化指标缺失造成的验证缺口，对当前性能提升的可信度影响多大？
