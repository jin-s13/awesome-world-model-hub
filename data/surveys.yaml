  related_work_outline:
  - 'Mainstream direction: Generative video diffusion and unified transformer world
    models dominate, with auxiliary reconstruction, physics, context, or action-coupling
    tasks to improve prediction and control; e.g., MaskGWM and UWM.'
  - 'Shared research pattern: Recent methods combine scalable sequence or diffusion
    backbones with self-supervised or multimodal signals, then evaluate through generated
    video or latent imagination on task-specific benchmarks.'
  - 'Key differences: Representations span recurrent state-space, transformer-VAE,
    and diffusion; supervision spans action-free video, language primitives, context
    values, depth/keypoints, and explicit actions; evaluation targets include Atari,
    driving, robot data, and Minecraft navigation.'
  - 'Trend evolution: Within the 2023–2026 frontier, work moves from efficient model-based
    RL such as STORM toward contextual generalization, compositional embodied video
    models, unified video-action pretraining, and consistency-focused benchmarks such
    as LoopNav and MIND.'
  - 'Open questions: Long-horizon memory and physics consistency, generalization beyond
    seen contexts or primitive combinations, and isolation of model contribution from
    data or planner remain unresolved; several top papers lack explicit limitation
    evidence.'
  related_work_outline_zh:
  - 主流方向：生成式视频扩散与统一Transformer世界模型成为主导，辅以重建、物理、上下文或动作耦合任务提升预测与控制能力，例如MaskGWM、UWM。
  - 研究共性：近期方法将可扩展序列或扩散主干与自监督或多模态信号结合，并通过生成视频或潜在想象在任务特定基准上评估。
  - 关键差异：表示涵盖循环状态空间、Transformer-VAE和扩散；监督涵盖无动作视频、语言原语、上下文、深度/关键点和显式动作；评测覆盖Atari、驾驶、机器人数据和Minecraft导航。
  - 趋势演进：在2023–2026前沿内，工作从高效基于模型的强化学习STORM走向上下文泛化、组合式具身视频模型、统一视频-动作预训练及一致性基准LoopNav、MIND。
  - 开放问题：长时记忆与物理一致性、对未见上下文或原语组合的泛化，以及模型贡献与数据或规划器的隔离仍待解决；多篇论文缺少明确的局限性证据。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models with auxiliary reconstruction or physics
        signals
      what_it_solves: High-fidelity, multi-view or compositionally controlled video
        prediction for driving and robot imagination.
      what_remains_open: Long-horizon memory, spatial/physics consistency, and generalization
        beyond seen primitives or scenes remain underevidenced outside reported datasets.
    - line: Efficient stochastic and contextual latent world models for model-based
        RL
      what_it_solves: Sample-efficient policy learning by training on imagined latent
        rollouts and conditioning on observed context.
      what_remains_open: Model contribution versus planner is not isolated; evidence
        is limited to Atari or two CARL tasks and assumes observable context.
    - line: Unified video-action diffusion pretraining
      what_it_solves: Couples video generation and action modeling so one model can
        represent policy, forward/inverse dynamics, and video prediction from large
        robot data.
      what_remains_open: Cross-embodiment and long-horizon control transfer remain
        underevaluated; robustness gains are mainly shown on multitask robot datasets.
    - line: Consistency and action-control benchmarks for world models
      what_it_solves: Provides datasets and metrics for spatial/memory consistency
        and action responsiveness beyond pixel-level generation quality.
      what_remains_open: Closed-loop baselines are just emerging; real-world transfer
        and metric alignment with downstream task success are not yet established.
    - line: Physics-informed embodied world models
      what_it_solves: Adds temporal depth and keypoint dynamics to improve geometric
        consistency and physical plausibility of generated robot videos.
      what_remains_open: Whether physics-informed objectives transfer beyond trained
        visual scenarios and improve policy learning under contact variation.
    consensus:
    - Recent world-model methods favor scalable transformer or diffusion backbones
      for video prediction and latent imagination.
    - Auxiliary objectives such as mask reconstruction, depth, keypoints, context
      conditioning, or action coupling are added to improve consistency, generalization,
      or controllability.
    - Evaluation is moving from short-horizon pixel quality toward longer-horizon
      memory, spatial, and action-control assessments.
    - Model-based RL continues to use imagined rollouts to improve sample efficiency,
      but evidence is often benchmark-specific.
    disagreements:
    - 'Representation choices differ: recurrent state-space models, transformer-VAE
      stochastic models, and diffusion-based video or action-video models.'
    - 'Supervision differs: some models rely on action-free video, while others require
      language instructions, observable context values, or paired action sequences.'
    - 'Interaction mode differs: some methods generate video plans for downstream
      execution, while others train policies inside latent rollouts or couple action
      diffusion directly.'
    - Evaluation targets differ across Atari, driving, robot manipulation, and open-world
      navigation, which may favor different model capabilities.
    - 'Deployment evidence differs: some methods are demonstrated only in simulation
      or benchmarks, while others use large real-world robot datasets.'
    open_questions:
    - Can world models maintain long-term memory and spatial consistency in open-domain,
      closed-loop settings beyond current navigation or driving benchmarks?
    - Do zero-shot or compositional generalization gains persist when contexts, language
      primitives, or robot embodiments go beyond the training distribution?
    - How much of reported model-based RL improvement comes from the world model rather
      than the training data, planner, or task-specific tuning?
    - Do physics-informed video objectives produce measurable downstream policy improvement
      under contact-rich or unseen physical conditions?
    - What verification gaps remain where top-paper records lack explicit limitations,
      code, or cross-benchmark comparisons?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带辅助重建或物理信号的生成式视频世界模型
      解决的问题: 面向驾驶和机器人想象的高保真、多视角或组合可控视频预测。
      尚未覆盖: 长时记忆、空间或物理一致性，以及对训练分布之外原语或场景的泛化尚未充分验证。
    - 路线: 用于基于模型的强化学习的高效随机与上下文潜在世界模型
      解决的问题: 通过潜在想象轨迹训练策略，并在可观测上下文下提升样本效率。
      尚未覆盖: 模型与规划器的贡献未隔离；证据限于Atari或两个CARL任务，并假设上下文可观测。
    - 路线: 统一视频-动作扩散预训练
      解决的问题: 耦合视频生成与动作建模，用一个模型表示策略、前向/逆向动力学和视频预测。
      尚未覆盖: 跨具身和长时控制迁移验证不足；鲁棒性主要在多任务机器人数据上展示。
    - 路线: 世界模型的一致性与动作控制基准
      解决的问题: 为空间或记忆一致性与动作响应提供数据集和指标，超越像素级生成质量。
      尚未覆盖: 闭环基线刚出现；真实世界迁移和指标与下游任务成功率的对应关系尚未建立。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 通过时序深度和关键点动力学增强生成机器人视频的几何一致性与物理合理性。
      尚未覆盖: 物理信息目标在训练场景外及接触变化条件下对下游策略学习的提升仍未知。
    共识:
    - 近期世界模型方法倾向使用可扩展的Transformer或扩散主干进行视频预测和潜在想象。
    - 通过掩码重建、深度、关键点、上下文条件或动作耦合等辅助目标来改善一致性、泛化或可控性。
    - 评测正从短时像素质量转向更长时记忆、空间与动作控制评估。
    - 基于模型的强化学习继续通过想象轨迹提高样本效率，但证据通常局限于特定基准。
    分歧:
    - 表示选择不同：循环状态空间、Transformer-VAE随机模型以及基于扩散的视频或动作-视频模型。
    - 监督信号不同：部分模型依赖无动作视频，部分需要语言指令、可观测上下文或动作序列。
    - 交互方式不同：有的生成视频计划再执行，有的在潜在想象中训练策略，或直接耦合动作扩散。
    - 评测目标覆盖Atari、驾驶、机器人操作和开放世界导航，可能偏向不同模型能力。
    - 部署证据不同：一些仅在仿真或基准中展示，另一些使用大规模真实机器人数据。
    开放问题:
    - 世界模型能否在开放域闭环环境中长期保持记忆和空间一致性，而不仅限于当前导航或驾驶基准？
    - 当上下文、语言原语或机器人具身超出训练分布时，零样本或组合泛化能力是否仍然成立？
    - 基于模型的强化学习提升有多少来自世界模型本身，而不是训练数据、规划器或任务调参？
    - 物理信息视频目标在接触丰富或未知物理条件下是否带来可测量的下游策略提升？
    - 在顶级论文记录缺少明确局限性、代码或跨基准比较时，存在哪些验证缺口？
