  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models for embodied
    control and driving, using video/action diffusion or transformer latent dynamics
    to predict high-dimensional observations and support policy learning or evaluation.'
  - 'Shared research pattern: Models are trained on domain videos or interaction data,
    then evaluated for video prediction, zero-shot generalization, or downstream policy
    utility rather than only reconstruction.'
  - 'Key differences: Approaches differ in representation: structured domain priors
    such as physics, language primitives, or driving multi-view masks versus general
    stochastic latent dynamics; evaluation also differs across visual fidelity, sample
    efficiency, or memory/spatial consistency.'
  - 'Trend evolution: Within the current frontier (top evidence 2023-2026), work shifts
    from sample-efficient model-based RL on Atari and contextual Dreamer variants
    toward large-scale diffusion/transformer pretraining and open-domain consistency
    benchmarks for robots and driving.'
  - 'Open questions: Real-world deployment transfer, long-term memory and action-space
    generalization, and aligning simulator/video metrics with safety or task outcomes
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近年工作聚焦具身控制与驾驶的生成式世界模型，利用视频/动作扩散或Transformer潜在动力学预测高维观测并支撑策略学习或评测。
  - 研究共性：模型在领域视频或交互数据上训练，并以视频预测、零样本泛化或下游策略效用作为评测，而非仅重建。
  - 关键差异：表示方式不同，有的注入物理、语言原语或驾驶多视角掩码等结构先验，有的学习通用随机潜在动力学；评测重点也不同，涵盖视觉保真、样本效率或记忆/空间一致性。
  - 趋势演进：在当前前沿证据（2023-2026）内，研究从Atari样本高效模型与Dreamer上下文变体，转向大规模扩散/Transformer预训练和面向开放域一致性的机器人/驾驶基准。
  - 开放问题：真实部署迁移、长期记忆与动作空间泛化、以及视频/仿真指标与安全或任务结果之间的对齐仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot manipulation and embodied tasks
        by grounding video prediction in language primitives, physics signals, or
        multimodal actions for policy training and evaluation.
      what_remains_open: Transfer is still bounded by seen primitive combinations
        or simulated settings; real robot execution and physical plausibility beyond
        visual fidelity are not fully verified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view, long-horizon driving scene
        prediction and cross-dataset evaluation.
      what_remains_open: Evidence links prediction gains to benchmark metrics, but
        alignment with closed-loop real-world driving safety and operational outcomes
        remains uncovered.
    - line: Interactive agents and games
      what_it_solves: Learns efficient world models for Atari-style RL and builds
        open-domain benchmarks for spatial consistency, memory, and action control
        in Minecraft-like environments.
      what_remains_open: Long-term memory consistency and generalization across action
        spaces remain difficult; benchmark construction does not yet report controlled
        task success or robustness evidence.
    consensus:
    - Generative world models are used as predictive models of high-dimensional observations
      for control and evaluation, not just as generic video generators.
    - Recent methods favor diffusion and transformer-based architectures and large
      datasets for scaling robot, driving, and game world models.
    - Zero-shot generalization, long-horizon consistency, and downstream policy utility
      are recurring evaluation targets across embodied, driving, and interactive settings.
    disagreements:
    - Some work injects domain-specific structure such as physics, language primitives,
      or driving layout masks, while others learn fully data-driven latent dynamics
      without explicit domain priors.
    - 'Evaluation emphasis differs: visual fidelity and physical plausibility versus
      sample-efficient task performance versus memory consistency and action-space
      generalization.'
    - 'Assumptions about available supervision differ: action-free video pretraining,
      observable context values, or paired action-video data each condition what a
      model can learn.'
    - Deployment evidence ranges from simulation and benchmark-only evaluation to
      real-world-facing robotics and driving, but real-world outcome evidence is sparse
      or absent in this packet.
    open_questions:
    - What evidence is needed to close the gap between video prediction or simulation
      metrics and real-world safety or task success in driving and robotics?
    - How can world models maintain long-term memory and spatial consistency under
      changing viewpoints and action spaces in open-domain environments?
    - Under what conditions does action-free or context-conditioned pretraining transfer
      to unseen embodiments, physical environments, or novel task compositions?
    - How should evaluation balance visual fidelity, physical plausibility, and downstream
      control performance without overfitting to a single benchmark?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人操作等具身任务，通过语言原语、物理信号或多模态动作驱动视频预测并用于策略训练与评测。
      尚未覆盖: 迁移仍受限于已见原语组合或仿真设定；真实机器人执行及超越视觉保真的物理合理性尚未充分验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角、长时域驾驶场景预测与跨数据集评测。
      尚未覆盖: 预测增益目前主要关联基准指标，与闭环真实驾驶安全及运营结果的一致性仍缺乏证据。
    - 路线: 交互式智能体与游戏
      解决的问题: 学习Atari式高效世界模型，并构建开放域基准以衡量空间一致性、记忆和动作控制。
      尚未覆盖: 长期记忆一致性与跨动作空间泛化仍困难；基准构建尚未报告受控任务成功或鲁棒性证据。
    共识:
    - 生成式世界模型被用作高维观测的预测模型，以支持控制与评测，而非仅作通用视频生成器。
    - 近年方法倾向扩散和Transformer架构，并在机器人、驾驶与游戏数据上做规模化训练。
    - 零样本泛化、长时域一致性以及下游策略效用是具身、驾驶与交互场景中反复出现的评测目标。
    分歧:
    - 部分工作注入物理、语言原语或驾驶布局掩码等结构先验，另一些则从像素端到端学习随机潜在动力学，不显式引入领域先验。
    - 评测重点不同：视觉保真与物理合理性、样本高效任务表现、以及记忆一致性与动作空间泛化各有侧重。
    - 监督假设不同：无动作视频预训练、可观测上下文值、或动作-视频配对数据分别决定了模型可学到的内容。
    - 部署证据从仿真和基准评测到面向真实环境的机器人与驾驶不等，但本证据包中真实世界结果证据缺失或稀少。
    开放问题:
    - 需要哪些证据来弥合视频预测或仿真指标与真实驾驶/机器人安全或任务成功之间的差距？
    - 世界模型如何在开放域环境中跨视角和动作空间变化保持长期记忆与空间一致性？
    - 何种条件下无动作或上下文条件预训练能迁移到未见本体、物理环境或新任务组合？
    - 评测应如何平衡视觉保真、物理合理性和下游控制性能，而不至于仅针对单一基准过拟合？
