      尚未覆盖: 数据集验证与回放收益是否与真实驾驶安全或运行结果一致；局限性细节常未说明。
    - 路线: 具身机器人视频-动作世界建模
      解决的问题: 生成动作或语言条件的机器人视频，并从大规模机器人数据中学习策略或动力学，利用物理或组合信号提升合理性。
      尚未覆盖: 真实机器人迁移常缺少评估；组合泛化依赖已见原语组合和准确指令解析；若干工作未说明限制。
    - 路线: 上下文与记忆一致的基于模型控制
      解决的问题: 在游戏和开放世界导航等交互环境中，改善对可观测上下文变化的零样本泛化，并评测长期空间或记忆一致性。
      尚未覆盖: 假设上下文可观测且任务覆盖较窄；跨动作空间和视角的长期记忆一致性尚未解决。
    - 路线: 一致性与动作控制基准
      解决的问题: 构建循环导航或闭环重访数据集与度量，衡量世界模型的空间一致性、记忆一致性和动作控制能力。
