  related_work_outline:
  - 'Mainstream direction: Building world models by coupling video generation with
    action conditioning, and aligning them with physical realism through reward modeling
    or post-training.'
  - 'Shared research pattern: Large-scale pretraining on diverse robot or driving
    datasets, followed by fine-tuning or alignment with task-specific objectives like
    physical plausibility or spatial reasoning.'
  - 'Key differences: Some works adapt frozen pretrained video models via learned
    masks, while others train unified action-video transformers from scratch; generation
    paradigms include diffusion and masked autoregression; alignment strategies range
    from test-time verifier scaling to RL-based reward optimization.'
  - 'Trend evolution: From 2024 to 2026, a shift from adapting existing video diffusion
    models to designing native action-video world models, with growing emphasis on
    physical alignment, functional benchmarks, and analysis of failure modes like
    information bottlenecks and metric distortions.'
  - 'Open questions: How to achieve long-term consistency and causal reasoning beyond
    short-horizon visual prediction; how to design evaluation protocols that measure
    physical persistence rather than perceptual similarity; how to scale alignment
    without costly human preference data.'
  related_work_outline_zh:
  - 主流方向：通过耦合视频生成与动作条件构建世界模型，并借助奖励建模或后训练使其与物理真实性对齐。
  - 研究共性：在多样化机器人或驾驶数据集上进行大规模预训练，随后针对物理合理性或空间推理等任务目标进行微调或对齐。
  - 关键差异：部分工作通过可学习掩码适配冻结的预训练视频模型，另一些则从头训练统一的动作-视频Transformer；生成范式涵盖扩散和掩码自回归；对齐策略从测试时验证器缩放到基于强化学习的奖励优化。
  - 趋势演进：2024至2026年，从适配现有视频扩散模型转向设计原生动作-视频世界模型，并越来越重视物理对齐、功能基准以及对信息瓶颈和指标失真等失效模式的分析。
  - 开放问题：如何实现超越短时视觉预测的长期一致性和因果推理；如何设计衡量物理持久性而非感知相似性的评估协议；如何在不依赖昂贵人类偏好数据的情况下扩展对齐。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual taxonomy of world models
      what_it_solves: Clarifies the gap between video generation and world models
        by decomposing them into state construction (implicit/explicit) and dynamics
        modeling (knowledge integration, architectural reformulation).
      what_remains_open: Whether the taxonomy leads to functional benchmarks that
        test physical persistence and causal reasoning, and whether it changes model
        design in practice.
    - line: Formal analysis of world model evaluation and failure modes
      what_it_solves: Identifies calibration failures, action biases, information
        bottlenecks in test-time scaling, and reveals that standard distortion metrics
        (cosine similarity, SSIM) reward blurry means over realistic predictions.
      what_remains_open: Whether these failure modes generalize across domains (manipulation,
        driving, navigation) and model scales; lack of a unified diagnostic benchmark
        for world model limitations.
    - line: Formalizing alignment objectives for world models
      what_it_solves: Defines multi-dimensional reward models (physical realism, task
        completion, embodiment plausibility, visual quality) and physics-alignment
        post-training (DPO with decoupled discriminators) to suppress unphysical behaviors.
      what_remains_open: Scalability of human preference collection; generalization
        beyond contact-rich manipulation; verification that aligned models maintain
        causal consistency in open-world settings.
    - line: Formalizing action-conditioned video generation as world models
      what_it_solves: Provides unified frameworks that couple action and video modalities
        within a single architecture, enabling flexible representation of policies,
        forward/inverse dynamics, and video prediction.
      what_remains_open: Whether these formalizations capture long-term consistency
        and causal structure; reliance on action-labeled video data, which may be
        scarce; limited analysis of information loss in latent representations.
    consensus:
    - World models must go beyond visual fidelity to capture physical plausibility,
      action consequences, and temporal consistency.
    - Pretraining on large-scale, diverse datasets improves generalization and robustness
      of downstream policies.
    - Current evaluation metrics (e.g., perceptual similarity) are insufficient and
      can be misleading; functional benchmarks are needed.
    - Action conditioning is essential for world models to serve as simulators for
      decision-making.
    disagreements:
    - 'Generation paradigm: diffusion-based models vs. masked autoregressive models,
      with differing trade-offs in speed, controllability, and visual quality.'
    - 'Alignment strategy: test-time verifier scaling vs. post-training with human
      preferences or physics discriminators, reflecting different assumptions about
      where alignment should be enforced.'
    - 'Model access: adapting frozen pretrained video models without parameter access
      vs. training unified action-video models from scratch, impacting data efficiency
      and flexibility.'
    - 'Evaluation focus: some works emphasize spatial reasoning and trajectory selection,
      others physical plausibility of generated frames, leading to incompatible metrics
      and benchmarks.'
    open_questions:
    - How can world models be evaluated on functional benchmarks that test causal
      reasoning and long-term physical persistence rather than short-term visual similarity?
    - What is the minimal set of assumptions needed for a video generation model to
      qualify as a world model, and how can those assumptions be verified empirically?
    - Can alignment objectives like multi-dimensional rewards or physics discriminators
      be scaled without expensive human annotations, and do they transfer across embodiments?
    - Why do current world models form an information bottleneck that prevents test-time
      scaling from improving fine-grained reasoning, and how can this bottleneck be
      characterized and removed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的概念分类
      解决的问题: 通过将世界模型分解为状态构建（隐式/显式）和动态建模（知识整合、架构重构），澄清视频生成与世界模型之间的差距。
      尚未覆盖: 该分类法是否催生出测试物理持久性和因果推理的功能基准，以及是否在实践中改变模型设计。
    - 路线: 世界模型评估与失效模式的形式化分析
      解决的问题: 揭示测试时缩放中的校准失败、动作偏差和信息瓶颈，并发现标准失真指标（余弦相似度、SSIM）偏向模糊均值而非真实预测。
      尚未覆盖: 这些失效模式是否跨领域（操作、驾驶、导航）和模型规模泛化；缺乏统一的世界模型局限性诊断基准。
    - 路线: 世界模型对齐目标的形式化
      解决的问题: 定义多维奖励模型（物理真实性、任务完成、具身合理性、视觉质量）和物理对齐后训练（带解耦判别器的DPO），以抑制非物理行为。
      尚未覆盖: 人类偏好收集的可扩展性；在接触丰富操作之外的泛化；验证对齐后的模型在开放环境中是否保持因果一致性。
    - 路线: 动作条件视频生成作为世界模型的形式化
      解决的问题: 提供在单一架构中耦合动作与视频模态的统一框架，灵活表示策略、前向/逆向动力学和视频预测。
      尚未覆盖: 这些形式化是否捕捉长期一致性和因果结构；依赖动作标注视频数据，可能稀缺；对潜在表示中信息损失的有限分析。
    共识:
    - 世界模型必须超越视觉保真度，捕捉物理合理性、动作后果和时间一致性。
    - 在大规模多样化数据集上预训练可提升下游策略的泛化性和鲁棒性。
    - 当前评估指标（如感知相似度）不足且可能产生误导，需要功能基准。
    - 动作条件对于世界模型作为决策模拟器至关重要。
    分歧:
    - 生成范式：基于扩散的模型与掩码自回归模型，在速度、可控性和视觉质量上存在不同权衡。
    - 对齐策略：测试时验证器缩放与基于人类偏好或物理判别器的后训练，反映了对齐应在何处实施的不同假设。
    - 模型访问：在不访问参数的情况下适配冻结的预训练视频模型，与从头训练统一的动作-视频模型，影响数据效率和灵活性。
    - 评估重点：部分工作强调空间推理和轨迹选择，另一些强调生成帧的物理合理性，导致不兼容的指标和基准。
    开放问题:
    - 如何用测试因果推理和长期物理持久性的功能基准来评估世界模型，而非短期视觉相似度？
    - 视频生成模型成为世界模型所需的最小假设集是什么，如何通过实验验证这些假设？
    - 多维奖励或物理判别器等对齐目标能否在不依赖昂贵人工标注的情况下扩展，并且能否跨具身形态迁移？
    - 为什么当前世界模型会形成信息瓶颈，阻止测试时缩放改善细粒度推理，如何表征并消除这一瓶颈？
