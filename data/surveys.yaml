  related_work_outline:
  - 'Mainstream direction: World models are increasingly used as generative simulators
    for domain-specific decision-making, especially in autonomous driving, robotics,
    and interactive games, with a shift from simple prediction to closed-loop control
    and physical plausibility.'
  - 'Shared research pattern: Most works adopt diffusion or Transformer-based architectures,
    condition on actions or language, and train on large-scale video or interaction
    data to predict future states, while physical consistency or memory is emerging
    as a key evaluation dimension.'
  - 'Key differences: The main content-level splits lie in (1) the type of supervision—video
    reconstruction, physics priors (depth, keypoints), or action prediction; (2) the
    evaluation target—driving scene fidelity, robot task success, or game environment
    consistency; (3) the interaction mode—open-loop video generation versus closed-loop
    policy learning.'
  - 'Trend evolution: Within the 2023–2026 frontier, the field is moving from single-task
    world models (e.g., Atari) toward multi-task, large-scale pretraining on robotic
    datasets, from RGB-only generation to physics-informed joint modeling, and from
    model-centric innovation to the construction of dedicated benchmarks for spatial
    and memory consistency.'
  - 'Open questions: Whether domain-specific improvements can transfer across different
    embodiments and environments; how to align simulation-based metrics with real-world
    safety and operational outcomes; how to achieve long-term memory consistency and
    generalization across unseen task combinations.'
  related_work_outline_zh:
  - 主流方向：世界模型正越来越多地被用作特定领域决策的生成式模拟器，尤其是在自动驾驶、机器人和交互式游戏中，从简单预测转向闭环控制和物理合理性。
  - 研究共性：多数工作采用扩散或Transformer架构，以动作或语言为条件，在大规模视频或交互数据上训练以预测未来状态，同时物理一致性或记忆正成为新的评估维度。
  - 关键差异：内容层面的主要分歧在于（1）监督信号类型——视频重建、物理先验（深度、关键点）或动作预测；（2）评测目标——驾驶场景保真度、机器人任务成功率或游戏环境一致性；（3）交互模式——开环视频生成与闭环策略学习。
  - 趋势演进：在2023-2026的前沿区间内，该领域正从单任务世界模型（如Atari）转向多任务、大规模机器人数据集预训练，从纯RGB生成转向物理信息联合建模，并从以模型为中心创新转向构建专门的空间和记忆一致性基准。
  - 开放问题：领域特定改进能否跨不同本体和环境迁移；如何将基于仿真的指标与真实世界安全和运营结果对齐；如何在未见任务组合上实现长期记忆一致性和泛化。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models (e.g., MaskGWM)
      what_it_solves: Multi-view, long-horizon video prediction for closed-loop simulation
        and scene understanding in driving, using diffusion with mask reconstruction
        to improve generalization.
      what_remains_open: Zero-shot generalization across diverse driving datasets
        (NuScenes, Waymo, OpenDV) and the gap between improved video fidelity and
        real-world safety validation.
    - line: Embodied world models for robotics (e.g., RoboDreamer, RoboScape, UWM)
      what_it_solves: Generating action-conditioned video plans or dynamics for robot
        manipulation, often incorporating compositionality, physics priors, or unified
        action-video diffusion to enable policy learning from large datasets.
      what_remains_open: Generalization to entirely novel object-action combinations
        not seen in training; reliance on simulated or controlled environments; the
        assumption that physics priors can be implicitly learned and transferred to
        real-world deployment.
    - line: Efficient model-based RL world models (e.g., STORM, cRSSM)
      what_it_solves: Sample-efficient policy learning in visual environments by combining
        world models with actor-critic methods, using Transformers or contextual state-space
        models to improve zero-shot or few-shot performance.
      what_remains_open: Observability of context variables in real settings; evaluation
        limited to narrow benchmarks (Atari, CARL) without broader task diversity;
        the trade-off between model complexity and training speed.
    - line: Interactive environment benchmarks for world models (e.g., LoopNav, MIND)
      what_it_solves: Quantifying spatial consistency, memory, and action controllability
        in open-domain world models through novel datasets and metrics (loop-based
        navigation, scene graph scores, multi-view action spaces).
      what_remains_open: Correlation between these proxy metrics and downstream task
        performance; scalability to cover more diverse scenes and action modalities;
        and adoption as standard evaluation protocols.
    consensus:
    - World models are transitioning from passive video predictors to active components
      of decision-making systems, with action conditioning and closed-loop evaluation
      becoming standard.
    - Diffusion models and Transformers dominate the architecture design, enabling
      scalable, high-fidelity generation across multiple domains.
    - Physical plausibility and temporal consistency are recognized as critical missing
      capabilities, and recent works start to incorporate explicit or implicit physics
      signals.
    - Large-scale pretraining on diverse interaction data is effective for building
      more generalizable world models, reducing the need for per-task data collection.
    disagreements:
    - 'The primary supervision signal varies: some works rely purely on video reconstruction,
      while others incorporate physics losses (depth, keypoints) or action prediction,
      leading to different trade-offs between visual fidelity and physical correctness.'
    - 'Evaluation settings differ markedly: driving models focus on pixel-level metrics
      and detection accuracy, robotics models emphasize task success rate and plan
      compositionality, and game benchmarks assess spatial memory and viewpoint consistency,
      making cross-domain comparison difficult.'
    - 'Interaction paradigms diverge: closed-loop control with policy execution (e.g.,
      UWM, cRSSM) versus open-loop video generation for planning (e.g., RoboDreamer),
      with no consensus on which is more suitable for real-world deployment.'
    - 'The role of compositionality is debated: some methods explicitly factorize
      language or actions into primitives, while others learn unified representations,
      exposing a trade-off between generalization to unseen combinations and flexibility
      in handling novel concepts.'
    open_questions:
    - Can world models trained on offline datasets learn dynamics that are robust
      enough for real-time, safety-critical control without online fine-tuning?
    - How can we design benchmarks that capture long-term memory and physical consistency
      in a way that correlates with real-world task performance across different embodiments?
    - What combination of supervision signals (video, physics, actions) is necessary
      and sufficient for a world model to generalize to entirely new environments
      and tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型（如MaskGWM）
      解决的问题: 结合扩散与掩码重建，实现多视角、长时域视频预测，用于驾驶场景的闭环仿真与场景理解，并提升跨数据集泛化能力。
      尚未覆盖: 在多样化驾驶数据集（NuScenes、Waymo、OpenDV）上的零样本泛化，以及视频保真度提升与真实世界安全验证之间的差距。
    - 路线: 机器人具身世界模型（如RoboDreamer、RoboScape、UWM）
      解决的问题: 生成动作条件的视频规划或动力学，用于机器人操作，常结合组合性、物理先验或统一动作-视频扩散，以从大规模数据中学习策略。
      尚未覆盖: 对训练中未见过的全新物体-动作组合的泛化；依赖仿真或受控环境；物理先验可被隐式学习并迁移到真实部署的假设尚未验证。
    - 路线: 高效基于模型的强化学习世界模型（如STORM、cRSSM）
      解决的问题: 在视觉环境中利用Transformer或上下文状态空间模型，结合演员-评论家方法实现样本高效策略学习，提升零样本或少样本性能。
      尚未覆盖: 上下文变量在真实场景中的可观测性；评估局限于狭窄基准（Atari、CARL），缺乏任务多样性；模型复杂度与训练速度之间的权衡。
    - 路线: 交互式环境世界模型基准（如LoopNav、MIND）
      解决的问题: 通过循环导航、场景图评分、多视角动作空间等新数据集和指标，量化开放域世界模型的空间一致性、记忆和动作可控性。
      尚未覆盖: 这些代理指标与下游任务性能的相关性；覆盖更多样化场景和动作模态的可扩展性；作为标准评估协议的被采纳程度。
    共识:
    - 世界模型正从被动视频预测器转变为决策系统的主动组件，动作条件和闭环评估正成为标准做法。
    - 扩散模型和Transformer主导架构设计，使得跨领域的高保真、可扩展生成成为可能。
    - 物理合理性和时间一致性被认为是关键缺失能力，近期工作开始引入显式或隐式物理信号。
    - 在多样化交互数据上进行大规模预训练对于构建更泛化的世界模型有效，减少了对单任务数据收集的依赖。
    分歧:
    - 主要监督信号存在差异：有些工作纯靠视频重建，另一些则融合物理损失（深度、关键点）或动作预测，从而导致视觉保真度与物理正确性之间的不同权衡。
    - 评测场景明显不同：驾驶模型侧重像素级指标和检测精度，机器人模型强调任务成功率和规划组合性，而游戏基准评估空间记忆和视角一致性，使得跨领域比较困难。
    - 交互范式存在分歧：闭环控制与策略执行（如UWM、cRSSM）对比开环视频生成用于规划（如RoboDreamer），对于哪种更适合真实部署尚无共识。
    - 组合性的作用存在争议：部分方法显式地将语言或动作分解为原语，而另一些则学习统一表示，这暴露了泛化到未见组合与处理全新概念的灵活性之间的权衡。
    开放问题:
    - 在离线数据集上训练的世界模型，能否学到足够鲁棒的动力学，以支持无需在线微调的实时安全关键控制？
    - 如何设计能捕捉长期记忆和物理一致性的基准，使其与不同本体下的真实任务性能相关联？
    - 对于世界模型泛化到完全新环境和任务，何种监督信号组合（视频、物理、动作）是必要且充分的？
