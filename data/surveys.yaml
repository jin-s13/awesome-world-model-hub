  - 'Mainstream direction: generative video and diffusion-transformer world models
    applied to autonomous driving and robotics, with action- or goal-conditioned prediction
    as the dominant setup.'
  - 'Shared research pattern: learn world dynamics from large visual/interaction datasets,
    then evaluate through video fidelity, policy rollouts, or benchmark probes such
    as consistency and action control.'
  - 'Key differences: application targets range from driving scene prediction and
    robot video planning to visual control in games/RL; supervision includes video
    generation, action diffusion, physics tasks, and context-conditioned latent dynamics.'
  - 'Trend evolution: within the 2023-2026 frontier, work shifts from efficient model-based
    RL on Atari toward domain-specific driving/robot world models and then toward
    explicit consistency, memory, and action-control benchmarks.'
  - 'Open questions: cross-embodiment and cross-dataset transfer, simulation-to-real
    safety alignment, long-horizon memory consistency, and which benchmark metrics
    predict downstream task success remain unresolved.'
  related_work_outline_zh:
  - 主流方向：生成式视频与扩散Transformer世界模型应用于自动驾驶和机器人，以动作或目标条件预测为主要路线。
  - 研究共性：从大规模视觉/交互数据中学习世界动力学，并通过视频保真度、策略 rollout 或一致性/动作控制等基准探针进行评估。
  - 关键差异：应用目标涵盖驾驶场景预测、机器人视频规划到视觉控制/游戏强化学习；监督信号包括视频生成、动作扩散、物理任务和上下文潜在动力学。
  - 趋势演进：在2023-2026前沿内，研究从Atari上的高效模型强化学习转向领域专用驾驶/机器人世界模型，再到明确的一致性、记忆与动作控制基准。
  - 开放问题：跨本体与跨数据集迁移、仿真到真实安全对齐、长时域记忆一致性，以及哪些基准指标可预测下游任务成功仍然未解。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving simulation and scene prediction
      what_it_solves: Long-horizon and multi-view video prediction for driving scenes,
        supporting closed-loop simulation and policy evaluation.
      what_remains_open: Alignment between benchmark improvements and real-world safety
        or operational outcomes, and zero-shot transfer across driving datasets remain
        underverified.
    - line: Robot video generation and action-coupled world models
      what_it_solves: Generating physically plausible robot videos and coupling video
        with action diffusion for policy, forward-dynamics, and inverse-dynamics learning
        from robot datasets.
      what_remains_open: Generalization to unseen action primitives, embodiments,
        and real-robot execution beyond simulated or dataset-specific settings is
        limited.
    - line: Model-based RL with latent or contextual imagination
      what_it_solves: Efficient policy learning on visual control tasks by training
        agents on imagined trajectories, with context conditioning for zero-shot generalization.
      what_remains_open: Evaluations are narrow, context observability is assumed,
        and scaling beyond Atari/CARL-style tasks is not yet established.
    - line: Interactive world-model evaluation benchmarks
      what_it_solves: Probing spatial consistency, memory, and action controllability
        in open-world or loop-based interactive environments.
      what_remains_open: Evidence linking these benchmark scores to downstream task
        performance or model improvement is still missing.
    consensus:
    - Recent application work converges on action-conditioned or goal-conditioned
      generative world models learned from large visual datasets.
    - Evaluation is moving beyond short-horizon frame quality toward long-horizon
      dynamics, physical plausibility, and interaction consistency.
    - Domain-specific inductive biases such as masks, depth and keypoint prediction,
      physical knowledge, or context conditioning improve task-relevant prediction.
    - 'Reproducibility evidence is uneven: benchmark efforts tend to release datasets,
      while several method papers lack explicit limitation or code details in the
      visible evidence.'
    disagreements:
    - 'Supervision differs: pure video generation, coupled video-action diffusion,
      latent policy imagination, and physics-driven auxiliary tasks train different
      world-model objectives.'
    - 'Evaluation targets differ: driving papers use NuScenes/OpenDV-2K/Waymo, robot
      papers use RT-X with simulation or policy success, and game/RL papers use Atari/CARL
      or loop-based Minecraft probes.'
    - 'Interaction mode differs: open-loop prediction, closed-loop action-conditioned
      rollout, policy training on imagined trajectories, and benchmark-based action
      controllability are not equivalent.'
    - 'Representation choices differ: diffusion transformers, recurrent state-space
      models, VAE-Transformer hybrids, and unified multimodal diffusion encode states
      and actions in distinct ways.'
    open_questions:
    - Do stronger driving world-model benchmarks transfer to real-world safety or
      operational outcomes?
    - Can robot video world models generalize to novel action primitives or embodiments
      beyond training distributions?
    - Which measured properties, such as visual fidelity, spatial consistency, memory
      consistency, or action controllability, best predict downstream policy success?
    - How well do current world models maintain long-horizon memory consistency across
      loops, views, and action changes?
    - How limiting is context observability for zero-shot generalization when real-world
      contexts are partially observed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶仿真与场景预测
      解决的问题: 生成驾驶场景的长时域和多视角视频，以支持闭环仿真和策略评测。
      尚未覆盖: 基准改进与真实安全/运营结果之间的一致性，以及跨驾驶数据集的零样本迁移仍未充分验证。
    - 路线: 机器人视频生成与动作耦合世界模型
      解决的问题: 生成物理合理的机器人视频，并耦合视频与动作扩散，以从机器人数据集中学习策略、前向动力学和逆动力学。
      尚未覆盖: 对未见动作原语、不同本体和真实机器人执行的泛化仍局限于仿真或特定数据集。
    - 路线: 基于模型强化学习的潜在或上下文想象
      解决的问题: 通过在世界模型想象轨迹上训练智能体，实现视觉控制任务的高效策略学习，并通过上下文条件化提升零样本泛化。
      尚未覆盖: 评测范围较窄，假设上下文可观测，且尚未验证能否扩展到Atari/CARL之外的任务。
    - 路线: 交互式世界模型评估基准
      解决的问题: 在开放世界或循环导航等交互环境中，探测空间一致性、记忆和动作可控性。
      尚未覆盖: 尚缺少这些基准分数与下游任务表现或模型改进之间的证据联系。
    共识:
    - 近期应用研究集中在从大规模视觉数据集学习动作条件或目标条件的生成式世界模型。
    - 评估正从短时域帧质量转向长时域动力学、物理合理性和交互一致性。
    - 掩码、深度与关键点预测、物理知识或上下文条件化等领域专用归纳偏置能改善任务相关预测。
    - 可复现证据参差不齐：基准工作倾向发布数据集，而部分方法论文在可见证据中缺少明确的局限说明或代码细节。
    分歧:
    - 监督信号不同：纯视频生成、视频-动作扩散耦合、潜在策略想象和物理辅助任务训练了不同的世界模型目标。
    - 评测目标不同：驾驶论文使用NuScenes/OpenDV-2K/Waymo，机器人论文使用RT-X并结合仿真或策略成功，游戏/强化学习论文使用Atari/CARL或循环式Minecraft探针。
    - 交互模式不同：开环预测、闭环动作条件 rollout、在想象轨迹上训练策略、以及基于基准的动作可控性并不等价。
    - 表示选择不同：扩散Transformer、循环状态空间模型、VAE-Transformer混合以及统一多模态扩散以不同方式编码状态和动作。
    开放问题:
    - 更强的驾驶世界模型基准是否能迁移到真实安全或运营结果？
    - 机器人视频世界模型能否泛化到训练分布之外的未见动作原语或不同本体？
    - 视觉保真度、空间一致性、记忆一致性或动作可控性中，哪些可测量属性最能预测下游策略成功？
    - 当前世界模型在循环、视角和动作变化下如何保持长时域记忆一致性？
    - 当真实世界上下文仅部分可观测时，上下文可观测假设对零样本泛化有多大限制？
