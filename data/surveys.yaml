  related_work_outline_zh:
  - 主流方向：应用研究集中在面向驾驶、机器人、游戏和交互环境的生成式世界模型，常将视频生成与动作、动力学或物理结合，用于预测、策略学习或评估。
  - 研究共性：多数工作在领域视频或状态-动作数据上训练，并通过展开、基准或仿真策略执行评测；常引入掩码重建、深度预测、关键点动力学、动作扩散或上下文条件等辅助任务。
  - 关键差异：差异在于领域与输出模态、条件信号如语言/动作/上下文/物理，以及评测重点如视频保真、零样本策略泛化、基准一致性或训练效率。
  - 趋势演进：主题跨2015-2026，但代表性证据集中在2023-2026；方向从Atari和控制的模型式RL世界模型，转向驾驶、机器人操作和一致性基准的更大规模生成或扩散式世界模型。
  - 开放问题：视频或动作生成改善能否迁移到真实安全与运行结果，泛化是否超出已见任务/上下文/数据集，以及一致性基准指标如何关联下游策略质量，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon video prediction
      what_it_solves: Predicts future driving scenes from video and ego-action observations,
        targeting cross-dataset generalization and long rollouts for closed-loop simulation.
      what_remains_open: Evidence remains mostly validation-set video prediction;
        real-world safety or operational transfer and closed-loop policy impact are
        not yet verified.
    - line: Embodied robot world models that couple video generation with action or
        physics
      what_it_solves: Learns task-conditioned video plans or physically plausible
        robot videos to support policy training, policy evaluation, and robot imagination.
      what_remains_open: Generalization is limited to seen primitive combinations
        or simulation settings; real-robot transfer and coverage of novel primitives
        or contexts are not established.
    - line: Model-based RL world models for efficient policy learning in games and
        control
      what_it_solves: Uses learned latent dynamics to generate imagined trajectories,
        improving sample efficiency and zero-shot generalization in Atari and contextual
        reinforcement learning tasks.
      what_remains_open: Task coverage is narrow; assumptions such as observable context
        and transfer to fully unseen dynamics remain open.
    - line: Benchmarks for spatial, memory, and action-control consistency
      what_it_solves: Systematically measures world-model consistency under loop navigation,
        viewpoint changes, action spaces, and long-term memory demands.
      what_remains_open: Benchmark performance is not yet linked to downstream robot
        or driving policy success; current models still show long-term memory and
        cross-action-space generalization gaps.
    consensus:
    - Recent application papers often use diffusion or transformer-based generative
      video models as the core world-model backbone.
    - Beyond pure video generation, many works add auxiliary tasks such as mask reconstruction,
      context conditioning, depth prediction, keypoint dynamics, or action diffusion
      to improve consistency or generalization.
    - Evaluation is shifting toward long-horizon, multi-view, or closed-loop consistency
      rather than single-step generation quality.
    - Robotic and driving directions treat world models as tools for policy training
      or evaluation, not only as media generators.
    - There is broad agreement that unconditional or monolithic generation is insufficient;
      conditioning on actions, context, language, or physics is necessary.
    disagreements:
    - 'Embodiment and task differ: driving work emphasizes multi-view scene rollout,
      robot work emphasizes manipulation video or action synthesis, and game or control
      work emphasizes sample-efficient policy learning.'
    - 'Conditioning choices differ: some approaches use language-instruction primitives,
      others use action or context values, physics auxiliaries, or mask tokens, which
      changes their generalization assumptions.'
    - 'Evaluation targets differ: visual fidelity and physical plausibility, policy
      zero-shot performance, and benchmark consistency or action control make direct
      comparison difficult.'
    - 'Deployment settings differ: simulated policy execution or curated benchmark
      videos are not equivalent to real-world datasets or physical rollouts, creating
      uneven outcome evidence.'
    - Modeling assumptions differ between observable-context methods that condition
      on known context values and methods that learn dynamics from video and action
      data alone.
    open_questions:
    - Can driving video-prediction improvements transfer to real-world closed-loop
      safety or lower error rates, given current evidence stops at NuScenes, OpenDV-2K,
      and Waymo prediction?
    - Do language-primitive compositional robot world models maintain performance
      on unseen primitive combinations or on real robot execution beyond simulation?
    - How do spatial consistency and memory metrics such as loop-based consistency
      or scene-graph scores predict downstream policy quality?
    - What auxiliary information is necessary for zero-shot generalization when context
      is not observable and dynamics are unknown?
    - Are findings from small task sets or selected datasets robust across embodiments,
      institutions, and physical environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与多视角/长时域视频预测
      解决的问题: 从视频和自我动作观测预测未来驾驶场景，面向跨数据集泛化与长时域闭环仿真。
      尚未覆盖: 证据主要停留在验证集视频预测；真实安全或运营迁移以及闭环策略影响尚未验证。
    - 路线: 具身机器人世界模型，耦合视频生成与动作或物理
      解决的问题: 学习任务条件视频计划或物理合理的机器人视频，以支持策略训练、策略评估和机器人想象。
      尚未覆盖: 泛化限于已见原语组合或仿真设定；真实机器人迁移和新原语或新上下文覆盖仍不充分。
    - 路线: 基于模型的强化学习世界模型，用于游戏与控制中的高效策略学习
      解决的问题: 使用学习到的潜在动力学生成想象轨迹，改善Atari和上下文强化学习中的样本效率与零样本泛化。
      尚未覆盖: 任务范围评估较窄；上下文可观测等假设以及向完全未知动力学的迁移仍未解决。
    - 路线: 面向空间、记忆和动作控制一致性的基准
      解决的问题: 在循环导航、视角变化、动作空间和长期记忆需求下系统测量世界模型的一致性。
      尚未覆盖: 基准表现尚未与下游机器人或驾驶策略成功关联；当前模型仍存在长期记忆和跨动作空间泛化缺口。
    共识:
    - 近期应用工作多以扩散或Transformer生成式视频模型作为世界模型主干。
    - 除纯视频生成外，普遍引入掩码重建、上下文条件、深度预测、关键点动力学或动作扩散等辅助任务以改进一致性或泛化。
    - 评测逐渐强调长时域、多视角或闭环一致性，而非单步生成质量。
    - 机器人和驾驶路线都把世界模型视为策略训练或评估工具，而不仅是媒体生成。
    - 现有工作普遍认为无条件或单一生成不够，需要基于动作、上下文、语言或物理进行条件化。
    分歧:
    - 本体与任务不同：驾驶强调多视角场景展开，机器人强调操作视频或动作合成，游戏与控制强调样本高效策略学习。
    - 条件化选择不同：有的采用语言指令原语，有的采用动作或上下文值、物理辅助或掩码令牌，泛化假设因此不同。
    - 评测目标不同：视觉保真与物理合理性、策略零样本性能、基准一致性或动作控制，使直接比较困难。
    - 部署设置不同：仿真策略执行或精选基准视频不等于真实数据集或物理展开，真实结果证据不均衡。
