  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from pixel-level video
    quality on fixed Atari/RL benchmarks toward action-conditioned, long-horizon,
    embodied and driving benchmarks that stress spatial consistency, memory, and control.'
  - 'Shared research pattern: Works pair a dataset or benchmark task with a targeted
    metric that probes a specific world-model capability, then compare standard baselines
    on public evaluation suites.'
  - 'Key differences: Evaluation targets split among game/RL decision utility, robotic
    policy utility, driving or multi-view prediction, and open-domain closed-loop
    consistency; supervision and metrics differ accordingly.'
  - 'Trend evolution: Available top-ranked papers concentrate in 2023-2026, moving
    from Atari 100k model-based RL scores toward open-domain video benchmarks such
