  - 'Mainstream direction: building action-controllable generative world-model systems
    for closed-loop simulation, with the strongest evidence centered on driving and
    embodied control.'
  - 'Shared research pattern: combining video or state generation with action, trajectory,
    or context conditioning, then evaluating through simulation realism, action fidelity,
    or downstream policy utility.'
  - 'Key differences: some contributions build benchmarks and metrics, others improve
    model architectures or latent dynamics; evaluation targets, interaction modes,
    and deployment constraints differ.'
  - 'Trend evolution: within the 2024–2026 frontier, work is shifting from general
    video generation toward controllable, low-latency closed-loop systems and explicit
    fidelity benchmarks.'
  - 'Open questions: cross-domain generalization, long-horizon consistency, independent
    reproduction, and scaling beyond single-GPU or narrow dataset settings remain
    unverified.'
  related_work_outline_zh:
  - 主流方向：以动作可控的生成式世界模型系统为核心，面向闭环仿真，主要集中在驾驶与具身控制。
  - 研究共性：将视频或状态生成与动作、轨迹或上下文条件结合，并通过仿真真实感、动作忠实度或下游策略表现来评估系统。
  - 关键差异：一部分工作构建基准与指标，另一部分改进模型架构或潜在动力学；评测目标、交互方式和部署约束不同。
  - 趋势演进：在2024–2026前沿内，研究从通用视频生成走向可控、低延迟闭环系统与显式忠实度基准。
  - 开放问题：跨域泛化、长时域一致性、独立可复现性以及超出单GPU与窄数据集的扩展性仍未证实。
  literature_review:
    line_of_work_matrix:
    - line: Context-conditioned latent world models for zero-shot policy generalization
      what_it_solves: Uses observable context to modulate latent state inference and
        dynamics so policies trained on imagined rollouts transfer to unseen context
        values.
      what_remains_open: Assumes context observability and verifies generalization
        on only two CARL benchmark tasks; broader settings remain uncovered.
    - line: Action-controllable video world simulators for driving and robotics
      what_it_solves: Generates future RGB frames from actions, trajectories, or intentions
        to serve as simulators, policy training environments, and policy evaluators.
      what_remains_open: Long-horizon action fidelity, cross-domain generalization,
        and physical consistency are only partially shown; some approaches inherit
        biases from pre-trained video models.
    - line: Benchmarks and datasets for simulator fidelity
      what_it_solves: Operationalizes spatial consistency and action fidelity through
        datasets and metrics such as looped navigation or action-conditioned future
        prediction.
      what_remains_open: Coverage is limited to specific environments such as Minecraft
        and nuScenes; independent deployment beyond these settings is unproven.
    - line: Efficient generation and serving stacks
      what_it_solves: Reduces training or inference cost and meets interactive latency
        through frame-level autoregression, dual-mode generation, or latent replacement.
      what_remains_open: Scalability beyond single-GPU setups and independent reproduction
        across hardware and teams remain evidence gaps.
    consensus:
    - The dominant direction treats learned world models as runnable simulators rather
      than static predictors, emphasizing closed-loop or action-conditioned generation.
    - 'Evaluation is increasingly tied to task-specific fidelity: action adherence,
      spatial consistency, dynamic realism, or downstream policy utility.'
    - Recent systems share a goal of turning world models into usable artifacts by
      combining controllable rollouts with efficiency or benchmark support.
    disagreements:
    - 'Representation and supervision differ: some works learn latent world dynamics
      for policy training, while others generate RGB video conditioned on actions
      or trajectories.'
    - 'Evaluation targets differ: spatial consistency benchmarks, action-fidelity
      benchmarks, video fidelity metrics, and closed-loop planning performance are
      used separately.'
    - 'Interaction mode differs: context-conditioned policy learning, trajectory/action-controllable
      video simulation, and dual-mode autoregressive motion planning emphasize different
      control interfaces.'
    - 'Deployment setting differs: some target single-GPU sub-second autonomous driving
      simulation, while others remain at benchmark construction or model-level evaluation
      without serving evidence.'
    open_questions:
    - How well do these systems generalize beyond Minecraft, the two CARL tasks, nuScenes,
      Waymo/nuPlan, and the specific game or robotics domains used in the evidence?
    - Can long-horizon closed-loop rollouts maintain action fidelity and spatial consistency
      without accumulating autoregressive drift?
    - What are the scaling limits of low-latency serving when moving to multi-GPU
      or complex scene deployment?
    - 'Which evaluation metric best predicts downstream policy or deployment success:
      FID/FVD, action fidelity, spatial consistency, or planning performance?'
    - Independent reproduction is uncertain because several entries lack visible code
      or dataset links, and some limitation fields are missing.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 用于零样本策略泛化的上下文条件潜在世界模型
      解决的问题: 利用可观测上下文调节潜在状态推断和动力学，使在想象轨迹上训练的策略能迁移到未见上下文值。
      尚未覆盖: 假设上下文可观测，且仅在 CARL 基准的两个任务上验证；更广泛场景仍未覆盖。
    - 路线: 面向驾驶与机器人的动作可控视频世界模拟器
      解决的问题: 根据动作、轨迹或意图生成未来 RGB 帧，用作模拟器、策略训练环境和策略评估器。
      尚未覆盖: 长时域动作忠实度、跨域泛化和物理一致性仅得到部分展示；部分方法继承预训练视频模型偏差。
    - 路线: 面向模拟器忠实度的基准与数据集
      解决的问题: 通过循环导航或动作条件未来预测等数据集与指标，量化空间一致性和动作忠实度。
      尚未覆盖: 覆盖范围限于 Minecraft 和 nuScenes 等特定环境；这些环境之外的独立部署尚未证实。
    - 路线: 高效生成与服务部署栈
      解决的问题: 通过帧级自回归、双模式生成或潜在替换降低训练或推理成本，并满足交互延迟。
      尚未覆盖: 超出单GPU的扩展性以及跨硬件、跨团队的独立复现仍缺乏证据。
    共识:
    - 主流共识是把学习到的世界模型视为可运行模拟器，而非仅作静态预测，强调闭环或动作条件生成。
    - 评测越来越多地与任务相关忠实度绑定，例如动作遵循、空间一致性、动态真实感或下游策略效用。
    - 近期系统普遍希望把世界模型变成可用工件，同时兼顾可控推演与效率或基准支持。
    分歧:
    - 表示与监督信号不同：有的学习潜在世界动态以训练策略，有的生成以动作或轨迹为条件的 RGB 视频。
    - 评测目标不同：空间一致性基准、动作忠实度基准、视频逼真度指标和闭环规划性能被分别采用。
    - 交互模式不同：以上下文为条件的策略学习、轨迹/动作可控视频仿真和双模式自回归运动规划强调不同控制接口。
    - 部署场景不同：有的面向单GPU亚秒级自动驾驶仿真，有的停留在基准构建或模型级评估而缺少服务证据。
    开放问题:
    - 这些系统在 Minecraft、CARL 的两个任务、nuScenes、Waymo/nuPlan 以及所用游戏与机器人领域之外能否泛化？
    - 长时程闭环推演能否在避免自回归漂移累积的同时保持动作忠实度与空间一致性？
    - 低延迟服务进入多GPU或复杂场景部署时的扩展边界是什么？
    - 哪个指标最能预测下游策略或部署成功：FID/FVD、动作忠实度、空间一致性还是规划性能？
    - 若干论文缺少可见代码或数据集链接，部分局限性字段缺失，因此独立复现仍属验证缺口。
