  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by benchmark and evaluation work
    for world models, anchored on Atari 100k, CARL, NuScenes, OpenDV-2K, Waymo, and
    Minecraft loop navigation, with evaluation shifting to fidelity, consistency,
    controllability, and generalization probes.'
  - 'Shared research pattern: Methods couple generative sequence models with auxiliary
    tasks such as mask reconstruction, context conditioning, physics-informed depth/keypoints,
    or action-video diffusion, then evaluate on standard or newly introduced datasets.'
  - 'Key differences: Representation choices range from discrete latents to Transformers/VAEs
    and diffusion; evaluation targets split between agent returns, visual detail,
    spatial consistency, memory/action control, and zero-shot generalization; settings
    include Atari, driving, robotics, and Minecraft.'
  - 'Trend evolution: Although the year span is 2016-2026, top-ranked evidence sits
    in 2023-2026; the frontier moves from efficient Atari agents through diffusion
    and contextual models to specialized driving, robotics, and memory/control benchmarks,
    emphasizing physical plausibility and long-horizon consistency.'
  - 'Open questions: Whether benchmark task distributions cover real deployment, whether
    chosen metrics align with downstream decisions, and whether conclusions remain
    stable across implementations, compute budgets, and unseen action spaces.'
  related_work_outline_zh:
  - 主流方向：证据集中于世界模型的基准与评测工作，锚定Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo和Minecraft循环导航，评测重心转向保真度、一致性、可控性和泛化探针。
  - 研究共性：方法将生成式序列模型与掩码重建、上下文条件、物理信息深度/关键点或动作-视频扩散等辅助任务结合，并在标准或新数据集上评估。
  - 关键差异：表示选择涵盖离散潜变量、Transformer/VAE和扩散；评测目标分为智能体回报、视觉细节、空间一致性、记忆/动作控制与零样本泛化；环境包括Atari、驾驶、机器人和Minecraft。
  - 趋势演进：尽管年份跨度为2016-2026，高排名证据集中在2023-2026；前沿从高效Atari智能体，经扩散与上下文模型，转向驾驶、机器人及记忆/控制基准，强调物理合理性和长时一致性。
  - 开放问题：基准任务分布是否覆盖真实部署，所选指标是否与下游决策一致，结论在实现、算力预算和未见动作空间下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks for spatial consistency in loop navigation,
        contextual zero-shot generalization, and closed-loop memory/action control
        using curated scenes and action spaces.
      what_remains_open: 'Coverage is narrow relative to real deployment: evaluations
        use limited CARL tasks, selected Minecraft or driving clips, and small curated
        video sets.'
    - line: Metric and stress-test design
      what_it_solves: Introduces scene-graph consistency, memory-consistency/action-control,
        human-normalized Atari score, visual fidelity, physical plausibility, and
        zero-shot generalization measures.
      what_remains_open: Proxy metrics are not clearly linked to downstream decision
        utility; some works report only aggregate scores or omit limitations, leaving
        metric validity unverified.
    - line: Comparable baselines and reporting
      what_it_solves: Uses common benchmark suites and open artifacts such as Atari
        100k, CARL, NuScenes, OpenDV-2K, and Waymo to make world-model results more
        auditable.
      what_remains_open: Stability across different implementations and compute budgets
        is not established; missing code, dataset, metric, baseline, or limitation
        details are verification gaps rather than confirmed shortcomings.
    consensus:
    - Standard benchmark suites and task-specific scores are used to compare world
      models under limited interaction or curated evaluation settings.
    - Visual fidelity, spatial consistency, long-horizon memory, and action controllability
      are treated as important stress axes beyond single-frame prediction.
    - Many methods add auxiliary objectives to generation, including mask reconstruction,
      context conditioning, physics-informed depth/keypoints, or joint action-video
      diffusion, to improve learned dynamics and generalization.
    disagreements:
    - 'Representation: discrete latent or VAE-based models compress observations,
      while diffusion-based models argue that visual detail should be preserved for
      agent performance.'
    - 'Supervision signal: works differ on whether to use mask reconstruction, context
      values, physics-informed depth/keypoints, or paired action-video diffusion as
      the training objective.'
    - 'Evaluation target: some work optimizes game or control returns on Atari/CARL,
      while others optimize spatial consistency, memory/action control, visual fidelity,
      or zero-shot generalization.'
    - 'Interaction mode: closed-loop revisited video evaluation, open-loop rollout,
      and policy-in-the-loop training differ across the evidence.'
    - 'Deployment setting: Atari, contextual robotic control, driving video, embodied
      robotics, and Minecraft are not unified; each uses different scenes and action
      spaces.'
    open_questions:
    - How well do current benchmark task distributions cover the settings where these
      models are expected to make downstream decisions?
    - Which metrics, such as consistency, fidelity, human-normalized return, or zero-shot
      generalization, best predict real policy utility?
    - Are reported benchmark conclusions stable across independent implementations,
      compute budgets, and unseen action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务，衡量循环导航空间一致性、上下文零样本泛化以及闭环记忆/动作控制，使用精选场景和动作空间。
      尚未覆盖: 覆盖范围相对真实部署仍窄：评估仅使用有限的CARL任务、精选Minecraft或驾驶片段和小规模视频集。
    - 路线: 指标与压力测试设计
      解决的问题: 引入场景图一致性、记忆一致性/动作控制、人类归一化Atari得分、视觉保真度、物理合理性和零样本泛化等度量。
      尚未覆盖: 代理指标与下游决策效用之间的关联尚不清晰；部分工作只报告总分或未说明局限，指标有效性仍待验证。
    - 路线: 可比基线与报告规范
      解决的问题: 使用常见基准套件和开放工件（如Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo）让结果更可审计。
      尚未覆盖: 不同实现和算力预算下结论是否稳定仍未知；代码、数据集、指标、基线或局限细节缺失属于验证缺口。
    共识:
    - 使用标准基准套件和任务特定评分，在有限交互或精选评测设置下比较世界模型。
    - 视觉保真度、空间一致性、长时记忆和动作可控性被视为超越单帧预测的重要压力轴。
    - 许多方法在生成目标之外加入掩码重建、上下文条件、物理信息深度/关键点或动作-视频扩散等辅助目标，以改善动力学学习和泛化。
    分歧:
    - 表示方式：离散潜变量或VAE类模型压缩观测，而扩散类模型认为保留视觉细节更能提升智能体表现。
    - 监督信号：工作之间在使用掩码重建、上下文值、物理信息深度/关键点或配对动作-视频扩散作为训练目标上存在差异。
    - 评测目标：部分工作优化Atari/CARL中的游戏或控制回报，另一些优化空间一致性、记忆/动作控制、视觉保真度或零样本泛化。
    - 交互模式：闭环复现视频评测、开环展开和策略在环训练在证据中并不统一。
    - 部署场景：Atari、上下文机器人控制、驾驶视频、具身机器人和Minecraft未形成统一设置，各用不同场景与动作空间。
    开放问题:
    - 当前基准任务分布在多大程度上覆盖这些模型预期产生下游决策的真实设置？
    - 一致性、保真度、人类归一化回报或零样本泛化等指标中，哪类最能预测真实策略效用？
    - 报告的基准结论在独立实现、不同算力预算和未见动作空间下是否稳定？
