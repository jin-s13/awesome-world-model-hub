  related_work_outline_zh:
  - 主流方向：通过生成式视频预测构建面向驾驶、机器人和交互式游戏的领域世界模型，架构趋向扩散模型和Transformer。
  - 研究共性：所有工作都通过自监督的未来观测重建或生成来学习环境动力学，再将模型用于规划、策略学习或评估。
  - 关键差异：在监督信号（动作条件视频、物理深度/关键点或纯视频）、泛化目标（组合泛化、零样本或跨数据集）和评估重点（视觉保真度、任务成功率或记忆一致性）上不同。
  - 趋势演进：2023–2026年证据显示从高效游戏世界模型向机器人和驾驶扩展，随后出现专门的空间和记忆一致性基准，表明领域正走向系统化评估。
  - 开放问题：真实部署安全性、长期记忆与空间一致性、跨本体迁移以及统一评估指标均未得到验证。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Generalizable video prediction for driving scenes, enabling
        long-horizon and multi-view simulation for planning and policy evaluation.
      what_remains_open: Closed-loop real-world safety validation, cross-dataset zero-shot
        robustness, and alignment between visual quality and operational outcomes
        are not established.
    - line: Embodied robotic world models
      what_it_solves: Video generation and physics-informed modeling for robot imagination,
        compositional task generalization, and large-scale pretraining with action-video
        coupling.
      what_remains_open: Real-robot deployment, sim-to-real transfer, fully novel
        primitive combinations, and error tolerance of physical predictions remain
        unverified.
    - line: Interactive game and control world models
      what_it_solves: Efficient stochastic world models for Atari and contextual RL,
        plus benchmarks for evaluating memory consistency and spatial coherence in
        open-ended environments.
      what_remains_open: Generalization to open-world long-term memory, action-space
        diversity, and integration with large-scale pretrained models are unresolved.
    consensus:
    - World models are predominantly instantiated as generative video prediction models
      conditioned on actions or context.
    - Self-supervised learning on environment interaction data is the core training
      paradigm, with models later used for downstream policy optimization or evaluation.
    - Evaluation is mostly simulation-based, using domain-specific datasets and metrics
      such as visual fidelity, task success rate, or human-normalized scores.
    - Transformer and diffusion architectures are increasingly adopted for their scalability
      and generation quality.
    disagreements:
    - 'Output representation: some models generate pixel-level videos, while others
      operate on latent states or keypoints.'
    - 'Physical knowledge integration: models like RoboScape explicitly predict depth
      and keypoints, while others remain purely data-driven.'
    - 'Action coupling: UWM jointly diffuses actions and video, whereas most models
      treat actions only as conditioning inputs.'
    - 'Generalization type: cRSSM targets zero-shot dynamics generalization, RoboDreamer
      aims for compositional generalization, and MaskGWM focuses on cross-dataset
      generalization.'
    - 'Evaluation granularity: benchmarks like LoopNav and MIND measure specific memory
      and consistency, while other works prioritize task performance or visual quality.'
    open_questions:
    - What is the relationship between pixel-level generation quality and downstream
      policy performance in real-world settings?
    - How can long-term memory and spatial consistency be maintained when world models
      are deployed in open-loop or closed-loop control over extended horizons?
    - Can world models trained on one embodiment or dataset transfer effectively to
      new physical bodies or environments without retraining?
    - What are the minimum supervision requirements (e.g., action labels, depth, keypoints)
      to achieve physically plausible and actionable world models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 泛化驾驶场景视频预测，支撑长时域多视角仿真，用于规划与策略评测。
      尚未覆盖: 闭环真实安全验证、跨数据集零样本鲁棒性、视觉质量与运营结果一致性尚未建立。
    - 路线: 具身机器人世界模型
      解决的问题: 视频生成与物理信息建模，实现机器人想象、组合任务泛化及动作-视频耦合的大规模预训练。
      尚未覆盖: 真实机器人部署、仿真到现实迁移、全新原语组合、物理预测误差容忍度未经验证。
    - 路线: 交互式游戏与控制世界模型
      解决的问题: 为Atari和上下文RL构建高效随机世界模型，并提出评估记忆一致性与空间连贯性的基准。
      尚未覆盖: 开放世界长期记忆、动作空间多样性、与大规模预训练模型集成仍未解决。
    共识:
    - 世界模型主要以动作或上下文条件的生成式视频预测模型实现。
    - 核心范式是自监督学习环境交互数据，后续用于下游策略优化或评估。
    - 评估多为仿真，使用领域特定数据集和指标，如视觉保真度、任务成功率或人类归一化得分。
    - Transformer和扩散架构因其可扩展性和生成质量被越来越多采用。
    分歧:
    - 输出表示：部分模型生成像素级视频，其他在潜在状态或关键点层面操作。
    - 物理知识融合：RoboScape显式预测深度和关键点，其他模型保持纯数据驱动。
    - 动作耦合方式：UWM联合扩散动作与视频，多数模型仅将动作作为条件输入。
    - 泛化类型：cRSSM瞄准零样本动力学泛化，RoboDreamer追求组合泛化，MaskGWM侧重跨数据集泛化。
    - 评估粒度：LoopNav和MIND衡量特定记忆与一致性，其他工作优先任务性能或视觉质量。
    开放问题:
    - 像素级生成质量与真实环境下策略性能之间存在何种关系？
    - 延长时域后，世界模型在开环或闭环控制中如何维持长期记忆与空间一致性？
    - 在一种本体或数据集上训练的世界模型能否有效迁移到新物理体或环境？
    - 达到物理合理且可执行的世界模型所需的最小监督（如动作标签、深度、关键点）是什么？
