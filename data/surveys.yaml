      尚未覆盖: 跨本体、数据集、机构或物理环境的迁移尚未验证；部分方法假设上下文可观测，或仅支持已见过的原语组合。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角、长时域驾驶视频预测和闭环仿真评测；例如 MaskGWM 在 NuScenes、OpenDV-2K 和 Waymo
        上基于掩码重建进行预测。
