  related_work_outline:
  - 'Mainstream direction: Recent work converges on generative diffusion- or transformer-based
    world models for visual dynamics, often applied to driving and robotics, with
    auxiliary tasks such as mask reconstruction, depth prediction, keypoint dynamics,
    or action diffusion to improve prediction and control.'
  - 'Shared research pattern: Most methods learn a dynamics model from visual or video
    data, condition on actions, context, language, or goals, and evaluate through
    downstream prediction, policy learning, simulation execution, or consistency benchmarks.'
  - 'Key differences: Representations range from stochastic latent state and VAE-Transformer
    models to diffusion video generators, compositional primitive models, and unified
    action-video diffusion; evaluation settings span Atari, CARL, driving datasets,
    robot videos, and Minecraft/open-domain consistency benchmarks.'
  - 'Trend evolution: The available evidence moves from sample-efficient model-based
    RL with latent world models toward large-scale generative video world models and
    explicit spatial, memory, and action-consistency benchmarks around 2025-2026,
    indicating a current-frontier shift rather than a long historical trend.'
  - 'Open questions: Transfer beyond reported datasets and tasks, whether gains stem
    from the model or system choices, long-horizon consistency and physical plausibility
    under unseen actions and contexts, and missing explicit limitations in several
    top papers remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期研究集中于基于生成式扩散或Transformer的视觉世界模型，用于驾驶和机器人场景，并通过掩码重建、深度预测、关键点动力学或动作扩散等辅助任务提升预测与控制。
  - 研究共性：多数工作从视觉或视频数据学习动力学模型，以动作、上下文、语言或目标为条件，并通过下游预测、策略学习、仿真执行或一致性基准进行评估。
  - 关键差异：表示方式覆盖随机潜变量、VAE-Transformer、扩散视频生成、组合原语模型和统一动作-视频扩散；评测目标涵盖Atari、CARL、驾驶数据、机器人视频和开放域一致性基准。
  - 趋势演进：证据显示从模型化强化学习的潜世界模型，转向大规模生成式视频世界模型和显式空间、记忆与动作一致性基准，时间集中在2025-2026年前沿。
  - 开放问题：跨数据集与任务的迁移性、收益是否源于模型本身还是系统选择、长时域一致性与物理合理性，以及若干论文缺失显式局限性说明仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic latent world models for model-based RL (e.g., STORM, cRSSM)
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        under context changes by modeling latent dynamics from visual observations.
      what_remains_open: Context observability is assumed in cRSSM; evaluation is
        narrow (two CARL tasks), and STORM lacks a visible limitation statement, so
        transfer and failure boundaries are unverified.
    - line: Diffusion video world models with auxiliary self-supervised or physics
        tasks (e.g., MaskGWM, RoboScape)
      what_it_solves: Long-horizon, multi-view, or physically plausible video prediction
        by combining diffusion generators with mask reconstruction, depth prediction,
        or keypoint dynamics.
      what_remains_open: Limitation details are absent for both papers; MaskGWM shows
        cross-dataset driving transfer, but physical and geometric consistency beyond
        reported robotic visual metrics is not isolated.
    - line: Unified action-video diffusion world models (e.g., UWM)
      what_it_solves: Pretraining flexible policy, forward dynamics, inverse dynamics,
        and video generation interfaces in one transformer over large robot datasets,
        including action-free video.
      what_remains_open: No limitation statement is available; the contribution of
        unified diffusion versus data scale and pretraining choices has not been isolated.
    - line: Compositional language-primitive world models for robot imagination (e.g.,
        RoboDreamer)
      what_it_solves: Generalization to unseen language-specified goals by factorizing
        video generation into previously seen primitives and recombining them.
      what_remains_open: Limited to known primitive combinations and parsing accuracy;
        evidence is simulated only, leaving real-robot transfer and novel primitive
        handling open.
    - line: Consistency and action-control evaluation protocols for world models (e.g.,
        LoopNav, MIND)
      what_it_solves: Standardized evaluation of spatial consistency, memory consistency,
        and action controllability through structured datasets and metrics.
      what_remains_open: LoopNav reports no abstract-level experimental results; MIND
        identifies long-term memory and cross-action-space generalization as unsolved
        challenges rather than resolving them.
    consensus:
    - Recent world-model methods increasingly adopt generative video objectives, often
      with transformer or diffusion backbones, to capture visual dynamics.
    - Auxiliary signals such as mask reconstruction, depth/keypoint dynamics, or action
      diffusion are used to improve consistency, controllability, or physical plausibility.
    - Evaluation is expanding beyond per-frame visual quality to downstream policy
      learning, zero-shot generalization, and explicit consistency or controllability
      criteria.
    disagreements:
    - 'Representation choices differ widely: compact latent state, VAE-Transformer
      stochastic models, diffusion video tokens, compositional primitives, and unified
      action-video diffusion coexist.'
    - 'Supervision and objectives differ: reconstruction plus generation, latent dynamics
      learning, physics-informed depth/keypoint losses, language-primitive decomposition,
      and action-video diffusion coupling each have different emphasis.'
    - 'Evaluation targets differ: sample-efficient RL on Atari, contextual generalization
      on CARL, driving prediction on Nuscenes/OpenDV-2K/Waymo, robot video synthesis
      in simulation, and Minecraft/open-domain consistency benchmarks.'
    - 'Action interfaces differ: some models learn action-conditioned dynamics, some
      condition on language or image goals, some are benchmarked separately for action
      control, and some pretrain with action-free video.'
    open_questions:
    - Which auxiliary tasks or objectives transfer beyond the reported driving, gaming,
      or robotic settings?
    - Are improvements due to the learned world model rather than data scale, planner/controller,
      dataset construction, or implementation choices?
    - Can world models maintain long-horizon memory consistency, spatial consistency,
      and physical plausibility under unseen actions, contexts, and environments?
    - What failure modes and limitations exist for methods that currently lack explicit
      limitation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于随机潜变量的模型化强化学习世界模型（例如 STORM、cRSSM）
      解决的问题: 从视觉观测建模潜在动力学，提升样本效率策略学习与上下文变化下的零样本泛化。
      尚未覆盖: cRSSM假设上下文可观测，且仅在两个CARL任务上验证；STORM缺少可见局限说明，迁移性和失败边界未验证。
    - 路线: 带辅助自监督或物理任务的扩散视频世界模型（例如 MaskGWM、RoboScape）
      解决的问题: 通过扩散生成器结合掩码重建、深度预测或关键点动力学，实现长时域、多视角或物理合理的视频预测。
      尚未覆盖: 两篇均缺少显式局限；MaskGWM展示了驾驶跨数据集迁移，但RoboScape物理与几何一致性的增益未与系统选择隔离。
    - 路线: 统一动作-视频扩散世界模型（例如 UWM）
      解决的问题: 在单一Transformer中耦合动作与视频扩散，支持策略、前向、逆动力学和视频生成接口，并可利用无动作视频预训练。
      尚未覆盖: 缺少局限说明；统一扩散目标相对数据规模与预训练选择的具体贡献未隔离。
    - 路线: 基于语言原语的组合式机器人世界模型（例如 RoboDreamer）
      解决的问题: 通过把语言指令分解为已见原语并重组视频生成，实现对未见目标组合的泛化。
      尚未覆盖: 局限于已见原语组合与解析准确性；仅有仿真证据，真实机器人迁移和新原语处理未解决。
    - 路线: 世界模型一致性与动作控制评测协议（例如 LoopNav、MIND）
      解决的问题: 通过结构化数据集和指标，量化空间一致性、记忆一致性和动作可控性。
      尚未覆盖: LoopNav摘要未报告实验结果；MIND指出长期记忆和跨动作空间泛化仍是挑战，而非已解决。
    共识:
    - 近期世界模型方法越来越多采用生成式视频目标，并常以Transformer或扩散为主干来捕捉视觉动力学。
    - 掩码重建、深度/关键点动力学或动作扩散等辅助信号被用来改善一致性、可控性或物理合理性。
    - 评估正从单帧视觉质量扩展到下游策略学习、零样本泛化，以及显式一致性和可控性指标。
    分歧:
    - 表示方式差异明显：压缩潜状态、VAE-Transformer随机模型、扩散视频token、组合原语模型与统一动作-视频扩散并存。
    - 监督与目标不同：重建加生成、潜在动力学学习、物理信息深度/关键点损失、语言原语分解以及动作-视频扩散耦合各有侧重。
    - 评测目标不同：Atari样本效率RL、CARL上下文泛化、Nuscenes/OpenDV-2K/Waymo驾驶预测、机器人视频仿真合成，以及Minecraft/开放域一致性基准。
    - 动作接口不同：部分方法学习动作条件动力学，部分以语言或图像目标为条件，部分通过基准单独测试动作控制，部分用无动作视频预训练。
    开放问题:
    - 哪些辅助任务或目标能迁移到已报告的驾驶、游戏或机器人场景之外？
    - 性能提升究竟来自世界模型本身，还是来自数据规模、规划器/控制器、数据集构建或实现选择？
    - 在未见动作、上下文和环境下，世界模型能否同时保持长时记忆一致性、空间一致性和物理合理性？
    - 当前缺少显式局限说明的方法存在哪些失败模式和边界？
