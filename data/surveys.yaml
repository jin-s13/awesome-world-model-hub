  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video world models, especially
    diffusion transformers, with auxiliary mask, physics, or dynamics objectives and
    explicit action/context conditioning for driving, robotics, and reinforcement
    learning.'
  - 'Shared research pattern: Papers introduce representations or objectives that
    improve generation or generalization, then evaluate through video fidelity, zero-shot
    rollouts, or consistency benchmarks; evaluation increasingly includes long-horizon
    and spatial/memory consistency.'
  - 'Key differences: One subgroup optimizes latent dynamics for model-based reinforcement
    learning; another builds large video diffusion models; a third benchmarks consistency.
    Supervision varies from full action to action-free video, and context assumptions
    range from observable values to pre-parsed language primitives.'
  - 'Trend evolution: The available top evidence from 2023–2026 shows a shift from
    Atari-focused stochastic world models toward large-scale diffusion/transformer
    world models and specialized consistency or action-control benchmarks for robot
    and driving domains.'
  - 'Open questions: It remains unclear how much gain comes from model architectures
    versus auxiliary objectives or broader system design; context and primitive assumptions,
    long-horizon memory, and cross-action-space control remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近年工作以生成式视频世界模型为主，尤其是扩散Transformer，并加入掩码、物理或动力学辅助目标，以及显式动作/上下文条件，用于驾驶、机器人和强化学习。
  - 研究共性：论文提出新的表示或目标来改进生成与泛化，并通过视频保真度、零样本展开或一致性基准进行评估；评估越来越多地关注长时域和空间/记忆一致性。
  - 关键差异：一组优化潜在动力学用于基于模型的强化学习；另一组构建大规模视频扩散模型；还有一组评估一致性。监督信号从完整动作到无动作视频不等，上下文假设也有明显不同。
  - 趋势演进：2023–2026年可见证据显示，从Atari随机世界模型转向大规模扩散/Transformer世界模型，以及面向机器人与驾驶场景的专用一致性、动作控制基准。
  - 开放问题：模型结构、辅助目标与系统设计的贡献尚未充分分离；上下文与原语假设、长时记忆和跨动作空间控制仍是未解决问题。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion and transformer video world models with auxiliary reconstruction
        or physics objectives
      what_it_solves: Generate long-horizon, multi-view, or physically plausible video
        by adding mask reconstruction, temporal depth, or keypoint dynamics signals.
      what_remains_open: Whether auxiliary objectives transfer beyond reported driving
        and robot scenarios, and whether improved video fidelity implies better downstream
        control.
    - line: Contextual and compositional latent dynamics models for policy learning
        and robot imagination
      what_it_solves: Adapt latent dynamics or video generation to context, language
        primitives, or action, enabling zero-shot or compositional generalization
        from model-generated rollouts.
      what_remains_open: Context observability, predefined primitive coverage, and
        separation of model improvement from planner or task prior remain unresolved.
    - line: Unified action-video diffusion interfaces for pretraining
      what_it_solves: Represent policy, forward dynamics, inverse dynamics, and video
        generation in one action-video diffusion process, allowing large-scale robot
        dataset pretraining.
      what_remains_open: Robustness and generalization evidence after pretraining
        is limited, and independent diffusion timesteps need broader validation across
        datasets and embodiments.
    - line: Spatial, memory, and action-control evaluation protocols
      what_it_solves: Measure long-horizon consistency and action responsiveness through
        loop navigation, scene-graph scores, or open-domain revisited video benchmarks.
      what_remains_open: Some benchmarks provide datasets rather than method comparisons;
        metric validity for downstream task utility and coverage across world-model
        families remain incomplete.
    consensus:
    - World-model methods combine generation objectives with auxiliary self-supervision
      such as mask reconstruction, depth prediction, keypoint dynamics, or dynamics
      prediction.
    - Action or context conditioning is central for controllable prediction, though
      the form and availability of action or context differ across studies.
    - Evaluation is expanding from short visual fidelity to spatial consistency, memory
      consistency, physical plausibility, and zero-shot generalization.
    disagreements:
    - Representation choices split between stochastic recurrent or state-space latent
      models and diffusion or transformer video generators.
    - 'Supervision assumptions differ: full action, action-free video, observable
      context, or pre-parsed language primitives.'
    - Evaluation targets vary from Atari-100k human-normalized returns to multi-view
      driving rollouts, robot video synthesis, and open-domain consistency benchmarks.
    - Some papers report policy or downstream gains while others report benchmark
      construction without head-to-head method results, leaving method contribution
      unevenly isolated.
    open_questions:
    - How do consistency metrics translate to downstream control, planning, or real-world
      transfer?
    - What is the isolated contribution of world-model representations versus auxiliary
      objectives, diffusion backbones, planners, or data scale?
    - Can current models maintain long-horizon memory and cross-action-space control
      when context or action assumptions are relaxed?
    - 'Which generalization boundary is most limiting: unseen action spaces, unseen
      primitives, unobserved context, or domain shift?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带辅助重建或物理目标的扩散与Transformer视频世界模型
      解决的问题: 通过加入掩码重建、时序深度或关键点动力学信号，生成长时域、多视角或物理合理的视频。
      尚未覆盖: 辅助目标能否迁移到报告场景之外，以及视频保真度提升是否带来下游控制能力提升，仍不明确。
    - 路线: 用于策略学习与机器人想象的上下文和组合潜在动力学模型
      解决的问题: 将潜在动力学或视频生成条件化于上下文、语言原语或动作，实现来自模型生成轨迹的零样本或组合泛化。
      尚未覆盖: 上下文可观测性、预定义原语覆盖范围，以及模型改进与规划器或任务先验的贡献分离，尚未解决。
    - 路线: 统一的动作-视频扩散预训练接口
      解决的问题: 在单一动作-视频扩散过程中表示策略、前向动力学、逆动力学和视频生成，支持大规模机器人数据预训练。
      尚未覆盖: 预训练后的鲁棒性和泛化证据有限，独立扩散时间步需要在更多数据集和具身场景中验证。
    - 路线: 空间、记忆与动作控制评估协议
      解决的问题: 通过循环导航、场景图分数或开放域回访视频基准，衡量长时一致性和动作响应能力。
      尚未覆盖: 部分基准只给出数据集而缺少方法对比；指标对下游任务有效性和跨世界模型家族的覆盖仍不完整。
    共识:
    - 世界模型方法普遍将生成目标与掩码重建、深度预测、关键点动力学或动力学预测等辅助自监督任务相结合。
    - 动作或上下文条件对可控预测至关重要，但动作或上下文的形式与可获得性在不同研究中存在差异。
    - 评估正从短期视觉保真度扩展到空间一致性、记忆一致性、物理合理性和零样本泛化。
    分歧:
    - 表示选择在随机循环/状态空间潜在模型与扩散或Transformer视频生成器之间存在分化。
    - 监督假设不同：完整动作、无动作视频、可观测上下文或预解析语言原语。
    - 评测目标差异较大：Atari-100k人类归一化得分、多视角驾驶展开、机器人视频合成和开放域一致性基准并存。
    - 部分论文报告策略或下游收益，部分论文仅报告数据集与基准构建，方法贡献的证据隔离程度不一致。
    开放问题:
    - 一致性指标如何转化为下游控制、规划或真实世界迁移能力？
    - 世界模型表示相比辅助目标、扩散骨干、规划器或数据规模的独立贡献是什么？
    - 当上下文或动作假设放宽时，现有模型能否保持长时记忆和跨动作空间控制？
    - 最具限制性的泛化边界是什么：未见动作空间、未见原语、不可观测上下文还是领域迁移？
