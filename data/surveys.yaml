  - 'Mainstream direction: Domain-specific generative world models for driving, robotics,
    and interactive control, especially video diffusion or latent dynamics that imagine
    future states for planning and policy learning.'
  - 'Shared research pattern: Condition predictive models on observations, actions,
    language, or context to generate future video or latent trajectories, then evaluate
    with fidelity, consistency, and downstream policy utility.'
  - 'Key differences: Settings span driving, robot manipulation, Atari/contextual
    RL, and open-domain games; supervision ranges from action-coupled diffusion, physics
    losses, language primitives, and observable context to benchmark-only metrics.'
  - 'Trend evolution: From sample-efficient model-based RL in 2023-2024 toward embodied
    and driving video world models in 2024-2025, then toward 2025-2026 benchmarks
    for memory, spatial, and action consistency.'
  - 'Open questions: Real-world transfer and safety alignment, partially observed
    or unobserved context, novel primitive/action generalization, and whether consistency
    metrics predict downstream task performance.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互控制等领域应用的世界模型，主要通过视频扩散或潜在动力学预测未来状态，用于规划与策略学习。
  - 研究共性：以观测、动作、语言或上下文为条件训练预测模型生成未来视频或潜在轨迹，并用保真度、一致性和下游策略效用进行评估。
  - 关键差异：场景覆盖驾驶、机器人操作、Atari/上下文强化学习和开放域游戏；监督信号从动作耦合扩散、物理损失、语言原语、可观测上下文到仅基准评测各有不同。
  - 趋势演进：从2023-2024年的样本高效模型基强化学习，演进到2024-2025年的具身与驾驶视频世界模型，再到2025-2026年的记忆、空间和动作一致性基准。
  - 开放问题：真实环境迁移与安全一致性、部分观测或不可观测上下文、新原语/动作泛化，以及一致性指标能否预测下游任务表现。
  literature_review:
    line_of_work_matrix:
    - line: Driving video diffusion with mask reconstruction
      what_it_solves: Long-horizon, multi-view driving video prediction from observations
        and actions for simulation and scene rollout.
      what_remains_open: Closed-loop driving safety and operational transfer beyond
        NuScenes, OpenDV-2K, and Waymo prediction metrics remain unverified.
    - line: Compositional and physics-informed robot video generation
      what_it_solves: Robot video plans through language decomposed into primitives,
        or through depth and keypoint physics objectives for plausible imagination.
      what_remains_open: Generalization to unseen primitives, unseen physical settings,
        and real robot execution beyond simulation lacks direct evidence.
    - line: Action-coupled video diffusion pretraining for robot policies
      what_it_solves: Unified pretraining of policy, forward/inverse dynamics, and
        video generation from large multitask robot datasets.
      what_remains_open: Cross-embodiment, cross-dataset, and deployment robustness
        are not yet established.
    - line: Stochastic or contextual latent world models for model-based RL
      what_it_solves: Sample-efficient policy learning from imagined rollouts in Atari
        and contextual reinforcement learning benchmarks.
      what_remains_open: Observable-context assumptions and limited task coverage
        restrict broader zero-shot generalization claims.
    - line: Open-domain memory, spatial, and action-control benchmarks
      what_it_solves: Quantifying spatial consistency, memory, and action control
        in world models using Minecraft or open-domain video benchmarks.
      what_remains_open: Benchmark scores are not yet tied to downstream task success
        or long-term physical consistency.
    consensus:
    - Most works treat world models as predictive generators conditioned on observations,
      actions, language, or context to support planning or policy learning.
    - Recent evidence emphasizes video generation quality, long-horizon rollouts,
      physical plausibility, memory consistency, and action control as evaluation
      targets.
    - There is a shared shift toward generative architectures such as diffusion transformers
      or stochastic latent dynamics rather than purely recognition-style modeling.
    - Applications increasingly demand zero-shot or cross-domain generalization to
      unseen scenes, contexts, goals, or embodiments.
    - Reported limitations often focus on simulated or dataset-level validation; deployment-level
      evidence is frequently absent or explicitly open.
    disagreements:
    - One branch learns compact latent policies through model-based RL on Atari or
      contextual control, another generates explicit high-dimensional video for driving
      and robot imagination, and another mainly constructs evaluation data and metrics.
    - 'Supervision and conditioning differ: observable context values, language parsed
      into lower-level primitives, depth and keypoint physics signals, action-video
      diffusion timesteps, or benchmark action spaces.'
    - 'Evaluation targets differ: human-normalized Atari score, zero-shot policy transfer
      on CARL tasks, driving prediction on NuScenes/OpenDV-2K/Waymo, robot video plan
      execution in simulation, and memory/action consistency scores.'
    - 'Generalization scope differs: some test unseen goals or zero-shot datasets,
      some restrict conclusions to combinations of seen primitives or two CARL tasks,
      and benchmark papers report challenges rather than model improvements.'
    - 'Physical realism is treated differently: explicit physics-informed losses in
      robot video generation, implicit latent dynamics in model-based RL, or no physical
      modeling in benchmark-focused work.'
    open_questions:
    - Can improvements in driving video prediction and benchmark consistency translate
      to real-world closed-loop driving safety and operational outcomes?
    - Do physics-informed or language-compositional robot world models remain accurate
      on unseen physical objects, actions, and real robot execution?
    - How should world models handle partially observed or unobserved context when
      zero-shot policy generalization is required?
    - Are current memory consistency and action-control metrics predictive of downstream
      planning, policy learning, or long-horizon physical task success?
    - What evidence would link generative video and dynamics quality to cross-embodiment,
      cross-dataset, or cross-institution transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向驾驶的视频扩散与掩码重建路线
      解决的问题: 从观测和动作生成长时域、多视角驾驶视频，用于仿真和场景推演。
      尚未覆盖: NuScenes、OpenDV-2K和Waymo预测指标之外的闭环驾驶安全与真实运营迁移尚未验证。
    - 路线: 面向机器人的组合式与物理信息视频生成路线
      解决的问题: 通过将语言指令分解为原语，或引入深度与关键点物理目标，生成机器人想象视频计划。
      尚未覆盖: 未见原语、未见物理场景以及仿真之外的实体机器人执行仍缺乏直接证据。
    - 路线: 动作耦合视频扩散的机器人策略预训练路线
      解决的问题: 在大规模多任务机器人数据上统一建模策略、前向/逆向动力学和视频生成。
      尚未覆盖: 跨本体、跨数据集和部署鲁棒性尚未建立。
    - 路线: 基于随机或上下文潜在世界模型的模型强化学习路线
      解决的问题: 在Atari和上下文强化学习基准中通过想象轨迹进行样本高效策略学习。
      尚未覆盖: 可观测上下文假设和较窄任务覆盖限制了更广泛的零样本泛化结论。
    - 路线: 开放域记忆、空间与动作控制基准路线
      解决的问题: 用Minecraft或开放域视频基准量化世界模型的空间一致性、记忆和动作控制。
      尚未覆盖: 基准分数尚未与下游任务成功或长期物理一致性关联。
    共识:
    - 多数工作将世界模型视为以观测、动作、语言或上下文为条件的预测生成器，以辅助规划或策略学习。
    - 近期证据强调视频生成质量、长时域推演、物理合理性、记忆一致性和动作控制作为评测目标。
    - 存在向扩散Transformer或随机潜在动力学等生成式架构演进的共同趋势。
    - 应用越来越要求对未见场景、上下文、目标或本体的零样本或跨域泛化。
    - 报告的限制多集中在仿真或数据集层面验证，部署级证据常缺失或明确留作开放问题。
    分歧:
    - 一分支在Atari或上下文控制中学习紧凑潜在策略，另一分支为驾驶与机器人想象生成显式高维视频，还有分支主要构建评测数据与指标。
    - 监督与条件不同：可观测上下文值、语言解析原语、深度和关键点物理信号、动作-视频扩散时间步或基准动作空间。
    - 评测目标不同：Atari人类标准化分数、CARL任务零样本策略迁移、NuScenes/OpenDV-2K/Waymo驾驶预测、仿真中的机器人视频计划执行，以及记忆/动作一致性分数。
    - 泛化范围不同：部分测试未见目标或零样本数据集，部分仅覆盖见过的原语组合或两个CARL任务，基准论文报告挑战而非模型改进。
    - 物理真实性处理不同：机器人视频生成中显式物理信息损失、模型基强化学习中隐式潜在动力学，或仅做基准而不建模物理。
