    and compute budgets, and whether current task distributions cover real deployment
    settings.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从Atari/RL固定基准上的像素级视频质量，转向以动作条件、长时域、具身与驾驶为导向，考察空间一致性、记忆与控制。
  - 研究共性：工作通常将数据集或基准任务与针对性指标配对，强调世界模型某类能力，并在公开评测套件上比较基线。
  - 关键差异：评测目标在游戏/RL决策效用、机器人策略效用、驾驶/多视角预测和开放域闭环一致性之间存在区别；监督信号与指标也随之不同。
  - 趋势演进：可用高排名论文集中在2023-2026年，评估从Atari 100k基于模型的RL分数，转向LoopNav、MIND等开放域视频基准，属于当前前沿内的演进。
  - 开放问题：空间一致性、记忆一致性和动作控制分数能否迁移到下游决策；跨领域与算力预算下排名是否稳定；当前任务分布是否覆盖真实部署环境，仍有待验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design (e.g., LoopNav, MIND)
      what_it_solves: Creates shared tasks and datasets for comparing world-model
        capabilities such as spatial consistency, memory consistency, and action-conditioned
        prediction.
      what_remains_open: Coverage remains limited to selected domains such as Minecraft,
        driving logs, robotic video, and Atari/CARL settings with fixed action spaces;
        whether these tasks cover real settings where world models are expected to
        help is unverified.
    - line: Metric and stress-test design (e.g., scene-graph consistency, memory/action
        control scores)
      what_it_solves: Probes capabilities beyond aggregate visual quality, including
        spatial consistency, memory consistency, action control, and generalization
        under unseen context or dynamics.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about is not yet demonstrated; most evidence
        stops at benchmark completeness or visual/agent score improvement.
    - line: Comparable baselines and reporting (e.g., Atari 100k, NuScenes, OpenDV-2K,
        Waymo)
      what_it_solves: Provides public evaluation suites and common baselines for auditing
        model performance and reproducibility across long-horizon rollout, zero-shot,
        and multi-view validation.
      what_remains_open: Ranking stability under different implementations, compute
        budgets, and domain transfers is underreported; several papers lack visible
        code, dataset, metric, baseline, or limitation details, leaving verification
        gaps.
    consensus:
    - World-model evaluation is moving toward action-conditioned, long-horizon generation
      and closed-loop consistency rather than single-frame or short-horizon reconstruction.
    - Public evaluation suites and metrics are treated as shared infrastructure for
      comparability, with repeated use of Atari 100k, NuScenes, OpenDV-2K, Waymo,
      CARL, and Minecraft-based settings.
    - Works increasingly combine visual generation scores with auxiliary signals such
      as mask reconstruction, depth, keypoints, or scene-graph consistency to stress
      model behavior.
    disagreements:
    - 'Evaluation target differs: some work scores decision utility through RL agent
      performance, while others score open-domain video generation consistency or
      robotic and driving prediction fidelity.'
    - 'Supervision differs: methods rely on different signals such as context values,
      keypoint dynamics, depth, mask tokens, or paired action-video diffusion.'
    - 'Metric emphasis differs: aggregate human-normalized task scores, spatial graph
      consistency, memory/action-control metrics, and visual fidelity are not interchangeable.'
    - 'Interaction and deployment settings differ: fixed benchmark rollouts and offline
      logs contrast with loop-based re-visitation and varied action spaces.'
    open_questions:
    - Do spatial consistency, memory consistency, and action-control metrics predict
      downstream policy quality in robot or driving deployment? Current evidence remains
      indirect.
    - How stable are benchmark rankings across domain shifts such as Atari, Minecraft,
      CARL, NuScenes/OpenDV-2K, and Waymo, and across training budgets?
    - Can task distributions with fixed action spaces or observed contexts cover real-world
      settings with partially observable or unknown dynamics?
    - What is the reproducibility status of newer benchmarks and models when code,
      dataset, baseline, metric, and limitation artifacts are only partially reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计（如 LoopNav、MIND）
      解决的问题: 构建共享任务和数据集，以比较世界模型在空间一致性、记忆一致性和动作条件预测上的能力。
      尚未覆盖: 当前覆盖局限于 Minecraft、驾驶日志、机器人视频、Atari/CARL 等选定领域和固定动作空间；这些任务是否覆盖世界模型预期的真实设置尚未验证。
    - 路线: 指标与压力测试设计（如场景图一致性、记忆/动作控制得分）
      解决的问题: 在聚合视觉质量之外检验空间一致性、记忆一致性、动作控制以及未见上下文或动力学下的泛化能力。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的一致性仍未充分证明；多数证据止步于基准完整性或视觉/智能体分数提升。
    - 路线: 可比基线与报告规范（如 Atari 100k、NuScenes、OpenDV-2K、Waymo）
      解决的问题: 通过公开评测套件和共同基线，使长时域展开、零样本和多视角验证中的模型性能可审计。
      尚未覆盖: 不同实现、算力预算和领域迁移下排名的稳定性报告不足；部分论文缺少可见的代码、数据集、指标、基线或局限性信息，形成验证缺口。
    共识:
    - 世界模型评估正趋向动作条件、长时域生成和闭环一致性，而不再局限于单帧或短时重建。
    - 公共评测套件和指标被作为可比较的基础设施，反复使用 Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL 和基于 Minecraft
      的设置。
    - 工作越来越多地将视觉生成分数与掩码重建、深度、关键点或场景图一致性等辅助信号结合，以对模型行为进行压力测试。
    分歧:
    - 评测目标不同：有的以 RL 智能体表现来衡量决策效用，有的则以开放域视频生成一致性或机器人/驾驶预测保真度为目标。
    - 监督信号不同：方法分别依赖上下文值、关键点动力学、深度、掩码令牌或配对的动作-视频扩散等信号。
    - 指标侧重不同：聚合人类归一化任务分数、空间图一致性、记忆/动作控制指标和视觉保真度不可直接互换。
    - 交互与部署设置不同：固定基准展开和离线日志，与循环重访和不同动作空间设置形成区别。
