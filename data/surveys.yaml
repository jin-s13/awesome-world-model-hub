  related_work_outline:
  - 'Mainstream direction: Shifting world-model evaluation from pixel-level reconstruction
    toward multi-dimensional semantic consistency probes, including spatial consistency,
    memory, physical plausibility, and action controllability.'
  - 'Shared research pattern: Constructing or leveraging benchmarks to expose failures
    in robustness, generalization, and long-horizon coherence that aggregate scores
    alone cannot capture.'
  - 'Key differences: Domains diverge between closed game environments (Atari, Minecraft)
    and open-ended driving or robotic data; evaluation modes differ between open-loop
    video prediction and closed-loop agent interaction.'
  - 'Trend evolution: From standard performance contests on Atari 100k (2023–2024)
    toward complex embodied and open-domain video benchmarks (2025–2026) that emphasize
    long-term consistency and physics compliance.'
  - 'Open questions: How to calibrate proxy metrics against real-world decision utility;
    how to design ecologically valid yet reproducible benchmarks that span diverse
    action spaces and deployment settings.'
  related_work_outline_zh:
  - 主流方向：世界模型评估从像素级重建转向多维语义一致性探测，包括空间一致性、记忆、物理合理性和动作可控性。
  - 研究共性：构建或利用基准来揭示世界模型在鲁棒性、泛化性和长时域一致性方面的缺陷，这些缺陷是总分无法捕捉的。
  - 关键差异：领域选择上，封闭游戏环境（Atari、Minecraft）与开放域驾驶/机器人数据存在分歧；评估模式上，开环视频预测与闭环智能体交互各行其道。
  - 趋势演进：从2023–2024年以Atari 100k为核心的标准性能竞争，演进到2025–2026年面向具身和开放域视频的复杂基准，强调长时一致性和物理遵循。
  - 开放问题：如何将代理指标与真实世界决策效用对齐；如何设计既具生态效度又可复现的基准，覆盖多样动作空间和部署场景。
  literature_review:
    line_of_work_matrix:
    - line: Specialized benchmark task and dataset construction
      what_it_solves: Creating shared tasks and datasets that make specific world-model
        capabilities—such as spatial consistency, memory, and action control—comparable
        across models.
      what_remains_open: Limited coverage of real-world environment diversity; cross-validation
        between benchmark metrics and downstream decision success remains unverified;
        most datasets are confined to single simulators or narrow domains.
    - line: Multi-dimensional metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and physical
        plausibility beyond aggregate pixel-level scores through metrics like scene-graph
        consistency, memory consistency, and action controllability.
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        task performance (e.g., navigation success, policy reward) is not rigorously
        established; sensitivity to different design choices in metric computation
        is underexplored.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Enabling auditable and fair comparisons by standardizing datasets,
        baselines, and evaluation protocols; several works adopt existing benchmarks
        (Atari 100k, Nuscenes) to report results.
      what_remains_open: No unified reporting protocol exists across domains; benchmark
        conclusions can be unstable across implementations and compute budgets; many
        methods are evaluated on disjoint benchmarks, preventing direct comparison.
    consensus:
    - Pixel-level reconstruction error is insufficient for capturing world-model quality;
      evaluation must include spatial consistency, memory, physical plausibility,
      and action controllability.
    - Benchmarks should provide closed-loop or reproducible evaluation frameworks
      to expose long-horizon failures that are invisible in short-term open-loop metrics.
    - Incorporating physical knowledge, context, or visual details into world models
      helps, and benchmarks must be designed to quantify these improvements explicitly.
    disagreements:
    - 'Domain choice: some benchmarks operate in closed game environments (Atari,
      Minecraft), while others target open-domain driving or robotic manipulation,
      leading to different evaluation assumptions and transferability.'
    - 'Evaluation metric philosophy: task-oriented metrics (human-normalized score,
      policy return) versus generation-oriented metrics (FID, pixel accuracy) reflect
      divergent views on what a world model should optimize.'
    - 'Interaction mode: open-loop video prediction benchmarks assess reconstruction
      quality, whereas closed-loop agent-in-the-loop benchmarks measure decision utility;
      the two modes are not easily reconciled.'
    open_questions:
    - How can we construct a benchmark that is both ecologically valid (reflecting
      real-world deployment) and reproducible across institutions with limited compute
      budgets?
    - What is the empirical relationship between proxy metrics (e.g., scene-graph
      consistency) and downstream task success in robotic control or autonomous driving?
    - Can a unified evaluation protocol be designed that accommodates both discrete-action
      game environments and continuous-action embodied settings without losing discriminative
      power?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 专门化基准任务与数据集构建
      解决的问题: 构建共享任务和数据集，使世界模型的具体能力（如空间一致性、记忆、动作控制）可跨模型比较。
      尚未覆盖: 对真实世界环境多样性的覆盖有限；基准指标与下游决策成功之间的交叉验证尚未进行；大多数数据集局限于单一模拟器或狭窄领域。
    - 路线: 多维度指标与压力测试设计
      解决的问题: 通过场景图一致性、记忆一致性和动作可控性等指标，超越聚合像素分数，探测预测、可控性、鲁棒性和物理合理性。
      尚未覆盖: 这些代理指标与实际下游任务表现（如导航成功率、策略奖励）的对齐关系未经严格验证；指标计算中不同设计选择的敏感性未被充分探索。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准化数据集、基线和评估协议，实现可审计和公平的比较；部分工作采用现有基准（Atari 100k、Nuscenes）报告结果。
      尚未覆盖: 跨领域缺乏统一的报告协议；基准结论在不同实现和算力预算下可能不稳定；许多方法在互不相交的基准上评估，无法直接比较。
    共识:
    - 像素级重建误差不足以捕捉世界模型质量；评估必须包含空间一致性、记忆、物理合理性和动作可控性。
    - 基准应提供闭环或可复现的评估框架，以暴露在短期开环指标中不可见的长时域缺陷。
    - 将物理知识、上下文或视觉细节融入世界模型是有益的，基准必须被设计来显式地量化这些改进。
    分歧:
    - 领域选择：部分基准运作于封闭游戏环境（Atari、Minecraft），而其他基准针对开放域驾驶或机器人操作，导致不同的评估假设和可迁移性。
    - 评估指标理念：面向任务的指标（人类归一化得分、策略回报）与面向生成的指标（FID、像素精度）反映了对世界模型应优化什么的不同观点。
    - 交互模式：开环视频预测基准评估重建质量，而闭环智能体交互基准测量决策效用；两种模式不易调和。
    开放问题:
