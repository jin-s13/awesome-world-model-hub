  - 'Mainstream direction: The evidence formalizes video generation as world models
    around state construction and dynamics modeling, while empirical work tests these
    ideas through action-conditioned future prediction for embodied decisions.'
  - 'Shared research pattern: Papers couple actions and observations via joint training,
    adapter layers, or reward/verifier post-training to make generated rollouts more
    controllable, physically plausible, and useful for planning or evaluation.'
  - 'Key differences: Work differs in training strategy, supervision signal, evaluation
    target, and interaction setting: unified action-video training, adapting frozen
    generators, or preference/verifier alignment; targets range from visual quality
    and action alignment to physical plausibility and reasoning gains.'
  - 'Trend evolution: Available top evidence clusters in 2024-2026; the frontier is
    moving from frame-level action conditioning and visual fidelity toward physical
    alignment, test-time verifiers, and conceptual taxonomies that demand state/dynamics
    and causal evaluation.'
  - 'Open questions: Evidence gaps remain on explicit state and causal dynamics, calibrated
    test-time rewards, long-horizon persistence, cross-domain transfer, and whether
    formal taxonomies change model design or evaluation.'
  related_work_outline_zh:
  - 主流方向：证据将视频生成形式化为围绕状态构建与动态建模的世界模型，同时实证工作通过动作条件化未来预测检验这些思想，以支持具身决策。
  - 研究共性：研究通过联合训练、适配器或奖励/验证器后训练耦合动作与观测，使生成轨迹更可控、更物理合理，并服务于规划或评估。
  - 关键差异：工作在训练策略、监督信号、评测目标和交互设置上不同：统一动作-视频训练、适配冻结生成器或偏好/验证器对齐；目标从视觉质量和动作对齐到物理合理性与推理增益。
  - 趋势演进：可用高证据集中于2024至2026年，前沿正从帧级动作条件化和视觉保真度走向物理对齐、测试时验证器，以及要求状态/动态与因果评测的概念分类。
  - 开放问题：显式状态与因果动态、测试时奖励校准、长时程持续性、跨领域迁移，以及形式化分类是否改变模型设计或评测，仍存在证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Formalization and conceptual boundaries of video world models
      what_it_solves: Clarifying what state and dynamics a video world model must
        represent, and why visual fidelity metrics are insufficient for predictive
        claims.
      what_remains_open: Whether the taxonomy changes evaluation or design, and whether
        formal state/dynamics assumptions match empirical model behavior.
    - line: Action-conditioned video dynamics learning for embodied prediction
      what_it_solves: Generating future observations from actions and past observations
        for policy learning, planning, and simulation.
      what_remains_open: Long-horizon physical persistence, cross-domain and cross-embodiment
        transfer, and dependence on action-labeled or domain-specific data.
    - line: Preference and verifier alignment for world-model rollouts
      what_it_solves: Aligning generated trajectories with physical realism, task
        logic, visual quality, or selected reasoning views.
      what_remains_open: Reward calibration, subjectivity and cost of human preferences,
        and inconsistent gains across evaluation settings.
    - line: Scaling and test-time verification of world-model behavior
      what_it_solves: Connecting model size, speed, or test-time computation to expected
        quality and reasoning improvements.
      what_remains_open: Direct prediction of failure and transfer; observed gains
        are evaluation-specific and not yet a general guarantee.
    consensus:
    - Action-conditioned video generation is treated as a predictive world model for
      embodied decision-making rather than only a visual synthesis task.
    - Coupling actions with observations, whether by joint training, adaptation, or
      post-training, is a shared route to controllable future rollouts.
    - Visual fidelity alone is not accepted as sufficient; evaluation increasingly
      includes action alignment, planning utility, physical plausibility, or reasoning
      value.
    - Current evidence leaves verification gaps around explicit state representation,
      causal dynamics, and long-horizon persistence.
    disagreements:
    - 'Training strategy: unified action-video training versus adapter-based adaptation
      of frozen video generators versus alignment through preferences or verifiers.'
    - 'Supervision signal: action-labeled video, human preference pairs, decoupled
      discriminators, or frame-anchored assertions.'
    - 'Evaluation target: visual quality and action-frame alignment versus planning
      improvement versus physical plausibility versus spatial reasoning accuracy under
      test-time scaling.'
    - 'Interaction and deployment setting: low-level robot action inputs, spatial
      cross-embodiment action injection, contact-rich manipulation, video game or
      real-world robotics, and spatial reasoning scenarios.'
    - 'Definition of improvement: some work reports evaluation-specific gains while
      other work finds the same verifier or model becomes an information bottleneck
      in another setting.'
    open_questions:
    - Do current video-based world models learn explicit state and dynamics, or only
      pixel-and-action correlations?
    - Can test-time verifier rewards be calibrated enough to produce consistent reasoning
      gains beyond a single evaluation setting?
    - How can physical realism and long-horizon persistence be validated without costly
      human preferences or narrow manipulation evaluations?
    - Will conceptual taxonomies of state and dynamics produce concrete changes in
      model design and functional evaluation, or remain descriptive?
    - What minimal data and assumptions are needed for cross-embodiment and cross-domain
      transfer from action-conditioned video prediction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频世界模型的形式化与概念边界
      解决的问题: 澄清视频世界模型必须表示的状态与动态，以及为何视觉保真度指标不足以支撑预测性主张。
      尚未覆盖: 该分类是否改变评测或设计，形式化状态/动态假设是否符合经验模型行为。
    - 路线: 面向具身预测的动作条件视频动态学习
      解决的问题: 根据动作与过去观测生成未来观测，用于策略学习、规划与模拟。
      尚未覆盖: 长时程物理持续性、跨领域与跨本体迁移，以及对动作标签或领域数据的依赖。
    - 路线: 世界模型轨迹的偏好与验证器对齐
      解决的问题: 使生成轨迹与物理合理性、任务逻辑、视觉质量或所选推理视角对齐。
      尚未覆盖: 奖励校准、人类偏好的主观性与成本，以及在不同评测设置下增益不一致。
    - 路线: 世界模型行为的缩放与测试时验证
      解决的问题: 连接模型规模、速度或测试时计算与预期质量和推理改进。
      尚未覆盖: 直接预测失败与迁移；已观察增益因评测设置而异，尚未形成一般保证。
    共识:
    - 动作条件化视频生成被视为具身决策的预测世界模型，而不仅是视觉合成任务。
    - 通过联合训练、适配或后训练来耦合动作与观测，是获得可控未来轨迹的共同路径。
    - 仅凭视觉保真度不够；评测越来越多包含动作对齐、规划效用、物理合理性或推理价值。
    - 现有证据在显式状态表示、因果动态和长时程持续性方面仍存在验证缺口。
    分歧:
    - 训练策略：统一动作-视频训练、适配冻结视频生成器，还是通过偏好或验证器对齐。
    - 监督信号：动作标签视频、人类偏好对、解耦判别器或帧锚定断言。
    - 评测目标：视觉质量与动作-帧对齐、规划改进、物理合理性，或测试时缩放下的空间推理精度。
    - 交互与部署设置：低级机器人动作输入、跨本体空间动作注入、接触丰富操作、视频游戏或真实机器人，以及空间推理场景。
    - 对改进的定义：一些工作报告在特定评测上提升，另一些发现同一验证器或模型在另一设置中成为信息瓶颈。
    开放问题:
    - 当前的视频世界模型是否学到显式状态与动态，还是仅学到像素与动作相关？
    - 测试时验证器奖励能否被校准到在多个评测设置上产生一致推理增益？
    - 如何在不依赖昂贵人类偏好或狭窄操作评测的情况下验证物理合理性与长时程持续性？
    - 状态与动态的概念分类能否具体改变模型设计和功能评测，还是仅停留在描述层面？
    - 从动作条件视频预测迁移到跨本体与跨领域场景所需的最小数据和假设是什么？
