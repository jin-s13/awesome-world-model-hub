  related_work_outline:
  - 'Mainstream direction: Dominant research focuses on generative world models using
    diffusion transformers and transformer-VAE hybrids for video prediction, with
    growing emphasis on compositionality, context conditioning, and physical consistency.'
  - 'Shared research pattern: Most works learn dynamics from action-conditioned video
    data via self-supervised objectives, then evaluate on downstream tasks like policy
    learning, zero-shot generalization, or consistency benchmarks.'
  - 'Key differences: Architectures diverge between diffusion with mask reconstruction,
    stochastic VAEs, and unified video-action diffusion; context integration ranges
    from explicit observable variables to language-derived primitives; evaluation
    domains span driving, Atari, robotics, and open-world scenes.'
  - 'Trend evolution: From 2023 to 2026, the field rapidly adopts diffusion and transformer-based
    architectures, increasingly couples video and action modalities, and shifts from
    purely visual quality metrics to specialized benchmarks for spatial and memory
    consistency.'
  - 'Open questions: Achieving long-term memory consistency and physical plausibility
    in open-world generation, establishing unbiased evaluation metrics, understanding
    failure modes of compositional generalization, and disentangling model contributions
    from policy optimization.'
  related_work_outline_zh:
  - 主流方向：以扩散变换器和Transformer-VAE混合架构为核心，重点研究具备组合性、上下文条件和物理一致性的视频生成世界模型。
  - 研究共性：多数工作通过自监督目标从动作条件视频中学习动力学，并以下游策略学习、零样本泛化或一致性基准进行评估。
  - 关键差异：架构选择包括扩散加掩码重建、随机VAE和统一视频-动作扩散；上下文集成方式从显式可观测变量到语言解析原语有所区别；评估覆盖驾驶、Atari、机器人和开放域场景。
  - 趋势演进：2023至2026年，领域快速采用扩散和Transformer架构，视频与动作模态日益耦合，并从单纯视觉质量指标转向专门的空间和记忆一致性基准。
  - 开放问题：实现开放世界生成中的长期记忆一致性和物理合理性，建立无偏评估指标，理解组合泛化的失败边界，以及分离模型与策略优化的贡献。
  literature_review:
    line_of_work_matrix:
    - line: Representation and training objective design
      what_it_solves: Turns world-model concepts into concrete architectures and training
        recipes for video generation, using diffusion transformers, mask reconstruction,
        stochastic VAEs, and physics-informed tasks.
      what_remains_open: Generalizing beyond domain-specific designs and ensuring
        long-term spatial-temporal consistency and physical plausibility across diverse,
        open-world scenarios.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to policy learning and decision-making,
        enabling zero-shot generalization and compositional planning from world-model
        rollouts.
      what_remains_open: Disentangling whether gains stem from the dynamics model
        or the policy optimizer, and scaling to unseen action spaces and contexts.
    - line: Benchmarking and evaluation protocols
      what_it_solves: Quantifies world model capabilities such as spatial consistency,
        memory consistency, and action control through specialized datasets and metrics.
      what_remains_open: Whether current benchmarks cover all failure modes and how
        to ensure metrics isolate the model's abilities from dataset biases.
    consensus:
    - Recent world models increasingly adopt diffusion-based and transformer architectures
      for video generation, emphasizing compositional and context-aware designs to
      improve generalization.
    - Evaluating world models now requires metrics beyond visual fidelity, including
      spatial consistency and action controllability.
    disagreements:
    - 'Architectural divergence: some approaches use diffusion transformers with mask
      reconstruction, others use stochastic VAEs, while others unify video and action
      diffusion within a single framework.'
    - 'Context integration: some methods rely on observable context variables, while
      others derive composition from language instructions.'
    - 'Evaluation scopes: benchmarks target different aspects—spatial consistency
      in loop navigation vs. memory consistency and action control in open-domain
      videos—leading to fragmented standards.'
    open_questions:
    - How to maintain long-term memory consistency and physical plausibility in open-world
      video generation?
    - What is the minimal set of unbiased metrics for world model evaluation?
    - When do compositional world models fail to generalize to novel primitives?
    - How to disentangle the contribution of the dynamics model from the policy optimization
      in model-based RL?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 表示与训练目标设计
      解决的问题: 将世界模型概念落实为具体架构和训练配方，如扩散变换器、掩码重建、随机VAE和物理信息驱动任务。
      尚未覆盖: 跨域泛化及在多样化开放世界中保持长期时空一致性和物理合理性。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到策略学习与决策，实现零样本泛化和基于世界模型推演的组合规划。
      尚未覆盖: 收益是否来自动力学模型还是策略优化器，以及向未见动作空间和上下文的扩展。
    - 路线: 基准与评估协议
      解决的问题: 通过专门数据集和指标量化空间一致性、记忆一致性和动作控制等世界模型能力。
      尚未覆盖: 现有基准是否覆盖所有失效模式，以及指标能否隔离模型能力与数据集偏差。
    共识:
    - 近期世界模型越来越多地采用扩散和Transformer架构进行视频生成，强调组合性和上下文感知以提升泛化。
    - 评估世界模型需要超越视觉保真度的指标，包含空间一致性和动作可控性。
    分歧:
    - 架构分歧：部分方法使用扩散变换器加掩码重建，另一些使用随机VAE，还有的统一视频与动作扩散于单一框架。
    - 上下文集成：部分方法依赖可观测上下文变量，另一些从语言指令中提取组合原语。
    - 评估范围：基准分别关注循环导航中的空间一致性，或开放域视频中的记忆一致性和动作控制，导致标准碎片化。
    开放问题:
    - 如何在开放世界视频生成中维持长期记忆一致性和物理合理性？
    - 什么是最小无偏的世界模型评估指标集？
    - 组合世界模型何时会无法泛化到全新原语？
    - 如何分离动力学模型与策略优化在基于模型的强化学习中的贡献？
