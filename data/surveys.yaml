  related_work_outline:
  - 'Mainstream direction: Recent evidence centers on generative video world models
    based on diffusion transformers, especially for driving and robotics. Representative
    examples include MaskGWM for masked reconstruction, UWM for video-action diffusion,
    and RoboScape for physics-informed video generation; model-based RL world models
    such as STORM and contextual Dreamer remain a parallel line.'
  - 'Shared research pattern: Methods convert world-model ideas into learned video
    or latent dynamics and add structured auxiliary signals such as mask, depth, keypoint,
    physics, context, language primitives, or action diffusion to improve consistency,
    controllability, or sample efficiency. Generated trajectories or videos then support
    policy training, planning, or evaluation.'
  - 'Key differences: The lines differ in architecture and objective: recurrent/Transformer-VAE
    latent dynamics, diffusion transformer generation, compositional primitive generators,
    or unified video-action diffusion. They also differ in supervision and evaluation
    targets: Atari 100k, CARL contextual tasks, driving multi-dataset rollout, robot
    video/simulation, and Minecraft loop or revisited benchmarks.'
  - 'Trend evolution: Available top evidence spans 2023 to 2026. It moves from Transformer-VAE
    and contextual Dreamer model-based RL toward diffusion-based driving and robotic
    world models, with 2025 to 2026 adding closed-loop or revisited benchmarks for
    spatial, memory, and action-control consistency. This trend is mainly within the
    current frontier.'
  - 'Open questions: How well do gains transfer beyond seen datasets, primitives,
    contexts, and action spaces? Which part of an improvement comes from the world
    model versus the planner, auxiliary objective, or surrounding system choices?
    Can consistency metrics predict downstream policy quality, and what missing limitations
    or negative ablations should be reported?'
  related_work_outline_zh:
  - 主流方向：近期证据集中在基于扩散Transformer的生成式视频世界模型，尤其面向驾驶与机器人。代表工作包括MaskGWM的掩码重建、UWM的视频-动作扩散、RoboScape的物理信息视频生成；STORM和上下文Dreamer等基于模型的强化学习仍是并行方向。
  - 研究共性：方法将世界模型落实为学习到的视频或潜在动力学，并加入结构化辅助信号——掩码、深度、关键点、物理、上下文、语言原语或动作扩散——以改善一致性、可控性或样本效率；生成轨迹随后支持策略训练、规划或评测。
  - 关键差异：架构与目标不同：循环/Transformer-VAE潜在动力学、扩散Transformer生成、组合式原语生成器或统一视频-动作扩散。监督与评测目标也不同：Atari
    100k、CARL上下文任务、驾驶多数据集展开、机器人视频/仿真和Minecraft循环/重访基准。
  - 趋势演进：可用高证据论文跨2023至2026年，从Transformer-VAE和上下文Dreamer的模型强化学习，转向面向驾驶/机器人的扩散世界模型，2025至2026年更增加空间、记忆和动作控制一致性的闭环/重访基准。趋势主要集中在当前前沿。
  - 开放问题：增益能否迁移到已见数据集、原语、上下文和动作空间之外？提升多少来自世界模型本身、规划器、辅助目标或系统选择？一致性指标能否预测下游策略质量，缺哪些限制和阴性消融验证？
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model representation and auxiliary objective design
      what_it_solves: Turns world-model ideas into concrete video or latent generative
        architectures and training objectives, including diffusion with mask reconstruction,
        physics-informed depth/keypoint tasks, and action-coupled generation.
      what_remains_open: Whether auxiliary objectives transfer beyond reported datasets
        and whether their individual contribution is isolated from the base generative
        model.
    - line: Action-conditioned dynamics, planning, and policy interfaces
      what_it_solves: Connects learned dynamics to intervention, action prediction,
        language-conditioned robot imagination, contextual zero-shot generalization,
        and policy learning from imagined trajectories.
      what_remains_open: How much gain comes from the model versus the planner, controller,
        language parser, or task prior; evidence is often limited to simulation or
        narrow task families.
    - line: Benchmark-driven evidence and ablation protocols
      what_it_solves: Measures spatial consistency, memory consistency, and action
        control via datasets and metrics such as scene-graph consistency or closed-loop
        revisited evaluation.
      what_remains_open: Some benchmark papers report construction but limited baseline
        results; the link between these consistency metrics and downstream policy
        quality or real execution remains under-evidenced.
    consensus:
    - World models are increasingly formulated as generative models over video or
      latent states, with auxiliary objectives added to improve consistency, realism,
      or controllability.
    - Structured conditioning signals such as context values, language primitives,
      actions, depth, keypoints, or physics-informed tasks are widely used to improve
      generalization.
    - Model-based reinforcement learning and robot policy training are common downstream
      uses of imagined or generated trajectories.
    - Evaluation is shifting from visual quality or single-task reward toward explicit
      consistency and action-control measurement.
    disagreements:
    - 'Representation differs: recurrent state-space or Transformer-VAE latent dynamics
      versus diffusion transformer generation versus compositional primitive generators
      versus unified video-action diffusion.'
    - 'Supervision targets differ: self-supervised visual prediction, context-conditioned
      reinforcement learning, language-primitive decomposition, physics-informed depth/keypoint
      tasks, or action diffusion.'
    - 'Evaluation settings differ: Atari 100k, CARL contextual tasks, multi-dataset
      driving rollout, robot video datasets with simulation, and Minecraft loop or
      revisited benchmarks.'
    - Some methods assume observable context or predefined language primitives, while
      others aim at open-domain action-free video or cross-action-space generalization.
    open_questions:
    - Does the reported generalization to unseen contexts, goals, action spaces, or
      viewpoints hold outside the observed task families and datasets?
    - How much of each improvement is attributable to the learned world model rather
      than auxiliary tasks, planners, action coupling, or benchmark-specific tuning?
    - Can spatial, memory, and physical plausibility metrics be standardized to predict
      downstream policy quality or real-robot execution?
    - Which limitations and negative ablations are missing from papers with blank
      limitation fields or no reported baseline results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型表示与辅助目标设计
      解决的问题: 将世界模型思想落实为具体的视频或潜在生成架构与训练目标，包括带掩码重建的扩散、物理信息的深度/关键点任务以及动作耦合生成。
      尚未覆盖: 辅助目标能否迁移到报告数据集之外，以及其独立贡献是否与基础生成模型分离。
    - 路线: 动作条件动力学、规划与策略接口
      解决的问题: 将学习到的动力学连接到干预、动作预测、语言条件机器人想象、上下文零样本泛化以及基于想象轨迹的策略学习。
      尚未覆盖: 收益有多少来自模型本身而不是规划器、控制器、语言解析器或任务先验；证据常限于仿真或较窄任务族。
    - 路线: 基准驱动的证据与消融协议
      解决的问题: 通过场景图一致性分数或闭环重访评测等方式，衡量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 部分基准论文主要给出构建而基线结果有限；这些一致性指标与下游策略质量或真实执行的联系仍缺证据。
    共识:
    - 世界模型越来越多被表述为视频或潜在状态的生成模型，并加入辅助目标以改善一致性、真实感或可控性。
    - 结构化条件信号如上下文值、语言原语、动作、深度、关键点或物理信息任务被广泛用于提升泛化。
    - 基于模型的强化学习和机器人策略训练是想象轨迹或生成视频的主要下游用途。
    - 评测正从视觉质量或单任务奖励转向显式的一致性和动作控制测量。
    分歧:
    - 表示方式不同：循环状态空间或Transformer-VAE潜在动力学、扩散Transformer生成、组合式原语生成器与统一视频-动作扩散并存。
    - 监督目标不同：自监督视觉预测、上下文条件强化学习、语言原语分解、物理深度/关键点任务或动作扩散。
    - 评测场景不同：Atari 100k、CARL上下文任务、驾驶多数据集展开、机器人视频数据集结合仿真、Minecraft循环或重访基准。
    - 部分方法依赖可观测上下文或预定义语言原语，另一些面向开放域无动作视频或跨动作空间泛化。
    开放问题:
    - 已报告的未见上下文、目标、动作空间或视角泛化，能否在已观察任务族和数据集之外保持？
    - 每项提升中，有多少可归因于学习到的世界模型本身，而不是辅助任务、规划器、动作耦合或基准特调？
    - 空间一致性、记忆一致性和物理合理性指标能否标准化，以预测下游策略质量或真实机器人执行？
    - 那些限制字段为空或未报告基线结果的论文，缺失了哪些限制和阴性消融验证？
