  related_work_outline_zh:
  - 主流方向：驾驶与具身机器人应用在近期证据中占主导，采用扩散式视频生成、物理信息训练和统一视频-动作模型作为生成式世界模拟器，同时出现面向交互场景的记忆与动作一致性基准。
  - 研究共性：将世界模型视为以动作或上下文为条件的生成式预测器，在领域特定视觉序列上训练，并以生成保真度和任务效用结合的方式进行评测，越来越多加入物理或结构约束。
  - 关键差异：表示方式包括扩散Transformer、随机状态空间模型、统一视频-动作扩散；监督信号涵盖物理信息辅助任务、语言原语分解和上下文条件；评测目标在驾驶、机器人、游戏和基准指标间分化。
  - 趋势演进：现有高证据集中在2023-2026前沿，从高效模型化强化学习走向上下文/组合式具身模型，再走向面向驾驶和机器人的扩散式预训练，并在2025-2026加入闭环记忆与动作基准。
  - 开放问题：仿真收益能否迁移到真实安全与策略结果，模型如何跨未见动作空间或原语泛化，如何联合衡量长期记忆与物理合理性，以及在工件不完整时基准提升能否预测部署成功。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to concrete task domains with domain-specific
        states, actions, and constraints while supporting policy learning or video
        planning.
      what_remains_open: Whether improvements transfer across embodiments, datasets,
        institutions, or physical environments; assumptions such as observable context
        and seen primitive combinations remain boundary conditions.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for driving scene prediction, long-horizon
        rollout, multi-view generation, and simulation-based evaluation of driving
        policies.
      what_remains_open: Alignment between simulator gains and real-world safety or
        operational outcomes; cross-dataset zero-shot reliability is only partially
        evidenced and limitation reporting is sparse.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments where agents
        must act over time, including model-based reinforcement learning and action-conditioned
        visual generation.
      what_remains_open: Generalization when environment rules, goals, user interactions,
        or action spaces change; long-term memory consistency and efficient training
        remain unresolved.
    - line: Benchmarking and evaluation for interactive world models
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control in open-domain or game-like settings rather than only short-horizon
        visual quality.
      what_remains_open: Benchmark metrics are not yet tied to real task outcomes;
        scene and action diversity is limited, and some dataset-oriented evidence
        lacks full experimental validation.
    consensus:
    - Domain applications increasingly treat world models as action- or context-conditioned
      generative simulators for state and video prediction, not passive predictors.
    - Diffusion-based video or sequence generation and transformer or state-space
      sequence modeling are common substrates for scalable world models in driving
      and robotics.
    - Evaluation is moving beyond short-horizon visual quality toward closed-loop
      control, spatial or memory consistency, physical plausibility, and downstream
      policy utility.
    disagreements:
    - 'Representation differs: some lines use diffusion transformers for video generation,
      others use stochastic recurrent state-space models or unified video-and-action
      diffusion.'
    - 'Supervision differs: some approaches add physics-informed auxiliary tasks such
      as depth prediction and keypoint dynamics, while others rely on context conditioning
      or language primitive decomposition.'
    - 'Evaluation target differs: driving scene prediction and zero-shot dataset transfer
      contrast with robot policy learning, video planning, and game-like interactive
      benchmarking.'
    - 'Interaction mode differs: open-loop video prediction and closed-loop action-conditioned
      rollout or policy evaluation create different generalization and deployment
      requirements.'
    open_questions:
    - Do driving simulation improvements transfer to real-world safety or operational
      outcomes, and what evidence would connect simulation metrics to deployed policy
      performance?
    - Can world models generalize to unseen primitive combinations, unobservable context
      values, or action spaces beyond those seen in training?
    - How should long-term memory consistency, physical plausibility, and downstream
      policy utility be jointly measured in open-domain interactive settings?
    - When code, datasets, baselines, metrics, or limitations are incompletely reported,
      can benchmark gains be trusted as evidence of real robot or driving capability?
