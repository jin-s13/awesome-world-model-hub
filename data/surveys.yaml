  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by action-conditioned video world
    models for robotic manipulation and decision-making, using diffusion or masked
    autoregressive generation rather than standalone formal theory.'
  - 'Shared research pattern: Most papers couple action inputs with future video generation,
    then evaluate generated rollouts for dynamics quality, planning, or downstream
    policy utility instead of only visual fidelity.'
  - 'Key differences: They differ in generation backbone (unified diffusion, masked
    autoregression, adapted pretrained video diffusion), alignment objective (reward
    model, preference/DPO, verifier-based test-time feedback), and whether evaluation
    targets physical plausibility, trajectory consistency, or reasoning benchmarks.'
  - 'Trend evolution: Within the observed 2024-2026 frontier, work moves from flexible
    action-video pretraining to fine-grained alignment and physics-aware post-training,
    then to benchmark and verifier critiques; older year markers lack supporting paper
    evidence here.'
  - 'Open questions: Does action-conditioned video generation imply an actual dynamics
    model, and what formal assumptions or functional benchmarks would verify persistence,
    causality, and transfer beyond contact-rich manipulation?'
  related_work_outline_zh:
  - 主流方向：证据集中在面向机器人操作与决策的动作条件视频世界模型，使用扩散或掩码自回归生成，而非独立形式理论。
  - 研究共性：多数工作将动作输入与未来视频生成耦合，并以动态质量、规划或下游策略效用评估生成轨迹，而不只看视觉保真度。
  - 关键差异：生成骨干不同（统一扩散、掩码自回归、适配预训练视频扩散），对齐目标不同（奖励模型、偏好/DPO、验证器测试时反馈），评测目标不同（物理合理性、轨迹一致性、推理基准）。
  - 趋势演进：在现有2024-2026前沿证据内，从灵活动作-视频预训练转向细粒度对齐与物理感知后训练，再转向基准与验证器批评；较早年份标记缺少文献证据。
  - 开放问题：动作条件视频生成是否构成真实动力学模型，以及哪些形式假设或功能基准能验证持久性、因果性和超出接触丰富操作的迁移。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video diffusion pretraining
      what_it_solves: Jointly represents policy and dynamics by coupling action and
        video diffusion in a shared model pretrained on large robot datasets
      what_remains_open: Whether the unified timestep control scales beyond observed
        robot tasks and whether action-free video learning is rigorously ablated
    - line: Fine-grained action-conditioned video generation
      what_it_solves: Improves action-frame alignment and enables model-based planning
        or simulation from observations and action trajectories
      what_remains_open: Robustness across diverse embodiments and long-horizon tasks
        is not fully evidenced; simulator correlation metrics are narrow
    - line: Adapting pretrained video diffusion models
      what_it_solves: Leverages pretrained video priors for action-conditioned generation
        without accessing model parameters
      what_remains_open: Requires small action-labelled videos; closed model biases
        and transfer to other sequential decision tasks remain unshown
    - line: Physics/preference-aligned post-training
      what_it_solves: Improves physical fidelity, logical coherence, embodiment plausibility,
        and visual quality of generated rollouts
      what_remains_open: Evaluated mainly on contact-rich manipulation; human preference
        subjectivity and data collection cost limit scalability
    - line: Test-time verification and functional benchmarking
      what_it_solves: Checks whether world-model trajectories improve spatial reasoning
        and whether benchmarks separate physical realism from action alignment
      what_remains_open: Verifier calibration is poor and gains are benchmark-specific;
        current models appear to be information bottlenecks
    - line: Conceptual taxonomy of world models
      what_it_solves: Organizes state construction and dynamics modeling to bridge
        video generation and classical world-model theory
      what_remains_open: No experiments show that the taxonomy changes evaluation
        or design; persistence and causality remain unresolved frontiers
    consensus:
    - Action-conditioned video generation is treated as a useful proxy for world-model
      dynamics in embodied decision-making.
    - Visual fidelity alone is insufficient; researchers increasingly evaluate planning,
      physical plausibility, trajectory consistency, or downstream policy utility.
    - Pretraining on large robot datasets or adapting large video priors is expected
      to improve generalization compared with narrow imitation or domain-specific
      training.
    - World models need more explicit state or dynamics reasoning, not only frame
      prediction.
    disagreements:
    - 'Representation choice: unified diffusion across video and action versus masked
      autoregression versus frozen pretrained video diffusion with learned adaptation.'
    - 'Supervision signal: preference/reward-based post-training versus DPO-style
      decoupled discriminators versus heuristic test-time verifiers.'
    - 'Evaluation target: physical plausibility and trajectory consistency versus
      planning utility versus spatial reasoning benchmarks.'
    - 'Deployment setting: closed-source video priors adapted without parameters versus
      fully trainable robot video simulators versus test-time verification only.'
    open_questions:
    - What formal conditions ensure action-conditioned video generation corresponds
      to a true dynamics model rather than visually plausible simulation?
    - Can current verifiers and functional benchmarks reliably distinguish world models
      when gains are inconsistent across benchmarks?
    - Do physics-aware post-training methods transfer beyond contact-rich manipulation
      and human preference datasets?
    - How much of the reported improvement depends on unavailable artifacts or unreported
      limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频扩散预训练
      解决的问题: 通过耦合动作与视频扩散，在大规模机器人数据集上联合表示策略与动力学
      尚未覆盖: 统一时间步控制能否扩展到已观察机器人任务之外，以及对无动作视频学习是否缺少严格消融
    - 路线: 细粒度动作条件视频生成
      解决的问题: 改善动作-帧对齐，并支持基于观测和动作轨迹的模型规划或模拟
      尚未覆盖: 跨本体和长视程任务的稳健性证据不足；模拟器相关性指标较窄
    - 路线: 适配预训练视频扩散模型
      解决的问题: 在不访问模型参数的情况下，利用预训练视频先验进行动作条件生成
      尚未覆盖: 需要小型动作标签视频；闭源模型偏差和向其他顺序决策任务的迁移未展示
    - 路线: 物理/偏好对齐后训练
      解决的问题: 提升生成轨迹的物理保真度、逻辑一致性、具身合理性和视觉质量
      尚未覆盖: 主要在接触丰富操作上评估；人类偏好主观性和数据收集成本限制可扩展性
    - 路线: 测试时验证与功能性基准
      解决的问题: 检验世界模型轨迹是否改善空间推理，以及基准是否区分物理真实性与动作对齐
      尚未覆盖: 验证器校准较差且增益因基准而异；当前模型似乎形成信息瓶颈
    - 路线: 世界模型概念分类
      解决的问题: 通过组织状态构建与动态建模，连接视频生成和经典世界模型理论
      尚未覆盖: 尚无实验表明该分类会改变评估或设计；持久性与因果性仍是未解决前沿
    共识:
    - 动作条件视频生成被视为具身决策中世界模型动态的有效代理。
    - 仅看视觉保真度被认为不够，研究者越来越多评估规划、物理合理性、轨迹一致性或下游策略效用。
    - 在大规模机器人数据上预训练或适配大型视频先验，被认为比窄域模仿学习或领域特定训练更能泛化。
    - 世界模型需要更明确的状态或动态推理，而不只是逐帧预测。
    分歧:
    - 表示方式：视频与动作统一扩散、掩码自回归、或冻结预训练视频扩散加学习适配。
    - 监督信号：偏好/奖励后训练、DPO式解耦判别器、或启发式测试时验证器。
    - 评测目标：物理合理性与轨迹一致性、规划效用、或空间推理基准。
    - 部署场景：无需参数的闭源视频先验适配、完全可训练的机器人视频模拟器、或仅测试时验证。
    开放问题:
    - 哪些形式条件能保证动作条件视频生成对应真实动力学模型，而不只是视觉上合理的模拟？
    - 当验证器和功能基准在不同基准上的增益不一致时，如何可靠地区分世界模型？
