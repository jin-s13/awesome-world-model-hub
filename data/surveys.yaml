  related_work_outline:
  - 'Mainstream direction: World models are being adapted to specific application
    domains—robotics, autonomous driving, and interactive games—by leveraging video
    generation, diffusion architectures, and latent dynamics to support policy learning,
    simulation, and long-horizon prediction.'
  - 'Shared research pattern: Most works formulate world models as generative predictors
    of future states (videos or latent representations) conditioned on actions or
    language, and use them to train policies via imagined rollouts or data augmentation,
    while increasingly emphasizing memory consistency and spatial coherence.'
  - 'Key differences: Architectures range from diffusion transformers and coupled
    video-action diffusion to recurrent state-space models; supervision signals include
    action labels, language instructions, and action-free videos; physical plausibility
    is enforced either implicitly through data scale or explicitly via auxiliary tasks;
    evaluation targets span zero-shot contextual generalization, compositional generalization,
    multi-view consistency, and memory consistency.'
  - 'Trend evolution: Starting from game benchmarks (Atari 100k), the field is moving
    toward more complex embodied and driving scenarios, with a recent surge in diffusion-based
    models and large-scale pretraining on robotic datasets. The emergence of specialized
    benchmarks for memory and spatial consistency (2025–2026) signals a shift toward
    rigorous evaluation of world model internals beyond task-level metrics.'
  - 'Open questions: How to guarantee safety and physical fidelity when deploying
    world models in real-world driving and robotics; whether existing consistency
    benchmarks fully capture real-world dynamics; how to achieve zero-shot generalization
    without fully observable context variables; and how to scale compositional generalization
    to entirely novel primitives.'
  related_work_outline_zh:
  - 主流方向：世界模型正被适配到机器人、自动驾驶和交互式游戏等具体应用领域，通过视频生成、扩散架构和潜在动力学来支持策略学习、仿真和长时域预测。
  - 研究共性：多数工作将世界模型构建为以动作或语言为条件的未来状态生成器（视频或潜在表示），并利用想象推演或数据增强训练策略，同时越来越强调记忆一致性和空间连贯性。
  - 关键差异：架构选择包括扩散Transformer、视频-动作耦合扩散和循环状态空间模型；监督信号包括动作标签、语言指令和无动作视频；物理合理性或通过数据规模隐式实现，或通过辅助任务显式注入；评测目标涵盖零样本上下文泛化、组合泛化、多视角一致性和记忆一致性。
  - 趋势演进：从游戏基准（Atari 100k）起步，正在向更复杂的具身和驾驶场景发展，近期扩散模型和大规模机器人数据集预训练激增。2025–2026 年出现的记忆和空间一致性专用基准标志着从任务指标转向对世界模型内部性质的严格评估。
  - 开放问题：如何确保世界模型在真实驾驶和机器人部署中的安全性和物理保真度；现有一致性基准是否充分捕捉真实世界动态；如何在没有完全可观测上下文变量的情况下实现零样本泛化；如何将组合泛化扩展到全新原语。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to concrete task domains (e.g., robot
        manipulation, contextual RL) with domain-specific states, actions, and constraints,
        enabling video-based planning, policy learning, and zero-shot generalization
        to unseen dynamics.
      what_remains_open: Whether improvements transfer across embodiments, datasets,
        institutions, or physical environments; real-robot validation beyond simulation;
        reliance on observable context variables limits applicability in partially
        observable settings.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for scene prediction, closed-loop simulation,
        multi-view video generation, and long-horizon rollout in driving, aiming to
        replace or augment traditional simulators.
      what_remains_open: Alignment between simulator gains and real-world safety or
        operational outcomes; generalization to unseen driving scenarios and sensor
        configurations without access to extensive labeled multi-view data.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments (Atari, Minecraft)
        where agents must act over time, and providing benchmarks for memory consistency
        and action control to evaluate temporal stability and contextual coherence.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change; long-term memory consistency and cross-action-space transfer remain
        challenging; current benchmarks may not fully represent open-ended real-world
        interactions.
    consensus:
    - World models are treated as generative simulators that predict future observations
      from past context and actions, and are used to train policies via imagined trajectories
      or data augmentation.
    - Diffusion-based architectures and Transformers are widely adopted to handle
      high-dimensional visual inputs and long sequences, with a growing emphasis on
      scaling up model and data size.
    - Memory and spatial consistency are recognized as critical properties, leading
      to dedicated benchmarks that measure temporal stability and contextual coherence
      beyond simple visual quality.
    - Large-scale pretraining on diverse datasets (e.g., multitask robot data, web
      video) is a common strategy to improve generalization and robustness of downstream
      policies.
    disagreements:
    - 'Architectural choices diverge: some works use diffusion transformers with mask
      reconstruction, others couple video and action diffusion in a unified transformer,
      while yet others rely on recurrent state-space models with latent dynamics.'
    - 'Supervision modes differ: methods vary in their reliance on action labels,
      language instructions, or action-free videos, leading to different capabilities
      in policy learning and dynamics modeling.'
    - Physical plausibility is handled either implicitly through large-scale data
      or explicitly via auxiliary tasks like depth prediction and keypoint dynamics;
      there is no consensus on the most effective approach.
    - 'Evaluation targets are fragmented: zero-shot generalization to unseen contexts,
      compositional generalization to new object-action combinations, multi-view consistency,
      and memory consistency are each prioritized by different sub-communities, making
      cross-work comparison difficult.'
    open_questions:
    - How can world models be validated in real-world safety-critical settings such
      as autonomous driving, given the gap between simulated metrics and physical
      outcomes?
    - To what extent do current memory and spatial consistency benchmarks (e.g., loop-based
      navigation, open-domain revisited scenarios) capture the complexities of long-term
      real-world interactions?
    - Can world models achieve robust zero-shot generalization when context variables
      are not fully observable, moving beyond the simplified assumption of known context
      values?
    - How can compositional generalization be extended to entirely novel primitives,
      rather than only combinations of training-time components, in both robotic and
      interactive environments?
    - What representations and architectures are necessary to overcome the observed
      difficulties in long-term memory consistency and cross-action-space transfer?
