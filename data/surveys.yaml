  related_work_outline:
  - 'Mainstream direction: Application-specific world models for driving, robotics,
    and interactive agents dominate; recent work centers on generative video/diffusion
    transformers and model-based RL, with dedicated benchmarks for spatial, memory,
    and action-consistency properties.'
  - 'Shared research pattern: Learn predictive dynamics from visual-action sequences
    or video, then use the learned model for rollout, planning, policy learning, or
    evaluation; most evidence reports benchmark comparisons rather than deployment
    outcomes.'
  - 'Key differences: They differ in representation and supervision, including latent
    recurrent state-space models for control, diffusion/video predictors for pixels,
    physics-informed auxiliary objectives, compositional language-conditioned generation,
    and benchmark-only evaluation of memory/action control.'
  - 'Trend evolution: The visible evidence moves from sample-efficient model-based
    RL agents toward domain-specific video world models for robotics and driving,
    with benchmarks shifting from task scores to consistency, control, and generalization
    checks.'
  - 'Open questions: Cross-embodiment and cross-domain transfer, sim-to-real safety
    alignment, generalization to unseen context or primitive combinations, long-horizon
    memory consistency, and action-control across differing action spaces remain unresolved.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互智能体的领域专用世界模型为主；近期集中在生成式视频/扩散Transformer和基于模型的强化学习，并出现针对空间、记忆和动作一致性的评测。
  - 研究共性：从视觉-动作序列或视频中学习预测动力学，再用于推演、规划、策略学习或评测；现有证据多为基准对比，而非部署结果。
  - 关键差异：表示与监督不同，包括潜在循环状态空间控制模型、像素级扩散/视频预测、物理信息辅助目标、组合式语言条件生成，以及面向记忆/动作控制的评测。
  - 趋势演进：证据由样本高效的基于模型强化学习转向机器人和驾驶的领域视频世界模型；评测从任务得分转向一致性、控制和泛化检查。
  - 开放问题：跨本体/跨领域迁移、仿真到真实安全一致性、未见的上下文或原语组合泛化、长期记忆一致性，以及跨动作空间的动作控制仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving video world models
      what_it_solves: Learns to predict long-horizon and multi-view driving scenes
        for validation and rollout across datasets.
      what_remains_open: Whether improved scene prediction translates to real-world
        driving safety or operational reliability, and whether physics consistency
        holds beyond benchmark datasets.
    - line: Embodied robot world models
      what_it_solves: Generates robot manipulation videos or dynamics for policy training,
        evaluation, and planning under language or goal conditions.
      what_remains_open: Many results are simulation-based or limited to seen primitive
        combinations; transfer to real robots and entirely new skills lacks evidence.
    - line: Model-based RL world models for interactive agents and games
      what_it_solves: Learns compact latent dynamics from visual inputs to improve
        sample efficiency and zero-shot generalization in control tasks and Atari-like
        environments.
      what_remains_open: Assumptions such as observable context or narrow task suites
        limit evidence of generalization to unobserved dynamics and diverse environments.
    - line: World-model evaluation benchmarks
      what_it_solves: Provides datasets and metrics for spatial consistency, memory
        consistency, and action-control in open-ended or navigational environments.
      what_remains_open: Benchmark definitions reveal model challenges but do not
        yet establish causal links to downstream task success or real-world usefulness.
    consensus:
    - World models are built from sequential visual or visual-action data to predict
      future states or frames, then reused for control or evaluation.
    - Recent methods favor generative architectures such as diffusion transformers
      and recurrent state-space or VAE-style latent models.
    - Generalization is evaluated by held-out datasets, unseen contexts, unseen task
      or goal combinations, or benchmark consistency metrics, not primarily by real
      deployment.
    - There is growing attention to explicit benchmarking of spatial, memory, and
      action-control properties as distinct from task reward.
    disagreements:
    - 'Supervision differs: pixel-level video generation, latent-dynamics learning,
      joint video-action diffusion, and physics-informed auxiliary losses coexist.'
    - 'Target domain differs: driving scenes, robot manipulation, open-world navigation,
      and Atari-style control impose different action spaces and evaluation settings.'
    - 'Generalization target differs: zero-shot transfer to unseen dynamics or context,
      compositional combination of language primitives, long-horizon or multi-view
      prediction, and memory or action consistency across views.'
    - 'Evaluation depth differs: some report state-of-the-art benchmark gains, while
      benchmark-building papers focus on measurement frameworks and leave experimental
      model comparisons incomplete.'
    open_questions:
    - Can world models trained on one embodiment or domain transfer to other action
      spaces and physical environments without retraining?
    - Do gains in video fidelity or benchmark consistency align with safer or more
      reliable real-world robot and driving outcomes?
    - How can models maintain long-horizon memory consistency and control when viewpoints,
      actions, goals, or dynamics change?
    - What evidence is missing when context variables or language primitives are not
      observable or require parsing beyond training distributions?
    - What barriers arise in healthcare or scientific simulation applications, which
      this evidence packet does not cover?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶视频世界模型
      解决的问题: 从驾驶视频中学习长时域和多视角场景预测，用于跨数据集验证和推演。
      尚未覆盖: 场景预测提升是否转化为真实驾驶安全或运行可靠性，以及物理一致性是否在基准之外仍然成立。
    - 路线: 具身机器人世界模型
      解决的问题: 生成机器人操作视频或动力学，用于策略训练、评估和规划，并支持语言或目标条件。
      尚未覆盖: 多数证据停留在仿真或已见原语组合，真实机器人执行与全新技能的迁移缺乏验证。
    - 路线: 面向交互智能体和游戏的基于模型强化学习世界模型
      解决的问题: 从视觉输入学习紧凑潜在动力学，提升控制任务和Atari类环境中的样本效率与零样本泛化。
      尚未覆盖: 可观测上下文或狭窄任务套件等假设限制了对未知动力学和多样环境泛化的证据。
    - 路线: 世界模型评测基准
      解决的问题: 为开放或导航环境中的空间一致性、记忆一致性和动作控制提供数据集和度量。
      尚未覆盖: 基准能揭示模型挑战，但尚未建立与下游任务成功或真实价值的因果关联。
    共识:
    - 世界模型通常从视觉或视觉-动作序列中学习预测未来状态或帧，并复用于控制或评测。
    - 近期方法倾向扩散Transformer、循环状态空间或变分自编码式潜在模型。
    - 泛化评测主要依赖切分数据集、未见的上下文、未见的任务或目标组合或一致性指标，而非真实部署。
    - 空间一致性、记忆一致性和动作控制正被单独验证，区别于任务奖励。
    分歧:
    - 监督信号不同：像素级视频生成、潜在动力学学习、视频-动作联合扩散或物理信息辅助目标并存。
    - 目标领域不同：驾驶、机器人操作、开放世界导航和Atari式控制对应不同动作空间和评测设置。
    - 泛化目标不同：未见的动力学或上下文零样本迁移、语言原语的组合泛化、长时域或多视角预测，或跨视角记忆与动作一致性。
    - 评测深度不同：部分给出基准上的最优结果，部分只提出评测框架，未给出充分模型对比。
    开放问题:
    - 在一个本体或领域上训练的世界模型，能否不重训而迁移到其他动作空间和物理环境？
    - 视频保真度或基准一致性提升，能否对应更安全可靠的机器人和驾驶结果？
    - 当视角、动作、目标或动力学变化时，模型如何保持长期记忆一致性和控制能力？
    - 当上下文变量或语言原语不可观测、需要超出训练分布的解析时，缺少哪些证据？
    - 医疗健康或科学仿真应用存在哪些障碍？当前证据包未覆盖这些领域。
