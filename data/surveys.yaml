  related_work_outline:
  - 'Mainstream direction: World model evaluation is shifting from aggregate game
    scores toward specialized benchmarks that probe spatial consistency, memory, action
    controllability, and physical plausibility, using video generation as the primary
    testbed.'
  - 'Shared research pattern: Propose a curated dataset with specific perturbation
    or loop conditions, define a metric that captures temporal or spatial coherence
    beyond pixel error, and verify that current world models fail on these dimensions.'
  - 'Key differences: Benchmarks target different domains (driving, Minecraft, robotic
    manipulation) and evaluate distinct capacities—spatial consistency vs. memory-action
    coupling vs. visual fidelity—leading to incompatible metrics like SGCS, memory
    consistency scores, and human-normalized performance.'
  - 'Trend evolution: From 2020–2026, the frontier moved from using standard RL benchmarks
    (Atari 100k) toward domain-specific, high-fidelity video benchmarks with closed-loop
    and cross-view requirements, emphasizing long-term memory and physical grounding.'
  - 'Open questions: Whether proxy metrics align with real-world decision quality,
    whether benchmark conclusions are stable across compute budgets and implementations,
    and how to cover the diverse settings where world models are expected to help.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从聚合游戏得分转向专门基准，重点探测空间一致性、记忆、动作可控性和物理合理性，以视频生成为主要测试载体。
  - 研究共性：提出一个包含特定扰动或循环条件的数据集，定义超越像素误差的时空一致性指标，并验证当前世界模型在这些维度上表现不佳。
  - 关键差异：基准覆盖不同领域（驾驶、Minecraft、机器人操作），评估不同能力（空间一致性 vs 记忆-动作耦合 vs 视觉保真度），导致使用SGCS、记忆一致性分数和人类标准化得分等不兼容的指标。
  - 趋势演进：2020至2026年间，前沿从使用标准RL基准（Atari 100k）转向具有闭环和跨视角要求的特定领域高保真视频基准，强调长期记忆和物理基础。
  - 开放问题：代理指标是否与真实世界决策质量对齐，基准结论在不同算力和实现下是否稳定，以及如何覆盖世界模型预期发挥作用的多样化设置。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world models
      what_it_solves: Provides shared, domain-specific tasks and datasets that make
        world-model claims about spatial consistency, memory, and action conditioning
        comparable across methods.
      what_remains_open: The task distribution (e.g., Minecraft navigation, driving
        scenes) may not cover all real-world deployment settings, and the reliance
        on video-based interaction limits evaluation of non-visual dynamics.
    - line: Metric and stress-test design beyond aggregate scores
      what_it_solves: Probes prediction fidelity, controllability, and long-term coherence
        through metrics like Scene Graph Consistency Score (SGCS) and memory-action
        consistency, exposing failures that per-pixel or average reward metrics miss.
      what_remains_open: Alignment between these diagnostic metrics and downstream
        decision quality in robotics or autonomous driving is not established; the
        metrics often assume a fixed visual domain and may not generalize to unseen
        action spaces.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Facilitates auditability by adopting standard benchmarks (Atari
        100k, NuScenes, Waymo) and open-sourcing code, datasets, and model checkpoints,
        enabling fair comparison of world model architectures.
      what_remains_open: Conclusion stability across different compute budgets and
        implementation details is unverified; most papers report results on a single
        hardware setup, and the absence of standardized training protocols makes reproduction
        fragile.
    consensus:
    - World model evaluation must move beyond simple next-frame prediction loss and
      incorporate temporal consistency, long-term memory, and action controllability
      measurements.
    - Video generation is a de facto testbed for world models, with benchmarks relying
      on synthesized or collected video to assess model fidelity.
    - Open-source datasets and evaluation scripts are critical for reproducibility,
      and recent works (LoopNav, MIND) release full artifacts.
    - Current world models consistently fail to maintain long-term scene coherence
      and identity across occlusions or viewpoint changes, as revealed by spatial
      consistency and memory benchmarks.
    disagreements:
    - 'Domains of evaluation differ sharply: driving simulators (NuScenes, Waymo)
      vs. open-world games (Minecraft) vs. robot manipulation scenes, leading to incomparable
      task requirements.'
    - 'Metrics target different aspects of quality: spatial consistency via graph-based
      scores (SGCS) vs. frame-level memory-action consistency vs. visual fidelity
      and human-normalized performance, making cross-benchmark ranking impossible.'
    - 'Role of action controllability varies: some benchmarks (MIND) require explicit
      action-conditioned video generation, while others (LoopNav) evaluate spatial
      consistency with implicit action information, affecting the definition of a
      "world model".'
    - 'Physical grounding is treated differently: physics-informed benchmarks (RoboScape)
      demand geometric and physical plausibility, whereas others focus purely on visual
      and memory-based criteria without explicit physical constraints.'
    open_questions:
    - How can we ensure that a world model's performance on a diagnostic benchmark
      like MIND or LoopNav translates to improved decision-making in downstream tasks
      such as planning or control?
    - Are the conclusions drawn from these benchmarks stable across different hardware
      configurations and training recipes, especially when comparing compute-intensive
      diffusion-based models with more efficient recurrent architectures?
    - What evaluation protocols can cover the full spectrum of world model applications,
      from video games to physical robotics, without requiring a separate benchmark
      for each domain?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的基准任务与数据集设计
      解决的问题: 提供共享的、特定领域的数据集和任务，使关于空间一致性、记忆和动作调节的世界模型主张在不同方法间可比。
      尚未覆盖: 任务分布（如Minecraft导航、驾驶场景）可能无法覆盖所有真实世界的部署设置，且依赖视频交互限制了非视觉动态的评估。
    - 路线: 超越总分数的指标与压力测试设计
      解决的问题: 通过场景图一致性分数（SGCS）和记忆-动作一致性等指标，探测预测保真度、可控性和长期连贯性，暴露像素误差或平均奖励忽略的失败。
      尚未覆盖: 这些诊断指标与机器人或自动驾驶下游决策质量的对齐关系尚未建立；指标通常假设固定视觉域，可能无法泛化到未见过的动作空间。
    - 路线: 可比基线与报告规范
      解决的问题: 通过采用标准基准（Atari 100k、NuScenes、Waymo）并开源代码、数据集和模型，促进结果可审计性，实现世界模型架构的公平比较。
      尚未覆盖: 不同算力预算和实现细节下的结论稳定性未经验证；多数论文在单一硬件上报告结果，缺乏标准化训练协议，使复现脆弱。
    共识:
    - 世界模型评估须超越简单的下一帧预测损失，纳入时间一致性、长期记忆和动作可控性的测量。
    - 视频生成是事实上的世界模型测试平台，基准依赖合成或采集的视频来评估模型保真度。
    - 开源数据集和评估脚本对可复现性至关重要，近期工作（LoopNav、MIND）发布了完整工件。
    - 当前世界模型在面对遮挡或视角变化时，普遍无法维持长期场景一致性和身份，空间一致性和记忆基准揭示了这一点。
    分歧:
    - 评估领域差异显著：驾驶模拟器（NuScenes、Waymo）对开放世界游戏（Minecraft）对机器人操作场景，导致任务要求不可比。
    - 指标侧重不同质量方面：基于图的场景图一致性分数（SGCS）对帧级记忆-动作一致性对视觉保真度和人类标准化得分，无法进行跨基准排名。
    - 动作可控性的角色不同：部分基准（MIND）要求显式动作条件视频生成，而其他（LoopNav）用隐式动作信息评估空间一致性，影响“世界模型”的定义。
    - 物理基础的对待方式不同：物理信息驱动基准（RoboScape）要求几何和物理合理性，而其他基准仅关注视觉和记忆标准，无显式物理约束。
    开放问题:
    - 如何确保世界模型在MIND或LoopNav等诊断基准上的表现能转化为在下游任务（如规划或控制）中改进的决策质量？
