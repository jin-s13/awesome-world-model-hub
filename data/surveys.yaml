  - 'Mainstream direction: Building action-controllable world-model simulation systems,
    especially for autonomous driving and robotics, where video generation models
    are turned into closed-loop simulators with low-latency deployment and downstream
    policy use.'
  - 'Shared research pattern: Condition video or latent rollouts on control/context
    signals, improve motion and structural consistency with auxiliary losses or physics-informed
    tasks, and evaluate under action-fidelity or consistency metrics rather than only
    visual quality.'
  - 'Key differences: They differ in control interface, world representation, supervision,
    and deployment target; some use diffusion transformers, some use recurrent state-space,
    and some adapt pre-trained video generators.'
  - 'Trend evolution: Within the 2024–2026 evidence, work moves from high-fidelity
    controllable video generation toward closed-loop, physics-informed, real-time
    simulation infrastructure, with benchmarks emerging as reusable evaluation artifacts.'
  - 'Open questions: How to generalize beyond nuScenes, Minecraft, and CARL; maintain
    long-horizon consistency and physics plausibility under latency limits; unify
    action-fidelity and spatial-memory metrics; and independently reproduce these
    systems across environments.'
  related_work_outline_zh:
  - 主流方向：构建动作可控的世界模型模拟系统，尤其用于自动驾驶与机器人，将视频生成模型转化为闭环模拟器，并兼顾低延迟部署和下游策略使用。
  - 研究共性：以动作或上下文信号为条件生成视频或潜状态，引入辅助损失或物理信息提升运动与结构一致性，并采用动作保真度或一致性指标评估，而非只看视觉质量。
  - 关键差异：控制接口、世界表示、监督信号和部署目标不同；有的用扩散Transformer，有的用循环状态空间，有的在预训练生成器上插入适配模块。
  - 趋势演进：可见证据集中在2024–2026年，从前沿可控视频生成走向闭环、物理信息驱动的实时模拟基础设施，基准逐步成为可复用评测工件。
  - 开放问题：如何跨域泛化、在延迟约束下保持长时一致性、统一动作保真度与空间记忆指标，以及跨团队独立复现这些系统。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving simulation stacks (e.g., Terra ACT-Bench,
        Vista, FAR-Drive)
      what_it_solves: Turning trajectory or intention controls into future multi-view
        driving video for closed-loop simulation and action-fidelity evaluation.
      what_remains_open: Generalization beyond nuScenes, very long-horizon cross-view
        consistency, and real-time scaling beyond single-GPU settings.
    - line: Physics-informed and context-conditioned world-model training (e.g., RoboScape,
        cRSSM)
      what_it_solves: Improving physical plausibility, zero-shot policy generalization,
        or visual fidelity by adding depth/keypoint dynamics or explicit context conditioning.
      what_remains_open: Observable-context assumptions, narrow CARL task coverage,
        and whether physics-informed objectives transfer to unseen real-world embodiments.
    - line: Pre-trained video generator adaptation for interactive simulation (e.g.,
        Dynamic World Simulation)
      what_it_solves: Converting existing diffusion or autoregressive video generators
        into action-controllable world simulators with lightweight modules and motion-reinforced
        loss.
      what_remains_open: Visual detail trade-offs, module capacity in specialized
        domains, and inherited biases from the underlying pre-trained generator.
    - line: World-model evaluation benchmarks and reproducible artifacts (e.g., LoopNav,
        ACT-Bench)
      what_it_solves: Providing datasets, metrics, and open-access evaluation frameworks
        for spatial consistency and action fidelity.
      what_remains_open: Some artifacts report no experimental results or limitations
        in the visible abstract; independent cross-team reproduction and unified cross-domain
        metrics remain unverified.
    - line: Systematization of interactive video world modeling (e.g., interactive
        video world modeling survey)
      what_it_solves: Identifying technical challenges including action-conditioned
        controllability, long-horizon memory, and real-time action-following, and
        mapping benchmarks across application domains.
      what_remains_open: Survey-level synthesis does not provide new experimental
        validation, and rapid field changes may leave recent system evidence uncovered.
    consensus:
    - 'Controllability, not just visual generation quality, is the central requirement:
      systems are judged by how well they follow action, trajectory, or context conditions.'
    - Evaluation is shifting toward action fidelity, spatial consistency, and physical
      plausibility, with downstream policy training or evaluation used as a validation
      signal.
    - There is a shared move toward open evaluation artifacts and simulation stacks
      that combine datasets, baselines, metrics, and code, although artifact completeness
      varies.
    - Long-horizon rollouts and closed-loop deployment are recognized as core challenges;
      several works target sub-second or real-time constraints.
    disagreements:
    - 'Control interfaces differ: low-level trajectories or actions, high-level intentions,
      context values, and frame-level autoregressive conditions are used across systems.'
    - 'World representations differ: recurrent state-space models, multi-view diffusion
      transformers, and pre-trained video generator adapters create different trade-offs
      between fidelity and controllability.'
    - 'Evaluation targets differ by environment: spatial consistency in Minecraft,
      action fidelity in driving, and visual/physical plausibility in robotic video
      synthesis, without a shared cross-domain metric.'
    - 'Deployment settings differ: some works optimize offline benchmark fidelity,
      while others emphasize closed-loop simulation or sub-second single-GPU serving.'
    - Supervision varies from physics-informed cues such as depth and keypoints to
      motion-reinforced losses and explicit context conditioning, changing what system
      aspects are measured and improved.
    open_questions:
    - What evidence would show these simulators generalize beyond nuScenes, CARL,
      Minecraft, and current robotic scenarios to new sensors, embodiments, and physical
      contexts?
    - Can action fidelity and spatial-memory metrics be unified across driving, game,
      and robotics domains without being tied to one benchmark's scene graph or trajectory
      format?
    - How do long-horizon temporal consistency, cross-view geometry, and sub-second
      latency interact as scale increases beyond a single GPU?
    - Which missing limitation details and absent experimental results require independent
      reproduction before accepting benchmark-style claims?
    - Does observable context or physics-informed training remain valid in real deployments
      where context and physical parameters are partially hidden or unknown?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控驾驶模拟栈（如 Terra ACT-Bench、Vista、FAR-Drive）
      解决的问题: 将轨迹或意图控制转化为未来多视角驾驶视频，用于闭环模拟和动作保真度评测。
      尚未覆盖: nuScenes 之外的泛化、极长时域跨视图一致性，以及单GPU之外的实时扩展。
    - 路线: 物理信息与上下文条件世界模型训练（如 RoboScape、cRSSM）
      解决的问题: 通过深度/关键点动力学或显式上下文条件，提升物理合理性、零样本策略迁移或视觉保真度。
      尚未覆盖: 可观测上下文假设、CARL任务覆盖较窄，以及物理信息目标是否能迁移到未见真实本体。
    - 路线: 预训练视频生成器适配的交互模拟（如 Dynamic World Simulation）
      解决的问题: 用轻量模块和运动增强损失把现有扩散或自回归视频生成器转化为动作可控世界模拟器。
      尚未覆盖: 细粒度视觉细节损失、模块在专业领域的容量限制，以及继承自预训练生成器的偏差。
    - 路线: 世界模型评测基准与可复现工件（如 LoopNav、ACT-Bench）
      解决的问题: 提供数据集、指标和开放评估框架，用于空间一致性和动作保真度评测。
      尚未覆盖: 部分工件在可见摘要中未报告实验结果或局限；跨团队独立复现和统一跨域指标仍未验证。
    - 路线: 交互式视频世界建模系统化综述（如交互式视频世界建模调查）
      解决的问题: 识别动作条件可控性、长时记忆和实时动作跟随等挑战，并比较不同应用领域基准。
      尚未覆盖: 综述不提供新实验验证；领域发展快，可能遗漏近期系统证据。
    共识:
    - 可控性是核心要求，系统被评估为是否遵循动作、轨迹或上下文条件，而不只是视觉生成质量。
    - 评测正在转向动作保真度、空间一致性和物理合理性，并用下游策略训练或评估作为验证信号。
    - 开放评测工件和模拟栈正在形成共同方向，组合数据集、基线、指标和代码，但工件完整程度不一。
    - 长时推演和闭环部署被视为核心挑战，多个工作明确关注亚秒级或实时约束。
    分歧:
    - 控制接口不同：低层轨迹或动作、高层意图、上下文值和帧级自回归条件在不同系统中分别被采用。
    - 世界表示不同：循环状态空间、多视图扩散Transformer和预训练视频生成器适配模块各有不同的保真度与可控性权衡。
    - 评测目标按环境不同：Minecraft中强调空间一致性，驾驶中强调动作保真，机器人视频合成强调视觉与物理合理性，缺少统一跨域指标。
    - 部署场景不同：部分工作优化离线基准保真度，另一些强调闭环模拟或单GPU亚秒级服务。
    - 监督信号不同：深度/关键点、运动增强损失、显式上下文条件分别引导优化，改变了系统被测量和改进的方面。
    开放问题:
    - 哪些证据能证明这些模拟器能泛化到 nuScenes、CARL、Minecraft 和当前机器人场景之外的新传感器、本体和物理上下文？
    - 能否把动作保真度与空间记忆指标统一到驾驶、游戏和机器人领域，而不被单一基准的场景图或轨迹格式绑定？
    - 在超出单GPU的规模下，长时一致性、跨视图几何和亚秒级延迟如何相互制约？
    - 哪些基准类工件缺少实验结果或限制说明，需要独立复现才能确认其结论？
    - 在真实部署中上下文和物理参数部分隐藏或未知时，可观测上下文和物理信息训练还能否成立？
