  related_work_outline:
  - 'Mainstream direction: Evaluation and benchmarking center on world models for
    video prediction and control, with tasks in driving, Minecraft, Atari, and robotics.
    Representative examples such as MaskGWM, LoopNav, MIND, and DIAMOND stress long-horizon
    prediction, spatial consistency, memory, and action control rather than only visual
    quality.'
  - 'Shared research pattern: Work typically couples a model or dataset with standardized
    evaluation protocols on suites such as Nuscenes, OpenDV-2K, Waymo, CARL, and Atari
    100k, and reports rollout quality, human-normalized score, zero-shot generalization,
    or consistency scores.'
  - 'Key differences: Approaches differ in supervision and modality: action-free video,
    observable context, coupled video-action diffusion, or physics-informed depth/keypoint
    signals. Evaluation targets also differ: visual detail, long-term memory, spatial
    consistency, physical plausibility, or downstream policy utility.'
  - 'Trend evolution: From 2023-2024, work emphasized efficient transformer or diffusion
    world models on Atari and contextual RL; 2025-2026 shifts toward open-domain memory/action
    benchmarks, spatial consistency datasets, physics-informed embodied models, and
    large robotic video-action pretraining. The span is narrow at the current frontier.'
  - 'Open questions: Whether consistency and visual-fidelity metrics align with downstream
    decision quality; whether benchmarks cover long-horizon, cross-action, and cross-embodiment
    settings; whether conclusions hold across implementations and compute budgets
    when code and limitations are missing.'
  related_work_outline_zh:
  - 主流方向：评估与基准聚焦于世界模型的视频预测与控制，涵盖驾驶、Minecraft、Atari和机器人任务；代表性工作如MaskGWM、LoopNav、MIND和DIAMOND，强调长时域预测、空间一致性、记忆和动作控制，而非只看视觉质量。
  - 研究共性：工作通常将模型或数据集与标准化评估协议结合，使用Nuscenes、OpenDV-2K、Waymo、CARL、Atari 100k等基准，报告展开质量、人类归一化得分、零样本泛化或一致性分数。
  - 关键差异：各方法在监督信号和模态上不同：无动作视频、可观测上下文、耦合视频-动作扩散或物理信息深度/关键点信号；评估目标也不同：视觉细节、长期记忆、空间一致性、物理合理性或下游策略效用。
  - 趋势演进：2023-2024侧重高效Transformer或扩散世界模型在Atari和上下文RL上的表现；2025-2026转向开放域记忆/动作基准、空间一致性数据集、物理信息具身模型和大规模机器人视频-动作预训练。时间跨度处于当前前沿。
  - 开放问题：一致性与视觉保真度指标是否与下游决策质量一致；基准是否覆盖长时域、跨动作和跨具身设置；在代码与局限性缺失时，结论在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: World-model benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets for comparing spatial consistency,
        memory, and action control in generative world models.
      what_remains_open: Whether curated datasets cover long-horizon, cross-action,
        and real-world settings where world models are deployed.
    - line: Metric and stress-test design
      what_it_solves: Probes capabilities beyond aggregate visual quality, including
        spatial graph consistency, memory consistency, action control, long-horizon
        rollout, and zero-shot transfer.
      what_remains_open: Whether these proxy metrics align with downstream navigation,
        manipulation, or policy quality.
    - line: Standardized model evaluation and reporting
      what_it_solves: Makes architecture variants comparable through common RL, driving,
        and robotics suites and reported baselines on Atari 100k, CARL, Nuscenes,
        OpenDV-2K, and Waymo.
      what_remains_open: Stability of conclusions across implementations, compute
        budgets, and missing limitation or artifact details.
    - line: Embodied and physics-informed utility evaluation
      what_it_solves: Connects video generation to physical plausibility and downstream
        robot policy training or evaluation via depth, keypoint dynamics, and video-action
        pretraining.
      what_remains_open: Whether improved physical plausibility or visual detail translates
        to robust real-world policy transfer across embodiments.
    consensus:
    - The field is converging on evaluation beyond pixel-level texture, adding consistency,
      memory, and control checks.
    - Standardized suites and metrics are used to compare diffusion, transformer,
      recurrent, and physics-informed world-model variants.
    - Open dataset/model artifacts are common, but limitation and negative-result
      reporting remains uneven.
    - 'Most evidence treats world-model quality as predictive and interactive: models
      are judged by rollout accuracy, control consistency, or downstream policy usefulness.'
    disagreements:
    - Some work evaluates explicit spatial/memory/action benchmarks, while other work
      evaluates generation quality and policy performance on established RL or robotics
      suites.
    - 'They use different supervision settings: observable context, action-free video,
      coupled video-action data, or physics-informed depth/keypoint signals.'
    - 'They optimize different targets: Atari visual detail and human-normalized score,
      driving long-horizon and zero-shot rollout, robotic physical plausibility, or
      open-domain memory and action control.'
    - Reported evidence ranges from benchmark construction without experimental results
      to state-of-the-art claims, making direct cross-paper comparison difficult.
    open_questions:
    - Do spatial consistency and memory/action-control metrics predict downstream
      navigation, manipulation, or driving decisions?
    - Can benchmarks cover long-horizon, cross-action, and cross-embodiment scenarios
      without overfitting to curated video distributions?
    - Are reported gains stable when code, dataset artifacts, baseline implementations,
      and limitation details are fully released?
    - Does improved visual detail or physical plausibility in generated video consistently
      improve policy learning and real-world transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 构建共享任务与数据集，用于比较生成式世界模型的空间一致性、记忆和动作控制。
      尚未覆盖: 精选数据集是否覆盖长时域、跨动作和真实部署场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体视觉质量之外检验空间图一致性、记忆一致性、动作控制、长时域展开和零样本迁移。
      尚未覆盖: 这些代理指标是否与导航、操作或策略质量一致。
    - 路线: 标准化模型评估与报告
      解决的问题: 通过Atari 100k、CARL、Nuscenes、OpenDV-2K和Waymo等常见套件与基线使不同架构可比较。
      尚未覆盖: 结论在不同实现、算力预算及缺失局限或工件细节时是否稳定。
    - 路线: 具身与物理信息效用评估
      解决的问题: 通过深度、关键点动力学和视频-动作预训练，将视频生成与物理合理性及下游机器人策略训练或评估关联。
      尚未覆盖: 物理合理性或视觉细节的提升是否能转化为跨具身的真实机器人策略迁移。
    共识:
    - 领域正在超越像素级纹理评估，增加一致性、记忆和控制检查。
    - 标准化套件与指标被用于比较扩散、Transformer、循环和物理信息世界模型变体。
    - 开放数据集/模型工件较常见，但局限性与负面结果报告仍不均匀。
    - 多数证据将世界模型质量视为预测性和交互性：以展开准确性、控制一致性或下游策略效用评价。
    分歧:
    - 部分工作评估显式的空间/记忆/动作基准，另一些则评估在既有RL或机器人套件上的生成质量与策略性能。
    - 监督设置不同：可观测上下文、无动作视频、耦合视频-动作数据或物理信息深度/关键点信号。
    - 优化目标不同：Atari视觉细节与人类归一化得分、驾驶长时域与零样本展开、机器人物理合理性，或开放域记忆与动作控制。
    - 证据范围从仅有基准构建且无实验结果到声称最先进表现，使得直接跨论文比较困难。
    开放问题:
    - 空间一致性及记忆/动作控制指标是否能预测下游导航、操作或驾驶决策？
    - 基准能否覆盖长时域、跨动作和跨具身场景，而不只是过拟合精选视频分布？
    - 当代码、数据集工件、基线实现与局限性细节完全公开时，报告的性能提升是否稳定？
    - 生成视频中视觉细节或物理合理性的改善是否持续提升策略学习与真实迁移？
