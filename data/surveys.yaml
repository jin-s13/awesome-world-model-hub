  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is shifting from general-purpose
    game or driving suites toward specialized datasets and metrics that probe specific
    capabilities such as spatial consistency, memory, and action controllability.'
  - 'Shared research pattern: All works construct or adopt evaluation protocols that
    pair input observations with actions and measure the quality of predicted future
    states, using quantitative metrics and often providing open-source artifacts.'
  - 'Key differences: Benchmarks differ in the target capability (spatial consistency,
    memory, action control, visual fidelity), the environment (navigation, Atari,
    driving, robotics), and whether the metric operates at pixel level or in a semantic
    space like scene graphs.'
  - 'Trend evolution: Over 2023–2026, the focus evolved from reusing standard RL benchmarks
    (e.g., Atari 100k) to designing dedicated diagnostic benchmarks that stress-test
    world models on long-horizon consistency, closed-loop control, and zero-shot generalization.'
  - 'Open questions: Whether current proxy metrics align with downstream decision
    quality in real-world deployment; how stable benchmark conclusions are across
    different implementations and compute budgets; and how to cover the full range
    of settings where world models are expected to assist.'
  related_work_outline_zh:
  - 主流方向：世界模型基准测试正从通用游戏或驾驶套件转向专门的数据集和指标，以探测空间一致性、记忆和动作可控性等特定能力。
  - 研究共性：所有工作都构建或采用评估协议，将输入观测与动作配对，并度量预测未来状态的质量，使用定量指标并通常提供开源工件。
  - 关键差异：基准在目标能力（空间一致性、记忆、动作控制、视觉保真度）、环境（导航、Atari、驾驶、机器人）以及指标是在像素级操作还是在语义空间（如场景图）中操作方面存在差异。
  - 趋势演进：在2023至2026年间，重点从重用标准RL基准（如Atari 100k）演变为设计专用的诊断基准，对世界模型进行长时域一致性、闭环控制和零样本泛化的压力测试。
  - 开放问题：当前的代理指标是否与真实部署中的下游决策质量对齐；基准结论在不同实现和算力预算下的稳定性如何；以及如何覆盖世界模型预期发挥作用的全部设置范围。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets for evaluating world models,
        such as loop-based navigation in Minecraft or multi-view driving scenarios,
        enabling standardized comparisons of spatial consistency and memory.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings where world models are expected to help, such as unseen physical
        interactions or long-horizon robotic manipulation.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction quality, controllability, and robustness
        beyond aggregate scores, e.g., scene-graph consistency score invariant to
        pixel noise, or separate metrics for memory consistency and action control.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decision-making utility that users actually care about; sensitivity to distribution
        shift in deployment.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines, open-source
        code, and standardized evaluation protocols (e.g., Atari 100k, Nuscenes),
        facilitating fair comparisons across model architectures.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and subtle data variations; reproducibility
        of closed-source or large-scale baselines.
    consensus:
    - World-model evaluation requires a mix of visual fidelity and task-specific control
      metrics, and must move beyond static, single-step prediction to multi-step or
      closed-loop protocols.
    - Open-source datasets and evaluation frameworks are critical for reproducible
      benchmarking, as seen in the release of LoopNav, MIND, and the use of public
      benchmarks like Atari 100k and CARL.
    - Specialized benchmarks that isolate one capability (e.g., spatial consistency,
      memory) are complementary to general-purpose suites, and both are needed for
      thorough assessment.
    disagreements:
    - 'The level of abstraction for evaluation: some works use pixel-level reconstruction
      or generation quality, while others propose semantic-level metrics (e.g., scene
      graphs) that ignore irrelevant visual details.'
    - 'The role of action: benchmarks differ in whether they evaluate open-loop prediction,
      closed-loop control with given actions, or policy learning inside the world
      model, which leads to different performance interpretations.'
    - 'Environment scope: driving, navigation, and robotics benchmarks target different
      motion dynamics and sensor modalities, making it hard to compare world-model
      capabilities across domains.'
    open_questions:
    - How can we design a single benchmark that covers spatial consistency, memory,
      physics, and action control in a unified framework without conflating their
      effects?
    - Do improvements in benchmark-specific metrics reliably translate to better real-world
      task performance, such as safer driving policies or more robust robot manipulation?
    - What is the minimal set of stress tests needed to expose failure modes of current
      world models, and how can we prevent overfitting to known benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建用于评估世界模型的共享任务和数据集，例如基于Minecraft的循环导航或多视角驾驶场景，实现空间一致性和记忆的标准化比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的真实场景的全部范围，如未见物理交互或长时域机器人操作。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、可控性和鲁棒性，例如对像素噪声不变的场景图一致性得分，或对记忆一致性和动作控制的分离度量。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策效用之间的一致性；部署中对分布偏移的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过通用基线、开源代码和标准化评估协议（如Atari 100k、Nuscenes）使结果可审计，促进不同模型架构之间的公平比较。
      尚未覆盖: 基准结论在不同实现、算力预算和细微数据变化下是否稳定；闭源或大规模基线的可复现性。
    共识:
    - 世界模型评估需要结合视觉保真度和任务特定的控制指标，并且必须从静态单步预测转向多步或闭环协议。
    - 开源数据集和评估框架对可复现的基准测试至关重要，如LoopNav、MIND的发布以及Atari 100k和CARL等公共基准的使用。
    - 隔离单一能力（如空间一致性、记忆）的专门基准与通用套件互补，两者都是全面评估所必需的。
    分歧:
    - 评估的抽象层级：一些工作使用像素级重建或生成质量，而另一些则提出语义级指标（如场景图），忽略无关的视觉细节。
    - 动作的角色：基准在评估开环预测、给定动作的闭环控制还是在世界模型内部学习策略方面存在差异，导致不同的性能解读。
    - 环境范围：驾驶、导航和机器人基准针对不同的运动动力学和传感器模态，使得跨领域比较世界模型能力变得困难。
