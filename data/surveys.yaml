  related_work_outline:
  - 'Mainstream direction: Designing world model architectures using diffusion transformers,
    masked autoencoders, and unified video–action frameworks to generate future states
    from high-dimensional inputs.'
  - 'Shared research pattern: Self-supervised learning on video or interaction data,
    using generative models (VAE, diffusion, Transformer) to learn dynamics, then
    evaluating via video prediction quality or downstream policy performance.'
  - 'Key differences: Representation choices (diffusion vs. VAE-transformer), incorporation
    of physical priors (depth, keypoints), context handling (explicit variables vs.
    language primitives), and evaluation focus (closed-loop control vs. visual fidelity).'
  - 'Trend evolution: From standalone VAE-RNN (2023) to diffusion transformers (2024–2025)
    and unified video–action architectures (2025), with benchmarks emerging for spatial/memory
    consistency (2025–2026).'
  - 'Open questions: Long-term memory consistency, physical plausibility beyond visual
    realism, true model–planner attribution, and generalization to unseen action spaces
    or dynamics.'
  related_work_outline_zh:
  - 主流方向：使用扩散Transformer、掩码自编码器和统一的视频–动作框架设计世界模型架构，从高维输入中生成未来状态。
  - 研究共性：在视频或交互数据上进行自监督学习，使用生成模型（VAE、扩散、Transformer）学习动力学，然后通过视频预测质量或下游策略表现进行评估。
  - 关键差异：表示选择（扩散 vs. VAE-Transformer）、物理先验的融入（深度、关键点）、上下文处理方式（显式变量 vs. 语言原语）以及评估重点（闭环控制
    vs. 视觉保真度）。
  - 趋势演进：从独立的VAE-RNN（2023年）到扩散Transformer（2024–2025年）和统一的视频–动作架构（2025年），同时空间/记忆一致性基准开始出现（2025–2026年）。
  - 开放问题：长期记忆一致性、超越视觉真实感的物理合理性、真正的模型–规划器贡献分离，以及对未见动作空间或动力学的泛化。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures such as
        diffusion transformers, masked autoencoders, and variational autoencoders,
        with training objectives that balance generation quality, efficiency, and
        physical consistency.
      what_remains_open: Which design choices (masking strategy, diffusion vs. VAE,
        physics-informed losses) transfer beyond the reported task family, and how
        to scale to long-horizon memory without forgetting.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to action by coupling video and
        action diffusion within a unified transformer (UWM), or by conditioning world
        models on context for policy learning (cRSSM, STORM), enabling policies to
        be trained on imagined trajectories.
      what_remains_open: How much of the downstream policy performance gain comes
        from the world model versus the policy training algorithm, and whether these
        interfaces support closed-loop planning in real-world settings.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing dedicated benchmarks (LoopNav, MIND) that isolate
        spatial consistency, memory, and action control, moving beyond frame-wise
        video prediction metrics.
      what_remains_open: Whether current method papers provide sufficient ablation
        to separate the contribution of the proposed representation from implementation
        choices, and whether the new benchmarks are adopted for standardized evaluation.
    consensus:
    - World models must learn predictable dynamics from high-dimensional observations,
      with video generation as the central predictive task.
    - Generative models—especially diffusion models, VAEs, and Transformers—are the
      dominant building blocks for learning these dynamics.
    - Self-supervised learning on interaction or video data, followed by policy evaluation
      on imagined rollouts, is the prevalent training and evaluation pipeline.
    - Recent work emphasizes scalability and generalizability, often evaluated on
      multiple datasets or zero-shot settings.
    disagreements:
    - 'Representation: Some models use diffusion in pixel space (MaskGWM, RoboScape),
      while others use latent stochastic models (STORM, cRSSM) or unified latent diffusion
      (UWM).'
    - 'Supervision signals: Pure video reconstruction is common, but RoboScape adds
      depth and keypoint dynamics, and UWM adds action diffusion, leading to different
      training objectives.'
    - 'Context and compositionality: cRSSM uses explicit context variables, RoboDreamer
      decomposes language into primitives, and others ignore contextual variation.'
    - 'Evaluation targets: Some work focuses on visual fidelity (FVD, etc.), while
      new benchmarks (LoopNav, MIND) measure spatial consistency and memory, which
      are not yet standardized.'
    - 'Domain specificity: Driving (MaskGWM), robotics (RoboDreamer, RoboScape, UWM),
      Atari (STORM), and open-world Minecraft (LoopNav) each impose different assumptions
      about action spaces and dynamics.'
    open_questions:
    - Can current architectures maintain long-term memory consistency without sacrificing
      generation efficiency, as suggested by the MIND benchmark's identified challenges?
    - How can physical plausibility be quantitatively evaluated beyond visual realism,
      given that RoboScape introduces physics-informed losses but lacks a standardized
      physical realism metric?
    - What is the minimal set of context or prior knowledge needed for zero-shot generalization
      to unseen dynamics, considering cRSSM's assumption of observable context?
    - Are the contributions of the world model and the downstream policy/planner truly
      disentangled in reported results, or do evaluation protocols conflate them?
    - Will the community adopt benchmarks like LoopNav and MIND for standardized evaluation,
      and how will that shift the focus of future method development?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法落实为具体架构，如扩散Transformer、掩码自编码器和变分自编码器，并设计训练目标以平衡生成质量、效率与物理一致性。
      尚未覆盖: 哪些设计选择（掩码策略、扩散 vs. VAE、物理信息损失）能迁移到报告任务族之外，以及如何扩展到长时域记忆而不遗忘。
    - 路线: 规划与动作接口方法
      解决的问题: 通过统一Transformer中耦合视频与动作扩散（UWM），或通过上下文条件化世界模型进行策略学习（cRSSM、STORM），将学习到的动力学连接到动作，使策略能在想象轨迹上训练。
      尚未覆盖: 下游策略性能的提升有多少来自世界模型本身，有多少来自策略训练算法，以及这些接口是否支持真实场景下的闭环规划。
    - 路线: 方法证据与消融协议
      解决的问题: 提供专门的基准（LoopNav、MIND），隔离空间一致性、记忆和动作控制，超越逐帧视频预测指标。
      尚未覆盖: 当前方法论文是否提供了足够的消融实验，以分离所提出表示的贡献与实现选择的影响，以及这些新基准是否被采纳用于标准化评估。
    共识:
    - 世界模型必须从高维观测中学习可预测的动力学，视频生成是核心预测任务。
    - 生成模型——尤其是扩散模型、VAE和Transformer——是学习这些动力学的主要构建模块。
    - 在交互或视频数据上进行自监督学习，然后在想象rollout上评估策略，是主要的训练和评估流水线。
    - 近期工作强调可扩展性和泛化性，通常在多个数据集或零样本设置上进行评估。
    分歧:
    - 表示方式：部分模型在像素空间使用扩散（MaskGWM、RoboScape），其他使用潜在随机模型（STORM、cRSSM）或统一潜在扩散（UWM）。
    - 监督信号：纯视频重建常见，但RoboScape增加了深度和关键点动力学，UWM增加了动作扩散，导致不同的训练目标。
    - 上下文与组合性：cRSSM使用显式上下文变量，RoboDreamer将语言分解为原语，而其他方法忽略上下文变化。
    - 评估目标：部分工作关注视觉保真度（FVD等），而新基准（LoopNav、MIND）衡量空间一致性和记忆，尚未标准化。
    - 领域特异性：驾驶（MaskGWM）、机器人（RoboDreamer、RoboScape、UWM）、Atari（STORM）和开放世界Minecraft（LoopNav）各自对动作空间和动力学施加不同假设。
    开放问题:
    - 当前架构能否在不牺牲生成效率的情况下维持长期记忆一致性，正如MIND基准所揭示的挑战？
    - 鉴于RoboScape引入了物理信息损失但缺乏标准化的物理合理性指标，如何定量评估物理合理性而不仅仅依赖视觉真实感？
    - 考虑到cRSSM对可观测上下文的假设，实现零样本泛化到未见动力学所需的最小上下文或先验知识是什么？
    - 在报告的结果中，世界模型和下游策略/规划器的贡献是否真正被解耦，还是评估协议将它们混为一谈？
    - 社区是否会采纳LoopNav和MIND等基准进行标准化评估，这将如何改变未来方法开发的焦点？
