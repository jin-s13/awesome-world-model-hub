  related_work_outline:
  - 'Mainstream direction: Generative video world models dominate, using diffusion
    Transformers or Transformer-VAE hybrids to predict visual futures for driving,
    robot, and game settings; recent work adds mask reconstruction, context conditioning,
    physics-informed tasks, and unified video-action diffusion.'
  - 'Shared research pattern: Most methods train a self-supervised dynamics or video
    model and either use it for policy dreaming or evaluate it as a generative simulator;
    newer work adds evaluation probes for spatial, memory, and action consistency.'
  - 'Key differences: Representation choices split between latent recurrent states,
    generative video diffusion, and coupled video-action diffusion; supervision ranges
    from context values and language primitives to depth/keypoints and mask reconstruction;
    evaluation targets range from Atari/CARL scores to driving, robotic video, and
    memory/spatial benchmarks.'
  - 'Trend evolution: The recent frontier from 2023 to 2026 moves from Atari/RL world
    models toward large-scale embodied and driving video models, with benchmarks now
    targeting long-term consistency and action control rather than visual realism
    alone; earlier years are not represented in the top evidence.'
  - 'Open questions: Which architectural components cause reported gains; whether
    benchmark consistency metrics predict downstream planning/control; whether context
    and compositional generalization extend beyond limited tasks and observable context
    assumptions.'
  related_work_outline_zh:
  - 主流方向：生成式视频世界模型为主，采用扩散Transformer或Transformer-VAE混合，面向驾驶、机器人和游戏场景；近期加入掩码重建、上下文条件、物理信息任务和视频-动作扩散。
  - 研究共性：多数方法以自监督方式训练动力学或视频模型，用于策略想象或生成式仿真；新工作增加空间、记忆和动作一致性探测。
  - 关键差异：表示分化为潜在循环状态、扩散视频和视频-动作耦合扩散；监督信号含上下文值、语言原语、深度/关键点、掩码重建；评测目标从Atari/CARL分数到驾驶、机器人视频和记忆/空间基准。
  - 趋势演进：2023-2026前沿从Atari/RL世界模型转向大规模具身与驾驶视频模型，基准更关注长期一致性和动作控制而非纯视觉逼真度；早期年份未在top证据中体现。
  - 开放问题：哪些架构组件带来增益；一致性指标能否预测下游规划控制；上下文与组合泛化能否超出有限任务和可观测上下文假设。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete architectures, losses,
        and training recipes, such as diffusion Transformers with mask reconstruction,
        Transformer-VAE stochastic models, physics-informed depth/keypoint objectives,
        and video-action diffusion coupling.
      what_remains_open: Which representation and objective choices transfer beyond
        the reported task families; current evidence often lacks ablations isolating
        mask, physics, or context components from surrounding system choices.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to interventions, policies, or decision-time
        interfaces, including context-conditioned Dreamer for zero-shot RL, language-to-video
        compositional plans, and unified video-action diffusion for policy and dynamics.
      what_remains_open: How much gain comes from the model versus the planner, controller,
        or task prior; whether action-free video learning or primitive decomposition
        supports truly unseen actions, goals, or deployment settings.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects; includes benchmarks for spatial consistency, memory
        consistency, and action control rather than visual realism alone.
      what_remains_open: Whether reported evaluation isolates the proposed method;
        many papers omit baseline, metric, or limitation details, and benchmark-only
        papers do not yet report model results.
    consensus:
    - Current work converges on learning world simulators through self-supervised
      reconstruction or prediction objectives over visual or state-action sequences,
      increasingly using generative sequence models.
    - Researchers augment raw video prediction with structured signals such as mask
      reconstruction, context conditioning, physics-informed depth/keypoint tasks,
      or coupled action diffusion to improve generalization and physical plausibility.
    - Evaluation is expanding from task-specific reinforcement-learning performance
      to explicit diagnostics for spatial, temporal, memory, and action-control consistency.
    disagreements:
    - 'Representation: methods choose among latent recurrent state-space models, generative
      video diffusion, and unified video-action diffusion, which changes what can
      be queried or controlled.'
    - 'Supervision: papers rely on different inductive biases such as observable context
      values, language-derived primitives, depth/keypoint prediction, or mask reconstruction,
      implying different assumptions about available structure.'
    - 'Evaluation target: evidence is split between RL benchmarks such as Atari 100k
      and CARL, driving/view synthesis quality, robotic video fidelity, and specialized
      consistency benchmarks, making direct comparison difficult.'
    - 'Interaction and deployment: some methods are evaluated only in simulation or
      on offline video, while others explicitly benchmark closed-loop action control
      or policy execution, leaving deployment boundaries unclear.'
    open_questions:
    - Which model components, including mask reconstruction, context conditioning,
      physics-informed objectives, or video-action coupling, contribute to reported
      gains independent of datasets, baselines, and implementation choices?
    - Do spatial, memory, and action-control consistency metrics predict downstream
      planning, policy learning, or real-world deployment performance?
    - Can context-conditioned world models and compositional video planners generalize
      beyond observed contexts or training-time primitive combinations, and to partially
      observable settings?
    - What baseline, metric, and limitation evidence is missing across the packet,
      and how would rigorous ablation change the claimed rankings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法落实为具体架构、损失和训练配方，例如带掩码重建的扩散Transformer、Transformer-VAE随机模型、物理信息深度/关键点目标以及视频-动作扩散耦合。
      尚未覆盖: 哪些表示和目标选择能迁移到报告任务族之外；当前证据往往缺少隔离掩码、物理或上下文组件与周边系统选择的消融。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、策略或决策时接口，包括上下文条件Dreamer用于零样本强化学习、语言到视频组合规划以及统一视频-动作扩散用于策略与动力学。
      尚未覆盖: 收益有多少来自模型本身而不是规划器、控制器或任务先验；无动作视频学习或原语分解能否支持真正未见的动作、目标或部署设置。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素；包括空间一致性、记忆一致性和动作控制基准，而非单纯视觉逼真度。
      尚未覆盖: 报告评估是否隔离了所提方法；许多论文缺少基线、指标或局限性细节，纯基准论文尚未报告模型结果。
    共识:
    - 当前工作趋同于通过自监督重建或预测目标学习世界模拟器，越来越依赖生成式序列模型。
    - 研究者为原始视频预测加入结构化信号，如掩码重建、上下文条件、物理信息深度/关键点任务或耦合动作扩散，以提升泛化和物理合理性。
    - 评测正从任务特定的强化学习性能扩展到空间、时间、记忆和动作控制一致性的显式诊断。
    分歧:
    - 表示方式：方法在潜在循环状态空间模型、生成式视频扩散和统一视频-动作扩散之间选择，影响可查询和控制的内容。
    - 监督信号：依赖不同归纳偏置，如可观测上下文值、语言派生原语、深度/关键点预测或掩码重建，隐含不同标签或结构假设。
    - 评测目标：证据分散在Atari 100k、CARL、驾驶/视图生成质量、机器人视频保真度和专门一致性基准之间，难以直接比较。
    - 交互与部署：部分方法仅在仿真或离线视频中评估，另一些显式测试闭环动作控制或策略执行，部署边界仍不清晰。
    开放问题:
    - 掩码重建、上下文条件、物理信息目标或视频-动作耦合中，哪些组件独立于数据集、基线和实现选择带来增益？
    - 空间、记忆和动作控制一致性指标能否预测下游规划、策略学习或真实部署性能？
    - 上下文条件世界模型和组合视频规划器能否泛化到未见上下文、训练原语组合之外以及部分可观测环境？
    - 当前证据缺失哪些基线、指标和局限性信息，更严格消融会如何改变现有方法排序？
