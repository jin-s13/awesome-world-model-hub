  related_work_outline_zh:
  - 主流方向：构建支持规划、预测和交互控制的视频生成世界模拟器，越来越强调长时域一致性、实时交互和多模态条件控制。
  - 研究共性：使用生成式架构（扩散模型）从大规模视频数据中学习世界动态，通过语言、轨迹或姿态进行分解控制，并在仿真或下游任务执行中评估。
  - 关键差异：部分工作建模像素空间（视频帧），另一些提倡潜在空间表示；交互范式从离线想象到实时交互模拟器不等；评测目标在物理机器人执行、自动驾驶和开放世界基准之间分化。
  - 趋势演进：从2022年纯机器人学习开始，转向2024年面向想象的组合视频生成，再到2025–2026年关注持久视线外动态和实时开源模拟器，综述则整合分类和基准。
  - 开放问题：如何确保生成视频遵循真实物理规律；如何评测世界模型作为模拟引擎；如何泛化到训练集之外的新原语组合；如何降低推理成本以支持实时闭环应用。
  literature_review:
    line_of_work_matrix:
    - line: Video generative world models for interactive simulation and control
      what_it_solves: Learning to produce future video frames conditioned on actions,
        language, or poses, enabling planning and controllable simulation for robotics
        and embodied agents.
      what_remains_open: Generalization is limited to seen primitive combinations;
        persistent out-of-view dynamics and long-term scene consistency are not fully
        solved; evaluation benchmarks for interactive fidelity are still nascent.
    - line: Latent-space world models for physical robot learning
      what_it_solves: Enabling robots to learn complex behaviors directly from real-world
        experience without simulators, using imagined latent trajectories for planning
        and rapid adaptation.
      what_remains_open: Only demonstrated on a few robot platforms; hyperparameter
        robustness across diverse tasks is unverified; scaling to more complex manipulation
        and navigation remains open.
    - line: Taxonomy, survey, and evaluation framework synthesis
      what_it_solves: Organizing the fragmented world model landscape into design
        spaces (latent representations, structural priors, internal mechanics) and
        providing benchmark comparisons and open challenges.
      what_remains_open: Most frameworks are conceptual and lack empirical validation;
        rapid field evolution may outdate taxonomies; evaluation prescriptions are
        not yet implemented or tested in real scenarios.
    consensus:
    - World models must capture temporal dynamics and multi-modal control to be useful
      for planning and interaction.
    - Diffusion-based video generation has become the dominant backbone for pixel-level
      world simulation.
    - Long-horizon consistency and memory mechanisms are critical gaps that current
      work explicitly addresses.
    - Evaluation is shifting from open-loop prediction quality to closed-loop task
      performance and interactivity metrics.
    disagreements:
    - Whether pixel-space video generation or latent state modeling is more suitable
      for downstream control and physical reasoning.
    - Whether explicit 3D geometry and physics priors are necessary, or whether they
      can be learned implicitly from data.
    - 'How to balance real-time interaction latency with generation quality: some
      works prioritize low-latency frame generation for interactivity, others focus
      on offline imagination quality.'
    - Whether world models should be evaluated as standalone simulators or via their
      utility in downstream robot/agent tasks, leading to distinct evaluation protocols.
    open_questions:
    - Can video generation models provably respect physical laws such as object permanence,
      collision, and causality, or are they only statistically plausible?
    - How can we build a unified benchmark that measures both controllable generation
      quality and closed-loop task success across diverse embodiments?
    - What is the minimal set of primitive representations that enables compositional
      generalization to unseen instructions and environments?
    - Can open-source world models achieve the fidelity and efficiency of proprietary
      systems while remaining accessible for real-world deployment and modification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向交互式仿真与控制的视频生成世界模型
      解决的问题: 学习根据动作、语言或姿态生成未来视频帧，支持机器人和具身智能体的规划与可控仿真。
      尚未覆盖: 泛化仅限于训练中见过的原语组合；视线外持久动态和长期场景一致性未完全解决；交互保真度的评测基准仍处于早期阶段。
    - 路线: 用于物理机器人学习的潜在空间世界模型
      解决的问题: 使机器人无需模拟器，直接从真实世界经验中学习复杂行为，利用想象潜在轨迹进行规划和快速适应。
      尚未覆盖: 仅在少数机器人平台上验证；跨任务超参数鲁棒性未经验证；扩展到更复杂的操作和导航任务仍待解决。
    - 路线: 分类法、综述与评估框架综合
      解决的问题: 将碎片化的世界模型研究整理为设计空间（潜在表示、结构先验、内部机制），并提供基准比较和开放挑战。
      尚未覆盖: 大多数框架为概念性，缺乏实证验证；领域快速演进可能使分类过时；评估方案尚未在真实场景中实施或测试。
    共识:
    - 世界模型必须捕捉时间动态和多模态控制，以服务于规划和交互。
    - 基于扩散的视频生成已成为像素级世界模拟的主导架构。
    - 长时域一致性和记忆机制是当前工作明确应对的关键缺口。
    - 评测正从开环预测质量转向闭环任务性能和交互度指标。
    分歧:
    - 在像素空间视频生成和潜在状态建模之间，哪种更适合下游控制和物理推理。
    - 是否需要显式3D几何与物理先验，还是可以从数据中隐式学习。
    - 如何在实时交互延迟与生成质量之间权衡：部分工作优先考虑低延迟帧生成以实现交互，其他则聚焦离线想象质量。
    - 世界模型应作为独立模拟器评估，还是通过在下游机器人/智能体任务中的效用评估，导致不同的评测协议。
    开放问题:
    - 视频生成模型能否可证明地遵循物理规律（如物体恒存性、碰撞、因果），还是仅呈现统计合理？
    - 如何构建一个统一基准，同时衡量可控生成质量和跨多种实体的闭环任务成功率？
    - 什么是最小原语表示集合，能够实现对未见指令和环境的组合泛化？
    - 开源世界模型能否达到闭源系统的保真度和效率，同时保持可获取性以便实际部署和修改？
