  related_work_outline:
  - 'Mainstream direction: Application-driven world models concentrate on controllable,
    action- or context-conditioned video generation for driving, robotics, and interactive
    environments, with recent systems favoring diffusion transformers plus auxiliary
    tasks.'
  - 'Shared research pattern: Papers treat world models as generative predictors trained
    on domain-specific interaction data, then evaluate visual fidelity, dynamics consistency,
    and usefulness for policy learning or simulation.'
  - 'Key differences: Work splits between recurrent state-space latent models for
    sample-efficient control and diffusion/Transformer video models for high-dimensional
    generation; evaluation ranges from open-loop pixel quality to closed-loop memory
    and action control.'
  - 'Trend evolution: The evidence moves from efficient model-based RL in games around
    2023, through contextual and robot world models in 2024, toward driving and consistency
    benchmarks in 2025-2026, reflecting frontier application deepening.'
  - 'Open questions: Whether benchmark gains translate to real-world driving safety
    or robot deployment, whether models transfer across datasets, embodiments, and
    action spaces, and how long-term memory and physical consistency should be verified.'
  related_work_outline_zh:
  - 主流方向：应用驱动世界模型集中在驾驶、机器人和交互环境中的可控视频生成与策略训练，近年多采用扩散Transformer加辅助任务。
  - 研究共性：将世界模型作为以动作或上下文为条件的生成式预测器，用领域交互数据训练，并评估视觉质量、动态一致性与策略或仿真价值。
  - 关键差异：循环状态空间潜在模型偏重采样高效控制，扩散/Transformer侧重高维生成；评测从开环像素质量扩展到闭环记忆与动作控制。
  - 趋势演进：从2023年游戏中的高效模型化强化学习，经2024年上下文与机器人世界模型，到2025-2026年驾驶与一致性基准，属于当前前沿内的应用深化。
  - 开放问题：基准收益能否对应真实驾驶安全或机器人部署，跨数据集/本体/动作空间的迁移，以及如何验证长期记忆一致性和物理一致性。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and closed-loop simulation
      what_it_solves: Long-horizon, multi-view driving scene generation and zero-shot
        validation across driving datasets.
      what_remains_open: Whether improvements on Nuscenes, OpenDV-2K, or Waymo align
        with real-world driving safety or operational outcomes is not established.
    - line: Embodied robot world modeling and task transfer
      what_it_solves: Learning action- or language-conditioned robot video generation,
        dynamics, and policies, with some physics-informed cues for plausible manipulation.
      what_remains_open: Real-robot execution evidence is limited, and generalization
        beyond seen language primitives, observed contexts, or collected robot datasets
        remains unresolved.
    - line: Interactive agent and memory/action consistency evaluation
      what_it_solves: Building efficient action-conditioned world models for games
        and navigation, and providing benchmarks for spatial consistency, memory,
        and action control.
      what_remains_open: Long-term temporal stability and cross-action-space generalization
        are still open challenges; current evidence is mainly from simulation or synthetic
        navigation.
    consensus:
    - Recent work treats world models as action- or context-conditioned generative
      predictors, often video predictors, rather than only passive scene reconstructors.
    - There is shared interest in auxiliary signals such as mask reconstruction, depth/keypoint
      physics tasks, dynamics prediction, or coupled action diffusion to improve consistency
      and downstream usefulness.
    - Evaluation is shifting beyond pixel fidelity toward spatial or scene-graph consistency,
      memory consistency, and closed-loop action control.
    - Transformer and diffusion architectures are common in newer applications, while
      recurrent state-space formulations remain relevant for sample-efficient control.
    disagreements:
    - Representation differs between compact recurrent latent state-space models used
      for control and high-dimensional diffusion or Transformer video generation models.
    - 'Supervision and auxiliary objectives differ: some use MAE-style mask reconstruction,
      others use depth/keypoint or physics-informed losses, and others couple video
      and action diffusion or contextual dynamics.'
    - Evaluation targets diverge across driving scenes, robot manipulation, Minecraft
      navigation, and Atari-style interaction, making direct comparison difficult.
    - Some work emphasizes open-loop generation or cross-dataset transfer, while other
      work emphasizes closed-loop action control and memory consistency.
    - 'Deployment assumptions differ: approaches may assume observable context, large-scale
      robot pretraining, language-instruction decomposition, or simulation-only evaluation.'
    open_questions:
    - Do benchmark improvements on visual, spatial, or action-control metrics translate
      into real-world driving safety or robot deployment success?
    - Can world models generalize across embodiments, datasets, institutions, action
      spaces, or physical environments without retraining or calibration?
    - Which auxiliary objectives, such as mask reconstruction, physics cues, depth/keypoint
      prediction, or action diffusion, most improve long-horizon coherence without
      overfitting to a single domain?
    - How should memory consistency be measured and guaranteed beyond short clips,
      especially for loop navigation, long-horizon driving, and closed-loop tasks?
    - Current evidence relies heavily on self-reported results on selected benchmarks;
      independent verification of code, datasets, metrics, and limitations remains
      a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶场景预测与闭环仿真
      解决的问题: 实现长时域、多视角驾驶场景生成，并在不同驾驶数据集间进行零样本验证。
      尚未覆盖: Nuscenes、OpenDV-2K、Waymo上的指标提升是否对应真实驾驶安全或运营结果尚未证实。
    - 路线: 具身机器人世界建模与任务迁移
      解决的问题: 学习动作或语言条件下的机器人视频生成、动力学与策略，并引入物理线索提升操作合理性。
      尚未覆盖: 真实机器人执行证据有限；对未见语言原语、上下文或机器人数据集的泛化仍不明确。
    - 路线: 交互智能体与记忆/动作一致性评测
      解决的问题: 在游戏或导航环境中学习高效的动作条件世界模型，并建立空间一致性、记忆和动作控制基准。
      尚未覆盖: 长期时间稳定性和跨动作空间泛化仍是挑战，现有证据主要来自仿真或合成导航。
    共识:
    - 近期工作趋向把世界模型建成以动作或上下文为条件的生成式预测器，通常是视频预测器，而非仅做被动场景重建。
    - 普遍引入辅助信号，如掩码重建、深度/关键点物理任务、动力学预测或动作扩散，以增强一致性和下游价值。
    - 评测开始超出像素逼真度，转向空间或场景图一致性、记忆一致性和闭环动作控制。
    - 较新应用中常见Transformer和扩散架构，而循环状态空间模型仍用于强调采样效率的控制任务。
    分歧:
    - 表示方式不同：一方采用紧凑的循环状态空间潜在模型用于控制，另一方采用高维扩散或Transformer视频生成模型。
    - 监督与辅助目标不同：有的用MAE式掩码重建，有的用深度/关键点或物理损失，有的耦合视频与动作扩散或上下文动力学。
    - 评测目标分散在驾驶场景、机器人操作、Minecraft导航和Atari交互，难以直接比较。
    - 有的工作侧重开环生成或跨数据集泛化，有的侧重闭环动作控制和记忆一致性。
    - 部署假设不同：相关方法可能依赖可观测上下文、大规模机器人预训练、语言指令分解或仅仿真评估。
    开放问题:
    - 视觉、空间或动作控制基准上的提升能否转化为真实驾驶安全或机器人部署效果？
    - 世界模型能否跨本体、数据集、机构、动作空间或物理环境泛化而无需重训或标定？
    - 掩码重建、物理线索、深度关键点、动作扩散等辅助目标如何组合，才能在改善长时域一致性的同时避免单一领域过拟合？
    - 如何在循环导航、长时域驾驶和闭环任务中衡量并保证记忆一致性？
    - 现有证据多为论文自报结果，缺少对代码、数据集、指标和局限的独立验证，仍属证据缺口。
