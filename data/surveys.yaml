  related_work_outline:
  - 'Mainstream direction: Designing generative architectures (diffusion, VAE, Transformers)
    for world models that predict high-fidelity videos or latent states, with growing
    emphasis on physical plausibility and compositional generalization.'
  - 'Shared research pattern: Most works propose a novel neural architecture or training
    objective, evaluate on standard or newly introduced benchmarks, and claim improvements
    in visual quality, control, or zero-shot generalization, but often lack rigorous
    ablation separating model contributions from system-level choices.'
  - 'Key differences: Representations range from pixel-space video diffusion to latent
    state-space models; supervision signals include reconstruction, physics-informed
    losses, and action conditioning; evaluation targets span open-loop video metrics,
    closed-loop policy performance, and specialized consistency benchmarks.'
  - 'Trend evolution: The field is moving from RNN/SSM-based world models (pre-2023)
    to Transformer and diffusion-based architectures (2023-2025), with a recent surge
    in robotics-focused models that jointly handle video and action, and the emergence
    of dedicated benchmarks for spatial and memory consistency (2025-2026).'
  - 'Open questions: How to isolate the contribution of the world model from the planner
    or controller; whether architectural choices transfer across diverse embodiments
    and task families; and how to evaluate long-term memory, physical consistency,
    and controllability in open-domain settings.'
  related_work_outline_zh:
  - 主流方向：设计用于世界模型的生成式架构（扩散、VAE、Transformer），预测高保真视频或潜在状态，并日益强调物理合理性和组合泛化。
  - 研究共性：多数工作提出新颖的神经架构或训练目标，在标准或新引入的基准上评估，并声称在视觉质量、控制或零样本泛化方面有所提升，但往往缺乏严格的消融实验来分离模型贡献与系统级选择。
  - 关键差异：表示形式从像素空间视频扩散到潜在状态空间模型不等；监督信号包括重建、物理信息损失和动作条件；评估目标涵盖开环视频指标、闭环策略性能和专门的一致性基准。
  - 趋势演进：该领域正从基于RNN/SSM的世界模型（2023年前）转向基于Transformer和扩散的架构（2023-2025），近期涌现出联合处理视频和动作的机器人模型，以及用于空间和记忆一致性的专用基准（2025-2026）。
  - 开放问题：如何分离世界模型与规划器或控制器的贡献；架构选择能否迁移到不同的具身和任务族；如何在开放域环境中评估长期记忆、物理一致性和可控性。
  literature_review:
    line_of_work_matrix:
    - line: Representation and architecture design for world models
      what_it_solves: Concretizing world-model ideas into neural architectures (e.g.,
        diffusion transformers, VAEs, compositional models) and training objectives
        (e.g., mask reconstruction, physics-informed losses) that generate plausible
        futures from sensory inputs.
      what_remains_open: Which design choices (e.g., pixel-space vs. latent diffusion,
        stochastic vs. deterministic transitions) generalize beyond the reported task
        family, and whether the gains stem from the architecture or from dataset scale
        and engineering.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by using world
        models for policy optimization, video-based planning, or joint action-video
        generation, enabling agents to act in imagined futures.
      what_remains_open: How much of the observed performance improvement comes from
        the world model versus the planner, controller, or task-specific prior, and
        whether these interfaces support robust generalization to novel action spaces
        or physical interactions.
    - line: Evaluation protocols and benchmarks for world models
      what_it_solves: Providing standardized datasets and metrics (e.g., spatial consistency,
        memory consistency, action controllability) to measure world model capabilities
        beyond visual fidelity, aiming to isolate method contributions.
      what_remains_open: Whether current benchmarks capture the full complexity of
        real-world deployment, and whether they truly disentangle model quality from
        confounding factors like data diversity, baseline tuning, and metric sensitivity.
    consensus:
    - Generative modeling of visual dynamics is the dominant paradigm, with diffusion
      and VAE-based approaches widely adopted.
    - Incorporating action or context as conditioning signal is essential for controllable
      world models and downstream policy learning.
    - Generalization—zero-shot, compositional, or across embodiments—is a central
      evaluation criterion, though its definition varies.
    - Large-scale, diverse datasets (real or simulated) are critical for training,
      but the field lacks agreement on a single standard benchmark.
    disagreements:
    - 'Representation level: some models operate directly in pixel space via video
      diffusion, while others use compact latent states with recurrent or transformer
      dynamics.'
    - 'Supervision: approaches differ in whether they rely purely on reconstruction,
      incorporate explicit physics losses (e.g., depth, keypoints), or use action
      prediction as an auxiliary task.'
    - 'Evaluation target: works optimize for open-loop video quality, closed-loop
      task success, or specialized consistency metrics, making direct comparison difficult.'
    - 'Interaction mode: some models are designed for passive video prediction, others
      for interactive control, and a few attempt to unify both within a single framework.'
    open_questions:
    - Can we design a world model architecture that transfers robustly from simulation
      to real-world robotics without extensive fine-tuning?
    - How should we measure the isolated contribution of the dynamics model when the
      planner, controller, and reward function are often co-adapted?
    - What evaluation protocol can simultaneously assess long-term memory, physical
      consistency, and fine-grained action controllability in open-domain settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的表示与架构设计
      解决的问题: 将世界模型概念落实为具体的神经架构（如扩散Transformer、VAE、组合模型）和训练目标（如掩码重建、物理信息损失），从感官输入生成合理的未来。
      尚未覆盖: 哪些设计选择（如像素空间与潜在扩散、随机与确定性转移）能迁移到报告任务族之外，以及性能提升究竟源于架构还是数据规模和工程优化。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策，通过世界模型进行策略优化、基于视频的规划或联合动作-视频生成，使智能体能够在想象的未来中行动。
      尚未覆盖: 观测到的性能提升有多少来自世界模型本身，而不是规划器、控制器或任务特定先验，以及这些接口是否支持对新动作空间或物理交互的鲁棒泛化。
    - 路线: 世界模型的评估协议与基准
      解决的问题: 提供标准化的数据集和指标（如空间一致性、记忆一致性、动作可控性），以衡量超越视觉保真度的世界模型能力，旨在隔离方法贡献。
      尚未覆盖: 当前基准是否捕捉了真实部署的全部复杂性，以及它们是否真正将模型质量与数据多样性、基线调优和指标敏感性等混淆因素分离开来。
    共识:
    - 视觉动态的生成建模是主导范式，扩散和基于VAE的方法被广泛采用。
    - 将动作或上下文作为条件信号对于可控世界模型和下游策略学习至关重要。
    - 泛化——零样本、组合或跨具身——是核心评估标准，尽管其定义各不相同。
    - 大规模多样化数据集（真实或仿真）对训练至关重要，但领域内缺乏统一的标准基准。
    分歧:
    - 表示层级：部分模型通过视频扩散直接在像素空间操作，而其他模型使用紧凑的潜在状态配合循环或Transformer动态。
    - 监督信号：方法在仅依赖重建、引入显式物理损失（如深度、关键点）或使用动作预测作为辅助任务上存在差异。
    - 评估目标：工作分别优化开环视频质量、闭环任务成功率或专门的一致性指标，导致直接比较困难。
    - 交互模式：一些模型设计用于被动视频预测，另一些用于交互控制，少数尝试在单一框架内统一两者。
    开放问题:
    - 能否设计一个世界模型架构，使其从仿真到真实机器人部署时无需大量微调即可鲁棒迁移？
    - 当规划器、控制器和奖励函数通常协同适应时，如何衡量动力学模型的独立贡献？
    - 何种评估协议能同时评估开放域环境中的长期记忆、物理一致性和细粒度动作可控性？
