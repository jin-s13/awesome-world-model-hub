  - 'Shared research pattern: Papers couple visual prediction with action conditioning,
    then evaluate generation quality, controllability, policy transfer, or planning;
    several add reward modeling, DPO-style post-training, or test-time verifiers to
    align rollouts with physical or task constraints.'
  - 'Key differences: They differ in representation such as diffusion, autoregression,
    or adapter-based adaptation; supervision such as action labels, human preferences,
    physics annotations, or verifier assertions; and evaluation target such as visual
    fidelity, planning, or zero-shot physical plausibility.'
  - 'Trend evolution: From 2024 action-conditioned generation and pretrained-video
    adaptation, the frontier moves toward 2025-2026 large-scale models, post-training
    alignment, test-time scaling, and zero-shot embodied benchmarks.'
  - 'Open questions: Whether generated rollouts encode persistent state and causal
    dynamics, whether verifier or reward signals are calibrated, and whether evaluation
    protocols measure theory-relevant world-model properties remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中表现为将动作条件视频生成作为具身世界模型，采用扩散Transformer、掩码自回归或预训练视频模型适配器来从动作预测未来观测。
  - 研究共性：论文普遍把视觉预测与动作条件耦合并评测生成质量、可控性、策略迁移或规划；部分工作加入奖励建模、DPO式后训练或测试时验证器来对齐物理或任务约束。
  - 关键差异：表示形式不同，如扩散、自回归或适配器；监督信号不同，如动作标签、人类偏好、物理标注或验证断言；评测目标不同，如视觉保真、规划或零样本物理合理性。
  - 趋势演进：从2024年的动作条件生成与预训练视频适配，走向2025-2026年的大规模模型、后训练对齐、测试时缩放和零样本具身评测。
  - 开放问题：生成轨迹是否编码持久状态与因果动态、验证器或奖励信号是否校准、评测协议能否测量世界模型的理论相关性质，仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Formalization of action-conditioned video world models
      what_it_solves: Provides an explicit generative mechanism for forward dynamics,
        inverse dynamics, policy, and video prediction by conditioning on actions
        and history.
      what_remains_open: Formal conditions under which generated rollouts match true
        environment dynamics are not defined; evidence is mainly empirical and task-specific.
    - line: Scaling and test-time verification
      what_it_solves: Connects larger models, test-time compute, and verifier or reward
        signals to expected improvements in generation or spatial reasoning.
      what_remains_open: No formal guarantee is provided; test-time scaling helps
        on one benchmark while another benchmark shows an information bottleneck and
        poor calibration.
    - line: Conceptual taxonomy and evaluation boundaries
      what_it_solves: Separates world-model capabilities into state construction and
        dynamics modeling and argues for functional benchmarks beyond visual fidelity.
      what_remains_open: The taxonomy is conceptual; the packet lacks evidence that
        adopting it changes model design or evaluation outcomes.
    - line: Alignment and post-training for physical and task fidelity
      what_it_solves: Uses human preference rewards, DPO-style post-training, or physics-aware
        annotations to suppress unphysical rollouts and improve task-consistent video.
      what_remains_open: Generalization beyond contact-rich manipulation and the cost
        or subjectivity of reward collection remain unproven in this evidence.
    consensus:
    - Action-conditioned video generation is treated as a useful substrate for embodied
      world models, with future frames conditioned on past observations and actions.
    - Pretrained generative video models can be adapted or post-trained to improve
      action conditioning and physical plausibility without always retraining from
      scratch.
    - Evaluation is shifting from visual quality alone toward action-frame alignment,
      policy or planning usefulness, and physical or task reward signals.
    - Current models still lack strong evidence of persistent state, causal dynamics,
      and calibrated decision-relevant signals.
    disagreements:
    - 'Representation and architecture differ: some use diffusion transformers, one
      uses heterogeneous masked autoregression, and one adapts a closed pretrained
      diffusion model via learned masks.'
    - 'Supervision differs: some train on action-labelled videos, others use human
      preference rewards or physics-aware annotations, and one uses frame-anchored
      spatial assertions at test time.'
    - 'Evaluation target differs: some optimize video fidelity or controllability,
      others planning correlations, and others zero-shot physical plausibility, making
      comparability weak.'
    - 'Deployment assumptions differ: some require large-scale curated or multi-embodiment
      datasets, while one uses small domain-specific action-labelled data but depends
      on a closed pretrained model.'
    open_questions:
    - What formal assumptions would guarantee that action-conditioned video predictions
      preserve environment dynamics, and how can those assumptions be tested empirically?
    - Why does test-time scaling improve one spatial reasoning benchmark but not another,
      and are verifier or reward signals sufficiently calibrated?
    - Can evaluation protocols measure state persistence and causal reasoning rather
      than only frame-level fidelity or action alignment?
    - How well do physics and task alignment methods transfer beyond contact-rich
      manipulation to diverse embodiments, scenes, and tasks?
    - What is the trade-off between model scale, generation speed, controllability,
      and physical fidelity for downstream planning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频世界模型的形式化
      解决的问题: 通过动作和历史条件生成未来帧，为前向动力学、逆动力学、策略和视频预测提供显式生成机制。
      尚未覆盖: 没有定义生成轨迹何时匹配真实环境动力学的形式条件；证据主要是经验性和任务特定的。
    - 路线: 缩放与测试时验证
      解决的问题: 把更大模型、测试时计算及验证器或奖励信号与生成或空间推理的改进联系起来。
      尚未覆盖: 没有给出形式保证；测试时缩放在一个基准上有效，在另一个基准上显示信息瓶颈和校准不良。
    - 路线: 概念分类与评测边界
      解决的问题: 把世界模型能力分为状态构建和动态建模，主张功能基准而非仅视觉保真度。
      尚未覆盖: 分类是概念性的；证据包中缺乏采用该分类是否改变模型设计或评测结果的证据。
    - 路线: 物理与任务保真度的对齐和后训练
      解决的问题: 利用人类偏好奖励、DPO式后训练或物理感知标注来抑制非物理轨迹并改善任务一致性视频。
      尚未覆盖: 超出接触丰富操作任务的泛化能力以及奖励收集的成本或主观性，在本证据中仍未证明。
    共识:
    - 动作条件视频生成被视为具身世界模型的有效基础，未来帧以过去观测和动作为条件。
    - 预训练生成视频模型可被适配或后训练，以改善动作条件化和物理合理性，而不必总是从头训练。
    - 评测正从单纯视觉质量转向动作-帧对齐、策略或规划效用以及物理或任务奖励信号。
    - 当前模型仍缺乏持久状态、因果动态和校准决策信号的强证据。
    分歧:
    - 表示和架构不同：有扩散Transformer、异构掩码自回归，以及通过学习掩码适配闭源预训练扩散模型。
    - 监督信号不同：有的使用动作标注视频，有的使用人类偏好奖励或物理感知标注，还有的在测试时使用帧锚定空间断言。
    - 评测目标不同：有的优化视频保真度或可控性，有的关注规划相关性，有的关注零样本物理合理性，可比性较弱。
    - 部署假设不同：有的要求大规模精选或多本体数据，有的仅用小规模领域动作数据但依赖闭源预训练模型。
    开放问题:
    - 什么样的形式假设可以保证动作条件视频预测保持环境动力学，且这些假设如何被实证检验？
