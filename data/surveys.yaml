  - 'Mainstream direction: Building video-based world models with action conditioning
    for robot manipulation and decision-making, leveraging pretraining, alignment,
    and physical plausibility to improve reliability.'
  - 'Shared research pattern: Treating world models as action-to-future-video mappings,
    emphasizing action-video alignment, and evaluating via policy assessment or planning.'
  - 'Key differences: Generation architecture (diffusion vs autoregressive), action
    injection mechanism, alignment objective (physical realism, task logic, visual
    quality), and evaluation criterion (visual fidelity vs functional benchmarks).'
  - 'Trend evolution: From fine-grained action alignment and adaptation in 2024, to
    unified pretraining and heterogeneous learning in 2025, to large-scale models,
    multi-dimensional alignment, physical alignment, and theoretical analysis in 2026,
    moving toward more realistic, controllable, and interpretable models.'
  - 'Open questions: World models lack formal state representations and long-term
