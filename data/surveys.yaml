  related_work_outline_zh:
  - 主流方向：构建动作可控的生成式模拟系统，用于自动驾驶、机器人和游戏等场景，并配套评测框架。
  - 研究共性：以动作、轨迹或上下文为条件生成未来帧，并用动作保真度、空间一致性、物理合理性或下游策略收益进行评估。
  - 关键差异：评测目标从 Minecraft 空间一致性到驾驶动作保真、机器人物理合理性、上下文强化学习零样本泛化不等；控制表示与架构也不同。
  - 趋势演进：高证据集中在 2024-2026 年，从单一模型或基准走向闭环实时模拟、物理信息系统和开放评测框架。
  - 开放问题：跨环境泛化、长时域一致性、多GPU部署可扩展性、上下文可观测假设，以及局限性说明缺失构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving and interactive video simulation, e.g., Vista
        and FAR-Drive
      what_it_solves: Provides open-loop or closed-loop systems that generate future
        frames from high-level intentions or low-level driving actions.
      what_remains_open: Generalization beyond nuScenes and long-horizon geometric/temporal
        consistency under distribution shift are not yet demonstrated.
    - line: Physics-informed embodied simulation, e.g., RoboScape
      what_it_solves: Connects video generation with physical knowledge such as temporal
        depth and keypoint dynamics for robot policy training and evaluation.
      what_remains_open: Visible evidence does not report explicit limitations or
        broader robot-setting verification, so failure boundaries remain unclear.
    - line: Benchmarks and evaluation frameworks for world-model consistency and action
        fidelity, e.g., LoopNav and Terra ACT-Bench
      what_it_solves: Quantifies spatial consistency and action adherence instead
        of relying only on frame quality.
      what_remains_open: Independent reuse outside the original datasets and compute
        conditions, as well as result coverage, remains a verification gap.
    - line: Contextual model-based RL and pretrained video simulator adaptation, e.g.,
        cRSSM and DWS
      what_it_solves: Adds context or action-conditioned modules to existing world
        models or video generators to improve zero-shot or action-controllable simulation.
      what_remains_open: Assumes observable context or inherits pretrained model bias,
        with evaluation limited to few tasks or domains.
    consensus:
    - Systems treat future-frame generation as a reusable primitive conditioned on
      actions or trajectories rather than as unconditional video generation.
    - Evaluation is expanding beyond frame quality to include action adherence, spatial
      consistency, physical plausibility, and downstream policy utility.
    - Contributions increasingly pair a model or simulator with a dataset, benchmark,
      or open evaluation artifact.
    - Closed-loop or downstream control evidence is treated as important for system
      value even when visual generation results are not fully reported.
    disagreements:
    - 'Control and supervision differ: some systems use trajectory-conditioned driving
      data, while others use observable context values or physics-oriented depth and
      keypoint signals.'
    - 'Evaluation target differs: Minecraft loop navigation, nuScenes driving action
      fidelity, robot video physical plausibility, and CARL zero-shot policy generalization.'
    - 'Architecture differs: recurrent state-space world models, multi-view diffusion
      transformers, and plug-in action modules on pretrained video generators.'
    - 'Deployment setting differs: sub-second single-GPU driving simulation, multi-domain
      game and robot simulation, and resource-unspecified benchmark construction.'
    open_questions:
    - Can spatial-consistency and action-fidelity benchmarks transfer across environments,
      sensor layouts, and simulation platforms?
    - How do closed-loop generative simulators behave under long-horizon rollouts,
      distribution shift, or multi-GPU serving requirements?
    - What known failure modes are obscured by absent limitation discussion in several
      visible system papers?
    - How much observable context is needed for contextual world models to generalize
      beyond the two reported CARL tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的驾驶与交互式视频模拟，如 Vista 和 FAR-Drive
      解决的问题: 提供开环或闭环系统，从高层意图或低层驾驶动作生成未来帧。
      尚未覆盖: 尚未证明在 nuScenes 之外以及分布偏移下的长时域几何与时间一致性。
    - 路线: 物理信息驱动的具身模拟，如 RoboScape
      解决的问题: 将视频生成与时间深度、关键点动力学等物理知识结合，用于机器人策略训练和评估。
      尚未覆盖: 可见证据未报告显式局限性或更广泛机器人设定验证，失败边界仍不明确。
    - 路线: 世界模型一致性与动作保真度基准，如 LoopNav 和 Terra ACT-Bench
      解决的问题: 量化空间一致性和动作遵循，而不是只依靠画面质量。
      尚未覆盖: 原始数据集和计算条件之外的独立复用与结果覆盖仍属验证缺口。
    - 路线: 上下文模型基强化学习与预训练视频模拟器适配，如 cRSSM 和 DWS
      解决的问题: 向现有世界模型或视频生成器加入上下文或动作条件模块，提升零样本或动作可控模拟。
      尚未覆盖: 假设上下文可观测或继承预训练模型偏差，且评估任务或领域有限。
    共识:
    - 系统将未来帧生成视为可复用的基本能力，并以动作或轨迹为条件，而非只做无条件视频生成。
    - 评估正从画面质量扩展到动作遵循、空间一致性、物理合理性和下游策略收益。
    - 工作越来越倾向于将模型或模拟器与数据集、基准或开放评测工件一起发布。
    - 闭环或下游控制证据被视为系统价值的重要体现，即使视觉生成结果未完全报告。
    分歧:
    - 控制与监督信号不同：有的系统使用轨迹条件驾驶数据，有的使用可观测上下文，有的使用深度和关键点物理信号。
    - 评测目标不同：Minecraft 环线导航、nuScenes 驾驶动作保真、机器人视频物理合理性、CARL 零样本策略泛化。
    - 架构不同：循环状态空间世界模型、多视图扩散Transformer、以及插入预训练视频生成器的动作模块。
    - 部署场景不同：单GPU亚秒级驾驶模拟、多领域游戏与机器人模拟、以及未说明资源条件的基准构建。
    开放问题:
    - 空间一致性和动作保真度基准能否跨环境、传感器布局和模拟平台迁移？
    - 闭环生成式模拟器在长时域推演、分布偏移或多GPU服务要求下表现如何？
    - 若干系统论文中缺失的局限性说明掩盖了哪些已知失败模式？
    - 上下文世界模型需要多少可观测上下文，才能泛化到两个已报告 CARL 任务之外的场景？
