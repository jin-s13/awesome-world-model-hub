  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is centered on action-conditioned,
    multi-step, video-based evaluation; recent benchmark papers add diagnostic suites
    for spatial consistency, memory, and action control, while method-oriented papers
    provide results on shared RL, driving, and robotic benchmarks.'
  - 'Shared research pattern: Work combines a dataset or task with targeted metrics
    that expose specific world-model failures—loop consistency, long-term memory,
    context generalization, visual details—and compares against baselines on shared
    benchmarks.'
  - 'Key differences: Evaluation targets range from pixel-level video fidelity and
    physical plausibility to downstream policy quality; interaction settings include
    offline rollout, closed-loop navigation, and robotic control; context and action-space
    assumptions differ across suites.'
  - 'Trend evolution: The available 2023–2026 evidence shifts from aggregate RL scores
    and video generation toward more diagnostic, open-domain, closed-loop benchmarks;
    current frontier emphasizes consistency, action control, and model-generated training/evaluation
    utility.'
  - 'Open questions: Whether diagnostic metrics align with downstream decisions, whether
    rankings are stable across implementations and compute budgets, and how well suites
    cover real deployment settings remain open; several limitations are unreported.'
  related_work_outline_zh:
  - 主流方向：世界模型基准正在围绕动作条件、多步、视频化评估展开；近期基准工作增加空间一致性、记忆和动作控制的诊断测试，方法类工作则在共享的强化学习、驾驶和机器人基准上提供结果。
  - 研究共性：多篇工作将数据集或任务与针对性指标结合，用于暴露世界模型在闭环一致性、长时记忆、上下文泛化或视觉细节方面的具体失败，并与共享基线上的基线比较。
  - 关键差异：评测目标从像素级视频保真度、物理合理性到下游策略质量不等；交互方式包括离线推演、闭环导航和机器人控制；上下文和动作空间假设也存在差异。
  - 趋势演进：现有证据集中在2023—2026年，整体从聚合强化学习分数和视频生成转向更具诊断性、开放域、闭环的基准；当前前沿更强调一致性、动作控制和模型生成数据的训练/评估效用。
  - 开放问题：诊断指标是否与下游决策一致、排名在不同实现和算力预算下是否稳定、现有套件是否覆盖真实部署场景仍未解决；若缺少限制说明和代码/数据集则视为验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Builds shared, repeatable datasets and tasks that make world-model
        claims comparable across loop-based spatial consistency, memory, action control,
        and multi-scene video prediction.
      what_remains_open: Coverage remains limited for long-horizon open-domain navigation,
        varied action spaces, and deployment settings that world models are meant
        to support.
    - line: Metric and stress-test design
      what_it_solves: Adds diagnostic probes beyond aggregate scores, such as scene-graph
        consistency, memory/action-control checks, zero-shot context generalization,
        and visual-fidelity evaluations.
      what_remains_open: It is unclear whether these proxy metrics align with downstream
        policy quality or user utility; some benchmarks stop at dataset construction
        without baseline results.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common baselines, benchmark suites, and released artifacts
        for auditing model results across Atari 100k, NuScenes, OpenDV-2K, Waymo,
        CARL, and robotic scenarios.
      what_remains_open: Ranking stability across implementations and compute budgets
        is not established; limitation reporting and complete reproducibility information
        are frequently missing.
    consensus:
    - Evaluation increasingly treats world-model quality as a multi-step, action-conditioned
      problem rather than single-frame generation or aggregate-only scoring.
    - Diagnostic metrics are used to isolate spatial-, memory-, action-, and context-generalization
      failure modes that aggregate scores may hide.
    - Shared resources—datasets, benchmarks, and open artifacts—are treated as key
      evidence for making model claims comparable and auditable.
    disagreements:
    - 'Evaluation target: some work prioritizes visual fidelity and physical plausibility
      of generated video, while other work prioritizes downstream RL or robotic policy
      quality.'
    - 'Interaction mode: closed-loop, action-controlled or revisited navigation differs
      from offline world-model rollout and video diffusion evaluation.'
    - 'Context assumptions: evaluations assume observable context variables in contextual
      RL, while open-domain benchmarks test unseen scenes and varied action spaces
      without that assumption.'
    - 'Representation and training signal: diffusion, transformer-VAE, contextual
      recurrent, and physics-informed video generation models imply different stress
      tests and diagnostic metrics.'
    - 'Deployment setting: simulation benchmarks such as Atari/Minecraft contrast
      with real-world driving or robotic data, creating different generalization requirements.'
    open_questions:
    - Do diagnostic consistency/action-control metrics predict downstream policy improvement
      or real deployment performance?
    - Are current benchmark rankings stable across implementations, compute budgets,
      and newly collected episodes?
    - Several benchmark papers release datasets without reporting baseline results;
      what baseline performance and limitations define their difficulty?
    - How well do current tasks cover long-horizon memory, cross-action-space transfer,
      and physically realistic embodied or driving settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享、可重复的数据集和任务，使世界模型在循环空间一致性、记忆、动作控制和多场景视频预测方面可比
      尚未覆盖: 对长时域开放域导航、多样动作空间和真实部署场景的覆盖仍然有限
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外引入场景图一致性、记忆/动作控制、零样本上下文泛化和视觉保真度等诊断指标
      尚未覆盖: 代理指标与下游策略质量或用户效用是否一致尚不明确；部分基准停在数据集构建而未报告基线结果
    - 路线: 可比基线与报告规范
      解决的问题: 提供共享基线、基准套件和开源工件，支持在Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL及机器人场景中审计结果
      尚未覆盖: 实现与算力预算变化下排名的稳定性未验证；局限性和完整复现信息常缺失
    共识:
    - 评测越来越把世界模型质量视为多步、动作条件化问题，而不是单帧生成或仅看总分。
    - 诊断指标被用来分离空间、记忆、动作和上下文泛化等失败模式，避免被聚合分数掩盖。
    - 共享数据集、基准和开放工件被视作使模型声明可比较、可审计的关键证据。
    分歧:
    - 评测目标：一些工作关注生成视频的视觉保真度和物理合理性，另一些关注下游强化学习或机器人策略质量。
    - 交互模式：闭环、动作控制或可回访导航与离线世界模型推演及视频扩散评估不同。
    - 上下文假设：上下文强化学习评测假设上下文可观测，而开放域基准在缺少该假设下测试未见场景和多样动作空间。
    - 表示与训练信号：扩散、Transformer-VAE、上下文循环状态空间和物理信息视频生成等模型需要不同的压力测试与诊断指标。
    - 部署场景：Atari/Minecraft等仿真基准与真实驾驶或机器人数据形成不同的泛化要求。
    开放问题:
    - 诊断一致性/动作控制指标是否能预测下游策略改进或真实部署性能？
    - 当前基准排名在不同实现、算力预算和新增数据下是否稳定？
