    evidence remains uneven.'
  - 'Key differences: They differ in deployment target (physical robots, driving simulators,
    open-world game), control interface (context values, high-level goals/trajectories,
    low-level actions), evaluation goal (spatial consistency, action fidelity, physical
    plausibility, real-robot learning speed), and latency/serving constraints.'
  - 'Trend evolution: Within the 2022–2026 evidence, work moves from online robot
    learning without simulators toward large-scale pre-trained video/diffusion simulators
    with standardized benchmarks and closed-loop low-latency serving; earlier 2015–2021
    years are represented by the packet span but not by top-paper evidence.'
  - 'Open questions: How well these systems transfer across datasets, robots, sensor
    configurations, and hardware settings; how to balance fidelity, controllability,
    and real-time serving; whether released artifacts support independent reproduction
