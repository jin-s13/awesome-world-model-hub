  related_work_outline:
  - 'Mainstream direction: Scaling transformer/diffusion world models for video prediction
    and embodied control, with generative driving/robotic video models and latent
    model-based RL as main subdirections; representative examples include MaskGWM,
    UWM, and STORM.'
  - 'Shared research pattern: World models generate future observations or latent
    rollouts conditioned on actions, context, or language, then support policy learning,
    planning, or evaluation; recent work adds long-horizon, multi-view, zero-shot,
    and consistency-focused evaluation.'
  - 'Key differences: Representations range from pixel-space video diffusion to latent
    recurrent state-space models; objectives include mask reconstruction, physics-prior
    depth/keypoint tasks, compositional language primitives, and coupled action-video
    diffusion.'
  - 'Trend evolution: Evidence moves from Dreamer-style contextual/latent RL in 2023-2024
    toward unified embodied video-action models and dedicated memory/spatial consistency
    benchmarks in 2025-2026; 2026 remains within the current frontier.'
  - 'Open questions: Whether reported gains isolate world-model contribution rather
    than planner, task prior, dataset scale, or implementation choices; missing limitations
    and reproducibility evidence remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：以Transformer/扩散世界模型为主流，覆盖驾驶与机器人视频生成，以及基于模型的强化学习潜空间方法；代表性工作包括MaskGWM、UWM、STORM。
  - 研究共性：世界模型在动作、上下文或语言条件下生成未来观测或潜变量轨迹，用于策略学习、规划或评测；近期强调长时域、多视角、零样本和一致性评测。
  - 关键差异：表示方式从像素空间视频扩散到潜变量循环状态空间；目标包括掩码重建、深度/关键点物理先验、组合语言原语、动作-视频耦合扩散。
  - 趋势演进：从Dreamer式上下文/潜变量RL（2023-2024）走向统一具身视频-动作模型与专门的记忆/空间一致性基准（2025-2026）；2026仍处当前前沿。
  - 开放问题：已报告提升是否隔离了世界模型本身的贡献，而非规划器、任务先验、数据规模或实现选择；局限性及可复现证据缺口仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world-model architectures with reconstruction and physics
        priors
      what_it_solves: Long-horizon, multi-view, and physically plausible video prediction
        from visual observations; examples include mask reconstruction, depth, keypoint
        dynamics, and compositional language primitives.
      what_remains_open: Transfer beyond reported driving/robotic datasets and automatic
        physical plausibility metrics remain under-evidenced; several abstracts lack
        explicit limitations.
    - line: Latent model-based reinforcement learning with stochastic sequence models
      what_it_solves: Compact latent dynamics for sample-efficient RL and zero-shot
        generalization when observable context variables are available.
      what_remains_open: Only limited benchmark settings are shown; observable-context
        assumption and separation of model gain from policy training are not fully
        verified.
    - line: Unified action-video diffusion interfaces
      what_it_solves: Representing policy, forward/inverse dynamics, and video generation
        in one transformer, enabling pretraining on large robot datasets and action-free
        video.
      what_remains_open: Real-robot deployment and long-horizon closed-loop control
        are not established in the abstract; contribution of coupling versus data
        scale remains unclear.
    - line: World-model consistency and action-control evaluation
      what_it_solves: Benchmarks for memory/spatial/action-control consistency beyond
        pixel-level generation quality, using loop navigation, scene graph scores,
        and closed-loop revisited settings.
      what_remains_open: Metric-to-task transfer is not yet shown; one benchmark reports
        construction without experimental results; coverage is limited to simulated/game-like
        scenes.
    - line: Method evidence and ablation protocol
      what_it_solves: Distinguishing method contribution from dataset, baseline, metric,
        and implementation effects.
      what_remains_open: The available packet lacks consistent limitation fields,
        controlled ablations, and citation/reproducibility evidence for several top
        methods, so this separation remains incomplete.
    consensus:
    - Recent work converges on learning predictive world models from visual observations
      and actions or context, then using the learned dynamics for policy training
      or evaluation.
    - 'There is a shared shift toward stronger evaluation: long-horizon rollout, multi-view
      prediction, zero-shot transfer, physical plausibility, and memory/action consistency.'
    - Transformer and diffusion architectures are common across video generation and
      action-coupled methods, while latent state-space models remain common for sample-efficient
      RL.
    - Missing limitation statements and partial reproducibility evidence are a cross-paper
      verification gap.
    disagreements:
    - 'Representation: latent recurrent state-space rollouts versus pixel-space video
      generation versus unified action-video diffusion.'
    - 'Training objectives: mask reconstruction, variational sequence modeling, physics-informed
      depth/keypoint tasks, compositional language parsing, or coupled action prediction.'
    - 'Evaluation targets: RL sample efficiency and zero-shot policy generalization
      versus visual fidelity and physical plausibility versus benchmarked consistency
      and action control.'
    - 'Action/supervision assumptions: observable context values, action-free video
      pretraining, or language-parsed primitive combinations differ across settings.'
    open_questions:
    - Do reported improvements on Atari 100k, CARL, Nuscenes/OpenDV-2K/Waymo, RT-X,
      Minecraft, and MIND scenes transfer to real-world or unseen dynamics?
    - How much of policy improvement is due to the world model rather than the planner,
      policy optimizer, dataset scale, or action-interface design?
    - Which consistency metrics predict downstream planning and control success, and
      what are their failure modes under distribution shift?
    - What ablation evidence is missing for separating architecture changes from training
      recipes, data diversity, and baseline strength in high-ranking works?
    - Can action-free video, action-labeled robot data, and context-conditional dynamics
      be combined without introducing hidden assumptions about observability or primitive
      coverage?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带重建或物理先验的生成式视频世界模型架构
      解决的问题: 从视觉观测生成长时域、多视角和物理更合理的视频；包括掩码重建、深度、关键点动力学与组合语言原语等。
      尚未覆盖: 超出驾驶/机器人数据集的迁移性以及自动物理一致性度量仍缺乏证据；若干摘要未给出显式局限。
    - 路线: 基于随机序列模型的潜空间模型化强化学习
      解决的问题: 学习紧凑潜状态动力学，实现样本高效RL，并在可观测上下文变量可用时改进零样本泛化。
      尚未覆盖: 仅展示有限基准设置；上下文可观测假设、模型收益与策略训练的分离尚未完全验证。
    - 路线: 动作-视频耦合扩散接口
      解决的问题: 在统一Transformer中表示策略、前向/逆动力学和视频生成，支持大规模机器人数据及无动作视频预训练。
      尚未覆盖: 真实机器人部署与长时域闭环控制未在摘要中证实；耦合贡献与数据规模贡献仍不清晰。
    - 路线: 世界模型一致性与动作控制评测
      解决的问题: 用循环导航、场景图分数和闭环重访设定，评测记忆/空间/动作控制，超越像素级生成质量。
      尚未覆盖: 指标到下游任务的迁移尚未证明；一个基准只报告构建而无实验结果；场景覆盖限于模拟/游戏。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 可用证据包中若干高排名工作缺少一致的局限性、受控消融以及可复现/引用证据，分离仍不完整。
    共识:
    - 近期工作趋向于从视觉观测和动作或上下文学习预测性世界模型，并将学习到的动力学用于策略训练或评测。
    - 评测从单步视觉相似性转向长时域、多视角、零样本、物理合理性和记忆/动作一致性。
    - Transformer与扩散架构在视频生成和动作耦合方法中常见，潜状态空间模型在样本高效RL中仍常见。
    - 缺少局限性说明和可复现证据不完整是跨论文的验证缺口。
    分歧:
    - 表示层级：潜变量循环状态空间轨迹、像素空间视频生成与统一动作-视频扩散之间存在差异。
    - 训练目标：掩码重建、变分序列建模、物理先验深度/关键点任务、组合语言解析或耦合动作预测不同。
    - 评测目标：RL样本效率与零样本策略泛化、视觉保真度与物理合理性、一致性与动作控制基准各有侧重。
    - 动作与监督假设：上下文可观测、无动作视频预训练、语言解析原语组合等设定不一致。
    开放问题:
    - 已报告在Atari 100k、CARL、Nuscenes/OpenDV-2K/Waymo、RT-X、Minecraft和MIND场景的提升能否迁移到真实世界或未见动力学？
    - 策略改进中有多少来自世界模型本身，而非规划器、策略优化器、数据规模或动作接口设计？
    - 哪些一致性指标能预测下游规划与控制成功，其分布偏移下的失效模式是什么？
    - 高排名工作中缺少哪些消融证据来分离架构变化、训练配方、数据多样性和基线强度？
    - 能否在无动作视频、动作标注机器人数据与上下文条件动力学之间组合，而不引入可观测性或原语覆盖的隐藏假设？
