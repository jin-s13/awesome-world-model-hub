  related_work_outline:
  - 'Mainstream direction: Diffusion Transformer video world models applied to driving
    and embodied tasks, often with action conditioning.'
  - 'Shared research pattern: Coupling generative objectives with auxiliary tasks
    such as mask reconstruction, depth, keypoints, or action prediction to make predictions
    more usable for control.'
  - 'Key differences: Architecture and supervision vary between unified video-action
    diffusion, compositional language-driven generation, physics-informed generation,
    and latent state-space model-based RL.'
  - 'Trend evolution: Moving from sample-efficient Atari benchmarks toward large-scale
    robotic and driving video prediction, plus closed-loop memory and action consistency
    evaluation.'
  - 'Open questions: How to ensure long-horizon memory, spatial consistency, out-of-distribution
    generalization, and rigorous isolation of model contribution from surrounding
    pipeline choices.'
  related_work_outline_zh:
  - 主流方向：扩散Transformer与生成式视频世界模型主导，面向驾驶和具身场景。
  - 研究共性：将动作条件、物理约束或上下文纳入动力学与视频生成，并关注策略可用性。
  - 关键差异：表示在统一视频-动作扩散、组合式语言生成、物理信息生成和潜在状态空间之间分化。
  - 趋势演进：从Atari样本效率评测转向大规模机器人/驾驶视频预测、闭环记忆与动作一致性评测。
  - 开放问题：长期记忆一致性、跨动作泛化、物理合理性，以及模型贡献与系统选择的隔离证据。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based generative world modeling for multimodal prediction
      what_it_solves: Learns high-dimensional video dynamics and supports long-horizon
        or multi-view generation under action, language, or physics constraints.
      what_remains_open: Long-term memory consistency, physical plausibility, and
        generalization outside the training scene or action distribution remain weakly
        verified.
    - line: Latent dynamics world models for model-based reinforcement learning
      what_it_solves: Enables sample-efficient policy learning by training agents
        on imagined rollouts and contextual latent transitions instead of only real
        interactions.
      what_remains_open: Context observability is assumed, evaluation is narrow on
        limited benchmark tasks, and the model contribution is hard to separate from
        the policy or planner.
    - line: Compositional and action-interface world models
      what_it_solves: Decomposes instructions or video-action modalities into controllable
        parts for planning, policy learning, and action-free video pretraining.
      what_remains_open: Generalization to novel primitives and robust closed-loop
        action control are not established beyond combinations seen during training.
    - line: World model evaluation protocols
      what_it_solves: Quantifies properties beyond pixel fidelity, including spatial
        loop closure, memory consistency, and action-controllability.
      what_remains_open: Dataset-focused work lacks reported experimental baselines,
        and metric sensitivity across scenes and action spaces is still unproven.
    consensus:
    - Recent work commonly uses transformer or diffusion architectures to model high-dimensional
      visual dynamics instead of only low-dimensional state transitions.
    - Action, context, or language conditioning is widely treated as necessary for
      making world models useful for control and generalization.
    - Auxiliary objectives such as masking, depth, keypoints, physics prediction,
      or action prediction are used to improve future consistency or controllability.
    - Evaluation is shifting from visual fidelity alone toward long-horizon, closed-loop,
      and cross-action generalization properties.
    disagreements:
    - 'Representation differs: unified video-action diffusion, latent recurrent state-space
      models with explicit context, language-factorized compositional generation,
      and physics-informed generative models.'
    - 'Supervision signals differ: mask reconstruction, action control, observable
      context variables, depth or keypoint signals, and scene-graph consistency metrics.'
    - 'Evaluation targets differ: Atari sample efficiency, zero-shot contextual reinforcement
      learning, robot video planning, and spatial or memory consistency in open-domain
      scenes.'
    - 'Interaction settings differ: open-loop video prediction, imagination-based
      policy training, closed-loop action-conditioned evaluation, and action-free
      video pretraining.'
    open_questions:
    - Can diffusion-based world models preserve open-domain long-term memory and spatial
      consistency under action-conditioned closed-loop rollouts?
    - To what extent do contextual and compositional world models generalize to contexts
      or primitives not present in training, beyond limited benchmark tasks?
    - Do physics-informed auxiliary objectives improve physical plausibility and downstream
      policy utility across diverse robotic and driving scenarios, or only within
      training distributions?
    - Can current evidence isolate the contribution of learned dynamics from the planner,
      policy, action representation, and implementation choices?
    - Can dataset- and benchmark-oriented evaluations produce reproducible quantitative
      baselines for memory, consistency, and action control?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的生成式世界建模
      解决的问题: 学习高维视频动力学，支持长时域、多视角或具身场景预测。
      尚未覆盖: 长期记忆一致性、物理合理性以及训练场景/动作分布之外的泛化仍缺少可靠验证。
    - 路线: 潜在动力学世界模型与基于模型的强化学习
      解决的问题: 通过想象轨迹和上下文潜在转移进行样本高效策略学习。
      尚未覆盖: 假设上下文可观测，任务覆盖较窄，且模型贡献难以与策略或规划器分离。
    - 路线: 组合式与动作接口世界模型
      解决的问题: 将指令或视频-动作模态分解为可组合部件，用于规划、策略学习与无动作视频预训练。
      尚未覆盖: 对新原语的泛化，以及闭环动作控制的稳健性尚未在训练组合之外得到证明。
    - 路线: 世界模型评测协议
      解决的问题: 在像素保真之外量化空间环路闭合、记忆一致性和动作可控性。
      尚未覆盖: 数据集导向工作缺少实验基线结果，指标在不同场景和动作空间下的敏感性仍待检验。
    共识:
    - 近期研究普遍采用Transformer或扩散架构对高维视觉动态建模，而非仅建模低维状态转移。
    - 动作、上下文或语言条件被广泛视为使世界模型服务于控制与泛化的关键。
    - 通过掩码、深度、关键点、物理预测或动作预测等辅助目标提升未来一致性与可控性。
    - 评估正从单纯视觉保真转向长时域、闭环和跨动作泛化属性。
    分歧:
    - 表示方式不同：统一视频-动作扩散、带显式上下文的潜在递归状态空间、语言因子化组合生成，以及物理信息生成模型。
    - 监督信号不同：掩码重建、动作控制、可观测上下文变量、深度或关键点信号，以及场景图一致性指标。
    - 评测目标不同：Atari样本效率、零样本上下文强化学习、机器人视频规划，以及开放域空间或记忆一致性。
    - 交互模式不同：开环视频预测、想象策略训练、闭环动作条件评测和无动作视频预训练。
    开放问题:
    - 扩散世界模型能否在动作条件闭环推演中保持开放域长期记忆和空间一致性？
    - 上下文和组合式世界模型在训练分布之外的原语或上下文上泛化程度如何？
    - 物理信息辅助目标能否在多样化机器人和驾驶场景中稳定提升物理合理性与下游策略效用？
    - 现有证据能否隔离动力学模型与规划器、策略、动作表示和实现选择的具体贡献？
    - 数据集和基准导向评测能否为记忆、一致性和动作控制提供可复现的定量基线？
