  related_work_outline:
  - 'Mainstream direction: Building world models for embodied applications (robotics,
    driving, games) that integrate video generation with actions, physical priors,
    or language, targeting generalizable and physically plausible simulation.'
  - 'Shared research pattern: Transformer-based architectures (diffusion, VAE, recurrent)
    trained on visual-action sequences or video via self-supervised/RL objectives,
    evaluated on domain-specific benchmarks (nuScenes, Atari, RT-X, CARL, Minecraft).'
  - 'Key differences: Representations span diffusion transformers, VAE-Transformer
    hybrids, and recurrent state-space models; supervision varies from paired video-action
    to language-only or context; evaluation targets include video fidelity, policy
    performance, spatial consistency, and physical plausibility, with no unified metric.'
  - 'Trend evolution: Within the 2023–2026 frontier, work moved from efficient Atari
    world models (STORM) to compositional and physics-informed world models for robotics
    and driving (RoboDreamer, MaskGWM, RoboScape, UWM), and now toward joint optimization
    of visual, action, and physical properties via RL (PAVXploreRL), with growing
    focus on zero-shot generalization and large-scale pretraining.'
  - 'Open questions: How to transfer simulation-trained world models to real-world
    deployment; how to generalize to unseen objects and dynamics without perfect context;
    and how to establish cross-domain benchmarks for spatial consistency and physical
    plausibility.'
  related_work_outline_zh:
  - 主流方向：面向具身应用（机器人、驾驶、游戏）构建世界模型，将视频生成与动作、物理先验或语言结合，追求可泛化且物理合理的仿真。
  - 研究共性：采用基于Transformer的架构（扩散、VAE、循环）在视觉-动作序列或视频上通过自监督/强化学习目标训练，在领域特定基准（nuScenes、Atari、RT-X、CARL、Minecraft）上评估。
  - 关键差异：表示方式从扩散Transformer、VAE-Transformer混合到循环状态空间模型不等；监督信号有配对的视频-动作、仅语言或上下文；评测目标包括视频保真度、策略性能、空间一致性和物理合理性，缺乏统一度量。
  - 趋势演进：在2023–2026前沿期内，从高效Atari世界模型（STORM）发展到面向机器人和驾驶的组合式与物理信息世界模型（RoboDreamer、MaskGWM、RoboScape、UWM），进一步到通过强化学习联合优化视觉、动作和物理属性（PAVXploreRL），对零样本泛化和大规模预训练的关注日益增强。
  - 开放问题：如何将仿真训练的世界模型迁移到真实部署；在缺乏完美上下文时如何泛化到未见物体和动力学；如何建立跨领域基准以评估空间一致性和物理合理性。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and embodied tasks by compositional
        video generation, physics-informed joint training, or unified diffusion of
        video and actions, enabling visual-motor planning and policy learning.
      what_remains_open: Cross-embodiment and cross-dataset transfer; real-world validation;
        combinatorial generalization to entirely novel primitives; fidelity of physical
        models in complex interactions such as deformable objects or contacts.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Generalizable driving video prediction with long-horizon and
        multi-view capabilities using diffusion transformers and mask reconstruction,
        supporting scene simulation.
      what_remains_open: Alignment between simulation gains and real-world safety
        or operational metrics; generalization to unseen driving scenarios; closed-loop
        policy evaluation beyond open-loop video prediction.
    - line: Interactive agents and games
      what_it_solves: Efficient world models for policy learning in Atari and Minecraft,
        and evaluation benchmarks for spatial consistency via loop-based navigation.
      what_remains_open: Transfer from game environments to real-world tasks; robustness
        when environment rules or goals change; correlation between spatial consistency
        metrics and downstream policy performance.
    consensus:
    - World model applications commonly adopt video generation as a core component
      to predict future visual states.
    - Transformer and diffusion-based architectures dominate, with physical priors
      (depth, keypoints) increasingly incorporated to improve visual realism.
    - Large-scale pretraining or compositional designs are used to enhance generalization
      beyond training distributions.
    - Evaluation remains mostly in simulation; real-world closed-loop validation is
      rarely conducted.
    disagreements:
    - 'Supervision signals differ: some works require paired video-action data (UWM,
      MaskGWM), while others use language-only (RoboDreamer) or exploit action-free
      videos (UWM fine-tuning).'
    - Architectural choices diverge among diffusion transformers (MaskGWM, UWM), VAE-Transformer
      hybrids (STORM), and recurrent state-space models (cRSSM), each trading off
      efficiency and stochasticity differently.
    - Evaluation metrics vary widely—human-normalized Atari scores, video FID, physical
      plausibility, spatial consistency (SGCS), and zero-shot success rate—preventing
      direct comparison across methods.
    - Application domains (driving, robotics, games) impose different constraints
      on real-time performance, safety, and physical interaction, leading to divergent
      design priorities.
    open_questions:
    - Can video plans generated by world models reliably guide robot execution in
      real-world settings with distribution shift?
    - How to achieve zero-shot generalization of world models when context variables
      are not fully observable?
    - What benchmark suite could unify evaluation of spatial consistency and physical
      plausibility across domains like driving, manipulation, and open-world navigation?
