  related_work_outline:
  - 'Mainstream direction: Action-conditioned video and rollout benchmarks are the
    dominant evaluation route for world models, spanning driving, robotics, game,
    and embodied settings; recent work adds memory, spatial consistency, and action-control
    probes.'
  - 'Shared research pattern: Papers construct or reuse controlled environment data
    and report visual generation quality, downstream policy utility, or consistency
    metrics, often comparing against state-of-the-art baselines on public datasets.'
  - 'Key differences: Evaluation substrate differs across simulated game environments,
    Minecraft and robotic navigation, driving video, and robot manipulation; primary
    metrics range from human-normalized Atari scores to scene-graph consistency, physical
    plausibility, and memory/action control.'
  - 'Trend evolution: The visible top papers are concentrated in 2023-2026; focus
    is shifting from aggregate Atari/RL benchmark scores toward specialized datasets
    and diagnostic metrics that test long-horizon, multi-view, cross-action, and memory
    consistency.'
  - 'Open questions: Whether proxy metrics align with downstream decisions, whether
    findings generalize beyond narrow tasks and observed contexts, and whether benchmark
    results remain stable across implementations, compute budgets, and baseline tuning.'
  related_work_outline_zh:
  - 主流方向：动作条件视频与 rollout 基准是世界模型评估的主要路线，覆盖驾驶、机器人、游戏和具身环境；近期工作增加记忆、空间一致性和动作控制探针。
  - 研究共性：工作构建或复用受控环境数据，报告视觉生成质量、下游策略效用或一致性指标，并在公开数据集上与最新基线比较。
  - 关键差异：评估载体在模拟游戏环境、Minecraft 与机器人导航、驾驶视频和机器人操作之间不同；主要指标从 Atari 人类归一化得分到场景图一致性、物理合理性及记忆/动作控制不等。
  - 趋势演进：可观察的顶部论文集中在 2023-2026 年，趋势从 Atari/RL 总体得分转向专用数据集和诊断指标，以测试长时域、多视角、跨动作和记忆一致性。
  - 开放问题：代理指标是否与下游决策一致，发现能否泛化到更广泛任务和未观察上下文，基准结论在不同实现、算力预算和基线调优下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, especially via controlled action-conditioned rollouts and loop-based
        or revisited navigation.
      what_remains_open: Coverage of real deployment settings is incomplete; LoopNav's
        visible evidence reports dataset construction without experimental results,
        and MIND exposes long-term memory and cross-action-space generalization gaps.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction quality beyond aggregate visuals, including
        scene-graph spatial consistency, memory consistency, action control, physics
        plausibility, and downstream RL utility.
      what_remains_open: Whether these proxies align with the downstream decisions
        users care about, and whether visual fidelity or physical plausibility is
        the right diagnostic for decision-relevant world models.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through public benchmarks such as Atari
        100k, nuScenes, OpenDV-2K, Waymo, CARL, and Minecraft-derived datasets with
        common baselines.
      what_remains_open: Stability across implementations and compute budgets is not
        established; many top papers lack visible limitation details or citation and
        artifact evidence, leaving reproducibility gaps unverified.
    consensus:
    - World-model evaluation is converging on action-conditioned video generation
      or rollout benchmarks across embodied, driving, robotics, and game settings.
    - Recent evaluation designs add consistency and control diagnostics beyond pixel-level
      visual quality, including spatial consistency, memory consistency, and action
      controllability.
    - Downstream policy utility is treated as a key signal, with several methods reporting
      human-normalized RL or policy-training improvements rather than generation quality
      alone.
    - Standardized public environment data are used to make claims comparable across
      methods, even when metric emphasis differs.
    disagreements:
    - 'Evaluation substrates differ: simulated game environments and Minecraft-based
      navigation stress controlled interaction, while driving and robot datasets stress
      real-world visual dynamics and embodiment.'
    - 'Primary success criteria differ: human-normalized game scores versus scene-graph
      consistency versus visual fidelity and physical plausibility versus memory and
      action-control accuracy.'
    - Some work evaluates open-loop generation or standard rollout benchmarks, while
      newer efforts emphasize closed-loop revisited or loop-based navigation to expose
      consistency failures.
    - 'Context handling differs: explicit observable context for zero-shot dynamics
      generalization, physics-informed joint training, or independent modality diffusion
      timesteps for video and action.'
    - Limitation and reproducibility disclosure is uneven, making cross-method conclusions
      sensitive to missing implementation and baseline details.
    open_questions:
    - How well do scene-graph, memory, action-control, and human-normalized benchmark
      scores predict downstream decision quality in deployment settings?
    - Can current world-model benchmarks cover long-horizon, multi-view, cross-action,
      and unseen-context settings observed in real driving, robotics, and navigation
      tasks?
    - Do benchmark conclusions remain stable across implementations, compute budgets,
      and baseline tuning given incomplete limitation and artifact reporting?
    - What evaluation protocols can separate visual realism from physically correct
      or decision-relevant dynamics when both are reported as world-model quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，通过受控动作条件 rollout、循环或重访导航，让世界模型主张具备可比性。
      尚未覆盖: 真实部署设置覆盖不完整；LoopNav 的可见证据只报告数据集构建而无实验结果，MIND 暴露长期记忆一致性和跨动作空间泛化缺口。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体视觉质量之外检验预测能力，包括场景图空间一致性、记忆一致性、动作控制、物理合理性及下游强化学习效用。
      尚未覆盖: 这些代理指标是否与用户真正关心的下游决策一致，以及视觉保真还是物理合理性更适合作为决策相关世界模型的诊断信号。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、nuScenes、OpenDV-2K、Waymo、CARL 和 Minecraft 数据集等公开基准与统一基线，让结果可审计。
      尚未覆盖: 不同实现和算力预算下的结论稳定性尚未建立；许多论文缺少可见的局限性说明或引用与工件证据，复现缺口未验证。
    共识:
