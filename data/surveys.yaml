  related_work_outline:
  - 'Mainstream direction: constructing dedicated world-model benchmarks that evaluate
    spatial consistency, memory retention, and action control, moving beyond per-frame
    video prediction quality.'
  - 'Shared research pattern: using video generation as a proxy for world-model capability,
    and designing metrics that capture temporal stability and contextual coherence
    rather than pixel-level similarity.'
  - 'Key differences: some benchmarks operate in closed simulated environments (Minecraft,
    Atari) while others use real-world driving video; spatial consistency is quantified
    via scene-graph scores in one line and via loop-based revisiting in another.'
  - 'Trend evolution: from reusing general-purpose benchmarks (Atari 100k, NuScenes)
    toward purpose-built world-model benchmarks (LoopNav, MIND) that probe long-term
    memory and controllability; the frontier is shifting from pixel accuracy to semantic-level
    consistency.'
  - 'Open questions: how to build a unified benchmark that spans simulation, real
    video, and robotics tasks; whether current proxy metrics predict downstream decision
    quality; and how stable benchmark conclusions are under different compute budgets
    and implementations.'
  related_work_outline_zh:
  - 主流方向：构建专门的世界模型基准，评估空间一致性、记忆保持和动作控制，超越单帧视频预测质量。
  - 研究共性：以视频生成作为世界模型能力的代理，设计捕捉时间稳定性和上下文连贯性的指标，而非像素级相似度。
  - 关键差异：部分基准运行于封闭模拟环境（Minecraft、Atari），另一些使用真实驾驶视频；空间一致性的一种量化方式采用场景图分数，另一种则通过循环回访来度量。
  - 趋势演进：从复用通用基准（Atari 100k、NuScenes）转向构建专门的世界模型基准（如LoopNav、MIND），以探测长期记忆和可控性；前沿正从像素精度转向语义级一致性。
  - 开放问题：如何构建覆盖模拟、真实视频和机器人任务的统一基准；当前代理指标能否预测下游决策质量；不同计算预算和实现下基准结论的稳定性如何。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared environments and tasks so that spatial consistency,
        memory retention, and action controllability of world models can be compared
        across studies.
      what_remains_open: Existing datasets are either confined to game-like settings
        (Minecraft, Atari) or lack the physical interaction diversity needed for real-world
        robotics; whether the task distribution covers the settings where world models
        are expected to help is unclear.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond pixel-level reconstruction error to probe temporal
        stability, contextual coherence, and action responsiveness, surfacing failure
        modes that aggregate scores hide.
      what_remains_open: Alignment between proxy metrics (scene-graph consistency,
        memory scores) and downstream decision quality has not been verified; no metric
        currently captures utility for robotic policy learning or deployment.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditability through widely adopted benchmarks (Atari
        100k, NuScenes) and open-source code, allowing results to be reproduced and
        ranked.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, random seeds, and compute budgets is rarely reported; no
        unified reporting protocol exists for compute cost or sensitivity.
    consensus:
    - World-model evaluation must extend beyond single-step video prediction to multi-dimensional
      assessment of spatial consistency, memory, and action control.
    - Existing benchmarks such as Atari 100k and NuScenes provide useful signals on
      visual fidelity and agent performance, but they do not fully capture the demands
      of real-world tasks.
    - Open-source datasets and evaluation frameworks (e.g., LoopNav, MIND) are critical
      for reproducibility and for driving progress in the field.
    disagreements:
    - Whether evaluation environments should be simulated (Minecraft, Atari) for controlled
      variables or real-world driving videos (NuScenes, Waymo) for ecological validity.
    - 'How spatial consistency should be quantified: scene-graph-based scores that
      are invariant to pixel variation (LoopNav) versus loop-based revisiting and
      action control metrics (MIND).'
    - Whether benchmarks should prioritize generative quality (visual realism) or
      downstream task performance (agent success rate), as the two are not always
      aligned.
    open_questions:
    - Can a single benchmark suite cover heterogeneous environments (simulation, real
      video, robotics) while maintaining controlled evaluation?
    - Do the proposed consistency metrics reliably predict the performance of a world
      model when used for robot policy training or decision making?
    - How sensitive are benchmark rankings to implementation choices and compute budgets,
      and what reporting standards would ensure robust comparisons?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享环境和任务，使世界模型的空间一致性、记忆保持和动作可控性可跨研究比较。
      尚未覆盖: 现有数据集要么局限于游戏类环境（Minecraft、Atari），要么缺乏真实世界机器人所需的物理交互多样性；任务分布是否覆盖了世界模型预期发挥作用的设置尚不明确。
    - 路线: 指标与压力测试设计
      解决的问题: 超越像素级重建误差，探测时间稳定性、上下文连贯性和动作响应能力，揭示总分隐藏的失败模式。
      尚未覆盖: 代理指标（场景图一致性、记忆得分）与下游决策质量之间的一致性尚未验证；目前没有指标能捕捉对机器人策略学习或部署的效用。
    - 路线: 可比基线与报告规范
      解决的问题: 通过广泛采用的基准（Atari 100k、NuScenes）和开源代码实现可审计性，使结果可复现和可排名。
      尚未覆盖: 基准结论在不同实现、随机种子和计算预算下是否稳定鲜有报告；尚无统一的报告规范来记录计算成本或敏感性。
    共识:
    - 世界模型评估必须从单步视频预测扩展到空间一致性、记忆和动作控制的多维度评估。
    - 现有的Atari 100k和NuScenes等基准在视觉保真度和智能体性能方面提供了有用信号，但无法完全捕捉真实世界任务的需求。
    - 开源数据集和评估框架（如LoopNav、MIND）对可复现性和推动领域进展至关重要。
    分歧:
    - 评估环境应使用模拟环境（Minecraft、Atari）以控制变量，还是使用真实驾驶视频（NuScenes、Waymo）以获得生态效度。
    - 空间一致性应如何量化：基于场景图且对像素变化不变的分数（LoopNav），还是基于循环回访和动作控制的指标（MIND）。
    - 基准应优先考虑生成质量（视觉逼真度）还是下游任务性能（智能体成功率），二者并不总是一致。
    开放问题:
    - 能否构建一个统一的基准套件，在保持受控评估的同时覆盖异构环境（模拟、真实视频、机器人）？
    - 当前提出的一致性指标是否可靠地预测世界模型在机器人策略训练或决策中的表现？
    - 基准排名对实现选择和计算预算的敏感性如何，需要什么样的报告标准才能确保稳健比较？
