  related_work_outline:
  - 'Mainstream direction: Building action-controllable video generation world models
    as interactive simulators for autonomous driving and robotics, with growing emphasis
    on closed-loop evaluation and real-time deployment.'
  - 'Shared research pattern: Leveraging large-scale pre-trained video generative
    backbones (diffusion or autoregressive) and augmenting them with action-conditioning
    modules, physics-informed losses, or structured control to improve fidelity and
    controllability; evaluation relies on domain-specific benchmarks and metrics like
    FID, FVD, and action fidelity scores.'
  - 'Key differences: Model architecture (diffusion transformers vs. autoregressive
    vs. recurrent state-space), control modality (high-level commands vs. low-level
    trajectories vs. context variables), evaluation target (spatial consistency vs.
    action adherence vs. visual quality), and deployment setting (open-loop benchmark
    vs. closed-loop simulation vs. policy training).'
  - 'Trend evolution: From 2020–2023 foundational world model architectures (e.g.,
    Dreamer) to 2024–2025 specialized driving and robotics simulators with improved
    controllability, and by 2026 toward systematic surveys, closed-loop autoregressive
    systems, and real-time interactive serving—indicating a shift from offline generation
    to deployable, interactive simulation pipelines.'
  - 'Open questions: How to unify evaluation across physical plausibility, spatial
    consistency, and action fidelity; how to guarantee generalization to out-of-distribution
    scenarios; how to balance high fidelity with sub-second latency for real-time
    use; whether current benchmarks capture real-world deployment challenges such
    as sensor noise and dynamic environments; and how to achieve independent reproducibility
    across teams and hardware.'
  related_work_outline_zh:
  - 主流方向：构建动作可控的视频生成世界模型，作为自动驾驶和机器人领域的交互式模拟器，日益重视闭环评估和实时部署。
  - 研究共性：利用大规模预训练视频生成骨干网络（扩散或自回归），通过动作条件模块、物理信息损失或结构化控制增强保真度和可控性；评估依赖领域特定基准和指标，如FID、FVD和动作忠实度分数。
