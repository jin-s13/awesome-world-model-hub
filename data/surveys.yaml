  related_work_outline:
  - 'Mainstream direction: Building world-model evaluation datasets and metrics for
    spatial consistency, memory consistency, and action control, while model papers
    validate on standard RL, driving, and robotic benchmarks.'
  - 'Shared research pattern: Work focuses on future observation generation or prediction
    quality, with long-horizon, spatiotemporal consistency, visual detail, or downstream
    policy utility as evaluation targets.'
  - 'Key differences: Dataset/benchmark papers construct new tasks and metrics, whereas
    method papers use existing benchmarks; evaluation targets vary across spatial
    consistency, memory/action control, zero-shot generalization, and visual fidelity.'
  - 'Trend evolution: Within the 2023-2026 frontier, evaluation is moving from Atari
    and contextual RL benchmarks toward open-domain and embodied memory, action-control,
    and spatial-consistency stress tests for diffusion and transformer world models.'
  - 'Open questions: Whether proxy metrics align with downstream decisions; whether
    current datasets cover real-world distribution shifts; and whether long-term memory
    and cross-action-space generalization hold.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正围绕空间一致性、记忆一致性和动作可控性构建数据集与指标，同时方法论文复用标准强化学习、驾驶和机器人基准进行验证。
  - 研究共性：工作聚焦未来观测的生成或预测质量，并以长时域、时空一致性、视觉细节或下游策略效用作为评测重点。
  - 关键差异：数据集与基准类工作构建新任务和指标，方法类工作复用已有基准；评测目标分别侧重空间一致性、记忆/动作控制、零样本泛化和视觉保真度。
  - 趋势演进：在2023-2026当前前沿内，评测重心从Atari和上下文强化学习基准转向面向开放域、具身记忆、动作控制和空间一致性的扩散与Transformer世界模型压力测试。
  - 开放问题：代理指标是否与下游决策一致；当前数据集是否覆盖真实场景分布偏移；长时记忆与跨动作空间泛化是否成立。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets to make world-model claims
        comparable across spatial, memory, and action-control abilities.
      what_remains_open: Whether current task distributions cover real-world settings
        such as driving, robotic manipulation, or diverse action spaces; evidence
        is limited to Minecraft loops and curated open-domain videos.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial consistency, long-horizon
        memory, action control, and zero-shot generalization beyond aggregate scores.
      what_remains_open: Alignment between proxy metrics such as scene graph consistency
        or human-normalized game scores and downstream policy usefulness is not fully
        established.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared benchmarks and baselines such as Atari 100k, contextual
        RL tasks, driving datasets, and robotic video data to audit method performance.
      what_remains_open: Stability of conclusions across implementation choices, compute
        budgets, and missing artifacts is uncertain; several records lack accessible
        citation metadata or limitation fields.
    consensus:
    - World models are evaluated by future video or state prediction quality and by
      downstream policy performance, with shared benchmarks reused across papers.
    - Spatiotemporal consistency, memory consistency, and action controllability are
      treated as important evaluation dimensions beyond pixel-level reconstruction.
    - Method papers rely on existing benchmarks for comparison, while benchmark papers
      introduce datasets and metrics to expose gaps in current models.
    disagreements:
    - 'Representation: discrete latent variables, diffusion models, Transformer plus
      VAE, and unified video-action diffusion are chosen differently.'
    - 'Supervision and evaluation target: visual fidelity, scene graph consistency,
      action controllability, and zero-shot generalization are emphasized differently.'
    - 'Interaction mode: open-loop prediction on static benchmark videos versus closed-loop
      navigation and action-conditioned generation.'
    - 'Deployment setting: game environments, Minecraft, driving, and robotic tasks
      differ in dynamics and evaluation constraints.'
    open_questions:
    - Do offline benchmark metrics transfer to downstream decision quality in closed-loop
      embodied tasks?
    - How well do Minecraft or curated video benchmarks cover real-world driving and
      robotic distribution shifts?
    - Can world models maintain long-term memory consistency and generalize across
      unseen action spaces?
    - Several papers lack accessible OpenAlex identifiers or limitation fields, leaving
      reproducibility and failure-mode evidence as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型在空间、记忆和动作控制等能力上的主张可比较。
      尚未覆盖: 当前任务分布是否覆盖真实驾驶、机器人操作或多样动作空间；证据限于Minecraft循环导航和精选开放域视频。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、空间一致性、长程记忆、动作控制和零样本泛化。
      尚未覆盖: 场景图一致性、人类归一化游戏分数等代理指标与下游策略效用之间的一致性尚未充分验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、上下文强化学习任务、驾驶数据集和机器人视频数据等共享基准与基线，使结果可审计。
      尚未覆盖: 结果在不同实现、算力预算和缺失工件下的稳定性不确定；若干记录缺少可获取的引用元数据或局限性字段。
    共识:
    - 世界模型评估同时关注未来视频或状态预测质量以及下游策略表现，并复用共享基准。
    - 时空一致性、记忆一致性和动作可控性被视为像素级重建之外的重要评测维度。
    - 方法论文依赖已有基准进行对比，基准论文则通过新数据集和指标揭示当前模型缺口。
    分歧:
    - 表示方式：离散潜变量、扩散模型、Transformer加VAE、视频-动作联合扩散等选择不同。
    - 监督与评测目标：视觉保真度、场景图一致性、动作可控性和零样本泛化被不同程度强调。
    - 交互模式：静态基准视频上的开环预测与闭环导航、动作条件生成之间存在差异。
    - 部署场景：游戏环境、Minecraft、驾驶和机器人任务在动力学和评测约束上不同。
    开放问题:
    - 离线基准指标能否在闭环具身任务中转化为下游决策质量？
    - Minecraft或精选视频基准在多大程度上覆盖真实驾驶与机器人分布偏移？
    - 世界模型能否在长时域内保持记忆一致性并跨未知动作空间泛化？
    - 若干论文缺少可获取的OpenAlex标识或局限性字段，需将可复现性与失效模式视为证据缺口。
