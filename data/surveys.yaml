  related_work_outline:
  - 'Mainstream direction: domain-specific world models for interactive embodied applications,
    especially autonomous driving, robot manipulation/control, and game or interactive
    environments.'
  - 'Shared research pattern: learn predictive world models from high-dimensional
    observations and incorporate actions, context, or physics to support policy learning,
    simulation, or generation.'
  - 'Key differences: model backbone, training signals, target domain, and evaluation
    protocol differ across driving, robotics, game RL, and open-domain interactive
    video benchmarks.'
  - 'Trend evolution: recent work moves from model-based RL world models toward generative,
    action-conditioned driving/robotics models and then toward benchmarks for spatial,
    memory, and action consistency.'
  - 'Open questions: whether simulation or video prediction gains transfer to real-world
    safety and operational outcomes, and how to generalize beyond seen contexts, primitives,
    or action spaces.'
  related_work_outline_zh:
  - 主流方向：面向交互式具身应用的领域化世界模型，尤其是自动驾驶、机器人操作与控制、游戏或交互环境。
  - 研究共性：从高维观测中学习预测模型，并引入动作、上下文或物理信号，以支撑策略学习、仿真或生成。
  - 关键差异：模型骨干、训练信号、目标场景和评测协议在驾驶、机器人、游戏强化学习及开放域交互视频基准之间存在差异。
  - 趋势演进：近期从基于模型的强化学习世界模型，走向以动作和物理为条件的驾驶/机器人世界模型，再走向空间、记忆和动作一致性基准。
  - 开放问题：仿真或视频预测提升能否转化为真实安全与运营收益，以及如何泛化到未见上下文、原语或动作空间。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving video prediction and simulation (e.g., MaskGWM)
      what_it_solves: Predicts multi-view and long-horizon driving scenes for closed-loop
        simulation and zero-shot transfer across driving datasets.
      what_remains_open: Whether simulator or video prediction gains align with real-world
        driving safety and operational outcomes is not established; limitations are
        not reported.
    - line: Robotic world models for imagination and policy learning (e.g., RoboDreamer,
        UWM, RoboScape)
      what_it_solves: Generates task-conditioned robot videos and couples video, action,
        and physics signals for policy training and dynamics learning.
      what_remains_open: Generalization beyond seen language primitives, simulation-to-real
        transfer, and physical consistency across embodiments remain underverified;
        some limitations are not stated.
    - line: Model-based RL world models for sample-efficient control (e.g., STORM,
        cRSSM)
      what_it_solves: Learns latent or contextual dynamics and trains policies from
        imagined trajectories with fewer environment interactions.
      what_remains_open: Zero-shot generalization to unseen dynamics or context and
        broad benchmark coverage remain uncertain; context observability assumptions
        limit real-world use.
    - line: Open-domain consistency and action-control benchmarks (e.g., LoopNav,
        MIND)
      what_it_solves: Quantifies spatial consistency, long-term memory consistency,
        and action control in interactive world-model generation.
      what_remains_open: These benchmarks report little or no model-comparison evidence,
        so baseline difficulty and metric sensitivity are not yet established.
    consensus:
    - Application work increasingly treats world models as action-conditioned predictive
      systems rather than unconditional video generators.
    - Recent approaches learn from diverse visual datasets and add structured signals
      such as actions, physics, depth, masks, or context to improve prediction and
      control.
    - 'Evaluation is domain-specialized: driving datasets, robot datasets, game benchmarks,
      and interactive video benchmarks serve as separate evidence settings.'
    - There is growing interest in benchmarks that test long-term temporal consistency
      and action controllability beyond short-range visual quality.
    disagreements:
    - 'Model backbone differs: recurrent state-space or latent dynamics, diffusion
      transformers, and unified multimodal diffusion all appear in the application
      evidence.'
    - 'Training objectives differ: pure video prediction, action and dynamics coupling,
      physics-informed auxiliary tasks, mask reconstruction, or context conditioning
      are emphasized to different degrees.'
    - 'Evaluation targets differ: human-normalized game scores, driving dataset metrics,
      robot video planning quality, and spatial or memory consistency metrics are
      not interchangeable.'
    - 'Interaction and deployment assumptions differ: open-loop prediction, closed-loop
      action control, simulation-only robot execution, and real-world or zero-shot
      transfer goals coexist.'
    open_questions:
    - Do improved video prediction or simulator results translate into safer real-world
      driving and robot deployment, given that current evidence often stops at dataset
      or simulation metrics?
    - Can these models generalize to new objects, actions, dynamics, or action spaces
      beyond combinations or contexts seen during training?
    - How can long-horizon memory consistency, physical plausibility, and action controllability
      be measured and improved together in interactive environments?
    - What benchmark coverage and evaluation protocols are needed to compare open-domain
      world models without overfitting to scene-specific visual fidelity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶视频预测与仿真（如 MaskGWM）
      解决的问题: 预测多视角和长时域驾驶场景，用于闭环仿真和跨数据集零样本迁移。
      尚未覆盖: 仿真或视频预测收益是否与真实驾驶安全和运营结果一致尚未建立；限制未报告。
    - 路线: 机器人世界模型用于想象与策略学习（如 RoboDreamer、UWM、RoboScape）
      解决的问题: 生成任务条件机器人视频，并耦合视频、动作和物理信号以训练策略和动力学模型。
      尚未覆盖: 对未见语言原语组合、仿真到真实迁移、跨本体的物理一致性仍验证不足；部分限制未说明。
    - 路线: 基于模型的强化学习世界模型用于样本高效控制（如 STORM、cRSSM）
      解决的问题: 学习潜在或上下文动力学，通过想象轨迹训练策略并减少环境交互。
      尚未覆盖: 对未见动力学或上下文的零样本泛化和更广泛基准覆盖仍不确定；上下文可观测假设限制真实应用。
    - 路线: 开放域一致性与动作控制评测基准（如 LoopNav、MIND）
      解决的问题: 量化空间一致性、长时记忆一致性和交互式世界模型中的动作控制。
      尚未覆盖: 这些基准缺少充分的模型比较证据，基线难度和指标敏感性尚未建立。
    共识:
    - 应用研究日益把世界模型视为以动作或指令为条件的预测系统，而非无条件的视频生成器。
    - 近期方法从多样化视觉数据中学习，并加入动作、物理、深度、掩码或上下文等结构化信号以改善预测和控制。
    - 评测按领域细分：驾驶数据集、机器人数据集、游戏基准和交互视频基准被作为不同证据设置。
    - 越来越需要超越短时视觉质量，检测长期时序一致性和动作可控性的基准。
    分歧:
    - 模型骨干不同：循环状态空间或潜在动力学、扩散Transformer、统一多模态扩散在应用证据中并存。
    - 训练目标不同：纯视频预测、动作与动力学耦合、物理辅助任务、掩码重建或上下文条件化各有侧重。
    - 评测目标不同：游戏人类标准化分数、驾驶数据集指标、机器人视频规划质量、空间或记忆一致性指标不可互换。
    - 交互与部署假设不同：开放环预测、闭环动作控制、仅仿真机器人执行，以及真实或零样本迁移目标共存。
    开放问题:
    - 改进的视频预测或仿真结果能否转化为真实驾驶和机器人部署中的安全与运营收益？现有证据常止于数据集或仿真指标。
    - 模型能否泛化到训练中未见的新物体、动作、动力学或动作空间，而非仅组合已见原语或上下文？
    - 如何在交互环境中同时测量和提升长时记忆一致性、物理合理性与动作可控性？
    - 需要何种基准覆盖和评测协议，才能避免开放域世界模型过拟合特定场景的视觉保真度？
