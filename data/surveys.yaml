  - 'Shared research pattern: Across surveys and primary studies, work organizes by
    application scenario, world-state evolution, and scene modality; action-conditioned
    controllability, long-horizon consistency/memory, and real-time responsiveness
    recur as core challenges.'
  - 'Key differences: Contributions split between theoretical synthesis and empirical
    generation/robot learning; representation choices vary among language primitives,
    ego-motion/pose controls, latent states/tokens, and 3D global states; evaluation
    spans simulation, real robots, and benchmark comparison.'
  - 'Trend evolution: The 2022-2026 span moves from physical robot world-model learning
    toward Sora-style general video simulation, then toward interactive, open-source,
    and out-of-sight video world models and domain-specific driving taxonomies; this
    is a current-frontier shift.'
  - 'Open questions: Systematic inclusion criteria, benchmark compatibility, validation
