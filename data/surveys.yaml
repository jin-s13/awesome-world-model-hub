  related_work_outline_zh:
  - 主流方向：构建以动作条件视频生成或潜在动力学为核心的可运行世界模型系统，用于具身、游戏和驾驶场景，并配套空间一致性、动作忠实度和闭环控制等基准。
  - 研究共性：多数工作向生成或动力学模型注入控制信号、物理先验或上下文，再通过数据集或基准评估，部分结合下游强化学习或策略应用。
  - 关键差异：模型表示包括紧凑潜在动力学、扩散/自回归视频生成和物理信息联合目标；评测领域覆盖Minecraft、CARL、机器人视频和nuScenes；重点从零样本泛化、视觉保真度到动作遵循和低延迟各不相同。
  - 趋势演进：高证据集中于2024–2026，显示当前前沿从高保真通用驾驶模拟器和上下文RL世界模型，转向专门的一致性基准、物理信息生成和闭环帧级自回归服务。
  - 开放问题：跨域泛化、长时域一致性、速度与保真度权衡，以及跨团队独立复现仍缺乏单一数据集或有限任务之外的证据。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned world-model simulation stacks
      what_it_solves: Turns video or latent generative models into controllable simulators
        that produce future states or frames from action, trajectory, context, or
        physics cues for downstream policy use.
      what_remains_open: Generalization to unseen environments, sensor setups, and
        long rollouts beyond the training datasets; evidence is often limited to nuScenes
        or two CARL tasks.
    - line: Real-time and interactive closed-loop serving
      what_it_solves: Addresses latency and interactivity constraints for online simulation,
        including sub-second single-GPU inference for closed-loop driving generation.
      what_remains_open: Multi-GPU or complex-scene scalability, long-sequence consistency,
        and trade-offs between speed, fidelity, and controllability are not fully
        established.
    - line: Benchmark artifacts and reproducible world-model evaluation
      what_it_solves: Provides datasets, scores, or evaluation frameworks to make
        spatial consistency and action fidelity inspectable and comparable.
      what_remains_open: Independent reproduction across teams and infrastructure,
        correlation with real downstream utility, and missing code or artifact details
        in several systems remain verification gaps.
    consensus:
    - Action-conditioned generation is treated as the core mechanism for making world
      models usable as simulators, whether via latent dynamics or pixel-space video
      generation.
    - Benchmarks and datasets are shifting evaluation from frame quality alone toward
      controllability, consistency, and downstream task value.
    - Physics, context, temporal structure, or trajectory priors are increasingly
      added to improve plausibility and generalization.
    disagreements:
    - 'Representation choices differ: some use recurrent state-space latent models,
      others use diffusion or frame-level autoregressive generation, and some jointly
      learn video plus depth or keypoint physics.'
    - Supervision and conditioning vary across explicit context values, future trajectories,
      keypoint dynamics, depth, and high-level or low-level driving controls.
    - 'Evaluation domains and targets differ: spatial loop consistency in Minecraft,
      zero-shot policy transfer on CARL, robotic video fidelity, and closed-loop driving
      on nuScenes are not directly comparable.'
    - 'Deployment settings differ: some systems prioritize batch benchmarking or policy
      training, while others emphasize interactive low-latency serving.'
    open_questions:
    - Does improved action fidelity or spatial consistency in benchmarks translate
      to better downstream policy learning and real deployment?
    - How do these world-model systems generalize beyond nuScenes or two CARL tasks
      to new sensors, dynamics, and interaction modalities?
    - Can closed-loop simulators preserve long-horizon geometric and temporal consistency
      under iterative self-conditioning without sacrificing sub-second latency?
    - What is the trade-off between dynamic consistency and fine-grained visual detail
      when lightweight control modules are added to pre-trained video generators?
    - Which missing code, dataset, or evaluation details are necessary for independent
      reproduction across teams and infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件世界模型模拟栈
      解决的问题: 将视频或潜在生成模型转化为可控模拟器，根据动作、轨迹、上下文或物理线索生成未来状态或帧，用于下游策略或仿真。
      尚未覆盖: 对未见环境、传感器配置和长时程推演的泛化仍缺乏证据；多个工作仅在nuScenes或两个CARL任务上验证。
    - 路线: 实时与交互式闭环服务
      解决的问题: 满足在线仿真的延迟与交互约束，包括单GPU亚秒级推理以支持闭环驾驶生成。
      尚未覆盖: 多GPU及复杂场景扩展性、长序列一致性，以及速度、保真度与可控性之间的权衡尚未充分解决。
    - 路线: 基准工件与可复现世界模型评测
      解决的问题: 通过数据集、分数或评测框架让空间一致性与动作忠实度可检查、可比较。
      尚未覆盖: 跨团队与跨基础设施的独立复现、与真实下游效用的相关性，以及若干系统缺失的代码或工件细节仍是验证缺口。
    共识:
    - 动作条件生成被视为世界模型可用作模拟器的核心机制，无论是通过潜在动力学还是像素空间视频生成。
    - 评测正从单纯生成质量转向可控性、一致性和下游任务价值，基准与数据集越来越多。
    - 物理、上下文、时序结构或轨迹先验被越来越多地加入，以提升物理合理性与泛化性。
    分歧:
    - 表示方式不同：有的采用循环状态空间潜在模型，有的采用扩散或帧级自回归生成，有的联合学习视频与深度或关键点物理。
    - 监督与条件信号不同：包括显式上下文值、未来轨迹、关键点动力学、深度及高层或低层驾驶控制等。
    - 评测域与目标不同：Minecraft空间一致、CARL零样本策略迁移、机器人视频保真、nuScenes闭环驾驶之间难以直接比较。
    - 部署场景不同：部分系统侧重批量评测或策略训练，部分强调交互式低延迟服务。
    开放问题:
    - 空间一致性或动作忠实度提升是否转化为真实下游策略学习与部署的收益？
    - 在有限数据集（如nuScenes或两个CARL任务）之外，这些系统如何泛化到新传感器、动力学和交互模式？
    - 闭环模拟器在迭代自条件下能否保持长时程几何与时序一致性，同时维持亚秒级延迟？
    - 轻量控制模块加入预训练视频生成器后，动态一致性与细粒度视觉细节之间的权衡如何？
    - 缺失的代码、数据集或评测细节中，哪些是独立跨团队复现所必需的关键缺口？
