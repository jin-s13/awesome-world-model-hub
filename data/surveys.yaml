    from Atari scores to driving rollouts and robot execution.'
  - 'Trend evolution: The evidence moves from efficient game-domain model-based RL
    around 2023 toward 2024–2025 embodied and driving diffusion models, with 2025–2026
    benchmarks targeting spatial memory and action control rather than only visual
    fidelity.'
  - 'Open questions: Real-world safety and operational alignment, cross-embodiment
    generalization, long-term consistency, and whether new benchmarks validate current
