  related_work_outline:
  - 'Mainstream direction: World-model research is coalescing around generative simulators
    evaluated on game, driving, and robotic benchmarks, with newer diagnostic benchmarks
    for consistency and control.'
  - 'Shared research pattern: Models are trained from video or video-action data and
    evaluated through downstream policy returns, generation fidelity, or task-specific
    consistency metrics.'
  - 'Key differences: Evaluations target agent performance, visual/physical plausibility,
    or diagnostic memory/action consistency; training uses action-free video, action-conditioned
    video, context variables, or physics auxiliary tasks.'
  - 'Trend evolution: Recent evidence moves from Atari model-based RL efficiency toward
    embodied video prediction and diagnostic benchmarks; within the 2023-2026 frontier,
    the trend appears to be richer evaluation beyond aggregate scores.'
  - 'Open questions: Long-term memory consistency, cross-action-space generalization,
    downstream utility of proxy metrics, and stability across implementations remain
    unevidenced or unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型研究正围绕生成式模拟器展开，评测集中在游戏、驾驶和机器人基准，并出现针对一致性与控制的新诊断基准。
  - 研究共性：模型多从视频或视频-动作数据训练，并通过下游策略回报、生成保真度或任务特定一致性指标进行评测。
  - 关键差异：评测目标分别指向智能体表现、视觉与物理合理性、诊断性记忆或动作控制；训练设置包括无动作视频、动作条件视频、上下文变量和物理辅助任务。
  - 趋势演进：近期证据从 Atari 基于模型的强化学习效率评测，转向具身视频预测和诊断基准；在 2023-2026 前沿内，趋势是超越总分、进行更丰富评测。
  - 开放问题：长期记忆一致性、跨动作空间泛化、代理指标的下游效用，以及不同实现上的稳定性仍未充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Diagnostic benchmark and dataset design
      what_it_solves: Creates shared tasks and datasets for evaluating spatial consistency,
        memory consistency, and action control in world models.
      what_remains_open: Whether curated Minecraft and open-domain video settings
        transfer to real driving, robotics, or deployment-scale tasks is not yet evidenced.
    - line: Metric and stress-test design
      what_it_solves: Probes consistency, controllability, and physical plausibility
        beyond aggregate generation or return scores.
      what_remains_open: The alignment between these proxy metrics and downstream
        decisions users actually care about is unverified.
    - line: Model-centric world-model evaluation
      what_it_solves: Measures generalization, sample efficiency, generation quality,
        and policy utility across Atari, driving, robotic, and open-domain settings.
      what_remains_open: Robustness across dynamics shifts, action spaces, implementation
        budgets, and missing limitation reports remains uncertain.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through shared benchmarks, standard
        comparisons, code, datasets, and reporting conventions.
      what_remains_open: Benchmark conclusions may not be stable across different
        implementations, compute budgets, or datasets; this is a verification gap
        rather than an observed failure.
    consensus:
    - World models are increasingly treated as generative simulators that require
      both visual fidelity and downstream control utility to be evaluated.
    - Evaluation is moving beyond aggregate scores toward task-specific diagnostics
      such as spatial consistency, memory consistency, action control, and physical
      plausibility.
    - Shared artifacts such as datasets and benchmarks are treated as important for
      comparability, while many model papers still emphasize standard benchmark results.
    - Current evidence clusters in game, driving, and robot manipulation settings,
      with embodied video prediction becoming a central use case.
    disagreements:
    - 'Evaluation target differs: some work optimizes agent returns on Atari 100k,
      others optimize video generation quality or physical plausibility, and others
      diagnose memory and action-control consistency.'
    - 'Training and supervision differs: action-free video learning, action-conditioned
      video generation, observable context-conditioned dynamics, and physics-informed
      auxiliary tasks represent distinct assumptions.'
    - 'Representation differs: discrete latent variable world models, diffusion-based
      generative world models, and transformer-coupled video-action diffusion schemes
      coexist.'
    - 'Deployment setting differs: simulated game environments, real driving datasets,
      large-scale robotic datasets, and open-domain video benchmarks create different
      boundary conditions.'
    open_questions:
    - Do diagnostic scores for spatial or memory consistency predict downstream policy
      quality or robotic deployment utility?
    - Can world models maintain long-term memory consistency and generalize across
      action spaces, viewpoints, or unseen dynamics?
    - Are benchmark conclusions stable across different implementations and compute
      budgets when several top-ranked papers omit explicit limitation details?
    - Does the assumption of observable context or curated video coverage limit transfer
      to partially observed real-world settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 诊断基准与数据集设计
      解决的问题: 为世界模型的空间一致性、记忆一致性和动作控制提供共享任务和数据集。
      尚未覆盖: 策划的 Minecraft 与开放域视频设定能否迁移到真实驾驶、机器人或部署规模任务，仍缺证据。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验一致性、可控性和物理合理性等能力。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致，尚未验证。
    - 路线: 模型中心的世界模型评测
      解决的问题: 在 Atari、驾驶、机器人和开放域设定中衡量泛化性、样本效率、生成质量与策略效用。
      尚未覆盖: 跨动力学变化、动作空间、实现预算以及缺失局限性报告下的鲁棒性仍不明确。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基准、标准比较、代码、数据集和报告规范使结果可审计。
      尚未覆盖: 不同实现、算力预算或数据集下结论是否稳定，属于验证缺口而非已证实的失败。
    共识:
    - 世界模型越来越多地被视作生成式模拟器，需要同时评估视觉保真度和下游控制效用。
    - 评测正从总分转向任务特定诊断，例如空间一致性、记忆一致性、动作控制和物理合理性。
    - 数据集与基准等共享工件被认为对可比性重要，但许多模型论文仍以标准基准结果为主。
    - 现有证据集中在游戏、驾驶和机器人操作领域，具身视频预测正成为核心应用场景。
    分歧:
    - 评测目标不同：有的优化 Atari 100k 上的智能体回报，有的优化视频生成质量或物理合理性，有的诊断记忆与动作控制一致性。
    - 训练与监督不同：无动作视频学习、动作条件视频生成、可观测上下文条件动力学和物理信息辅助任务代表不同假设。
    - 表示方式不同：离散潜变量世界模型、基于扩散的生成式世界模型和 Transformer 耦合的视频-动作扩散方案并存。
    - 部署场景不同：模拟游戏环境、真实驾驶数据集、大规模机器人数据集和开放域视频基准带来不同边界条件。
