  - 研究共性：系统以动作、上下文或潜在动作为条件构建视频世界模型，并通过忠实度、一致性或下游策略表现进行评测。
  - 关键差异：工作分为基准数据集与指标、动作可控闭环模拟器、上下文/物理信息架构以及跨具身合成数据流水线。
  - 趋势演进：在2024–2026当前前沿内，领域正从单域基准和模型中心方法走向可部署、低延迟、跨具身模拟系统。
