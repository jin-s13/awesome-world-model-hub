  related_work_outline:
  - 'Mainstream direction: The dominant thread is conceptual framing of video generation
    as world models, with a focus on taxonomy, functional evaluation, and alignment
    to physical realism rather than formal theoretical analysis.'
  - 'Shared research pattern: Works connect video generation to world models by modeling
    state and dynamics, typically through action-conditioned transformer architectures,
    and evaluate using visual fidelity, action alignment, or task-specific benchmarks.'
  - 'Key differences: Differences arise in whether state is constructed explicitly
    or implicitly, whether pretrained video models are adapted or models are trained
    from scratch on robot data, and whether evaluation targets spatial reasoning,
    physical plausibility, or policy learning.'
  - 'Trend evolution: From 2024 to 2026, the focus shifts from building action-conditioned
    video world models for robotics to critical reflection, alignment post-training,
    and dedicated benchmarks, indicating a move toward conceptual maturity and reliability
    concerns.'
  - 'Open questions: Formal definitions of world models, scaling laws linking model
    capacity to planning success, and guarantees of causal and physical consistency
    remain open; current functional benchmarks are not yet standardized.'
  related_work_outline_zh:
  - 主流方向：将视频生成作为世界模型进行概念化，重点在于分类法、功能性评估和与物理真实性的对齐，而非形式化理论分析。
  - 研究共性：通过动作条件的Transformer架构建模状态和动态，将视频生成与世界模型连接，并使用视觉保真度、动作对齐或任务特定基准进行评估。
  - 关键差异：差异体现在状态是显式构建还是隐式编码，是适配预训练视频模型还是从零开始在机器人数据上训练，以及评估目标是空间推理、物理合理性还是策略学习。
  - 趋势演进：2024年至2026年，重心从构建机器人动作条件视频世界模型转向批判性反思、对齐后训练和专用基准，表明该领域正走向概念成熟和可靠性关注。
  - 开放问题：世界模型的形式化定义、将模型容量与规划成功联系起来的缩放规律，以及因果和物理一致性保证仍未解决；当前的功能性基准尚未标准化。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual taxonomy of video generation as world models
      what_it_solves: Organizes fragmented approaches by state construction (implicit/explicit)
        and dynamics modeling (knowledge integration, architectural reformulation),
        and advocates functional benchmarks for physical persistence and causal reasoning.
      what_remains_open: The taxonomy has not yet been validated by changing model
        design; functional benchmarks are nascent, and no formal connection between
        state representation and predictive performance has been established.
    - line: Empirical analysis of world model reasoning and test-time scaling
      what_it_solves: Probes the reliability of verifiers and test-time scaling for
        spatial reasoning, revealing poor calibration, action biases, and information
        bottlenecks in current models.
      what_remains_open: No verifier achieves consistent scaling across benchmarks,
        indicating that current world models lack robust internal representations;
        no theoretical guarantees for scaling behavior are provided.
    - line: Alignment of video world models with physical realism and human preferences
      what_it_solves: Improves physical fidelity, task coherence, and visual quality
        of generated rollouts through multi-dimensional reward modeling and post-training
        (e.g., DPO, PPO-style alignment).
      what_remains_open: Alignment relies on costly human preference data and is evaluated
        only on manipulation tasks; generalization across embodiments is not shown;
        formal guarantees of physical consistency are absent.
    consensus:
    - Video generation models can serve as world models when conditioned on actions
      and evaluated for physical plausibility, not just visual quality.
    - Current evaluation metrics (e.g., FVD, PSNR) are insufficient for world models;
      functional benchmarks that test state persistence and causal reasoning are needed.
    - Alignment techniques, such as reinforcement learning from human feedback or
      post-training with discriminators, can improve the physical consistency and
      logical coherence of generated rollouts.
    disagreements:
    - The taxonomy-centered survey argues for explicit state construction, while methods
      like the unified transformer and diffusion transformer implicitly encode state
      without explicit bottlenecks.
    - Some works focus on action-conditioned video generation for downstream policy
      learning, while others probe the model's inherent spatial reasoning using test-time
      scaling without action-dependent planning.
    - Whether world models should be evaluated on zero-shot cross-embodiment generalization
      (e.g., EZSbench) or on task-specific physical alignment (e.g., PBench) is not
      yet settled.
    - 'The role of pretrained video diffusion models differs: one line adapts a closed-source
      model with a learned mask, while others train unified models from scratch on
      robot datasets.'
    open_questions:
    - What formal conditions must a video generation model satisfy to be considered
      a world model with explicit state and dynamics?
    - How can scaling laws be derived for video-based world models that predict planning
      success and transfer across tasks?
    - Can current alignment methods provide guarantees of physical consistency for
      all possible action trajectories, or are they limited to the training distribution?
    - How should causal reasoning be evaluated in world models beyond visual coherence,
      given that information bottlenecks prevent enriching fine-grained reasoning?
    - Does explicit state construction improve long-term planning in real-world tasks,
      and how can this be empirically tested with current benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成作为世界模型的概念分类法
      解决的问题: 通过状态构建（隐式/显式）和动态建模（知识整合、架构重构）组织碎片化方法，并倡导面向物理持久性和因果推理的功能基准。
      尚未覆盖: 该分类法尚未通过改变模型设计得到验证；功能基准仍处于早期阶段，状态表示与预测性能之间缺乏形式化联系。
    - 路线: 世界模型推理与测试时缩放的实证分析
      解决的问题: 探究验证器和测试时缩放用于空间推理的可靠性，揭示当前模型中的校准不良、动作偏差和信息瓶颈。
      尚未覆盖: 所有验证器在基准间均未实现一致缩放，表明当前世界模型缺乏鲁棒的内部表示；未提供缩放行为的形式化保证。
    - 路线: 视频世界模型与物理真实性和人类偏好的对齐
      解决的问题: 通过多维奖励建模和后训练（如DPO、PPO风格对齐）提升生成轨迹的物理保真度、任务一致性和视觉质量。
      尚未覆盖: 对齐依赖昂贵的人类偏好数据，且仅在操作任务上评估；跨本体泛化未展示；缺乏物理一致性的形式化保证。
    共识:
    - 当以动作为条件并评估物理合理性时，视频生成模型可作为世界模型，而不仅仅是视觉质量。
    - 当前评估指标（如FVD、PSNR）对世界模型不足；需要测试状态持久性和因果推理的功能基准。
    - 对齐技术（如基于人类反馈的强化学习或使用判别器的后训练）可以改善生成轨迹的物理一致性和逻辑连贯性。
    分歧:
    - 分类中心调查主张显式状态构建，而统一Transformer和扩散Transformer等方法隐式编码状态，无显式瓶颈。
    - 部分工作聚焦于动作条件视频生成以支持下游策略学习，而另一些工作则通过测试时缩放探究模型固有的空间推理，不依赖动作规划。
    - 世界模型应在零样本跨本体泛化（如EZSbench）上评估，还是在任务特定的物理对齐（如PBench）上评估，尚未达成一致。
    - 预训练视频扩散模型的角色存在差异：一种路线通过学习掩码适配闭源模型，而其他路线在机器人数据集上从零开始训练统一模型。
    开放问题:
    - 视频生成模型必须满足哪些形式化条件才能被视为具有显式状态和动态的世界模型？
    - 如何为基于视频的世界模型推导缩放规律，以预测规划成功和跨任务迁移？
    - 当前对齐方法能否为所有可能动作轨迹提供物理一致性保证，还是仅限于训练分布？
    - 在信息瓶颈阻碍细粒度推理的情况下，如何超越视觉连贯性评估世界模型中的因果推理？
    - 显式状态构建是否改善真实任务中的长期规划，如何利用现有基准进行实证检验？
