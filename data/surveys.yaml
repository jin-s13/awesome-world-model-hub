    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究整理为视频、交互仿真、机器人与自动驾驶等方向、设计维度与里程碑。
      尚未覆盖: 分类体系是否基于系统证据，以及在方法快速变化时是否仍稳定。
    - 路线: 对比评测综合
      解决的问题: 汇总开放世界、游戏引擎、自动驾驶与机器人等设置下的基准与指标选择，并提出闭环或资源感知评测方案。
      尚未覆盖: 不同设置下结果是否兼容，以及评测框架是否得到实证验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 把文献覆盖面转化为动作条件控制、长时交互、记忆与持久动态等具体挑战。
      尚未覆盖: 哪些缺口更应优先解决，以及提出的方向能否转化为稳健系统。
    共识:
    - 文献将世界模型作为跨生成视频、交互仿真、具身控制和自动驾驶的综合抽象。
    - 论文普遍认为可控性、长时一致性或记忆、以及实时交互是核心未解决维度。
    - 论文普遍认为当前评测多为开环或不完整，需要闭环、资源感知或任务导向的指标。
    - 综述类工作承认领域快速发展使覆盖范围和结论具有暂时性。
    分歧:
    - 表示重点不同：有的按应用场景和场景模态组织，有的按潜在表示类型与结构先验组织，而相邻方法证据使用持久全局状态或组合原语。
    - 监督与交互假设不同：语言条件视频生成、自我运动与姿态条件预测、以及真实机器人稀疏奖励学习对综述框架覆盖范围提出不同要求。
    - 评测目标不同：一类比较不同领域的现有基准，另一类提出潜在闭环与资源成本指标，方法导向证据则报告仿真或真实机器人执行。
    - 成熟度与部署证据不同：部分工作是未经验证的概念分类体系，其他提供系统级或机器人结果，导致直接综合困难。
    开放问题:
    - 一个统一分类体系能否同时覆盖生成视频、交互仿真、具身机器人学习和自动驾驶，而不掩盖领域特定假设？
    - 哪种评测设置，开环生成质量、闭环决策性能或资源感知推理成本，最能预测下游部署价值？
    - 需要什么证据证明综述识别的动作条件可控性或长时记忆缺口是优先问题，而非仅为方便排序？
    - 当来源综述未实施或测试所提评测框架，而底层方法设置不兼容时，如何验证这些框架？
