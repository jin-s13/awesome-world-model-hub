  related_work_outline:
  - 'Mainstream direction: Applying world models to domain-specific tasks—autonomous
    driving, robot manipulation, and interactive games—using video generation (diffusion/Transformers)
    as internal simulators for prediction, planning, and policy learning.'
  - 'Shared research pattern: The world model is trained via self-supervised future-frame
    prediction from visual input, then used to generate imagined trajectories for
    training policies or evaluating actions, often with action-conditioned generation.'
  - 'Key differences: Methods diverge in whether they explicitly inject physical priors
    (e.g., depth prediction, keypoint dynamics) versus relying purely on data-driven
    generation; whether they require action inputs or can learn from action-free videos;
    and whether evaluation focuses on offline video fidelity or closed-loop control
    performance.'
  - 'Trend evolution: From efficient model-based RL on Atari in 2023 to diffusion-based
    driving (2025) and robotic imagination (2024–2025), culminating in 2026 with comprehensive
    benchmarks for memory consistency and action control, reflecting a shift from
    single-task to generalizable, embodied world models.'
  - 'Open questions: Real-world safety and operational alignment of simulated gains,
    cross-embodiment and cross-task transfer, long-term memory consistency, and the
    gap between simulation fidelity and closed-loop real-world performance.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于自动驾驶、机器人操作和互动游戏等具体领域，利用视频生成（扩散/Transformer）作为内部模拟器，进行预测、规划与策略学习。
  - 研究共性：通过自监督学习从视觉输入预测未来帧来训练世界模型，然后在生成的想象轨迹上训练策略或评估动作，大多采用动作条件生成。
  - 关键差异：方法在是否显式注入物理先验（如深度预测、关键点动力学）与纯数据驱动之间，在是否需要动作输入与可从无动作视频学习之间，以及在评估侧重离线视频质量与闭环控制性能之间存在分歧。
  - 趋势演进：从2023年Atari上的高效模型，到2025年驾驶扩散模型和2024–2025年机器人想象，直至2026年出现针对记忆一致性与动作控制的综合基准，体现从单一任务向通用、具身化世界模型的转变。
  - 开放问题：仿真收益在真实世界中的安全与操作一致性，跨本体与跨任务迁移，长期记忆维持，以及仿真保真度到闭环真实性能的差距。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation use cases
      what_it_solves: Long-horizon, multi-view video prediction for closed-loop driving
        simulation and policy evaluation.
      what_remains_open: Alignment between strong simulator generalization (e.g.,
        zero-shot across datasets) and real-world safety or operational outcomes is
        not yet established.
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robot tasks, enabling compositional
        generalization to unseen goal combinations, physical plausibility, and policy
        learning from large-scale data.
      what_remains_open: Generalization relies on seen primitives or observable context;
        transfer across different embodiments, real-world physical environments, and
        truly novel object/action combinations remains unverified.
    - line: Interactive agents and games
      what_it_solves: Efficient stochastic world models for game-based decision making
        and benchmarks for spatial consistency, memory, and action control in open-ended
        environments.
      what_remains_open: Long-term memory consistency and generalization across diverse
        action spaces remain challenging; current benchmarks expose gaps but do not
        yet provide solutions for sustaining world model coherence over extended loops.
    consensus:
    - World models are primarily built as video-generation models (diffusion or Transformer-based)
      that predict future frames conditioned on past observations and actions.
    - Self-supervised learning on offline datasets is the dominant training paradigm,
      with the model later used to generate imagined rollouts for policy optimization
      or evaluation.
    - Evaluation commonly includes video quality metrics and downstream task performance,
      but the link between visual fidelity and closed-loop control efficacy is an
      acknowledged concern.
    - Model architectures are increasingly unified and scalable, with a trend toward
      handling multiple modalities (video, actions) within a single framework.
    disagreements:
    - 'Representation of physical knowledge: some works explicitly inject geometric/physical
      priors (depth, keypoints), while others rely purely on data-driven prediction
      without explicit physics modules.'
    - 'Action conditioning: most models require action inputs for generation, but
      one line of work demonstrates learning from action-free video by controlling
      diffusion timesteps, enabling broader data usage.'
    - 'Evaluation target: some methods emphasize offline video fidelity and zero-shot
      generalization across datasets, while others focus on closed-loop policy execution
      or memory consistency over repeated interactions.'
    - 'Handling of novelty: approaches vary between compositional generalization via
      language primitives and context-conditioned latent dynamics, with different
      assumptions about the observability of context variables.'
    open_questions:
    - How can we ensure that improvements in video generation quality translate to
      safer and more reliable real-world behavior in driving and robotics?
    - What evaluation protocols are needed to capture long-term memory consistency
      and action controllability beyond short video rollouts?
    - Can world models trained on multi-embodiment offline data enable zero-shot transfer
      to novel physical robots without fine-tuning?
    - How do we handle genuinely novel objects or dynamics that are not covered by
      compositional primitives or context variables observed during training?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真应用
      解决的问题: 长时域、多视角视频预测，用于闭环驾驶仿真与策略评测。
      尚未覆盖: 强泛化能力（如跨数据集零样本）与真实世界安全或运营结果之间的一致性尚未建立。
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人任务，实现对未见目标组合的组合泛化、物理合理性及从大规模数据中进行策略学习。
      尚未覆盖: 泛化依赖于所见原语或可观测上下文；跨不同本体、真实物理环境及全新物体/动作组合的迁移仍未验证。
    - 路线: 交互式智能体与游戏
      解决的问题: 高效的随机世界模型用于游戏决策，以及用于评估开放环境中空间一致性、记忆和动作控制的基准。
      尚未覆盖: 长期记忆一致性和跨多样动作空间的泛化仍是挑战；现有基准暴露了差距，但尚未提供在长周期交互中保持世界模型连贯性的解决方案。
    共识:
    - 世界模型主要构建为视频生成模型（基于扩散或Transformer），根据过去观测和动作预测未来帧。
