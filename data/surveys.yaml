    or task rewards and probing test-time scaling, while conceptual work begins to
    formalize state, dynamics, and benchmark limitations. Earlier 2015 work is absent
    from top evidence.'
  - 'Open questions: Whether gains transfer across tasks and benchmarks; when test-time
    verification fails; how to evaluate persistence and causal dynamics; how to scale
    human-preference alignment; and whether conceptual taxonomies change design or
