  related_work_outline:
  - 'Mainstream direction: The visible evidence is dominated by domain-specific world
    models that generate action-conditioned video or state rollouts for robotics,
    driving, and interactive agents, with diffusion Transformers and latent dynamics
    as the main generative backbones.'
  - 'Shared research pattern: Papers treat world models as learnable simulators; they
    train on large domain datasets, predict future observations or latent states under
    actions, context, language, or physical signals, and evaluate generalization,
    visual fidelity, physical plausibility, or downstream policy utility.'
  - 'Key differences: Representations range from stochastic latent state-space models
    and VAE-Transformer hybrids to video diffusion, coupled video-action diffusion,
    and physics-informed generative models; supervision varies among context values,
    language primitives, physics auxiliary tasks, and action-free video.'
  - 'Trend evolution: The packet''s top evidence spans 2023-2026, showing a shift
    from efficient model-based RL on Atari-style benchmarks toward large-scale robotics
    and driving world models, plus newly introduced benchmarks for memory, spatial
    consistency, and action control.'
  - 'Open questions: Whether visual and simulator gains transfer to real-world safety
    and physical execution, how to preserve long-term memory and cross-action-space
    control, and which evaluation metrics best predict downstream policy reliability
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：可见证据集中于面向机器人、驾驶和交互式智能体的领域世界模型，以动作条件视频或状态推演为核心，扩散Transformer和潜在动力学是主要生成骨干。
  - 研究共性：各工作将世界模型视为可学习模拟器，在领域数据上训练，预测未来观测或潜在状态，并以泛化、视觉保真、物理合理性或下游策略效用作为评测。
  - 关键差异：表示从随机潜在状态空间模型、VAE-Transformer混合，到视频扩散、视频-动作耦合扩散和物理引导生成不等；监督信号包括上下文值、语言原语、物理辅助任务和无动作视频。
  - 趋势演进：高排名证据集中在2023至2026年，显示从Atari风格的高效基于模型强化学习，转向大规模机器人/驾驶世界模型与新提出的记忆、空间一致性和动作控制基准。
  - 开放问题：视觉与仿真提升能否迁移到真实安全和物理执行、如何长期保持记忆一致性与跨动作空间控制、哪些指标最能预测下游策略可靠性仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot imagination and policy pretraining
      what_it_solves: Learns robot-domain world models for video plan generation,
        physics-informed dynamics, and action-video pretraining to support policy
        learning or evaluation.
      what_remains_open: Generalization beyond seen language or primitive combinations,
        validation beyond simulation, and evidence of robust real-robot transfer remain
        narrow or missing.
    - line: Autonomous driving scene prediction and rollout
      what_it_solves: Builds long-horizon, multi-view driving world models for normal
        validation, rollout, and zero-shot dataset transfer.
      what_remains_open: The packet does not connect prediction quality to closed-loop
        planning, real-world safety, or operational driving outcomes.
    - line: Interactive world-model benchmarks for memory and action control
      what_it_solves: Creates open-world or open-domain benchmarks to measure spatial
        consistency, loop closure, long-term memory, and action-conditioned control.
      what_remains_open: Results reveal challenges in long-term memory consistency
        and cross-action-space generalization, but do not yet provide a standardized
        solution path.
    - line: Stochastic and contextual model-based reinforcement learning
      what_it_solves: Uses latent stochastic or contextual world models to generate
        imagined trajectories for sample-efficient RL and zero-shot generalization
        under changing dynamics.
      what_remains_open: Evidence is limited to a small set of benchmark tasks and
        assumes observable context; broader unseen dynamics and real-world applicability
        remain unverified.
    consensus:
    - World models function as learned environment simulators that produce imagined
      or predicted rollouts conditioned on actions, context, language, or physical
      signals, rather than as passive video generators only.
    - Generative sequence models, especially diffusion Transformers, VAE-Transformer
      hybrids, and latent state-space models, are core architectures for high-fidelity
      and efficient world modeling.
    - Evaluation increasingly emphasizes out-of-distribution generalization through
      zero-shot datasets, unseen goals or contexts, and open-world navigation, not
      only training-set reconstruction.
    - Visual quality alone is treated as insufficient; recent benchmarks and auxiliary
      tasks add physical plausibility, memory consistency, action control, or downstream
      policy utility as evaluation dimensions.
    - Large domain datasets and open benchmarks play a central role, while many top
      papers report code or dataset artifacts but leave limitations or real-world
      validation details as verification gaps.
    disagreements:
    - 'Representation choices differ: recurrent stochastic state-space models, VAE-Transformer
      architectures, video diffusion Transformers, and coupled video-action diffusion
      models encode dynamics and observations differently.'
    - 'Supervision and conditioning differ: some approaches use explicit context variables,
      some parse language instructions into primitives, some add physics auxiliary
      tasks, and some learn from action-free video.'
    - Evaluation targets differ across visual control scores, driving rollout metrics,
      robot task execution, and spatial or memory consistency, making direct cross-domain
      comparison difficult.
    - Interaction mode differs between closed-loop action-conditioned rollouts, open-loop
      video generation, and downstream policy training or evaluation inside the learned
      model.
    - 'Deployment and generalization settings differ: evidence ranges from simulation-only
      evaluation and seen primitive combinations to zero-shot dataset transfer, while
      real-world physical execution is rarely demonstrated.'
    open_questions:
    - Do improvements in video fidelity, rollout quality, and navigation consistency
      transfer to real driving safety, robot manipulation success, or other physical
      outcomes?
    - Can a single world model maintain long-term memory consistency and reliable
      action control across viewpoints, action spaces, and environment changes without
      task-specific retraining?
    - How restrictive are assumptions such as observable context values or predefined
      language primitives for real-world dynamics and unseen tasks?
    - Which benchmark metrics best predict downstream policy reliability, and what
      unified evaluation protocol should compare different world-model representations
      across robotics, driving, and interactive agents?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人想象与策略预训练
      解决的问题: 学习面向机器人的世界模型，用于视频计划生成、物理引导动力学和动作-视频预训练，以支持策略学习或评估。
      尚未覆盖: 跨已见语言或原语组合之外的新任务泛化、超越仿真的验证，以及真实机器人鲁棒迁移证据仍较有限或缺失。
    - 路线: 自动驾驶场景预测与推演
      解决的问题: 构建长时域、多视角驾驶世界模型，用于常规验证、推演和跨数据集零样本验证。
      尚未覆盖: 证据未将预测质量与闭环规划、真实安全或运营结果直接关联。
    - 路线: 面向记忆与动作控制的交互世界模型基准
      解决的问题: 构建开放世界或开放域基准，测量空间一致性、闭环重访、长期记忆和动作条件控制。
      尚未覆盖: 结果揭示长期记忆一致性与跨动作空间泛化仍是挑战，但尚未形成标准化解决路径。
    - 路线: 随机与上下文模型基强化学习
      解决的问题: 利用潜在随机或上下文世界模型生成想象轨迹，实现样本高效强化学习和动力学变化下的零样本泛化。
      尚未覆盖: 证据限于少量基准任务且假设上下文可观测；更广义的未知动力学与真实场景适用性仍未验证。
    共识:
    - 世界模型被用作可学习环境模拟器，依据动作、上下文、语言或物理信号生成想象或预测推演，而不仅是被动视频生成器。
    - 扩散Transformer、VAE-Transformer混合和潜在状态空间模型等生成式序列模型成为高保真和高效世界建模的核心架构。
    - 评测越来越强调分布外泛化，包括零样本数据集、未见目标或上下文、开放世界导航，而非仅关注训练集重建。
    - 视觉质量被视为不够充分；近期基准和辅助任务加入物理合理性、记忆一致性、动作控制或下游策略效用作评测维度。
    - 大规模领域数据集和开放基准发挥核心作用，许多高排名工作提供代码或数据工件，但局限性与真实验证细节仍常缺失。
    分歧:
    - 表示选择不同：循环随机状态空间模型、VAE-Transformer架构、视频扩散Transformer和视频-动作耦合扩散以不同方式编码动力学与观测。
    - 监督与条件方式不同：有的使用显式上下文变量，有的把语言解析为原语，有的加入物理辅助任务，有的从无动作视频学习。
    - 评测目标不同：视觉控制分数、驾驶推演指标、机器人任务执行、空间与记忆一致性各有侧重，跨领域直接比较困难。
    - 交互模式不同：包括闭环动作条件推演、开环视频生成，以及在学到的模型内部进行下游策略训练或评估。
    - 部署与泛化设置不同：证据从仅仿真、已知原语组合到跨数据集零样本不等，真实物理执行展示很少。
    开放问题:
    - 视频保真度、推演质量和导航一致性指标的提升能否迁移到真实驾驶安全、机器人操作成功率或其他物理结果？
    - 单一世界模型能否在视角、动作空间和环境变化下长期保持记忆一致性与可靠动作控制，而无需任务特定重训？
    - 可观测上下文值或预定义语言原语等假设对真实动力学和未见过任务有多大约束？
    - 哪些基准指标最能预测下游策略可靠性，应如何构建统一评测协议来比较机器人、驾驶和交互式智能体中的不同世界模型表示？
