  related_work_outline_zh:
  - 主流方向：世界模型研究与综述集中爆发，主流以生成式视频世界模型、交互式动态、自动驾驶潜在世界模型为主线，形成分类、基准和未来方向。
  - 研究共性：多数工作把世界模型作为统一预测与控制抽象，强调动作条件、长期记忆、全局状态或组合生成，并以真实感、时间一致性、可控性或执行成功率评估。
  - 关键差异：表示方式包括连续/离散/混合潜在状态和显式3D/实体中心全局状态；验证场景涵盖物理机器人、仿真、离线视频和概念框架，跨设置可比性不足。
  - 趋势演进：从2022年物理机器人世界模型在线学习，到2024年Sora相关综述与组合生成，再到2025-2026年交互式、开源、潜在分类和视线外动态，处于快速进展前沿。
  - 开放问题：如何实证验证分类与评测框架，统一开环/闭环指标，处理训练中未见原语或实体，并实现自动驾驶、机器人与具身交互之间的结论迁移。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Turns fragmented world-model research into design dimensions,
        milestones, and research gaps.
      what_remains_open: Whether the synthesis is systematic and falsifiable rather
        than relying on selective examples or current trends.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how benchmark, metric, and control-signal choices
        shape claims about realism, controllability, temporal consistency, and task
        success.
      what_remains_open: Whether results and metrics are compatible across open-loop,
        closed-loop, simulation, and physical robot settings.
    - line: Open problem and gap mapping
      what_it_solves: Converts literature coverage into concrete challenges such as
        long-horizon memory, real-time interactivity, and out-of-sight persistence.
      what_remains_open: Which gaps matter most for progress and how to test proposed
        priorities empirically.
    - line: Generative world-model method and system development
      what_it_solves: Improves action-conditioned video generation, compositional
        generalization, persistent dynamics, and real-time open-source simulation.
      what_remains_open: Generalization beyond seen primitive combinations, real-world
        robot validation, and standardized long-horizon benchmarks.
    consensus:
    - There is broad agreement that world-model research should move beyond static
      or single-step generation toward controllable, temporally consistent, and interaction-aware
      dynamics.
    - 'Most works share a predictive abstraction: the model learns or organizes environment
      dynamics from visual or multimodal observations and uses them for downstream
      control, planning, or simulation.'
    - Evaluation increasingly includes controllability, long-horizon consistency,
      and task success rather than only visual realism; several papers call for benchmarks
      that stress these properties.
    - Open-source code, model access, and benchmark artifacts are treated as valuable
      but are unevenly documented, so reproducibility remains a verification gap.
    - Many papers acknowledge that current methods rely on seen compositions, curated
      datasets, or simulation, leaving real-world and unseen-entity generalization
      unresolved.
    disagreements:
    - 'Representation: some approaches use continuous, discrete, or hybrid latent
      states, while others use explicit 3D, entity-centric, or monitor-based global
      states for persistence.'
    - 'Interaction mode: some systems target real-time physical robot learning, others
      offline action-conditioned video generation, and others fine-grained ego-motion,
      object, and human pose control.'
    - 'Evaluation target: some focus on out-of-sight dynamics and long-term scene
      consistency, others on metric-based controllability, closed-loop driving, or
      real robot execution.'
    - 'Evidence type: several papers provide conceptual taxonomies and evaluation
      prescriptions without empirical validation, while method papers report empirical
      gains but often in narrow settings.'
    - 'Deployment setting: physical robot experiments, simulated environments, offline
      video corpora, and pseudo-labeled multimodal datasets differ in transfer assumptions
      and comparability.'
    open_questions:
    - How can taxonomies and evaluation frameworks be validated with unified benchmarks
      rather than only proposed conceptually?
    - What metrics can bridge open-loop generation realism and closed-loop task success
      under computation constraints?
    - How can world models handle entirely unseen primitives, objects, or dynamics
      instead of recombinations of training-time primitives?
    - 'Which gap matters most for progress: long-horizon memory, real-time action
      responsiveness, out-of-sight persistence, or fine-grained controllability?'
    - Do findings from autonomous driving, robotics, and embodied video generation
      transfer across settings, or are they setting-specific?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究整理为设计维度、里程碑和研究缺口。
      尚未覆盖: 综合是否系统且可证伪，而不是依赖选择性示例或当前趋势。
    - 路线: 对比评测综合
      解决的问题: 总结基准、指标和控制信号选择如何影响对真实感、可控性、时间一致性和任务成功的判断。
      尚未覆盖: 结果与指标在开环、闭环、仿真和物理机器人设置间是否真正兼容。
    - 路线: 开放问题与缺口映射
      解决的问题: 把文献覆盖转化为长期记忆、实时交互、视线外持久性等具体挑战。
      尚未覆盖: 哪些缺口最值得优先解决，以及如何实证检验这些优先级。
    - 路线: 生成式世界模型方法与系统开发
      解决的问题: 改进动作条件视频生成、组合泛化、持久动态和实时开源仿真。
      尚未覆盖: 对训练中未见原语组合的泛化、真实机器人验证和标准化长时基准仍不足。
    共识:
    - 研究普遍认为世界模型应超越静态或单步生成，向可控、时间一致和交互感知的动态演进。
    - 多类工作共享预测抽象：从视觉或多模态观察中学习或组织环境动态，并用于下游控制、规划或仿真。
    - 评估逐渐从单纯视觉真实转向可控性、长时一致性和任务成功，多个工作呼吁设计更强调这些性质的基准。
    - 开源代码、模型权重和基准工件被视为重要资产，但记录不均衡，可复现性仍存在验证缺口。
    - 多篇论文承认当前方法依赖已见组合、特定数据集或仿真，真实世界与未见实体泛化仍未解决。
    分歧:
    - 表示：部分方法采用连续、离散或混合潜在状态，另一些采用显式3D、以实体为中心或基于监控的全局状态实现持久性。
    - 交互模式：有的面向实时物理机器人学习，有的做离线动作条件视频生成，还有的做细粒度自我运动、物体和人体姿态控制。
    - 评测目标：有的关注视线外动态和长期场景一致性，有的关注可控性指标、闭环驾驶或真实机器人执行。
    - 证据类型：部分论文提出概念分类与评测方案但未做实证验证，方法论文报告经验提升但设置较窄。
    - 部署场景：物理机器人、仿真、离线视频和伪标注多模态数据在迁移假设与可比性上不同。
    开放问题:
    - 如何用统一基准实证验证分类与评测框架，而不只是提出概念？
    - 在计算约束下，哪些指标能弥合开环生成真实感与闭环任务成功之间的差距？
    - 世界模型如何处理训练中完全未见过的原语、物体或动态，而不仅是已见原语的重组？
    - 长期记忆、实时动作响应、视线外持久性和细粒度可控性中，哪一缺口最应优先解决？
    - 自动驾驶、机器人和具身视频生成中的发现是否跨设置迁移，还是仅适用于各自场景？
