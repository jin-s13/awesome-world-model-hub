  related_work_outline:
  - 'Mainstream direction: turning video generation models into action-conditioned
    world models for robotic manipulation, with growing emphasis on physical plausibility
    and cross-embodiment control.'
  - 'Shared research pattern: condition a diffusion or autoregressive model on past
    observations and actions to predict future frames, then use the rollout for planning,
    policy evaluation, or synthetic data generation.'
  - 'Key differences: methods differ in how they inject actions—adapter-based mask
    perturbation vs. unified diffusion timesteps vs. parallel context blocks—and in
    how they align rollouts with reality, including reward-based RL post-training,
    DPO, or test-time verifiers.'
  - 'Trend evolution: from adapting pretrained video models without retraining (2024)
    to unified multimodal pretraining (2025) and then to physics-aligned post-training
    and zero-shot benchmarks (2026), with a parallel survey calling for functional
    benchmarks beyond visual fidelity.'
  - 'Open questions: whether current models form an information bottleneck for fine-grained
    reasoning, how to systematically evaluate physical persistence and causal reasoning,
    and how to bridge the gap between formal world-model assumptions and empirical
    behavior.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型转化为面向机器人操作的动作条件化世界模型，并越来越重视物理可信度和跨本体控制。
  - 研究共性：通过历史观测和动作条件化扩散或自回归模型预测未来帧，进而利用生成轨迹进行规划、策略评估或合成数据生成。
  - 关键差异：动作注入方式不同（基于适配器的掩码扰动 vs. 统一扩散时间步 vs. 并行上下文块），以及对齐策略不同（基于奖励的RL后训练、DPO、测试时验证器）。
  - 趋势演进：从2024年无需重新训练即适配预训练视频模型，到2025年统一多模态预训练，再到2026年物理对齐后训练和零样本基准，同时出现倡导功能基准的调查性工作。
  - 开放问题：当前模型是否构成细粒度推理的信息瓶颈，如何系统评估物理持久性和因果推理，以及如何弥合形式化世界模型假设与经验行为之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: clarifying what a world model must represent and under which
        assumptions claims hold, such as decomposing video generation into state construction
        and dynamics modeling.
      what_remains_open: whether the formal conditions match empirical model behavior
        in realistic settings, and whether the proposed categories lead to testable
        design improvements.
    - line: Scaling laws and guarantees
      what_it_solves: connecting model size, data, objectives, or assumptions to expected
        behavior, with early work examining test-time compute scaling and verifying
        whether world models can reliably improve spatial reasoning through additional
        computation.
      what_remains_open: direct validation that the claimed scaling laws predict failures
        and transfers; current evidence points to an information bottleneck where
        increased computation does not consistently improve fine-grained reasoning.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: organizing fragmented world-model claims into categories (implicit/explicit
        state construction, knowledge integration/architectural reformulation) and
        advocating for functional benchmarks that measure physical persistence and
        causality.
      what_remains_open: whether the taxonomy changes how researchers evaluate or
        design models, and whether the proposed functional benchmarks are adopted
        and found to be predictive of real-world task performance.
    consensus:
    - Video generation models can be adapted into world models for decision-making
      by conditioning on actions, and this approach is promising for robotic manipulation.
    - Physical plausibility and action-frame alignment are critical challenges; visual
      fidelity alone is insufficient to guarantee useful world models.
    - Large-scale pretraining on diverse robot data, including action-free video,
      improves generalization and robustness over imitation learning alone.
    disagreements:
    - 'How to inject action signals: some methods use a learned mask to perturb a
      frozen pretrained model''s intermediate features, others integrate independent
      diffusion timesteps for video and action within a unified transformer, and yet
      others use parallel context blocks for precise spatial injection.'
    - 'What constitutes a good evaluation: metrics range from visual quality and FVD
      to task-specific simulation alignment and functional benchmarks that test physical
      persistence and causal reasoning.'
    - 'Alignment strategy: approaches differ in using reinforcement learning with
      a multi-dimensional reward model, direct preference optimization with decoupled
      discriminators, or test-time verifiers grounded in frame-anchored assertions.'
    open_questions:
    - Do current video-based world models form an information bottleneck that prevents
      them from enriching fine-grained spatial reasoning, as suggested by the failure
      of test-time scaling on MMSI-Bench?
    - Can functional benchmarks that measure physical persistence and causal reasoning
      replace or complement visual fidelity metrics, and will they lead to models
      that are more useful for downstream tasks?
    - How can we close the gap between formal world-model assumptions (e.g., explicit
      state representation) and current stateless video generation models, and would
      such a bridge improve long-horizon robustness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么，以及在哪些假设下主张成立，例如将视频生成分解为状态构建和动态建模。
      尚未覆盖: 形式化条件是否与真实场景中的经验模型行为相匹配，以及所提出的分类能否导致可测试的设计改进。
    - 路线: 缩放规律与保证
      解决的问题: 将模型规模、数据、目标或假设与预期行为联系起来，早期工作探究测试时计算缩放，验证世界模型能否通过额外计算可靠地改善空间推理。
      尚未覆盖: 直接验证声称的缩放规律能否预测失败和迁移；当前证据指出信息瓶颈，即增加计算并未持续改善细粒度推理。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为类别（隐式/显式状态构建、知识整合/架构重构），并倡导测量物理持久性和因果推理的功能基准。
      尚未覆盖: 这些分类是否改变研究者的评估或模型设计方式，以及所倡导的功能基准是否被采纳并证明能预测真实任务表现。
    共识:
    - 视频生成模型可以通过动作条件化适配为决策世界模型，这种方法在机器人操作中具有前景。
    - 物理可信度和动作-帧对齐是关键挑战；仅靠视觉保真度不足以保证有用的世界模型。
    - 在多样化机器人数据（包括无动作视频）上进行大规模预训练，比单纯模仿学习能带来更好的泛化和鲁棒性。
    分歧:
    - 动作信号的注入方式：有的方法使用学习到的掩码扰动冻结预训练模型的中间特征，有的在统一Transformer中为视频和动作设置独立的扩散时间步，还有的采用并行上下文块进行精确的空间注入。
    - 何为好的评估：指标范围从视觉质量和FVD到任务特定的仿真对齐，以及测试物理持久性和因果推理的功能基准。
    - 对齐策略：方法上存在差异，包括使用多维奖励模型的强化学习、带解耦判别器的直接偏好优化，以及基于帧锚定断言的测试时验证器。
    开放问题:
    - 当前基于视频的世界模型是否构成信息瓶颈，使其无法丰富细粒度空间推理，正如测试时缩放在MMSI-Bench上的失败所暗示的那样？
    - 测量物理持久性和因果推理的功能基准能否取代或补充视觉保真度指标，并引导出对下游任务更有用的模型？
    - 如何弥合形式化世界模型假设（如显式状态表示）与当前无状态视频生成模型之间的差距，这种弥合是否会改善长期鲁棒性？
