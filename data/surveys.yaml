  related_work_outline:
  - 'Mainstream direction: Building world models through video generation, with a
    focus on controllable, long-horizon, and interactive future prediction. This direction
    is expanding from simulated environments to real-world robotics and autonomous
    driving, driven by advances in diffusion and autoregressive models.'
  - 'Shared research pattern: Most works learn a latent or pixel-level dynamics model
    conditioned on actions, language instructions, or ego-motion, aiming to generate
    temporally consistent video sequences. They emphasize compositionality, out-of-sight
    persistence, and task-oriented controllability.'
  - 'Key differences: Representations vary from continuous latent states to discrete
    tokens or hybrid forms; control signals range from sparse rewards to dense multimodal
    cues; some methods target offline video generation while others require real-time
    interaction; evaluation shifts between visual fidelity, physical plausibility,
    and downstream task success.'
  - 'Trend evolution: Starting from model-based RL like DayDreamer (2022), the field
    rapidly moved to large-scale video world models (2024–2026), exemplified by RoboDreamer,
    LiveWorld, GEM, and open-source efforts like LingBot-World. Concurrently, surveys
    and taxonomies are consolidating benchmarks and open challenges, indicating a
    maturing frontier.'
  - 'Open questions: Whether current video world models genuinely understand physical
    laws or merely mimic visual correlations; how to generalize compositional primitives
    to entirely novel scenarios; how to integrate real-time interactivity with long-term
    memory without prohibitive compute; and the lack of a unified evaluation framework
    that spans visual quality, physical accuracy, and decision-making utility.'
  related_work_outline_zh:
  - 主流方向：通过视频生成构建世界模型，重点在于可控、长时程和交互式的未来预测。该方向正从模拟环境扩展到真实机器人和自动驾驶，受扩散模型和自回归模型进步推动。
  - 研究共性：多数工作学习一个以动作、语言指令或自我运动为条件的潜在或像素级动态模型，旨在生成时间一致的视频序列。它们强调组合性、视线外持久性和任务导向的可控性。
  - 关键差异：表示形式从连续潜在状态到离散令牌或混合体；控制信号从稀疏奖励到密集多模态线索；部分方法针对离线视频生成，而其他方法要求实时交互；评估在视觉保真度、物理合理性和下游任务成功率之间转换。
  - 趋势演进：从2022年的DayDreamer等基于模型的强化学习开始，领域迅速转向大规模视频世界模型（2024-2026），如RoboDreamer、LiveWorld、GEM以及LingBot-World等开源工作。同时，综述和分类法正在整合基准和开放挑战，表明前沿日趋成熟。
  - 开放问题：当前视频世界模型是否真正理解物理规律，还是仅模仿视觉相关性；如何将组合基元泛化到全新场景；如何在不增加过多计算负担的情况下集成实时交互与长期记忆；以及缺乏统一的评估框架，涵盖视觉质量、物理准确性和决策效用。
  literature_review:
    line_of_work_matrix:
    - line: World models as video generation engines
      what_it_solves: Predicting future frames from actions or language instructions,
        enabling compositional generalization, long-horizon consistency, and out-of-sight
        dynamics simulation. It provides a visual imagination layer for planning and
        control.
      what_remains_open: Generalization beyond seen combinations of primitives; real-time
        interaction latency; physical plausibility of generated dynamics; and verification
        that the model captures causal structure rather than visual correlations.
    - line: World models for robot learning and decision-making
      what_it_solves: Learning environment dynamics directly from high-dimensional
        sensor inputs to train policies in imagination, eliminating the need for simulators.
        It enables fast online adaptation on physical robots with sparse rewards.
      what_remains_open: Scalability to diverse tasks and embodiments; reliance on
        identical hyperparameters across tasks may not be optimal; limited to platforms
        where world model error does not lead to catastrophic real-world failures.
    - line: Latent world models for automated driving
      what_it_solves: A unified latent-space framework that organizes design choices
        (representation, structural priors) and internal mechanics (stability, alignment,
        compute) for driving world models. It aims to bridge open-loop training and
        closed-loop deployment.
      what_remains_open: The proposed taxonomy and evaluation suite lack empirical
        validation; no consensus on which latent representations or structural priors
        best capture safety-critical driving scenarios; resource-aware inference cost
        trade-offs are not yet tested in practice.
    - line: Interactive world modeling surveys and benchmarks
      what_it_solves: Systematizing the fragmented landscape of interactive world
        models, identifying key challenges (action-conditioned controllability, long-horizon
        memory, real-time responsiveness), and comparing benchmarks across open-world,
        driving, and robotics domains.
      what_remains_open: Coverage may lag behind rapidly evolving methods; the identified
        challenges are based on current trends and may shift; no standardized benchmark
        suite exists that jointly evaluates visual quality, interaction fidelity,
        and downstream task performance.
    consensus:
    - World models are shifting from static environment models to dynamic, interactive,
      and video-based generative simulators.
    - Compositionality and factorization of control signals (language, action, pose)
      are critical for generalizing to unseen tasks.
    - Long-horizon temporal consistency and out-of-sight dynamics are recognized as
      major open challenges that current models struggle with.
    - Evaluation is moving from purely visual quality metrics toward task-oriented
      and closed-loop assessments that better reflect real-world utility.
    - Open-source releases are accelerating both reproducibility and community-driven
      benchmarking.
    disagreements:
    - 'Representation: continuous latent states vs. discrete tokens vs. hybrid models,
      with no clear winner for stability, compression, and control.'
    - 'Supervision: some works rely on sparse task rewards while others use dense
      multimodal signals such as reference frames, depth, and human poses, affecting
      generalization and data requirements.'
    - 'Interaction mode: offline video generation for planning vs. real-time interactive
      simulation, with different latency and memory trade-offs.'
    - 'Evaluation target: visual fidelity (FID, LPIPS) vs. physical consistency (object
      permanence, causality) vs. downstream task success (robot execution, driving
      safety), leading to incompatible conclusions across papers.'
    - 'Deployment setting: methods designed for simulated environments or specific
      robot platforms may not transfer to general-purpose world simulation without
      substantial re-engineering.'
    open_questions:
    - Can video generation-based world models learn causal physical laws, or do they
      remain sophisticated pattern matchers?
    - How can compositional primitives be extended to novel objects and actions not
      seen during training?
    - What is the minimal set of control signals and inductive biases needed to achieve
      human-level scene understanding in dynamic environments?
    - How should real-time interactivity and long-term memory be balanced against
      computational cost for practical deployment?
    - Why is there no unified benchmark that jointly evaluates visual quality, physical
      accuracy, and decision-making utility, and how can it be designed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 作为视频生成引擎的世界模型
      解决的问题: 从动作或语言指令预测未来帧，实现组合泛化、长时程一致性和视线外动态模拟。为规划和控制提供视觉想象层。
      尚未覆盖: 对基元组合之外的泛化；实时交互延迟；生成动态的物理合理性；模型是否捕捉因果结构而非视觉相关性仍需验证。
    - 路线: 用于机器人学习与决策的世界模型
      解决的问题: 直接从高维传感器输入学习环境动态，在想象中训练策略，无需模拟器。在物理机器人上实现稀疏奖励下的快速在线适应。
      尚未覆盖: 向多样化任务和形态的扩展性；跨任务使用相同超参数可能非最优；仅限于世界模型误差不导致灾难性现实失败的平台。
    - 路线: 自动驾驶潜在世界模型
      解决的问题: 统一潜在空间框架，组织设计选择（表示、结构先验）和内部机制（稳定性、对齐、计算），旨在弥合开环训练与闭环部署的差距。
      尚未覆盖: 所提分类法和评估套件缺乏实证验证；哪种潜在表示或结构先验最适合安全关键驾驶场景尚无共识；资源感知推理成本权衡尚未实践检验。
    - 路线: 交互式世界建模综述与基准
      解决的问题: 系统化交互式世界模型的碎片化格局，识别关键挑战（动作条件可控性、长时记忆、实时响应），比较开放世界、驾驶和机器人领域的基准。
      尚未覆盖: 覆盖范围可能滞后于快速演进的方法；识别的挑战基于当前趋势，可能变化；尚无联合评估视觉质量、交互保真度和下游任务性能的标准化基准套件。
    共识:
    - 世界模型正从静态环境模型转向动态、交互式、基于视频的生成模拟器。
    - 控制信号（语言、动作、姿态）的组合性和因子分解对于泛化到未见任务至关重要。
    - 长时程时间一致性和视线外动态被普遍认为是当前模型难以应对的主要开放挑战。
    - 评估正从纯视觉质量指标转向以任务为导向的闭环评估，以更好地反映真实世界效用。
    - 开源发布加速了可复现性和社区驱动的基准建设。
    分歧:
    - 表示方式：连续潜在状态 vs. 离散令牌 vs. 混合模型，在稳定性、压缩性和可控性上没有明确赢家。
    - 监督信号：部分工作依赖稀疏任务奖励，而其他工作使用密集多模态信号（参考帧、深度、人体姿态），影响泛化能力和数据需求。
    - 交互模式：用于规划的离线视频生成 vs. 实时交互式模拟，具有不同的延迟和内存权衡。
    - 评测目标：视觉保真度（FID、LPIPS） vs. 物理一致性（物体持久性、因果性） vs. 下游任务成功（机器人执行、驾驶安全），导致跨论文结论不兼容。
    - 部署场景：为模拟环境或特定机器人平台设计的方法，在迁移到通用世界模拟时可能需要大量重新工程。
    开放问题:
    - 基于视频生成的世界模型能否学习因果物理规律，还是它们只是复杂的模式匹配器？
    - 如何将组合基元扩展到训练中未见的新物体和动作？
    - 在动态环境中实现人类水平场景理解所需的最小控制信号和归纳偏置集是什么？
    - 在实际部署中，如何在实时交互性和长期记忆之间平衡计算成本？
    - 为何没有统一基准同时评估视觉质量、物理准确性和决策效用，以及如何设计？
