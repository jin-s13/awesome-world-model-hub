  related_work_outline:
  - 'Mainstream direction: Generative world models based on transformers and diffusion,
    increasingly conditioned on actions, context, or physics-related auxiliary objectives
    for video prediction and downstream control.'
  - 'Shared research pattern: Learn a predictive model from interaction frames or
    video, then use imagined rollouts, compositional generation, or coupled action-video
    modeling for policy learning, planning, or robot execution.'
  - 'Key differences: Stochastic representation choices vary from recurrent state-space
    VAEs to diffusion transformers with masked or physics-informed objectives; evaluation
    targets range from Atari scores and driving rollouts to open-domain memory/action-control
    benchmarks.'
  - 'Trend evolution: The frontier moves from 2023 efficient Atari model-based RL
    toward 2024 contextual/compositional robot world models, then 2025-2026 diffusion,
    physics-informed, driving, and benchmarking work on memory and action control.'
  - 'Open questions: How much reported gain comes from the world model versus planner,
    task prior, dataset, or baseline choices; whether generalization extends beyond
    observed contexts, seen primitive combinations, simulation, and reported domains;
    and how to guarantee long-horizon consistency.'
  related_work_outline_zh:
  - 主流方向：以Transformer和扩散为基础的生成式世界模型，逐步加入动作、上下文或物理相关辅助目标，用于视频预测和下游控制。
  - 研究共性：从交互帧或视频学习预测模型，再通过想象推演、组合生成或动作-视频耦合建模进行策略学习、规划或机器人执行。
  - 关键差异：随机表示方式从循环状态空间VAE到扩散Transformer，含掩码重建或物理信息目标；评测目标从Atari得分、驾驶推演到开放域记忆/动作控制基准。
  - 趋势演进：2023年关注高效Atari模型强化学习，2024年出现上下文/组合式机器人世界模型，2025-2026年扩散、物理信息、驾驶和记忆/动作控制评测增多。
  - 开放问题：报告收益有多少来自世界模型而非规划器、任务先验、数据集或基线；泛化能否超越已见上下文、已见原语组合、仿真和已报告领域；如何保证长时域一致性。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic and generative world-model architectures
      what_it_solves: Representation and objective design for pixel-based dynamics
        from visual or state-action streams, using transformers, VAEs, diffusion,
        or mask reconstruction.
      what_remains_open: Whether architectural gains transfer beyond Atari 100k, CARL,
        driving, or robot video domains; long-horizon stochastic calibration and temporal
        consistency remain incompletely verified.
    - line: Context-aware and compositional world models
      what_it_solves: Zero-shot or compositional generalization by conditioning on
        observable context or language-derived primitives so unseen combinations can
        be imagined.
      what_remains_open: Observability of context, support for novel primitives, and
        whether generalization derives from the world model or from task-specific
        conditioning remain unclear.
    - line: Action-coupled and planning-oriented dynamics
      what_it_solves: Connecting learned dynamics to decisions through imagined rollouts,
        unified action-video diffusion, or robot policy training and execution.
      what_remains_open: Contribution separation between model and planner/controller;
        real-robot execution beyond simulation; alignment with action-free video data
        remain open.
    - line: Method evidence and evaluation protocols
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control with open-domain or loop-based video benchmarks rather than only visual
        fidelity.
      what_remains_open: Whether benchmarks isolate method effects from implementation
        and dataset choices; long-term consistency and cross-action-space transfer
        still challenge current models.
    consensus:
    - Recent work treats world models as generators of action- or context-conditioned
      video/rollouts for downstream policy or planning, not only as observation reconstructors.
    - Evaluation increasingly includes long-horizon, zero-shot, or unseen-goal settings
      and adds spatial, memory, or physical consistency signals beyond visual quality.
    - Conclusions are strongly tied to benchmark-specific datasets, baselines, and
      implementation choices, so reported performance depends on surrounding system
      conditions.
    disagreements:
    - 'Representation differs: recurrent state-space models with VAE-style stochasticity
      versus diffusion transformers with masked reconstruction or physics-informed
      auxiliary tasks.'
    - 'Conditioning differs: explicit observable context, language-parsed primitives,
      or unified modality-specific diffusion timesteps impose different assumptions
      about task structure.'
    - 'Evaluation target differs: Atari human-normalized scores, driving multi-view
      rollouts, robot task execution, or open-domain memory/action-control metrics
      reward different model properties.'
    - 'Deployment setting differs: single-environment RL, large robot datasets, Minecraft
      open world, or multi-view driving data create non-comparable training and evaluation
      conditions.'
    open_questions:
    - Which architectural or objective component is responsible for reported gains
      when datasets, baselines, metrics, and implementation choices vary together?
    - Can context/compositional generalization extend beyond observed contexts or
      seen primitive combinations, including real-world settings without observable
      context?
    - How should long-term memory consistency and cross-action-space control be evaluated,
      and is visual or spatial consistency a reliable proxy for physical plausibility?
    - What evidence isolates downstream policy improvement caused by the learned world
      model rather than by planner, action decoder, or task prior?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 随机与生成式世界模型架构
      解决的问题: 从视觉或状态-动作流学习像素级动力学，使用Transformer、VAE、扩散或掩码重建等表示与目标。
      尚未覆盖: 架构收益能否迁移到Atari 100k、CARL、驾驶或机器人视频之外；长时域随机校准与时间一致性验证仍不充分。
    - 路线: 上下文感知与组合式世界模型
      解决的问题: 通过可观测上下文或语言派生原语进行条件化，实现对未见组合的零样本或组合泛化。
      尚未覆盖: 上下文可观测性、新原语支持，以及泛化来自世界模型还是任务条件化仍不清楚。
    - 路线: 动作耦合与面向规划的动力学
      解决的问题: 将学习动力学连接到决策，通过想象推演、统一动作-视频扩散或机器人策略训练执行。
      尚未覆盖: 模型与规划器/控制器的贡献分离；仿真之外的实机执行；无动作视频数据的对齐仍开放。
    - 路线: 方法证据与评测协议
      解决的问题: 以空间一致性、记忆一致性和动作控制等开放域或循环视频基准衡量世界模型，而非仅看视觉保真度。
      尚未覆盖: 评测是否隔离了方法效果与实现/数据集选择；长期一致性和跨动作空间迁移仍是当前模型挑战。
    共识:
    - 近期工作倾向于让世界模型生成动作或上下文条件化的视频/推演，用于下游策略或规划，而非仅重建观测。
    - 评估中普遍加入长时域、零样本或未见目标设置，并引入空间、记忆或物理一致性等视觉质量之外的信号。
    - 结论高度依赖特定基准的数据集、基线和实现选择，因此报告性能受周边系统条件影响。
    分歧:
    - 表示方式不同：循环状态空间VAE与扩散Transformer并存，后者可能加入掩码重建或物理信息辅助任务。
    - 条件化方式不同：可观测上下文、语言解析原语或统一模态特定扩散时间步分别依赖不同的任务结构假设。
    - 评测目标不同：Atari人类归一化得分、驾驶多视角推演、机器人任务执行或开放域记忆/动作控制指标奖励不同模型性质。
    - 部署场景不同：单环境RL、大规模机器人数据、Minecraft开放世界或多视角驾驶数据造成训练与评测条件不可直接比较。
    开放问题:
    - 当数据集、基线、指标和实现选择同时变化时，哪些架构或目标组件真正贡献了报告收益？
    - 上下文/组合泛化能否超越已见上下文或已见原语组合，并进入不假设上下文可观测的真实场景？
    - 如何衡量长期记忆一致性和跨动作空间控制，视觉或空间一致性是否能可靠代表物理合理性？
    - 有哪些证据证明下游策略提升来自世界模型本身，而非规划器、动作解码器或任务先验？
