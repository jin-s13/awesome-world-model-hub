  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for autonomous driving and
    embodied robot control dominate, with sub-directions in driving scene generation,
    robot imagination/pretraining, and consistency benchmarks for interactive environments.'
  - 'Shared research pattern: Coupling video generation with action, context, language,
    or physics signals; self-supervised sequence modeling; evaluation through benchmarks,
    rollout metrics, or downstream task success.'
  - 'Key differences: Representation and conditioning differ across unified video-action
    diffusion, compositional generation, and context-conditioned state-space models;
    evaluation targets span driving rollouts, robot task success, and game memory/action
    consistency.'
  - 'Trend evolution: Within the available 2023-2026 evidence, work moves from efficient
    model-based RL on Atari toward domain-specific driving and robotics models, with
    newer benchmarks for memory, spatial, and action consistency.'
  - 'Open questions: Whether simulation and benchmark gains transfer to real-world
    safety and operations; how to verify physical, memory, and action consistency
    across long horizons and unseen dynamics.'
  related_work_outline_zh:
  - 主流方向：自动驾驶与具身机器人成为主要应用，强调生成式世界模型用于场景预测、视频计划和策略学习。
  - 研究共性：将视频生成与动作、物理或上下文条件耦合，使用自监督序列建模，并用基准或任务评估验证。
  - 关键差异：表示与条件化方式不同，如统一视频-动作扩散、组合生成、上下文状态空间；评测目标覆盖驾驶跨数据集、机器人任务与游戏一致性。
  - 趋势演进：从通用模型驱动强化学习转向领域特定的驾驶与机器人世界模型，并出现面向记忆、空间和动作一致性的评测基准。
  - 开放问题：真实环境迁移、物理与长时记忆一致性、跨动作空间与未见原语泛化，以及现有指标与真实安全结果的对齐。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation use cases
      what_it_solves: Applies world models to driving scene prediction, multi-view
        and long-horizon video generation, and cross-dataset zero-shot evaluation.
      what_remains_open: Alignment between multi-dataset gains and real-world driving
        safety or operational outcomes remains unverified; evidence lacks explicit
        failure analysis for this line.
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot and RL tasks through compositional
        primitives, context-conditioned state-space models, physics-informed generation,
        or unified video-action diffusion.
      what_remains_open: Generalization to unseen primitives, embodiments, or unobserved
        dynamics remains uncertain; many evaluations stop at simulation or video planning,
        with limited real robot execution evidence.
    - line: Interactive agents and games
      what_it_solves: Provides efficient model-based RL for Atari-like environments
        and benchmarks spatial, memory, and action-control consistency in open interactive
        settings.
      what_remains_open: Long-term memory consistency and cross-action-space control
        remain open challenges; benchmark papers focus on dataset construction and
        reveal difficulties but do not yet report full baseline result evidence.
    consensus:
    - Application-focused world models increasingly couple video generation with task-relevant
      signals such as actions, language, context, or physics to improve domain-specific
      dynamics modeling.
    - Evaluation is shifting from visual fidelity alone toward domain-specific capabilities
      such as cross-dataset zero-shot rollouts, policy utility, spatial and memory
      consistency, and action control.
    - Methods commonly rely on self-supervised sequence modeling with transformer,
      diffusion, or recurrent state-space architectures.
    disagreements:
    - 'Representation and conditioning differ: unified video-action diffusion, compositional
      video generation, and context-conditioned recurrent state-space models form
      distinct routes.'
    - 'Evaluation targets differ: driving cross-dataset rollouts, robot task success
      and video plans, and game memory/action consistency are emphasized by different
      lines of work.'
    - 'Supervision and data assumptions differ: some approaches assume observable
      context values or parseable language primitives, while others leverage large
      multitask robot datasets or action-free video.'
    - Deployment and validation depth differ, ranging from simulated video plans to
      attempts at real robot execution, with uneven evidence maturity.
    open_questions:
    - Can driving world model improvements on current multi-dataset metrics translate
      into verified real-world safety or operational outcomes?
    - Can compositional and context-conditioned world models generalize to unseen
      primitives, embodiments, or fully unobserved dynamics?
    - How should long-term memory consistency and cross-action-space control be evaluated
      without relying solely on pixel-level or scene-graph-specific metrics?
    - What evaluation protocol can jointly verify physical plausibility, action consistency,
      and downstream policy training benefits?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于驾驶场景预测、多视角与长时域视频生成及跨数据集评测。
      尚未覆盖: 真实驾驶安全与运营结果是否一致尚未验证；该路线的证据缺少显式失效分析。
    - 路线: 具身与领域任务迁移
      解决的问题: 通过组合原语、上下文状态空间、物理信息或统一视频-动作扩散，将世界模型适配到机器人与强化学习任务。
      尚未覆盖: 未见原语、本体或不可观测动态的泛化仍不明确；部分评测止于仿真或视频计划，真实机器人执行证据有限。
    - 路线: 交互式智能体与游戏
      解决的问题: 提升游戏环境中世界模型的样本效率，并为空间一致性、记忆一致性和动作控制提供评测。
      尚未覆盖: 长期记忆一致性和跨动作空间泛化仍是挑战；基准论文侧重数据集构建，尚未报告完整基线结果证据。
    共识:
    - 应用型世界模型逐渐将视频生成与动作、语言、上下文或物理信号耦合，以提升任务相关动态建模。
    - 评估重心从视觉质量扩展到领域特定能力，例如跨数据集零样本回放、策略可用性、空间与记忆一致性、动作控制。
    - 方法多采用Transformer、扩散或循环状态空间架构，并以自监督方式进行序列建模。
    分歧:
    - 表示与条件化方式不同：统一视频-动作扩散、组合式视频生成、上下文条件状态空间各成路线。
    - 评测目标不同：驾驶跨数据集滚动、机器人任务成功与视频计划、游戏中的记忆/动作一致性分别被强调。
    - 监督与数据假设不同：部分依赖可观测上下文或可解析语言原语，部分利用大规模机器人数据集或无动作视频。
    - 部署环境与验证深度不同：从仿真视频计划到真实机器人执行，证据成熟度存在差异。
    开放问题:
    - 驾驶世界模型在现有跨数据集指标上的提升能否转化为真实安全或运营结果？
    - 组合式与上下文条件世界模型能否泛化到未见原语、本体或不可观测动态？
    - 如何在不依赖像素级或场景图特定指标的情况下评估长期记忆一致性与跨动作空间控制？
    - 现有物理合理性、动作一致性和策略训练收益是否需要在统一协议下同时验证？
