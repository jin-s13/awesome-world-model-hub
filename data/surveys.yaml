  related_work_outline_zh:
  - 主流方向：当前最强的方向是具身和自主领域世界建模，包括机器人/驾驶视频生成与动作条件仿真，并出现针对记忆与空间一致性的能力基准。
  - 研究共性：多数工作将生成式视频或序列建模与动作、语言、上下文、物理等领域信号耦合，并通过下游控制、长期 rollout 或一致性指标来验证。
  - 关键差异：差异体现在表示方式、监督信号和评测目标上，包括循环状态空间模型、Transformer/扩散模型、掩码重建、物理信息目标以及零样本或闭环基准。
  - 趋势演进：证据从2023年前后关注游戏基准上的高效模型驱动强化学习，转向2024-2025年大规模机器人/驾驶生成式世界模型，再到2026年前后闭环记忆与动作基准构建；整体处于当前前沿。
  - 开放问题：真实世界迁移、对未见任务或动作的泛化、长时域记忆一致性，以及基准提升与运行安全/业务结果之间的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robotic or control domains by conditioning
        video generation on language, actions, context, or physical knowledge to support
        policy training and task generalization.
      what_remains_open: Transfer across embodiments, datasets, and physical environments;
        robustness to unseen primitives or unobservable context; most validation remains
        in simulation or limited task suites.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view, long-horizon driving scene
        prediction and zero-shot evaluation across driving datasets.
      what_remains_open: Whether simulation and video prediction gains map to real-world
        driving safety or operational outcomes, and whether model assumptions hold
        across diverse road environments.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in interactive environments where actions
        must affect future observations, and benchmarks memory consistency and action
        control.
      what_remains_open: Generalization across environment rules, goals, and action
        spaces; long-term memory consistency; some benchmarks report construction
        evidence but not full experimental results.
    consensus:
    - A common pattern is coupling generative video or sequence models with action,
      language, context, or physics signals to produce action-conditioned rollouts
      and evaluate downstream control or prediction quality.
    - Recent work increasingly emphasizes closed-loop evaluation, domain-specific
      generalization, and memory or spatial consistency rather than only per-frame
      visual fidelity.
    - Several works use large or diverse domain datasets and open artifacts, but some
      papers omit limitations or use narrow evaluation suites, leaving reproducibility
      and negative-result gaps.
    disagreements:
    - 'Representation: some approaches use recurrent state-space latent dynamics,
      while others use transformer or diffusion video models or masked reconstruction.'
    - 'Supervision: some require explicit observable context, language primitives,
      depth, or keypoint dynamics, whereas others learn from video or action data
      without such structure.'
    - 'Evaluation target: studies optimize zero-shot contextual RL, Atari human-normalized
      score, driving multi-view or long-horizon prediction, robot execution, or memory
      and action consistency benchmarks.'
    - 'Interaction and deployment setting: work ranges from offline video generation
      and simulation rollouts to closed-loop action-conditioned benchmarks; real-world
      operational validation is often missing.'
    open_questions:
    - Can embodied and driving world models trained in simulation or on datasets transfer
      to real-world robots and safety-critical driving operations?
    - How do models generalize beyond seen context values, primitive combinations,
      action spaces, or environment rules?
    - What metrics should operationalize memory consistency, spatial consistency,
      and action control in long-horizon open-domain settings?
    - What is the tradeoff between injecting explicit physics or context structure
      and scaling to large heterogeneous datasets with missing labels?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
