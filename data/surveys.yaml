  - 趋势演进：从2024年围绕Sora的通用世界模型综述，到2026年更聚焦的交互式视频世界建模和自动驾驶潜在世界模型，趋势是领域专用化和评估标准化。
  - 开放问题：分类法的实证验证、跨设置结果兼容性、以及如何将开放问题优先排序以推动领域进步。
