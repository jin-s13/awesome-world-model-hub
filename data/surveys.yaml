  - 'Key differences: The evidence ranges from conceptual taxonomies with no empirical
    validation to deployed methods evaluated on physical robots, simulation, video
    benchmarks, traffic simulation, and autonomous-driving metrics.'
  - 'Trend evolution: Within a narrow 2022-2026 frontier, work moves from real-robot
    online world-model learning toward generative video, fine-grained control, open-source
