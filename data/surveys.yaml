      尚未覆盖: 长时程一致性、未见域泛化，以及视觉保真度是否能转化为下游策略性能仍不明确。
    - 路线: 基准与评估框架
      解决的问题: 通过数据集、指标和基线量化世界模型系统的空间、动作和物理保真度。
      尚未覆盖: 跨领域标准化不足，且这些指标与下游部署结果之间的关系尚缺证据。
    - 路线: 物理机器人学习与实时部署栈
      解决的问题: 将世界模型学习部署到真实硬件和闭环服务中，实现低延迟生成和在线适应。
      尚未覆盖: 硬件多样性、无需模拟器的训练、独立复现，以及多智能体或多相机可扩展性。
    共识:
    - 领域正在汇聚到世界模型作为生成式未来状态预测器，可支撑下游控制或评估，而非只做静态感知。
    - 研究共同转向动作可控生成，并通过指标、基准或下游策略训练来显式量化保真度。
    - 多个系统通过开放工件、数据集和代码考虑可复现性，但现有证据常止步于窄基准上的提升。
    分歧:
    - 表示选择不同：从循环潜在状态空间模型，到视频扩散Transformer、自回归帧生成，以及带深度或关键点目标的物理信息RGB预测。
    - 监督与数据来源不同：真实交互中的稀疏奖励、大规模轨迹标注驾驶视频、上下文条件强化学习任务和预训练视频先验。
    - 评测重点不同：有的关注零样本上下文泛化，有的关注动作忠实度、空间一致性、视觉保真度、物理合理性或亚秒级闭环延迟。
    - 部署假设不同：有的假设上下文值可观测且使用仿真基准，有的依赖真实机器人或单GPU实时运行。
    开放问题:
    - 当前空间、动作和视觉保真度指标是否能预测下游策略成功或现实安全？
    - 这些模型能否在更长时程和分布偏移条件下保持一致的时间、空间和跨视角一致性？
    - 当前系统能否泛化到已报告平台和数据集之外，如CARL、nuScenes、Minecraft和特定机器人硬件？
    - 实时闭环多相机或物理机器人系统仍有哪些速度-保真度-部署权衡？
