  related_work_outline_zh:
  - 主流方向：以可运行世界模拟器为核心，将生成式视频模型转化为可受动作或轨迹控制的环境模拟，尤其用于自动驾驶闭环仿真和具身控制。
  - 研究共性：多数工作将未来帧或视频生成条件化于动作、轨迹或上下文，并评估时序一致性、动作忠实度、视觉质量或下游规划与策略效果。
  - 关键差异：系统在生成主干、监督信号、评测目标和部署模式上分化；有的强调物理/深度/关键点，有的强调场景图或上下文变量，少数面向单GPU低延迟闭环服务。
  - 趋势演进：从2024年的条件世界模型和基准评测，走向2025至2026年的闭环系统部署，更关注延迟、自回归漂移、动作忠实度基准与开放工件。
  - 开放问题：当前数据集之外的泛化、长时程稳定性、物理与空间一致性的可靠度量、跨基础设施独立复现，以及模型容量与部署效率的权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world simulation
      what_it_solves: Turns generative video models into dynamics simulators whose
        future frames follow control inputs such as actions or trajectories.
      what_remains_open: Long-horizon rollouts still drift under self-conditioning,
        and action fidelity is demonstrated mainly on selected game, robotics, or
        driving datasets.
    - line: Physics-informed embodied simulation
      what_it_solves: Adds geometric and physical structure such as depth, keypoint
        dynamics, or scene graphs to improve visual fidelity and spatial plausibility.
      what_remains_open: Physical plausibility is often inferred rather than directly
        measured, and evaluation metrics remain sensitive to the chosen dataset domain.
    - line: Benchmark and evaluation frameworks for simulation quality
      what_it_solves: Provides datasets, metrics, and open-access evaluation protocols
        for specific world-model properties such as spatial consistency or action
        fidelity.
      what_remains_open: Independent reproduction across teams and adoption beyond
        the original benchmark setting are not established.
    - line: Low-latency closed-loop driving simulators
      what_it_solves: Packages multi-view video generation into a deployment-oriented
        system that can run on a single GPU at sub-second latency for closed-loop
        autonomous driving simulation.
      what_remains_open: Generalization beyond nuScenes, sensor configurations, extended
        sequences, and complex deployment hardware remains unresolved.
    - line: Contextual model-based reinforcement learning
      what_it_solves: Conditions latent world-model dynamics on observable context
        to improve zero-shot policy generalization in model-based RL.
      what_remains_open: It assumes context observability and is evaluated on only
        two CARL benchmark tasks, leaving broader generalization unverified.
    consensus:
    - Several papers converge on using generative video models as runnable world simulators
      for closed-loop or model-based control rather than static generators.
    - Action or trajectory conditioning is a shared mechanism, with evaluation increasingly
      trying to measure whether generated futures follow the requested control.
    - Dataset and benchmark artifacts are common anchors, but evaluations remain concentrated
      around specific driving, robotic, or game environments.
    - Temporal consistency and long-horizon coherence have become central concerns,
      not only single-frame visual quality.
    disagreements:
    - 'Representation and generation differ: autoregressive frame prediction, diffusion
      transformers, recurrent state-space models, and plug-in action modules over
      pretrained generators are all used.'
    - 'Supervision signals differ: physics-oriented auxiliary tasks, trajectory annotations,
      scene graph consistency, observable context variables, and motion-reinforced
      losses foreground different inductive biases.'
    - 'Evaluation targets differ: spatial consistency, action fidelity, visual fidelity,
      physical plausibility, planning quality, or zero-shot policy generalization
      are each treated as the main success criterion.'
    - 'Deployment settings differ: some systems target offline benchmark evaluation,
      others model-based RL imagination, and a subset optimizes for low-latency single-GPU
      closed-loop driving.'
    open_questions:
    - How can action-conditioned world simulators move beyond nuScenes, CARL, Minecraft,
      or curated robotic settings to show robustness under new sensors, environments,
      and tasks?
    - Which evaluation metric best separates true spatial and physical consistency
      from pixel-level or appearance similarity across different simulators?
    - What mechanism prevents long-horizon autoregressive rollouts from drifting when
      outputs are repeatedly reused as conditioning inputs?
    - Can lightweight action-conditioned or context-conditioned modules retain enough
      capacity for specialized real-world deployment without inheriting pretrained
      model failures?
    - Are the released benchmarks and codebases independently reproducible across
      teams and infrastructure, given that many evidence fields only show artifact
      presence rather than reproduction results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 行动可控的世界模拟
      解决的问题: 将生成式视频模型转化为可根据动作或轨迹控制未来帧的动态模拟器。
      尚未覆盖: 长时程自回归推演仍会漂移；动作忠实度主要在游戏、机器人或驾驶等选定数据集中验证。
    - 路线: 物理信息具身仿真
      解决的问题: 通过深度、关键点动力学或场景图等结构与物理信号，提高视频生成的空间与物理合理性。
      尚未覆盖: 物理合理性多被间接推断，缺少跨领域直接度量；指标对数据集域敏感。
    - 路线: 仿真质量基准与评估框架
      解决的问题: 提供数据集、指标和开放评估协议，量化空间一致性或动作忠实度等特定能力。
      尚未覆盖: 跨团队独立复现和原始基准之外的采用仍未被证实。
    - 路线: 低延迟闭环驾驶模拟
      解决的问题: 将多视图视频生成打包为可在单GPU上亚秒级运行的闭环自动驾驶仿真系统。
      尚未覆盖: 对nuScenes之外的传感器配置、长序列和复杂部署硬件泛化未解决。
    - 路线: 上下文模型化强化学习
      解决的问题: 在潜在世界模型动力学中引入可观测上下文，提高模型化强化学习的零样本策略泛化。
      尚未覆盖: 假设上下文可观测；仅在CARL两个任务上评估，更广泛化未知。
    共识:
    - 多篇工作汇聚到将生成式视频模型作为可运行世界模拟器，用于闭环或基于模型的控制，而非只做静态生成。
    - 动作或轨迹条件化是共性机制，评估越来越关注生成未来是否符合控制输入。
    - 数据集和基准工件是常用锚点，但评估仍集中在特定驾驶、机器人或游戏环境。
    - 时序一致性和长时程连贯性成为核心关切，而不是仅看单帧视觉质量。
    分歧:
    - 表示与生成方式不同：自回归帧预测、扩散Transformer、循环状态空间模型，以及插入预训练生成器的动作模块等路线并存。
    - 监督信号不同：物理导向辅助任务、轨迹标注、场景图一致性、可观测上下文变量和运动增强损失分别强调不同归纳偏置。
    - 评测目标不同：空间一致性、动作忠实度、视觉保真度、物理合理性、规划质量或零样本策略泛化各自被视为主指标。
    - 部署场景不同：有的面向离线基准评估，有的用于基于模型的强化学习想象，还有的优化单GPU低延迟闭环驾驶。
    开放问题:
    - 行动可控世界模拟器如何超越nuScenes、CARL、Minecraft或精选机器人环境，在新的传感器、环境和任务下保持可靠性？
    - 哪种评测指标能更好区分真正的空间/物理一致性与像素级或外观相似性？
    - 当输出被反复用作条件输入时，何种机制能防止长时程自回归推演漂移？
    - 轻量级动作条件或上下文条件模块是否具有足够容量用于专业化真实部署，并避免继承预训练模型的失败模式？
    - 现有开放基准和代码能否被跨团队、跨基础设施独立复现？目前证据主要显示工件存在，而非复现结果。
