  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video generative models as
    world models for embodied agents, primarily applied to robot manipulation and
    spatial reasoning. These models are trained on large-scale robot datasets and
    evaluated on physical plausibility and task performance.'
  - 'Shared research pattern: All works treat video prediction as a proxy for world
    state transition, condition on actions, and then either evaluate generation quality
    or use the model for planning. The trend is to scale up models and data, and to
    introduce alignment steps to improve physical realism.'
  - 'Key differences: Architectures vary (diffusion transformers, masked autoregression),
    action injection methods differ (unified timesteps, mask adaptation, parallel
    blocks), and alignment strategies range from RL-based reward optimization to DPO.
    Evaluation settings diverge between zero-shot benchmarks, simulated tasks, and
    real-robot transfer.'
  - 'Trend evolution: The evidence spans 2015–2026, but the top papers cluster in
    2024–2026, indicating a rapid surge in video-based world models. Early work likely
    focused on isolated components; the recent trend is toward large-scale pretraining,
    alignment with physics, and systematic analysis of limitations. The emergence
    of surveys and benchmarks suggests maturing.'
  - 'Open questions: Whether current world models truly learn causal dynamics or only
    memorize patterns; how to verify their reliability in out-of-distribution scenarios;
    how to close the gap between video generation and formal world model theory.'
  related_work_outline_zh:
  - 主流方向：构建动作条件化视频生成模型作为具身智能体的世界模型，主要应用于机器人操作和空间推理，通过大规模机器人数据集训练，并以物理合理性和任务性能评估。
  - 研究共性：所有工作将视频预测作为世界状态转移的代理，以动作为条件，然后评估生成质量或用于规划；趋势是扩大模型和数据规模，并引入对齐步骤提升物理真实性。
  - 关键差异：架构不同（扩散Transformer、掩码自回归），动作注入方式各异（统一时间步、掩码适配、并行块），对齐策略从基于RL的奖励优化到DPO不等；评估设置分化，包括零样本基准、模拟任务和真实机器人迁移。
  - 趋势演进：证据涵盖2015–2026年，但高排名论文集中在2024–2026年，表明视频世界模型近期爆发式增长；早期工作可能关注独立组件，近期趋势是规模化预训练、物理对齐和系统化缺陷分析，调查和基准的出现预示领域正走向成熟。
  - 开放问题：当前世界模型是否真正学习因果动力学还是仅记忆模式；如何验证其在分布外场景的可靠性；如何弥合视频生成与形式化世界模型理论之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Unified video-action diffusion for world modeling (e.g., UWM, IRASim,
        HMA)
      what_it_solves: Learning action-conditioned dynamics and policy jointly from
        large-scale robot data, enabling flexible generation of future video frames
        and control.
      what_remains_open: Whether the model learns a true state representation or merely
        memorizes transitions; generalization to unseen embodiments and tasks remains
        limited.
    - line: Adapting pretrained video models to action-conditioned world models (e.g.,
        AVID)
      what_it_solves: Leveraging existing video generative priors without full retraining,
        reducing the need for large domain-specific datasets.
      what_remains_open: Dependency on the quality and bias of the pretrained model;
        still requires action-annotated data for adaptation, and the adapter may not
        correct fundamental model flaws.
    - line: Aligning world models with physical realism and preferences (e.g., ReWorld,
        ABot-PhysWorld)
      what_it_solves: Improving the physical plausibility, task consistency, and visual
        quality of generated videos through reward modeling or preference optimization.
      what_remains_open: Reliance on human feedback or handcrafted reward dimensions,
        potential reward hacking, and scalability to diverse domains beyond contact-rich
        manipulation.
    - line: Test-time verification and scaling for world model reasoning (e.g., ViSA)
      what_it_solves: Evaluating and improving the decision-making quality of world
        models at inference time by analyzing verifier reliability and introducing
        better reward grounding.
      what_remains_open: Current world models form an information bottleneck where
        imagined trajectories lack fine-grained details; verifiers remain miscalibrated
        and biased.
    - line: Conceptual taxonomy and evaluation frameworks for world models (e.g.,
        Mechanistic View)
      what_it_solves: Classifying world models by state construction and dynamics
        modeling, and advocating for functional benchmarks that test physical persistence
        and causal reasoning.
      what_remains_open: Whether the taxonomy will influence actual model design and
        whether the proposed functional benchmarks will be adopted by the community
        to replace visual fidelity metrics.
    consensus:
    - Video generation is the dominant medium for building world models, with action-conditioning
      as the primary mechanism to simulate future observations.
    - Pretraining on large-scale action-video datasets improves generalization and
      downstream task performance.
    - Visual fidelity alone is insufficient for evaluating world models; there is
      a shared recognition of the need for physical realism and task-oriented metrics.
    - Scaling model size and data volume is a common trend, with transformer-based
      architectures being the backbone.
    disagreements:
    - 'Training strategy: Some works train world models from scratch on domain-specific
      data, while others adapt pretrained video models without accessing internal
      weights.'
    - 'Action injection: Methods differ, including unified diffusion with independent
      timesteps, frame-level conditioning modules, learned masks, and parallel context
      blocks.'
    - 'Alignment approach: Strategies range from reinforcement learning with multi-dimensional
      reward models to direct preference optimization, with some works forgoing explicit
      alignment.'
    - 'Evaluation: Benchmarks vary from real-robot policy transfer and video quality
      metrics to zero-shot spatial reasoning tasks, leading to conflicting claims
      about model capabilities.'
    open_questions:
    - Can video-based world models learn causal dynamics that support long-horizon
      reasoning, or are they limited to pattern matching?
    - How can we develop verifiers that are calibrated and do not suffer from the
      information bottleneck of generated trajectories?
    - What minimal formal assumptions must a video generation model satisfy to be
      considered a world model, and how can we empirically validate them?
    - Is there a path to aligning world models with human preferences without costly
      and subjective large-scale annotation?
    - Will the proposed functional benchmarks effectively replace visual-centric evaluation
      and drive progress in physical reasoning and persistence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一的视频-动作扩散世界模型（如UWM、IRASim、HMA）
      解决的问题: 从大规模机器人数据中联合学习动作条件化动力学和策略，灵活生成未来视频帧并提供控制。
      尚未覆盖: 模型是否学到了真正的状态表示还是仅记忆转移；对未见过的实体和任务的泛化能力仍然有限。
    - 路线: 将预训练视频模型适配为动作条件化世界模型（如AVID）
      解决的问题: 利用现有视频生成先验知识，无需完全重新训练，减少对大规模领域特定数据的需求。
      尚未覆盖: 依赖预训练模型的质量和偏差；适配仍需动作标注数据，且适配器可能无法纠正模型根本缺陷。
    - 路线: 通过奖励优化使世界模型对齐物理真实性和偏好（如ReWorld、ABot-PhysWorld）
      解决的问题: 通过奖励建模或偏好优化提高生成视频的物理合理性、任务一致性和视觉质量。
      尚未覆盖: 依赖人类反馈或手工设计的奖励维度，存在奖励破解风险，且向接触丰富操作以外领域的可扩展性未验证。
    - 路线: 测试时验证与缩放用于世界模型推理（如ViSA）
      解决的问题: 在推理时评估和改进世界模型的决策质量，分析验证器可靠性并引入更好的奖励基础。
      尚未覆盖: 当前世界模型形成信息瓶颈，想象轨迹缺乏细粒度细节；验证器仍存在校准不良和偏差。
    - 路线: 世界模型的概念分类与评估框架（如Mechanistic View）
      解决的问题: 通过状态构建和动态建模对世界模型进行分类，并倡导测试物理持久性和因果推理的功能性基准。
      尚未覆盖: 该分类法是否会影响实际模型设计，以及所提议的功能基准是否会被社区采用以取代视觉保真度指标。
    共识:
    - 视频生成是构建世界模型的主要媒介，动作条件化是模拟未来观察的核心机制。
    - 在大规模动作-视频数据集上预训练可提高泛化能力和下游任务性能。
    - 仅靠视觉保真度不足以评估世界模型，普遍认识到需要物理真实性和面向任务的度量。
    - 扩大模型和数据规模是共同趋势，基于Transformer的架构是主流选择。
    分歧:
    - 训练策略：部分工作从头训练领域特定模型，部分则适配预训练视频模型且不访问内部权重。
    - 动作注入方式：方法各异，包括统一扩散的独立时间步、帧级条件模块、学习掩码和并行上下文块。
    - 对齐策略：从基于强化学习的多维奖励模型到直接偏好优化，有的工作则完全放弃显式对齐。
    - 评估设置：基准从真实机器人策略迁移和视频质量指标到零样本空间推理任务，导致对模型能力的结论相互矛盾。
    开放问题:
    - 基于视频的世界模型能否学到支持长时程推理的因果动力学，还是仅限于模式匹配？
    - 如何开发经过校准且不受生成轨迹信息瓶颈影响的验证器？
    - 视频生成模型需要满足哪些最低形式化假设才能被视为世界模型，又如何进行实证验证？
    - 是否存在一条路径，能够以低成本、避免主观性的方式使世界模型对齐人类偏好？
    - 所提议的功能基准能否有效取代以视觉为中心的评估，并推动物理推理和持久性方面的进展？
