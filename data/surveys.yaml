  - 主流方向：该聚类以学习式预测仿真与未来帧或视频生成为主，综述和分类体系工作则组织驾驶与具身场景的设计空间。
  - 研究共性：多数工作都围绕学习预测未来状态或视频的模型展开，并强调组合性、持久状态、长时程一致性及智能体控制用途。
  - 关键差异：工作差异体现在表示方式，如语言原语分解、隐状态或令牌空间、全局静态加动态实体、自我运动或姿态条件；监督信号也从稀疏奖励在线学习到大规模多模态视频、交通仿真和开源视频生成不等。
  - 趋势演进：从2022到2026，证据从物理机器人在线学习和交通导向仿真，转向综述或分类体系统一、开源实时交互仿真以及针对持久性与可控性的专门基准；趋势处于当前前沿内。
  - 开放问题：哪些分类体系和评估方案得到实证验证；开环视觉真实感如何转化为闭环控制或执行；组合性和视线外持久性在超出已见原语或已观察场景时如何泛化；开放且实时的系统如何支持可复现的物理部署。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented work on predictive driving and embodied
        simulation into design spaces, structural dimensions, and future research
        directions.
      what_remains_open: Whether the taxonomies are backed by systematic, reproducible
        evidence rather than conceptual grouping; some proposals lack empirical validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Clarifies how metrics and evaluation settings such as open-loop
        video realism, motion prediction, persistence, controllability, and resource
        cost shape conclusions.
      what_remains_open: Results are not yet compatible across simulation, physical
        robot, driving, ego-vision, and interactive simulator settings; missing baselines
        or metrics limit comparison.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into concrete next questions
        about generalization, closed-loop deployment, persistence, openness, and real-time
        use.
      what_remains_open: Which gaps matter most for progress is not prioritized; verification
        gaps for code, datasets, limitations, or reproducible real-robot evaluation
        remain.
    consensus:
    - Learned predictive models are treated as central for simulating future states
      or videos and for supporting downstream decision-making or control.
    - Compositionality, persistent state, and long-horizon consistency are recognized
      mechanisms for improving generalization beyond monolithic generation.
    - Evaluation often defaults to simulation, video realism, or open-loop metrics,
      while closed-loop physical or deployment reliability is identified as an open
      challenge.
    disagreements:
    - 'Representation differs: some methods factor generation via language primitives
      or latent spaces, while others maintain a persistent global state or condition
      on ego-motion and human pose.'
    - 'Supervision and training settings differ: sparse-reward physical online learning,
      large-scale multimodal video data, traffic simulation, and open-source video
      generation make performance claims difficult to compare.'
    - 'Evaluation targets differ: execution success, motion prediction, frame controllability,
      out-of-sight persistence, and real-time interactivity are measured with separate
      benchmarks and assumptions.'
    open_questions:
    - How can taxonomy and evaluation frameworks be empirically validated without
      defaulting to selective examples or untested metric suites?
    - What evidence would show that open-loop visual realism or video-plan synthesis
      transfers to closed-loop control and physical execution?
    - How do compositionality and out-of-sight persistence behave when the system
      encounters primitives, objects, or scene states not seen during training?
    - Which reproducibility gaps from missing code, datasets, baselines, or limitation
      statements are most consequential for comparing these systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将预测性驾驶与具身仿真等碎片化研究组织为设计空间、结构维度和未来研究方向。
      尚未覆盖: 分类法是否由系统性、可复现证据支撑，而不只是概念分组；部分方案缺乏实证验证。
    - 路线: 对比评测综合
      解决的问题: 澄清开环视频真实感、运动预测、持久性、可控性和资源成本等指标与评测设置如何影响结论。
      尚未覆盖: 仿真、物理机器人、驾驶、自我中心视觉和交互仿真之间的结果尚不兼容；基线或指标缺失限制比较。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为关于泛化、闭环部署、持久性、开放性和实时使用的具体后续问题。
      尚未覆盖: 哪些缺口最值得优先解决尚未排序；代码、数据集、局限性或可复现真实机器人评测存在验证缺口。
    共识:
    - 学习式预测模型被视为仿真未来状态或视频并支持下游决策或控制的核心。
    - 组合性、持久状态和长时程一致性被认作改善泛化、避免单一生成模式退化的机制。
    - 评测常默认使用仿真、视频真实感或开环指标，而闭环物理或部署可靠性被识别为开放挑战。
    分歧:
    - 表示方式不同：一些方法通过语言原语或隐空间分解生成，另一些维护持久全局状态，或依据自我运动与人体姿态进行条件生成。
    - 监督信号与训练设置不同：稀疏奖励物理在线学习、大规模多模态视频数据、交通仿真和开源视频生成使得性能声明难以直接比较。
    - 评测目标不同：执行成功率、运动预测、帧可控性、视线外持久性和实时交互性分别依赖不同基准与假设。
    开放问题:
    - 如何实证验证分类法和评估框架，而不是依赖选择性示例或未经测试的指标套件？
    - 哪些证据能证明开环视觉真实感或视频计划合成会转化为闭环控制与物理执行能力？
    - 当系统遇到训练中未见过的原语、物体或场景状态时，组合性和视线外持久性如何变化？
    - 在代码、数据集、基线或局限性说明缺失的情况下，哪些可复现性缺口对系统比较影响最大？
