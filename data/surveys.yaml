      尚未覆盖: 仿真指标与真实驾驶安全或运营结果之间的对齐；评估仅限于离线视频基准，未涉及物理车辆测试。
    - 路线: 交互式游戏与基准世界模型
      解决的问题: 在游戏环境中实现高效的基于模型的强化学习，并对世界模型的空间一致性进行系统化评估。
      尚未覆盖: 当游戏规则、目标或用户交互剧烈变化时的泛化能力；该基准提供了评估协议，但未提出解决空间一致性问题的模型。
    - 路线: 具身机器人世界模型
      解决的问题: 针对机器人操作任务，实现组合式视频生成、物理信息合成以及统一的视频-动作预训练，支撑策略学习与想象。
      尚未覆盖: 跨本体迁移和真实机器人部署仍未验证；组合泛化仅限于已知原语，物理信息损失仅在仿真中测试。
    共识:
    - 应用领域的世界模型主要以动作或目标为条件的视频生成模型呈现，目的是捕捉环境动力学，用于规划或策略训练。
    - 引入结构先验（如深度、关键点、掩码重建或物理一致性损失）是提升生成轨迹保真度和实用性的常见策略。
    - 评估紧密耦合于特定领域基准（nuScenes、Atari、RT-X、CARL），依赖视觉质量、任务成功率或策略性能指标，跨领域测试有限。
    分歧:
    - 表示与监督信号：部分工作使用显式深度预测和关键点动力学作为辅助任务，另一些通过强化学习隐式学习物理合理性，或仅依赖带掩码令牌的视频重建。
    - 动作融合方式：方法在组合动作与观测上存在差异——有的采用视频和动作令牌的联合扩散，有的使用单独的动作条件生成，有的则通过RL优化动作一致性而无须成对视频监督。
    - 评估重点：一条路线关注视觉生成质量和零样本跨数据集迁移，另一条关注游戏中策略学习效率，第三条关注物理一致性和空间记忆基准。
    - 部署场景：所有顶尖方法均在仿真或预录制数据集上验证，未包含真实物理部署，导致报告的性能提升与实际适用性之间存在缺口。
    开放问题:
    - 在仿真或离线数据集上训练的世界模型能否为真实世界的机器人和车辆提供可靠的策略训练信号，需要何种sim-to-real迁移策略？
    - 如何设计一个统一基准，能够跨领域联合衡量世界模型的长时域物理一致性、空间记忆和任务完成能力？
    - 在分布漂移下，当前物理信息或RL优化后的世界模型在多大程度上真正捕捉了因果动力学，而非利用数据集偏差？
