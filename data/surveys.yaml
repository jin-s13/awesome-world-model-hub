    - 部署场景不同：实时机器人模拟、闭源预训练模型适配、零样本跨本体基准，或基于流模型的对齐后训练。
    开放问题:
    - 形式化的状态/动态分类能否预测生成视频何时支持因果推理和长时程持久性？
    - 哪种奖励或验证器信号能在不同空间推理和操作基准上产生一致的测试时缩放？
