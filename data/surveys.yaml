  related_work_outline_zh:
  - 主流方向：证据集中在形式化并改进面向具身控制的视频世界模型，以动作条件视频生成为核心实现路径。
  - 研究共性：论文将世界模型分解为状态构建与动态建模，并训练或后训练生成式视频预测器以承担策略、模拟器或规划器。
  - 关键差异：差异主要在生成架构与目标、对齐信号和评测设置，而非子领域标签。
  - 趋势演进：高证据论文集中在2024-2026年，从统一动作-视频预训练和适配器复用转向物理/逻辑对齐与诊断基准；早期年份仅为背景。
  - 开放问题：视觉保真或验证器奖励是否转化为决策能力，对齐是否超出操作任务泛化，分类法是否改变评测或设计。
  literature_review:
    line_of_work_matrix:
    - line: Formal state and dynamics decomposition
      what_it_solves: Clarifies what a world model must represent by separating state
        construction from dynamics modeling and by conditioning video generation on
        actions for policy, forward dynamics, inverse dynamics, or planning.
      what_remains_open: The formal decomposition has not been directly linked to
        realistic failure modes; many method papers report gains but leave limitation
        fields empty, so boundary conditions remain unverified.
    - line: Scaling, alignment, and verifier guarantees
      what_it_solves: Connects model size, data, post-training objectives, and test-time
        verifiers to expected behavior, including model-size scaling, preference/DPO-based
        physical alignment, and frame-anchored reward assertions.
      what_remains_open: Guarantees are not shown to transfer across datasets or domains;
        test-time verifier improvements are inconsistent across benchmarks, and human-preference
        alignment is subjective and costly to validate.
    - line: Conceptual taxonomy and evaluation boundaries
      what_it_solves: Organizes fragmented world-model claims into categories such
        as implicit/explicit state construction and functional benchmarks that separate
        visual fidelity, physical plausibility, and action alignment.
      what_remains_open: It is unclear whether proposed taxonomies and diagnostic
        benchmarks change model design or downstream decision-making, and some evaluation
        protocols still show information bottlenecks.
    consensus:
    - Action-conditioned video generation is the prevailing formal and empirical operationalization
      of world models in this evidence.
    - Large-scale pretraining, adapter reuse, or post-training of generative video
      models improves visual controllability and, in some cases, planning-related
      evaluation.
    - Evaluation is shifting from visual fidelity alone toward physical plausibility,
      trajectory consistency, and decision-relevant benchmarks.
    - Current models still lack reliable long-horizon causality, cross-embodiment
      generalization, and calibrated reward or verifier signals.
    disagreements:
    - 'Architectural and objective choices differ: unified diffusion transformers,
      masked autoregression, flow-based post-training, and adapter-based modification
      of pretrained video diffusion.'
    - 'Alignment signals differ: explicit action-frame conditioning, preference-based
      reward modeling or DPO, and test-time verifier assertions over imagined trajectories.'
    - 'Evaluation targets differ: robot manipulation planning, video-game and real-world
      robotics, spatial reasoning benchmarks, and zero-shot embodied benchmark protocols.'
    - 'Deployment assumptions differ: some approaches require only small domain-specific
      adapters, while others train or post-train very large real-time-specialized
      models; some depend on human preferences, others on heuristic verifiers.'
    open_questions:
    - Does improved video quality, physical plausibility, or verifier reward transfer
      to downstream decision-making and long-horizon planning?
    - Can alignment methods generalize beyond contact-rich manipulation and reduce
      reliance on subjective human preference labels?
    - What formal conditions make an action-conditioned video generator sufficient
      for causal world-model reasoning?
    - How should benchmarks separately measure state construction, dynamics modeling,
      action alignment, and physical plausibility without creating evaluation shortcuts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化状态与动态分解
      解决的问题: 通过区分状态构建、动态建模以及动作条件视频生成，澄清世界模型必须表示策略、前向动态、逆向动态或规划中的哪些要素。
      尚未覆盖: 形式分解尚未直接对应真实失败模式；许多方法论文报告提升但局限性字段为空，边界条件仍缺少证据。
    - 路线: 缩放、对齐与验证器保证
      解决的问题: 将模型规模、数据、后训练目标和测试时验证器与预期行为联系起来，包括规模表现、偏好/DPO物理对齐和帧锚定奖励断言。
      尚未覆盖: 保证未在数据集或领域间显示迁移；测试时验证器在不同基准上不一致，人类偏好对齐主观且验证成本高。
    - 路线: 概念分类与评测边界
      解决的问题: 把碎片化的世界模型主张组织为隐式/显式状态构建等功能类别，并建立分离视觉保真、物理合理性和动作对齐的功能基准。
      尚未覆盖: 尚不清楚这些分类与诊断基准是否改变模型设计或下游决策，部分评测协议仍呈现信息瓶颈。
    共识:
    - 动作条件视频生成是当前证据中世界模型的主流形式化与经验实现路径。
    - 大规模预训练、适配器复用或生成式视频模型后训练能改善视觉可控性，并在部分规划相关评价中有效。
    - 评测正从单纯视觉保真转向物理合理性、轨迹一致性和决策相关基准。
    - 当前模型在长时程因果、跨本体泛化和奖励或验证器校准上仍不可靠。
    分歧:
    - 生成架构和目标选择不同：统一扩散Transformer、掩码自回归、基于流的后训练以及对预训练视频扩散的适配器改造。
    - 对齐信号不同：显式动作-帧条件化、基于偏好的奖励建模或DPO，以及基于想象轨迹的测试时验证器断言。
    - 评测目标不同：机器人操作规划、视频游戏和真实机器人、空间推理基准，以及零样本具身基准协议。
    - 部署假设不同：有的只需小型领域适配器，有的训练或后训练超大规模实时专用模型；有的依赖人类偏好，有的依赖启发式验证器。
    开放问题:
    - 视频质量、物理合理性或验证器奖励的提升能否转化为下游决策和长时程规划能力？
    - 对齐方法能否超越接触丰富的操作任务，并减少对主观人类偏好标签的依赖？
    - 在何种形式条件下，动作条件视频生成器足以支撑因果世界模型推理？
    - 基准如何分别度量状态构建、动态建模、动作对齐和物理合理性，同时避免评测捷径？
