  related_work_outline_zh:
  - 主流方向：构建动作可控的学习式世界模型与模拟器，用于具身智能和自主系统，近期聚焦闭环驾驶视频生成、物理信息视频合成以及可评估的一致性。
  - 研究共性：将动作、轨迹或上下文输入作为条件注入学习式动力学或视频模型；利用生成未来帧或想象轨迹进行策略训练与评测；建模贡献常伴随数据集、基准或开源工件。
  - 关键差异：部署场景分为闭环多相机驾驶模拟、基于像素的真实机器人学习以及一致性与保真度评估基础设施；监督信号和评测目标尚未统一。
  - 趋势演进：在现有2022-2026年前沿证据内，研究从真实机器人世界模型学习走向可控驾驶模拟、动作保真度评测与物理信息生成；更早年份缺乏可比的头部论文证据。
