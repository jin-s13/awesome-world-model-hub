  related_work_outline:
  - 'Mainstream direction: Benchmarking world models is shifting from isolated visual
    quality metrics (e.g., FVD, PSNR) toward multi-dimensional evaluation of spatial
    consistency, memory, action controllability, and physical plausibility in closed-loop
    or open-domain settings.'
  - 'Shared research pattern: Most works either propose new world model architectures
    (diffusion- or transformer-based) and test them on existing benchmarks, or introduce
    new benchmarks with custom metrics to stress-test specific capabilities often
    overlooked by standard suites.'
  - 'Key differences: Evaluation targets differ drastically—some focus on agent performance
    in reinforcement learning environments (Atari, CARL), others on video generation
    fidelity for driving or robotics, and still others on spatial or memory consistency
    in open-world navigation (Minecraft, custom scenes). This leads to incompatible
    metrics and assumptions about what a world model should solve.'
  - 'Trend evolution: Between 2023 and 2026, the field moved from efficient transformer-based
    world models (STORM) to diffusion-based ones (DIAMOND, MaskGWM, UWM) and physics-informed
    generation (RoboScape); concurrently, dedicated benchmarks (LoopNav, MIND) emerged
    to capture capabilities beyond aggregate scores, indicating a co-evolution of
    methods and evaluation.'
  - 'Open questions: How to design benchmarks that cover the diverse real-world settings
    where world models are expected to help; whether proxy metrics (visual fidelity,
    consistency scores) align with downstream decision quality; and whether benchmark
    conclusions remain stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型基准测试正从孤立的视觉质量指标（如FVD、PSNR）转向在闭环或开放域场景下对空间一致性、记忆、动作可控性和物理合理性的多维度评估。
  - 研究共性：大多数工作要么提出新的世界模型架构（基于扩散或Transformer）并在现有基准上测试，要么引入新基准和自定义指标来压力测试通常被标准套件忽视的特定能力。
  - 关键差异：评估目标差异巨大——有的关注强化学习环境中的智能体表现（Atari、CARL），有的针对驾驶或机器人领域的视频生成保真度，还有的检验开放世界导航（Minecraft、自定义场景）中的空间或记忆一致性。这导致了互不兼容的指标和对世界模型应解决什么问题的不同假设。
  - 趋势演进：从2023年至2026年，该领域从高效的Transformer世界模型（STORM）转向基于扩散的方法（DIAMOND、MaskGWM、UWM）和物理信息生成（RoboScape）；同时，专门的基准（LoopNav、MIND）出现以捕捉超越总分的能力，表明方法与评估协同演化。
  - 开放问题：如何设计覆盖世界模型预期发挥作用的多样化真实场景的基准；代理指标（视觉保真度、一致性分数）是否与下游决策质量对齐；基准结论在不同实现和算力预算下是否保持稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets (e.g., LoopNav for spatial
        consistency in Minecraft, MIND for memory and action control across diverse
        scenes) that make claims about world model capabilities comparable beyond
        aggregate video prediction scores.
      what_remains_open: Current benchmark tasks are restricted to simulated or game
        environments and limited action spaces; coverage of real-world robotics, long-horizon
        manipulation, and open-ended physical interactions remains unverified.
    - line: Metric and stress-test design
      what_it_solves: Probing specific world model properties—such as spatial consistency
        via Scene Graph Consistency Score (LoopNav), memory consistency and action
        control via closed-loop revisited evaluation (MIND), and visual detail impact
        on agent performance (DIAMOND)—to expose failure modes masked by aggregate
        metrics.
      what_remains_open: Alignment between these proxy metrics and the actual utility
        of world models for downstream decision-making (e.g., policy learning, planning)
        is not empirically established; the sensitivity of metrics to implementation
        choices is largely unexplored.
    - line: Comparable baselines and reporting
      what_it_solves: Enabling cross-paper comparison through the use of common benchmarks
        (Atari 100k, NuScenes, OpenDV-2K, Waymo) and public artifacts, allowing methods
        to be ranked and progress tracked.
      what_remains_open: Stability of conclusions across different compute budgets,
        random seeds, and codebases is rarely assessed; many methods lack open-source
        code or detailed hyperparameter descriptions, limiting auditability.
    consensus:
    - Existing standard benchmarks (Atari 100k, NuScenes) are insufficient for evaluating
      world models, as they emphasize short-term visual quality and ignore long-term
      consistency, memory, physical plausibility, and action controllability.
    - Diffusion models and transformers are the dominant architectural backbones for
      world models, progressively replacing discrete latent-variable approaches.
    - World models should be evaluated on multiple dimensions simultaneously—generation
      quality, controllability, and downstream task performance—rather than a single
      summary metric.
    - High-quality, diverse, and openly available datasets are critical for both training
      and benchmarking world models.
    disagreements:
    - 'The operational definition of a world model differs: some treat it as a video
      predictor conditioned on actions (MaskGWM, RoboScape), others as an internal
      simulator for policy learning (cRSSM, STORM), and still others as a unified
      action–video generative model (UWM).'
    - Evaluation settings vary between open-loop frame prediction and closed-loop
      agent interaction, leading to conflicting conclusions about model capabilities.
    - Preferred metrics diverge—some works prioritize human-normalized score on RL
      tasks, others use FVD or SSIM for video fidelity, and benchmarks introduce custom
      consistency scores, making cross-study comparison difficult.
    - 'The role of physics in world models is contested: some explicitly inject physics
      knowledge (RoboScape), while others rely purely on data-driven learning from
      pixels and actions.'
    open_questions:
    - How can we design benchmarks that reflect the stochastic, multi-agent, and long-horizon
      nature of real-world environments where world models are ultimately deployed?
    - Do improvements in spatial consistency, memory, and visual detail on current
      benchmarks translate to better performance in downstream tasks like robotic
      manipulation or autonomous driving?
    - What is the minimum set of capabilities a world model benchmark must cover to
      be considered a reliable indicator of progress?
    - How sensitive are benchmark rankings to differences in compute budget, data
      preprocessing, and random seeds, and can we establish reporting standards to
      mitigate this?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集（如用于Minecraft空间一致性的LoopNav，用于跨场景记忆与动作控制的MIND），使世界模型能力的声明超越汇总的视频预测分数，具备可比性。
      尚未覆盖: 当前基准任务局限于模拟或游戏环境，动作空间有限；对真实世界机器人、长时域操作和开放式物理交互的覆盖尚未验证。
    - 路线: 指标与压力测试设计
      解决的问题: 探测特定世界模型属性——如通过场景图一致性分数（LoopNav）测试空间一致性，通过闭环可复现评估（MIND）测试记忆与动作控制，以及通过视觉细节影响（DIAMOND）揭示聚合指标掩盖的失败模式。
      尚未覆盖: 这些代理指标与世界模型在下游决策（如策略学习、规划）中实际效用之间的对齐缺乏实证；指标对实现选择的敏感性基本未被探索。
    - 路线: 可比基线与报告规范
      解决的问题: 通过使用通用基准（Atari 100k、NuScenes、OpenDV-2K、Waymo）和公开工件实现跨论文比较，使方法能被排序并跟踪进展。
      尚未覆盖: 结论在不同计算预算、随机种子和代码库下的稳定性很少被评估；许多方法缺少开源代码或详细的超参数描述，限制了可审计性。
    共识:
    - 现有标准基准（Atari 100k、NuScenes）不足以评估世界模型，因为它们强调短期视觉质量，而忽视长期一致性、记忆、物理合理性和动作可控性。
    - 扩散模型和Transformer是当前世界模型的主导架构，正逐步取代离散潜变量方法。
    - 世界模型应同时在多个维度上评估——生成质量、可控性和下游任务表现——而非依赖单一汇总指标。
    - 高质量、多样化且公开可用的数据集对世界模型的训练和基准测试至关重要。
    分歧:
    - 世界模型的操作定义不同：有的将其视为以动作为条件的视频预测器（MaskGWM、RoboScape），有的作为策略学习的内部模拟器（cRSSM、STORM），还有的作为统一的动作-视频生成模型（UWM）。
    - 评估设置存在开环帧预测与闭环智能体交互之别，导致对模型能力的结论相互矛盾。
    - 偏好的指标分歧——有的注重RL任务的人类归一化得分，有的使用FVD或SSIM评估视频保真度，而基准测试则引入自定义一致性分数，使得跨研究比较困难。
    - 物理知识在世界模型中的作用存在争议：有的显式注入物理信息（RoboScape），有的完全依赖从像素和动作中数据驱动学习。
    开放问题:
    - 如何设计能反映世界模型最终部署的真实环境所具有的随机性、多智能体和长时域特性的基准？
    - 当前基准上空间一致性、记忆和视觉细节的提升是否能转化为下游任务（如机器人操作、自动驾驶）性能的改进？
    - 一个世界模型基准必须覆盖的最小能力集合是什么，才能被视为进展的可靠指标？
    - 基准排名对计算预算、数据预处理和随机种子的差异有多敏感，我们能否建立报告标准来缓解这一问题？
