  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented generative simulation research into design spaces,
        internal mechanics, application directions, milestones, and research gaps.
      what_remains_open: Synthesis may rely on selective examples or conceptual proposals
        rather than systematic empirical evidence, and future designs may not be covered.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how choices about controllability, temporal consistency,
        and open-loop versus closed-loop testing shape conclusions across studies.
      what_remains_open: Results and metric suites are not yet consistently implemented
        or compared across datasets and deployment settings.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad coverage into concrete next questions such as out-of-sight
        dynamics, persistent memory, real-time interactivity, and fine-grained multimodal
        control.
      what_remains_open: Prioritization is not grounded in systematic measurement
        of which gaps most constrain progress.
    consensus:
    - Generative simulation research is treated as fragmented across video, driving,
      ego-vision, and agent settings, and synthesis work tries to unify it through
      design spaces and roadmaps.
    - Long-horizon temporal consistency and persistent scene memory are recurring
      evaluation challenges.
    - Evaluation should move beyond monolithic generation quality toward control,
      closed-loop behavior, and spatial-temporal consistency.
    - Open-source and real-time interactive simulation is emerging as a shared frontier.
    disagreements:
    - 'Representation choices differ: compositional language-derived primitives, persistent
      3D/dynamic global state, continuous/discrete/hybrid latent states, and autoregressive
      spatio-temporal nodes.'
    - 'Supervision and evaluation targets differ: instruction following, motion prediction,
      georeferencing, out-of-sight dynamics, and fine-grained controllability are
      emphasized unevenly.'
    - Deployment settings differ from offline taxonomy work to real-time open simulation,
      multi-agent driving simulation, and ego-vision future-frame prediction.
    - Some contributions provide conceptual evaluation prescriptions without empirical
      validation, while others introduce trained models, datasets, and benchmarks.
    open_questions:
    - Verification gaps remain around empirically validating taxonomies and evaluation
      frameworks rather than only proposing them conceptually.
    - How should persistent out-of-sight and long-horizon dynamics be benchmarked
      in comparable open-loop and closed-loop settings?
    - Can compositional generalization move beyond seen primitive combinations without
      relying on brittle language parsing?
    - Which real-time and open-source interactivity trade-offs matter most for scalable
      deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的生成式模拟研究整理为设计空间、内部机制、应用方向、里程碑和研究缺口。
      尚未覆盖: 综合可能依赖选择性示例或概念性方案，而非系统实证证据；未来设计未必被覆盖。
    - 路线: 对比评测综合
      解决的问题: 总结可控性、时间一致性以及开环与闭环等评测选择如何影响跨研究结论。
      尚未覆盖: 结果和指标套件尚未在不同数据集和部署设置中一致实施或比较。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体研究缺口，如视线外动态、持续记忆、实时交互和细粒度多模态控制。
      尚未覆盖: 优先级缺少系统测量，哪些缺口最制约进展尚不明确。
    共识:
    - 生成式模拟研究被视为分散在视频、驾驶、自我中心视觉和智能体等场景，综述工作试图通过设计空间和路线图进行统一。
    - 长时域时间一致性和持续场景记忆是反复出现的评测挑战。
    - 评测应超越单一生成质量，转向控制能力、闭环行为和时空一致性。
    - 开源与实时交互式模拟正在成为共同前沿。
    分歧:
    - 表示选择不同：语言派生组合原语、持久3D/动态全局状态、连续/离散/混合潜在状态、自回归时空节点。
    - 监督与评测目标不同：指令跟随、运动预测、地理参考、视线外动态和细粒度可控性被不同研究不同侧重。
    - 部署设置不同：从离线分类综合，到实时开放模拟、多智能体驾驶仿真和自我中心视觉未来帧预测。
    - 部分贡献是未实证验证的概念性评估方案，另一些则引入训练模型、数据集和基准。
    开放问题:
    - 分类法和评估框架能否在概念覆盖之外得到实证验证？
    - 如何在可比较的开环与闭环设置中基准化持久的视线外和长时域动态？
    - 组合泛化能否超越已见原语组合并减少对语言解析的依赖？
    - 实时与开源交互的可扩展性取舍中，哪些因素对可扩展部署最相关？
