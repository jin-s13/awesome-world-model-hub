  related_work_outline:
  - 'Mainstream direction: Apply diffusion-Transformer world models to autonomous
    driving, robotics, and games for video prediction, policy learning, and closed-loop
    evaluation, with growing emphasis on generalization, physical plausibility, and
    memory consistency.'
  - 'Shared research pattern: Pretrain on large-scale multitask datasets, inject domain-specific
    structure (context, compositionality, physics knowledge) into the generative model,
    and use the model''s imagined trajectories to train or evaluate policies.'
  - 'Key differences: Models differ in generative backbone (diffusion vs. VAE-RNN),
    in how actions are coupled with video generation, in the target domain (driving,
    robot manipulation, Atari, Minecraft), and in evaluation criteria (score, zero-shot,
    spatial consistency, memory, action control).'
  - 'Trend evolution: The frontier moved from efficient Atari game agents (2023) to
    complex embodied and driving applications (2024–2025), followed by dedicated benchmarks
    for spatial and memory consistency (2025–2026), indicating a shift from model
    design to systematic evaluation and real-world alignment.'
  - 'Open questions: How to guarantee safety and reliability in real-world deployment;
    how to unify evaluation metrics across domains; how to generalize to entirely
    novel objects or actions beyond composed training primitives; and how to best
    combine data-driven generation with explicit physical knowledge.'
  related_work_outline_zh:
  - 主流方向：将扩散Transformer世界模型应用于自动驾驶、机器人、游戏等领域的视频预测、策略学习和闭环评估，日益关注泛化性、物理合理性和记忆一致性。
  - 研究共性：在大规模多任务数据集上预训练，向生成模型中注入领域结构（上下文、组合性、物理知识），并利用模型生成的想象轨迹训练或评估策略。
  - 关键差异：模型在生成主干（扩散 vs. VAE-RNN）、动作与视频耦合方式、目标领域（驾驶、机器人操作、Atari、Minecraft）以及评估标准（游戏得分、零样本泛化、空间一致性、记忆与动作控制）上存在显著差异。
  - 趋势演进：前沿从高效Atari游戏智能体（2023年）扩展到复杂的具身与驾驶应用（2024–2025年），随后出现专门针对空间和记忆一致性的基准（2025–2026年），表明研究重心正从模型设计转向系统评估和现实对齐。
  - 开放问题：如何确保真实部署中的安全与可靠；如何统一跨领域评估指标；如何泛化到训练组合原语之外的全新物体或动作；如何最佳结合数据驱动生成与显式物理知识。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot domains by factorizing video generation
        with language compositionality, injecting physics knowledge (depth, keypoint
        dynamics), and jointly diffusing video and actions for policy learning from
        large-scale datasets.
      what_remains_open: Whether the gains transfer to real-world robot deployment,
        how to handle entirely novel primitives beyond training combinations, and
        how to align physics-informed generation with real-world dynamics.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Builds generalizable driving world models that combine diffusion
        transformers with mask reconstruction for multi-view, long-horizon video prediction,
        enabling zero-shot transfer across driving datasets.
      what_remains_open: The alignment between simulator-based video fidelity and
        real-world safety or operational outcomes, and the scalability of such models
        to diverse geographic and weather conditions.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in game environments (Atari, Minecraft)
        and open-domain video for efficient reinforcement learning, contextual zero-shot
        generalization, and evaluation of spatial consistency, memory, and action
        control.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change; maintaining long-term memory consistency across viewpoints; and scaling
        to truly open-world interactions without predefined action spaces.
    consensus:
    - World models are used to generate imagined trajectories that support model-based
      reinforcement learning or policy evaluation.
    - Diffusion and Transformer architectures are the dominant generative backbones
      for video-based world models.
    - Incorporating structural priors such as context, compositionality, or physics
      knowledge improves generation quality and downstream task performance.
    - Large-scale pretraining on diverse datasets is critical for generalization across
      environments and tasks.
    - Evaluation is moving beyond visual quality to include physical plausibility,
      temporal stability, and spatial consistency.
    disagreements:
    - 'Generative architecture: some works use diffusion models with masked reconstruction,
      others use VAE-Transformer hybrids, and yet others use recurrent state-space
      models.'
    - 'Action coupling: some models treat actions as conditioning inputs for video
      generation, while others jointly diffuse video and action tokens, or learn policies
      inside the world model''s latent space without explicit action generation.'
    - 'Evaluation goals: Atari game scores, zero-shot generalization to unseen dynamics,
      spatial consistency in loop navigation, and memory/action control benchmarks
      reflect different and currently incompatible evaluation philosophies.'
    - 'Physical knowledge: works differ on whether to explicitly inject physics through
      auxiliary tasks or to rely entirely on data-driven generation from large video
      corpora.'
    - 'Interaction mode: some models are designed for open-loop video prediction,
      others for closed-loop action-conditioned generation, and a few support compositional
      synthesis from language instructions.'
    open_questions:
    - How can we validate that world models maintain safety-critical properties when
      deployed in real-world driving or robotic manipulation?
    - What is the minimal set of metrics that can capture memory consistency, spatial
      coherence, and physical plausibility across different domains?
    - How can world models generalize to actions or objects never seen during training,
      beyond the compositional combination of known primitives?
    - What is the most effective way to integrate explicit physics knowledge with
      data-driven video generation, especially when physical models are incomplete?
