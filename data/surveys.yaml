  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks and metrics to evaluate
    world models beyond pixel-level reconstruction, focusing on spatial consistency,
    memory, action controllability, and zero-shot generalization.'
  - 'Shared research pattern: Introducing new datasets with loop structures or controlled
    action spaces, and defining corresponding quantitative scores that isolate a targeted
    capability from overall generation quality.'
  - 'Key differences: Environments range from 2D games (Atari) to 3D open worlds (Minecraft)
    to real-world driving and robotics; evaluation targets include short-term dynamics,
    long-horizon rollout, physical plausibility, and cross-view consistency.'
  - 'Trend evolution: From reusing existing game benchmarks (Atari 100k, CARL) toward
    custom-built stress tests (LoopNav, MIND) that explicitly probe memory and control,
    with a clear shift between 2023 and 2025–2026 toward more targeted, reproducible
    evaluation protocols.'
  - 'Open questions: How well do proxy metrics such as scene graph consistency align
    with downstream task performance; whether current benchmarks cover the full range
    of failure modes world models encounter in open-ended, real-world settings; and
    the robustness of reported results across varying implementations and compute
    budgets.'
  related_work_outline_zh:
  - 主流方向：设计专门基准和指标，评估世界模型在像素重建之外的能力，如空间一致性、记忆、动作可控性和零样本泛化。
  - 研究共性：提出带循环结构或受控动作空间的新数据集，并定义对应的量化分数，将特定能力与整体生成质量分离。
  - 关键差异：环境从2D游戏（Atari）到3D开放世界（Minecraft）再到真实驾驶和机器人；评估目标涵盖短期动态、长时域推演、物理合理性及跨视角一致性。
  - 趋势演进：从复用现有游戏基准（Atari 100k、CARL）转向构建专门的压力测试（LoopNav、MIND），显式探测记忆与控制，2023到2025–2026年呈现向更精准、可复现评估协议演进的明显转向。
  - 开放问题：场景图一致性等代理指标与下游任务性能的对齐程度；现有基准是否覆盖世界模型在开放真实场景中的全部失效模式；不同实现和算力预算下报告结果的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates controlled environments and tasks (e.g., loop-based
        navigation, closed-loop video revisiting) that expose specific world-model
        weaknesses such as spatial forgetting or action inconsistency.
      what_remains_open: Whether the designed tasks are representative of the diverse,
        open-ended scenarios where world models are deployed; most datasets are limited
        to a single simulated or real-world domain.
    - line: Metric and stress-test design
      what_it_solves: Defines quantitative probes (e.g., Scene Graph Consistency Score,
        memory consistency, action control) that go beyond mean visual quality to
        measure structural and temporal fidelity.
      what_remains_open: The correlation between these diagnostic metrics and the
        actual utility of world models for downstream decision-making or planning
        remains unverified.
    - line: Comparable baselines and reporting
      what_it_solves: Provides standard evaluation protocols and common baselines
        (e.g., Atari 100k, CARL, NuScenes) that allow fair comparison of world-model
        architectures and training methods.
      what_remains_open: Results often cluster around a few benchmark suites, and
        conclusions may not transfer across domains; sensitivity to hyperparameters,
        compute budgets, and implementation details is rarely systematically studied.
    consensus:
    - Pixel-level reconstruction quality alone is insufficient to judge world models;
      structural and temporal consistency must be evaluated separately.
    - Action-conditioned video generation is a necessary but not sufficient test,
      and benchmarks should include closed-loop or revisit-based setups to catch memory
      failures.
    - Reproducibility and open-source artifacts (code, datasets, evaluation scripts)
      are essential for trustworthy benchmarking, and several recent works explicitly
      release such resources.
    disagreements:
    - 'Evaluation environments differ sharply: some works use retro game environments
      (Atari) where dynamics are simple and deterministic, while others target photorealistic
      driving or robotic manipulation, leading to different assumptions about what
      constitutes a useful world model.'
    - 'Metrics are designed for different layers of abstraction: scene graph consistency
      captures high-level spatial relations, while memory and action control metrics
      focus on temporal coherence and responsiveness, which are not directly comparable.'
    - 'The role of physical grounding is treated differently: some benchmarks require
      physics-informed generation (RoboScape), while others treat visual fidelity
      as primary and do not explicitly incorporate physical laws.'
    - 'Interaction mode: some benchmarks emphasize forward prediction only, others
      require the model to act as a simulator that can be rolled out with actions,
      and a few (like MIND) introduce closed-loop revisiting, which changes the evaluation
      complexity.'
    open_questions:
    - To what extent do the proposed benchmark scores predict real-world deployment
      success, such as in autonomous driving or robotic manipulation, where safety
      and robustness are critical?
    - What is the minimum set of tasks and stress conditions needed to cover the failure
      modes of both diffusion-based and transformer-based world models across different
      domains?
    - How can the community ensure that high benchmark scores reflect genuine modeling
      improvements rather than overfitting to dataset-specific patterns or metric
      quirks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建受控环境和任务（如循环导航、闭环视频回访），暴露世界模型在空间遗忘或动作不一致等方面的特定弱点。
      尚未覆盖: 所设计任务是否能代表世界模型部署的多样开放场景尚不明确；多数数据集仅限于单一模拟或真实域。
    - 路线: 指标与压力测试设计
      解决的问题: 定义超越平均视觉质量的量化探针（如场景图一致性分数、记忆一致性、动作控制），衡量结构和时间保真度。
      尚未覆盖: 这些诊断指标与下游决策或规划中世界模型实际效用的关联尚未得到验证。
    - 路线: 可比基线与报告规范
      解决的问题: 提供标准评估协议和通用基线（如Atari 100k、CARL、NuScenes），实现世界模型架构与训练方法的公平比较。
      尚未覆盖: 结果往往集中少数基准套件，结论可能难以跨域迁移；对超参数、算力预算和实现细节的敏感性缺乏系统研究。
    共识:
    - 仅靠像素级重建质量不足以评判世界模型；结构和时间一致性需单独评估。
    - 动作条件视频生成是必要但不充分的测试，基准应包含闭环或回访式设置以捕获记忆失效。
    - 可复现性和开源工件（代码、数据集、评估脚本）对可信基准至关重要，近期多项工作已明确发布此类资源。
    分歧:
    - 评估环境差异显著：部分工作使用动态简单、确定性的复古游戏环境（Atari），另一些针对拟真驾驶或机器人操作，导致对有用世界模型构成的假设不同。
    - 指标设计处于不同抽象层次：场景图一致性捕捉高层空间关系，而记忆和动作控制指标关注时间连贯性和响应性，二者不可直接比较。
    - 物理基础的纳入方式不同：部分基准要求物理信息生成（如RoboScape），而其他基准将视觉保真度作为主要目标，未显式整合物理规律。
    - 交互模式：有些基准只强调前向预测，另一些要求模型作为可动作推演的模拟器，少数（如MIND）引入闭环回访，显著改变评估复杂度。
    开放问题:
    - 所提出的基准分数在多大程度上能预测真实部署成功，尤其在安全性和鲁棒性至关重要的自动驾驶或机器人操作中？
    - 覆盖跨域扩散型和Transformer世界模型失效模式所需的最小任务与压力条件集合是什么？
    - 社区如何确保高基准分数反映真正的建模改进，而非对数据集特定模式或指标特质的过拟合？
