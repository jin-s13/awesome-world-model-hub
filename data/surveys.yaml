  literature_review:
    line_of_work_matrix:
    - line: World-model evaluation benchmarks (e.g., LoopNav, Terra ACT-Bench)
      what_it_solves: Quantify spatial consistency or action fidelity of generated
        rollouts, moving beyond pixel-level video quality.
      what_remains_open: Evidence is limited to specific environments and reference
        trajectories; independent sensitivity and reproducibility across simulators
        remain verification gaps.
    - line: Context- and physics-conditioned world models (e.g., cRSSM, RoboScape)
      what_it_solves: Improve zero-shot policy learning or physical plausibility by
        injecting context, depth prediction, and keypoint dynamics.
      what_remains_open: Assumes observability or task-specific structure, with evaluation
        on narrow settings and limited missing-failure-case evidence in the packet.
    - line: High-fidelity real-time driving simulation (e.g., Vista, FAR-Drive)
      what_it_solves: Support closed-loop or controllable driving with multi-view
        generation and sub-second inference on a single GPU.
      what_remains_open: Generalization beyond nuScenes-like settings, long-horizon
        degradation, and multi-GPU or complex-scene scaling are unproven.
    - line: Cross-embodiment latent-action world models (e.g., RynnWorld-Latent)
      what_it_solves: Unify human, robot, and simulation data through latent actions
        to improve video prediction and downstream policy success.
      what_remains_open: Artifact and reproducibility signals are weak in the packet,
        and broad real-robot or cross-platform validation remains incomplete.
    consensus:
    - World models are framed as learned simulators whose generated rollouts must
      satisfy both visual quality and task-specific control or consistency criteria.
    - There is a shared emphasis on conditioning generation on structured information
      such as action, context, depth, keypoints, or multi-view geometry, rather than
      treating video prediction as unconditional synthesis.
    - 'Evaluation is moving toward combined evidence: standard generation metrics,
      spatial or action-fidelity scores, and downstream policy or closed-loop performance.'
    - Public benchmarks and datasets are treated as important for comparability, though
      the evidence shows uneven availability of code, artifacts, and complete limitation
      reporting.
    disagreements:
    - 'Deployment setting differs: some systems target offline benchmark evaluation,
      while others target real-time closed-loop autonomous driving or policy training
      in simulation.'
    - 'Conditioning interface differs: explicit observable context or action trajectories,
      latent universal actions for cross-embodiment data, and structured geometric
      control are separate design choices.'
    - 'Prior or supervision differs: physics-informed depth and keypoint objectives,
      contextual latent dynamics, and multi-view temporal consistency objectives emphasize
      different sources of structure.'
    - 'Evaluation target differs: spatial consistency, action fidelity, video realism,
      physical plausibility, and downstream policy success are not interchangeable
      and may rank systems differently.'
    open_questions:
    - How long can current world models maintain spatial, physical, and action fidelity
      in rollouts outside their evaluation environments such as Minecraft, CARL, or
      nuScenes?
    - Which conditioning interface, explicit context, action trajectories, or latent
      actions, generalizes best without assuming observable context or shared action
      spaces?
    - What are the real-time serving tradeoffs between multi-view or high-fidelity
      generation and deployment on single-GPU versus multi-GPU or multi-robot systems?
    - Can physics-informed and cross-embodiment models transfer to unseen robot platforms
      or driving environments without collecting large target-specific datasets?
    - How much of the reported progress is independently reproducible given missing
      OpenAlex metadata, limitation evidence not provided for several papers, and
      uneven code or dataset release in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评测基准（如LoopNav、Terra ACT-Bench）
      解决的问题: 量化生成推演的空间一致性或动作保真度，超越像素级视频质量。
      尚未覆盖: 证据仅覆盖特定环境和参考轨迹，跨模拟器独立可复现性与指标敏感性仍是验证缺口。
    - 路线: 上下文与物理条件世界模型（如cRSSM、RoboScape）
      解决的问题: 通过上下文、深度预测和关键点动力学提升零样本策略学习或物理合理性。
      尚未覆盖: 假设上下文可观测或依赖任务特定结构，评测环境较窄，证据包中失败案例证据有限。
    - 路线: 高保真实时驾驶模拟（如Vista、FAR-Drive）
      解决的问题: 支持闭环或可控驾驶，多视图生成和单GPU亚秒级推理。
      尚未覆盖: nuScenes之外的泛化、长时域退化、多GPU或复杂场景扩展尚无证据。
    - 路线: 跨具身潜在动作世界模型（如RynnWorld-Latent）
      解决的问题: 通过潜在动作统一人类、机器人和仿真数据，提升视频预测与下游策略成功率。
      尚未覆盖: 证据包中工件与可复现信号较弱，广泛真实机器人或跨平台验证仍不完整。
    共识:
    - 世界模型被定位为可学习模拟器，其生成推演需同时满足视觉质量和任务相关的可控性或一致性标准。
    - 共同重点是以结构化信息为条件进行生成，例如动作、上下文、深度、关键点或多视图几何，而非无条件视频预测。
    - 评测正在走向组合证据：标准生成指标、空间或动作保真度得分，以及下游策略或闭环性能。
    - 公共基准和数据集被视为可比性重要条件，但证据显示代码、工件和完整局限性报告可用性不均衡。
    分歧:
    - 部署场景不同：部分系统面向离线基准评测，部分面向实时闭环自动驾驶或仿真中的策略训练。
    - 条件接口不同：显式可观测上下文或动作轨迹、面向跨具身数据的通用潜在动作、以及结构化几何控制是不同设计选择。
    - 先验或监督不同：物理信息深度/关键点目标、上下文潜在动力学、多视图时序一致性目标强调不同结构来源。
    - 评测目标不同：空间一致性、动作保真度、视频真实感、物理合理性和下游策略成功率不可互换，可能给出不同系统排序。
    开放问题:
    - 当前世界模型在Minecraft、CARL或nuScenes等评测环境之外的推演中，空间、物理和动作保真度能维持多久？
    - 在无需假设上下文可观测或共享动作空间的条件下，哪种条件接口——显式上下文、动作轨迹或潜在动作——泛化最好？
    - 多视图或高保真生成与单GPU、多GPU或多机器人系统部署之间的实时服务权衡是什么？
    - 物理信息与跨具身模型能否在不收集大量目标特定数据的情况下迁移到未见机器人平台或驾驶环境？
    - 证据包中部分论文缺少OpenAlex元数据或局限性说明，代码与数据集发布不均，报告进展中有多少可被独立复现？
