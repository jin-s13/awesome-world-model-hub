  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned world-model systems for closed-loop simulation and
        policy learning
      what_it_solves: Generates future observations from controls or context for policy
        training, zero-shot generalization, and autonomous driving simulation.
      what_remains_open: Generalization beyond curated datasets and simplified context
        assumptions, plus long-horizon autoregressive degradation.
    - line: Physics- and geometry-informed generative systems for embodied video synthesis
      what_it_solves: Improves visual fidelity and physical plausibility through depth
        prediction, keypoint dynamics, and motion or structure losses.
      what_remains_open: Evidence mainly covers fidelity metrics; physical correctness
        under unseen interaction and downstream robustness are not fully verified.
    - line: Benchmarks and evaluation frameworks for world-model fidelity
      what_it_solves: Measures spatial consistency or action adherence using datasets
        and metrics such as scene-graph consistency or trajectory-paired evaluation.
      what_remains_open: Covered scenarios are selective, and metrics may not capture
        full physical interaction, long-horizon consistency, or deployment variability.
    - line: Cross-embodiment pretraining systems with shared latent action interfaces
      what_it_solves: Joins human, robot, and simulation interaction data through
        universal latent actions for demonstration generation or policy improvement.
      what_remains_open: Adaptation beyond the evaluated robot platforms and independent
        reproduction remain open; artifact evidence is comparatively weaker.
    consensus:
    - Systems converge on action-conditioned future video generation as a reusable
      substrate for closed-loop autonomy, simulation, or policy learning.
    - Evaluation increasingly moves beyond visual generation quality toward action
      fidelity, spatial consistency, physical plausibility, and downstream policy
      success.
    - Large-scale pretraining or multi-dataset training is common, frequently relying
      on transformer or diffusion backbones.
    - Controllability and temporal coherence are treated as first-class requirements
      in embodied and autonomous deployment settings.
    disagreements:
    - 'Conditioning and representation differ: explicit observable context values,
      latent action tokens, or structured trajectory commands serve as the control
      interface.'
    - 'Supervision signals differ: methods inject physics, depth, or keypoint signals;
      scene-graph consistency; trajectory-paired data; or downstream policy reward.'
    - 'Evaluation targets differ: zero-shot policy generalization, action adherence,
      spatial consistency, video fidelity, or closed-loop latency are optimized separately.'
    - 'Interaction mode differs: some systems target open-loop benchmark generation,
      others closed-loop frame autoregression or imagined-trajectory policy training.'
    - Deployment settings span Minecraft navigation, autonomous driving, and robotic
      manipulation, making direct cross-system comparison difficult.
    open_questions:
    - Can these systems maintain long-horizon temporal, spatial, and action consistency
      beyond the evaluated sequences or benchmark datasets?
    - How well do context or shared latent-action interfaces transfer when context
      is unobservable, embodiment changes, or sensor configuration shifts?
    - Are reported low-latency single-GPU results scalable to multi-GPU or real-time
      closed-loop deployment under distribution shift?
    - Independent reproducibility across teams and infrastructure remains a verification
      gap because several evidence entries lack robust artifact or citation signals.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向闭环仿真与策略学习的动作条件世界模型系统
      解决的问题: 以控制或上下文为条件生成未来观测，用于策略训练、零样本泛化和自动驾驶仿真。
      尚未覆盖: 在有限数据集和简化上下文下有效，但长时程自回归退化和基准域外泛化仍未解决。
    - 路线: 物理与几何信息驱动的具身视频生成系统
      解决的问题: 通过深度、关键点动力学和运动或结构损失提升视频保真度与物理合理性。
      尚未覆盖: 证据主要来自保真度指标，未知交互下的物理正确性和下游稳健性尚未充分验证。
    - 路线: 世界模型保真度评测框架与基准
      解决的问题: 用数据集和指标量化空间一致性或动作忠实度，例如场景图一致性或轨迹配对评测。
      尚未覆盖: 仅覆盖选定场景，可能遗漏完整物理交互、长时程一致性及部署变化。
    - 路线: 基于共享潜在动作接口的跨具身预训练系统
      解决的问题: 通过通用潜在动作连接人类、机器人与仿真数据，生成演示或提升策略成功率。
      尚未覆盖: 已适配机器人平台之外的泛化与独立复现证据不足。
    共识:
    - 系统正趋向以动作条件未来视频生成为闭环自主、仿真或策略学习的可复用基础。
    - 评测开始超越生成图像质量，加入动作忠实度、空间一致性、物理合理性和下游策略成功率。
    - 大规模预训练或多数据集训练常见，多使用Transformer或扩散主干。
    - 可控性和时序一致性成为具身或自主部署场景中的第一等系统要求。
    分歧:
    - 条件表示不同：显式可观测上下文、潜在动作token或结构化轨迹命令作为控制接口。
    - 监督信号不同：注入深度、关键点等物理信号，使用场景图一致性、轨迹配对数据或下游策略奖励。
    - 评测目标不同：分别关注零样本策略泛化、动作忠实度、空间一致性、视频保真度或闭环延迟。
    - 交互模式不同：开放基准生成、闭环帧自回归或想象轨迹策略训练。
    - 部署环境覆盖Minecraft导航、自动驾驶和机器人操作，直接对比较困难。
    开放问题:
    - 这些系统能否在评估序列或基准之外维持长时程时间、空间和动作一致性？
    - 当上下文不可观测、具身变化或传感器配置漂移时，显式上下文或共享潜在动作接口能否迁移？
    - 单GPU低延迟结果是否可扩展到多GPU或分布漂移下的实时闭环部署？
    - 跨团队和基础设施的独立复现仍是验证缺口，因为部分证据缺少稳健工件或引用信号。
