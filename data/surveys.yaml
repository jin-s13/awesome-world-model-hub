  related_work_outline:
  - 'Mainstream direction: building video-generation-based world simulators that can
    be controlled by actions, with a strong focus on closed-loop and interactive capabilities
    for autonomous driving and robotics.'
  - 'Shared research pattern: extending pre-trained or custom generative models (diffusion,
    autoregressive, state-space) with modules and losses that enforce action-following,
    temporal consistency, and physical plausibility, then evaluating in simulated
    rollouts.'
  - 'Key differences: some works target reusable benchmarks and evaluation protocols,
    while others propose new model architectures or training strategies; domain specificity
    ranges from driving to embodied manipulation; interaction modes vary from open-loop
    visual prediction to real-time closed-loop control.'
  - 'Trend evolution: within 2024–2026, the frontier shifts from static video quality
    of world models toward action fidelity, long-horizon stability, and sub-second
    inference, moving from component-level methods to runnable simulation stacks.'
  - 'Open questions: generalizability of closed-loop simulators across unseen environments
    and hardware, trade-offs between real-time speed and long-term consistency, and
    the lack of independent reproducibility across teams and infrastructure.'
  related_work_outline_zh:
  - 主流方向：构建基于视频生成的可动作控制世界模拟器，侧重于自动驾驶和机器人的闭环交互能力。
  - 研究共性：通过动作条件模块和时空一致性损失扩展预训练或自定义生成模型，并在仿真推演中评估动作跟随、动态一致性和物理合理性。
  - 关键差异：部分工作聚焦于可复用的基准和评估协议，另一些提出新的模型架构或训练策略；领域从驾驶到具身操作不等；交互模式从开环视觉预测到实时闭环控制。
  - 趋势演进：2024-2026年间，前沿从世界模型的静态视频质量转向动作保真度、长时域稳定性和亚秒级推理，从组件级方法走向可运行的仿真栈。
  - 开放问题：闭环模拟器在未见环境和硬件上的泛化性，实时速度与长时域一致性之间的权衡，以及跨团队和基础设施的独立可复现性缺失。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: turning model ideas into end-to-end workflows for data, training,
        inference, and evaluation, often in the form of integrated simulation frameworks
        for driving or robotics.
      what_remains_open: how well these stacks survive external deployment, hardware
        changes, and user-specific settings; most evaluations are limited to a single
        dataset (e.g. nuScenes) and controlled GPU conditions.
    - line: Real-time and interactive serving
      what_it_solves: meeting latency and interactivity requirements for closed-loop
        use, such as sub-second frame generation and action-response in autonomous
        driving simulators.
      what_remains_open: trade-offs between speed, fidelity, controllability, and
        system complexity; long-horizon degradation under autoregressive sampling
        and scalability to multi-GPU or resource-constrained robots are not yet systematically
        studied.
    - line: Artifacts and reproducible engineering
      what_it_solves: making systems inspectable and reusable through open-source
        code, datasets, benchmarks, and evaluation metrics for spatial consistency,
        action fidelity, and physical plausibility.
      what_remains_open: independent reproduction across teams, datasets, and infrastructure
        environments; the absence of standardized baseline implementations and computational
        cost reporting limits cross-comparison.
    consensus:
    - World models for interactive simulation must go beyond visual quality and incorporate
      action-conditioned generation, temporal consistency, and physical plausibility.
    - Open-source benchmarks and datasets are essential for systematic comparison
      of action fidelity, spatial consistency, and long-horizon stability.
    - Closed-loop evaluation is more informative than open-loop metrics, and simulators
      should support policy training and evaluation in the loop.
    - Lightweight adaptation modules or fine-tuning strategies can turn pre-trained
      generative models into effective world simulators without full retraining.
    disagreements:
    - 'Representation form: diffusion models vs autoregressive transformers vs recurrent
      state-space models, each with different trade-offs in generation quality, speed,
      and controllability.'
    - 'Supervision signal: some works impose explicit physics losses (depth, keypoints),
      while others rely on motion-reinforced losses or action-conditioned modules
      without explicit 3D structure.'
    - 'Evaluation target: some emphasize spatial consistency (loop closure), others
      focus on action-following accuracy, and still others prioritize zero-shot generalization
      to unseen dynamics.'
    - 'Interaction mode: a few systems target real-time closed-loop simulation with
      latency constraints, while most stop at open-loop rollout quality without strict
      timing requirements.'
    - 'Deployment setting: solutions range from single-GPU real-time inference for
      specific driving datasets to general pretrained models that require heavy adaptation
      per domain.'
    open_questions:
    - How can long-horizon closed-loop stability be guaranteed when autoregressive
      errors accumulate, especially in safety-critical applications like autonomous
      driving?
    - Do current benchmarks (LoopNav, ACT-Bench) capture the diversity and failure
      modes of real-world deployment, or are they biased toward curated datasets?
    - What is the minimum compute and latency budget for deploying interactive world
      models on embedded robotic platforms, and how does it affect model design choices?
    - Can the reproducibility of these systems be verified independently, given the
      variability in code release, dataset preprocessing, and infrastructure requirements?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型想法转化为覆盖数据、训练、推理和评估的端到端工作流，通常以面向驾驶或机器人的集成仿真框架形式出现。
      尚未覆盖: 这些栈在外部部署、硬件变化和用户特定设置下是否仍然可靠；大部分评估仅限于单一数据集（如 nuScenes）和受控 GPU 条件。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟和交互需求，例如在自动驾驶模拟器中实现亚秒级帧生成和动作响应。
      尚未覆盖: 速度、保真度、可控性和系统复杂度之间的权衡；自回归采样下的长时域退化，以及向多GPU或资源受限机器人平台的可扩展性尚未系统研究。
    - 路线: 工件与可复现工程
      解决的问题: 通过开源代码、数据集、基准与评价指标，使系统可检查、可复用，并支持空间一致性、动作保真度和物理合理性的评估。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现；缺乏标准化的基线实现和计算成本报告，限制了横向比较。
    共识:
    - 面向交互式仿真的世界模型必须超越视觉质量，同时纳入动作条件生成、时间一致性和物理合理性。
    - 开源基准和数据集对于系统比较动作保真度、空间一致性和长时域稳定性至关重要。
    - 闭环评估比开环指标更有信息量，模拟器应支持在环策略训练和评估。
    - 轻量级适配模块或微调策略可将预训练生成模型转化为有效的世界模拟器，无需完全重新训练。
    分歧:
    - 表示形式：扩散模型、自回归变换器与循环状态空间模型各有不同的生成质量、速度与可控性权衡。
    - 监督信号：部分工作施加显式物理损失（深度、关键点），另一些依赖运动增强损失或动作条件模块，而不引入显式三维结构。
    - 评测目标：有的强调空间一致性（闭环导航），有的侧重动作跟随精度，还有的优先考虑对未见动力学的零样本泛化。
    - 交互模式：少数系统以延时约束实现实时闭环仿真，而多数工作止步于开环推演质量，未严格规范时序要求。
    - 部署场景：方案从面向特定驾驶数据集的单GPU实时推理，到需要针对每个领域进行大量适配的通用预训练模型。
    开放问题:
    - 当自回归误差累积时，如何保证长时域闭环稳定性，特别是在自动驾驶等安全关键应用中？
    - 现有基准（如 LoopNav、ACT-Bench）是否捕获了真实部署的多样性和故障模式，还是偏向于精选数据集？
    - 在嵌入式机器人平台上部署交互式世界模型的最小算力和延迟预算是多少，又如何在模型设计中体现？
    - 鉴于代码发布、数据预处理和基础设施要求的差异，这些系统的可复现性能否得到独立验证？
