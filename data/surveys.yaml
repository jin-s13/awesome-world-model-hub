  - 主流方向：以动作可控视频生成为核心的世界模型系统与评测平台，重点覆盖闭环自动驾驶和具身操作，如 Vista、FAR-Drive、Terra ACT-Bench、RynnWorld-Latent。
  - 研究共性：在序列帧上以动作、上下文或物理信号为条件训练生成式视频/潜变量模型，通过视觉保真度、动作遵循、空间一致性或下游策略成功评估；部分工作发布基准或代码。
