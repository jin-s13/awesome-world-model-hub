  related_work_outline_zh:
  - 主流方向：专用基准正在涌现，针对空间一致性、记忆和动作控制，超越传统帧预测评估。
  - 研究共性：提出新数据集，配合任务特定指标（如场景图一致性、记忆一致性）和基线，诊断世界模型某方面能力。
  - 关键差异：环境覆盖驾驶、Minecraft和机器人；评估从开环像素重建到闭环交互；指标侧重空间、时间或决策层面的一致性。
  - 趋势演进：从2023年依赖Atari 100k作为事实标准，2025–2026年转向专门诊断世界模型能力的设计基准，且越来越关注长期记忆和动作条件展开。
  - 开放问题：代理指标是否与下游决策效用对齐；物理合理性与真实场景覆盖不足；基准结论在不同实现和算力预算下的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, e.g., LoopNav for spatial consistency in Minecraft and MIND for
        memory consistency and action control across diverse scenes.
      what_remains_open: Whether the task distribution covers real-world settings
        where world models are expected to help, and difficulty of maintaining long-term
        memory consistency remains a challenge.
    - line: Metric and stress-test design
      what_it_solves: Probing specific capabilities like spatial consistency (Scene
        Graph Consistency Score), memory consistency, and action control beyond aggregate
        generation scores, often through varied action spaces and loop closure.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility (e.g., policy training) is unverified; physical plausibility and long-horizon
        decision stress tests are largely missing.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common benchmarks (Nuscenes,
        Atari 100k, CARL) and standardized reporting of scores, enabling progress
        tracking in world-model research.
      what_remains_open: Stability of benchmark conclusions across different implementations
        and compute budgets is not established; reproducibility is limited by missing
        code, data, or limitation statements in some studies.
    consensus:
    - World-model evaluation must move beyond visual fidelity to include spatial,
      temporal, and interactive consistency metrics.
    - Benchmarks should support closed-loop, action-conditioned evaluation to assess
      dynamics modeling and control, not just open-loop generation.
    - Diagnostic datasets with controlled variations (e.g., different action spaces,
      loop closure) are necessary to isolate specific model failures.
    disagreements:
    - 'Environments differ substantially: driving (Nuscenes) vs. open-world games
      (Minecraft) vs. robotic manipulation, making cross-domain generalization claims
      hard to compare.'
    - 'Evaluation targets vary: some focus on spatial consistency under pixel-level
      noise, others on memory over long horizons, and others on action controllability;
      no unified meta-evaluation exists.'
    - 'Interaction mode differs: open-loop sampling vs. closed-loop revisiting; some
      benchmarks embed action as a condition, while others use navigation loops to
      test consistency without explicit action conditioning.'
    open_questions:
    - How to design proxy metrics that correlate with downstream decision performance,
      such as policy learning from world-model rollouts?
    - Can current benchmarks be extended to cover physical plausibility and long-term
      decision-making, or are entirely new tasks needed?
    - What is the minimal set of evaluation dimensions to guarantee that a world model
      is useful for real-world deployment, and how stable are rankings across different
      compute budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具有可比性，例如LoopNav用于Minecraft中的空间一致性，MIND用于跨场景的记忆一致性与动作控制。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的真实设置，长期记忆一致性维持仍是挑战。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体得分之外检验空间一致性（场景图一致性分数）、记忆一致性和动作控制等特定能力，常通过多样化动作空间和闭环重访实现。
      尚未覆盖: 这些代理指标与下游决策效用（如策略训练）的一致性未经验证；物理合理性和长时域决策压力测试基本缺失。
    - 路线: 可比基线与报告规范
      解决的问题: 通过通用基准（Nuscenes、Atari 100k、CARL）和标准化分数报告，使结果可审计，推动世界模型研究进展。
      尚未覆盖: 基准结论在不同实现和算力预算下的稳定性未被验证；部分研究代码、数据或局限性声明缺失，可复现性受限。
    共识:
    - 世界模型评估必须超越视觉保真度，纳入空间、时间和交互一致性度量。
    - 基准应支持闭环、动作条件评估，以检验动力学建模和控制能力，而非仅开环生成。
    - 通过控制变量设计的诊断数据集（如不同动作空间、闭环）对于隔离模型特定失败模式是必要的。
    分歧:
    - 环境差异显著：驾驶（Nuscenes）vs 开放世界游戏（Minecraft）vs 机器人操作，使得跨领域泛化声明难以比较。
    - 评估目标不同：有的侧重像素级变化下的空间一致性，有的侧重长时域记忆，有的侧重动作可控性；缺乏统一的元评估框架。
    - 交互模式不同：开环采样 vs 闭环重访；有的基准将动作作为条件嵌入，有的则利用导航循环来测试一致性，无需显式动作条件。
    开放问题:
    - 如何设计能与下游决策性能（如从世界模型展开中学习策略）相关的代理指标？
    - 现有基准能否扩展以覆盖物理合理性和长期决策，还是需要全新任务？
    - 保证世界模型对真实部署有用的最小评估维度集是什么？不同算力预算下的排名稳定性如何？
