  - 'Shared research pattern: learn future observations or latent dynamics from self-supervised
    video/interaction data, then use the learned model for policy learning, video
    planning, or consistency evaluation.'
  - 'Key differences: representation spans pixel-space video generation, latent stochastic
    rollouts, and unified action-video diffusion; supervision and evaluation targets
    differ across driving, robot, and control benchmarks.'
  - 'Trend evolution: available top evidence clusters in 2023-2026, moving from efficient
    stochastic RL world models toward contextual/compositional robot models, physics-informed
    generation, unified video-action pretraining, and closed-loop consistency benchmarks.'
  - 'Open questions: how to separate model contributions from planner, data, or interface
