  - 主流方向：面向应用的世界模型以生成式、动作或上下文条件化的预测模型为主，集中在驾驶、机器人和交互环境，代表性工作包括 MaskGWM、RoboScape、UWM
    和 MIND。
  - 研究共性：多数工作学习未来观测或潜在状态的预测模型，并通过下游策略学习、零样本迁移或一致性评估进行验证。
  - 关键差异：工作路线在表示、监督信号和评测目标上分化；驾驶强调多视角长时域生成，机器人强调物理真实与动作耦合，交互游戏环境强调记忆一致性和样本效率。
  - 趋势演进：高排序证据集中在 2023-2026，从游戏中的样本高效强化学习转向机器人/驾驶视频世界模型，并加入物理信息、视频-动作耦合和一致性评测；早期年份未能进入当前焦点。
  - 开放问题：真实世界迁移、超出已见上下文/动作/本体的泛化、长期记忆一致性以及共享评测协议仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotic and contextual control tasks
        by learning latent dynamics or generating action- and context-conditioned
        video for policy training and zero-shot generalization.
      what_remains_open: Transfer across embodiments and to real robots is under-verified;
        compositional or context-conditioned methods rely on seen primitives or observable
        context values.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Predicting multi-view and long-horizon driving scenes for simulation,
        policy evaluation, and cross-dataset transfer.
      what_remains_open: Generator metric gains are not yet connected to real-world
        safety or operational outcomes, and limitations are often unreported.
    - line: Interactive agents and games
      what_it_solves: Evaluating and improving world models in action-controlled,
        loop-based, or game environments, including spatial/memory consistency and
        sample-efficient reinforcement learning.
      what_remains_open: Current evidence shows weak long-term memory and cross-action-space
        generalization; some proposed evaluations lack reported baseline results.
    consensus:
    - Application-oriented world models are usually constructed as generative predictors
      of future observations conditioned on actions, context, or language.
    - Most methods combine scalable sequence or generation architectures with auxiliary
      tasks or pretraining objectives to improve fidelity, controllability, or downstream
      policy learning.
    - Evaluation is expanding from single-task scores toward long-horizon generation,
      spatial/memory consistency, action controllability, zero-shot transfer, and
      downstream robot policy utility.
    - Dataset, benchmark, or code release is becoming common, but limitation reporting
      remains uneven.
    disagreements:
    - 'Representation differs: recurrent latent state-space models optimize compact
      dynamics for control, while diffusion and Transformer video models optimize
      high-dimensional perceptual fidelity.'
    - 'Supervision differs: masked reconstruction, physics-informed auxiliary signals,
      language-parsed primitive composition, unified video-action diffusion, and imagined-trajectory
      policy learning optimize different capabilities.'
    - 'Evaluation targets differ: closed-loop memory/action consistency, zero-shot
      context or dataset transfer, human-normalized game performance, physical plausibility,
      and downstream robot execution are not unified.'
    - 'Deployment settings differ: driving emphasizes multi-view and cross-dataset
      prediction; robotics emphasizes object/action composition and physical realism;
      interactive game environments emphasize loop memory and sample-efficient interaction.'
    open_questions:
    - Do generative world model gains on driving, robot simulation, or game environments
      transfer to real-world safety, physical execution, or unseen environment dynamics?
    - Can spatial consistency and action control be maintained over long loops and
      across changed action spaces, embodiments, or goals?
    - Can compositional or contextual models handle novel primitives or unobserved
      context rather than only recombinations of training conditions?
    - Which evaluation protocol can jointly certify physical plausibility, memory
      consistency, and policy utility without conflating popularity or read-first
      signals with evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人与上下文控制任务，通过学习潜在动力学或生成动作/上下文条件视频来支持策略训练与零样本泛化。
      尚未覆盖: 跨本体和真实机器人迁移尚未充分验证；组合式或上下文条件方法依赖已见原语或可观测上下文。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 预测多视角、长时域驾驶场景，用于仿真、策略评测和跨数据集迁移。
      尚未覆盖: 生成指标提升尚未与真实世界安全或运营结果建立联系，局限性也常未报告。
    - 路线: 交互式智能体与游戏
      解决的问题: 在受控、循环或游戏环境中评估和改进世界模型的记忆一致性、动作可控性和样本高效强化学习能力。
      尚未覆盖: 当前证据显示长期记忆和跨动作空间泛化较弱；部分评测提出后未报告基线结果。
    共识:
    - 面向应用的世界模型通常被构造为以动作、上下文或语言为条件的未来观测生成模型。
    - 多数方法结合可扩展的序列或生成架构与辅助任务或预训练目标，以提升保真度、可控性或下游策略学习。
    - 评测正从单任务分数扩展到长时域生成、空间/记忆一致性、动作可控性、零样本迁移和下游机器人策略效用。
    - 数据集、基准或代码发布逐渐常见，但局限性报告仍不均衡。
    分歧:
    - 表示不同：潜在循环状态空间模型优化紧凑动力学，而扩散与 Transformer 视频模型优化高维感知保真度。
    - 监督不同：掩码重建、物理信息辅助信号、语言解析原语组合、统一视频-动作扩散和想象轨迹策略学习优化不同能力。
    - 评测目标不同：闭环记忆/动作一致性、零样本上下文或数据集迁移、人类归一化游戏分数、物理合理性与下游机器人执行尚未统一。
    - 部署设置不同：驾驶强调多视角与跨数据集预测；机器人强调目标/动作组合和物理真实性；交互游戏环境强调循环记忆与样本高效交互。
    开放问题:
    - 生成世界模型在驾驶、机器人仿真或游戏环境中的收益是否迁移到真实安全、物理执行或未见环境动力学？
    - 空间一致性和动作控制能否在长循环和变化动作空间、本体或目标下保持？
    - 组合式或上下文模型能否处理全新原语或未观测上下文，而不仅是训练条件重组？
    - 哪种评测协议能联合认证物理合理性、记忆一致性和策略效用，同时不把热度或阅读优先分数混同为证据？
