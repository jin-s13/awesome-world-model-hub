  related_work_outline:
  - 'Mainstream direction: Constructing specialized benchmarks that evaluate world
    models along fine-grained capabilities such as spatial consistency, memory consistency,
    action control, and physical plausibility, moving beyond aggregate generation
    scores.'
  - 'Shared research pattern: Introduces a new dataset and evaluation protocol targeting
    a specific world-model weakness (e.g., loop navigation, long-term memory, visual
    details), then uses it to reveal failures of current models.'
  - 'Key differences: Benchmarks differ in the capability dimension they probe (spatial
    consistency in Minecraft vs. memory and action control in open-domain videos vs.
    Atari visual fidelity), the environment modality (simulated, real-video, game),
    and the metric philosophy (scene-graph consistency, human-normalized score, perceptual
    loss).'
  - 'Trend evolution: From 2023 onward, the focus shifts from proposing world-model
    architectures (e.g., STORM) to constructing diagnostic benchmarks (LoopNav, MIND)
    that explicitly test for spatial and temporal stability, indicating a maturing
    evaluation-first mindset.'
  - 'Open questions: Whether benchmark distributions capture the real-world settings
    where world models are expected to help; alignment between proxy metrics and actual
    downstream decision quality; stability of benchmark conclusions across implementations
    and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建专门评估世界模型细粒度能力的基准，如空间一致性、记忆一致性、动作控制和物理合理性，超越聚合生成分数。
  - 研究共性：提出新数据集和评测协议，针对世界模型的一个特定弱点（如循环导航、长期记忆、视觉细节），并用它揭示当前模型的失败。
  - 关键差异：基准在探测的能力维度（Minecraft空间一致性 vs. 开放域视频记忆与动作控制 vs. Atari视觉保真度）、环境模态（模拟、真实视频、游戏）和指标哲学（场景图一致性、人类归一化得分、感知损失）上存在差异。
  - 趋势演进：从2023年起，焦点从提出世界模型架构（如STORM）转向构建诊断性基准（LoopNav、MIND），明确测试时空稳定性，表明评估优先的思维正在成熟。
  - 开放问题：基准分布是否覆盖了世界模型预期发挥作用的真实世界设置；代理指标与下游决策质量之间是否一致；不同实现和算力预算下基准结论的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world model capabilities
      what_it_solves: Creates shared datasets and tasks (e.g., loop-based navigation
        in Minecraft, diverse-scene video with action spaces) to systematically compare
        world models on spatial consistency, memory, and action control.
      what_remains_open: Whether these simulated or curated video distributions cover
        the open-domain, real-world dynamics where world models are meant to operate;
        generalization beyond the specific action spaces and scenes remains unverified.
    - line: Metric and stress-test design for specific world model properties
      what_it_solves: Probes prediction, controllability, and robustness beyond aggregate
        scores through property-specific metrics like Scene Graph Consistency Score,
        memory consistency frameworks, and action-control evaluation.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about (e.g., policy safety, deployment success)
        is not yet established; metrics are often tied to narrow environmental assumptions.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Makes results auditable by adopting standard benchmarks (Atari
        100k, Nuscenes) and releasing code, enabling fair comparison across world-model
        architectures and training budgets.
      what_remains_open: Stability of benchmark conclusions under different implementations
        and compute budgets is rarely tested; systematic reporting of limitations
        (e.g., evaluation on only two tasks) is still missing, limiting cross-study
        reliability.
    consensus:
    - World models require dedicated benchmarks that isolate specific capabilities
      (spatial coherence, long-term memory, physical plausibility) because standard
      generation metrics fail to capture these aspects.
    - Diagnostic evaluation protocols are needed to expose failures in temporal stability
      and contextual coherence that are invisible in frame-level visual quality scores.
    - Reproducible benchmarks with open-source code and datasets are essential for
      advancing the field, as they enable controlled comparisons and lower the barrier
      to entry.
    disagreements:
    - 'The choice of the primary capability to evaluate varies: spatial consistency
      via loop closure (LoopNav) vs. memory and action control in open-domain videos
      (MIND) vs. visual detail impact on agent performance (DIAMOND).'
    - Environments range from synthetic game worlds (Minecraft, Atari) to real-world
      driving and robotic videos, leading to different assumptions about action space,
      dynamics complexity, and domain gap.
    - 'Metric design philosophies differ: some favor structural consistency scores
      invariant to pixel-level changes, while others use human-normalized task scores
      or perceptual similarity, making cross-benchmark interpretation difficult.'
    open_questions:
    - How can benchmarks be designed to cover the true distribution of real-world
      settings where world models are expected to aid decision-making, without overfitting
      to a single simulator or dataset?
    - What is the empirical relationship between proxy metrics like spatial consistency
      or memory stability and the actual quality of downstream policies trained with
      those world models?
    - Are the relative rankings of world models robust to variations in implementation
      details, hyperparameter tuning, and compute budget, or do current benchmarks
      favor specific resource-intensive configurations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型能力的基准任务与数据集设计
      解决的问题: 创建共享数据集和任务（如Minecraft中的循环导航、带动作空间的多样化场景视频），以系统比较世界模型在空间一致性、记忆和动作控制方面的表现。
      尚未覆盖: 这些模拟或精选的视频分布是否覆盖了世界模型预期运行的真实开放域动态；在特定动作空间和场景之外的泛化能力尚未得到验证。
    - 路线: 针对特定世界模型属性的指标与压力测试设计
      解决的问题: 通过场景图一致性分数、记忆一致性框架和动作控制评估等属性特定指标，在总分之外检验预测、可控性和鲁棒性。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策（如策略安全性、部署成功率）之间的一致性尚未建立；指标通常与狭窄的环境假设绑定。
    - 路线: 可比基线与报告规范
      解决的问题: 通过采用标准基准（Atari 100k、Nuscenes）和发布代码，使结果可审计，支持跨架构和训练预算的公平比较。
      尚未覆盖: 基准结论在不同实现和算力预算下的稳定性很少被测试；系统性地报告局限性（如仅评估两个任务）的缺失限制了跨研究可靠性。
    共识:
    - 世界模型需要专门的基准来隔离特定能力（空间一致性、长期记忆、物理合理性），因为标准生成指标无法捕捉这些方面。
    - 需要诊断性评估协议来暴露在帧级视觉质量分数中不可见的时间稳定性和上下文连贯性失败。
    - 具有开源代码和数据集的、可复现的基准对于推动领域发展至关重要，因为它们能实现受控比较并降低进入门槛。
    分歧:
    - 评估的主要能力选择不同：通过循环闭合的空间一致性（LoopNav），通过开放域视频的记忆和动作控制（MIND），以及视觉细节对智能体性能的影响（DIAMOND）。
    - 环境从合成游戏世界（Minecraft、Atari）到真实驾驶和机器人视频，导致对动作空间、动力学复杂性和领域差距的假设不同。
    - 指标设计哲学存在差异：有的偏好对像素级变化不变的结构一致性分数，有的使用人类归一化任务分数或感知相似度，使得跨基准解读困难。
    开放问题:
    - 如何设计基准以覆盖世界模型预期辅助决策的真实世界设置的真实分布，而不过拟合于单一模拟器或数据集？
    - 像空间一致性或记忆稳定性这样的代理指标与使用这些世界模型训练的下游策略的实际质量之间的实证关系是什么？
    - 世界模型的相对排名是否对实现细节、超参数调优和算力预算的变化具有鲁棒性，还是当前基准偏向于特定的资源密集型配置？
