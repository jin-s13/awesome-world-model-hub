  related_work_outline:
  - 'Mainstream direction: The current frontier evaluates world models through shared
    video-action tasks, spatial/memory/action consistency, visual fidelity, and downstream
    policy usefulness instead of aggregate scores alone. Representative examples include
    MIND and LoopNav, while model papers report on Atari 100k, CARL, Nuscenes, OpenDV-2K,
    Waymo, and robot datasets.'
  - 'Shared research pattern: Papers standardize an observation-action task, generate
    long-horizon or multi-view video, and compare against baselines with quantitative
    metrics. They increasingly pair visual realism with controllability, consistency,
    or policy checks, and use pretraining plus downstream evaluation.'
  - 'Key differences: They differ by evaluation target and domain: open-domain memory/action
    control, driving prediction, Atari or robotic policy learning, and contextual
    zero-shot dynamics. They also differ in representation: diffusion, transformer-VAE,
    physics-informed depth/keypoint, and coupled video-action diffusion, plus open-loop
    versus closed-loop interaction.'
  - 'Trend evolution: Within the 2023-2026 evidence, focus moves from Atari 100k and
    contextual RL toward open-domain memory/action benchmarks, physics-informed or
    robotic video-action models, and long-horizon consistency. This is a current-frontier
    shift rather than a long historical trend.'
  - 'Open questions: How well do spatial consistency, memory/action, or visual metrics
    predict downstream policy quality? Do conclusions transfer across simulation,
    driving, robotics, and open-domain settings? Are reported gains stable across
    compute and implementations given missing limitations, code, dataset, and metric
    details?'
  related_work_outline_zh:
  - 主流方向：当前前沿通过共享视频-动作任务、空间/记忆/动作一致性、视觉保真度和下游策略效用评估世界模型，而非只看聚合分数。代表例如 MIND、LoopNav
    基准，模型论文则在 Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo 和机器人数据上报告。
  - 研究共性：标准化观测-动作任务，生成长时域或多视角视频，并用定量指标与基线比较；越来越多同时关注视觉真实性与可控性/一致性/策略检验，采用预训练加下游评估。
  - 关键差异：评测目标与领域不同，包括开放域记忆/动作控制、驾驶预测、Atari或机器人策略、上下文零样本动力学；表示也不同，包括扩散、Transformer-VAE、物理信息深度/关键点、视频-动作耦合扩散，以及开环与闭环交互。
  - 趋势演进：在2023-2026证据内，焦点从 Atari 100k 和上下文RL转向开放域记忆/动作基准、物理信息或机器人视频-动作模型与长时域一致性，属于当前前沿内部演进。
  - 开放问题：空间一致性、记忆/动作或视觉指标能否预测下游策略质量？结论是否跨仿真、驾驶、机器人和开放域迁移？在缺失限制、代码、数据集和指标细节的情况下，报告增益是否在算力和实现间稳定？
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Builds shared closed-loop or loop-based video-action tasks and
        datasets to make spatial consistency, memory consistency, action control,
        and cross-action-space generalization comparable.
      what_remains_open: Coverage remains narrow; Minecraft and open-domain videos
        may not transfer to driving, robotics, or long-horizon real-world decisions,
        and no transfer evidence is reported.
    - line: Metric and stress-test design
      what_it_solves: Adds targeted proxies such as scene-graph consistency, memory/action
        scores, human-normalized scores, visual fidelity, and physical plausibility
        to probe capabilities beyond aggregate video prediction.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        is unclear; long-term stability and invariance to pixel variation are only
        partially measured.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared protocols and baselines across Atari 100k, CARL,
        Nuscenes, OpenDV-2K, Waymo, and robot datasets to make model and policy comparisons
        auditable.
      what_remains_open: Artifact and limitation reporting is uneven; missing code,
        dataset, metric, or limitation details leave cross-implementation and compute-budget
        stability as verification gaps.
    consensus:
    - Evaluation should move beyond aggregate scores by testing consistency, controllability,
      or downstream policy usefulness.
    - Long-horizon, multi-view, or zero-shot/unseen-context settings are important
      for showing generalization.
    - Richer visual detail or physics signals are treated as useful for agent and
      generation quality in standardized benchmarks.
    - Shared benchmarks and baselines are necessary, but they are split across driving,
      robotics, simulation, and open-domain video.
    disagreements:
    - 'Evaluation target differs: open-domain memory/action control, driving video
      prediction, Atari sample-efficiency, contextual RL, or robot manipulation.'
    - 'Representation and learning signal differ: diffusion-based generation, transformer-VAE
      stochastic models, physics-informed depth/keypoint learning, or video-action
      coupled diffusion.'
    - 'Interaction mode differs: open-loop video generation, closed-loop policy training,
      or zero-shot dynamics transfer.'
    - 'Metrics differ and are not commensurable: scene-graph consistency, memory/action
      scores, human-normalized Atari score, visual fidelity, and physical plausibility.'
    open_questions:
    - Which metrics best predict real policy or deployment performance in driving
      and robotics?
    - Can open-domain memory/action benchmarks cover long-horizon and cross-action-space
      generalization while remaining tractable and reproducible?
    - How stable are conclusions across implementations, compute budgets, and dataset
      splits given uneven reporting artifacts?
    - Do existing benchmarks transfer from simulation or game-like settings to physical
      or real-world environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享闭环或循环视频-动作任务与数据集，使空间一致性、记忆一致性、动作控制和跨动作空间泛化可比较。
      尚未覆盖: 覆盖范围仍窄；Minecraft 和开放域视频未必能迁移到驾驶、机器人或长时域真实决策，缺少迁移证据。
    - 路线: 指标与压力测试设计
      解决的问题: 引入场景图一致性、记忆/动作分数、人类归一化分数、视觉保真度和物理合理性等代理指标，在聚合视频预测之外探测能力。
      尚未覆盖: 代理指标与下游决策的一致性不清晰；长期稳定性和对像素变化的不变性仅被部分评估。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo 和机器人数据上的共享协议与基线，使模型和策略比较可审计。
      尚未覆盖: 工件与限制报告不均衡；缺少代码、数据集、指标或限制细节，跨实现和算力预算的稳定性仍是验证缺口。
    共识:
    - 评估应超越聚合分数，加入一致性、可控性或下游策略效用检验。
    - 长时域、多视角或零样本/未见上下文设置对泛化声明很重要。
    - 更丰富的视觉细节或物理信号在标准化基准中被视为对智能体和生成质量有益。
    - 共享基准和基线必要，但目前分散在驾驶、机器人、仿真和开放域视频中。
    分歧:
    - 评测目标不同：开放域记忆/动作控制、驾驶视频预测、Atari样本效率、上下文RL或机器人操作。
    - 表示与学习信号不同：扩散生成、Transformer-VAE随机模型、物理信息深度/关键点学习或视频-动作耦合扩散。
    - 交互模式不同：开环视频生成、闭环策略训练或零样本动力学迁移。
    - 指标不统一：场景图一致性、记忆/动作分数、人类归一化Atari分数、视觉保真度与物理合理性。
    开放问题:
    - 哪些指标最能预测驾驶和机器人中的真实策略或部署表现？
    - 开放域记忆/动作基准能否在覆盖长时域和跨动作空间泛化的同时保持可复现与可操作？
    - 在报告工件不均衡的情况下，结论在实现、算力预算和数据集划分间有多稳定？
    - 现有基准能否从仿真或游戏设置迁移到物理或真实环境？
