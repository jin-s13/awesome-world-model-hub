  related_work_outline_zh:
  - 主流方向：构建可运行的视频世界模型作为策略评估和闭环驾驶的模拟平台，优先关注动作可控性和长时域一致性。
  - 研究共性：在提出方法的同时发布基准或数据集，用标准化指标评估多个模型，并开放代码与工件以实现可复现对比。
  - 关键差异：部分工作聚焦动态环境下的零样本泛化，其他则侧重高保真重建或实时交互；评估范围从视觉质量延伸到下游策略性能。
  - 趋势演进：2024至2026年，前沿从开环视频生成转向闭环、动作条件化、物理信息驱动的世界模型，并开始考虑系统级部署。
  - 开放问题：如何保证分布外场景下的可靠模拟，如何平衡实时延迟与生成保真度，以及如何超越视觉指标衡量真正的策略评估效用。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end video world model systems for policy evaluation
      what_it_solves: Replacing costly real-world rollouts with simulated trajectories
        for training and evaluating robot or driving policies, using benchmarks like
        WMBench and frameworks like FAR-Drive.
      what_remains_open: Long-horizon consistency under distribution shift and out-of-domain
        actions; scalability to diverse sensor configurations and new environments
        beyond the training dataset.
    - line: Physics-informed and controllability-enhanced world models
      what_it_solves: Improving physical plausibility and action fidelity of generated
        videos through joint training on depth, keypoints, or structural losses, as
        in RoboScape and Vista.
      what_remains_open: Accurate modeling of complex physical interactions; trade-offs
        between speed, controllability granularity, and visual realism; generalization
        to robotic embodiments beyond the training domain.
    - line: Interactive and closed-loop simulation frameworks
      what_it_solves: Enabling real-time, action-conditioned video generation for
        closed-loop autonomous driving or interactive environments, with low-latency
        inference and autoregressive consistency mechanisms.
      what_remains_open: Reliable real-time performance under varying hardware constraints;
        mitigation of iterative degradation in very long sequences; integration with
        diverse sensor modalities and interactive agents.
    - line: Contextual world models for zero-shot generalization
      what_it_solves: Adapting learned dynamics to unseen contexts by conditioning
        the world model on observable context variables, improving zero-shot policy
        transfer in contextual RL.
      what_remains_open: Assumption of observable context values; limited evaluation
        to a narrow set of tasks; applicability to complex visual environments and
        real-world settings with unobservable dynamics.
    consensus:
    - Video world models are becoming a practical replacement for classic simulators
      in policy evaluation and closed-loop driving.
    - Action controllability and long-horizon rollout consistency are critical for
      reliable simulation, more so than short-term visual quality.
    - Standardized benchmarks and open code are needed to enable reproducible comparisons
      and track progress.
    - Pretraining on large-scale video data helps but must be balanced with domain-specific
      controllability and physical realism.
    disagreements:
    - 'Evaluation targets diverge: some use visual fidelity metrics like FID and FVD,
      while others measure downstream policy performance or action-following accuracy.'
    - 'Architectural choices vary: diffusion-based models, autoregressive transformers,
      and recurrent state-space models each emphasize different trade-offs between
      quality, speed, and controllability.'
    - 'The role of physics varies: explicit physics losses or keypoint dynamics are
      used in some works, while others rely purely on data-driven generation without
      explicit physical constraints.'
    - 'Interaction mode: open-loop rollout evaluation vs. closed-loop autoregressive
      simulation leads to different requirements for error accumulation and real-time
      latency.'
    open_questions:
    - How can we verify the reliability of a world model as a policy evaluator when
      ground-truth real-world rollouts are not available for the target task?
    - What evaluation protocol can isolate the impact of visual fidelity from action-following
      accuracy on final policy performance?
    - Can world models be made robust to distribution shifts, novel object instances,
      and varying physical parameters without exhaustive retraining?
    - How should memory and context mechanisms be designed to support consistent long-horizon
      simulation without prohibitive computational cost?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 用于策略评估的端到端视频世界模型系统
      解决的问题: 用模拟轨迹替代昂贵的真实世界部署，以训练和评估机器人或驾驶策略，通过 WMBench 等基准和 FAR-Drive 等框架实现。
      尚未覆盖: 分布偏移和域外动作下的长时域一致性；对训练数据集之外的不同传感器配置和新环境的可扩展性。
    - 路线: 物理信息与可控性增强的世界模型
      解决的问题: 通过深度、关键点或结构损失的联合训练，提升生成视频的物理合理性和动作忠实度，如 RoboScape 和 Vista。
      尚未覆盖: 复杂物理交互的精确建模；速度、可控性粒度和视觉真实感之间的权衡；向训练域外机器人本体的泛化。
    - 路线: 交互式与闭环仿真框架
      解决的问题: 实现实时、动作条件化的视频生成，用于闭环自动驾驶或交互环境，具备低延迟推理和自回归一致性机制。
      尚未覆盖: 不同硬件约束下的可靠实时性能；极长序列中迭代退化的缓解；与多样传感器模态和交互智能体的集成。
    - 路线: 面向零样本泛化的上下文世界模型
      解决的问题: 通过将世界模型条件化于可观测上下文变量，使学习到的动力学适应未见过的上下文，提升上下文强化学习中的零样本策略迁移。
      尚未覆盖: 可观测上下文值的假设；仅限少数任务的评估；在复杂视觉环境和具有不可观测动力学的真实场景中的适用性。
    共识:
    - 视频世界模型正成为经典仿真器在策略评估和闭环驾驶中的实用替代方案。
    - 动作可控性和长时域推演一致性对于可靠模拟至关重要，比短期视觉质量更为关键。
    - 标准化基准和开放代码是实现可复现对比和跟踪进展的必要条件。
    - 大规模视频预训练有帮助，但必须与领域特定的可控性和物理真实感相平衡。
    分歧:
    - 评估目标不一：部分工作使用 FID、FVD 等视觉保真度指标，其他则衡量下游策略性能或动作跟随精度。
    - 架构选择各异：基于扩散的模型、自回归变换器和循环状态空间模型在质量、速度与可控性之间强调不同的权衡。
    - 物理的作用不同：部分工作采用显式物理损失或关键点动力学，而其他工作则仅依赖数据驱动生成，不施加显式物理约束。
    - 交互模式差异：开环推演评估与闭环自回归模拟对误差累积和实时延迟有不同要求。
    开放问题:
    - 当目标任务缺乏真实世界部署真值时，如何验证世界模型作为策略评估器的可靠性？
    - 何种评估协议能分离视觉保真度与动作跟随精度对最终策略性能的影响？
    - 世界模型能否在不进行穷举再训练的情况下，对分布偏移、新物体实例和变化的物理参数保持鲁棒？
    - 如何设计记忆和上下文机制，以支持一致的长时域模拟且不带来过高的计算代价？
