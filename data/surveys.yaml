  - 'Mainstream direction: Building world models as video simulators for embodied
    agents, with a strong focus on action-controllable generation, physical plausibility,
    and closed-loop evaluation in autonomous driving and robotics.'
  - 'Shared research pattern: Researchers adopt video generation models (diffusion
    or autoregressive) and condition them on actions, contexts, or physical priors;
    they then validate the generated videos through fidelity metrics and downstream
    task performance, often releasing datasets and benchmarks.'
  - 'Key differences: Approaches differ in the type of world model backbone (Dreamer-style
    latent models vs. diffusion transformers), the use of explicit physics supervision
    vs. implicit learning, the reliance on pre-trained video models vs. training from
    scratch, and the target application domain (driving, robotics, open-world games).'
  - 'Trend evolution: Evidence from 2024–2026 shows a shift from static benchmark-based
    evaluation toward interactive, real-time, and closed-loop simulation systems,
    with increasing emphasis on action fidelity, long-horizon consistency, and zero-shot
    generalization.'
  - 'Open questions: How well these systems generalize across unseen environments,
    sensor configurations, and downstream tasks; whether the trade-off between visual
    fidelity and physical accuracy can be mitigated; and how to ensure reproducibility
    and deployment readiness outside the original research labs.'
  related_work_outline_zh:
  - 主流方向：构建作为具身智能视频模拟器的世界模型，重点关注自动驾驶和机器人领域中的动作可控生成、物理合理性和闭环评估。
  - 研究共性：研究者采用视频生成模型（扩散或自回归），并以动作、上下文或物理先验为条件；然后通过保真度指标和下游任务性能验证生成的视频，通常同时发布数据集和基准。
  - 关键差异：方法在世界模型骨干（Dreamer式潜在模型 vs. 扩散变换器）、显式物理监督与隐式学习、利用预训练视频模型与从零训练、以及目标应用领域（驾驶、机器人、开放世界游戏）上存在差异。
  - 趋势演进：2024–2026年的证据显示，研究正从静态基准评估转向交互式、实时和闭环仿真系统，越来越强调动作保真度、长时域一致性和零样本泛化。
  - 开放问题：这些系统在未知环境、传感器配置和下游任务上的泛化能力；视觉保真度与物理准确性之间的权衡能否缓解；以及如何确保在原研究实验室之外的可复现性和部署就绪性。
  literature_review:
    line_of_work_matrix:
    - line: Physics-informed embodied world models
      what_it_solves: Generates visually and physically plausible video of robotic
        manipulation by jointly learning RGB synthesis and physics knowledge (e.g.,
        temporal depth, keypoint dynamics).
      what_remains_open: Closed-loop policy training on real robots and validation
        of physical plausibility beyond visual metrics.
    - line: Action-controllable world models for autonomous driving
      what_it_solves: Produces high-fidelity, multi-view driving video conditioned
        on ego-vehicle actions, supporting closed-loop simulation and policy evaluation
        with low-latency inference.
      what_remains_open: Generalization to diverse sensor setups and driving environments;
        degradation in long-horizon autoregressive rollouts under out-of-distribution
        actions.
    - line: Contextual world models for zero-shot generalization
      what_it_solves: Enables policies trained in simulation to adapt to unseen dynamics
        by conditioning latent state inference on observable context variables.
      what_remains_open: Assumes observability of context; evaluated on only two tasks
        from a single benchmark suite, leaving broader generalization unverified.
    - line: Pre-trained video generators as plug-and-play world simulators
      what_it_solves: Converts existing large-scale video generation models into controllable
        world simulators via lightweight action-conditioned modules and motion-reinforced
        losses.
      what_remains_open: Inherits biases of the base pre-trained model; may sacrifice
        fine-grained visual details for dynamic consistency; applicability beyond
        games and robotics untested.
    - line: Benchmarks and artifacts for world model evaluation
      what_it_solves: Standardizes assessment of spatial consistency and action fidelity
        through dedicated datasets (LoopNav, ACT-Bench) and metrics (Scene Graph Consistency
        Score).
      what_remains_open: Lack of unified benchmarks that span multiple domains and
        interaction modes; independent reproduction across teams and infrastructure.
    consensus:
    - Video generation is the prevalent medium for building world models in embodied
      settings.
    - Action controllability is a critical requirement, with most works conditioning
      on ego-action or trajectory.
    - Evaluation combines visual fidelity metrics (FID, FVD) with downstream task
      performance or custom action-fidelity scores.
    - Open-source datasets and code are increasingly common, though full reproducibility
      across environments remains a verification gap.
    - Real-time or near-real-time inference is a stated goal, especially in driving
      and interactive applications.
    disagreements:
    - 'World model architecture: some works extend Dreamer-style latent dynamics (cRSSM),
      while others build on diffusion transformers or hybrid autoregressive-diffusion
      pipelines.'
    - 'Role of physics: some methods explicitly inject physics supervision (e.g.,
      temporal depth, keypoint dynamics), while others rely purely on data-driven
      video generation.'
    - 'Training strategy: one line trains world models from scratch on domain-specific
      data; another reuses pre-trained video generators and adapts them with lightweight
      modules.'
    - 'Interaction mode: closed-loop simulation with autoregressive rollouts is emphasized
      in driving, whereas zero-shot generalization to unseen contexts is the focus
      in contextual RL.'
    - 'Evaluation scope: works are siloed by application domain (robotics, driving,
      open-world games) with no cross-domain comparison.'
    open_questions:
    - Can world models trained in one domain (e.g., driving) be adapted to another
      (e.g., robotics) without retraining from scratch?
    - How can long-horizon consistency be maintained as the autoregressive rollout
      length increases, given that current methods show degradation?
    - What is the minimal set of physical priors needed to achieve both visual fidelity
      and physically accurate interactions, and can they be learned without explicit
      supervision?
    - How do these systems perform when deployed on real hardware with changing sensor
      configurations and compute constraints, given that evidence is limited to single
      datasets and specific GPU setups?
    - To what extent do the reported action-fidelity metrics correlate with downstream
      task success in real-world settings, and are there blind spots in current benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 通过联合学习RGB视频合成和物理知识（如时间深度、关键点动力学），生成视觉和物理上合理的机器人操作视频。
      尚未覆盖: 在真实机器人上的闭环策略训练，以及超越视觉指标的物理合理性验证。
    - 路线: 动作可控的自动驾驶世界模型
      解决的问题: 生成以自车动作为条件的高保真多视角驾驶视频，支持低延迟推理的闭环仿真和策略评估。
      尚未覆盖: 对不同传感器配置和驾驶环境的泛化；在分布外动作下长时域自回归推演的退化。
    - 路线: 面向零样本泛化的上下文世界模型
      解决的问题: 通过将潜在状态推断条件化于可观测上下文变量，使仿真中训练的策略能适应未见动力学。
      尚未覆盖: 假设上下文可观测；仅在单个基准套件的两个任务上评估，更广泛的泛化尚未验证。
    - 路线: 将预训练视频生成器转为即插即用的世界模拟器
      解决的问题: 通过轻量级动作条件模块和运动增强损失，将现有大规模视频生成模型转化为可控世界模拟器。
      尚未覆盖: 继承基础预训练模型的偏见；可能为动态一致性牺牲细粒度视觉细节；在游戏和机器人之外的适用性未测试。
    - 路线: 面向世界模型评估的基准与工件
      解决的问题: 通过专用数据集（LoopNav、ACT-Bench）和指标（场景图一致性分数）标准化空间一致性和动作保真度的评估。
      尚未覆盖: 缺乏跨域和多交互模式的统一基准；跨团队和基础设施的独立复现。
    共识:
    - 视频生成是具身场景中构建世界模型的主流媒介。
    - 动作可控性是关键需求，大多数工作以自车动作或轨迹为条件。
    - 评估结合视觉保真度指标（FID、FVD）与下游任务性能或自定义动作保真度分数。
    - 开源数据集和代码日益普遍，但跨环境的完全可复现性仍是验证缺口。
    - 实时或近实时推理是明确目标，尤其在驾驶和交互应用中。
    分歧:
    - 世界模型架构：一些工作扩展Dreamer式潜在动力学（cRSSM），另一些则基于扩散变换器或混合自回归-扩散流水线。
    - 物理的角色：一些方法显式注入物理监督（如时间深度、关键点动力学），另一些则完全依赖数据驱动的视频生成。
    - 训练策略：一种路线在领域特定数据上从零训练世界模型；另一种重用预训练视频生成器并用轻量模块适配。
    - 交互模式：驾驶领域强调具有自回归推演的闭环仿真，而上下文强化学习则聚焦于向未见上下文的零样本泛化。
    - 评估范围：工作按应用领域（机器人、驾驶、开放世界游戏）隔离，缺乏跨域比较。
    开放问题:
    - 在一个领域（如驾驶）训练的世界模型能否在不重新训练的情况下适应另一个领域（如机器人）？
    - 随着自回归推演长度增加，如何保持长时域一致性，当前方法已显示退化？
    - 实现视觉保真度和物理准确交互所需的最小物理先验集合是什么，能否在无显式监督下学习？
    - 鉴于证据仅限于单一数据集和特定GPU设置，这些系统在传感器配置和计算约束变化的真实硬件上部署时表现如何？
    - 报告的动作保真度指标与真实环境中下游任务成功率的相关性如何，当前基准是否存在盲点？
