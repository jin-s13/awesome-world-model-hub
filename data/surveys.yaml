  related_work_outline:
  - 'Mainstream direction: World models are rapidly moving from game and simulation
    benchmarks into embodied tasks such as robotics and autonomous driving, with diffusion
    transformers and unified video-action architectures becoming the dominant generative
    backbones.'
  - 'Shared research pattern: Most works adopt video generation as the core world
    model framework, jointly learn dynamics with auxiliary tasks (mask reconstruction,
    physical knowledge, action prediction), and evaluate on visual fidelity, downstream
    policy performance, or newly proposed consistency benchmarks.'
  - 'Key differences: Methods diverge in supervision signals (mask reconstruction,
    context conditioning, language parsing, physical priors), evaluation targets (video
    quality vs. policy return vs. memory/action consistency), and interaction mode
    (open-loop prediction vs. closed-loop control).'
  - 'Trend evolution: From 2018–2023 Atari and simple RL environments, the focus shifted
    to large-scale robot pre-training and multi-view driving simulation in 2024–2025,
    while 2025–2026 introduces benchmarks for spatial, memory, and action consistency,
    indicating a move toward holistic evaluation.'
  - 'Open questions: Real-world deployment validation is missing; long-term memory
    and spatial consistency remain unsolved; cross-domain transfer between driving,
    robotics, and games is unexplored; balancing physical plausibility and visual
    generation quality is unclear; and the generalization limits of pre-training across
    diverse embodiments are unknown.'
  related_work_outline_zh:
  - 主流方向：世界模型正从游戏和仿真基准快速转向机器人、自动驾驶等具身任务，扩散Transformer和视频-动作统一架构成为主流生成骨干。
  - 研究共性：多数工作以视频生成作为世界模型核心框架，通过掩码重建、物理知识、动作预测等辅助任务联合学习动力学，并在视觉保真度、下游策略性能或一致性基准上评测。
  - 关键差异：方法在监督信号（掩码重建、上下文条件、语言解析、物理先验）、评测目标（视频质量、策略回报、记忆/动作一致性）和交互模式（开环预测 vs 闭环控制）上存在分歧。
  - 趋势演进：从2018–2023年Atari等简单环境，到2024–2025年大规模机器人预训练和多视角驾驶仿真，2025–2026年出现空间、记忆和动作一致性基准，表明向全面评估演进。
  - 开放问题：缺乏真实世界部署验证；长期记忆与空间一致性未解决；驾驶、机器人、游戏间的跨域迁移未探索；物理合理性与视觉生成质量的平衡不清楚；跨不同本体的大规模预训练泛化边界未知。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and continuous control tasks,
        learning domain-specific states, actions, and physical constraints to support
        policy training or planning via video generation.
      what_remains_open: Whether improvements transfer across embodiments, datasets,
        or simulation-to-real gaps; generalization to novel object combinations or
        dynamics outside training distributions; reliance on observable context values.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon scene prediction
        and closed-loop simulation in driving, enabling perception and policy evaluation.
      what_remains_open: Alignment between simulation gains and real-world safety
        or operational outcomes; generalization to extreme long-tail scenarios and
        complex interactions.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in game or open-world environments to
        generate action-conditioned future frames and evaluate memory consistency
        and action control.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change; maintaining long-term memory consistency; cross-action-space generalization;
        transfer from simple games to complex open worlds.
    consensus:
    - World model application is shifting from traditional game benchmarks to embodied
      domains, with diffusion models becoming the mainstream generative architecture.
    - Video generation serves as the core framework, often jointly learned with action
      or physical knowledge to improve downstream task performance.
    - Benchmarks are emerging to evaluate capabilities beyond pixel-level fidelity,
      such as spatial consistency, memory consistency, and action controllability.
    disagreements:
    - 'Supervision signals vary widely: mask reconstruction (e.g., MaskGWM), context
      conditioning on latent states (cRSSM), language-instruction parsing (RoboDreamer),
      physical priors like depth and keypoints (RoboScape), and joint video-action
      diffusion (UWM).'
    - Evaluation targets are split between video generation quality, downstream policy
      success, and dedicated consistency metrics; no single metric dominates.
    - 'Interaction modes differ: some models are open-loop video predictors, while
      others are tightly coupled with closed-loop policy training or planning.'
    open_questions:
    - Can world models trained in simulation or on standard datasets provide reliable
      safety and robustness guarantees for real-world deployment?
    - How can long-term memory and spatial consistency (as highlighted by MIND and
      LoopNav) be achieved without sacrificing generation quality or efficiency?
    - Is it possible to build a shared world model foundation that transfers across
      driving, robotics, and gaming domains?
    - What is the optimal trade-off between enforcing physical plausibility and maintaining
      high visual fidelity and diversity?
    - Where are the generalization limits of large-scale pre-training on multi-task
      robot data compared to few-shot learning from limited interactions?
