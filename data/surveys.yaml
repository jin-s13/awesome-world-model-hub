    - 评测目标不同：Atari人类归一化表现、驾驶多视角长程预测、机器人视频规划以及自定义记忆/动作基准不可直接比较。
    - 交互设置不同：闭环动作条件生成、大规模离线预训练和仿真机器人执行的使用不一致，限制跨论文结论。
    开放问题:
    - 视频保真度或基准一致性的提升能否转化为更安全有效的真实驾驶或机器人行为？
    - 世界模型如何在无需任务特定假设的情况下，泛化到不可观测上下文、新指令原语、未见物理交互或新动作空间？
    - 能否在不局限于单一基准或场景分布的情况下，改善长期记忆一致性和跨动作可控性？
    - 哪些评测证据能把世界模型的梦境或合成推演与下游策略质量和部署鲁棒性连接起来？
