      尚未覆盖: 跨本体和数据集迁移；真实世界验证；对全新原语的组合泛化；复杂交互中（如可变形物体、接触）物理模型的保真度。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用扩散Transformer和掩码重建实现泛化驾驶视频预测，支持长时域和多视角，服务于场景仿真。
      尚未覆盖: 仿真增益与真实安全或运营指标的对齐；对未见驾驶场景的泛化；超越开环视频预测的闭环决策评估。
    - 路线: 交互式智能体与游戏
      解决的问题: 在Atari和Minecraft中构建高效世界模型以进行策略学习，并通过基于循环导航的基准评估空间一致性。
      尚未覆盖: 从游戏环境到真实任务的迁移；环境规则或目标变化时的鲁棒性；空间一致性指标与下游策略性能的关联。
    共识:
