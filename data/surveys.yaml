  related_work_outline:
  - 'Mainstream direction: Application-specific generative world models for driving,
    robotics, and interactive control, with recent work centered on video/action diffusion
    and transformer predictors rather than only compact latent dynamics.'
  - 'Shared research pattern: Domain video or interaction data is used with action,
    language, or goal conditioning plus auxiliary self-supervised losses such as masking,
    depth, keypoints, or video-action coupling.'
  - 'Key differences: Branches emphasize sample-efficient latent reinforcement learning,
    high-fidelity video simulation, or benchmark-driven consistency evaluation; supervision
    signals and evaluation datasets vary widely.'
  - 'Trend evolution: Within 2023-2026, the field moved from efficient Atari/contextual
    reinforcement learning toward compositional robot imagination, unified video-action
    pretraining, physics-informed embodied models, and memory/action benchmarks.'
  - 'Open questions: Real-world transfer, long-horizon memory and action consistency,
    unseen primitives or contexts, and simulation-to-deployment validity remain unresolved;
    some papers omit limitation and baseline details.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互控制的领域专用世界模型，重心从紧凑潜在动力学转向视频/动作扩散与Transformer预测器。
  - 研究共性：利用领域视频或交互数据，以动作、语言或目标为条件，并加入掩码、深度、关键点或视频-动作耦合等自监督辅助损失。
  - 关键差异：有的侧重样本高效的潜在强化学习，有的侧重高保真视频模拟，有的侧重一致性基准；监督信号与评测数据集差异明显。
  - 趋势演进：2023至2026年间从Atari/上下文强化学习，逐步走向组合式机器人想象、统一视频-动作预训练、物理信息具身模型和记忆/动作基准。
  - 开放问题：真实世界迁移、长期记忆与动作一致性、未见原语/上下文以及从仿真到部署的有效性仍未解决；部分论文缺少局限性和基线细节。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to concrete task domains by conditioning
        latent dynamics or video generation on context, instructions, goals, and robot
        actions.
      what_remains_open: Transfer across embodiments, datasets, and physical environments;
        support for unobserved context and entirely novel primitives; real-robot evidence
        beyond simulation.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Predicts multi-view, long-horizon driving scenes and enables
        zero-shot evaluation across driving datasets with improved fidelity.
      what_remains_open: Whether simulator and dataset gains align with real-world
        driving safety or operational outcomes; broader real deployment evidence.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in game and open-domain interactive environments
        for sample-efficient policies, loop-consistent navigation, memory, and action
        control evaluation.
      what_remains_open: Generalization under changing environment rules, goals, viewpoints,
        or action spaces; long-term memory consistency beyond current video benchmarks.
    consensus:
    - World models are increasingly formulated as generative sequence or diffusion
      models over future video and actions, rather than solely as latent state predictors.
    - Action, language, or goal conditioning is central for task-domain control; future
      observation prediction alone is treated as insufficient.
    - Auxiliary self-supervised tasks such as mask reconstruction, temporal depth,
      keypoint dynamics, and video-action coupling are used to improve consistency
      or physical plausibility.
    - Evaluation is expanding from single-scene fidelity to long-horizon, multi-view,
      memory, spatial consistency, and action-control criteria.
    - Public artifacts such as datasets, code, and baseline comparisons appear, but
      limitation reporting and negative results are sparse.
    disagreements:
    - 'Representation choice: compact latent transformer/state-space models for sample-efficient
      RL versus high-dimensional diffusion video generation for simulation fidelity.'
    - 'Supervision: pure observation or action prediction versus language-primitive
      decomposition, physics knowledge, context conditioning, or unified video-action
      objectives.'
    - 'Evaluation target: game benchmarks and normalized human scores versus driving
      datasets, robot manipulation data, or navigation/open-domain video benchmarks.'
    - 'Interaction mode: closed-loop action-conditioned rollouts and loop navigation
      versus open-loop future video generation; some models jointly diffuse actions
      and video, others separate them.'
    - 'Deployment setting: most evidence is simulation and benchmark based; real-robot
      or real-driving validation is absent or not reported.'
    open_questions:
    - Do improvements on domain-specific video and benchmark metrics transfer to real-world
      driving safety, robot policy execution, and physical interaction?
    - Can current architectures maintain long-horizon memory, spatial consistency,
      and action control across loop closure and unseen action spaces?
    - How should context, physics, or language decomposition be represented when relevant
      variables are unobserved or when novel primitives and tasks appear?
    - Are visual fidelity and consistency metrics sufficient proxies for closed-loop
      control quality and downstream policy performance?
    - What verification gaps arise from missing limitation, baseline, dataset, or
      code details in current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等具体任务，利用上下文、指令、目标或动作条件改善组合与零样本泛化。
      尚未覆盖: 跨本体、数据集和物理环境的迁移；未观测上下文与全新原语支持；仿真之外的真实机器人证据不足。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 进行多视角、长时域驾驶场景预测和跨数据集零样本验证，提升驾驶世界模型的生成质量。
      尚未覆盖: 仿真与数据集收益能否对齐真实驾驶安全与运营结果；真实部署证据仍有限。
    - 路线: 交互式智能体与游戏
      解决的问题: 在游戏和开放域交互环境中学习样本高效策略，并评估回环导航、记忆一致性与动作控制。
      尚未覆盖: 环境规则、目标、视角或动作空间变化时的泛化；长期记忆一致性仍未解决。
    共识:
    - 世界模型正从潜在状态预测转向面向未来视频与动作的生成式序列或扩散建模。
    - 动作、语言或目标条件对任务域控制很关键，仅预测未来观测被认为不够。
    - 常引入掩码重建、时间深度、关键点动力学、视频-动作耦合等辅助自监督任务。
    - 评估从单场景保真度扩展到长时域、多视角、记忆、空间一致性和动作控制。
    - 数据集、代码和基线比较有所公开，但局限性与负面结果披露不足。
    分歧:
    - 表示方式：紧凑潜在Transformer/状态空间模型用于样本高效强化学习，与高维扩散视频生成用于仿真保真度存在分歧。
    - 监督信号：纯观测或动作预测，与语言原语分解、物理知识、上下文条件或统一视频-动作目标不同。
    - 评测目标：游戏基准与归一化人类分数，对驾驶数据集、机器人操作数据或导航/开放域视频基准。
    - 交互模式：闭环动作条件回放与回环导航，对开环未来视频生成；动作与视频是否联合建模也有差异。
    - 部署场景：多数证据来自仿真和基准，真实机器人或真实驾驶验证缺失或未报告。
    开放问题:
    - 领域视频与基准指标上的改进能否迁移到真实驾驶安全、机器人策略执行和物理交互？
    - 现有架构能否在回环、未见动作空间和视角变化下保持长期记忆与动作控制？
    - 当相关上下文、物理量不可观测或出现新原语/新任务时，应如何表示与学习？
    - 视觉保真度与一致性指标是否足以代理闭环控制质量和下游策略性能？
    - 当前证据中缺失的局限性、基线、数据集或代码细节会造成哪些验证缺口？
