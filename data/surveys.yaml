  related_work_outline:
  - 'Mainstream direction: Building world models for domain-specific applications,
    especially robotics and autonomous driving, by learning video dynamics and action-conditioned
    prediction, with a recent shift toward coupling generation with physical consistency
    and pretraining on large-scale datasets.'
  - 'Shared research pattern: World models are trained to predict future observations
    from past frames and actions, then used for policy learning, planning, or evaluation;
    most works adopt some form of autoencoding or diffusion with temporal modeling,
    and demonstrate improvements through application-specific benchmarks.'
  - 'Key differences: The choice of generative backbone (Diffusion Transformer vs.
    stochastic RNN vs. unified video-action diffusion), the type of conditioning (language,
    context, depth, keypoints), and the target domain (driving, Atari, Minecraft,
    robot manipulation) lead to distinct evaluation protocols and generalization claims.'
  - 'Trend evolution: The field is moving from game-simulator agents (Atari, Minecraft)
    to more complex embodied tasks and driving, with increasing emphasis on physical
    plausibility, compositional generalization, and unified architectures that handle
    multiple modalities. Recent years show a rise in diagnostic benchmarks focusing
    on memory and spatial consistency.'
  - 'Open questions: Whether simulation-based gains translate to real-world safety
    and robustness; how to maintain long-term memory and physical consistency across
    diverse environments; and how to verify generalization when actions, dynamics,
    or embodiment change.'
  related_work_outline_zh:
  - 主流方向：构建面向特定领域（尤其是机器人和自动驾驶）的世界模型，通过视频动力学和动作条件预测学习，近期趋向于将生成与物理一致性及大规模数据集预训练相结合。
  - 研究共性：世界模型从过去帧和动作预测未来观测，然后用于策略学习、规划或评估；多数工作采用某种形式的自编码或扩散与时序建模，并通过应用相关基准展示改进。
  - 关键差异：生成骨干（扩散Transformer、随机RNN、统一视频-动作扩散）、条件类型（语言、上下文、深度、关键点）以及目标领域（驾驶、Atari、Minecraft、机器人操作）的不同，导致不同的评估协议和泛化主张。
  - 趋势演进：从游戏智能体环境（Atari、Minecraft）向更复杂的具身任务和驾驶拓展，越来越强调物理合理性、组合泛化以及处理多模态的统一架构。近年出现专注于记忆和空间一致性的诊断基准。
  - 开放问题：仿真收益能否转化为真实世界的安全性和鲁棒性；如何在多样化环境中保持长期记忆和物理一致性；当动作、动力学或本体发生变化时如何验证泛化性。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and reinforcement learning
        tasks by incorporating context, language instructions, or physical priors
        for policy learning and video plan generation.
      what_remains_open: Generalization beyond training primitives or contexts (e.g.,
        cRSSM limited to two CARL tasks, RoboDreamer to seen primitives), sim-to-real
        transfer, and reliance on observable context or accurate parsing.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon video prediction
        in driving scenarios, with mask reconstruction to improve generalization and
        zero-shot cross-dataset transfer.
      what_remains_open: Alignment between video prediction quality and safety-critical
        operational outcomes; evidence from real-world deployment is missing.
    - line: Interactive agents and games
      what_it_solves: Efficient world model training for agent control in visual environments
        (Atari, Minecraft) and benchmarking of spatial consistency and memory.
      what_remains_open: Long-term memory consistency and cross-action-space generalization
        remain challenging; current benchmarks (LoopNav, MIND) highlight that existing
        models struggle with these aspects, but no model solution is provided in the
        benchmark papers.
    consensus:
    - World models are increasingly built as video generation systems conditioned
      on actions or instructions, evaluated on their ability to produce plausible
      future frames.
    - Pretraining on large and diverse datasets (e.g., OpenDV-2K, RT-X, multiple robotic
      scenes) is a common strategy to improve generalization, though the datasets
      and domains differ.
    - Physical consistency and geometric constraints (depth, keypoints) are emerging
      as important auxiliary signals to improve generation quality and plausibility.
    - Benchmarks are shifting from purely visual fidelity to diagnostic measures of
      memory, consistency, and action controllability, revealing limitations in current
      models.
    disagreements:
    - 'Representation: Some models use stochastic latent states (cRSSM, STORM) while
      others rely on diffusion in pixel space (MaskGWM, UWM, RoboDreamer).'
    - 'Supervision: Methods differ in their use of conditioning—language parsing into
      primitives (RoboDreamer), explicit physical knowledge (RoboScape), context variables
      (cRSSM), or purely action-labeled video (MaskGWM, STORM).'
    - 'Evaluation target: Driving works emphasize multi-view and zero-shot cross-dataset
      validation; robotics works test policy learning or video plan execution in simulation;
      game-oriented works focus on sample efficiency and human-normalized scores;
      diagnostic benchmarks (LoopNav, MIND) isolate spatial consistency and memory
      without a downstream task.'
    - 'Interaction mode: UWM couples video and action diffusion for bidirectional
      prediction, while others separate world model learning from policy training
      or use the model only for forward simulation.'
    open_questions:
    - Can the improved long-horizon and multi-view generation in driving world models
      be validated with real-world safety metrics, or do they remain purely visual
      advances?
    - How do compositional world models scale to completely novel instructions or
      object combinations not seen in training, beyond recombining known primitives?
    - What is the minimal set of physical or structural priors (depth, keypoints,
      scene graphs) needed to guarantee memory consistency and action controllability
      across varied environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人学和强化学习任务中，通过引入上下文、语言指令或物理先验来实现策略学习与视频计划生成。
      尚未覆盖: 对训练原语或上下文之外的泛化（如cRSSM仅处理两个CARL任务，RoboDreamer限于已知原语组合），仿真到真实世界的迁移，以及依赖可观测上下文或准确解析的假设。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行驾驶场景中的多视角、长时域视频预测，并通过掩码重建提升泛化性和零样本跨数据集迁移。
      尚未覆盖: 视频预测质量与安全关键运营结果之间的对应关系，缺少真实部署的证据。
    - 路线: 交互式智能体与游戏
      解决的问题: 在视觉环境（Atari、Minecraft）中高效训练世界模型以控制智能体，并对空间一致性和记忆进行基准评测。
      尚未覆盖: 长期记忆一致性和跨动作空间泛化仍具挑战；当前基准（LoopNav、MIND）揭示了现有模型在这些方面的不足，但基准论文未提供模型解决方案。
    共识:
    - 世界模型越来越多地被构建为以动作或指令为条件的视频生成系统，并通过其生成未来帧的合理性进行评估。
    - 在大规模多样化数据集（如OpenDV-2K、RT-X、多机器人场景）上预训练是提升泛化性的常用策略，但数据集和领域存在差异。
    - 物理一致性和几何约束（深度、关键点）正成为提升生成质量与合理性的重要辅助信号。
    - 基准测试正从纯视觉保真度转向对记忆、一致性和动作可控性的诊断性度量，揭示了当前模型的局限。
    分歧:
    - 表示方式：部分模型使用随机潜在状态（cRSSM、STORM），另一些依赖像素空间的扩散（MaskGWM、UWM、RoboDreamer）。
    - 监督信号：方法在条件使用上存在差异——基于语言解析的原语（RoboDreamer）、显式物理知识（RoboScape）、上下文变量（cRSSM）或纯动作标注视频（MaskGWM、STORM）。
    - 评测目标：驾驶工作强调多视角和零样本跨数据集验证；机器人工作测试仿真中的策略学习或视频计划执行；游戏方向关注样本效率和人类标准化得分；诊断基准（LoopNav、MIND）则独立评估空间一致性与记忆，而不涉及下游任务。
    - 交互模式：UWM耦合视频与动作扩散以实现双向预测，其他方法则将世界模型学习与策略训练分离，或仅将模型用于前向仿真。
    开放问题:
    - 驾驶世界模型在长时域和多视角生成上的改进能否通过真实安全指标得到验证，还是仅停留在视觉层面？
    - 组合式世界模型如何扩展到训练中未见过的全新指令或物体组合，而不仅仅是已知原语的重新组合？
    - 在多样化环境中保证记忆一致性和动作可控性，最少需要何种物理或结构先验（深度、关键点、场景图）？
