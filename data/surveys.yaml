  related_work_outline:
  - 'Mainstream direction: Generative video-diffusion and transformer world models
    tailored to robotics and driving, plus emerging benchmarks for spatial or memory
    consistency and action control, dominate the application frontier.'
  - 'Shared research pattern: Most works learn a world model from high-dimensional
    observations and actions, condition it on language, context, or physics cues,
    and evaluate through generation fidelity, policy learning, or closed-loop control.'
  - 'Key differences: Studies split between driving scene prediction, robot policy/video
    learning, sample-efficient game/control modeling, and benchmark construction;
    representations and supervision vary from recurrent state-space and VAE-Transformer
    to diffusion transformers with mask, physics, context, or action-video objectives.'
  - 'Trend evolution: Within the 2023-2026 frontier, the focus shifts from efficient
    RL world models toward multimodal robot pretraining, physics-informed generation,
    long-horizon driving prediction, and open-domain consistency benchmarks.'
  - 'Open questions: Cross-embodiment transfer, simulator-to-real safety alignment,
    generalization beyond seen primitives/contexts/action spaces, and long-term memory
    or spatial consistency remain unresolved and underevaluated.'
  related_work_outline_zh:
  - 主流方向：面向机器人和驾驶的生成式视频扩散与Transformer世界模型，以及用于空间/记忆一致性和动作控制的评测基准，构成应用前沿。
  - 研究共性：多数工作从高维观测和动作中学习世界模型，并用语言、上下文或物理线索作为条件，通过生成保真度、策略学习或闭环控制进行评估。
  - 关键差异：研究分为驾驶场景预测、机器人策略与视频学习、样本高效游戏/控制建模和基准构建；表示与监督包括循环状态空间、VAE-Transformer、扩散Transformer，以及掩码、物理、上下文或视频-动作目标。
  - 趋势演进：在2023-2026前沿内，重心从高效强化学习世界模型转向多模态机器人预训练、物理感知生成、长时域驾驶预测和开放领域一致性基准。
  - 开放问题：跨本体迁移、仿真到真实安全对齐、超出已见原语/上下文/动作空间的泛化，以及长期记忆和空间一致性仍未解决且评估不足。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models
      what_it_solves: Generating robot video plans and pretraining policy or dynamics
        models from visual and action data.
      what_remains_open: Whether simulation or lab results transfer to real robots,
        and whether unseen objects, actions, and embodiment combinations are covered.
    - line: Autonomous driving and simulation
      what_it_solves: Multi-view and long-horizon scene prediction for driving simulation
        and policy evaluation.
      what_remains_open: Alignment between simulator or video prediction gains and
        real-world driving safety or operational outcomes remains uncertain.
    - line: Interactive agents and game/control worlds
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        in interactive control or contextual reinforcement learning environments.
      what_remains_open: Generalization when context values, environment rules, goals,
        or task distributions change beyond the evaluated settings.
    - line: Consistency and control evaluation
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control in open-ended or navigation-style world model outputs.
      what_remains_open: How benchmark scores connect to downstream task utility,
        broader scene diversity, and unified evaluation metrics remains unclear.
    consensus:
    - World models in applications are typically learned from high-dimensional observations
      and actions as generative dynamics or video predictors.
    - Language instructions, context variables, physics signals, or action conditions
      are used to improve fidelity, controllability, or generalization.
    - Diffusion transformers and stochastic or variational sequence models are common
      architectures across robot, driving, and game applications.
    - Evaluation increasingly combines visual quality, physical plausibility, action
      controllability, closed-loop behavior, and downstream policy utility.
    disagreements:
    - 'Representation choices differ: recurrent state-space models, VAE-Transformer
      models, and diffusion transformers are used across application domains.'
    - 'Supervision signals differ: mask reconstruction, contextual conditioning, physics
      auxiliary tasks, and action-video joint diffusion are emphasized by different
      lines of work.'
    - 'Evaluation targets differ: visual fidelity, physical plausibility, sample efficiency,
      policy execution, memory or spatial consistency, and real deployment safety
      are not treated equally across studies.'
    - 'Deployment settings differ: driving, robot manipulation, game/control tasks,
      and open-domain evaluation place distinct closed-loop and data-distribution
      demands on world models.'
    open_questions:
    - Can improvements transfer across embodiments, datasets, institutions, or physical
      environments?
    - Do simulator or video-generation metrics translate into improved real-world
      driving safety and robot operation success?
    - Can models generalize to novel primitive combinations, unobserved context values,
      unseen action spaces, or changing environment rules?
    - How can open-domain world models maintain long-term memory consistency and cross-view
      spatial consistency beyond current benchmark scenes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人世界模型
      解决的问题: 利用视觉和动作数据生成机器人视频计划，并预训练策略或动力学模型。
      尚未覆盖: 仿真或实验室结果能否迁移到真实机器人，以及未见物体、动作和本体组合是否被覆盖仍缺少证据。
    - 路线: 自动驾驶与仿真
      解决的问题: 面向驾驶场景进行多视角、长时域预测，并用于仿真和策略评测。
      尚未覆盖: 仿真或视频预测收益与真实驾驶安全或运营结果之间是否一致仍不清楚。
    - 路线: 交互式智能体与游戏/控制
      解决的问题: 在交互式控制或上下文强化学习环境中提升样本效率和零样本泛化能力。
      尚未覆盖: 上下文值、环境规则、目标或任务分布变化时的泛化表现尚未充分验证。
    - 路线: 一致性与控制评测
      解决的问题: 在开放世界或导航式输出中测量空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 基准分数与下游任务效用之间的关系，以及更广泛场景和统一评测指标仍不明确。
    共识:
    - 应用中的世界模型通常从高维观测和动作中学习生成式动力学或视频预测能力。
    - 语言指令、上下文变量、物理信号或动作条件被用于提升保真度、可控性或泛化能力。
    - 扩散Transformer与随机或变分序列模型在机器人、驾驶和游戏应用中较为常见。
    - 评估开始同时关注视觉质量、物理合理性、动作可控性、闭环行为和下游策略效用。
    分歧:
    - 表示方式不同：循环状态空间模型、VAE-Transformer模型和扩散Transformer在不同应用路线中并存。
    - 监督信号不同：掩码重建、上下文条件、物理辅助任务和动作-视频联合扩散各有侧重。
    - 评测目标不同：视觉保真度、物理合理性、样本效率、策略执行、记忆或空间一致性以及真实部署安全未被同等强调。
    - 部署场景不同：驾驶、机器人操作、游戏/控制任务与开放领域评测在数据分布和闭环要求上差异明显。
    开放问题:
    - 改进能否跨本体、数据集、机构或物理环境迁移？
    - 仿真或视频生成指标能否转化为真实驾驶安全与机器人操作成功率的提升？
    - 模型能否泛化到训练中未见的新原语、未观测上下文值、新动作空间或变化的环境规则？
    - 开放领域世界模型如何在不同场景中维持长期记忆一致性和跨视角空间一致性？
