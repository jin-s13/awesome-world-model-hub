  related_work_outline_zh:
  - 主流方向：动作可控的世界模型系统与基准，用于闭环模拟，尤其聚焦自动驾驶与机器人；代表如 Terra ACT-Bench、Vista、FAR-Drive、RoboScape、Dynamic
