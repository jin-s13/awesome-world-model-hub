  related_work_outline_zh:
  - 主流方向：综述与分类法论文近期聚焦世界模型，覆盖视频生成、交互控制、具身机器人和自动驾驶，组织碎片化方法、基准与路线图。
  - 研究共性：通过区分表示、生成机制、评测设置和应用场景来建立概念框架，并梳理可控性、长时一致性与实时交互等挑战。
  - 关键差异：范围从通用视频世界模拟器到自动驾驶潜在模型；部分强调基准对比，部分强调分类或路线图；方法类论文补充实证机器人学习或视频生成证据。
  - 趋势演进：从2022年物理机器人世界模型学习，到2024年围绕Sora的综述与组合生成，再到2025年多模态自我中心数据，以及2026年交互、开源、视线外动态和自动驾驶评估框架，处于当前前沿。
  - 开放问题：分类法是否由系统证据支撑，各基准在不同设置下是否可比，哪些缺口应优先解决，以及综述框架如何转化为经验证的真实世界系统。
  literature_review:
    line_of_work_matrix:
    - line: Survey and taxonomy synthesis for generative and interactive world models
      what_it_solves: Maps fragmented video-generation, interactive-control, and embodied
        world-model work into application scenarios, design dimensions, technical
        challenges, and future roadmaps.
      what_remains_open: Systematic selection criteria and evidence coverage are often
        not reported, so comprehensiveness claims remain difficult to verify.
    - line: Benchmark and evaluation comparison across world-model applications
      what_it_solves: Compares benchmark tasks, metrics, and evaluation settings across
        open-world exploration, game engines, autonomous driving, and robotics to
        reveal how evaluation choices shape conclusions.
      what_remains_open: Compatibility of results across different data modalities,
        closed-loop protocols, and resource constraints remains unresolved.
    - line: Application-specific latent-space framework construction
      what_it_solves: Unifies latent representations, structural priors, and internal
        mechanics for a specific deployment setting such as automated driving world
        models.
      what_remains_open: Proposed frameworks remain largely conceptual and lack empirical
        validation or implemented metrics to test their claims.
    - line: Open problem and gap mapping for world-model research
      what_it_solves: Turns broad literature coverage into concrete next research
        questions around action-conditioned controllability, long-horizon memory,
        real-time interactivity, and out-of-sight dynamics.
      what_remains_open: Prioritization of which gaps most improve downstream robot
        or driving outcomes is not yet established with evidence.
    consensus:
    - World models are treated as a unifying construct for video generation, embodied
      control, and autonomous driving rather than as isolated application-specific
      models.
    - Controllability, long-horizon temporal consistency, and real-time interactivity
      are recurring challenges across surveys and method papers.
    - Evaluation must move beyond visual fidelity to include action-conditioned control,
      closed-loop dynamics, and resource-aware inference.
    - Open-source artifacts, public datasets, and benchmarks are seen as important
      for reproducibility, though their presence is uneven.
    disagreements:
    - 'Scope differs: some syntheses cover general generative world simulators, while
      others focus on a single deployment setting such as automated driving or physical
      robot learning.'
    - 'Evaluation emphasis differs: some works compare existing benchmarks and metrics,
      while others propose conceptual taxonomies or evaluation prescriptions without
      empirical testing.'
    - 'Representation choices differ: latent continuous states, discrete tokens, or
      compositional primitives are used, with different assumptions about generalization
      and controllability.'
    - 'Evidence type differs: method papers provide empirical video-generation or
      robot-learning results, whereas survey papers present conceptual synthesis and
      often lack new experiments.'
    open_questions:
    - Are the taxonomies and roadmaps grounded in systematic literature search criteria,
      or do they rely on selective representative examples?
    - Can benchmark results be compared across different datasets, closed-loop protocols,
      and resource budgets without hiding evaluation incompatibilities?
    - Which open problems—controllability, long-horizon memory, real-time interactivity,
      or out-of-sight dynamics—should be prioritized for downstream task improvement?
    - Do survey-proposed evaluation frameworks and latent-space taxonomies translate
      into validated systems when implemented with public code and datasets?
    - What evidence would show that compositional or latent world models generalize
      beyond combinations seen during training or within simulation-only settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式与交互式世界模型的综述和分类体系综合
      解决的问题: 将碎片化的视频生成、交互控制和具身世界模型工作整理为应用场景、设计维度、技术挑战和未来路线图。
      尚未覆盖: 系统选择标准与证据覆盖常未报告，全面性主张难以验证。
    - 路线: 面向世界模型应用的基准与评测对比
      解决的问题: 比较开放世界、游戏引擎、自动驾驶和机器人领域的基准任务、指标与设置，揭示评测选择如何影响结论。
      尚未覆盖: 不同数据模态、闭环协议和资源约束下的结果兼容性仍未解决。
    - 路线: 面向应用的潜在空间框架构建
      解决的问题: 用潜在表示、结构先验和内部机制统一特定部署场景，如自动驾驶世界模型。
      尚未覆盖: 框架多为理论性，缺少实证验证和已实现的指标体系。
    - 路线: 世界模型研究的开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为动作条件可控性、长时记忆、实时交互和视线外动态等具体研究问题。
      尚未覆盖: 哪些缺口能最大程度改善下游机器人或驾驶结果，尚缺乏优先级证据。
    共识:
    - 世界模型被视为连接视频生成、具身控制和自动驾驶的统一框架，而非分离的应用专用模型。
    - 可控性、长时时间一致性和实时交互是综述与方法论文反复出现的挑战。
    - 评测不能只看视觉保真度，还需纳入动作条件控制、闭环动态和资源感知推理。
    - 开源代码、公开数据集和基准被视为可复现性的重要支撑，但现有覆盖不均衡。
    分歧:
    - 范围不同：有的综合涵盖通用生成式世界模拟器，有的聚焦自动驾驶或物理机器人等单一部署场景。
    - 评测重点不同：有的比较现有基准与指标，有的提出概念分类或评测建议但未做实证。
    - 表示选择不同：使用连续潜在状态、离散token或组合原语，对泛化和可控性的假设不同。
    - 证据类型不同：方法论文提供视频生成或机器人学习实证结果，综述论文多为概念综合且常不包含新实验。
    开放问题:
    - 分类法和路线图是否建立在系统检索标准上，还是依赖选择性代表案例？
    - 不同数据集、闭环协议和资源预算下的基准结果是否真正可比？
    - 在可控性、长时记忆、实时交互与视线外动态中，哪些开放问题应优先解决以改善下游任务？
    - 综述提出的评测框架和潜在空间分类法在公开代码与数据集上实现后，能否得到系统验证？
    - 需要哪些证据证明组合或潜在世界模型能泛化到训练见过的组合之外或仿真以外场景？
