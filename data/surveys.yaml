  related_work_outline:
  - 'Mainstream direction: Action-conditioned visual world-model evaluation is central,
    spanning driving, robotics, gaming, and open-world navigation. Recent work validates
    through video fidelity, policy return, zero-shot transfer, or explicit consistency
    benchmarks.'
  - 'Shared research pattern: Methods introduce generative or action-conditioned models
    and evaluate on established or new benchmarks; benchmark papers formalize missing
    capabilities such as spatial consistency, memory stability, and action control.'
  - 'Key differences: Evaluation targets diverge among aggregate game scores, downstream
    policy utility, visual realism, and structured consistency/control probes. Domains
    impose different action spaces, context assumptions, and supervision signals.'
  - 'Trend evolution: Top evidence concentrates in 2023–2026, so the observed shift
    is within the current frontier: from sample-efficient game agents toward embodied,
    multi-view, long-horizon, physics-aware, and cross-dataset evaluation.'
  - 'Open questions: Whether consistency metrics align with real decisions, how robust
    rankings are to compute and implementation choices, and how to scale diverse-action
    long-horizon benchmarks while retaining comparability.'
  related_work_outline_zh:
  - 主流方向：围绕驾驶、机器人和游戏推演构建动作条件视觉世界模型评测；头部工作用扩散/Transformer生成，并以视频保真度、策略收益或一致性基准验证。
  - 研究共性：方法在既有或新引入数据集上验证，指标覆盖视觉质量、控制准确度、长时域推演与零样本迁移；基准论文则将空间/记忆一致性与动作控制缺口显式化。
  - 关键差异：评测目标在总分、下游策略性能和结构化一致性/控制探针之间分化；场景从Atari/CARL扩展到驾驶、机器人、开放世界Minecraft，动作空间与上下文假设不同。
  - 趋势演进：头部证据集中在2023至2026年，观察到的演进处于当前前沿内：从样本高效Atari世界模型转向具身、开放域、多视角长时域、物理感知与跨数据集基准。
  - 开放问题：一致性指标是否对齐真实决策；排名在不同计算/实现下是否稳健；如何覆盖多元动作与长时域又保持可比性。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditional video benchmark and dataset design
      what_it_solves: Builds shared datasets and evaluation tasks that compare world
        models through action-conditional rollouts across driving, robot, and game
        environments.
      what_remains_open: Many datasets target a narrow action space or short horizon;
        coverage of long-horizon closed-loop, multi-view, and cross-domain settings
        remains incomplete.
    - line: Spatial, memory, and action-control stress testing
      what_it_solves: Replaces or complements pixel-level quality scores with consistency
        metrics such as loop closure, scene-graph consistency, memory stability, and
        action-control accuracy.
      what_remains_open: Whether these stress-test metrics align with downstream task
        success or user-relevant control quality is not yet established.
    - line: Policy-centric and sample-efficient world-model evaluation
      what_it_solves: Measures whether learned world models improve agent performance
        and generalization under limited interactions, using standardized game and
        contextual RL suites.
      what_remains_open: Rankings may depend on a small number of tasks and are not
        yet shown stable across implementations, compute budgets, or broader context
        variations.
    - line: Physics- and embodiment-aware video generation evaluation
      what_it_solves: Assesses whether generated video preserves geometric or physical
        plausibility and supports downstream robotic policy training or evaluation.
      what_remains_open: Physical plausibility is often reported through qualitative
        or ad hoc means; standardized controlled metrics and baselines are missing.
    - line: Unified action-video dynamics benchmark baselines
      what_it_solves: Provides single frameworks that can represent policy, forward/inverse
        dynamics, and video generation, enabling comparison across multimodal interaction
        modes.
      what_remains_open: Cross-topic comparability beyond collected robot datasets,
        including non-robot and open-world settings, remains underexplored.
    consensus:
    - World-model benchmarking increasingly uses action-conditional video generation
      or rollouts rather than passive prediction.
    - Long-horizon and cross-dataset generalization are now treated as important failure
      modes.
    - Downstream policy learning or policy evaluation is used as a validity signal,
      not visual appearance alone.
    - There is a shared move toward open datasets and benchmarks to make claims more
      comparable, although no single setting dominates.
    disagreements:
    - 'Evaluation priority differs: some studies emphasize visual fidelity, while
      others prioritize policy return, spatial consistency, memory stability, or physical
      plausibility.'
    - 'Assessment mode differs: short single-task aggregate scores contrast with closed-loop,
      multi-view, long-horizon, or cross-dataset stress tests.'
    - 'Supervision assumptions differ: observable context values are assumed in some
      contextual RL evaluations, while other benchmarks infer context implicitly from
      pixels and actions.'
    - 'Deployment domains differ: driving, robotic manipulation, game environments,
      and open-world navigation impose different action spaces and data distributions,
      making direct comparison indirect.'
    - 'Interaction granularity differs: separate action-conditional video models and
      unified action-video diffusion frameworks evaluate different targets.'
    open_questions:
    - Do current consistency and memory metrics meaningfully predict downstream driving
      or robot task success?
    - How stable are world-model rankings on standardized benchmarks under varied
      compute budgets, seeds, and implementation choices?
    - Can long-horizon multi-view and cross-action benchmarks scale without becoming
      too costly or irreproducible?
    - What evaluation target should replace aggregate visual quality for physical
      plausibility and robust action control?
    - How should zero-shot generalization be measured when target dynamics or context
      values are not observable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频基准与数据集设计
      解决的问题: 构建跨驾驶、机器人和游戏环境的动作条件推演数据集与评测任务，使世界模型主张可比较。
      尚未覆盖: 多数数据集动作空间或视界较窄；长时域闭环、多视角和跨域覆盖仍不完整。
    - 路线: 空间、记忆与动作控制压力测试
      解决的问题: 用闭环一致性、场景图一致性、记忆稳定性和动作控制准确度等指标替代或补充像素级质量分数。
      尚未覆盖: 这些压力指标是否对齐下游任务成功或用户关心的控制质量尚未证实。
    - 路线: 策略中心与样本高效世界模型评测
      解决的问题: 在有限交互下评估世界模型对智能体性能与泛化的提升，使用标准化游戏和上下文强化学习套件。
      尚未覆盖: 排名依赖少量任务，且未证明在不同实现、算力预算或更广泛上下文变化下稳定。
    - 路线: 物理与具身感知视频生成评测
      解决的问题: 检验生成视频是否保持几何或物理合理性，并支持下游机器人策略训练或评估。
      尚未覆盖: 物理合理性常通过定性或临时指标报告；缺少标准化受控指标和基线。
    - 路线: 统一动作-视频动力学基线与评测
      解决的问题: 用单一框架表示策略、前向/逆向动力学和视频生成，便于跨多模态交互模式比较。
      尚未覆盖: 除已有机器人数据集外，非机器人和开放世界设置的可比性仍未充分探讨。
    共识:
    - 世界模型评测越来越多依赖动作条件视频生成或推演，而非被动预测。
    - 长时域和跨数据集泛化被视为重要失效模式。
    - 下游策略学习或策略评估被用作有效性信号，而不仅是视觉表现。
    - 逐步采用开放数据集和基准以提高可比性，但尚无单一场景主导。
    分歧:
    - 评测优先级不同：有的强调视觉保真度，有的优先策略收益、空间一致性、记忆稳定性或物理合理性。
    - 评测模式不同：短单任务总分与闭环、多视角、长时域或跨数据集压力测试并存。
    - 监督假设不同：某些上下文强化学习评测假设上下文值可观测，另一些则从像素和动作隐式推断。
    - 部署场景不同：驾驶、机器人操作、游戏环境和开放世界导航具有不同动作空间与数据分布，比较较为间接。
    - 交互粒度不同：独立动作条件视频模型与统一动作-视频扩散框架的评测目标不一致。
    开放问题:
    - 当前一致性与记忆指标是否真正预测下游驾驶或机器人任务成功？
