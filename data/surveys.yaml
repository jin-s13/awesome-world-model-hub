  related_work_outline_zh:
  - 主流方向：构建可运行的世界模型模拟器与闭环平台，生成动作条件视频，证据集中在自动驾驶、机器人和具身导航。
  - 研究共性：将生成式视频模型与动作、上下文或物理信号结合，并通过量化基准或下游策略任务评估，而非只看视觉质量。
  - 关键差异：生成架构、监督信号、评测目标和部署领域不同，涉及潜在循环状态空间、扩散Transformer、物理信息学习和帧自回归系统。
  - 趋势演进：证据集中在2024-2026年，正从单世界模型走向交互式闭环系统、低延迟推理和基准驱动的一致性评估。
  - 开放问题：长时域一致性、跨域与传感器设置迁移、保真度与延迟权衡、部分观测上下文、以及跨团队独立复现仍有证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable video world models and closed-loop simulation
      what_it_solves: Turns generative video models into simulators that obey action,
        trajectory, or control signals for driving, robotics, and game-like policy
        training or evaluation.
      what_remains_open: Long-horizon consistency, generalization beyond training
        datasets, and the balance between action fidelity and visual fidelity are
        only partially demonstrated.
    - line: Benchmarks and datasets for world-model consistency evaluation
      what_it_solves: Creates shared datasets and quantitative metrics for spatial
        consistency, action following, and cross-model comparison in interactive settings.
      what_remains_open: Standardization across domains, independent metric validation,
        and coverage beyond limited environments such as Minecraft loops or nuScenes-style
        driving remain unclear.
    - line: Context- and physics-conditioned world modeling
      what_it_solves: Incorporates observable context or physics knowledge into latent
        dynamics to improve zero-shot generalization and physical plausibility.
      what_remains_open: Assumes context is observable, evaluates on few tasks, and
        does not yet show robust handling of partially observed or fully unknown dynamics.
    - line: Deployment-oriented real-time serving stacks
      what_it_solves: Packages simulation capabilities into runnable, low-latency
        closed-loop pipelines with code, datasets, or model artifacts.
      what_remains_open: Multi-GPU scaling, cross-hardware deployment, complex sensor
        configurations, and external real-world serving evidence are not established
        in the packet.
    consensus:
    - The sampled work converges on using video generative models as simulator substrates
      with added action, context, or physics conditioning to create controllable rollouts.
    - Papers repeatedly evaluate consistency beyond visual plausibility, especially
      spatial consistency, action following, and downstream utility for policy training
      or evaluation.
    - There is shared emphasis on open datasets, benchmarks, and artifacts, but independent
      deployment evidence remains separate from methodology claims.
    disagreements:
    - Generation architecture differs across latent recurrent state-space models,
      diffusion transformers, physics-informed joint learning, and frame-autoregressive
      rollout.
    - Supervision differs by using observable context values, paired video-action
      or trajectory data, physics-informed auxiliary tasks, or pre-trained video priors.
    - Evaluation targets differ, including zero-shot policy return, FID and FVD, action
      fidelity, spatial scene-graph consistency, and closed-loop latency.
    - Deployment settings differ across closed-loop autonomous driving, Minecraft
      navigation, robotics manipulation, and contextual control tasks.
    open_questions:
    - How can long-horizon closed-loop rollouts remain temporally and cross-view consistent
      without autoregressive compounding?
    - Can simulators trained on limited domains such as nuScenes or two CARL tasks
      transfer to unseen sensor layouts, dynamics, and interaction settings?
    - What are acceptable trade-offs among visual fidelity, action controllability,
      physical plausibility, and sub-second real-time inference?
    - Can context- or physics-conditioned approaches handle partially observed context
      instead of assuming known context values?
    - Do current open benchmarks and artifacts support independent cross-team reproduction
      and metric validation outside the original authors' environment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控视频世界模型与闭环模拟
      解决的问题: 将生成式视频模型转化为受动作、轨迹或控制信号约束的模拟器，用于驾驶、机器人和游戏策略训练或评估。
      尚未覆盖: 长时域一致性、训练数据之外的泛化，以及动作忠实度与视觉保真度之间的平衡仍未被充分验证。
    - 路线: 世界模型一致性基准与数据集
      解决的问题: 构建共享数据集和量化指标，用于衡量空间一致性、动作遵循以及跨模型比较。
      尚未覆盖: 跨领域标准化、指标独立验证，以及Minecraft循环导航或nuScenes驾驶等有限环境之外的覆盖仍不明确。
    - 路线: 上下文与物理条件化世界建模
      解决的问题: 将可观测上下文或物理知识注入潜在动力学，以改善零样本泛化和物理合理性。
      尚未覆盖: 假设上下文可观测，仅在少数任务上评估，尚未展示对部分观测或完全未知动力学的稳健处理。
    - 路线: 面向部署的实时推理与服务栈
      解决的问题: 将模拟能力封装为可运行、低延迟的闭环流水线，并提供代码、数据集或模型工件。
      尚未覆盖: 多GPU扩展、跨硬件部署、复杂传感器配置，以及外部真实环境服务证据在证据包中尚不充分。
    共识:
    - 本组证据共同把视频生成模型作为模拟器底座，通过动作、上下文或物理条件化生成可控推演。
    - 论文普遍在视觉合理性之外评估一致性，包括空间一致性、动作遵循以及下游策略训练或评估效用。
    - 多条工作强调开放数据集、基准和工件，但独立部署证据仍与方法和结果声明相互分离。
    分歧:
    - 生成架构不同，涵盖潜在循环状态空间、扩散Transformer、物理信息联合学习和帧自回归推演。
    - 监督信号不同，使用可观测上下文值、视频-动作或轨迹配对、物理信息辅助任务或预训练视频先验。
    - 评测目标不同，包括零样本策略收益、FID和FVD、动作忠实度、空间场景图一致性以及闭环延迟。
    - 部署场景不同，涉及闭环自动驾驶、Minecraft导航、机器人操作和上下文控制任务。
    开放问题:
    - 长时间闭环推演如何避免自回归误差累积，并保持时间和跨视角一致性？
    - 仅在nuScenes或两个CARL任务等有限域上训练的模拟器，能否迁移到未见传感器布局、动力学和交互设置？
    - 视觉保真度、动作可控性、物理合理性与亚秒级实时推理之间应如何取舍？
    - 当上下文部分可观测时，上下文或物理条件化方法是否仍能保持零样本泛化？
    - 现有开放基准和工件是否足以支持跨团队独立复现和指标验证？
