  related_work_outline:
  - 'Mainstream direction: The current evidence concentrates on formalizing and evaluating
    video-generation systems as action-conditioned world models for robot manipulation
    and spatial reasoning, rather than producing standalone axiomatic or scaling-law
    theory.'
  - 'Shared research pattern: Work couples observation history and actions through
    diffusion, masked autoregression, or adapters; evaluation typically combines visual
    quality with policy utility, planning utility, physical plausibility, or benchmark
    reasoning.'
  - 'Key differences: Routes differ in representation, supervision, evaluation target,
    and interaction mode: unified generative models versus frozen-model adapters;
    paired action-video pretraining versus preference/DPO alignment versus verifier
    rewards; visual fidelity versus physical realism versus spatial QA.'
  - 'Trend evolution: Available top evidence spans mainly 2024-2026 and shifts from
    scalable action-conditioned video generation toward physics alignment, zero-shot
    embodied benchmarks, mechanistic taxonomy, and test-time verification; because
    older years are sparse, only a narrow frontier trend is supported.'
  - 'Open questions: Formal guarantees connecting generated states to real dynamics,
    calibrated test-time verification, cross-domain generalization, state persistence,
    and reproducibility remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前证据集中在把视频生成系统作为动作条件世界模型进行形式化和评测，面向机器人操作与空间推理，而不是独立提出公理化或缩放规律理论。
  - 研究共性：通过扩散、掩码自回归或适配器耦合观测历史与动作；评测通常同时包含视觉质量以及策略效用、规划效用、物理合理性或基准推理。
  - 关键差异：路线在表示、监督信号、评测目标和交互方式上不同：统一生成模型与冻结模型适配器；动作-视频预训练与偏好/DPO对齐与验证器奖励；视觉保真与物理真实与空间问答。
  - 趋势演进：可用前沿证据主要集中在2024-2026，从可扩展动作条件视频生成走向物理对齐、零样本具身基准、机制分类和测试时验证；早期年份证据稀少，只能支持窄前沿趋势。
  - 开放问题：生成状态与真实动力学之间的形式保证、校准的测试时验证、跨域泛化、状态持久性与可复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative dynamics
      what_it_solves: Learns scalable joint policy and dynamics prediction from large
        robot datasets by coupling video and action diffusion or masked autoregression,
        supporting flexible forward/inverse dynamics and video generation.
      what_remains_open: Formal conditions for policy-dynamics coupling and cross-embodiment
        transfer are not established; visual metrics dominate, and some limitation
        descriptions are missing.
    - line: Frozen video diffusion adaptation
      what_it_solves: Converts pretrained video diffusion models into action-conditioned
        world models without parameter access by learning lightweight masks or action-conditioning
        modules.
      what_remains_open: Requires domain-specific action-labeled video; out-of-distribution
        behavior, closed-source model biases, and generalization beyond tested domains
        remain unverified.
    - line: Physics and preference alignment for embodied video models
      what_it_solves: Post-trains embodied video world models with multi-dimensional
        rewards or DPO-style discriminators to improve physical realism, task logic,
        embodiment plausibility, and visual quality.
      what_remains_open: Evaluations center on contact-rich manipulation; human preference
        collection is costly and subjective, and no formal physics guarantee is provided.
    - line: Mechanistic taxonomy and state/dynamics formalization
      what_it_solves: Organizes video-generation-as-world-model claims around implicit/explicit
        state construction and dynamics modeling, identifying persistence and causality
        as missing properties.
      what_remains_open: Whether the taxonomy changes model design or evaluation practice
        is not demonstrated; conceptual analysis lacks empirical validation.
    - line: Test-time verification and scaling evidence
      what_it_solves: Studies whether test-time verifiers over action-conditioned
        generated views produce reliable rewards for spatial reasoning, and introduces
        frame-anchored assertion rewards.
      what_remains_open: Verifier calibration is poor, randomized scoring can reduce
        answer entropy, and no verifier achieves consistent scaling on all benchmarks.
    consensus:
    - Video generation is treated as a substrate for world models by conditioning
      generation on history and actions to predict future states.
    - 'Evaluation is moving beyond visual fidelity toward task usefulness: planning
      consistency, physical plausibility, embodiment, or downstream reasoning.'
    - Explicit state construction is identified as a missing component for persistence
      and causality in current generative models.
    disagreements:
    - 'Representation differs: unified diffusion or masked autoregressive transformers
      versus adapters over frozen pretrained video models versus conceptual state/dynamics
      decomposition.'
    - 'Supervision differs: self-supervised paired action-video prediction versus
      human preference and DPO-style physics alignment versus heuristic or assertion-based
      test-time rewards.'
    - 'Evaluation target differs: visual quality and simulator policy correlation
      versus physical plausibility and trajectory consistency versus spatial reasoning
      benchmark accuracy.'
    - 'Interaction mode differs: closed-source model adaptation, large-scale multi-embodiment
      pretraining, and test-time view selection for reasoning imply different deployment
      assumptions.'
    open_questions:
    - Under what formal assumptions do action-conditioned video models provide valid
      policy learning, planning, and counterfactual inference?
    - Why does assertion-grounded test-time verification improve SAT-Real but fail
      to produce consistent scaling on MMSI-Bench?
    - How can state persistence and causal dynamics be guaranteed rather than only
      visually approximated?
    - Which cross-domain and cross-embodiment failures remain hidden by current manipulation
      and reasoning benchmarks?
    - What verification is needed for missing code, datasets, baselines, and limitation
      details before reproducibility claims can be confirmed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成动力学
      解决的问题: 利用大规模机器人数据联合学习策略与动力学预测，通过视频和动作扩散或掩码自回归表示正向/逆向动力学和视频生成。
      尚未覆盖: 策略-动力学耦合和跨本体迁移的形式条件尚未建立；评测以视觉指标为主，部分工作缺少局限性说明。
    - 路线: 冻结视频扩散模型适配
      解决的问题: 通过轻量掩码或动作条件模块，在无法访问模型参数时把预训练视频扩散模型转换为动作条件世界模型。
      尚未覆盖: 依赖领域特定的动作标注视频；分布外行为、闭源模型偏置和测试域之外的泛化仍未验证。
    - 路线: 具身视频模型的偏好与物理对齐
      解决的问题: 利用多维奖励或DPO风格判别器对具身视频世界模型进行后训练，以改善物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 评测集中在接触丰富操作；偏好收集成本高且主观；还没有给出形式化物理保证。
    - 路线: 机制分类与状态/动态形式化
      解决的问题: 围绕隐式/显式状态构建和动态建模整理视频生成作为世界模型的主张，指出持久性和因果性缺失。
      尚未覆盖: 分类是否改变模型设计或评测实践未被验证；概念分析缺少经验证据支撑。
    - 路线: 测试时验证与缩放证据
      解决的问题: 研究动作条件生成视图上的测试时验证器是否提供可靠空间推理奖励，并提出帧锚定断言奖励。
      尚未覆盖: 验证器校准差，随机评分也会降低答案熵；在跨基准上未实现一致缩放。
    共识:
    - 视频生成被当作世界模型的基础，通过历史观测和动作条件化来预测未来状态。
    - 评测正在从视觉保真转向任务有用性，包括规划一致性、物理合理性、具身合理性或下游推理。
    - 现有模型缺少显式状态构建，因此持久性和因果性仍未达到经典世界模型标准。
    分歧:
    - 表示方式不同：统一扩散或掩码自回归Transformer、冻结预训练视频模型适配器、概念层面的状态/动态分解并存。
    - 监督信号不同：自监督动作-视频预测、人类偏好与DPO式物理对齐、启发式或断言式测试时奖励各有侧重。
    - 评测目标不同：视觉质量与模拟器策略相关性、物理合理性与轨迹一致性、空间推理基准准确率被不同路线优先采用。
    - 交互方式不同：闭源模型适配、大规模跨本体预训练、测试时视图选择反映了不同部署假设。
    开放问题:
    - 在什么形式假设下，动作条件视频模型能够提供有效的策略学习、规划和反事实推理？
