  related_work_outline:
  - 'Mainstream direction: Diffusion-based and Transformer-based world models for
    video generation and model-based RL, with increasing integration of physics, action,
    and language modalities.'
  - 'Shared research pattern: World models are framed as sequence prediction problems
    trained via self-supervision on visual inputs, often augmented with auxiliary
    tasks such as mask reconstruction or dynamics prediction to improve generalization.'
  - 'Key differences: Architectures range from discrete latent diffusion to continuous
    VAEs and state-space models; supervision spans pure video prediction, action-conditioned
    generation, and language-driven decomposition; evaluations target either visual
    fidelity, downstream task performance, or memory/consistency metrics.'
  - 'Trend evolution: Early work focused on RNN/VAE for simple dynamics; by 2023 STORM
    introduced efficient Transformer-VAE hybrids; 2024-2025 saw diffusion-based and
    physics-informed models with compositional and unified frameworks; 2026 introduces
    dedicated benchmarks for memory and action control, signaling a shift from method
    development to standardized evaluation.'
  - 'Open questions: Cross-domain generalization of architecture choices, isolating
    model contributions from planner/controller effects, long-horizon memory stability,
    integration of physical priors without over-constraining, and lack of real-world
    closed-loop evidence.'
  related_work_outline_zh:
  - 主流方向：基于扩散模型和Transformer的世界模型，涵盖视频生成与基于模型的强化学习，并越来越多地融合物理、动作和语言模态。
  - 研究共性：将世界模型定义为序列预测问题，通过视觉输入的自监督学习进行训练，并常辅以掩码重建或动力学预测等辅助任务以提升泛化能力。
  - 关键差异：架构上从离散潜变量扩散到连续VAE和状态空间模型；监督信号从纯视频预测、动作条件生成到语言驱动分解；评测目标包括视觉保真度、下游任务性能或记忆/一致性指标。
  - 趋势演进：早期工作聚焦于简单动力学的RNN/VAE；2023年STORM引入高效Transformer-VAE混合架构；2024-2025年出现基于扩散和物理信息且具有组合与统一框架的模型；2026年出现专门针对记忆和动作控制的基准，标志着从方法开发向标准化评估的转变。
  - 开放问题：架构选择的跨域泛化能力、将模型贡献与规划器/控制器效应分离、长时域记忆稳定性、物理先验的集成而不导致过度约束，以及缺乏真实世界闭环证据。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model ideas into concrete architectures, losses,
        and training recipes, including diffusion transformers with mask reconstruction
        (MaskGWM), Transformer-VAE hybrids (STORM), contextual state-space models
        (cRSSM), compositional language-to-video factorization (RoboDreamer), physics-informed
        joint learning (RoboScape), and unified video-action diffusion (UWM).
      what_remains_open: Transferability of these design choices beyond the reported
        task families (e.g., driving, Atari, simple robotic tasks) is unverified;
        trade-offs between model complexity, compute cost, and performance gain lack
        systematic study; evidence for cross-domain scalability is missing.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decision-making by training policies
        on imagined rollouts (cRSSM, STORM), representing policies and dynamics inside
        a unified diffusion transformer (UWM), or generating video plans for robot
        execution (RoboDreamer).
      what_remains_open: The proportion of performance gain attributable to model
        accuracy, planner algorithm, or task prior is not isolated; robustness to
        model errors in closed-loop control is underexplored; real-world long-horizon
        autonomous execution evidence is lacking.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides benchmarks for evaluating spatial consistency (LoopNav),
        memory consistency, and action control (MIND) in world models, addressing
        the absence of standardized evaluation; some method papers report limited
        ablations and limitations (e.g., cRSSM's context observability assumption).
      what_remains_open: Most method papers lack detailed ablation to separate architecture,
        training objective, data scale, and compute effects; standardized cross-dataset
        and cross-model comparison protocols are missing; validation is concentrated
        in simulation, with no evidence of real-world sensor noise and dynamics variation.
    consensus:
    - World models are transitioning from simple generative models to integrated frameworks
      that combine video generation, physics, action, and context.
    - Diffusion and Transformer architectures have become the dominant backbone for
      video prediction and dynamics learning.
    - Large-scale pretraining and multi-task learning are shown to improve generalization
      of learned policies and dynamics.
    - Evaluating world models requires new metrics beyond visual quality, such as
      spatial consistency, memory consistency, and action-control accuracy.
    - Coupling world models with policy learning (model-based RL) remains a core paradigm
      for decision-making.
    disagreements:
    - 'Representation: continuous latent VAEs (STORM) vs. diffusion-based latent models
      (MaskGWM, UWM) vs. state-space models (cRSSM); the choice of deterministic vs.
      stochastic dynamics differs.'
    - 'Supervision: pure self-supervised video prediction (MaskGWM, RoboScape) vs.
      action-conditioned generation (UWM, STORM) vs. language-driven decomposition
      (RoboDreamer) vs. explicit context conditioning (cRSSM).'
    - 'Evaluation target: visual fidelity (FID, video quality) vs. downstream task
      performance (Atari scores, success rate) vs. consistency metrics (SGCS, memory/action
      scores).'
    - 'Interaction mode: open-loop video generation for planning or inspection vs.
      closed-loop policy execution within the learned model; some methods focus on
      generation quality, others on control performance.'
    - 'Deployment setting: domain-specific designs for autonomous driving, robotic
      manipulation, Atari games, and open-world navigation, with limited evidence
      of cross-domain architecture reuse.'
    open_questions:
    - Can current world model architectures scale to substantially longer horizons
      and more complex physical interactions without degrading generation quality
      or control reliability?
    - How can model error propagation be quantified in closed-loop planning, and what
      robustness mechanisms are needed for safe deployment?
    - What is the best way to incorporate physical priors (e.g., depth, keypoint dynamics)
      to improve realism while avoiding over-constraining the learned dynamics?
    - How do we benchmark and compare world models across diverse domains and action
      spaces when standardized evaluation protocols are still missing?
    - Do the memory and consistency mechanisms demonstrated in benchmarks translate
      to stable long-term behavior in real-world, non-stationary environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体架构、损失函数和训练配方，包括扩散Transformer加掩码重建（MaskGWM）、Transformer-VAE混合（STORM）、上下文状态空间模型（cRSSM）、组合式语言到视频分解（RoboDreamer）、物理信息联合学习（RoboScape）以及统一视频-动作扩散（UWM）。
      尚未覆盖: 这些设计选择在超出其原始任务领域（如驾驶、Atari游戏、简单机器人任务）时的可迁移性未被验证；模型复杂度、计算成本与性能提升之间的权衡缺乏系统研究；跨域扩展性证据缺失。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策，包括在想象轨迹上训练策略（cRSSM、STORM）、在统一扩散Transformer中表示策略和动力学（UWM），或为机器人执行生成视频计划（RoboDreamer）。
      尚未覆盖: 模型精度、规划算法或任务先验各自对性能增益的贡献未被分离；闭环控制中对模型误差的鲁棒性研究不足；缺乏真实世界长时间自主执行的证据。
    - 路线: 方法证据与消融协议
      解决的问题: 提供评估世界模型空间一致性（LoopNav）、记忆一致性和动作控制（MIND）的基准，弥补标准化评估的缺失；部分方法论文报告了有限的消融和局限性（如cRSSM的上下文可观测假设）。
      尚未覆盖: 多数方法论文缺少详细消融以分离架构、训练目标、数据规模和计算资源的影响；跨数据集和跨模型的标准化比较协议缺失；验证主要集中于仿真环境，缺乏真实世界传感器噪声和动力学变化的证据。
    共识:
    - 世界模型正从简单的生成模型向融合视频生成、物理、动作和上下文的综合框架演进。
    - 扩散和Transformer架构已成为视频预测和动力学学习的主流骨干。
    - 大规模预训练和多任务学习被证明能提升所学策略和动力学的泛化能力。
    - 评估世界模型需要超越视觉质量的新指标，如空间一致性、记忆一致性和动作控制精确度。
    - 将世界模型与策略学习（基于模型的强化学习）耦合仍是决策的核心范式。
    分歧:
    - 表示方式：连续潜变量VAE（STORM）对基于扩散的潜变量模型（MaskGWM、UWM）对状态空间模型（cRSSM）；确定性动力学与随机动力学的选择不同。
    - 监督信号：纯自监督视频预测（MaskGWM、RoboScape）对动作条件生成（UWM、STORM）对语言驱动分解（RoboDreamer）对显式上下文条件化（cRSSM）。
    - 评测目标：视觉保真度（FID、视频质量）对下游任务性能（Atari得分、成功率）对一致性指标（SGCS、记忆/动作得分）。
    - 交互模式：用于规划或检查的开环视频生成对在所学模型内部的闭环策略执行；部分方法侧重生成质量，其他侧重控制性能。
    - 部署场景：针对自动驾驶、机器人操作、Atari游戏和开放世界导航的领域特定设计，跨域架构复用的证据有限。
    开放问题:
    - 当前世界模型架构能否在不降低生成质量或控制可靠性的情况下扩展到更长的时域和更复杂的物理交互？
    - 如何量化闭环规划中模型误差的传播，并且需要哪些鲁棒性机制才能安全部署？
    - 在避免过度约束学习动力学的前提下，整合物理先验（如深度、关键点动力学）以提高真实感的最佳方式是什么？
    - 在标准化评估协议仍然缺失的情况下，如何跨不同领域和动作空间对世界模型进行基准测试和比较？
    - 基准测试中展示的记忆和一致性机制是否能在真实世界非平稳环境中转化为稳定的长期行为？
