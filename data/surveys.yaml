  related_work_outline:
  - 'Mainstream direction: Building domain-specific world models for autonomous driving,
    robotics, and interactive games, using video generation or latent dynamics to
    simulate future states conditioned on actions.'
  - 'Shared research pattern: Leveraging generative architectures (diffusion transformers,
    VAEs, or autoregressive transformers) trained on large-scale domain datasets to
    predict future observations and enable policy learning or planning.'
  - 'Key differences: Driving models emphasize multi-view, long-horizon video prediction;
    robotics models inject physical consistency or compositional video generation;
    game and interactive models focus on sample efficiency and zero-shot generalization
    to unseen dynamics.'
  - 'Trend evolution: From 2023–2025, the field shifted from single-task RL world
    models (e.g., Atari 100k) toward large-scale, multi-task pretraining on robot
    datasets and high-fidelity open-domain video generation. 2025–2026 sees new benchmarks
    for spatial consistency and action control, indicating a maturation of evaluation
    methodology.'
  - 'Open questions: Whether cross-domain transfer (e.g., driving to robotics) is
    possible; how to align simulation fidelity with real-world safety; and how to
    scale memory and action control to open-ended environments with arbitrary action
    spaces.'
  related_work_outline_zh:
  - 主流方向：针对自动驾驶、机器人和交互游戏构建领域专用的世界模型，通过视频生成或潜在动力学模拟动作条件下的未来状态。
  - 研究共性：利用生成式架构（扩散Transformer、VAE或自回归Transformer），在领域大规模数据集上训练，预测未来观测并支持策略学习或规划。
  - 关键差异：驾驶模型侧重多视角、长时域视频预测；机器人模型注入物理一致性或组合式视频生成；游戏与交互模型关注样本效率和对未见动力学的零样本泛化。
  - 趋势演进：2023–2025年，从单任务RL世界模型（如Atari 100k）转向大规模多任务机器人数据集预训练和高保真开放域视频生成；2025–2026年出现空间一致性和动作控制新基准，评估方法日趋成熟。
