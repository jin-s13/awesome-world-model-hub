  related_work_outline:
  - 'Mainstream direction: World-model benchmarking centers on action-conditioned
    video prediction and diagnostic consistency/control tasks, especially for driving,
    robotics, games, and open-ended navigation.'
  - 'Shared research pattern: Works pair a world-model architecture or dataset with
    a fixed evaluation protocol and one or more quantitative signals, such as visual
    fidelity, game score, spatial consistency, or action-control error.'
  - 'Key differences: Evaluations target different failure modes: closed-loop memory/action
    control, long-horizon multi-view generation, zero-shot dynamics transfer, physical
    plausibility, or Atari human-normalized performance; representations range from
    diffusion pixels/features to latent transformer/recurrent dynamics.'
  - 'Trend evolution: Within the current frontier (2023–2026), evaluation is moving
    from aggregate game benchmarks and task-specific RL suites toward open-domain,
    interaction-based benchmarks with consistency, controllability, and long-horizon
    rollout metrics.'
  - 'Open questions: Whether diagnostic proxy metrics track downstream policy utility,
    physical plausibility, or robustness, and whether reported conclusions remain
    stable across implementations, action spaces, and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型基准测评围绕动作条件视频预测与诊断式一致性/控制任务展开，重点覆盖驾驶、机器人、游戏和开放域导航等场景。
  - 研究共性：相关工作通常将世界模型架构或数据集与固定评测协议及一个或多个定量信号配对，如视觉保真度、游戏得分、空间一致性或动作控制误差。
  - 关键差异：不同评测目标覆盖不同失效模式，例如闭环记忆与动作控制、长时域多视角生成、零样本动力学迁移、物理合理性或 Atari 人类归一化表现；表示方式从像素/特征扩散到潜在
    Transformer/循环动力学各不相同。
  - 趋势演进：在当前前沿（2023–2026）内，评测从聚合式游戏基准和特定任务 RL 套件，转向开放域、基于交互且包含一致性、可控性和长时域 rollout
    指标的基准；本证据包对更早基础工作覆盖有限。
  - 开放问题：诊断式代理指标是否与下游策略效用、物理合理性或鲁棒性一致；报告结论在不同实现、动作空间和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design (e.g., LoopNav, MIND, Atari 100k, CARL,
        driving and robotics evaluation suites)
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable across scene types, action spaces, and prediction horizons.
      what_remains_open: Whether task distributions cover the deployment conditions
        where world models are expected to help; cross-benchmark coverage evidence
        is missing in the packet.
    - line: Metric and stress-test design (e.g., Scene Graph Consistency Score, memory
        consistency/action control scores, human-normalized game score)
      what_it_solves: Probes prediction, controllability, spatial/memory consistency,
        and physical plausibility beyond aggregate generation quality.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        or real-world utility remains unvalidated in this evidence.
    - line: Comparable world-model baselines and reporting (e.g., cRSSM, STORM, DIAMOND,
        MaskGWM, RoboScape, UWM)
      what_it_solves: Provides reproducible model or protocol references that standardize
        reporting on shared benchmarks and datasets.
      what_remains_open: Whether benchmark conclusions are stable across implementations,
        compute budgets, and action/data availability settings is underevidenced.
    consensus:
    - Shared benchmarks and metrics are used to substantiate world-model quality,
      with multiple works evaluating on common suites such as Atari 100k or action-conditioned
      video datasets.
    - Recent work treats action-conditioned generation, long-horizon rollout, and
      consistency under viewpoint or trajectory changes as core world-model capabilities.
    - There is convergence on open dataset/benchmark artifacts and reproducible training
      and evaluation protocols as a way to compare model families rather than isolated
      demonstrations.
    - Several works connect world-model training to downstream policy learning or
      policy evaluation, implying that visual fidelity alone is not treated as sufficient.
    disagreements:
    - 'Evaluation target differs: some use aggregate task reward or human-normalized
      scores, while others measure spatial or memory consistency and action-control
      error, creating different failure-mode emphasis.'
    - 'Representation differs: diffusion over visual details or video features contrasts
      with transformer/VAE or recurrent latent dynamics, changing the balance between
      visual fidelity and compact stochastic dynamics.'
    - 'Supervision and assumptions differ: methods assume action labels, action-free
      video, observable context values, or physics-oriented depth/keypoint signals,
      so generalization claims are not directly comparable.'
    - 'Interaction mode differs: closed-loop actionable navigation is stressed in
      some benchmarks, while others evaluate offline or rollout-based video prediction
      from recorded actions.'
    - 'Deployment setting differs: driving, robotic manipulation, Atari, and Minecraft
      are used as testbeds, and domain-specific metrics may not transfer across these
      settings.'
    open_questions:
    - Are spatial/memory consistency and action-control scores predictive of downstream
      policy performance or human-rated physical plausibility?
    - Do benchmark rankings remain stable across implementations, training compute,
      and action-space variations?
    - What is the minimal task distribution needed to cover world-model deployment
      conditions across driving, robotics, games, and open-world settings?
    - How can benchmarks separate model capabilities from data quality, especially
      when action-free video, physics-informed signals, or context labels are unavailable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计（如 LoopNav、MIND、Atari 100k、CARL、驾驶/机器人评测集）
      解决的问题: 构建共享任务与数据集，使世界模型主张在不同场景、动作空间和预测时域下可比。
      尚未覆盖: 任务分布是否覆盖世界模型预期部署条件仍缺证据；本证据包缺少跨基准覆盖验证。
    - 路线: 指标与压力测试设计（如 Scene Graph Consistency Score、记忆一致性/动作控制得分、人类归一化游戏得分）
      解决的问题: 在聚合生成质量之外，检验预测、可控性、空间/记忆一致性和物理合理性。
      尚未覆盖: 这些代理指标与下游决策或真实效用之间的一致性尚未在本证据中验证。
    - 路线: 可比基线与报告规范（如 cRSSM、STORM、DIAMOND、MaskGWM、RoboScape、UWM）
      解决的问题: 通过在共享基准和数据集上提供可复现模型或协议参考，使结果可审计。
      尚未覆盖: 结论是否在不同实现、算力预算和动作/数据可得性下稳定，证据不足。
    共识:
    - 共享基准和指标被用于支撑世界模型质量主张，多项工作在同一类基准评测上进行比较，如 Atari 100k 或动作条件视频数据集。
    - 近期工作将动作条件生成、长时域 rollout 以及视角或轨迹变化下的一致性视为世界模型核心能力。
    - 该主题出现向开放数据集/基准工件和可复现训练评估协议集中的趋势，以便比较不同模型族，而非仅展示孤立演示。
    - 多项工作将世界模型训练与下游策略学习或策略评估连接起来，表明视觉保真度单独并不被视为充分条件。
    分歧:
    - 评测目标不同：部分工作使用聚合任务奖励或人类归一化得分，部分工作测量空间或记忆一致性及动作控制误差，导致失效模式侧重不同。
    - 表示方式不同：基于视觉细节或视频特征的扩散模型与 Transformer/VAE 或循环潜在动力学形成对比，改变了视觉保真度与紧凑随机动力学之间的平衡。
    - 监督信号与假设不同：方法分别依赖动作标签、无动作视频、可观测上下文值或物理导向的深度/关键点信号，因此泛化主张不可直接比较。
    - 交互模式不同：有的基准强调闭环可执行导航，有的则评估基于记录动作的离线或 rollout 视频预测。
    - 部署场景不同：驾驶、机器人操作、Atari 和 Minecraft 被用作测试环境，领域专用指标可能无法跨场景迁移。
    开放问题:
    - 空间/记忆一致性和动作控制分数能否预测下游策略性能或人类评定的物理合理性？
    - 基准排名是否在不同实现、训练算力和动作空间变化下保持稳定？
    - 覆盖驾驶、机器人、游戏和开放世界部署条件所需的最小任务分布是什么？
    - 当无动作视频、物理信息信号或上下文标签不可用时，基准如何区分模型能力与数据质量？
