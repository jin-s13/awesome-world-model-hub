      解决的问题: 通过后训练或测试时机制使生成轨迹符合物理真实性、任务逻辑、人类偏好或空间断言。
      尚未覆盖: 验证器校准、基准一致性，以及对齐信号是否可跨场景迁移而不形成信息瓶颈。
    - 路线: 概念分类与评测基础
      解决的问题: 把视频世界模型组织为状态构建与动态建模类别，并推动功能性基准。
      尚未覆盖: 分类是否改变模型设计或评测实践，且其边界缺乏直接经验验证。
    共识:
    - 领域正汇聚到动作条件化视频生成，作为具身决策世界模型的预训练或后训练范式。
    - 仅视觉逼真不够；必须显式评估物理合理性、动作对齐、轨迹一致性和任务有用性。
    - 大规模机器人/视频预训练与显式动作条件化，常比模仿学习或无条件生成带来更好的泛化或控制。
    - 评测正向功能性或物理基准转变，不再只看重建或视图质量。
    分歧:
    - 生成式建模形式不同：统一扩散时间步、掩码自回归、预训练模型适配器，以及结合强化学习对齐的流模型。
    - 监督与对齐信号不同：动作标注演示、人类偏好奖励、解耦判别器DPO、测试时空间断言验证器。
    - 评测目标不同：有的偏重操作模拟器中的策略/规划相关性，有的偏重零样本物理合理性或空间推理基准提升。
    - 部署假设不同：对预训练模型内部参数的访问程度和对动作标注适配数据的依赖不同。
    开放问题:
    - 分类法中的状态/动态形式化界限是否对应真实世界模型行为中可测量的差距？
    - 视觉质量或模型规模上的缩放表现能否预测失败模式和未见过机器人/场景组合的迁移？
    - 哪些功能性基准或验证器设计真正跟踪下游策略和规划改进？
    - 形式化保证或缩放经验的缺失，有多少是来自局限性、代码、数据集和指标细节不完整所致的验证缺口，而非确认不存在？
