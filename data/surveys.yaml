  literature_review:
    line_of_work_matrix:
    - line: Benchmark and artifact systems for generative simulation evaluation
      what_it_solves: Provide runnable datasets, metrics, and evaluation frameworks
        for spatial consistency or action fidelity in generated navigation or driving
        rollouts.
      what_remains_open: Coverage remains concentrated in Minecraft and nuScenes;
        transfer to other environments and independent reuse across teams are not
        yet shown.
    - line: Conditional and physics-informed training stacks
      what_it_solves: Improve zero-shot generalization, physics plausibility, or action
        controllability by adding context conditioning or physical, depth, and keypoint
        training signals.
      what_remains_open: Evidence is limited to narrow tasks such as CARL and selected
        robot scenarios, and real-time or deployment failure modes are under-characterized.
    - line: Cross-embodiment synthetic data generation
      what_it_solves: Uses a shared latent action interface to synthesize action-video
        demonstrations across human, robot, and simulation sources for policy training.
      what_remains_open: Generalization is shown mainly through video prediction and
        selected LIBERO policy results; broader reproducibility and deployment boundaries
        remain unverified.
    - line: Latency-aware closed-loop driving simulation
      what_it_solves: Generates geometrically consistent multi-camera frames for closed-loop
        autonomous driving with sub-second latency on one GPU.
      what_remains_open: Evaluation is limited to nuScenes, and long-horizon stability
        plus multi-GPU or edge scalability have not been demonstrated.
    consensus:
    - Current systems treat controllable video generation as the main runnable artifact
      and evaluate it with quantitative consistency, fidelity, or downstream policy
      metrics.
    - Open datasets, benchmarks, or task setups are frequently released as part of
      the system contribution to enable repeated evaluation rather than one-off visual
      comparison.
    - Several systems jointly optimize generation quality and downstream utility,
      such as policy training, action evaluation, or closed-loop simulation.
    disagreements:
    - 'Representation choices differ: scene-graph consistency scoring for loop navigation,
      keypoint/depth physical signals for robot video, universal latent actions for
      cross-embodiment data, and structured multi-camera control for driving.'
    - 'Evaluation targets differ: spatial consistency, action fidelity, zero-shot
      generalization to unseen dynamics, video prediction, and real-robot policy success
      are not directly interchangeable.'
    - 'Deployment settings differ: offline benchmark evaluation, synthetic demonstration
      generation for policy training, and latency-constrained closed-loop simulation
      impose different system requirements.'
    - 'Conditioning assumptions differ: observable context values, trajectory annotations,
      physics-related training objectives, or universal latent action tokens serve
      as different supervisory interfaces.'
    open_questions:
    - Do current consistency or action-fidelity metrics predict deployment performance
      outside Minecraft, nuScenes, CARL, or the selected robot benchmarks? The packet
      does not provide that transfer evidence.
    - Long-horizon closed-loop generation may degrade, yet cross-environment and sensor-layout
      generalization remain verification gaps because the available results are narrow.
    - 'Independent reproduction is unclear across teams and infrastructure: code,
      dataset, and artifact signals vary, and multi-GPU or edge deployment evidence
      is not reported.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向生成式模拟评测的基准与工件系统
      解决的问题: 提供可运行的数据集、指标和评测框架，用于衡量生成轨迹中的空间一致性或动作忠实度。
      尚未覆盖: 覆盖集中于Minecraft和nuScenes等特定环境与传感器设置；跨团队复用和迁移到真实部署尚未验证。
    - 路线: 条件化与物理信息驱动的训练框架
      解决的问题: 通过注入上下文、物理信号或深度/关键点训练信号，改进零样本泛化、物理合理性或动作可控性。
      尚未覆盖: 评估依赖CARL和选定机器人场景等较窄任务；实时部署与失效模式未系统描述。
    - 路线: 跨具身合成数据生成框架
      解决的问题: 以通用潜在动作作为接口，在人类视频、机器人演示和仿真轨迹之间生成动作-视频数据并用于策略训练。
      尚未覆盖: 泛化证据主要来自视频预测和LIBERO等选定策略结果；更广泛的复现与部署边界仍不清晰。
    - 路线: 面向闭环自动驾驶的低延迟模拟系统
      解决的问题: 生成几何一致的多相机帧，并在单个GPU上实现亚秒级延迟，用于闭环自动驾驶模拟。
      尚未覆盖: 仅验证于nuScenes；极长序列时空一致性和多GPU或边缘部署可扩展性仍存在验证缺口。
    共识:
    - 研究普遍以可控视频生成作为主要运行产物，并以定量一致性、保真度或下游策略指标进行评价。
    - 开放数据集、基准或任务设置常被作为系统贡献的一部分，用于支持重复评测而非一次性视觉比较。
    - 多个系统同时优化生成质量与下游效用，包括策略训练、动作评测或闭环模拟。
    分歧:
    - 表示方式不同：环路导航采用场景图一致性分数，机器人视频采用关键点/深度物理信号，跨具身系统采用通用潜在动作，驾驶模拟采用多相机结构化控制。
    - 评测目标不同：空间一致性、动作忠实度、零样本泛化、视频预测和真实机器人策略成功率之间不能直接互换。
    - 部署场景不同：离线基准评测、面向策略训练的合成演示生成、以及有延迟约束的闭环模拟各自有不同的系统要求。
    - 监督假设不同：可观测上下文值、轨迹注释、物理相关训练目标或通用潜在动作token分别被用作条件接口。
    开放问题:
    - 现有空间一致性或动作忠实度指标能否预测Minecraft、nuScenes、CARL或选定机器人基准之外的部署表现，证据包尚未提供这种迁移证据。
    - 长时域闭环生成可能退化，但现有结果较窄，跨环境和传感器布局的泛化仍是验证缺口。
    - 跨团队、跨基础设施的独立复现说明不足：代码、数据集和工件信号不一，且缺少多GPU或边缘部署的明确验证。
