  related_work_outline:
  - 'Mainstream direction: using video generation models as world simulators to predict
    future states, enabling planning and control in robotics and autonomous driving,
    with emphasis on interactivity, long-horizon consistency, and controllability.'
  - 'Shared research pattern: building world models that learn from interaction or
    video data, factorize dynamics into latent or compositional representations, and
    generate future frames or states conditioned on actions, language, or goals.'
  - 'Key differences: representation modality (video, latent, RGB-D), control interface
    (language, trajectories, sparse rewards), memory mechanism (global state, monitor-based,
    autoregressive), and deployment setting (simulation, physical robot, open-source).'
  - 'Trend evolution: from early application of Dreamer-like world models to physical
    robots (2022) toward interactive video world models with out-of-sight dynamics,
    open-source frameworks, and unified taxonomies for evaluation (2024–2026), signaling
    a push toward standardization and real-world deployment.'
  - 'Open questions: how to achieve true physical law understanding and long-term
    consistency, how to evaluate downstream task performance robustly, how to generalize
    to entirely novel primitives beyond training compositions, and how to balance
    real-time interactivity with generation fidelity.'
  related_work_outline_zh:
  - 主流方向：以视频生成模型作为世界模拟器预测未来状态，支撑机器人和自动驾驶中的规划与控制，重点在交互性、长时域一致性和可控性。
  - 研究共性：从交互或视频数据学习世界模型，将动态分解为潜在或组合表示，并基于动作、语言或目标生成未来帧或状态。
  - 关键差异：表示模态（视频、潜在状态、RGB-D）、控制接口（语言、轨迹、稀疏奖励）、记忆机制（全局状态、监控式、自回归）和部署场景（仿真、物理机器人、开源）。
  - 趋势演进：从2022年将Dreamer类世界模型应用于物理机器人，到2024–2026年出现具备视线外动态、开源框架和统一评估分类法的交互式视频世界模型，表明该领域正在向标准化和真实部署推进。
  - 开放问题：如何实现真正的物理规律理解和长期一致性，如何鲁棒评估下游任务性能，如何泛化到训练组合之外的全新原语，以及如何平衡实时交互与生成质量。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: organizing fragmented world-model research into challenges,
        design spaces, and evaluation frameworks for robotics and driving
      what_remains_open: whether the taxonomies rest on systematic evidence rather
        than selective examples, and whether they are empirically validated
    - line: Comparative evaluation synthesis
      what_it_solves: summarizing how different evaluation choices (open-loop vs closed-loop,
        metrics, benchmarks) shape conclusions about world model quality
      what_remains_open: compatibility of results across papers with different observation
        spaces, action interfaces, and dataset domains
    - line: Open problem and gap mapping
      what_it_solves: translating broad literature coverage into concrete next questions
        such as out-of-sight dynamics, long-horizon memory, and real-time interactivity
      what_remains_open: prioritization of which gaps are most critical for downstream
        task success in robotics or autonomous driving
    consensus:
    - World models are converging on video generation as a core mechanism for predicting
      future states, with action-conditioning essential for downstream planning.
    - Long-horizon consistency and memory remain universal challenges, addressed through
      global state representations, autoregressive noise schedules, or monitor-based
      synchronization.
    - Evaluation is shifting from open-loop frame similarity to closed-loop, task-centric
      metrics, though standardized benchmarks are still emerging.
    disagreements:
    - 'Representation format: latent-space models (e.g., Dreamer) rely on compact
      states for planning, while video-based models (e.g., LiveWorld, GEM) generate
      explicit frames for interpretability and control.'
    - 'Control granularity: some methods use sparse rewards and learned policies inside
      the world model, while others use dense action trajectories or language parses
      to steer generation.'
    - 'Interaction mode: offline world model training with imagined rollouts (DayDreamer)
      versus real-time interactive generation with latency constraints (LingBot-World).'
    - 'Domain specialization: works target either general video environments (RoboDreamer,
      LiveWorld) or specific domains like autonomous driving (Latent World Models
      for Automated Driving) and ego-vision (GEM), leading to different assumptions
      about dynamics and sensor modalities.'
    open_questions:
    - How can world models exhibit genuine physical understanding beyond statistical
      next-frame prediction, especially for contact-rich manipulation or rare events?
    - What is the minimal set of evaluation protocols that reliably predicts real-robot
      policy transfer, given the gap between simulation and online deployment?
    - Can compositional world models generalize to unseen primitives without retraining,
      and how should such primitives be discovered or defined?
    - Is real-time, high-fidelity interactive generation feasible on resource-constrained
      hardware, and what trade-offs should be accepted between latency and consistency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究整理为挑战、设计空间和评估框架，面向机器人和自动驾驶
      尚未覆盖: 分类法是否基于系统证据而非选择性举例，以及是否得到实证验证
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（开环/闭环、指标、基准）如何影响世界模型质量结论
      尚未覆盖: 不同观测空间、动作接口和数据集领域下论文结果的可比性
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体后续问题，如视线外动态、长时域记忆和实时交互
      尚未覆盖: 哪些缺口对机器人或自动驾驶的下游任务成功最为关键，仍需优先排序
    共识:
    - 世界模型正以视频生成为核心机制预测未来状态，动作条件化对下游规划不可或缺。
    - 长时域一致性和记忆仍是普遍挑战，通过全局状态表示、自回归噪声调度或监控式同步等方法应对。
    - 评估正从开环帧相似性转向闭环、以任务为中心的指标，但标准化基准仍在形成中。
    分歧:
    - 表示格式：潜在空间模型（如Dreamer）依赖紧凑状态进行规划，而视频模型（如LiveWorld、GEM）生成显式帧以提升可解释性和控制。
    - 控制粒度：部分方法使用稀疏奖励和在世界模型内部学习的策略，其他方法则使用密集动作轨迹或语言解析来引导生成。
    - 交互模式：离线世界模型训练与想象推演（DayDreamer）对比具有延迟约束的实时交互生成（LingBot-World）。
    - 领域专业化：工作面向通用视频环境（RoboDreamer、LiveWorld）或特定领域如自动驾驶（Latent World Models for Automated
      Driving）和自我中心视觉（GEM），导致对动态和传感器模态的不同假设。
    开放问题:
    - 世界模型如何展示超越统计性下一帧预测的真正物理理解，尤其对接触丰富的操作或罕见事件？
    - 在模拟与在线部署存在差距的情况下，什么是最小评估协议集，能可靠预测真实机器人策略迁移？
    - 组合式世界模型能否在不重新训练的情况下泛化到未见原语，以及如何发现或定义这些原语？
    - 在资源受限硬件上，实时高保真交互生成是否可行，应在延迟和一致性之间接受何种权衡？
