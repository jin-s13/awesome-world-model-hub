  related_work_outline:
  - 'Mainstream direction: The current frontier focuses on world-model evaluation
    through open-domain, action-conditioned, long-horizon benchmarks in driving, robotics,
    and interactive video, alongside established control benchmarks such as Atari
    100k and CARL.'
  - 'Shared research pattern: Work constructs tasks, datasets, or metrics that stress
    spatial, temporal, memory, or action consistency, then uses them to compare diffusion-based
    and sequential latent world models across visual and decision-making criteria.'
  - 'Key differences: Evaluation settings and action spaces differ; some target cross-dataset
    driving generalization, others loop navigation in Minecraft, robotic video, or
    Atari agent returns. Metrics also split between fidelity/physical plausibility
    and downstream control utility.'
  - 'Trend evolution: The visible evidence concentrates around 2023-2026 and moves
    from Atari-centric model-based RL scores toward larger open-domain, embodied,
    and multi-view benchmarks that probe long-horizon consistency and cross-action
    generalization.'
  - 'Open questions: Whether spatial/memory consistency metrics align with practical
    driving or robot decisions; whether benchmark distributions cover real deployment;
    and whether reported rankings remain stable across implementations and compute
    budgets.'
  related_work_outline_zh:
  - 主流方向：当前前沿聚焦于在驾驶、机器人、交互视频等开放域中，以动作条件化、长时域基准评估世界模型，同时继续使用 Atari 100k、CARL 等控制基准。
  - 研究共性：工作构建强调空间、时间、记忆或动作一致性的任务、数据集或指标，并用于比较扩散式和序列潜变量世界模型的视觉质量与决策能力。
  - 关键差异：评测场景和动作空间不同；有的面向跨数据集驾驶泛化，有的面向 Minecraft 循环导航、机器人视频或 Atari 智能体回报；指标在视觉真实感/物理合理性与下游控制效用之间也存在侧重差异。
  - 趋势演进：可见证据集中在 2023-2026 年，从以 Atari 为中心的基于模型的强化学习得分，转向更大规模具身、多视角基准，考查长时域一致性和跨动作泛化。
  - 开放问题：空间/记忆一致性指标是否能对应真实驾驶或机器人决策；基准分布是否覆盖实际部署；报告排名在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets for comparable world-model
        evaluation; examples include LoopNav navigation data and MIND open-domain
        action/consistency videos.
      what_remains_open: Coverage of real deployment settings, action-space diversity,
        and long-term memory/consistency boundaries is still uncertain.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial, temporal, memory, action-control, visual fidelity,
        physical plausibility, and downstream control beyond aggregate scores; Atari
        human normalized score is one established stress signal.
      what_remains_open: Proxy metrics are not yet proven aligned with downstream
        decisions users care about in driving, robotics, and interactive settings.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines such as Dreamer
        v3 or state-of-the-art driving models and common datasets like NuScenes, OpenDV-2K,
        Waymo, Atari 100k.
      what_remains_open: Stability across implementations, compute budgets, and missing
        limitation or artifact evidence remains a verification gap.
    consensus:
    - World-model evaluation increasingly values action-conditioned, long-horizon,
      and multi-view or loop-based consistency rather than isolated next-frame prediction.
    - Benchmark construction commonly pairs a new dataset or metric with an existing
      downstream control or video-generation evaluation to stress different failure
      modes.
    - Reproducibility signals such as code and dataset release are present in several
      works, but evidence for stable baseline/compute comparisons is incomplete.
    disagreements:
    - 'Representation choice differs: diffusion transformers, VAE-transformer world
      models, and recurrent state-space models are adopted in different evaluation
      settings.'
    - 'Supervision/evaluation target differs: some use visual reconstruction with
      physics or context signals; others optimize for zero-shot control generalization
      or agent returns.'
    - 'Interaction mode differs: open-loop generation, closed-loop action-conditioned
      rollout, or video-to-world interactive baselines are tested in separate benchmarks.'
    - Deployment setting differs across driving, robotic manipulation video, Minecraft
      navigation, and Atari, which changes what consistency and action control mean.
    open_questions:
    - Do spatial consistency and memory/action-control benchmarks predict performance
      in real driving or robotic decision-making?
    - How well do current benchmark distributions cover unseen action spaces, long-horizon
      rollouts, and physical plausibility failures?
    - Are reported rankings robust to different implementations, compute budgets,
      and missing baseline or limitation details?
    - What additional metrics are needed to separate visual realism from decision-relevant
      world-model accuracy?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，让世界模型主张具备可比性；例如 LoopNav 导航数据与 MIND 开放域动作一致性视频。
      尚未覆盖: 真实部署设置、动作空间多样性和长期记忆/一致性边界的覆盖仍不确定。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间、时间、记忆、动作控制、视觉真实感、物理合理性与下游控制；Atari 人类标准化得分是既有压力信号之一。
      尚未覆盖: 代理指标尚未证明与驾驶、机器人及交互场景中用户关心的下游决策一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Dreamer v3 等共同基线和 NuScenes、OpenDV-2K、Waymo、Atari 100k 等数据集，让结果可审计。
      尚未覆盖: 不同实现、算力预算、缺失的局限性或工件证据等仍是验证缺口。
    共识:
    - 世界模型评估越来越重视动作条件化、长时域、多视角或循环一致性，而非单帧下一帧预测。
    - 基准构建通常把新数据集或指标与现有下游控制或视频生成评估配对，以暴露不同失效模式。
    - 若干工作给出了代码和数据发布信号，但基线与算力对比的稳定性证据仍不完整。
    分歧:
    - 表示方式不同：不同评测设置中分别采用扩散 Transformer、VAE-Transformer 世界模型和循环状态空间模型。
    - 监督与评测目标不同：有的结合物理或上下文信号做视觉重建，有的优化零样本控制泛化或智能体回报。
    - 交互模式不同：开放环生成、闭环动作条件化 rollout 或视频到世界交互式基线在各基准中分别测试。
    - 部署场景不同：驾驶、机器人操作视频、Minecraft 导航和 Atari 使一致性、动作控制等含义不同。
    开放问题:
    - 空间一致性和记忆/动作控制基准能否预测真实驾驶或机器人决策中的表现？
    - 当前基准分布能否覆盖未见动作空间、长时域 rollout 和物理合理性失败？
    - 报告排名在不同实现、算力预算及缺失基线与局限性细节下是否稳健？
    - 还需要哪些指标来区分视觉真实感和决策相关世界模型精度？
