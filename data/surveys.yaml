  related_work_outline_zh:
  - 主流方向：面向具身智能体与自动驾驶构建世界模型，重点利用视频生成结合动作、语言或物理条件，以实现规划与控制。
  - 研究共性：采用扩散模型或Transformer进行视频预测，并通过融入动作、语言或物理信息来提升可控性与一致性。
  - 关键差异：物理信息是显式注入还是隐式学习；泛化机制（组合泛化、基于上下文的零样本、掩码重建）；评测目标从视觉保真度到空间记忆与长期一致性各有侧重。
  - 趋势演进：从单一游戏环境（Atari）转向复杂的具身与驾驶场景；近期涌现的诊断性基准（记忆与一致性）表明领域正从追求性能指标转向系统化能力评估。
  - 开放问题：如何验证世界模型预测的物理准确性足以支撑真实决策；长期记忆与空间一致性在开放域中能否保持；基准改进如何转化为下游任务收益。
  literature_review:
    line_of_work_matrix:
    - line: Compositional world models for embodied video generation
      what_it_solves: Enables generalization to unseen object–action combinations
        by factorizing language instructions into primitives and generating video
        plans, and supports multi-task pretraining by coupling video with action diffusion.
      what_remains_open: Generalization is limited to combinations of seen primitives;
        physical plausibility beyond visual fidelity is not guaranteed; evaluation
        is mostly in simulation, with no real-robot transfer evidence.
    - line: Physics-informed embodied world models
      what_it_solves: Improves visual realism and motion plausibility by jointly learning
        video generation with physics-related tasks such as temporal depth prediction
        and keypoint dynamics, implicitly encoding physical properties.
      what_remains_open: Whether the learned physics representations are sufficient
        for contact-rich interactions or out-of-distribution objects; no direct measurement
        of real-world safety or operational outcomes.
    - line: Driving world models with long-horizon and multi-view prediction
      what_it_solves: Achieves generalizable scene prediction across datasets (including
        zero-shot) via diffusion transformers and mask reconstruction, enabling long-horizon
        and multi-view video generation for autonomous driving.
      what_remains_open: Alignment between simulation gains and real-world driving
        safety or policy improvements; closed-loop evaluation in varied traffic scenarios
        is not covered.
    - line: Efficient stochastic world models for reinforcement learning
      what_it_solves: Provides fast training and high sample efficiency in discrete
        game environments (e.g., Atari) by combining Transformer architectures with
        variational autoencoders, achieving strong performance without lookahead search.
      what_remains_open: Scalability to continuous control and complex embodied tasks;
        sensitivity to stochasticity and exploration in broader action spaces remains
        untested.
    - line: Contextual world models for zero-shot dynamics generalization
      what_it_solves: Enables policies to adapt to changing environment dynamics (e.g.,
        mass, dimensions) by conditioning the world model on observable context variables,
        improving zero-shot transfer in contextual RL.
      what_remains_open: Relies on the strong assumption of observable context, which
        rarely holds in real-world settings; evaluated on only two tasks, leaving
        broader dynamics generalization unverified.
    - line: Benchmarks for spatial consistency and memory in world models
      what_it_solves: Provides diagnostic evaluation of whether world models maintain
        consistent geometry and temporal coherence across viewpoints and over long
        loops, using scene-graph consistency scores and closed-loop navigation.
      what_remains_open: Current benchmarks are limited to a few virtual environments
        (Minecraft, curated videos); the link between benchmark scores and downstream
        task performance is not yet established, and no model-level improvements have
        been demonstrated from these diagnostics.
    consensus:
    - Video generation is the dominant representation for world models, with diffusion
      models and Transformers serving as the primary backbones.
    - Incorporating modality-specific information—actions, language, or physics cues—is
      essential to move beyond unconditional generation toward controllable world
      simulators.
    - Evaluation is expanding beyond visual quality to include spatial consistency,
      temporal coherence, and controllability, though no unified metric suite exists.
    - Pretraining on large-scale datasets (robotics, driving) is a common strategy
      to improve generalization, but the diversity of those datasets remains a bottleneck.
    disagreements:
    - 'How to inject physics: explicit auxiliary tasks like depth prediction and keypoint
      dynamics versus implicit learning through video–action diffusion.'
    - 'Generalization mechanism: compositional primitives vs. context-conditioned
      latent dynamics vs. mask reconstruction, each imposing different assumptions
      about what aspects of the world are reusable.'
    - 'Evaluation target: methods optimize for task performance (e.g., Atari human
      score, policy robustness) while benchmarks focus on diagnostic abilities (memory
      consistency, spatial accuracy) with no agreed-upon translation between the two.'
    - 'Interaction mode: some models assume a fixed action space (Atari, driving),
      while others learn from passive video with action-free data, creating a split
      between pure dynamics learning and policy-embedded world models.'
    open_questions:
    - What evidence is needed to show that a world model's predictions are physically
      reliable enough for real-world robot or vehicle execution?
    - How can long-term memory and spatial consistency be maintained in open-domain,
      continuously changing environments, and what metrics best capture this?
    - Do improvements on diagnostic benchmarks (e.g., LoopNav, MIND) lead to measurable
      gains in downstream task success, or are they orthogonal capabilities?
    - Can the strong assumptions of observable context or primitives be relaxed so
      that world models generalize to truly unseen dynamics without manual decomposition?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向具身视频生成的组合世界模型
      解决的问题: 通过将语言指令分解为原语并生成视频计划，实现对未见物体-动作组合的泛化；通过耦合视频与动作扩散支持多任务预训练。
      尚未覆盖: 泛化仅限于训练中见过的原语组合；无法保证视频的物理合理性超越视觉保真度；评估主要在仿真中进行，缺少真实机器人迁移证据。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 通过联合学习视频生成与时间深度预测、关键点动力学等物理相关任务，隐式编码物理属性，提高视觉真实感与运动合理性。
      尚未覆盖: 所学物理表示是否足以应对接触丰富的交互或分布外物体；缺乏对真实安全或操作结果的直接衡量。
    - 路线: 面向长时域与多视角预测的驾驶世界模型
      解决的问题: 利用扩散Transformer与掩码重建实现跨数据集（含零样本）的泛化场景预测，支持自动驾驶的长时域、多视角视频生成。
      尚未覆盖: 仿真收益与真实驾驶安全或策略改进之间的对齐尚未验证；缺乏多样化交通场景下的闭环评估。
