  related_work_outline:
  - 'Mainstream direction: Application-focused world models are consolidating around
    domain-specific generative dynamics for driving, robot task imagination, and interactive
    control, using diffusion transformers or recurrent state-space models conditioned
    on actions, language, physics, or context.'
  - 'Shared research pattern: Works jointly learn representation, future video/state
    generation, and policy or planning utility, then evaluate generalization on unseen
    scenes, tasks, contexts, or viewpoints rather than only reporting reconstruction
    quality.'
  - 'Key differences: Approaches differ in decomposition strategy, supervision signal,
    interaction mode, and deployment target, ranging from explicit language primitives
    to unified video-action diffusion and from simulation-only evaluation to large
    robot or driving datasets.'
  - 'Trend evolution: Within the 2023-2026 evidence, the field is moving from efficient
    model-based RL on Atari toward large-scale embodied and driving generation, and
    then toward open-domain benchmarks for memory, spatial consistency, and action
    control.'
  - 'Open questions: Cross-embodiment and sim-to-real transfer, downstream safety
    alignment, long-horizon memory/action consistency, and generalization beyond observed
    primitive, context, or scene combinations remain unresolved.'
  related_work_outline_zh:
  - 主流方向：应用领域的世界模型正在围绕驾驶、机器人任务想象和交互控制形成领域专用生成动力学，采用扩散Transformer或循环状态空间模型，并以动作、语言、物理或上下文为条件。
  - 研究共性：论文普遍联合学习表示、未来视频/状态生成与策略或规划用途，并在未见场景、任务、上下文或视角上评估泛化，而不只报告重建质量。
  - 关键差异：方法在分解策略、监督信号、交互模式和部署目标上不同，从显式语言原语到统一视频-动作扩散，从仅仿真评测到大规模机器人或驾驶数据集。
  - 趋势演进：在2023-2026年证据内，研究从Atari上的高效模型强化学习，转向大规模具身与驾驶生成，再转向记忆、空间一致性和动作控制的开放域基准。
  - 开放问题：跨本体与仿真到现实迁移、下游安全收益、长时记忆与动作一致性，以及超出已见原语、上下文或场景组合的泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot and embodied domains by conditioning
        video generation on language, physics, actions, or context to support task
        imagination and policy learning.
      what_remains_open: Whether gains transfer across embodiments, datasets, institutions,
        or physical environments; current evidence is largely simulation or fixed
        dataset validation.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view and long-horizon driving scene
        prediction, including mask-based reconstruction and cross-dataset zero-shot
        evaluation.
      what_remains_open: Alignment between driving video quality or simulator gains
        and real-world safety or operational outcomes remains undemonstrated.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in interactive environments such as Atari,
        Minecraft, and action-conditioned video settings to improve sample-efficient
        policy learning, spatial consistency, memory, and action control.
      what_remains_open: Generalization when environment rules, goals, user interactions,
        action spaces, or viewpoints change; benchmarks expose long-term memory and
        cross-action-space failures, but downstream transfer remains unverified.
    consensus:
    - World models are being specialized to application domains through domain-specific
      structure such as actions, language, physics, driving masks, or context variables.
    - Video generation and transformer-style sequence modeling have become common
      substrates for learning future dynamics and supporting planning or policy evaluation.
    - Evaluation increasingly emphasizes generalization to unseen scenes, tasks, contexts,
      or viewpoints beyond per-frame visual fidelity.
    - Benchmarks are emerging to measure consistency and controllability, not just
      generation quality.
    disagreements:
    - 'Decomposition strategy: some approaches factor generation into explicit language
      primitives, while others couple video and action diffusion in one unified model,
      and others condition a recurrent state-space model on context.'
    - 'Supervision signal: papers differ among self-supervised mask reconstruction,
      physics-informed auxiliary losses, and model-based reinforcement learning from
      imagined rollouts.'
    - 'Evaluation target: settings range from Atari and contextual control suites
      to driving datasets, large robot datasets, simulation-only robot tasks, and
      Minecraft or open-domain video benchmarks.'
    - 'Interaction mode: some evaluate open-loop video prediction, others closed-loop
      action-conditioned generation or policy execution, and some learn from action-free
      videos.'
    - 'Deployment setting: evidence includes real-world robot video pretraining and
      driving data, but many evaluations remain simulation-only, so physical transfer
      claims differ.'
    open_questions:
    - Does improved world-model generation or benchmark consistency transfer to real
      robot execution, driving safety, or other physical deployment outcomes?
    - Can current models maintain long-horizon memory consistency and action control
      across changing viewpoints and action spaces? Evidence shows this is a bottleneck
      but not yet solved.
    - What level of context, primitive, or scene coverage is needed before models
      generalize to unseen combinations and novel dynamics rather than interpolating
      between training conditions?
    - Are current metrics for spatial, memory, and action consistency sufficient proxies
      for downstream task success and physical plausibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人和具身领域，通过语言、物理、动作或上下文条件化视频生成，以支持任务想象和策略学习。
      尚未覆盖: 改进能否跨本体、数据集、机构或物理环境迁移仍未验证；现有证据主要来自仿真或固定数据集。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角、长时域驾驶场景预测，包括基于掩码的重建和跨数据集零样本评测。
      尚未覆盖: 驾驶视频质量或仿真收益与真实安全及运营结果之间的对齐关系尚未被证明。
    - 路线: 交互式智能体与游戏
      解决的问题: 在Atari、Minecraft和动作条件视频等交互环境中落地世界模型，以改善采样效率策略学习、空间一致性、记忆和动作控制。
      尚未覆盖: 环境规则、目标、用户交互、动作空间或视角变化时的泛化仍有限；基准揭示了长时记忆和跨动作空间失效，但下游迁移尚未验证。
    共识:
    - 世界模型正在通过动作、语言、物理、驾驶掩码或上下文变量等领域特定结构被专门化到具体应用。
    - 视频生成和Transformer式序列建模已成为学习未来动力学并支持规划或策略评估的常见基础。
    - 评测越来越强调对未见场景、任务、上下文或视角的泛化，而不再只看逐帧视觉质量。
    - 开始出现衡量一致性和可控性的基准，而不仅是生成质量。
    分歧:
    - 分解策略：有的把生成分解为显式语言原语，有的将视频与动作扩散耦合在统一模型中，还有的用上下文条件化循环状态空间模型。
    - 监督信号：分别侧重自监督掩码重建、物理信息辅助损失，以及基于想象轨迹的模型强化学习。
    - 评测目标：包括Atari和上下文控制套件、驾驶数据集、大规模机器人数据集、仅仿真机器人任务，以及Minecraft或开放域视频基准。
    - 交互模式：有的评测开环视频预测，有的评测闭环动作条件生成或策略执行；部分方法从无动作视频中学习。
    - 部署场景：部分证据来自真实机器人视频预训练和驾驶数据，但许多评测仍仅在仿真中，物理迁移主张存在差异。
    开放问题:
    - 世界模型生成或基准一致性的提升，能否迁移到真实机器人执行、驾驶安全或其他物理部署结果？
    - 当前模型能否在视角和动作空间变化下维持长时记忆一致性与动作控制？证据显示这是瓶颈，但尚未解决。
    - 需要多少上下文、原语或场景覆盖，模型才能泛化到未见组合和新动力学，而不是仅对训练条件插值？
    - 当前空间、记忆和动作一致性指标是否足以替代下游任务成功和物理合理性？
