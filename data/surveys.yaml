      尚未覆盖: 仿真或数据集收益与真实驾驶安全和运营结果之间的一致性证据不足。
    - 路线: 具身机器人世界模型与动作或语言条件生成
      解决的问题: 机器人视频合成、组合任务规划、视频-动作预训练及策略与动力学学习。
      尚未覆盖: 全新原语、真实机器人执行和跨本体迁移尚未充分验证。
    - 路线: 物理信息或一致性导向的世界模型
      解决的问题: 通过时间深度、关键点动力学或空间一致性提升视觉与物理合理性。
      尚未覆盖: 这些一致性信号与下游策略成功或长期记忆之间的关系仍不清楚。
    - 路线: 面向记忆、动作控制与空间一致性的基准
      解决的问题: 在开放交互场景中评测世界模型的可控性与时空一致性。
      尚未覆盖: 基准发现尚未普遍反哺建模改进，跨动作空间与长时域困难仍存在。
    - 路线: 上下文条件与高效模型型RL世界模型
