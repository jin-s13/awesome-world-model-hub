  related_work_outline_zh:
  - 主流方向：将世界模型应用于自动驾驶和机器人领域，以视频生成和基于模型的强化学习为核心，例如MaskGWM和RoboDreamer展示了领域特定的适配。
  - 研究共性：多数方法学习潜在动力学或扩散模型以进行未来视频/预测，并以动作或语言为条件，将生成与策略学习或数据增强相结合。
  - 关键差异：架构从基于RNN的RSSM到扩散Transformer不等；部分方法显式编码物理知识（深度、关键点），其他则纯数据驱动；评测目标从视频质量到闭环策略性能各异。
  - 趋势演进：从游戏环境（Atari）转向复杂具身任务（机器人、驾驶），从纯性能优化转向物理可信度；近期工作强调多任务预训练和上下文条件泛化。
  - 开放问题：真实世界部署中的安全性和可靠性，长时域预测的误差累积缓解，跨领域动力学迁移，以及机器人上实时运行的计算效率。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: generating multi-view driving videos, scene forecasting, and
        closed-loop simulation to support policy evaluation in autonomous driving.
      what_remains_open: alignment between simulator gains and real-world safety or
        operational outcomes, and generalization across different driving datasets
        and sensor configurations.
    - line: Embodied task and robotics world models
      what_it_solves: enabling video generation, physical reasoning, and policy learning
        for robotic manipulation, navigation, and other embodied tasks, supporting
        planning and data augmentation.
      what_remains_open: transferability of improvements across robot embodiments,
        physical environments, and tasks, and the fidelity of sim-to-real transfer
        in terms of physical consistency.
    - line: Interactive game and agent world models
      what_it_solves: achieving efficient exploration and policy learning in interactive
        environments with long horizons and sparse rewards by leveraging world models.
      what_remains_open: generalization when environment dynamics, game rules, or
        user interactions change, and the model's ability to maintain spatial consistency
        over long trajectories.
    consensus:
    - Generative models, especially diffusion models and variational autoencoders,
      are widely adopted to capture environment dynamics and predict future observations
      or latent states.
    - World models are commonly combined with reinforcement learning or imitation
      learning for policy training or data augmentation.
    - Recent works increasingly emphasize physical plausibility, using auxiliary tasks
      like depth prediction or keypoint dynamics to improve realism.
    - Multi-task pretraining on large datasets and conditioning on context such as
      language instructions are key strategies to improve generalization.
    disagreements:
    - 'Dynamics modeling: some use recurrent state-space models (RSSM) while others
      employ diffusion Transformers, leading to different trade-offs in long-term
      stability and efficiency.'
    - 'Physical constraints: some approaches explicitly learn physical knowledge (e.g.,
      depth, keypoints), while others rely solely on data-driven generation, affecting
      physical plausibility.'
    - 'Supervision signals: methods vary in using only video reconstruction, or combining
      video with actions, depth, or language, which influences the data types that
      can be exploited.'
    - 'Evaluation settings: different papers use different benchmarks, some focusing
      on video quality metrics in simulation, others on closed-loop policy performance,
      making direct comparison difficult.'
    - 'Interaction mode: some world models are designed for open-loop generation,
      others for closed-loop policy evaluation, imposing different requirements on
      the model.'
    open_questions:
    - What is the safety and reliability of world models in real-world deployment,
      particularly under long-term physical interaction and distribution shift?
    - How can error accumulation in long-horizon generation be effectively mitigated,
      as current methods often excel only in short-term predictions?
    - What mechanisms enable cross-domain transfer of learned dynamics, for example
      from simulation to reality or from games to robotics, and what benchmarks can
      systematically evaluate this?
    - How can the trade-off between generation quality and computational efficiency
      be balanced to make world models suitable for real-time execution on resource-constrained
      robotic platforms?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 生成多视角驾驶视频，进行场景预测和闭环仿真，支持自动驾驶策略评估。
      尚未覆盖: 仿真收益与真实安全或运营结果之间的一致性，以及跨不同驾驶数据集和传感器配置的泛化。
    - 路线: 具身任务与机器人世界模型
      解决的问题: 在机器人操作、导航等具身任务中实现视频生成、物理推理和策略学习，支持规划与数据增强。
      尚未覆盖: 改进在不同机器人本体、物理环境和任务之间的迁移能力，以及仿真到真实在物理一致性上的保真度。
    - 路线: 交互式游戏与智能体世界模型
      解决的问题: 在长时域和稀疏奖励的交互环境中，利用世界模型实现高效探索和策略学习。
      尚未覆盖: 环境动态、游戏规则或用户交互变化时的泛化，以及模型在长轨迹中维持空间一致性的能力。
    共识:
    - 生成模型，尤其是扩散模型和变分自编码器，被广泛用于捕获环境动态并预测未来观测或潜在状态。
    - 世界模型常与强化学习或模仿学习结合，用于策略训练或数据增强。
    - 近期工作越来越关注物理合理性，使用深度预测或关键点动力学等辅助任务来提升真实性。
    - 在大规模数据集上进行多任务预训练，并利用语言指令等上下文进行条件化，是提升泛化性的关键策略。
    分歧:
    - 动力学建模：部分使用循环状态空间模型（RSSM），另一些采用扩散Transformer，在长期稳定性和效率上有不同权衡。
    - 物理约束：部分方法显式学习物理知识（如深度、关键点），另一些则完全依赖数据驱动生成，影响物理合理性。
    - 监督信号：方法在仅使用视频重建，或结合视频与动作、深度、语言上存在差异，这影响了可利用的数据类型。
    - 评估设置：不同论文使用不同基准，有的侧重仿真中的视频质量指标，有的侧重闭环策略性能，难以直接比较。
    - 交互模式：部分世界模型用于开环生成，部分用于闭环策略评估，对模型提出不同要求。
    开放问题:
    - 世界模型在真实世界部署中的安全性和可靠性如何，特别是在长期物理交互和分布偏移下？
    - 如何有效缓解长时域生成中的误差累积，目前方法往往仅在短期预测中表现良好？
