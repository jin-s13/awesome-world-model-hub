    frameworks or interactive video world models that organize design choices (representation,
    prior, memory, control) and propose evaluation benchmarks, moving from scattered
    methods toward systematic taxonomies and roadmaps for specific domains such as
    autonomous driving, robotics, and general video generation.'
  - 'Shared research pattern: Survey papers build taxonomies by decomposing a world
    model into aspects like scene modality, state evolution, and internal mechanics,
    then identify cross-cutting challenges (action-conditioned controllability, long-horizon
    memory, responsiveness) and derive future directions, while method papers supply
    the capabilities being taxonomized.'
  - 'Key differences: One axis is the target domain—general video world models, interactive
    embodied settings, or autonomous driving—which shapes the emphasis on interactivity,
    latent structure, and physical fidelity. Another axis is the level of abstraction:
    some surveys focus on high-level concepts and benchmarks, while others propose
    detailed latent representation taxonomies and evaluation prescriptions without
    empirical validation.'
  - 'Trend evolution: Within the 2022–2026 span, the topic has shifted from isolated
    world-model applications (e.g., DayDreamer on physical robots) to a surge of survey
    and framework papers in 2024–2026 that systematize design spaces, compare benchmarks,
    and articulate open challenges, indicating a maturing field that is building shared
    vocabulary and evaluation standards.'
  - 'Open questions: How to prioritize the mapped open problems when evaluation frameworks
    are not yet empirically validated; whether the proposed taxonomies truly cover
    emerging methods or remain bounded by the scope of reviewed literature; and how
    to bridge the gap between domain-specific world-model taxonomies and a general
    cross-domain understanding of world simulation.'
  related_work_outline_zh:
  - 主流方向：文献正汇聚于统一的潜在空间框架或交互式视频世界模型，这些工作将设计选择（表示、先验、记忆、控制）组织起来，并提出评测基准，从散点式方法走向自动驾驶、机器人、通用视频生成等领域的系统化分类体系与路线图。
  - 研究共性：综述论文通过将世界模型分解为场景模态、状态演化、内部机制等维度来构建分类，进而识别跨领域挑战（动作条件可控性、长时域记忆、响应性），并推导未来方向；方法论文则提供被分类的能力例证。
  - 关键差异：一是目标领域——通用视频世界模型、交互式具身场景或自动驾驶，这决定了在交互性、潜在结构、物理保真度上的侧重；二是抽象层次：部分综述聚焦高层概念与基准比较，另一些则提出详细的潜在表示分类法和评估方案，但缺乏实证验证。
  - 趋势演进：在2022–2026年间，该主题从孤立的世界模型应用（如DayDreamer在物理机器人上）转向2024–2026年涌现的综述与框架论文，它们系统化设计空间、比较基准并阐明开放挑战，表明领域正走向成熟，构建共享词汇和评估标准。
  - 开放问题：在评估框架尚未经实证验证的情况下如何对已映射的开放问题排序；所提出的分类法是否能真正覆盖新兴方法，还是受限于综述文献的范围；如何弥合特定领域世界模型分类法与跨领域通用世界模拟理解之间的鸿沟。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented progress in world models by proposing unified
        frameworks that categorize design choices (e.g., latent representations, structural
        priors, interaction modes) and articulate future research directions, turning
        scattered methods into a structured landscape.
      what_remains_open: The taxonomies are largely theoretical and lack systematic
        empirical validation of whether the proposed categories and roadmaps capture
        the full diversity of existing work; coverage is limited by the rapid pace
        of the field, and the synthesis often relies on selective examples rather
        than exhaustive evidence.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes and contrasts existing benchmarks and metrics across
        application domains (open-world exploration, game engines, autonomous driving,
        robotics) to highlight evaluation gaps and propose new evaluation suites,
        such as closed-loop metrics or resource-aware costs.
      what_remains_open: The proposed evaluation frameworks are not yet implemented
        or tested; the comparability of results across different settings (e.g., simulation
        vs. real-world, open-loop vs. closed-loop metrics) remains unverified, and
        the sensitivity of conclusions to metric choice is not analyzed.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into concrete technical challenges—like
        action-conditioned controllability, long-horizon memory, real-time responsiveness,
        and out-of-sight dynamics—and identifies missing capabilities that future
        work should address.
      what_remains_open: No evidence-based prioritization of which gaps matter most
        for progress; the identified challenges are based on current trends and may
        miss fundamental bottlenecks that emerge from scaling or from real-world deployment
        constraints.
    consensus:
    - Video generation is a central substrate for world models, and enabling action-conditioned,
      long-horizon, and interactive capabilities is a shared goal.
    - A universal taxonomy or evaluation framework is needed to compare methods, but
      no single framework has been empirically validated across domains.
    - Current world models still lack persistent, physically consistent simulation
      of dynamic entities that evolve even when unobserved, and addressing this is
      a key frontier.
    - Real-time interactivity and long-term memory are both critical and often trade
      off against each other, requiring new architectural solutions.
    disagreements:
    - 'The level of representation abstraction varies: some surveys advocate for latent-space
      frameworks with explicit structural priors (geometry, topology, semantics),
      while others focus on end-to-end video generation without disentangling internal
      representations.'
    - 'Evaluation targets differ: some works emphasize closed-loop planning metrics
      and decision-readiness, others prioritize visual fidelity and temporal consistency,
      and a few demand real-time interaction latency.'
    - The scope of the survey creates different emphases—general world models for
      video simulation versus domain-specific models for autonomous driving or robotics—which
      leads to different taxonomies and challenge definitions that are not directly
      comparable.
    - Whether a world model must be an explicit simulator or can emerge as a generative
      video model remains an open contention, with some surveys treating Sora-like
      models as world simulators and others requiring more structured latent dynamics.
    open_questions:
    - How can we empirically validate that a taxonomy or evaluation framework truly
      captures the design space and predicts future advances, rather than merely reflecting
      the authors' prior knowledge?
    - What is the minimal set of metrics that can reliably compare world models across
      different domains and interaction modes without overfitting to a specific benchmark?
    - How should the community prioritize the long list of open challenges—such as
      compositional generalization, out-of-sight dynamics, and real-time memory—when
      computational and experimental resources are limited?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 通过提出统一框架来组织世界模型的碎片化进展，将设计选择（如潜在表示、结构先验、交互模式）分类，并阐明未来研究方向，将散点式方法转化为结构化图景。
      尚未覆盖: 这些分类法主要停留在理论层面，缺乏系统性的实证验证，以证明所提出的类别和路线图是否真正涵盖现有工作的多样性；覆盖范围受领域快速发展的限制，综合往往依赖选择性示例而非穷尽证据。
    - 路线: 对比评测综合
      解决的问题: 总结并对比不同应用领域（开放世界探索、游戏引擎、自动驾驶、机器人）的现有基准和指标，揭示评测缺口，并提出新的评测套件，如闭环度量或资源感知成本。
      尚未覆盖: 所提出的评估框架尚未实施或测试；不同设置（如仿真 vs. 真实、开环 vs. 闭环指标）下结果的可比性未经验证，且结论对指标选择的敏感性未分析。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体的技术挑战——如动作条件可控性、长时域记忆、实时响应性和视线外动态——并识别未来工作应弥补的缺失能力。
      尚未覆盖: 尚无基于证据的优先级排序，以说明哪些缺口对进展最重要；识别的挑战基于当前趋势，可能遗漏由规模化或真实部署约束带来的根本性瓶颈。
    共识:
    - 视频生成是世界模型的核心基座，实现动作条件、长时域和交互能力是共同目标。
    - 需要统一的分类法或评估框架来比较方法，但尚无任何框架在跨领域上得到实证验证。
    - 当前世界模型仍缺乏对即使未被观察也持续演化的动态实体的持久、物理一致的模拟，解决这一问题是关键前沿。
    - 实时交互性和长期记忆同等关键且常相互权衡，需要新的架构方案。
    分歧:
    - 表示抽象层次不同：一些综述主张具有显式结构先验（几何、拓扑、语义）的潜在空间框架，而另一些则聚焦端到端视频生成，不解耦内部表示。
    - 评测目标不同：一些工作强调闭环规划指标和决策就绪度，另一些优先视觉保真度和时间一致性，还有些要求实时交互延迟。
    - 综述的覆盖范围导致不同侧重——通用视频模拟世界模型 vs. 自动驾驶或机器人专用模型——由此产生不易直接比较的分类法和挑战定义。
    - 世界模型是否必须是一个显式模拟器，还是可以作为生成式视频模型涌现，仍然存在争议：一些综述将Sora类模型视为世界模拟器，而另一些则要求更结构化的潜在动力学。
    开放问题:
    - 如何实证验证一个分类法或评估框架真正捕捉了设计空间并能预测未来进展，而非仅仅反映作者已有的知识？
    - 在不针对特定基准过拟合的前提下，能够可靠比较不同领域和交互模式下世界模型的最小指标集是什么？
    - 在计算和实验资源有限的情况下，社区应如何对长串的开放挑战（如组合泛化、视线外动态、实时记忆）进行优先级排序？
