    ego-trajectories, or persistent global state, then evaluates on targeted benchmarks
    or simulation.'
  - 'Key differences: Methods differ in representation (factorized language primitives
    vs continuous latent spaces vs persistent 3D/4D state vs multimodal ego/road inputs),
    supervision signals, and deployment focus (robot manipulation, driving simulation,
    open-ended video).'
  - 'Trend evolution: From application-specific driving world models in 2023, to compositional
    robot imagination and broad Sora-centered surveys in 2024, to ego-vision/road
    and open-source real-time systems plus driving taxonomies in 2025-2026.'
  - 'Open questions: Whether proposed taxonomies and evaluation frameworks have empirical
    validation, which closed-loop metrics are comparable across settings, and how
    far models generalize beyond seen primitives, entities, or simulation-only evidence.'
  related_work_outline_zh:
  - 主流方向：证据集中在世界模型，尤其是面向具身智能与自动驾驶的生成式视频世界模型，综述/分类工作试图统一设计选择与评估。
  - 研究共性：工作将世界模拟形式化为条件未来帧或视频生成，并通过语言原语、潜在表示、自我轨迹或持久全局状态添加结构，再在目标基准或仿真上评估。
  - 关键差异：方法在表示（分解语言原语、连续潜在空间、3D/4D持久状态、多模态自我/道路输入）、监督信号与部署重点（机器人操作、驾驶仿真、开放视频）上不同。
  - 趋势演进：从2023年面向驾驶仿真的应用型世界模型，到2024年组合式机器人想象与围绕Sora的综述，再到2025-2026年自我视觉/道路、开源实时系统与驾驶分类框架。
  - 开放问题：所提分类法与评估框架是否获得实证验证，哪些闭环指标在不同设置下可比，以及模型能否泛化到未见原语、实体或超越仿真证据。
  literature_review:
    line_of_work_matrix:
    - line: General world-model survey and simulator assessment
      what_it_solves: Maps video generation, autonomous driving, and autonomous agents
        into a common world-model umbrella and evaluates simulation capability claims.
      what_remains_open: The survey-level challenges and limitations are not detailed,
        and simulation claims are not verified by a standardized benchmark in the
        abstract.
    - line: Taxonomy and evaluation framework synthesis for driving world models
      what_it_solves: Organizes latent-representation choices and structural priors
        into a unified design space for automated-driving world models and proposes
        closed-loop evaluation.
      what_remains_open: The framework remains theoretical with no empirical validation,
        implementation, or test of the proposed metrics.
    - line: Compositional video world models for robot imagination
      what_it_solves: Uses language-composed primitives to generate video plans that
        generalize to unseen combinations of objects and actions for robot execution
        in simulation.
      what_remains_open: Generalization is limited to seen primitive combinations,
        depends on accurate language parsing, and lacks real-robot evaluation.
    - line: Persistent and real-time video world-model systems
      what_it_solves: Adds a persistent global state or long-term memory to simulate
        out-of-sight dynamics and support long-horizon, low-latency generation.
      what_remains_open: Evidence for limitations, generalization beyond active entities,
        and benchmark adoption is incomplete in the packet.
    - line: Ego-vision and road-centric multimodal world models for autonomy
      what_it_solves: Builds controllable future-frame synthesis with ego-motion,
        object dynamics, spatial-temporal road imagery, and georeferencing for autonomous
        agents.
      what_remains_open: Reported results focus on specific datasets and metrics;
        cross-setting compatibility and deployment evidence need further validation.
    consensus:
    - World models are treated as generative simulators producing future observations
      conditioned on language, action, scene, or trajectory inputs.
    - Adding structure improves controllability and generalization.
    - Evaluation is increasingly tied to specialized benchmarks or datasets that target
      long-horizon consistency, controllability, or spatial-temporal reasoning.
    - Embodied robot control and autonomous driving are central application fields.
    disagreements:
    - 'Representation choices differ: factorized language primitives, continuous latent
      spaces, discrete/hybrid latent actions, persistent 3D/4D global state, and multimodal
      ego/road inputs.'
    - 'Supervision and control signals differ: language instructions and goal images,
      ego-trajectory and human pose, destination and personality, or action and state
      nodes.'
    - 'Evaluation targets differ: simulation execution success, georeferencing, object
      control metrics, video realism, or closed-loop driving metrics.'
    - 'Deployment and transparency differ: some systems provide open-source real-time
      access, while others report simulation-only evidence or lack missing-detail
      disclosures.'
    open_questions:
    - How can taxonomies and evaluation frameworks be empirically validated without
      conflating conceptual coverage with benchmark performance?
    - Which closed-loop metrics are comparable across world models with different
      action spaces, latent representations, and deployment settings?
    - How far can compositional or persistent-state world models generalize beyond
      seen primitives, entities, and environments, especially to real-world deployment?
    - Are current benchmarks sufficient for out-of-sight dynamics, minute-level consistency,
      fine-grained control, and real-robot execution?
    - Which verification gaps remain because code, datasets, baselines, limitations,
      or standardized metrics are not fully documented in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用世界模型综述与模拟器评估
      解决的问题: 将视频生成、自动驾驶和自主智能体归入统一的世界模型框架，并评估模拟能力声明。
      尚未覆盖: 挑战与局限在摘要中未详细展开，模拟能力未被标准化基准在摘要中系统验证。
    - 路线: 自动驾驶世界模型的分类与评估框架综合
      解决的问题: 将潜在表示选择和结构先验组织为统一设计空间，并提出面向自动驾驶世界模型的闭环评估方案。
      尚未覆盖: 框架仍是理论性的，缺少实证验证、实现或对提出指标的测试。
    - 路线: 面向机器人想象的组合式视频世界模型
      解决的问题: 利用语言组合原语生成视频计划，在仿真中泛化到未见物体和动作组合并支撑机器人执行。
      尚未覆盖: 泛化受限于训练中见过的原语组合，依赖语言解析准确性，缺少真实机器人评估。
    - 路线: 持久实时视频世界模型系统
      解决的问题: 通过持久全局状态或长期记忆模拟视线外动态，并支持长时程、低延迟生成。
      尚未覆盖: 关于局限、超出活动实体的泛化以及基准采用情况，在证据包中仍不完整。
    - 路线: 面向自主性的自我视觉与道路多模态世界模型
      解决的问题: 结合自我运动、物体动态、时空道路图像和地理参考，实现可控未来帧合成和时空推理。
      尚未覆盖: 结果依赖特定数据集和指标；跨设置兼容性与部署证据仍需进一步验证。
    共识:
    - 世界模型被视为生成式模拟器，根据语言、动作、场景或轨迹输入产生未来观测。
    - 结构化设计可改善可控性和泛化性。
    - 评估越来越多地与专用基准或数据集关联，以覆盖长时程一致性、可控性或时空推理。
    - 具身机器人控制和自动驾驶是主要应用领域。
    分歧:
    - 表示选择不同：分解语言原语、连续潜在空间、离散/混合潜在动作、持久3D/4D全局状态以及多模态自我/道路输入。
    - 监督与控制信号不同：语言指令和目标图像、自我轨迹和人体姿态、目的地和个体特征，或动作与状态节点。
    - 评测目标不同：仿真执行成功率、地理参考、物体控制指标、视频真实感或闭环驾驶指标。
    - 部署与透明度不同：部分系统提供开源实时访问，其他仅报告仿真证据或缺少缺失细节披露。
    开放问题:
    - 如何在不把概念覆盖与基准性能混为一谈的前提下，实证验证分类法和评估框架？
    - 在动作空间、潜在表示和部署设置不同的世界模型之间，哪些闭环指标可比？
    - 组合式或持久状态世界模型能在多大程度上泛化到未见原语、实体和环境，尤其是真实世界部署？
    - 当前基准是否足以覆盖视线外动态、分钟级一致性、细粒度控制和真实机器人执行？
    - 由于代码、数据集、基线、局限或标准化指标在证据包中未完整记录，仍有哪些验证缺口？
