    - 评测目标不同：Atari或CARL上的强化学习任务表现，相对驾驶场景预测、机器人操作或策略学习，以及记忆/空间一致性诊断。
    - 交互模式不同：开环视频预测和想象，相对闭环动作条件控制与可复现开放域导航。
    - 部署场景不同：仅仿真机器人或游戏评测，相对大规模真实机器人数据预训练或跨数据集驾驶验证。
