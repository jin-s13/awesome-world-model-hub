  related_work_outline:
  - 'Mainstream direction: Building general-purpose world models by integrating video
    generation with action, language, and physics priors, using diffusion transformers
    or VAEs, and pretraining on large-scale multimodal datasets for robotics and autonomous
    driving.'
  - 'Shared research pattern: Injecting structural or physical knowledge (e.g., depth,
    keypoints, scene graphs, mask reconstruction) into generative world models to
    improve visual fidelity, long-term consistency, and downstream task performance.'
  - 'Key differences: Architectures split between diffusion-based models (favoring
    high-quality generation) and VAE-based recurrent models (favoring efficient latent
    dynamics), while supervision signals range from explicit physics labels to self-supervised
    reconstruction, and evaluation targets vary from policy performance to spatial
    and memory consistency.'
  - 'Trend evolution: From early efficient RL world models on Atari (2023) to recent
    physics-informed and unified action-video diffusion models on large robotic datasets
    (2025–2026), with a growing emphasis on rigorous benchmarks for memory, control,
    and physical plausibility.'
  - 'Open questions: Whether the gains come from the model architecture or from scale
    and data; how to achieve long-term memory consistency without explicit memory
    modules in open-domain settings; and how to isolate the contribution of the world
    model versus the planner or controller.'
  related_work_outline_zh:
  - 主流方向：构建通用的世界模型，通过扩散Transformer或VAE整合视频生成与动作、语言和物理先验，并在大规模多模态数据集上预训练，用于机器人和自动驾驶。
  - 研究共性：将结构化或物理知识（如深度、关键点、场景图、掩码重建）注入生成式世界模型，以提升视觉保真度、长期一致性和下游任务表现。
  - 关键差异：以扩散模型为主（高生成质量）与以VAE循环模型为主（高效潜在动力学）的架构之分；监督信号从显式物理标签到自监督重建各不相同；评测目标在策略性能、空间一致性、记忆一致性之间各有侧重。
  - 趋势演进：从2023年Atari上的高效RL世界模型，发展到2025–2026年物理信息驱动的统一动作-视频扩散模型，并越来越重视记忆、控制和物理合理性的严格基准评测。
  - 开放问题：性能提升究竟来自模型架构还是来自数据规模与预训练；如何在开放域无显式记忆模块的情况下实现长期记忆一致性；以及如何分离世界模型与规划器/控制器的贡献。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model concepts into concrete architectures, losses,
        and training recipes, such as mask reconstruction with diffusion (MaskGWM),
        VAE-Transformer hybrids (STORM), physics-informed joint learning (RoboScape),
        and coupled video-action diffusion (UWM).
      what_remains_open: Which representation choices (e.g., diffusion vs. VAE, explicit
        physics vs. self-supervised priors) transfer beyond the reported task family,
        and how to design objectives that balance generation quality, efficiency,
        and generalizability.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to intervention, planning, and decision-time
        interfaces, e.g., compositional video plans from language primitives (RoboDreamer),
        flexible policy/dynamics representation via modality-specific diffusion timesteps
        (UWM), and training policies on world-model dreams for zero-shot generalization
        (cRSSM).
      what_remains_open: How much of the performance gain comes from the world model
        versus the planner, controller, or task prior; and whether the proposed interfaces
        guarantee safe execution in real-world settings.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects through benchmarks that evaluate spatial consistency
        (LoopNav) and memory consistency with action control (MIND).
      what_remains_open: Whether current benchmarks isolate the method's contribution
        from surrounding system choices, and how to standardize evaluation protocols
        across diverse domains (driving, robotics, gaming) to fairly compare representational
        and control capabilities.
    consensus:
    - Integrating multiple modalities (video, action, language) into world models
      improves generalization and downstream task performance.
    - Incorporating explicit physical or structural priors (depth, keypoints, scene
      graphs) enhances the realism and long-term consistency of generated videos.
    - Large-scale pretraining on diverse robotic or driving datasets is becoming a
      standard practice to boost robustness and generalization.
    - Evaluation must go beyond pixel-level fidelity and include metrics for temporal
      coherence, spatial consistency, memory, and action controllability.
    disagreements:
    - 'Architectural backbone: diffusion-based models (MaskGWM, UWM, RoboDreamer)
      prioritize high-quality video generation, while VAE-based recurrent models (STORM,
      cRSSM) emphasize efficient latent dynamics learning and policy training.'
    - 'Supervision signal: some works rely on explicit physics labels such as depth
      or keypoints (RoboScape), others use self-supervised mask reconstruction (MaskGWM),
      compositional language primitives (RoboDreamer), or joint video-action diffusion
      without explicit physics (UWM).'
    - 'Evaluation target: one set of works focuses on video generation fidelity (MaskGWM,
      RoboScape), another on policy performance or zero-shot generalization (cRSSM,
      STORM), and a third on rigorous benchmark metrics for spatial and memory consistency
      (LoopNav, MIND).'
    - 'Interaction mode: closed-loop evaluation with action control (MIND) versus
      open-loop video prediction without considering downstream decision-making (MaskGWM).'
    open_questions:
    - Can the benefits of physics-informed learning be scaled to diverse, unstructured
      real-world environments without expensive physics annotations?
    - Does the coupling of video and action diffusion in a single transformer introduce
      modality conflicts that limit the quality of policy learning compared to separate
      models?
    - How can long-term memory consistency be maintained in open-domain world models
      without explicit memory architectures, as current benchmarks reveal significant
      challenges?
    - Are the reported improvements in zero-shot generalization and policy robustness
      primarily due to novel architectural components or to the scale of pretraining
      data and compute?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念转化为具体架构、损失和训练配方，例如用掩码重建与扩散结合（MaskGWM）、VAE-Transformer混合（STORM）、物理信息联合学习（RoboScape）以及视频-动作耦合扩散（UWM）。
      尚未覆盖: 哪些表示选择（如扩散 vs. VAE、显式物理 vs. 自监督先验）能迁移到报告任务族之外，以及如何设计能平衡生成质量、效率与泛化性的目标函数。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，例如从语言原语组合生成视频计划（RoboDreamer）、通过模态特定扩散时间步灵活表示策略/动力学（UWM），以及在世界模型梦境上训练策略以实现零样本泛化（cRSSM）。
      尚未覆盖: 性能提升有多少来自世界模型本身，而不是规划器、控制器或任务先验；以及所提出的接口能否保证真实环境中的安全执行。
    - 路线: 方法证据与消融协议
      解决的问题: 通过评估空间一致性（LoopNav）以及记忆一致性与动作控制（MIND）的基准，分离方法贡献与数据集、基线和指标等实现因素。
      尚未覆盖: 当前基准是否真正隔离了方法贡献，以及如何在不同领域（驾驶、机器人、游戏）中标准化评估协议，以公平比较表示能力和控制能力。
    共识:
    - 将多种模态（视频、动作、语言）整合到世界模型中能提升泛化性和下游任务表现。
    - 引入显式的物理或结构化先验（深度、关键点、场景图）能增强生成视频的逼真度和长期一致性。
    - 在大规模多样化机器人或驾驶数据集上预训练正成为提升鲁棒性和泛化性的标准做法。
    - 评估必须超越像素级保真度，纳入时间连贯性、空间一致性、记忆和动作可控性等指标。
    分歧:
    - 架构主干：基于扩散的模型（MaskGWM、UWM、RoboDreamer）优先考虑高质量视频生成，而基于VAE的循环模型（STORM、cRSSM）则强调高效潜在动力学学习和策略训练。
    - 监督信号：部分工作依赖显式物理标签如深度或关键点（RoboScape），其他则使用自监督掩码重建（MaskGWM）、组合语言原语（RoboDreamer）或无显式物理的联合视频-动作扩散（UWM）。
    - 评测目标：一组工作聚焦于视频生成保真度（MaskGWM、RoboScape），另一组关注策略性能或零样本泛化（cRSSM、STORM），第三组则致力于空间和记忆一致性的严格基准指标（LoopNav、MIND）。
    - 交互模式：带动作控制的闭环评估（MIND）与不考虑下游决策的开环视频预测（MaskGWM）之间的差异。
    开放问题:
    - 物理信息学习的好处能否在不依赖昂贵物理标注的情况下，扩展到多样化的非结构化真实环境？
    - 在单个Transformer中耦合视频和动作扩散是否会引入模态冲突，从而限制策略学习质量？
    - 如何在开放域世界模型中无需显式记忆架构即可维持长期记忆一致性，而当前基准揭示这仍是一个重大挑战？
    - 零样本泛化和策略鲁棒性的提升主要归因于新颖的架构组件，还是归因于预训练数据和计算规模的扩大？
