  related_work_outline:
  - 'Mainstream direction: World models are being integrated into domain-specific
    decision-making and simulation pipelines, with a strong focus on robotics, autonomous
    driving, and interactive games. Generative architectures—especially diffusion
    models and Transformers—are the dominant backbone for video prediction and policy
    learning.'
  - 'Shared research pattern: Most works learn a latent dynamics model from visual
    observations in a self-supervised manner, then use the model to generate imagined
    rollouts for policy training, planning, or evaluation. The world model acts as
    a learned simulator that captures environment regularities.'
  - 'Key differences: Representations vary from recurrent state-space models to diffusion
    Transformers. Supervision signals include pixel-level reconstruction, masked token
    prediction, and physics-informed losses. Some models embed actions directly in
    the dynamics, while others decouple video generation from action prediction. Evaluation
    domains (driving, robot manipulation, games) impose distinct sensory and action
    constraints.'
  - 'Trend evolution: From 2023 to 2026, the focus shifts from sample-efficient RL
    on Atari to more complex embodied tasks and autonomous driving scenarios. Diffusion-based
    world models and unified framing of video and action generation become more prevalent,
    and there is growing attention to benchmarking memory, spatial consistency, and
    physical plausibility.'
  - 'Open questions: Can long-term memory and spatial consistency be maintained in
    open-world environments with evolving scene layouts? Do improvements on simulation
    benchmarks transfer to real-world safety and task success? How can world models
    handle unseen physical interactions or radical changes in action spaces without
    catastrophic forgetting?'
  related_work_outline_zh:
  - 主流方向：将世界模型集成到领域特定的决策与仿真管线中，重点在机器人、自动驾驶和交互式游戏。生成式架构（尤其是扩散模型和Transformer）是视频预测与策略学习的主要基础。
  - 研究共性：多数工作从视觉观测中以自监督方式学习潜在动力学模型，随后利用该模型生成想象轨迹以进行策略训练、规划或评估。世界模型充当一个学习到的、捕获环境规律的仿真器。
  - 关键差异：表示方式从循环状态空间模型到扩散Transformer不等。监督信号包括像素级重建、掩码token预测和物理信息损失。部分模型将动作直接嵌入动力学，另一些则将视频生成与动作预测解耦。评估领域（驾驶、机器人操作、游戏）施加了不同的传感与动作约束。
  - 趋势演进：2023至2026年间，焦点从Atari上的样本高效强化学习转向更复杂的具身任务和自动驾驶场景。基于扩散的世界模型以及视频与动作生成的统一框架愈发普遍，对记忆、空间一致性和物理合理性的基准测试也受到更多关注。
  - 开放问题：在开放世界环境中，世界模型能否在场景布局变化时保持长期记忆和空间一致性？仿真基准上的改进能否迁移到真实世界的安全性和任务成功率？世界模型如何处理未见过的物理交互或动作空间剧烈变化，而不发生灾难性遗忘？
  literature_review:
    line_of_work_matrix:
    - line: Driving world models with diffusion Transformers
      what_it_solves: Enables long-horizon, multi-view video prediction for autonomous
        driving scenes, combining generation loss with mask reconstruction to improve
        visual fidelity and generalization across datasets.
      what_remains_open: No evidence that the simulator gains translate to real-world
        driving safety or decision-making metrics; robustness to out-of-distribution
        road geometries and weather conditions is not verified.
    - line: Latent state-space world models for sample-efficient RL
      what_it_solves: Learns a compact latent dynamics model from pixels and uses
        imagined rollouts to train policies, achieving strong results on Atari and
        contextual RL benchmarks with limited environment interactions.
      what_remains_open: Assumes observability of context variables; evaluation is
        limited to a narrow set of benchmark tasks, and performance on high-dimensional
        continuous control like dexterous manipulation remains unexplored.
    - line: Compositional and physics-informed world models for robotics
      what_it_solves: Generates robot action plans or video fantasies by decomposing
        language instructions into primitives, incorporating physics knowledge, or
        jointly diffusing video and actions; aims to improve generalization to unseen
        goal combinations and physical plausibility of generated motions.
      what_remains_open: Generalization is bounded by primitive combinations seen
        during training; reliance on accurate language parsing; no reported deployment
        on real robots outside simulation, leaving the sim-to-real gap unaddressed.
    - line: Benchmarks for memory, spatial consistency, and action control in world
        models
      what_it_solves: Provides standardized datasets and evaluation protocols (loop
        navigation, scene graph consistency, memory and action control metrics) to
        measure long-term coherence and control responsiveness of world models.
      what_remains_open: The correlation between benchmark scores and downstream task
        performance (e.g., policy learning, planning success) is not established;
        benchmark scenarios are limited to a few simulated environments and may not
        cover the diversity of real-world applications.
    consensus:
    - World models for applications are predominantly video-based generative models
      that learn environment dynamics in a self-supervised manner.
    - There is a shared assumption that a learned world model can serve as a surrogate
      for real environment interactions, improving sample efficiency or enabling planning.
    - Common evaluation metrics focus on visual fidelity (e.g., FVD, LPIPS) and downstream
      task success rate, with a growing awareness that pixel-level metrics are insufficient
      to capture physical plausibility or long-term consistency.
    disagreements:
    - 'Representation choice: recurrent state-space models (e.g., Dreamer variants)
      emphasize compact latent dynamics and sample efficiency, while diffusion Transformers
      (e.g., MaskGWM, UWM) prioritize high-fidelity video generation and scalability.'
    - 'Supervision signal: some methods use only reconstruction loss, others incorporate
      mask reconstruction, physics-informed losses, or action prediction as auxiliary
      objectives, leading to different trade-offs between visual quality and physical
      consistency.'
    - 'Action integration: one line of work treats actions as conditional inputs to
      the video generation model, another jointly diffuses video and action tokens
      within a unified framework, and a third decouples video generation from action
      inference entirely.'
    - 'Evaluation setting: driving models are tested on held-out geographic datasets,
      game models on Atari or Minecraft, and robot models on manipulation datasets;
      the lack of a common evaluation protocol makes direct comparison across domains
      difficult.'
    open_questions:
    - How can world models maintain spatial and memory consistency over long horizons
      in open-world environments where the scene content changes dynamically?
    - What is the relationship between improved video generation quality (e.g., FID,
      FVD) and actual task-level performance in planning or policy learning?
    - Can world models trained on diverse robot datasets generalize to novel physical
      interactions not represented in the training data, and what inductive biases
      are necessary for such generalization?
    - Do the current benchmarks for memory and action control predict real-world deployment
      success, or are they limited to the specific simulation environments used?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散Transformer的驾驶世界模型
      解决的问题: 利用生成损失与掩码重建相结合，实现自动驾驶场景的长时域、多视角视频预测，提升视觉保真度和跨数据集泛化能力。
      尚未覆盖: 缺乏证据表明仿真收益能转化为真实驾驶安全或决策指标；对分布外道路几何和天气条件的鲁棒性未经验证。
    - 路线: 基于潜在状态空间模型的样本高效强化学习
      解决的问题: 从像素中学习紧凑的潜在动力学模型，并通过想象轨迹训练策略，在Atari和上下文强化学习基准上以有限的环境交互取得优异表现。
      尚未覆盖: 假设上下文变量可观测；评估仅限于少量基准任务，未探索高维连续控制（如灵巧操作）上的性能。
    - 路线: 面向机器人的组合式与物理信息世界模型
      解决的问题: 通过将语言指令分解为原语、融入物理知识或联合扩散视频与动作，生成机器人动作计划或视频想象，旨在提升对未见目标组合的泛化能力和生成动作的物理合理性。
      尚未覆盖: 泛化受限于训练中见过的原语组合；依赖准确的语言解析；未在真实机器人上部署验证，仿真到现实的差距未解决。
    - 路线: 面向世界模型记忆、空间一致性与动作控制的基准
      解决的问题: 提供标准化数据集和评估协议（循环导航、场景图一致性、记忆与动作控制指标），用于衡量世界模型的长期连贯性和控制响应能力。
      尚未覆盖: 基准分数与下游任务性能（如策略学习、规划成功率）之间的关联尚未建立；基准场景局限于少数仿真环境，可能无法覆盖真实应用的多样性。
    共识:
    - 应用领域的世界模型主要是基于视频的生成模型，以自监督方式学习环境动力学。
    - 存在一个共同假设，即学习到的世界模型可以作为真实环境交互的替代品，从而提升样本效率或支持规划。
    - 常用评估指标集中于视觉保真度（如FVD、LPIPS）和下游任务成功率，但日益认识到像素级指标不足以捕捉物理合理性或长期一致性。
    分歧:
    - 表示选择：循环状态空间模型（如Dreamer变体）强调紧凑的潜在动力学和样本效率，而扩散Transformer（如MaskGWM、UWM）优先考虑高保真视频生成和可扩展性。
    - 监督信号：一些方法仅使用重建损失，另一些则引入掩码重建、物理信息损失或动作预测作为辅助目标，导致视觉质量与物理一致性之间的不同权衡。
    - 动作整合：一类方法将动作作为视频生成模型的条件输入，另一类在统一框架中联合扩散视频和动作token，第三类则将视频生成与动作推理完全解耦。
    - 评估设置：驾驶模型在留出的地理数据集上测试，游戏模型在Atari或Minecraft上测试，机器人模型在操作数据集上测试；缺乏统一的评估协议使得跨领域直接比较困难。
    开放问题:
