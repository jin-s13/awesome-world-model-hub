  related_work_outline_zh:
  - 主流方向：世界模型应用正在走向以动作、语言、上下文或物理为条件的领域化视频预测，主要面向机器人、自动驾驶和交互式智能体；同时出现面向记忆、空间一致性和动作控制的闭环基准。
  - 研究共性：多数方法从视觉轨迹学习预测模型，将生成目标与领域信号结合，并在强调长时域、零样本或一致性的数据集与基准上验证。
  - 关键差异：领域知识注入方式不同，包括视觉掩码重建、语言原语组合、物理信息深度/关键点监督、上下文潜在条件化，以及视频-动作耦合扩散；评测目标也从像素保真度延伸到策略迁移和基准一致性。
  - 趋势演进：在现有证据内，前沿从Atari/Dreamer式策略学习与上下文RL，转向2024-2026年的具身机器人视频生成、驾驶世界模型和Minecraft/open-domain记忆基准。
  - 开放问题：视觉保真度与仿真指标能否迁移到真实安全与任务成功；如何在长时域和多样动作空间中保持记忆与控制；组合式和上下文泛化能否扩展到未见原语与上下文之外。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and contextual control tasks
        with domain-specific states, actions, language goals, and physical constraints.
      what_remains_open: Transfer across embodiments, datasets, and physical environments;
        assumptions of observable context or predefined language primitives remain
        under-verified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Multi-view, long-horizon scene prediction and zero-shot driving
        video generation from driving datasets.
      what_remains_open: Alignment between generation metrics and real-world driving
        safety or operational outcomes; limitations are not detailed in the evidence.
    - line: Interactive agents and games
      what_it_solves: Spatial consistency, memory, action control, and sample-efficient
        policy learning in game-like interactive environments.
      what_remains_open: Generalization across environment rules, goals, and action
        spaces; benchmarks show long-term memory consistency and cross-action-space
        control remain challenging.
    consensus:
    - Current applications frame world models as video prediction engines that should
      preserve physical, spatial, or temporal consistency over long horizons.
    - Domain-specific conditioning through actions, language, context, or physics
      auxiliary tasks improves task grounding and policy or zero-shot performance.
    - Evaluation is expanding from single-step visual quality toward closed-loop,
      long-horizon, memory, and policy-level benchmarks.
    disagreements:
    - One line learns stochastic latent state for sample-efficient policy learning,
      while other lines use diffusion-based video generation for robot or driving
      domains.
    - Some methods factorize generation from language into reusable primitives, whereas
      others couple action and video diffusion in one architecture or condition a
      recurrent state-space model on observed context.
    - 'Evaluation targets differ: downstream robot execution and policy generalization,
      long-horizon driving video metrics, and benchmark consistency scores imply different
      success criteria.'
    open_questions:
    - Can simulation or benchmark gains be translated into real-world task success
      and safety guarantees?
    - How should world models maintain long-term memory, spatial consistency, and
      action control across unseen action spaces and open environments?
    - Under what conditions does compositionality or context conditioning generalize
      to entirely novel objects, dynamics, or instructions?
    - Which metrics are needed to capture physical plausibility and temporal consistency
      beyond visual fidelity, given current limitations are often unreported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 把世界模型适配到机器人、上下文控制等具体任务，利用动作、语言目标和物理约束。
      尚未覆盖: 跨本体、数据集和物理环境的迁移；可观测上下文或预定义语言原语等假设仍待验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 基于驾驶数据实现多视角、长时域场景预测和零样本驾驶视频生成。
      尚未覆盖: 生成指标与真实驾驶安全或运营结果之间的对齐；限制说明在可用证据中缺失。
    - 路线: 交互式智能体与游戏
      解决的问题: 在游戏式交互环境中评估或学习空间一致性、记忆、动作控制和样本高效策略。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化；基准显示长期记忆一致性仍有挑战。
    共识:
    - 当前应用普遍把世界模型视为视频预测引擎，并强调长时域物理、空间或时序一致性。
    - 加入动作、语言、上下文或物理辅助信号有助于提升任务落地、策略学习或零样本表现。
    - 评测正从单步视觉质量扩展向闭环、长时域、记忆和策略层面的基准。
    分歧:
    - 一条路线使用随机潜在状态进行样本高效策略学习，另一类路线使用扩散视频生成面向机器人或驾驶任务。
    - 有的方法从语言分解出可复用原语，有的方法在同一架构中耦合动作与视频扩散，或以观测上下文条件化循环状态空间模型。
    - 评测目标不同：下游机器人执行与策略泛化、长时域驾驶视频指标、或者基准一致性分数，各自对应不同的成功标准。
    开放问题:
    - 仿真或基准提升能否转化为真实任务成功与安全保证？
    - 世界模型如何在未见动作空间和开放环境中保持长期记忆、空间一致性和动作控制？
    - 组合性或上下文条件化在何种条件下能泛化到全新物体、动力学或指令？
    - 在现有局限性常未报告的情况下，哪些指标能超越视觉保真度衡量物理合理性和时序一致性？
