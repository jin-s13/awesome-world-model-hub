  related_work_outline:
  - 'Mainstream direction: Designing benchmarks and metrics that evaluate world models
    beyond pixel-level prediction, focusing on spatial consistency, memory, action
    control, and closed-loop interaction.'
  - 'Shared research pattern: Proposing a curated dataset with specific task formulations
    (e.g., loop navigation, revisiting) and corresponding evaluation metrics that
    quantify a desired model capability, then validating on state-of-the-art world
    models.'
  - 'Key differences: Evaluation dimensions differ: spatial consistency (LoopNav)
    vs. memory consistency and action control (MIND); some benchmarks are open-loop
    video prediction, while others require interactive closed-loop rollouts; metrics
    range from scene graph consistency to learned discriminators.'
  - 'Trend evolution: From 2020–2023, standard datasets like Atari 100k and NuScenes
    dominated; since 2024, specialized benchmarks targeting specific world model weaknesses
    (spatial memory, dynamics generalization) have emerged, with a shift toward interactive
    and multi-modal evaluation.'
  - 'Open questions: How well proxy metrics align with downstream task performance;
    whether current benchmarks cover diverse real-world scenarios; and how to evaluate
    long-term consistency and cross-embodiment generalization without exhaustive human
    annotation.'
  related_work_outline_zh:
  - 主流方向：设计超越像素预测的基准和指标，重点关注空间一致性、记忆、动作控制和闭环交互，以评估世界模型。
  - 研究共性：提出一个精心策划的数据集，设计特定任务（如循环导航、重访）及相应的评估指标，量化某种期望的能力，并在当前最先进的世界模型上进行验证。
  - 关键差异：评估维度不同：空间一致性（LoopNav）对比记忆一致性与动作控制（MIND）；有的基准是开环视频预测，有的需要交互式闭环推演；指标从场景图一致性到学习判别器均有。
  - 趋势演进：2020-2023年，Atari 100k和NuScenes等标准数据集占主导；2024年起，针对世界模型特定弱点（空间记忆、动力学泛化）的专用基准出现，并转向交互式和多模态评估。
  - 开放问题：代理指标与下游任务性能的对齐程度；当前基准是否覆盖多样的真实场景；如何在不依赖大量人工标注的情况下评估长期一致性和跨形态泛化。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating standardized tasks and datasets (e.g., Atari 100k,
        NuScenes, LoopNav, MIND) that make world model capabilities comparable and
        highlight specific weaknesses like spatial memory or action control.
      what_remains_open: Whether these tasks capture the full complexity of real-world
        settings where world models are deployed, and whether they cover open-domain,
        long-horizon, and multi-embodiment scenarios.
    - line: Metric and stress-test design
      what_it_solves: Probing beyond aggregate scores by designing metrics such as
        Scene Graph Consistency Score (SGCS) for spatial invariance, and discriminators
        for memory consistency and action control, to evaluate robustness and decision
        utility.
      what_remains_open: The alignment between these proxy metrics and actual downstream
        task performance (e.g., policy learning in robotics) has not been empirically
        validated across diverse benchmarks.
    - line: Comparable baselines and reporting
      what_it_solves: Enabling auditability through common baselines (e.g., Dreamer
        v3, STORM) and open-sourcing code, datasets, and evaluation protocols, as
        seen in MIND and LoopNav.
      what_remains_open: Stability of benchmark conclusions under different implementation
        choices, compute budgets, and hyperparameter settings is rarely systematically
        studied; many method papers lack explicit limitation statements.
    consensus:
    - World model evaluation must go beyond pixel-level reconstruction loss to capture
      structural consistency and action-conditioned dynamics.
    - Standardized benchmarks with open-source code and data are essential for reproducible
      progress, as demonstrated by the adoption of Atari 100k and the release of LoopNav
      and MIND.
    - Current world models struggle with long-term memory and generalization across
      action spaces, a finding consistently observed across different benchmarks.
    disagreements:
    - 'Evaluation setting: LoopNav uses open-loop video generation from fixed actions,
      while MIND requires interactive closed-loop control, leading to different demands
      on model architecture.'
    - 'Evaluation dimension: Some works prioritize spatial consistency (e.g., scene
      graph based), others focus on memory of past observations or precise action
      controllability, without a unified multi-dimensional framework.'
    - 'Metric design: LoopNav''s SGCS is hand-crafted and invariant to pixel variations,
      whereas MIND employs a learned discriminator, which may capture different aspects
      of visual quality versus structural fidelity.'
    open_questions:
    - What is the relationship between visual fidelity, spatial consistency, and downstream
      policy performance? Evidence from DIAMOND suggests visual details matter, but
      no benchmark directly links these metrics to decision-making.
    - How can we design benchmarks that scale to the diversity of real-world environments
      without requiring prohibitively expensive annotation? LoopNav and MIND are limited
      to simulated or curated scenes.
    - Can we establish a unified evaluation protocol that combines memory, consistency,
      action control, and generalization across embodiments, and how would results
      from current models compare under such a protocol?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建标准化任务和数据集（如 Atari 100k、NuScenes、LoopNav、MIND），使世界模型的能力可比较，并突出空间记忆或动作控制等特定弱点。
      尚未覆盖: 这些任务是否捕捉了世界模型部署所需的真实世界复杂性，是否覆盖开放域、长时域和多形态场景。
    - 路线: 指标与压力测试设计
      解决的问题: 通过设计场景图一致性分数（SGCS）等空间不变性指标，以及用于记忆一致性和动作控制的判别器，超越总分，评估鲁棒性和决策效用。
      尚未覆盖: 这些代理指标与实际下游任务性能（如机器人策略学习）的对齐程度尚未在不同基准上得到实证验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（如 Dreamer v3、STORM）和开源代码、数据集及评估协议（如 MIND、LoopNav），实现结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和超参数设置下的稳定性鲜有系统研究；许多方法论文缺少明确的局限性声明。
    共识:
    - 世界模型评估必须超越像素级重建损失，捕捉结构一致性和动作条件动力学。
    - 具有开源代码和数据的标准化基准对于可复现的进步至关重要，Atari 100k 的广泛采用以及 LoopNav 和 MIND 的发布即是证明。
    - 当前世界模型难以维持长期记忆并跨动作空间泛化，这一发现被不同基准一致观察到。
    分歧:
    - 评估设置：LoopNav 使用固定动作的开环视频生成，而 MIND 要求交互式闭环控制，对模型架构提出不同需求。
    - 评估维度：一些工作优先考虑空间一致性（如基于场景图），另一些则关注过去观测的记忆或精确动作控制，尚无统一的多维度框架。
    - 指标设计：LoopNav 的 SGCS 是手工设计的，对像素变化不变，而 MIND 使用学习判别器，可能捕捉视觉质量与结构保真度的不同方面。
    开放问题:
    - 视觉保真度、空间一致性与下游策略性能之间存在何种关系？DIAMOND 的证据表明视觉细节很重要，但没有基准直接将这些指标与决策联系起来。
    - 如何设计基准以扩展到多样的真实环境，而不需要高昂的标注成本？LoopNav 和 MIND 仅限于模拟或策划的场景。
    - 能否建立一个统一的评估协议，结合记忆、一致性、动作控制和跨形态泛化，当前模型在此协议下的结果会如何？
