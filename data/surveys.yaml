  related_work_outline:
  - 'Mainstream direction: World-model evaluation is converging on action-conditioned
    video and dynamics prediction for embodied, driving, and game settings, with benchmark
    work beginning to probe memory, spatial consistency, and action control rather
    than only visual fidelity.'
  - 'Shared research pattern: Studies combine generative sequence models with either
    downstream agent returns or explicit consistency metrics; recent work uses diffusion
    transformers, closed-loop rollouts, and loop-based navigation tasks to expose
    temporal instability.'
  - 'Key differences: Evaluation targets split between visual fidelity and downstream
    control; representations range from discrete latent, VAE-Transformer, pure diffusion,
    to video-action coupled diffusion; domains differ in action spaces, visual complexity,
    and physical priors.'
  - 'Trend evolution: From 2023 efficient model-based RL world models toward 2024
    diffusion-based world modeling, then 2025-2026 unified video-action pretraining
    and dedicated memory/spatial benchmarks; the available year span centers on the
    current frontier.'
  - 'Open questions: Whether benchmark metrics align with real-world decision utility,
    how to cover long-horizon and cross-action-space settings, and whether results
    remain reproducible across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正汇聚到面向具身、驾驶和游戏场景的动作条件视频/动力学预测，基准工作开始探究记忆一致性、空间一致性和动作控制，而不只看视觉保真度。
  - 研究共性：研究将生成式序列模型与下游智能体回报或显式一致性指标结合；近期工作采用扩散Transformer、闭环展开和循环导航任务来暴露时间不稳定性。
  - 关键差异：评估目标在像素保真与下游控制之间分化；表示方式涵盖离散潜变量、VAE-Transformer、纯扩散以及视频-动作耦合扩散；场景在动作空间、视觉复杂度和物理先验上不同。
  - 趋势演进：从2023年高效模型基强化世界模型，到2024年扩散世界建模，再到2025-2026年视频-动作统一预训练及记忆/空间基准；可观察年份集中在当前前沿。
  - 开放问题：基准指标是否与真实决策效用一致，如何覆盖长时域与跨动作空间场景，以及结果在不同实现和算力预算下是否可复现。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned navigation and video tasks
        that make spatial consistency, loop closure, and memory control comparable
        across world models.
      what_remains_open: Whether the task distribution covers real-world driving,
        long-horizon robotics, and open-domain action spaces where world models are
        expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial consistency, memory consistency,
        action control, and downstream agent return instead of relying only on aggregate
        visual scores.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        in real systems; some benchmark papers report construction without full leaderboard
        results.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, open datasets/code,
        and standardized benchmark protocols such as Atari 100k, nuScenes/OpenDV-2K/Waymo,
        CARL, LoopNav, and MIND.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and missing limitation or citation metadata; several top-ranked
        papers lack public metadata or detailed limitation fields.
    consensus:
    - World models are evaluated through closed-loop or action-conditioned prediction
      rather than unconditional image generation alone.
    - Visual detail and stochastic sequence modeling are treated as important for
      downstream agent and control performance.
    - Spatial and memory consistency are emerging as distinct stress-test axes beyond
      per-frame visual fidelity.
    - Diffusion-based and transformer-based architectures are becoming central for
      video dynamics generation.
    - Public benchmarks and code are valued, but not uniformly present across the
      evidence.
    disagreements:
    - 'Evaluation target: some compare visual fidelity and zero-shot validation, while
      others optimize agent score on Atari or contextual RL policies.'
    - 'Representation: discrete latent world models, variational autoencoder-Transformer
      hybrids, pure diffusion world models, and video-action coupled diffusion differ.'
    - 'Supervision and domain: explicit observable context is used in some settings,
      while others learn from action-free video or large-scale robot/driving data.'
    - 'Interaction mode: open-loop video prediction, loop-based replay, and closed-loop
      agent rollouts test different forms of consistency and controllability.'
    - 'Deployment setting: Minecraft, Atari, CARL, robotic scenes, and driving datasets
      differ in action spaces, visual complexity, and physical priors.'
    open_questions:
    - Do spatial or memory consistency scores predict downstream robot or driving
      policy success?
    - Can benchmark tasks generalize across action spaces and viewpoints without overfitting
      to curated scenes?
    - What evaluation design is needed for long-horizon physical plausibility and
      loop closure in real-world settings?
    - How stable are benchmark rankings across reimplementation, compute budget, and
      train/eval split changes?
    - Do missing code, limitation details, or leaderboard results in benchmark papers
      mask systematic unreliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享的动作条件导航和视频任务，使空间一致性、闭环和记忆控制在世界模型之间可比较。
      尚未覆盖: 任务分布是否覆盖真实驾驶、长时域机器人以及开放域动作空间；现有数据仍偏重置环境和有限闭环。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、空间一致性、记忆一致性、动作控制和下游智能体回报。
      尚未覆盖: 指标与真实系统下游决策之间的对应关系；部分基准论文只报告构建，缺少完整排行榜结果。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基准协议、开放代码和数据集（如Atari 100k、nuScenes/OpenDV-2K/Waymo、CARL、LoopNav、MIND）让结果可审计。
      尚未覆盖: 结论在不同实现、算力预算和训练/评估切分下是否稳定；部分高分论文缺少限制说明或公开引用元数据。
    共识:
    - 世界模型评估趋向闭环或动作条件预测，而不只是无条件图像生成。
    - 视觉细节和随机序列建模被认为是下游智能体与控制性能的重要因素。
    - 空间一致性和记忆一致性正在成为超出逐帧视觉保真度的独立压力测试轴。
    - 扩散式与Transformer式架构在视频动力学生成中占据中心位置。
    - 公开基准和代码受到重视，但证据中并非所有工作都提供。
    分歧:
    - 评估目标：部分比较视觉保真度和零样本验证，部分优化Atari智能体得分或上下文RL策略。
    - 表示方式：离散潜变量、VAE-Transformer混合、纯扩散世界模型以及视频-动作耦合扩散之间存在差异。
    - 监督与场景：一些方法依赖可观测上下文值，另一些从无动作视频或大规模机器人/驾驶数据学习。
    - 交互模式：开环视频预测、循环回放和闭环智能体展开测试不同形式的一致性与可控性。
    - 部署场景：Minecraft、Atari、CARL、机器人场景和驾驶数据集在动作空间、视觉复杂度和物理先验上不同。
    开放问题:
    - 空间或记忆一致性分数能否预测下游机器人或驾驶策略的成功？
    - 基准任务能否跨动作空间和视角泛化，而不过拟合到人工场景？
    - 需要怎样的评估设计来测试真实场景中的长时域物理合理性和闭环能力？
    - 基准排名在重新实现、算力预算以及训练/评估切分变化下是否稳定？
    - 代码、限制说明或排行榜结果缺失是否掩盖系统性不可靠？
