  related_work_outline_zh:
  - 主流方向：顶层证据集中在动作可控的生成式世界模型，将其作为可运行模拟器，重点面向自动驾驶与具身控制，并强调可基准评测的保真度。
  - 研究共性：工作通常同时覆盖模型架构、训练任务、数据与评测；通过辅助模块或损失提升动作保真度、空间一致性、物理合理性或动态一致性。
  - 关键差异：生成骨干、监督信号、评测设置和部署模式不同，包括循环潜在模型与视频扩散/自回归帧生成；评测覆盖驾驶、Minecraft、机器人、CARL及离线/闭环/基于模型的强化学习。
  - 趋势演进：证据仅覆盖2024-2026年，显示前沿从高保真生成走向动作可控闭环仿真、标准化保真度基准、物理信息与上下文方法，以及低延迟部署栈。
  - 开放问题：跨域泛化、标准化一致性指标、长时程稳定性、上下文可观测性和真实部署可扩展性在证据中仍缺少验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable generative simulators
      what_it_solves: Generate future observations conditioned on driving actions,
        trajectories, and control signals for simulation, planning, and policy training/evaluation.
      what_remains_open: Long-horizon cross-view consistency and generalization beyond
        nuScenes or narrow benchmark tasks remain unverified.
    - line: Contextual and physics-informed generative architectures
      what_it_solves: Inject context, depth, keypoint dynamics, or motion losses to
        improve zero-shot generalization, physical plausibility, and dynamic consistency.
      what_remains_open: Assumes observable context or pre-trained video generators;
        evaluations are limited to two CARL tasks or selected game/robotics domains,
        with visual-detail trade-offs.
    - line: Benchmarking and reproducible evaluation frameworks
      what_it_solves: Quantify spatial consistency, action fidelity, and physical/dynamic
        quality through datasets and metrics, with open-source artifacts.
      what_remains_open: Independent reproduction across teams and infrastructures
        is not evidenced; metric sensitivity and broader environment coverage remain
        open.
    - line: Deployable real-time system stacks
      what_it_solves: Package multi-camera training, inference, and closed-loop evaluation
        into systems capable of sub-second single-GPU latency.
      what_remains_open: Multi-GPU and real-world deployment scaling, edge conditions,
        and long-sequence stability are not verified.
    consensus:
    - Work converges on using generative world models as controllable simulators,
      with action or trajectory conditioning treated as a first-class evaluation target.
    - Visual realism alone is treated as insufficient; metrics and training tasks
      also target action fidelity, spatial consistency, or dynamic/physical consistency.
    - Auxiliary losses, context conditioning, or lightweight modules are common mechanisms
      for improving controllability and consistency.
    - Open datasets, code, and benchmark artifacts often accompany model contributions
      to support comparison and reuse.
    - Reported evaluations remain concentrated in a small number of datasets or tasks,
      making broad cross-setting conclusions preliminary.
    disagreements:
    - 'Generation backbones differ: recurrent latent state-space models for policy
      learning, diffusion or autoregressive video models for high-fidelity generation,
      and frame-level autoregressive multi-camera systems.'
    - 'Training supervision differs: explicit context or physics-informed tasks versus
      action-aligned modules on pre-trained video generators versus trajectory-annotated
      driving data.'
    - 'Evaluation targets differ: spatial consistency in Minecraft navigation, action
      fidelity in driving, physical plausibility in robotic video, zero-shot policy
      generalization in contextual RL, and simulation realism/planning in motion planning.'
    - 'Deployment settings differ: some systems address single-GPU latency and closed-loop
      use, while others emphasize sample efficiency or benchmark-based open-loop evaluation
      without deployment constraints.'
    - 'Evidence coverage differs: several contributions report results on one dataset
      or two tasks, while a few span multiple large-scale driving benchmarks or diverse
      robotic scenarios.'
    open_questions:
    - How well do current action-controllable simulators generalize across unseen
      driving environments, sensor setups, or embodiment changes beyond the datasets
      in the supplied packet?
    - Can action, spatial, and physical fidelity be captured by standardized metrics
      that remain reproducible across different teams and infrastructure?
    - What are the speed-fidelity-controllability trade-offs when moving single-GPU
      driving simulation to multi-agent, multi-GPU, or edge deployment?
    - Do context-conditioned world models remain reliable when context variables are
      partially observed, noisy, or out of distribution?
    - Which auxiliary tasks or control interfaces transfer across domains without
      per-dataset retraining or degradation in visual detail?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的生成式模拟器
      解决的问题: 根据驾驶动作、轨迹和控制信号生成未来观测，用于仿真、规划、策略训练与评估。
      尚未覆盖: 长时程跨视图一致性，以及超越nuScenes或狭窄基准任务的泛化仍未验证。
    - 路线: 上下文与物理信息驱动的生成式架构
      解决的问题: 注入上下文、深度、关键点动力学或运动损失，提升零样本泛化、物理合理性和动态一致性。
      尚未覆盖: 依赖可观测上下文或预训练视频生成器；评估限于CARL两个任务或少量游戏/机器人领域，并存在视觉细节取舍。
    - 路线: 基准与可复现评测框架
      解决的问题: 通过数据集和指标量化空间一致性、动作保真度与物理/动态质量，并提供开源工件。
      尚未覆盖: 跨团队和跨基础设施的独立复现证据不足；指标敏感性和更广泛环境覆盖仍未解决。
    - 路线: 可部署的实时系统栈
      解决的问题: 将多相机训练、推理与闭环评估封装为单GPU亚秒级延迟系统。
      尚未覆盖: 多GPU与真实部署扩展、边缘条件及长序列稳定性尚未验证。
    共识:
    - 多项工作趋向于把生成式世界模型作为可控模拟器，将动作或轨迹条件作为核心评测目标，而非仅看图像真实感。
    - 视觉质量单独不足以作为标准；指标和训练任务同时覆盖动作保真度、空间一致性或动态/物理一致性。
    - 辅助损失、上下文条件化或轻量模块是提升可控性和一致性的常见机制。
    - 开源数据集、代码和基准工件常伴随模型贡献，以支持对比和复用。
    - 已有评估仍集中在少量数据集或任务上，因此跨场景结论仍较初步。
    分歧:
    - 生成骨干不同：面向策略学习的循环潜在状态空间模型、面向高保真生成的扩散或自回归视频模型，以及帧级自回归多相机系统。
    - 训练监督不同：显式上下文或物理信息任务、在预训练视频生成器上对齐动作模块，或依赖轨迹标注驾驶数据。
    - 评测目标不同：Minecraft导航中的空间一致性、驾驶中的动作保真度、机器人视频中的物理合理性、上下文强化学习中的零样本策略泛化，以及运动规划中的仿真真实感与规划。
    - 部署设置不同：部分系统处理单GPU延迟和闭环使用，部分强调样本效率或开环基准评估而没有部署约束。
    - 证据覆盖不同：一些工作仅在一个数据集或两个任务上报告结果，少数工作跨多个大规模驾驶基准或多样机器人场景。
    开放问题:
    - 当前动作可控模拟器在未见驾驶环境、传感器配置或具身变化上的泛化能力尚不清楚。
    - 如何用标准化指标度量动作、空间和物理保真度，并保证跨团队、跨基础设施可复现？
    - 从单GPU驾驶仿真扩展到多智能体、多GPU或边缘部署时，速度-保真度-可控性的权衡是什么？
    - 当上下文变量部分观测、含噪声或分布外时，上下文条件世界模型是否仍然可靠？
    - 哪些辅助任务或控制接口无需逐数据集重训即可跨域迁移，同时不牺牲视觉细节？
