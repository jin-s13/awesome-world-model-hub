  related_work_outline_zh:
  - 主流方向：世界模型的综述与分类研究当前占主导，尤其是覆盖生成视频、自动驾驶与具身机器人学习的统一框架。
  - 研究共性：论文大多按表示与评测选择来组织碎片化方法，并据此提出框架或路线图，而非仅报告单一新架构。
  - 关键差异：通用视频世界模拟综述强调物理真实感与大型生成视频模型，驾驶类综述则引入几何、拓扑和语义先验；概念框架缺少方法类研究中的实证基线。
