  related_work_outline:
  - 'Mainstream direction: Building evaluation suites, datasets, and stress tests
    for world models, especially around spatial/temporal consistency, memory, action-conditioned
    control, and long-horizon video rollouts.'
  - 'Shared research pattern: Construct a controlled video-action scenario, define
    a targeted consistency metric, and compare generation quality plus downstream
    policy utility against standardized baselines.'
  - 'Key differences: Some work evaluates closed-loop action control and memory, while
    others report RL benchmark scores; supervision ranges from action-free video to
    observable context; settings span driving, robotics, Minecraft, and Atari.'
  - 'Trend evolution: Available evidence is concentrated in 2023–2026; within this
    frontier, the field is moving from single-score control benchmarks toward open-domain
    benchmark suites and physics-informed or memory-oriented world-model evaluation.'
  - 'Open questions: Metric-to-decision alignment, cross-action-space generalization,
    reporting stability, and the connection between visual realism and downstream
    utility remain underevidenced.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型构建评估套件、数据集和压力测试，重点考察时空一致性、记忆、动作条件控制和长时域视频推演。
  - 研究共性：构造受控视频-动作场景，定义针对性一致性指标，并与标准基线比较生成质量和下游策略效用。
  - 关键差异：有的评测闭环动作控制与记忆，有的报告RL基准分数；监督信号从无动作视频到可观测上下文不等；场景涵盖驾驶、机器人、Minecraft和Atari。
  - 趋势演进：现有证据集中在2023–2026年；在前沿内部，正从单一控制分数基准转向开放域基准套件和物理/记忆导向的世界模型评测。
  - 开放问题：指标与决策的对齐、跨动作空间泛化、报告稳定性，以及视觉真实性与下游效用之间的关系仍缺证据。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video-action evaluation settings that expose
        world-model consistency under looped navigation, diverse viewpoints, and memory/action
        control.
      what_remains_open: Whether collected task distributions cover long-horizon deployment,
        cross-action-space transfer, and open-domain variability beyond current scenes.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate scores by quantifying spatial consistency,
        memory consistency, action control, visual fidelity, and physical plausibility.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        users care about, as well as robustness across pixel-level variation.
    - line: Comparable baselines and reporting
      what_it_solves: Provides reproducible baselines and standardized benchmarks/protocols
        for world-model comparison across RL and video-generation settings.
      what_remains_open: Stability of conclusions across implementations, compute
        budgets, and missing limitation reporting remains unverified in this evidence.
    consensus:
    - Work converges on evaluating world models through held-out rollouts or dedicated
      benchmarks, with stress on temporal stability and action-conditioned generation.
    - There is shared emphasis on disentangling visual fidelity from structural consistency,
      such as spatial or memory consistency.
    - The field treats downstream control utility as an important axis, but often
      measures it in separate RL settings.
    - Benchmark-oriented and model-oriented work both expose failures around long-horizon
      consistency and distribution shift.
    disagreements:
    - 'Evaluation target differs: open-domain memory/action benchmarks versus control
      benchmarks such as Atari or context-conditioned RL tasks.'
    - 'Representation choice differs: diffusion transformers, stochastic sequence
      models, recurrent state-space models, and physics-informed depth/keypoint models
      foreground different forms of consistency.'
    - 'Supervision signal differs: action-free video, action-conditioned video, observable
      context, and mask reconstruction introduce different data assumptions.'
    - Deployment setting differs across driving, robotics, Minecraft, and Atari, so
      robustness and action-space coverage are not directly comparable.
    open_questions:
    - Do current consistency metrics predict better decisions in real downstream tasks?
    - Can benchmarks capture long-horizon memory and cross-action-space generalization
      without becoming domain-specific?
    - Are reported model advantages stable across compute budgets, codebases, and
      splits?
    - Does physics-informed or visually detailed generation improve control robustness,
      or only sample quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享视频-动作评测设置，暴露世界模型在循环导航、不同视角和记忆/动作控制下的一致性。
      尚未覆盖: 任务分布是否覆盖长时域部署、跨动作空间迁移和开放域变化，仍不清楚。
    - 路线: 指标与压力测试设计
      解决的问题: 超越总分，量化空间一致性、记忆一致性、动作控制、视觉保真度和物理合理性。
      尚未覆盖: 这些代理指标与用户关心的下游决策之间的对齐，以及像素级变化下的稳健性尚缺证据。
    - 路线: 可比基线与报告规范
      解决的问题: 提供可复现基线和标准化基准/协议，用于在RL和视频生成设定中比较世界模型。
      尚未覆盖: 结论在不同实现、算力预算及缺失局限性报告下的稳定性尚未验证。
    共识:
    - 工作汇流于通过留出集推演或专项基准评测世界模型，重点考察时间稳定性和动作条件生成。
    - 共同强调将视觉保真度与空间或记忆等结构一致性区分开。
    - 领域把下游控制效用视为重要维度，但常在独立的RL设定中测量。
    - 基准导向和模型导向工作都暴露了长时域一致性和分布偏移下的失败。
    分歧:
    - 评测目标不同：开放域记忆/动作基准与控制基准（如Atari或上下文条件RL任务）侧重点不同。
    - 表示方式不同：扩散Transformer、随机序列模型、循环状态空间模型以及物理信息深度/关键点模型各自强调不同一致性。
    - 监督信号不同：无动作视频、动作条件视频、可观测上下文和掩码重建隐含不同数据假设。
    - 部署场景不同：驾驶、机器人、Minecraft和Atari导致鲁棒性和动作空间覆盖不可直接比较。
    开放问题:
    - 当前一致性指标能否预测真实下游任务中的更好决策？
    - 基准能否在不变得领域专用的情况下覆盖长时域记忆和跨动作空间泛化？
    - 报告中的模型优势在不同算力预算、代码库和数据划分下是否稳定？
    - 物理信息或视觉细节更强的生成是提升控制鲁棒性，还是仅提升样本质量？
