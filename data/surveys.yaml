    - 如何缩小像素级视频保真度与真实机器人下游任务表现之间的差距？
    - 认证安全关键应用世界模型所需的最小评估维度（记忆、动作控制、物理合理性）集合是什么？
    - 世界模型如何在不带动作标签的被动视频数据上学习，同时保持策略学习的精确控制？
