  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks and metrics to evaluate
    world models beyond aggregate scores, focusing on spatial-temporal consistency,
    memory, and action control, while standardizing evaluation on established suites
    like Atari 100k and Nuscenes.'
  - 'Shared research pattern: Proposing new datasets with tailored metrics (e.g.,
    SGCS, MIND framework) that explicitly probe long-horizon consistency and closed-loop
    dynamics, complementing existing general-purpose benchmarks.'
  - 'Key differences: Benchmarks differ in target capability (spatial consistency
    vs. memory consistency vs. action control), environment (Minecraft vs. diverse
    real-world/robotic videos), and metric design (scene-graph-based vs. direct evaluation
    of temporal coherence).'
  - 'Trend evolution: Over 2023–2026, the focus shifts from using Atari 100k for visual-motor
    skill to constructing custom benchmarks that stress-test long-term memory and
    cross-domain generalization, with diffusion-based world models driving demand
    for fine-grained visual fidelity evaluation.'
  - 'Open questions: Whether proxy metrics in new benchmarks align with downstream
    task performance; stability of rankings across implementation details and compute
    budgets; and coverage of real-world deployment scenarios where world models are
    expected to operate.'
  related_work_outline_zh:
  - 主流方向：设计专门基准与指标，超越总分评估世界模型，聚焦时空一致性、记忆和动作控制，同时通过Atari 100k、Nuscenes等标准套件规范化评测。
  - 研究共性：提出新数据集并配套定制化指标（如SGCS、MIND框架），显式探查长时域一致性和闭环动态，以补充现有通用基准。
  - 关键差异：基准在目标能力（空间一致性 vs. 记忆一致性 vs. 动作控制）、环境（Minecraft vs. 多样化真实/机器人视频）和指标设计（基于场景图
    vs. 直接评估时间连贯性）上存在分歧。
  - 趋势演进：2023–2026年间，重心从使用Atari 100k评估视觉运动技能，转向构建专门基准以压力测试长期记忆和跨域泛化，扩散世界模型的兴起推动了对细粒度视觉保真度的评估需求。
  - 开放问题：新基准中的代理指标是否与下游任务表现对齐；不同实现和算力预算下排名的稳定性；基准场景是否覆盖世界模型预期的真实部署设置。
  literature_review:
    line_of_work_matrix:
    - line: Custom benchmarks for spatial-temporal consistency and memory
      what_it_solves: Provides shared tasks and datasets (e.g., loop-based navigation
        videos, revisited scenes) to make claims about world models' spatial memory
        and long-horizon coherence comparable.
      what_remains_open: Whether the controlled environments (Minecraft, curated videos)
        reflect the complexity and diversity of open-world robotics or driving scenarios;
        the sensitivity of proposed metrics to implementation choices.
    - line: Metric and stress-test design for fine-grained dynamics
      what_it_solves: Moves beyond mean performance to quantify visual details, temporal
        stability, and action controllability, using scene graph consistency, memory
        consistency scores, and action-space variation.
      what_remains_open: Alignment between these detailed metrics and the actual downstream
        task success (e.g., policy training); the metric's robustness to perceptual
        variations and adversarial inputs.
    - line: Standardized evaluation suites and reporting conventions
      what_it_solves: Enables auditable comparison across methods by adopting common
        benchmarks like Atari 100k, Nuscenes, and CARL, and by reporting training
        cost, baseline implementations, and result variability.
      what_remains_open: Stability of conclusions across different codebases and compute
        budgets; the lack of unified reporting on limitations and negative results,
        which may skew perceived progress.
    consensus:
    - Existing general-purpose benchmarks (Atari, Nuscenes) are insufficient for evaluating
      long-term memory and spatial consistency, motivating the creation of specialized
      evaluation protocols.
    - Diffusion-based world models demand higher visual fidelity and have led to the
      inclusion of perceptual quality metrics alongside task performance.
    - Open-source datasets and code are critical for reproducibility, and all recent
      benchmark proposals release their artifacts.
    disagreements:
    - 'The choice of environment for consistency evaluation: LoopNav uses Minecraft
      with action-conditioned loops, while MIND uses first/third-person real-world-style
      videos, leading to different interpretations of ''memory'' and ''action control''.'
    - 'Metric design philosophy: SGCS quantifies consistency via scene graphs invariant
      to pixel changes, while MIND directly measures temporal stability and action
      controllability through frame-level comparisons, implying different assumptions
      about what makes a world model consistent.'
    - 'The role of visual detail: DIAMOND emphasizes that preserving visual details
      is crucial for agent performance, whereas some benchmarks (e.g., LoopNav) deliberately
      abstract away pixel-level differences, suggesting a tension between detailed
      reconstruction and high-level consistency.'
    open_questions:
    - How do the proposed consistency metrics (SGCS, MIND memory score) correlate
      with actual policy learning or real-world task success, and under what conditions
      might they be misleading?
    - Are the benchmark rankings stable under different training seeds, resource constraints,
      or implementation variations, given that no systematic sensitivity analysis
      was reported in the evidence?
    - Can the tasks designed for memory consistency (e.g., loop closures) generalize
      to the type of long-horizon planning required in autonomous driving or robotic
      manipulation, where world models are most needed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向时空一致性与记忆的定制基准
      解决的问题: 提供共享任务和数据集（如循环导航视频、回访场景），使世界模型的空间记忆和长时域一致性主张可比。
      尚未覆盖: 受控环境（Minecraft、精选视频）是否反映开放世界机器人或驾驶场景的复杂性与多样性；所提指标对实现细节的敏感性。
    - 路线: 面向细粒度动态的指标与压力测试设计
      解决的问题: 超越平均性能，通过场景图一致性、记忆一致性分数和动作空间变化来量化视觉细节、时间稳定性和动作可控性。
      尚未覆盖: 这些精细指标与实际下游任务成功（如策略训练）的一致性；指标对感知变化和对抗输入的鲁棒性。
    - 路线: 标准化评测套件与报告规范
      解决的问题: 通过采用Atari 100k、Nuscenes、CARL等通用基准，并报告训练成本、基线实现和结果波动，使跨方法对比可审计。
      尚未覆盖: 不同代码库和算力预算下结论的稳定性；缺乏统一的局限性与负面结果报告，可能扭曲对进展的感知。
    共识:
    - 现有通用基准（Atari、Nuscenes）不足以评估长期记忆和空间一致性，推动创建专门的评测协议。
    - 基于扩散的世界模型要求更高的视觉保真度，导致将感知质量指标与任务性能并列纳入。
    - 开源数据集和代码对可复现性至关重要，近期所有基准提案均公开其工件。
    分歧:
    - 一致性评估的环境选择：LoopNav使用Minecraft中的动作条件循环，而MIND使用第一/第三人称真实风格视频，导致对“记忆”和“动作控制”的解释不同。
    - 指标设计理念：SGCS通过场景图量化一致性，对像素变化不敏感，而MIND直接通过帧级比较测量时间稳定性和动作可控性，意味着对世界模型一致性的判断前提不同。
    - 视觉细节的角色：DIAMOND强调保留视觉细节对智能体性能至关重要，而某些基准（如LoopNav）刻意忽略像素级差异，提示精细重建与高层一致性之间存在张力。
    开放问题:
    - 所提一致性指标（SGCS、MIND记忆分数）与真实策略学习或任务成功之间的关联如何，在何种条件下可能产生误导？
    - 鉴于证据中未报告系统性的敏感性分析，基准排名在不同训练种子、资源限制或实现变体下是否稳定？
    - 为记忆一致性设计的任务（如闭环闭合）能否泛化到自动驾驶或机器人操作中所需的长时域规划，那里正是世界模型被寄予厚望的场景？
