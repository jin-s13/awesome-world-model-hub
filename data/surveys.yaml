      尚未覆盖: 跨本体、数据集和仿真到真实环境的迁移；超出已见原语的组合泛化；长时程物理合理性。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 构建驾驶世界模型，从驾驶观测中预测多视角、长时程场景视频，并支持零样本或长时程基准评测。
      尚未覆盖: 驾驶基准上的验证提升是否对应闭环安全或真实运营结果；局限性证据较少。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型用于交互环境中的高效策略学习，以及开放世界中动作控制和记忆一致性的评测。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化；长期记忆一致性与跨动作空间控制仍困难。
    - 路线: 世界模型评测与一致性基准
      解决的问题: 提供数据集和指标，衡量空间一致性、记忆一致性和动作控制，超越像素级生成质量。
      尚未覆盖: 指标多为特定域设计；没有证据表明基准分数能预测下游任务成功或物理安全。
    共识:
    - 世界模型被用作学习的预测性仿真器，预测未来观测或潜在状态，以支持下游规划、策略训练或评测。
    - 生成式序列模型，尤其是扩散或Transformer架构，正在成为共同基础，并常辅以重建、物理信号或一致性检查。
    - 评测倾向超越短期视觉质量，转向长时程、动作条件化和一致性感知的评估。
    分歧:
    - 表示方式不同：潜在状态空间推演用于高效强化学习，像素空间视频生成，或视频-动作耦合扩散。
    - 监督信号不同：自监督重建或动力学、物理信息深度与关键点任务、语言原语组合、上下文条件潜在推断各有侧重。
    - 评测目标不同：Atari人类标准化得分、驾驶场景预测指标、机器人任务执行、空间/记忆/动作一致性基准不可互换。
    - 交互模式不同：动作条件闭环控制、无动作视频预训练、语言条件生成、多视角生成分别依赖不同的可用输入假设。
