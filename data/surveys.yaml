  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video world models built
    on diffusion transformers or transformer-VAE hybrids, trained for driving or robot
    video prediction and often coupled with action or language conditions.'
  - 'Shared research pattern: Methods augment generation with auxiliary objectives—mask
    reconstruction, context conditioning, compositional primitives, depth/keypoint
    physics, or video-action coupling—to improve fidelity, generalization, or control.'
  - 'Key differences: Representations range from recurrent state-space/VAE to diffusion
    transformer; supervision spans RGB-only, physics/geometry, context, language,
    and action; evaluation targets differ among Atari, driving, robot manipulation,
    and Minecraft-style benchmarks.'
  - 'Trend evolution: Within the 2023–2026 frontier, the field moves from stochastic
    transformer-based model-based RL toward diffusion-based unified video-action world
    models and dedicated benchmarks for memory, spatial, and action-control consistency.'
  - 'Open questions: How to maintain long-horizon spatial/memory consistency, transfer
    auxiliary physics or context beyond observed tasks, exploit action-free video,
    and isolate model contribution from evaluation design.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于基于扩散Transformer或Transformer-VAE混合的生成式视频世界模型，用于驾驶或机器人视频预测，并常与动作或语言条件耦合。
  - 研究共性：方法通过掩码重建、上下文条件、组合原语、深度/关键点物理或视频-动作耦合等辅助目标增强生成，以提升保真度、泛化或控制。
  - 关键差异：表示从循环状态空间/VAE到扩散Transformer不等；监督包括纯RGB、物理/几何、上下文、语言、动作；评测目标涉及Atari、驾驶、机器人操作和Minecraft类基准。
  - 趋势演进：在2023–2026前沿内，领域从基于随机Transformer的模型强化学习，转向基于扩散的统一视频-动作世界模型，以及针对记忆、空间和动作控制一致性的专用基准。
  - 开放问题：如何保持长时域空间/记忆一致性，将物理或上下文辅助信号迁移到已见任务之外，利用无动作视频，并分离模型贡献与评测设计。
  literature_review:
    line_of_work_matrix:
    - line: Generative video-based world model architectures
      what_it_solves: Learning pixel or latent dynamics from high-dimensional observations
        for video prediction, planning rollouts, or robot policy pretraining.
      what_remains_open: Long-horizon consistency, memory, action control, physical
        plausibility, and transfer beyond observed domains remain only partially verified.
    - line: Context-aware and compositional dynamics modeling
      what_it_solves: Conditioning world models on context variables or language-decomposed
        primitives to improve generalization to unseen dynamics, tasks, or object-action
        combinations.
      what_remains_open: Assumes context is observable or instructions parse into
        known primitives; evidence covers limited task families and benchmarks.
    - line: World model evaluation and consistency benchmarking
      what_it_solves: Quantifying spatial consistency, memory consistency, and action-control
        capability with curated datasets and metrics rather than relying only on generation
        fidelity.
      what_remains_open: Evidence is dataset/benchmark-oriented; standardization,
        baseline breadth, and relation to downstream policy performance are still
        unresolved.
    consensus:
    - World-model learning is treated as high-dimensional video or dynamics prediction,
      with recent architectures using diffusion transformers, transformer-VAE hybrids,
      or recurrent state-space models.
    - Multiple works add auxiliary training signals—mask reconstruction, depth prediction,
      keypoint dynamics, context disentanglement, or video-action coupling—beyond
      plain video reconstruction.
    - Generalization is evaluated through unseen contexts, zero-shot datasets, unseen
      goal combinations, or out-of-domain scenes rather than only training-distribution
      reconstruction.
    - Benchmarks identify long-term memory consistency and action control as core
      unresolved abilities of current world models.
    disagreements:
    - 'Representation differs: discrete diffusion video generation, stochastic transformer-VAE
      latent dynamics, and contextual recurrent state-space conditioning coexist.'
    - 'Supervision differs: RGB-only generation, physics/geometry-informed tasks,
      language-primitive decomposition, and coupled action-video diffusion each emphasize
      different signals.'
    - 'Evaluation target differs: Atari model-based RL, driving video prediction,
      robot manipulation, and Minecraft/open-domain consistency imply different notions
      of success.'
    - 'Action interface differs: some models treat actions as conditioning inputs
      for video prediction, while unified models jointly learn action-video diffusion
      or use imagined trajectories for policy training.'
    - 'Evidence focus differs: some papers report benchmark score gains, while benchmark-oriented
      papers focus on dataset construction and leave downstream method comparison
      or results incomplete.'
    open_questions:
    - Which training objectives best preserve long-horizon memory and spatial consistency
      under action-conditioned generation?
    - Can physics-informed or context-conditioned world-model objectives transfer
      beyond reported robot or contextual RL task families without requiring observable
      context?
    - How much of reported generalization gain comes from the world model representation
      versus the dataset, action interface, or evaluation protocol?
    - How should spatial consistency and action control be standardized across open-domain
      environments, and which metrics predict downstream policy success?
    - Can unified video-action pretraining effectively exploit action-free video while
      preserving controllable generation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频世界模型架构
      解决的问题: 从高维观测学习像素或潜在动力学，用于视频预测、规划推演或机器人策略预训练。
      尚未覆盖: 长时域一致性、记忆、动作控制、物理合理性及跨域迁移仍未充分验证。
    - 路线: 上下文感知与组合动力学建模
      解决的问题: 用上下文变量或语言分解原语条件化世界模型，提升对未见动力学、任务或物体-动作组合的泛化。
      尚未覆盖: 假设上下文可观测或指令可解析为已知原语；证据仅覆盖有限任务和基准。
    - 路线: 世界模型评估与一致性基准
      解决的问题: 通过专门数据集和指标量化空间一致性、记忆一致性与动作控制能力，而非仅看生成保真度。
      尚未覆盖: 证据偏向数据集与基准构建；标准化、基线广度和与下游策略表现的关联仍开放。
    共识:
    - 研究将世界模型学习视为高维视频或动力学预测，近期架构多采用扩散Transformer、Transformer-VAE混合或循环状态空间模型。
    - 多项工作在重建之外加入辅助信号，如掩码重建、深度预测、关键点动力学、上下文解耦或视频-动作耦合。
    - 泛化评估常涉及未见上下文、零样本数据集、未见目标组合或跨域场景，而非仅看训练分布重建。
    - 基准工作将长期记忆一致性和动作控制识别为当前世界模型尚未解决的核心能力。
    分歧:
    - 表示方式不同：扩散式视频生成、随机Transformer-VAE潜在动力学、上下文循环状态空间条件化并存。
    - 监督信号不同：纯RGB生成、物理/几何信息、语言原语分解、动作-视频耦合各有侧重。
    - 评测目标不同：Atari模型强化学习、驾驶视频预测、机器人操作、Minecraft开放域一致性等定义不同的成功标准。
    - 动作接口不同：有的将动作作为视频预测条件，有的联合建模动作-视频扩散或用想象轨迹训练策略。
    - 证据重心不同：一些报告基准分数提升，一些侧重数据集构建且结果比较不完整或开放。
    开放问题:
    - 哪些训练目标最能保持动作条件下生成中的长期记忆与空间一致性？
    - 物理信息或上下文世界模型目标能否在没有可观测上下文的场景中迁移到已报告任务族之外？
    - 已报告的泛化增益有多少来自世界模型表示，多少来自数据集、动作接口或评测协议？
    - 如何在开放域环境中标准化空间一致性与动作控制指标，哪些指标能预测下游策略成功？
    - 统一视频-动作预训练能否在保持可控生成的同时有效利用无动作视频？
