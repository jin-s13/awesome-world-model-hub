      尚未覆盖: 结果集中在NuScenes/OpenDV-2K/Waymo数据集；真实安全性和下游驾驶策略结果未验证。
    - 路线: 机器人世界模型用于视觉想象、预训练和策略学习
      解决的问题: 从机器人数据学习组合视频生成和视频-动作动力学，用于任务想象、策略预训练或物理合理视频合成。
      尚未覆盖: 泛化受限于已见语言原语或可观测上下文；评测多在仿真或基准上，缺乏物理部署证据。
    - 路线: 基于模型强化学习的随机或上下文世界模型
      解决的问题: 在有限交互下用潜在或生成轨迹训练策略，通过上下文条件实现零样本迁移或高效Atari学习。
      尚未覆盖: 依赖上下文可观测假设，任务覆盖窄，缺少向更广泛具身或真实环境的迁移证据。
    - 路线: 面向记忆、空间一致性和动作控制的世界模型基准
      解决的问题: 量化生成轨迹是否在循环或跨视角场景中保持空间一致、长期记忆和动作条件控制。
      尚未覆盖: 基准结果显示当前模型在长期一致性和跨动作空间泛化上仍弱；与下游任务表现的关联未建立。
    - 路线: 物理信息驱动的具身视频生成
      解决的问题: 在RGB生成中加入时间深度和关键点动力学，以增强机器人视频的几何一致性与物理合理性。
      尚未覆盖: 评估侧重视觉保真度和物理合理性，对下游策略训练和评估的影响仅得到部分验证。
    共识:
    - 世界模型正被当作生成式模拟器，必须条件化于动作或控制信号，而不仅是被动视频预测。
    - 当前工作倾向从大规模领域交互数据中学习，并把视频生成与策略、动力学或物理目标联合训练。
    - 评测常绑定基准数据集和下游任务代理，如轨迹质量、零样本泛化、机器人执行或控制一致性。
    - 普遍认为长时域一致性和对未见场景、上下文、动作的泛化是核心未解问题。
    分歧:
    - 表示方式不同：像素空间视频扩散、潜在循环状态空间和随机Transformer-VAE轨迹模型并存。
    - 监督信号不同：物理线索如深度和关键点、语言原语分解、可观测上下文值，或耦合的动作-视频扩散。
    - 评测目标不同：驾驶数据集、机器人执行/仿真、Atari得分或记忆/动作控制基准，缺乏统一指标。
    - 交互模式不同：有的生成视频计划供策略执行，有的在学到的轨迹中训练策略，有的评测开环或闭环重访生成。
    开放问题:
    - 驾驶世界模型在NuScenes/OpenDV-2K/Waymo上的提升能否转化为更安全或更有效的真实驾驶策略？
    - 机器人世界模型能否泛化到未见原语、上下文、本体或物理环境，而非仅已见组合？
    - 在闭环重访或循环导航下，世界模型如何保持空间和长期记忆一致性？
    - 何种评测指标能跨领域连接视觉保真、动作可控与下游任务成功？
    - 部分论文未报告局限或真实部署证据，失败边界和负面结果仍不清晰。
