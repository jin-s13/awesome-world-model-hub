  related_work_outline:
  - 'Mainstream direction: Designing world models with diffusion-based or transformer-based
    generative architectures for video prediction, robotics, and autonomous driving,
    emphasizing action-conditioned generation, physical plausibility, and scalable
    pretraining.'
  - 'Shared research pattern: Leveraging large-scale datasets, coupling action and
    visual modalities, and using generative objectives (diffusion, VAE) to learn latent
    dynamics, then applying the learned world model for planning, policy learning,
    or imagination.'
  - 'Key differences: Representation choices diverge between explicit latent state-space
    models (e.g., STORM, cRSSM) and implicit pixel-level diffusion generators; action
    interfaces range from conditioning inputs to joint action-video diffusion; evaluation
    targets span video quality, spatial consistency, and downstream task success.'
  - 'Trend evolution: From 2018–2023, work concentrated on latent dynamics models
    (Dreamer variants, STORM) for sample-efficient RL; 2024–2025 shifted toward diffusion-based
    video generation with physical priors, compositional language grounding, and unified
    action-video pretraining, alongside new benchmarks for memory and spatial consistency.'
  - 'Open questions: How to unify generation quality and control precision, guarantee
    long-term spatial and memory consistency, achieve generalization across domains
    and tasks, and incorporate reliable physical reasoning without prohibitive computation.'
  related_work_outline_zh:
  - 主流方向：设计基于扩散或Transformer的生成式世界模型架构，用于视频预测、机器人和自动驾驶，强调动作条件生成、物理合理性和可扩展预训练。
  - 研究共性：利用大规模数据集，耦合作与视觉模态，使用生成目标（扩散、VAE）学习潜在动力学，然后将学到的世界模型应用于规划、策略学习或想象。
  - 关键差异：表示方式分化为显式潜在状态空间模型（如STORM、cRSSM）与隐式像素级扩散生成器；动作接口从条件输入到联合动作-视频扩散各异；评测目标涵盖视频质量、空间一致性和下游任务成功率。
  - 趋势演进：2018–2023年集中于用于样本高效强化学习的潜在动力学模型（Dreamer变体、STORM）；2024–2025年转向带物理先验的扩散式视频生成、组合式语言接地和统一动作-视频预训练，同时出现针对记忆和空间一致性的新基准。
  - 开放问题：如何统一生成质量与控制精度，保证长期空间和记忆一致性，实现跨领域、跨任务泛化，以及在不带来过高计算成本的前提下融入可靠的物理推理。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based generative world model architectures
      what_it_solves: Generating high-fidelity, action-conditioned video predictions
        for robotics and driving, supporting multimodal goals (language, images) and
        scalable pretraining on large datasets.
      what_remains_open: Long-term physical consistency and spatial memory are not
        guaranteed; generalization to entirely novel task compositions and domains
        is limited; heavy computational cost of diffusion rollouts.
    - line: Latent state-space world models for reinforcement learning
      what_it_solves: Learning compact latent dynamics for sample-efficient policy
        training in visual RL, achieving high performance on benchmarks like Atari
        without lookahead search.
      what_remains_open: Generalization to new contexts or combinatorial tasks remains
        fragile; methods assume observable context values or limited variability;
        transfer from simulated games to real-world robotics is largely unverified.
    - line: World model evaluation benchmarks
      what_it_solves: Providing standardized datasets and metrics (e.g., Scene Graph
        Consistency Score, memory consistency, action control) to diagnose spatial
        and temporal consistency failures in current world models.
      what_remains_open: The link between benchmark scores and downstream task performance
        is not yet established; the diversity of scenes and action spaces in benchmarks
        is still limited, and they do not yet cover open-ended real-world scenarios.
    consensus:
    - World models must capture environment dynamics from observational data, and
      action conditioning is essential for controllable generation and planning.
    - Large-scale pretraining on diverse datasets improves generalization and robustness
      compared to training on narrow task-specific data.
    - Introducing physical or structural priors (depth, keypoints, scene graphs) helps
      improve visual fidelity and temporal coherence.
    - Evaluation of world models should go beyond pixel-level reconstruction and include
      metrics for consistency, memory, and action responsiveness.
    disagreements:
    - Whether to represent dynamics in an explicit latent state space (cRSSM, STORM)
      or through implicit pixel-level diffusion generation (MaskGWM, RoboDreamer,
      UWM).
    - Whether the action interface should be a conditioning signal for video generation
      or a joint diffusion process that treats actions as a separate modality.
    - Whether the primary evaluation target should be video quality (FVD, PSNR), behavioral
      task success (RL scores), or newly proposed consistency metrics (SGCS, memory
      consistency).
    - Whether the world model should assume observability of context variables (cRSSM)
      or operate without such privileged information.
    - Whether the training data should come from real-world robot interactions (UWM,
      RoboDreamer) or from synthetic or game environments (STORM, cRSSM).
    open_questions:
    - How can we unify high-quality video generation with precise action controllability
      in a single world model, especially for long-horizon tasks?
    - What mechanisms are needed to guarantee long-term spatial and memory consistency
      when the model is rolled out over hundreds of steps?
    - How can world models trained on specific domains (driving, robotics, games)
      transfer their learned dynamics to entirely new environments or tasks?
    - What is the minimal set of physical priors necessary to achieve reliable and
      generalizable physical reasoning, and how can they be integrated without prohibitive
      computational overhead?
    - How can we design evaluation protocols that tightly correlate with real-world
      task performance, closing the gap between benchmark metrics and practical utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的生成式世界模型架构
      解决的问题: 为机器人和自动驾驶生成高保真、动作条件视频预测，支持多模态目标（语言、图像）和大规模数据集的预训练。
      尚未覆盖: 长期物理一致性和空间记忆无法保证；对全新任务组合和领域的泛化能力有限；扩散推演的计算成本高。
    - 路线: 用于强化学习的潜在状态空间世界模型
      解决的问题: 学习紧凑的潜在动力学，用于视觉RL中的样本高效策略训练，在Atari等基准上无需前瞻搜索即可达到高性能。
      尚未覆盖: 对新上下文或组合任务的泛化仍然脆弱；方法假设上下文值可观测或变化有限；从模拟游戏到真实机器人的迁移尚未得到充分验证。
    - 路线: 世界模型评估基准
      解决的问题: 提供标准化数据集和指标（如场景图一致性分数、记忆一致性、动作控制），以诊断当前世界模型在空间和时间一致性上的失败。
      尚未覆盖: 基准分数与下游任务性能之间的关联尚未建立；基准中场景和动作空间的多样性仍然有限，且尚未覆盖开放式的真实世界场景。
    共识:
    - 世界模型必须从观测数据中捕获环境动力学，同时动作条件化对可控生成和规划至关重要。
    - 在多样化数据集上进行大规模预训练比在狭窄任务数据上训练更能提高泛化性和鲁棒性。
    - 引入物理或结构先验（深度、关键点、场景图）有助于改善视觉保真度和时间一致性。
    - 世界模型的评估应超越像素级重建，涵盖一致性、记忆和动作响应等指标。
    分歧:
    - 是通过显式潜在状态空间表示动力学（cRSSM、STORM），还是通过隐式像素级扩散生成（MaskGWM、RoboDreamer、UWM）。
    - 动作接口应作为视频生成的条件信号，还是作为另一个模态进行联合扩散过程。
    - 主要评估目标应为视频质量指标（FVD、PSNR）、行为任务成功率（RL分数），还是新提出的一致性指标（SGCS、记忆一致性）。
    - 世界模型是否应假设上下文变量可观测（cRSSM），还是在不具备此类特权信息的条件下运行。
    - 训练数据应来自真实机器人交互（UWM、RoboDreamer），还是来自合成或游戏环境（STORM、cRSSM）。
    开放问题:
    - 如何在一个世界模型中统一高质量视频生成与精确的动作可控性，尤其是对于长时域任务？
    - 需要什么机制来保证当模型推行数百步时仍能保持长期空间和记忆一致性？
    - 在特定领域（驾驶、机器人、游戏）训练的世界模型如何将其学到的动力学转移到全新的环境或任务中？
    - 实现可靠且可泛化的物理推理所需的最小物理先验集是什么，以及如何在不带来过高计算开销的情况下将其集成？
    - 如何设计评估协议，使其与真实世界任务性能紧密相关，从而缩小基准指标与实际效用之间的差距？
