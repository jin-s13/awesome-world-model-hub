  related_work_outline_zh:
  - 主流方向：系统综述与分类法正在整合世界模型研究，从分散的视频生成、机器人和自动驾驶论文走向统一的概念框架。
  - 研究共性：每篇综述都提出分类体系或设计空间（如潜在表示、结构先验、交互方式），并识别长时程一致性、动作条件可控性和实时交互等关键挑战。
  - 关键差异：覆盖范围从通用世界模型（以Sora为中心）到领域特定视角（交互式视频、自动驾驶）不同；部分综述引入评估框架和基准，另一些则停留在概念层面，缺乏实证验证。
  - 趋势演进：早期工作（2022年）在物理机器人上展示世界模型；2024–2025年出现以Sora为驱动的通用综述；2026年综述增加细粒度分类法、评估套件和开源可复现性关注。
  - 开放问题：现有分类法是否全面覆盖所有新兴范式、如何构建跨领域基准、以及如何验证分类框架的实际效用等问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world model research into a structured
        design space (latent representations, structural priors, interaction modes)
        and charts future directions.
      what_remains_open: Whether the taxonomy is exhaustive and updated as new paradigms
        emerge; most taxonomies lack empirical validation against real-world deployment.
    - line: Comparative evaluation synthesis
      what_it_solves: Surveys benchmarks, metrics, and evaluation protocols across
        world model applications, highlighting gaps between open-loop and closed-loop
        evaluation.
      what_remains_open: Cross-domain benchmark compatibility is unverified; resource-aware
        inference cost metrics are proposed but not yet implemented or tested at scale.
    - line: Open problem and gap mapping
      what_it_solves: Translates literature coverage into concrete technical challenges
        (e.g., out-of-sight dynamics, long-horizon memory, real-time interactivity)
        and open research questions.
      what_remains_open: Prioritization of which gaps most critically block progress;
        lack of evidence that solving mapped gaps directly improves downstream task
        performance.
    consensus:
    - World models must support long-horizon temporal consistency and action-conditioned
      controllability to be useful for planning and interaction.
    - Video generation serves as a central pillar for world models, but current models
      struggle with physics plausibility and persistent out-of-sight dynamics.
    - Real-time interactivity (sub-second latency) is an emerging requirement for
      both simulation and embodied agent applications.
    - Existing surveys agree that a unified evaluation framework is missing, and current
      benchmarks often fail to capture closed-loop performance.
    disagreements:
    - 'Scope: some surveys target general-purpose world models inspired by Sora, while
      others focus on specific domains like interactive video or autonomous driving,
      leading to different design choices for latent representations.'
    - 'Evaluation philosophy: one survey prescribes a closed-loop metric suite with
      resource-aware inference cost, whereas another organizes existing benchmarks
      without proposing new metrics, reflecting a divide between prescriptive versus
      descriptive synthesis.'
    - 'Empirical grounding: a few surveys remain purely conceptual, while others analyze
      concrete models (e.g., RoboDreamer, DayDreamer) and provide experimental insights,
      which affects the evidence base for claimed challenges and gaps.'
    open_questions:
    - Can a single taxonomy accommodate both continuous-state and discrete-token world
      models across diverse applications without overfitting to one paradigm?
    - How can we design a cross-domain benchmark that fairly evaluates interactive
      video world models, autonomous driving world models, and robot world models
      under a unified protocol?
    - What empirical evidence would validate that a proposed taxonomy or design space
      actually guides better model architecture choices compared to ad-hoc design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为结构化的设计空间（潜在表示、结构先验、交互方式），并绘制未来方向。
      尚未覆盖: 分类法是否穷尽且能随新范式更新；大多数分类法缺乏针对真实部署的实证验证。
    - 路线: 对比评测综合
      解决的问题: 综述世界模型应用中基准、指标和评估协议，指出开环与闭环评估之间的差距。
      尚未覆盖: 跨领域基准兼容性未被验证；资源感知的推理成本指标虽被提出，但尚未大规模实施或测试。
    - 路线: 开放问题与缺口映射
      解决的问题: 将文献覆盖转化为具体技术挑战（如视线外动态、长时记忆、实时交互）和开放研究问题。
      尚未覆盖: 哪些缺口对进展阻碍最大缺乏优先级排序；缺少解决所映射缺口能直接提升下游任务性能的证据。
    共识:
    - 世界模型必须支持长时程时间一致性和动作条件可控性，才能对规划和交互有用。
    - 视频生成是世界模型的核心支柱，但当前模型在物理合理性和持久视线外动态方面仍存在困难。
    - 实时交互性（亚秒级延迟）正成为仿真和具身智能体应用的新兴需求。
    - 现有综述一致认为缺乏统一的评估框架，且当前基准往往无法捕捉闭环性能。
    分歧:
    - 范围：部分综述瞄准以Sora为启发的通用世界模型，另一些则聚焦于交互式视频或自动驾驶等特定领域，导致在潜在表示的设计选择上存在差异。
    - 评估理念：一篇综述提出包含资源感知推理成本的闭环度量套件，另一篇则整理现有基准而未提出新指标，反映出规定性综合与描述性综合之间的分歧。
    - 实证基础：少数综述保持纯概念性，而其他综述分析了具体模型（如RoboDreamer、DayDreamer）并提供实验洞见，这影响了所声称挑战和缺口的证据基础。
    开放问题:
    - 单一分类法能否同时容纳连续状态和离散令牌世界模型，覆盖不同应用而不偏向某一范式？
    - 如何设计一个跨领域基准，能在统一协议下公平评估交互式视频世界模型、自动驾驶世界模型和机器人世界模型？
    - 什么样的实证证据能验证所提出的分类法或设计空间确实能引导更好的模型架构选择，而非依赖临时设计？
