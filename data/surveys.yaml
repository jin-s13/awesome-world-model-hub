      尚未覆盖: 评测限于Atari或两个CARL任务，并假设上下文可观测；更广泛动力学泛化仍开放。
    - 路线: 交互式游戏与开放域世界模型诊断
      解决的问题: 在导航式或开放域交互设置中评测空间一致性、记忆和动作控制。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化未被直接解决。
