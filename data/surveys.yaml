  related_work_outline:
  - 'Mainstream direction: Recent application work centers on conditional generative
    video or sequence world models for driving and robot domains, with diffusion transformers
    as a common backbone and auxiliary objectives for consistency and control.'
  - 'Shared research pattern: Most methods augment visual generation with auxiliary
    supervision such as mask reconstruction, depth/keypoint prediction, context conditioning,
    language-primitive factorization, or paired action-video diffusion to improve
    generalization and downstream policy use.'
  - 'Key differences: Papers differ in representation spaces, supervision signals,
    evaluation emphasis, and interaction mode: multi-view driving prediction, embodied
    robot video planning, latent model-based RL, and game/navigation consistency benchmarks
    impose distinct assumptions.'
  - 'Trend evolution: The 2023-2026 frontier moves from efficient single-environment
    RL world models toward large-scale multimodal driving/robot video generation and
    dedicated consistency, memory, and action-control benchmarks.'
  - 'Open questions: Whether gains in video prediction, zero-shot context, or consistency
    metrics transfer to real-world driving safety, physical robot execution, and task
    success remains largely unverified; several works lack closed-loop deployment
    evidence.'
  related_work_outline_zh:
  - 主流方向：近年应用世界模型集中于面向驾驶和机器人的条件生成式视频或序列模型，扩散Transformer成为常用主干，并通过辅助目标提升一致性和控制能力。
  - 研究共性：多数方法用掩码重建、深度/关键点预测、上下文条件化、语言原语分解或动作-视频扩散耦合等辅助监督来增强泛化和下游策略应用。
  - 关键差异：论文在表示空间、监督信号、评测重点和交互方式上分化，如多视角驾驶预测、机器人视频规划、潜在模型强化学习以及游戏导航一致性基准。
  - 趋势演进：2023-2026前沿从单环境高效RL世界模型，转向大规模多模态驾驶/机器人视频生成，并出现专门的记忆一致性、动作控制基准。
  - 开放问题：视频预测、零样本上下文或一致性指标提升能否迁移到真实驾驶安全、物理机器人执行和任务成功，仍基本未经验证，多篇工作缺少闭环部署证据。
  literature_review:
    line_of_work_matrix:
    - line: Generative driving world models for multi-view and long-horizon prediction
      what_it_solves: Casts driving scene prediction as conditional video generation,
        using mask reconstruction to improve generalization across multiple driving
        datasets and viewpoints.
      what_remains_open: Evidence is strongest for visual prediction on Nuscenes,
        OpenDV-2K, and Waymo; closed-loop safety and real operational outcomes are
        not established.
    - line: Contextual and stochastic model-based reinforcement learning
      what_it_solves: Uses contextual latent dynamics or stochastic transformer world
        models to improve sample efficiency and zero-shot generalization under changing
        dynamics.
      what_remains_open: Context observability assumptions and narrow evaluation on
        CARL or Atari leave transfer to real embodied tasks and unknown dynamics unverified.
    - line: Compositional and physics-informed robot imagination
      what_it_solves: Factorizes robot video generation through language primitives
        or physics-related tasks such as depth and keypoint dynamics for reusable
        video plans, policy training, and evaluation.
      what_remains_open: Generalization beyond seen primitives, real-robot deployment,
        and objective physical plausibility evaluation remain unresolved.
    - line: Unified video-action pretraining for robot data
      what_it_solves: Couples action and video diffusion in one transformer to represent
        policies, forward/inverse dynamics, and video generation from large robot
        datasets.
      what_remains_open: Long-horizon reliability and real-world execution evidence
        beyond pretraining/fine-tuning gains are missing.
    - line: World-model consistency and action-control benchmarking
      what_it_solves: Builds navigation video datasets and metrics for spatial/memory
        consistency, action conditioning, and cross-view closed-loop evaluation.
      what_remains_open: Metric validity is not linked to downstream task success;
        benchmark reports do not yet show how to close observed consistency gaps.
    consensus:
    - World models are increasingly treated as generative sequence or video models
      conditioned on action, language, or context rather than only as latent dynamics
      for value estimation.
    - Auxiliary self-supervised or physics-flavored objectives are common for improving
      temporal/spatial consistency, generalization, and downstream policy learning.
    - Evaluation is moving beyond single-task RL scores toward dataset- or benchmark-level
      generalization, including multi-dataset driving, unseen robot goals, and memory/action-control
      probes.
    - Reproducibility and deployment evidence are uneven; several papers report strong
      benchmark gains but leave real-world or closed-loop results open.
    disagreements:
    - 'Representation spaces differ: multi-view driving video, egocentric/exocentric
      robot video, latent recurrent state-space dynamics, and Minecraft navigation
      frames create different memory, viewpoint, and action-space requirements.'
    - 'Supervision signals differ: mask reconstruction, depth/keypoint prediction,
      context conditioning, language-primitive decomposition, and action-video diffusion
      rely on different labels and assumptions.'
    - 'Evaluation targets differ significantly: driving work emphasizes visual fidelity
      and cross-dataset transfer, RL work emphasizes sample efficiency and human-normalized
      score, robot work emphasizes instruction-following or physical plausibility,
      and benchmark work emphasizes consistency and action control.'
    - 'Interaction modes differ: some models are offline video planners or policy
      pretrainers, others produce closed-loop actions, while MIND explicitly assesses
      interactive revisiting and action control across viewpoints.'
    - 'Deployment settings diverge: simulation-only robot execution and game navigation
      benchmarks leave real-world safety, physical contact, and long-horizon operational
      validity untested.'
    open_questions:
    - Do driving video prediction gains transfer to closed-loop real-world driving
      safety and operational outcomes?
    - Can compositional robot world models handle entirely novel instructions or object-action
      combinations beyond seen primitives?
    - Does measured spatial or memory consistency predict downstream navigation or
      manipulation success?
    - Do context-conditioned zero-shot results on two CARL tasks hold when context
      is unobservable or dynamics shift more substantially?
    - Are physics-informed generation and unified video-action pretraining validated
      under real robot execution rather than simulation or visual metrics alone?
