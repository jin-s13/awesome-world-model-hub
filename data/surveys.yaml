  related_work_outline:
  - 'Mainstream direction: Researchers are formally treating video generation models
    as world models, focusing on how to construct internal states and dynamics from
    visual observations, and on how to condition these models on actions to enable
    decision-making and physical reasoning.'
  - 'Shared research pattern: Works converge on action-conditioned video prediction
    as the core mechanism, with increasing emphasis on evaluating physical plausibility
    and functional consistency rather than only visual fidelity.'
  - 'Key differences: There is a split between implicit state construction (via context
    management) and explicit state construction (via latent compression), and a disagreement
    on whether alignment should be enforced through post-training reward modeling,
    direct preference optimization, or test-time verification.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field moved from adapting
    pretrained video models for action conditioning to building large-scale, physics-aligned
    foundation models, and recently to probing the limits of test-time scaling and
    the need for functional benchmarks that test persistence and causality.'
  - 'Open questions: It remains unclear whether current video-based world models form
    a fundamental information bottleneck for fine-grained reasoning, how to derive
    formal guarantees that predict when imagined rollouts will fail, and how to close
    the gap between evaluation metrics and real-world task success.'
  related_work_outline_zh:
  - 主流方向：研究者正将视频生成模型形式化为世界模型，重点在于如何从视觉观测中构建内部状态和动力学，以及如何通过动作条件化使这些模型支持决策和物理推理。
  - 研究共性：工作都围绕动作条件视频预测这一核心机制，并越来越强调评估物理合理性和功能一致性，而非仅关注视觉保真度。
  - 关键差异：存在隐式状态构建（通过上下文管理）与显式状态构建（通过潜在压缩）的路线分歧，同时在物理对齐上也有后训练奖励建模、直接偏好优化和测试时验证等不同方案。
  - 趋势演进：在2024至2026年的前沿区间内，领域从适配预训练视频模型进行动作条件化，发展到构建大规模物理对齐的基础模型，最近则开始探查测试时缩放的极限，并呼吁建立测试持久性和因果推理的功能基准。
  - 开放问题：当前基于视频的世界模型是否构成细粒度推理的固有信息瓶颈、如何推导能预测想象轨迹何时失败的形式化保证、以及如何弥合评估指标与真实任务成功之间的差距，尚待解决。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented video-generation-as-world-model claims
        into a structured framework centered on state construction (implicit/explicit)
        and dynamics modeling (knowledge integration/architectural reformulation),
        clarifying what a world model must represent.
      what_remains_open: Whether this taxonomy translates into concrete design principles
        or evaluation protocols that change how researchers build and test world models,
        and whether the proposed categories capture all failure modes.
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies the conditions under which a video generation model
        can be considered a world model, such as requiring explicit state persistence
        and causal dynamics, thereby exposing the gap between current stateless generators
        and classic world model theory.
      what_remains_open: 'The formal conditions have not been empirically validated:
        it is unknown whether models that satisfy the definitions actually exhibit
        better physical consistency or planning performance in realistic settings.'
    - line: Scaling laws and guarantees
      what_it_solves: Connects test-time scaling and model size to expected improvements
        in spatial reasoning, revealing that current verifiers are poorly calibrated
        and that scaling does not consistently yield gains, which provides a reality
        check on assumed scaling properties.
      what_remains_open: No predictive law for when scaling will fail or transfer
        across tasks has been established; the observed information bottleneck is
        not yet formalized into a guarantee, and the boundary conditions for effective
        scaling remain unknown.
    consensus:
    - Action-conditioned video generation is the dominant paradigm for building world
      models in embodied settings, with the model expected to simulate future states
      given past observations and actions.
    - Visual fidelity alone is an insufficient evaluation metric; the community increasingly
      agrees that functional benchmarks measuring physical persistence, causal reasoning,
      and trajectory consistency are necessary.
    - Current video generation models are essentially stateless and lack explicit
      state construction, which is viewed as a key gap compared to classical world
      model theory.
    - Incorporating physical realism and task logic into video rollouts requires additional
      alignment steps beyond standard maximum-likelihood training.
    disagreements:
    - 'State representation: some works treat state as an implicit construct managed
      through context windows, while others advocate for explicit latent state compression
      to achieve persistence.'
    - 'Alignment mechanism: physical plausibility is enforced through diverse methods—reward-based
      RL post-training (ReWorld), DPO with decoupled discriminators (ABot-PhysWorld),
      learned action-conditioning masks (AVID), or test-time verifiers (ViSA)—with
      no consensus on which is most reliable.'
    - 'Evaluation target: different benchmarks (PBench, EZSbench, SAT-Real, MMSI-Bench)
      emphasize different aspects of world model quality, and the same model can show
      strong gains on one while failing on another, indicating no agreed-upon standard
      for “world model readiness.”'
    - 'Interaction mode: some models couple action and video generation tightly within
      a unified transformer (UWM), while others adapt a frozen pretrained video model
      from the outside, reflecting a split between integrated and modular designs.'
    open_questions:
    - Can video-based world models escape the information bottleneck identified in
      fine-grained spatial reasoning tasks, and what architectural changes would be
      required to do so?
    - How can we derive formal guarantees that predict when a world model’s imagined
      rollouts will diverge from reality, and under what conditions test-time scaling
      can help?
    - Are human preferences, as used in reward modeling for alignment, a scalable
      and unbiased signal for teaching physical laws to world models, or do they introduce
      new failure modes?
    - What is the minimal set of functional benchmarks that would replace visual fidelity
      metrics and reliably predict downstream task success in real-world robotics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的“视频生成作为世界模型”主张组织为以状态构建（隐式/显式）和动力学建模（知识整合/架构重构）为中心的结构化框架，澄清世界模型必须表示什么。
      尚未覆盖: 该分类法是否转化为具体的设计原则或评估协议，从而改变研究者构建和测试世界模型的方式，以及所提出的类别是否覆盖所有失败模式。
    - 路线: 形式化定义与假设
      解决的问题: 澄清视频生成模型在何种条件下才能被视为世界模型，例如需要显式状态持久化和因果动力学，由此暴露当前无状态生成器与经典世界模型理论之间的差距。
      尚未覆盖: 形式化条件尚未经过实证验证：尚不清楚满足这些定义的模型是否在真实场景中确实表现出更好的物理一致性或规划性能。
    - 路线: 缩放规律与保证
      解决的问题: 将测试时缩放和模型规模与空间推理的预期改进联系起来，揭示当前验证器校准不良且缩放并非总能带来增益，提供了对假设缩放性质的现实检验。
      尚未覆盖: 尚未建立预测缩放何时失败或跨任务迁移的规律；观测到的信息瓶颈尚未形式化为保证，有效缩放的边界条件仍是未知。
    共识:
    - 动作条件视频生成是具身场景中构建世界模型的主导范式，模型需基于过去观测和动作模拟未来状态。
    - 仅凭视觉保真度不足以作为评估指标；社区日益认同需要测量物理持久性、因果推理和轨迹一致性的功能基准。
    - 当前视频生成模型本质上是无状态的，缺乏显式状态构建，这被视为与经典世界模型理论之间的关键差距。
    - 将物理真实性和任务逻辑融入视频生成轨迹需要超出标准最大似然训练的额外对齐步骤。
    分歧:
    - 状态表示：部分工作将状态视为通过上下文窗口管理的隐式结构，另一些则倡导显式潜在状态压缩以实现持久化。
    - 对齐机制：物理合理性通过不同方法实现——基于奖励的RL后训练（ReWorld）、解耦判别器的DPO（ABot-PhysWorld）、学习到的动作条件掩码（AVID）或测试时验证器（ViSA），尚未就哪种最可靠达成共识。
    - 评测目标：不同基准（PBench、EZSbench、SAT-Real、MMSI-Bench）强调世界模型质量的不同侧面，同一模型可能在某一基准上大幅提升而在另一基准上失败，表明缺乏公认的“世界模型就绪”标准。
    - 交互模式：部分模型在统一Transformer中紧密耦合动作与视频生成（UWM），而另一些则从外部适配冻结的预训练视频模型，反映出集成设计与模块化设计的分歧。
    开放问题:
    - 基于视频的世界模型能否突破细粒度空间推理任务中识别出的信息瓶颈，需要何种架构改变才能实现？
    - 如何推导出形式化保证，以预测世界模型生成的想象轨迹何时偏离现实，以及在何种条件下测试时缩放能够提供帮助？
