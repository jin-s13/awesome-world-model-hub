  - 'Mainstream direction: World models are shifting from passive video generation
    toward interactive, controllable simulators that support action-conditioned generation,
    long-horizon memory, and real-time interactivity, with applications in robotics,
    autonomous driving, and embodied AI.'
  - 'Shared research pattern: Most works decompose the world into representations
    (latent states, primitives, or 3D entities) and learn a generative model to predict
    future observations under control signals, aiming to capture physical dynamics
    and compositional generalization.'
  - 'Key differences: Approaches vary in representation (continuous latent states,
    discrete tokens, hybrid), control modality (language, action vectors, ego-trajectories),
    and evaluation setting (simulation vs. real robots, open-source vs. closed), leading
    to different trade-offs in fidelity, latency, and out-of-distribution robustness.'
  - 'Trend evolution: Early work (2022) demonstrated world model-based robot learning
    with Dreamer; 2024–2026 saw a surge in video-generation-based world models, interactive
    benchmarks, and open-source simulators, accompanied by unifying taxonomies and
    evaluation frameworks for driving and interactive video.'
  - 'Open questions: How to rigorously evaluate physical plausibility and long-term
    consistency, how to generalize beyond training primitives or scenes, and how to
    align world models with safety-critical decision-making without sacrificing real-time
    performance.'
  related_work_outline_zh:
  - 主流方向：世界模型正从被动视频生成转向支持动作条件生成、长时记忆和实时交互的可控模拟器，应用于机器人、自动驾驶和具身智能。
  - 研究共性：多数工作将世界分解为表示（隐状态、原语或三维实体），并学习生成模型，在控制信号下预测未来观测，旨在捕捉物理动态和组合泛化。
  - 关键差异：方法在表示形式（连续潜在状态、离散令牌、混合）、控制模态（语言、动作向量、自车轨迹）和评估设定（仿真 vs 真实机器人、开源 vs 闭源）上存在差异，导致在保真度、延迟和分布外鲁棒性上的不同权衡。
  - 趋势演进：早期工作（2022）展示了基于 Dreamer 的物理机器人学习；2024–2026 年涌现出基于视频生成的世界模型、交互式基准和开源模拟器，同时出现了针对自动驾驶和交互式视频的统一分类法和评估框架。
  - 开放问题：如何严格评估物理合理性和长期一致性，如何泛化到训练原语或场景之外，以及如何在保证实时性能的前提下将世界模型与安全关键决策对齐。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes the design space of world models—e.g., by latent representations,
        structural priors, and application domains—to map fragmented progress into
        coherent directions and identify research gaps.
      what_remains_open: These taxonomies are often based on selective literature
        reviews and lack systematic empirical validation of the proposed categories
        or the claimed gaps.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different benchmarks, metrics, and evaluation
        protocols (e.g., open-loop vs. closed-loop, visual fidelity vs. control accuracy)
        shape conclusions about world model capabilities across applications like
        autonomous driving and interactive video.
      what_remains_open: Whether the compared results are truly compatible across
        disparate settings, and whether proposed metrics (e.g., object manipulation
        control scores) capture real-world usefulness.
    - line: Open problem and gap mapping
      what_it_solves: Translates broad literature coverage into concrete next-step
        research questions, such as out-of-sight dynamics, real-time interactivity,
        and compositional generalization to unseen primitives.
      what_remains_open: Prioritization of which gaps are most critical for progress,
        and whether the identified challenges are grounded in reproducible failure
        modes or only in qualitative observations.
    consensus:
    - World models that generate future observations from actions are becoming central
      to robotics, autonomous driving, and interactive video, as they enable planning
      and simulation without real-world rollouts.
    - 'Compositional generalization is a key desired property: models should handle
      novel combinations of seen concepts, though the definition of ‘composition’
      varies from language primitives to latent structural priors.'
    - Long-horizon consistency and persistence of out-of-sight entities are recognized
      as major challenges that current video-based world models still struggle to
      solve.
    - Real-time or near-real-time interactivity is a practical requirement for deployment,
      driving model design toward efficient inference and memory mechanisms.
    - Open-source releases and benchmarks are considered essential for reproducible
      progress, but the field lacks a unified, widely accepted evaluation protocol
      that covers both visual quality and physical plausibility.
    disagreements:
    - 'Representation choice: some works advocate for continuous latent states with
      structural priors (geometry, topology), while others adopt discrete token-based
      representations or mixed approaches, each claiming better sample efficiency
      or controllability.'
    - 'Supervision and control: some models rely on sparse rewards and direct interaction
      for learning, while others use dense supervision from language parsing, ego-trajectories,
      or human poses, leading to different generalization and data requirements.'
    - 'Evaluation target: there is tension between evaluating in simulation (safe,
      reproducible) and on physical robots (real-world validity), with no consensus
      on when simulation results transfer to real settings.'
    - 'Interaction mode: works differ in whether they condition on language instructions,
      action vectors, goal images, or multimodal inputs, and it is unclear which mode
      yields the most generalizable world dynamics.'
    - 'Deployment setting: open-source simulators emphasize accessibility and modularity,
      whereas closed models (e.g., Sora) demonstrate higher raw fidelity but cannot
      be independently verified or adapted, raising questions about reproducibility.'
    open_questions:
    - How can we design benchmarks that reliably measure physical consistency, object
      permanence, and causal reasoning in world models, beyond pixel-level reconstruction
      quality?
    - What form of representation and structural prior best balances long-horizon
      stability, real-time latency, and generalization to novel objects and actions?
    - Under what conditions do world models trained in simulation or on static datasets
      transfer to dynamic, real-world environments without catastrophic forgetting
      or unsafe behavior?
    - How should the field prioritize between improving generative fidelity, interactivity,
      compositional generalization, and safety verification, given the limited evidence
      of systematic trade-off studies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将世界模型的设计空间（如潜在表示、结构先验、应用领域）组织成连贯的方向，把碎片化进展映射为研究蓝图和缺口。
      尚未覆盖: 分类体系多基于选择性文献回顾，缺乏对所提类别或声称缺口的系统性实证验证。
    - 路线: 对比评测综合
      解决的问题: 总结不同基准、指标和评测协议（如开环与闭环、视觉保真度与控制精度）如何影响对世界模型能力的结论，涵盖自动驾驶、交互式视频等应用。
      尚未覆盖: 被比较的结果在不同设定下是否真正兼容，以及所提指标（如物体操控控制分）能否反映真实场景的实用性。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛的文献覆盖转化为具体的下一步研究问题，例如视线外动态、实时交互、对未见原语的组合泛化。
      尚未覆盖: 哪些缺口对进步最关键的优先级排序，以及所识别的挑战是基于可复现的失败模式，还是仅基于定性观察。
    共识:
    - 从动作预测未来观测的世界模型正成为机器人、自动驾驶和交互式视频的核心，因为它们能在无真实世界执行的情况下进行规划与模拟。
    - 组合泛化是被广泛追求的属性：模型应能处理已有概念的未见组合，但“组合”的定义从语言原语到潜在结构先验各有不同。
    - 长时间一致性和视线外实体的持续存在被公认为当前基于视频的世界模型仍难以解决的主要挑战。
    - 实时或近实时交互是部署的实际需求，推动模型设计向高效推理和记忆机制发展。
    - 开源发布和基准测试被视为可复现进展的必要条件，但领域缺乏统一、广泛接受的评估协议，能同时覆盖视觉质量和物理合理性。
    分歧:
    - 表示选择：部分工作主张使用带有结构先验（几何、拓扑）的连续潜在状态，另一些采用离散令牌或混合表示，各自声称在样本效率或可控性上更优。
    - 监督与控制：部分模型依赖稀疏奖励和直接交互学习，另一些则使用来自语言解析、自车轨迹或人体姿态的密集监督，导致不同的泛化能力和数据需求。
    - 评测目标：在仿真中评估（安全、可复现）与在物理机器人上评估（真实有效性）之间存在张力，对于仿真结果何时能迁移到真实环境尚无共识。
    - 交互模式：工作之间在是基于语言指令、动作向量、目标图像还是多模态输入进行条件生成上存在差异，哪种模式能产生最泛化的世界动力学尚不明确。
    - 部署设定：开源模拟器强调可访问性和模块化，而闭源模型（如 Sora）展示更高原始保真度，但无法独立验证或适配，引发可复现性问题。
    开放问题:
    - 如何设计能可靠衡量世界模型物理一致性、物体持久性和因果推理的基准，而不只依赖像素级重建质量？
    - 何种表示和结构先验能最佳平衡长时域稳定性、实时延迟和对新物体新动作的泛化？
    - 在仿真或静态数据集上训练的世界模型，在何种条件下能迁移到动态真实环境，且不发生灾难性遗忘或危险行为？
    - 在缺乏系统性权衡研究的证据下，领域应如何优先排序生成保真度、交互性、组合泛化与安全验证？
