  related_work_outline_zh:
  - 主流方向：主流路线是将动作可控世界模型和视频生成器转化为可部署的闭环模拟器，重点在自动驾驶和具身控制；评测与基准构建紧密相关。
  - 研究共性：多数工作将生成模型与显式控制或上下文通路结合，并通过动作忠实度、空间一致性、物理合理性或零样本策略泛化等任务特定指标评测。
  - 关键差异：控制注入方式不同，包括多视图扩散结构控制、插件式动作模块、上下文条件循环状态空间、物理信息损失；评测目标和部署领域也不同。
  - 趋势演进：可见顶级证据集中在2024–2026年，从开放环视频质量转向闭环可控性、长时一致性、实时服务与可复用基准。
  - 开放问题：独立复现、超出有限基准的泛化，以及视觉保真、物理准确性、控制遵循和亚秒级延迟之间的权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Deployable closed-loop driving simulation
      what_it_solves: Generates multi-view, action-conditioned future video for autonomous
        driving simulators with emphasis on geometric consistency and low-latency
        serving.
      what_remains_open: Evidence is concentrated on nuScenes; generalization to other
        environments, sensor configurations, and long-horizon degradation remains
        weakly verified.
    - line: Context-conditioned world-model generalization for reinforcement learning
      what_it_solves: Improves zero-shot policy generalization by conditioning latent
        dynamics and imagination on observable context values.
      what_remains_open: Assumes observable context and is evaluated on only two contextual
        RL tasks; broader hidden-context settings are not established.
    - line: Physics-informed embodied video generation
      what_it_solves: Joins RGB video generation with depth and keypoint dynamics
        to improve physical plausibility and downstream robot policy utility.
      what_remains_open: Reported results support visual and physical plausibility,
        but limitation evidence is missing; independent validation across varied embodiments
        is absent.
    - line: Benchmarks for world-model capability gaps
      what_it_solves: Creates datasets and metrics for spatial consistency or action
        fidelity instead of relying only on visual quality scores.
      what_remains_open: They define protocols and provide examples, but do not close
        the capability gap or prove benchmark scores transfer to closed-loop task
        performance.
    - line: Open artifacts and reproducible evaluation stacks
      what_it_solves: Provides code, datasets, or benchmark frameworks so systems
        can be inspected and compared.
      what_remains_open: Several papers lack visible artifact links or limitation
        details; cross-team independent reproduction is under-evidenced.
    consensus:
    - Controllable future-state generation is treated as central to usable world-model
      systems, moving beyond unconditional or purely visual video generation.
    - Evaluation increasingly includes task-specific proxies such as action fidelity,
      spatial consistency, physical plausibility, or downstream policy utility rather
      than only FID/FVD-style quality.
    - Benchmarks and datasets are often coupled with model contributions to make control
      and consistency claims measurable.
    - Closed-loop, long-horizon, and real-time serving concerns are visible, but evidence
      for them is uneven across the sampled systems.
    disagreements:
    - 'Control conditioning is represented in multiple ways: structured multi-view
      diffusion control, lightweight action modules inserted into pre-trained generators,
      context-conditioned recurrent state-space dynamics, and physics-informed auxiliary
      objectives.'
    - 'Evaluation targets differ: open-loop action-fidelity benchmarks, spatial-consistency
      benchmarks, zero-shot contextual-RL generalization, embodied physical plausibility,
      and closed-loop driving simulation are not aligned under a common protocol.'
    - 'Assumptions about context differ: some work assumes observable context values,
      while others learn action or physics representations from pixels or motion.'
    - Some systems optimize for visual fidelity and control adherence, while others
      prioritize dynamics consistency or sample efficiency, leading to different failure
      modes and incomparable claims.
    open_questions:
    - Can current action-controllable simulators maintain spatial, physical, and action
      consistency when deployed outside narrow evaluation domains such as nuScenes,
      Minecraft, or CARL?
    - Which control representation best supports both high-fidelity video generation
      and sub-second closed-loop serving without per-domain hand-tuning?
    - Do benchmark metrics such as spatial consistency and action fidelity predict
      downstream closed-loop policy performance or robotics transfer?
    - What evidence is needed to establish independent reproducibility for these systems
      across different teams, datasets, and infrastructure given uneven artifact release?
    - How should systems handle partially observed or non-stationary context when
      the evaluated contextual method assumes full observability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可部署闭环驾驶模拟
      解决的问题: 为自动驾驶模拟器生成多视图、动作条件的未来视频，强调几何一致性和低延迟服务。
      尚未覆盖: 证据集中在nuScenes；对其他环境、传感器配置以及长时程退化的验证仍然有限。
    - 路线: 上下文条件世界模型的强化学习泛化
      解决的问题: 通过可观测上下文值条件化潜在动力学和想象轨迹，改善零样本策略泛化。
      尚未覆盖: 假设上下文可观测，且仅在两个上下文强化学习任务上评估；更广泛的隐上下文场景尚不成立。
    - 路线: 物理信息驱动的具身视频生成
      解决的问题: 联合RGB视频生成与深度和关键点动力学，提升物理合理性及下游机器人策略效用。
      尚未覆盖: 结果报告了视觉和物理合理性，但局限证据缺失；跨不同机器人的独立验证不足。
    - 路线: 世界模型能力缺口基准
      解决的问题: 构建数据集与指标，衡量空间一致性或动作忠实度，而不仅依赖视觉质量分数。
      尚未覆盖: 定义了协议和示例，但未弥合能力缺口，也未证明基准得分能迁移到闭环任务性能。
    - 路线: 开放工件与可复现评测栈
      解决的问题: 通过代码、数据集或基准框架使系统可检查、可比较。
      尚未覆盖: 若干论文缺少可见工件链接或局限细节；跨团队独立复现证据不足。
    共识:
    - 可控未来状态生成被视为可用世界模型系统的核心，超越无条件或纯视觉视频生成。
    - 评测越来越多包含动作忠实度、空间一致性、物理合理性或下游策略效用等任务代理指标，而不仅是FID/FVD式质量。
    - 基准与数据集常与模型贡献一并发布，以使控制与一致性声明可测量。
    - 闭环、长时程与实时服务关注可见，但抽样系统之间的证据不均衡。
    分歧:
    - 控制条件化有多种表示：多视图结构化扩散控制、插入预训练生成器的轻量动作模块、上下文条件循环状态空间动力学，以及物理信息辅助目标。
    - 评测目标不同：开放环动作忠实度基准、空间一致性基准、零样本上下文强化学习泛化、具身物理合理性和闭环驾驶模拟之间缺乏统一协议。
    - 对上下文的假设不同：部分工作假设上下文可观测，而其他工作从像素或运动学习动作或物理表示。
    - 部分系统优先视觉保真与控制遵循，另一些优先动力学一致性或样本效率，导致失败模式不同且声明难以比较。
    开放问题:
    - 当前动作可控模拟器在超出nuScenes、Minecraft或CARL等狭窄评测域后，能否保持空间、物理和动作一致性？
    - 哪种控制表示能同时支持高保真视频生成与亚秒级闭环服务，而无需逐域手工调整？
    - 空间一致性和动作忠实度等基准指标能否预测下游闭环策略性能或机器人迁移？
    - 在工件发布不均衡情况下，需要什么证据才能建立这些系统跨团队、数据集和基础设施的独立可复现性？
    - 当被评估的上下文方法假设完全可观测时，系统应如何处理部分可观测或非平稳上下文？
