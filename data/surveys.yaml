  related_work_outline:
  - 'Mainstream direction: Domain-specific world models are being built for robotics,
    driving, and interactive environments, using transformer or diffusion architectures
    to predict future video/state from actions or instructions for policy learning,
    planning, and evaluation.'
  - 'Shared research pattern: Future video/dynamics prediction is combined with auxiliary
    objectives or context such as mask reconstruction, physics cues, action diffusion,
    or explicit context variables; evaluation is moving beyond pixel fidelity toward
    consistency, memory, action control, and physical plausibility.'
  - 'Key differences: Work varies by interaction mode (open-loop generation versus
    closed-loop action-conditioned rollout), conditioning signals (language, context,
    action, physics), architecture, and evaluation target (RL score, driving prediction,
    robot fidelity, consistency benchmark).'
  - 'Trend evolution: Within this current frontier, 2023 work stressed sample-efficient
    Atari RL; 2024 introduced contextual and compositional robot imagination; 2025
    produced driving multi-view, physics-informed, and unified video-action models;
    2026 adds memory/action-control benchmarking.'
  - 'Open questions: Whether simulation or benchmark gains transfer to real robots,
    driving, and open worlds; whether models generalize beyond seen contexts or primitive
    combinations; and which evaluation signals best predict downstream utility.'
  related_work_outline_zh:
  - 主流方向：面向机器人、驾驶和交互环境的领域化世界模型，以Transformer或扩散结构根据动作或指令预测未来视频/状态，用于策略学习、规划与评测。
  - 研究共性：将未来视频或动力学预测与辅助任务或上下文结合；评测从像素保真转向空间一致性、记忆一致性、动作控制和物理合理性。
  - 关键差异：交互模式分开环预测与闭环策略/动作控制；条件信号包括语言原语、可观测上下文、动作扩散或物理辅助任务；评测目标各异。
  - 趋势演进：2023年左右聚焦Atari样本高效强化学习；2024年出现上下文世界模型与组合式机器人想象；2025年集中出现驾驶多视角、物理约束和统一视频-动作模型；2026年出现记忆/动作控制基准。总体属于当前前沿。
  - 开放问题：仿真或基准收益能否迁移到真实机器人、驾驶和开放环境；模型能否泛化到全新动作、原语或动力学；何种评测最能预测下游效用。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models and policy learning
      what_it_solves: Generate future robot observations and actions from language
        instructions or large-scale robot data, supporting robot imagination, pretraining,
        and policy learning.
      what_remains_open: Generalization beyond seen primitive combinations or embodiments;
        current evidence is mostly simulation or offline video with limited real-robot
        closed-loop validation.
    - line: Autonomous driving world models and multi-view scene prediction
      what_it_solves: Long-horizon, multi-view future video generation for driving
        scenes, aimed at scenario prediction, closed-loop simulation, and policy evaluation.
      what_remains_open: Whether improved video prediction or zero-shot dataset transfer
        corresponds to safer real-world driving outcomes.
    - line: Interactive agent and game world models for control
      what_it_solves: Learning compact dynamics models from limited visual interactions
        in Atari, CARL, and Minecraft-style environments to improve sample-efficient
        reinforcement learning and zero-shot policy transfer.
      what_remains_open: Generalization when contexts, dynamics, or goals change beyond
        training distributions; current evidence covers few tasks or environments.
    - line: Consistency and action-control benchmarks for world models
      what_it_solves: Provide reusable datasets and metrics for spatial/memory consistency
        and action controllability, moving beyond pixel-level generation quality.
      what_remains_open: Benchmark scores are not yet tied to downstream task success
        or real-world reliability, making their predictive utility a verification
        gap.
    consensus:
    - Recent application work treats world models as action- or instruction-conditioned
      video/dynamics predictors rather than passive generators, coupling future observation
      generation with policy, planning, or control objectives.
    - There is convergence on scalable transformer or diffusion-style architectures
      for visual prediction across driving, robotics, and interactive environments.
    - Evaluation is shifting from frame fidelity alone toward behavioral properties
      such as spatial consistency, long-term memory, physical plausibility, and action-conditioned
      control.
    - Current evidence is concentrated in curated datasets, benchmarks, or simulation;
      real deployment evidence remains limited.
    disagreements:
    - 'Interaction mode differs: some systems evaluate open-loop future video generation,
      while others run closed-loop policy learning or action-conditioned rollout,
      making task utility comparisons indirect.'
    - 'Conditioning and supervision differ: approaches use language primitives, explicit
      context variables, coupled video-action diffusion timesteps, or physics-based
      auxiliary tasks to encode actions and dynamics.'
    - 'Evaluation targets differ: standard reinforcement learning scores, driving
      prediction quality, robot video fidelity, and benchmarked memory/action consistency
      reward different model properties.'
    - 'Architectural assumptions differ: stochastic recurrent state-space, transformer
      plus VAE, diffusion transformer, and factored compositional generators make
      distinct tradeoffs around stochasticity, memory, and composition.'
    open_questions:
    - How well do simulation or benchmark gains transfer to physical robots, real
      driving, and open-world interactive systems when environment distribution shifts?
    - Can world models handle entirely new action spaces, object primitives, or dynamics
      contexts instead of only recombining seen inputs?
    - 'Which evaluation signal best predicts downstream usefulness: visual realism,
      physical plausibility, memory consistency, action control, or policy return?'
    - Do auxiliary objectives such as physics prediction, mask reconstruction, or
      spatial consistency improve real task performance, or mainly leaderboard metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人与策略学习的领域世界模型
      解决的问题: 根据语言指令或大规模机器人数据生成未来观察和动作，支持机器人想象、预训练与策略学习。
      尚未覆盖: 对未见原语组合和本体的泛化证据有限；多数验证停留在仿真或离线数据，真实机器人闭环验证不足。
    - 路线: 自动驾驶世界模型与多视角场景预测
      解决的问题: 实现驾驶场景的长时域、多视角未来视频生成，用于场景预测、闭环仿真和策略评测。
      尚未覆盖: 视频预测或跨数据集零样本增益与真实驾驶安全效果之间的一致性尚未验证。
    - 路线: 交互智能体与游戏世界模型
      解决的问题: 从Atari、CARL和Minecraft式环境中的有限视觉交互中学习紧凑动力学模型，提升样本高效强化学习和策略迁移。
      尚未覆盖: 上下文、动力学或游戏目标超出训练分布时的泛化；当前证据覆盖任务较少。
    - 路线: 世界模型一致性与动作控制评测基准
      解决的问题: 提供可复用数据集和指标，从空间/记忆一致性和动作可控性角度超越像素级相似度评测。
      尚未覆盖: 基准分数与下游任务成功率或真实部署可靠性之间的相关性仍属验证缺口。
    共识:
    - 近期应用工作将世界模型视为动作或指令条件下的视频/动力学预测器，并把未来观察生成与策略、规划或控制目标耦合，而非被动生成。
    - 在驾驶、机器人和交互领域，Transformer或扩散式可扩展视觉预测正在成为共同架构选择。
    - 评测重心正从帧保真度转向空间一致性、长期记忆、物理合理性和动作可控性等行为属性。
    - 现有证据主要来自数据集、基准或仿真；真实部署的可验证证据仍普遍缺失。
    分歧:
    - 交互模式不同：部分系统评开环未来视频生成，部分评闭环策略学习或动作条件滚动，难以直接比较任务效用。
    - 条件与监督不同：分别采用语言原语、显式上下文变量、视频-动作扩散时间步或物理辅助任务来编码动作与动力学。
    - 评测目标不同：标准强化学习得分、驾驶预测质量、机器人视频保真度以及基准化的记忆/动作一致性各自奖励不同属性。
    - 表示假设不同：随机循环状态空间、Transformer加VAE、扩散Transformer和组合式生成器在随机性、记忆和组合性上存在差异。
    开放问题:
    - 仿真或基准表现能否迁移到物理机器人、真实驾驶和开放世界交互系统？
    - 世界模型能否处理全新动作空间、物体原语或动力学上下文，而不仅是已见输入的重新组合？
    - 视觉真实、物理合理性、记忆一致性、动作控制或策略回报中，哪种指标更能预测下游效用？
    - 物理预测、掩码重建或空间一致性等辅助目标，是提升实际任务表现还是仅改善排行榜指标？
