  - 'Shared research pattern: papers propose a generative model (often diffusion or
    autoregressive) conditioned on actions or context, train on large-scale domain-specific
    datasets, and release code, datasets, or benchmarks to enable reproducibility.'
  - 'Key differences: they differ in representational choices (diffusion vs. autoregressive
