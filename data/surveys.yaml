  related_work_outline:
  - 'Mainstream direction: Building domain-specific world models for robotics, autonomous
    driving, and interactive agents, with a strong emphasis on video generation as
    the core predictive modality.'
  - 'Shared research pattern: Combining diffusion models or Transformers with auxiliary
    tasks (mask reconstruction, depth prediction, keypoint dynamics) to improve visual
    fidelity and physical plausibility.'
  - 'Key differences: Supervision signals vary widely—some use explicit physics (depth,
    keypoints), others use language primitives or context variables; evaluation targets
    range from pixel-level video quality to policy performance and spatial/memory
    consistency.'
  - 'Trend evolution: From efficient Atari world models (2023) to large-scale pretraining
    on robot datasets and physics-informed generation (2024–2025), followed by dedicated
    benchmarks for memory and action control (2025–2026), indicating a shift toward
    rigorous, closed-loop evaluation.'
  - 'Open questions: Whether simulation gains translate to real-world safety and operational
    reliability, how to generalize across unseen embodiments and action spaces, and
    how to unify evaluation protocols for long-horizon consistency.'
  related_work_outline_zh:
  - 主流方向：构建面向机器人、自动驾驶和交互式智能体的领域世界模型，以视频生成为核心预测模态。
  - 研究共性：将扩散模型或Transformer与辅助任务（掩码重建、深度预测、关键点动力学）结合，提升视觉保真度和物理合理性。
  - 关键差异：监督信号差异大——有的使用显式物理（深度、关键点），有的使用语言原语或上下文变量；评测目标从像素级视频质量到策略性能和空间/记忆一致性不等。
  - 趋势演进：从高效的Atari世界模型（2023年）到大规模机器人数据集预训练和物理信息生成（2024–2025年），再到专门的记忆与动作控制基准（2025–2026年），表明领域正转向严格的闭环评估。
  - 开放问题：仿真收益能否转化为真实世界的安全与运行可靠性，如何泛化到未见本体和动作空间，以及如何统一长时域一致性的评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Long-horizon, multi-view video prediction for scene forecasting
        and closed-loop simulation in driving.
      what_remains_open: Alignment between simulation improvements and real-world
        safety outcomes; generalization across diverse driving datasets and sensor
        setups without fine-tuning.
    - line: Embodied robot world models
      what_it_solves: Video-based imagination for robot manipulation, integrating
        language, physics, and action to enable policy learning and compositional
        task generalization.
      what_remains_open: Transfer across different robot embodiments and physical
        environments; handling entirely novel object-action combinations beyond training
        primitives; bridging sim-to-real gap.
    - line: Interactive environment benchmarks for world models
      what_it_solves: Evaluating spatial consistency, memory, and action controllability
        in open-domain world models through curated datasets and metrics.
      what_remains_open: Long-term memory maintenance and generalization across varied
        action spaces; coverage of diverse interactive scenarios beyond current game-based
        environments.
    consensus:
    - Video generation is the dominant predictive interface for world models in applications,
      often implemented with diffusion transformers or VAE-Transformer hybrids.
    - Auxiliary tasks (mask reconstruction, depth, keypoints) are widely adopted to
      inject structural or physical knowledge and improve generation quality.
    - Pretraining on large-scale, multi-task datasets (e.g., robot manipulation, driving
      logs) is emerging as a key strategy for improving generalization and robustness.
    - Evaluation is moving beyond visual fidelity to include physical plausibility,
      memory consistency, and action controllability.
    disagreements:
    - 'Supervision type: explicit physics signals (depth, keypoints) versus implicit
      context variables (mass, dimensions) versus language-primitive decomposition.'
    - 'Evaluation target: pixel-level video quality metrics versus downstream task
      performance (policy success rate) versus dedicated consistency benchmarks.'
    - 'Interaction mode: open-loop video prediction for planning versus closed-loop
      action-conditioned generation for policy training.'
    - 'Deployment setting: simulation-only validation versus real-robot execution;
      game environments versus real-world driving scenes.'
    open_questions:
    - How can we verify that improvements in simulated world model predictions lead
      to safer or more reliable real-world behavior?
    - What evaluation protocols can capture long-horizon memory and cross-action-space
      generalization in a unified way?
    - Can compositional generalization be extended to entirely novel primitives not
      seen during training, and what inductive biases are needed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 用于驾驶场景预测和闭环仿真的长时域、多视角视频生成。
      尚未覆盖: 仿真改进与真实世界安全结果的一致性；跨不同驾驶数据集和传感器配置的零样本泛化。
    - 路线: 具身机器人世界模型
      解决的问题: 基于视频的机器人想象，融合语言、物理和动作，支持策略学习和组合任务泛化。
      尚未覆盖: 跨不同机器人本体和物理环境的迁移；处理训练原语之外的全新物体-动作组合；弥合仿真到真实的差距。
    - 路线: 交互式环境世界模型基准
      解决的问题: 通过精心设计的数据集和指标，评估开放域世界模型的空间一致性、记忆和动作可控性。
      尚未覆盖: 长期记忆维持和跨多样化动作空间的泛化；覆盖当前游戏环境之外的更广泛交互场景。
    共识:
    - 视频生成是应用领域世界模型的主要预测接口，常采用扩散Transformer或VAE-Transformer混合架构。
    - 广泛采用辅助任务（掩码重建、深度、关键点）注入结构或物理知识，提升生成质量。
    - 在大规模多任务数据集（如机器人操作、驾驶日志）上预训练正成为提升泛化性和鲁棒性的关键策略。
    - 评估正从视觉保真度扩展到物理合理性、记忆一致性和动作可控性。
    分歧:
    - 监督类型：显式物理信号（深度、关键点）对比隐式上下文变量（质量、尺寸）对比语言原语分解。
    - 评测目标：像素级视频质量指标对比下游任务性能（策略成功率）对比专用一致性基准。
    - 交互模式：用于规划的开环视频预测对比用于策略训练的闭环动作条件生成。
    - 部署场景：仅仿真验证对比真实机器人执行；游戏环境对比真实驾驶场景。
    开放问题:
    - 如何验证仿真世界模型预测的改进能带来更安全或更可靠的现实世界行为？
    - 什么样的评估协议能够统一捕捉长时域记忆和跨动作空间泛化？
    - 组合泛化能否扩展到训练中未见过的全新原语，需要哪些归纳偏置？
