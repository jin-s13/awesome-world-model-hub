  related_work_outline:
  - 'Mainstream direction: World models are being deployed across autonomous driving,
    robotics, and interactive games, with diffusion-based architectures dominating
    video prediction and policy learning.'
  - 'Shared research pattern: A generative world model learns environment dynamics
    from visual and action data, then serves as a learned simulator for downstream
    tasks like planning, policy evaluation, or zero-shot generalization.'
  - 'Key differences: Objectives vary from visual fidelity and physical plausibility
    to policy performance; supervision ranges from paired video-action to action-free
    video and physics priors; evaluation spans open-loop metrics, closed-loop simulation,
    and real-robot execution.'
  - 'Trend evolution: Earlier work focused on efficient transformer-based world models
    for Atari; recent advances shift to driving and robotics, incorporating physical
    knowledge, compositional language decomposition, and unified video-action diffusion
    pretraining on large robot datasets.'
  - 'Open questions: Real-world safety validation and sim-to-real transfer remain
    unverified; systematic cross-embodiment generalization is lacking; physical plausibility
    metrics are not standardized; model reliability under distribution shift is an
    open concern.'
  related_work_outline_zh:
  - 主流方向：世界模型正被部署到自动驾驶、机器人和交互式游戏中，扩散架构主导视频预测与策略学习。
  - 研究共性：生成式世界模型从视觉和动作数据中学习环境动力学，作为下游规划、策略评估或零样本泛化的学习型模拟器。
  - 关键差异：优化目标从视觉保真度、物理合理性到策略性能各异；监督信号包括成对视频-动作、无动作视频和物理先验；评估涵盖开环指标、闭环仿真和真实机器人执行。
  - 趋势演进：早期工作聚焦于Atari的高效Transformer世界模型；近期转向驾驶与机器人，引入物理知识、组合式语言分解以及在大规模机器人数据集上的统一视频-动作扩散预训练。
  - 开放问题：真实世界安全验证与仿真到现实迁移尚未验证；跨本体系统泛化研究不足；物理合理性度量不统一；分布偏移下的模型可靠性仍是开放议题。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robotics and control tasks by learning
        domain-specific dynamics, decomposing language instructions into primitive
        actions, and injecting physics knowledge for realistic video synthesis.
      what_remains_open: Compositional generalization is limited to seen primitives;
        real-robot deployment and sim-to-real transfer lack systematic evidence; physical
        reasoning relies on simulated data, leaving real-world validity unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view, long-horizon video prediction
        and closed-loop driving simulation, supporting policy evaluation and scene
        generation.
      what_remains_open: Alignment between simulation improvements and real-world
        driving safety or operational metrics remains unmeasured; cross-city and cross-dataset
        zero-shot performance is only partially explored.
    - line: Interactive agents and games
      what_it_solves: Builds efficient world models for reinforcement learning in
        game environments and introduces spatial-consistency benchmarks to evaluate
        memory and generalization.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change is unaddressed; benchmarks cover limited game types, and transfer to
        non-game interactive settings is not shown.
    consensus:
    - World models are treated as generative simulators that predict future observations
      given actions, and they enable downstream decision-making without direct environment
      interaction.
    - Diffusion and transformer architectures are the dominant backbones for learning
      dynamics, often combined with variational or masked autoencoding objectives.
    - Improving generalization—across tasks, contexts, or embodiments—is a shared
      goal, with compositional and contextual approaches emerging as promising directions.
    - Physical plausibility and action adherence are increasingly recognized as critical
      qualities for world models used in embodied applications, beyond pixel-level
      accuracy.
    disagreements:
    - 'Primary evaluation focus differs: some works optimize visual reconstruction
      quality and long-horizon prediction FID, while others target policy performance
      gains in model-based RL or zero-shot generalization.'
    - 'Supervision modality varies: some methods require paired video-action trajectories,
      others leverage action-free video data, and a few explicitly incorporate physics-related
      auxiliary tasks such as depth or keypoint dynamics.'
    - 'Interaction mode differs: open-loop video prediction benchmarks versus closed-loop
      policy evaluation inside the model’s imagined rollouts, with the latter exposing
      different failure modes like overestimation bias.'
    - 'Deployment setting and realism: some are validated only in simulated environments
      or offline datasets, whereas others aim for real-robot execution, though real-world
      validation remains limited across all lines.'
    open_questions:
    - How can we systematically validate that world model improvements translate to
      safer or more reliable behavior in real-world autonomous systems?
    - What benchmarks and metrics are needed to measure physical consistency and sim-to-real
      transfer beyond visual fidelity, especially for robotic manipulation and navigation?
    - Can world models generalize to entirely novel object categories, dynamics, or
      task instructions that were never seen during training, and what learning paradigms
      support this?
    - How do we reduce overestimation bias and instability in policy evaluation when
      using learned world models as simulators, and can reinforcement learning-based
      model refinement offer a scalable solution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等控制任务，学习领域特定的动力学，将语言指令分解为原语动作，并注入物理知识以生成逼真的视频。
      尚未覆盖: 组合泛化仅限于已见原语；真实机器人部署与仿真到现实迁移缺乏系统性证据；物理推理依赖仿真数据，真实世界有效性未验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角、长时域视频预测和闭环驾驶仿真，支持策略评估和场景生成。
      尚未覆盖: 仿真收益与真实驾驶安全或运营指标的一致性未测量；跨城市、跨数据集的零样本性能仅被部分探索。
    - 路线: 交互式智能体与游戏
      解决的问题: 在游戏环境中构建高效世界模型用于强化学习，并引入空间一致性基准评估记忆与泛化能力。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化未解决；基准覆盖游戏类型有限，到非游戏交互场景的迁移未展示。
    共识:
    - 世界模型被视为给定动作预测未来观察的生成式模拟器，使得无需直接环境交互即可进行下游决策。
    - 扩散与Transformer架构是学习动力学的主流骨干，常与变分或掩码自编码目标结合。
    - 提升跨任务、跨上下文或跨本体的泛化能力是共同目标，组合式和上下文式方法成为有前景的方向。
    - 物理合理性与动作一致性逐渐被认为是具身应用世界模型的关键品质，超越像素级精度。
    分歧:
    - 主要评估焦点不同：部分工作优化视觉重建质量和长时域预测FID，另一些则追求基于模型RL或零样本泛化的策略性能提升。
    - 监督模态各异：有的要求成对视频-动作轨迹，有的利用无动作视频数据，还有少数显式引入深度或关键点动力学等物理相关辅助任务。
    - 交互模式不同：开环视频预测基准与在模型想象展开中的闭环策略评估，后者暴露不同的失败模式，如过估计偏差。
    - 部署场景与真实度：部分仅在仿真环境或离线数据集上验证，另一些则瞄准真实机器人执行，但所有路线下的真实世界验证仍有限。
    开放问题:
    - 如何系统验证世界模型的改进能转化为真实世界自主系统中更安全或更可靠的行为？
    - 需要哪些基准和指标才能衡量超越视觉保真度的物理一致性和仿真到现实迁移，特别是对机器人操作与导航？
    - 世界模型能否泛化到训练中从未出现过的全新物体类别、动力学或任务指令，哪种学习范式能支持这一点？
    - 如何减少使用学习型世界模型进行策略评估时的过估计偏差和不稳定性，基于强化学习的模型精炼能否提供可扩展的解决方案？
