    - 评测目标不同：驾驶视频预测指标、机器人仿真策略成功、Atari人类标准化分数、记忆与动作一致性基准。
    - 部署假设不同：部分依赖可观测上下文或预定义原语解析，部分依赖大规模多任务或无动作视频数据。
