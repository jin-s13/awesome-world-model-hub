  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven evaluation platforms for world models
      what_it_solves: Creates datasets and metrics to test spatial and action fidelity,
        turning informal generation quality into measurable model behavior.
      what_remains_open: Evidence is concentrated in Minecraft or driving scenes;
        independent replication across environments and hardware is not yet shown.
    - line: Action-controllable closed-loop simulators
      what_it_solves: Generates future video from trajectory or action controls and
        supports low-latency closed-loop simulation, including sub-second driving
        video generation.
      what_remains_open: Generalization beyond nuScenes-like settings, long-horizon
        cross-view consistency, and multi-GPU deployment remain unverified.
    - line: Context/physics-informed world-model architectures
      what_it_solves: Adds context or physics constraints to latent dynamics or video
        generation to improve zero-shot generalization and physical plausibility.
      what_remains_open: Assumes observable context or relies on narrow benchmark
        tasks; limitation details and out-of-distribution behavior are not fully reported.
    - line: Cross-embodiment latent-action world models
      what_it_solves: Uses a shared latent action interface across heterogeneous interaction
        data to generate synthetic demonstrations and improve policy success.
      what_remains_open: Open artifacts and independent reproduction are weakly supported;
        limitations and long-horizon stability are not evidenced.
    consensus:
    - Recent systems treat world models as video generative simulators conditioned
      on action, context, or physics rather than as isolated predictive models.
    - Evaluation increasingly includes action fidelity, spatial consistency, and downstream
      policy performance, not only visual quality metrics.
    - Datasets and benchmarks are used as shared infrastructure to expose model failure
      modes such as poor instruction following or spatial inconsistency.
    - Open-source artifacts are present in several high-reproducibility signals, but
      independent reproduction remains a verification gap.
    disagreements:
    - 'Control representation differs: explicit trajectory/action conditioning, observed
      context variables, latent action tokens, and physics-informed auxiliary losses.'
    - 'Evaluation target differs: loop-based spatial consistency, driving action fidelity,
      zero-shot policy generalization, or visual-physical plausibility.'
    - 'Deployment setting differs: offline benchmark evaluation, sub-second closed-loop
      serving, and synthetic demonstration generation for policy training.'
    - 'Supervision assumption differs: some systems assume observed context values,
      others require trajectory annotations or rely on pretrained latent action interfaces.'
    open_questions:
    - How well do these systems preserve spatial, action, and cross-view consistency
      across long closed-loop rollouts and unfamiliar environments?
    - What latency-fidelity trade-offs emerge when moving from a single-GPU driving
      benchmark to diverse hardware and real-world deployment?
    - Can cross-embodiment world models operate without shared visible context or
      shared action spaces, and what evidence supports this?
    - Which results are independently reproducible across teams and datasets, given
      that code, data, and limitation reporting vary across the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准驱动的评估平台
      解决的问题: 构建数据集与指标来测试空间一致性和动作忠实度，使生成质量变为可测量的模型行为。
      尚未覆盖: 证据集中在Minecraft或驾驶场景；跨环境与硬件的独立复现尚未显示。
    - 路线: 动作可控闭环模拟器
      解决的问题: 根据轨迹或动作控制生成未来视频，支持低延迟闭环模拟，包括亚秒级驾驶视频生成。
      尚未覆盖: nuScenes等单一环境之外的泛化、长时域跨视角一致性及多GPU部署仍未验证。
    - 路线: 上下文/物理信息驱动的世界模型架构
      解决的问题: 在潜在动力学或视频生成中加入上下文或物理约束，以提升零样本泛化与物理合理性。
      尚未覆盖: 假设上下文可观测或依赖较窄任务；限制细节与分布外行为未充分报告。
    - 路线: 跨具身潜在动作世界模型
      解决的问题: 用共享潜在动作接口统一异构交互数据，生成合成演示并提升策略成功率。
      尚未覆盖: 开放工件与独立复现支持较弱；局限性和长时域稳定性缺乏证据。
    共识:
    - 近期的系统多将世界模型视为以动作、上下文或物理为条件的视频生成模拟器，而非孤立预测模型。
    - 评测越来越多关注动作忠实度、空间一致性和下游策略表现，而不只是视觉质量指标。
    - 数据集和基准被用作共享基础设施，以暴露指令遵循差或空间不一致等模型失效模式。
    - 若干系统提供开放工件信号，但跨团队独立复现仍是验证缺口。
    分歧:
    - 控制表示不同：显式轨迹/动作条件、可观测上下文变量、潜在动作token或物理信息辅助损失。
    - 评测目标不同：循环导航空间一致性、驾驶动作忠实度、零样本策略泛化或视觉与物理合理性。
    - 部署场景不同：离线基准评估、亚秒级闭环服务或用于策略训练的合成演示生成。
    - 监督假设不同：部分系统假设上下文可观测，其他系统依赖轨迹标注或预训练潜在动作接口。
    开放问题:
    - 这些系统在长时域闭环推演和陌生环境中，能否保持空间、动作和跨视角一致性？
    - 从单一GPU驾驶基准迁移到多样硬件与真实部署时，会出现哪些延迟与保真度的权衡？
    - 跨具身世界模型能否在没有共享可见上下文或共享动作空间时运行，目前有哪些证据？
    - 在代码、数据与局限性报告不一致的情况下，哪些结果能被跨团队、跨数据集独立复现？
