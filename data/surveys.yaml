  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for embodied and driving scenarios,
    favoring diffusion or Transformer video generation and action-coupled rollouts;
    robotics and driving applications dominate the top evidence, with benchmarks emerging
    for consistency and control.'
  - 'Shared research pattern: Combine generative sequence or diffusion objectives
    with domain constraints such as multi-view driving consistency, robot physics,
    compositional language goals, and action-conditioned rollouts, then evaluate via
    zero-shot or downstream policy utility.'
  - 'Key differences: Task orientation ranges from driving scene prediction and robot
    video synthesis to game navigation and reinforcement learning; supervision varies
    across explicit context, language primitives, physics auxiliaries, video-action
    diffusion, and loop consistency.'
  - 'Trend evolution: The visible frontier from 2023 to 2026 moves from sample-efficient
    Atari reinforcement-learning world models toward contextual zero-shot and domain-specific
    driving/robotics generation, then toward open-domain memory and action benchmarks
    in 2025-2026.'
  - 'Open questions: Real-world safety and operational transfer, long-horizon memory
    consistency, generalization beyond observed contexts or primitives or datasets,
    and benchmark coverage for closed-loop control remain unverified.'
  related_work_outline_zh:
  - 主流方向：面向机器人与驾驶等具体领域的生成式世界模型，以扩散或Transformer视频生成和动作耦合推演为主，基准测试开始关注一致性与控制。
  - 研究共性：把生成式序列或扩散目标与领域约束结合，例如多视角驾驶一致性、机器人物理、组合语言目标、动作条件推演，并以零样本或下游策略收益作为评测。
  - 关键差异：任务取向从驾驶场景预测、机器人视频合成到游戏导航与强化学习；监督信号包括显式上下文、语言原语、物理辅助、视频-动作扩散和环路一致性。
  - 趋势演进：2023-2026前沿从Atari样本高效RL世界模型转向上下文零样本与驾驶/机器人领域生成，再转向2025-2026开放域记忆和动作基准。
  - 开放问题：真实安全与运营迁移、长时域记忆一致性、跨未见上下文/原语/数据集的泛化，以及闭环控制基准覆盖仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models and multi-view scene prediction
      what_it_solves: Long-horizon and multi-view driving video generation, with zero-shot
        validation across driving datasets and comparisons on nuScenes, OpenDV-2K,
        and Waymo.
      what_remains_open: Visible evidence reports dataset-level video prediction gains
        but does not connect them to closed-loop real-world driving safety or operational
        outcomes; limitation statements are absent in the available analysis.
    - line: Embodied robot world models and action-video coupling
      what_it_solves: Robot video synthesis, compositional language-goal following,
        physics-informed visual plausibility, and policy/dynamics learning from action
        and action-free robot video.
      what_remains_open: Generalization is often evaluated in simulation or curated
        robot data; real-world embodiment transfer, novel primitive generation beyond
        seen combinations, and cross-embodiment robustness remain unverified.
    - line: Contextual and model-based reinforcement learning world models
      what_it_solves: Sample-efficient policy learning from imagined trajectories
        and zero-shot generalization to unseen context values in contextual reinforcement
        learning or Atari-style settings.
      what_remains_open: Explicit context observability and small benchmark coverage
        such as two CARL tasks and Atari 100k leave broader task diversity and hidden-context
        settings unverified.
    - line: Interactive game and open-domain consistency benchmarks
      what_it_solves: Quantifying spatial consistency in loop-based navigation and
        memory/action control in open-domain videos, providing reusable evaluation
        frameworks for world-model limitations.
      what_remains_open: Benchmark construction often precedes model results; whether
        consistency scores align with downstream task improvement, long-term memory,
        or cross-action-space generalization is not yet established.
    consensus:
    - Recent evidence favors generative world models built on diffusion or Transformer
      sequence objectives for video prediction and action-conditioned rollout.
    - Domain-specific structure is introduced through multi-view driving consistency,
      physics-informed objectives, compositional language primitives, or memory/action
      consistency metrics.
    - Evaluation increasingly emphasizes zero-shot or held-out settings and downstream
      policy utility, not only pixel-level reconstruction.
    - Action-free video and large-scale robot data are treated as scalable sources
      of supervision for embodied world models.
    - Long-horizon consistency and action controllability are recurring evaluation
      axes across driving, robotics, and interactive gameplay.
    disagreements:
    - 'Representation choices differ: explicit context conditioning or language primitive
      factorization versus latent stochastic dynamics or unified modality diffusion.'
    - Auxiliary supervision varies from MAE-style mask reconstruction and physics
      tasks to action-video coupling and scene-graph consistency scoring.
    - 'Deployment targets differ: dataset-level driving prediction, simulated robot
      execution, Atari or contextual reinforcement-learning control, and open-domain
      game navigation.'
    - 'Generalization claims differ in boundary: unseen driving datasets, unseen goal
      combinations, unseen contexts, or cross-action-space controllability.'
    - Some work uses benchmark-driven evaluation while others optimize task-specific
      application metrics, making direct comparison difficult.
    open_questions:
    - Do reported driving and robot video-generation improvements transfer to real-world
      closed-loop safety and physical task success?
    - How can world models maintain memory and spatial consistency over long horizons
      without relying on scene-graph shortcuts?
    - What balance of explicit context, language, or physics factorization versus
      end-to-end latent dynamics best supports unseen task generalization?
    - Which evaluation protocols can measure action controllability and memory consistency
      in open-domain interactive settings without dataset-specific biases?
    - The top evidence lacks healthcare and scientific simulation applications, leaving
      domain-specific safety and validation gaps unexamined.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与多视角场景预测
      解决的问题: 生成长时域、多视角驾驶视频，并在nuScenes、OpenDV-2K和Waymo等数据集上做零样本验证和基线与SOTA比较。
      尚未覆盖: 可验证证据主要停留在数据集视频预测增益，尚不能关联到真实闭环驾驶安全或运营结果；可见分析中缺少局限性说明。
    - 路线: 具身机器人世界模型与视频-动作耦合
      解决的问题: 机器人视频合成、组合语言目标跟踪、物理合理的视觉生成，以及从有动作和无动作视频中学习策略与动力学。
      尚未覆盖: 评估多限于仿真或整理后的机器人数据；真实本体迁移、超出已见组合的新原语，以及跨本体的鲁棒性仍未证实。
    - 路线: 上下文与基于模型的强化学习世界模型
      解决的问题: 通过想象轨迹实现样本高效策略学习，并在上下文RL或Atari式环境中对未见上下文值进行零样本泛化。
      尚未覆盖: 依赖上下文可观测，且证据覆盖较窄，如两个CARL任务和Atari 100k；更广泛任务多样性和隐藏上下文尚未验证。
    - 路线: 交互式游戏与开放域一致性基准
      解决的问题: 在循环导航和开放域视频中量化空间一致性、记忆一致性和动作控制能力，提供可复用的评测框架。
      尚未覆盖: 基准构建先于模型结果的情况较多；一致性分数与下游任务改进、长时记忆、跨动作空间泛化的一致性尚未建立。
    共识:
    - 近期证据偏向用扩散或Transformer序列目标构建生成式世界模型，用于视频预测和动作条件推演。
    - 领域约束通过多视角驾驶一致性、物理信息目标、组合语言原语或记忆/动作一致性指标引入。
    - 评测越来越重视零样本或留出设置和下游策略收益，而不只是像素级重建。
    - 无动作视频和大规模机器人数据被视为具身世界模型的可扩展监督来源。
    - 长时域一致性和动作可控性是驾驶、机器人和交互游戏中的反复出现的评测轴。
    分歧:
    - 表示选择不同：显式上下文条件或语言原语分解，对比潜在随机动力学或统一模态扩散。
    - 辅助监督信号不同：MAE式掩码重建、物理任务、视频-动作耦合或场景图一致性评分各有侧重。
    - 部署目标不同：数据集级驾驶预测、仿真机器人执行、Atari或上下文RL控制，以及开放域游戏导航。
    - 泛化边界不同：未见驾驶数据集、未见目标组合、未见上下文值或跨动作空间可控性。
    - 部分工作以基准诊断为主，部分面向任务性能优化，直接比较存在困难。
    开放问题:
    - 驾驶和机器人视频生成的收益能否迁移到真实世界的闭环安全与物理任务成功？
    - 世界模型如何在长时域中保持记忆和空间一致性，而不依赖场景图捷径？
    - 显式上下文、语言或物理分解与端到端潜在动力学之间应如何平衡，以支持未见任务泛化？
    - 哪些评测协议能在开放域交互中度量动作可控性和记忆一致性，同时减少数据集偏差？
    - 当前高排名证据缺少医疗和科学仿真应用，相关领域的安全与验证缺口仍未覆盖。
