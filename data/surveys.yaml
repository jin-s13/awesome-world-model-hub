    研究路线矩阵:
    - 路线: 可控世界模型与模拟器构建
      解决的问题: 学习以动作、上下文或物理为条件的前向生成动态，使合成推演可以支持基于模型的强化学习或闭环模拟。
      尚未覆盖: 现有证据主要限于选定任务或数据集；长时域一致性、跨域泛化，以及视觉保真度与物理动作遵循之间的权衡仍未解决。
    - 路线: 基准与评估框架
      解决的问题: 提供数据集、指标和协议，用于比较空间一致性、动作保真度、零样本泛化和下游策略效用，而非只看视觉质量。
      尚未覆盖: 指标在提出环境之外的有效性、对多样传感器布局与平台的覆盖，以及上下限行为的独立验证尚未建立。
    - 路线: 实时与交互式服务栈
      解决的问题: 把生成式世界模型转化为可在物理机器人、游戏和驾驶模拟中以亚秒级或交互式延迟运行的推理流水线。
      尚未覆盖: 证据主要覆盖单GPU或特定机器人平台；扩展到多GPU、多传感器、分布外场景和变化硬件条件仍未测试。
    - 路线: 可复现工件与工程
      解决的问题: 通过开放代码、数据集和基线系统降低采用成本，使其他团队可以检查、复用或评测。
      尚未覆盖: 仓库和数据集信号本身不能证明独立复现；摘要中常省略局限性，因此实际运行边界仍不明确。
    共识:
    - 多项研究一致将可控未来生成视为把世界模型用作系统而不仅是图像生成器的核心能力。
    - 评测正从单一视觉质量转向动作保真度、物理合理性、空间一致性或下游策略效用。
    - 开放数据集、基准和代码越来越被视为系统贡献的一部分，尤其是在可复现评测方面。
    分歧:
    - 交互闭环不同：有的系统直接在物理机器人上训练而无需模拟器，有的面向闭环驾驶模拟或游戏式循环导航。
    - 监督信号不同：显式上下文值、关键点动力学、深度预测、轨迹指令和历史参考帧被分别用于注入控制或物理信息。
    - 模型表示不同：循环状态空间世界模型、预训练扩散或自回归视频生成器，以及多视图帧级扩散Transformer带来不同的容量和延迟权衡。
    - 评测目标不同：有的优化未见上下文下的零样本策略泛化，有的衡量动作可控视频质量、空间一致性或真实学习速度。
    开放问题:
    - 动作保真度或空间一致性指标是否能预测不同机器人和驾驶平台上的真实闭环控制成功？
    - 帧级自回归模拟器能否在所评测的nuScenes类设置之外保持长时域和跨视图一致性？
    - 随着单GPU系统走向多传感器或多机器人部署，速度、视觉保真度、可控性和系统复杂度如何权衡？
    - 需要哪些独立复现证据来弥补开放工件声明和缺失局限性报告造成的验证缺口？
