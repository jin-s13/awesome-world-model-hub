  related_work_outline:
  - 'Mainstream direction: Recent application work concentrates on action-conditioned
    driving and robot world models, with diffusion or sequence models generating future
    videos and latent dynamics for simulation, planning, and policy pretraining.'
  - 'Shared research pattern: Most methods treat world models as generative or implicit
    simulators and evaluate them through downstream policy benefit, physical plausibility,
    or memory and spatial consistency.'
  - 'Key differences: Representation, supervision, evaluation target, interaction
    mode, and deployment setting differ, including diffusion transformers versus recurrent
    state-space models, physics/keypoint signals versus context or action diffusion,
    and closed-loop control versus open-loop video generation.'
  - 'Trend evolution: The available evidence clusters in the 2023-2026 frontier, shifting
    from contextual or game-oriented model-based RL toward large-scale driving and
    robotics video generation plus closed-loop consistency benchmarks.'
  - 'Open questions: It remains unclear whether video realism and consistency gains
    transfer to real-world safety, whether models generalize to unseen embodiments
    and action spaces, and how to maintain long-term memory while supporting action
    control.'
  related_work_outline_zh:
  - 主流方向：以动作条件生成式驾驶与机器人世界模型为主，通过扩散或序列模型生成未来视频和潜在动力学，用于仿真、规划和策略预训练。
  - 研究共性：多数工作将世界模型视为生成式或隐式仿真器，并通过下游策略收益、物理合理性或记忆与空间一致性进行评估。
  - 关键差异：表示方式、监督信号、评测目标、交互模式和部署场景不同，涉及扩散Transformer与循环状态空间模型、深度关键点与动作扩散等差异。
  - 趋势演进：可用证据集中于2023-2026前沿，从上下文或游戏模型基强化学习转向大规模驾驶与机器人视频生成以及闭环一致性基准。
  - 开放问题：视频真实感与一致性提升能否转化为真实世界安全，模型能否泛化到未见本体与动作空间，以及如何同时保持长期记忆与动作控制。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific driving scene prediction and simulation
      what_it_solves: generates multi-view, long-horizon future driving videos from
        scene or action context to support closed-loop simulation.
      what_remains_open: alignment with real-world driving safety remains unverified;
        zero-shot transfer across driving datasets is shown but limitation details
        are unreported.
    - line: Robot video world models and action-coupled pretraining
      what_it_solves: learns action-conditioned video generation, physical consistency
        via depth or keypoint signals, and policy or dynamics prediction from large
        robot datasets.
      what_remains_open: real-robot execution and generalization across embodiments,
        datasets, and novel primitive combinations remain sparse or simulation-only.
    - line: Interactive open-world consistency and action-control evaluation
      what_it_solves: quantifies spatial consistency, memory consistency, and action
        control through loop-based navigation and revisited scenes.
      what_remains_open: current protocols expose failures, but they do not yet show
        which training objectives fix long-term memory or cross-action-space generalization.
    - line: Contextual or transformer-based model-based RL
      what_it_solves: improves sample-efficient policy learning and zero-shot generalization
        by conditioning latent dynamics on context or using stochastic transformers
        for imagined rollouts.
      what_remains_open: evaluation is concentrated on Atari and CARL tasks, assumes
        observable context, and lacks evidence across physical deployment environments.
    consensus:
    - Recent work applies world models as action-conditioned generative simulators
      or latent dynamics models across driving, robotics, game-like navigation, and
      control tasks.
    - Most methods combine diffusion or sequence architectures with learned latent
      or context representations and evaluate through prediction quality plus downstream
      policy or planning benefit.
    - There is a shared turn toward large-scale pretraining, open datasets, and closed-loop
      or revisited evaluation protocols to stress generalization and memory consistency.
    - Physics and multimodality are emerging as core signals, including depth, keypoint
      dynamics, mask reconstruction, and coupled video-action objectives.
    disagreements:
    - 'Representation: some use diffusion transformers for high-dimensional video,
      while others use recurrent state-space or VAE-style stochastic latent dynamics.'
    - 'Supervision: methods differ by auxiliary signals such as physics and depth-keypoint
      tasks, mask reconstruction, context labels, or coupled action diffusion.'
    - 'Evaluation target: some measure video fidelity or consistency scores, others
      measure policy generalization and sample efficiency on Atari or CARL, and others
      measure robot execution in simulation.'
    - 'Interaction mode: closed-loop action-control evaluation differs from open-loop
      video generation and from world-model dreaming for policy optimization.'
    - 'Deployment setting: driving multi-view rollout, open-domain navigation, robotics
      manipulation, and Atari game environments make distinct assumptions about observations
      and action spaces.'
    open_questions:
    - Do improvements in video realism or consistency metrics transfer to safer real-world
      driving and physical robot operation?
    - Can these models generalize to unseen embodiments, action spaces, or environmental
      rules without retraining?
    - How should world models preserve long-horizon memory consistency while still
      supporting action control?
    - What happens when context variables are not observable or novel primitive combinations
      appear during deployment?
    - Missing code, baseline details, limitation statements, and real-robot metrics
      in several top papers limit independent verification.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向驾驶的场景预测与多视角长时域生成
      解决的问题: 从场景或动作上下文生成多视角、长时域未来驾驶视频，以支持闭环仿真。
      尚未覆盖: 与真实驾驶安全或运营结果的对齐尚未验证；跨驾驶数据集的零样本迁移有证据，但局限性说明缺失。
    - 路线: 机器人视频世界模型与动作耦合预训练
      解决的问题: 学习动作条件视频生成、基于深度或关键点的物理一致性，以及大规模机器人数据上的策略与动力学预测。
      尚未覆盖: 真实机器人执行和跨本体、跨数据集、新原语组合的泛化证据仍然不足或仅限仿真。
    - 路线: 开放世界空间一致性与动作控制评测
      解决的问题: 通过环形导航和重访场景，量化空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 现有协议能揭示失败，但尚不能说明何种训练目标能解决长期记忆或跨动作空间泛化。
    - 路线: 上下文或Transformer模型基强化学习
      解决的问题: 通过上下文条件化潜在动力学或随机Transformer进行想象推演，提高样本效率和零样本泛化。
      尚未覆盖: 评估集中在Atari和CARL任务，假设上下文可观测，缺少物理部署环境中的证据。
    共识:
    - 近期工作将世界模型作为动作条件生成模拟器或潜在动力学模型，应用于驾驶、机器人、游戏式导航和控制任务。
    - 多数方法结合扩散或序列架构与潜在或上下文表示，并同时以预测质量和下游策略或规划收益作为评估依据。
    - 研究共同转向大规模预训练、开放数据集以及闭环或重访式评估，以检验泛化和记忆一致性。
    - 物理信号和多模态目标日益重要，例如深度、关键点动力学、掩码重建和视频-动作联合建模。
    分歧:
    - 表示方式不同：部分采用扩散Transformer生成高维视频，部分使用循环状态空间或VAE式随机潜在动力学。
    - 监督信号不同：包括物理与深度关键点任务、掩码重建、上下文标签或耦合动作扩散。
    - 评测目标不同：有的衡量视频保真度或一致性分数，有的衡量Atari或CARL上的策略泛化与样本效率，有的衡量机器人仿真执行。
    - 交互模式不同：闭环动作控制评测、开环视频生成和用于策略优化的世界模型梦境在假设上存在差异。
    - 部署场景不同：驾驶多视角回放、开放域导航、机器人操作和Atari游戏在观测与动作空间上不同。
    开放问题:
    - 视频真实感或一致性指标的提升是否能转化为真实驾驶安全与机器人操作收益？
