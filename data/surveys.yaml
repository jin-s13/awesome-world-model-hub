  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is moving from single-task aggregate
    control scores toward open-domain, action-conditioned and consistency-oriented
    evaluation across driving, robotics, Minecraft, and Atari settings.'
  - 'Shared research pattern: Work either constructs datasets and metrics to expose
    world-model failure modes, or builds generative world models and validates them
    through video rollout, zero-shot transfer, policy training, or downstream evaluation.'
  - 'Key differences: Evaluation targets vary among loop-navigation spatial consistency,
    video memory and action control, long-horizon driving prediction, RL policy return,
    and robotic policy utility. Representations also differ across diffusion transformers,
    VAEs, recurrent state-space models, and physics-informed video generation.'
  - 'Trend evolution: Available years cluster in 2023-2026, so the visible shift is
    within the current frontier: from model-centric Atari/CARL policy evaluation toward
    embodied, benchmark-driven evaluation of consistency, controllability, and physical
    plausibility.'
  - 'Open questions: It remains unclear whether specialized consistency and action-control
    metrics predict real downstream decisions, whether benchmark settings cover deployment
    conditions, and whether findings hold across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评测从单一任务或聚合控制分数转向开放域、动作条件与一致性导向，覆盖驾驶、机器人、Minecraft 与 Atari 等设置。
  - 研究共性：一类工作构建数据集与指标以暴露世界模型失败模式，另一类构建生成式世界模型并通过视频推演、零样本迁移、策略训练或下游评估进行验证。
  - 关键差异：评测目标不同，包括循环导航空间一致性、视频记忆与动作控制、长时域驾驶预测、RL 策略回报和机器人策略效用；表示方式涵盖 diffusion transformer、VAE、循环状态空间模型与物理信息联合学习。
  - 趋势演进：证据集中在 2023-2026 年，属于当前前沿内的演化；从 Atari/CARL 等以模型为中心的策略评测走向更偏具身、更受基准驱动的一致性、可控性与物理合理性评测。
  - 开放问题：尚未明确专用一致性与动作控制指标能否预测驾驶或机器人等现实下游决策；基准覆盖部署条件不足；结论在不同实现与算力预算下是否稳定仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Spatial-consistency benchmark construction for open-world navigation
      what_it_solves: Creates loop-navigation video data and scene-graph consistency
        scores to measure whether world models remain spatially coherent under closed-loop
        movement.
      what_remains_open: Whether the chosen navigation distribution and invariance
        to pixel-level variation transfer to driving or robot deployments with more
        varied geometry.
    - line: Memory and action-control benchmark construction for interactive video
      what_it_solves: Introduces closed-loop video benchmarks and evaluation metrics
        to probe long-term memory consistency and generalization across action spaces.
      what_remains_open: Long-term temporal stability and cross-action-space generalization
        remain unresolved; open-domain diversity and baseline coverage are limited.
    - line: Policy-level world-model evaluation on reinforcement-learning control
        suites
      what_it_solves: Uses standardized control benchmarks such as Atari 100k and
        CARL to compare visual world-model fidelity, sample efficiency, and zero-shot
        policy generalization.
      what_remains_open: Aggregate return is not yet clearly linked to visual detail
        or real decision quality, and task coverage is narrow.
    - line: Embodied generative world-model validation on driving and robot datasets
      what_it_solves: Combines video generation, physics cues, or video-action diffusion
        with driving or robotic data to measure long-horizon, multi-view, or policy-relevant
        usefulness.
      what_remains_open: Common metrics across datasets are missing, limitation reporting
        is often absent, and stability across implementations and compute budgets
        is unverified.
    - line: Reproducible reporting and common baselines for world-model evaluation
      what_it_solves: Supplies open datasets, code, and benchmark protocols to make
        model comparisons auditable and reusable.
      what_remains_open: Several method-focused works lack complete limitation details
        or cross-implementation stability evidence, leaving verification gaps.
    consensus:
    - World-model evaluation is increasingly treated as action-conditioned or closed-loop
      sequential generation rather than static prediction alone; evidence includes
      rollout quality, policy returns, spatial consistency, and memory/action control.
    - Researchers converge on open visual-plus-action test settings using Atari, CARL,
      Minecraft, driving, and robotics to expose generalization or controllability.
    - Generative and self-supervised training is widely used for world-model learning,
      but many reports lack complete limitation details, making result verification
      incomplete.
    disagreements:
    - 'Evaluation target differs: some works measure policy return on control benchmarks,
      others measure spatial or memory consistency in open-domain video, and others
      report long-horizon driving or robot video quality.'
    - 'Methodological choice differs: diffusion transformers, VAE-transformer stochastic
      models, recurrent state-space models, physics-informed joint training, and unified
      video-action diffusion target different bottlenecks.'
    - 'Measurement specificity differs: specialized consistency scores and action-control
      probes attempt to move beyond aggregate visual quality, while some model works
      still rely on benchmark-specific aggregate or downstream policy scores.'
    - 'Deployment setting differs: closed-loop RL rollouts, zero-shot dynamics transfer,
      real driving data, Minecraft navigation, and large robot datasets imply different
      assumptions about observability and action availability.'
    open_questions:
    - Do consistency and action-control metrics correlate with downstream decisions
      in driving or robotic policy deployment?
    - How stable are benchmark conclusions when baselines, implementations, or compute
      budgets change, especially where limitation details are missing?
    - What task distributions and action-space variations are needed to cover long-horizon
      memory and cross-domain generalization?
    - Are visual fidelity, physical plausibility, and policy return measuring the
      same underlying world-model capability, or should they be reported separately?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向开放世界导航的空间一致性基准构建
      解决的问题: 利用循环导航视频和场景图一致性分数，衡量世界模型在闭环移动下是否保持空间一致。
      尚未覆盖: 所选导航分布与像素级不变性是否足以迁移到驾驶或机器人部署中的多样几何尚不明确。
    - 路线: 面向交互视频的记忆与动作控制基准构建
      解决的问题: 构建闭环视频基准和评测指标，探测长期记忆一致性以及跨动作空间的动作控制泛化。
      尚未覆盖: 长期时间稳定性与跨动作空间泛化仍是挑战，开放域多样性与基线覆盖有限。
    - 路线: 基于强化学习控制套件的策略级世界模型评测
      解决的问题: 通过 Atari 100k 与 CARL 等标准化控制基准，比较视觉世界模型的保真度、样本效率和零样本策略泛化。
      尚未覆盖: 聚合回报是否与视觉细节或真实决策质量相关尚未充分证明；评测任务范围较窄。
    - 路线: 驾驶与机器人数据集上的具身生成世界模型验证
      解决的问题: 结合视频生成、物理线索或视频-动作扩散，在驾驶或机器人数据上评估长时域、多视角或策略相关效用。
      尚未覆盖: 跨数据集缺乏统一指标，局限性报告常缺失，结论在不同实现与算力预算下的稳定性未经验证。
    - 路线: 可复现报告与统一基线
      解决的问题: 通过开源数据集、代码和基准协议提供可比基线，使评测可审计。
      尚未覆盖: 方法类工作常缺少完整局限性说明或跨实现稳定性证据，形成验证缺口。
    共识:
    - 证据中的世界模型评测普遍被视为动作条件或闭环的顺序生成，而非仅做静态预测；指标包含推演质量、策略回报、空间一致性与记忆/动作控制。
    - 研究者逐渐采用视觉观测加动作的开放测试，使用 Atari、CARL、Minecraft、驾驶和机器人数据来暴露泛化性与可控性问题。
    - 生成式和自监督训练被广泛用于世界模型学习，但许多证据缺少完整局限性说明，导致结果验证不完整。
    分歧:
    - 评测目标不同：有的测量控制基准上的策略回报，有的测量开放域视频中的空间或记忆一致性，有的报告驾驶或机器人视频质量。
