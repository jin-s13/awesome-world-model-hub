  related_work_outline:
  - 'Mainstream direction: World-model evaluation is consolidating around action-conditioned
    video prediction and closed-loop control tests on embodied, driving, game, and
    navigation settings such as Atari 100k, Nuscenes/OpenDV-2K/Waymo, CARL, Minecraft,
    and robotic video.'
  - 'Shared research pattern: Papers introduce or use datasets, consistency scores,
    and agent or visual-quality metrics to probe spatial consistency, memory, action
    control, physics plausibility, or sample-efficient RL performance, rather than
    only reporting aggregate frame similarity.'
  - 'Key differences: Evaluation targets differ among spatial consistency, memory
    and action control, physics plausibility, visual-detail advantage for agent performance,
    and zero-shot contextual generalization; representation and interaction modes
    also differ across diffusion, VAE-transformer, physics-informed, and unified video-action
    models.'
  - 'Trend evolution: Available evidence is concentrated in 2023-2026, showing a frontier
    shift from Atari and agent-score benchmarks toward open-domain video, long-horizon,
    zero-shot, cross-action-space, and embodied consistency evaluation, with increasing
    artifact release.'
  - 'Open questions: Alignment between proxy metrics and downstream decisions, coverage
    of real-world settings, long-term memory and cross-action-space generalization,
    and stability of conclusions across implementations and compute budgets remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正在围绕具身、驾驶、游戏和导航等场景中的动作条件视频预测与闭环控制展开，常用Atari 100k、Nuscenes/OpenDV-2K/Waymo、CARL、Minecraft和机器人视频。
  - 研究共性：论文通过数据集、一致性分数、智能体或视觉质量指标，检验空间一致性、记忆、动作控制、物理合理性或样本高效强化学习，而非只报告平均帧相似度。
  - 关键差异：评测目标分别侧重空间一致性、记忆与动作控制、物理合理性、视觉细节对智能体性能的影响，以及零样本上下文泛化；表示和交互方式在扩散、VAE-Transformer、物理信息、视频-动作统一模型间不同。
  - 趋势演进：现有证据集中在2023-2026年，显示从前沿的Atari/智能体分数基准，转向开放域视频、长时域、零样本、跨动作空间和具身一致性评测，并更多发布数据与代码。
  - 开放问题：代理指标与下游决策的一致性、真实场景覆盖、长时记忆与跨动作空间泛化、结论在不同实现和算力下是否稳定，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video-navigation or interaction datasets, such
        as LoopNav in Minecraft and MIND, that make world-model spatial consistency,
        memory consistency, and action control comparable.
      what_remains_open: Whether the task distribution covers the settings where world
        models are expected to help, including long-horizon, cross-action-space, and
        open-domain generalization.
    - line: Metric and stress-test design
      what_it_solves: Introduces consistency scores, memory and action-control probes,
        visual fidelity and physical plausibility checks, and downstream agent scores
        to test capabilities beyond aggregate reconstruction.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        remains unproven; missing experimental results and limitation details in benchmark
        papers create verification gaps.
    - line: Comparable baselines and reporting
      what_it_solves: Uses standard evaluation settings and state-of-the-art baselines,
        including Atari 100k, Nuscenes/OpenDV-2K/Waymo, and CARL, to make model claims
        auditable.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and training data choices is not established.
    consensus:
    - World-model evaluation increasingly uses action-conditioned video prediction
      and imagined rollouts as a common capability substrate.
    - Papers agree that aggregate frame similarity is insufficient and that evaluation
      should probe consistency, control, or downstream agent performance.
    - Recent work treats dataset, benchmark, or code release as part of the contribution,
      improving reproducibility for world-model assessment.
    - There is convergence on evaluating in embodied, driving, or game environments
      rather than isolated synthetic settings.
    disagreements:
    - 'Representation differs: some use discrete latent VAE-transformer world models,
      others continuous diffusion, physics-informed keypoint and depth learning, or
      unified video-action diffusion.'
    - 'Supervision differs: some rely on action-free video, some on action-conditioned
      rollouts, and some on context-conditioned dynamics with observable properties.'
    - 'Evaluation target differs: Atari 100k human-normalized agent score, driving
      long-horizon and zero-shot video prediction, embodied memory and action control,
      physics plausibility, and contextual zero-shot generalization are separately
      emphasized.'
    - 'Interaction mode differs: open-loop video generation, closed-loop policy training
      inside imagined rollouts, and interactive video-to-world baselines are used.'
    - Deployment setting differs among driving, robotic manipulation, Atari games,
      and Minecraft navigation, making cross-setting comparability unclear.
    open_questions:
    - How well do spatial consistency, memory consistency, and action-control metrics
      predict downstream policy success in real embodied tasks?
    - Can open-domain benchmarks cover cross-action-space generalization without assuming
      fixed action spaces or observable context values?
    - Do conclusions remain stable across diffusion, VAE-transformer, and physics-informed
      implementations under different compute budgets?
    - What reporting standards are needed when benchmark papers introduce datasets
      or metrics without reporting full experimental results or limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的视频导航或交互数据集，如Minecraft中的LoopNav和MIND，使世界模型的空间一致性、记忆一致性和动作控制可比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的真实设置，包括长时域、跨动作空间和开放域泛化，仍不确定。
    - 路线: 指标与压力测试设计
      解决的问题: 引入一致性分数、记忆/动作控制探针、视觉保真与物理合理性检查，以及下游智能体得分，检验总分或重建误差之外的能力。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致尚未证明；基准论文缺少实验结果或局限性细节，形成验证缺口。
    - 路线: 可比基线与报告规范
      解决的问题: 使用Atari 100k、Nuscenes/OpenDV-2K/Waymo、CARL等标准评测设置和最新基线，使模型结论可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和训练数据选择下是否稳定，尚未建立。
    共识:
    - 世界模型评测越来越多以动作条件视频预测和想象轨迹作为共同能力基础。
    - 论文普遍认为仅看平均帧相似度不够，应进一步检验一致性、控制能力或下游智能体表现。
    - 近期工作把数据集、基准或代码发布作为贡献的一部分，改善世界模型评估的可复现性。
    - 评测正在向具身、驾驶或游戏环境集中，而不是孤立合成设置。
    分歧:
    - 表示方式不同：离散潜变量VAE-Transformer、连续扩散、物理信息关键点/深度学习、视频-动作统一扩散并存。
    - 监督信号不同：有的使用无动作视频，有的使用动作条件轨迹，有的依赖可观测上下文属性建模动力学。
    - 评测目标不同：Atari 100k人类归一化智能体得分、驾驶长时域/零样本视频预测、具身记忆/动作控制、物理合理性与上下文零样本泛化被分别强调。
    - 交互模式不同：开环视频生成、在想象轨迹中闭环训练策略、交互式视频到世界基线均有使用。
    - 部署场景不同：驾驶、机器人操作、Atari游戏和Minecraft导航并存，跨场景可比性尚不清晰。
    开放问题:
    - 空间一致性、记忆一致性和动作控制指标能在多大程度上预测真实具身任务中的下游策略成功率？
    - 开放域基准能否在不假设固定动作空间或可观测上下文值的情况下覆盖跨动作空间泛化？
    - 扩散、VAE-Transformer和物理信息实现在不同算力预算下，结论是否保持稳定？
    - 当基准论文未报告完整实验结果或局限性时，需要哪些最低报告规范？
