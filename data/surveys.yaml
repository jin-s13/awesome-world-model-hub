  related_work_outline:
  - 'Mainstream direction: Application research centers on embodied world models for
    driving and robotics, using generative video and dynamics prediction conditioned
    on actions, language, context, or physical signals.'
  - 'Shared research pattern: Methods couple world-model pretraining or generation
    with downstream control or evaluation, often via diffusion or recurrent state-space
    models, and validate on domain benchmarks.'
  - 'Key differences: Domains impose different observations and action spaces; evaluation
    spans scene prediction, model-based RL, zero-shot control, robot video synthesis,
    and consistency or action-control benchmarks.'
  - 'Trend evolution: Within the available 2023–2026 evidence, the frontier is moving
    from game-oriented model-based RL efficiency toward diffusion-based driving and
    robot video world models, with 2025–2026 benchmarks probing memory, spatial, and
    action consistency.'
  - 'Open questions: Real-world transfer, long-term memory and action-space generalization,
    limitations of observed context or predefined primitives, and the link between
    simulation fidelity and operational safety remain unresolved.'
  related_work_outline_zh:
  - 主流方向：应用研究集中在驾驶和机器人等具身世界模型，以动作、语言、上下文或物理信号为条件进行生成式视频与动力学预测。
  - 研究共性：方法将世界模型预训练或生成与下游控制或评测耦合，常用扩散或循环状态空间模型，并在领域基准上验证。
  - 关键差异：不同领域带来不同观测和动作空间；评测目标涵盖场景预测、基于模型的强化学习、零样本控制、机器人视频合成以及一致性与动作控制基准。
  - 趋势演进：在现有证据的2023–2026阶段，前沿从游戏场景的模型高效强化学习转向基于扩散的驾驶和机器人视频世界模型，2025–2026年基准开始探测记忆、空间和动作一致性。
  - 开放问题：真实世界迁移、长期记忆与动作空间泛化、可观测上下文或预定义原语的假设限制，以及仿真保真度与运行安全之间的对应关系仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot manipulation and contextual control
        by conditioning video or dynamics generation on language instructions, actions,
        context, or physics-related signals.
      what_remains_open: Transfer across embodiments, datasets, and physical environments
        is not shown; some approaches depend on observable context or predefined primitive
        combinations.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses driving world models for multi-view and long-horizon video
        prediction to support closed-loop simulation and policy evaluation in driving
        scenes.
      what_remains_open: Evidence ties improvements to video prediction benchmarks,
        not yet to real-world safety outcomes or operational reliability.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in interactive environments for efficient
        model-based reinforcement learning and benchmarked spatial, memory, and action
        consistency.
      what_remains_open: Generalization under changed environment rules, goals, user
        interactions, and action spaces remains unresolved; long-term consistency
        is still difficult.
    consensus:
    - Application-oriented world models increasingly use generated video or latent
      dynamics as a substrate for prediction, imagined policy learning, or robot pretraining.
    - Methods share a pattern of conditioning on actions, language, context, or physical
      cues rather than treating world models as passive dynamics learners.
    - Recent benchmark work shifts evaluation toward closed-loop capabilities such
      as spatial consistency, memory consistency, and action control.
    disagreements:
    - 'Representation choices differ: contextual recurrent state-space dynamics, diffusion
      transformer video generation, physics-informed depth/keypoint learning, and
      unified video-action diffusion.'
    - 'Evaluation targets differ: some papers optimize zero-shot policy generalization
      in contextual RL, others optimize driving video prediction or robot video fidelity,
      and others construct benchmark scores without reporting learned-model results.'
    - 'Interaction and deployment settings differ: discrete-action game environments,
      multi-view driving scenes, robot manipulation from language or multi-task datasets,
      and first/third-person navigation videos.'
    - 'Supervision assumptions differ: some require observable context values or parsed
      low-level primitives; others exploit action-free video or learn without explicit
      physical labels.'
    open_questions:
    - How do gains on driving video prediction benchmarks transfer to closed-loop
      real-world driving safety and operational decisions?
    - Will spatial, memory, and action-control benchmarks predict generalization to
      unseen environments, embodiments, or action spaces?
    - Can zero-shot generalization be maintained when context is not observable or
      when instructions require primitives outside the training distribution?
    - How does physics-informed or visually plausible robot video generation improve
      actual policy performance and real-world execution beyond simulation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 用语言指令、动作、上下文或物理相关信号条件化视频或动力学生成，把世界模型适配到机器人操作和上下文控制任务。
      尚未覆盖: 跨本体、数据集和物理环境的迁移尚未得到验证；部分方法依赖可观测上下文或预定义原语组合。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将驾驶世界模型用于多视角、长时域视频预测，以支持驾驶场景中的闭环仿真和策略评测。
      尚未覆盖: 现有证据主要关联视频预测基准的提升，尚未关联真实世界安全结果或运行可靠性。
    - 路线: 交互式智能体与游戏
      解决的问题: 把世界模型嵌入交互式环境，用于高效的基于模型的强化学习以及空间、记忆与动作一致性评测。
      尚未覆盖: 环境规则、目标、用户交互和动作空间变化时的泛化未解决；长期一致性仍是难点。
    共识:
    - 应用导向的世界模型越来越多地以生成视频或潜在动力学作为预测、想象策略学习或机器人预训练的基础。
    - 方法普遍以动作、语言、上下文或物理线索为条件，而不再把世界模型仅视为被动动力学学习器。
    - 近期基准工作将评测转向闭环能力，例如空间一致性、记忆一致性和动作控制。
    分歧:
    - 表示选择不同：上下文循环状态空间动力学、扩散Transformer视频生成、物理信息深度/关键点学习，以及统一视频-动作扩散。
    - 评测目标不同：部分工作优化上下文强化学习中的零样本策略泛化，部分优化驾驶视频预测或机器人视频保真度，另一些构建基准但未报告学习模型结果。
    - 交互与部署设置不同：离散动作游戏环境、多视角驾驶场景、基于语言或多任务数据的机器人操作，以及第一/第三人称导航视频。
    - 监督假设不同：一些方法要求可观测上下文值或解析后的低级原语；另一些利用无动作视频或无需显式物理标签进行学习。
    开放问题:
    - 驾驶视频预测基准的提升如何迁移到闭环的真实驾驶安全与运行决策？
    - 空间、记忆和动作控制基准能否预测对未见环境、本体或动作空间的泛化？
    - 当上下文不可观测或指令需要训练分布之外的原语时，零样本泛化能否保持？
    - 物理信息或视觉逼真的机器人视频生成如何超越仿真，改善实际策略表现与真实执行？
