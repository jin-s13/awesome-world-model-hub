  related_work_outline:
  - 'Mainstream direction: Applying world models to domain-specific tasks such as
    autonomous driving, robotic manipulation, and game playing, with a strong emphasis
    on video generation conditioned on actions or language.'
  - 'Shared research pattern: Using diffusion models or transformers to learn latent
    dynamics from video and action data, and then using the learned world model for
    simulation, policy learning, or evaluation.'
  - 'Key differences: Some works focus on pixel-level video prediction (MaskGWM, RoboScape),
    while others integrate action prediction (UWM) or compositional primitives (RoboDreamer);
    evaluation varies from visual fidelity to downstream task performance.'
  - 'Trend evolution: From 2023–2025, works moved from pure game environments (STORM)
    to more complex embodied and driving scenes, with growing integration of memory,
    physics, and compositional generalization.'
  - 'Open questions: Whether world models trained in simulation transfer to real-world
    deployment, how to evaluate long-term memory and physical consistency reliably,
    and how to handle open-world compositionality.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用到自动驾驶、机器人操作和游戏等具体领域，重点是基于动作或语言条件的视频生成。
  - 研究共性：使用扩散模型或Transformer从视频和动作数据中学习潜在动力学，并利用所学世界模型进行仿真、策略学习或评估。
  - 关键差异：部分工作关注像素级视频预测（MaskGWM、RoboScape），其他则整合动作预测（UWM）或组合原语（RoboDreamer）；评测从视觉保真度到下游任务性能不等。
  - 趋势演进：2023至2025年，工作从纯游戏环境（STORM）转向更复杂的具身和驾驶场景，并逐步集成记忆、物理和组合泛化。
  - 开放问题：仿真中训练的世界模型能否迁移到真实部署，如何可靠评估长期记忆和物理一致性，以及如何处理开放世界的组合性。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation use cases
      what_it_solves: Generating future video frames conditioned on driving actions
        and multi-view inputs for scene prediction and closed-loop evaluation.
      what_remains_open: Alignment between simulated video quality gains and real-world
        safety outcomes; generalization to zero-shot environments like Waymo without
        fine-tuning proven only in limited benchmarks.
    - line: Embodied and domain task transfer
      what_it_solves: Learning world models that capture physics and object interactions
        from robot data, enabling video synthesis for policy training and imagination.
      what_remains_open: Transfer of learned physics and compositional primitives
        across different robot embodiments or real-world settings; heavy reliance
        on accurate action or language parsing.
    - line: Interactive agents and games
      what_it_solves: Building efficient world models for Atari or Minecraft that
        support agent planning and policy improvement with limited environment interactions.
      what_remains_open: Generalization to open-ended tasks and memory consistency
        over long horizons; benchmarks like LoopNav and MIND reveal gaps in spatial
        and action consistency.
    consensus:
    - World models in these applications are typically learned from video prediction
      objectives, often using diffusion or transformer architectures.
    - Action conditioning is a core component, enabling the model to serve as a simulator
      for policy training or evaluation.
    - There is a shared interest in improving physical plausibility and temporal consistency,
      not just pixel-level quality.
    - Benchmarks are emerging to evaluate beyond simple visual metrics, focusing on
      memory, action control, and spatial consistency.
    disagreements:
    - 'Representation of actions: some models condition on action sequences directly
      (MaskGWM, STORM), others integrate action diffusion jointly with video (UWM),
      or parse language into primitives (RoboDreamer).'
    - 'Supervision signal: MaskGWM uses MAE-style mask reconstruction; RoboScape adds
      depth and keypoint dynamics; UWM uses diffusion on both modalities; STORM uses
      VAE-based stochasticity.'
    - 'Evaluation target: MaskGWM and RoboScape emphasize video generation fidelity,
      while STORM and UWM evaluate downstream policy performance; LoopNav and MIND
      introduce consistency metrics.'
    - 'Domain focus: approaches are specialized to driving (MaskGWM), robotics (RoboDreamer,
      RoboScape, UWM), or games (STORM, LoopNav), leading to different assumptions
      about dynamics and action spaces.'
    open_questions:
    - Can world models trained on large-scale robot datasets (UWM) be effectively
      transferred to new tasks without fine-tuning?
    - How to evaluate physical correctness when ground-truth physics is unavailable,
      as in RoboScape?
    - Do improvements in video prediction metrics translate to safer autonomous driving
      policies?
    - What level of memory and action control is needed for open-world interactive
      agents, and how to benchmark it comprehensively?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真应用
      解决的问题: 根据驾驶动作和多视角输入生成未来视频帧，用于场景预测和闭环评测。
      尚未覆盖: 仿真视频质量提升与真实安全结果之间的对应关系；在Waymo等零样本环境上的泛化仅在有限基准上验证。
    - 路线: 具身与领域任务迁移
      解决的问题: 从机器人数据中学习捕捉物理和物体交互的世界模型，支持视频合成以用于策略训练和想象。
      尚未覆盖: 所学的物理和组合原语能否跨不同机器人本体或真实环境迁移；对准确动作或语言解析的依赖较强。
    - 路线: 交互式智能体与游戏
      解决的问题: 为Atari或Minecraft构建高效世界模型，支持在有限环境交互下进行规划与策略改进。
      尚未覆盖: 对开放式任务和长时域记忆一致性的泛化；LoopNav和MIND等基准揭示了空间和动作一致性的缺口。
    共识:
    - 应用中的世界模型通常通过视频预测目标学习，多采用扩散模型或Transformer架构。
    - 动作条件化是核心组件，使模型能作为策略训练或评估的仿真器。
    - 普遍关注提升物理合理性和时序一致性，而非仅像素级质量。
    - 基准测试正逐步超越简单视觉指标，聚焦记忆、动作控制和空间一致性。
    分歧:
    - 动作表示方式：部分模型直接以动作序列为条件（MaskGWM、STORM），另一些将动作扩散与视频联合建模（UWM），或从语言解析为原语（RoboDreamer）。
    - 监督信号：MaskGWM使用MAE风格掩码重建；RoboScape加入深度和关键点动力学；UWM对两种模态进行扩散；STORM使用VAE随机性。
    - 评测目标：MaskGWM和RoboScape侧重视频生成保真度，STORM和UWM评估下游策略性能，LoopNav和MIND引入一致性指标。
    - 领域聚焦：方法分别面向驾驶（MaskGWM）、机器人（RoboDreamer、RoboScape、UWM）或游戏（STORM、LoopNav），导致对动力学和动作空间的不同假设。
    开放问题:
    - 在大规模机器人数据集上训练的世界模型（UWM）能否无需微调就迁移到新任务？
    - 当缺乏真实物理真值时，如何评估物理正确性（如RoboScape）？
    - 视频预测指标的提升能否转化为更安全的自动驾驶策略？
    - 开放世界交互智能体需要何种级别的记忆和动作控制，如何全面评估？
