  related_work_outline:
  - 'Mainstream direction: Designing generative world models with diffusion Transformers
    and unified video-action architectures, aiming for long-horizon consistency, multi-view
    coherence, and combinatorial generalization.'
  - 'Shared research pattern: Leveraging self-supervised video prediction or mask
    reconstruction objectives, with Transformer backbones, to learn latent dynamics;
    then conditioning on context, language, or actions for downstream tasks.'
  - 'Key differences: The choice of generative model (diffusion vs. VAE vs. autoregressive),
    the conditioning interface (text primitives, continuous context, action diffusion),
    and the evaluation domain (autonomous driving, games, robotic manipulation) drive
    distinct design trade-offs.'
  - 'Trend evolution: From recurrent VAE world models (2023) to diffusion-based and
    physics-informed architectures (2024–2025), with a recent push toward unified
    video-action pretraining and dedicated benchmarks for memory/action control (2025–2026).'
  - 'Open questions: How much gain comes from the model itself versus the task prior
    or planner; whether architectural choices transfer across domains; and how to
    achieve robust long-term memory and physical plausibility in open-world settings.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和统一视频-动作架构为核心，设计生成式世界模型，追求长时域一致性、多视角连贯性和组合泛化。
  - 研究共性：采用自监督视频预测或掩码重建目标，结合Transformer主干学习潜在动力学，再通过上下文、语言或动作条件驱动下游任务。
  - 关键差异：生成模型选择（扩散 vs. VAE vs. 自回归）、条件接口（文本原语、连续上下文、动作扩散）和评估域（驾驶、游戏、机器人操作）导致不同的设计取舍。
  - 趋势演进：从循环VAE世界模型（2023）发展到基于扩散和物理信息的架构（2024–2025），近期兴起统一视频-动作预训练和专门针对记忆/动作控制的基准（2025–2026）。
  - 开放问题：性能提升在多大程度上来自模型本身而非任务先验或规划器；架构选择能否跨域迁移；如何在开放世界中实现鲁棒的长期记忆和物理合理性。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures and training
        recipes, such as diffusion Transformers, VAEs, and physics-informed losses,
        to generate high-fidelity, temporally consistent videos.
      what_remains_open: Whether architectural choices (e.g., mask reconstruction,
        keypoint dynamics, depth prediction) transfer to domains beyond the reported
        task family, and how to balance long-horizon fidelity with computational cost.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by conditioning
        world models on actions, context, or language primitives, enabling zero-shot
        generalization and policy learning from imagined trajectories.
      what_remains_open: Separating the contribution of the world model from that
        of the planner or controller; the extent to which action-space generalization
        and closed-loop control work in real-world settings.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing benchmarks and metrics (spatial consistency, memory
        consistency, action control) to isolate method contributions from dataset,
        baseline, and implementation effects.
      what_remains_open: Most method papers lack detailed ablation of key components
        and limitation analysis; evidence is still fragmented across different benchmarks,
        and reproducibility remains low due to absent code, data, or model checkpoints.
    consensus:
    - World models are predominantly trained with self-supervised reconstruction or
      generation objectives on video data, using Transformer backbones to capture
      spatiotemporal dependencies.
    - Recent works emphasize generalization—zero-shot, compositional, or cross-domain—as
      a primary goal, moving beyond single-task evaluation.
    - There is a growing recognition that evaluation must go beyond visual fidelity,
      with benchmarks now targeting spatial coherence, memory consistency, and action
      controllability.
    - Physics-informed or structure-aware components (depth, keypoints, scene graphs)
      are increasingly integrated to improve physical plausibility and long-term consistency.
    disagreements:
    - 'The underlying generative formulation varies: some use diffusion processes,
      others use VAEs with recurrence, and at least one uses a unified diffusion framework
      for both video and actions.'
    - 'Conditioning strategies differ: language-conditioned decomposition into primitives,
      continuous context vectors, or explicit action diffusion timesteps lead to different
      generalization capabilities and failure modes.'
    - 'Evaluation settings are domain-specific: autonomous driving (Nuscenes, Waymo),
      simulated robotics (RT-X, CARL), and open-world games (Minecraft, Atari) make
      direct comparison of model capabilities challenging.'
    - There is no consensus on whether to explicitly model physics or rely on data-driven
      pattern learning; some works inject physics losses, while others achieve plausible
      dynamics purely from large-scale video generation.
    open_questions:
    - What is the true source of improvement in planning and control tasks—the world
      model's predictive accuracy, the planner's inductive bias, or the task prior
      encoded in the training data?
    - Can architectures and training objectives designed for one domain (e.g., driving)
      transfer to highly dynamic, interactive environments without extensive retuning?
    - 'How to close the verification gap: most papers lack public code, ablation of
      key design choices, and standardized benchmarks, making it difficult to isolate
      method contributions from engineering tricks.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想落实为具体架构和训练配方，如扩散Transformer、VAE和物理信息损失，以生成高保真、时间一致的视频。
      尚未覆盖: 架构选择（如掩码重建、关键点动力学、深度预测）能否迁移到报告任务族以外，以及如何在长时域保真度与计算成本之间取得平衡。
    - 路线: 规划与动作接口方法
      解决的问题: 通过对动作、上下文或语言原语进行条件化，将学习到的动力学连接到决策，实现零样本泛化和基于想象轨迹的策略学习。
      尚未覆盖: 世界模型的贡献与规划器或控制器的贡献难以分离；动作空间泛化和闭环控制在真实环境中的有效性尚待验证。
    - 路线: 方法证据与消融协议
      解决的问题: 提供基准和指标（空间一致性、记忆一致性、动作控制），以区分方法贡献与数据集、基线和实现效应。
      尚未覆盖: 大多数方法论文缺乏对关键组件的详细消融和局限性分析；证据在不同基准之间仍碎片化，且由于缺少代码、数据或模型权重，可复现性较低。
    共识:
    - 世界模型主要通过视频数据上的自监督重建或生成目标进行训练，并使用Transformer主干捕获时空依赖关系。
    - 近期工作强调泛化性（零样本、组合或跨域）作为首要目标，超越了单任务评估。
    - 人们日益认识到评估必须超越视觉保真度，基准开始关注空间连贯性、记忆一致性和动作可控性。
    - 物理信息或结构感知组件（深度、关键点、场景图）越来越多地被集成，以改善物理合理性和长期一致性。
    分歧:
    - 底层生成形式存在差异：有的使用扩散过程，有的使用具有循环的VAE，还有至少一个工作使用统一扩散框架同时处理视频和动作。
    - 条件化策略不同：基于语言的原语分解、连续上下文向量或显式动作扩散时间步，导致不同的泛化能力和失败模式。
    - 评估设置具有领域特定性：自动驾驶（Nuscenes、Waymo）、仿真机器人（RT-X、CARL）和开放世界游戏（Minecraft、Atari）使得模型能力的直接比较变得困难。
    - 对于是否显式建模物理或依赖数据驱动的模式学习，尚无共识：一些工作注入物理损失，而另一些纯粹通过大规模视频生成获得合理动力学。
    开放问题:
    - 在规划和控制任务中，真正的性能提升来源是什么——世界模型的预测精度、规划器的归纳偏置，还是训练数据中编码的任务先验？
    - 为一个领域（如驾驶）设计的架构和训练目标能否在不进行大量重新调整的情况下，迁移到高度动态、交互式的环境？
    - 如何填补验证缺口：大多数论文缺少公开代码、关键设计选择的消融实验和标准化基准，难以将方法贡献与工程技巧区分开来。
