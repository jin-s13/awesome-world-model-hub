    video generation and closed-loop evaluation.'
  - 'Shared research pattern: Proposing new models or benchmarks that improve action
    fidelity, spatial consistency, or physical plausibility, often by extending pre-trained
    video generators or recurrent state-space models, and validating on domain-specific
    datasets.'
  - 'Key differences: Methods diverge in generative architecture (diffusion vs. autoregressive
    vs. Dreamer-style), control mechanisms (structured control, action-conditioned
    modules, physics-informed losses), and evaluation targets (spatial consistency,
    action fidelity, visual quality, zero-shot generalization).'
  - 'Trend evolution: From 2024–2026, the focus shifts from open-loop video generation
    toward closed-loop, real-time interactive simulation with low-latency inference,
    and from generic visual quality to task-specific controllability and physical
    consistency metrics.'
  - 'Open questions: How to guarantee robustness under out-of-distribution actions
    and environments; how to balance fidelity, latency, and controllability in real
    deployment; and whether current benchmarks capture long-tail real-world complexity.'
  related_work_outline_zh:
  - 主流方向：构建面向交互式应用的可控世界模型与模拟器，特别是自动驾驶和机器人领域，重点在于动作条件视频生成和闭环评估。
  - 研究共性：提出新模型或基准以提升动作忠实度、空间一致性或物理合理性，通常通过扩展预训练视频生成器或循环状态空间模型，并在特定领域数据集上验证。
  - 关键差异：方法在生成架构（扩散、自回归、Dreamer风格）、控制机制（结构化控制、动作条件模块、物理信息损失）和评估目标（空间一致性、动作忠实度、视觉质量、零样本泛化）上存在分歧。
  - 趋势演进：2024至2026年间，焦点从开环视频生成转向低延迟的闭环实时交互模拟，从通用视觉质量转向任务特定的可控性和物理一致性指标。
  - 开放问题：如何保证分布外动作和环境下的鲁棒性；实际部署中如何权衡保真度、延迟和可控性；现有基准是否覆盖真实世界的长尾复杂性。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning world model ideas into end-to-end workflows for data,
        training, inference, and evaluation in autonomous driving and robotics.
      what_remains_open: Robustness under real-world deployment, hardware changes,
        and user-specific settings; generalization beyond curated datasets like nuScenes.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        simulation, enabling action-controllable video generation at sub-second inference.
      what_remains_open: Trade-offs between speed, visual fidelity, physical plausibility,
        and system complexity; scalability to multi-GPU or edge devices.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making world model evaluation inspectable and reusable through
        open-source benchmarks, datasets, and baseline models.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure;
        long-term maintenance and coverage of diverse real-world scenarios.
    consensus:
    - Action controllability is essential for world models to serve as interactive
      simulators for policy learning and evaluation.
    - Evaluation should go beyond visual fidelity to include spatial consistency,
      physical plausibility, and action fidelity.
    - Open-source benchmarks and datasets accelerate progress by enabling standardized
      comparisons.
    - Adapting pre-trained video generative models as world simulators is a promising
      and efficient direction.
    disagreements:
    - 'Generative architecture choice: diffusion-based models (Vista, FAR-Drive) versus
      autoregressive transformers versus recurrent state-space models (cRSSM).'
    - 'Control injection method: structured control for multi-view consistency, lightweight
      action-conditioned modules, or physics-informed losses.'
    - 'Primary evaluation metric: spatial consistency (LoopNav), action fidelity (Terra
      ACT-Bench), visual quality (FID/FVD), or zero-shot generalization (cRSSM).'
    - 'Interaction paradigm: open-loop video generation versus closed-loop autoregressive
      simulation with self-conditioning.'
    - 'Deployment context: single-GPU low-latency inference versus unstated hardware
      assumptions, affecting real-time feasibility claims.'
    open_questions:
    - How do world models handle out-of-distribution actions and environments without
      catastrophic forgetting or physically implausible predictions?
    - What is the minimal set of metrics that jointly capture visual quality, controllability,
      and physical consistency for real-world deployment?
    - Can benchmarks designed for specific domains (Minecraft, nuScenes, CARL) transfer
      to other interactive settings, and what are the failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将世界模型想法转化为覆盖数据、训练、推理和评估的端到端工作流，应用于自动驾驶和机器人。
      尚未覆盖: 真实世界部署、硬件变化和用户特定设置下的鲁棒性；对nuScenes等精选数据集之外的泛化能力。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环模拟的延迟和交互需求，实现亚秒级推理的动作可控视频生成。
      尚未覆盖: 速度、视觉保真度、物理合理性和系统复杂度之间的权衡；多GPU或边缘设备的可扩展性。
    - 路线: 工件与可复现工程
      解决的问题: 通过开源基准、数据集和基线模型，使世界模型评估可检查、可复用。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现；长期维护和对多样化真实场景的覆盖。
    共识:
    - 动作可控性对于世界模型作为交互式模拟器用于策略学习和评估至关重要。
    - 评估应超越视觉保真度，纳入空间一致性、物理合理性和动作忠实度。
    - 开源基准和数据集通过标准化比较加速进展。
    - 将预训练视频生成模型适配为世界模拟器是一个有前景且高效的方向。
    分歧:
    - 生成架构选择：基于扩散的模型（Vista、FAR-Drive）对比自回归Transformer对比循环状态空间模型（cRSSM）。
    - 控制注入方式：用于多视图一致性的结构化控制、轻量级动作条件模块或物理信息损失。
    - 主要评估指标：空间一致性（LoopNav）、动作忠实度（Terra ACT-Bench）、视觉质量（FID/FVD）或零样本泛化（cRSSM）。
    - 交互范式：开环视频生成对比带自条件的闭环自回归模拟。
    - 部署环境：单GPU低延迟推理对比未说明的硬件假设，影响实时性声明的可行性。
    开放问题:
    - 世界模型如何处理分布外动作和环境，避免灾难性遗忘或物理上不合理的预测？
    - 能够联合捕捉视觉质量、可控性和物理一致性的最小指标集是什么，以支持真实世界部署？
    - 为特定领域（Minecraft、nuScenes、CARL）设计的基准能否迁移到其他交互场景，其失败模式是什么？
