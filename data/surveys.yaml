  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    or transformer-VAE hybrids for action-conditioned video and latent dynamics prediction,
    especially in driving, robot manipulation, and sample-efficient RL.'
  - 'Shared research pattern: Methods learn temporal dynamics through reconstruction
    or generation objectives, often add inductive biases such as masks, context, physics,
    language composition, or action diffusion, and evaluate via downstream policy
    success or consistency benchmarks.'
  - 'Key differences: They differ in representation level (latent state-space vs pixel/video
    diffusion vs compositional primitives), supervision signal (context, physics,
    language, action), interaction mode (passive prediction vs action-conditioned
    closed-loop), and evaluation setting (Atari, driving, robotic, Minecraft).'
  - 'Trend evolution: Evidence is concentrated in 2023-2026; earlier efficient model-based
    RL gives way to larger generative video world models and to open-domain benchmarks
    for memory, spatial consistency, and action control.'
  - 'Open questions: Long-term memory consistency, cross-action-space and unseen-primitive
    generalization, real-robot transfer, and isolating model contribution from planner,
    data, and benchmark effects remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer或Transformer-VAE混合架构的生成式世界模型，面向驾驶、机器人操作和样本高效强化学习的动作条件视频与潜在动力学预测。
  - 研究共性：方法通过重建或生成目标学习时间动力学，常加入掩码、上下文、物理、语言组合或动作扩散等归纳偏置，并通过下游策略或一致性基准评估。
  - 关键差异：表示层级不同（潜在状态空间、像素/视频扩散、组合原语），监督信号不同（上下文、物理、语言、动作），交互模式不同（被动预测或动作条件闭环），评测场景不同（Atari、驾驶、机器人、Minecraft）。
  - 趋势演进：证据集中在2023-2026年；此前的高效模型强化学习逐渐转向更大规模生成式视频世界模型，并出现面向记忆、空间一致性和动作控制的开放域基准。
  - 开放问题：长期记忆一致性、跨动作空间与未见原语的泛化、真实机器人迁移，以及模型贡献与规划器、数据和基准效应的隔离仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative video dynamics and representation design
      what_it_solves: Turns world-model concepts into concrete diffusion or transformer-based
        generative models with mask, context, physics, or language-conditioned objectives
        for long-horizon and multi-view prediction.
      what_remains_open: Which inductive biases and representation choices transfer
        beyond reported driving, gaming, or robot datasets; missing limitation reports
        and scarce cross-dataset evidence limit verification.
    - line: Planning, action, and policy-interface methods
      what_it_solves: Connects learned dynamics to decision-time interfaces by coupling
        video and action diffusion, contextual latent rollouts, or compositional language
        primitives for policy pretraining and planning.
      what_remains_open: How much reported gain comes from the model versus the action
        interface, planner, or task prior; generalization to unseen action spaces
        and primitives remains weakly supported.
    - line: Evaluation protocols for consistency and action control
      what_it_solves: Provides reproducible datasets and metrics for spatial consistency,
        memory consistency, and action control, moving evaluation beyond visual fidelity.
      what_remains_open: Benchmark papers may report no experiment results or lack
        controlled ablations, so calibration against existing methods and isolation
        of model weaknesses remain open.
    consensus:
    - Recent work converges on generative video or latent dynamics models that condition
      predictions on actions, context, or language and serve downstream policy or
      control.
    - Transformer and diffusion architectures are shared backbones across driving,
      robotics, and game-like world modeling.
    - Evaluation is shifting from frame fidelity alone toward physical plausibility,
      spatial consistency, memory consistency, and downstream task utility.
    disagreements:
    - Representation differs between latent state-space rollouts and pixel-level video
      diffusion rollouts.
    - 'Supervision differs: some approaches impose mask reconstruction or physics
      objectives, while others use contextual conditioning or coupled action-video
      diffusion.'
    - Evaluation targets differ across Atari sample-efficiency, multi-view driving
      prediction, robot manipulation, and open-domain memory/action-control benchmarks.
    - 'Interaction mode differs: some models act as passive predictors or generative
      planners, while others are closed-loop action-conditioned simulators.'
    open_questions:
    - How can current world models maintain long-term memory consistency and temporal
      coherence over long loops and viewpoint changes, given benchmark findings that
      such consistency is difficult?
    - How well do compositional or contextual models generalize to unseen primitives,
      action spaces, or unobserved context values beyond their narrow evaluation tasks?
    - Which component—the learned dynamics model, the action interface, the planner,
      or the benchmark design—explains reported improvements?
    - Can simulated or vision-only successes transfer to real robot execution when
      several papers report only simulation or omit limitations and real-world validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频动力学与表示设计
      解决的问题: 将世界模型思想落实为具体的扩散或Transformer生成模型，通过掩码、上下文、物理或语言条件目标实现长时域和多视角预测。
      尚未覆盖: 哪些归纳偏置和表示选择能迁移到已报告的驾驶、游戏或机器人数据集之外；缺失的局限性说明和跨数据集证据使验证不足。
    - 路线: 规划、动作与策略接口方法
      解决的问题: 通过耦合视频与动作扩散、上下文潜在推演或组合语言原语，将学习到的动力学连接到策略预训练和规划。
      尚未覆盖: 报告增益中有多少来自模型本身而非动作接口、规划器或任务先验；对未见动作空间和原语的泛化证据仍薄弱。
    - 路线: 一致性与动作控制评测协议
      解决的问题: 提供可复现的数据集和指标，用于空间一致性、记忆一致性和动作控制评价，使评估超出视觉保真度。
      尚未覆盖: 基准论文可能不报告实验结果或缺少受控消融，因此现有方法的校准与模型弱点的隔离仍未解决。
    共识:
    - 近期工作收敛到基于生成式视频或潜在动力学模型，以动作、上下文或语言为条件，服务于下游策略或控制。
    - Transformer与扩散架构是驾驶、机器人和游戏类世界建模中共享的骨干。
    - 评估正从单一帧保真度转向物理合理性、空间一致性、记忆一致性和下游任务效用。
    分歧:
    - 表示不同：有的采用潜在状态空间推演，有的采用像素级视频扩散推演。
    - 监督不同：一些方法引入掩码重建或物理目标，另一些依赖上下文条件或动作-视频扩散耦合。
    - 评测目标不同：分别围绕Atari样本效率、多视角驾驶预测、机器人操作和开放域记忆/动作控制基准展开。
    - 交互模式不同：一些模型是被动预测器或生成式规划器，另一些是动作条件闭环模拟器。
    开放问题:
    - 当前世界模型如何在长回环和视角变化下维持长期记忆一致性与时间连贯性，现有基准表明这仍很困难？
    - 组合或上下文模型在未见原语、动作空间或未观测上下文值上的泛化能力，在狭窄评测任务之外如何？
    - 报告提升中，哪部分来自学习到的动力学模型、动作接口、规划器或基准设计？
    - 若多项论文仅报告仿真或缺少局限性与真实世界验证，视觉或仿真成功能否迁移到真实机器人执行？
