  related_work_outline:
  - 'Mainstream direction: recent work centers on benchmarking world models through
    interactive, action-conditioned, or consistency-oriented tasks rather than only
    frame-level generation quality.'
  - 'Shared research pattern: papers construct a controlled dataset or benchmark,
    define specialized metrics or stress tests, and compare several world-model baselines
    on long-horizon, spatial, memory, or control performance.'
  - 'Key differences: evaluation targets vary across visual fidelity, spatial consistency,
    memory consistency, action control, and downstream policy utility; interaction
    modes range from offline video prediction to closed-loop rollout.'
  - 'Trend evolution: within the 2023-2026 frontier, evaluation is moving from Atari/CARL-style
    task scores toward open-domain, embodied, driving, and robot benchmarks with stronger
    physical and action grounding.'
  - 'Open questions: whether proxy metrics align with downstream decisions, whether
    results remain stable across implementations and compute, and how well benchmark
    distributions cover real deployment conditions.'
  related_work_outline_zh:
  - 主流方向：近期研究集中于通过交互式、动作条件或一致性导向的任务来评估世界模型，而不再只看单帧生成质量。
  - 研究共性：论文构建受控数据集或基准，定义专门指标或压力测试，并在长时域、空间、记忆或控制能力上比较多类世界模型基线。
  - 关键差异：评测目标在视觉保真度、空间一致性、记忆一致性、动作控制和下游策略效用之间有所不同；交互模式从离线视频预测到闭环展开各异。
  - 趋势演进：在2023-2026前沿内，评测正从Atari/CARL式任务分数转向开放域、具身、驾驶和机器人基准，物理与动作约束更强。
  - 开放问题：代理指标是否与下游决策一致，结论在不同实现和算力下是否稳定，基准分布是否覆盖真实部署条件。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared tasks and datasets to make world-model claims
        comparable; examples include loop-navigation video data and open-domain closed-loop
        video benchmarks.
      what_remains_open: Coverage of real deployment settings, action-space diversity,
        and whether collected interactions transfer beyond the benchmark environment.
    - line: Metric and stress-test design
      what_it_solves: Measures prediction, spatial consistency, memory consistency,
        action control, and visual detail beyond aggregate scores; examples include
        scene-graph consistency scores or human-normalized Atari scores.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        users care about, and whether scores capture long-horizon stability.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditability through standard datasets, baselines, and
        reported metrics across driving, robotic, and RL benchmarks.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and missing baseline or limitation details.
    consensus:
    - World-model evaluation is shifting toward controlled tasks and specialized metrics
      rather than relying only on visual quality or aggregate task scores.
    - Spatial consistency, memory consistency, and action controllability are emerging
      as core evaluation dimensions for generative world models.
    - Recent benchmarks pair datasets with open-source artifacts or baseline frameworks
      to support reproducible comparison.
    - Visual detail and physical plausibility are treated as complementary signals
      for downstream policy utility.
    disagreements:
    - 'Evaluation target differs: some studies measure pixel-level generation or human-normalized
      game score, while others target scene-graph spatial consistency, memory consistency,
      or action-conditioned control.'
    - 'Interaction mode differs: offline video prediction benchmarks contrast with
      closed-loop action-conditioned rollouts and interactive policy evaluation.'
    - 'Representation and supervision differ: work ranges from diffusion transformers
      and recurrent state-space models to video-action diffusion; supervision includes
      context values, physics keypoints, depth, or action-free video.'
    - 'Deployment setting differs: evaluations span game, open-world navigation, driving,
      and robotic domains, making cross-benchmark conclusions difficult.'
    open_questions:
    - Do current benchmark task distributions cover the real settings where world
      models are expected to help, especially long-horizon and cross-action-space
      deployment?
    - Are spatial, memory, and visual-detail metrics aligned with downstream decision
      quality, or do they reward proxy behavior not visible in policy outcomes?
    - How stable are reported rankings across implementations, compute budgets, and
      missing baseline or limitation details?
    - Can benchmarks disentangle model capability from dataset-specific priors when
      supervision such as context, depth, or keypoints is available?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享任务和数据集，使世界模型主张可比；例如环线导航视频数据和开放域闭环视频基准。
      尚未覆盖: 是否覆盖真实部署设置、动作空间多样性，以及收集的交互是否能迁移到基准环境之外。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外测量预测、空间一致性、记忆一致性、动作控制和视觉细节；例如场景图一致性分数或人类归一化Atari分数。
      尚未覆盖: 代理指标与用户关心的下游决策之间是否一致，以及分数是否捕捉长时域稳定性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一数据集、基线和报告指标，使驾驶、机器人和RL基准中的结果可审计。
      尚未覆盖: 结论在不同实现、算力预算以及缺失基线和局限性细节时是否仍然稳定。
    共识:
    - 世界模型评估正转向受控任务和专门指标，而不是只依赖视觉质量或聚合任务分数。
    - 空间一致性、记忆一致性和动作可控性正成为生成式世界模型的核心评估维度。
    - 近期基准通常将数据集与开源工件或基线框架配对，以支持可复现比较。
    - 视觉细节和物理合理性被视为下游策略效用的补充信号。
    分歧:
    - 评测目标不同：一些研究测量像素级生成或人类归一化游戏分数，另一些则针对场景图空间一致性、记忆一致性或动作条件控制。
    - 交互模式不同：离线视频预测基准与闭环动作条件展开和交互式策略评估形成对比。
    - 表示与监督不同：工作涵盖扩散Transformer、循环状态空间模型和视频-动作扩散；监督包括上下文值、物理关键点、深度或无动作视频。
    - 部署设置不同：评测覆盖游戏、开放世界导航、驾驶和机器人领域，因此跨基准结论较难迁移。
    开放问题:
    - 当前基准任务分布是否覆盖世界模型预期发挥作用的真实设置，尤其是长时域和跨动作空间部署？
    - 空间、记忆和视觉细节指标是否与下游决策质量一致，还是会奖励策略结果中未体现的代理行为？
    - 在实现、算力预算以及基线和局限性细节缺失的情况下，报告排名还能保持稳定吗？
    - 当上下文、深度或关键点等监督可用时，基准能否区分模型能力与数据集特定先验？
