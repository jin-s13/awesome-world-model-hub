  literature_review:
    line_of_work_matrix:
    - line: Unified action-video diffusion pretraining
      what_it_solves: Learning a single model that can represent policy, forward/inverse
        dynamics, and video generation by coupling action and visual modalities.
      what_remains_open: Direct evidence that unified multimodal diffusion transfers
        across embodiments and that action-free learning improves downstream policies
        beyond available benchmarks.
    - line: Fine-grained action-frame alignment for manipulation videos
      what_it_solves: Improving action-conditioned video generation and model-based
        planning by aligning action signals with corresponding frames.
      what_remains_open: Whether fine alignment scales to long horizons, multi-object
        scenes, or real-world contact-rich manipulation.
    - line: Parameter-efficient adaptation of pretrained video diffusion
      what_it_solves: Converting closed pretrained video generators into action-conditioned
        world models without accessing base parameters.
      what_remains_open: Dependence on small action-labelled domain data and generalization
        to other sequential decision tasks remain unverified.
    - line: Physics-aligned and preference-tuned embodied rollouts
      what_it_solves: Post-training video-based world models to improve physical realism,
        task logic, embodiment plausibility, and visual quality via reward or preference
        signals.
      what_remains_open: Human-preference reward collection and evaluation are concentrated
        on contact-rich manipulation; transfer to broader domains is not shown.
    - line: Functional evaluation and test-time verification of world models
      what_it_solves: Assessing whether generated trajectories actually improve spatial
        reasoning or support reliable model-based evaluation rather than only looking
        realistic.
      what_remains_open: Current verifiers show calibration gaps and scaling failures,
        especially on MMSI-Bench; no consistent test-time scaling across benchmarks.
    - line: Taxonomy of state construction and dynamics modeling
      what_it_solves: Organizing video-generation-as-world-model approaches into implicit/explicit
        state construction and knowledge/architecture-driven dynamics modeling.
      what_remains_open: The taxonomy has not been operationalized into standard functional
        benchmarks or validated against model training choices.
    consensus:
    - Action-conditioned video generation has become the de facto target for world-model
      capabilities in embodied learning.
    - Visual fidelity alone is treated as insufficient; physical plausibility, action
      alignment, trajectory consistency, and downstream decision utility are being
      added as evaluation or training objectives.
    - 'Generated rollouts are expected to serve multiple downstream uses: policy learning,
      planning, evaluation, verifier selection, or synthetic data.'
    - Most methods rely on large action-video datasets or pretrained video generators,
      but verification of causal and persistent state behavior remains limited.
    - Within the recent frontier, explicit post-training or adaptation mechanisms
      are used to inject action control or physical constraints into otherwise stateless
      video models.
    disagreements:
    - 'Representation: some methods use diffusion transformers for future video prediction,
      while others use masked autoregressive token generation.'
    - 'Supervision: some train on task or action prediction objectives, others use
      preference, RL, or DPO alignment, and one uses learned masks for closed-source
      adaptation.'
    - 'Evaluation target: work evaluates visual quality, policy correlation, planning
      improvement, zero-shot physical plausibility, or spatial reasoning; these are
      not interchangeable.'
    - 'Interaction mode: models differ in conditioning through frame-level modules,
      parallel context blocks, independent per-modality diffusion timesteps, or external
      learned masks.'
    - 'Deployment setting: evidence spans robot manipulation datasets, video-game
      data, and embodied zero-shot benchmarks; generalization across these settings
      remains unresolved.'
    open_questions:
    - Do current action-conditioned video models learn explicit persistent state and
      causal dynamics, or only visually plausible transitions?
    - Can test-time verification or reward-based alignment produce consistent scaling
      across all spatial and physical reasoning benchmarks, given failures on MMSI-Bench?
    - What generalizes beyond contact-rich manipulation and specific robot datasets,
      and what depends on action-labeled domain data or pretrained video generators?
    - Where are the formal definitions, assumptions, scaling laws, and guarantees
      implied by the theory topic? The packet provides no direct evidence for them.
    - How should functional benchmarks separate physical persistence, causal intervention,
      and policy utility without optimizing only dataset-specific visual quality?
