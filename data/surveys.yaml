  related_work_outline:
  - 'Mainstream direction: The evidence clusters around world-model systems such as
    Vista, RoboScape, and FAR-Drive that unify representation learning, video generation,
    and closed-loop control for driving and robotics.'
  - 'Shared research pattern: Most works convert action-conditioned observation history
    into future frames and reuse that model for simulation, evaluation, or policy
    learning; repeated emphasis on controllability and physical or spatial consistency.'
  - 'Key differences: Some systems emphasize visual fidelity and versatile control,
    others benchmark spatial or action consistency, and others embed context or physics
    priors; deployment ranges from real robots to large-scale driving simulation.'
  - 'Trend evolution: From DayDreamer-style real-robot online learning in 2022 to
    2024-2026 driving/world simulation with autoregressive or diffusion video generation,
    the field is moving toward closed-loop, latency-aware evaluation.'
  - 'Open questions: Generalization beyond curated datasets, long-horizon consistency,
    speed-fidelity-controllability trade-offs, and independent reproducibility remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中在类似 Vista、RoboScape、FAR-Drive 的世界模型系统，统一表示学习、视频生成与闭环控制。
  - 研究共性：多数工作将动作条件历史观测映射为未来帧，并复用于仿真、评测或策略学习，反复强调可控性与物理/空间一致性。
  - 关键差异：有的侧重视觉保真和多功能控制，有的基准化空间或动作一致性，有的引入上下文或物理先验；部署从真实机器人到大规模驾驶仿真不同。
  - 趋势演进：从 2022 年 DayDreamer 式真实机器人在线学习，到 2024-2026 年自动驾驶/世界仿真中的自回归或扩散视频生成，正走向闭环和低延迟评测。
  - 开放问题：向精选数据集之外泛化、长时域一致性、速度-保真度-可控性权衡，以及独立可复现性仍有待解决。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop world-model simulation and evaluation pipelines
      what_it_solves: Turns action-conditioned video generation into driving or robotic
        simulation, policy training, and evaluation workflows.
      what_remains_open: Generalization beyond datasets such as nuScenes and Minecraft,
        cross-platform deployment, and long-horizon consistency remain weakly verified.
    - line: Real-time and interactive embodied learning systems
      what_it_solves: Meets latency and closed-loop interaction demands for physical
        robot learning and action-controllable generation.
      what_remains_open: Trade-offs among inference speed, visual fidelity, dynamic
        consistency, and hardware generalization are unresolved.
    - line: Benchmarks and reproducibility artifacts for consistency evaluation
      what_it_solves: Provides datasets, metrics, and evaluation protocols that make
        spatial or action consistency inspectable and comparable.
      what_remains_open: Independent reproduction across teams and infrastructure,
        baseline details, and limitation evidence are incomplete for several systems.
    consensus:
    - Systems are converging on action-conditioned future-frame/world-model generation
      as the core abstraction for simulation, evaluation, and policy learning.
    - Evaluation is expanding from visual fidelity alone to explicit spatial, physical,
      or action-consistency signals.
    - Closed-loop deployment is becoming an explicit requirement, whether via real-robot
      online learning or low-latency single-GPU driving simulation.
    disagreements:
    - Representation choice differs between recurrent state-space dynamics and diffusion
      or autoregressive video generation.
    - 'Supervision and evaluation targets differ: physics-informed depth/keypoint
      losses, context conditioning, trajectory-annotated video, and loop-navigation
      benchmarks emphasize different evidence.'
    - Deployment setting differs between physical robots learning directly in the
      real world and large-scale driving simulation stacks.
    - 'Metrics differ: FID/FVD visual quality, action fidelity, scene-graph consistency,
      and downstream policy utility are not yet unified.'
    open_questions:
    - Can current world-model systems generalize beyond curated datasets such as nuScenes,
      CARL, and Minecraft to unseen sensors, domains, or physical platforms?
    - What supervision and architecture best support long-horizon spatial, physical,
      and action consistency without sacrificing visual detail or inference latency?
    - Which evaluation target should dominate when visual realism, action fidelity,
      dynamic plausibility, and downstream policy utility conflict?
    - How reproducible are these systems across teams and infrastructure given missing
      or incomplete code, dataset, baseline, and limitation signals in several papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环世界模型仿真与评测流水线
      解决的问题: 将动作条件视频生成转化为驾驶或机器人仿真、策略训练和评测工作流
      尚未覆盖: 在 nuScenes、Minecraft 等数据集之外的泛化、跨平台部署及长时域一致性仍未充分验证
    - 路线: 实时与交互式具身学习系统
      解决的问题: 满足实体机器人学习和动作可控生成中的低延迟闭环交互需求
      尚未覆盖: 推理速度、视觉保真度、动态一致性与硬件泛化之间的权衡尚未解决
    - 路线: 一致性与可复现性基准工件
      解决的问题: 通过数据集、指标与评测协议使空间或动作一致性可检查、可比较
      尚未覆盖: 跨团队和基础设施的独立复现、基线细节与限制说明在多个系统中仍然不完整
    共识:
    - 系统正汇聚到以动作条件未来帧/世界模型生成为核心抽象，用于仿真、评测和策略学习。
    - 评测正从单一视觉质量扩展到空间一致性、物理合理性或动作忠实度等显式信号。
    - 闭环部署逐渐成为明确要求，无论是以真实机器人在线学习还是单 GPU 低延迟驾驶仿真的形式。
    分歧:
    - 表示方式：循环状态空间动力学与扩散或自回归视频生成形成不同建模路径。
    - 监督与评测目标：物理信息深度/关键点损失、上下文条件、轨迹标注视频和循环导航基准强调不同证据。
    - 部署场景：直接在真实世界学习的物理机器人与面向大规模自动驾驶仿真的系统目标不同。
    - 指标选择：FID/FVD 视觉质量、动作忠实度、场景图一致性及下游策略效用尚未统一。
    开放问题:
    - 当前世界模型系统能否泛化到 nuScenes、CARL、Minecraft 等精选数据集之外的传感器配置、领域或物理平台？
    - 在兼顾视觉细节和推理延迟的前提下，什么监督信号和架构能支持长时域空间、物理与动作一致性？
    - 当视觉真实感、动作忠实度、动态合理性和下游策略效用冲突时，应优先选择哪个评测目标？
    - 在若干工作代码、数据集、基线和限制说明缺失或不完整的情况下，如何验证跨团队和基础设施的可复现性？
