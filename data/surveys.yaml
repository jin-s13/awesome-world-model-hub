  related_work_outline:
  - 'Mainstream direction: World model research is moving toward diffusion-based video
    generation, Transformer architectures, and joint training of visual dynamics with
    physical or action models, targeting embodied domains like driving and robotics.'
  - 'Shared research pattern: Most works decompose the world model into representation,
    generation, and interaction components, and evaluate on task-specific benchmarks
    with self-supervised or reinforcement learning objectives.'
  - 'Key differences: Architectural choices diverge between stochastic latent variables
    and deterministic diffusion; auxiliary tasks range from mask reconstruction and
    depth prediction to action diffusion; evaluation protocols vary from pixel-level
    fidelity to downstream policy performance.'
  - 'Trend evolution: From 2023 to 2026, the field shifted from efficient RL world
    models to large-scale pretrained video diffusion models, with increasing emphasis
    on memory consistency, spatial awareness, and physics-informed generation.'
  - 'Open questions: Generalization to unseen dynamics and action spaces, the isolated
    contribution of the world model versus the planner, and the lack of unified benchmarks
    for long-horizon consistency remain underexplored.'
  related_work_outline_zh:
  - 主流方向：世界模型研究正转向基于扩散的视频生成、Transformer 架构以及视觉动力学与物理或动作模型的联合训练，面向驾驶和机器人等具身领域。
  - 研究共性：多数工作将世界模型分解为表示、生成和交互组件，并在特定任务基准上以自监督或强化学习目标进行评估。
  - 关键差异：架构选择在随机潜变量和确定性扩散之间分化；辅助任务涵盖掩码重建、深度预测到动作扩散；评估协议从像素级保真度到下游策略性能不一。
  - 趋势演进：2023 至 2026 年间，领域从高效 RL 世界模型转向大规模预训练视频扩散模型，并越来越重视记忆一致性、空间感知和物理信息生成。
  - 开放问题：对未见动力学和动作空间的泛化、世界模型与规划器的独立贡献隔离、以及缺乏长时域一致性统一基准等问题仍待探索。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Concretizing world model concepts into architectures (e.g.,
        Diffusion Transformers, cRSSM, compositional video models) and training recipes
        (mask reconstruction, physics-informed joint training, multi-modal diffusion).
      what_remains_open: Which architectural choices, such as stochastic vs. deterministic
        latent dynamics or auxiliary physics tasks, reliably transfer beyond the reported
        domain and scale.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by coupling action
        and video diffusion, training policies on imagined rollouts, or conditioning
        on context for zero-shot policy generalization.
      what_remains_open: How much of the observed performance gain is attributable
        to the world model itself rather than the planner, action prior, or context
        observability assumptions.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating the contribution of a proposed method from dataset,
        baseline, and metric choices through dedicated benchmarks (LoopNav, MIND)
        and controlled evaluation of memory consistency, spatial coherence, and action
        control.
      what_remains_open: Whether existing benchmarks capture the full diversity of
        real-world dynamics, and whether the ablation studies rigorously isolate the
        novel components from the base system design.
    consensus:
    - Diffusion-based generation and Transformer backbones are becoming dominant for
      world models, replacing earlier RNN- and VAE-based designs.
    - Jointly modeling visual appearance, geometry, and physical knowledge during
      training improves the realism and utility of generated videos.
    - Memory and spatial consistency are emerging as critical evaluation dimensions,
      beyond traditional reconstruction or perceptual similarity.
    - Pretraining on large-scale, multi-task datasets (e.g., robotic or driving data)
      is a promising direction for building generalizable world models.
    disagreements:
    - 'Representation: some works use stochastic latent states with variational inference,
      while others use deterministic diffusion processes without explicit latent variables.'
    - 'Supervision target: methods differ in whether they optimize only for video
      prediction, or also for auxiliary tasks like depth prediction, action prediction,
      or physics consistency.'
    - 'Action interface: actions are treated as input conditions for video generation
      in some models, while in others they are jointly diffused as output, or omitted
      entirely, reflecting different assumptions about the role of control.'
    - 'Evaluation setting: some methods are validated in simplified RL benchmarks
      (Atari, CARL), while others target high-fidelity driving or robotic simulation,
      making cross-method comparison difficult.'
    open_questions:
    - Can world models generalize to novel dynamics, objects, and action spaces that
      are not represented in the training distribution, and what contextual or modular
      mechanisms are needed?
    - How can we deconfound the contributions of the world model, the planner, and
      the task prior to reliably attribute progress in model-based RL?
    - What benchmarks and metrics can simultaneously evaluate visual fidelity, physical
      plausibility, memory consistency, and long-horizon planning in a unified framework?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念落实为具体架构（如扩散Transformer、cRSSM、组合视频模型）和训练配方（掩码重建、物理信息联合训练、多模态扩散）。
      尚未覆盖: 哪些架构选择（如随机与确定性潜在动力学、辅助物理任务）能够在报告领域和规模之外可靠迁移。
    - 路线: 规划与动作接口方法
      解决的问题: 通过耦合动作与视频扩散、在想象轨迹上训练策略或条件化上下文以实现零样本策略泛化，将学习到的动力学连接到决策。
      尚未覆盖: 观察到的性能提升有多少来自世界模型本身，而不是规划器、动作先验或上下文可观测性假设。
    - 路线: 方法证据与消融协议
      解决的问题: 通过专用基准（LoopNav、MIND）和对记忆一致性、空间连贯性、动作控制的受控评估，区分方法贡献与数据集、基线和指标选择。
      尚未覆盖: 现有基准是否涵盖真实世界动力学的全部多样性，消融研究是否严格隔离了新颖组件与基础系统设计。
    共识:
    - 基于扩散的生成和Transformer骨干正在成为世界模型的主流，取代早期基于RNN和VAE的设计。
    - 在训练中联合建模视觉外观、几何和物理知识能提升生成视频的真实感和实用性。
    - 记忆和空间一致性正成为超越传统重建或感知相似性的关键评估维度。
    - 在大规模多任务数据集（如机器人或驾驶数据）上预训练是构建可泛化世界模型的有前景方向。
    分歧:
    - 表示方式：一些工作使用变分推断的随机潜状态，另一些则使用无显式潜变量的确定性扩散过程。
    - 监督目标：方法在仅优化视频预测或同时优化深度预测、动作预测、物理一致性等辅助任务上存在差异。
    - 动作接口：动作在某些模型中被视为视频生成的条件输入，在其他模型中被联合扩散为输出，或完全省略，反映了对控制角色的不同假设。
    - 评测场景：部分方法在简化的RL基准（Atari、CARL）上验证，而其他方法针对高保真驾驶或机器人仿真，使得跨方法比较困难。
    开放问题:
    - 世界模型能否泛化到训练分布中未出现的新动力学、物体和动作空间，需要什么样的上下文或模块化机制？
    - 如何解耦世界模型、规划器和任务先验的贡献，以可靠地归因基于模型的RL的进展？
    - 哪些基准和指标能同时评估视觉保真度、物理合理性、记忆一致性和长时域规划的统一框架？
