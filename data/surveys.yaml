  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models for embodied control,
    with recent work moving from controllable generation toward physical alignment,
    reward calibration, and functional evaluation.'
  - 'Shared research pattern: Treat video prediction as dynamics modeling; inject
    action or state signals; pretrain or adapt on robot trajectories; evaluate with
    planning, policy correlation, or control-quality signals.'
  - 'Key differences: Generation mechanism, supervision/evaluation target, access
    to pretrained parameters, scaling emphasis, and data/deployment assumptions divide
    the top work.'
  - 'Trend evolution: From 2024 fine-grained action conditioning and pretrained diffusion
    adaptation, through 2025 unified/heterogeneous pretraining and faster real-time
    generation, toward 2026 physics alignment, test-time verification, and conceptual
    taxonomies; available top evidence is concentrated in this frontier.'
  - 'Open questions: Whether formal state/dynamics conditions match empirical behavior,
    verifier scaling is unstable, out-of-manipulation generalization is weak, and
    persistence/causality plus reproducibility evidence remain gaps.'
  related_work_outline_zh:
  - 主流方向：以动作条件视频生成作为具身世界模型，近期从可控生成走向物理对齐、奖励校准和功能评估。
  - 研究共性：将视频预测视为动力学建模；注入动作或状态信号；用机器人轨迹预训练或适配；并用规划、策略相关性与控制信号评估。
  - 关键差异：生成机制、监督/评测目标、参数可及性、缩放重点和部署数据假设存在分歧。
  - 趋势演进：从2024年细粒度动作条件生成与预训练扩散适配，到2025年统一/异构预训练和实时加速，再到2026年物理对齐、测试时验证与概念分类；顶部证据集中在前沿。
  - 开放问题：形式条件与经验行为不一致、验证器缩放不稳定、操作域外泛化不足，以及持久性/因果功能指标和可复现性证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics models for robot learning
      what_it_solves: Learn controllable future video and policy/dynamics behavior
        from robot trajectories, enabling planning, evaluation, and synthetic rollouts.
      what_remains_open: Formal assumptions are rarely stated; limitations and out-of-domain
        generalization beyond tested manipulation benchmarks remain largely unverified.
    - line: Adaptation and alignment of pretrained video generators for embodied simulation
      what_it_solves: Turn available or closed video generators into action- or physics-aligned
        world models using adapters, reward models, or preference-based post-training.
      what_remains_open: Dependence on domain-specific action-labelled or human-preference
        data persists; demonstrated transfer beyond contact-rich manipulation and
        closed-model settings is incomplete.
    - line: Test-time verification and reward-calibrated reasoning in world models
      what_it_solves: Improve reliability of world-model-based reasoning by grounding
        test-time reward in verifiable frame-anchored assertions or learned multi-dimensional
        rewards.
      what_remains_open: Current verifiers can be poorly calibrated and improvements
        are benchmark-specific, so consistent scaling across spatial reasoning settings
        is unresolved.
    - line: Conceptual taxonomies and evaluation boundaries for world-model claims
      what_it_solves: Clarify state construction, dynamics modeling, and the evaluation
        gaps between visual generation and functional world models.
      what_remains_open: Proposed taxonomies lack direct empirical evidence that they
        change model design; functional benchmarks for persistence and causality remain
        underdeveloped.
    consensus:
    - Video generation is treated as a candidate world model only when action or state
      information is injected and decision-relevant behavior is evaluated.
    - Robot trajectory data can support pretraining or adaptation, but visual fidelity
      alone is not treated as sufficient evidence of world-model quality.
    - Recent work converges on adding physical plausibility, task logic, or verifiable
      reasoning signals rather than relying solely on frame-generation metrics.
    - Evaluation practices are shifting toward functional tests such as planning,
      policy correlation, trajectory selection, or embodied zero-shot benchmarks.
    disagreements:
    - 'Representation and generation mechanism differ: diffusion transformers with
      independent modality timesteps, masked autoregression, and learned-mask adaptation
      of pretrained models coexist.'
    - 'Supervision and evaluation targets differ: some optimize visual quality and
      speed, others optimize physical plausibility through human preferences or DPO,
      and others optimize verifiable spatial reasoning.'
    - 'Scaling emphasis differs: one line scales model and heterogeneous data, another
      scales real-time generation speed, while test-time scaling evidence remains
      inconsistent.'
    - 'Deployment assumptions differ: methods require different access to pretrained
      model parameters, action-labeled data, preference data, or benchmark-specific
      verifiers.'
    open_questions:
    - Do formal state and dynamics conditions from conceptual analyses match the behavior
      of current action-conditioned video models?
    - Which reward or verifier signals can provide consistent test-time scaling across
      different spatial reasoning and embodied benchmarks?
    - Can physics-aligned world models generalize beyond contact-rich manipulation
      without domain-specific action-labeled or human-preference data?
    - What functional metrics can evaluate physical persistence and causal reasoning
      when current benchmarks still emphasize visual fidelity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向机器人学习的动作条件视频动力学模型
      解决的问题: 从机器人轨迹学习可控的未来视频、策略和动力学行为，以支持规划、评估和合成回放。
      尚未覆盖: 形式假设和局限常被省略；在已测操作基准之外的泛化仍缺少完整证据。
    - 路线: 预训练视频生成器的适配与对齐
      解决的问题: 通过适配器、奖励模型或偏好后训练，将可用或闭源视频生成器转化为动作或物理对齐的世界模型。
      尚未覆盖: 对领域专用动作标注或人类偏好数据的依赖仍然存在；超越接触丰富操作和闭源模型设置的迁移证据不完整。
    - 路线: 世界模型中的测试时验证与奖励校准推理
      解决的问题: 通过将测试时奖励建立在可验证的帧锚定断言或学习得到的多维奖励上，提升世界模型推理可靠性。
      尚未覆盖: 当前验证器可能存在校准不良，且改进具有基准特异性，跨空间推理场景的一致缩放仍未解决。
    - 路线: 世界模型声明的概念分类与评估边界
      解决的问题: 澄清状态构建、动力学建模，以及视觉生成与功能性世界模型之间的评估差距。
      尚未覆盖: 所提分类缺少直接经验证据证明其会改变模型设计；面向持久性和因果推理的功能基准仍不成熟。
    共识:
    - 只有当动作或状态信息被注入，并评估决策相关行为时，视频生成才被视作候选世界模型。
    - 机器人轨迹数据可用于预训练或适配，但仅凭视觉保真度不被视为世界模型质量的充分证据。
    - 近期研究趋向于加入物理合理性、任务逻辑或可验证推理信号，而不是仅依赖帧生成指标。
    - 评估实践正转向功能测试，如规划、策略相关性、轨迹选择或具身零样本基准。
    分歧:
    - 表示与生成机制不同：独立模态时间步的扩散Transformer、掩码自回归和基于学习掩码的预训练模型适配同时存在。
    - 监督和评测目标不同：有的优化视觉质量与速度，有的通过人类偏好或DPO优化物理合理性，有的优化可验证的空间推理。
    - 缩放重点不同：有的缩放模型和异构数据，有的提升实时生成速度，而测试时缩放的证据仍不一致。
    - 部署假设不同：方法对预训练模型参数、动作标注数据、偏好数据或基准专用验证器的访问条件要求不同。
    开放问题:
    - 概念分析提出的形式化状态与动态条件是否与当前动作条件视频模型的经验行为一致？
    - 哪些奖励或验证器信号能够在不同空间推理和具身基准上提供一致的测试时缩放？
    - 物理对齐的世界模型能否在缺少领域专用动作标注或人类偏好数据的情况下泛化到接触丰富操作之外？
    - 当现有基准仍偏重视觉保真度时，哪些功能指标可以评估物理持久性和因果推理？
