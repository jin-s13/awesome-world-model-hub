  - 'Mainstream direction: the strongest evidence clusters around generative, action-conditioned
    video world models for embodied domains, especially driving and robotics, with
    diffusion transformers and unified video-action pretraining.'
  - 'Shared research pattern: models add domain-specific structure such as context,
    language primitives, depth, keypoints, or mask reconstruction to improve physical,
    spatial, or compositional consistency beyond pixel-level generation.'
  - 'Key differences: the field splits between latent-dynamics RL world models for
    sample-efficient policy learning and high-dimensional generative world models
    for video/action synthesis; evaluation targets range from Atari scores to driving
    rollouts to memory and action-consistency benchmarks.'
  - 'Trend evolution: the available top evidence spans 2023-2026, so this is a current-frontier
    trend; work is moving from efficient RL world models toward large-scale robot/driving
    generative simulators and then toward specialized consistency and controllability
    benchmarks.'
  - 'Open questions: whether world-model gains transfer to real-world deployment,
    how to handle unobservable context and unseen primitives/action spaces, and how
    benchmark improvements connect to downstream policy quality remain unresolved.'
  related_work_outline_zh:
  - 主流方向：最强证据集中在面向具身领域、尤其是驾驶和机器人的生成式动作条件视频世界模型，常使用扩散Transformer和统一的视频-动作预训练。
  - 研究共性：模型通过引入领域结构（如上下文、语言原语、深度、关键点、掩码重建）来提升物理、空间或组合一致性，而不仅是像素级生成。
  - 关键差异：分为面向样本高效策略学习的潜在动力学RL世界模型与面向视频/动作合成的高维生成模型；评测目标从Atari分数到驾驶推演再到记忆与动作一致性基准各异。
  - 趋势演进：可用核心证据集中在2023-2026年，属于当前前沿趋势；研究正从高效RL世界模型走向大规模机器人与驾驶生成式仿真器，再走向专用一致性与可控性基准。
  - 开放问题：世界模型收益能否迁移到真实部署、如何处理不可观测上下文和未见的原语/动作空间、以及基准提升与下游策略质量的关系仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Contextual and sample-efficient RL world models
      what_it_solves: Learning latent dynamics for visual control and improving zero-shot
        generalization to unseen context values in model-based reinforcement learning.
      what_remains_open: Assumes observable context; evaluation is limited to few
        controlled tasks, and broader generalization beyond simplified zero-shot settings
        is not verified.
    - line: Generative driving world models for multi-view and long-horizon scene
        prediction
      what_it_solves: Using mask reconstruction with diffusion to improve multi-view
        and long-horizon driving video prediction and zero-shot validation across
        driving datasets.
      what_remains_open: The connection between improved prediction and real closed-loop
        driving decisions or safety outcomes is not demonstrated in the packet.
    - line: Compositional and physics-informed robot world models for video-action
        pretraining
      what_it_solves: Video planning from language primitives, physical plausibility
        through depth/keypoints, and joint video/action pretraining on large robot
        datasets.
      what_remains_open: Real-world robot execution evidence is thin; generalization
        beyond previously seen primitives or physical interaction combinations remains
        uncertain.
    - line: Consistency and controllability benchmarks for world models
      what_it_solves: Quantifying long-term memory, spatial consistency, and action
        control through loop-based navigation and closed-loop revisiting in open-domain
        settings.
      what_remains_open: The relation between these benchmark metrics and downstream
        task success is not established; long-term memory and cross-action generalization
        remain challenging.
    consensus:
    - Recent work treats world models as action-conditioned generative simulators,
      moving beyond latent next-state prediction toward video/action generation and
      large-scale pretraining.
    - Many models add auxiliary self-supervised or physics-informed objectives, such
      as depth prediction, keypoint dynamics, mask reconstruction, or instruction
      parsing, to improve consistency and generalization.
    - Evaluation is shifting from image quality alone toward measuring spatial consistency,
      memory consistency, physical plausibility, and action controllability.
    disagreements:
    - 'Representation differs: some methods learn compact latent state-space dynamics
      for policy optimization, while others generate high-dimensional video and action
      sequences.'
    - 'Supervision differs: approaches use RL-style imagined rollouts, contextual
      labels, language-decomposed primitives, mask reconstruction, or physics-informed
      auxiliary tasks.'
    - 'Evaluation target differs: Atari human-normalized performance, driving multi-view
      long-horizon prediction, robot video planning, and custom memory/action benchmarks
      are not directly comparable.'
    - 'Interaction setting differs: closed-loop action-conditioned generation, offline
      pretraining on large datasets, and simulated robot execution are used inconsistently,
      limiting cross-paper conclusions.'
    open_questions:
    - Does improved video fidelity or benchmark consistency translate into safer and
      more effective real-world driving or robot behavior?
    - How can world models generalize to unobservable context, novel instruction primitives,
      unseen physical interactions, or new action spaces without task-specific assumptions?
    - Can long-term memory consistency and cross-action controllability be improved
      without overfitting to a single benchmark or scene distribution?
    - What evaluation evidence would connect world-model dreams or synthetic rollouts
      to downstream policy quality and deployment robustness?
