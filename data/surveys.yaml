    研究路线矩阵:
    - 路线: 联合动作-视频动态建模用于机器人控制
      解决的问题: 将未来视频生成与动作序列耦合，使单一模型同时支持策略、前向动力学、逆动力学和视频预测，用于机器人预训练与规划。
      尚未覆盖: 证据集中在机器人操作环境；长时程稳定性、领域迁移以及不同动态目标之间的直接比较仍不足。
    - 路线: 预训练视频模型的无参数适配
      解决的问题: 通过训练轻量掩码适配器，将黑盒预训练视频扩散模型转化为动作条件动态模型，而无需访问底层参数。
      尚未覆盖: 假设存在动作标注的领域视频和合适的预训练视频模型；尚未展示在游戏与机器人以外领域的泛化。
    - 路线: 世界模型轨迹的测试时验证与奖励对齐
      解决的问题: 通过空间微断言、人类偏好或物理判别器改进轨迹选择或后训练，使生成轨迹更符合任务与物理约束。
      尚未覆盖: 验证器校准与缩放在不同基准上不一致；偏好奖励可能主观，接触丰富操作以外的泛化未验证。
    - 路线: 状态与动态的概念分类和边界
      解决的问题: 将视频生成作为世界模型进行形式化，区分状态构建与动态建模，并指出视觉保真与功能评测之间的缺口。
      尚未覆盖: 该分类仍为概念性工作；尚无直接实验证据表明其改变评测或设计，与经验模型行为的连接仍开放。
    - 路线: 动作条件视频生成的缩放与效率
      解决的问题: 探索模型规模、自回归令牌化和测试时缩放对生成速度、可控性以及规划或推理质量的影响。
      尚未覆盖: 缩放结果主要是经验观察而非预测性规律；没有经过验证的规律将规模、速度或令牌化选择与策略鲁棒性及失败迁移联系起来。
    共识:
    - 多数研究将动作和观测条件下的未来视频生成视为学习到的动态代理，并把生成轨迹用于规划、策略评估或合成数据。
    - 研究共同关注视觉保真度不足，需要单独评估或对齐物理合理性、动作-帧对齐或任务逻辑。
    - 近期工作趋向于增加后训练或测试时选择机制，以改进动作条件轨迹生成。
    分歧:
    - 表示方式不同：扩散Transformer对比掩码自回归对离散或软令牌的建模。
    - 对齐信号不同：启发式空间验证器、人类偏好奖励模型和DPO式物理判别器对“好轨迹”的假设不同。
    - 评测目标不同：规划相关性、视觉保真度、物理合理性或空间推理准确率，尚无通用功能基准。
    - 模型访问方式不同：在大数据集上训练统一模型，对比通过中间输出适配闭源预训练视频生成器。
    开放问题:
    - 如何功能性评测世界模型，使视觉生成改进能预测策略学习或真实迁移的提升？
    - 在什么条件下测试时验证器或学习奖励能产生一致缩放，而不是形成信息瓶颈？
    - 显式状态构建和动态解耦能否改善视频世界模型的长时程持久性与因果推理？
    - 状态与动态的形式化分类是否会真正改变模型设计，还是仅整理已有方法而不改变评测？
