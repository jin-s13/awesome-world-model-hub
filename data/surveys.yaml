  - 研究共性：系统从观测和动作生成未来帧，并在视觉保真之外逐步引入物理、任务或决策质量等标准。
  - 关键差异：表示方式涵盖统一扩散、掩码自回归和黑盒适配；对齐方式涵盖基于奖励的RL后训练、DPO式后训练和无显式对齐；评测目标从视觉质量到下游策略、物理合理性和空间推理不等。
