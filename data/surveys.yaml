  related_work_outline:
  - 'Mainstream direction: Application-focused world models cluster around embodied
    robotics and autonomous driving simulation, using video generation or latent dynamics
    to support policy learning, scene prediction, and closed-loop evaluation.'
  - 'Shared research pattern: Models learn action-conditioned or context-conditioned
    transition/generation objectives and are assessed by downstream policy success,
    rollout quality, or consistency metrics rather than only reconstruction.'
  - 'Key differences: Representation choices range from recurrent/transformer latent
    state-space models to diffusion video generators; supervision varies from task
    reward to language primitives, physics auxiliary tasks, and action-free video.'
  - 'Trend evolution: Available high-priority evidence concentrates in 2023–2026,
    moving from efficient model-based RL on game benchmarks toward large-scale robotics
    pretraining, driving world models, and dedicated consistency/action-control benchmarks.'
  - 'Open questions: How simulation and video fidelity translate to real-world safety,
    physical plausibility, cross-embodiment transfer, long-horizon memory, and generalization
    beyond observed contexts or action spaces remains uncertain.'
  related_work_outline_zh:
  - 主流方向：应用型世界模型集中在具身机器人和自动驾驶仿真，利用视频生成或潜在动力学支持策略学习、场景预测和闭环评测。
  - 研究共性：模型学习以动作或上下文为条件的转移/生成目标，并通过下游策略成功率、展开质量或一致性指标来评测，而非仅看重建。
  - 关键差异：表示从循环/Transformer潜在状态空间模型到扩散视频生成器不等；监督信号包括任务奖励、语言原语、物理辅助任务和无动作视频。
  - 趋势演进：可用高优先级证据集中在2023-2026年，正从游戏基准上的高效基于模型强化学习，转向大规模机器人预训练、驾驶世界模型及一致性与动作控制基准。
  - 开放问题：仿真和视频保真度如何转化为真实安全、物理合理性、跨本体迁移、长时记忆以及对未见上下文或动作空间的泛化。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models and video-based imagination
      what_it_solves: Generates action- or language-conditioned video plans and policy/dynamics
        representations for robot tasks, supporting unseen goal combinations and pretraining
        across robot datasets.
      what_remains_open: Real-robot execution evidence is limited; compositional generalization
        assumes previously seen primitives, and physics-informed losses are not yet
        tied to downstream safety or long-horizon reliability.
    - line: Autonomous driving world models and multi-view simulation
      what_it_solves: Predicts long-horizon, multi-view driving scenes under ego actions
        for closed-loop simulation and cross-dataset evaluation.
      what_remains_open: Zero-shot transfer across datasets is measured by video metrics,
        but alignment with real-world driving safety or operational outcomes remains
        unverified.
    - line: Efficient model-based reinforcement learning in interactive games
      what_it_solves: Learns compact stochastic world models from limited visual interactions
        to train policies with improved sample efficiency and game performance.
      what_remains_open: Evidence is concentrated on Atari 100k; transfer to sparse,
        long-horizon, or continuously changing interactive settings is not established.
    - line: Benchmarks for spatial, temporal, and action-control consistency in open
        interactive environments
      what_it_solves: Provides datasets and metrics to quantify spatial consistency,
        memory consistency, and action controllability beyond frame reconstruction
        quality.
      what_remains_open: Benchmarks are new and mostly construction-focused; broad
        experimental comparisons and demonstrated correlation with downstream task
        utility are not present in the available evidence.
    consensus:
    - Recent application-oriented world models favor action-conditioned or context-conditioned
      video generation and latent transition learning rather than passive next-frame
      prediction.
    - Evaluation is expanding from reconstruction or game score toward downstream
      policy utility, zero-shot generalization, and spatiotemporal/action consistency.
    - Modular or decomposed conditioning is recurrent, including language primitives,
      context variables, and modality-specific diffusion timesteps, to improve generalization.
    disagreements:
    - 'Representation choice differs: compact recurrent/transformer latent state-space
      models for efficient RL versus diffusion transformers for high-dimensional video
      generation.'
    - 'Supervision differs: task reward and imagined rollouts versus language-primitive
      decomposition, physics auxiliary objectives, or action-free video pretraining.'
    - 'Evaluation target differs: game scores and training speed versus multi-view
      driving rollout realism versus robot policy success versus spatial/memory consistency
      metrics.'
    - 'Interaction mode differs: closed-loop action-conditioned control in some systems
      versus open-loop video prediction or benchmark-based consistency scoring.'
    open_questions:
    - Do improvements in visual fidelity and simulator or benchmark metrics transfer
      to real-world safety and task success across embodiments and physical environments?
    - How can world models maintain long-horizon memory consistency and generalize
      across different action spaces or environment rules without assuming fully observable
      context?
    - What evidence connects physics-informed or context-decomposed world models to
      reliable downstream policy evaluation beyond simulated or curated benchmarks?
    - Driving-specific multi-view and zero-shot results currently rely on video prediction
      metrics; whether they reflect operational driving outcomes is not yet verified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人世界模型与视频式想象
      解决的问题: 生成以动作或语言为条件的视频计划和策略/动力学表示，支持未见目标组合泛化与跨机器人数据预训练。
      尚未覆盖: 真实机器人执行证据有限；组合泛化假设依赖已见原语；物理信息损失尚未与下游安全或长时可靠性绑定。
    - 路线: 自动驾驶世界模型与多视角仿真
      解决的问题: 预测自车动作下的长时域、多视角驾驶场景，用于闭环仿真和跨数据集评测。
      尚未覆盖: 零样本迁移当前以视频指标衡量，与真实驾驶安全或运营结果的一致性未验证。
    - 路线: 交互游戏中的高效基于模型强化学习
      解决的问题: 从有限视觉交互中学习紧凑随机世界模型，以提升策略样本效率和游戏表现。
      尚未覆盖: 证据集中在Atari 100k；向稀疏、长时域或持续变化交互场景的迁移未确立。
    - 路线: 开放交互环境下时空与动作控制一致性基准
      解决的问题: 通过数据集和指标量化空间一致性、记忆一致性和动作可控性，超越帧重建质量。
      尚未覆盖: 基准较新且偏重建；可用证据中缺少广泛实验比较及其与下游任务效用的关联验证。
    共识:
    - 近期应用型世界模型倾向学习以动作或上下文为条件的视频生成或潜在转移，而非仅做被动下一帧预测。
    - 评测从重建或游戏得分扩展至下游策略效用、零样本泛化和时空/动作一致性。
    - 多采用模块化或分解式条件设计，如语言原语、上下文变量、模态特定扩散时间步，以增强泛化。
    分歧:
    - 表示选择不同：高效强化学习中采用紧凑循环/Transformer潜在状态空间模型，而高维视频生成采用扩散Transformer。
    - 监督信号不同：任务奖励与想象展开、语言原语分解、物理辅助目标或无动作视频预训练。
    - 评测目标不同：游戏得分与训练速度、多视角驾驶展开真实感、机器人策略成功率、空间/记忆一致性指标。
    - 交互模式不同：闭-loop动作条件控制与开-loop视频预测或基于基准的一致性评分。
    开放问题:
    - 视觉保真度和仿真或基准指标的提升是否能在不同本体和物理环境中转化为真实安全与任务成功？
    - 在上下文不完全可观测时，世界模型如何保持长时记忆一致性并跨动作空间或环境规则泛化？
    - 物理信息或上下文分解世界模型与可靠下游策略评估之间的证据连接仍不足，真实部署证据缺失。
    - 驾驶场景的多视角和零样本结果当前依赖视频预测指标，能否反映运营驾驶结果尚未验证。
