  related_work_outline:
  - 'Mainstream direction: Building specialized benchmarks for world models, focusing
    on spatial-temporal consistency, memory, and action controllability beyond simple
    visual quality.'
  - 'Shared research pattern: Moving from fixed benchmark suites to targeted stress
    tests that probe specific capabilities (e.g., loop consistency, long-horizon rollout,
    cross-dataset zero-shot).'
  - 'Key differences: Environments range from embodied robotic settings to driving
    and video games; metrics vary from pixel-level fidelity to graph-based scene consistency
    and normalized human scores.'
  - 'Trend evolution: From 2023 onward, evaluation shifts from aggregate Atari/game
    scores to fine-grained diagnostic benchmarks; 2025–2026 add real-world robotics
    and open-domain video benchmarks.'
  - 'Open questions: Whether proxy metrics in these benchmarks align with downstream
    task success, and how to ensure stable conclusions across diverse model implementations
    and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建专用世界模型基准，重点评估时空一致性、记忆和动作可控性，而非仅关注视觉质量。
  - 研究共性：从固定基准套件转向针对性压力测试，检测特定能力（如循环一致性、长时域推演、跨数据集零样本）。
  - 关键差异：环境涵盖具身机器人、驾驶和视频游戏；指标从像素级保真度到基于图的场景一致性及归一化人类得分不等。
  - 趋势演进：自2023年起，评估从聚合的Atari/游戏得分转向细粒度诊断基准；2025–2026年新增真实机器人和开放域视频基准。
  - 开放问题：基准中的代理指标是否与下游任务成功对齐，以及如何确保结论在不同模型实现和算力预算下保持稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, such as spatial consistency (LoopNav) and memory/action control
        (MIND).
      what_remains_open: Coverage of real-world settings where world models are expected
        to help, e.g., physical interactions, long-term memory, and diverse action
        spaces beyond the constructed datasets.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., scene graph consistency score (SGCS),
        human-normalized score with visual detail sensitivity (DIAMOND), and zero-shot
        cross-dataset validation (MaskGWM).
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; metrics often remain tied to pixel-level or simple
        graph representations, missing physical plausibility and task-level success.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines, artifacts,
        and reporting conventions, as seen in the use of standard environments (Atari
        100k, Nuscenes, CARL) and open-source code.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; lack of standardized reporting on training details and
        hyperparameter sensitivity leaves reproducibility gaps.
    consensus:
    - World models need evaluation beyond visual fidelity, including spatial and temporal
      consistency, memory, and action controllability.
    - Standard benchmarks (Atari, CARL, Nuscenes) are widely adopted but insufficient
      to capture the full range of world model capabilities; new diagnostic datasets
      are needed.
    - Open-source artifacts and reproducible evaluation protocols are critical for
      fair comparison, though not yet universal.
    disagreements:
    - 'Evaluation setting: controlled game environments (Atari, Minecraft) vs. real-world
      driving (Nuscenes, Waymo) vs. robotic manipulation, leading to different stress
      points.'
    - 'Metric focus: pixel-level reconstruction (FID, PSNR) vs. structural consistency
      (SGCS) vs. task performance (human-normalized score, policy success rate).'
    - 'Evaluation target: some works prioritize visual generation quality, while others
      emphasize decision-making utility or zero-shot generalization.'
    open_questions:
    - How can we design a unified benchmark suite that covers the diverse expectations
      of world models, from visual realism to physical plausibility and decision support?
    - To what extent do current metrics correlate with the downstream performance
      of policies trained inside world models, and can we develop task-aware metrics?
    - What are the minimal requirements for a benchmark to ensure conclusion stability
      under different model sizes, training budgets, and random seeds?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具备可比性，例如空间一致性（LoopNav）和记忆/动作控制（MIND）。
      尚未覆盖: 对世界模型预期发挥作用的真实设置的覆盖，例如物理交互、长期记忆以及超出构建数据集的多样动作空间。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数（SGCS）、对视觉细节敏感的人类归一化得分（DIAMOND）以及零样本跨数据集验证（MaskGWM）。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致；指标通常仍局限于像素级或简单图表示，缺少物理合理性和任务级成功。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、工件和报告规范让结果可审计，如使用标准环境（Atari 100k、Nuscenes、CARL）和开源代码。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；缺乏对训练细节和超参数敏感性的标准化报告，留下可复现性缺口。
    共识:
    - 世界模型的评估需要超越视觉保真度，包括空间和时间一致性、记忆和动作可控性。
    - 标准基准（Atari、CARL、Nuscenes）被广泛采用，但不足以捕捉世界模型能力的全部范围；需要新的诊断性数据集。
    - 开源工件和可复现的评估协议对公平比较至关重要，但尚未普及。
    分歧:
    - 评估场景：受控游戏环境（Atari、Minecraft）vs. 真实驾驶（Nuscenes、Waymo）vs. 机器人操作，导致不同的压力点。
    - 指标焦点：像素级重建（FID、PSNR）vs. 结构一致性（SGCS）vs. 任务表现（人类归一化得分、策略成功率）。
    - 评估目标：部分工作优先考虑视觉生成质量，而其他工作强调决策效用或零样本泛化。
    开放问题:
    - 如何设计一个统一的基准套件，涵盖世界模型从视觉真实感到物理合理性和决策支持的多样化期望？
    - 当前指标与世界模型内部训练策略的下游性能在多大程度上相关，我们能否开发出任务感知的指标？
    - 基准在何种最低要求下能够确保在不同模型大小、训练预算和随机种子下结论的稳定性？
