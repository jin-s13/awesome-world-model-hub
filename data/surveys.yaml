  related_work_outline:
  - 'Mainstream direction: Generative world models, predominantly diffusion transformers
    and transformers with VAEs, are trained to predict future video frames or latent
    states conditioned on actions, enabling video planning and policy learning.'
  - 'Shared research pattern: Most works cast world modeling as action-conditioned
    video or latent generation, use self-supervised or imitation learning, and evaluate
    on gaming, driving, or robotic benchmarks.'
  - 'Key differences: Supervision signals diverge—pixel-level video fidelity, spatial
    consistency, physical plausibility, or downstream task performance; architectures
    vary from unified diffusion of video and action to compositional generation with
    language primitives; domain focus ranges from Atari to self-driving and robot
    manipulation.'
  - 'Trend evolution: The topic evolved from efficient transformer-VAE models (2023)
    to context-aware and compositional approaches (2024), then to diffusion-based,
    physics-informed, and unified video-action models with mask reconstruction (2025),
    and most recently to benchmarks targeting memory consistency and action controllability
    (2026), indicating a shift from pure performance toward consistency and generalization.'
  - 'Open questions: Ensuring long-term memory and spatial consistency across viewpoints,
    generalizing to unseen action primitives or dynamics, disentangling model contribution
    from planners or task priors, and establishing unified evaluation protocols for
    generation quality, action control, and physical plausibility.'
  related_work_outline_zh:
  - 主流方向：以扩散变压器和结合VAE的Transformer为主的生成式世界模型，在动作条件化下预测未来视频帧或潜在状态，实现视频规划与策略学习。
  - 研究共性：多数工作将世界建模视为动作条件化的视频或潜在生成，采用自监督或模仿学习，并在游戏、驾驶或机器人基准上评估。
  - 关键差异：监督信号各异——像素级视频保真度、空间一致性、物理合理性或下游任务性能；架构从视频与动作的统一扩散到基于语言原语的组合生成；领域涵盖Atari、自动驾驶和机器人操作。
  - 趋势演进：从高效Transformer-VAE模型（2023年）到上下文感知和组合方法（2024年），再到基于扩散、物理信息驱动和掩码重建的统一视频-动作模型（2025年），最近出现针对记忆一致性和动作可控性的基准（2026年），表明关注点从纯粹性能转向一致性与泛化。
  - 开放问题：长时域记忆和跨视角空间一致性的维持，对未见动作原语或动力学的泛化，分离模型贡献与规划器或任务先验，以及建立统一的生成质量、动作控制和物理合理性评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures and training objectives
      what_it_solves: Turning world-model ideas into concrete architectures, losses,
        and training recipes, including diffusion transformers with mask reconstruction,
        transformer-VAE hybrids, physics-informed joint training, and unified video-action
        diffusion.
      what_remains_open: Which architectural choices (e.g., mask reconstruction, physics-informed
        losses, modality coupling) transfer across tasks and domains, and how to systematically
        compare them given the lack of controlled ablation studies.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to control, planning, and policy
        learning, e.g., via action-conditioned video generation, latent imagination
        with context-aware state-space models, or compositional video plans from language.
      what_remains_open: Disentangling the contribution of the world model from the
        planner or policy; real-world closed-loop validation beyond simulation; generalization
        to unseen action spaces or novel primitives.
    - line: Evaluation and evidence protocols for world models
      what_it_solves: Establishing benchmarks for memory consistency, spatial consistency,
        and action controllability; providing dataset and metric designs to isolate
        method contributions from confounding factors.
      what_remains_open: Existing benchmarks cover limited domains (Minecraft, custom
        videos); most methods lack systematic ablation against simpler baselines,
        and reproducibility evidence is incomplete; no unified metric jointly captures
        generation quality, action fidelity, and physical consistency.
    consensus:
    - World models are predominantly cast as generative models that predict future
      observations (video or latent states) conditioned on actions.
    - Diffusion models and transformers are the dominant architectural backbone, often
      combined with variational inference or sequence modeling.
    - Action-conditioned generation is the common interface for downstream planning
      and policy learning.
    - Evaluation relies on standard or custom benchmarks that measure visual fidelity,
      zero-shot generalization, or task success, but rarely all three together.
    disagreements:
    - 'Supervision and reconstruction targets differ: some methods optimize pixel-level
      video fidelity, while others prioritize latent dynamics, physical constraints
      (depth, keypoints), or spatial consistency via scene graphs.'
    - 'Domain and action space specialization varies widely: single-task gaming, multi-view
      driving, and multi-task robot manipulation impose different requirements on
      long-term memory and action controllability.'
    - 'Generalization strategies are incomparable: some works learn compositional
      primitives from language, others use context-conditioned latent inference, and
      others unify video and action diffusion, making it hard to assess transferability
      to unseen domains or action primitives.'
    - 'The role of physical priors is contested: physics-informed training (depth,
      keypoints) improves visual plausibility but its impact on downstream policy
      performance and generalization is not yet isolated.'
    open_questions:
    - How can world models maintain long-term memory consistency and spatial coherence
      across multiple viewpoints and action sequences, as highlighted by recent benchmarks?
    - Can world models generalize to unseen action primitives or dynamics without
      explicit context supervision, and what is the minimal information needed for
      such generalization?
    - How can we design a unified evaluation protocol that jointly captures generation
      quality, action controllability, and physical consistency, replacing the current
      fragmented benchmark landscape?
    - What is the real contribution of the world model versus the RL algorithm or
      planning strategy in reported performance gains, and how can controlled experiments
      isolate it?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构与训练目标
      解决的问题: 将世界模型理念转化为具体架构、损失函数和训练配方，包括扩散变压器与掩码重建、Transformer-VAE混合、物理信息联合训练、统一视频-动作扩散。
      尚未覆盖: 哪些架构选择（如掩码重建、物理信息损失、模态耦合）能跨任务和域迁移，以及如何在缺乏受控消融研究的情况下进行系统比较。
    - 路线: 规划与动作接口方法
      解决的问题: 连接学习到的动力学与控制、规划和策略学习，例如通过动作条件化视频生成、带上下文感知状态空间模型的潜在想象，或从语言生成组合式视频计划。
      尚未覆盖: 分离世界模型与规划器或策略的贡献；超越仿真的真实世界闭环验证；对未见动作空间或新原语的泛化。
    - 路线: 世界模型的评估与证据协议
      解决的问题: 建立记忆一致性、空间一致性和动作可控性基准；提供数据集和指标设计，以将方法贡献与混淆因素隔离开来。
      尚未覆盖: 现有基准覆盖领域有限（Minecraft、定制视频）；多数方法缺乏针对简单基线的系统消融，且可复现性证据不完整；没有统一指标同时衡量生成质量、动作保真度和物理一致性。
    共识:
    - 世界模型主要被构建为生成模型，在动作条件化下预测未来观测（视频或潜在状态）。
    - 扩散模型和Transformer是主导架构，常与变分推断或序列建模结合。
    - 动作条件化生成是下游规划与策略学习的通用接口。
    - 评估依赖标准或自定义基准，测量视觉保真度、零样本泛化或任务成功率，但很少同时涵盖三者。
    分歧:
    - 监督信号与重建目标不同：有的方法优化像素级视频保真度，有的则侧重潜在动力学、物理约束（深度、关键点）或基于场景图的空间一致性。
    - 领域与动作空间专业化差异显著：单任务游戏、多视角驾驶和多任务机器人操作对长时记忆和动作可控性提出不同要求。
    - 泛化策略不可比较：有的从语言学习组合原语，有的使用上下文条件化潜在推断，有的统一视频与动作扩散，难以评估对未见域或动作原语的迁移能力。
    - 物理先验的作用存在争议：物理信息训练（深度、关键点）改善视觉合理性，但其对下游策略性能和泛化的影响尚未被隔离。
    开放问题:
    - 如近期基准所示，世界模型如何维持长时域记忆一致性和跨视角空间连贯性？
    - 世界模型能否在无显式上下文监督的情况下泛化至未见动作原语或动力学？实现该泛化所需的最小信息是什么？
    - 如何设计一个统一评估协议，同时衡量生成质量、动作可控性和物理一致性，取代当前碎片化的基准格局？
    - 在报告的性能提升中，世界模型相对于强化学习算法或规划策略的真实贡献是什么？如何通过受控实验将其分离？
