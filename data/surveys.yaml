  related_work_outline:
  - 'Mainstream direction: Building video generative world models (predominantly diffusion-based)
    for domain-specific applications such as autonomous driving, robot manipulation,
    and interactive games, with action conditioning and auxiliary tasks that enforce
    physical and temporal consistency.'
  - 'Shared research pattern: Combining self-supervised video prediction with action
    or language conditioning, and evaluating on both video quality metrics and downstream
    task performance (policy learning, zero-shot generalization) on established benchmarks.'
  - 'Key differences: Robotics works emphasize compositional generalization and physics-informed
    tasks, driving works focus on multi-view and long-horizon prediction, and interactive
    agent works target sample efficiency and memory consistency; evaluation ranges
    from visual fidelity to policy success, and physics integration varies from explicit
    auxiliary tasks to purely data-driven generation.'
  - 'Trend evolution: Shift from early model-based RL world models (2015–2022) to
    large-scale diffusion transformers (2023–2025), with a recent surge in specialized
    benchmarks for memory, spatial, and action consistency (2025–2026), indicating
    a maturing focus on reliability beyond raw video quality.'
  - 'Open questions: Whether improvements in simulation transfer to real-world safety
    and operational outcomes; how to scale compositional generalization to entirely
    novel tasks without retraining; and what minimal set of auxiliary tasks guarantees
    physical plausibility across diverse embodiments.'
  related_work_outline_zh:
  - 主流方向：构建以视频生成为核心（多为扩散模型）的领域应用世界模型，覆盖自动驾驶、机器人操作和交互游戏，通过动作条件化和辅助任务增强物理与时间一致性。
  - 研究共性：将自监督视频预测与动作或语言条件化结合，并在标准基准上同时评估视频质量指标和下游任务表现（策略学习、零样本泛化）。
  - 关键差异：机器人工件强调组合泛化和物理信息任务，驾驶工作侧重多视角与长时域预测，交互智能体工作侧重样本效率与记忆一致性；评测从视觉保真度延伸至策略成功率，物理整合方式从显式辅助任务到纯数据驱动生成各不相同。
  - 趋势演进：从早期基于模型的RL世界模型（2015–2022）转向大规模扩散Transformer（2023–2025），近期涌现针对记忆、空间和动作一致性的专用基准（2025–2026），表明领域正从看重原始视频质量转向对可靠性的更高要求。
  - 开放问题：仿真中的性能提升能否转化为真实世界安全与运营结果；如何将组合泛化扩展到全新任务而不需重新训练；以及最低限度的辅助任务集能否保证跨实体的物理合理性。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: adapting world models to robotics tasks by learning compositional
        video generation from language (e.g., RoboDreamer), coupling video and action
        diffusion for multitask pretraining (e.g., UWM), or injecting physics knowledge
        via depth and keypoint dynamics (e.g., RoboScape)
      what_remains_open: generalization beyond seen primitives or pretrained tasks;
        real-world deployment without catastrophic forgetting of physical constraints;
        and whether physics-informed auxiliary tasks transfer across different robot
        embodiments
    - line: Autonomous driving and simulation use cases
      what_it_solves: generating multi-view, long-horizon driving scenes with mask-reconstructed
        diffusion transformers (e.g., MaskGWM) to enable closed-loop simulation and
        policy evaluation across datasets
      what_remains_open: alignment between simulation-based metrics and real-world
        safety or operational outcomes; robustness to out-of-distribution traffic
        scenarios; and integration of explicit traffic rules beyond video prediction
    - line: Interactive agents and games
      what_it_solves: building efficient world models for sample-efficient RL (e.g.,
        STORM), and benchmarking spatial consistency and memory in interactive environments
        with loop-based navigation and action-controllable video generation (e.g.,
        LoopNav, MIND)
      what_remains_open: maintaining long-term memory consistency across diverse action
        spaces and scene changes; generalization to entirely new game rules or user
        interactions; and bridging the gap between video prediction benchmarks and
        actual agent performance
    consensus:
    - World models in applications are predominantly realized as video generation
      models, with diffusion architectures being the most common backbone.
    - Action conditioning is a shared requirement, whether through explicit action
      tokens, language instructions, or control over diffusion timesteps.
    - Auxiliary tasks (mask reconstruction, depth prediction, keypoint dynamics) are
      widely adopted to improve temporal and physical consistency.
    - Evaluation is shifting from solely visual quality (FVD, LPIPS) to more task-aware
      metrics such as policy success rate, zero-shot generalization, and memory/action
      consistency.
    disagreements:
    - 'Physics integration: some works explicitly model physics via depth and keypoint
      dynamics, while others rely on data-driven video generation without structural
      physical priors.'
    - 'Compositionality: one line factorizes video generation using language primitives
      for compositional generalization, whereas another couples video and action diffusion
      in a unified transformer without explicit decomposition.'
    - 'Evaluation target: works in robotics and games often evaluate downstream policy
      performance, whereas driving and benchmark works primarily report video prediction
      quality and consistency metrics.'
    - 'Interaction mode: some models treat actions as conditioning inputs for video
      prediction, while others simultaneously predict actions and frames, blurring
      the boundary between world model and policy.'
    open_questions:
    - How can we validate that world models which perform well on video benchmarks
      translate to safe and reliable real-world deployment, especially in safety-critical
      domains like driving and healthcare?
    - What is the minimal set of physical consistency constraints needed to ensure
      that a world model's predictions remain plausible across diverse embodiments
      and environments?
    - Can compositional world models be extended to handle entirely novel combinations
      of objects, actions, and goals that were never seen during training, without
      catastrophic forgetting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人任务，通过语言组合性学习视频生成（如RoboDreamer）、耦合视频与动作扩散用于多任务预训练（如UWM），或通过深度和关键点动力学注入物理知识（如RoboScape）
      尚未覆盖: 对未见原语或预训练任务之外的泛化；真实环境部署时不丢失物理约束；以及物理信息辅助任务能否跨不同机器人本体迁移
    - 路线: 自动驾驶与仿真应用
      解决的问题: 使用掩码重建的扩散Transformer生成多视角、长时域驾驶场景（如MaskGWM），支撑跨数据集的闭环仿真与策略评测
      尚未覆盖: 仿真指标与真实安全或运营结果的一致性；对分布外交通场景的鲁棒性；在视频预测之外整合显式交通规则
    - 路线: 交互式智能体与游戏
      解决的问题: 构建高效世界模型以实现样本高效的强化学习（如STORM），并通过循环导航和动作可控视频生成对交互环境中的空间一致性与记忆进行基准评测（如LoopNav、MIND）
      尚未覆盖: 跨多样化动作空间和场景变化维持长期记忆一致性；对全新游戏规则或用户交互的泛化；以及视频预测基准与实际智能体表现之间的差距
    共识:
    - 应用中的世界模型多以视频生成模型为核心，扩散架构是最常见的主干。
    - 动作条件化是共同需求，无论通过显式动作令牌、语言指令还是对扩散时间步的控制。
    - 辅助任务（掩码重建、深度预测、关键点动力学）被广泛采用以提升时间和物理一致性。
    - 评测正从单纯的视觉质量（FVD、LPIPS）转向更具任务意识的指标，如策略成功率、零样本泛化与记忆/动作一致性。
    分歧:
