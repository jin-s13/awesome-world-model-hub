    - 路线: 面向具身世界模型的可运行流水线与部署栈
      解决的问题: 将世界模型思路转化为端到端工作流，覆盖大规模预训练、动作/隐条件、辅助动力学学习及下游策略训练/评测。
      尚未覆盖: 可观测上下文等假设、任务/机器人/基准覆盖有限，以及跨团队和真实环境独立复现不足，使部署边界不明确。
    - 路线: 面向保真度评测的工件与可复现工程
      解决的问题: 提供开放数据集、指标和评测协议，度量空间一致性或动作忠实度，并部分对像素变化稳健。
      尚未覆盖: 跨基础设施独立复现、指标与下游策略效用的相关性，以及超出提出任务的覆盖范围尚未建立。
    共识:
    - 近期系统将未来观测生成视为可运行模型：在预训练或大规模视频/动力学模型上加入动作、上下文或轨迹条件，并评估生成结果的视觉或动作忠实度。
    - 评测被视作系统贡献的一部分，使用开放数据集、量化指标或下游策略训练，而不只是定性视频质量。
    - 多个工作汇聚到下游效用：将生成或模拟的未来观测用于策略训练/评测、奖励构建或闭环模拟。
    - 共享评测锚点包括nuScenes、CARL、LIBERO、Minecraft、FID和FVD。
    分歧:
    - 动作接口不同：显式驾驶指令或轨迹 vs 通用隐动作，后者避免跨具身共享原生动作空间。
    - 部署场景不同：单GPU亚秒级闭环驾驶模拟 vs 跨具身机器人视频生成和策略后训练，后者没有单一延迟约束。
    - 监督与评测目标不同：空间一致性、驾驶动作忠实度、视觉保真度与物理合理性、或下游策略成功率。
    - 动力学假设不同：有的假设上下文值可观测，有的通过视频、深度或关键点辅助任务隐式推断物理或隐动力学。
    开放问题:
    - 在nuScenes上达到先进性能的闭环驾驶模拟能否迁移到其他传感器布局、城市、天气和交互场景？
    - 哪种评测信号——空间一致性、动作忠实度、视觉质量或下游策略成功率——最能预测真实部署效用？
    - 上下文世界模型能否超越可观测上下文假设和两个CARL任务的评估，处理未见动力学？
    - 跨具身隐动作训练能否扩展到LIBERO/LIBERO-Plus和两个真实机器人平台之外，并在更大具身多样性下保持有效？
    - 自回归帧生成的长时域失效模式有哪些，blend-forcing和自适应参考时域能否在闭环使用中避免分布偏移？
    - 在代码/数据集/工件证据不均和局限性信息缺失的情况下，哪些系统能被跨团队和基础设施独立复现？
