  related_work_outline:
  - 'Mainstream direction: Diffusion-based world models dominate recent work, with
    increasing emphasis on unified architectures that couple video generation, action
    modeling, and physical knowledge for deployment in autonomous driving and robot
    manipulation.'
  - 'Shared research pattern: Most methods learn a latent dynamics model or a video
    generator from offline data, then use the learned world model for policy learning,
    planning, or video-based evaluation, often via self-supervised or generative objectives.'
  - 'Key differences: Approaches split along several axes: (i) generative paradigm—diffusion,
    VAEs, or state-space models; (ii) whether the model conditions on action, language,
    context, or physics signals; (iii) evaluation target—video fidelity, downstream
    task performance, or spatial-memory consistency; (iv) open-loop vs. closed-loop
    interaction design.'
  - 'Trend evolution: Early work (2023) combined VAEs with Transformers for sample-efficient
    Atari play; around 2024–2025, diffusion transformers and compositional video generation
    appeared, and by 2025–2026 the field shifts toward physics-informed, multi-modal,
    and large-scale pretrained unified world models, accompanied by dedicated benchmarks
    for memory, consistency, and action control.'
  - 'Open questions: How to achieve long-horizon spatial and memory consistency across
    diverse environments; how much of the policy gain is attributable to the world
    model rather than the planner or controller; whether the proposed representations
    and objectives transfer beyond the narrow task families and datasets on which
    they are demonstrated.'
  related_work_outline_zh:
  - 主流方向：基于扩散的世界模型在近期工作中占主导地位，越来越强调统一架构，将视频生成、动作建模和物理知识耦合，用于自动驾驶和机器人操作。
  - 研究共性：多数方法从离线数据中学习潜在动力学模型或视频生成器，再利用学到的世界模型进行策略学习、规划或基于视频的评估，常采用自监督或生成式目标。
  - 关键差异：方法沿若干轴分化：（i）生成范式——扩散、VAE或状态空间模型；（ii）模型是否以动作、语言、上下文或物理信号为条件；（iii）评估目标——视频保真度、下游任务性能或空间记忆一致性；（iv）开环与闭环交互设计。
  - 趋势演进：早期工作（2023年）将VAE与Transformer结合用于样本高效的Atari游戏；2024–2025年左右出现扩散Transformer和组合式视频生成；到2025–2026年，领域转向物理信息驱动、多模态和大规模预训练的统一世界模型，并伴随出现针对记忆、一致性和动作控制的专用基准。
  - 开放问题：如何在多样化环境中实现长时域空间和记忆一致性；策略收益中有多少可归因于世界模型本身而非规划器或控制器；提出的表示和目标能否迁移到所展示的狭窄任务族和数据集之外。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforms world-model ideas into concrete architectures, losses,
        and training recipes—e.g., diffusion with mask reconstruction, transformer-VAE
        hybrids, contextual state-space models, physics-informed video generation,
        and unified video-action diffusion.
      what_remains_open: Which algorithmic choices (e.g., diffusion vs. VAE, masking
        strategy, physics supervision) transfer across task families, and whether
        the designed objectives capture long-range consistency or remain overfitted
        to the training distribution of a specific dataset.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention and decision-making,
        by generating video plans from compositional language primitives, coupling
        video and action diffusion for policy learning, or training agents on imagined
        rollouts inside the world model.
      what_remains_open: How much of the performance gain originates from the model
        versus the planner, controller, or task-specific prior; and whether these
        interfaces support closed-loop control in unstructured environments beyond
        the curated datasets used for evaluation.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides benchmarks and evaluation frameworks for spatial consistency,
        memory, and action control that isolate model capabilities from dataset or
        implementation effects, moving beyond pixel-level metrics.
      what_remains_open: Existing benchmarks cover limited domains (Minecraft, synthetic
        scenes) and do not yet isolate the contribution of the world model from the
        policy or the action interface; systematic ablation protocols across multiple
        architecture families are missing.
    consensus:
    - World models are being formulated predominantly as generative video or latent-sequence
      models, with self-supervised or diffusion-based objectives that learn environment
      dynamics from offline data.
    - Action-conditioned generation is a key requirement for using world models in
      decision-making, and recent works attempt to integrate action information into
      the generative process.
    - There is a growing recognition that pixel-level video fidelity metrics are insufficient,
      and new benchmarks are needed to evaluate spatial consistency, long-term memory,
      and physical plausibility.
    - Large-scale pretraining on diverse robotic or driving datasets can improve generalization
      and robustness of policies derived from world models.
    disagreements:
    - 'Generative framework choice: some works favor diffusion transformers, others
      use VAE-based recurrent state-space models, creating a tension between sample
      quality and training/inference efficiency.'
    - 'Supervision signals: approaches differ on whether to include explicit physics
      losses (e.g., depth, keypoint dynamics) or rely purely on reconstruction and
      generation objectives, affecting generalization to unseen physical scenarios.'
    - 'Evaluation target: some papers optimize for downstream task performance (e.g.,
      Atari score, robot execution success), while others emphasize video prediction
      quality or spatial-memory consistency on standalone benchmarks, making it unclear
      how these metrics are aligned.'
    - 'Interaction mode: world models are used either as open-loop video generators
      for planning or as closed-loop learned simulators for policy training, with
      no consensus on which paradigm yields more transferable agent capabilities.'
    - 'Deployment setting: evaluations range from 2D games and simulated robotics
      to real-world driving, with architectural choices often tailored to domain-specific
      attributes (e.g., multi-view cameras, physical interactions), limiting cross-domain
      comparability.'
    open_questions:
    - Can world models maintain spatial and temporal consistency over long horizons
      without ground-truth environment resets, and how should this be measured outside
      of curated loop-based benchmarks?
    - What is the minimal set of supervision signals (actions, language, physics,
      context variables) needed to learn a world model that generalizes to novel dynamics
      and tasks?
    - How can the contribution of the world model itself be reliably separated from
      the benefits of the downstream planner, controller, or policy architecture in
      end-to-end evaluations?
    - Do the representations and objectives developed for video-based world models
      transfer to domains where the observation space is non-visual or only partially
      observable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体架构、损失和训练配方，例如扩散加掩码重建、Transformer-VAE混合、上下文状态空间模型、物理信息视频生成和统一视频-动作扩散。
      尚未覆盖: 哪些算法选择（如扩散与VAE、掩码策略、物理监督）能跨任务族迁移，以及所设计的目标是否捕获长程一致性，而非仅过拟合到特定数据集的训练分布。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习的动力学连接到干预和决策，通过组合语言原语生成视频计划、耦合视频与动作扩散用于策略学习，或在世界模型内训练想象轨迹上的智能体。
      尚未覆盖: 性能增益有多少来自模型本身，而非规划器、控制器或任务特定先验；这些接口是否能在非结构化环境中支持闭环控制，超越用于评估的精选数据集。
    - 路线: 方法证据与消融协议
      解决的问题: 提供针对空间一致性、记忆和动作控制的基准与评估框架，将模型能力与数据集或实现因素分离，超越像素级指标。
      尚未覆盖: 现有基准覆盖领域有限（Minecraft、合成场景），尚未将世界模型的贡献与策略或动作接口分离；缺少跨多种架构族的系统消融协议。
    共识:
    - 世界模型目前主要被表述为生成式视频或潜在序列模型，采用自监督或基于扩散的目标从离线数据中学习环境动力学。
    - 动作条件生成是世界模型用于决策的关键要求，近期工作试图将动作信息融入生成过程。
    - 人们越来越认识到像素级视频保真度指标不足，需要新的基准来评估空间一致性、长期记忆和物理合理性。
    - 在多样化机器人或驾驶数据集上进行大规模预训练可以提升从世界模型导出的策略的泛化性和鲁棒性。
    分歧:
    - 生成框架选择：部分工作采用扩散Transformer，其他使用基于VAE的循环状态空间模型，在样本质量与训练/推理效率之间存在张力。
    - 监督信号：方法在是否包含显式物理损失（如深度、关键点动力学）或仅依赖重建和生成目标上存在分歧，影响对未知物理场景的泛化。
    - 评估目标：部分论文优化下游任务性能（如Atari得分、机器人执行成功率），而其他则强调视频预测质量或独立基准上的空间记忆一致性，这些指标如何对齐尚不明确。
    - 交互模式：世界模型被用作开环视频生成器进行规划，或作为闭环学习模拟器进行策略训练，尚未就哪种范式产生更可迁移的智能体能力达成共识。
    - 部署场景：评估范围从2D游戏和仿真机器人到真实驾驶，架构选择常针对领域特定属性（如多视角相机、物理交互）定制，限制了跨领域可比性。
    开放问题:
    - 世界模型能否在没有真实环境重置的情况下长时间保持时空一致性，以及如何在非精选的基于循环的基准之外衡量这一点？
    - 学习能泛化到新动力学和任务的世界模型所需的最小监督信号集（动作、语言、物理、上下文变量）是什么？
    - 如何在端到端评估中可靠地将世界模型本身的贡献与下游规划器、控制器或策略架构的收益分离？
    - 为基于视频的世界模型开发的表示和目标是否能迁移到观测空间为非视觉或仅部分可观的领域？
