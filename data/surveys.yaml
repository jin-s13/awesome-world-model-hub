  related_work_outline_zh:
  - 主流方向：证据集中在面向闭环驾驶与机器人任务的动作可控世界模型模拟器，评测重心转向显式的动作/空间一致性和长时程行为，而非只看视觉质量。
  - 研究共性：多数工作以动作或上下文条件化未来视频生成，加入运动/结构/物理相关的结构化目标或轻量模块，并用视频质量加下游策略或一致性指标评估。
  - 关键差异：条件接口、训练策略和评测目标不同，包括显式上下文、潜在动作、轨迹/多视图控制；修改Dreamer、联合训练物理损失或适配预训练视频模型；面向空间导航、驾驶动作保真度或机器人策略效用。
  - 趋势演进：证据集中在2024-2026，显示向闭环、低延迟、跨具身模拟器演进；更早年份虽在跨度内，但在给定论文中未直接体现。
  - 开放问题：长时程一致性、物理可验证性、速度/保真度/可控性权衡及跨环境独立复现仍缺少足量证据。
  literature_review:
    line_of_work_matrix:
    - line: Runnable closed-loop simulator pipelines for driving and robotics, e.g.,
        FAR-Drive, Vista, Terra
      what_it_solves: Turning pretrained or learned video generators into deployable
        world simulators with action-conditioned multi-view or future-frame synthesis,
        some under low-latency constraints.
      what_remains_open: Generalization beyond nuScenes and specific sensor configurations,
        long-horizon degradation under autoregressive self-conditioning, and scaling
        beyond single-GPU validation.
    - line: Controllability and consistency benchmarks, e.g., LoopNav, Terra ACT-Bench
      what_it_solves: Providing datasets and scoring methods for action fidelity or
        spatial consistency, complementing visual-quality metrics such as FID/FVD.
      what_remains_open: Some benchmark papers report no experimental results, metric
        coverage is tied to narrow domains like Minecraft loops or nuScenes, and score-to-downstream-policy
        transfer is not established.
    - line: Context-, physics-, and cross-embodiment-aware embodied world models,
        e.g., cRSSM, RoboScape, RynnWorld-Latent
      what_it_solves: Improving zero-shot dynamics generalization, physical plausibility,
        or cross-embodiment video prediction through context conditioning, physics-inspired
        tasks, or shared latent action interfaces.
      what_remains_open: Assumptions such as observable context, evaluation limited
        to two CARL tasks or narrow robotic scenarios, missing limitation details,
        and unverified independent reproduction.
    consensus:
    - Action conditioning is necessary for using video generation as a simulator,
      but visual fidelity alone is insufficient for closed-loop use.
    - Structured losses or modules targeting motion, structure, depth, keypoints,
      or action alignment improve controllability and dynamic consistency.
    - Benchmarks with explicit spatial or action consistency scores are emerging as
      complements to video-quality metrics.
    - Closed-loop and long-horizon behavior is a shared concern across driving, robotics,
      and game-like interactive settings.
    - Public code or datasets appear in several works, but independent cross-team
      reproduction remains a verification gap.
    disagreements:
    - 'Conditioning interface and supervision differ: observable context values, universal
      latent actions, trajectory and multi-view controls, and physics-inspired depth/keypoint
      supervision.'
    - 'Evaluation targets differ: spatial consistency in loop navigation, action fidelity
      in autonomous driving, visual fidelity plus policy success, and cross-embodiment
      robot adaptation.'
    - 'Training routes differ: modifying a model-based RL world model such as Dreamer
      v3, jointly training physics-informed video generation, or adapting pretrained
      video transformers.'
    - 'Deployment settings differ: low-latency single-GPU closed-loop driving, robotic
      policy training and evaluation, and game/robotic simulation with prioritized
      imagination.'
    open_questions:
    - Can current benchmark scores predict downstream closed-loop policy success in
      unseen environments and sensor setups?
    - How should long-horizon spatial and temporal consistency be measured without
      requiring extremely long expert sequences?
    - What minimum supervision or context observability is needed for robust generalization
      beyond two CARL tasks or nuScenes?
    - Where is the latency-fidelity-controllability frontier for real-time deployment
      on constrained hardware, and how does it scale beyond single-GPU validation?
    - Which metrics are still missing for physical plausibility and action adherence,
      especially when some benchmark papers report no experimental results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的驾驶与机器人闭环模拟器流水线，如 FAR-Drive、Vista、Terra
      解决的问题: 将预训练或学习得到的视频生成器转化为动作条件化的多视图或未来帧可部署世界模拟器，部分方法满足低延迟约束。
      尚未覆盖: nuScenes和特定传感器配置之外的泛化、自回归自条件下的长时程退化，以及单GPU验证之外的扩展部署。
    - 路线: 可控性与一致性基准，如 LoopNav、Terra ACT-Bench
      解决的问题: 通过数据集和评分方法衡量动作保真度或空间一致性，补充 FID/FVD 等视觉质量指标。
      尚未覆盖: 部分基准论文未报告实验结果，指标覆盖局限于 Minecraft 循环或 nuScenes 等窄域，且分数与下游策略迁移的关系未建立。
    - 路线: 上下文、物理与跨具身感知的具身世界模型，如 cRSSM、RoboScape、RynnWorld-Latent
      解决的问题: 通过上下文条件、物理启发任务或共享潜在动作接口，改善零样本动力学泛化、物理合理性或跨具身视频预测。
      尚未覆盖: 上下文可观测等假设、仅在两个 CARL 任务或窄机器人场景上评估、局限性说明缺失，以及独立复现未验证。
    共识:
    - 动作条件化是视频生成用作模拟器的关键，但仅靠视觉保真度不足以支持闭环使用。
    - 针对运动、结构、深度、关键点或动作对齐的结构化损失或模块能提升可控性和动态一致性。
    - 显式空间一致性或动作保真度基准正在作为 FID/FVD 等视频质量指标的补充。
    - 闭环和长时程行为是驾驶、机器人和游戏式交互场景中的共同关切。
    - 若干工作公开了代码或数据集，但跨团队独立复现仍是验证缺口。
    分歧:
    - 条件接口与监督信号不同：可观测上下文值、通用潜在动作、轨迹与多视图控制、物理启发的深度/关键点监督。
    - 评测目标不同：循环导航中的空间一致性、自动驾驶中的动作保真度、视觉质量加策略成功、跨具身机器人适配。
    - 训练路线不同：修改 Dreamer v3 等基于模型强化学习的世界模型、联合训练物理信息视频生成，或适配预训练视频模型。
    - 部署设置不同：单GPU低延迟闭环驾驶、机器人策略训练与评估、游戏/机器人模拟中的优先想象。
    开放问题:
    - 当前基准分数能否预测未见环境和传感器配置下的下游闭环策略成功率？
    - 如何在不收集极长专家序列的情况下测量长时程空间和时间一致性？
    - 在 CARL 两个任务或 nuScenes 之外，需要多少监督或上下文可观测性才能稳健泛化？
    - 在受限硬件上实时部署的速度-保真度-可控性边界在哪里，如何从单GPU验证扩展到多GPU？
    - 物理合理性与动作遵循还缺少哪些指标，尤其是当部分基准论文未报告实验结果时？
