  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models for embodied control,
    built with diffusion or autoregressive transformers and increasingly aligned with
    physics or task rewards; the theory-relevant focus is on when generated trajectories
    support planning, spatial reasoning, and physical plausibility.'
  - 'Shared research pattern: Treat world-model evaluation as action-to-video dynamics;
    train or adapt large models on robot manipulation data; assess controllability,
    visual fidelity, planning correlation, and increasingly alignment or verifier-based
    reasoning rather than purely generative quality.'
  - 'Key differences: Architecture and adaptation strategy differ across unified diffusion,
    heterogeneous masked autoregression, mask-based adapters, and flow-based post-training;
    supervision differs among physics, human preference, and verifiable spatial assertions;
    evaluation domains include manipulation, games, and spatial benchmarks.'
  - 'Trend evolution: The top evidence is concentrated in 2024-2026, so the observed
    shift is within the current frontier: from scaling generative dynamics toward
    physics alignment, functional benchmarks, and mechanistic taxonomies; older years
    are not represented in the top sampled evidence.'
  - 'Open questions: What formal state and dynamics conditions separate world models
    from stateless video generators; whether alignment or verifiers transfer across
    domains; when generated rollouts improve policy without a ground-truth simulator;
    and whether scaling laws can predict failure.'
  related_work_outline_zh:
  - 主流方向：以动作条件化的视频世界模型为核心，用于具身控制；理论相关焦点是判断生成轨迹在何种条件下能支持规划、空间推理和物理合理性。
  - 研究共性：把世界模型评估视为动作到视频的动力学建模；在机器人与操作数据上训练或适配大规模模型，并从视觉质量、可控性、规划相关性和对齐/验证角度综合评价。
  - 关键差异：架构与适配方式包括统一扩散、异构掩码自回归、掩码适配器和流式后训练；监督目标包括物理、人类偏好和可验证空间断言；评测场景也从操作、游戏到零样本具身/空间基准分化。
  - 趋势演进：顶层证据集中在2024-2026年，观察到的变化处于当前前沿内：从生成动力学扩展转向物理对齐、功能基准和机制分类；早期年份未在顶层样本中体现。
  - 开放问题：形式化状态与动力学条件如何区分世界模型与无状态视频生成器；对齐和验证器能否跨域迁移；生成轨迹在无真实模拟器时如何改进策略；缩放规律能否预测失败。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative world models
      what_it_solves: Jointly model action-conditioned future video and policy, forward
        dynamics, or inverse dynamics in one architecture, supporting pretraining
        and simulation for robot control.
      what_remains_open: Formal assumptions under which generated video preserves
        persistent state, physical causality, and useful policy transfer across embodiments;
        several limitation fields and code/dataset details are missing verification
        evidence.
    - line: Adapting pretrained video generation to world models
      what_it_solves: Use learned masks or adapters on black-box pretrained video
        models to produce action-conditioned rollouts without access to model parameters.
      what_remains_open: Requires domain-specific action-labeled videos; depends on
        pretrained model availability and bias; generalization beyond video games
        and robot manipulation remains a verification gap.
    - line: Physics and reward alignment for world-model rollouts
      what_it_solves: Post-train generative world models to improve physical realism,
        task logic, embodiment plausibility, and visual quality using human preferences,
        discriminators, or DPO-style objectives.
      what_remains_open: Evaluated mostly on contact-rich manipulation; human preference
        collection is subjective and costly; cross-domain transfer and formal guarantees
        are not demonstrated.
    - line: Verifier-based and benchmark-based evaluation
      what_it_solves: Probe whether test-time verifiers and zero-shot or spatial benchmarks
        can measure world-model reasoning and action-selection quality, exposing calibration
        and information-bottleneck issues.
      what_remains_open: Verifiers show poor calibration, action biases, and inconsistent
        scaling across SAT-Real and MMSI-Bench; reliable reward signals and benchmark
        generality remain unresolved.
    - line: Mechanistic taxonomy and conceptual boundaries
      what_it_solves: Organize video generation as world models into state construction,
        implicit or explicit, and dynamics modeling, such as knowledge integration
        or architecture reformulation, while proposing functional evaluation criteria.
      what_remains_open: No direct empirical demonstration that the taxonomy changes
        model design or evaluation; current models are often stateless and metrics
        still emphasize visual fidelity over persistence and causality.
    consensus:
    - World-model evaluation increasingly treats action-conditioned future-video generation
      as a proxy for dynamics modeling.
    - Transformer-based, diffusion-based, or autoregressive backbones trained on robot
      manipulation data are common substrates.
    - Visual quality alone is insufficient; action controllability, physical plausibility,
      planning correlation, and task-relevant reasoning are important.
    - Alignment and verification mechanisms can improve or expose limitations in generated
      rollouts, but their reliability is not yet established.
    - There is a shared movement toward functional benchmarks and causal or persistent
      state as evaluation targets.
    disagreements:
    - 'How action conditioning should be injected: unified diffusion timesteps, frame-level
      modules, learned masks on pretrained models, parallel context blocks, or masked
      autoregression.'
    - 'What objective should dominate: physical plausibility, human-preference reward
      alignment, test-time spatial-assertion verification, or downstream planning
      correlation.'
    - Whether to adapt black-box pretrained video models or train dedicated action-video
      models from large heterogeneous datasets.
    - 'Which evaluation setting is authoritative: manipulation benchmarks, video-game
      and robotics adaptation, zero-shot embodied benchmarks, or spatial reasoning
      tests; conclusions do not transfer consistently.'
    - Some work emphasizes generation speed and controllability, while other work
      emphasizes conceptual boundaries; evidence for formal guarantees is largely
      absent.
    open_questions:
    - What minimal formal definition of state and dynamics distinguishes a persistent
      world model from a stateless video generator?
    - Under what conditions do action-conditioned video rollouts provide reliable
      policy learning or spatial reasoning without a ground-truth simulator?
    - Can test-time verifiers be calibrated to avoid action biases and reward noise
      across heterogeneous reasoning benchmarks?
    - How can physics alignment or human-preference rewards generalize beyond contact-rich
      manipulation without costly subjective labels?
    - Which evaluation metrics best track physical persistence and causal reasoning
      rather than visual fidelity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成式世界模型
      解决的问题: 在单一架构中联合建模以动作为条件的未来视频以及策略、前向动力学或逆动力学，用于机器人控制的预训练和模拟。
      尚未覆盖: 生成视频保持持久状态、物理因果性和跨本体策略迁移的形式化条件；部分工作的局限性与代码/数据集细节缺少验证证据。
    - 路线: 将预训练视频生成适配为世界模型
      解决的问题: 通过可学习掩码或适配器，在无法访问预训练视频模型参数的情况下生成动作条件化轨迹。
      尚未覆盖: 依赖领域特定的动作标注视频；受制于预训练模型的可用性和偏差；跨视频游戏和机器人操作之外的泛化仍属验证缺口。
    - 路线: 世界模型轨迹的物理与奖励对齐
      解决的问题: 利用人类偏好、判别器或DPO式目标后训练生成式世界模型，提升物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 主要在接触丰富操作上评测；人类偏好收集主观且昂贵；尚未展示跨领域转移或形式化保证。
    - 路线: 基于验证器与基准的评测
      解决的问题: 检验测试时验证器和零样本或空间基准能否衡量世界模型推理与动作选择质量，揭示校准与信息瓶颈问题。
      尚未覆盖: 验证器存在校准差、动作偏差和在SAT-Real与MMSI-Bench上不一致的缩放；可靠奖励信号和基准通用性未解决。
    - 路线: 机制分类与概念边界
      解决的问题: 将视频生成作为世界模型的方法组织为隐式或显式状态构建，以及知识整合或架构重构等动力学建模方式，并提出功能评价标准。
      尚未覆盖: 尚无直接经验证据表明该分类改变模型设计或评测；现有模型常无显式状态，指标仍偏视觉保真而非持久性与因果性。
    共识:
    - 世界模型评估越来越把动作条件化的未来视频生成作为动力学建模的替代信号。
    - 基于Transformer、扩散或自回归的骨干网络和机器人操作数据是常见基础。
    - 视觉质量不足以单独作为判断标准；动作可控性、物理合理性、规划相关性和任务相关推理同等重要。
    - 对齐与验证机制能改善或暴露生成轨迹的局限，但其可靠性尚未被确立。
    - 研究共同趋向功能性基准，并把因果与持久状态作为评测目标。
