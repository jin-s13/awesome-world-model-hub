  - 'Mainstream direction: the evidence cluster is dominated by action-conditioned
    video generation used as embodied world models for robotic control, with diffusion
    or autoregressive transformers as the common substrate.'
  - 'Shared research pattern: papers train or adapt large video generators on action-labeled
    robot data, inject actions through learned conditioning mechanisms, and test resulting
    rollouts for planning, policy evaluation, or control.'
  - 'Key differences: approaches differ in generative formulation, action injection,
    and optimization target; some optimize visual quality, while others enforce physical
    plausibility, human-preference alignment, verifier selection, or policy correlation.'
  - 'Trend evolution: from 2024 to 2026, the frontier moves from architecture and
    scaling toward post-training alignment, test-time verification, and zero-shot
    functional benchmarks probing causality and persistence.'
  - 'Open questions: whether imagined video rollouts are calibrated enough for reliable
    decision-making and spatial reasoning, whether physics alignment transfers beyond
