  - 主流方向：构建动作条件与物理信息驱动的世界模型系统，用于闭环仿真，尤其面向自动驾驶和机器人，并日益强调基准测试与实时服务。
  - 研究共性：系统将生成式视频或世界状态建模与显式动作、上下文或物理先验结合，通过任务数据集、保真度指标或下游策略效用进行评测。
  - 关键差异：表示方式涵盖潜在循环状态空间模型与扩散/自回归视频生成器；评测目标涵盖零样本策略泛化、空间一致性、动作忠实度、物理合理性与延迟。
  - 趋势演进：2024-2026 证据显示从开放环视觉质量转向闭环可控性、可复现基准、多视图一致性、物理信息训练与单 GPU 亚秒级部署。
  - 开放问题：跨域泛化、分布偏移下的长时一致性、物理合理性指标有效性以及独立复现仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Controllable driving world models and closed-loop simulation
      what_it_solves: Produce future multi-view driving video conditioned on trajectories
        or commands for simulation and policy evaluation; some add sub-second single-GPU
        serving.
      what_remains_open: Generalization beyond nuScenes, long-horizon cross-view consistency,
        and behavior under out-of-distribution or extreme driving conditions remain
        unverified.
    - line: Physics-informed embodied world models
      what_it_solves: Jointly learn RGB video generation with physics-related tasks
        such as temporal depth and keypoint dynamics for robotic video synthesis and
        policy loops.
      what_remains_open: Physical plausibility is not yet tied to standardized metrics,
        and cross-embodiment or cross-scene evidence is missing.
    - line: Contextual latent world models for model-based reinforcement learning
      what_it_solves: Condition latent dynamics on observable context to improve zero-shot
        policy generalization in contextual reinforcement learning.
      what_remains_open: Assumes context observability and evaluates only a small
        set of CARL tasks, so broader unknown-dynamics generalization is unverified.
    - line: Benchmarks and diagnostic metrics for world-model consistency
      what_it_solves: Quantify spatial loop consistency, action fidelity, or closed-loop
        simulation quality instead of relying only on pixel-level visual metrics.
      what_remains_open: Metric transferability across environments and coverage of
        interactive long-horizon behavior remain limited.
    - line: Runnable artifacts and reproducible system frameworks
      what_it_solves: Provide open datasets, benchmarks, code, or baseline systems
        that make models inspectable and reusable.
      what_remains_open: Independent cross-team and cross-infrastructure reproduction,
        plus deployment robustness beyond reported settings, are not demonstrated.
    consensus:
    - World-model systems increasingly need explicit control or structural priors
      beyond raw video generation to be useful for closed-loop tasks.
    - Evaluation is moving beyond visual quality toward action fidelity, spatial consistency,
      physical plausibility, and downstream policy utility.
    - Reproducible datasets, benchmarks, and system-oriented baselines are treated
      as first-class contributions in this direction.
    - Recent systems tend to adopt either recurrent state-space or diffusion/autoregressive
      video backbones with modular conditioning components.
    disagreements:
    - 'Representation choices differ: latent recurrent state-space models support
      policy optimization, while diffusion/autoregressive generators prioritize high-fidelity
      frame synthesis.'
    - 'Supervision signals differ: observable context values, physics-related depth
      or keypoint tasks, action and trajectory labels, or scene-graph loop consistency.'
    - 'Evaluation targets differ: zero-shot policy return, FID/FVD-style fidelity,
      action fidelity, loop closure, or sub-second serving latency.'
    - Deployment settings differ across game-like navigation, robotic manipulation,
      and autonomous driving, leading to different system constraints.
    open_questions:
    - How can physical plausibility be measured beyond visual and action-consistency
      metrics?
    - Do current systems transfer across unseen cities, embodiments, and simulation
      environments without retraining?
    - Can long-horizon closed-loop rollouts maintain temporal and cross-view consistency
      under distribution shift?
    - Which assumptions, such as observable context, are most limiting for real-world
      deployment?
    - What independent reproduction evidence exists for datasets, baselines, and latency
      claims across teams?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可控驾驶世界模型与闭环仿真
      解决的问题: 根据轨迹或指令生成未来多视驾驶视频，用于仿真和策略评估；部分系统加入单 GPU 亚秒级服务。
      尚未覆盖: 在 nuScenes 之外的泛化、长时跨视图一致性以及分布外或极端驾驶条件仍未验证。
    - 路线: 物理信息具身世界模型
      解决的问题: 联合学习 RGB 视频生成与时间深度、关键点动力学等物理相关任务，用于机器人视频合成与策略闭环。
      尚未覆盖: 物理合理性尚缺标准化指标，跨本体和跨场景证据不足。
    - 路线: 上下文潜在世界模型用于基于模型的强化学习
      解决的问题: 使潜在动力学以可观测上下文为条件，提升上下文强化学习中的零样本策略泛化。
      尚未覆盖: 假设上下文可观测，且仅在少量 CARL 任务上评估，更广泛的未知动力学泛化未验证。
    - 路线: 世界模型一致性的基准与诊断指标
      解决的问题: 量化空间循环一致性、动作忠实度或闭环仿真质量，而非仅依赖像素级视觉指标。
      尚未覆盖: 指标跨环境可迁移性与交互长时行为覆盖仍有限。
    - 路线: 可运行工件与可复现系统框架
      解决的问题: 提供开放数据集、基准、代码或基线系统，使模型可检查和可复用。
      尚未覆盖: 跨团队、跨基础设施独立复现以及超出报告设置的部署鲁棒性未见展示。
    共识:
    - 世界模型系统日益需要显式控制或结构先验，才能在闭环任务中有用，而不仅是原始视频生成。
    - 评测正从视觉质量转向动作忠实度、空间一致性、物理合理性和下游策略效用。
    - 可复现数据集、基准和面向系统的基线逐渐被视为一等贡献。
    - 近期系统多采用循环状态空间或扩散/自回归视频骨干，并加入模块化条件组件。
    分歧:
    - 表示选择不同：潜在循环状态空间模型适合策略优化，而扩散/自回归生成器更强调高保真帧合成。
    - 监督信号不同：可观测上下文值、物理相关深度或关键点任务、动作与轨迹标签或场景图循环一致性。
    - 评测目标不同：零样本策略回报、FID/FVD 型保真度、动作忠实度、闭环闭合或亚秒级服务延迟。
    - 部署设置不同：类游戏导航、机器人操作和自动驾驶导致不同系统约束。
    开放问题:
    - 如何在视觉与动作一致性指标之外测量物理合理性？
    - 当前系统能否在未见的城市、本体和仿真环境之间无需重训练迁移？
    - 长时闭环推演能否在分布偏移下保持时间与跨视图一致性？
    - 可观测上下文等假设在真实部署中最受哪些限制？
    - 数据集、基线和延迟声明存在哪些跨团队独立复现证据？
