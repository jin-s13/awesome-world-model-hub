  related_work_outline:
  - 'Mainstream direction: Domain applications of world models center on generative
    video and sequence models for driving, robotics, and interactive agents, with
    a strong emphasis on prediction fidelity and downstream policy utility.'
  - 'Shared research pattern: Combine generative sequence models with domain-specific
    inductive biases such as mask reconstruction, language-compositional primitives,
    physics auxiliary tasks, or action conditioning, then evaluate generation quality
    and task transfer.'
  - 'Key differences: Representation choices span diffusion transformers, VAE-transformer
    stochastic models, and recurrent state-space models; evaluation ranges from open-loop
    scene prediction to closed-loop action, memory, and spatial consistency.'
  - 'Trend evolution: Work shifts from efficient interactive RL world models around
    2023 toward generalizable driving and robot video models in 2024-2025, then toward
    open-domain memory and action consistency evaluation in 2025-2026.'
  - 'Open questions: Real-world transfer, long-term memory consistency, action-space
    generalization, and alignment between simulation or dataset metrics and physical
    or safety outcomes remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型的领域应用以生成式视频和序列模型为核心，重点布局驾驶、机器人和交互式智能体，强调预测保真度与下游策略效用。
  - 研究共性：将生成式序列模型与领域特定归纳偏置结合，例如掩码重建、语言组合原语、物理辅助任务或动作条件，并评估生成质量与任务迁移。
  - 关键差异：表示方式覆盖扩散Transformer、VAE-Transformer随机模型和循环状态空间模型；评估范围从开环场景预测到闭环动作、记忆和空间一致性。
  - 趋势演进：工作从约2023年的高效交互式强化学习世界模型，转向2024-2025年可泛化的驾驶与机器人视频模型，再进入2025-2026年的开放域记忆与动作一致性评估。
  - 开放问题：真实世界迁移、长期记忆一致性、动作空间泛化，以及仿真或数据集指标与物理或安全结果之间的对齐仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and multi-view video generation
      what_it_solves: Generates future driving scenes and supports long-horizon, multi-view
        prediction for simulation and policy evaluation.
      what_remains_open: Evidence shows dataset-level gains in normal, long-horizon,
        and zero-shot settings, but real-world safety or operational transfer is not
        established.
    - line: Embodied robot world models and policy/dynamics learning
      what_it_solves: Uses language, context, action, and physics-conditioned video
        generation to imagine robot behavior, learn dynamics, and pretrain or improve
        policies.
      what_remains_open: Generalization is limited by assumptions such as observable
        context, seen primitive combinations, simulated evaluation, and lack of demonstrated
        real-robot transfer.
    - line: Interactive agents, games, and consistency-focused evaluation
      what_it_solves: Provides stochastic sequence world models for sample-efficient
        agent training and constructs interactive datasets or metrics for spatial
        consistency, memory, and action control.
      what_remains_open: Current evidence reveals weak long-term memory consistency
        and limited action-space generalization, but does not show how to close these
        gaps.
    consensus:
    - Application work converges on using world models as generative or sequence predictors
      over visual observations, conditioned on actions, language, context, or physics
      signals.
    - There is a shared shift from frame fidelity alone toward downstream usefulness
      such as policy training, zero-shot generalization, long-horizon rollout, and
      closed-loop consistency.
    - Domain-specific inductive biases are added to improve plausibility or generalization,
      including mask reconstruction, compositional primitives, physics objectives,
      and coupled action-video diffusion.
    - Reported evaluations are mostly in simulation or curated datasets; code and
      artifact signals vary, and real-world deployment evidence is sparse.
    disagreements:
    - Representation choices differ between diffusion-based video transformers, VAE-transformer
      stochastic world models, and recurrent state-space latent models.
    - 'Conditioning and supervision differ: observable context in recurrent dynamics,
      language-parsed primitives, physics auxiliary tasks, or independent action and
      video diffusion timesteps.'
    - 'Evaluation focus differs: some work targets scene prediction or generation
      quality, while others target policy learning, zero-shot transfer, or closed-loop
      action and memory consistency.'
    - 'Generalization assumptions differ: some methods rely on seen primitives or
      observable context, while others emphasize cross-dataset or zero-shot generalization
      without physical validation.'
    open_questions:
    - Whether application-specific gains transfer across embodiments, datasets, institutions,
      or physical environments remains an evidence gap.
    - How to maintain long-term memory consistency and generalize across action spaces
      in open-domain interactive settings is unresolved.
    - Whether visual fidelity or consistency metrics align with real-world safety,
      robustness, and operational outcomes is not shown.
    - Which assumptions such as observable context, parseable language primitives,
      or physics supervision can be relaxed for less controlled applications remains
      open.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶场景预测与多视角视频生成
      解决的问题: 生成未来驾驶场景，支持长时域、多视角预测，用于仿真与策略评测。
      尚未覆盖: 常规、长时域和零样本数据集上显示提升，但真实安全或运营迁移尚未建立。
    - 路线: 具身机器人世界模型与策略/动力学学习
      解决的问题: 利用语言、上下文、动作和物理条件化的视频生成来想象机器人行为、学习动力学并预训练或改进策略。
      尚未覆盖: 泛化受可观测上下文、已见原语组合、仿真评估和缺乏真实机器人迁移等假设限制。
    - 路线: 交互式智能体、游戏与一致性评估
      解决的问题: 提供随机序列世界模型用于样本高效的智能体训练，并构建交互式数据集或指标以评估空间一致性、记忆和动作控制。
      尚未覆盖: 当前证据揭示长期记忆一致性较弱和动作空间泛化有限，但未显示如何弥合这些差距。
    共识:
    - 应用工作汇聚为将世界模型作为视觉观测上的生成或序列预测器，并以动作、语言、上下文或物理信号为条件。
    - 研究从单纯关注帧保真度转向下游效用，包括策略训练、零样本泛化、长时域展开和闭环一致性。
    - 领域特定归纳偏置被引入以提升合理性或泛化，包括掩码重建、组合原语、物理目标和动作-视频扩散耦合。
    - 所报告评估主要集中在仿真或筛选数据集；代码与工件信号不一，真实部署证据稀缺。
    分歧:
    - 表示选择不同：基于扩散的视频Transformer、VAE-Transformer随机世界模型和循环状态空间潜在模型。
    - 条件与监督不同：循环动力学中的可观测上下文、语言解析原语、物理辅助任务，或独立动作与视频扩散时间步。
    - 评测重点不同：有的针对场景预测或生成质量，有的针对策略学习、零样本迁移或闭环动作与记忆一致性。
    - 泛化假设不同：一些方法依赖已见原语或可观测上下文，另一些强调跨数据集或零样本泛化，但未做物理验证。
    开放问题:
    - 应用特定收益能否跨本体、数据集、机构或物理环境迁移，仍是证据缺口。
    - 如何在开放域交互环境中保持长期记忆一致性并跨动作空间泛化尚未解决。
    - 视觉保真度或一致性指标是否与真实安全、鲁棒性和运营结果一致尚未证明。
    - 可观测上下文、可解析语言原语、物理监督等假设在更不受控应用中可放宽到什么程度仍待研究。
