  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by evaluation and development
    of generative world models that predict future video or imagined trajectories
    from observations and actions, concentrated in driving, robotics, game, and navigation
    settings.'
  - 'Shared research pattern: Papers pair a model or dataset contribution with benchmark
    comparisons, stressing visual fidelity, physical plausibility, spatial or memory
    consistency, action controllability, sample efficiency, or generalization.'
  - 'Key differences: Some contributions are benchmark datasets or metrics while others
    are model architectures; they differ in representation, supervision, and evaluation
    target, with pixel-level realism and downstream control as competing emphases.'
  - 'Trend evolution: Top-ranked evidence clusters in 2023-2026, moving from efficient
    latent Atari world models toward diffusion-based video generation, then toward
    closed-loop consistency benchmarks and large-scale robot/driving pretraining.'
  - 'Open questions: Metric-to-decision alignment, long-horizon and cross-action-space
    consistency, stability across implementations, and whether visual detail improvements
    transfer beyond narrow suites remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据主要围绕世界模型的评测与生成式动态建模，从观测和动作预测未来视频或想象轨迹，集中在驾驶、机器人、游戏和导航等场景。
  - 研究共性：论文通常将模型或数据集贡献与基准对比结合，强调视觉保真、物理合理性、空间或记忆一致性、动作可控性、样本效率或泛化。
  - 关键差异：部分工作是基准数据集或指标，部分为模型架构；表示、监督和评测目标不同，有的强调像素级真实感，有的强调下游控制与泛化。
  - 趋势演进：高排名证据集中在2023至2026年，从高效潜在Atari世界模型向扩散视频生成，再向闭环一致性基准和大规模机器人/驾驶预训练演进。
  - 开放问题：指标与决策收益是否一致、长时域与跨动作空间一致性、实现与算力稳定性、视觉细节改进能否跨域迁移。
  literature_review:
    line_of_work_matrix:
    - line: World-model benchmark task and dataset design
      what_it_solves: Creates shared datasets and tasks for scoring world models on
        spatial consistency, memory consistency, and action control, e.g., LoopNav
        and MIND.
      what_remains_open: Coverage is mostly Minecraft and curated first/third-person
        videos; whether these task distributions reflect open-domain deployment and
        downstream policy utility remains unclear.
    - line: World-model metric and stress-test design
      what_it_solves: Introduces or applies metrics such as Scene Graph Consistency
        Score, memory/action control evaluation, Atari 100k human-normalized score,
        and zero-shot contextual generalization to probe behavior beyond aggregate
        generation quality.
      what_remains_open: Proxy metrics lack demonstrated alignment with real downstream
        decisions; method papers often report only aggregate scores and leave limitations
        unstated.
    - line: Comparable baselines and reporting
      what_it_solves: Uses common suites including Atari 100k, CARL, Nuscenes/OpenDV-2K/Waymo,
        and robot datasets to compare visual fidelity, training efficiency, and generalization
        against prior baselines.
      what_remains_open: Reproducibility and conclusion stability across implementations
        and compute budgets are not fully evidenced; several top papers have no OpenAlex
        identifier or limitation statements.
    consensus:
    - The field agrees on the need to evaluate beyond single-frame generation quality,
      with recurring attention to physical plausibility, spatial/memory consistency,
      action controllability, and downstream policy utility.
    - Benchmarks and datasets are used to expose failure modes that aggregate generation
      scores miss, especially long-horizon consistency and generalization across action
      spaces or viewpoints.
    - Common evaluation settings include Atari 100k, CARL, driving datasets, and robot
      manipulation/navigation data, creating shared reference points across papers.
    - Artifact sharing is becoming expected, but verification gaps remain because
      visibility into code, dataset, and limitation details varies.
    disagreements:
    - 'Evaluation target differs: some papers optimize visual detail and frame realism,
      while others optimize latent dynamics, training efficiency, or zero-shot policy
      generalization.'
    - 'Representation differs: diffusion-based generation, transformer-VAE latent
      models, and context-conditioned recurrent state-space models trade off fidelity,
      controllability, and data efficiency differently.'
    - 'Supervision differs: self-supervised video prediction, physics-informed auxiliary
      tasks, action-conditioned video generation, and context-conditioned reinforcement
      learning lead to different stress conditions.'
    - 'Deployment setting differs: curated game/navigation tasks, driving recordings,
      robotic datasets, and contextual control suites emphasize different horizons,
      views, and action spaces.'
    open_questions:
    - How do spatial consistency, memory consistency, and action-control scores translate
      into long-horizon downstream task performance outside curated settings?
    - How stable are reported benchmark improvements across different implementations
      and compute budgets when several top-ranked papers lack citation metadata or
      limitation statements?
    - Does improving visual detail in generated frames improve decision-making across
      domains beyond Atari and driving-style evaluations?
    - How should context-conditioned world models be tested when context observability
      is assumed and only a small set of tasks is evaluated?
    - Can open-domain benchmarks cover varied action spaces and viewpoints without
      overfitting to pixel-level similarity or narrow scene distributions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 构建共享数据集和任务，用于评测世界模型的空间一致性、记忆一致性和动作可控性，例如 LoopNav 与 MIND。
      尚未覆盖: 覆盖范围主要集中在 Minecraft 和精选的第一/第三人称视频；这些任务分布是否反映开放域部署和下游策略效用仍不清楚。
    - 路线: 世界模型指标与压力测试设计
      解决的问题: 引入或应用 Scene Graph Consistency Score、记忆与动作控制评测、Atari 100k 人类归一化分数、上下文零样本泛化等指标，以检测总分之外的薄弱点。
      尚未覆盖: 代理指标与真实下游决策的一致性尚缺证据；方法论文常只报告总分，且局限性未说明。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、CARL、Nuscenes/OpenDV-2K/Waymo 和机器人数据集等共同评测集，比较视觉保真、训练效率和泛化表现。
      尚未覆盖: 跨实现和算力预算的结论稳定性尚未充分验证；若干高排名论文没有 OpenAlex 标识或局限性声明。
    共识:
    - 研究普遍认为不能只报告单帧生成质量，需同时关注物理合理性、空间或记忆一致性、动作可控性和下游策略效用。
    - 基准与数据集被用于暴露总分无法捕获的失败模式，尤其是长时域一致性以及跨动作空间或视角的泛化。
    - Atari 100k、CARL、驾驶数据集和机器人操作/导航数据成为共同评测参考，形成跨论文可比较的设定。
    - 代码与数据集共享逐渐被期待，但可见性差异仍构成验证缺口。
    分歧:
    - 评测目标不同：有的强调像素级视觉细节和视频真实感，有的强调潜在动态、训练效率或零样本策略泛化。
    - 表示方式不同：扩散生成、Transformer-VAE 潜在模型和上下文条件循环状态空间模型在保真、可控与数据效率之间取舍不同。
    - 监督信号不同：自监督视频预测、物理信息辅助任务、动作条件视频生成和上下文条件强化学习导致不同的压力测试条件。
    - 部署场景不同：游戏/导航、驾驶记录、机器人数据和上下文控制套件对时域、视角与动作空间的要求不同。
    开放问题:
    - 空间一致性、记忆一致性和动作控制分数如何转化为长时域下游任务表现，尤其在非策展场景中？
    - 若部分高排名论文缺少 OpenAlex 元数据或局限性声明，基准改进在实现和算力预算变化时是否仍然稳定？
    - 提升生成帧的视觉细节能否在 Atari 和驾驶之外一致改善决策能力？
    - 在假设上下文可观测且仅评估少量任务时，上下文条件模型应如何进行泛化评测？
    - 开放域基准如何覆盖多样动作空间和视角，同时避免对像素级相似性或狭窄场景分布过拟合？
