  related_work_outline:
  - 'Mainstream direction: World-model evaluation is moving from aggregate task scores
    toward fine-grained capability testing, with new benchmarks targeting memory consistency,
    action control, and spatial reasoning.'
  - 'Shared research pattern: Researchers create domain-specific datasets with controlled
    actions, then define metrics that isolate specific world-model failures such as
    loop closure or view inconsistency.'
  - 'Key differences: Benchmarks diverge in domain (simulated Minecraft vs. open-domain
    videos vs. driving), action modality (discrete, continuous, ego-motion), and evaluation
    criterion (scene-graph consistency vs. pixel-level reconstruction).'
  - 'Trend evolution: Between 2023 and 2026, the field shifted from repurposing existing
    game/driving suites (Atari, Nuscenes) to purpose-built stress tests like LoopNav
    and MIND, reflecting a maturation of world-model evaluation.'
  - 'Open questions: How to unify disparate benchmarks to enable cross-domain comparison?
    Can memory and action-control metrics predict real-world deployment success? Evidence
    is limited to curated domains without large-scale real-world validation.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从聚合任务得分转向细粒度能力测试，新兴基准针对记忆一致性、动作控制和空间推理。
  - 研究共性：研究者创建具有受控动作的领域特定数据集，然后定义指标来隔离世界模型的特定失败，如闭环一致性或视角不一致。
  - 关键差异：基准在领域（模拟 Minecraft 与开放域视频与自动驾驶）、动作模态（离散、连续、自运动）和评估标准（场景图一致性与像素级重建）上存在分歧。
  - 趋势演进：2023 至 2026 年间，领域从复用现有游戏/自动驾驶套件（Atari、Nuscenes）转向构建专用压力测试如 LoopNav 和 MIND，反映出世界模型评估的成熟。
  - 开放问题：如何统一不同的基准以实现跨领域比较？记忆和动作控制指标能否预测真实部署成功？现有证据仅限于策划域，缺乏大规模现实验证。
  literature_review:
    line_of_work_matrix:
    - line: Spatial and memory consistency benchmarks
      what_it_solves: Evaluating whether world models maintain coherent internal state
        over long sequences and across viewpoints, exposing forgetting and hallucination.
      what_remains_open: Benchmarks are limited to simulated or curated video domains;
        the link between spatial consistency and real-world task success is not established.
    - line: Decision-making benchmarks for world models
      what_it_solves: Standardized comparison of world-model agents using aggregate
        metrics like human-normalized score and video prediction accuracy on suites
        such as Atari 100k and Nuscenes.
      what_remains_open: Aggregate scores mask failure modes like poor long-term dynamics
        or inability to generalize to unseen environments; standardization across
        domains is lacking.
    - line: Capability-specific metrics and stress tests
      what_it_solves: Diagnosing specific weaknesses such as visual detail, physical
        plausibility, or action control, complementing holistic scores.
      what_remains_open: These metrics are not standardized; their causal relationship
        to policy improvement is often correlational rather than experimentally validated.
    consensus:
    - World models need evaluation that goes beyond aggregate task performance to
      capture failure modes like forgetting, visual inconsistency, and weak action
      control.
    - New benchmarks purposely stress-test memory and spatial reasoning, moving beyond
      simple frame prediction error.
    - Standardized protocols are needed to separate model capabilities from the policies
      built on top of them.
    disagreements:
    - Benchmark domains vary from simulated Minecraft to open-domain real-world videos
      and driving, leading to different assumptions about action spaces and observability.
    - 'Evaluation metrics differ: scene-graph consistency versus pixel-level reconstruction
      versus downstream policy performance, making cross-benchmark comparison difficult.'
    - 'Interaction mode for evaluation differs: some use closed-loop agent interaction
      while others rely on open-loop video prediction.'
    open_questions:
    - How can we design benchmarks that evaluate world models across diverse real-world
      robotics and driving scenarios without overfitting to a single domain?
    - What is the causal link between improved spatial consistency and downstream
      task success in embodied AI?
    - Are current memory and action control benchmarks sufficient to uncover all failure
      modes, especially in long-horizon tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 空间与记忆一致性基准
      解决的问题: 评估世界模型能否在长序列和跨视角下保持连贯的内部状态，暴露遗忘和幻觉。
      尚未覆盖: 基准限于模拟或策划的视频域；空间一致性到真实任务成功的关联尚未建立。
    - 路线: 面向决策的世界模型基准
      解决的问题: 使用 Atari 100k、Nuscenes 等套件，通过人类归一化得分和视频预测准确率等聚合指标，标准化比较世界模型智能体。
      尚未覆盖: 聚合得分掩盖了长期动态不佳或无法泛化到未见环境等失败模式；跨领域的标准化缺失。
    - 路线: 能力特定指标与压力测试
      解决的问题: 诊断视觉细节、物理合理性或动作控制等具体弱点，补全整体分数。
      尚未覆盖: 这些指标尚未标准化；它们与策略改进的因果关系多为相关性，缺乏实验验证。
    共识:
    - 世界模型需要超越聚合任务性能的评估，以捕获遗忘、视觉不一致和弱动作控制等失败模式。
    - 新基准专门对记忆和空间推理进行压力测试，不再仅依赖帧预测误差。
    - 需要标准化协议，将模型能力与构建在其上的策略分开评估。
    分歧:
    - 基准领域从模拟 Minecraft 到开放域真实视频和自动驾驶，导致对动作空间和可观测性的不同假设。
    - 评估指标差异：场景图一致性与像素级重建与下游策略性能，使得跨基准比较困难。
    - 评估的交互模式不同：有的使用闭环智能体交互，有的依赖开环视频预测。
    开放问题:
    - 如何设计能跨多样化真实机器人和自动驾驶场景评估世界模型，而不局限于单一领域的基准？
    - 改进的空间一致性与具身智能下游任务成功之间的因果联系是什么？
    - 当前的记忆和动作控制基准是否足以发现所有失败模式，尤其是在长时域任务中？
