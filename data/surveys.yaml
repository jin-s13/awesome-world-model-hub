  related_work_outline:
  - 'Mainstream direction: Action-conditioned video diffusion models acting as embodied
    world models, with emphasis on scalable pretraining, post-training alignment,
    and test-time compute to improve physical plausibility and task controllability.'
  - 'Shared research pattern: Treating video generation as the core representational
    medium for world models; injecting action signals via transformer blocks or learned
    masks; evaluating on simulated or real robot manipulation tasks; and increasingly
    adopting human preferences or physics-based rewards for quality improvement.'
  - 'Key differences: How state is constructed (implicit context vs. explicit latent
    compression), how actions are injected (frame-level conditioning vs. adapter masks),
    and what evaluation targets are prioritized (visual fidelity vs. functional benchmarks
    like spatial reasoning and physical persistence).'
  - 'Trend evolution: The frontier moved from early action-conditioned video generation
    (2024) to large-scale unified pretraining and heterogeneous architectures (2025),
    and recently to post-training alignment with multi-dimensional rewards, test-time
    scaling, and conceptual taxonomies that question the definition of a world model
    (2026).'
  - 'Open questions: Can current video-based world models sustain long-horizon physical
    consistency and causal reasoning? Do test-time scaling laws transfer across tasks?
    How should we design functional benchmarks that decouple visual quality from physical
    understanding?'
  related_work_outline_zh:
  - 主流方向：以动作条件化的视频扩散模型作为具身世界模型，侧重可扩展预训练、后训练对齐和测试时计算，以提升物理合理性和任务可控性。
  - 研究共性：把视频生成作为世界模型的核心表示媒介；通过Transformer模块或学习到的掩码注入动作信号；在模拟或真实机器人操作任务上评估；越来越多地采用人类偏好或基于物理的奖励来改善生成质量。
  - 关键差异：状态构建方式（隐式上下文 vs. 显式潜在压缩），动作注入方式（帧级条件化 vs. 适配器掩码），以及优先考虑的评测目标（视觉保真度 vs. 功能基准如空间推理和物理持久性）。
  - 趋势演进：从早期动作条件化视频生成（2024）发展到大规模统一预训练与异构架构（2025），近期转向多维奖励后训练对齐、测试时缩放以及质疑世界模型定义的概念分类法（2026）。
  - 开放问题：当前基于视频的世界模型能否维持长期物理一致性和因果推理？测试时缩放规律是否跨任务迁移？如何设计将视觉质量与物理理解解耦的功能基准？
  literature_review:
    line_of_work_matrix:
    - line: Formal representations and assumptions for world models
      what_it_solves: Defines what constitutes a world model in terms of state construction
        and dynamics, and specifies the assumptions under which action-conditioned
        video generation can serve as a world model.
      what_remains_open: Whether these formalizations (e.g., implicit vs. explicit
        state, frame-level action alignment) hold in open-world settings and how to
        automatically learn state representations from raw video without action labels.
    - line: Scaling laws and post-training guarantees
      what_it_solves: Connects model size, heterogeneous data, test-time compute,
        and reward alignment to expected improvements in physical fidelity, controllability,
        and task-oriented behavior of world models.
      what_remains_open: Direct validation that scaling laws and alignment procedures
        (DPO, multi-dimensional reward modeling) generalize beyond the evaluated manipulation
        tasks; whether test-time verifier improvements are consistent across benchmarks.
    - line: Conceptual taxonomies and evaluation boundaries
      what_it_solves: Organizes fragmented world-model claims into categories of state
        construction and dynamics modeling, and advocates shifting evaluation from
        visual metrics to functional benchmarks that test causality and persistence.
      what_remains_open: Whether the proposed taxonomies actually change how researchers
        design models or run evaluations; standardized functional benchmarks are still
        missing.
    consensus:
    - A world model must capture both state and dynamics, and video generation is
      a promising medium for embodying this capability.
    - Action-conditioning is essential for turning video generators into usable world
      models for decision-making and planning.
    - Physical plausibility and task logic are critical quality dimensions beyond
      visual fidelity.
    - Pretraining on large-scale, diverse robot datasets and post-training alignment
      with rewards or preferences improve world model performance.
    disagreements:
    - 'State construction: some approaches maintain an implicit state via context
      management, while others advocate for explicit latent state compression.'
    - 'Evaluation targets: one line emphasizes visual quality and action-conditioning
      metrics, while another argues for functional benchmarks that isolate spatial
      reasoning, causality, and physical persistence.'
    - 'Interaction mode: models are used for open-loop video prediction, model-based
      planning, or test-time search, creating different requirements for temporal
      consistency and controllability.'
    - 'Supervision signals: methods differ in relying on action-labeled videos, human
      preference data, physics-inspired heuristics, or environment rewards, leading
      to distinct training and alignment pipelines.'
    open_questions:
    - How can we verify that a video-based world model forms a causally correct internal
      representation that generalizes to unseen actions and objects?
    - Under what conditions do test-time scaling laws fail, and how can we design
      verifiers that remain calibrated across diverse spatial reasoning tasks?
    - What is the minimal set of functional benchmarks needed to decouple physical
      understanding from visual generation quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的形式化表示与假设
      解决的问题: 从状态构建和动态建模的角度定义世界模型的构成，明确动作条件化视频生成作为世界模型的前提假设。
      尚未覆盖: 这些形式化（如隐式/显式状态、帧级动作对齐）在开放世界中的鲁棒性，以及如何从无动作标签的原始视频中自动学习状态表示。
    - 路线: 缩放规律与后训练保证
      解决的问题: 将模型规模、异构数据、测试时计算和奖励对齐与物理保真度、可控性和任务导向行为的预期提升联系起来。
      尚未覆盖: 缩放规律和对齐过程（DPO、多维奖励建模）是否在已评估的操作任务之外泛化；测试时验证器的改进在跨基准上是否一致。
    - 路线: 概念分类与评测边界
      解决的问题: 将碎片化的世界模型主张组织为状态构建和动态建模的类别，并倡导从视觉指标转向测试因果性和持久性的功能基准。
      尚未覆盖: 这些分类法是否真正改变研究者的模型设计和评测方式；标准化的功能基准仍然缺失。
    共识:
    - 世界模型必须同时捕捉状态和动态，视频生成是实现这一能力的有前景的媒介。
    - 动作条件化是将视频生成器转变为可用的决策与规划世界模型的关键。
    - 物理合理性和任务逻辑是超越视觉保真度的关键质量维度。
    - 在大规模多样化机器人数据集上预训练，并用奖励或偏好进行后训练对齐，能够提升世界模型性能。
    分歧:
    - 状态构建：部分方法通过上下文管理保持隐式状态，另一些方法则主张显式的潜在状态压缩。
    - 评测目标：一种路线强调视觉质量和动作条件化指标，另一种路线则主张采用功能性基准，以剥离空间推理、因果性和物理持久性。
    - 交互模式：模型被用于开环视频预测、基于模型的规划或测试时搜索，对时序一致性和可控性提出不同要求。
    - 监督信号：方法在使用动作标注视频、人类偏好数据、物理启发式启发或环境奖励上存在差异，导致不同的训练和对齐流程。
    开放问题:
    - 如何验证基于视频的世界模型形成了因果正确的内部表示，并能泛化到未见过的动作和物体？
    - 在什么条件下测试时缩放规律会失效，以及如何设计在多样化空间推理任务中保持校准的验证器？
    - 需要哪些最基本的功能基准，才能将物理理解与视频生成质量解耦？
