  related_work_outline:
  - 'Mainstream direction: Building world models using diffusion-based or transformer-based
    generative architectures for video prediction, with increasing integration of
    structured priors such as physics, compositionality, and context.'
  - 'Shared research pattern: Leveraging self-supervised or imitation learning on
    large-scale multi-modal datasets, then evaluating generation quality, downstream
    policy performance, or spatial-temporal consistency.'
  - 'Key differences: Architectures range from diffusion transformers to hybrid VAE-transformers;
    some models focus purely on video generation while others jointly model actions;
    evaluation ranges from pixel-level fidelity to memory consistency and zero-shot
    generalization.'
  - 'Trend evolution: Within the recent frontier (2023-2026), the field is moving
    from efficient world model training for single tasks (e.g., Atari) toward generalizable,
    multi-task, and physically grounded models for robotics and autonomous driving,
    with growing emphasis on dedicated benchmarks.'
  - 'Open questions: How to achieve long-term memory consistency, robust generalization
    across action spaces and dynamics, and physically plausible generation when scaling
    to open-world scenarios.'
  related_work_outline_zh:
  - 主流方向：基于扩散或Transformer的生成式架构构建世界模型进行视频预测，并越来越多地融入物理、组合性和上下文等结构化先验。
  - 研究共性：在大规模多模态数据集上利用自监督或模仿学习，然后评估生成质量、下游策略性能或时空一致性。
  - 关键差异：架构从扩散Transformer到混合VAE-Transformer；有的模型专注于视频生成，有的联合建模动作；评估从像素级保真度到记忆一致性和零样本泛化。
  - 趋势演进：在2023-2026年的前沿期内，领域从单任务（如Atari）的高效训练，转向面向机器人和自动驾驶的泛化、多任务和物理基础模型，并越来越重视专用基准。
  - 开放问题：如何在扩展到开放世界场景时实现长期记忆一致性、跨动作空间和动力学的鲁棒泛化以及物理合理的生成。
  literature_review:
    line_of_work_matrix:
    - line: Generative architectures for world models
      what_it_solves: Transforming high-dimensional sensory input (video) into predictive
        rollouts using diffusion transformers or hybrid VAE-transformers, improving
        sample efficiency and visual fidelity.
      what_remains_open: Whether the chosen architecture (e.g., diffusion vs. VAE)
        inherently limits long-horizon consistency or physical plausibility, and how
        to scale beyond the training distribution.
    - line: Structured priors in world models
      what_it_solves: Incorporating physical knowledge, contextual variables, or compositional
        primitives to improve generalization, disentanglement, and prediction accuracy
        in unseen scenarios.
      what_remains_open: The assumption of observability of context or primitives,
        and the difficulty of grounding symbolic priors from raw sensory data without
        manual annotation.
    - line: World model evaluation benchmarks
      what_it_solves: Providing standardized metrics for spatial consistency, memory,
        and action control, enabling systematic comparison beyond frame-wise reconstruction
        error.
      what_remains_open: Current benchmarks are limited to specific domains (Minecraft,
        navigation) and action spaces; there is no universal protocol for measuring
        physical plausibility or long-term memory.
    - line: Action-conditional and policy-embedded world models
      what_it_solves: Coupling video generation with action diffusion or policy learning,
        allowing world models to serve as simulators for planning, control, and policy
        pretraining.
      what_remains_open: The credit assignment between model capacity and planner/controller
        design, and the robustness of policies trained on generated rollouts to distribution
        shift in real environments.
    consensus:
    - World models are shifting from pixel-level reconstruction objectives to learning
      latent dynamics that capture the underlying causal structure of the environment.
    - Leveraging large-scale pretraining on diverse datasets (e.g., robot manipulation,
      driving) improves generalization across tasks, but standard benchmarks for this
      generalization are still lacking.
    - Physical plausibility and long-term consistency are recognized as critical weaknesses
      of purely data-driven generative models, motivating the injection of physics
      or structural priors.
    disagreements:
    - 'Representation: Some models use diffusion processes in pixel space (e.g., MaskGWM)
      or latent space (e.g., STORM), while others use hybrid VAE-transformers or discrete
      latent variables.'
    - 'Supervision: Models differ in whether they require explicit action labels during
      training (e.g., UWM) or can learn from action-free video (e.g., RoboDreamer
      employs language parsing instead).'
    - 'Evaluation target: One group evaluates on visual quality metrics (FVD, PSNR),
      another on downstream task success (RL policy performance, driving score), and
      a third on dedicated consistency metrics (SGCS, memory/action control scores).'
    - 'Interaction mode: Some works treat world models as open-loop video generators
      evaluated by prediction accuracy, while others couple them with closed-loop
      planners or use them as interactive simulators for policy learning.'
    open_questions:
    - How can world models maintain spatial and temporal consistency when generating
      sequences longer than those seen during training, especially in open-world settings?
    - What is the minimal set of priors (physical, structural, contextual) needed
      to achieve robust generalization, and can they be learned from data without
      explicit supervision?
    - How should the interaction between world model and downstream planner be designed
      to isolate model improvements from planner heuristics or task-specific rewards?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型生成架构
      解决的问题: 将高维感官输入（视频）转化为预测性推演，使用扩散Transformer或混合VAE-Transformer，提高样本效率和视觉保真度。
      尚未覆盖: 所选架构（如扩散 vs. VAE）是否本质上限制了长时域一致性或物理合理性，以及如何扩展至训练分布之外。
    - 路线: 世界模型中的结构化先验
      解决的问题: 融入物理知识、上下文变量或组合原语，以改善在未见场景中的泛化、解耦和预测精度。
      尚未覆盖: 上下文或原语可观测的假设，以及从原始感觉数据中建立符号先验的困难，尤其在没有人工标注时。
    - 路线: 世界模型评估基准
      解决的问题: 提供空间一致性、记忆和动作控制的标准化指标，实现超越逐帧重建误差的系统比较。
      尚未覆盖: 当前基准限于特定领域（Minecraft、导航）和动作空间；缺乏衡量物理合理性或长期记忆的通用协议。
    - 路线: 动作条件与策略嵌入的世界模型
      解决的问题: 将视频生成与动作扩散或策略学习耦合，使世界模型能作为规划、控制和策略预训练的模拟器。
      尚未覆盖: 模型容量与规划器/控制器设计之间的功劳分配，以及基于生成推演训练的策略对真实环境分布偏移的鲁棒性。
    共识:
    - 世界模型正从像素级重建目标转向学习捕捉环境底层因果结构的潜在动力学。
    - 利用多样化数据集（如机器人操作、驾驶）的大规模预训练提升了跨任务泛化，但针对这种泛化的标准基准仍缺乏。
    - 物理合理性和长期一致性被公认为纯数据驱动生成模型的关键弱点，这促使研究者注入物理或结构先验。
    分歧:
    - 表示方式：有的模型在像素空间（如MaskGWM）或潜空间（如STORM）使用扩散过程，有的则使用混合VAE-Transformer或离散潜变量。
    - 监督信号：模型在训练时是否需要显式动作标签不同（如UWM需要，而RoboDreamer依赖语言解析），有的可从无动作视频学习。
    - 评测目标：一派评估视觉质量（FVD、PSNR），另一派看下游任务成功率（RL策略性能、驾驶评分），第三派关注专用的空间/记忆一致性指标。
    - 交互模式：有的工作将世界模型视为开环视频生成器，通过预测精度评估；有的则将其耦合到闭环规划器，或作为交互式模拟器用于策略学习。
    开放问题:
    - 世界模型在生成远长于训练序列的片段时，如何维持空间和时间一致性，尤其是在开放世界环境中？
    - 实现鲁棒泛化所需的最小先验集（物理、结构、上下文）是什么，能否无需显式监督从数据中习得？
    - 如何设计世界模型与下游规划器之间的交互，以隔离模型改进与规划器启发式或任务特定奖励的影响？
