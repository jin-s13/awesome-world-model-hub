  - 主流方向：构建通用世界模型，融合视频生成、动作条件控制和长期记忆，推动面向机器人、自动驾驶和开放环境的交互式、实时、物理一致的模拟器。
  - 研究共性：以生成式视频基础模型作为世界模型，施加语言、动作或多模态条件，进而用于规划、策略学习或闭环仿真；强调分解、可控性和时间一致性。
  - 关键差异：表示空间（像素级视频生成 vs 潜在状态预测）、交互模式（离线想象 vs 实时人机/机环交互）、控制粒度（语言原语、动作轨迹、细粒度姿态）和评测目标（视觉质量、任务成功率、驾驶安全性）。
  - 趋势演进：从静态视频生成走向交互式世界模型，从纯仿真走向真实机器人部署，从单模态走向多模态条件，从开环视觉指标走向闭环、资源感知的评估；近期工作重视开源、实时性和视线外动态。
  - 开放问题：如何为多样的世界模型应用定义统一的评测协议；如何保证长时域物理一致性并处理视线外物体持久性；如何平衡实时交互性与模型能力；如何实现超越预定义原语的组合泛化。
  literature_review:
    line_of_work_matrix:
    - line: Compositional world models
      what_it_solves: Achieves generalization to unseen object–action combinations
        by parsing language instructions into reusable primitives and conditioning
        separate video generation models on each primitive.
      what_remains_open: Generalization is limited to combinations of training primitives;
        entirely novel primitives are unsupported; evaluation remains in simulation,
        and real-robot execution is unverified.
    - line: Interactive video world modeling
      what_it_solves: Surveys the landscape of action-conditioned, long-horizon, and
        real-time interactive world models, providing a taxonomy of application scenarios,
        state evolution, and modality, and identifying key technical challenges.
      what_remains_open: Unified benchmarks and metrics for real-time interactivity
        are missing; long-horizon memory and physical consistency remain open challenges;
        the survey itself does not provide empirical validation.
    - line: General world model simulators
      what_it_solves: Builds high-fidelity, persistent world simulators from video
        generation, supporting out-of-sight dynamics, long-term memory, and real-time
        interaction, with open-source code and models.
      what_remains_open: Depth of physical law understanding is still shallow; transition
        from 2D observation to consistent 4D world simulation is incomplete; evaluation
        benchmarks are limited and often lack real-world grounding.
    - line: Physical robot world models
      what_it_solves: Enables online learning of a world model directly on physical
        robots without simulators, using only camera images and sparse rewards, and
        demonstrates fast adaptation to perturbations.
      what_remains_open: Generalization across diverse robot morphologies and tasks
        is not demonstrated; requires physical robot access, limiting reproducibility;
        hyperparameters are fixed across tasks, which may be suboptimal.
    - line: Latent world models for automated driving
      what_it_solves: Proposes a unified latent-space framework and taxonomy for world
        models in driving, organizing design choices by latent representation and
        structural priors, and prescribes closed-loop evaluation metrics.
      what_remains_open: The framework is purely theoretical without empirical validation;
        the taxonomy may not cover all future approaches; the proposed evaluation
        suite is not implemented or tested.
    consensus:
    - World models are central to enabling intelligent behavior in dynamic environments,
      with a shared emphasis on learning from visual observations and predicting future
      states.
    - Long-term temporal consistency and memory are recognized as essential capabilities
      for realistic simulation and planning.
    - Action-conditioned controllability is necessary to turn world models from passive
      observation generators into interactive tools for decision-making.
    - Current models still lack robust physical reasoning, and evaluation protocols
      are fragmented across application domains.
    disagreements:
    - 'Representation choice: some works operate directly in pixel space via video
      generation, while others learn compact latent state representations for prediction.'
    - 'Interaction paradigm: offline world model imagination for planning contrasts
      with real-time, human-in-the-loop or online control scenarios.'
    - 'Control granularity: language-level decomposition into primitives differs from
      fine-grained control via ego-motion trajectories, human poses, or low-level
      actions.'
    - 'Evaluation target: visual fidelity metrics are prioritized in some lines, while
      task completion rate, driving safety, or computational cost dominate others.'
    - 'Deployment setting: simulation-only evaluations are common, but a few works
      target real-robot learning, creating a gap in validation rigor and reproducibility.'
    open_questions:
    - How can we design a cross-domain evaluation benchmark that covers visual quality,
      physical consistency, interactivity, and task success in a unified way?
    - What mechanisms can ensure persistent object permanence and out-of-sight dynamics
      while maintaining real-time performance?
    - How can world models move beyond primitive-level composition to achieve true
      combinatorial generalization to novel concepts?
    - What validation protocols are needed to bridge the gap between simulated world
      models and safe, reliable deployment on physical systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 组合世界模型
      解决的问题: 通过将语言指令解析为可复用原语并在每个原语上条件化分离的视频生成模型，实现对未见物体–动作组合的泛化。
      尚未覆盖: 泛化仅限于训练原语的组合，无法处理全新原语；评估仅在仿真中进行，真实机器人执行未被验证。
    - 路线: 交互式视频世界建模
      解决的问题: 综述动作条件、长时域和实时交互世界模型的现状，提供按应用场景、状态演化和模态的分类，并识别关键技术挑战。
      尚未覆盖: 缺乏统一的实时交互基准和度量；长时域记忆和物理一致性仍是开放难题；综述本身未提供实证验证。
    - 路线: 通用世界模型模拟器
      解决的问题: 从视频生成构建高保真、持久的世界模拟器，支持视线外动态、长期记忆和实时交互，并提供开源代码和模型。
      尚未覆盖: 物理规律理解深度不足；从二维观察到一致的四维世界模拟的过渡仍不完整；评估基准有限且缺乏真实世界依据。
    - 路线: 物理机器人世界模型
      解决的问题: 在物理机器人上直接在线学习世界模型，无需模拟器，仅使用摄像头图像和稀疏奖励，并展示对扰动的快速适应。
      尚未覆盖: 未展示跨不同机器人形态和任务的泛化；需要物理机器人硬件，可复现性受限；超参数固定，可能非最优。
    - 路线: 自动驾驶潜在世界模型
      解决的问题: 提出统一的潜在空间框架和分类法，按潜在表示和结构先验组织设计选择，并给出闭环评估度量建议。
      尚未覆盖: 框架纯理论，缺乏实证验证；分类法可能无法涵盖未来方法；所提评估方案未实施或测试。
    共识:
    - 世界模型是实现在动态环境中智能行为的关键，共同强调从视觉观察中学习并预测未来状态。
    - 长期时间一致性和记忆被认为是实现逼真模拟和规划的核心能力。
    - 动作条件可控性是将世界模型从被动观察生成器转变为交互式决策工具的必要条件。
    - 当前模型仍缺乏鲁棒的物理推理，评估协议在不同应用领域之间碎片化。
    分歧:
    - 表示选择：部分工作直接在像素空间通过视频生成操作，而其他工作学习紧凑的潜在状态表示进行预测。
    - 交互范式：离线世界模型想象用于规划，与实时人机交互或在线控制场景形成对比。
    - 控制粒度：语言层级的原语分解与通过自我运动轨迹、人体姿态或低级动作的细粒度控制不同。
    - 评测目标：一些路线优先考虑视觉保真度指标，而其他路线侧重任务完成率、驾驶安全性或计算成本。
    - 部署环境：仅仿真的评估较为常见，少数工作瞄准真实机器人学习，造成验证严谨性和可复现性的差距。
    开放问题:
    - 如何设计一个跨领域的评估基准，以统一方式涵盖视觉质量、物理一致性、交互性和任务成功率？
    - 何种机制能在保持实时性能的同时确保物体的持久存在和视线外动态？
    - 世界模型如何超越原语层级组合，实现对全新概念的真正组合泛化？
    - 需要怎样的验证协议来弥合仿真世界模型与安全、可靠地部署在物理系统上的差距？
