  - 主流方向：以自动驾驶和具身交互为主的可控世界模型模拟器，将生成视频模型转化为可运行闭环系统，强调动作条件、多视角一致性、低延迟和基准评测。
  - 研究共性：多将大规模视频生成与结构化控制或上下文信号结合，并通过仿真真实性、动作保真度、空间一致性或下游策略学习进行评测；多篇还提供数据集或基准。
  - 关键差异：表示、监督信号和部署不同，帧自回归多视图扩散、预训练视频适配器和循环状态空间模型并存；轨迹控制、上下文值、物理深度/关键点任务、空间一致性基准各侧重不同。
  - 趋势演进：可见前沿集中在2024-2026年，从逼真视频生成转向动作可控、物理感知、低延迟闭环模拟；主题跨度中的较早年份并非顶部证据热点。
  - 开放问题：跨数据集/跨域泛化、长时程一致性在分布偏移下退化、独立复现，以及速度-保真度-可控性权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turns generative model capabilities into end-to-end workflows
        for data, training, inference, and evaluation, including trajectory-conditioned
        video generation, multi-view structured control, and benchmark-based simulation.
      what_remains_open: Generalization beyond reported datasets such as nuScenes
        or CARL is not verified; external deployment, hardware changes, and user-specific
        distribution shifts remain unresolved.
    - line: Real-time and interactive serving
      what_it_solves: Meets closed-loop latency and interactivity requirements through
        frame-level autoregressive optimization, lightweight action-conditioned modules,
        and sub-second single-GPU inference for simulation or policy interaction.
      what_remains_open: Long-horizon consistency may degrade under iterative self-conditioning;
        the system-level trade-off among speed, visual fidelity, physical plausibility,
        and controllability is not fully resolved across domains.
    - line: Artifacts and reproducible engineering
      what_it_solves: Makes systems inspectable and reusable through open benchmarks,
        datasets, models, and code signals, including loop-consistency navigation
        data and action-fidelity evaluation frameworks.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        is still limited; missing code, dataset, or metric details should be treated
        as verification gaps rather than confirmed absence.
    consensus:
    - Controllable video-world models are being treated as runnable systems rather
      than standalone generative models.
    - Action or structural supervision is considered necessary for consistency, whether
      from trajectories, context values, depth/keypoints, or loop-based scene graphs.
    - Evaluation is moving beyond visual fidelity to include action fidelity, spatial
      consistency, downstream policy value, and inference latency.
    disagreements:
    - 'Representation and generation backbone differ: frame-autoregressive multi-view
      diffusion, pretrained video-generation adapters, and recurrent state-space models
      emphasize different temporal modeling paths.'
    - 'Supervision signals differ: trajectory and structured control for driving,
      observable context values for zero-shot RL, physics-inspired depth/keypoint
      tasks, and spatial consistency scores from navigation loops target different
      aspects.'
    - 'Evaluation targets and deployment settings differ: closed-loop autonomous driving,
      embodied robot video synthesis, game/robot reinforcement learning, and open-world
      navigation memory cover distinct assumptions.'
    - 'Interaction mode differs: some systems support continuous action controls or
      hierarchical intentions, others generate scenarios or provide offline benchmark
      evaluation, creating different controllability requirements.'
    open_questions:
    - Does action-fidelity improvement transfer beyond the reported datasets and sensor
      configurations?
    - Can long-horizon closed-loop simulation maintain spatial, temporal, and cross-view
      consistency under distribution shift?
    - What latency, visual quality, physical plausibility, and control precision trade-off
      is acceptable for real deployment?
    - How reproducible are these systems without the original infrastructure, datasets,
      or explicitly reported training and evaluation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将生成模型能力转化为覆盖数据、训练、推理和评测的端到端工作流，包括轨迹条件视频生成、多视角结构化控制和基准化模拟。
      尚未覆盖: 在nuScenes、CARL等已报告数据集之外的泛化尚未验证；外部部署、硬件变化和用户特定分布偏移仍有待检验。
    - 路线: 实时与交互式服务
      解决的问题: 通过帧级自回归优化、轻量动作条件模块和单GPU亚秒级推理，满足闭环延迟和交互式模拟或策略交互需求。
      尚未覆盖: 长时程自条件生成可能退化；速度、视觉保真度、物理合理性和可控性之间的系统级权衡尚未跨域解决。
    - 路线: 工件与可复现工程
      解决的问题: 通过开放基准、数据集、模型和代码信号让系统可检查、可复用，包括环路一致性导航数据和动作保真度评测框架。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现证据仍有限；代码、数据集或指标缺失应视为验证缺口，而非确认不存在。
    共识:
    - 可控视频世界模型正被发展为可运行系统，而非单一生成模型。
    - 动作或结构监督被视为保证一致性的关键，包括轨迹、上下文值、深度/关键点或环路场景图。
    - 评测标准正从视觉保真度扩展到动作保真度、空间一致性、下游策略价值和推理延迟。
    分歧:
    - 表示与生成骨架不同：帧自回归多视图扩散、预训练视频生成适配器和循环状态空间模型采用不同的时序建模路径。
    - 监督信号不同：驾驶中的轨迹与结构化控制、零样本RL中的可观测上下文值、物理深度/关键点任务和环路空间一致性评分各解决不同目标。
    - 评测与部署设置不同：闭环自动驾驶、机器人视频合成、游戏/机器人强化学习和开放世界导航记忆覆盖不同假设。
    - 交互模式不同：连续动作控制、分层意图、场景生成和离线基准评测形成不同的可控性与任务形态。
    开放问题:
    - 动作保真度的提升是否可迁移到已报告数据集和传感器配置之外？
    - 长时程闭环模拟在分布偏移下能否保持时空和跨视角一致性？
    - 真实部署中可接受的延迟、视觉质量、物理合理性与控制精度权衡是什么？
    - 在缺少原始基础设施、数据集或明确训练与评测细节时，系统能否被独立复现？
