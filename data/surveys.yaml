  related_work_outline:
  - 'Mainstream direction: Building generative or latent world models on transformer/diffusion
    backbones for visual prediction and model-based control, with action, context,
    physics, memory, or spatial consistency as first-class training or evaluation
    signals.'
  - 'Shared research pattern: Papers pair a predictive architecture with auxiliary
    self-supervised objectives or benchmarks, then test long-horizon, unseen-context,
    multi-view, or action-conditioned generalization rather than only single-task
    accuracy.'
  - 'Key differences: Some use compact latent dynamics for reinforcement learning
    while others generate pixels; supervision ranges from self-supervised generation
    to observable context or physics-like depth/keypoint signals; action is integrated
    through imagination, unified diffusion, or benchmark-only evaluation.'
  - 'Trend evolution: Although the topic span begins in 2015, the bounded top-paper
    evidence is concentrated in the 2023-2026 frontier: from Atari/CARL-style control
    efficiency toward driving, robot, and open-domain world models emphasizing long-horizon
    consistency, action conditioning, and benchmark-based generalization.'
  - 'Open questions: How well auxiliary objectives transfer across domains, how to
    isolate model gains from planner/policy or data effects, and how to standardize
    consistency and action-control evaluation without narrow task proxies.'
  related_work_outline_zh:
  - 主流方向：以Transformer/扩散为骨干构建生成式或潜在世界模型，并将动作、上下文、物理、记忆或空间一致性作为核心训练或评测信号。
  - 研究共性：论文普遍将预测架构与辅助自监督目标或基准配对，测试长时域、未见上下文、多视角或动作条件泛化，而非仅单任务精度。
  - 关键差异：预测表示、监督信号和动作接口不同：潜在动力学对比像素生成；自监督生成对比可观测上下文或深度/关键点；动作通过想象、统一扩散或仅基准评测接入。
  - 趋势演进：虽然主题跨度始于2015年，但本批次证据集中在2023-2026年前沿：从Atari/CARL风格控制效率转向驾驶、机器人与开放域中长时一致性、动作条件和基准泛化。
  - 开放问题：辅助目标能否跨域迁移、模型收益与规划/策略或数据效应如何隔离，以及如何在不依赖窄代理任务下标准化一致性与动作控制评测。
  literature_review:
    line_of_work_matrix:
    - line: Masked and diffusion-based generative video world models for visual rollout
      what_it_solves: Long-horizon and multi-view video prediction via diffusion transformers
        with auxiliary mask reconstruction or physics-like objectives.
      what_remains_open: Cross-domain transfer beyond driving or robot scenes; whether
        visual fidelity corresponds to downstream control or physical consistency
        remains unclear.
    - line: Latent stochastic and contextual recurrent world models for model-based
        reinforcement learning
      what_it_solves: Sample-efficient policy learning by training policies on imagined
        trajectories from compact latent dynamics.
      what_remains_open: Zero-shot generalization is shown only with observable context
        and few CARL tasks; search-free limits and broader task transfer remain unverified.
    - line: Compositional language-conditioned world models for robot imagination
      what_it_solves: Generalization to unseen combinations of objects and actions
        by factorizing video generation into language-derived primitives.
      what_remains_open: Novel primitives are unsupported; real-robot deployment is
        not shown; performance depends on parser accuracy.
    - line: Unified action-video and physics-informed embodied world models
      what_it_solves: Integrate action and video diffusion or physics auxiliary tasks
        to pretrain policies and improve physical plausibility.
      what_remains_open: Attribution between model dynamics, data scale, and policy
        optimization is not isolated; several works do not report limitations or ablation
        details.
    - line: Benchmarks for spatial/memory consistency and action control
      what_it_solves: Measure loop closure, scene-graph consistency, memory consistency,
        and action-conditioned control in open-domain videos.
      what_remains_open: Standard adoption and baseline comparisons are nascent; some
        contributions report only benchmark construction without experimental baselines.
    consensus:
    - World-model methods increasingly use transformer or diffusion architectures
      for video or latent sequence prediction.
    - Auxiliary self-supervised objectives such as mask reconstruction, depth prediction,
      keypoint dynamics, and action prediction are added to improve consistency or
      control.
    - Evaluation is expanding from single-task reward benchmarks to long-horizon,
      multi-view, unseen-context, and open-domain consistency settings.
    - Action interfaces are treated as first-class components, either through imagined
      rollouts, coupled diffusion, or action-conditioned benchmarks.
    - Datasets and benchmarks are being introduced alongside methods to test generalization
      beyond curated training distributions.
    disagreements:
    - 'Methods differ in predictive substrate: compact latent dynamics or recurrent
      state-space models versus pixel-space video diffusion generation.'
    - 'Supervision assumptions differ: some rely only on self-supervised reconstruction/generation,
      while others require observable context values or explicit physics-like auxiliary
      signals.'
    - 'Action integration differs: some train policies inside model imagination, some
      couple video and action diffusion in one architecture, and some only benchmark
      action control.'
    - Evaluation settings split among control-style, driving video, robot manipulation,
      and open-domain environments, giving different evidence for generalization.
    - Several method papers do not report limitations or ablation details, making
      it hard to isolate model contribution from data, baselines, and policy/planner
      choices.
    open_questions:
    - Which auxiliary objectives transfer across driving, robotics, and game-like
      open-world domains?
    - How should world models be evaluated for long-term memory and action consistency
      under unseen action spaces without narrow task proxies?
    - What part of downstream policy improvement comes from learned dynamics rather
      than data scale or policy optimization?
    - Can compositional world models generate novel primitives and real-robot behavior
      beyond combinations seen during training?
    - What ablation and limitation-reporting protocols would make evidence comparable
      across generative, model-based RL, and benchmark work?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码与扩散生成式视频世界模型
      解决的问题: 实现长时域、多视角视觉预测，并结合掩码重建或物理类目标提升一致性。
      尚未覆盖: 跨驾驶与机器人以外的迁移，以及视觉质量是否能转化为下游控制能力仍缺少证据。
    - 路线: 潜在随机与上下文世界模型用于模型式强化学习
      解决的问题: 在紧凑潜在动态生成的想象轨迹上训练策略，提升样本效率和上下文零样本泛化。
      尚未覆盖: 仅展示可观测上下文和少量CARL任务的零样本泛化；无搜索方法的边界及更广泛任务迁移尚未验证。
    - 路线: 组合语言条件世界模型用于机器人想象
      解决的问题: 通过将语言指令拆解为原语并组合视频生成，实现未见物体-动作组合。
      尚未覆盖: 只能组合训练所见原语；真实机器人部署缺失，且依赖解析准确性。
    - 路线: 统一动作-视频与物理信息具身世界模型
      解决的问题: 耦合视频与动作扩散或加入深度、关键点辅助任务，预训练策略并提高物理合理性。
      尚未覆盖: 方法贡献与数据规模、策略优化之间未充分隔离；若干工作未报告限制或消融。
    - 路线: 空间/记忆一致性与动作控制基准
      解决的问题: 用循环导航、场景图分数、记忆一致性和动作空间测试开放域世界模型。
      尚未覆盖: 基准仍较新，有些仅报告构建细节或无实验结果；标准化基线与广泛采用尚不明确。
    共识:
    - 世界模型方法越来越多使用Transformer或扩散架构进行视频或潜在序列预测。
    - 通过掩码重建、深度预测、关键点动力学、动作预测等辅助自监督目标来提升一致性或控制。
    - 评测从单任务奖励向长时域、多视角、未见上下文和开放域一致性扩展。
    - 动作接口被作为关键组件，包括在想象轨迹中训练策略、统一扩散中的动作-视频耦合，以及动作条件基准。
    - 方法论文与基准论文都开始公开数据或代码，以支持分布外泛化评测。
    分歧:
    - 预测表示不同：紧凑潜在动力学或循环状态空间模型对比像素级视频扩散生成。
    - 监督假设不同：一些仅使用自监督重建或生成，另一些依赖可观测上下文或物理类辅助信号。
    - 动作集成不同：有的在世界模型想象内训练策略，有的在同一架构中耦合视频和动作扩散，有的仅评测动作控制。
    - 评测域不同：控制类基准、驾驶视频、机器人操作和开放世界环境各自提供不同泛化证据。
    - 多篇方法论文未报告限制或消融，导致难以区分模型方法、数据集、基线和策略或规划器之间的贡献。
    开放问题:
    - 哪些辅助目标能在驾驶、机器人和开放世界之间迁移？
    - 如何在未见动作空间下评测长期记忆与动作一致性，而不依赖窄任务代理指标？
    - 下游策略提升中有多少来自学习动力学，而非数据规模或策略优化？
    - 组合世界模型能否生成训练未见的新原语并支撑真实机器人行为？
    - 什么样的消融和限制报告协议能让生成式、模型式强化学习和基准研究的证据可比较？
