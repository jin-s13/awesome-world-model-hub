  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving and robotics are
    dominant, often built as diffusion transformers or unified video-action models
    that learn from large interaction datasets and generate future observations for
    planning or policy training.'
  - 'Shared research pattern: Papers couple generative video or latent dynamics with
    action, language, context, or physics signals, then evaluate through rollout prediction,
    zero-shot generalization, or downstream policy and control tasks.'
  - 'Key differences: Representation choices differ among pixel-space video diffusion,
    latent recurrent state-space models, and transformer-VAE stochastic models; supervision
    differs among physics/depth/keypoint signals, language-primitive decomposition,
    observable context, and action-video diffusion; evaluation targets range from
    driving datasets to robot execution, Atari, and memory/action-control benchmarks.'
  - 'Trend evolution: Within 2023-2026 the frontier moves from efficient model-based
    RL for games toward unified, physics-informed, and benchmarked world models for
    embodied settings, with increased focus on spatial consistency, memory, and action
    controllability.'
  - 'Open questions: Evidence is limited on real-world deployment beyond simulation,
    generalization across unseen embodiments, scenes and action spaces, long-horizon
    consistency, and whether benchmark metrics align with downstream safety or task
    success; several papers omit limitations.'
  related_work_outline_zh:
  - 主流方向：面向驾驶和机器人的领域世界模型占主导，常以扩散Transformer或统一视频-动作模型从大规模交互数据中学习未来观测，用于规划或策略训练。
  - 研究共性：将生成式视频或潜在动力学与动作、语言、上下文或物理信号耦合，并通过预测、零样本泛化或下游策略与控制任务评估。
  - 关键差异：表示层有像素空间视频扩散、潜在循环状态空间和Transformer-VAE随机模型；监督信号有物理/深度/关键点、语言原语、可观测上下文和动作-视频扩散；评测覆盖驾驶、机器人、Atari及记忆/动作控制基准。
  - 趋势演进：2023-2026年间前沿从游戏场景的高效模型强化学习，转向具身场景的统一、物理信息驱动和基准化世界模型，更关注空间一致性、记忆和动作可控性。
  - 开放问题：真实部署证据有限，跨本体、场景和动作空间泛化不足，长时域一致性未解决，基准指标与下游安全或任务成功是否一致未验证，部分论文缺局限性说明。
  literature_review:
    line_of_work_matrix:
    - line: Driving video world models for scene prediction and multi-view generation
      what_it_solves: Forecasting future driving scenes and supporting long-horizon
        or multi-view prediction for closed-loop simulation and policy evaluation.
      what_remains_open: Results are concentrated on NuScenes/OpenDV-2K/Waymo; real-world
        safety and downstream driving-policy outcomes remain unverified.
    - line: Robot world models for visual imagination, pretraining, and policy learning
      what_it_solves: Learning compositional video generation and video-action dynamics
        from robot data to imagine tasks, pretrain policies, or generate physically
        plausible robot videos.
      what_remains_open: Generalization beyond seen language primitives or observed
        contexts; most evaluation is simulation or benchmark-based rather than physical
        deployment.
    - line: Model-based reinforcement learning with stochastic or contextual world
        models
      what_it_solves: Training policies in latent or generated rollouts under limited
        interaction, with context conditioning for zero-shot transfer or efficient
        Atari learning.
      what_remains_open: Context observability assumptions, narrow task coverage,
        and missing evidence for transfer to broader embodied or real-world settings.
    - line: Benchmarks for world-model memory, spatial consistency, and action control
      what_it_solves: Quantifying whether generated trajectories preserve spatial
        coherence, long-term memory, and action conditioning across views or loop-based
        navigation.
      what_remains_open: Benchmark results show current models struggle with long-term
        consistency and action-space generalization; the link to downstream task performance
        is not yet established.
    - line: Physics-informed embodied video generation
      what_it_solves: Adding temporal depth and keypoint dynamics to RGB generation
        for geometric consistency and physical plausibility in robotic videos.
      what_remains_open: Evaluation focuses on visual fidelity and physical plausibility,
        with only partial evidence of impact on downstream policy training and evaluation.
    consensus:
    - World models are increasingly treated as generative simulators that must condition
      on action or control signals, not only passive video predictors.
    - Current work prioritizes learning from large-scale, domain-specific interaction
      data by combining video generation with policy, dynamics, or physics objectives.
    - Evaluation is often tied to benchmark datasets and downstream task proxies,
      including rollout quality, zero-shot generalization, robot execution, or control
      consistency.
    - There is broad agreement that long-horizon consistency and generalization across
      unseen scenes, contexts, and actions are central unresolved problems.
    disagreements:
    - 'Representation differs: pixel-space video diffusion versus latent recurrent
      state-space models versus stochastic transformer-VAE rollouts.'
    - 'Supervision differs: physics cues such as depth and keypoints versus language-primitive
      decomposition versus observable context values versus coupled action-video diffusion.'
    - 'Evaluation target differs: driving datasets, robot execution/simulation, Atari
      scores, or memory/action-control benchmarks, with no unified metric.'
    - 'Interaction mode differs: some models generate video plans for policy execution,
      others train policies inside learned rollouts, and some evaluate open-loop or
      closed-loop revisited generation.'
    open_questions:
    - Do driving world model gains on NuScenes/OpenDV-2K/Waymo translate to safer
      or more effective real-world driving policies?
    - Can robot world models generalize to unseen primitives, contexts, embodiments,
      or physical environments rather than only seen combinations?
    - How can world models maintain spatial and long-term memory consistency under
      closed-loop revisited or loop-based navigation?
    - What evaluation score should connect visual fidelity, action controllability,
      and downstream task success across different application domains?
    - Several papers do not report limitations or real-world deployment evidence,
      so failure boundaries and negative results remain unclear.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶视频世界模型用于场景预测与多视角生成
