  - 'Mainstream direction: World models are rapidly expanding from low-dimensional
    game environments (Atari) to high-dimensional embodied applications such as robot
    manipulation and autonomous driving, with video generation and diffusion models
    as the dominant backbone.'
  - 'Shared research pattern: Most works adopt generative architectures (e.g., diffusion
    transformers, VAEs) to predict future observations or latent states, and then
    use the generated rollouts for policy learning, planning, or evaluation.'
  - 'Key differences: Supervision signals vary widely—some methods rely purely on
    video reconstruction, while others jointly model actions, context, or physical
    constraints; evaluation targets range from video fidelity and policy scores to
    spatial/memory consistency benchmarks.'
  - 'Trend evolution: From 2023 efficient Atari world models to 2024–2025 domain-specific
    frameworks for robotics and driving, and finally to 2025–2026 systematic benchmarks
    that assess memory, action control, and spatial consistency.'
  - 'Open questions: Whether generated visual rollouts can replace real interaction
    for policy training, how to ensure physical plausibility in safety-critical domains,
    and how to unify evaluation across diverse embodiments and action spaces.'
  related_work_outline_zh:
  - 主流方向：世界模型正从低维游戏环境（Atari）快速扩展到机器人操作、自动驾驶等高维具身应用，视频生成和扩散模型成为主要技术路线。
  - 研究共性：多数工作采用生成式架构（如扩散Transformer、VAE）预测未来观测或潜在状态，并利用生成的轨迹进行策略学习、规划或评估。
  - 关键差异：监督信号差异显著——有的仅依赖视频重建，有的联合建模动作、上下文或物理约束；评测目标涵盖视频保真度、策略得分、空间/记忆一致性等。
  - 趋势演进：从2023年高效Atari世界模型，到2024–2025年面向机器人和驾驶的领域专用框架，再到2025–2026年系统化的记忆、动作控制和空间一致性基准出现。
  - 开放问题：生成视频能否替代真实交互用于策略训练；安全关键场景中如何保证物理合理性；如何统一跨本体和动作空间的评测标准。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene video generation with diffusion models
      what_it_solves: Generating high-fidelity, long-horizon, multi-view driving videos
        with zero-shot cross-dataset generalization for simulation and prediction.
      what_remains_open: Alignment between generated video quality and real-world
        safety or operational outcomes; closed-loop evaluation of downstream planning
        under distribution shifts.
    - line: Context-aware world models for model-based RL
      what_it_solves: Incorporating observable context into recurrent state-space
        models to disentangle dynamics and enable zero-shot policy generalization
        to unseen dynamics.
      what_remains_open: The assumption that context is observable; only two tasks
        from a single benchmark suite are evaluated, leaving broader embodiment and
        real-world transfer unverified.
    - line: Efficient Transformer-based world models for games
      what_it_solves: Achieving human-level performance on Atari with limited environment
        interactions by combining stochastic latent dynamics and efficient sequence
        modeling.
      what_remains_open: Generalization to continuous control or real-world tasks
        is not tested; efficiency gains are measured on a single GPU, with no evidence
        of scaling to diverse action spaces.
    - line: Compositional video generation for robot imagination
      what_it_solves: Parsing language instructions into primitives and composing
        video plans to generalize to unseen task combinations in robotic manipulation.
      what_remains_open: Requires predefined action primitives and accurate language
        parsing; evaluation is simulation-only, and entirely novel primitives are
        not supported.
    - line: Physics-informed video generation for embodied AI
      what_it_solves: Jointly learning RGB frame prediction and physical knowledge
        (depth, keypoint dynamics) to improve visual fidelity and motion plausibility
        of generated robot videos.
      what_remains_open: The impact on downstream policy performance is not quantified;
        real-robot validation of physical plausibility is missing.
    - line: Unified video-action diffusion for robot pretraining
      what_it_solves: Coupling video and action diffusion in a single transformer
        to learn policies, dynamics, and video generators from large-scale multitask
        robot data, including action-free videos.
      what_remains_open: Robustness of modality alignment during deployment and the
        limit of generalization to unseen embodiments and environments remain unexamined.
    - line: Benchmarking memory and spatial consistency of world models
      what_it_solves: Providing curated datasets (Minecraft, open-domain videos) and
        metrics (scene graph consistency, memory consistency, action control) to evaluate
        the coherence of world model rollouts under viewpoint changes and closed-loop
        actions.
      what_remains_open: Benchmark coverage is limited to synthetic or game-like environments;
        the correlation with real-world task performance is not established.
    consensus:
    - Generative video models (diffusion-based, Transformer-based) are treated as
      the primary substrate for world modeling across domains.
    - Generalization—whether zero-shot, compositional, or across datasets—is a central
      concern in all application-oriented world model studies.
    - World model rollouts are used to support policy learning, planning, or evaluation,
      not just as standalone generation tasks.
    - Scaling to larger, more diverse datasets (OpenDV-2K, RT-X, large robot datasets)
      is a common strategy to improve robustness.
    disagreements:
    - 'Supervision: some methods rely solely on video prediction (e.g., MaskGWM, RoboScape),
      while others incorporate explicit action labels (UWM) or context vectors (cRSSM).'
    - 'Physical knowledge: RoboScape explicitly injects depth and keypoint dynamics,
      whereas others treat physics as an emergent property of data-driven generation.'
    - 'Evaluation target: driving works focus on video quality metrics (FID, LPIPS),
      RL works on Atari scores, robot works on task success rate, and benchmarks on
      consistency scores—making direct comparison impossible.'
    - 'Interaction mode: closed-loop action control (MIND) versus open-loop video
      generation, with different assumptions about the role of feedback from the environment.'
    - 'Domain gap: 2D Atari games, 3D driving simulators, and robot manipulation tasks
      differ in observation space, action complexity, and safety requirements, leading
      to specialized architectures that are not easily transferable.'
    open_questions:
    - Can generated videos reliably substitute real environment interactions for training
      control policies, especially in safety-critical settings?
    - How to design a unified evaluation protocol that captures both visual fidelity
      and downstream task performance across driving, robotics, and games?
    - What is the minimal amount of domain-specific data needed to achieve physics-plausible,
      long-horizon generation in a new embodiment?
    - How to maintain memory and spatial consistency over very long rollouts (hundreds
      of steps) when the world model must also adapt to unseen actions or viewpoints?
