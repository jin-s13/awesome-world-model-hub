  - 'Mainstream direction: Generative world models are being applied in driving, robotics,
    and interactive environments, mostly using diffusion or transformer architectures
    to predict future video conditioned on actions or instructions.'
  - 'Shared research pattern: Most work learns action-conditioned future prediction
    from domain-specific datasets and evaluates visual fidelity, policy performance,
    or consistency metrics.'
  - 'Key differences: Applications split among driving simulation, robot imagination,
    and RL/game control; methods differ in representation, auxiliary physics or memory
    signals, and evaluation targets.'
  - 'Trend evolution: The visible frontier moves from recurrent state-space model-based
    RL and efficient Atari training toward large-scale video diffusion and explicit
    memory, spatial consistency, and action-control benchmarks in 2024-2026.'
  - 'Open questions: Cross-domain and cross-embodiment transfer, long-term spatial
