  related_work_outline_zh:
  - 主流方向：动作条件化的视频预测被视作世界模型的主要操作形式，常把视频与动作耦合在统一生成架构中。
  - 研究共性：模型基于观测和动作生成未来帧，并以视觉保真度、可控性、策略价值、规划效用或物理合理性来评估推演。
  - 关键差异：表示方式涵盖联合扩散、掩码自回归与预训练视频模型适配器；监督信号包括动作标签、人类偏好、物理标注和验证器微断言。
  - 趋势演进：高证据论文集中在2024–2026年，重点从视频质量转向功能基准、物理对齐、测试时验证器和零样本探测。
  - 开放问题：缺乏形式保证或缩放规律来预测世界模型何时支持因果推理、长时程持久性，以及超越接触丰富操作任务的迁移。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies that a world model must separate state construction
        from dynamics modeling and makes explicit the assumptions behind action-conditioned
        video prediction.
      what_remains_open: The formal decomposition is conceptual; no evidence shows
        it matches observed failure modes, persistence limits, or causal reasoning
        errors in trained video world models.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size, data scale, and test-time verifier scaling
        to video fidelity, policy-evaluation correlation, and spatial-reasoning improvements.
      what_remains_open: Scaling gains are benchmark-specific and not formalized;
        no predictive law or guarantee covers out-of-distribution transfer or consistent
        test-time scaling, as seen when a verifier improves one benchmark but not
        another.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes evaluation into visual quality, physical plausibility,
        reward alignment, and functional or zero-shot benchmarks rather than treating
        them as interchangeable.
      what_remains_open: Whether these categories change model design or measurement
        is underevidenced; current evidence mostly demonstrates improved visual or
        physical rollouts on selected manipulation datasets.
    consensus:
    - Action-conditioned video rollouts are common operationalizations of world models.
    - Visual quality alone is insufficient; evaluation increasingly includes controllability,
      physical plausibility, policy correlation, or reasoning value.
    - World-model claims need functional evaluation and better alignment between generated
      trajectories and task-relevant outcomes.
    disagreements:
    - 'Architectural representation differs: unified video-action diffusion, heterogeneous
      masked autoregression, and adapter-modified pretrained video models.'
    - 'Supervision differs: action-labeled datasets, preference-based reward models,
      physics-aware annotations, or test-time frame-anchored assertions.'
    - 'Evaluation target differs: video fidelity and speed versus policy-evaluation
      correlation versus physical plausibility versus spatial-reasoning benchmark
      scaling.'
    - 'Deployment setting differs: real-time robot simulation, closed-source pretrained
      adaptation, zero-shot cross-embodiment benchmark, or alignment post-training
      on flow models.'
    open_questions:
    - Can formal state/dynamics taxonomies predict when generated video supports causal
      reasoning and long-horizon persistence?
    - Which reward or verifier signal gives consistent test-time scaling across diverse
      spatial-reasoning and manipulation benchmarks?
    - Do physical-alignment and multi-dimensional reward objectives transfer beyond
      contact-rich manipulation and selected robot datasets?
    - Are video fidelity and controllability gains reliable proxies for policy performance,
      simulator transfer, and compositional generalization?
