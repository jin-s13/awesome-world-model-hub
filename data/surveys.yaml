  related_work_outline_zh:
  - 主流方向：构建动作或上下文条件的生成式世界模型作为可运行模拟器，重点集中在自动驾驶和具身控制场景。
  - 研究共性：将未来视频或状态预测建模为可控生成问题，并以保真度、动作遵循、物理合理性或下游规划效用进行评测。
  - 关键差异：评测目标从空间一致性、动作忠实度到规划真实感不等；条件信号包括轨迹、高层意图、动作和物理上下文；架构涵盖循环状态空间模型、扩散Transformer、自回归生成器和可插拔适配模块。
  - 趋势演进：高排名证据集中于2024-2026年，从数据集和基准构建转向闭环、实时、物理感知模拟与系统级部署。
  - 开放问题：长时程一致性、跨数据集泛化、速度-保真度-可控性权衡、隐式上下文处理与独立复现仍未充分验证。
  literature_review:
    line_of_work_matrix:
    - line: World-model evaluation benchmarks and datasets
      what_it_solves: Provides reusable tests for spatial consistency, action fidelity,
        and scenario realism in generated rollouts.
      what_remains_open: Metric validity and baseline comparability across environments,
        sensors, and downstream policies are still limited.
    - line: Action-controllable video world simulators for driving and embodied control
      what_it_solves: Turns visual generative models into future-state predictors
        conditioned on trajectory, action, or goal signals for simulation and planning.
      what_remains_open: Long-horizon multi-view consistency, physical plausibility,
        and real-time deployment beyond the reported datasets remain unresolved.
    - line: Physics-informed and context-conditioned world models
      what_it_solves: Injects physical or contextual knowledge into dynamics learning
        to improve zero-shot generalization and plausibility of imagined transitions.
      what_remains_open: Approaches often assume observable context or physical priors
        and are evaluated on narrow task suites, leaving hidden-context and cross-domain
        transfer unclear.
    - line: End-to-end runnable simulation and deployment pipelines
      what_it_solves: Packages datasets, training, inference, and evaluation into
        open frameworks or low-latency systems for downstream use.
      what_remains_open: Independent reproduction, hardware/sensor changes, long-sequence
        scaling, and multi-GPU deployment are not yet demonstrated.
    consensus:
    - Future video or state generation is treated as a controllable world-simulator
      capability shared across driving, robotics, and game-like navigation.
    - Conditioning signals such as action, trajectory, goal, or context are used to
      make generative predictions actionable for downstream control or simulation.
    - Evaluation combines visual fidelity or dynamics quality with task-oriented metrics
      rather than relying solely on sample realism.
    - Usable artifacts such as datasets, benchmarks, or runnable baselines are a recurring
      contribution pattern.
    disagreements:
    - 'Evaluation target differs: spatial consistency in navigation scenes, action
      adherence in driving rollouts, physical plausibility in robot videos, and planning
      realism in motion simulation.'
    - 'Representation differs: recurrent state-space world models, multi-view diffusion
      transformers, frame-level autoregressive generators, and plug-in modules over
      pre-trained generators.'
    - 'Supervision differs: physics-informed joint objectives, motion-reinforced losses,
      scene graph consistency scores, and paired trajectory-video data.'
    - 'Interaction and deployment setting differs: offline benchmarking, open-world
      Minecraft navigation, nuScenes-based driving simulation, robotic video synthesis,
      and real-time single-GPU closed-loop simulation.'
    open_questions:
    - How well do spatial consistency or action fidelity metrics predict closed-loop
      policy performance outside their original datasets?
    - Can autoregressive world models maintain geometric and temporal consistency
      over much longer rollouts and unseen driving or robotics distributions?
    - What are the concrete trade-offs between visual fidelity, physical plausibility,
      and sub-second latency under constrained compute?
    - When context is latent or partially observed, does conditioning remain useful,
      or does it degrade in the same way as unconditioned dynamics models?
    - Independent reproduction across teams, sensors, and infrastructure is not yet
      demonstrated for most high-ranking systems.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评测基准与数据集
      解决的问题: 为生成轨迹中的空间一致性、动作忠实度和场景真实感提供可复用的测试。
      尚未覆盖: 跨环境、传感器和下游策略的指标有效性及基线可比性仍然有限。
    - 路线: 面向驾驶与具身控制的动作可控视频世界模拟器
      解决的问题: 将视觉生成模型转化为以轨迹、动作或目标为条件的未来状态预测器，用于仿真和规划。
      尚未覆盖: 除已报告数据集外，长时程多视图一致性、物理合理性和实时部署仍不明确。
    - 路线: 物理信息与上下文条件世界模型
      解决的问题: 将物理或上下文知识注入动力学学习，以改善零样本泛化和想象轨迹的合理性。
      尚未覆盖: 方法通常假设上下文可观测或依赖物理先验，且仅在较窄任务集上评测，隐式上下文和跨域迁移尚不明确。
    - 路线: 端到端可运行模拟与部署流水线
      解决的问题: 将数据集、训练、推理和评估打包为开放框架或低延迟系统，服务下游使用。
      尚未覆盖: 独立复现、硬件或传感器变化、长序列扩展和多GPU部署尚未得到验证。
    共识:
    - 未来视频或状态生成被视为一种可控世界模拟器能力，在驾驶、机器人和游戏化导航等场景中共享。
    - 动作、轨迹、目标或上下文等条件信号被用于让生成预测服务于下游控制或仿真。
    - 评估不只依赖样本真实感，还结合动力学质量或任务导向指标。
    - 数据集、基准或可运行基线等可用工件是反复出现的贡献模式。
    分歧:
    - 评测目标不同：导航场景的空间一致性、驾驶推演中的动作遵循、机器人视频中的物理合理性和运动仿真中的规划真实感。
    - 表示方式不同：循环状态空间模型、多视图扩散Transformer、帧级自回归生成器和预训练生成器上的可插拔模块。
    - 监督信号不同：物理信息联合目标、运动增强损失、场景图一致性分数和轨迹-视频配对数据。
    - 交互与部署设置不同：离线基准测试、Minecraft开放世界导航、nuScenes驾驶仿真、机器人视频合成和实时单GPU闭环仿真。
    开放问题:
    - 空间一致性或动作忠实度指标能否在原始数据集之外预测闭环策略性能？
    - 自回归世界模型在更长的推演和未见驾驶或机器人分布上能否保持几何与时间一致性？
    - 视觉保真度、物理合理性与亚秒级延迟在有限算力下的具体权衡是什么？
    - 当上下文是隐式或部分可观测时，上下文条件是否仍然有效，还是会退化为无条件动力学模型？
    - 大多数高排名系统尚未在跨团队、跨传感器和跨基础设施条件下进行独立复现验证。
