  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video generation world models
    for robotic manipulation, with growing emphasis on aligning outputs to physical
    realism and task logic.'
  - 'Shared research pattern: Using diffusion or autoregressive models to fuse action
    and visual observation, generating future frames as state predictions under a
    world model that can serve as a differentiable simulator.'
  - 'Key differences: Action injection architecture (unified diffusion, frame-level
    conditioning, adapter masks), training paradigm (pretraining vs. post-training
    alignment), and evaluation target (visual fidelity, policy learning, planning,
    or physical plausibility).'
  - 'Trend evolution: From video generation as a standalone capability, to action-conditioned
    world models, to post-training alignment with physics and human preferences, and
    toward functional benchmarks that test persistence and causality.'
  - 'Open questions: How to construct explicit state representations that match classical
    world model theory, design benchmarks that measure causal reasoning and physical
    consistency, and ensure generalization across unseen embodiments and tasks.'
  related_work_outline_zh:
  - 主流方向：构建动作条件化的视频生成世界模型，用于机器人操作，并逐步强调与物理真实性和任务逻辑对齐。
  - 研究共性：利用扩散或自回归模型融合动作与视觉观测，生成未来帧作为世界模型的状态预测，充当可微分模拟器。
  - 关键差异：动作注入方式（统一扩散、帧级条件、适配器掩码）、训练范式（预训练 vs 后训练对齐）以及评测目标（视觉保真度、策略学习、规划或物理合理性）不同。
  - 趋势演进：从独立视频生成能力，到动作条件化世界模型，再到物理与人类偏好对齐的后训练，并转向测试持久性和因果性的功能基准。
  - 开放问题：如何构建与经典世界模型理论匹配的显式状态表示，设计衡量因果推理与物理一致性的基准，以及确保在未见本体和任务上的泛化。
  literature_review:
    line_of_work_matrix:
    - line: Conceptual frameworks and taxonomies for world models
      what_it_solves: Organizes the relationship between video generation and world
        models by proposing categories such as state construction (implicit vs. explicit)
        and dynamics modeling, clarifying what a world model must represent.
      what_remains_open: The taxonomy remains descriptive; it is not yet validated
        by changes in model design or evaluation, and functional benchmarks for physical
        persistence and causal reasoning are advocated but not yet adopted.
    - line: Unified action-video generation architectures
      what_it_solves: Creates a flexible world model that can represent policy, forward
        dynamics, inverse dynamics, or video generation by coupling action and video
        diffusion within a single transformer, supporting pretraining on large robot
        datasets.
      what_remains_open: The approach assumes that video-based generation suffices
        for policy learning; the gap between generated video and real-world physics,
        and the need for explicit state representations, are not directly addressed.
    - line: Alignment of world models to physical realism
      what_it_solves: Improves physical plausibility and task consistency of generated
        rollouts by injecting human preferences or physics-based discriminators via
        post-training (RL or DPO), reducing artifacts and unphysical behaviors.
      what_remains_open: Alignment relies on human preference data or pre-defined
        physics checks, which may not cover all failure modes; generalization beyond
        contact-rich manipulation tasks is unverified.
    - line: Test-time verification and scaling for world models
      what_it_solves: Examines whether test-time compute can improve spatial reasoning
        by selecting action-conditioned trajectories using verifiers, exposing calibration
        and bias issues in current world models.
      what_remains_open: None of the verifiers achieve consistent scaling on harder
        benchmarks, revealing an information bottleneck; the findings are limited
        to two spatial reasoning datasets and do not guarantee the same patterns in
        other domains.
    consensus:
    - World models are expected to generate future observations conditioned on actions,
      enabling decision-making, planning, or policy evaluation.
    - Video generation models (diffusion or autoregressive) are the dominant backbone
      for building such world models.
    - Current evaluation metrics focused on visual fidelity are insufficient to capture
      functional world model qualities like physical consistency and causal reasoning.
    - Action conditioning is necessary to turn a video generator into a world model,
      and multiple architectural choices exist for injecting actions.
    disagreements:
    - Whether a world model should be trained end-to-end with action and video from
      scratch, adapted from a pretrained video model without accessing parameters,
      or post-trained with alignment objectives.
    - Whether the evaluation target should be video quality, policy learning performance,
      planning accuracy, or physical plausibility—each paper emphasizes different
      dimensions.
    - 'The precise mechanism for action injection: some use a unified diffusion process
      with independent timesteps, others use frame-level conditioning modules, and
      others use learned masks on frozen intermediate features.'
    - 'The role of human preferences: some works explicitly align with human judgment
      via reward models, while others rely on self-supervised signals or physics-based
      heuristics.'
    open_questions:
    - How can explicit state representations be extracted from video generation models
      to satisfy classical world model definitions and improve long-term consistency?
    - What benchmarks can reliably measure causal reasoning and physical persistence
      in world models, and how can they be adopted as standard evaluation?
    - Under what conditions do world models trained on specific robot datasets generalize
      to unseen embodiments, tasks, or physical environments, and what are the theoretical
      limits?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的概念框架与分类
      解决的问题: 通过提出状态构建（隐式/显式）和动态建模等类别，组织视频生成与世界模型之间的关系，澄清世界模型必须表示什么。
      尚未覆盖: 分类法仍属描述性，尚未通过模型设计或评测的改变得到验证；所倡导的物理持久性和因果推理功能基准尚未被采用。
    - 路线: 统一动作-视频生成架构
      解决的问题: 在单一Transformer中耦合动作与视频扩散，灵活表示策略、前向动力学、逆动力学或视频生成，支持在大规模机器人数据集上预训练。
      尚未覆盖: 假设基于视频的生成足以支持策略学习；生成视频与真实物理之间的差距以及显式状态表示的需求未直接解决。
    - 路线: 世界模型与物理真实性的对齐
      解决的问题: 通过注入人类偏好或基于物理的判别器，利用后训练（RL或DPO）提升生成轨迹的物理合理性和任务一致性，减少伪影和非物理行为。
      尚未覆盖: 对齐依赖人类偏好数据或预定义的物理检查，可能无法覆盖所有失败模式；在接触丰富操作任务之外的泛化性未经验证。
    - 路线: 世界模型的测试时验证与缩放
      解决的问题: 考察测试时计算是否能通过验证器选择动作条件轨迹来改善空间推理，揭示当前世界模型的校准和偏差问题。
      尚未覆盖: 在更难的基准上没有一个验证器实现一致的缩放，暴露了信息瓶颈；发现仅限于两个空间推理数据集，不保证在其他领域适用。
    共识:
    - 世界模型应能根据动作生成未来观测，从而支持决策、规划或策略评估。
    - 视频生成模型（扩散或自回归）是构建此类世界模型的主要骨干。
    - 当前侧重于视觉保真度的评估指标不足以衡量物理一致性和因果推理等功能性世界模型品质。
    - 动作条件化是将视频生成器转变为世界模型的必要条件，且存在多种注入动作的架构选择。
    分歧:
    - 世界模型应从头端到端训练动作与视频，还是从预训练视频模型适配而无需访问参数，亦或通过后训练对齐目标微调。
    - 评测目标应聚焦视频质量、策略学习性能、规划精度还是物理合理性，各论文强调的维度不同。
