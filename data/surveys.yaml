  related_work_outline:
  - 'Mainstream direction: The strongest evidence clusters around world-model surveys
    and methods, especially for video generation, robot learning, and autonomous driving;
    survey work is shifting from broad overviews to unified taxonomies and evaluation
    frameworks.'
  - 'Shared research pattern: Papers organize fragmented methods by latent representations
    or structural priors, then emphasize generalization, temporal consistency, controllability,
    and evaluation mismatch as recurring axes.'
  - 'Key differences: Representation choices vary between continuous latent states,
    discrete or hybrid designs, and explicit global/3D state; supervision and evaluation
    settings also differ across physical robots, driving simulation, and generated-video
    tasks.'
  - 'Trend evolution: The evidence moves from 2022 physical-robot world-model learning
    toward 2024 general surveys and compositional video generation, then 2025-2026
    persistent out-of-sight dynamics, open-source real-time simulation, and formal
    evaluation frameworks.'
  - 'Open questions: Whether taxonomies are based on systematic evidence, whether
    results are comparable across settings, how visual or latent realism connects
    to closed-loop decisions, and which gaps deserve priority.'
  related_work_outline_zh:
  - 主流方向：证据中的高相关文献集中于世界模型综述与方法，尤其围绕视频生成、机器人学习和自动驾驶，并转向统一分类法与评测框架。
  - 研究共性：论文按潜在表示或结构先验整理碎片化方法，反复关注泛化、时间一致性、可控性和评测不匹配。
  - 关键差异：表示选择不同，如连续潜在、离散或混合设计，以及显式全局或三维状态；监督信号和评测设置也因物理机器人、驾驶仿真和生成视频任务而异。
  - 趋势演进：从2022年物理机器人世界模型学习，到2024年通用综述与组合视频生成，再到2025-2026年视线外动态、开源实时仿真和正式评测框架。
  - 开放问题：分类法是否由系统证据支撑，各设置下的结果是否可比较，视觉或潜在真实感如何关联闭环决策，以及哪些缺口值得优先解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Mapping fragmented world-model literature into design-space
        directions, milestones, and open gaps.
      what_remains_open: Whether the synthesis is backed by systematic inclusion criteria
        and empirical validation rather than selective examples.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices affect conclusions
        across world-model papers, such as open-loop/closed-loop or simulation/real
        settings.
      what_remains_open: Whether reported results are compatible across datasets,
        metrics, horizons, and training settings.
    - line: Open problem and gap mapping
      what_it_solves: Turning broad literature coverage into concrete next questions
        on generalization, persistence, controllability, and resource cost.
      what_remains_open: Prioritization of which gaps matter most, and whether proposed
        evaluation suites are actionable.
    consensus:
    - World-model research is treated as a unifying frame for video generation, embodied
      control, and driving simulation.
    - Latent or generative world models are expected to provide temporal consistency,
      long-horizon memory, and controllable generation.
    - Evaluation gaps exist between open-loop generation, closed-loop behavior, and
      physical deployment, motivating unified metrics and benchmarks.
    disagreements:
    - 'Representation differs: some work uses continuous latent states or hybrid token-latent
      designs, while other work uses explicit 3D/global state or compositional primitives.'
    - 'Supervision and control signals differ: language and goal-image decomposition,
      ego-trajectory and human pose, destination and personality, or sparse robot
      rewards.'
    - 'Evaluation targets differ: physical robot learning without simulators, simulated
      robot execution, driving motion prediction, and generated-video benchmarks are
      not directly interchangeable.'
    - 'Interaction and deployment settings differ: offline surveys, real-time interactive
      simulators, and online physical learning emphasize different capabilities.'
    open_questions:
    - Do existing taxonomies emerge from systematic literature screening, or are they
      conceptual maps built from selected examples?
    - Are world-model evaluations comparable across physical robots, driving simulators,
      and video generators when metrics, datasets, and horizons differ?
    - What evidence connects improved visual realism or latent state structure to
      better closed-loop decision-making?
    - Which gaps should be prioritized among persistent out-of-sight dynamics, real-world
      transfer, and resource-aware evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型文献整理为设计空间方向、里程碑和研究缺口。
      尚未覆盖: 综合是否由系统纳入标准和实证验证支撑，而不是选择性举例。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择如何影响世界模型论文的结论，例如开环/闭环或仿真/真实设置。
      尚未覆盖: 报告结果在数据集、指标、时间跨度和训练设置之间是否真正兼容。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为泛化、持久性、可控性和资源成本方面的具体研究问题。
      尚未覆盖: 哪些缺口最值得优先解决，以及所提评测套件是否可操作。
    共识:
    - 世界模型研究正被作为统一框架，用于视频生成、具身控制与驾驶仿真。
    - 潜在或生成式世界模型需要具备时间一致性、长时记忆和可控生成。
    - 开环生成、闭环行为与物理部署之间存在评测缺口，并呼吁统一指标和基准。
    分歧:
    - 表示方式不同：有的采用连续潜在状态或混合令牌设计，有的采用显式三维全局状态或组合原语。
    - 监督与控制信号不同：语言与目标图像分解、自我轨迹与人体姿态、目的地与个性、稀疏机器人奖励等并存。
    - 评测目标不同：无模拟器的物理机器人学习、仿真机器人执行、驾驶运动预测与生成视频基准之间难以直接比较。
    - 交互或部署设置不同：离线综述、实时交互模拟器和在线物理学习各自强调不同能力。
    开放问题:
    - 现有分类法是否来自系统文献筛选，还是仅基于选择性例子构建的概念图？
    - 当指标、数据集和时间跨度不同时，物理机器人、驾驶模拟器和视频生成的世界模型评测是否真正可比较？
    - 什么证据能把视觉真实感或潜在状态结构的改进与更好的闭环决策联系起来？
    - 在持久视线外动态、真实世界迁移和资源感知评测中，哪些缺口应被优先解决？
