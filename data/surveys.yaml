  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world-model simulation and closed-loop serving
      what_it_solves: Generates future video rollouts conditioned on actions or intentions
        for driving and manipulation, supporting policy training or evaluation without
        ground-truth future frames.
      what_remains_open: Consistency over long horizons and across sensors or environments
        remains uncertain; latency and scalability beyond single-GPU or nuScenes-style
        settings are only partially shown.
    - line: Context- and physics-conditioned world-model learning
      what_it_solves: Incorporates observable context or physical signals such as
        depth and keypoints into latent dynamics to improve zero-shot generalization
        or physical plausibility of rollouts.
      what_remains_open: Assumes observable context values or task-specific physical
        structure; evidence is limited to CARL tasks, robotic video generation, and
        cross-robot manipulation benchmarks.
    - line: Online world-model reinforcement learning deployed on physical robots
      what_it_solves: Learns behaviors directly on hardware from camera images and
        sparse rewards, avoiding simulator transfer and enabling fast adaptation.
      what_remains_open: Only a small set of robot platforms is evaluated with fixed
        hyperparameters; access barriers and hardware-specific tuning make cross-team
        generalization unclear.
    - line: Open benchmarks and reproducibility artifacts for consistency or action
        fidelity
      what_it_solves: Provides datasets, metrics, and baseline models to make spatial
        consistency and action fidelity measurable and comparable.
      what_remains_open: Coverage is limited to selected environments such as Minecraft
        and nuScenes; independent replication across teams and infrastructure is not
        reported.
    consensus:
    - Future-state generation is not just about visual realism; predictions must remain
      consistent with actions, context, or physical constraints to be useful in closed-loop
      or downstream decision systems.
    - Evaluation increasingly combines generation metrics with task-relevant measures
      such as action fidelity, spatial consistency, physical plausibility, or downstream
      policy performance.
    - Open code, datasets, and benchmark artifacts are treated as important for comparability,
      though the available reproducibility evidence remains incomplete.
    disagreements:
    - Deployment setting separates physical robot online learning from simulation-heavy
      driving and manipulation rollouts, changing the required interaction mode and
      infrastructure.
    - 'Representation and supervision differ: some systems condition recurrent state-space
      latent dynamics on observable context, while others use diffusion transformers,
      latent increment learning, or physics-informed video/depth/keypoint objectives.'
    - 'Evaluation target differs: one direction scores spatial consistency through
      loop navigation, another measures action fidelity, and others optimize visual
      fidelity plus downstream policy utility or physical plausibility.'
    - 'Control abstraction differs: some use high-level intentions and low-level trajectories,
      while others use per-step navigation actions, observable context values, or
      robot actions.'
    open_questions:
    - Can action-controllable simulators maintain geometrically and temporally consistent
      rollouts when sensors, camera layouts, environments, or robot embodiments shift
      away from the evaluated datasets?
    - What is the upper bound on long-horizon closed-loop prediction without ground-truth
      resets, especially for multi-camera driving or extended manipulation?
    - How can physical robot world-model learning move beyond a small set of fixed
      hardware and hyperparameters to robust cross-team deployment?
    - Which reported benchmarks or datasets have been independently reproduced across
      different teams and infrastructure, and what failure modes emerge under such
      replication?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控世界模型模拟与闭环服务
      解决的问题: 根据动作或意图生成未来视频推演，用于驾驶和操作场景中的策略训练或评估。
      尚未覆盖: 长时域及跨传感器/环境的稳定性未充分验证；单GPU之外的延迟与可扩展性证据有限。
    - 路线: 上下文与物理条件化的世界模型学习
      解决的问题: 将可观测上下文或深度、关键点等物理信号引入潜在动力学，以提升零样本泛化或物理合理性。
      尚未覆盖: 依赖可观测上下文或特定物理任务；证据集中于CARL、机器人视频生成和跨机器人操作数据。
    - 路线: 部署在物理机器人上的在线世界模型强化学习
      解决的问题: 直接利用相机图像和稀疏奖励在真实硬件上学习行为，避免仿真迁移并支持快速适应。
      尚未覆盖: 仅评估少量机器人平台且超参数固定；硬件门槛和平台特异性使跨团队泛化尚不明确。
    - 路线: 一致性与动作忠实度的开放基准和可复现工件
      解决的问题: 通过数据集、指标和基线模型使空间一致性和动作忠实度可量化、可比较。
      尚未覆盖: 环境覆盖多限于Minecraft与nuScenes；独立团队与不同基础设施上的复现未报告。
    共识:
    - 研究普遍认为未来状态生成不能只看视觉真实感，预测必须与动作、上下文或物理约束保持一致，才能用于闭环或下游决策系统。
    - 评测开始同时结合生成指标和任务相关度量，如动作忠实度、空间一致性、物理合理性或下游策略性能。
    - 开放代码、数据集或基准工件被视为可比较性的重要基础，但当前可复现证据仍不完整。
    分歧:
    - 部署场景不同，涉及物理机器人在线学习、驾驶模拟和操作视频生成，因而交互模式与基础设施需求不同。
    - 表示与监督信号不同：有的是可观测上下文条件化的循环状态空间模型，有的是扩散Transformer、潜在增量学习或物理信息联合训练。
    - 评测目标不同：分别强调空间一致性、动作忠实度、视觉保真度加下游策略效用或物理合理性。
    - 控制抽象层级不同：有的使用高层意图和低层轨迹，有的使用逐步动作或可观测上下文值。
    开放问题:
    - 当传感器、相机布局、环境或机器人本体偏离已评估数据集时，动作可控模拟器能否保持几何和时序一致的推演？
    - 在无真实重置下，长时域闭环预测的稳定性上限，尤其是多相机驾驶或长时段操作场景，尚不清楚。
    - 物理机器人世界模型学习能否从少量固定硬件和固定超参数扩展到稳健的跨团队部署？
    - 现有基准或数据集在多大程度上经过不同团队和基础设施的独立复现，复现中会暴露哪些失效模式？
