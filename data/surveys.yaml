  related_work_outline:
  - 'Mainstream direction: Benchmark-driven evaluation of world models, with datasets
    and metrics targeting spatial consistency, memory consistency, action control,
    and zero-shot generalization; generative world models are validated on Atari 100k,
    driving, and robotic video benchmarks.'
  - 'Shared research pattern: Work constructs or reuses loop-based navigation, video-action,
    and rollout suites, then evaluates consistency and control properties beyond single-frame
    pixel quality; policy utility and visual fidelity are reported through common
    metrics.'
  - 'Key differences: Models differ in representation and generation, including discrete
    stochastic VAE-Transformer, pixel diffusion, physics-informed depth/keypoint losses,
    and action-video coupling; evaluation targets differ across spatial consistency,
    memory/action control, zero-shot generalization, and visual/physical plausibility.'
  - 'Trend evolution: From efficient stochastic world models on Atari 100k around
    2023, the evidence moves toward diffusion/context/physics-informed models in 2024-2025,
    then toward dedicated spatial, memory, and action-control benchmarks in 2025-2026.'
  - 'Open questions: Long-term consistency, cross-action-space generalization, proxy
    metric alignment with downstream decisions, observable-context assumptions, limited
    task coverage, and reproducibility remain open; missing limitation or metric details
    are verification gaps.'
  related_work_outline_zh:
  - 主流方向：以世界模型能力验证为中心，构建并复用基准数据集和指标，重点评估空间一致性、记忆一致性、动作控制、零样本泛化与视频/策略效用；生成式方法在 Atari
    100k、驾驶和机器人视频基准上验证。
  - 研究共性：不再只看单帧像素质量，而是构建回环/闭环导航或视频-动作数据，使用一致性、控制和下游策略指标进行系统比较。
  - 关键差异：模型表示与生成路径不同，包括离散随机 VAE-Transformer、像素扩散、物理信息深度/关键点损失、动作-视频耦合扩散；评测目标与监督信号也不同。
  - 趋势演进：从 2023 年高效随机世界模型在 Atari 100k 上的成绩，转向 2024-2025 年扩散/上下文/物理信息模型，再到 2025-2026
    年专门的空间、记忆与动作控制基准。
  - 开放问题：长期一致性、跨动作空间泛化、代理指标与下游决策对齐、上下文可观测假设、任务覆盖与可复现性仍是证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared loop-based navigation and first/third-person
        video-action suites to compare spatial, memory, and action-control properties
        of world models.
      what_remains_open: Coverage is narrow relative to real-world driving, manipulation,
        or open-domain environments; some dataset papers lack visible experimental
        baselines.
    - line: Metric and stress-test design
      what_it_solves: Introduces consistency and control metrics such as scene-graph
        consistency and memory/action-control evaluation beyond pixel-level reconstruction.
      what_remains_open: Evidence that these proxy metrics align with downstream policy
        success or human judgments is missing; sensitivity to implementation details
        is unverified.
    - line: Standardized benchmark evaluation
      what_it_solves: Uses shared suites such as Atari 100k, CARL, NuScenes/OpenDV-2K/Waymo,
        and robotic video data to compare generation quality and policy utility.
      what_remains_open: Many findings are limited to two or a few tasks; implementation/compute
        stability and leaderboard reproducibility are not established.
    - line: Generative world-model architecture with benchmark validation
      what_it_solves: Combines VAE, Transformer, diffusion, context conditioning,
        or physics-informed losses to improve visual detail, stochastic dynamics,
        zero-shot generalization, or physical plausibility.
      what_remains_open: Most entries omit limitations; visual fidelity claims are
        not consistently tied to downstream decision quality.
    - line: Unified action-video pretraining
      what_it_solves: Couples action and video diffusion for policy, forward/inverse
        dynamics, and generation from large robot datasets, including action-free
        video pretraining.
      what_remains_open: Cross-action-space and cross-embodiment generalization remain
        unresolved; visible evidence provides scarce metric details.
    consensus:
    - Evaluations are moving toward measuring properties such as spatial consistency,
      memory consistency, action control, and zero-sample generalization rather than
      only pixel-level prediction quality.
    - Shared benchmark suites and datasets are treated as necessary for comparable
      world-model claims, with common metrics and baseline comparisons.
    - Generative architectures based on Transformers and diffusion are consistently
      used to improve visual detail and long-horizon or multi-view predictions.
    - Several works emphasize agent or policy utility, using world-model rollouts
      for training or evaluation.
    disagreements:
    - 'Evaluation target differs: some stress-test spatial loop consistency, while
      others test memory/action control, zero-sample generalization, or visual/physical
      plausibility.'
    - 'World-model representation differs: discrete stochastic VAE-Transformer, pixel
      diffusion, physics-informed depth/keypoint losses, or coupled vision-action
      diffusion.'
    - 'Supervision and pretraining signals differ: mask reconstruction, context conditioning,
      physics auxiliary tasks, action-video diffusion, or imitation-free video pretraining.'
    - 'Deployment settings differ: Atari/game, Minecraft navigation, driving, and
      robotic manipulation lead to different data formats and action spaces.'
    open_questions:
    - How well do loop-based or video-based consistency metrics predict downstream
      policy success in non-simulated, long-horizon settings?
    - Can context-conditioned world models move beyond the limited CARL tasks and
      observable-context assumption to partially observed contexts?
    - What is the cross-action-space generalization boundary for memory/action-control
      benchmarks and unified action-video models?
    - Are leaderboard conclusions stable across different implementations, compute
      budgets, and missing baseline or limitation details?
    - How should physical plausibility be measured in a comparable way across embodied
      benchmarks when current evidence reports visual fidelity but often lacks metric
      details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建回环导航和第一/第三人称视频-动作套件，用于比较世界模型的空间、记忆与动作控制特性。
      尚未覆盖: 相对真实驾驶、操控或开放域环境覆盖较窄；部分数据集论文未在可见证据中报告实验基线。
    - 路线: 指标与压力测试设计
      解决的问题: 引入场景图一致性、记忆一致性和动作控制等指标，超越像素级重建来检验稳定性与控制能力。
      尚未覆盖: 缺乏这些代理指标与下游策略成功或人类判断对齐的证据；对实现细节的敏感性未验证。
    - 路线: 标准化基准评测
      解决的问题: 使用 Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo 和机器人视频等共享套件比较生成质量与策略效用。
      尚未覆盖: 许多结论仅限两个或少数任务；实现与算力预算下的稳定性及排行榜可复现性尚未建立。
    - 路线: 生成式世界模型架构与基准验证
      解决的问题: 结合 VAE、Transformer、扩散、上下文条件或物理信息损失，改善视觉细节、随机动力学、零样本泛化或物理合理性。
      尚未覆盖: 多数条目未呈现限制；视觉保真度声明未始终与下游决策质量绑定。
    - 路线: 统一动作-视频预训练
      解决的问题: 在统一 Transformer 中耦合动作与视频扩散，用于策略、正向/逆向动力学和生成，并能利用无动作视频数据。
      尚未覆盖: 跨动作空间与跨实施例泛化仍未解决；可见证据中指标细节不足。
    共识:
    - 评估正在转向测量空间一致性、记忆一致性、动作控制和零样本泛化等特性，而非仅看像素级预测质量。
    - 共享基准套件和数据集被视为实现世界模型主张可比较性的必要条件，并配以共同基线和指标。
    - 基于 Transformer 和扩散的生成式架构被反复用于改善视觉细节、长时域或多视角预测。
    - 多项研究强调智能体或策略效用，利用世界模型展开进行训练或评估。
    分歧:
    - 评测目标不同：有的压力测试空间回环一致性，有的测试记忆/动作控制、零样本泛化或视觉/物理合理性。
    - 世界模型表示不同：离散随机 VAE-Transformer、像素扩散、物理信息深度/关键点损失或动作-视频耦合扩散。
    - 监督与预训练信号不同：掩码重建、上下文条件、物理辅助任务、动作-视频扩散或免模仿的视频预训练。
    - 部署场景不同：Atari/游戏、Minecraft 导航、驾驶和机器人操作导致不同数据格式和动作空间。
    开放问题:
    - 回环或视频一致性指标在非仿真、长时域环境中对下游策略成功的预测力有多强？
    - 上下文条件世界模型能否在部分可观测上下文中超越有限的 CARL 任务和可观测上下文假设？
    - 记忆/动作控制基准与统一动作-视频模型的跨动作空间泛化边界在哪里？
    - 在实现、算力预算和缺失的基线或限制细节影响下，排行榜结论是否稳定？
    - 当前证据报告视觉保真度但常缺指标细节，如何可比较地测量物理合理性？
