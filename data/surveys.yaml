  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving, robotics, and
    interactive environments, with a strong focus on generative video prediction and
    dynamics learning as the backbone for downstream policy training or evaluation.'
  - 'Shared research pattern: Adopting generative architectures (diffusion, transformers,
    VAEs) to model environment dynamics from high-dimensional sensory inputs, often
    coupled with task-specific conditioning (language, action, context) and evaluated
    via rollout quality or downstream task performance.'
  - 'Key differences: Domains span driving, robotic manipulation, and game environments;
    representations range from pixel-space video generation to recurrent state-space
    models; supervision signals include pure video, action labels, context variables,
    and physics priors; generalization targets vary from zero-shot dynamics transfer
    to compositional generalization of primitives.'
  - 'Trend evolution: The frontier has shifted from efficient RL world models on Atari
    (2023) toward large-scale pretraining, physics-informed generation, and unified
    video-action frameworks for robotics (2024–2025), accompanied by the emergence
    of dedicated benchmarks for spatial consistency and memory-action control (2025–2026).'
  - 'Open questions: How well do improvements in simulation fidelity and benchmark
    scores translate to real-world safety and task success; can long-horizon memory
    consistency be maintained across diverse action spaces; and what is the minimal
    supervision needed for robust cross-domain transfer.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人、交互环境的领域世界模型，核心是通过生成式视频预测和动力学学习支撑下游策略训练或评测。
  - 研究共性：采用生成式架构（扩散、Transformer、VAE）从高维感官输入中建模环境动态，常结合任务特定条件（语言、动作、上下文），并通过生成质量或下游任务性能进行评估。
  - 关键差异：领域涵盖驾驶、机器人操作和游戏环境；表示方式从像素空间视频生成到循环状态空间模型；监督信号包括纯视频、动作标签、上下文变量和物理先验；泛化目标从零样本动力学迁移到原语的组合泛化。
  - 趋势演进：前沿从2023年Atari高效RL世界模型，转向2024–2025年面向机器人的大规模预训练、物理信息生成和统一视频-动作框架，并伴随2025–2026年空间一致性和记忆-动作控制专用基准的出现。
  - 开放问题：仿真保真度和基准得分的提升在多大程度上转化为真实世界的安全性与任务成功率；长时域记忆一致性能否在多样化动作空间中保持；以及实现鲁棒跨域迁移所需的最小监督信号是什么。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotic and context-dependent RL tasks
        by learning latent dynamics, video generation, or unified video-action representations,
        aiming for zero-shot or compositional generalization.
      what_remains_open: Cross-embodiment and cross-dataset transfer remains unverified;
        evaluations are limited to simulated settings or narrow benchmark suites;
        the assumption of observable context variables (e.g., cRSSM) may not hold
        in real-world deployments.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Building world models for multi-view, long-horizon video prediction
        in driving scenes, enabling closed-loop simulation and policy evaluation without
        real-world interaction.
      what_remains_open: Alignment between simulation-based metrics and real-world
        driving safety or operational outcomes is not established; generalization
        to new sensor setups or geographical domains is not yet demonstrated.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments (Atari, Minecraft,
        open-domain navigation) to learn efficient policies from few interactions
        or to benchmark spatial and memory consistency.
      what_remains_open: Generalization when environment rules, goals, or action spaces
        change is poorly understood; long-term memory consistency and action control
        across varied viewpoints and action spaces remain challenging.
    consensus:
    - World models are predominantly built as generative models (diffusion, transformers,
      or recurrent VAEs) that predict future sensory observations.
    - Downstream utility is demonstrated through policy learning inside the model's
      imagination or through benchmark metrics for video fidelity and consistency.
    - Self-supervised or offline pretraining on large-scale datasets is a common strategy
      to improve generalization and data efficiency.
    - Evaluation practices increasingly include dedicated benchmarks that test specific
      world-model capabilities such as memory, action control, and spatial consistency.
    disagreements:
    - 'Representation level: pixel-space video generation (MaskGWM, RoboDreamer, RoboScape)
      vs. latent state-space dynamics (cRSSM, STORM).'
    - 'Supervision signal: purely video-based (MaskGWM, RoboDreamer) vs. joint video-action
      (UWM) vs. context-conditioned (cRSSM) vs. physics-informed (RoboScape).'
    - 'Generalization target: zero-shot transfer to unseen dynamics (cRSSM) vs. compositional
      generalization of primitives (RoboDreamer) vs. cross-action-space and memory
      consistency (MIND, LoopNav).'
    - 'Interaction mode: world models used for behavior policy training (STORM, UWM)
      vs. world models as open-loop video predictors for evaluation or planning (MaskGWM,
      RoboScape).'
    - 'Deployment domain: autonomous driving (MaskGWM) vs. robotic manipulation (RoboDreamer,
      RoboScape, UWM) vs. game and navigation benchmarks (STORM, LoopNav, MIND).'
    open_questions:
    - What evidence connects improved benchmark scores on spatial consistency or memory
      to real-world robot or driving task success?
    - Can world models that are pretrained on diverse robot datasets transfer to new
      embodiments or physical environments without finetuning?
    - How do physics-informed world models (e.g., RoboScape) compare with purely data-driven
      approaches in terms of physical plausibility and downstream policy robustness?
    - What are the minimal supervision requirements for world models to achieve robust
      long-horizon memory consistency across varying action spaces?
