  - 'Key differences: Simulation goals diverge across visual fidelity, physical plausibility,
    action fidelity, and zero-shot generalization; architectures range from diffusion
    transformers to Dreamer-style recurrent models; evaluation domains are fragmented.'
  - 'Trend evolution: From 2024–2026, the focus shifts from open-loop video generation
    to closed-loop, interactive simulators that prioritize low-latency serving, long-horizon
    consistency, and physics integration, with a growing emphasis on standardized
    benchmarks.'
  - 'Open questions: Cross-domain generalization and robustness to out-of-distribution
    dynamics remain largely unverified; independent reproducibility across teams and
    hardware is still rare; the trade-off between real-time interactivity and model
    complexity lacks systematic study.'
  related_work_outline_zh:
  - 主流方向：构建以世界模型为核心的可控交互式模拟器，用于自动驾驶、机器人及开放世界环境，重点关注动作条件视频生成、物理信息驱动动力学和闭环评估。
  - 研究共性：多数工作将生成式视频骨干与显式控制机制（动作、上下文、地图）结合，并发布代码、数据集或基准，以构建可复现的系统级流水线。
  - 关键差异：模拟目标在视觉保真度、物理合理性、动作保真度和零样本泛化之间分化；架构从扩散Transformer到Dreamer式循环模型不等；评估领域碎片化。
  - 趋势演进：2024至2026年，重心从开环视频生成转向闭环交互式模拟器，优先考虑低延迟服务、长时域一致性和物理集成，并越来越重视标准化基准。
  - 开放问题：跨领域泛化及对分布外动力学的鲁棒性尚未充分验证；跨团队和硬件的独立复现仍然稀缺；实时交互性与模型复杂度之间的权衡缺乏系统研究。
  literature_review:
    line_of_work_matrix:
    - line: Adapting pre-trained video generative models into action-controllable
        world simulators
      what_it_solves: Leverages large-scale pre-trained video models to create controllable
        simulators without training from scratch, enabling action-visual alignment
        for dynamic simulation.
      what_remains_open: The lightweight action-conditioned modules may have limited
        capacity in specialized domains; long-term consistency, out-of-distribution
        generalization, and physical realism verification are still insufficient.
    - line: Closed-loop simulation systems for autonomous driving
      what_it_solves: Builds high-fidelity, multi-view, low-latency driving world
        models that support closed-loop evaluation and policy training, improving
        action fidelity and geometric consistency.
      what_remains_open: Generalization across datasets and sensor setups is not demonstrated;
        temporal and cross-view consistency degrades over very long sequences; scalability
        to multi-GPU real-time deployment is unaddressed.
    - line: Evaluation benchmarks and reproducible frameworks
      what_it_solves: Provides standardized datasets, metrics, and open-source tools
        to quantify key properties like spatial consistency and action fidelity, facilitating
        reproducible research.
      what_remains_open: Most benchmarks are tied to specific environments (e.g.,
        Minecraft, nuScenes) and lack cross-domain generalization evaluation; independent
        reproduction across teams and infrastructure remains rare.
    - line: Embodied physics-informed world models
      what_it_solves: Incorporates physical priors (e.g., depth, keypoint dynamics)
        into video generation to improve visual fidelity and physical plausibility
        for robotic scenarios, supporting policy training and evaluation.
      what_remains_open: Physical properties are implicitly encoded, and validation
        of real physical interactions is limited; generalization to unseen objects
        and complex contacts is unknown.
    - line: Contextual world models for zero-shot generalization
      what_it_solves: Explicitly conditions world model latent states and dynamics
        on observable context values (e.g., mass, dimensions) to achieve zero-shot
        generalization to unseen dynamics.
      what_remains_open: Requires observable context, which is often unavailable in
        real-world settings; validated on only a small number of tasks from a single
        benchmark suite, leaving broader applicability untested.
    consensus:
    - All works build runnable world model systems intended for policy learning, evaluation,
      or simulation and release code, datasets, or artifact links.
    - Action controllability or conditional generation is a core requirement to enable
      interactive and closed-loop applications.
    - Long-horizon consistency, temporal coherence, and generalization to unseen dynamics
      are recognized as critical unresolved challenges.
    disagreements:
    - 'Simulation objectives diverge: some prioritize visual fidelity, others physical
      plausibility, action fidelity, or zero-shot generalization.'
    - Architectural choices vary widely, including diffusion transformers, autoregressive
      transformers, and Dreamer-style recurrent state-space models.
    - Evaluation domains are fragmented across autonomous driving, robotics, games,
      and open-world navigation, with no unified cross-domain benchmark.
    - Real-time latency is explicitly optimized only in a subset of works, while others
      treat it as a secondary concern.
    open_questions:
    - How can world models guarantee safe and reliable decision-making under out-of-distribution
      dynamics?
    - Can explicit physics integration be achieved without sacrificing the flexibility
      of data-driven video generation?
    - Do existing benchmarks cover the diversity and long-tail scenarios of real-world
      deployment?
    - How can the trade-off between model complexity and interactive latency be systematically
      characterized and optimized?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 将预训练视频生成模型适配为动作可控的世界模拟器
      解决的问题: 利用大规模预训练视频模型构建可控模拟器，无需从头训练，实现动作与视觉对齐的动态模拟。
      尚未覆盖: 轻量级动作条件模块在专业领域容量有限；长期一致性、分布外泛化及物理真实性验证仍不足。
    - 路线: 面向自动驾驶的闭环模拟系统
      解决的问题: 构建高保真、多视角、低延迟的驾驶世界模型，支持闭环评估与策略训练，提升动作保真度和几何一致性。
      尚未覆盖: 跨数据集和传感器配置的泛化未验证；极长序列上空时一致性下降；多GPU实时部署扩展性未解决。
    - 路线: 评估基准与可复现框架
      解决的问题: 提供标准化数据集、指标和开源工具，量化空间一致性、动作保真度等关键属性，促进可复现研究。
      尚未覆盖: 基准多局限于特定环境（如Minecraft、nuScenes），缺乏跨领域泛化评估；跨团队和基础设施的独立复现稀缺。
    - 路线: 具身物理信息世界模型
      解决的问题: 将物理先验（深度、关键点动力学等）融入视频生成，提升机器人场景的视觉保真度与物理合理性，支撑策略训练与评估。
      尚未覆盖: 物理属性隐式编码，真实物理交互验证有限；对未见物体和复杂接触的泛化能力未知。
    - 路线: 上下文世界模型实现零样本泛化
      解决的问题: 利用可观测上下文值（如质量、尺寸）显式条件化世界模型的潜在状态和动力学，实现对未见动力学的零样本泛化。
      尚未覆盖: 依赖可观测上下文，真实场景常不可用；仅在单基准套件的少量任务上验证，更广泛适用性待检验。
    共识:
    - 所有工作均构建可运行的世界模型系统，用于策略学习、评估或模拟，并发布代码、数据集或工件链接。
    - 动作可控性或条件生成是实现交互式与闭环应用的核心需求。
    - 长时域一致性、时序连贯性及对未见动力学的泛化被公认为尚未解决的关键挑战。
    分歧:
    - 模拟目标分化：有的侧重视觉保真度，有的强调物理合理性、动作保真度或零样本泛化。
    - 架构选择多样：涵盖扩散Transformer、自回归Transformer及Dreamer式循环状态空间模型。
    - 评估领域碎片化：横跨自动驾驶、机器人、游戏和开放世界导航，缺少统一的跨领域基准。
    - 实时延迟仅在部分工作中被显式优化，其余工作将其视为次要问题。
    开放问题:
    - 世界模型如何在分布外动态下保证安全可靠的决策？
    - 能否在不牺牲数据驱动视频生成灵活性的前提下实现显式物理集成？
    - 现有基准是否覆盖真实世界部署的多样性和长尾场景？
    - 如何系统刻画并优化模型复杂度与交互延迟之间的权衡？
