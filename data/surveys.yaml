  - 主流方向：综述与分类体系集中围绕 world models 展开，尤其是生成式/交互式视频、具身控制与自动驾驶；后期工作转向领域特定分类法和评估框架。
  - 研究共性：按应用场景、世界状态演化、场景模态、潜在表示和结构先验组织文献；比较基准，提炼动作条件控制、长时记忆、实时交互等挑战。
