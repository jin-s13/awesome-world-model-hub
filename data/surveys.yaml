    benchmarks (2025–2026), reflecting a maturation from method to evaluation.'
  - 'Open questions: Whether improvements in visual quality or policy performance
    on a specific platform transfer to different embodiments or real-world conditions;
    how to maintain long-term memory consistency and generalize across action spaces;
