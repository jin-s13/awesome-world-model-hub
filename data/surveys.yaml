  - 研究共性：论文在大规模视频/动作数据上训练生成式世界模型，并通过条件控制、类物理损失或基准指标提升保真度、一致性与下游效用。
  - 关键差异：工作按动作表示、监督信号、评测目标和部署场景分化，如驾驶模拟、机器人操作、Minecraft导航与跨具身迁移。
