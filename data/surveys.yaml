  related_work_outline:
  - 'Mainstream direction: Generative world models based on video prediction or state
    dynamics, using diffusion transformers, VAEs, and unified architectures to support
    long-horizon, multi-view, and physically plausible generation for robotics and
    autonomous driving.'
  - 'Shared research pattern: Treating world model learning as a self-supervised generative
    task (video, state, or action prediction) and coupling it with latent representations
    or action interfaces to improve sample efficiency, generalization, and downstream
    policy performance.'
  - 'Key differences: Model architectures diverge into diffusion-only, hybrid VAE-Transformer,
    and compositionally factorized designs; some works inject explicit physics priors
    while others rely purely on data-driven priors; evaluation targets range from
    video fidelity and memory consistency to task success rate and zero-shot policy
    transfer.'
  - 'Trend evolution: The field has moved from Atari-scale model-based RL (2015–2020)
    toward large-scale pretraining on robotic datasets and driving scenes (2022–2025),
    with a recent emphasis on unified video–action diffusion, memory/spatial consistency
    benchmarks, and compositional generalization.'
  - 'Open questions: How to maintain long-term memory and spatial consistency across
    viewpoints and actions, how to disentangle model contribution from planner or
    task prior, how to design a unified evaluation protocol that covers physical plausibility,
    action controllability, and generalization, and how to leverage action-free video
    data effectively.'
  related_work_outline_zh:
  - 主流方向：基于视频预测或状态动力学的生成式世界模型，采用扩散变换器、变分自编码器及统一架构，支持长时域、多视角和物理合理的生成，面向机器人与自动驾驶。
  - 研究共性：将世界模型学习视为自监督生成任务（视频、状态或动作预测），并与潜在表示或动作接口耦合，以提升样本效率、泛化性和下游策略性能。
  - 关键差异：模型架构分为纯扩散、混合VAE-Transformer和组合分解设计；部分工作显式注入物理先验，部分纯数据驱动；评估目标从视频保真度、记忆一致性到任务成功率和零样本策略迁移。
  - 趋势演进：领域从Atari规模的基于模型的强化学习（2015–2020）转向大规模机器人数据集和驾驶场景的预训练（2022–2025），近期强调统一的视频-动作扩散、记忆/空间一致性基准和组合泛化。
  - 开放问题：如何在视角和动作变化下保持长期记忆和空间一致性，如何分离模型贡献与规划器或任务先验，如何设计覆盖物理合理性、动作可控性和泛化性的统一评估协议，以及如何有效利用无动作视频数据。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Translates world-model concepts into concrete architectures,
        loss functions, and training recipes. This includes diffusion transformers
        with mask reconstruction (e.g., MaskGWM), hybrid VAE-Transformer (e.g., STORM),
        physics-informed joint learning (e.g., RoboScape), unified video–action diffusion
        (e.g., UWM), compositional factorization (e.g., RoboDreamer), and contextual
        dynamics (e.g., cRSSM). The goal is to generate realistic, controllable future
        states or videos.
      what_remains_open: Which architectural choices reliably transfer to unseen task
        families, how to balance physical plausibility with visual fidelity, and whether
        these designs can sustain long-term memory and consistency across diverse
        action spaces without explicit memory modules.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decision-making, planning, and
        policy execution. World models are used to imagine trajectories for policy
        training (e.g., STORM, cRSSM), to generate video plans for robot execution
        (e.g., RoboDreamer), or to flexibly represent policy, forward dynamics, and
        inverse dynamics within a single model (e.g., UWM).
      what_remains_open: How much of the performance gain originates from the world
        model versus the planner, controller, or task-specific prior; whether action
        interfaces designed for simulated benchmarks transfer to real-world deployment;
        and the extent to which these methods can leverage action-free video data
        without sacrificing controllability.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation factors by introducing benchmarks that measure spatial
        consistency (e.g., LoopNav) and memory–action control (e.g., MIND). These
        benchmarks highlight evaluation gaps in existing world models, such as long-term
        memory and cross-action generalization.
      what_remains_open: Most method papers provide limited or no ablation/limitation
        details (e.g., missing analysis of failure modes, few tasks tested), making
        it unclear whether reported gains are due to the proposed method or surrounding
        system choices. A unified evaluation protocol that covers physical plausibility,
        controllability, and generalization across environments is still absent.
    consensus:
    - World models are predominantly learned through self-supervised generation objectives,
      with video or state prediction as the core training signal.
    - Incorporating action or control signals alongside visual dynamics is essential
      for using world models in downstream planning and policy learning.
    - Large-scale pretraining, multi-task data, and compositional strategies consistently
      improve generalization to unseen tasks or environments.
    - There is a growing recognition that current evaluation metrics (e.g., video
      fidelity) are insufficient; memory consistency, spatial coherence, and action
      controllability are critical dimensions for assessment.
    disagreements:
    - 'Architecture choice: some works favor diffusion-only pipelines for high-fidelity
      generation, while others combine VAEs with Transformers for efficiency and stochasticity,
      and yet others decompose generation into compositional primitives.'
    - 'Physical prior integration: some models explicitly learn depth and keypoint
      dynamics to enforce physical plausibility, while others rely entirely on data-driven
      priors without explicit structural constraints.'
    - 'Evaluation target: some methods are optimized for raw video quality or human-normalized
      game scores, while benchmark-focused works prioritize spatial consistency, memory,
      and action controllability without linking to task performance.'
    - 'Interaction mode: some models are designed for open-loop video prediction,
      others for closed-loop policy training, and a few for unified bi-directional
      action–video diffusion, reflecting different assumptions about how the model
      will be used in decision-making.'
    open_questions:
    - Can world models maintain long-term memory and spatial consistency across diverse
      viewpoints and action spaces without explicit memory mechanisms?
    - How can we design a unified evaluation protocol that simultaneously measures
      physical plausibility, action controllability, generalization, and visual fidelity?
    - To what extent can world models be pretrained on action-free video data while
      still producing controllable, policy-relevant representations?
    - What are the minimal assumptions about observable context or primitives that
      enable zero-shot generalization to novel dynamics, and how do they limit real-world
      applicability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体架构、损失函数和训练配方，包括扩散变换器与掩码重建（如MaskGWM）、混合VAE-Transformer（如STORM）、物理信息联合学习（如RoboScape）、统一视频-动作扩散（如UWM）、组合分解（如RoboDreamer）和上下文动力学（如cRSSM），目标是生成逼真、可控的未来状态或视频。
      尚未覆盖: 哪些架构选择能可靠地迁移到未见任务族，如何在物理合理性与视觉保真度之间取得平衡，以及这些设计能否在没有显式记忆模块的情况下，在多样动作空间中维持长期记忆和一致性。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策、规划和策略执行。世界模型用于想象轨迹以训练策略（如STORM、cRSSM），生成视频计划用于机器人执行（如RoboDreamer），或在单一模型中灵活表示策略、前向动力学和逆动力学（如UWM）。
      尚未覆盖: 性能增益有多少来自世界模型本身，而非规划器、控制器或任务特定先验；为仿真基准设计的动作接口能否迁移到真实部署；这些方法能在多大程度上利用无动作视频数据而不牺牲可控性。
    - 路线: 方法证据与消融协议
      解决的问题: 通过引入衡量空间一致性（如LoopNav）和记忆-动作控制（如MIND）的基准，分离方法贡献与数据集、基线、指标和实现因素，揭示现有世界模型在长期记忆和跨动作泛化方面的评估缺口。
      尚未覆盖: 大多数方法论文缺乏消融或局限性细节（如缺少失败模式分析、测试任务少），难以判断报告增益是否来自所提方法而非周边系统选择。目前仍缺乏覆盖物理合理性、可控性和跨环境泛化能力的统一评估协议。
    共识:
    - 世界模型主要通过自监督生成目标学习，以视频或状态预测为核心训练信号。
    - 将动作或控制信号与视觉动力学结合，对于在下游规划和策略学习中使用世界模型至关重要。
    - 大规模预训练、多任务数据和组合策略能持续提升对未见任务或环境的泛化性。
    - 越来越认识到现有评估指标（如视频保真度）不足；记忆一致性、空间连贯性和动作可控性是关键的评估维度。
    分歧:
    - 架构选择：一些工作偏好纯扩散管道以获得高保真生成，其他工作将VAE与Transformer结合以兼顾效率和随机性，还有工作将生成分解为组合原语。
    - 物理先验整合：部分模型显式学习深度和关键点动力学以强制物理合理性，而其他模型完全依赖数据驱动先验，无显式结构约束。
    - 评估目标：有些方法优化视频质量或人类标准化游戏得分，而基准导向的工作优先考虑空间一致性、记忆和动作可控性，而不直接关联任务性能。
    - 交互模式：一些模型设计用于开环视频预测，另一些用于闭环策略训练，少数用于统一的双向动作-视频扩散，反映了对模型在决策中如何使用的不同假设。
    开放问题:
    - 世界模型能否在没有显式记忆机制的情况下，在多样视角和动作空间中维持长期记忆和空间一致性？
    - 如何设计一个统一评估协议，同时衡量物理合理性、动作可控性、泛化性和视觉保真度？
    - 世界模型能在多大程度上利用无动作视频数据进行预训练，同时仍产生可控的、与策略相关的表示？
    - 使零样本泛化到新动力学成为可能的可观测上下文或原语的最小假设是什么，这些假设如何限制现实世界的适用性？
