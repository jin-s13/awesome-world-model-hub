  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving and embodied robotics
    dominate, increasingly using diffusion transformers or generative video models
    conditioned on actions, language, or context.'
  - 'Shared research pattern: World models are trained or evaluated on domain-specific
    video and action data, and judged by prediction quality, controllability, and
    spatiotemporal or physical consistency.'
  - 'Key differences: Representations range from mask reconstruction and VAE stochastic
    transformers to joint video-action diffusion; evaluation spans driving datasets,
    robotic simulation, Atari, Minecraft, and open-domain video benchmarks.'
  - 'Trend evolution: Visible top-paper evidence is concentrated in 2023-2026, showing
    a shift from efficient model-based RL on games toward large-scale driving and
    robot pretraining, physics-informed generation, and memory/action consistency
    benchmarks.'
  - 'Open questions: Real-world safety and operation transfer remain unverified; generalization
    to novel primitives, unseen dynamics, long-term memory, and cross-action spaces
    remains unresolved.'
  related_work_outline_zh:
  - 主流方向：面向驾驶与具身机器人的领域世界模型占主导，多采用扩散Transformer或生成式视频模型，并以动作、语言或上下文为条件。
  - 研究共性：利用领域视频与动作数据训练或评测世界模型，关注预测质量、可控性、时空一致性与物理合理性。
  - 关键差异：表示方式包括掩码重建、VAE随机Transformer、视频-动作联合扩散等；评测场景涵盖驾驶、机器人仿真、Atari、Minecraft和开放域视频。
  - 趋势演进：可见高证据论文集中在2023-2026年，显示从游戏中的高效模型型RL，转向大规模驾驶与机器人预训练、物理信息生成，以及记忆与动作一致性基准。
  - 开放问题：真实安全与运行迁移仍缺证据；新原语、未知动力学、长期记忆和跨动作空间泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon prediction
      what_it_solves: Cross-dataset driving video prediction, long-horizon rollout,
        and zero-shot transfer across driving datasets.
      what_remains_open: Whether simulator or dataset gains align with real-world
        driving safety and operational outcomes is not evidenced.
    - line: Embodied robot world models with action or language conditioning
      what_it_solves: Robot video synthesis, compositional task planning, video-action
        pretraining, and policy or dynamics learning on multitask robot data.
      what_remains_open: Generalization to entirely novel primitives, real-robot execution,
        and transfer across embodiments remain under-verified.
    - line: Physics-informed or consistency-oriented world models
      what_it_solves: Visual fidelity and physical plausibility through temporal depth
        prediction, keypoint dynamics, or spatial consistency measures.
      what_remains_open: The relationship between these consistency signals and downstream
        robot policy success or long-term memory is unclear.
    - line: Benchmarks for memory, action control, and spatial consistency
      what_it_solves: Evaluation of world models in open interactive settings such
        as loop navigation and closed-loop revisiting under action control.
      what_remains_open: Benchmark findings are not yet matched by broad modeling
        improvements; cross-action-space and long-horizon challenges remain.
    - line: Contextual and efficient model-based RL world models
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        to unseen dynamics in contextual or game-like tasks.
      what_remains_open: Evaluation is limited to few tasks, assumes observable context,
        and lacks broader real-world evidence.
    consensus:
    - Recent work treats world models as action- or context-conditioned generative
      models rather than purely passive video predictors.
    - Evaluation is shifting from visual quality alone toward controllability, temporal
      consistency, physical plausibility, and long-horizon coherence.
    - Large-scale domain-specific video datasets are central for driving and robotics,
      while game and interaction benchmarks probe spatial memory and action following.
    disagreements:
    - 'Representation choices differ: mask reconstruction with diffusion, stochastic
      transformer-VAE, joint video-action diffusion, and compositional primitive-conditioned
      generation.'
    - 'Supervision and inductive biases differ: explicit context values or language
      primitives, physics-oriented depth/keypoint tasks, or self-supervised visual
      sequence modeling.'
    - 'Evaluation targets differ: dataset-level video prediction metrics for driving,
      policy success in robotic simulation, Atari human-normalized scores, and new
      benchmark scores for memory/action consistency.'
    - 'Deployment assumptions differ: some methods assume observable context or predefined
      primitive parsers, while others rely on large multitask or action-free video
      datasets.'
    open_questions:
    - Is simulator or benchmark improvement in driving world models aligned with real-world
      safety outcomes?
    - Can robot world models generalize to entirely novel primitives or actions outside
      training combinations?
    - Do spatial, memory, and action-control benchmark scores transfer to downstream
      task success or physical execution?
    - How far can context-conditioned zero-shot generalization extend beyond limited
      benchmark tasks and observable context settings?
    - What evaluation settings are needed to verify long-horizon memory consistency
      and cross-action-space generalization in open domains?
