  related_work_outline:
  - 'Mainstream direction: Designing targeted benchmarks (LoopNav, MIND) that evaluate
    world models beyond aggregate scores, focusing on spatial consistency, memory,
    and action control.'
  - 'Shared research pattern: Introducing a new dataset with diagnostic metrics, releasing
    code and artifacts, and testing existing world models to reveal systematic failures.'
  - 'Key differences: Some benchmarks emphasize loop-based spatial consistency (LoopNav),
    others emphasize memory and action control across diverse viewpoints (MIND); method
    papers largely rely on existing suites like Atari 100k.'
  - 'Trend evolution: Within the 2020–2026 frontier, the field is shifting from reusing
    generic game benchmarks toward diagnostic, closed-loop benchmarks that probe specific
    world-model capabilities.'
  - 'Open questions: Whether proxy metrics align with downstream decision quality,
    how benchmark conclusions vary across compute budgets, and whether task distributions
    cover real deployment settings.'
  related_work_outline_zh:
  - 主流方向：设计超越总分、针对空间一致性、记忆和动作控制等能力的诊断基准（如LoopNav、MIND）。
  - 研究共性：提出新数据集和诊断指标，释放代码与工件，并用现有世界模型测试以揭示系统性失效。
  - 关键差异：部分基准侧重循环空间一致性（LoopNav），另一部分强调跨视角记忆与动作控制（MIND）；方法类论文仍主要依赖Atari 100k等现有套件。
  - 趋势演进：在2020–2026前沿内，研究正从复用通用游戏基准转向构建诊断性闭环基准，以探测世界模型的特定能力。
  - 开放问题：代理指标是否与下游决策质量对齐，基准结论在不同算力预算下是否稳定，任务分布是否覆盖真实部署环境。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating specialized datasets and tasks that evaluate world-model
        capabilities such as spatial consistency, long-term memory, and action controllability,
        moving beyond generic game scores.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings (e.g., robotic manipulation, long-horizon planning) where world models
        are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Providing diagnostic metrics (Scene Graph Consistency Score,
        memory consistency, action control) that probe specific failure modes of world
        models under controlled variations.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; the metrics have not yet been validated
        against real task performance.
    - line: Comparable baselines and reporting
      what_it_solves: Using standard benchmarks (Atari 100k, CARL, Nuscenes) with
        human-normalized scores or other agreed metrics to enable comparison across
        world-model architectures.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets; systematic sensitivity studies are missing.
    consensus:
    - World models need evaluation beyond aggregate performance, targeting specific
      abilities like spatial consistency, memory, and physical plausibility.
    - Diagnostic benchmarks with custom metrics reveal failures that generic benchmarks
      hide, and open-source artifacts accelerate progress.
    - CLosed-loop evaluation where predictions affect future inputs is more informative
      than open-loop generation quality.
    disagreements:
    - 'Evaluation targets: one body of work tests spatial consistency through loop
      navigation, another tests memory and action control across diverse views, while
      method papers optimize for human-normalized game scores.'
    - 'Interaction mode: some benchmarks use closed-loop, interactive re-visitation
      (LoopNav, MIND), whereas standard suites like Atari 100k use open-loop rollouts
      with a fixed environment.'
    - 'Deployment setting: driving (Nuscenes, OpenDV-2K), gaming (Atari, Minecraft),
      and robotic manipulation are all used, but each probes different aspects of
      world-model quality.'
    open_questions:
    - Do the diagnostic metrics introduced by new benchmarks correlate with performance
      in real-world downstream tasks?
    - How stable are benchmark rankings when world models are retrained with different
      hyperparameters, compute budgets, or codebases?
    - Can a single benchmark suite cover the diverse settings (driving, robotics,
      open-world games) where world models are proposed, or will we need a family
      of domain-specific tests?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建专门的数据集和任务，评估世界模型的空间一致性、长期记忆和动作可控性等能力，超越通用游戏分数。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部真实场景（如机器人操作、长时域规划）。
    - 路线: 指标与压力测试设计
      解决的问题: 提供诊断性指标（场景图一致性分数、记忆一致性、动作控制），在受控变化下探测世界模型的特定失效模式。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致，尚未在真实任务表现上验证。
    - 路线: 可比基线与报告规范
      解决的问题: 使用标准基准（Atari 100k、CARL、Nuscenes）及人类归一化得分等约定指标，使不同世界模型架构可比较。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定，缺乏系统性敏感性研究。
    共识:
    - 世界模型需要超越总分的能力评估，重点关注空间一致性、记忆和物理合理性等特定能力。
    - 带有自定义指标的诊断性基准能揭示通用基准隐藏的失效，且开源工件可加速进展。
    - 预测影响未来输入的闭环评测比开环生成质量更具信息量。
    分歧:
    - 评测目标：一部分工作通过循环导航测试空间一致性，另一部分测试跨视角的记忆与动作控制，而方法论文仍以人类归一化游戏分数为优化目标。
    - 交互模式：部分基准采用闭环交互重访（LoopNav、MIND），而Atari 100k等标准套件使用固定环境的开环展开。
    - 部署场景：驾驶（Nuscenes、OpenDV-2K）、游戏（Atari、Minecraft）、机器人操作均有使用，但各场景探测世界模型质量的不同方面。
    开放问题:
    - 新基准引入的诊断指标是否与真实下游任务表现相关？
    - 当世界模型用不同超参数、算力预算或代码库重新训练时，基准排名是否稳定？
    - 一套基准能否覆盖世界模型提出的多样化场景（驾驶、机器人、开放世界游戏），还是需要领域特定的测试家族？
