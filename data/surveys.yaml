  related_work_outline:
  - 'Mainstream direction: World-model surveys and taxonomies unify generative video,
    embodied robot learning, and automated driving under shared questions of world
    representation, long-horizon consistency, controllability, and evaluation; method
    papers supply the evidence base for these syntheses.'
  - 'Shared research pattern: Work treats world models as an abstraction for future-state
    prediction; surveys extract design choices and gaps, while methods address consistency,
    control, memory, or online learning. Many entries share evaluation-oriented framing
    but lack systematic evidence or full reproducibility.'
  - 'Key differences: Deployment settings differ from physical online robot learning
    without simulators, to generative video simulators, traffic simulation, ego-vision
    prediction, and conceptual driving taxonomies. Representations differ among compositional
    language primitives, persistent global state, unified latent spaces with structural
    priors, and per-agent latent personalities.'
  - 'Trend evolution: The evidence moves from 2022 physical-robot world-model learning
    toward 2024-2026 generative video world models, out-of-sight persistent dynamics,
    open-source real-time simulators, and formal driving taxonomies; survey work is
    converging on evaluation frameworks and resource-aware open challenges.'
  - 'Open questions: Whether taxonomies are systematic, whether unseen primitive generalization
    transfers beyond simulation, whether proposed driving evaluation frameworks can
    be empirically validated, and how to compare long-horizon consistency, controllability,
    and real-time interaction across shared benchmarks remain open.'
  related_work_outline_zh:
  - 主流方向：世界模型综述与分类研究将生成视频、具身机器人学习和自动驾驶统一到世界表示、长时程一致性、可控性和评估问题之下；方法论文为这些综合提供证据基础。
  - 研究共性：研究将世界模型作为未来状态预测的核心抽象；综述提炼设计选择和缺口，方法关注一致性、控制、记忆或在线学习。多项条目采用评估导向框架，但系统证据或复现性仍有限。
  - 关键差异：部署设置不同：物理机器人无模拟器在线学习、生成视频模拟器、交通仿真、自我视觉预测，以及概念性驾驶分类法；表示方式包括组合语言原语、持久全局状态、带结构先验的统一潜在空间、个体潜在个性。
  - 趋势演进：证据从2022年物理机器人世界模型在线学习演进到2024-2026年生成视频世界模型、视线外持久动态、开源实时模拟器和正式驾驶分类法；综述正汇聚到评估框架与资源感知的开放挑战。
  - 开放问题：分类法是否系统、未见原语泛化是否能超越仿真、驾驶评估框架能否实证验证、以及如何在共享基准上比较长时程一致性、可控性和实时交互，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into unified design spaces,
        directions, and research gaps across general and driving-specific contexts.
      what_remains_open: Whether the synthesis is backed by systematic inclusion criteria
        and whether proposed taxonomies or evaluation frameworks receive empirical
        validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Consolidates evaluation choices and evidence around long-horizon
        consistency, controllability, out-of-sight dynamics, motion prediction, and
        real-time interaction.
      what_remains_open: Comparability across datasets, simulation or closed-loop
        settings, metrics, and baselines is unresolved, and several reported results
        lack limitation or artifact details.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad coverage into concrete gaps such as unseen primitive
        generalization, physical online learning, persistent state modeling, and reproducibility.
      what_remains_open: Prioritization of gaps and verification of reported capability
        claims remain underspecified when evidence is simulation-only or conceptual.
    consensus:
    - World models are treated as a core abstraction for predicting future states
      across embodied, driving, and video generation settings.
    - Long-horizon consistency and controllability are recurring targets; approaches
      use memory, global state, language factorization, or trajectory and pose conditioning.
    - Several entries combine synthesis with evaluation-oriented design but leave
      limitations, artifacts, or reproducibility details unspecified, creating verification
      gaps rather than confirmed differences.
    disagreements:
    - 'Deployment assumptions differ: physical online learning without simulators,
      generative video or traffic simulators, ego-vision prediction, and conceptual
      evaluation frameworks.'
    - 'Representation choices differ: compositional language primitives, persistent
      3D/global entity state, unified latent representations with structural priors,
      and per-agent latent personalities.'
    - 'Evaluation targets differ: simulated robot execution, motion prediction on
      a driving dataset, future frame control and temporal consistency, and proposed
      evaluation frameworks without empirical validation.'
    - 'Reproducibility posture differs: some work emphasizes open-source artifacts,
      while several entries have missing limitation or artifact details.'
    open_questions:
    - How can systematic survey inclusion and quality assessment be applied to world-model
      literature without selective example-driven synthesis?
    - Can compositional generalization to unseen primitives be demonstrated beyond
      training combinations and beyond simulation or video benchmarks?
    - Can latent-space evaluation frameworks for automated driving become actionable
      in closed-loop settings before empirical validation is available?
    - Which shared benchmarks would make out-of-sight dynamics, long-horizon consistency,
      controllability, and real-time interaction comparable across generative world
      models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究归纳为统一设计空间、方向和缺口，涵盖通用与驾驶特定场景。
      尚未覆盖: 综合是否由系统纳入标准支撑，所提分类与评估框架是否得到实证验证尚不明确。
    - 路线: 对比评测综合
      解决的问题: 汇总围绕长时程一致性、可控性、视线外动态、运动预测和实时交互的评测选择与证据。
      尚未覆盖: 不同数据集、仿真/闭环设置、指标和基线之间是否可比较仍未解决，且部分结果缺少限制与工件细节。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛覆盖转为具体缺口，如未见原语泛化、物理在线学习、持久状态建模和可复现性。
      尚未覆盖: 缺口的优先级和声明的能力验证仍不明确，特别是仅有仿真或概念性证据时。
    共识:
    - 世界模型被作为预测未来状态的核心抽象，贯穿具身、驾驶和视频生成场景。
    - 长时程一致性和可控性是反复出现的评价目标；方法通过记忆、全局状态、语言分解或轨迹/姿态条件化来应对。
    - 多项工作结合综合与评测导向设计，但限制、工件或复现细节缺失，形成验证缺口而非确认差异。
    分歧:
    - 部署假设不同：有的在无模拟器条件下进行物理在线学习，有的构建生成视频或交通模拟器，有的给出自我视觉预测或概念评估框架。
    - 表示方式不同：组合语言原语、持久3D/全局实体状态、带结构先验的统一潜在表示、以及个体潜在个性。
    - 评测目标不同：仿真机器人执行、驾驶数据集的运动预测、未来帧控制与时间一致性，以及仅有方案但无实证验证的评估框架。
    - 可复现姿态不同：部分强调开源工件，部分条目的限制或工件细节缺失。
    开放问题:
    - 如何对世界模型文献实施系统性综述纳入与质量评估，以避免选择性地按示例归纳？
    - 组合式未见原语的泛化能否在训练组合之外以及仿真或视频基准之外得到验证？
    - 自动驾驶潜在空间评估框架在尚无实证验证之前，能否在闭环条件下落地？
    - 哪些共享基准可以统一比较视线外动态、长时程一致性、可控性和实时交互？
