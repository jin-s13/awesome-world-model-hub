  related_work_outline:
  - 'Mainstream direction: World-model evaluation is converging on diagnostic, capability-specific
    probes rather than a single aggregate score, with recent benchmarks constructed
    for spatial consistency, memory consistency, and action control in visually grounded
    environments.'
  - 'Shared research pattern: Works couple generative video/dynamics models with auxiliary
    tasks or metrics—mask reconstruction, scene graphs, depth/keypoint prediction,
    closed-loop rollouts—and evaluate on shared settings such as Atari 100k, CARL,
    Minecraft, driving, and robotic datasets.'
  - 'Key differences: The evidence splits by evaluation target and interaction mode:
    closed-loop memory/action consistency, zero-shot dynamics generalization, human-normalized
    RL score, visual fidelity and physical plausibility, and downstream policy utility
    in different deployment settings.'
  - 'Trend evolution: Within a narrow 2023–2026 frontier, work moves from model-centric
    RL benchmarks to task-specific benchmark datasets and metrics, and from aggregate
    game scores toward consistency, controllability, and cross-domain generalization
    across driving, robotics, and open-world settings.'
  - 'Open questions: Whether consistency and fidelity metrics align with downstream
    decisions, whether benchmark conclusions remain stable across implementations
    and compute budgets, and whether current task distributions cover unseen dynamics
    and action spaces.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正在从单一总分转向针对能力的诊断式探针，近期基准围绕空间一致性、记忆一致性和动作控制构建。
  - 研究共性：研究将生成式视频/动力学模型与辅助任务或指标耦合，如掩码重建、场景图、深度/关键点预测、闭环推演，并在Atari 100k、CARL、Minecraft、驾驶和机器人数据上评测。
  - 关键差异：证据在评测目标与交互方式上分化：闭环记忆/动作控制、零样本动力学泛化、人类归一化得分、视觉与物理保真度，以及不同部署场景中的下游策略效用。
  - 趋势演进：在2023至2026的窄时段内，工作从以模型为中心的强化学习基准转向专用基准数据集与指标，从聚合得分转向一致性、可控性和跨域泛化。
  - 开放问题：一致性与保真度指标是否与下游决策对齐，基准结论是否在不同实现和算力下稳定，当前任务分布是否覆盖未见动力学和动作空间。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared task distributions and datasets for spatial consistency,
        memory consistency, and action control, making world-model behavior comparable
        across environments.
      what_remains_open: Coverage is still narrow relative to driving, robotics, and
        real-world settings; some dataset papers report construction without full
        experimental validation.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial/contextual consistency, physical
        plausibility, zero-shot generalization, and decision utility beyond a single
        aggregate score.
      what_remains_open: The alignment between proxy metrics such as scene-graph consistency
        or visual fidelity and downstream decisions users actually care about remains
        unverified.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditability through common baselines, benchmark protocols,
        and artifacts such as code and datasets.
      what_remains_open: Evidence of stability across implementations and compute
        budgets is incomplete; several papers have blank limitation fields or missing
        citation metadata.
    consensus:
    - Recent work treats action-conditioned visual rollouts and memory/consistency
      probes as central to evaluating world-model capability.
    - Generative diffusion or transformer backbones are shared across methods and
      benchmarks, often paired with auxiliary self-supervised tasks.
    - Diagnostic evaluation is preferred over a single aggregate score, separating
      spatial consistency, memory, action control, visual fidelity, and downstream
      policy utility.
    disagreements:
    - 'Evaluation targets differ: closed-loop memory and action control, zero-shot
      dynamics generalization, human-normalized game score, visual/physical quality,
      or downstream robotics and driving policy utility.'
    - 'Representation and supervision differ: context-conditioned latent dynamics,
      mask reconstruction, scene-graph consistency, depth/keypoint prediction, and
      coupled video-action diffusion impose different inductive biases.'
    - 'Interaction modes differ: open-loop prediction, closed-loop revisited navigation,
      and policy rollouts within learned world models are not calibrated to each other.'
    - Deployment settings differ across Atari, Minecraft, driving, and robotic manipulation,
      so difficulty, transfer, and real-world relevance are not comparable.
    open_questions:
    - How well do spatial, memory, and action-control metrics predict downstream task
      success or human preference?
    - Can current benchmark distributions cover unseen dynamics, varied action spaces,
      and real-world sensor noise?
    - Are reported improvements stable across different implementations and compute
      budgets when metadata and limitations are often missing?
    - How can visual fidelity be separated from physical correctness in generated
      rollouts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务分布与数据集，评估空间一致性、记忆一致性与动作控制，使世界模型行为可比。
      尚未覆盖: 覆盖范围相对驾驶、机器人与真实环境仍较窄；部分数据集工作只给出构建信息，未提供充分实验验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在单一总分之外检验预测质量、空间/上下文一致性、物理合理性、零样本泛化与决策效用。
      尚未覆盖: 场景图一致性或视觉保真度等代理指标与用户真正关心的下游决策之间是否一致仍未得到验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、基准协议以及代码和数据集等工件，使结果可审计。
      尚未覆盖: 不同实现和算力预算下的稳定性证据不完整；部分论文局限性字段为空或缺少引文元数据。
    共识:
    - 近期工作将动作条件下的视觉推演与记忆/一致性探针视为评估世界模型能力的核心。
    - 方法基准普遍采用生成式扩散或Transformer骨干，并常配合辅助自监督任务。
    - 相比单一总分，更倾向于诊断式评估，区分空间一致性、记忆、动作控制、视觉保真度与下游策略效用。
    分歧:
    - 评测目标不同：分别关注闭环记忆与动作控制、零样本动力学泛化、人类归一化游戏得分、视觉与物理质量，或下游机器人和驾驶策略效用。
    - 表示与监督信号不同：上下文条件潜在动力学、掩码重建、场景图一致性、深度/关键点预测以及视频-动作扩散带来不同归纳偏置。
    - 交互模式不同：开环预测、闭环回访导航和在世界模型内进行策略推演尚未彼此校准。
    - 部署场景不同：Atari、Minecraft、驾驶和机器人操作之间的难度、迁移与真实相关性不可直接比较。
    开放问题:
    - 空间、记忆与动作控制指标能在多大程度上预测下游任务成功或人类偏好？
    - 当前基准分布能否覆盖未见的动力学、多样动作空间和真实传感器噪声？
    - 在元数据和局限性经常缺失的情况下，报告结果在不同实现和算力预算下是否稳定？
    - 如何将生成推演中的视觉保真度与物理正确性分开评估？
