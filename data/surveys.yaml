  related_work_outline:
  - 'Mainstream direction: Domain-specific generative world models are dominant, especially
    driving video prediction and embodied robot video-action learning, shifting from
    sample-efficient reinforcement learning dynamics toward diffusion- or transformer-based
    future video modeling with task and action conditioning.'
  - 'Shared research pattern: Most systems learn latent or video dynamics from visual
    observations, condition on language, actions, or context, and test generalization
    through zero-shot datasets, unseen goals, or benchmark consistency instead of
    solely training-set reconstruction.'
  - 'Key differences: They differ in domain constraints, conditioning signals such
    as language primitives, observable context, or action diffusion, model families
    such as stochastic state-space, VAE-Transformer, or diffusion Transformer, and
    evaluation targets such as visual fidelity, physical plausibility, policy return,
    or spatial and memory consistency.'
  - 'Trend evolution: In the provided evidence, high-ranking papers cluster in 2023-2026,
    so the visible trend is within the current frontier; earlier efficient game/RL
    world models lead into recent open-world driving and robotics benchmarks emphasizing
    long-horizon generalization and closed-loop evaluation.'
  - 'Open questions: Remaining gaps include transfer from simulation or video metrics
    to real-world closed-loop safety and operational outcomes, generalization to entirely
    novel primitives or actions, physical plausibility verification, and long-horizon
    memory consistency across views and action spaces.'
  related_work_outline_zh:
  - 主流方向：以驾驶视频预测和机器人具身视频-动作学习为代表的领域生成式世界模型成为主导，从样本高效的强化学习动力学模型转向基于扩散或Transformer的未来视频建模。
  - 研究共性：多数工作从视觉观测学习潜在或视频动力学，并以语言、动作或上下文为条件，通过零样本数据集、未见目标或一致性基准来评估泛化，而非仅看重训练集重建。
  - 关键差异：差异集中在领域约束、条件信号（语言原语、可观测上下文、动作扩散）、模型结构（随机状态空间、VAE-Transformer、扩散Transformer）以及评测目标（视觉保真、物理合理性、策略回报、空间/记忆一致性）。
  - 趋势演进：证据中的高排名论文集中在2023-2026年前沿；早期更关注游戏和强化学习中的高效世界模型，近年转向驾驶与机器人领域的开放世界、大规模数据集和闭环/基准评估。
  - 开放问题：仿真或视频指标能否迁移到真实闭环安全与运营结果、全新原语/动作泛化、物理合理性验证、长时记忆一致性与跨视角/动作空间泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Domain-adaptive driving world models
      what_it_solves: Predicting multi-view and long-horizon driving video by combining
        diffusion generative modeling with mask-based feature learning, including
        zero-shot transfer across driving datasets.
      what_remains_open: Real-world closed-loop driving safety and operational impact
        are not evidenced; available evidence is benchmark-based, and long-horizon
        physical, road-rule, and memory consistency remain unverified.
    - line: Embodied robot world models
      what_it_solves: Generating robot videos and action or policy dynamics from language
        instructions, goal images, or large multi-task robot datasets, with some models
        adding physics-informed depth and keypoint signals.
      what_remains_open: Generalization often assumes previously seen primitive combinations
        or simulation evaluation; real-robot execution and entirely novel task support
        remain sparse, and physical plausibility is measured by proxy metrics.
    - line: Interactive and game world models with consistency benchmarks
      what_it_solves: Improving sample-efficient model-based reinforcement learning
        in game environments and measuring spatial consistency, memory, and action
        control in open-world navigation videos.
      what_remains_open: Long-term memory consistency and cross-action-space generalization
        remain difficult; gains in game or benchmark settings may not transfer to
        embodied or safety-critical domains.
    - line: Contextual zero-shot world models
      what_it_solves: Inferring context-conditioned latent states and dynamics so
        that policies trained in imagined rollouts can zero-shot generalize under
        changing environment parameters.
      what_remains_open: Context observability is assumed, and evaluation covers only
        limited contextual reinforcement learning tasks; broader latent-context, multi-task,
        and real-world transfer remain unresolved.
    consensus:
    - World models are used as learned forward models to generate future observations
      or latent states from current observations and task or action conditioning.
    - Recent application work prefers generative architectures such as diffusion transformers,
      VAEs, or unified video-action transformers over purely recurrent predictors.
    - Generalization is a central evaluation theme, with evidence collected across
      unseen datasets, unseen goals or contexts, and open-domain benchmark videos
      rather than single-dataset reconstruction.
    - There is an emerging focus on consistency properties such as spatial coherence,
      memory, and physical plausibility, indicating a shift from short-term visual
      quality toward longer-horizon reliability.
    disagreements:
    - 'Conditioning differs: explicit observable context, language parsed into primitives,
      paired video-action diffusion, or pure visual self-supervision.'
    - 'Representation differs: stochastic latent state-space models, VAE-Transformer
      hybrids, diffusion transformers, and unified transformer models with modality-specific
      timesteps.'
    - 'Evaluation targets differ: policy return and sample efficiency, video fidelity,
      physical plausibility, spatial consistency, memory and action control, or downstream
      robot execution.'
    - 'Deployment realism differs: some evidence is simulation-only, while other work
      uses real driving or robot datasets; closed-loop real-world validation remains
      uneven.'
    open_questions:
    - Do benchmark or video-prediction improvements transfer to real-world closed-loop
      safety and operational outcomes in driving and robotics?
    - Can these models generalize to entirely novel primitives, actions, or dynamics
      not present during training context or language parsing?
    - What evaluation metrics can verify physical plausibility and long-horizon memory
      consistency beyond visual fidelity?
    - Are current assumptions such as observable context, predefined action spaces,
      and scene-consistent navigation robust under unobserved or changing real-world
      dynamics?
