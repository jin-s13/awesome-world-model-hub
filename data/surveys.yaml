  related_work_outline:
  - 'Mainstream direction: building generative world models via diffusion and Transformer
    architectures to predict future video frames conditioned on actions, applied to
    robotics, autonomous driving, and game agents.'
  - 'Shared research pattern: learn a latent dynamics model from video and action
    data, then use it to generate imagined rollouts for policy learning or evaluation;
    most works combine a visual encoder/decoder with a sequential latent state model.'
  - 'Key differences: domains (driving, robotics, Atari), whether the model incorporates
    explicit physics priors (e.g., depth, keypoints), the type of context or memory
    used (contextual variables, language primitives, spatial loops), and evaluation
    metrics (visual fidelity, downstream task success, spatial consistency).'
  - 'Trend evolution: early work focused on Atari games with VAE-Transformer hybrids;
    from 2024 onward, the field shifts toward large-scale robot pretraining, compositional
    generalization, and physics-informed generation, with new benchmarks emphasizing
    memory consistency and action control.'
  - 'Open questions: cross-embodiment and cross-domain generalization beyond training
    distributions, alignment of simulation-based gains with real-world safety and
    operational outcomes, and scaling world models to long-horizon tasks with robust
    memory.'
  related_work_outline_zh:
  - 主流方向：基于扩散和Transformer架构的生成式世界模型，通过动作条件预测未来视频帧，应用于机器人、自动驾驶和游戏智能体。
  - 研究共性：从视频和动作数据学习潜在动力学模型，用于生成想象轨迹以进行策略学习或评估；多数工作结合视觉编码-解码器与序列潜在状态模型。
  - 关键差异：领域（驾驶、机器人、Atari）、是否引入显式物理先验（如深度、关键点）、使用的上下文或记忆类型（上下文变量、语言原语、空间循环）以及评估指标（视觉保真度、下游任务成功率、空间一致性）。
  - 趋势演进：早期工作聚焦于VAE-Transformer混合的Atari游戏；2024年起转向大规模机器人预训练、组合泛化和物理信息生成，新基准强调记忆一致性与动作控制。
  - 开放问题：超越训练分布的跨本体和跨领域泛化、仿真收益与真实安全及运营结果的匹配、以及将世界模型扩展到具有鲁棒记忆的长时域任务。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: adapting world models to robotics and contextual RL tasks by
        conditioning on domain-specific states, actions, and context variables, enabling
        zero-shot generalization to unseen dynamics
      what_remains_open: evaluation is limited to a few benchmarks (CARL, RT-X) and
        simulated settings; real-robot transfer, scalability to entirely novel primitives,
        and generalization across different robot embodiments remain unverified
    - line: Autonomous driving and simulation use cases
      what_it_solves: forecasting driving scenes and supporting closed-loop policy
        evaluation via multi-view video prediction models that handle long-horizon
        and cross-dataset generalization
      what_remains_open: no direct evidence linking improved video prediction metrics
        to real-world driving safety or operational metrics; zero-shot transfer is
        shown only between datasets, not to physical vehicles
    - line: Interactive agents and games
      what_it_solves: building efficient world models for game agents (Atari, Minecraft)
        and benchmarking spatial and memory consistency, closing the loop between
        action and visual observation
      what_remains_open: generalization when game rules, goals, or user interactions
        change; long-term memory consistency and cross-action-space control remain
        challenging as shown by recent benchmarks
    consensus:
    - World models for applications are predominantly generative, using video prediction
      conditioned on actions to enable planning or policy optimization.
    - Training involves self-supervised reconstruction losses on visual observations,
      often combined with reinforcement learning objectives on imagined rollouts.
    - Recent works adopt diffusion models or Transformers as the backbone for improved
      generation quality and scalability.
    - Benchmarks are shifting from pixel-level fidelity to higher-level consistency
      measures such as spatial coherence, memory, and physical plausibility.
    disagreements:
    - Whether to incorporate explicit physics knowledge (depth, keypoints) into the
      generation process or rely purely on data-driven priors, as seen in RoboScape
      versus UWM.
    - 'The role of compositionality: RoboDreamer factorizes generation by language
      primitives to achieve compositional generalization, while others like cRSSM
      rely on context-conditioned dynamics without explicit decomposition.'
    - 'Evaluation targets differ: some papers optimize for downstream task success
      (cRSSM, STORM) while others focus on visual quality and physical plausibility
      (RoboScape, MaskGWM) or spatial consistency (LoopNav, MIND).'
    - 'Interaction mode: certain works couple action and video diffusion in a unified
      model (UWM), others separate world model from policy (STORM, Dreamer variants),
      and benchmarks often test action-free or fixed-action scenarios.'
    open_questions:
    - Can the compositional generalization shown with language primitives extend to
      entirely new object categories or actions not seen in training?
    - How do improvements in simulated video prediction translate to measurable safety
      or performance gains in real-world driving and robot deployment?
    - What mechanisms enable world models to maintain long-horizon memory consistency
      and generalize across diverse action spaces, as highlighted by MIND and LoopNav?
    - Is the assumption of observable context variables in contextual world models
      feasible in real-world settings, and how can it be relaxed?
