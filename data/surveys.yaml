  related_work_outline:
  - 'Mainstream direction: Building video-generation-based world models conditioned
    on actions for robot manipulation, with growing emphasis on physical plausibility
    and functional evaluation.'
  - 'Shared research pattern: Models predict future video frames from actions and
    past observations, using diffusion or autoregressive architectures, pretrained
    on large-scale robot datasets, and applied to policy learning, planning, or simulation.'
  - 'Key differences: Architectures range from unified transformers to masked autoregression;
    action conditioning is injected via frame-level modules, independent diffusion
    timesteps, or learned masks; alignment targets include human preferences, DPO-based
    discriminators, and task rewards; evaluation spans visual quality, policy correlation,
    and zero-shot physical benchmarks.'
  - 'Trend evolution: Shift from visual fidelity toward physical consistency and functional
    benchmarks; emergence of post-training alignment with RL or DPO; growing interest
    in cross-embodiment pretraining and test-time verification, though scaling remains
    brittle.'
  - 'Open questions: How to achieve long-horizon physical persistence and causal reasoning;
    how to build reliable test-time verifiers that avoid information bottlenecks;
    how to generalize beyond manipulation tasks; and whether current taxonomies influence
    model design in practice.'
  related_work_outline_zh:
  - 主流方向：构建基于视频生成的动作条件世界模型，用于机器人操作，日益强调物理合理性与功能评估。
  - 研究共性：模型根据动作和历史观测预测未来视频帧，采用扩散或自回归架构，在大规模机器人数据集上预训练，并应用于策略学习、规划或仿真。
  - 关键差异：架构涵盖统一Transformer、掩码自回归等；动作条件注入方式包括帧级模块、独立扩散时间步、学习掩码；对齐目标涉及人类偏好、DPO判别器、任务奖励；评估覆盖视觉质量、策略相关性及零样本物理基准。
  - 趋势演进：从视觉保真度转向物理一致性和功能基准；出现用RL或DPO进行后训练对齐；跨本体预训练和测试时验证兴趣增长，但缩放仍脆弱。
  - 开放问题：如何实现长程物理持久性和因果推理；如何构建可靠的、避免信息瓶颈的测试时验证器；如何泛化到操作任务之外；当前分类法是否真正影响模型设计实践。
  literature_review:
    line_of_work_matrix:
    - line: Video-generation world models for robot manipulation
      what_it_solves: Learning predictive models of the environment from video and
        action data to support policy learning, planning, and simulation for embodied
        agents.
      what_remains_open: Long-horizon physical consistency, cross-embodiment generalization,
        efficient use of action-free video, and guarantees that visual fidelity translates
        to task success.
    - line: Aligning world models with physical realism and task goals
      what_it_solves: Improving the physical plausibility, logical coherence, and
        task relevance of generated trajectories through reward modeling or preference
        optimization.
      what_remains_open: Scalability of human preference collection, subjectivity
        of reward signals, and demonstrated generalization beyond contact-rich manipulation.
    - line: Test-time verification for spatial reasoning
      what_it_solves: Evaluating and improving the reliability of world-model-based
        reasoning by using verifiers or test-time compute to select plausible imagined
        trajectories.
      what_remains_open: Current verifiers suffer from poor calibration, action biases,
        and information bottlenecks; consistent scaling across diverse benchmarks
        remains unachieved.
    - line: Conceptual taxonomy of world models
      what_it_solves: Organizing fragmented world-model claims by categorizing state
        construction (implicit/explicit) and dynamics modeling (knowledge integration,
        architectural reformulation) to guide evaluation.
      what_remains_open: Whether the taxonomy changes how researchers design or evaluate
        models, and whether it can be operationalized into functional benchmarks that
        test persistence and causality.
    consensus:
    - Video generation is the dominant representation for world models, with actions
      treated as conditioning inputs.
    - Pretraining on large-scale robot datasets improves generalization and robustness
      over imitation learning alone.
    - Visual fidelity alone is insufficient; evaluation must include physical plausibility,
      task completion, or policy correlation.
    - Architectures based on diffusion or autoregressive transformers are the primary
      backbone, with a trend toward unified frameworks that handle multiple modalities.
    - There is a growing recognition that current models lack explicit state representations
      and struggle with long-term persistence and causal reasoning.
    disagreements:
    - 'Action conditioning mechanisms: some methods inject frame-level action modules
      inside transformer blocks, while others use independent diffusion timesteps
      or post-hoc learned masks.'
    - 'Alignment objectives: approaches differ in whether they optimize for human
      preferences, use DPO with decoupled discriminators, or apply RL with multidimensional
      reward models.'
    - 'Evaluation benchmarks and metrics: works emphasize different criteria — visual
      quality, policy correlation, zero-shot physical consistency, or spatial reasoning
      accuracy — leading to fragmented evaluation standards.'
    - 'Scaling strategy: some methods focus on model and data scaling for pretraining,
      while others explore test-time compute scaling, with evidence that the latter
      currently fails on certain benchmarks.'
    - 'Model openness and reproducibility: some methods rely on closed-source pretrained
      models, while others release checkpoints and training code, creating uneven
      baselines for comparison.'
    open_questions:
    - How can explicit state representations be incorporated into video-generation
      world models to improve long-term physical consistency and causal reasoning?
    - What design of verifier or reward model enables reliable test-time scaling without
      introducing information bottlenecks or biases?
    - Can alignment techniques developed for manipulation tasks transfer to broader
      domains such as navigation or deformable object interaction?
    - How should the community move from visual-fidelity benchmarks to standardized
      functional benchmarks that test physical persistence and causality?
    - Do the proposed conceptual taxonomies lead to concrete architectural changes
      or training protocols, or do they remain descriptive frameworks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向机器人操作的视频生成世界模型
      解决的问题: 从视频和动作数据中学习环境预测模型，以支持具身智能体的策略学习、规划和仿真。
      尚未覆盖: 长程物理一致性、跨本体泛化、高效利用无动作视频，以及视觉保真度转化为任务成功的保证。
    - 路线: 世界模型的物理合理性与任务目标对齐
      解决的问题: 通过奖励建模或偏好优化，提升生成轨迹的物理合理性、逻辑一致性和任务相关性。
      尚未覆盖: 人类偏好收集的可扩展性、奖励信号的主观性，以及超越接触丰富操作任务的泛化验证。
    - 路线: 空间推理的测试时验证
      解决的问题: 通过验证器或测试时计算选择可信的想象轨迹，评估并提升基于世界模型推理的可靠性。
      尚未覆盖: 当前验证器存在校准不良、动作偏差和信息瓶颈，未能跨基准实现一致的缩放。
    - 路线: 世界模型的概念分类
      解决的问题: 将状态构建（隐式/显式）和动态建模（知识整合、架构重构）分类，以组织碎片化的世界模型主张并指导评估。
      尚未覆盖: 分类法是否改变研究者的设计或评估方式，以及能否转化为测试持久性和因果性的功能基准。
    共识:
    - 视频生成是表示世界模型的主流方式，动作作为条件输入。
    - 在大规模机器人数据集上预训练可提升泛化性和鲁棒性，优于仅靠模仿学习。
    - 仅靠视觉保真度不足，评估需包含物理合理性、任务完成或策略相关性。
    - 基于扩散或自回归Transformer的架构是主要骨干，并有向统一多模态框架发展的趋势。
    - 研究界日益认识到当前模型缺乏显式状态表示，难以应对长期持久性和因果推理。
    分歧:
    - 动作条件化机制：有的方法在Transformer块内注入帧级动作模块，有的使用独立扩散时间步或事后学习掩码。
    - 对齐目标：不同工作在优化人类偏好、使用DPO结合解耦判别器，或应用RL与多维奖励模型上存在差异。
    - 评估基准与指标：各工作强调不同的标准——视觉质量、策略相关性、零样本物理一致性或空间推理精度，导致评估标准碎片化。
    - 缩放策略：部分方法侧重模型和数据规模的预训练缩放，另一些探索测试时计算缩放，但现有证据表明后者在某些基准上失败。
    - 模型开放性与可复现性：部分方法依赖闭源预训练模型，另一些则发布检查点和训练代码，造成比较基线不统一。
    开放问题:
    - 如何将显式状态表示融入视频生成世界模型，以改善长期物理一致性和因果推理？
    - 何种验证器或奖励模型设计能在避免信息瓶颈和偏差的前提下实现可靠的测试时缩放？
    - 针对操作任务开发的对齐技术能否迁移到导航或可变形物体交互等更广泛领域？
    - 社区应如何从视觉保真度基准转向能测试物理持久性和因果性的标准化功能基准？
    - 所提出的概念分类法是否真正带来具体的架构变化或训练协议，还是仅停留在描述性框架层面？
