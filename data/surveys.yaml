  - 'Mainstream direction: Recent work builds runnable world-model and video-generation
    simulators, especially for autonomous driving and embodied control, with action
    conditioning, closed-loop evaluation, and benchmark artifacts.'
  - 'Shared research pattern: Systems couple a learned dynamics or video generator
    with explicit controls, latent or physics-informed context, and benchmark evaluation
    for controllability, consistency, or zero-shot generalization.'
  - 'Key differences: Papers differ by representation (recurrent state-space, diffusion
    transformer, autoregressive), supervision signal (physics-informed depth/keypoints,
    context values, trajectory/action labels), and evaluation target (action fidelity,
    spatial consistency, planning realism, deployment latency).'
  - 'Trend evolution: The 2024-2026 frontier moves from high-fidelity video generation
    toward closed-loop, action-controllable, physics-aware, and deployable world-model
    systems, with benchmarks such as LoopNav and ACT-Bench formalizing missing evaluations.'
  - 'Open questions: Independent cross-team reproduction, generalization beyond single
    or few benchmarks, long-horizon closed-loop stability, latency/fidelity/controllability
    trade-offs, and reliability under unseen physical contexts remain unverified.'
  related_work_outline_zh:
  - 主流方向：近期工作构建可运行的世界模型与视频生成模拟器，主要用于自动驾驶与具身控制，强调动作条件、闭环评估和基准工件。
  - 研究共性：系统将学习到的动力学或视频生成器与显式控制、潜在或物理上下文信号结合，并在基准数据集上评测可控性、一致性或零样本泛化。
  - 关键差异：表示方式包括循环状态空间、扩散Transformer和自回归模型；监督信号包括物理信息深度/关键点、上下文值、轨迹/动作标注；评测目标包括动作忠实度、空间一致性、规划真实性和部署延迟。
  - 趋势演进：2024–2026年前沿从高保真视频生成走向闭环、动作可控、物理感知和可部署的世界模型系统，LoopNav和ACT-Bench等基准开始补齐此前缺失的评测。
  - 开放问题：跨团队独立复现、超越单一或少量基准的泛化、长时程闭环稳定性、延迟/保真度/可控性权衡，以及未见物理上下文下的可靠性仍未得到充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Context-conditioned model-based reinforcement learning systems
      what_it_solves: Integrating observable context into world-model latent dynamics
        to improve zero-shot generalization of policies trained on imagined rollouts.
      what_remains_open: Assumes observable context values and is validated on only
        two CARL tasks, so hidden-context settings and broader deployment remain uncovered.
    - line: Action-controllable closed-loop driving world-model simulators
      what_it_solves: Turning video generation into controllable driving simulation
        with action fidelity, multi-view consistency, and planning or policy-evaluation
        utility.
      what_remains_open: Evaluation is concentrated on nuScenes, nuPlan, or Waymo
        settings; long-horizon cross-view consistency and generalization to other
        sensors, environments, or multi-GPU deployment remain unverified.
    - line: Physics-informed and consistency-aware world-model evaluation
      what_it_solves: Adding spatial or physical consistency signals, metrics, and
        datasets to assess world-model rollouts beyond pixel-level fidelity.
      what_remains_open: Much of the evidence is dataset or benchmark construction;
        independent downstream model comparisons and experimental results are still
        limited or absent.
    - line: Pretrained video generators repurposed as controllable world simulators
      what_it_solves: Inserting lightweight action-conditioned modules into existing
        diffusion or autoregressive video generators to produce dynamic, action-controllable
        transitions for games and robotics.
      what_remains_open: Relies on pretrained model biases, may sacrifice fine-grained
        visual detail, and is validated only in selected game and robotics domains.
    consensus:
    - Learned world models are being reframed as runnable simulators for closed-loop
      control and policy evaluation, not only as open-loop video generators.
    - Explicit conditioning through actions, trajectories, context values, or physics/keypoint
      signals is widely used to make generated futures more controllable and consistent.
    - Quantitative benchmarks and open artifacts are increasingly central for comparing
      controllability, action fidelity, and spatial or physical consistency.
    disagreements:
    - Representation choices diverge among recurrent state-space models, diffusion
      transformers, and autoregressive generators.
    - 'Supervision strategy differs: context conditioning, physics-informed temporal
      depth and keypoint learning, trajectory-annotated action data, or motion-reinforced
      losses.'
    - 'Primary evaluation target differs: some optimize zero-shot policy generalization,
      some action fidelity or spatial consistency, some scene realism or planning
      utility, and some system latency.'
    open_questions:
    - How well do these systems transfer outside specific benchmarks such as nuScenes,
      CARL, Minecraft LoopNav, or selected game and robot domains?
    - Can long-horizon closed-loop simulation remain geometrically, spatially, and
      physically consistent while preserving sub-second or real-time latency?
    - What independent reproduction evidence exists across teams, datasets, and infrastructure
      when code or dataset artifacts are not fully available?
    - How should systems handle unobservable context, distribution shifts, and inherited
      pretrained-model biases in deployed pipelines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 上下文条件化的基于模型的强化学习系统
      解决的问题: 将可观测上下文整合到世界模型潜在动力学中，以提升在想象轨迹上训练策略的零样本泛化能力。
      尚未覆盖: 假设上下文值可观测，且仅在两个CARL任务上验证；隐藏上下文设置和更广泛部署仍未覆盖。
    - 路线: 动作可控的闭环驾驶世界模型模拟器
      解决的问题: 将视频生成转化为具备动作忠实度、多视图一致性和规划或策略评估用途的可控驾驶模拟。
      尚未覆盖: 评估集中在nuScenes、nuPlan或Waymo设置；长时程跨视图一致性、对其他传感器或环境以及多GPU部署的泛化尚未得到验证。
    - 路线: 物理信息驱动与空间一致性感知的世界模型评测
      解决的问题: 加入空间或物理一致性信号、指标和数据集，以评估超出像素级保真度的世界模型推演。
      尚未覆盖: 大量证据停留在数据集或基准构建；独立下游模型对比和实验结果仍然有限或缺失。
    - 路线: 将预训练视频生成器重构为可控世界模拟器
      解决的问题: 将轻量级动作条件模块插入现有扩散或自回归视频生成器，为游戏和机器人生成动态、动作可控的转移视频。
      尚未覆盖: 依赖预训练模型偏差，可能牺牲细粒度视觉细节，且仅在选定的游戏和机器人领域验证。
    共识:
    - 学习到的世界模型正被重新定位为用于闭环控制和策略评估的可运行模拟器，而不仅是开环视频生成器。
    - 通过动作、轨迹、上下文值或物理/关键点信号进行显式条件化，被广泛用于提升生成未来的可控性和一致性。
    - 定量基准和开放工件在比较可控性、动作忠实度以及空间或物理一致性方面日益重要。
    分歧:
    - 表示选择在循环状态空间模型、扩散Transformer和自回归生成器之间存在差异。
    - 监督策略不同：上下文条件化、物理信息时间深度与关键点学习、轨迹标注动作数据或运动增强损失。
    - 主要评测目标不同：有的优化零样本策略泛化，有的优化动作忠实度或空间一致性，有的优化场景真实感或规划用途，有的优化系统延迟。
    开放问题:
    - 这些系统在nuScenes、CARL、Minecraft LoopNav或选定游戏和机器人领域之外的迁移能力如何？
    - 长时程闭环模拟能否在保持亚秒级或实时延迟的同时，维持几何、空间和物理一致性？
    - 当代码或数据集工件不完整时，跨团队、数据集和基础设施的独立复现证据如何？
    - 部署流水线应如何处理不可观测上下文、分布偏移和预训练模型继承偏差？
