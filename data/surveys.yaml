  literature_review:
    line_of_work_matrix:
    - line: World-model benchmarking systems
      what_it_solves: Turning spatial and action consistency into measurable properties
        of generative world models through dedicated datasets, task setups, and metrics.
      what_remains_open: Reported benchmark results for diverse baselines are sparse,
        and evidence is limited to specific environments such as Minecraft navigation
        or nuScenes driving.
    - line: Context-aware and physics-informed embodied world models
      what_it_solves: Improving zero-shot policy generalization or physical plausibility
        by conditioning latent dynamics on observed context and learning physics-like
        depth or keypoint signals.
      what_remains_open: Assumes context observability; direct evaluation is narrow
        such as two CARL tasks or visual/physical plausibility without stated limitations.
    - line: Action-controllable driving world models and closed-loop simulators
      what_it_solves: Generating high-fidelity, action-following, multi-view future
        video under low latency for autonomous driving simulation.
      what_remains_open: Demonstrated mainly on nuScenes; long-horizon and cross-view
        consistency under distribution shift and multi-GPU scalability remain open.
    - line: Cross-embodiment world-model systems using latent actions
      what_it_solves: Providing a shared action interface across human videos, robot
        demonstrations, and simulation rollouts to improve video prediction and downstream
        policy success.
      what_remains_open: Reproducibility signals are weaker and no explicit limitations
        are reported, so independent reproduction and broader embodiment generalization
        are unverified.
    - line: Reproducible benchmark and dataset artifacts for world-model systems
      what_it_solves: Packaging datasets, evaluation frameworks, and baseline models
        so that action fidelity or spatial consistency can be tested and reused.
      what_remains_open: Availability signals differ across papers; independent reproduction
        across teams, hardware, and datasets is not established from the bounded evidence.
    consensus:
    - World-model systems are evaluated on video fidelity plus a control-related measure
      such as action fidelity, spatial consistency, physical plausibility, or downstream
      policy success.
    - Conditioning on actions or context is a central mechanism for making generative
      simulation systems usable beyond unconditional video generation.
    - Open datasets and benchmarks are treated as important, but evidence of artifact
      completeness and independent reuse varies.
    disagreements:
    - 'Action representation differs: explicit trajectory/control signals for driving,
      observable context values for latent dynamics, physics-informed keypoint/depth
      tasks, or universal latent actions.'
    - 'Evaluation target differs: some work measures spatial consistency or action
      fidelity, while others optimize video quality metrics, physical plausibility,
      or robot policy success rates.'
    - 'Deployment setting differs: closed-loop driving simulation, contextual reinforcement
      learning, Minecraft navigation, and real-robot cross-embodiment transfer each
      impose different system constraints.'
    open_questions:
    - Do spatial consistency and action fidelity metrics predict downstream policy
      performance across deployment settings?
    - Can context-aware or physics-informed world models generalize beyond the narrow
      benchmark suites visible in this evidence, such as two CARL tasks or nuScenes?
    - What action interface best maintains controllability while scaling across heterogeneous
      embodiments without shared native action spaces?
    - Where are the latency and fidelity boundaries for sub-second closed-loop simulation
      on single-GPU and multi-GPU deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评测系统
      解决的问题: 通过专用数据集、任务设置和指标，将空间一致性与动作忠实度变成生成式世界模型可测量的性质。
      尚未覆盖: 对多种基线报告的结果较稀疏，证据主要限于Minecraft导航或nuScenes驾驶等特定环境。
    - 路线: 上下文感知与物理信息的具身世界模型
      解决的问题: 通过将潜在动态条件化于可观测上下文并学习类物理的深度/关键点信号，提升零样本策略泛化或物理合理性。
      尚未覆盖: 假设上下文可观测；直接评估较窄，如两个CARL任务或视觉/物理合理性，且缺少明确局限性说明。
    - 路线: 动作可控的驾驶世界模型与闭环仿真器
      解决的问题: 在低延迟下生成高保真、动作跟随、多视图的未来视频，用于自动驾驶仿真。
      尚未覆盖: 主要在nuScenes上展示；长时域与跨视图一致性在分布偏移下保持，以及多GPU可扩展性仍开放。
    - 路线: 使用潜在动作的跨具身世界模型系统
      解决的问题: 在人类视频、机器人演示和仿真 rollout 之间提供共享动作接口，以改善视频预测和下游策略成功率。
      尚未覆盖: 可复现信号较弱且未报告明确限制；独立复现和更广泛具身泛化未验证。
    - 路线: 世界模型系统的可复现基准与数据集工件
      解决的问题: 封装数据集、评测框架和基线模型，使动作忠实度或空间一致性可被测试与复用。
      尚未覆盖: 不同论文的可用性信号不同；跨团队、硬件和数据集的独立复现未建立。
    共识:
    - 世界模型系统在视频保真度之外，还会用动作忠实度、空间一致性、物理合理性或下游策略成功等控制相关指标进行评测。
    - 动作或上下文条件化是让生成式仿真系统超越无条件视频生成的核心机制。
    - 开放数据集和基准被视为重要，但工件完整性与独立复用证据不一。
    分歧:
    - 动作表示不同：驾驶中的显式轨迹/控制信号、潜在动力学中的可观测上下文值、物理信息的关键点/深度任务，或通用潜在动作。
    - 评测目标不同：有的工作关注空间一致性或动作忠实度，有的优化视频质量指标、物理合理性或机器人策略成功率。
    - 部署场景不同：闭环驾驶仿真、上下文强化学习、Minecraft导航和真实机器人跨具身迁移对系统约束不同。
    开放问题:
    - 空间一致性与动作忠实度指标能否预测下游策略表现在不同部署场景中的效果？
    - 上下文感知或物理信息世界模型能否泛化到本证据中所见较窄基准之外，例如两个CARL任务或nuScenes？
    - 哪种动作接口能在没有共享原生动作空间的情况下，兼顾可控性与跨具身扩展？
    - 在单GPU与多GPU部署中，面向亚秒级闭环仿真的延迟与保真度边界在哪里？
