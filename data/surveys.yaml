  related_work_outline:
  - 'Mainstream direction: World models are shifting from game-based RL to robotics
    and driving, using Transformer/diffusion architectures for video generation and
    action prediction. They emphasize multi-task generalization via context conditioning,
    compositionality, and auxiliary tasks like depth or mask reconstruction.'
  - 'Shared research pattern: Most works train world models via self-supervised learning
    on visual observations, incorporating stochasticity through VAEs or diffusion.
    They add auxiliary losses or physics-informed tasks to improve long-horizon consistency,
    and increasingly couple action prediction with video generation.'
  - 'Key differences: Supervision signals vary (mask reconstruction, depth, keypoint
    dynamics, context labels). Action interfaces differ: internal simulator for policy
    learning, direct action diffusion, or video plans. Evaluation targets range from
    Atari scores to diagnostic benchmarks for memory and controllability. Deployment
    is mostly simulation or offline data, lacking real-robot closed-loop validation.'
  - 'Trend evolution: From 2023 efficient Atari models (STORM) through 2024 contextual/compositional
    generalization (cRSSM, RoboDreamer) to 2025 diffusion-based robotics pretraining
    (MaskGWM, RoboScape, UWM). In 2026, dedicated benchmarks like MIND emerge to test
    memory and action control, indicating a maturation from model building to capability
    auditing.'
  - 'Open questions: Do world model improvements translate to better real-world policies,
    or are gains from planners/datasets? Can compositional generalization extend beyond
    predefined primitives? How do diagnostic benchmarks correlate with real task performance?
    What is the trade-off between compute cost and long-horizon consistency?'
  related_work_outline_zh:
  - 主流方向：世界模型从游戏RL转向机器人和自动驾驶，采用Transformer/扩散架构进行视频生成与动作预测，通过上下文条件化、组合性和深度预测等辅助任务追求多任务泛化。
  - 研究共性：多数工作通过自监督学习在视觉观测上训练世界模型，利用VAE或扩散引入随机性，添加辅助损失或物理信息任务改进长时域一致性，并日益将动作与视频生成耦合。
  - 关键差异：监督信号各异（掩码重建、深度、关键点动力学、上下文标签）；动作接口不同（内部模拟器、直接动作扩散、视频计划）；评测目标从Atari得分到记忆与可控性诊断基准；部署多在仿真或离线数据，缺乏真实机器人闭环验证。
  - 趋势演进：2023年高效Atari模型（STORM），2024年上下文/组合泛化（cRSSM, RoboDreamer），2025年扩散架构机器人预训练（MaskGWM,
    RoboScape, UWM），2026年出现MIND等专门基准测试记忆和动作控制，标志领域从建模走向能力审计。
  - 开放问题：世界模型改进能否转化为真实世界策略增益，还是源于规划器/数据集？组合泛化能否超越预定义原语？诊断基准与真实任务性能的相关性如何？计算成本与长时域一致性如何权衡？
  literature_review:
    line_of_work_matrix:
    - line: Stochastic transformer-based architecture design
      what_it_solves: Efficiently learning latent dynamics from high-dimensional observations
        using VAEs and Transformers, achieving high sample-efficiency in model-based
        RL on Atari benchmarks.
      what_remains_open: Whether the reported gains transfer to continuous control
        or real-world tasks; the isolated effect of the architecture versus the imagination-based
        policy optimization remains unclear.
    - line: Contextual and compositional world models for generalization
      what_it_solves: Enabling zero-shot generalization to unseen dynamics or task
        combinations by conditioning on context variables or decomposing tasks into
        primitives.
      what_remains_open: Requires observable context or predefined primitives; generalization
        to entirely novel primitives or hidden contexts is not addressed, and real-robot
        validation is absent.
    - line: Unified video-action diffusion for multitask policies
      what_it_solves: Jointly modeling video and action sequences within a single
        diffusion transformer, allowing flexible switching between policy, forward
        dynamics, and video generation for robot learning.
      what_remains_open: Scaling beyond the demonstrated datasets and action spaces;
        the contribution of video generation versus action prediction to final policy
        performance is not disentangled.
    - line: Physics-informed and reconstruction-based video generation
      what_it_solves: Improving physical plausibility and long-horizon consistency
        in generated videos by adding auxiliary tasks such as depth prediction, keypoint
        dynamics, or mask reconstruction.
      what_remains_open: The utility of these auxiliary signals for downstream planning
        or control is assumed but not rigorously compared against simpler baselines;
        evaluation is limited to visual fidelity metrics.
    - line: Diagnostic benchmarks for world model capabilities
      what_it_solves: Providing standardized datasets and metrics to assess spatial
        consistency, memory, and action-following in world models, revealing failures
        beyond pixel-level quality.
      what_remains_open: Benchmarks are confined to simulated or curated video domains;
        the correlation between benchmark scores and real-world task performance remains
        unverified.
    consensus:
    - World models are increasingly built on Transformer or diffusion backbones to
      handle long-range dependencies and stochasticity.
    - Auxiliary losses or multi-task training (mask reconstruction, depth prediction,
      keypoint dynamics) are used to inject physical or structural priors into video
      generation.
    - There is a shift from pure video prediction to joint modeling of actions and
      observations, enabling direct policy extraction or planning.
    - Generalization is pursued through context conditioning, compositionality, or
      pretraining on diverse robotics datasets.
    disagreements:
    - 'Supervision signal: some methods rely on self-supervised reconstruction (mask,
      depth), others on explicit context labels or pure video generation losses.'
    - 'Action interface: world models are used as internal simulators for policy optimization,
      as direct action generators, or as video planners without explicit action outputs.'
    - 'Evaluation target: metrics range from Atari game scores and video prediction
      fidelity to novel benchmark scores for memory consistency and controllability;
      no unified framework exists.'
    - 'Deployment setting: works are evaluated in simulation, offline real-world datasets,
      or game engines, but none provides closed-loop real-robot validation with the
      world model in the loop.'
    open_questions:
    - Do improvements in world model accuracy directly translate to better policy
      or planning performance, or are gains dominated by the planner and dataset?
    - Can compositional or contextual generalization extend to open-vocabulary tasks
      without predefined primitives?
    - How well do current diagnostic benchmarks (spatial consistency, memory, action
      control) predict real-world task success?
    - What is the trade-off between computational cost and long-horizon consistency,
      and how can it be optimized for real-time control?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于随机Transformer的架构设计
      解决的问题: 利用VAE和Transformer从高维观测中高效学习潜在动力学，在Atari基准上实现高样本效率的基于模型的强化学习。
      尚未覆盖: 收益是否迁移到连续控制或真实任务不明确；架构效果与基于想象的策略优化效果未分离。
    - 路线: 面向泛化的上下文与组合世界模型
      解决的问题: 通过上下文变量条件化或任务原语分解，实现对新动力学或任务组合的零样本泛化。
      尚未覆盖: 要求可观测上下文或预定义原语；对新原语或隐藏上下文的泛化未解决，缺乏真实机器人验证。
    - 路线: 统一视频-动作扩散模型用于多任务策略
      解决的问题: 在单个扩散变换器中联合建模视频和动作序列，灵活切换策略、前向动力学和视频生成，用于机器人学习。
      尚未覆盖: 扩展到更大动作空间和数据集待验证；视频生成与动作预测对最终策略性能的贡献未解耦。
    - 路线: 物理信息与重建驱动的视频生成
      解决的问题: 通过添加深度预测、关键点动力学或掩码重建等辅助任务，增强生成视频的物理合理性和长时域一致性。
      尚未覆盖: 这些辅助信号对下游规划或控制的帮助假设性强，未与简单基线严格比较；评估限于视觉保真度。
    - 路线: 世界模型能力的诊断性基准
      解决的问题: 提供标准化数据集和指标，评估世界模型的空间一致性、记忆和动作跟随能力，揭示像素级质量之外的失败。
      尚未覆盖: 基准限于模拟或策划的视频域；基准分数与真实任务性能的相关性未经验证。
    共识:
    - 世界模型越来越多地采用Transformer或扩散骨干以处理长程依赖和随机性。
    - 通过辅助损失或多任务训练（掩码重建、深度预测、关键点动力学）注入物理或结构先验来改进视频生成。
    - 从纯视频预测转向联合建模动作和观测，以便直接提取策略或进行规划。
    - 通过上下文条件化、组合性或大规模机器人数据集预训练来追求泛化。
    分歧:
    - 监督信号：有的依赖自监督重建（掩码、深度），有的使用显式上下文标签，有的仅用视频生成损失。
    - 动作接口：世界模型被用作策略优化的内部模拟器、直接动作生成器，或作为无显式动作输出的视频规划器。
    - 评测目标：指标从Atari游戏得分、视频预测保真度到记忆一致性和可控性等新基准分数，缺乏统一框架。
    - 部署设置：工作评估于仿真、离线真实数据集或游戏引擎中，无一提供具有世界模型在环的真实机器人闭环验证。
    开放问题:
    - 世界模型精度的提升是否直接带来更好的策略或规划性能，还是增益主要由规划器和数据集主导？
    - 组合或上下文泛化能否扩展到无预定义原语的开放词汇任务？
    - 当前诊断性基准（空间一致性、记忆、动作控制）在多大程度上能预测真实任务的成功？
    - 计算成本与长时域一致性之间的权衡如何，以及如何针对实时控制进行优化？
