  related_work_outline:
  - 'Mainstream direction: Current benchmark-related work centers on evaluating world
    models through domain-specific environments—driving, robotics, Minecraft, Atari—rather
    than one generic suite. The dominant direction combines visual generation quality
    with downstream policy utility, increasingly using standardized datasets and reproducible
    benchmarks.'
  - 'Shared research pattern: Studies converge on fixed datasets and standardized
    metrics such as Atari 100k, CARL, driving benchmarks, Minecraft loop navigation,
    robotic datasets, and video-action suites. They compare against baselines and
    report normalized scores or training cost, while newer benchmarks add targeted
    consistency and action-control probes.'
  - 'Key differences: They differ in evaluation target: visual fidelity, zero-shot
    dynamics, spatial consistency, memory consistency, action control, or policy sample
    efficiency. World-model representations also differ, including diffusion, Transformer-VAE,
    and context-conditioned recurrent state-space models, with different assumptions
    about observable context or closed-loop action spaces.'
  - 'Trend evolution: Ranked evidence concentrates in 2023-2026, so the visible pattern
    is a current-frontier trend. Evaluation is moving from aggregate Atari or CARL
    policy scores toward open datasets and stress tests for spatial consistency, long-horizon
    rollout, physical plausibility, and cross-action-space memory control.'
  - 'Open questions: Whether these suites cover deployment settings; whether proxy
    metrics align with downstream decisions; whether results remain stable across
    implementations and compute; how to compare open-loop generation with closed-loop
    action controllability; and how to address sparse limitation reporting and narrow
    task coverage.'
  related_work_outline_zh:
  - 主流方向：当前相关基准工作主要围绕驾驶、机器人、Minecraft、Atari等特定环境评估世界模型，而不是单一通用评测集。主流方向将视觉生成质量与下游策略效用结合，越来越多使用标准化数据集和可复现基准。
  - 研究共性：论文普遍采用固定数据集和标准化指标，如Atari 100k、CARL、驾驶基准、Minecraft循环导航、机器人数据集和视频-动作评测集，并与基线比较；新基准进一步加入一致性、动作控制等定向探测。
  - 关键差异：差异体现在评测目标：视觉保真度、零样本动力学、空间一致性、记忆一致性、动作控制或策略采样效率。模型表示也不同，如扩散、Transformer-VAE、上下文条件循环状态空间模型；对可观测上下文或闭环动作空间等假设也不同。
  - 趋势演进：排序证据集中在2023-2026年，因此属于当前前沿趋势。评测正从Atari或CARL的聚合分数转向开放数据集和压力测试，覆盖空间一致性、长时域推演、物理合理性与跨动作空间记忆控制。
  - 开放问题：这些基准是否覆盖真实部署场景；代理指标是否与下游决策一致；结论在不同实现和算力下是否稳定；如何统一比较开环生成与闭环动作控制；局限性报告和更广泛任务覆盖仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared, often domain-specific evaluation settings such
        as loop-navigation scenes, video-action suites, and driving or robotic environments
        so world-model claims become comparable.
      what_remains_open: Task distributions are often narrow and may not cover deployment
        conditions; some dataset papers report construction but limited experimental
        baseline evidence.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        physical plausibility, zero-shot generalization, and human-normalized policy
        returns beyond aggregate generation quality.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility is not established; few metrics span both open-loop realism and closed-loop
        control.
    - line: Comparable baselines and reporting
      what_it_solves: Provides reproducible baselines and standard comparisons across
        Atari, CARL, driving, and robotic settings, including normalized scores and
        training cost reporting.
      what_remains_open: Stability across implementations, compute budgets, and cross-suite
        baselines remains unverified; several studies omit limitations or use non-identical
        evaluation conventions.
    consensus:
    - Evaluation standardizes around shared environment suites and human-normalized
      or task-specific scores rather than isolated qualitative samples.
    - Recent benchmarks add targeted stress tests such as spatial consistency, memory
      consistency, action control, and physical plausibility to aggregate generation
      metrics.
    - World model evaluations increasingly couple visual or dynamics quality with
      downstream policy learning or policy evaluation utility.
    - Several ranked studies signal reproducibility through open datasets, code, and
      baseline comparisons, though reporting depth varies.
    disagreements:
    - 'Evaluated domains and action settings differ: closed-loop video-action benchmark
      settings, open-loop generation rollouts, and dataset-driven policy training
      coexist.'
    - 'Metrics prioritize different outcomes: visual fidelity and physical realism,
      zero-shot dynamics generalization, spatial or memory consistency, action controllability,
      or sample-efficient policy return.'
    - World-model representation choices differ, including diffusion-based generation,
      Transformer-VAE stochastic models, and context-conditioned recurrent state-space
      models.
    - Supervision assumptions differ, such as observable context values, action-free
      video, multi-view data, or shared action spaces across viewpoints.
    - Baseline and suite choices differ enough that normalized scores are not directly
      comparable across Atari, CARL, driving, robotic, and Minecraft settings.
    open_questions:
    - Do current loop-navigation, video-action, and domain suites cover the deployment
      conditions where world models are expected to improve decision-making?
    - Are visual fidelity and physical plausibility metrics aligned with downstream
      policy robustness, and if so under which distribution shift or interaction conditions?
    - Can benchmark conclusions remain stable across implementations, compute budgets,
      and replications when reported training costs vary substantially?
    - How should open-loop visual generation quality be weighted against closed-loop
      action-control and memory-consistency failures in a unified evaluation?
    - How can evaluation systematically cover cross-action-space and cross-viewpoint
      generalization when current evidence identifies this as a key remaining challenge?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 通过循环导航场景、视频-动作评测集以及驾驶和机器人领域评测集，为世界模型主张提供共享比较基础。
      尚未覆盖: 任务分布较窄，可能未覆盖部署条件；部分数据集论文报告了构建，但基线实验证据有限。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合分数之外探测空间一致性、记忆一致性、动作控制、物理合理性、零样本泛化和人类归一化策略回报。
      尚未覆盖: 这些代理指标与下游决策效用的一致性尚未建立；很少有指标同时衡量开环真实感和闭环控制。
    - 路线: 可比基线与报告规范
      解决的问题: 在Atari、CARL、驾驶和机器人场景中提供可复现基线和标准比较，并报告归一化分数与训练开销。
      尚未覆盖: 结论在不同实现、算力预算和跨基准基线下是否稳定尚未验证；若干研究未报告局限性或使用不一致的评测约定。
    共识:
    - 评估普遍采用共享环境套件和人类归一化或任务特定分数，而非零散定性样本。
    - 近期基准在聚合生成指标之外加入空间一致性、记忆一致性、动作控制和物理合理性等定向压力测试。
    - 世界模型评估越来越多地将视觉或动力学质量与下游策略学习或策略评测效用结合。
    - 多个排序研究通过开放数据集、代码和基线比较显示可复现信号，但报告深度不一。
    分歧:
    - 评测域和动作设置不同：闭环视频-动作基准、开环生成推演和基于数据集的策略训练并存。
    - 指标侧重不同：视觉保真度与物理真实性、零样本动力学泛化、空间或记忆一致性、动作可控性或采样高效策略回报。
    - 世界模型表示选择不同，包括扩散生成、Transformer-VAE随机模型和上下文条件循环状态空间模型。
