  related_work_outline:
  - 'Mainstream direction: Diffusion-based architectures dominate world model design,
    with joint modeling of video and action for robot learning and planning.'
  - 'Shared research pattern: Most methods learn latent dynamics from pixel observations,
    using self-supervised reconstruction or prediction objectives conditioned on actions
    or language.'
  - 'Key differences: Methods diverge in whether they use explicit physics priors
    (depth, keypoints), factorize scene composition via language, or unify policy
    and dynamics in a single model.'
  - 'Trend evolution: The field moved from efficient RL-oriented world models (STORM,
    2023) to large-scale diffusion models for video generation and action prediction,
    and now toward systematic benchmarks for memory and control.'
  - 'Open questions: Long-horizon consistency, generalization across action spaces,
    and the role of explicit physical grounding remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散的架构在世界模型设计中占主导，联合建模视频与动作以支持机器人学习与规划。
  - 研究共性：多数方法从像素观测中学习潜在动力学，使用自监督重建或预测目标，并以动作或语言为条件。
  - 关键差异：方法在是否使用显式物理先验（深度、关键点）、是否通过语言分解场景组合、是否在单一模型中统一策略与动力学等方面存在分歧。
  - 趋势演进：领域从高效的RL世界模型（STORM，2023）转向大规模扩散模型用于视频生成与动作预测，现在正迈向记忆与控制的系统性基准测试。
  - 开放问题：长时域一致性、跨动作空间泛化以及显式物理基础的作用仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based world models for video generation
      what_it_solves: Generating high-fidelity, multi-view, and temporally coherent
        videos from action or language conditions, enabling visual planning and data
        augmentation for robotics.
      what_remains_open: The reliance on large-scale video datasets and the difficulty
        of ensuring physical plausibility and consistency over long horizons, with
        limited evidence of generalization to entirely novel dynamics.
    - line: Stochastic sequence models for model-based RL
      what_it_solves: Improving sample efficiency and zero-shot generalization in
        RL by learning compact latent dynamics with Transformers and variational inference,
        enabling policy learning in imagination.
      what_remains_open: Assumptions about observable context or fixed action spaces,
        and evaluation limited to a few standard benchmarks without demonstrating
        transfer to real-world robotic tasks.
    - line: Benchmarks for world model evaluation
      what_it_solves: Providing standardized protocols and metrics to assess spatial
        consistency, memory, and action control, moving beyond ad-hoc visual quality
        metrics.
      what_remains_open: Current benchmarks focus on specific domains (Minecraft,
        driving) and may not capture the full complexity of open-world, long-term
        interactions; no consensus on a unified evaluation suite.
    consensus:
    - World models are moving toward learning from pixel-level observations with self-supervised
      objectives, often without explicit 3D or physics supervision.
    - Incorporating actions as conditioning signals is crucial for controllable generation
      and downstream policy learning.
    - There is a growing recognition that standard video quality metrics are insufficient,
      and new benchmarks are needed to evaluate long-term consistency and controllability.
    disagreements:
    - 'Representation: Some works use diffusion transformers with masked reconstruction
      (MaskGWM), while others factorize generation via language primitives (RoboDreamer)
      or couple video and action diffusion in a unified transformer (UWM).'
    - 'Supervision signal: RoboScape introduces explicit physics-informed tasks (depth,
      keypoints) to improve realism, whereas most other methods rely purely on RGB
      reconstruction.'
    - 'Evaluation target: STORM and cRSSM focus on policy performance in RL benchmarks,
      while the diffusion-based methods prioritize video quality and downstream task
      success, and the benchmarks measure memory consistency and action control directly.'
    - 'Interaction mode: Methods like UWM and cRSSM tightly integrate action prediction
      into the model, while others treat action as an external conditioning variable
      and are primarily evaluated on video generation quality.'
    open_questions:
    - Can world models maintain spatial and temporal consistency over long horizons
      without explicit memory mechanisms, as questioned by the MIND benchmark?
    - How much does the performance gain in planning tasks come from the model architecture
      versus the training data scale and the planner design?
    - Are current physics-informed approaches (e.g., keypoint dynamics) sufficient
      to capture complex real-world interactions, or do they require more detailed
      physical simulations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的世界模型视频生成
      解决的问题: 根据动作或语言条件生成高保真、多视角且时间连贯的视频，为机器人提供视觉规划与数据增广。
      尚未覆盖: 对大规模视频数据集的依赖，难以保证长时域物理合理性与一致性，以及对全新动力学泛化证据不足。
    - 路线: 用于基于模型的RL的随机序列模型
      解决的问题: 通过Transformer和变分推断学习紧凑的潜在动力学，提升RL的样本效率与零样本泛化，实现在想象中的策略学习。
      尚未覆盖: 对可观测上下文或固定动作空间的假设，评估仅限于少数标准基准，未展示向真实机器人任务的迁移。
    - 路线: 世界模型评估基准
      解决的问题: 提供标准化协议与指标，评估空间一致性、记忆和动作控制，超越临时的视觉质量指标。
      尚未覆盖: 当前基准聚焦特定领域（Minecraft、驾驶），可能未涵盖开放世界长期交互的复杂性，缺乏统一评估套件的共识。
    共识:
    - 世界模型正向从像素级观测中自监督学习的方向发展，通常不使用显式3D或物理监督。
    - 将动作作为条件信号纳入，对于可控生成和下游策略学习至关重要。
    - 越来越多的人认识到标准视频质量指标不足，需要新的基准来评估长期一致性和可控性。
    分歧:
    - 表示方式：有些工作使用具有掩码重建的扩散Transformer（MaskGWM），其他工作则通过语言原语分解生成（RoboDreamer）或在统一Transformer中耦合视频与动作扩散（UWM）。
    - 监督信号：RoboScape引入显式物理信息任务（深度、关键点）以提升真实感，而其他多数方法仅依赖RGB重建。
    - 评测目标：STORM和cRSSM关注RL基准中的策略性能，扩散方法更注重视频质量与下游任务成功率，而基准则直接衡量记忆一致性和动作控制。
    - 交互模式：UWM和cRSSM将动作预测紧密集成到模型中，其他方法则将动作视为外部条件变量，主要评估视频生成质量。
    开放问题:
    - 如MIND基准所质疑，世界模型能否在没有显式记忆机制的情况下保持长时域空间与时间一致性？
    - 规划任务中的性能提升有多少来自模型架构，又有多少来自训练数据规模和规划器设计？
    - 当前的物理信息方法（如关键点动力学）是否足以捕捉复杂的真实世界交互，还是需要更详细的物理仿真？
