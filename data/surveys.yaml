    line_of_work_matrix:
    - line: Benchmark-driven evaluation platforms for world models
      what_it_solves: Creates datasets and metrics to test spatial and action fidelity,
        turning informal generation quality into measurable model behavior.
      what_remains_open: Evidence is concentrated in Minecraft or driving scenes;
        independent replication across environments and hardware is not yet shown.
    - line: Action-controllable closed-loop simulators
      what_it_solves: Generates future video from trajectory or action controls and
        supports low-latency closed-loop simulation, including sub-second driving
        video generation.
      what_remains_open: Generalization beyond nuScenes-like settings, long-horizon
        cross-view consistency, and multi-GPU deployment remain unverified.
    - line: Context/physics-informed world-model architectures
      what_it_solves: Adds context or physics constraints to latent dynamics or video
        generation to improve zero-shot generalization and physical plausibility.
      what_remains_open: Assumes observable context or relies on narrow benchmark
        tasks; limitation details and out-of-distribution behavior are not fully reported.
    - line: Cross-embodiment latent-action world models
      what_it_solves: Uses a shared latent action interface across heterogeneous interaction
        data to generate synthetic demonstrations and improve policy success.
      what_remains_open: Open artifacts and independent reproduction are weakly supported;
        limitations and long-horizon stability are not evidenced.
    consensus:
    - Recent systems treat world models as video generative simulators conditioned
      on action, context, or physics rather than as isolated predictive models.
    - Evaluation increasingly includes action fidelity, spatial consistency, and downstream
      policy performance, not only visual quality metrics.
    - Datasets and benchmarks are used as shared infrastructure to expose model failure
      modes such as poor instruction following or spatial inconsistency.
    - Open-source artifacts are present in several high-reproducibility signals, but
      independent reproduction remains a verification gap.
    disagreements:
