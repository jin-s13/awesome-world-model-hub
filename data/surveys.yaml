  related_work_outline_zh:
  - 主流方向：构建可运行的世界模型系统与基准，将动作或上下文条件生成模型转化为面向驾驶、机器人和导航的模拟器，强调可控视频及下游使用。
  - 研究共性：从动作或上下文数据学习未来观测生成或潜在动力学，评估保真度、一致性、可控性和下游策略学习，并将数据集或代码作为系统栈一部分发布。
  - 关键差异：潜在循环动力学与视频生成主干；真实机器人学习与闭环驾驶模拟；仅基准证据与方法加基准流水线；通过显式条件、物理辅助或插件适配器引入控制。
  - 趋势演进：证据集中于2022至2026年，属当前前沿；从物理机器人在线世界模型学习，走向大规模动作控制视频模拟器和评测框架，更强调空间/动作一致性与实时服务。
  - 开放问题：基准指标是否预测下游任务成功；在nuScenes、Minecraft、CARL及特定机器人之外的泛化；长时程与分布外可靠性；跨硬件独立可复现。
  literature_review:
    line_of_work_matrix:
    - line: Online world-model training for embodied policy learning
      what_it_solves: Learns latent dynamics from camera observations and sparse rewards
        so robots can learn behaviors directly in real-world settings; examples include
        DayDreamer and cRSSM.
      what_remains_open: Generalization across hardware and tasks, context observability
        assumptions, and physical-access requirements for independent reproduction.
    - line: Benchmarking systems for spatial and action fidelity
      what_it_solves: Provides datasets and quantitative metrics for measuring whether
        world models preserve spatial consistency or follow driving actions; LoopNav
        and Terra ACT-Bench illustrate this.
      what_remains_open: Whether improved scores transfer to downstream policy quality
        in settings beyond the benchmark environment.
    - line: Action-controllable video simulation and closed-loop serving
      what_it_solves: Transforms generative video backbones into controllable simulators
        with fine-grained action or structured control, targeting real-time or closed-loop
        operation; examples include Vista and FAR-Drive.
      what_remains_open: Long-horizon and out-of-distribution degradation, dataset-limited
        evaluation, and hardware-dependent latency.
    - line: Physics-informed or adapter-based simulator construction
      what_it_solves: Adds auxiliary physical learning or plug-in control modules
        to improve plausibility and controllability across domains; RoboScape and
        DWS illustrate this pattern.
      what_remains_open: Visual-detail versus control trade-offs, inherited pretrained
        model biases, and incomplete limitation or reproduction evidence.
    consensus:
    - Action/context conditioning is treated as central for building usable world-model
      systems, not merely for prediction.
    - Most systems provide some artifact signal such as datasets, evaluation code,
      or model code, though completeness varies.
    - Evaluation combines generation fidelity with task-oriented checks such as policy
      learning, action following, or spatial consistency.
    - World models are positioned as reusable simulation or runtime components for
      downstream decision making or evaluation.
    disagreements:
    - 'Backbone and representation differ: recurrent latent dynamics trained from
      interactions versus diffusion or autoregressive video generators adapted from
      pretrained models.'
    - 'Deployment setting differs: physical robot online learning, closed-loop autonomous
      driving simulation, and multi-domain game/robotics simulation impose different
      latency and reset assumptions.'
    - 'Evaluation target differs: dataset construction without reported experiments
      versus visual-metric comparison versus downstream policy learning or real-time
      serving.'
    - Control is introduced through explicit context inputs, structured trajectory
      conditioning, auxiliary keypoint/depth tasks, or lightweight action-conditioned
      adapters.
    open_questions:
    - Do spatial consistency and action fidelity metrics predict downstream policy
      success in unseen real-world tasks?
    - Can these systems generalize outside evaluated settings such as nuScenes, Minecraft,
      CARL tasks, and specific robot platforms?
    - How do long-horizon rollouts and out-of-distribution inputs affect consistency
      and controllability beyond the reported sequences?
    - What independent reproduction evidence exists across different teams, hardware,
      and datasets, given uneven code and dataset availability?
    - Where limitations, baselines, or metric details are missing, which conclusions
      should be treated as verification gaps rather than established results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向具身策略学习的在线世界模型训练
      解决的问题: 从相机观测和稀疏奖励学习潜在动力学，使机器人可在真实环境中直接学习行为，例如DayDreamer与cRSSM。
      尚未覆盖: 跨硬件和任务泛化、上下文可观测性假设，以及独立复现所需的物理实验条件。
    - 路线: 面向空间与动作保真度的基准系统
      解决的问题: 提供数据集和定量指标，衡量世界模型是否保持空间一致性或遵循驾驶动作，例如LoopNav与Terra ACT-Bench。
      尚未覆盖: 分数提升是否迁移为下游策略质量，以及基准环境之外的构念效度。
    - 路线: 动作可控视频模拟与闭环服务
      解决的问题: 将生成式视频骨干转化为具备细粒度动作或结构化控制的可控模拟器，面向实时或闭环运行，例如Vista与FAR-Drive。
      尚未覆盖: 长时程和分布外退化、数据集局限评估，以及硬件相关延迟。
    - 路线: 物理信息或适配器式模拟器构建
      解决的问题: 通过辅助物理学习或插件控制模块提升跨域合理性与可控性，例如RoboScape与DWS。
      尚未覆盖: 视觉细节与控制权衡、预训练模型偏差继承，以及局限性与复现证据不全。
    共识:
    - 动作或上下文条件化被视为构建可用世界模型系统的核心，而不仅是预测任务。
    - 多数系统提供某种工件信号，如数据集、评测代码或模型代码，但完整程度不一致。
    - 评测同时结合生成保真度和任务导向检查，如策略学习、动作遵循或空间一致性。
    - 世界模型被定位为可复用的仿真或运行时组件，用于下游决策或评测。
    分歧:
    - 主干与表示不同：从交互数据训练的循环潜在动力学，相对于由预训练模型适配而来的扩散或自回归视频生成器。
    - 部署设置不同：物理机器人在线学习、闭环自动驾驶仿真和多域游戏/机器人仿真对延迟与重置假设要求不同。
    - 评测目标不同：仅构建数据集且未报告实验，相对于在视觉指标上比较方法，再到下游策略学习或实时服务。
    - 控制引入方式不同：显式上下文输入、结构化轨迹条件、关键点/深度辅助任务或轻量动作条件适配器。
    开放问题:
    - 空间一致性与动作保真度指标能否预测未见真实任务中的下游策略成功率？
    - 这些系统能否在nuScenes、Minecraft、CARL任务和特定机器人平台之外的场景泛化？
    - 在超出已报告序列的长时程和分布外输入下，一致性与可控性会受到怎样的影响？
    - 在代码和数据集可得性不均的情况下，跨团队、硬件和数据集的独立复现证据是什么？
    - 当局限性、基线或指标细节缺失时，哪些结论应视为验证缺口而非已确立结果？
