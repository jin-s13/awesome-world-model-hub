    language composition, or unified video-action diffusion—and evaluate on domain
    benchmarks.'
  - 'Key differences: Representations and training signals vary widely: latent state-space
    RL, video diffusion, compositional primitive generation, physics-informed generation,
    and unified action-video transformers; evaluations target different domains and
    generalization criteria.'
  - 'Trend evolution: Within the available 2023–2026 evidence, the trend moves from
    efficient RL world models and contextual generalization toward domain-specialized
    robotics/driving models, unified video-action pretraining, and diagnostic memory/action
    benchmarks.'
  - 'Open questions: Real-world transfer, long-term memory/spatial consistency, generalization
    to unseen physical interactions or primitives, and the absence of established
    deployment-grade evaluation remain unresolved.'
  related_work_outline_zh:
  - 主流方向：应用驱动世界模型正从通用视频生成转向驾驶、机器人、游戏和交互控制的专用模型，重点是以动作或领域条件进行预测，用于规划和策略学习。
  - 研究共性：论文引入领域特定的归纳偏置，例如掩码重建、上下文条件、物理信息深度/关键点学习、语言组合或统一的视频-动作扩散，并在领域基准上评测。
  - 关键差异：表示和训练信号差异明显，包括潜状态空间强化学习、视频扩散、组合原语生成、物理信息生成及统一动作-视频Transformer；评测目标和泛化标准不同。
  - 趋势演进：在现有2023—2026年证据内，趋势从高效强化学习世界模型与上下文泛化，走向领域专用的机器人/驾驶模型、统一视频-动作预训练和诊断性记忆/动作基准。
  - 开放问题：真实世界迁移、长期记忆/空间一致性、对未见物理交互或原语的泛化，以及缺乏面向部署的成熟评测协议仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving simulation and scene prediction
      what_it_solves: Predicts long-horizon, multi-view driving videos for simulation
        and policy evaluation; uses mask reconstruction with diffusion to improve
        cross-dataset generalization.
      what_remains_open: Evidence links performance to dataset metrics but not real-world
        driving safety or operational outcomes; distribution-shift coverage remains
        incomplete.
    - line: Robotic world models for task imagination and policy learning
      what_it_solves: Generates action-conditioned robot video plans or policies using
        language composition, physics-informed depth/keypoint tasks, or unified video-action
        diffusion to capture dynamics.
      what_remains_open: Real robot transfer beyond simulation or large dataset pretraining
        is not fully demonstrated; generalization to novel primitives and physical
        interactions is limited by training coverage.
    - line: Contextual and efficient model-based reinforcement learning
      what_it_solves: Learns latent world models for sample-efficient policy learning
        and zero-shot adaptation under observable context changes; transformer-VAE
        structures improve efficiency on visual RL tasks.
      what_remains_open: Evaluations are limited to narrow benchmarks such as Atari
        and CARL; context observability assumptions and small task counts leave broader
        generalization unverified.
    - line: Memory, spatial consistency, and action-control benchmarking for interactive
        worlds
      what_it_solves: Provides diagnostic datasets and metrics for loop navigation,
        scene graph consistency, memory consistency, and action control to expose
        long-term stability failures in open-world settings.
      what_remains_open: Benchmarks reveal current models struggle with long-horizon
        consistency and cross-action-space generalization, but no clear solution or
        accepted threshold is established.
    consensus:
    - Application-oriented world models typically couple visual prediction with action
      or domain-specific control signals for planning, policy learning, or simulation.
    - Domain-specific inductive biases such as context conditioning, physics auxiliary
      tasks, language composition, and mask reconstruction are used to improve generalization
      beyond monolithic generators.
    - Evaluation is expanding from single-step visual quality to long-horizon consistency,
      unseen task or context generalization, and physical or memory plausibility.
    - The available evidence is primarily benchmark-driven, with partial code or dataset
      release, but no consensus yet on real-world deployment validation.
    disagreements:
    - 'Representation differs: latent state-space models, video diffusion generators,
      compositional primitive models, and unified video-action transformers coexist.'
    - 'Supervision differs: self-supervised reconstruction or action prediction, physics-informed
      depth and keypoint learning, observable context conditioning, and mask-based
      feature learning follow different routes.'
    - 'Evaluation targets differ: human-normalized game scores, zero-shot contextual
      generalization, driving multi-view long-horizon metrics, robot simulation execution,
      and memory/action consistency diagnostics each receive emphasis.'
    - 'Interaction assumptions differ: action-free video pretraining, action-conditioned
      dynamics or policy learning, and closed-loop interactive evaluation impose different
      requirements on world models.'
    open_questions:
    - To what extent do gains on driving and robotic video prediction metrics transfer
      to real-world safety, physical execution, and operational reliability?
    - Can world models maintain long-term spatial and memory consistency across viewpoints,
      loops, action-space changes, and environment-rule changes?
    - How well do contextual or compositional generalization methods handle new primitives,
      partially observable contexts, and out-of-distribution physical interactions?
    - What evaluation protocols could connect simulation-based world-model performance
      to downstream deployment outcomes across domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶仿真与场景预测
      解决的问题: 预测长时域、多视角驾驶视频，用于仿真和策略评测；通过掩码重建与扩散结合提升跨数据集泛化。
      尚未覆盖: 证据仅链接到数据集指标，尚未证明与真实驾驶安全或运营结果一致；分布外场景覆盖仍不完整。
    - 路线: 面向任务想象和策略学习的机器人世界模型
      解决的问题: 利用语言组合、物理信息深度/关键点任务或统一视频-动作扩散生成动作条件机器人视频计划或策略，捕捉动力学。
      尚未覆盖: 超出仿真或大规模数据集预训练的真实机器人迁移尚未充分证明；对全新原语和物理交互的泛化受训练覆盖限制。
    - 路线: 上下文与高效模型驱动强化学习
      解决的问题: 学习潜世界模型以在可见上下文变化下实现采样高效策略学习和零样本适应；Transformer-VAE结构在视觉强化学习任务上提升效率。
      尚未覆盖: 评测限于Atari和CARL等窄基准；上下文可观测假设和少量任务使更广泛的泛化结论未被验证。
