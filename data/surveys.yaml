  - 主流方向：可见的综述与分类工作集中于世界模型，尤其是生成式视频世界模型和面向具身智能与自动驾驶的潜在世界模型。
  - 研究共性：将碎片化的世界模型方法组织为设计空间、潜在表示、结构先验、评测方案和开放挑战清单。
  - 关键差异：通用世界模型综述与应用特定的自动驾驶分类法并存；部分综合仅为概念性框架，部分基础系统报告仿真或物理机器人结果。
