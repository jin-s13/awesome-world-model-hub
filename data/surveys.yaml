  related_work_outline_zh:
  - 主流方向：近期工作集中面向具身和自动驾驶场景的世界模型系统，强调可控生成与闭环仿真作为可运行流水线。
  - 研究共性：论文通常以动作、上下文或物理为条件训练世界模型，并通过基准指标、视频预测质量、动作忠实度、物理合理性或下游策略成功率评测。
  - 关键差异：系统在条件表征、架构、评测目标、数据域、交互模式与部署假设上存在差异，例如上下文可观测性或闭环延迟要求。
  - 趋势演进：可见证据集中在2024-2026年，显示从数据集/基准构建向闭环、跨具身和低延迟世界模型系统演进；较早年份证据不足，难以判断更长趋势。
  - 开放问题：在nuScenes、Minecraft、CARL和有限机器人平台之外的泛化仍未证明；空间一致性、动作忠实度和物理合理性的统一评测缺失；部分论文未报告局限或独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation artifacts and benchmark platforms
      what_it_solves: Provide datasets, metrics, and baseline comparisons for measuring
        spatial consistency and action fidelity in world models.
      what_remains_open: Coverage is domain-specific; independent cross-environment
        validation and common evaluation protocols remain missing.
    - line: Contextual and physics-informed world-model learning
      what_it_solves: Incorporate explicit context or physics signals into learned
        dynamics to improve zero-shot generalization and physical plausibility.
      what_remains_open: One line assumes observable context; evaluation is narrow,
        and missing limitation evidence limits general deployment claims.
    - line: Closed-loop driving simulation and controllable generation
      what_it_solves: Turn driving world models into controllable simulators with
        action conditioning, long-horizon rollout, and low-latency inference.
      what_remains_open: Generalization beyond nuScenes-like sensor setups and long-horizon
        consistency remain unresolved.
    - line: Cross-embodiment latent-action world-model systems
      what_it_solves: Use universal latent actions as a shared interface across human,
        robot, and simulation data for video prediction and synthetic policy training.
      what_remains_open: Reproducibility evidence is incomplete; real-world breadth
        and failure boundaries across embodiments are not fully demonstrated.
    consensus:
    - Recent systems treat world models as operational components for policy training,
      evaluation, or closed-loop simulation rather than standalone generators.
    - Action conditioning, temporal consistency, and downstream utility are recurring
      evaluation concerns across embodied and driving settings.
    - There is a shared move toward open artifacts such as datasets and benchmark
      baselines, although code and artifact availability varies.
    - Evaluation remains tightly coupled to a small set of environments, leaving broad
      real-world generalization underevidenced.
    disagreements:
    - 'Conditioning and representation differ: explicit context in recurrent state-space
      models, physics-informed depth and keypoints, universal latent actions, and
      structured diffusion-based control.'
    - 'Evaluation targets differ: scene-graph spatial consistency, action fidelity
      against future trajectories, FID/FVD and reward-based assessment, policy success,
      and single-GPU latency.'
    - 'Deployment assumptions differ: some systems assume observable context; others
      target closed-loop driving simulation, robot policy training, or cross-embodiment
      transfer.'
    - 'Supervision and data regimes differ: Minecraft loop navigation, CARL tasks,
      nuScenes trajectories, diverse robotic videos, and large multi-dataset pretraining.'
    open_questions:
    - Can a unified benchmark capture spatial consistency, action fidelity, physical
      plausibility, and downstream policy utility across environments?
    - How do these systems transfer beyond nuScenes, Minecraft, CARL, and the limited
      robot platforms reported?
    - What is the minimal artifact and reporting standard needed for independent reproduction,
      given uneven code/data availability and absent limitation sections?
    - What are the scaling and multi-GPU behavior of low-latency driving simulators
      beyond single-GPU nuScenes evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测工件与基准平台
      解决的问题: 提供数据集、指标和基线比较，用于衡量世界模型的空间一致性与动作忠实度。
      尚未覆盖: 覆盖范围局限于特定领域；跨环境独立验证和统一评测协议仍然缺失。
    - 路线: 上下文与物理信息驱动的世界模型学习
      解决的问题: 将显式上下文或物理信号纳入学习动力学，以提升零样本泛化和物理合理性。
      尚未覆盖: 一条路线假设上下文可观测；评测范围较窄，且缺少局限性证据限制了部署泛化判断。
    - 路线: 闭环驾驶仿真与可控视频生成
      解决的问题: 将驾驶世界模型转化为具有动作条件、长时程推演和低延迟推理能力的可控仿真系统。
      尚未覆盖: 在类似nuScenes的传感器配置之外的泛化能力，以及长时程一致性仍未被解决。
    - 路线: 跨具身潜在动作世界模型系统
      解决的问题: 以通用潜在动作作为跨人类、机器人和仿真数据的共享接口，进行视频预测和合成策略训练。
      尚未覆盖: 可复现证据不完整；跨具身边界的真实世界广度和失败边界未充分展示。
    共识:
    - 近期系统将世界模型视为策略训练、评测或闭环仿真的可操作组件，而非单纯的独立生成器。
    - 动作条件、时间一致性和下游效用是具身与驾驶场景中反复出现的评测关切。
    - 存在向开放数据集和基准基线等工件转变的共同趋势，但代码与工件可得性并不一致。
    - 评测仍依赖少量环境，广泛的真实世界泛化证据不足。
    分歧:
    - 条件与表示不同：循环状态空间模型中的显式上下文、物理信息深度与关键点、通用潜在动作，以及结构化扩散控制。
    - 评测目标不同：基于场景图的空间一致性、基于未来轨迹的动作忠实度、FID/FVD与奖励评估、策略成功率，以及单GPU延迟。
    - 部署假设不同：部分系统假设上下文可观测；其他系统面向闭环驾驶仿真、机器人策略训练或跨具身迁移。
    - 监督与数据规模不同：Minecraft环路导航、CARL任务、nuScenes轨迹、多样机器人视频和大规模多数据集预训练。
    开放问题:
    - 能否建立统一基准，同时衡量跨环境的空间一致性、动作忠实度、物理合理性和下游策略效用？
    - 这些系统如何泛化到nuScenes、Minecraft、CARL以及已报告有限机器人平台之外的场景？
    - 在代码/数据可得性不均且部分论文缺失局限性说明的情况下，独立复现所需的最低工件与报告标准是什么？
    - 低延迟驾驶仿真在单GPU nuScenes评测之外的多GPU扩展和复杂场景行为如何？
