  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned world simulators via video generation
      what_it_solves: Generating future video frames conditioned on actions to serve
        as interactive simulators for closed-loop policy training and evaluation in
        autonomous driving and robotics.
      what_remains_open: Long-horizon temporal and multi-view consistency, physical
        plausibility beyond visual appearance, generalization to unseen environments
        and action distributions, and real-time inference without sacrificing fidelity.
    - line: Benchmarks and metrics for world model evaluation
      what_it_solves: Providing standardized datasets and quantitative metrics (e.g.,
        spatial consistency scores, action fidelity) to systematically compare world
        models and reveal failure modes.
      what_remains_open: Alignment of proxy metrics with downstream task performance,
        coverage of safety-critical and physical reasoning scenarios, and cross-benchmark
        generalization.
    - line: System-level integration and deployment of interactive simulators
      what_it_solves: Engineering world models into low-latency, resource-efficient
        inference pipelines that can run on single GPUs and interface with external
        planners or control stacks.
      what_remains_open: Independent reproducibility across different hardware and
        software environments, robustness to sensor noise and domain shift, and integration
        with full autonomous driving or robotics middleware.
    consensus:
    - Action controllability is essential for world models to function as simulators;
      models must generate future frames that faithfully reflect given control inputs.
    - Large-scale pre-training on diverse video data, followed by domain-specific
      fine-tuning, improves visual fidelity and generalization.
    - Open-source release of benchmarks, datasets, and baseline models accelerates
      progress and enables fair comparisons.
    - Evaluation should go beyond visual quality (FID, FVD) to include action fidelity,
      spatial consistency, and downstream task performance.
    disagreements:
    - 'Architecture choice: diffusion-based models (e.g., Vista, FAR-Drive) offer
      high visual quality but may be slower; autoregressive transformers (e.g., DWS)
      enable flexible conditioning; recurrent state-space models (e.g., cRSSM) are
      designed for latent dynamics learning but may lag in visual detail.'
    - 'Control granularity: some works use high-level commands or goal points, others
      use low-level trajectories and steering angles, and a few incorporate explicit
      context variables like object mass—leading to different controllability-precision
      trade-offs.'
    - 'Evaluation focus: LoopNav targets spatial consistency, Terra ACT-Bench emphasizes
      action adherence, while Vista and RoboScape prioritize visual fidelity and physical
      plausibility, making cross-work comparison difficult.'
    - 'Interaction mode: open-loop benchmark evaluation (LoopNav, Terra ACT-Bench)
      vs. closed-loop autoregressive simulation (FAR-Drive) vs. model-based policy
      training (cRSSM, DWS) reflect different assumptions about how the simulator
      will be used.'
    open_questions:
    - How can we design a unified evaluation protocol that jointly measures visual
      quality, action controllability, spatial consistency, and physical plausibility?
    - What are the failure modes of current world simulators under out-of-distribution
      actions or environments, and how can they be detected and mitigated?
    - Can real-time interactive world models maintain state-of-the-art fidelity while
      meeting the latency requirements of safety-critical applications?
    - To what extent do existing benchmarks (nuScenes, CARL, Minecraft) capture the
      complexity of real-world deployment, including sensor artifacts, weather, and
      dynamic agents?
    - What is the minimum set of artifacts (code, model weights, dataset, evaluation
      scripts) needed to independently reproduce and verify a world model system across
      different labs?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于视频生成的动作条件世界模拟器
      解决的问题: 根据动作生成未来视频帧，作为交互式模拟器，用于自动驾驶和机器人中的闭环策略训练与评估。
      尚未覆盖: 长时域时序与多视图一致性、超越视觉外观的物理合理性、对未见环境和动作分布的泛化、以及不牺牲保真度的实时推理。
    - 路线: 世界模型评估的基准与指标
      解决的问题: 提供标准化数据集和量化指标（如空间一致性分数、动作忠实度），以系统比较世界模型并揭示失效模式。
      尚未覆盖: 代理指标与下游任务性能的对齐、安全关键和物理推理场景的覆盖、以及跨基准泛化。
    - 路线: 交互式模拟器的系统级集成与部署
      解决的问题: 将世界模型工程化为低延迟、资源高效的推理流水线，可在单GPU上运行，并与外部规划器或控制栈对接。
      尚未覆盖: 跨不同硬件和软件环境的独立复现性、对传感器噪声和领域偏移的鲁棒性、以及与完整自动驾驶或机器人中间件的集成。
    共识:
    - 动作可控性是世界模型作为模拟器的必要条件；模型必须生成忠实反映给定控制输入的未来帧。
    - 在多样化视频数据上进行大规模预训练，再进行领域特定微调，可提升视觉保真度和泛化性。
    - 开源基准、数据集和基线模型加速了进展，并实现了公平比较。
    - 评估应超越视觉质量（FID、FVD），纳入动作忠实度、空间一致性和下游任务性能。
    分歧:
    - 架构选择：基于扩散的模型（如Vista、FAR-Drive）提供高视觉质量但可能较慢；自回归Transformer（如DWS）实现灵活条件化；循环状态空间模型（如cRSSM）专为潜在动力学学习设计，但视觉细节可能不足。
    - 控制粒度：部分工作使用高层指令或目标点，其他使用低层轨迹和转向角，少数引入显式上下文变量（如物体质量），导致不同的可控性-精度权衡。
    - 评测重点：LoopNav关注空间一致性，Terra ACT-Bench强调动作遵循度，而Vista和RoboScape优先考虑视觉保真度和物理合理性，使得跨工作比较困难。
    - 交互模式：开环基准评估（LoopNav、Terra ACT-Bench）vs. 闭环自回归模拟（FAR-Drive）vs. 基于模型的策略训练（cRSSM、DWS），反映了对模拟器使用方式的不同假设。
    开放问题:
    - 如何设计一个统一评估协议，联合衡量视觉质量、动作可控性、空间一致性和物理合理性？
    - 当前世界模拟器在分布外动作或环境下的失效模式是什么，如何检测和缓解？
    - 实时交互式世界模型能否在满足安全关键应用延迟要求的同时，保持最先进的保真度？
    - 现有基准（nuScenes、CARL、Minecraft）在多大程度上捕捉了真实部署的复杂性，包括传感器伪影、天气和动态智能体？
    - 独立复现和验证一个世界模型系统所需的最小工件集（代码、模型权重、数据集、评估脚本）是什么？
