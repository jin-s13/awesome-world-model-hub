  related_work_outline:
  - 'Mainstream direction: Generative video world models built on diffusion transformers
    dominate recent evidence, with auxiliary mask reconstruction, physics-informed,
    or unified action-video objectives for driving, robot, and embodied settings.'
  - 'Shared research pattern: Methods generate future observations or latent rollouts
    and condition them on context, language, actions, or physics signals, then evaluate
    downstream policy, planning, generation, or consistency quality.'
  - 'Key differences: Representation and objective choices vary widely, including
    stochastic transformer latents, contextual recurrent state-space models, language-factorized
    generators, and video-action diffusion; evaluation settings range from Atari and
    CARL to driving, RT-X, and Minecraft/open-domain benchmarks.'
  - 'Trend evolution: From 2023 efficient model-based RL world models such as STORM
    to 2024-2026 diffusion-based embodied, driving, and benchmark-driven methods;
    recent work stresses memory, spatial consistency, action control, and physics-informed
    generation.'
  - 'Open questions: Generalization beyond observed contexts and primitives, isolation
    of model contribution from planner or data, long-horizon memory and action-space
    transfer, and unified physical/consistency evaluation remain underevidenced.'
