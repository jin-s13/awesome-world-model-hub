  - 主流方向：主流路线将学习到的世界模型构建为面向具身控制和自动驾驶的可运行模拟器，核心是动作/轨迹条件化的视频或状态生成。
  - 研究共性：研究通常将学习到的动力学或视频先验与控制信号结合，并加入物理或上下文约束，再在专用基准或 nuScenes、Minecraft、CARL 等标准数据集上评测。
