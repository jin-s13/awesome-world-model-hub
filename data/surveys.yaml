  - 趋势演进：在2022-2026年，证据显示研究从物理机器人在线学习世界模型，向交互式、开源、持久世界模型以及显式基准与分类综合演进。
  - 开放问题：分类的系统证据、基准与指标可比性、对未见原语的泛化以及开放挑战优先级仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: World-model taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented generative world-model work into application
        scenarios, technical challenges, and future directions.
      what_remains_open: Whether the synthesis is backed by systematic inclusion and
        evidence extraction rather than selective examples; coverage is explicitly
        incomplete in fast-moving areas.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how benchmarks, metrics, and evaluation choices such
        as closed-loop control, controllability, and long-horizon consistency shape
        conclusions across world-model papers.
      what_remains_open: Whether results compared across simulation, physical robots,
        open-loop generation, and interactive domains are actually compatible under
        different supervision and metrics.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad world-model literature coverage into concrete challenges
        such as out-of-sight dynamics, action-conditioned controllability, real-time
        interaction, and physical robot learning gaps.
      what_remains_open: Prioritization of which gaps matter most for progress, and
        whether proposed taxonomies or evaluation prescriptions are empirically validated
        rather than conceptually proposed.
    consensus:
    - Recent work treats world models as generative simulators that connect state
      representation, dynamics, and interaction, with emphasis on long-horizon consistency,
      controllability, and responsiveness beyond short visual realism.
    - Surveys and taxonomies converge on separating global or latent state representations
      from generation and control, while method papers instantiate this with compositional
      or persistent state designs.
    - Evaluation is recognized as a central bottleneck; the evidence points to domain-specific
      benchmarks, closed-loop metrics, and open-source artifacts as important levers
      for progress.
    - Physical robot learning and video-based simulation share a common world-model
      foundation of learning dynamics from interaction or video, despite differing
      supervision and deployment settings.
    disagreements:
    - 'State representation differs: compositional language primitives and latent
      spaces versus persistent 3D/dynamic entity states versus multimodal sparse features
      conditioned on ego-trajectory and human pose.'
    - 'Supervision and interaction signals differ: language instructions, goal images,
      ego-trajectories, human poses, sparse robot rewards, and unlabeled video training
      create distinct generalization and controllability assumptions.'
    - 'Evaluation targets differ: surveys compare benchmark landscapes across application
      domains, while method papers emphasize generation quality, simulated robot execution,
      physical robot learning speed, or interactive latency without a shared metric.'
    - 'Deployment settings differ: some work targets physical robots without simulators,
      while other work targets open-source real-time simulators or offline video planning,
      changing the available verification evidence.'
    open_questions:
    - How systematically were the survey taxonomies constructed, and what inclusion
      criteria or evidence extraction methods would make their gap claims verifiable?
    - Are benchmark comparisons across domains comparable, or do differences in evaluation
      settings and supervision signals prevent direct aggregation?
    - Can models trained on combinations of seen primitives generalize to novel primitives
      without external parsing or pretrained primitive models?
    - 'Which open challenges should be prioritized first: out-of-sight dynamics, physical
      robot adaptation, real-time interactivity, or evaluation standardization?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型分类与路线图综合
      解决的问题: 将碎片化的生成式世界模型研究整理为应用场景、技术挑战和未来方向。
      尚未覆盖: 综合是否由系统化纳入和证据提取支撑，而不是选择性举例；在快速发展的领域中覆盖明确不完整。
    - 路线: 对比评测综合
      解决的问题: 总结基准、指标和评测选择如何影响世界模型论文的结论，如闭环控制、可控性和长时一致性。
      尚未覆盖: 仿真、物理机器人、开环生成和交互领域的结果在不同监督信号和指标下是否真正可比。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛的世界模型文献转化为具体挑战，例如视线外动态、动作条件可控性、实时交互和物理机器人学习缺口。
      尚未覆盖: 哪些缺口最值得优先解决，以及所提出的分类或评测建议是否经过实证验证而不仅是概念性提出。
    共识:
    - 近期工作将世界模型视为连接状态表示、动力学与交互的生成式模拟器，关注点不仅包括短时视觉真实感，还包括长时一致性、可控性和响应性。
    - 综述与分类法趋向于将全局或潜在状态表示与生成和控制分离，方法论文则以组合或持久状态设计来实例化这一点。
    - 评估被视为核心瓶颈；证据表明领域特定基准、闭环指标和开源工件是推动进展的重要杠杆。
    - 物理机器人学习和基于视频的仿真共享从交互或视频中学习动力学的世界模型基础，尽管监督和部署设置不同。
    分歧:
    - 状态表示不同：组合语言原语和潜在空间、持久3D/动态实体状态，以及基于自我轨迹和人体姿态条件的多模态稀疏特征。
    - 监督与交互信号不同：语言指令、目标图像、自我轨迹、人体姿态、稀疏机器人奖励和无标注视频训练，导致不同的泛化与可控性假设。
    - 评测目标不同：综述比较各应用领域的基准格局，方法论文侧重生成质量、仿真机器人执行、物理机器人学习速度或交互延迟，缺乏统一指标。
    - 部署场景不同：部分工作面向无模拟器物理机器人，部分面向开源实时模拟器或离线视频规划，可获得的验证证据不同。
    开放问题:
    - 综述分类如何系统性构建，哪些纳入标准或证据提取方法可使其缺口结论可验证？
    - 跨领域的基准比较是否真正可比，还是评估设置和监督信号差异阻碍直接汇总？
    - 在已见原语组合上训练的模型能否在无需外部解析或预训练原语模型时泛化到新原语？
    - 应优先解决哪些开放挑战：视线外动态、物理机器人自适应、实时交互或评估标准化？
