  related_work_outline_zh:
  - 主流方向：领域特定的生成式世界模型将视频预测与动作、语言指令、物理信号或掩码重建结合，近期集中于驾驶和机器人操作。
  - 研究共性：基于Transformer或扩散架构，以领域相关信号为条件，并通过视觉保真度、一致性、策略学习或动作控制进行评估。
  - 关键差异：工作分歧主要在条件信号、评测目标、交互方式和部署场景，覆盖驾驶、机器人和游戏/交互环境。
  - 趋势演进：2023年样本高效游戏世界模型如STORM先展示强化学习收益；2024-2025年向机器人与驾驶生成式世界模型转移；2025-2026年出现记忆一致性与动作控制评测。
  - 开放问题：真实安全或运营迁移、长时记忆与跨动作空间泛化、更广泛的组合泛化，以及仿真到真实指标一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models with cross-dataset scene prediction
      what_it_solves: Long-horizon, multi-view driving video prediction and zero-shot
        transfer across driving datasets.
      what_remains_open: Whether visual prediction gains translate into closed-loop
        driving safety or real operational outcomes remains unverified.
    - line: Embodied robot world models combining video, action, and physics
      what_it_solves: Generating robot video plans and learning policies or dynamics
        from language goals, actions, and physics-informed cues.
      what_remains_open: Generalization beyond seen primitive combinations, novel
        embodiments, and simulation-to-real execution; several evaluations stop in
        simulation.
    - line: Model-based RL and contextual world models for interactive tasks
      what_it_solves: Sample-efficient policy learning via imagined rollouts and context-conditioned
        latent dynamics in game and control settings.
      what_remains_open: Broader task and context coverage; partial observability
        and long-term memory are not fully handled.
    - line: Diagnostic benchmarks for spatial/memory consistency and action control
      what_it_solves: Quantifying world model consistency across loops, viewpoints,
        memory length, and action spaces.
      what_remains_open: Current models still struggle with long-term memory consistency
        and cross-action-space generalization; evaluation coverage is early.
    consensus:
    - Recent work converges on domain-specialized generative world models that couple
      video generation with control-relevant signals such as actions, language, physics
      cues, or scene reconstruction objectives.
    - Transformer and diffusion architectures dominate, often adding stochastic or
      mask-based reconstruction components to improve long-horizon and multi-view
      generation.
    - Evaluation is expanding from task rewards or human-normalized scores toward
      consistency, physical plausibility, zero-shot transfer, and action control.
    - Generalization is treated as a central goal, including cross-dataset transfer,
      zero-shot context, unseen task combinations, and multi-action-space transfer.
    disagreements:
    - 'Conditioning and supervision differ: explicit observable context, language-primitive
      factorization, action-video coupled diffusion, physics-informed auxiliary tasks,
      and mask reconstruction.'
    - 'Evaluation targets differ: driving visual prediction metrics, robot execution
      success in simulation, Atari human-normalized performance, or spatial and memory
      consistency diagnostics.'
    - 'Interaction mode differs: some models train policies through imagined rollouts,
      others generate video plans for execution, and others are evaluated as interactive
      video-to-world systems.'
    - Deployment settings differ, ranging from simulated control tasks and Atari 100k
      to robot data such as RT-X, driving datasets such as Nuscenes/OpenDV-2K/Waymo,
      and Minecraft navigation.
    open_questions:
    - Do visual prediction improvements in driving world models transfer to safer
      closed-loop driving or operational outcomes?
    - Can robot world models compose unseen primitives, embodiments, or physical environments
      rather than only recombining training-seen factors?
    - How can long-term memory consistency and action control be maintained across
      heterogeneous viewpoints and action spaces?
    - What happens when conditioning assumptions, such as observable context or correct
      language parsing, are violated under partial observability or noisy perception?
    - How should consistency and fidelity metrics be linked to downstream policy utility
      in simulation and real deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨数据集驾驶世界模型与场景预测
      解决的问题: 长时域、多视角驾驶视频预测以及跨数据集零样本迁移。
      尚未覆盖: 视觉预测提升能否转化为闭环驾驶安全或真实运营结果尚未验证。
    - 路线: 融合视频、动作与物理的具身机器人世界模型
      解决的问题: 从语言目标、动作和物理线索生成机器人视频计划并学习策略或动力学。
      尚未覆盖: 对未见原语组合、新本体和仿真到真实执行的泛化；部分评测停留在仿真。
    - 路线: 面向交互任务的基于模型强化学习与上下文世界模型
      解决的问题: 通过想象轨迹和上下文条件潜在动力学实现样本高效策略学习。
      尚未覆盖: 更广泛任务与上下文覆盖；部分可观测和长时记忆尚未完全处理。
    - 路线: 面向空间/记忆一致性与动作控制的诊断评测
      解决的问题: 量化世界模型在循环、视角、记忆长度和动作空间上的一致性。
      尚未覆盖: 当前模型在长时记忆一致性和跨动作空间泛化上仍存在困难；评测覆盖仍处于早期。
    共识:
    - 近期工作趋向于领域特定的生成式世界模型，将视频生成与动作、语言、物理线索或场景重建目标等控制相关信号耦合。
    - Transformer与扩散架构占主导，常加入随机或掩码重建组件以改善长时域和多视角生成。
    - 评测正从任务奖励或人类归一化分数扩展到一致性、物理合理性、零样本迁移和动作控制。
    - 泛化被视为核心目标，包括跨数据集迁移、零样本上下文、未见任务组合和多动作空间迁移。
    分歧:
    - 条件与监督信号不同：显式可观测上下文、语言原语分解、动作-视频耦合扩散、物理信息辅助任务和掩码重建。
    - 评测目标不同：驾驶视觉预测指标、仿真机器人执行成功率、Atari人类归一化表现，或空间与记忆一致性诊断。
    - 交互模式不同：部分模型通过想象轨迹训练策略，部分生成视频计划供执行，部分作为交互式视频到世界系统被评测。
