  related_work_outline:
  - 'Mainstream direction: Current work clusters around generative world models built
    from diffusion transformers, transformer-VAE hybrids, or context-conditioned state-space
    models for video prediction, policy learning, and embodied control.'
  - 'Shared research pattern: Papers couple visual dynamics learning with an auxiliary
    signal—mask reconstruction, physics-informed depth/keypoints, context conditioning,
    language-parsed primitives, or action diffusion—to make generation more controllable
    or generalizable.'
  - 'Key differences: They differ in representation (unified transformer vs factorized
    models vs compositional primitives), supervision (self-supervised masks, RL imagination,
    language, physics, action/video diffusion), and evaluation target (driving, Atari,
    robot manipulation, Minecraft/memory benchmarks).'
  - 'Trend evolution: Within the available 2023–2026 evidence, the topic is shifting
    from Atari/RL world-model sample efficiency toward large-scale embodied and driving
    video generation, coupled action-video diffusion, and diagnostic benchmarks for
    memory, spatial consistency, and action control.'
  - 'Open questions: Unresolved issues include transfer beyond narrow task families,
    isolating model contributions from planners and task priors, long-horizon memory
    consistency, generalization across action spaces and unseen primitives, and evidence
    gaps from limited benchmarks and missing ablation details.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer、Transformer-VAE混合或上下文条件状态空间模型为核心的生成式世界模型，用于视频预测、策略学习与具身控制。
  - 研究共性：多将视觉动力学学习与辅助信号耦合，如掩码重建、物理深度/关键点、上下文条件、语言原语或动作扩散，以提升可控性与泛化。
  - 关键差异：表示方式、监督信号和评测目标不同，包括统一Transformer、分解模型与组合原语，以及驾驶、Atari、机器人操作和记忆一致性基准。
  - 趋势演进：在2023–2026证据范围内，正由Atari/RL样本效率转向大规模具身与驾驶视频生成、视频-动作扩散耦合，以及记忆、空间一致性和动作控制诊断基准。
  - 开放问题：如何跨任务迁移、隔离模型与规划器/任务先验、保持长时记忆，跨动作空间和未见原语泛化，以及有限基准与缺失消融带来的证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model ideas into concrete representations, losses,
        architectures, and training recipes, such as mask-reconstruction diffusion,
        transformer-VAE stochastic dynamics, context-conditioned latent state-space
        models, and coupled video-action diffusion.
      what_remains_open: Which algorithmic choices transfer beyond reported task families,
        unseen dynamics, new viewpoints, novel primitives, or unobserved context remains
        unclear; several papers lack detailed limitation and ablation evidence.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention and decision-time
        interfaces through action-conditioned video generation, imagined-trajectory
        policy training, video plans for robot execution, and action-control evaluation.
      what_remains_open: The contribution split between model, planner, controller,
        and task prior is not isolated; generalization to novel actions, action spaces,
        and real-world execution remains underevidenced.
    - line: Method evidence and ablation protocol
      what_it_solves: Uses datasets and benchmarks such as loop navigation, spatial
        consistency scores, memory consistency, and action-control metrics to separate
        method contribution from dataset, baseline, metric, and implementation effects.
      what_remains_open: Current evidence is narrow in scenes and tasks, abstract-level
        results may omit baselines, and missing limitations, code, or details are
        verification gaps rather than proven absence.
    consensus:
    - Generative sequence models are the dominant substrate for learning world dynamics
      from high-dimensional observations.
    - Conditioning on external signals such as language, context variables, actions,
      or viewpoints is a shared strategy for improving control and generalization.
    - Visual world models are increasingly evaluated not only by reconstruction quality
      but by downstream policy performance, zero-shot generalization, or diagnostic
      consistency metrics.
    - Auxiliary objectives—mask reconstruction, depth/keypoint dynamics, context separation,
      or action prediction—are commonly added to improve realism, controllability,
      or physical plausibility.
    disagreements:
    - 'Representation: unified transformer architectures versus factorized or compositional
      models versus context-conditioned recurrent state-space models.'
    - 'Supervision: self-supervised masked video modeling, reinforcement-learning
      imagination, language-parsed primitives, physics-informed auxiliary tasks, or
      joint video-action diffusion.'
    - 'Evaluation target: Atari benchmark efficiency, driving multi-view and long-horizon
      prediction, robot manipulation and zero-shot contextual control, or spatial/memory/action-control
      benchmarks.'
    - 'Interaction mode: open-loop video prediction, closed-loop action-conditioned
      generation, or policy learning and execution in simulation.'
    open_questions:
    - Do the reported representation and objective choices transfer to unseen dynamics,
      scenes, viewpoints, and action spaces beyond the evaluated task families?
    - How much of the observed improvement comes from the world model itself rather
      than from the planner, controller, language parser, task prior, or benchmark
      design?
    - Can world models maintain long-horizon memory consistency and spatial consistency
      under repeated navigation or viewpoint changes?
    - What evidence gaps remain because several papers do not report controlled ablations,
      limitations, or comparable baselines in the available abstract-level evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法落实为具体表示、损失、架构和训练配方，例如掩码重建扩散、Transformer-VAE随机动力学、上下文条件状态空间模型和视频-动作扩散耦合。
      尚未覆盖: 哪些算法选择能迁移到报告任务族之外、未见动力学、新视角、新原语或不可观测上下文仍不清楚；部分论文缺少详细局限与消融证据。
    - 路线: 规划与动作接口方法
      解决的问题: 通过动作条件视频生成、想象轨迹策略训练、机器人执行的视频计划以及动作控制评测，连接学习到的动力学与干预、规划及决策接口。
      尚未覆盖: 模型、规划器、控制器和任务先验的贡献未被分离；对新动作、新动作空间和真实环境执行的泛化证据不足。
    - 路线: 方法证据与消融协议
      解决的问题: 利用循环导航、空间一致性分数、记忆一致性和动作控制等数据集与基准，区分方法贡献与数据集、基线、指标及实现因素。
      尚未覆盖: 当前证据的场景和任务较窄，摘要级结果可能省略基线；缺失局限、代码和细节应视为验证缺口，而非方法缺失的证明。
    共识:
    - 生成式序列模型是当前从高维观测学习世界动力学的主要基础架构。
    - 以语言、上下文变量、动作或视角等外部信号为条件，是提升可控性和泛化能力的共同策略。
    - 视觉世界模型不仅用重建质量评估，也日益依赖下游策略性能、零样本泛化或诊断一致性指标。
    - 常加入掩码重建、深度/关键点动力学、上下文分离或动作预测等辅助目标，以改善真实感、可控性或物理合理性。
    分歧:
    - 表示方式：统一Transformer架构、分解或组合模型、上下文条件循环状态空间模型之间存在差异。
    - 监督信号：自监督掩码视频建模、强化学习想象、语言解析原语、物理信息辅助任务或联合视频-动作扩散各不同。
    - 评测目标：Atari基准效率、驾驶多视角与长时预测、机器人操作与零样本上下文控制，或空间/记忆/动作控制基准之间存在差异。
    - 交互模式：开环视频预测、闭环动作条件生成或仿真中的策略学习与执行之间存在差异。
    开放问题:
    - 所报告的表示和目标选择是否能迁移到评估任务族之外的未见动力学、场景、视角和动作空间？
    - 观测到的改进有多少来自世界模型本身，而非规划器、控制器、语言解析器、任务先验或基准设计？
    - 世界模型能否在重复导航或视角变化下保持长时记忆一致性和空间一致性？
    - 现有摘要级证据中部分论文未报告受控消融、局限或可比基线，这留下哪些验证缺口？
