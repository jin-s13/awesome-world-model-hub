  related_work_outline:
  - 'Mainstream direction: Building world models for domain-specific applications
    (autonomous driving, robotics, interactive agents) by generating or predicting
    future states from sensory inputs, with a heavy emphasis on video diffusion and
    transformer architectures.'
  - 'Shared research pattern: Using self-supervised or task-conditioned video generation
    to learn forward dynamics, then leveraging the modeled world for imagination,
    planning, policy evaluation, or direct policy learning, while evaluating on visual
    fidelity, physical plausibility, or task performance.'
  - 'Key differences: Domains (driving vs. robotics vs. games), architecture choices
    (diffusion transformer vs. stochastic transformer vs. physics-informed keypoints),
    conditioning modalities (language, actions, context variables), and evaluation
    targets (zero-shot generalization, spatial consistency, memory consistency, action
    control).'
  - 'Trend evolution: Early works (2015–2020) focused on model-based RL with compact
    latent dynamics; recent papers (2023–2026) adopt large-scale video diffusion models,
    unified video-action generation, and physics-informed learning, alongside growing
    effort on standardized benchmarks for memory and action consistency.'
  - 'Open questions: Whether simulation gains translate to real-world safety in driving
    and robotics; how to generalize world models to unseen embodiments, environments,
    or action spaces without retraining; and how to maintain long-term memory and
    physical consistency over extended rollouts.'
  related_work_outline_zh:
  - 主流方向：构建面向自动驾驶、机器人、交互式智能体等具体应用的世界模型，通过从感官输入生成或预测未来状态，重点采用视频扩散和Transformer架构。
  - 研究共性：通过自监督或任务条件的视频生成学习前向动力学，并利用建模的世界进行想象、规划、策略评估或直接策略学习，评估指标包括视觉保真度、物理合理性和任务表现。
  - 关键差异：应用领域（驾驶、机器人、游戏）不同，架构选择（扩散Transformer、随机Transformer、物理信息关键点）不同，条件模态（语言、动作、上下文变量）不同，评测目标（零样本泛化、空间一致性、记忆一致性、动作控制）不同。
  - 趋势演进：早期工作（2015–2020）聚焦基于模型的强化学习中的紧凑潜在动力学；近期（2023–2026）采用大规模视频扩散模型、统一视频-动作生成和物理信息学习，同时涌现针对记忆和动作一致性的标准化基准。
  - 开放问题：仿真收益能否在驾驶和机器人中转化为真实世界安全；世界模型在新本体、环境或动作空间中泛化而不需重新训练的能力；以及如何在长时间展开中保持长期记忆和物理一致性。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models
      what_it_solves: Scene prediction and closed-loop simulation for autonomous driving,
        enabling long-horizon and multi-view generation.
      what_remains_open: Alignment between simulated metrics and real-world safety
        or operational outcomes, and zero-shot transfer across different driving datasets
        and sensor configurations.
    - line: Robot world models via video generation
      what_it_solves: Learning compositional, physics-informed, or unified video and
        action generation for manipulation, imagination, and policy pretraining.
      what_remains_open: Generalization to entirely novel primitives or environments,
        real robot deployment beyond simulation, and dependence on large-scale action-labeled
        datasets or accurate language parsing.
    - line: Contextual world models for zero-shot generalization
      what_it_solves: Adapting world model dynamics to context variables (e.g., mass,
        dimensions) to enable zero-shot policy transfer to unseen dynamics.
      what_remains_open: Assumption of observable context, limited evaluation to few
        tasks, and the gap between simple contextual variation and fully unknown environment
        dynamics.
    - line: World models for game agents
      what_it_solves: Efficient stochastic modeling for model-based RL, achieving
        high sample efficiency and human-level performance on Atari.
      what_remains_open: Generalization to new games or tasks without retraining,
        and integration of longer-term memory beyond the limited horizon of Atari
        environments.
    - line: Benchmarks for memory consistency and action control
      what_it_solves: Systematic evaluation of spatial consistency, memory, and action
        controllability in world models across diverse scenes and action spaces.
      what_remains_open: Coverage of fully open-domain, real-world scenarios, and
        how well benchmark scores predict downstream task success in robotics or driving.
    consensus:
    - World models are increasingly formulated as video diffusion or transformer-based
      generative models conditioned on actions or language.
    - Effective world models require both visual fidelity and physical or temporal
      consistency, not just frame prediction quality.
    - Large-scale pretraining on diverse datasets (driving, robot manipulation, open-world
      video) is a common strategy to improve generalization.
    - Standardized benchmarks are needed to evaluate core capabilities like long-term
      memory, spatial consistency, and action controllability.
    disagreements:
    - 'Domain and modality: driving models focus on multi-view scene evolution, while
      robot models emphasize compositional object-action manipulation and games emphasize
      action-conditioned efficiency.'
    - 'Architecture: diffusion transformers (MaskGWM, UWM) vs. stochastic transformers
      (STORM) vs. physics-informed keypoint dynamics (RoboScape) vs. compositional
      primitives (RoboDreamer).'
    - 'Training signal: some models use only video prediction losses, others jointly
      learn action diffusion, inverse dynamics, or physical constraints from depth
      and keypoints.'
    - 'Evaluation target: zero-shot generalization to unseen contexts (cRSSM) vs.
      spatial consistency in loop navigation (LoopNav) vs. memory and action control
      in open-domain revisited scenes (MIND).'
    open_questions:
    - How can we verify that improvements in driving world model simulation metrics
      (e.g., FVD, reconstruction) lead to safer real-world deployment?
    - What training paradigms enable world models to generalize to unseen robot embodiments
      or action spaces without additional data collection?
    - How can world models maintain long-term memory consistency over thousands of
      steps in open-world scenarios, as required by benchmarks like MIND?
    - To what extent can physics-informed generation or keypoint dynamics replace
      explicit physics simulation, and what are the failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型
      解决的问题: 自动驾驶中的场景预测和闭环仿真，支持长时域和多视角生成。
      尚未覆盖: 仿真指标与真实安全或运营结果的对齐，以及跨不同驾驶数据集和传感器配置的零样本迁移。
    - 路线: 基于视频生成的机器人世界模型
      解决的问题: 学习组合式、物理信息引导或统一的视频与动作生成，用于操作想象和策略预训练。
      尚未覆盖: 向全新原语或环境的泛化，真实机器人部署，以及依赖大规模动作标注数据或准确语言解析。
    - 路线: 上下文世界模型用于零样本泛化
      解决的问题: 将世界模型动力学适配上下文变量（如质量、尺寸），实现策略向未见动力学的零样本迁移。
      尚未覆盖: 上下文可观测假设，仅在少量任务上评估，以及简单上下文变化与完全未知动力学之间的差距。
    - 路线: 游戏智能体的世界模型
      解决的问题: 高效的随机建模用于基于模型的RL，在Atari上实现高样本效率和人类水平表现。
      尚未覆盖: 不重新训练情况下向新游戏或任务的泛化，以及超出Atari有限视界的长期记忆整合。
    - 路线: 记忆一致性与动作控制的基准
      解决的问题: 系统评估世界模型在多样化场景和动作空间中的空间一致性、记忆和动作可控性。
      尚未覆盖: 完全开放域真实场景的覆盖，以及基准得分在多大程度上预测下游机器人或驾驶任务的成功。
    共识:
    - 世界模型日益被形式化为以动作或语言为条件的视频扩散或Transformer生成模型。
    - 有效的世界模型需要同时具备视觉保真度和物理或时间一致性，而不仅仅是帧预测质量。
    - 在多样化数据集（驾驶、机器人操作、开放世界视频）上进行大规模预训练是提升泛化能力的通用策略。
    - 需要标准化基准来评估长期记忆、空间一致性和动作可控性等核心能力。
    分歧:
    - 领域和模态：驾驶模型关注多视角场景演变，机器人模型强调组合式物体-动作操作，游戏模型强调动作条件下的效率。
    - 架构：扩散Transformer（MaskGWM, UWM） vs. 随机Transformer（STORM） vs. 物理信息关键点动力学（RoboScape）
      vs. 组合原语（RoboDreamer）。
    - 训练信号：一些模型仅使用视频预测损失，另一些则联合学习动作扩散、逆动力学或来自深度和关键点的物理约束。
