  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks that probe specific world-model
    capabilities such as spatial consistency, memory, and action control, while standard
    performance benchmarks continue to be used for overall comparison.'
  - 'Shared research pattern: Combining custom datasets with targeted metrics (e.g.,
    scene graph consistency, memory consistency) to diagnose weaknesses beyond aggregate
    scores, and validating these benchmarks against existing methods.'
  - 'Key differences: Evaluation targets vary (RL task performance, video prediction
    quality, physical plausibility), environments differ (simulated games, driving,
    robotics), and interaction modes range from open-loop to closed-loop with action
    control.'
  - 'Trend evolution: From reporting on standard benchmarks (Atari, NuScenes) to creating
    dedicated diagnostic benchmarks (2025-2026) that stress-test long-term consistency
    and controllability, indicating a move toward more rigorous evaluation.'
  - 'Open questions: How well do proxy metrics in custom benchmarks align with real-world
    downstream task success; can benchmarks cover diverse real-world settings without
    overfitting to specific simulators; and how to standardize reporting of compute
    and implementation details for reproducibility.'
  related_work_outline_zh:
  - 主流方向：设计专门基准，探查世界模型的空间一致性、记忆和动作控制等特定能力，同时仍使用标准性能基准进行总体比较。
  - 研究共性：结合定制数据集与针对性指标（如场景图一致性、记忆一致性），在聚合分数之外诊断弱点，并用现有方法验证这些基准。
  - 关键差异：评估目标多样化（RL任务性能、视频预测质量、物理合理性），环境不同（模拟游戏、驾驶、机器人），交互模式从开环到带动作控制的闭环。
  - 趋势演进：从依赖标准基准（Atari、NuScenes）转向创建专用诊断基准（2025-2026），针对长期一致性和可控性进行压力测试，表明评估趋于严格。
  - 开放问题：定制基准中的代理指标与真实下游任务成功之间的对齐程度如何；基准能否覆盖多样化真实场景而不对特定模拟器过拟合；如何标准化计算和实现细节的报告以提高可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Task and dataset design for specific capabilities
      what_it_solves: Creating datasets and evaluation protocols that isolate and
        measure fine-grained world-model abilities such as spatial consistency, memory,
        and action control, which are not captured by aggregate performance scores.
      what_remains_open: The extent to which these datasets cover the full diversity
        of real-world settings; the risk of overfitting to a single simulator (e.g.,
        Minecraft); and whether the designed tasks truly represent the challenges
        where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction quality, controllability, robustness, and
        decision utility beyond conventional metrics, e.g., scene graph consistency
        score, memory consistency, and action control accuracy.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decision quality users care about; sensitivity to visual or physics variations;
        and the lack of standardized stress-test suites across different environments.
    - line: Comparable baselines and reporting
      what_it_solves: Enabling fair comparison through common benchmarks (e.g., Atari
        100k, NuScenes) and model architectures, but with varying availability of
        code, artifacts, and detailed training setups.
      what_remains_open: Stability of conclusions across different implementations
        and compute budgets; absence of unified reporting conventions for hyperparameters,
        seeds, and computational resources, which limits reproducibility.
    consensus:
    - Standard benchmarks like Atari 100k and NuScenes remain essential for overall
      performance comparison, but they fail to diagnose specific failures such as
      inconsistent dynamics or poor long-term memory.
    - Custom benchmarks are needed to evaluate spatial consistency, memory, and action
      controllability, and these are often validated against existing state-of-the-art
      methods to demonstrate their diagnostic power.
    - Diffusion-based and transformer-based world models are pushing visual quality,
      but their evaluation must go beyond reconstruction fidelity to include physical
      plausibility and downstream task success.
    disagreements:
    - 'Evaluation focus: some works target RL task performance (e.g., Atari scores),
      while others emphasize video prediction quality or physical plausibility in
      robotics, leading to different metric choices and what constitutes a good world
      model.'
    - 'Environment and domain: settings range from 2D games (Atari) to simulators
      (Minecraft) to real-world driving (NuScenes, Waymo), which affects the type
      of dynamics and the available supervision, and limits the transferability of
      findings.'
    - 'Interaction mode: closed-loop settings with action conditioning (e.g., MIND)
      vs. open-loop generation or action-free data (e.g., UWM) create different requirements
      for consistency and controllability metrics.'
    - 'Benchmark construction: some benchmarks are grounded in a single simulator
      (LoopNav in Minecraft) while others use multiple real-world scenes (MIND, MaskGWM
      on multiple driving datasets), raising questions about external validity and
      generalization.'
    open_questions:
    - How can benchmarks ensure that proxy metrics (e.g., SGCS) correlate with success
      in downstream applications like robot navigation or autonomous driving?
    - What is the minimal set of scenarios and action spaces that a benchmark must
      cover to be considered representative of real-world world-model use cases?
    - How can we design benchmarks that remain robust to changes in rendering engines,
      physics simulators, and dataset distributions, preventing overfitting to a specific
      platform?
    - What are the necessary reporting standards (e.g., compute, hyperparameters,
      random seeds) to make benchmark results reliably reproducible across research
      groups?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向特定能力的任务与数据集设计
      解决的问题: 创建隔离并衡量细粒度世界模型能力（如空间一致性、记忆和动作控制）的数据集和评估协议，弥补聚合性能分数的不足。
      尚未覆盖: 这些数据集在多大程度上覆盖真实世界多样性；对单一模拟器（如Minecraft）过拟合的风险；所设计任务是否真正代表世界模型预期发挥作用的挑战。
    - 路线: 指标与压力测试设计
      解决的问题: 超越传统指标，检验预测质量、可控性、鲁棒性和决策效用，例如场景图一致性分数、记忆一致性和动作控制准确率。
      尚未覆盖: 这些代理指标与用户关心的下游决策质量之间的对齐程度；对视觉或物理变化的敏感性；缺乏跨不同环境的标准化压力测试套件。
    - 路线: 可比基线与报告规范
      解决的问题: 通过通用基准（如Atari 100k、NuScenes）和模型架构实现公平比较，但代码、工件和详细训练设置的可用性参差不齐。
      尚未覆盖: 结论在不同实现和算力预算下的稳定性；缺乏统一的超参数、随机种子和计算资源报告约定，限制可复现性。
    共识:
    - Atari 100k和NuScenes等标准基准对总体性能比较仍然重要，但无法诊断不一致动态或长期记忆差等特定故障。
    - 需要定制基准来评估空间一致性、记忆和动作可控性，并通过现有最先进方法验证其诊断能力。
    - 基于扩散和Transformer的世界模型在视觉质量上有所提升，但评估必须超越重建保真度，纳入物理合理性和下游任务成功。
    分歧:
    - 评测焦点：一些工作针对RL任务性能（如Atari分数），另一些强调视频预测质量或机器人物理合理性，导致指标选择和对什么是好世界模型的定义不同。
    - 环境与领域：设置从2D游戏（Atari）到模拟器（Minecraft）再到真实驾驶（NuScenes、Waymo），影响动力学类型和可用监督，限制了结论的可迁移性。
    - 交互模式：带动作条件的闭环（如MIND）与开环生成或无动作数据（如UWM），对一致性和可控性指标提出不同要求。
    - 基准构建：一些基准依托单一模拟器（LoopNav在Minecraft），另一些使用多个真实场景（MIND、MaskGWM在多个驾驶数据集），引发外部效度和泛化性的疑问。
    开放问题:
    - 如何确保基准的代理指标（如SGCS）与下游应用（如机器人导航或自动驾驶）的成功率相关？
    - 基准必须覆盖的最少场景和动作空间是什么，才能被认为是真实世界世界模型用例的代表？
    - 如何设计基准，使其对渲染引擎、物理模拟器和数据集分布的变化保持鲁棒，防止对特定平台过拟合？
    - 哪些报告标准（如计算量、超参数、随机种子）是必要的，以使基准结果在不同研究组之间可靠复现？
