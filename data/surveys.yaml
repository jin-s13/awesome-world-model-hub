  related_work_outline:
  - 'Mainstream direction: Adapting video generation models into action-conditioned
    world models for embodied decision-making, with growing emphasis on physical plausibility
    and alignment.'
  - 'Shared research pattern: All works treat video prediction as the core world-model
    interface, condition on actions, and evaluate through visual quality or task-oriented
    metrics.'
  - 'Key differences: Architectures range from diffusion transformers to masked autoregression;
    action injection varies from unified timestep control to learned masks; alignment
    strategies include DPO, RL-based reward modeling, or no post-hoc alignment; evaluation
    protocols split between visual fidelity and functional benchmarks.'
  - 'Trend evolution: 2024–2025 focused on adapting pretrained video models and unified
    pretraining; 2026 shifts toward physics alignment, test-time scaling analysis,
    and conceptual taxonomies, indicating a move from building world models to ensuring
    their reliability and theoretical grounding.'
  - 'Open questions: How to achieve long-horizon persistence and causal reasoning;
    why test-time verifiers fail to scale consistently; whether proposed taxonomies
    change model design; and how to generalize physical alignment beyond contact-rich
    manipulation.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型适配为动作条件化的世界模型，用于具身决策，并越来越强调物理合理性与对齐。
  - 研究共性：所有工作均以视频预测作为世界模型的核心接口，以动作为条件，并通过视觉质量或任务导向指标进行评估。
  - 关键差异：架构涵盖扩散Transformer到掩码自回归；动作注入方式包括统一时间步控制、学习掩码等；对齐策略有DPO、基于RL的奖励建模或无事后对齐；评估协议在视觉保真度与功能基准之间分化。
  - 趋势演进：2024–2025年集中于适配预训练视频模型和统一预训练；2026年转向物理对齐、测试时缩放分析和概念分类法，表明领域从构建世界模型转向确保其可靠性和理论基础。
  - 开放问题：如何实现长程持久性与因果推理；测试时验证器为何无法一致缩放；提出的分类法是否改变模型设计；物理对齐如何泛化到接触丰富操作之外的领域。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent (state vs. dynamics)
        and under which assumptions verification or generation claims hold.
      what_remains_open: Whether the formal conditions match empirical model behavior;
        whether identifying information bottlenecks leads to actionable architectural
        improvements.
    - line: Scaling laws and guarantees
      what_it_solves: Connects test-time compute or model scale to expected reasoning
        performance, probing whether larger models or more samples yield better spatial
        reasoning.
      what_remains_open: Direct validation that scaling laws predict failures; current
        evidence shows no consistent scaling on certain benchmarks, pointing to an
        information bottleneck.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into categories (implicit/explicit
        state, knowledge integration, architectural reformulation) and advocates for
        functional benchmarks.
      what_remains_open: Whether the taxonomy changes how researchers evaluate or
        design models; the gap between visual fidelity metrics and physical persistence
        or causal reasoning.
    consensus:
    - Video generation models can serve as world models for decision-making if properly
      conditioned on actions.
    - Visual quality alone is insufficient; physical plausibility, temporal consistency,
      and task relevance must be evaluated.
    - Action conditioning is essential, but the optimal mechanism (unified diffusion,
      adapter, masked autoregression) remains unsettled.
    - Post-training alignment (via DPO, RL, or reward models) improves physical fidelity
      and logical coherence of generated rollouts.
    disagreements:
    - 'State representation: whether world models should construct explicit latent
      states or rely on implicit context management.'
    - 'Evaluation protocol: functional benchmarks that test physical persistence and
      causal reasoning versus conventional visual fidelity metrics.'
    - 'Alignment method: DPO-based post-training with decoupled discriminators versus
      RL-based multi-dimensional reward modeling versus no explicit alignment.'
    - 'Action injection: unified diffusion timestep control versus learned masks on
      frozen models versus parallel context blocks for spatial action injection.'
    open_questions:
    - Why do test-time verifiers for world-model-based spatial reasoning fail to achieve
      consistent scaling, and what architectural changes can break the observed information
      bottleneck?
    - How can world models be evaluated on long-horizon persistence and causal reasoning
      beyond short video clips?
    - Do conceptual taxonomies of state construction and dynamics modeling lead to
      measurable improvements in downstream task performance?
    - Can physical alignment strategies generalize from contact-rich manipulation
      to diverse embodiments and environments without costly human preference data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么（状态与动态），以及验证或生成主张在哪些假设下成立。
      尚未覆盖: 形式条件是否匹配经验模型行为；识别信息瓶颈是否能带来可操作的架构改进。
    - 路线: 缩放规律与保证
      解决的问题: 将测试时计算或模型规模与预期推理性能联系起来，探究更大模型或更多采样是否带来更好的空间推理。
      尚未覆盖: 直接验证缩放规律能否预测失败；当前证据显示在某些基准上缺乏一致缩放，指向信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为类别（隐式/显式状态、知识整合、架构重构），并倡导功能基准。
      尚未覆盖: 分类法是否改变研究者的评估或模型设计方式；视觉保真度指标与物理持久性、因果推理之间的差距。
    共识:
    - 视频生成模型若经过适当的动作条件化，可作为决策的世界模型。
    - 仅靠视觉质量不够，必须评估物理合理性、时序一致性和任务相关性。
    - 动作条件化至关重要，但最佳机制（统一扩散、适配器、掩码自回归）尚无定论。
    - 事后对齐（通过DPO、RL或奖励模型）能改善生成轨迹的物理保真度和逻辑一致性。
    分歧:
    - 状态表示：世界模型应构建显式潜在状态，还是依赖隐式上下文管理。
    - 评估协议：测试物理持久性和因果推理的功能基准，对比传统的视觉保真度指标。
    - 对齐方法：基于DPO的解耦判别器后训练，对比基于RL的多维奖励建模，对比无显式对齐。
    - 动作注入：统一扩散时间步控制，对比冻结模型上的学习掩码，对比用于空间动作注入的并行上下文块。
    开放问题:
    - 为何基于世界模型的空间推理测试时验证器无法实现一致缩放，哪些架构改变能打破观察到的信息瓶颈？
    - 如何评估世界模型在长程持久性和因果推理上的表现，而非仅限于短视频片段？
    - 状态构建和动态建模的概念分类法是否能带来下游任务性能的可测量提升？
    - 物理对齐策略能否从接触丰富的操作泛化到多样化本体和环境，而无需昂贵的人类偏好数据？
