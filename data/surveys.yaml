  - 主流方向：主题集中于世界模型的综述、分类体系与路线图综合，而不是单一方法；证据围绕通用模拟、自动驾驶潜在框架、机器人想象和开源实时模拟器展开。
  - 研究共性：论文将碎片化领域整理为表示选择、评测轴线和开放缺口；相关方法普遍强调可控生成、长时一致性、记忆与状态演化。
  - 关键差异：部分工作只提出概念分类而缺少实证验证，另一些提供基准与数据集；表示方式包括组合式语言条件视频、统一自回归潜在模型和持久 3D/4D 全局状态。
  - 趋势演进：从 2023 年任务特定的交通仿真，到 2024 年通用生成视频和机器人想象，再到 2025-2026 年自我中心视觉控制、视线外动态、开源系统和资源感知评测。
  - 开放问题：分类体系是否有系统证据；开环生成指标能否预测闭环部署；跨设置结果如何比较；哪些研究缺口应优先解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into representational choices,
        structural priors, application domains, and future directions.
      what_remains_open: Whether the synthesis uses systematic inclusion criteria
        or mainly selective examples; conceptual taxonomies may lack empirical validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices across generation quality,
        controllability, spatial-temporal consistency, and closed-loop metrics shape
        conclusions.
      what_remains_open: Results are often not comparable across datasets and settings;
        proposed metric suites and inference-cost-aware evaluation are not yet consistently
        implemented.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into actionable challenges
        such as out-of-sight dynamics, long-horizon stability, fine-grained control,
        and open-source access.
      what_remains_open: Prioritization of gaps is under-evidenced; missing code,
        dataset, and baseline details leave verification gaps.
    consensus:
    - World models are treated as a unifying abstraction across generative video,
      autonomous driving, and embodied manipulation.
    - Long-horizon consistency, fine-grained controllability, and closed-loop evaluation
      are recognized as central problems.
    - Language and latent state serve as common conditioning or decomposition mechanisms
      for compositionality and instruction following.
    - Surveys and methods both point to memory, multimodal goals, and spatial-temporal
      dynamics as necessary for usable simulation.
    disagreements:
    - 'Representation differs: compositional language-conditioned primitives versus
      unified autoregressive latent models versus explicit persistent 3D/4D global
      states.'
    - 'Supervision and evaluation targets differ: simulation-only robot execution,
      real-world autonomous driving benchmarks, ego-vision human/vehicle motion, and
      general video generation.'
    - 'Evidence type differs: some taxonomies are conceptual and unvalidated, while
      other work introduces benchmarks and quantitative results; reproducibility signals
      vary from public artifacts to no visible code or dataset.'
    open_questions:
    - Which latent or global-state representation best supports multi-agent, out-of-sight,
      and long-horizon consistency without losing controllability?
    - How can evaluation frameworks make open-loop generation quality reliably predict
      closed-loop policy or control performance?
    - What systematic evidence and shared benchmarks are needed to compare taxonomies
      and results across autonomous driving, ego-vision, and robot simulation?
    - Which missing artifacts—code, datasets, baselines, and limitation reports—are
      most critical for verifying the strongest claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究映射为表示选择、结构先验、应用领域和未来方向。
      尚未覆盖: 综合是否采用系统性纳入标准还是选择性示例；概念性分类体系可能缺少实证验证。
    - 路线: 对比评测综合
      解决的问题: 总结生成质量、可控性、时空一致性和闭环评测等选择如何影响跨论文结论。
      尚未覆盖: 不同数据集和设置下的结果通常不可直接比较；所提指标套件与资源感知推理成本尚未被一致实现。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为可行动挑战，如视线外动态、长时域稳定性、细粒度控制和开源可及性。
      尚未覆盖: 缺口优先级排序证据不足；代码、数据集、基线和局限性细节的缺失导致验证缺口。
    共识:
    - 世界模型被作为跨生成视频、自动驾驶和具身操控的统一抽象。
    - 长时一致性、细粒度可控性和闭环评测被认为是核心问题。
    - 语言和潜在状态被用作实现组合性与指令跟随的常见条件化或分解机制。
    - 综述与方法都指出记忆、多模态目标和时空动态对可用仿真十分必要。
    分歧:
    - 表示方式不同：组合式语言条件原语、统一自回归潜在模型、显式持久 3D/4D 全局状态。
    - 监督与评测目标不同：仅仿真机器人执行、真实自动驾驶基准、自我中心人/车运动、通用视频生成。
    - 证据类型不同：部分分类体系是概念性且未验证，而另一些工作引入基准与量化结果；可复现信号从公开工件到不可见代码或数据集不一。
    开放问题:
    - 哪种潜在或全局状态表示能同时最好地支持多智能体、视线外和长时一致性，而不损失可控性？
    - 评测框架如何让开环生成质量可靠地预测闭环策略或控制性能？
    - 需要哪些系统证据和共享基准来比较自动驾驶、自我中心视觉和机器人仿真中的分类体系与结果？
    - 哪些缺失工件——代码、数据集、基线和局限性报告——对验证最强声明最为关键？
