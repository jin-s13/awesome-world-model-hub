  - 'Mainstream direction: Building unified world models by coupling video and action
    modalities within large-scale pretraining frameworks, then aligning them for physical
    plausibility and task-specific control.'
  - 'Shared research pattern: Most works adopt a two-stage paradigm—pretraining on
    diverse video or action-video data, followed by adaptation or post-training to
    inject controllability, physical realism, or task rewards.'
  - 'Key differences: Methods diverge in how they inject action conditioning (adapter
    vs. native architecture), how they enforce physical alignment (RL-based reward
    modeling vs. DPO), and what evaluation metrics they trust (perceptual vs. distortion).'
  - 'Trend evolution: From 2024 to 2026, the focus shifted from adapting pretrained
    video models to building native multimodal world models, and from visual fidelity
    to functional benchmarks that test physical persistence and causal reasoning.'
  - 'Open questions: Whether current world models can support long-horizon causal
    reasoning, how to design evaluation protocols that correlate with downstream task
    success, and how to scale alignment without expensive human preference data.'
  related_work_outline_zh:
  - 主流方向：通过在大规模预训练框架中耦合视频与动作模态构建统一世界模型，然后进行物理合理性对齐和任务特定控制。
  - 研究共性：多数工作采用两阶段范式——在多样化视频或动作-视频数据上预训练，然后通过适配或后训练注入可控性、物理真实感或任务奖励。
  - 关键差异：方法在动作条件注入方式（适配器 vs. 原生架构）、物理对齐实施方式（基于RL的奖励建模 vs. DPO）以及信任的评估指标（感知指标 vs. 失真指标）上存在分歧。
  - 趋势演进：从2024年到2026年，焦点从适配预训练视频模型转向构建原生多模态世界模型，从视觉保真度转向测试物理持久性和因果推理的功能基准。
  - 开放问题：当前世界模型能否支持长程因果推理，如何设计与下游任务成功相关的评估协议，以及如何在不依赖昂贵人类偏好数据的情况下扩展对齐。
  literature_review:
    line_of_work_matrix:
    - line: Unified multimodal world model pretraining
      what_it_solves: Learning a single model that jointly captures video dynamics
        and action effects from large-scale heterogeneous robot data, enabling flexible
        policy and dynamics representations.
      what_remains_open: Whether the unified architecture truly learns a factored
        state representation that supports long-horizon causal reasoning, and how
        to verify physical consistency beyond visual similarity.
    - line: Adapting pretrained video diffusion models as world models
      what_it_solves: Leveraging existing high-quality video generators as world models
        without retraining, by training lightweight adapters that inject action conditioning.
      what_remains_open: The adapter's reliance on a small domain-specific dataset
        limits generalization; the underlying pretrained model's biases and closed-source
        nature may restrict reproducibility and safety guarantees.
    - line: Aligning world models with physical realism and task rewards
      what_it_solves: Post-training world models to suppress unphysical behaviors
        and improve task completion via multi-dimensional reward modeling or direct
        preference optimization.
      what_remains_open: Alignment relies on human preferences that are subjective
        and costly to scale; it is unclear whether the aligned models maintain diversity
        or overfit to narrow reward definitions.
    - line: Evaluation and benchmarking of world model capabilities
      what_it_solves: Designing metrics and benchmarks that go beyond visual fidelity
        to test spatial reasoning, action controllability, and physical persistence.
      what_remains_open: Existing distortion metrics can mislead by rewarding blurry
        averages; functional benchmarks are still scarce and not yet standardized
        across embodiments and domains.
    - line: Conceptual taxonomies for video generation as world models
      what_it_solves: Organizing the design space into state construction (implicit/explicit)
        and dynamics modeling (knowledge integration/architectural reformulation)
        to clarify assumptions and gaps.
      what_remains_open: The taxonomy has not been empirically validated to show that
        it changes model design choices or improves evaluation practices.
    consensus:
    - World models must represent both state and dynamics, and video generation is
      a promising substrate for learning these representations.
    - Pretraining on large-scale video or action-video data is essential for generalization,
      but raw pretrained models lack physical grounding and controllability.
    - Evaluation should move beyond pixel-level reconstruction quality toward functional
      tests of physical persistence, causal reasoning, and action-conditioned prediction.
    - Injecting action control and aligning outputs with physical laws are critical
      open challenges that require dedicated post-training or architectural modifications.
    disagreements:
    - 'How to inject action conditioning: some works integrate actions natively into
      the diffusion or autoregressive architecture, while others train external adapters
      on frozen pretrained models.'
    - 'How to enforce physical alignment: one line uses reinforcement learning with
      multi-dimensional reward models, another uses direct preference optimization
      with decoupled discriminators.'
    - 'Which evaluation metrics to trust: perceptual metrics (FID, KID) are shown
      to correlate better with human judgment, but distortion metrics (SSIM, cosine
      similarity) remain common and can mislead by favoring blurry predictions.'
    - 'Whether world models should be stateless video predictors or explicitly construct
      latent states: the taxonomy paper argues for explicit state construction, but
      most empirical works rely on implicit state in context windows or latent sequences.'
    open_questions:
    - Can current world models support long-horizon causal reasoning, or do they form
      an information bottleneck where imagined views fail to enrich fine-grained inference?
    - How can we design evaluation protocols that reliably predict downstream task
      success, given that no existing verifier achieves consistent test-time scaling
      across diverse benchmarks?
    - What is the minimal supervision needed to align a world model with physical
      reality, and can we reduce reliance on expensive human preference annotations?
    - Do the proposed taxonomies and formal assumptions actually change how researchers
      design architectures or select benchmarks, or do they remain descriptive?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一多模态世界模型预训练
      解决的问题: 从大规模异构机器人数据中学习一个同时捕捉视频动态和动作效果的单一模型，实现灵活的策略和动力学表示。
      尚未覆盖: 统一架构是否真正学习到支持长程因果推理的因子化状态表示，以及如何在视觉相似性之外验证物理一致性。
    - 路线: 将预训练视频扩散模型适配为世界模型
      解决的问题: 通过训练轻量级适配器注入动作条件，将现有高质量视频生成器作为世界模型复用，避免重新训练。
      尚未覆盖: 适配器依赖小型领域特定数据集，泛化能力有限；底层预训练模型的偏见和闭源特性可能限制可复现性和安全保证。
    - 路线: 将世界模型与物理真实感和任务奖励对齐
      解决的问题: 通过多维奖励建模或直接偏好优化对世界模型进行后训练，抑制非物理行为并提升任务完成度。
      尚未覆盖: 对齐依赖人类偏好，主观且扩展成本高；尚不清楚对齐后的模型是否保持多样性，还是过拟合于狭窄的奖励定义。
    - 路线: 世界模型能力的评估与基准测试
      解决的问题: 设计超越视觉保真度的指标和基准，测试空间推理、动作可控性和物理持久性。
      尚未覆盖: 现有失真指标可能通过奖励模糊均值产生误导；功能基准仍然稀缺，且未在不同本体和领域间标准化。
    - 路线: 视频生成作为世界模型的概念分类法
      解决的问题: 将设计空间组织为状态构建（隐式/显式）和动态建模（知识整合/架构重构），以澄清假设和差距。
      尚未覆盖: 该分类法尚未经过实证验证，以证明其能改变模型设计选择或改进评估实践。
    共识:
    - 世界模型必须同时表示状态和动态，视频生成是学习这些表示的有前景的基底。
    - 在大规模视频或动作-视频数据上预训练对泛化至关重要，但原始预训练模型缺乏物理基础和可控性。
    - 评估应从像素级重建质量转向物理持久性、因果推理和动作条件预测的功能测试。
    - 注入动作控制并将输出与物理定律对齐是关键开放挑战，需要专门的后训练或架构修改。
    分歧:
    - 如何注入动作条件：一些工作将动作原生集成到扩散或自回归架构中，另一些则在冻结的预训练模型上训练外部适配器。
    - 如何实施物理对齐：一条路线使用带多维奖励模型的强化学习，另一条使用带解耦判别器的直接偏好优化。
    - 信任哪些评估指标：感知指标（FID、KID）被证明与人类判断更相关，但失真指标（SSIM、余弦相似度）仍常用，并可能因偏向模糊预测而产生误导。
    - 世界模型应该是无状态视频预测器还是显式构建潜在状态：分类论文主张显式状态构建，但多数实证工作依赖上下文窗口或潜在序列中的隐式状态。
    开放问题:
