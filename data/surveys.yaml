  related_work_outline:
  - 'Mainstream direction: Research centers on evaluating world models rather than
    only proposing them: benchmark datasets for Minecraft navigation and memory/action
    control, plus standardized evaluations on NuScenes/OpenDV-2K/Waymo, CARL, Atari
    100k, and robotic video synthesis.'
  - 'Shared research pattern: Works use video generation, rollouts, or diagnostic
    consistency checks to test prediction, spatial/memory consistency, action control,
    physical plausibility, or downstream policy performance; several benchmark papers
    release datasets or code.'
  - 'Key differences: Some papers build evaluation datasets and metrics, while others
    build world-model methods evaluated on existing suites; targets span driving,
    Minecraft, Atari, contextual RL, and robotics, with visual fidelity, consistency,
    zero-shot generalization, or policy utility emphasized differently.'
  - 'Trend evolution: From 2023-2026 the evidence moves from aggregate Atari 100k
    performance toward contextual generalization diagnostics, then to open-domain
    spatial consistency and memory/action control benchmarks, staying within the current
    frontier.'
  - 'Open questions: Metric alignment with downstream decisions, cross-domain and
    cross-action-space generalization, long-term memory consistency, context observability
    assumptions, and result stability across implementations/compute remain unresolved.'
  related_work_outline_zh:
  - 主流方向：研究重心转向世界模型评测，构建Minecraft导航、记忆/动作控制基准，并用NuScenes/OpenDV-2K/Waymo、CARL、Atari
    100k及机器人视频合成进行标准化比较。
  - 研究共性：通过视频生成、环境展开或诊断一致性检查，检验预测、空间/记忆一致性、动作控制、物理合理性或下游策略表现；部分基准工作发布数据集或代码。
  - 关键差异：部分工作构建评测数据集与指标，部分构建世界模型方法并在现有套件上评测；覆盖驾驶、Minecraft、Atari、上下文RL和机器人，侧重视觉保真、一致性、零样本泛化或策略效用。
  - 趋势演进：2023-2026年证据从Atari 100k总分转向上下文泛化诊断，再到开放域LoopNav/MIND空间一致性与记忆/动作控制基准，仍处当前前沿内。
  - 开放问题：指标与下游决策对齐、跨域与跨动作空间泛化、长时记忆一致性、上下文可观测假设，以及不同实现与算力下结论稳定性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared open-domain datasets and tasks for world-model
        claims, such as loop-based Minecraft navigation and multi-view memory/action
        videos.
      what_remains_open: Coverage of long-horizon, cross-action, and physically complex
        settings; some dataset papers report construction but no evaluation results
        in the abstract.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate generation quality to diagnose spatial
        consistency, memory consistency, action control, and long-horizon or zero-shot
        rollout.
      what_remains_open: Whether these proxy metrics align with downstream robotic
        or driving decisions; invariance and sensitivity boundaries are not fully
        ablated.
    - line: World-model methods as benchmarked systems
      what_it_solves: Produces strong baseline systems that stress benchmarks in driving,
        Atari, contextual RL, and robotic video generation, exposing limits of existing
        evaluation protocols.
      what_remains_open: Many analysis fields omit explicit limitations, making failure
        modes and domain/action-space generalization boundaries hard to verify.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditability through shared benchmarks such as Atari
        100k, CARL, NuScenes/OpenDV-2K/Waymo, and open artifacts for LoopNav or MIND.
      what_remains_open: Stability across implementations and compute budgets is not
        tested; missing OpenAlex and varying artifact signals leave citation and reproducibility
        evidence incomplete.
    consensus:
    - World-model evaluation should not rely solely on short-horizon visual quality;
      consistency and control are treated as necessary additional evidence.
    - Diverse scenes, viewpoints, and action spaces are considered valuable for testing
      generalization beyond a single environment.
    - Open datasets or code are seen as important for reproducible benchmarking, especially
      in newly proposed diagnostic tasks.
    - Model-based methods are expected to demonstrate downstream utility, such as
      policy training, evaluation, or improved agent performance, rather than only
      frame generation.
    disagreements:
    - 'Evaluation target differs: spatial consistency, memory/action control, zero-shot
      context generalization, physical plausibility, or aggregate task score.'
    - 'Interaction and supervision differ: some use action-free video learning; others
      use action-conditioned generation, observable context values, or closed-loop
      rollouts.'
    - 'Deployment domain differs: driving, Minecraft navigation, Atari games, contextual
      RL, and robotic scenarios create different stress conditions.'
    - 'Metrics differ: human-normalized Atari score, scene graph consistency, long-horizon
      rollout, visual fidelity, or policy performance; there is no shared primary
      metric.'
    open_questions:
    - Do Minecraft loop navigation, curated multi-view videos, Atari 100k, two CARL
      tasks, and driving datasets cover the settings where world models are expected
      to be useful?
    - Are consistency metrics such as Scene Graph Consistency Score and MIND memory/action
      control measures aligned with downstream policy or decision quality?
    - Can world models maintain memory consistency and action control across long
      horizons and different action spaces, as MIND identifies as challenging?
    - Does zero-shot generalization for contextual world models extend beyond two
      CARL tasks and the assumption that context values are observable?
    - Are benchmark conclusions stable across different implementations and compute
      budgets when several papers lack explicit limitations and complete artifact
      or citation metadata?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 通过开放域导航、多视角记忆/动作视频等数据集和任务，让世界模型主张具备可比性，如LoopNav和MIND。
      尚未覆盖: 长时域、跨动作空间和物理复杂场景的覆盖仍有限；部分数据集论文摘要未报告评测结果。
    - 路线: 指标与压力测试设计
      解决的问题: 在像素级生成之外，检验空间一致性、记忆一致性、动作控制和长时域或零样本展开。
      尚未覆盖: 代理指标是否与下游机器人或驾驶决策一致；不变性和敏感性边界尚未充分消融。
    - 路线: 作为被评测系统的世界模型方法
      解决的问题: 在驾驶、Atari、上下文RL和机器人视频生成中提供强基线系统，暴露现有评测协议的局限。
      尚未覆盖: 多个分析字段缺少显式局限性，失败模式和跨域/跨动作空间泛化边界难以核实。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo等共享基准和LoopNav/MIND开源工件支持审计。
      尚未覆盖: 结论在不同实现和算力预算下是否稳定未验证；OpenAlex缺失和工件信号不一使引用与复现证据不完整。
    共识:
    - 世界模型评测不应只依赖短时程视觉质量，一致性与控制被视为必要补充。
    - 多样场景、视角和动作空间被视为检验跨环境泛化的重要条件。
    - 新提出的诊断任务通常重视开源数据或代码，以支持可复现基准。
    - 基于模型的方法需要展示下游效用，如策略训练、策略评估或智能体性能提升。
    分歧:
    - 评测目标不同：空间一致性、记忆/动作控制、零样本上下文泛化、物理合理性或总分。
    - 交互与监督不同：无动作视频学习、动作条件生成、可观测上下文值或闭环展开。
    - 部署域不同：驾驶、Minecraft导航、Atari游戏、上下文RL和机器人场景构成不同压力条件。
    - 指标不同：人类归一化Atari分、场景图一致性、长时域展开、视觉保真或策略表现，缺少统一主指标。
    开放问题:
    - 当前Minecraft循环导航、多视角视频、Atari 100k、两个CARL任务和驾驶数据集是否覆盖世界模型预期有用的真实设置？
    - Scene Graph Consistency Score与MIND记忆/动作控制指标是否和下游策略或决策质量对齐？
    - 世界模型能否在长时域和不同动作空间下保持记忆一致性与动作控制，如MIND所指出的挑战？
    - 上下文世界模型的零样本泛化能否超出两个CARL任务，并摆脱上下文值可观测假设？
    - 在部分论文缺少显式局限性和完整工件或引用元数据的情况下，基准结论在不同实现和算力下是否稳定？
