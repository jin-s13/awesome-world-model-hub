    - 接地策略不同：显式可观测上下文或语言解析，与隐式物理、深度或关键点约束对泛化假设有不同影响。
    开放问题:
    - 驾驶和机器人仿真收益能否迁移到真实安全、运营或部署？本证据包缺少该证据。
    - 组合式和上下文式模型能否处理未见原语、上下文、本体及更广泛的动力学变化？
    - 哪些指标能替代或补充视频保真度，以刻画物理合理性、长期记忆一致性和动作控制？
