  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: organize fragmented world-model research into application scenarios,
        state evolution, modality, technical challenges, benchmarks, and future directions
      what_remains_open: whether the synthesis is backed by systematic search and
        inclusion criteria rather than selective examples, and whether taxonomies
        keep up with rapid publication
    - line: Comparative evaluation synthesis
      what_it_solves: summarize how benchmark and metric choices shape conclusions
        across interactive video, autonomous driving, and robotics work
      what_remains_open: whether compared results are actually compatible across settings;
        many evaluation suites and closed-loop metrics are proposed but not empirically
        implemented
    - line: Open problem and gap mapping
      what_it_solves: turn broad literature coverage into concrete research gaps such
        as action-conditioned controllability, long-horizon memory, out-of-sight dynamics,
        real-time interactivity, and open-source artifacts
      what_remains_open: prioritization of which gaps matter most is not evidence-grounded;
        real-world and closed-loop validation remains limited
    consensus:
    - World-model research is converging on generative simulation as a shared substrate
      for interactive and embodied applications.
    - Long-horizon consistency, controllable generation, and real-time interactivity
      are recurring unresolved technical challenges.
    - Benchmarks and evaluation frameworks are increasingly treated as necessary parts
      of synthesis, but many remain conceptual rather than empirically validated.
    - Public code, datasets, and reproducible artifacts remain scarce relative to
      the number of systems and surveys discussed.
    disagreements:
    - 'Representation differs: latent-space world models for automated driving versus
      pixel-level generative video simulators versus persistent 4D global-state models.'
    - 'Evaluation target differs: sparse-reward physical robot learning on real hardware
      versus synthetic video plan generation versus no experimental validation in
      conceptual surveys.'
    - 'Interaction mode differs: action-conditioned video generation, ego-motion and
      human-pose control, or static taxonomy synthesis without an interactive system.'
    - 'Deployment setting differs: simulation-only evaluation versus real-world robot
      execution versus roadmap-level deployment guidance.'
    open_questions:
    - Do the surveys use systematic evidence collection, or are their taxonomies based
      on selective examples?
    - Are existing interactive-world and autonomous-driving benchmarks comparable
      across different observation spaces, action spaces, and metrics?
    - Can world models generalize beyond seen primitive combinations or predefined
      latent actions, and what evaluation would demonstrate that?
    - How much real-world closed-loop evidence is available, and what verification
      gaps remain for code, dataset, and baseline artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究整理为应用场景、状态演化、模态、技术挑战、基准和未来方向
      尚未覆盖: 综合是否基于系统检索和纳入标准而非选择性示例，以及分类法能否跟上快速更新
    - 路线: 对比评测综合
      解决的问题: 归纳交互视频、自动驾驶、机器人等领域的基准和指标如何影响跨论文结论
      尚未覆盖: 被比较结果在不同设置下是否真正兼容；多数闭环评估与代价指标仅提出而未实施验证
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体缺口，如动作条件控制、长时记忆、视线外动态、实时交互和开源工件
      尚未覆盖: 哪些缺口值得优先推进缺乏证据排序；真实世界和闭环验证仍有限
    共识:
    - 世界模型研究正在向生成式模拟作为交互和具身应用共同基础的方向收敛。
    - 长时一致性、可控生成和实时交互是反复出现的未解决技术挑战。
    - 基准和评估框架越来越被视为综合工作的必要部分，但许多仍停留在概念层面。
    - 公开代码、数据集和可复现工件相对于讨论的系统与综述数量仍然不足。
    分歧:
    - 表示方式不同：自动驾驶的潜在空间模型、像素级生成视频模拟器与持久4D全局状态模型并存。
    - 评测目标不同：真实硬件上的稀疏奖励机器人学习、合成视频计划生成和概念综述无实验验证并存。
    - 交互模式不同：动作条件视频生成、自我运动与人体姿态控制、以及无交互系统的静态分类综合并存。
    - 部署场景不同：纯仿真评测、真实机器人执行和路线图层面的部署指导并存。
    开放问题:
    - 相关综述是否采用系统证据收集，还是仅依赖选择性示例构建分类体系？
    - 不同交互世界和自动驾驶基准在不同观测空间、动作空间和指标下是否真正可比？
    - 世界模型能否泛化到训练中未见过的原语组合或预定义潜在动作之外，如何验证？
    - 真实世界闭环证据有多少，代码、数据集、基线等验证缺口还有哪些？
