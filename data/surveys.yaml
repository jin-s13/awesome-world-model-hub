  related_work_outline_zh:
  - 主流方向：领域化世界模型正从通用视频生成转向面向机器人和驾驶的动作条件化预测，并出现空间、记忆与动作控制一致性基准。
  - 研究共性：工作通常将视觉生成或动力学学习与任务或控制信号耦合；评估关注泛化、视觉保真、物理合理性或策略效用，而非仅重建误差。
  - 关键差异：领域在驾驶、机器人、游戏之间分化；模型族包括扩散Transformer、循环状态空间、VAE-Transformer混合及统一视频-动作扩散；条件信号包括语言原语、上下文值、物理损失和掩码重建。
  - 趋势演进：可见高分证据集中在2023–2026年，从Atari上的样本高效模型强化学习转向驾驶/机器人世界模型及专用一致性基准。
  - 开放问题：观察到的收益能否迁移到真实部署、未见原语或动作空间、长期记忆一致性，以及上下文或物理参数不可观测的设置。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon prediction
      what_it_solves: Predicting future driving video under multi-view and long-horizon
        settings for simulation-oriented evaluation.
      what_remains_open: Evidence does not connect improved video prediction to real-world
        driving safety or closed-loop operational outcomes; limitation analysis is
        absent.
    - line: Robot world models for video planning and action-coupled pretraining
      what_it_solves: Generating task-relevant robot videos or joining action and
        video diffusion to learn policies and dynamics from large robot datasets.
      what_remains_open: Generalization beyond seen primitive combinations, physical
        or sim-to-real transfer, cross-embodiment evidence, and missing limitation
        details remain verification gaps.
    - line: Contextual and stochastic model-based RL world models
      what_it_solves: Learning compact latent dynamics for sample-efficient policy
        learning and zero-shot generalization under observable context or visual Atari
        settings.
      what_remains_open: Evaluations are limited to two CARL tasks or Atari 100k;
        transfer to broader domains and hidden-context settings is not verified.
    - line: Benchmarks for spatial, memory, and action-control consistency
      what_it_solves: Quantifying world-model properties such as loop-consistent navigation,
        scene-graph consistency, memory consistency, and action control across action
        spaces.
      what_remains_open: Benchmark construction is stronger than model improvement
        evidence; downstream task or real-world validity of these metrics remains
        unproven.
    consensus:
    - World models in this topic are increasingly evaluated as generative or predictive
      models conditioned on actions, language, context, or physics signals.
    - 'Generalization is a shared concern: held-out scenes, zero-shot contexts, unseen
      task combinations, or unseen action spaces appear across evaluations.'
    - Pixel-level or reconstruction-only evaluation is being supplemented by consistency,
      plausibility, and policy-utility metrics.
    - Several papers provide datasets or code/artifact signals, but methodology and
      limitation reporting is uneven; missing details are verification gaps rather
      than confirmed weaknesses.
    disagreements:
    - Representation choices split among diffusion transformers, recurrent state-space
      models, VAE-Transformer hybrids, and unified diffusion over video and actions.
    - 'Conditioning differs: some methods factor language into primitives, others
      condition on observed context values, add physics-informed losses, or use mask
      reconstruction.'
    - 'Evaluation targets diverge by domain: driving video prediction, robot task
      or video generation, Atari sample efficiency, and memory, spatial, or action-control
      benchmarks.'
    - 'Deployment evidence differs: some methods are simulation-only or benchmark-only,
      while others use real driving or robot datasets; real closed-loop deployment
      evidence is uneven.'
    open_questions:
    - Do improvements in generated driving and robot videos translate to safer real-world
      closed-loop control and physical execution?
    - Can compositional robot world models generalize to entirely new primitive actions
      or objects rather than only combinations seen during training?
    - Which metric or test best predicts whether a world model maintains long-term
      memory consistency and action control across unseen scenes and viewing perspectives?
    - Can zero-shot dynamics generalization remain reliable when context or physical
      parameters are latent rather than directly observable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向多视角与长时域预测的驾驶世界模型
      解决的问题: 在驾驶场景中预测未来视频，支持多视角和长时域仿真式评测。
      尚未覆盖: 证据未把视频预测改善与真实驾驶安全或闭环运行结果相连接；也缺少局限性分析。
    - 路线: 面向视频规划与动作耦合预训练的机器人世界模型
      解决的问题: 生成任务相关机器人视频，或耦合动作与视频扩散以从大规模机器人数据学习策略和动力学。
      尚未覆盖: 对未见原语组合、物理或仿真到真实迁移、跨本体证据以及缺失的局限性细节仍是验证缺口。
    - 路线: 上下文与随机模型驱动的强化学习世界模型
      解决的问题: 学习紧凑潜在动力学，在可观测上下文或视觉Atari设置下实现样本高效策略学习与零样本泛化。
      尚未覆盖: 评测限于两个CARL任务或Atari 100k；更广泛领域和隐上下文设置尚未验证。
    - 路线: 面向空间、记忆与动作控制一致性的基准
      解决的问题: 量化世界模型的循环一致导航、场景图一致性、记忆一致性及跨动作空间的动作控制。
      尚未覆盖: 基准构建证据强于模型改进证据；这些指标的下游任务或现实有效性仍未证明。
    共识:
    - 该主题下的世界模型越来越多地被评估为以动作、语言、上下文或物理信号为条件的生成或预测模型。
    - 泛化是共同关注点：留出场景、零样本上下文、未见任务组合或未见动作空间在评测中反复出现。
    - 仅看像素级或重建误差的评测正在被一致性、合理性及策略效用指标补充。
    - 若干论文提供数据集或代码/工件信号，但方法和局限性报告不均；缺失细节是验证缺口而非已被证实的弱点。
    分歧:
    - 表示方式不同：扩散Transformer、循环状态空间模型、VAE-Transformer混合以及视频与动作统一扩散。
    - 条件信号不同：有的用语言分解为原语，有的基于可观测上下文值，有的加入物理信息损失，有的使用掩码重建。
    - 评测目标按领域分化：驾驶视频预测、机器人任务或视频生成、Atari样本效率以及记忆、空间或动作控制基准。
    - 部署证据不同：有些仅仿真或仅基准，有些使用真实驾驶或机器人数据；真实闭环部署证据不均衡。
    开放问题:
