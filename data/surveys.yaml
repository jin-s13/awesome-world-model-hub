  related_work_outline:
  - 'Mainstream direction: World-model applications are dominated by generative video
    and dynamics models for robotics, driving, and interactive control, focusing on
    action-conditioned or context-conditioned future prediction.'
  - 'Shared research pattern: Papers couple self-supervised visual or temporal prediction
    with domain-specific structure such as actions, language primitives, physics signals,
    or context variables, then evaluate through domain benchmarks or downstream policy
    utility.'
  - 'Key differences: They differ in representation, supervision, and evaluation target,
    including diffusion transformers, recurrent state-space models, VAE-transformers,
    and unified video-action diffusion, with mask, physics, context, or language-based
    training signals.'
  - 'Trend evolution: The visible top-paper evidence concentrates in 2023-2026, moving
    from efficient game/control world models toward domain-specific robotics and driving
    generation plus closed-loop diagnostic benchmarks.'
  - 'Open questions: Cross-embodiment and sim-to-real transfer, long-horizon memory
    and action consistency, generalization to unseen primitives or action spaces,
    and verification gaps from missing metrics or limitations remain unresolved.'
  related_work_outline_zh:
  - 主流方向：应用研究以机器人、驾驶和交互控制中的生成式视频/动力学世界模型为主，重点学习动作或上下文条件下的未来预测。
  - 研究共性：多将自监督视觉/时序预测与任务结构结合，如动作、语言原语、物理信号或上下文变量，并用领域基准或策略效用评估。
  - 关键差异：表示方式、监督信号和评测目标不同，涉及扩散Transformer、循环状态空间、VAE-Transformer、统一视频-动作扩散，以及掩码重建、物理深度/关键点、上下文和语言原语。
  - 趋势演进：可见前沿从游戏/控制的高效模型式强化学习，走向机器人/驾驶的领域生成模型与闭环诊断基准，尤其集中在2023-2026年。
  - 开放问题：跨本体与仿真到现实的迁移、长时记忆和动作一致性、新原语/动作泛化，以及缺失指标和局限声明的验证缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to concrete task domains with domain-specific
        states, actions, and constraints, such as contextual reinforcement learning
        and robot manipulation.
      what_remains_open: Transfer across embodiments, datasets, institutions, or physical
        environments, and generalization beyond observed context values or primitive
        combinations.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for driving scene prediction, long-horizon
        and multi-view video generation, and potential closed-loop simulation or policy
        evaluation.
      what_remains_open: Whether simulator-level video gains align with real-world
        safety or operational outcomes, and whether zero-shot dataset transfer is
        robust.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments where agents
        must act over time, including game benchmarks and navigation-style consistency
        evaluation.
      what_remains_open: Generalization when environment rules, goals, user interactions,
        action spaces, or viewpoints change, especially beyond curated benchmark conditions.
    consensus:
    - 'World models are evaluated by more than reconstruction: downstream control,
      policy utility, video fidelity, spatial consistency, memory consistency, or
      action controllability is central.'
    - Domain-specific structure such as actions, context variables, language primitives,
      or physics signals improves learning when coupled with scalable sequence or
      diffusion models.
    - Recent application-focused systems favor generative visual or temporal architectures
      that can produce future frames or imagined trajectories for agent learning.
    disagreements:
    - 'Representation: recurrent state-space dynamics, VAE-transformer stochastic
      models, diffusion transformers, and unified video-action diffusion imply different
      modeling priors.'
    - 'Supervision: context-conditioned latent dynamics, language-primitive decomposition,
      physics-informed depth and keypoint tasks, and mask reconstruction represent
      different learning signals.'
    - 'Evaluation target: zero-shot policy generalization, video fidelity and physical
      plausibility, robot execution, and memory/action/spatial consistency benchmarks
      are not interchangeable.'
    - 'Deployment setting: some work evaluates simulation-only robot execution, while
      other work pretrains on large robot datasets for downstream policy transfer;
      real-world evidence is uneven or absent in the visible packet.'
    open_questions:
    - How well do driving and robot world-model gains transfer across datasets, embodiments,
      institutions, and from simulation to physical deployment?
    - Can current models maintain long-horizon memory consistency, spatial consistency,
      and action control beyond curated loop-based or closed-loop benchmarks?
    - What mechanisms support generalization to unseen action spaces, language primitives,
      physical properties, or environment rules?
    - What verification gaps arise from missing code, dataset, metric, baseline, or
      limitation details in the visible evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到具有领域特定状态、动作和约束的具体任务，例如上下文强化学习和机器人操控。
      尚未覆盖: 跨本体、数据集、机构或物理环境的迁移，以及对未观测上下文值或原语组合之外的泛化。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于驾驶场景预测、长时域和多视角视频生成，以及潜在的闭环仿真或策略评测。
      尚未覆盖: 仿真层面的视频收益是否与真实安全或运营结果一致，以及零样本数据集迁移是否稳健。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落到智能体需要持续行动的交互环境中，包括游戏基准和导航式一致性评测。
      尚未覆盖: 环境规则、目标、用户交互、动作空间或视角变化时的泛化，尤其是超出 curated 基准条件的情况。
    共识:
    - 世界模型的评测不只看重建，策略效用、下游控制、视频保真度、空间一致性、记忆一致性或动作可控性同样关键。
    - 将动作、上下文变量、语言原语或物理信号等任务结构嵌入可扩展序列或扩散模型，有助于应用型世界模型学习。
    - 近期应用系统倾向于采用生成式视觉或时序架构，为智能体学习生成未来帧或想象轨迹。
    分歧:
    - 表示方式不同：循环状态空间、VAE-Transformer 随机模型、扩散 Transformer 和统一视频-动作扩散意味着不同建模先验。
    - 监督信号不同：上下文条件潜在动力学、语言原语分解、物理深度与关键点任务、掩码重建等学习目标各异。
    - 评测目标不同：零样本策略泛化、视频保真度与物理合理性、机器人执行、记忆/动作/空间一致性基准不可互换。
    - 部署场景不同：部分工作仅做仿真机器人执行，部分在大规模机器人数据集上预训练以迁移策略，真实世界证据可见度不一。
    开放问题:
    - 驾驶和机器人世界模型的收益能否跨数据集、本体、机构以及从仿真迁移到真实物理部署？
    - 当前模型能否在 curated 的循环或闭环基准之外保持长时记忆一致性、空间一致性和动作控制？
    - 哪些机制能支持对未见动作空间、语言原语、物理属性或环境规则的泛化？
    - 可见证据中缺失代码、数据集、指标、基线或局限性说明时，应如何识别和衡量验证缺口？
