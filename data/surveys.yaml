        independent reproduction; several limitation fields are omitted, so operational
        boundaries remain uncertain.
    consensus:
    - Works agree that controllable future generation is a core capability for using
      world models as systems, not only as image generators.
    - Evaluation is shifting toward action fidelity, physical plausibility, spatial
      consistency, or downstream policy utility rather than visual quality alone.
    - Open datasets, benchmarks, and code are increasingly treated as part of the
      system contribution, especially for reproducible evaluation.
