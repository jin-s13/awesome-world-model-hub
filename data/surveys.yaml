  related_work_outline:
  - 'Mainstream direction: Building action-controllable, real-time world-model simulation
    systems that transform video generative models into closed-loop interactive simulators
    for autonomous driving and robotics.'
  - 'Shared research pattern: Systematically evaluating action fidelity, spatial consistency,
    and physical plausibility via large-scale benchmarks and open-source artifacts,
    and integrating full training-inference-deployment pipelines.'
  - 'Key differences: Model architectures (diffusion vs. autoregressive), control
    granularity (high-level intentions vs. low-level maneuvers), physics injection
    (explicit depth prediction vs. implicit keypoint dynamics), and evaluation environments
    (Minecraft, nuScenes, robotic simulation).'
  - 'Trend evolution: Shifting from pure video quality toward action controllability,
    closed-loop consistency, and real-time interactivity; systems are moving from
    isolated models to standardized simulation platforms and reproducible benchmarks.'
  - 'Open questions: Cumulative errors in long-horizon closed-loop rollouts, generalization
    across domains and hardware, speed-vs-fidelity-vs-physics trade-offs, and robustness
    of independent reproduction and deployment.'
  related_work_outline_zh:
  - 主流方向：构建动作可控的实时世界模型仿真系统，将视频生成模型转化为闭环交互式世界模拟器，主要面向自动驾驶和机器人。
  - 研究共性：通过大规模基准和开源工件系统评估动作保真度、空间一致性与物理合理性，并整合完整的训练-推理-部署流水线。
  - 关键差异：模型架构（扩散与自回归）、控制粒度（高层意图与低层操纵）、物理注入方式（显式深度预测与隐式关键点动力学）、评估环境（Minecraft、nuScenes、机器人仿真）各有不同。
  - 趋势演进：从关注视频质量转向强调动作可控性、闭环一致性和实时交互；系统从孤立模型走向标准化仿真平台和可复现基准。
  - 开放问题：长时域闭环推演的累积误差、跨领域和硬件的泛化能力、速度-保真度-物理一致性的权衡，以及独立复现与部署的鲁棒性。
  literature_review:
    line_of_work_matrix:
    - line: Runnable simulation and evaluation systems
      what_it_solves: Packaging world models into end-to-end workflows that provide
        data, training, closed-loop inference, and standardized evaluation to quantify
        model performance.
      what_remains_open: Robustness of these systems under out-of-distribution scenarios
        in real-world deployment and their generalization across sensor configurations
        and domains.
    - line: Real-time interactive world-model deployment
      what_it_solves: Meeting low-latency and high-controllability requirements so
        that world models can serve as real-time simulators for policy training and
        evaluation.
      what_remains_open: Scalability of distributed real-time inference while preserving
        physical consistency and visual quality, and stability under extreme perturbations.
    - line: Reproducible benchmarks and engineering artifacts
      what_it_solves: Enabling inspectability and comparability through open-source
        code, datasets, and evaluation protocols, driving community standardization.
      what_remains_open: Consistency of independent reproduction across teams and
        infrastructure, and validation of evaluation metrics against real-world task
        performance.
    consensus:
    - All works upgrade world models from pure generative models to interactive simulation
      systems, emphasizing action-conditioned generation and closed-loop evaluation.
    - They adopt public datasets and benchmarks for quantitative assessment and tend
      to release open-source artifacts to promote reproducibility.
    - They recognize that video quality alone is insufficient; new metrics such as
      action fidelity, spatial consistency, and physical plausibility are necessary.
    disagreements:
    - 'Control granularity: some use high-level driving commands, while others use
      low-level trajectories and speeds.'
    - 'Physics injection: explicit supervision via depth prediction versus implicit
      learning through keypoint dynamics.'
    - 'Evaluation environments: open-world games (Minecraft), real-world driving data
      (nuScenes), and robotic manipulation scenarios.'
    - 'Model architecture: diffusion models versus autoregressive transformers, leading
      to different trade-offs between generation speed and controllability.'
    open_questions:
    - How well do these systems generalize across datasets and real-world scenarios
      beyond the evaluated benchmarks?
    - What is the impact of cumulative errors in long-horizon closed-loop simulations
      on downstream task performance?
    - What are the Pareto-optimal trade-offs among real-time inference speed, visual
      quality, and physical consistency?
    - How do hardware and software environment differences affect independent reproduction
      of these systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行仿真与评估系统
      解决的问题: 将世界模型封装为端到端工作流，提供数据、训练、闭环推理和标准评估，量化模型性能。
      尚未覆盖: 系统在真实部署中面对分布外场景的鲁棒性，以及跨传感器配置和领域的泛化能力。
    - 路线: 实时交互式世界模型部署
      解决的问题: 满足低延迟和高可控性要求，使世界模型能作为实时仿真器支持策略训练和评估。
      尚未覆盖: 在保持物理一致性和视觉质量的同时实现分布式实时推理的可扩展性，以及极端扰动下的稳定性。
    - 路线: 可复现基准与工程工件
      解决的问题: 通过开源代码、数据集和评估协议促进系统可检查性和可比较性，推动社区标准化。
      尚未覆盖: 独立团队在不同基础设施上复现的一致性，以及评估指标对真实世界任务有效性的验证。
    共识:
    - 所有工作都将世界模型从纯生成模型升级为交互式仿真系统，强调动作条件生成和闭环评估。
    - 均采用公开数据集和基准进行量化评测，倾向于开源以促进可复现性。
    - 均认识到单一视频质量指标不足，需要动作保真度、空间一致性、物理合理性等新指标。
    分歧:
    - 控制粒度：有的使用高级驾驶指令，有的使用低层轨迹和速度。
    - 物理注入方式：显式深度预测监督与隐式关键点动力学学习。
    - 评估环境：开放世界游戏（Minecraft）、真实驾驶数据（nuScenes）、机器人操作场景。
    - 模型架构：扩散模型与自回归Transformer，导致生成速度与可控性之间的不同权衡。
    开放问题:
    - 这些系统在评估基准之外的数据集和真实场景中的泛化性如何？
    - 长时域闭环仿真中累积误差对下游任务性能的影响是什么？
    - 实时推理速度、视觉质量和物理一致性之间的帕累托前沿是什么？
    - 硬件和软件环境差异如何影响这些系统的独立复现？
