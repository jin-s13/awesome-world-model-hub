  related_work_outline:
  - 'Mainstream direction: Applying world models to embodied tasks (robotics, autonomous
    driving) and interactive environments (games, benchmarks) by generating future
    states or videos, often with diffusion or transformer architectures.'
  - 'Shared research pattern: All works use a learned world model to predict future
    observations or states conditioned on actions, then use the model either for policy
    learning, planning, or evaluation; most take a video generation approach.'
  - 'Key differences: Representations range from VAE-based latent states to raw video
    diffusion; supervision signals include physics priors, action-video coupling,
    and mask reconstruction; evaluation targets differ across visual fidelity, physical
    plausibility, policy performance, and spatial/memory consistency.'
  - 'Trend evolution: From 2023–2025, the focus expanded from Atari games (STORM)
    to complex robotics (RoboDreamer, RoboScape, UWM) and driving (MaskGWM), and from
    in-domain performance to zero-shot generalization and compositional tasks. In
    2025–2026, rigorous benchmarks for spatial and memory consistency (LoopNav, MIND)
    emerged, signaling a shift toward systematic evaluation.'
  - 'Open questions: How to close the gap between simulation gains and real-world
    safety in driving; how to achieve long-term memory consistency and cross-embodiment
    generalization in robotics; how to verify physical plausibility beyond visual
    appearance; and how to scale world models for out-of-distribution tasks without
    expensive real-world data.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于具身任务（机器人、自动驾驶）和交互式环境（游戏、基准测试），通过生成未来状态或视频来预测未来，主流架构为扩散模型或Transformer。
  - 研究共性：所有工作都学习一个世界模型，根据动作预测未来观测或状态，然后用于策略学习、规划或评估；多数采用视频生成方式。
  - 关键差异：表示方式从VAE潜在状态到原始视频扩散；监督信号包含物理先验、动作-视频耦合、掩码重建；评测目标在视觉保真度、物理合理性、策略性能、空间/记忆一致性上各有侧重。
  - 趋势演进：从2023年Atari游戏（STORM）到2024–2025年复杂机器人（RoboDreamer、RoboScape、UWM）和驾驶（MaskGWM），从域内性能扩展到零样本泛化和组合任务。2025–2026年出现空间一致性和记忆一致性基准（LoopNav、MIND），标志着向系统性评测的转变。
  - 开放问题：如何弥合驾驶中仿真收益与真实安全性之间的差距；如何在机器人中实现长期记忆一致性和跨本体泛化；如何在视觉之外验证物理合理性；如何在不依赖昂贵真实数据的情况下扩展世界模型到分布外任务。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving simulation and scene prediction
      what_it_solves: Building world models that generate long-horizon, multi-view
        future videos from driving data, enabling closed-loop simulation and policy
        evaluation.
      what_remains_open: Alignment between simulation-based improvements and real-world
        safety or operational outcomes; cross-dataset generalization without retraining;
        and the handling of rare, safety-critical scenarios.
    - line: Interactive environments and world model benchmarks
      what_it_solves: Designing game-like environments and datasets to evaluate world
        models on spatial consistency, memory, and action controllability; developing
        efficient architecture for game-based RL.
      what_remains_open: Generalization when environment rules, goals, or action spaces
        change; long-term memory consistency beyond simple loops; and the translation
        of findings from small-scale benchmarks to open-ended real-world tasks.
    - line: Embodied robotics and physical world models
      what_it_solves: Learning world models for robot video generation and policy
        learning, often incorporating physical priors (depth, keypoints), language
        compositionality, or large-scale multi-task pretraining.
      what_remains_open: Sim-to-real transfer and deployment on physical robots; handling
        of completely novel primitives or objects; robustness to imperfect language
        parsing; and the assumption of observable context values in zero-shot settings.
    consensus:
    - World models are increasingly based on video generation, using diffusion models
      or transformers to predict future frames from past observations and actions.
    - The models are not only used for prediction but also for downstream policy learning,
      planning, or evaluation, often by rolling out imagined trajectories.
    - There is a growing emphasis on generalization beyond the training distribution,
      moving from single-task to multi-task, zero-shot, or compositional settings.
    - Recent work introduces structured evaluation metrics beyond pixel-level reconstruction,
      such as spatial consistency, physical plausibility, and memory, indicating a
      maturing field.
    disagreements:
    - 'Model architecture: some adopt a unified diffusion process for both video and
      action (UWM), while others separate video generation from action-conditioned
      latent dynamics (cRSSM, STORM) or factorize generation by language primitives
      (RoboDreamer).'
    - 'Supervision signal: physics-informed approaches impose explicit depth or keypoint
      losses (RoboScape), whereas MaskGWM uses mask reconstruction as an auxiliary
      task; others rely purely on reconstruction and reward.'
    - 'Evaluation target: driving models are evaluated on video prediction metrics
      and dataset transfer, robotics models on visual fidelity and policy execution,
      and benchmarks on spatial consistency and memory across action spaces.'
    - 'Interaction mode: some works require ground-truth action sequences for generation,
      while unified models jointly learn policy and dynamics, and benchmarks demand
      action-controllable generation from novel action spaces.'
    open_questions:
    - Can the performance gains observed in simulation for driving models be translated
      into measurable safety improvements in real-world driving?
    - How can world models reliably maintain long-term memory and spatial consistency
      in open-ended environments with many plausible paths?
    - What physical verification metrics beyond visual appearance are needed to trust
      embodied world models for real robot deployment?
    - To what extent do the assumptions of observable context, perfect language parsing,
      or static action spaces limit the practical adoption of current methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶仿真与场景预测
      解决的问题: 从驾驶数据构建能生成长时域、多视角未来视频的世界模型，支持闭环仿真和策略评测。
      尚未覆盖: 仿真改进与真实安全或运营结果之间的对齐；无重训练的跨数据集泛化；以及罕见、安全关键场景的处理。
    - 路线: 交互式环境与世界模型基准
      解决的问题: 设计类游戏环境和数据集，从空间一致性、记忆和动作可控性角度评估世界模型；开发用于游戏强化学习的高效架构。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化；超越简单循环的长期记忆一致性；从小规模基准到开放真实任务的发现迁移。
    - 路线: 具身机器人与物理世界模型
      解决的问题: 学习世界模型用于机器人视频生成和策略学习，通常融入物理先验（深度、关键点）、语言组合性或大规模多任务预训练。
      尚未覆盖: 从仿真到真实机器人的迁移与部署；处理全新原语或物体；对不完美语言解析的鲁棒性；零样本场景下上下文值可观测的假设。
    共识:
    - 世界模型越来越基于视频生成，使用扩散模型或Transformer根据过去观测和动作预测未来帧。
    - 模型不仅用于预测，还用于下游策略学习、规划或评估，通常通过展开想象轨迹。
    - 越来越强调超越训练分布的泛化，从单任务转向多任务、零样本或组合设置。
    - 近期工作引入了超越像素级重建的结构化评估指标，如空间一致性、物理合理性和记忆，表明领域正在成熟。
    分歧:
    - 模型架构：一些采用视频和动作的统一扩散过程（UWM），另一些将视频生成与动作条件潜在动力学分离（cRSSM、STORM），或通过语言原语分解生成（RoboDreamer）。
    - 监督信号：物理信息方法施加显式的深度或关键点损失（RoboScape），而MaskGWM使用掩码重建作为辅助任务；其他仅依赖重建和奖励。
    - 评测目标：驾驶模型在视频预测指标和数据集迁移上评估，机器人模型在视觉保真度和策略执行上评估，基准测试在空间一致性和跨动作空间记忆上评估。
    - 交互模式：一些工作需要真实动作序列来生成，而统一模型联合学习策略和动力学，基准测试要求能够根据新动作空间生成。
    开放问题:
    - 驾驶模型在仿真中观察到的性能提升能否转化为实际驾驶中可衡量的安全改善？
    - 世界模型如何在具有多条合理路径的开放环境中可靠地保持长期记忆和空间一致性？
    - 除了视觉外观，还需要哪些物理验证指标才能信任具身世界模型在真实机器人上的部署？
    - 当前方法对可观测上下文、完美语言解析或静态动作空间的假设在多大程度上限制了实际应用？
