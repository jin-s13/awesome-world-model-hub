    world simulators for closed-loop evaluation and model-based training, especially
    in driving and robotics. Representative evidence includes action-conditioned video
    generation and physics-informed RGB prediction.'
  - 'Shared research pattern: Most systems embed control signals into generative video
    or world models and evaluate them through synthetic rollouts or benchmark metrics
    such as action fidelity, spatial consistency, visual quality, and downstream policy
    utility.'
  - 'Key differences: Methods differ in world representation, training objectives,
    and evaluation focus. Some modify recurrent state-space models with context; others
    adapt pre-trained diffusion or autoregressive video generators with action modules,
    physics losses, or structured multi-view control.'
  - 'Trend evolution: Across 2024-2026, the frontier is moving from static visual
    fidelity toward interactive, real-time, closed-loop settings where action controllability,
    memory, physical plausibility, and system latency become first-class concerns.'
  - 'Open questions: Evidence is sparse on long-horizon consistency, generalization
    beyond nuScenes/CARL/Minecraft, independent reproduction, and whether physics-informed
    generation improves downstream policy quality rather than only visual metrics.'
  related_work_outline_zh:
  - 主流方向：当前研究集中在可动作控制的世界模拟器，用于闭环评测和基于模型的训练，尤其面向自动驾驶与机器人。例如动作条件视频生成和物理信息RGB预测。
  - 研究共性：多数系统将控制信号注入生成式视频或世界模型，并以动作忠实度、空间一致性、视觉质量或下游策略效用等指标进行合成推演评测。
  - 关键差异：方法在世界表示、训练目标和评测重点上不同；有些修改循环状态空间模型并引入上下文，有些则改造预训练扩散或自回归视频生成器，加入动作模块、物理损失或结构化多视图控制。
  - 趋势演进：2024至2026年，研究从静态视觉保真转向交互式、实时、闭环设置，动作可控性、记忆、物理合理性和系统延迟成为核心。
  - 开放问题：长时程一致性、跨数据集泛化、独立复现以及物理信息生成是否真能改善策略质量，目前证据仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable generative world simulation
      what_it_solves: Produces future frames from control inputs for closed-loop or
        model-based use, covering driving and control tasks.
      what_remains_open: Long-horizon consistency and generalization beyond training
        datasets such as nuScenes or CARL remain weakly evidenced; dynamic control
        can trade off visual detail.
    - line: Benchmarking and evaluation infrastructure for world models
      what_it_solves: Makes action fidelity, spatial consistency, or physics plausibility
        measurable through datasets and metrics such as loop navigation or trajectory-conditioned
        frames.
      what_remains_open: Cross-domain metric validity, result standardization, and
        evidence that metrics track downstream policy performance are still unresolved.
    - line: Physics-informed embodied video simulation
      what_it_solves: Adds geometry or physics supervision to RGB generation for more
        realistic robot video synthesis and downstream policy training/evaluation.
      what_remains_open: Independent reproduction and broader downstream validation
        are limited; physical plausibility is inferred mainly from visual experiments.
    - line: Real-time deployment-oriented closed-loop driving systems
      what_it_solves: Targets low-latency multi-view video generation for autonomous
        driving simulation, combining structured control and autoregressive or diffusion
        generation.
      what_remains_open: Deployment evidence focuses on nuScenes and single-GPU latency;
        multi-sensor, cross-environment, and very long-horizon behavior are not verified.
    consensus:
    - The field agrees that action or control conditioning should be explicit in generative
      world models rather than relying only on open-loop visual prediction.
    - Recent work converges on evaluating world models through rollouts or benchmarks
      that measure action fidelity, spatial consistency, visual quality, or downstream
      policy utility.
    - 'There is shared attention to simulation as infrastructure: multiple papers
      provide datasets, benchmarks, or baseline systems to operationalize comparison.'
    - Several systems treat pre-trained video generative models as reusable backbones
      or baselines, suggesting a shift toward adaptation over end-to-end training
      from scratch.
    disagreements:
    - 'Representation differs: one line uses recurrent latent state-space dynamics
      with context, while others use diffusion or autoregressive multi-view video
      generation.'
    - 'Supervision differs: physics-informed depth/keypoint objectives, motion-reinforced
      action losses, and structured control losses optimize different aspects of world
      behavior.'
    - 'Evaluation target differs: some focus on spatial consistency in open-world
      navigation, others on driving action fidelity, closed-loop driving quality,
      visual/physical plausibility, or zero-shot control generalization.'
    - 'Interaction setting differs: model-based policy training on imagined rollouts
      contrasts with real-time single-GPU closed-loop driving simulation.'
    open_questions:
    - How do current action-fidelity and spatial-consistency metrics relate to downstream
      policy success across navigation, driving, and robotics?
    - Can context-conditioned world models generalize when context variables are not
      directly observable, as assumed in the cRSSM evidence?
    - Do physics-informed video generation methods improve policy training or mainly
      improve visual plausibility metrics?
    - How well do closed-loop driving simulators transfer beyond nuScenes-like sensor
      configurations and single-GPU latency constraints?
    - Which long-horizon memory or consistency mechanisms actually prevent degradation
      in action-controlled rollouts?
    - Reproducibility signals and score metadata are uneven in this packet; missing
      code, dataset, baseline, or limitation details should be treated as verification
      gaps rather than evidence of reliability.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的生成式世界模拟
      解决的问题: 根据控制输入生成未来帧，用于闭环或基于模型的策略训练与评估，覆盖驾驶和控制任务。
      尚未覆盖: 长时程一致性和跨数据集泛化证据不足；动态控制与视觉细节之间存在权衡。
    - 路线: 世界模型基准与评测基础设施
      解决的问题: 通过数据集和指标度量动作忠实度、空间一致性或物理合理性，使比较可操作化。
      尚未覆盖: 跨领域指标有效性、结果标准化，以及指标是否反映下游策略性能仍未解决。
    - 路线: 物理信息驱动的具身视频模拟
      解决的问题: 在RGB生成中加入几何或物理监督，以提升机器人视频合成和下游策略训练/评估的真实性。
      尚未覆盖: 独立复现和更广泛下游验证有限；物理合理性主要从视觉实验推断。
    - 路线: 面向实时部署的闭环驾驶系统
      解决的问题: 结合结构化控制与扩散或自回归生成，实现低延迟多视图自动驾驶视频模拟。
      尚未覆盖: 部署证据集中于nuScenes和单GPU延迟；多传感器、跨环境及极长时程行为未验证。
    共识:
    - 领域普遍认为动作或控制条件应显式纳入生成式世界模型，而不是只做开环视觉预测。
    - 近期工作倾向于通过推演或基准来评估动作忠实度、空间一致性、视觉质量和下游策略效用。
    - 多个系统将数据集、基准或基线模型作为基础设施发布，显示研究正在向标准化对比靠拢。
    - 多项工作把预训练视频生成模型视为可复用骨架或基线，反映了从零训练向适配改造的转变。
    分歧:
    - 表示方式不同：一类使用带有上下文的循环潜在状态空间动力学，另一类使用扩散或自回归多视图视频生成。
    - 监督信号不同：物理信息深度/关键点目标、运动增强动作损失和结构化控制损失分别优化世界行为的不同方面。
    - 评测目标不同：有的关注开放世界导航的空间一致性，有的关注驾驶动作忠实度、闭环驾驶质量、视觉/物理合理性或零样本控制泛化。
    - 交互模式不同：在想象轨迹上进行基于模型的策略训练，与实时单GPU闭环驾驶模拟形成对比。
    开放问题:
    - 当前动作忠实度和空间一致性指标能否反映导航、驾驶和机器人任务中的下游策略成功率？
    - 当上下文变量不能直接观测时，上下文条件世界模型是否仍然有效？现有证据假设上下文可观测。
    - 物理信息视频生成方法究竟改善策略训练，还是主要改善视觉合理性指标？
    - 闭环驾驶模拟器在nuScenes之外的传感器配置和单GPU延迟约束下能否保持性能？
    - 哪种长时程记忆或一致性机制能真正抑制动作控制推演中的退化？
    - 本证据包中可复现信号和评分元数据不一致；缺失代码、数据集、基线或局限性细节应视为验证缺口，而非可靠性证据。
