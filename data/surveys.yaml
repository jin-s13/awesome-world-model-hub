  related_work_outline:
  - 'Mainstream direction: Generative video world models built on diffusion transformers
    and auxiliary self-supervised objectives dominate recent method work, with action,
    context, and language conditioning plus stronger long-horizon evaluation.'
  - 'Shared research pattern: Multiple approaches couple representation learning with
    generation and control signals; video prediction is the common testbed, with auxiliary
    tasks such as mask reconstruction, physics, keypoint, or language factorization.'
  - 'Key differences: Some methods learn compact stochastic latent dynamics for sample-efficient
    reinforcement learning, while others generate high-fidelity video in pixel space;
    supervision and interaction range from context variables and language primitives
    to coupled action diffusion and benchmark diagnostics.'
  - 'Trend evolution: Evidence from 2023-2026 shifts from Dreamer-style latent model-based
    reinforcement learning toward diffusion or transformer world models with context,
    composition, and physics awareness, and from reconstruction-only metrics toward
    spatial, memory, and action-consistency evaluation.'
  - 'Open questions: Long-horizon physical and memory consistency, isolation of model
    versus planner or action-interface effects, generalization beyond seen contexts
    and primitives, and standardized closed-loop evaluation remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和辅助自监督目标为核心的生成式视频世界模型成为近期方法主流，并通过动作、上下文或语言条件提升泛化，同时强化长时域一致性评估。
  - 研究共性：多种方法将表示学习、生成与控制信号耦合，以视频预测为主要试验场，并引入掩码重建、物理、关键点或语言分解等辅助任务。
  - 关键差异：部分方法学习紧凑随机潜在动力学用于高效强化学习，部分在像素空间生成高保真视频；监督与交互包括上下文变量、语言原语、耦合动作扩散和评测式诊断。
  - 趋势演进：2023至2026年证据显示，方法从Dreamer式潜在模型向具备上下文、组合与物理感知的扩散/Transformer世界模型演进，指标也从重建精度转向空间、记忆与动作一致性。
  - 开放问题：长时域物理与记忆一致性、模型收益与规划/动作接口贡献的隔离、对未见上下文与原语的泛化，以及标准化闭环评测仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models with auxiliary self-supervised objectives
      what_it_solves: Transform world-model goals into high-dimensional video predictors
        using diffusion transformers and tasks such as mask reconstruction, depth,
        keypoint dynamics, or language-primitive factorization.
      what_remains_open: Transfer beyond the reported driving or robot scenes, long-horizon
        physical and geometric consistency, and generalization to unseen primitives
        remain incompletely verified.
    - line: Stochastic latent dynamics models for sample-efficient reinforcement learning
      what_it_solves: Learn compact visual latent states and dynamics for policy optimization
        under limited environment interaction, including context-conditioned variants
        for zero-shot dynamics transfer.
      what_remains_open: Evidence is limited to narrow tasks and assumes observable
        context; it does not fully separate model improvement from policy, search,
        or implementation effects.
    - line: Action-coupled and control-interface world models
      what_it_solves: Couple learned dynamics with explicit action interfaces or diffusion
        timesteps, enabling pretraining on large robot datasets and flexible policy
        or dynamics representation.
      what_remains_open: Long-rollout controllability and generalization across action
        spaces remain open; action-free video learning gains are shown but downstream
        robustness evidence is partial.
    - line: Closed-loop evaluation methods for spatial and memory consistency
      what_it_solves: Supply datasets and metrics that probe spatial consistency,
        memory, and action control under loop navigation or revisited viewpoints.
      what_remains_open: Available evidence focuses on benchmark construction and
        often lacks comparative modeling results; standard metrics and cross-dataset
        validity are not yet established.
    consensus:
    - World-model architectures increasingly couple generation, representation, and
      control signals in a single training objective.
    - Across studied methods, auxiliary tasks such as mask reconstruction, depth,
      keypoint, or language factorization are used to move beyond pixel-level reconstruction.
    - Evaluation is expanding from short-horizon reconstruction to zero-shot, long-horizon,
      spatial, memory, and action-control criteria.
    - Context, physics, language, and action conditioning are treated as necessary
      for generalization or controllability rather than optional side inputs.
    - Large-scale pretraining on robot or driving data is used to improve robustness
      over monolithic predictors.
    disagreements:
    - 'Representation choice differs: compact stochastic latent states versus high-dimensional
      diffusion-based video generation.'
    - 'Supervision signal differs: observable context variables, language primitives,
      physics or depth or keypoint tasks, or coupled action-diffusion timesteps.'
    - 'Evaluation target differs: sample-efficient policy learning, visual fidelity
      or plausibility, or diagnostic closed-loop consistency and action control.'
    - 'Interaction mode differs: explicit action-conditioned control, language-decomposed
      plans, or no model proposal in benchmark-focused work.'
    - 'Deployment setting differs: game-like visual reinforcement learning, driving
      scenes, and robot manipulation datasets carry different dynamics and evaluation
      assumptions.'
    open_questions:
    - How can long-horizon memory and spatial consistency be maintained when generative
      world models scale to open-domain scenes and varied action spaces?
    - What evaluation design would isolate world-model contribution from the planner,
      controller, dataset, and auxiliary implementation choices?
    - How far do context, physics, language-composition, and action-diffusion world
      models generalize beyond the reported contexts, primitives, or embodiments?
    - What real-world transfer and limitation or reproducibility evidence is missing
      across recent methods and evaluation datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 以辅助自监督目标驱动的生成式视频世界模型
      解决的问题: 将世界模型目标落实为高维视频预测器，使用扩散Transformer以及掩码重建、深度、关键点或语言原语分解等任务。
      尚未覆盖: 超出所报告驾驶或机器人场景的迁移、长时域物理与几何一致性，以及对未见原语的泛化仍未充分验证。
    - 路线: 面向高效强化学习的随机潜在动力学模型
      解决的问题: 学习紧凑的视觉潜在状态和动力学，以在有限交互下优化策略，并支持基于上下文的零样本动力学迁移。
      尚未覆盖: 证据集中在较窄任务且假设上下文可观测；未能完全区分模型改进与策略、搜索或实现因素。
    - 路线: 动作耦合与控制接口世界模型
      解决的问题: 将学习到的动力学与显式动作接口或扩散时间步耦合，支持大规模机器人数据预训练和灵活的策略或动力学表示。
      尚未覆盖: 长时域可控性与跨动作空间泛化仍开放；无动作视频学习的下游鲁棒性证据不完整。
    - 路线: 面向空间与记忆一致性的闭环评测方法
      解决的问题: 提供数据集和指标，在循环导航或视角重访条件下考察空间一致性、记忆与动作控制。
      尚未覆盖: 现有证据侧重基准构建，通常缺少对比模型结果；标准指标与跨数据集有效性尚未建立。
    共识:
    - 世界模型架构越来越多地在单一训练目标中耦合生成、表示与控制信号。
    - 研究方法普遍引入掩码重建、深度、关键点或语言分解等辅助任务，以超越像素级重建。
    - 评测正在从短时域重建扩展到零样本、长时域、空间、记忆和动作控制等标准。
    - 上下文、物理、语言和动作条件被视为实现泛化或可控性的必要组成部分。
    - 大规模机器人或驾驶数据预训练被用于提升鲁棒性，而非仅依赖单一预测器。
    分歧:
    - 表示选择不同：紧凑随机潜在状态与高维扩散视频生成之间存在分歧。
    - 监督信号不同：可观测上下文变量、语言原语、物理/深度/关键点任务或耦合动作扩散时间步各有侧重。
    - 评测目标不同：样本高效策略学习、视觉保真或合理性、诊断性闭环一致性或动作控制彼此不同。
    - 交互方式不同：显式动作条件控制、语言分解计划，或基准工作中不提出模型。
    - 部署设定不同：游戏式视觉强化学习、驾驶场景和机器人操作数据隐含不同的动力学与评测假设。
    开放问题:
    - 生成式世界模型在扩展到开放域场景和多样动作空间时，如何维持长时域记忆与空间一致性？
    - 何种评测设计能分离世界模型贡献与规划器、控制器、数据集及辅助实现选择的影响？
    - 上下文、物理、语言组合与动作扩散世界模型能在多大程度上泛化到已报告上下文、原语或具身之外？
    - 近期方法与评测数据集中还缺少哪些真实世界迁移、局限性和可复现性证据？
