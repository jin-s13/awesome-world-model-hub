      尚未覆盖: 依赖小规模动作标注数据，对其他顺序决策任务的泛化尚未验证
    - 路线: 物理对齐与偏好调优的具身轨迹生成
      解决的问题: 通过奖励或偏好信号对基于视频的世界模型进行后训练，改善物理真实性、任务逻辑、具身合理性和视觉质量
      尚未覆盖: 奖励收集依赖人类偏好，评测集中在接触丰富操作，跨领域迁移未展示
    - 路线: 功能评测与测试时验证
      解决的问题: 评估生成轨迹是否真正改善空间推理或支持可靠模型评测，而非仅视觉逼真
      尚未覆盖: 验证器存在校准与缩放失败，尤其在 MMSI-Bench 上无一致测试时缩放
    - 路线: 状态构建与动力学建模分类法
      解决的问题: 将视频生成作为世界模型的方法组织为隐式/显式状态构建和知识/架构驱动的动力学建模
      尚未覆盖: 该分类法尚未落地为标准功能基准，也未被训练选择验证
    共识:
    - 动作条件视频生成已成为具身学习中世界模型能力的事实目标。
    - 仅视觉保真度被认为不足；物理真实性、动作对齐、轨迹一致性和下游决策效用正被纳入训练或评测。
    - 生成轨迹被期望服务多种下游用途：策略学习、规划、策略评估、验证器选择或合成数据。
    - 多数方法依赖大规模动作-视频数据或预训练视频生成器，但对因果和持久状态行为的验证仍有限。
    - 在前沿方法中，显式后训练或适配机制被用于向无状态视频模型注入动作控制或物理约束。
    分歧:
    - 表示方式：部分方法使用扩散Transformer预测未来视频，另一些使用掩码自回归令牌生成。
    - 监督信号：部分依赖任务或动作预测目标，部分使用偏好、RL或DPO对齐，还有方法通过习得掩码适配闭源模型。
    - 评测目标：工作分别评测视觉质量、策略相关性、规划改进、零样本物理合理性或空间推理，这些目标不可互换。
    - 交互模式：模型在帧级模块、并行上下文块、模态独立扩散时间步或外部学习掩码等条件注入方式上不同。
