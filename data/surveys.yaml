  related_work_outline:
  - 'Mainstream direction: World models are being applied as learned predictive simulators
    for embodied and interactive domains, led by driving scene prediction and robotics
    video/action modeling, with model-based RL and evaluation benchmarks as secondary
    currents.'
  - 'Shared research pattern: Methods learn time-varying dynamics from high-dimensional
    video or state-action streams and use the learned model for prediction, imagined
    policy training, or closed-loop control; auxiliary tasks often target consistency,
    physics, or generalization.'
  - 'Key differences: Representations range from latent state-space rollouts to pixel-level
    video diffusion; supervision varies from reinforcement returns and context to
    language, depth, keypoints, and action diffusion; evaluation settings include
    driving datasets, Atari/CARL, Minecraft, robot simulation, and memory/action benchmarks.'
  - 'Trend evolution: Within the 2023-2026 frontier, work is shifting from efficient
    latent world models for control toward large generative video/diffusion simulators
    and dedicated benchmarks for memory, spatial, and action consistency.'
  - 'Open questions: Transfer from simulation or benchmarks to real-world safety and
    task success remains underevidenced; several papers omit limitations or citation
    metadata, leaving reproducibility and failure-mode gaps.'
  related_work_outline_zh:
  - 主流方向：世界模型被用作具身与交互领域的学习式预测模拟器，以驾驶场景预测和机器人视频/动作建模为主，基于模型的强化学习和评测基准为次要方向。
  - 研究共性：方法从高维视频或状态-动作流中学习时序动力学，并将模型用于预测、想象策略训练或闭环控制；辅助任务常关注一致性、物理或泛化。
  - 关键差异：表示从潜在状态空间推演到像素级视频扩散不等；监督信号包括强化回报、上下文、语言、深度、关键点和动作扩散；评测覆盖驾驶、Atari/CARL、Minecraft、机器人仿真及记忆/动作基准。
  - 趋势演进：在2023-2026前沿期内，从高效潜在世界模型控制转向大规模生成式视频/扩散模拟器，并出现专门评估记忆、空间和动作一致性的基准。
  - 开放问题：从仿真或基准到真实安全与任务成功的迁移仍缺乏证据；部分论文缺少局限性或引用元数据，带来复现和失效模式缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative driving world models
      what_it_solves: multi-view and long-horizon driving video prediction for simulation
        and scene modeling
      what_remains_open: alignment of video prediction gains with closed-loop real-world
        driving safety and operational outcomes; limitation reporting is sparse
    - line: Latent model-based reinforcement learning world models
      what_it_solves: sample-efficient policy learning and zero-shot generalization
        via imagined trajectories in contextual or visual tasks
      what_remains_open: evidence is narrow, focused on a few control tasks, and assumes
        observable context or predefined dynamics; broader transfer remains unverified
    - line: Compositional and physics-informed robot world models
      what_it_solves: task-conditioned robot video planning and physically more plausible
        visual simulation for policy training and evaluation
      what_remains_open: simulation-to-real transfer, generalization beyond seen language
        primitives, and physical fidelity under novel objects or actions
    - line: Consistency and control benchmarking for world models
      what_it_solves: measuring spatial consistency, memory consistency, and action
        control rather than only pixel-level generation quality
      what_remains_open: whether these metrics predict downstream task success or
        real deployment robustness; some datasets are introduced without baseline
        results
    consensus:
    - World models are treated as learned predictive simulators conditioned on actions,
      instructions, or context.
    - Generative or sequence-modeling architectures are widely used to capture temporal
      dynamics from high-dimensional observations.
    - Auxiliary objectives beyond pixel reconstruction are common, such as mask reconstruction,
      depth, keypoint dynamics, action prediction, or consistency scoring, to improve
      realism and controllability.
    - Evaluation increasingly includes downstream policy learning, closed-loop control,
      or task-oriented benchmarks rather than generation quality alone.
    disagreements:
    - 'Representation differs: latent state-space models optimize policies via imagined
      rollouts, while video diffusion models generate pixel-level future frames.'
    - 'Supervision differs: methods rely on context or reinforcement returns, language
      instructions, physics-informed auxiliary tasks, or action-free video.'
    - 'Evaluation target differs: driving benchmark datasets, Atari/CARL control tasks,
      robot simulation, and open-domain memory/action consistency suites.'
    - 'Interaction mode differs: closed-loop action-conditioned rollout, open-loop
      multi-view prediction, and model-based policy optimization create different
      requirements.'
    - 'Deployment setting differs: some work remains in simulation or benchmarks,
      while others claim downstream robot policy utility without real-world transfer
      evidence.'
    open_questions:
    - Does improved driving video prediction translate to closed-loop real-world driving
      safety or operational outcomes?
    - Can contextual and compositional models generalize beyond observed contexts
      or seen language primitives without strong observability assumptions?
    - Do spatial, memory, and action consistency metrics predict downstream task success,
      and how should they be balanced with visual fidelity?
    - What minimal reproducibility and limitation evidence should application world-model
      papers report when citation metadata or code is unavailable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式驾驶世界模型
      解决的问题: 面向驾驶仿真与场景建模的多视角、长时域视频预测
      尚未覆盖: 视频预测提升与闭环真实驾驶安全及运营结果之间的一致性；局限性报告较少
    - 路线: 基于潜在模型的强化学习世界模型
      解决的问题: 通过想象轨迹进行样本高效策略学习，并在上下文中实现零样本泛化
      尚未覆盖: 证据集中在少量控制任务上，并假设上下文可观测或动力学预设；更广泛的迁移未验证
    - 路线: 组合式与物理信息驱动机器人世界模型
      解决的问题: 任务条件下的机器人视频规划，以及更物理合理的视觉仿真用于策略训练与评估
      尚未覆盖: 从仿真到真实、超出已见语言原语的新组合、以及新物体/动作下的物理保真度
    - 路线: 世界模型一致性与控制评测
      解决的问题: 衡量空间一致性、记忆一致性和动作控制，而不只关注像素级生成质量
      尚未覆盖: 这些指标能否预测下游任务表现或真实部署鲁棒性仍不清楚；部分数据集构建工作未报告基线结果
    共识:
    - 多数工作将世界模型视为受动作、指令或上下文条件控制的学习式预测模拟器。
    - 常用生成式或序列建模架构从高维观测中捕捉时序动力学。
    - 除像素重建外，常引入掩码重建、深度、关键点动力学、动作预测或一致性评分等辅助目标。
    - 评测逐渐纳入下游策略学习、闭环控制或任务导向基准，而不只看生成质量。
    分歧:
    - 表示方式不同：潜在状态空间模型通过想象推演优化策略，而视频扩散模型生成像素级未来帧。
    - 监督信号不同：方法分别依赖上下文或强化回报、语言指令、物理辅助任务或无语义动作视频。
    - 评测目标不同：分别面向驾驶基准数据集、Atari/CARL 控制任务、机器人仿真以及开放域记忆/动作一致性评测。
    - 交互模式不同：闭环动作条件推演、开环多视角预测与基于模型的策略优化对模型要求不同。
    - 部署场景不同：部分工作停留在仿真或基准，部分声称机器人策略实用但缺少真实世界迁移证据。
    开放问题:
    - 驾驶视频预测的提升能否转化为闭环真实驾驶安全或运营结果？
    - 上下文与组合式模型能否在去掉强可观测性假设后泛化到未见上下文或新语言原语？
    - 空间、记忆和动作一致性指标能否预测下游任务成功，且应如何与视觉保真度平衡？
    - 当引用元数据或代码不可得时，应用世界模型论文至少应报告哪些复现与局限性证据？
