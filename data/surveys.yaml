  related_work_outline:
  - 'Mainstream direction: Generative world models for embodied and driving scenarios,
    using diffusion or transformer architectures with auxiliary objectives that improve
    visual consistency, controllability, and physical plausibility.'
  - 'Shared research pattern: Combine visual dynamics learning with additional signals
    such as masked reconstruction, depth, keypoint dynamics, action diffusion, or
    context-conditioned latent states instead of relying only on raw video prediction.'
  - 'Key differences: Methods differ in representation level, supervision objective,
    action interface, and evaluation setting, spanning sample-efficient RL, zero-shot
    contextual control, robot video generation, and closed-loop consistency benchmarks.'
  - 'Trend evolution: Within the available 2023-2026 frontier, work moves from stochastic
    transformer world models for Atari sample efficiency toward context-aware dynamics,
    embodied video-action generation, and dedicated spatial/memory/action consistency
    benchmarks.'
  - 'Open questions: Cross-domain transfer, isolation of model contributions from
    planners or pretraining data, unified consistency metrics, handling unobserved
    dynamics factors, and minimum verification evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：面向具身智能与驾驶场景的生成式世界模型，采用扩散或Transformer架构，并通过辅助目标提升一致性、可控性与物理合理性。
  - 研究共性：在视觉动力学学习之上结合掩码重建、深度、关键点动力学、动作扩散或上下文潜在状态，而非只依赖原始视频预测。
  - 关键差异：方法在表示层级、监督目标、动作接口和评测场景上不同，覆盖样本高效强化学习、零样本上下文控制、机器人视频生成和闭环一致性基准。
  - 趋势演进：在2023-2026前沿窗口内，从Atari样本高效的随机Transformer世界模型转向上下文动力学、具身视频-动作生成以及专用空间/记忆/动作一致性评测。
  - 开放问题：跨域迁移、模型贡献与规划器或预训练数据的隔离、统一一致性指标、未观测动力学因素处理以及最低验证证据标准仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models with reconstruction and physics priors
      what_it_solves: High-fidelity long-horizon or multi-view video prediction and
        physical plausibility by adding masked reconstruction, depth prediction, or
        keypoint dynamics objectives.
      what_remains_open: Whether visual fidelity transfers beyond the reported driving
        or robot domains, and whether long-term memory and action consistency hold
        outside tested datasets.
    - line: Model-based reinforcement learning with stochastic or contextual latent
        dynamics
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        by modeling stochastic or context-conditioned latent dynamics from environment
        interactions.
      what_remains_open: Strong context observability assumptions persist, and it
        is unclear how much benefit comes from the world model rather than the planner,
        controller, or task prior.
    - line: Action-coupled and compositional video generation for robot imagination
      what_it_solves: Connecting learned visual dynamics to action control and policy
        pretraining by factorizing language primitives or coupling video and action
        diffusion in a shared model.
      what_remains_open: Generalization to new primitives or action spaces and real-robot
        deployment evidence remain incomplete; simulation-only evaluation is a verification
        gap.
    - line: Benchmarking spatial, memory, and action consistency in world models
      what_it_solves: Evaluating temporal stability, cross-view spatial coherence,
        memory consistency, and action controllability through closed-loop datasets
        and consistency metrics.
      what_remains_open: Reported baseline results and unified evaluation evidence
        are limited; it remains unclear whether benchmarks isolate method capability
        from scene or dataset biases.
    consensus:
    - World-model research now centers on learned generative dynamics, with diffusion
      or transformer-based sequence models common across visual prediction, policy
      learning, and benchmarking.
    - Several works add auxiliary objectives beyond raw video prediction, including
      mask reconstruction, depth, keypoint dynamics, language-primitive factorization,
      or video-action diffusion coupling.
    - Evaluation is expanding from single-task visual quality toward closed-loop and
      context-dependent measures such as spatial consistency, memory consistency,
      and action control.
    - 'Methodology and reproducibility evidence vary: multiple works report dataset,
      benchmark, or open-source signals, but limitation and baseline details are often
      incomplete.'
    disagreements:
    - 'Representation differs: some methods use low-dimensional stochastic or variational
      latent rollouts, while others operate in high-dimensional RGB or token-based
      video space.'
    - 'Supervision and objective design differ: options include mask reconstruction,
      physics-informed depth and keypoint losses, language-primitive factorization,
      and video-action diffusion pretraining.'
    - 'Action interface differs: policies may be trained in imagined latent rollouts,
      generated as video plans from language, or coupled through modality-specific
      diffusion timesteps.'
    - Evaluation settings differ across Atari-style sample efficiency, CARL-style
      contextual control, driving datasets, robot simulation, and open-domain video
      benchmarks, limiting direct comparison.
    open_questions:
    - How well do reconstruction, physics-informed, and action-coupled objectives
      transfer beyond the reported driving, robot, or benchmark scenes?
    - Which part of reported improvements comes from the world-model dynamics, the
      planner or controller, the pretraining data, or task-specific context?
    - What unified metrics can separate memory consistency, action controllability,
      and physical plausibility from pixel-level fidelity?
    - How can context-conditioned world models handle unobserved or changing dynamics
      factors rather than only simplified contextual control settings?
    - What minimum evidence is needed to judge generalization and reproducibility
      when code, baselines, or limitation details are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带重建与物理先验的生成式视频世界模型
      解决的问题: 通过掩码重建、深度预测或关键点动力学等辅助目标，提升驾驶和机器人数据中的长时域/多视角视频预测与物理合理性。
      尚未覆盖: 视觉保真度能否迁移到已报道领域之外，以及长期记忆和动作一致性是否在测试数据外仍成立，尚不明确。
    - 路线: 基于随机或上下文潜在动力学的模型强化学习
      解决的问题: 通过建模随机或上下文条件化的潜在动力学，实现样本高效策略学习和零样本泛化。
      尚未覆盖: 上下文可观测假设较强，且收益有多少来自世界模型、规划器、控制器或任务先验仍缺乏隔离证据。
    - 路线: 动作耦合与组合式视频生成用于机器人想象
      解决的问题: 通过语言原语分解或视频与动作扩散耦合，将学习到的视觉动力学连接到动作控制与策略预训练。
      尚未覆盖: 对全新原语或动作空间的泛化和真实机器人部署证据不足，仿真评测构成验证缺口。
    - 路线: 世界模型空间、记忆与动作一致性基准
      解决的问题: 通过闭环数据集和一致性指标，评测时间稳定性、跨视角空间一致性、记忆一致性和动作可控性。
      尚未覆盖: 基线结果和统一评测证据有限，基准是否隔离方法能力与场景或数据集偏差仍待验证。
    共识:
    - 当前世界模型研究集中于学习式生成动力学，扩散和Transformer序列建模在视觉预测、策略学习和基准测评中广泛使用。
    - 多个工作尝试在原始视频预测之外加入辅助目标，包括掩码重建、深度、关键点动力学、语言原语分解或视频与动作扩散耦合。
    - 评测正从单一视觉质量扩展到闭环和上下文相关的空间一致性、记忆一致性与动作控制。
    - 方法学与复现证据不一：部分工作报告了数据集、基准或开源信号，但局限性和基线细节常不完整。
    分歧:
    - 表示层级不同：有的使用低维随机或变分潜在想象轨迹，有的直接在高维RGB或token视频空间运行。
    - 监督与目标不同：掩码重建、物理信息深度/关键点损失、语言原语分解和视频-动作扩散预训练并存。
    - 动作接口不同：策略可在潜在想象轨迹中训练，可由语言生成视频计划，也可通过模态特定扩散时间步耦合。
    - 评测场景不同：Atari式样本效率、CARL式上下文控制、驾驶数据集、机器人仿真和开放域视频基准使数值难以直接比较。
    开放问题:
    - 重建、物理信息和动作耦合目标在已报道的驾驶、机器人或基准场景之外的迁移能力如何？
    - 如何隔离世界模型动力学、规划器或控制器、预训练数据和任务特定上下文对性能的贡献？
    - 什么统一指标能区分记忆一致性、动作可控性和物理合理性，而不被像素保真度主导？
    - 上下文条件世界模型如何应对未观测或变化的动力学因素，而不只限于简化上下文控制设置？
    - 在代码、基线或局限性缺失时，判断泛化与复现性的最低证据标准是什么？
