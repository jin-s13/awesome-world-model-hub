  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models built from
    transformers or diffusion, combining video prediction with auxiliary tasks like
    mask reconstruction, depth/keypoint prediction, and action diffusion.'
  - 'Shared research pattern: Methods train a dynamics or generation scaffold with
    self-supervised or multimodal objectives, then evaluate through downstream policy
    learning, long-horizon rollout, or consistency and control benchmarks.'
  - 'Key differences: They differ in representations such as latent RSSM, transformer
    VAE, or DiT; supervision such as action-free video, action-conditioned video,
    context, or physics tasks; and evaluation settings such as driving, Atari, robot,
    or Minecraft.'
  - 'Trend evolution: Work moves from efficient RL world models around 2023 toward
    contextual, compositional, and physics-informed robot/driving models in 2024-2025,
    then toward explicit memory/spatial consistency and action-control benchmarks
    by 2025-2026.'
  - 'Open questions: Include isolating auxiliary-objective contributions, extending
    context generalization beyond observed values, improving cross-embodiment transfer,
    standardizing memory/spatial/action consistency metrics, and filling limitation/ablation
    gaps in strong-performing methods.'
  related_work_outline_zh:
  - 主流方向：近期工作以Transformer或扩散为基础构建生成式世界模型，结合视频预测与掩码重建、深度/关键点预测、动作扩散等辅助任务。
  - 研究共性：方法训练一个动力学或生成骨架，采用自监督或多模态目标，并通过下游策略学习、长时域扩展或一致性/控制基准进行评估。
  - 关键差异：表示上存在潜在RSSM、Transformer VAE、DiT等选择；监督上包括无动作视频、动作条件视频、上下文条件或物理任务；评测环境覆盖驾驶、Atari、机器人和Minecraft。
  - 趋势演进：从2023年前后的样本高效强化学习世界模型，发展到2024-2025年的上下文、组合式和物理信息机器人/驾驶模型，再到2025-2026年显式的记忆/空间一致性与动作控制基准。
  - 开放问题：需隔离辅助目标的独立贡献、将上下文泛化扩展到观测值之外、验证跨具身迁移、统一记忆/空间/动作一致性指标，并补充强性能方法的局限性与消融缺口。
  literature_review:
    line_of_work_matrix:
    - line: Masked diffusion driving world models
      what_it_solves: Long-horizon and multi-view driving video prediction by combining
        diffusion transformers with MAE-style mask reconstruction.
      what_remains_open: Evidence is concentrated in driving datasets; cross-domain,
        cross-embodiment, and uncertainty calibration boundaries remain unverified.
    - line: Memory and spatial consistency benchmarks for world models
      what_it_solves: Provides evaluation protocols for spatial consistency, memory
        consistency, and action control beyond pixel-level generation quality.
      what_remains_open: Benchmarks are recent and lack broad baseline evidence across
        many model classes; translation to downstream deployment remains uncertain.
    - line: Context-conditioned latent dynamics models
      what_it_solves: Adds observable context to Dreamer-style world models to improve
        zero-shot generalization under contextual reinforcement learning.
      what_remains_open: Assumes observable context and is evaluated on only two CARL
        tasks; unknown-context settings are not covered.
    - line: Efficient stochastic transformer world models
      what_it_solves: Combines transformer sequence modeling with variational autoencoding
        for sample-efficient policy learning on Atari 100k.
      what_remains_open: Evidence is mostly limited to Atari 100k; broader control,
        real-world, and long-horizon boundaries are not established.
    - line: Compositional language-conditioned video world models
      what_it_solves: Factorizes language instructions into primitives and composes
        generation models to synthesize plans for unseen object/action combinations.
      what_remains_open: Generalization is limited to recombinations of seen primitives,
        depends on parsing, and is evaluated mainly in simulation.
    - line: Physics-informed embodied video generation
      what_it_solves: Adds temporal depth and keypoint dynamics tasks to improve visual
        fidelity and physical plausibility for robot video generation.
      what_remains_open: Visible limitations are absent, dataset and baseline details
        are incomplete, and cross-scenario physical generalization is not fully evidenced.
    - line: Unified video-action diffusion pretraining
      what_it_solves: Couples video and action diffusion in one transformer to flexibly
        represent policy, dynamics, inverse dynamics, and video generation.
      what_remains_open: Visible methodology and ablation evidence is limited; the
        specific contribution of each modality-timestep configuration remains to be
        isolated.
    consensus:
    - Generative sequence or video models are common backbones for world modeling,
      usually using transformer or diffusion architectures.
    - Auxiliary training tasks align generation with structure, such as mask reconstruction,
      context conditioning, physics side tasks, or action prediction.
    - Evaluation increasingly includes closed-loop or consistency-oriented signals
      beyond pixel quality, including memory consistency and action control.
    - Downstream policy training or robot execution is treated as evidence of practical
      utility, but evaluations are often restricted to narrow task suites.
    disagreements:
    - Representation choice ranges from latent recurrent state-space models to transformer/diffusion
      video models.
    - Supervision signal differs across context-conditioned latent dynamics, action-free
      video, action-conditioned video, physics-informed depth/keypoint tasks, and
      multimodal language goals.
    - Evaluation target differs across sample-efficient Atari RL, driving video prediction,
      robot manipulation, and open-domain Minecraft navigation.
    - Interaction mode differs among imagined policy learning, video-plan synthesis,
      and unified video-action diffusion with controllable timesteps.
    - Deployment assumptions differ among real driving stacks, simulated robot execution,
      and open-ended visual environments; context observability and primitive parsing
      are not standardized.
    open_questions:
    - Do auxiliary objectives contribute independently after controlling for architecture
      and data scale?
    - Can context-conditioned world models generalize beyond observable context and
      beyond the two CARL tasks tested?
    - Do improvements in memory and spatial consistency translate into better downstream
      control under deployment conditions?
    - Which evaluation protocols can separate model dynamics gains from planner, controller,
      or task-prior effects?
    - Can compositional world models handle genuinely novel primitives rather than
      only recombinations of seen primitives?
    - What limitations and ablation gaps remain for methods with strong benchmark
      results but missing limitation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码扩散驾驶世界模型（如MaskGWM）
      解决的问题: 通过扩散Transformer与MAE式掩码重建生成长时域、多视角驾驶视频预测。
      尚未覆盖: 证据集中在驾驶数据集；跨领域、跨具身和不确定性校准边界尚未验证。
    - 路线: 世界模型的记忆与空间一致性基准（如LoopNav、MIND）
      解决的问题: 提供超越像素生成质量的空间一致性、记忆一致性和动作控制评测协议。
      尚未覆盖: 基准较新，缺少多类模型的广泛基线证据；对下游部署的长期转化仍不明确。
    - 路线: 上下文条件潜在动力学模型（如cRSSM）
      解决的问题: 在Dreamer式世界模型中引入可观测上下文，提升上下文强化学习中的零样本泛化。
      尚未覆盖: 假定上下文可观测且仅在CARL两个任务上验证，未知上下文场景未覆盖。
    - 路线: 高效随机Transformer世界模型（如STORM）
      解决的问题: 将Transformer序列建模与变分自编码结合，在Atari 100k上实现样本高效策略学习。
      尚未覆盖: 证据主要限于Atari 100k，更广泛控制、真实环境和长时域边界尚未建立。
    - 路线: 组合式语言条件视频世界模型（如RoboDreamer）
      解决的问题: 将语言指令分解为原语并组合生成模型，为未见物体/动作组合合成视频计划。
      尚未覆盖: 泛化仅限于已见原语的重组，依赖解析，且主要在仿真中评估。
    - 路线: 物理信息具身视频生成（如RoboScape）
      解决的问题: 增加时间深度和关键点动力学任务，提升机器人视频生成的真实感和物理合理性。
      尚未覆盖: 可见局限性缺失，数据集和基线细节不完整，跨场景物理泛化证据有限。
    - 路线: 统一视频-动作扩散预训练（如UWM）
      解决的问题: 在单一Transformer中耦合视频与动作扩散，灵活表示策略、动力学、逆动力学和视频生成。
      尚未覆盖: 可见方法学与消融证据有限；每种模态时间步配置的独立贡献尚未隔离。
    共识:
    - 生成式序列或视频模型成为世界建模常用骨干，多采用Transformer或扩散架构。
    - 辅助训练任务用于强加结构，例如掩码重建、上下文条件、物理侧任务或动作预测。
    - 评测从像素质量扩展到闭环一致性、记忆一致性和动作控制等能力。
    - 下游策略训练或机器人执行被视为实用价值证据，但常在窄任务上验证。
    分歧:
    - 表示选择从潜在递归状态空间模型到Transformer/扩散视频模型不等。
    - 监督信号在上下文潜在动力学、无动作视频、动作条件视频、深度/关键点物理任务和多模态语言目标之间存在差异。
    - 评测目标在样本高效Atari强化学习、驾驶视频预测、机器人操作和开放域Minecraft导航之间不同。
    - 交互方式在想象策略学习、视频计划合成和统一视频-动作扩散之间不同。
    - 部署假设在真实驾驶、仿真机器人和开放场景之间不同；上下文可观测性与原语解析尚未统一。
    开放问题:
    - 在控制架构和数据规模后，辅助目标是否仍独立贡献？
    - 上下文条件世界模型能否超越可观测上下文和CARL两个任务的验证范围？
    - 记忆与空间一致性提升能否在部署条件下转化为了下游控制改进？
    - 哪类评测协议能区分模型动力学收益与规划器、控制器或任务先验的收益？
    - 组合世界模型能否处理真正全新的原语，而不仅是已见原语的重组？
    - 对于结果显著但限制证据缺失的方法，仍有哪些局限和消融缺口？
