  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving, robotics, and
    interactive control, with growing emphasis on evaluation benchmarks for memory
    and action consistency.'
  - 'Shared research pattern: Learn action- or context-conditioned predictive models
    via self-supervised generation and use them for policy learning, planning, or
    evaluation; recent work adds consistency and physical-plausibility checks.'
  - 'Key differences: Representation varies from compact latent state-space models
    to pixel-space video diffusion and compositional primitive models; training signals
    and evaluation settings differ across driving, robot manipulation, games, and
    navigation benchmarks.'
  - 'Trend evolution: Within the available 2023-2026 frontier, the field moves from
    sample-efficient model-based RL toward large video/diffusion world models and
    then toward standardized consistency, memory, and action-control benchmarks.'
  - 'Open questions: Whether benchmark gains transfer to real safety and deployment,
    how to achieve long-horizon consistency across unseen contexts and action spaces,
    and which auxiliary losses best bind physics, geometry, and action.'
  related_work_outline_zh:
  - 主流方向：面向自动驾驶、机器人和交互控制等领域的世界模型，并逐步重视记忆与动作一致性的评测基准。
  - 研究共性：通过自监督生成学习以动作或上下文为条件的预测模型，用于策略学习、规划或评估；近期工作增加一致性与物理合理性检验。
  - 关键差异：表示方式涵盖紧凑潜在状态空间、像素级视频扩散和组合原语模型；训练信号与评测设定在驾驶、机器人、游戏和导航基准之间存在差异。
  - 趋势演进：在可见的2023-2026前沿内，研究从样本高效的模型强化学习，走向大规模视频/扩散世界模型，再转向一致性、记忆和动作控制基准。
  - 开放问题：基准提升能否迁移到真实安全与部署场景；如何在未见上下文和动作空间中实现长时域一致性；哪些辅助损失能更好地绑定物理、几何与动作。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific video world models for driving and robotics
      what_it_solves: Generate action- or scene-conditioned future frames for planning,
        policy learning, and simulation in driving and manipulation.
      what_remains_open: Cross-dataset and cross-embodiment transfer, long-horizon
        stability, and connection to real-world safety or operational outcomes.
    - line: Model-based reinforcement learning with compact world models
      what_it_solves: Sample-efficient policy learning by training agents on imagined
        rollouts from learned latent dynamics.
      what_remains_open: Generalization beyond limited evaluation tasks, observability
        of context variables, and scalability to complex real-world dynamics.
    - line: Compositional and contextual world models for zero-shot generalization
      what_it_solves: Zero-shot or compositional adaptation to unseen task instructions,
        goals, or dynamics by conditioning on language or context.
      what_remains_open: Generalization to entirely novel primitives or contexts,
        reliance on parsing or observable context, and evaluation breadth beyond simulation.
    - line: Physics- and geometry-informed embodied world models
      what_it_solves: Improve visual fidelity and physical plausibility of generated
        robot/scene video via depth, keypoint, or other auxiliary tasks.
      what_remains_open: Whether improved pixel-level physics plausibility translates
        to better real robot execution or policy evaluation.
    - line: Benchmarks for memory, spatial consistency, and action control
      what_it_solves: Systematically evaluate closed-loop world models on long-term
        memory, spatial coherence, and action-following ability.
      what_remains_open: Some benchmarks report limited or no experimental baselines;
        scene and action space coverage remains small, and links to deployment outcomes
        are unverified.
    consensus:
    - World models are increasingly trained with self-supervised generative objectives
      and used for downstream control or evaluation rather than only for reconstruction.
    - Action, context, language, or task conditioning is a central design choice for
      making predictive models useful in embodied, driving, and interactive settings.
    - Recent evaluation interest has shifted toward consistency, long-term memory,
      action control, and zero-shot generalization, beyond short-horizon pixel quality.
    - Transformer and diffusion architectures dominate recent methods, often combined
      with auxiliary losses or modality-specific diffusion timesteps.
    disagreements:
    - 'Representation choices differ: compact recurrent latent state-space models
      versus pixel-space video diffusion versus compositional primitive-based generation.'
    - 'Training signals differ: mask reconstruction, temporal depth and keypoint dynamics,
      coupled video-action diffusion, contextual conditioning, or language-primitive
      factorization.'
    - 'Evaluation targets differ: game score efficiency, driving multi-view rollout,
      robot task execution, contextual zero-shot reward, or memory and action consistency
      benchmarks.'
    - 'Interaction and deployment settings differ: open-loop video prediction, closed-loop
      action-conditioned rollouts, joint policy-dynamics learning, simulated evaluation,
      and offline real-world-like datasets.'
    - Some works assume observable context or a fixed primitive vocabulary, while
      others aim for learning without such constraints.
    open_questions:
    - Do consistency, visual fidelity, or benchmark gains in simulated or offline
      settings predict real-world driving and robot reliability under distribution
      shift?
    - Which auxiliary training signals best reduce compounding errors and preserve
      memory over long horizons in closed-loop generative world models?
    - How can compositional or contextual world models extend to truly novel primitives,
      contexts, or action spaces outside training distributions?
    - What evidence is missing to connect physics-informed or video-diffusion improvements
      to safer policy deployment and real operational outcomes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向驾驶与机器人的领域特定视频世界模型
      解决的问题: 生成以动作或场景为条件的未来视频，用于驾驶和操作中的规划、策略学习与仿真。
      尚未覆盖: 跨数据集与跨本体的迁移、长时域稳定性，以及与现实安全或运营结果的关系。
    - 路线: 基于模型强化学习的紧凑世界模型
      解决的问题: 通过在学到的潜在动力学想象轨迹上训练智能体，实现样本高效的策略学习。
      尚未覆盖: 在有限评测任务之外的泛化、上下文变量的可观测性，以及向复杂真实动力学的扩展。
    - 路线: 面向零样本泛化的组合与上下文世界模型
      解决的问题: 通过语言或上下文条件化，对未见任务指令、目标或动力学进行零样本或组合适应。
      尚未覆盖: 对全新原语或上下文的泛化、对解析或可观测上下文的依赖，以及仿真之外的评测覆盖。
    - 路线: 物理与几何信息驱动的具身世界模型
      解决的问题: 通过深度、关键点或其他辅助任务，提升生成机器人/场景视频的视觉保真度和物理合理性。
      尚未覆盖: 像素级物理合理性的提升是否能转化为更好的真实机器人执行或策略评估尚不明确。
    - 路线: 面向记忆、空间一致性与动作控制的基准
      解决的问题: 系统评估闭环世界模型在长期记忆、空间连贯性和动作跟随能力方面的表现。
      尚未覆盖: 部分基准缺乏实验基线或覆盖范围小；场景与动作空间有限，尚无法验证与部署结果的关系。
    共识:
    - 世界模型越来越多地以自监督生成目标训练，并用于下游控制或评估，而不仅用于重建。
    - 动作、上下文、语言或任务条件的引入，是使预测模型在具身、驾驶和交互场景中有用的核心设计。
    - 近期评测重点转向一致性、长期记忆、动作控制和零样本泛化，而不只是短时域像素质量。
    - Transformer与扩散架构主导近期工作，常与辅助损失或模态特定扩散时间步结合。
    分歧:
    - 表示方式不同：紧凑循环潜在状态空间模型、像素级视频扩散，以及组合原语生成。
    - 训练信号不同：掩码重建、时间深度与关键点动力学、视频-动作耦合扩散、上下文条件化或语言原语分解。
    - 评测目标不同：游戏得分与训练效率、驾驶多视角展开、机器人任务执行、上下文零样本奖励，或记忆与动作一致性基准。
    - 交互与部署场景不同：开环视频预测、闭环动作条件展开、策略-动力学联合学习、仿真评测与离线真实风格数据集。
    - 部分研究假设上下文可观测或固定原语词汇，而另一些研究试图在没有此类约束下学习。
    开放问题:
    - 仿真或离线设置中的一致性、视觉保真度或基准提升，能否预测真实驾驶和机器人在分布偏移下的可靠性？
    - 哪些辅助训练信号最有助于减少闭环生成世界模型中的累积误差并维持长时域记忆？
    - 组合或上下文世界模型如何扩展到训练分布之外的全新原语、上下文或动作空间？
    - 尚缺哪些证据来连接物理信息或视频扩散改进与更安全的策略部署及真实运营结果？
