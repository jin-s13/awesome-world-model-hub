  related_work_outline:
  - 'Mainstream direction: Generative and diffusion-based world models with structured
    auxiliary tasks dominate video prediction, embodied control, and driving; targeted
    consistency benchmarks are emerging.'
  - 'Shared research pattern: Learned dynamics are coupled with policy or action interfaces
    and trained with auxiliary self-supervised objectives such as mask reconstruction,
    depth/keypoint prediction, context conditioning, and action-video diffusion.'
  - 'Key differences: Representations range from stochastic recurrent state-space
    models to diffusion Transformers and compositional video generators; supervision,
    evaluation targets, and interaction modes differ across driving, robotic, and
    game-like settings.'
  - 'Trend evolution: The evidence moves from sample-efficient stochastic world models
    around 2023 toward diffusion-based embodied models and large robotic pretraining
    in 2024-2025, with benchmark-focused consistency evaluations appearing by 2025-2026.'
  - 'Open questions: Which auxiliary objectives transfer across domains, whether consistency
    metrics predict control quality, and how much gain comes from the model rather
    than the planner or evaluation setup remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以生成式、扩散式世界模型为主，并加入结构化辅助任务，用于视频预测、具身控制和驾驶；针对一致性的基准正在出现。
  - 研究共性：学习到的动力学与策略或动作接口耦合，并通过掩码重建、深度/关键点预测、上下文条件、动作-视频扩散等辅助自监督目标训练。
  - 关键差异：表示方式涵盖随机循环状态空间、扩散 Transformer 和组合视频生成；监督信号、评测目标和交互模式在驾驶、机器人和游戏类场景中存在差异。
  - 趋势演进：证据显示从 2023 年左右的样本高效随机世界模型，发展到 2024-2025 年的扩散式具身模型和大规模机器人预训练，2025-2026 年出现基准导向的一致性评估。
  - 开放问题：哪些辅助目标能跨领域迁移，一致性指标能否预测控制质量，以及提升中有多少来自模型本身而非规划器或评测设置，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model assumptions into concrete representations,
        losses, and training recipes, including stochastic recurrent state-space models,
        diffusion Transformers, and compositional video generators.
      what_remains_open: Which representation and auxiliary objective transfer beyond
        the reported dataset, and whether gains come from the representation or from
        the added training signal.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to policies, action-conditioned video,
        and decision-time interfaces through imagination-based reinforcement learning
        or unified action-video diffusion.
      what_remains_open: Whether reported policy or control gains are attributable
        to the dynamics model rather than to the planner, task prior, or action-conditioning
        scheme.
    - line: Method evidence and benchmarking protocols
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects by introducing targeted benchmarks for spatial
        consistency, memory consistency, and action control.
      what_remains_open: Whether current benchmark metrics isolate long-horizon consistency
        and physical plausibility sufficiently to predict real-world or cross-domain
        performance.
    consensus:
    - Learned world models are increasingly trained with auxiliary self-supervised
      objectives beyond next-frame prediction, including mask reconstruction, depth
      or keypoint prediction, context conditioning, and action diffusion.
    - Evaluation is shifting toward generalization and consistency rather than only
      short-horizon visual fidelity.
    - Model-based policy learning and video generation are being coupled in unified
      architectures.
    - Targeted benchmarks are emerging to measure memory consistency, spatial consistency,
      and action control under closed-loop or loop-based evaluation.
    disagreements:
    - Stochastic recurrent state-space representations differ from diffusion Transformer
      and compositional video-generation representations.
    - 'Supervision signals differ substantially: observed context values, language-parsed
      primitives, action-free video, physics proxy tasks, and mask reconstruction
      coexist.'
    - Evaluation targets range from sample-efficient game reinforcement learning and
      zero-shot dynamics generalization to driving video prediction, robot policy
      execution, and embodied video consistency.
    - Interaction modes differ across imagination-based policy training, action-conditioned
      video generation, and closed-loop benchmark control.
    open_questions:
    - Which auxiliary objectives are necessary for long-horizon spatial and memory
      consistency across domains?
    - Does improved benchmark consistency or video fidelity translate into better
      downstream planning and control?
    - How much of reported improvement comes from the model, the action interface,
      or the evaluation setup?
    - Can current physics-informed and context-aware world models handle entirely
      unseen dynamics or primitives beyond observed combinations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型假设落实为具体表示、损失函数和训练配方，包括随机循环状态空间模型、扩散 Transformer 和组合视频生成器。
      尚未覆盖: 哪些表示和辅助目标能迁移到报告数据集之外，以及收益来自表示本身还是额外训练信号。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到策略、动作条件视频和决策时接口，包括基于想象的强化学习或统一动作-视频扩散。
      尚未覆盖: 所报告的策略或控制收益是否归因于动力学模型，而非规划器、任务先验或动作条件机制。
    - 路线: 方法证据与基准协议
      解决的问题: 通过引入针对空间一致性、记忆一致性和动作控制的基准，区分方法贡献与数据集、基线、指标和实现因素的影响。
      尚未覆盖: 当前基准指标是否足以隔离长时域一致性和物理合理性，并预测真实世界或跨领域表现。
    共识:
    - 世界模型训练正从单纯的下一帧预测转向加入掩码重建、深度或关键点预测、上下文条件和动作扩散等辅助自监督目标。
    - 评估越来越重视泛化性和一致性，而不仅是短时视觉保真度。
    - 基于模型的策略学习与视频生成正在统一架构中耦合。
    - 正在出现衡量记忆一致性、空间一致性和动作控制的针对性基准。
    分歧:
    - 随机循环状态空间表示与扩散 Transformer、组合视频生成表示存在明显差异。
    - 监督信号差异明显：可观测上下文、语言解析原语、无动作视频、物理代理任务和掩码重建并存。
    - 评测目标涵盖样本高效游戏强化学习、零样本动力学泛化、驾驶视频预测、机器人策略执行和具身视频一致性。
    - 交互模式从基于想象的策略训练到动作条件视频生成和闭环基准控制不等。
    开放问题:
    - 哪些辅助目标对跨领域长时域空间和记忆一致性是必需的？
    - 基准一致性或视频保真度的提升能否转化为下游规划与控制收益？
    - 报告提升中有多少来自模型、动作接口或评测设置？
    - 当前物理信息和上下文感知模型能否处理完全未见动力学或超出已见组合的原语？
