    - 路线: 缩放规律与保证
      解决的问题: 将模型规模、数据规模与测试时验证器缩放连接到视频保真度、策略评估相关性和空间推理提升。
      尚未覆盖: 缩放收益具有基准特异性且未被形式化；缺少预测分布外迁移或一致测试时缩放的规律或保证，例如验证器在一个基准奏效而在另一个基准不奏效。
    - 路线: 概念分类与边界
      解决的问题: 将评测划分为视觉质量、物理合理性、奖励对齐以及功能或零样本基准，而不将其混为一谈。
