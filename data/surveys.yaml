  related_work_outline:
  - 'Mainstream direction: World models are shifting from purely visual dynamics predictors
    toward unified architectures that jointly generate videos and actions, often using
    diffusion transformers and large-scale pretraining on robotic or driving data.'
  - 'Shared research pattern: Most works learn a generative model of observations
    and optionally actions, then use it for planning, policy learning, or evaluation
    via imagined rollouts, with growing interest in physical consistency and compositional
    generalization.'
  - 'Key differences: Some methods focus on pixel-space video generation while others
    learn latent dynamics for policy training; action-conditional generation ranges
    from explicit action embeddings to unified diffusion over video and action tokens;
    evaluation diverges between visual fidelity metrics, task performance, and consistency
    benchmarks.'
  - 'Trend evolution: Early work (2023) emphasized efficient transformer-based world
    models for RL, while 2024–2025 added contextual conditioning, compositional language
    grounding, and physics-informed losses. 2025–2026 saw the emergence of dedicated
    benchmarks for spatial, memory, and action-control consistency.'
  - 'Open questions: How to certify physical plausibility and long-term memory consistency
    in generated rollouts; whether the gains come from the world model or the downstream
    planner; how to build evaluation protocols that separate model capability from
    dataset and task priors.'
  related_work_outline_zh:
  - 主流方向：世界模型正从纯视觉动力学预测转向统一架构，联合生成视频与动作，通常采用扩散Transformer并在机器人或驾驶数据上大规模预训练。
  - 研究共性：多数工作学习观测（及动作）的生成模型，然后通过想象轨迹进行规划、策略学习或评估，且越来越关注物理一致性和组合泛化。
  - 关键差异：部分方法聚焦像素空间视频生成，另一些则为策略训练学习潜在动力学；动作条件化覆盖显式动作嵌入到视频与动作令牌的统一扩散；评估指标在视觉保真度、任务性能和一致性基准之间分化。
  - 趋势演进：早期工作（2023）强调高效Transformer世界模型用于RL，2024–2025增加了上下文条件化、组合语言落地和物理信息损失，2025–2026出现了专门用于空间、记忆和动作控制一致性的基准。
  - 开放问题：如何验证生成轨迹中的物理合理性和长期记忆一致性；收益来自世界模型还是下游规划器；如何建立分离模型能力与数据集及任务先验的评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Visual generative world models for video prediction
      what_it_solves: Learning environment dynamics by predicting future frames from
        action and observation history, enabling long-horizon and multi-view video
        generation for downstream tasks like driving and robotics.
      what_remains_open: Whether generated videos maintain physical plausibility and
        long-term memory consistency beyond the training distribution; lack of standardized
        metrics for physical realism and compositional generalization across object-action
        combinations.
    - line: Latent dynamics models for policy learning and control
      what_it_solves: Learning compact latent state representations and transition
        models that allow efficient policy training with imagined rollouts, often
        achieving strong performance on RL benchmarks with limited environment interactions.
      what_remains_open: Contribution of the world model architectural choices versus
        the policy optimization algorithm and task priors; generalization to unseen
        dynamics when context is not fully observable; limited evaluation on a few
        selected tasks.
    - line: Benchmarks for evaluating world model consistency and controllability
      what_it_solves: Providing datasets and metrics to measure spatial consistency,
        memory consistency, and action-following capability in open-domain settings,
        highlighting failure modes of current models.
      what_remains_open: Benchmarks cover only limited scenarios (Minecraft navigation,
        generic videos); no unified consensus on which evaluation dimensions are sufficient;
        the gap between benchmark performance and real-world task utility remains
        unquantified.
    consensus:
    - World models are moving toward unified architectures that couple visual generation
      with action conditioning, often using diffusion or transformer-based backbones.
    - Including physical or structural constraints (e.g., depth, keypoints, mask reconstruction)
      improves the realism and consistency of generated trajectories.
    - Dedicated evaluation protocols are needed because standard visual quality metrics
      do not capture long-term memory, spatial consistency, or action controllability.
    disagreements:
    - Some works learn a compact latent world model for policy training, while others
      operate directly in pixel space with video generation; the trade-off between
      sample efficiency and visual fidelity varies across applications.
    - Action conditioning ranges from separate action embeddings fed into a dynamics
      model to unified diffusion over video and action tokens; the choice impacts
      flexibility and what can be learned from action-free video data.
    - 'Evaluation settings differ substantially: RL game performance, robotic policy
      success, video prediction metrics, and custom consistency scores each capture
      different aspects of world model quality, making cross-method comparison difficult.'
    open_questions:
    - How can we certify that a world model roll-out is physically plausible, especially
      when the model must extrapolate to unseen dynamics or long horizons?
    - What is the minimal set of evaluation dimensions (e.g., memory, spatial consistency,
      action control) that predicts real-world downstream task utility?
    - Can the gains from context-aware or physics-informed world models be attributed
      to the model itself, or are they largely due to better inductive biases and
      task-specific tuning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视觉生成式世界模型用于视频预测
      解决的问题: 从动作和观测历史中预测未来帧来学习环境动力学，支持长时域和多视角视频生成，用于驾驶和机器人等下游任务。
      尚未覆盖: 生成的视频在训练分布之外是否保持物理合理性和长期记忆一致性；缺乏衡量物理真实感和跨物体-动作组合泛化的标准化指标。
    - 路线: 潜在动力学模型用于策略学习与控制
      解决的问题: 学习紧凑的潜在状态表示和转移模型，通过想象轨迹高效训练策略，在有限环境交互下在RL基准上取得强表现。
      尚未覆盖: 世界模型架构选择相对于策略优化算法和任务先验的贡献；上下文不可完全观测时向未见动力学的泛化；评估仅限于少数任务。
    - 路线: 评估世界模型一致性与可控性的基准
      解决的问题: 提供数据集和指标来衡量开放域场景中的空间一致性、记忆一致性和动作跟随能力，揭示当前模型的失败模式。
      尚未覆盖: 基准仅覆盖有限场景（Minecraft导航、通用视频）；未有统一的评估维度共识；基准性能与真实世界任务效用之间的差距尚未量化。
    共识:
    - 世界模型正朝着统一架构发展，将视觉生成与动作条件化结合，常采用扩散或Transformer骨干。
    - 引入物理或结构约束（如深度、关键点、掩码重建）能够提升生成轨迹的真实感和一致性。
    - 需要专门的评估协议，因为标准视觉质量指标无法捕捉长期记忆、空间一致性和动作可控性。
    分歧:
    - 部分工作学习紧凑的潜在世界模型用于策略训练，而其他工作直接在像素空间进行视频生成；样本效率与视觉保真度之间的权衡在不同应用中表现各异。
    - 动作条件化方式从独立的动作嵌入到视频与动作令牌的统一扩散各不相同；该选择影响模型灵活性以及从无动作视频数据中学习的能力。
    - 评估设置差异显著：RL游戏表现、机器人策略成功率、视频预测指标和自定义一致性分数各自捕捉世界模型质量的不同方面，导致跨方法比较困难。
    开放问题:
    - 如何证明世界模型生成的轨迹在物理上合理，尤其是在模型需要外推到未见动力学或长时域时？
    - 预测真实世界下游任务效用的最小评估维度集合（如记忆、空间一致性、动作控制）是什么？
    - 上下文感知或物理信息世界模型的收益是源于模型本身，还是主要归因于更好的归纳偏置和任务特定调参？
