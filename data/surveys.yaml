  related_work_outline:
  - 'Mainstream direction: World-model evaluation is consolidating around shared interaction
    benchmarks and generative video/action tasks, especially for visual control, driving,
    and robotics.'
  - 'Shared research pattern: Papers pair datasets with targeted metrics to probe
    spatial consistency, memory consistency, action control, zero-shot generalization,
    and physical plausibility instead of relying only on aggregate visual scores.'
  - 'Key differences: Evaluation targets range from Atari/CARL model-based policy
    scores to open-domain Minecraft, driving, and robotic video generation, with different
    supervision signals such as observable context, action-free video, paired actions,
    depth, and keypoints.'
  - 'Trend evolution: The evidence from 2023–2026 shifts from efficient transformer/VAE
    world-model benchmarks toward diffusion-based world models and dedicated open-domain
    benchmark suites; earlier years are not strongly represented in the packet.'
  - 'Open questions: Whether consistency and fidelity metrics align with downstream
    decision utility, whether benchmark distributions cover true deployment settings,
    and whether conclusions remain stable under varied implementations and compute
    budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正围绕共享交互基准和生成式视频/动作任务整合，重点覆盖视觉控制、驾驶和机器人场景。
  - 研究共性：论文将数据集与针对性指标结合，用于探测空间一致性、记忆一致性、动作控制、零样本泛化和物理合理性，而不仅依赖整体视觉分数。
  - 关键差异：评测目标从Atari/CARL的基于模型策略得分，到开放域Minecraft、驾驶和机器人视频生成不等；监督信号也涉及可观测上下文、无动作视频、配对动作、深度和关键点。
  - 趋势演进：证据集中在2023—2026年，从高效Transformer/VAE世界模型基准转向基于扩散的世界模型及专门的开放域基准；更早年份在证据包中代表性有限。
  - 开放问题：一致性与保真度指标是否与下游决策效用一致，基准分布是否覆盖真实部署场景，以及结论在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets, such as loop navigation,
        open-domain closed-loop video, Atari 100k, CARL, and driving suites, for comparing
        world-model claims.
      what_remains_open: Coverage of deployment-like settings is not established;
        LoopNav reports dataset and benchmark construction but no experimental results,
        and MIND shows long-term memory and cross-action generalization remain hard.
    - line: Metric and stress-test design
      what_it_solves: Probes temporal coherence, spatial consistency, memory, action
        control, zero-shot generalization, visual fidelity, and physical plausibility
        beyond aggregate scores.
      what_remains_open: Proxy metrics are not yet clearly tied to downstream policy
        or deployment utility; physical plausibility and memory consistency evaluations
        use different definitions across papers.
    - line: Comparable baselines and reporting
      what_it_solves: Public datasets, code, and artifacts plus standard baselines
        make results auditable across model families.
      what_remains_open: Some analyses lack limitation statements or detailed metric/baseline
        settings; cross-implementation and compute-budget stability remain verification
        gaps.
    consensus:
    - The field is moving from aggregate benchmark scores toward targeted stress tests
      for consistency, memory, control, and generalization.
    - Public interaction datasets and standardized model-based evaluation are used
      to compare world models across visual control, driving, Minecraft, and robotic
      domains.
    - Action-conditioned generation and learned latent or diffusion dynamics are common
      substrates for evaluating world-model capability.
    - Recent papers emphasize open code and datasets and downstream policy utility
      as part of evaluation, although downstream utility measurement is still inconsistent.
    disagreements:
    - 'Representation choices differ: discrete or VAE-based latent dynamics versus
      diffusion-based video generation versus physics-informed architectures.'
    - 'Supervision differs: some settings require observable context variables; others
      use paired action-video data, action-free video, depth prediction, or keypoint
      dynamics.'
    - 'Evaluation targets differ: closed-loop policy rewards on Atari/CARL, long-horizon
      and multi-view driving prediction, open-domain memory and action control, and
      embodied robotic video plausibility.'
    - 'Metric emphasis differs: human-normalized scores, scene graph consistency,
      visual fidelity, physical plausibility, and downstream policy evaluation are
      not unified.'
    open_questions:
    - Do spatial, memory, and visual-fidelity metrics predict downstream control or
      robotics performance across tasks?
    - Can current benchmark distributions cover long-horizon, multi-view, cross-action-space,
      and deployment-scale settings that world models are expected to handle?
    - Are reported results stable across different architectures, training budgets,
      and implementations when code and limitation details are missing?
    - How should physical plausibility and decision utility be measured without collapsing
      to pixel-level or aggregate scores?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，例如循环导航、开放域闭环视频、Atari 100k、CARL和驾驶评测套件，使世界模型主张可比较。
      尚未覆盖: 对真实部署类设置的覆盖尚未验证；LoopNav报告数据集和基准构建但摘要无实验结果，MIND显示长期记忆和跨动作空间泛化仍困难。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合分数之外检验时间一致性、空间一致性、记忆、动作控制、零样本泛化、视觉保真度和物理合理性。
      尚未覆盖: 代理指标与下游策略或部署效用的关联尚不清晰；物理合理性和记忆一致性评测在不同论文中定义不一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过公共数据集、代码、工件和标准基线，使不同模型族的结果可审计。
      尚未覆盖: 部分分析缺少局限性说明或详细指标与基线设置；跨实现和算力预算的稳定性仍是验证缺口。
    共识:
    - 领域正从聚合基准分数转向针对一致性、记忆、控制和泛化的压力测试。
    - 公共交互数据集和标准化基于模型的评测被用于比较视觉控制、驾驶、Minecraft和机器人领域的模型。
    - 动作条件生成和潜在或扩散动力学是评估世界模型能力的常见载体。
    - 近期工作强调开放代码、数据集和下游策略效用，但下游效用测量仍不统一。
    分歧:
    - 表示选择不同：离散或VAE潜在动力学、基于扩散的视频生成和物理信息架构并存。
    - 监督信号不同：部分设置依赖可观测上下文变量，另一些使用配对动作-视频、无动作视频、深度预测或关键点动力学。
    - 评测目标不同：Atari/CARL闭环策略得分、长时域和多视角驾驶预测、开放域记忆与动作控制，以及具身机器人视频合理性各有侧重。
    - 指标重点不同：人类归一化得分、场景图一致性、视觉保真度、物理合理性和下游策略评估尚未统一。
    开放问题:
    - 空间、记忆和视觉保真度指标能否预测跨任务的下游控制或机器人性能？
    - 当前基准分布能否覆盖世界模型预期处理的长时域、多视角、跨动作空间和部署级场景？
    - 在代码和局限性细节缺失的情况下，报告结果在不同架构、训练预算和实现间是否稳定？
    - 如何在不退回像素级或聚合分数的情况下测量物理合理性和决策效用？
