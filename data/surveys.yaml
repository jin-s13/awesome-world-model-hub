  related_work_outline_zh:
  - 主流方向：将视频生成模型重新用作具身智能的世界模型，重点在于动作条件化的视频预测、物理对齐和测试时验证。
  - 研究共性：在机器人数据集上预训练大型视频扩散或自回归模型，然后通过动作机制、奖励建模或偏好优化进行适配，以提升可控性和真实性。
  - 关键差异：表示形式涵盖扩散模型与掩码自回归；动作注入方式有帧级条件、并行模块或学习掩码；评测目标涉及视觉保真度、物理合理性或任务规划。
  - 趋势演进：工作从概念分类（2022–2024）转向大规模预训练与对齐（2024–2025），再发展到测试时缩放与物理基准（2025–2026）。
  - 开放问题：如何实现长期持久性和因果推理；对齐方法能否跨本体迁移；如何设计功能基准以衡量超越视觉质量的物理理解能力。
  literature_review:
    line_of_work_matrix:
    - line: State construction and dynamics modeling for video world models
      what_it_solves: Provides a conceptual taxonomy that bridges video generation
        and classic world model theories by categorizing state construction (implicit/explicit)
        and dynamics modeling (knowledge integration, architectural reformulation).
      what_remains_open: The taxonomy has not been empirically validated; it remains
        unclear whether these categories lead to improved model design or functional
        benchmarks.
    - line: Action-conditioned video generation as world models
      what_it_solves: Enables policy learning, planning, and evaluation by adapting
        pretrained video diffusion or autoregressive models to accept action inputs
        and predict future frames.
      what_remains_open: No theoretical guarantees on long-horizon consistency; generalization
        across diverse embodiments and tasks is underexplored; the reliance on action-labeled
        data limits scalability.
    - line: Alignment of world models with physical realism and task logic
      what_it_solves: Improves the physical fidelity and task coherence of generated
        rollouts by fine-tuning with multidimensional reward models or direct preference
        optimization.
      what_remains_open: Reward models depend on subjective human preferences and
        are costly to collect; the long-term impact of alignment on exploration and
        diversity is not studied.
    - line: Test-time verification and scaling for world model reasoning
      what_it_solves: Introduces verifiers that select or score generated trajectories
        to improve spatial reasoning without retraining the world model.
      what_remains_open: Current world models exhibit an information bottleneck that
        limits scaling; verifiers suffer from poor calibration and action biases;
        consistent test-time scaling is not yet achieved.
    - line: Heterogeneous pretraining for world model generalization
      what_it_solves: Leverages large-scale, cross-embodiment robot datasets to pretrain
        world models that can simulate diverse environments and generate synthetic
        data for downstream policy learning.
      what_remains_open: Theoretical generalization bounds are missing; the relationship
        between pretraining objectives and downstream task performance is not formally
        characterized.
    consensus:
    - Video generation models can serve as world models for robotic manipulation and
      spatial reasoning.
    - Action conditioning is essential for making video predictions useful for decision-making.
    - Physical realism and controllability are critical quality dimensions beyond
      visual fidelity.
    - Large-scale pretraining on robot datasets improves the generalization and robustness
      of world models.
    - Test-time computation (e.g., trajectory selection, verification) can enhance
      model-based reasoning.
    disagreements:
    - 'Representation: Some works use diffusion transformers, others use masked autoregression
      or flow-based models.'
    - 'Action injection: Methods vary from frame-level action-conditioning modules
      to parallel context blocks and learned output masks.'
    - 'Alignment strategy: Approaches differ between reward-model-based RL fine-tuning
      and direct preference optimization without explicit reward functions.'
    - 'Evaluation target: Some papers prioritize visual quality metrics, while others
      emphasize physical plausibility, task completion, or planning accuracy.'
    - 'Test-time usage: One line uses world models for verification and reward scoring,
      while another uses them directly for planning and simulation.'
    open_questions:
    - How can world models achieve long-horizon persistence and causal reasoning beyond
      single-step prediction?
    - What formal conditions guarantee that aligned world models remain faithful to
      the true environment dynamics?
    - Can test-time scaling consistently improve reasoning across diverse benchmarks,
      or is it fundamentally limited by the model's internal state representation?
    - Are heterogeneous pretraining strategies effective for tasks outside the training
      distribution of embodiments and domains?
    - How should functional benchmarks be designed to evaluate physical understanding
      rather than just visual similarity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频世界模型的状态构建与动态建模
      解决的问题: 提出一种概念分类法，将视频生成与经典世界模型理论连接起来，通过状态构建（隐式/显式）和动态建模（知识整合、架构重构）进行划分。
      尚未覆盖: 该分类法尚未经过实证验证；这些类别是否能改进模型设计或功能基准仍不清楚。
    - 路线: 动作条件化视频生成作为世界模型
      解决的问题: 通过将预训练视频扩散模型或自回归模型适配为接受动作输入并预测未来帧，实现策略学习、规划与评估。
      尚未覆盖: 缺少长期一致性的理论保证；跨本体和任务的泛化研究不足；对动作标注数据的依赖限制了可扩展性。
    - 路线: 世界模型与物理真实性和任务逻辑的对齐
      解决的问题: 通过多维奖励模型或直接偏好优化对生成轨迹进行微调，提升物理保真度和任务一致性。
      尚未覆盖: 奖励模型依赖主观的人类偏好，收集成本高；对齐对探索和多样性的长期影响未研究。
    - 路线: 世界模型推理的测试时验证与缩放
      解决的问题: 引入验证器对生成轨迹进行选择或评分，以在不重新训练的情况下改善空间推理。
      尚未覆盖: 当前世界模型存在信息瓶颈，限制了缩放；验证器存在校准差和动作偏差；尚未实现一致的测试时缩放。
    - 路线: 面向世界模型泛化的异构预训练
      解决的问题: 利用大规模、跨本体的机器人数据集预训练世界模型，可模拟多样化环境并生成合成数据用于下游策略学习。
      尚未覆盖: 缺少理论泛化边界；预训练目标与下游任务性能之间的关系尚未被形式化地描述。
    共识:
    - 视频生成模型可以作为机器人操作和空间推理的世界模型。
    - 动作条件化对于使视频预测对决策有用至关重要。
    - 物理真实性和可控性是超越视觉保真度的关键质量维度。
    - 在机器人数据集上进行大规模预训练可提升世界模型的泛化性和鲁棒性。
    - 测试时计算（如轨迹选择、验证）可以增强基于模型的推理。
    分歧:
    - 表示形式：有些工作使用扩散Transformer，有些使用掩码自回归或基于流的模型。
    - 动作注入方式：方法从帧级动作条件模块到并行上下文块和学习输出掩码不等。
