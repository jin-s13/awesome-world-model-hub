  related_work_outline:
  - 'Mainstream direction: Building deployable, controllable world-model systems for
    embodied interaction (autonomous driving, robotics, games), with high-fidelity
    video generation, action-conditioned controllability, and real-time closed-loop
    capabilities.'
  - 'Shared research pattern: Upgrading video generators into interactive simulators
    by adding action conditioning, physics priors, or context adaptation, and evaluating
    them on standardized benchmarks for downstream tasks like policy training, evaluation,
    and simulation.'
  - 'Key differences: Supervisory signals (spatial consistency vs. action fidelity
    vs. physical plausibility); controllability dimensions (high-level intent vs.
    low-level trajectory); evaluation setting (open-loop vs. closed-loop); deployment
    constraints (single-GPU real-time vs. general frameworks); and reliance on physics
    priors vs. purely data-driven dynamics.'
  - 'Trend evolution: Moving from offline benchmark construction (e.g., LoopNav, ACT-Bench)
    toward real-time closed-loop systems (e.g., FAR-Drive); expanding from driving
    to general interactive scenarios; and increasingly integrating physical knowledge
    and context-aware adaptation.'
  - 'Open questions: Cross-domain generalization; long-horizon closed-loop stability;
    trade-offs between speed, fidelity, and physical correctness; reliability under
    real-world deployment shifts; and independent reproducibility across teams and
    hardware.'
  related_work_outline_zh:
  - 主流方向：构建可部署、可控制的世界模型系统，用于具身交互（自动驾驶、机器人、游戏），实现高保真视频生成、动作条件可控性与实时闭环能力。
  - 研究共性：通过添加动作条件、物理先验或上下文适应，将视频生成器升级为交互式模拟器，并在标准化基准上评估其对策略训练、评估和模拟等下游任务的支持。
  - 关键差异：监督信号（空间一致性 vs. 动作保真度 vs. 物理合理性）；可控维度（高层意图 vs. 低层轨迹）；评估设定（开环 vs. 闭环）；部署约束（单GPU实时
    vs. 通用框架）；以及是否显式依赖物理先验。
  - 趋势演进：从离线基准构建（如 LoopNav、ACT-Bench）向实时闭环系统（如 FAR-Drive）演进；从驾驶领域扩展到通用交互场景；并越来越多地整合物理知识和上下文感知适应。
  - 开放问题：跨域泛化；长时程闭环稳定性；速度、保真度与物理正确性之间的权衡；真实部署环境变化下的可靠性；以及跨团队、跨硬件的独立可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning model ideas into end-to-end workflows for data, training,
        inference, and evaluation. For example, cRSSM integrates a contextual world
        model into Dreamer's training loop to improve zero-shot generalization; Vista
        and FAR-Drive build complete pipelines from video generation to downstream
        control or reward evaluation; DWS converts pretrained generators into simulators
        for policy training.
      what_remains_open: Robustness under distribution shift, scalability across hardware/user-specific
        settings, and validation in real-world deployment beyond curated datasets
        are largely unverified.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        use. FAR-Drive achieves sub-second latency on a single GPU for frame-level
        autoregressive generation; DWS enables interactive video generation through
        a lightweight action-conditioned module; surveys highlight real-time responsiveness
        as a core challenge.
      what_remains_open: Fine-grained trade-offs among speed, fidelity, and controllability;
        performance under high-complexity scenes; and integration of long-horizon
        memory for sustained interaction remain open.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making systems inspectable and reusable through code, datasets,
        and benchmarks. LoopNav provides a spatial-consistency benchmark and dataset;
        ACT-Bench offers an action-fidelity evaluation framework; the survey organizes
        benchmarks across multiple domains.
      what_remains_open: Independent reproduction across teams and infrastructure
        environments is still missing; benchmark coverage for real-world robot data
        and diverse sensor setups is limited.
    consensus:
    - World models must move beyond passive video generation to become action-controllable,
      physically consistent, and interactive simulators.
    - Deployability (low latency, versatile control) and measurability (specialized
      benchmarks) are now central to building practical systems.
    - Combining pretrained models or specialized architectures (e.g., diffusion transformers)
      with downstream reinforcement learning is a common recipe for improving performance.
    disagreements:
    - 'Representation: some works use pixel-space video generation, while others rely
      on latent state-space models (e.g., cRSSM) for dynamics.'
    - 'Supervision: spatial consistency (SGCS) vs. action fidelity (ACT-Bench, Terra)
      vs. physical plausibility (RoboScape) vs. zero-shot generalization (cRSSM) as
      primary evaluation targets.'
    - 'Interaction mode: open-loop video generation conditioned on a single action
      vs. closed-loop autoregressive rollout with real-time constraints.'
    - 'Deployment domain: driving (Vista, FAR-Drive, ACT-Bench) vs. robotics (RoboScape)
      vs. games/open-world (LoopNav, DWS) vs. general interactive environments (survey).'
    - 'Physics integration: RoboScape explicitly injects physics knowledge via depth
      and keypoint tasks, while others rely on data-driven learning without explicit
      physics modeling.'
    open_questions:
    - How can a unified evaluation framework simultaneously capture spatial consistency,
      action fidelity, physical plausibility, and generalization?
    - What mechanisms ensure long-term stable closed-loop behavior when a world model
      is deployed in real, non-stationary environments?
    - Can lightweight action-conditioned modules scale to highly dynamic, multimodal
      interactions without losing visual detail or physical accuracy?
    - How can context-aware world models move from observed context variables to fully
      unknown dynamics, bridging the gap between cRSSM's assumptions and real-world
      unpredictability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型想法转化为覆盖数据、训练、推理和评估的端到端工作流。例如，cRSSM将上下文世界模型集成到Dreamer训练循环中以提升零样本泛化；Vista和FAR-Drive构建了从视频生成到下游控制或奖励评估的完整流水线；DWS将预训练生成器转化为用于策略训练的模拟器。
      尚未覆盖: 分布偏移下的鲁棒性、跨硬件与用户特定设置的可扩展性，以及在精选数据集之外的真实部署验证，大多尚未得到证实。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用的延迟和交互性要求。FAR-Drive在单GPU上实现亚秒级延迟的帧级自回归生成；DWS通过轻量级动作条件模块支持交互式视频生成；综述将实时响应列为核心挑战。
      尚未覆盖: 速度、保真度和可控性之间的精细权衡；高复杂度场景下的性能；以及用于持续交互的长时记忆整合，仍有待解决。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、数据集和基准使系统可检查、可复用。LoopNav提供空间一致性基准和数据集；ACT-Bench提供动作保真度评估框架；综述整理了多个领域的基准。
      尚未覆盖: 跨团队和基础设施的独立复现依然缺失；真实世界机器人数据和多样化传感器配置的基准覆盖仍然有限。
    共识:
    - 世界模型必须超越被动视频生成，成为动作可控、物理一致且可交互的模拟器。
    - 可部署性（低延迟、多功能控制）和可衡量性（专门基准）已成为构建实用系统的核心。
    - 将预训练模型或专用架构（如扩散Transformer）与下游强化学习相结合，是提升性能的常见范式。
    分歧:
    - 表示方式：部分工作采用像素空间视频生成，而另一些依赖潜在状态空间模型（如cRSSM）进行动力学建模。
    - 监督信号：以空间一致性（SGCS）、动作保真度（ACT-Bench, Terra）、物理合理性（RoboScape）或零样本泛化（cRSSM）作为主要评价目标。
    - 交互模式：基于单一动作条件的开环视频生成，与具有实时约束的闭环自回归推演。
    - 部署领域：驾驶（Vista, FAR-Drive, ACT-Bench）vs. 机器人（RoboScape）vs. 游戏/开放世界（LoopNav, DWS）vs.
      通用交互环境（综述）。
    - 物理整合：RoboScape通过深度和关键点任务显式注入物理知识，而其他工作依赖数据驱动学习，不显式建模物理。
    开放问题:
    - 如何构建统一的评估框架，同时衡量空间一致性、动作保真度、物理合理性和泛化能力？
    - 当世界模型部署在真实、非平稳环境中时，什么样的机制能保证长期稳定的闭环行为？
    - 轻量级动作条件模块能否在高度动态、多模态交互中扩展，而不丢失视觉细节或物理准确性？
    - 上下文感知世界模型如何从可观测的上下文变量推进到完全未知的动力学，弥合cRSSM的假设与真实世界不可预测性之间的差距？
