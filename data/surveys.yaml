    - 评测目标不同：驾驶侧重多视角与长时域预测，游戏侧重样本效率或循环导航一致性，机器人侧重任务执行、视频合理性与策略泛化。
    开放问题:
    - 驾驶与机器人仿真器的收益能否迁移到真实安全、物理执行和运营可靠性？
    - 世界模型如何在视角、动作空间和场景变化下保持长期记忆一致性与稳健动作控制？
    - 可观测上下文、预定义原语、固定动作空间等假设对未知动力学、本体或物理环境的泛化形成哪些限制？
