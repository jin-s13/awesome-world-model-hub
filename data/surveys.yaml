  - 主流方向：以世界模型为中心的综述与分类体系主导，主要围绕生成式视频、自动驾驶、具身智能体与开源仿真整理共享框架。
  - 研究共性：多数工作先定义设计空间，如潜在表示、结构先验、组合原语，再映射方法与缺口，而非仅报告单一模型结果。
  - 关键差异：部分贡献偏概念分类而缺乏实证验证；另一些强调评测兼容性，涉及仿真、闭环驾驶和实时交互等不同设置。
  - 趋势演进：从2023年交通智能体世界模型和2024年通用视频世界模型综述，走向2025-2026年的可控性、长时程一致性、持久视线外动态和开源评测。
  - 开放问题：综合是否基于系统证据、不同评测设置能否对齐、哪些缺口对驾驶或具身智能体进展最优先。
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model simulation methods
      what_it_solves: Controllable future video and scene simulation for robot imagination,
        ego-vision, traffic, and interactive world modeling
      what_remains_open: Real-world execution versus simulation, long-horizon and
        out-of-sight consistency, and benchmark comparability are not fully validated
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model design spaces, latent representations,
        structural priors, and research milestones into a navigable framework
      what_remains_open: Whether the synthesis is supported by systematic literature
        inclusion and empirical validation rather than selective examples
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as open-loop or closed-loop
        metrics shape conclusions across methods
      what_remains_open: Results are often not compatible across settings, and resource-aware
        inference cost is proposed but not consistently tested
    - line: Open problem and gap mapping
      what_it_solves: Turns broad world-model coverage into concrete research questions
        about decision readiness, verifiability, and efficiency
      what_remains_open: Prioritization of which gaps matter most for driving, embodied
        agents, or general simulation remains unresolved
    consensus:
    - World models are treated as a unifying abstraction for video generation, autonomous
      driving simulation, and embodied-agent interaction.
    - Long-horizon consistency, controllability, and the transition from open-loop
      generation to closed-loop decision evaluation are recurring priorities.
    - Current evaluation requires stronger benchmarks, but dataset, metric, and baseline
      details are often incomplete across the evidence packet.
    disagreements:
    - Representation type varies among continuous latent states, discrete tokens,
      and hybrid latent-action-generator designs, with no agreed unified space.
    - 'Control and supervision signals differ: language-conditioned primitives, ego-motion
      and object-dynamics control, destination plus personality, or next-token generation.'
    - Evaluation targets differ across video generation quality, motion prediction,
      closed-loop driving planning, or real-time interactive simulation, making direct
      comparison difficult.
    - 'Contribution scope differs: some works emphasize conceptual design spaces and
      roadmaps, while others emphasize synthesized video or driving performance.'
    open_questions:
    - 'Which evaluation setting best captures world-model progress: open-loop video
      generation, closed-loop driving, or persistent out-of-sight dynamics?'
    - How can taxonomy surveys be validated against systematic inclusion criteria
      and empirical baselines instead of selective examples?
    - What is the minimum reproducibility evidence needed when code, datasets, metrics,
      or baseline details are missing?
    - Can autonomous driving and general video world models share one latent design
      space without losing task-specific structure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型仿真方法
      解决的问题: 通过视频生成、全局状态或多模态条件实现可控未来场景仿真，并服务于机器人想象、自我中心视觉、交通等任务
      尚未覆盖: 仿真到真实执行的鸿沟、长时程与视线外一致性、跨基准兼容性仍未充分验证
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型设计空间、潜在表示、结构先验与研究里程碑整理为可导航框架
      尚未覆盖: 综合是否由系统性文献纳入和实证验证支撑，仍存在选择性示例风险
    - 路线: 对比评测综合
      解决的问题: 总结开环、闭环等评测选择如何影响跨方法结论
      尚未覆盖: 不同设置下的结果常不可直接比较，资源感知推理成本提出后未得到一致测试
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛世界模型覆盖转化为关于决策就绪、可验证性和效率的具体研究问题
      尚未覆盖: 哪些缺口对驾驶、具身智能体或通用仿真最优先，仍缺少证据化排序
    共识:
    - 世界模型被视作连接视频生成、自动驾驶仿真和具身智能体交互的统一抽象。
    - 长时程一致性、可控性以及从开环生成到闭环决策评估的过渡是反复出现的优先问题。
    - 当前评测需要更强基准，但数据集、指标和基线细节在证据包中常不完整。
    分歧:
    - 表示方式不同：连续潜在状态、离散令牌、潜在-动作-生成器混合方案并存，未形成统一空间。
    - 监督与控制信号不同：语言条件原语、自我运动与物体动态控制、目的地加个性或下一令牌生成各有侧重。
    - 评测目标不同：视频生成质量、运动预测、闭环驾驶规划或实时交互模拟之间难以直接比较。
    - 贡献范围不同：部分工作侧重概念设计空间和路线图，部分工作侧重合成视频或驾驶性能验证。
    开放问题:
    - 哪种评测设置最能代表世界模型进展：开环视频生成、闭环驾驶还是持久视线外动态？
    - 如何在分类综述中验证文献纳入系统性和实证基线，而非选择性示例？
    - 当代码、数据集、指标或基线细节缺失时，复现性所需的最低证据是什么？
    - 自动驾驶与通用视频世界模型能否共享同一潜在设计空间而不损失任务特定结构？
