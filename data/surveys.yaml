    open_questions:
    - Can a single taxonomy simultaneously cover generative video, interactive simulation,
      embodied robot learning, and automated driving without hiding domain-specific
      assumptions?
    - Which evaluation setting, open-loop generation quality, closed-loop decision
      performance, or resource-aware inference cost, best predicts downstream deployment
      value?
    - What evidence would show that survey-identified gaps such as action-conditioned
      controllability or long-horizon memory are priorities rather than ranked by
      convenience?
    - How can proposed evaluation frameworks be validated when the source surveys
