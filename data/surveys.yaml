  related_work_outline:
  - 'Mainstream direction: Constructing and using benchmark suites for world models
    in visual control, driving, and robotics; evaluation increasingly targets long-horizon
    consistency, action controllability, and generalization rather than reward score
    alone.'
  - 'Shared research pattern: Standardized environments or datasets provide action-conditioned
    visual rollouts; methods add targeted metrics or generative objectives to verify
    spatial/memory consistency, physical plausibility, or zero-shot policy transfer.'
  - 'Key differences: Evaluation targets range from RL reward in Atari/CARL to video
    fidelity in driving/robotics to memory-action stress tests; representations differ
    across latent rollouts, VAE-Transformer, diffusion, DiT-mask, and physics-informed
    cues.'
  - 'Trend evolution: Within top papers spanning 2023-2026, work moves from efficient
    Atari world models toward reusable open-domain benchmarks and unified video-action
    or physics-informed models, making memory and action control the current frontier.'
  - 'Open questions: Whether diagnostic benchmark metrics align with downstream decisions,
    whether conclusions remain stable across implementations and compute budgets,
    and how far zero-shot and long-horizon generalization hold beyond narrow tasks
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：在视觉控制、驾驶和机器人领域构建并使用世界模型基准；评估越来越关注长时域一致性、动作可控性和泛化能力，而非只看奖励分数。
  - 研究共性：标准化环境或数据集提供动作条件的视觉序列；方法通过定向指标或生成目标来验证空间/记忆一致性、物理合理性或零样本策略迁移。
  - 关键差异：评测目标覆盖Atari/CARL奖励、驾驶/机器人视频保真度、记忆与动作压力测试；表示方式涉及潜在轨迹、VAE-Transformer、扩散、DiT掩码和物理信息线索。
  - 趋势演进：在2023-2026年高相关论文中，研究从高效Atari世界模型转向可复用的开放域基准和统一视频-动作或物理信息模型，记忆与动作控制成为当前前沿。
  - 开放问题：诊断基准指标是否与下游决策对齐；结论在实现和算力预算下是否稳定；零样本与长时域泛化能否超出窄任务仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned visual tasks and datasets
        for comparing world-model spatial, memory, and action-control claims.
      what_remains_open: Whether curated datasets cover deployment settings and whether
        their scores transfer to downstream agent or planner performance.
    - line: Metric and stress-test design
      what_it_solves: Probes targeted properties such as spatial consistency, memory
        consistency, physical plausibility, and zero-shot generalization beyond aggregate
        reward.
      what_remains_open: Alignment between proxy metrics and user-relevant decisions
        is not established; some benchmarks report construction without metric sensitivity
        experiments.
    - line: Comparable baselines and reporting
      what_it_solves: Supplies common baselines, environments, and artifacts so model
        variants can be compared and replicated.
      what_remains_open: Stability across implementations and compute budgets is unreported;
        many analyses leave limitation fields empty, creating verification gaps.
    consensus:
    - World-model evaluation is shifting from aggregate task scores toward targeted
      diagnostics for consistency, controllability, and generalization.
    - Standardized visual environments and benchmark datasets are used to compare
      modular world-model choices under shared conditions.
    - Recent work treats generative fidelity and dynamics learning as central, not
      merely as a pretraining auxiliary, across control and video prediction settings.
    disagreements:
    - 'Representation differs: Dreamer-style stochastic latent rollouts, VAE-Transformer
      dynamics, diffusion world models, DiT-based masked video generation, and physics-informed
      depth-keypoint signals.'
    - 'Supervision and evaluation differ: some lines optimize policy reward in Atari
      or contextual RL, while others optimize video fidelity, physical plausibility,
      or memory-action stress scores.'
    - 'Interaction settings differ: closed-loop action-conditioned navigation, open-loop
      multi-view driving rollout, unified action-video diffusion for robots, and physics-informed
      robot video generation.'
    - 'Benchmark scope differs: narrow game/control benchmarks versus open-domain
      scenes with explicit action-space and viewpoint variation, leading to different
      generalization evidence.'
    open_questions:
    - Do spatial, memory, and action-control benchmark metrics predict downstream
      planning or policy performance?
    - Which protocol should define reliable long-horizon memory consistency and cross-action-space
      generalization in open-domain world models?
    - Can zero-shot generalization methods relax observable-context assumptions and
      scale beyond small contextual RL suites?
    - Are diffusion-driven visual fidelity gains stable under limited compute and
      transferable beyond Atari to driving and robotic settings?
    - What failure modes are hidden by empty limitation fields and missing baseline
      or implementation stability evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享的动作条件视觉任务和数据集，使世界模型的空间、记忆与动作控制主张可比较。
      尚未覆盖: 精选数据集是否覆盖真实部署设置，以及其分数是否能迁移到下游智能体或规划性能。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、物理合理性和零样本泛化等定向能力。
      尚未覆盖: 代理指标与用户相关决策之间的对齐尚未建立；部分基准只报告数据集构建，缺少指标敏感性实验。
    - 路线: 可比基线与报告规范
      解决的问题: 提供统一基线、环境和工件，使不同世界模型变体能够被比较与复现。
      尚未覆盖: 跨实现和算力预算的稳定性未被报告；多个分析的限制字段为空，形成验证缺口。
    共识:
    - 世界模型评估正从总分转向一致性、可控性和泛化性的定向诊断。
    - 标准化视觉环境和基准数据集被用于在共享条件下比较模块化的世界模型设计。
    - 近期工作将生成保真度和动力学学习视为核心能力，而不仅是控制或预测任务的附加环节。
    分歧:
    - 表示方式不同：Dreamer式随机潜在轨迹、VAE-Transformer动力学、扩散世界模型、DiT掩码视频生成和物理信息深度-关键点信号并存。
    - 监督与评测目标不同：有些优化Atari或上下文强化学习中的策略奖励，有些优化视频保真度、物理合理性或记忆-动作压力分数。
    - 交互设置不同：闭环动作条件导航、开环多视角驾驶预测、机器人动作-视频统一扩散以及物理信息机器人视频生成。
    - 基准范围不同：窄游戏或控制基准与具有明确动作空间和视角变化的开放域场景并存，导致泛化证据不同。
    开放问题:
    - 空间、记忆和动作控制基准指标是否能预测下游规划或策略性能？
    - 何种协议能可靠定义开放域世界模型中的长时域记忆一致性和跨动作空间泛化？
    - 零样本泛化方法能否放宽可观测上下文假设，并扩展到小型上下文强化学习套件之外？
    - 扩散驱动的视觉保真度提升在有限算力下是否稳定，并能否从Atari迁移到驾驶与机器人设置？
    - 空的限制字段和缺失的基线或实现稳定性证据隐藏了哪些失败模式？
