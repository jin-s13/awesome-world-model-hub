  related_work_outline_zh:
  - 主流方向：具身世界模型围绕动作条件视频生成展开形式化；概念工作用状态构建和动态建模定义，方法工作构建统一扩散或自回归模型。
  - 研究共性：将动作与视觉动态耦合，并通过任务成功、物理合理性、偏好奖励或帧级断言对生成轨迹进行对齐或验证。
