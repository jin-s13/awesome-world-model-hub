      and beyond nuScenes, CARL, Minecraft, or the covered game and robotics domains?
    - Which evaluation metrics predict downstream policy success when ground-truth
      actions are absent?
    - Do current open datasets, benchmarks, and model artifacts support independent
      reproduction across different teams and infrastructure?
    - How much system complexity is needed for real-time interactivity without sacrificing
      physical plausibility or controllability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的世界模拟器与闭环视频生成
      解决的问题: 为具身与驾驶场景生成由动作或物理信号控制的未来视频，支撑策略训练和评估。
      尚未覆盖: 长时域一致性、分布外动作处理和跨环境物理合理性仍缺乏充分验证。
    - 路线: 面向保真度与可控性的基准和评测框架
      解决的问题: 通过标准化数据和评估框架量化空间一致性、动作保真度和模型相对优劣。
      尚未覆盖: 评测多限于单一数据集或领域，指标与实际下游任务收益的对应关系仍不明确。
    - 路线: 上下文条件下的基于模型强化学习
      解决的问题: 在想象轨迹上训练策略，并通过可观测上下文条件化潜在动力学提升零样本泛化。
      尚未覆盖: 依赖上下文可观测假设，任务套件范围窄，真实系统泛化证据不足。
    - 路线: 可部署的实时系统与开放工件
      解决的问题: 将低延迟推理、代码、数据集或基准整合为可复用的模拟器栈。
      尚未覆盖: 验证多集中在单GPU或单场景，跨基础设施鲁棒性和独立复现仍缺失。
    共识:
    - 多数工作将条件视频生成与动作跟随或物理合理性共同作为评估对象，而非仅看视觉质量。
    - 动作可控性被视为核心瓶颈，主要通过动作模块、结构化控制、物理信息目标或上下文输入来解决。
    - 数据集和基准是当前重要的可复用工件，但并非所有模型都提供同样完整的代码、工件和局限性说明。
    - 方法学证据不均衡：部分工作给出实验、基线、指标和局限，部分工作缺少局限性或跨数据集验证；高可复现性或高时效性信号应与鲁棒性证据分开理解。
    分歧:
    - 实现路线不同：有的在预训练视频生成器上插入轻量模块，有的训练专用物理信息或自回归模拟器。
    - 监督信号不同：使用循环导航、时间深度、关键点动力学、可观测上下文值或轨迹标注。
    - 评测重点不同：空间一致性、动作保真度、零样本策略泛化、物理合理性和闭环延迟在不同工作中权重不同。
    - 部署状态不同：部分贡献强调开放基准或模型工件，部分优化单GPU低延迟；多GPU和跨基础设施部署讨论不足。
    开放问题:
    - 动作可控模拟器能否在更长时域以及nuScenes、CARL、Minecraft之外的场景中保持一致？
    - 在缺少真实动作标签时，哪些评测指标能更好预测下游策略表现？
    - 当前开放数据集、基准和模型工件是否足以支持跨团队、跨基础设施的独立复现？
    - 如何在满足实时交互的同时不以牺牲物理合理性和可控性为代价？
