    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将交互式视频生成、自动驾驶、智能体与通用模拟等零散研究整理为应用场景、表示选择、设计空间和挑战路线。
      尚未覆盖: 多数分类法是趋势驱动且偏概念性，仍缺少系统性纳入标准和实证验证。
    - 路线: 可控生成式世界模拟
      解决的问题: 通过语言、自我运动、物体动力学或人体姿态等条件，生成可控的未来帧或视频，用于规划与场景推演。
      尚未覆盖: 对未见原语组合、新事件、视线外持续性和长时程稳定性的泛化仍不清晰。
    - 路线: 具身世界模型在线学习
      解决的问题: 在真实机器人上使用潜在世界模型规划，从相机图像和稀疏奖励中无模拟器直接在线学习控制。
      尚未覆盖: 证据仅限于少数机器人平台和统一超参数；向更广泛硬件、任务和部署的迁移尚不明确。
    - 路线: 基准与评估综合
      解决的问题: 汇总不同评测选择，提出闭环指标、资源成本或专用基准，以弥合开环与闭环评估之间的差距。
      尚未覆盖: 各基准和指标在仿真、自我中心视觉、自动驾驶与真实部署之间是否兼容尚未被系统验证。
    共识:
    - 长时程一致性和动作条件可控被视为跨综述与模型工作的核心障碍。
    - 显式表示设计是常见应对，包括组合原语、潜在状态/动作、持久全局场景状态和多模态条件。
    - 评估正成为一等研究对象，重点逐渐转向基准、指标和评估框架，而不仅是模型输出质量。
    - 实时交互和低延迟推理正成为开源系统和评估框架的共同工程要求。
    分歧:
    - 表示方式不同：有的将语言解析为符号原语，有的使用潜在状态与动作、持久三维/动态场景状态或多模态参考帧条件。
    - 评测目标不同：部分贡献是概念性综述且无新实验，部分报告仿真、自我中心视觉、自动驾驶或真实机器人结果。
    - 监督与交互方式不同：有的在真实机器人上以稀疏奖励在线学习，有的基于大规模回顾性视频进行未来帧预测。
    - 部署场景不同：真实机器人、自动驾驶、自我中心人类/车辆场景和开放交互环境施加了不同约束和指标。
    开放问题:
