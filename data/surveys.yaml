  related_work_outline:
  - 'Mainstream direction: Building video generation models as world models for embodied
    AI, with a focus on action-conditioned video prediction, visual fidelity, and
    controllability, while theoretical analysis is emerging to formalize assumptions,
    taxonomies, and evaluation criteria.'
  - 'Shared research pattern: Treating world models as learnable simulators that generate
    future frames conditioned on actions, using diffusion or autoregressive architectures,
    and evaluating them via visual quality, action alignment, and policy learning
    performance.'
  - 'Key differences: Models differ in how actions are integrated (frame-level conditioning,
    masked autoregression, diffusion timestep control), whether they adapt pretrained
    video models or train from scratch, and how they align with physical realism (reward
    modeling, DPO, or lack thereof).'
  - 'Trend evolution: From 2024 method-focused papers building world models as video
    predictors, the frontier shifts in 2025-2026 toward theoretical taxonomy, systematic
    analysis of test-time verifiers, and physics-aligned post-training, indicating
    a move from pure generation to reliable world models.'
  - 'Open questions: How to achieve persistent state representations and causal reasoning
    over long horizons; whether functional benchmarks can replace visual fidelity
    metrics; what formal guarantees are needed for safe deployment; and why test-time
    compute scaling fails for certain reasoning tasks.'
  related_work_outline_zh:
  - 主流方向：构建视频生成模型作为具身AI的世界模型，重点在于动作条件视频预测、视觉保真度和可控性，同时理论分析开始涌现，用于形式化假设、分类和评估标准。
  - 研究共性：将世界模型视为可学习的模拟器，基于动作生成未来帧，使用扩散或自回归架构，并通过视觉质量、动作对齐和策略学习性能进行评估。
  - 关键差异：模型在动作集成方式（帧级条件、掩码自回归、扩散时间步控制）、是否适配预训练视频模型还是从头训练，以及如何对齐物理真实性（奖励建模、DPO或无显式对齐）上存在分歧。
  - 趋势演进：从2024年以方法为中心构建视频预测世界模型，到2025-2026年前沿转向理论分类、测试时验证器的系统分析以及物理对齐后训练，表明从纯生成向可靠世界模型的转变。
  - 开放问题：如何实现长时域持久状态表示和因果推理；功能基准能否取代视觉保真度指标；安全部署需要哪些形式化保证；以及为何测试时计算扩展在某些推理任务上失败。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Examines the conditions under which world models support spatial
        reasoning and decision-making, uncovering calibration failures, action biases,
        and unreliable reward signals in heuristic verifiers.
      what_remains_open: Generalizability of identified pitfalls across diverse tasks
        and embodiments; formal guarantees that test-time compute scaling will yield
        consistent improvements; whether explicit state construction can resolve information
        bottlenecks.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes video generation models into a taxonomy of state construction
        (implicit vs. explicit) and dynamics modeling (knowledge integration, architectural
        reformulation), and advocates for functional benchmarks over visual fidelity
        metrics.
      what_remains_open: Whether the taxonomy influences model design or evaluation
        practices; the feasibility of standardized functional benchmarks that test
        physical persistence and causal reasoning; empirical validation of the proposed
        taxonomy's predictive power.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size and data to expected performance, with empirical
        evidence that video generation quality scales with model size, but no formal
        scaling law is established.
      what_remains_open: Absence of formal scaling laws that predict failure modes,
        out-of-distribution behavior, or transfer; lack of theoretical guarantees
        for world model reliability, safety, or test-time compute scaling.
    consensus:
    - The community agrees that video generation models can serve as world models
      for embodied AI, but acknowledges that current approaches lack rigorous theoretical
      grounding.
    - There is shared recognition that visual fidelity alone is insufficient for evaluating
      world models; functional capabilities such as planning, causal reasoning, and
      physics consistency are critical.
    - Action conditioning is a universal requirement for world models to be useful
      in decision-making, though the specific conditioning mechanism varies.
    disagreements:
    - 'Evaluation philosophy: some works rely on visual quality metrics and policy
      learning outcomes, while theoretical contributions advocate for functional benchmarks
      that test persistence and causality.'
    - 'Model architecture: whether to adapt pretrained video diffusion models (e.g.,
      via learned masks) or to design world models from scratch with explicit action-integration
      modules.'
    - 'State representation: implicit context-management approaches compete with explicit
      latent-compression paradigms, and there is no consensus on which leads to better
      long-horizon consistency.'
    - 'Alignment strategy: some methods post-train with physics-aware reward models
      or DPO, while others assume that scaling alone can yield physically plausible
      rollouts, leaving open the necessity of explicit alignment.'
    open_questions:
    - What formal guarantees are needed for world models to be used in safety-critical
      planning and control?
    - How can world models maintain persistent, consistent state representations over
      long time horizons, and can causal reasoning be embedded without sacrificing
      scalability?
    - Why does test-time compute scaling fail for certain spatial reasoning benchmarks
      (e.g., MMSI-Bench), and what architectural or representational changes can overcome
      this information bottleneck?
    - Can functional benchmarks that assess physical persistence and causal reasoning
      gain community adoption, and will they lead to better world model designs?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 审视世界模型用于空间推理和决策的条件，揭示启发式验证器的校准失败、动作偏差和不可靠奖励信号。
      尚未覆盖: 已识别缺陷在不同任务和本体上的泛化性；测试时计算扩展能带来一致改进的形式化保证；显式状态构建能否解决信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将视频生成模型组织为状态构建（隐式/显式）和动态建模（知识整合、架构重构）的分类法，并倡导以功能基准取代视觉保真度指标。
      尚未覆盖: 分类法是否影响模型设计或评估实践；标准化功能基准测试物理持久性和因果推理的可行性；所提分类法预测能力的经验验证。
    - 路线: 缩放规律与保证
      解决的问题: 将模型规模和数据与期望性能联系起来，有经验证据表明视频生成质量随模型规模扩展，但未建立形式化缩放规律。
      尚未覆盖: 缺乏能预测失效模式、分布外行为或迁移的形式化缩放规律；缺少世界模型可靠性、安全性或测试时计算扩展的理论保证。
    共识:
    - 社区认同视频生成模型可作为具身AI的世界模型，但承认当前方法缺乏严谨的理论基础。
    - 普遍认识到仅凭视觉保真度不足以评估世界模型，规划、因果推理和物理一致性等功能能力至关重要。
    - 动作条件是世界模型用于决策的普遍需求，但具体条件机制存在差异。
    分歧:
    - 评估哲学：部分工作依赖视觉质量指标和策略学习结果，而理论贡献则倡导测试持久性和因果性的功能基准。
    - 模型架构：是适配预训练视频扩散模型（如通过学习掩码）还是从头设计具有显式动作集成模块的世界模型。
    - 状态表示：隐式上下文管理范式与显式潜在压缩范式竞争，尚未就哪种方式能带来更好的长时域一致性达成共识。
    - 对齐策略：一些方法通过物理感知奖励模型或DPO进行后训练，而其他方法假设仅靠扩展就能产生物理合理的轨迹，留下显式对齐必要性的疑问。
    开放问题:
    - 世界模型用于安全关键规划和控制需要哪些形式化保证？
    - 世界模型如何在长时间范围内保持持久、一致的状态表示，以及能否在不牺牲可扩展性的情况下嵌入因果推理？
    - 为何测试时计算扩展在特定空间推理基准（如MMSI-Bench）上失败，何种架构或表示变化能克服这一信息瓶颈？
    - 测试物理持久性和因果推理的功能基准能否被社区采纳，它们是否会带来更好的世界模型设计？
