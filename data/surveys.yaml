  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for robotics and autonomous
    driving dominate, using diffusion transformers or video generation to predict
    future observations and enable policy learning.'
  - 'Shared research pattern: Most works learn a generative model of environment dynamics
    from visual inputs, then use it for planning, policy training, or evaluation,
    often with auxiliary tasks like depth or mask reconstruction.'
  - 'Key differences: Supervision varies from pure video prediction to physics-informed
    losses and coupled action-video diffusion; evaluation targets range from visual
    fidelity to downstream task success or memory consistency benchmarks.'
  - 'Trend evolution: From 2023 onward, the focus shifted from efficient RL in games
    to embodied and driving applications, with 2025–2026 introducing dedicated benchmarks
    for spatial and memory consistency in world models.'
  - 'Open questions: Whether improvements in simulation-based metrics translate to
    real-world safety and robustness, and how to achieve compositional generalization
    to unseen objects, actions, or environments without exhaustive retraining.'
  related_work_outline_zh:
  - 主流方向：面向机器人和自动驾驶的领域专用世界模型占主导，采用扩散变换器或视频生成预测未来观测并支持策略学习。
  - 研究共性：多数工作从视觉输入学习环境动态的生成模型，然后用于规划、策略训练或评估，常辅以深度或掩码重建等辅助任务。
  - 关键差异：监督信号从纯视频预测到物理信息损失和耦合动作-视频扩散不等；评测目标涵盖视觉保真度、下游任务成功率或记忆一致性基准。
  - 趋势演进：2023年起重心从游戏中的高效RL转向具身与驾驶应用，2025–2026年出现专门评估世界模型空间和记忆一致性的基准。
  - 开放问题：基于仿真的指标提升能否转化为真实世界的安全性与鲁棒性，以及如何在不完全重新训练的情况下实现对未见物体、动作或环境的组合泛化。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Long-horizon, multi-view video prediction for scene forecasting
        and closed-loop simulation in driving, using diffusion transformers with mask
        reconstruction.
      what_remains_open: Alignment between simulation gains and real-world safety
        outcomes; zero-shot transfer across diverse driving datasets and sensor setups
        remains partially validated.
    - line: Robotic world models with video generation
      what_it_solves: Learning compositional or physics-informed video generation
        from language instructions and robot data, enabling policy training and imagination
        for manipulation tasks.
      what_remains_open: Generalization to entirely novel object-action combinations;
        deployment on physical robots beyond simulation; reliance on accurate language
        parsing or observable physical parameters.
    - line: Unified video-action diffusion for robot pretraining
      what_it_solves: Joint modeling of video and action sequences in a single transformer,
        allowing flexible representation of policies, dynamics, and video generation,
        and leveraging action-free data.
      what_remains_open: Scalability to more complex, long-horizon tasks; verification
        of policy robustness in real-world settings; the benefit of independent diffusion
        timesteps over simpler conditioning schemes is not fully ablated.
    - line: Contextual world models for zero-shot dynamics generalization
      what_it_solves: Incorporating observable context variables into latent dynamics
        models (e.g., Dreamer) to achieve zero-shot policy transfer to unseen physical
        parameters in control tasks.
      what_remains_open: Assumes context observability, which is often violated; evaluated
        on only two CARL benchmark tasks; does not address generalization to completely
        unknown dynamics.
    - line: Efficient stochastic world models for RL
      what_it_solves: Combining Transformers with VAEs to achieve high sample efficiency
        and strong performance on Atari games without lookahead search.
      what_remains_open: Applicability to continuous control or embodied tasks not
        shown; comparison to search-based methods under same compute budget is missing;
        training time advantage may not hold on more complex domains.
    - line: Benchmarks for spatial and memory consistency in world models
      what_it_solves: Providing datasets and metrics (e.g., loop-based navigation,
        scene graph consistency, memory consistency scores) to evaluate whether world
        models maintain coherent internal representations over time and across viewpoints.
      what_remains_open: Correlation between benchmark scores and downstream task
        performance is not established; benchmarks are limited to simulated or game
        environments (Minecraft, custom videos); real-world deployment gaps remain.
    consensus:
    - World models are predominantly built as generative video models or latent dynamics
      models trained on visual observations.
    - Auxiliary tasks such as depth prediction, mask reconstruction, or keypoint dynamics
      are commonly used to inject structure and improve prediction quality.
    - Evaluation is shifting from pure reconstruction quality to task-oriented metrics,
      including policy performance and consistency measures.
    - Diffusion-based architectures and Transformers are becoming the default backbones
      across driving, robotics, and game domains.
    disagreements:
    - 'Supervision: some works rely solely on video prediction loss, while others
      incorporate explicit physics knowledge or coupled action diffusion.'
    - 'Interaction mode: models are used either as simulators for policy training,
      as planners generating future frames, or as evaluation tools for consistency
      checking.'
    - 'Evaluation target: visual fidelity (FID, LPIPS) versus downstream task success
      versus memory/spatial consistency scores—there is no agreed-upon primary metric.'
    - 'Deployment setting: most robotic models are validated only in simulation, whereas
      driving models are tested on real-world datasets but not in closed-loop physical
      driving.'
    open_questions:
    - How can we verify that improvements in world model consistency or video quality
      lead to safer and more reliable real-world behavior?
    - What benchmarks can capture compositional generalization to novel objects, actions,
      and environments without requiring exhaustive data collection?
    - Under what conditions do physics-informed losses provide benefits over pure
      data-driven video generation, and how can we measure physical plausibility beyond
      visual appearance?
    - Can unified video-action models scale to long-horizon manipulation tasks while
      maintaining real-time inference, and how should they be evaluated against modular
      approaches?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 利用扩散变换器与掩码重建实现长时域、多视角视频预测，用于驾驶场景预测和闭环仿真。
      尚未覆盖: 仿真收益与真实安全结果的一致性；跨不同驾驶数据集和传感器配置的零样本迁移仅得到部分验证。
    - 路线: 基于视频生成的机器人世界模型
      解决的问题: 从语言指令和机器人数据学习组合式或物理信息驱动的视频生成，支持操作任务的策略训练与想象。
      尚未覆盖: 对全新物体-动作组合的泛化；在真实机器人上的部署；依赖准确的语言解析或可观测物理参数。
    - 路线: 统一视频-动作扩散用于机器人预训练
      解决的问题: 在单个Transformer中联合建模视频和动作序列，灵活表示策略、动力学和视频生成，并能利用无动作数据。
      尚未覆盖: 向更复杂、长时域任务的可扩展性；真实环境中策略鲁棒性的验证；独立扩散时间步相对于简单条件化方案的收益未充分消融。
    - 路线: 上下文世界模型用于零样本动力学泛化
      解决的问题: 将可观测上下文变量融入潜在动力学模型（如Dreamer），实现对未见物理参数的控制任务零样本策略迁移。
      尚未覆盖: 假设上下文可观测，现实中常不成立；仅在CARL基准的两个任务上评估；未处理完全未知动力学的泛化。
    - 路线: 高效随机世界模型用于强化学习
      解决的问题: 结合Transformer与VAE，在Atari游戏上实现高样本效率和强性能，无需前瞻搜索。
      尚未覆盖: 未展示在连续控制或具身任务上的适用性；缺少与基于搜索方法在相同计算预算下的比较；训练时间优势在更复杂领域可能不成立。
    - 路线: 世界模型的空间与记忆一致性基准
      解决的问题: 提供数据集和指标（如循环导航、场景图一致性、记忆一致性分数），评估世界模型是否在时间和视角变化下保持连贯的内部表示。
      尚未覆盖: 基准分数与下游任务性能的相关性未建立；基准限于模拟或游戏环境（Minecraft、定制视频）；真实世界部署差距仍存在。
    共识:
    - 世界模型主要构建为在视觉观测上训练的生成式视频模型或潜在动力学模型。
    - 深度预测、掩码重建或关键点动力学等辅助任务被广泛用于注入结构并提升预测质量。
    - 评估正从纯重建质量转向任务导向指标，包括策略性能和一致性度量。
    - 扩散架构和Transformer正成为驾驶、机器人和游戏领域的默认骨干网络。
    分歧:
    - 监督信号：部分工作仅依赖视频预测损失，其他则融入显式物理知识或耦合动作扩散。
    - 交互模式：模型被用作策略训练的模拟器、生成未来帧的规划器，或用于一致性检查的评估工具。
    - 评测目标：视觉保真度（FID、LPIPS）对比下游任务成功率对比记忆/空间一致性分数——尚无公认的主要指标。
    - 部署环境：多数机器人模型仅在仿真中验证，而驾驶模型在真实数据集上测试但未进行闭环物理驾驶。
    开放问题:
    - 如何验证世界模型一致性或视频质量的提升能带来更安全、更可靠的现实行为？
    - 哪些基准能够捕捉对新颖物体、动作和环境的组合泛化，而无需穷举数据收集？
    - 在什么条件下物理信息损失比纯数据驱动视频生成更有优势，以及如何超越视觉表象衡量物理合理性？
    - 统一视频-动作模型能否扩展到长时域操作任务并保持实时推理，应如何与模块化方法进行对比评估？
