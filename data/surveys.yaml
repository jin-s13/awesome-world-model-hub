  related_work_outline:
  - 'Mainstream direction: Generative world models are being specialized for domain
    applications such as driving scene prediction, robot manipulation, and interactive/game-like
    evaluation, using diffusion transformers or latent dynamics to generate future
    observations or imagined rollouts.'
  - 'Shared research pattern: Most work learns future video, latent state, or coupled
    video-action dynamics from action-conditioned sequences, then evaluates generalization
    through zero-shot datasets, long-horizon rollout, physical plausibility, downstream
    policy quality, or consistency/control benchmarks.'
  - 'Key differences: They differ in representation and generation target such as
    compact recurrent state-space models, explicit RGB video generation, or unified
    video-action diffusion; in supervision signals such as self-supervised reconstruction,
    physics-informed depth/keypoints, and context conditioning; and in evaluation
    settings spanning driving datasets, RL benchmarks, robot data, and navigation
    benchmarks.'
  - 'Trend evolution: Within the available 2023-2026 frontier evidence, the field
    is moving from efficient model-based reinforcement learning on game-style benchmarks
    toward large video/diffusion world models for driving and robotics, with newer
    benchmark work targeting memory consistency and action-control evaluation.'
  - 'Open questions: Whether prediction fidelity transfers to real-world safety and
    control remains unclear; whether models generalize across embodiments, action
    spaces, and primitives is unresolved; and how to jointly certify long-horizon
    memory, physical plausibility, and causal controllability is still open.'
  related_work_outline_zh:
  - 主流方向：世界模型正向驾驶、机器人、交互/游戏等领域应用专用化，采用扩散Transformer或潜在动力学生成未来观测或想象轨迹。
  - 研究共性：多数工作从动作条件序列学习未来视频、潜在状态或视频-动作联合动力学，并通过零样本、长时域、物理合理性、下游策略或一致性/控制基准评测泛化。
  - 关键差异：表示与生成目标不同，如紧凑循环状态空间、RGB视频生成、统一视频-动作扩散；监督信号包括自监督重建、深度/关键点物理信息、上下文条件；评测场景涵盖驾驶数据、RL基准、机器人数据和导航基准。
  - 趋势演进：在2023-2026前沿证据内，领域正从游戏基准上的高效模型强化学习走向驾驶与机器人的大规模视频/扩散世界模型，并出现面向记忆一致性与动作控制的新基准。
  - 开放问题：预测保真度能否迁移到真实安全与控制，模型能否跨本体、动作空间和原语泛化，以及如何同时认证长时记忆、物理合理性和因果可控性。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon scene prediction
      what_it_solves: Uses world models for driving scene prediction, long-horizon
        rollout, and zero-shot generalization across driving datasets.
      what_remains_open: Whether video prediction improvements align with real-world
        driving safety or operational outcomes is not established, and closed-loop
        evaluation beyond prediction metrics remains limited.
    - line: Robot video world models with action or physics conditioning
      what_it_solves: Generates robot videos or plans from language, goal images,
        physics-informed cues, or coupled action-video diffusion; supports policy
        and dynamics learning from robot data.
      what_remains_open: Generalization to novel primitives, embodiments, and physical
        contexts is unresolved, and real-robot execution evidence is uneven or limited
        to simulation.
    - line: Model-based reinforcement learning with latent world models
      what_it_solves: Trains policies on imagined latent trajectories to improve sample
        efficiency and zero-shot dynamics generalization in control or game-like settings.
      what_remains_open: Context observability assumptions are strong and evaluation
        remains narrow; long-horizon visual fidelity and coverage of complex domain
        applications are not fully demonstrated.
    - line: Benchmarks for world-model memory consistency and action controllability
      what_it_solves: Evaluates spatial or memory consistency and action control through
        loop-based navigation or open-domain closed-loop video benchmarks.
      what_remains_open: Metrics have not been tied to downstream task utility across
        driving, robotics, and control; current models still struggle with long-term
        consistency and cross-action-space generalization.
    consensus:
    - World models are shifting from compact latent imagination models for reinforcement
      learning toward high-dimensional video generation or coupled video-action models
      that can act as domain simulators.
    - Conditioning on action, language, goal images, or context is a central design
      choice for controlling generation and policy learning.
    - 'Evaluation increasingly emphasizes generalization: zero-shot transfer across
      datasets or contexts, long-horizon rollout quality, consistency, and downstream
      policy benefit.'
    - Diffusion transformers, mask or feature reconstruction, and self-supervised
      sequence modeling are recurring methods in the current frontier.
    disagreements:
    - 'Representation level differs: compact latent state-space dynamics versus explicit
      RGB video generation versus unified video-action diffusion.'
    - 'Supervision signals differ: pure self-supervised reconstruction, physics-informed
      auxiliary tasks such as depth and keypoints, and context-conditioned reinforcement
      learning objectives.'
    - 'Evaluation targets differ: game-style aggregate scores, driving video fidelity,
      robot policy success, and memory/action-control metrics have not converged on
      a common standard.'
    - 'Deployment settings differ: some work is verified only in simulation or conditional
      generation, while other work uses driving, robot, or open-world interactive
      data, leaving real-world evidence uneven.'
    open_questions:
    - Do improvements in video prediction or latent dynamics transfer to real-world
      driving safety, robot manipulation, or operational reliability?
    - Can world models generalize across embodiments, action spaces, language primitives,
      and physical contexts without per-domain retraining?
    - How can a unified benchmark simultaneously certify long-horizon memory consistency,
      physical plausibility, and causal controllability?
    - Does pretraining on large-scale action-free video and multitask robot data produce
      robust real-robot policies beyond imitation learning, given that current real-world
      evidence is limited?
