  related_work_outline:
  - 'Mainstream direction: Recent representative work centers on generative world
    models built from diffusion transformers or stochastic sequence models, especially
    for driving and robot video prediction (e.g., MaskGWM, UWM, RoboScape).'
  - 'Shared research pattern: Methods add structured inductive biases through auxiliary
    objectives or modality coupling—mask reconstruction, depth/keypoint prediction,
    language primitives, context conditioning, or video-action diffusion.'
  - 'Key differences: The relevant sub-directions split between high-dimensional video/action
    generation, compact latent model-based RL, and consistency-oriented benchmark
    evaluation.'
  - 'Trend evolution: Within the available top-paper evidence, the frontier moves
    from sample-efficient Atari/latent world models in 2023 toward large-scale robot/driving
    video pretraining and dedicated consistency benchmarks in 2024–2026.'
  - 'Open questions: Transfer beyond reported domains, attribution of model-versus-system
    gains, novel-primitive generalization, and real closed-loop validation remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：近期代表性工作以扩散Transformer或随机序列模型构建生成式世界模型，重点覆盖驾驶与机器人视频预测（如MaskGWM、UWM、RoboScape）。
  - 研究共性：通过辅助目标或模态耦合引入结构先验，包括掩码重建、深度/关键点预测、语言原语、上下文条件化或视频-动作扩散。
  - 关键差异：主要子方向分为高维视频/动作生成、紧凑潜在模型用于基于模型的强化学习，以及面向一致性的基准评估。
  - 趋势演进：在现有高相关论文证据内，前沿从2023年样本高效的Atari/潜在世界模型转向2024–2026年大规模机器人/驾驶视频预训练和专项一致性基准如LoopNav、MIND。
  - 开放问题：跨域迁移、模型收益与系统选择归因、新原语泛化以及真实闭环验证仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion/transformer video world models with auxiliary inductive objectives
      what_it_solves: Turns world-model ideas into trainable video generation architectures
        and adds structured priors such as mask reconstruction, depth or keypoint
        prediction, and language-composed primitives to improve realism and generalization.
      what_remains_open: Which objective-induced inductive biases transfer beyond
        reported driving or robot domains, and how much visual fidelity translates
        into closed-loop control quality.
    - line: Stochastic/contextual latent world models for model-based RL
      what_it_solves: Learns compact recurrent or state-space dynamics so policies
        can be optimized on imagined rollouts, improving sample efficiency and zero-shot
        generalization under observable context.
      what_remains_open: Assumes context observability or narrow task batches, and
        the gain attributable to the learned dynamics versus the policy or planner
        prior is not isolated.
    - line: Action-coupled diffusion and planning interfaces
      what_it_solves: Couples video and action diffusion or language-conditioned plan
        generation so a world model can represent policy, forward dynamics, inverse
        dynamics, or executable video plans.
      what_remains_open: Unclear how much robustness comes from pretraining versus
        the controller/action prior; several evaluations stop at simulation rather
        than real robot deployment.
    - line: Consistency benchmarks and evaluation protocols
      what_it_solves: Provides loop-based navigation or revisited closed-loop videos
        with consistency scores to quantify spatial consistency, long-term memory,
        and action control beyond pixel-level quality.
      what_remains_open: Benchmark evidence is still new and focused on construction
        or initial baselines, leaving no standardized failure thresholds or broad
        baseline model results.
    consensus:
    - World models are shifting from compact latent rollouts toward high-dimensional
      video generation conditioned on actions, language, or context.
    - Auxiliary objectives or structural priors are widely used to improve fidelity,
      consistency, or generalization, including mask reconstruction, depth/keypoint
      signals, compositional language parsing, and video-action coupling.
    - Downstream policy learning or closed-loop evaluation is increasingly treated
      as more important than visual quality alone.
    - Evaluation is starting to target specific world-model failure modes such as
      long-term memory, spatial consistency, and action controllability.
    disagreements:
    - 'Representation choice: compact stochastic/state-space latent dynamics versus
      direct diffusion over pixels and actions.'
    - 'Supervision signal: some methods require explicit context or primitive labels,
      while others learn from action-free video or unsupervised pixel reconstruction.'
    - 'Evaluation target: results are reported across game sample efficiency, zero-shot
      dynamics generalization, driving-video quality, robot policy robustness, and
      consistency metrics with no unified protocol.'
    - 'Interaction assumptions: some approaches assume observable context or explicit
      action conditioning, while others decouple modality timesteps to handle missing
      actions.'
    open_questions:
    - Which representation and auxiliary-objective choices transfer beyond the reported
      driving, Minecraft, Atari, CARL, or robot simulation settings?
    - How much of the reported gain comes from the learned world model rather than
      auxiliary objectives, data scale, planner/controller priors, or implementation
      choices?
    - How can world models handle completely novel action or object primitives when
      compositional or context assumptions fail?
    - What level of spatial or memory consistency is required for reliable downstream
      robot or driving policy execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散/Transformer视频世界模型与辅助目标设计
      解决的问题: 把世界模型落实为可训练的视频生成架构，并通过掩码重建、深度或关键点预测、语言组合原语等结构先验提升真实感和泛化能力。
      尚未覆盖: 哪些目标诱导偏置能迁移到报告之外的驾驶或机器人领域，以及视觉真实感如何转化为闭环控制质量。
    - 路线: 随机/上下文潜在世界模型用于基于模型的强化学习
      解决的问题: 学习紧凑循环或状态空间动力学，使策略能在想象轨迹上训练，从而提升样本效率和可观测上下文下的零样本泛化。
      尚未覆盖: 依赖上下文可观测或任务范围较窄；尚未分离学到的动力学与策略或规划器先验的收益。
    - 路线: 动作耦合扩散与规划接口
      解决的问题: 耦合视频与动作扩散或语言条件化规划生成，使世界模型可表示策略、前向动力学、逆向动力学或可执行的视频规划。
      尚未覆盖: 鲁棒性有多少来自预训练而非控制器或动作先验尚不清楚；部分评估停留在仿真而非真实机器人部署。
    - 路线: 世界模型一致性基准与评测协议
      解决的问题: 通过循环导航或闭环回访视频和一致性分数，量化空间一致性、长期记忆和动作可控性，而不只看像素级质量。
      尚未覆盖: 基准证据仍较新，集中于构建或初步基线，尚未形成统一的失败阈值和广泛基线模型结果。
    共识:
    - 世界模型正从紧凑潜在推演转向以动作、语言或上下文为条件的高维视频生成。
    - 辅助目标或结构先验被广泛用于提升保真度、一致性或泛化，包括掩码重建、深度/关键点信号、语言组合解析和视频-动作耦合。
    - 下游策略学习或闭环评估越来越比单独的视觉质量更受重视。
    - 评测开始专门针对长期记忆、空间一致性和动作可控性等世界模型失效模式。
    分歧:
    - 表示选择：紧凑随机或状态空间潜在动力学与直接对像素和动作进行扩散。
    - 监督信号：部分方法依赖显式上下文或原语标签，部分方法从无动作视频或无监督像素重建中学习。
    - 评测目标：游戏样本效率、零样本动力学泛化、驾驶视频质量、机器人策略鲁棒性和一致性指标之间尚无统一协议。
    - 交互假设：部分方法假设上下文可观测或显式动作条件，部分方法通过分离模态时间步处理缺失动作。
    开放问题:
    - 哪些表示和辅助目标选择能迁移到报告之外的驾驶、Minecraft、Atari、CARL或机器人仿真场景？
    - 报告中的收益有多少来自世界模型本身，而不是辅助目标、数据规模、规划器或控制器先验及实现选择？
    - 当组合或上下文假设失效时，世界模型如何处理完全新颖的动作或物体原语？
    - 可靠的下游机器人或驾驶策略需要何种程度的空间一致性和记忆一致性？
