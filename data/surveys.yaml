  related_work_outline:
  - 'Mainstream direction: generative world models that combine diffusion and Transformer
    architectures for video prediction, action-conditioned generation, and embodied
    decision-making.'
  - 'Shared research pattern: self-supervised learning of environment dynamics from
    video, often augmented with action, language, or physics priors, to produce rollouts
    usable for policy learning or planning.'
  - 'Key differences: architectural choices (mask reconstruction vs. VAE vs. physics-informed
    latent), reliance on action labels, evaluation target (visual fidelity vs. downstream
    task performance), and domain (driving, gaming, robotics).'
  - 'Trend evolution: from single-task Atari/RL settings (2023) to large-scale multi-task
    robotic pretraining with unified video-action diffusion (2025–2026), with growing
    emphasis on spatial-temporal consistency and memory benchmarks.'
  - 'Open questions: long-term memory consistency across viewpoints, generalization
    across action spaces, quantification of physical plausibility, and isolation of
    method contribution from planner or dataset effects.'
  related_work_outline_zh:
  - 主流方向：融合扩散与Transformer的生成式世界模型，用于视频预测、动作条件生成和具身决策。
  - 研究共性：从视频自监督学习环境动力学，常结合动作、语言或物理先验，生成的推演用于策略学习或规划。
  - 关键差异：架构选择（掩码重建 vs VAE vs 物理信息隐变量）、对动作标签的依赖、评测目标（视觉保真度 vs 下游任务性能）以及应用领域（驾驶、游戏、机器人）。
  - 趋势演进：从2023年单任务Atari/RL场景，到2025–2026年大规模多任务机器人预训练与统一视频-动作扩散，时空一致性和记忆基准受到更多关注。
  - 开放问题：跨视角长期记忆一致性、跨动作空间泛化、物理合理性的量化，以及方法贡献与规划器或数据集效应的分离。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Instantiating world-model ideas into concrete architectures,
        losses, and training recipes (e.g., diffusion transformers with mask reconstruction,
        VAE-based stochastic models, physics-informed keypoint dynamics).
      what_remains_open: Which architectural choices transfer beyond the reported
        task family; how to quantify physical plausibility alongside visual fidelity;
        and whether designs generalize to open-world scenarios with diverse action
        spaces.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by coupling video
        generation with action diffusion, conditioning on context variables, or using
        model rollouts to train policies.
      what_remains_open: How much of the gain comes from the representation versus
        the planner or controller; whether models can handle entirely unseen action
        spaces without retraining; and the degree to which action-free video data
        can substitute for labeled interactions.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects through benchmarks that measure spatial consistency,
        memory consistency, and action controllability.
      what_remains_open: Whether existing benchmarks isolate the proposed method from
        surrounding system choices; limited coverage of real-world physical variability
        and long-term closed-loop consistency; and the absence of standardized evaluation
        for cross-domain generalization.
    consensus:
    - Diffusion and Transformer variants are the dominant backbone for world models,
      enabling high-fidelity video generation and multi-step rollout.
    - Self-supervised learning on video frames, with or without action labels, is
      the primary training paradigm for capturing environment dynamics.
    - Multimodal conditioning (language instructions, goal images, action sequences)
      improves controllability and generalization to novel tasks.
    - Closed-loop evaluation that measures consistency across time and viewpoints
      is emerging as a necessary complement to pixel-level metrics.
    disagreements:
    - 'Representation: some models use stochastic latent variables (VAE-based) while
      others employ deterministic diffusion with mask reconstruction, leading to different
      trade-offs in sample quality and training stability.'
    - 'Supervision: methods differ in their reliance on action labels—some require
      explicit action-conditioning for planning, while others leverage action-free
      video to learn dynamics and later fine-tune with actions.'
    - 'Evaluation target: one line prioritizes visual fidelity and realism of generated
      videos, another focuses on downstream task performance of policies trained on
      model rollouts.'
    - 'Interaction mode: certain approaches are designed for open-domain video imagination,
      others are tightly coupled with a specific controller or planner, and some remain
      purely generative without explicit action interfaces.'
    - 'Deployment setting: most work is validated in simulation or curated datasets
      (Atari, CARL, Nuscenes, Minecraft), leaving open the question of zero-shot transfer
      to real-world robotic platforms.'
    open_questions:
    - How can world models maintain long-term memory consistency and spatial coherence
      across multiple viewpoints and extended horizons?
    - What mechanisms enable generalization across diverse action spaces without retraining,
      and how should such generalization be quantified?
    - Can we design metrics that jointly capture visual quality, physical plausibility,
      and action controllability, and are those metrics predictive of real-world performance?
    - To what extent do improvements in generation quality translate into better policy
      learning, and how can we isolate the contribution of the world model from the
      planner or dataset?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念落实为具体架构、损失函数和训练配方（如扩散Transformer掩码重建、基于VAE的随机模型、物理信息关键点动力学）。
      尚未覆盖: 哪些架构选择能迁移到报告任务族之外；如何量化物理合理性同时兼顾视觉保真度；设计能否泛化到动作空间多样的开放世界场景。
    - 路线: 规划与动作接口方法
      解决的问题: 通过耦合视频与动作扩散、上下文变量条件化或模型推演训练策略，将学习到的动力学连接到决策。
      尚未覆盖: 收益有多大比例来自表示而非规划器或控制器；模型能否无需重训练就处理完全未知的动作空间；无动作视频数据能在多大程度上替代带标签交互。
    - 路线: 方法证据与消融协议
      解决的问题: 通过测量空间一致性、记忆一致性和动作可控性的基准，分离方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 现有基准是否隔离了方法贡献与周边系统选择；真实世界物理变异和长期闭环一致性的覆盖不足；缺乏跨领域泛化的标准化评估。
    共识:
    - 扩散模型和Transformer变体是当前世界模型的主导架构，支撑高保真视频生成和多步推演。
    - 以视频帧为输入的自监督学习，无论是否使用动作标签，是捕获环境动力学的主要训练范式。
    - 多模态条件（语言指令、目标图像、动作序列）提升了可控性并增强了对新任务的泛化。
    - 超越像素级指标，衡量时间和视角一致性的闭环评估正成为必要补充。
    分歧:
    - 表示方式：有的使用随机隐变量（VAE类），有的使用确定性扩散与掩码重建，在样本质量和训练稳定性上各有权衡。
    - 监督信号：方法对动作标签的依赖程度不同——有些需要显式动作条件进行规划，有些则利用无动作视频学习动力学后续再用动作微调。
    - 评测目标：部分工作优先考虑生成视频的视觉保真度与真实感，另一部分则关注在模型推演上训练的策略下游任务性能。
    - 交互模式：有些方法面向开放域视频想象，有些与特定控制器或规划器紧密耦合，还有一些保持纯生成形态缺乏显式动作接口。
    - 部署场景：多数工作仅在仿真或策展数据集（Atari、CARL、Nuscenes、Minecraft）上验证，向真实机器人平台的零样本迁移仍为开放问题。
    开放问题:
    - 世界模型如何跨多视角和长时间范围保持记忆一致性与空间连贯性？
    - 何种机制能无需重训练就泛化至多样化的动作空间，且该泛化能力应如何量化？
    - 能否设计出能同时捕捉视觉质量、物理合理性和动作可控性的指标，且这些指标能预测真实世界性能？
    - 生成质量的提升在多大程度上转化为更好的策略学习，如何隔离世界模型贡献与规划器或数据集效应？
