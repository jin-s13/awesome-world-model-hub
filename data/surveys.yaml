  related_work_outline:
  - 'Mainstream direction: World models are being applied to driving, robotics, and
    games via diffusion-based video generation, action-conditioned prediction, and
    physical priors, aiming to improve generalization and policy learning.'
  - 'Shared research pattern: Most works adopt generative architectures (diffusion
    Transformers, VAE-Transformer hybrids) with self-supervised or pretraining objectives,
    and evaluate on diverse domain-specific benchmarks.'
  - 'Key differences: They diverge in representation (pure diffusion, diffusion +
    VAE, joint video-action diffusion), physics integration (depth/keypoint losses
    vs. none), and evaluation focus (visual fidelity, policy performance, memory consistency).'
  - 'Trend evolution: The field moved from Atari game world models to complex embodied
    and driving domains, with 2024–2026 adding physics-informed joint modeling, action
    diffusion, and dedicated benchmarks for memory and spatial consistency.'
  - 'Open questions: It remains unclear whether simulation gains transfer to real-world
    safety and deployment, and how to achieve long-term memory consistency, cross-embodiment
    generalization, and standardized evaluation.'
  related_work_outline_zh:
  - 主流方向：基于扩散生成、动作条件预测和物理先验的世界模型被应用于驾驶、机器人和游戏，旨在提升泛化与策略学习。
  - 研究共性：多数工作采用生成式架构（扩散Transformer或VAE-Transformer混合），结合自监督或预训练目标，并在特定领域基准上评估。
  - 关键差异：在表示方式（纯扩散、扩散+VAE、视频-动作联合扩散）、物理整合方式（深度/关键点损失 vs. 无）和评估重点（视觉保真度、策略性能、记忆一致性）上存在分歧。
  - 趋势演进：从Atari游戏世界模型扩展到复杂具身和驾驶领域，2024-2026年出现了物理信息联合建模、动作扩散以及针对记忆和空间一致性的专用基准。
  - 开放问题：仿真收益能否迁移到真实安全与部署，如何实现长期记忆一致性、跨本体泛化和标准化评估，仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Generating driving scene videos for long-horizon, multi-view
        prediction and zero-shot cross-dataset transfer, enabling closed-loop simulation
        and policy evaluation.
      what_remains_open: Alignment with real-world driving safety and operational
        outcomes is unverified; video generation quality under sensor noise and corner
        cases is not addressed.
    - line: Embodied robot world models
      what_it_solves: Enabling robot imagination, policy learning, and cross-task
        generalization through compositional video generation, physics-informed synthesis,
        or joint video-action diffusion pretraining on large robot datasets.
      what_remains_open: Real-robot deployment validation is missing; compositional
        generalization is limited to seen primitives; physics-informed models rely
        on depth and keypoints without real-world physical interaction; cross-embodiment
        transfer is unproven.
    - line: Interactive agents and game world models
      what_it_solves: Learning efficient world models for sample-efficient reinforcement
        learning in discrete-action games and continuous control tasks, with zero-shot
        generalization to unseen dynamics via context conditioning or Transformer-VAE
        architectures.
      what_remains_open: Generalization under changing environment rules, goals, or
        user interactions; long-term memory consistency; scalability from simple games
        to complex continuous control.
    - line: World model evaluation benchmarks
      what_it_solves: Providing standardized datasets and metrics (spatial consistency,
        memory consistency, action control) to diagnose core capabilities of world
        models in open-domain, closed-loop settings.
      what_remains_open: Correlation between benchmark metrics and downstream task
        performance is unknown; benchmark coverage is limited; their ability to guide
        model improvement is not yet demonstrated.
    consensus:
    - World model applications increasingly integrate video generation, policy learning,
      and physical plausibility into unified frameworks.
    - Diffusion models and Transformers are the dominant architectural backbones across
      domains.
    - Generalization is a central goal, with efforts targeting zero-shot, compositional,
      and cross-domain transfer.
    - Large-scale, diverse datasets are used for pretraining or evaluation, and self-supervised/generative
      objectives are common.
    disagreements:
    - 'Representation choices differ: pure diffusion, diffusion combined with VAEs,
      or joint video-action diffusion within a single transformer.'
    - 'Physics integration varies: some use explicit depth and keypoint dynamics losses,
      while others rely solely on data-driven video generation.'
    - 'Evaluation targets are not aligned: works emphasize visual fidelity, downstream
      policy performance, spatial consistency, or memory consistency, with no unified
      metric.'
    - 'Interaction modes diverge: most models generate open-loop video, while newer
      benchmarks demand closed-loop action control.'
    - Deployment settings are fragmented (driving, tabletop manipulation, Atari, Minecraft),
      making cross-domain comparison difficult.
    open_questions:
    - How can simulation fidelity be translated into real-world task success and safety
      guarantees?
    - What are the fundamental limits of current architectures in maintaining long-term
      memory and spatial consistency?
    - Which representations or training strategies enable generalization across distinct
      embodiments and environments?
    - Can physics-informed world models reliably substitute for real physical interaction
      in policy learning?
    - Will current evaluation benchmarks drive meaningful improvements in core world
      model capabilities, or are they decoupled from practical requirements?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 生成驾驶场景视频，实现长时域、多视角预测和跨数据集零样本迁移，支持闭环仿真与策略评估。
      尚未覆盖: 与真实驾驶安全及运营结果的一致性未经验证；视频生成在传感器噪声和极端工况下的质量未讨论。
    - 路线: 具身机器人世界模型
      解决的问题: 通过组合视频生成、物理信息合成或视频-动作联合扩散预训练，实现机器人想象、策略学习和跨任务泛化。
      尚未覆盖: 缺少真实机器人部署验证；组合泛化仅限于训练原语；物理信息模型依赖深度和关键点，未对标真实物理交互；跨本体迁移未证明。
    - 路线: 交互式智能体与游戏世界模型
      解决的问题: 在离散动作游戏和连续控制任务中学习高效世界模型，通过上下文条件化或Transformer-VAE架构实现样本高效的强化学习和零样本泛化。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化；长期记忆一致性；从简单游戏到复杂连续控制的扩展性。
    - 路线: 世界模型评估基准
      解决的问题: 提供标准化数据集和指标（空间一致性、记忆一致性、动作控制），在开放域闭环设定下诊断世界模型的核心能力。
      尚未覆盖: 基准指标与下游任务性能的相关性未知；基准覆盖范围有限；其对模型改进的指导作用尚未显现。
    共识:
    - 世界模型应用正将视频生成、策略学习和物理合理性整合到统一框架中。
    - 扩散模型和Transformer是跨领域的主流架构骨架。
    - 泛化是核心目标，研究致力于零样本、组合和跨域迁移。
    - 大规模多样化数据集被用于预训练或评估，自监督/生成式目标被普遍采用。
    分歧:
    - 表示方式不同：纯扩散、扩散结合VAE，或单一Transformer内的视频-动作联合扩散。
    - 物理整合程度不一：有的显式使用深度和关键点动力学损失，有的仅依赖数据驱动的视频生成。
    - 评估目标不一致：工作分别强调视觉保真度、下游策略性能、空间一致性或记忆一致性，缺乏统一指标。
    - 交互模式各异：多数模型生成开环视频，而较新的基准要求闭环动作控制。
    - 部署场景碎片化（驾驶、桌面操作、Atari、Minecraft），跨域比较困难。
    开放问题:
    - 如何将仿真保真度转化为真实世界任务成功率和安全保障？
    - 当前架构在维持长期记忆和空间一致性方面的根本限制是什么？
    - 哪些表示或训练策略能实现跨不同本体和环境的泛化？
    - 物理信息世界模型能否替代真实物理交互以支持策略学习？
    - 现有评估基准能否推动世界模型核心能力的实质进步，还是与实用需求脱节？
