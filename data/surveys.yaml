  related_work_outline:
  - 'Mainstream direction: Application-driven world models now center on long-horizon
    video or latent-state prediction conditioned on actions, language, or context
    for driving, robotics, and interactive environments, often using diffusion or
    transformer architectures.'
  - 'Shared research pattern: Methods add domain-specific inductive biases such as
    mask reconstruction, physics/depth/keypoint objectives, contextual latent dynamics,
    or primitive composition to improve fidelity, generalization, or data efficiency.'
  - 'Key differences: Work splits between control-oriented latent world models for
    policy learning, generative video world models for robot or driving simulation,
    and benchmark-driven evaluation of memory and action consistency, with different
    supervision and evaluation targets.'
  - 'Trend evolution: Visible evidence clusters in 2023-2026, moving from sample-efficient
    Atari/contextual RL toward large-scale diffusion/transformer pretraining, embodied
    robotics, driving scenes, and explicit consistency benchmarks.'
  - 'Open questions: Real-world transfer, unobserved context, generalization to novel
    primitives, long-term memory consistency, and alignment between benchmark gains
    and safety or operational outcomes remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：应用驱动世界模型当前聚焦于以动作、语言或上下文为条件的长时间视频或潜在状态预测，用于驾驶、机器人和交互环境，常采用扩散或Transformer架构。
  - 研究共性：方法加入领域特定归纳偏置，如掩码重建、物理/深度/关键点目标、上下文潜在动力学或原语组合，以提升保真度、泛化或数据效率。
  - 关键差异：研究分成面向策略学习的控制型潜在世界模型、面向机器人或驾驶仿真的生成式视频世界模型，以及面向记忆与动作一致性的基准评测，监督信号和评测目标不同。
  - 趋势演进：可见证据集中于2023-2026年，从样本高效的Atari和上下文强化学习转向大规模扩散/Transformer预训练、具身机器人、驾驶场景和明确一致性基准。
  - 开放问题：真实世界迁移、不可观测上下文、新原语泛化、长期记忆一致性，以及基准收益与安全或运营结果之间的一致性仍缺乏证据。
  literature_review:
    line_of_work_matrix:
    - line: Domain-conditioned dynamics learning for control
      what_it_solves: Learns latent dynamics or world-model rollouts conditioned on
        observable context or high-dimensional observations to improve sample efficiency
        and zero-shot policy generalization in interactive tasks.
      what_remains_open: Evaluation is limited to narrow benchmarks such as CARL tasks
        or Atari, and context observability assumptions do not cover unobserved or
        fully unknown dynamics.
    - line: Compositional and physics-informed video generation for robot imagination
      what_it_solves: Generates action- or instruction-conditioned robot videos by
        factorizing language into primitives or adding physics/geometry auxiliary
        objectives, supporting planning, policy training, and evaluation.
      what_remains_open: Generalization is constrained to seen primitive combinations
        or simulated evaluation; real-robot execution and wholly novel physical primitives
        remain unverified.
    - line: Autonomous driving world models
      what_it_solves: Predicts long-horizon multi-view driving videos using mask-reconstruction
        and diffusion objectives to support scene prediction and simulation across
        driving datasets.
      what_remains_open: Evidence shows dataset-level gains, but alignment with real
        driving safety or operational outcomes and limitation details are not reported.
    - line: Memory and action consistency benchmarking in interactive environments
      what_it_solves: Provides open-domain looped navigation or revisited-video benchmarks
        with spatial or memory consistency scores to evaluate long-term coherence
        and action control in world models.
      what_remains_open: Current models still struggle with long-term memory and cross-action-space
        generalization; LoopNav reports no experimental results, leaving comparative
        evidence incomplete.
    consensus:
    - Application-oriented world models increasingly use conditional generative architectures—diffusion,
      transformers, or stochastic latent models—to predict future observations or
      latent states from actions, language, or context.
    - Domain-specific auxiliary objectives and inductive biases are used to improve
      physical plausibility, geometric consistency, long-horizon prediction, or compositional
      generalization.
    - Evaluation is expanding from short-horizon generation quality toward long-term
      consistency, memory, action controllability, and zero-shot or compositional
      generalization.
    - Pre-training or training on large and diverse datasets is treated as a route
      to more general embodied policies or simulators, though real-world evidence
      remains thin.
    disagreements:
    - 'Representation: stochastic latent state-space rollouts, diffusion/transformer
      video generation, joint video-action diffusion, and factorized primitive-level
      video generators coexist.'
    - 'Supervision: some work learns from action-free video or language instructions;
      others require observable context, action-labeled interaction, or physics/depth/keypoint
      auxiliary signals.'
    - 'Evaluation target: sample-efficient Atari or CARL control scores, driving dataset
      fidelity, robot video quality and policy utility, or open-domain memory and
      action consistency are optimized separately.'
    - 'Deployment setting: simulation-only robot evaluation, closed-loop game or benchmark
      evaluation, and driving dataset validation create different external-validity
      claims.'
    open_questions:
    - Do dataset-level improvements in driving world models transfer to real safety
      or operational outcomes? The available evidence does not report such alignment.
    - Can robot world models handle completely novel primitives, unobserved context,
      or real-world execution rather than only trained primitive combinations and
      simulation?
    - What representations or memory mechanisms allow world models to maintain long-term
      spatial and memory consistency across action spaces and extended horizons?
    - How should benchmarks balance visual fidelity, downstream policy utility, and
      physical plausibility when current evidence often reports only a subset of these
      dimensions?
    - Several application papers lack visible limitation or real-world deployment
      evidence, making it difficult to assess failure modes and reproducibility beyond
      benchmark scores.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向控制的领域条件动力学学习
      解决的问题: 在交互任务中学习以可观测上下文或高维观测为条件的潜在动力学或世界模型推演，提升样本效率和策略零样本泛化。
      尚未覆盖: 评测集中于CARL或Atari等窄基准；上下文可观测假设无法覆盖不可观测或完全未知的动力学场景。
    - 路线: 面向机器人想象的组合式与物理信息视频生成
      解决的问题: 通过将语言分解为原语或引入物理/几何辅助目标，生成以动作或指令为条件的机器人视频，支持规划、策略训练和评估。
      尚未覆盖: 泛化限于已见原语组合或仿真评测；真实机器人执行和全新物理原语仍未验证。
    - 路线: 自动驾驶世界模型
      解决的问题: 使用掩码重建和扩散目标预测长时域多视角驾驶视频，用于驾驶场景预测与仿真。
      尚未覆盖: 证据显示数据集层面提升；与真实驾驶安全或运营结果的一致性以及局限性细节尚未报告。
    - 路线: 交互环境中的记忆与动作一致性基准
      解决的问题: 提供开放域循环导航或重访视频基准，用空间或记忆一致性分数评估世界模型的长期一致性和动作控制。
      尚未覆盖: 当前模型仍难以维持长期记忆并跨动作空间泛化；LoopNav未报告实验结果，比较证据不完整。
    共识:
    - 应用世界模型越来越多采用条件生成架构（扩散、Transformer或随机潜在模型），根据动作、语言或上下文预测未来观测或潜在状态。
    - 领域特定辅助目标与归纳偏置被用于提升物理合理性、几何一致性、长时域预测或组合泛化。
    - 评测正从短期生成质量扩展向长期一致性、记忆、动作可控性及零样本或组合泛化。
    - 大规模或多样数据上的预训练或训练被视为获得更通用具身策略或仿真器的路径，但真实世界证据仍较少。
    分歧:
    - 表示方式：随机潜在状态空间推演、扩散/Transformer视频生成、视频-动作联合扩散、以及分解式原语级视频生成并存。
    - 监督信号：部分工作利用无动作视频或语言指令；另一些依赖可观测上下文、动作标注交互或物理/深度/关键点辅助信号。
    - 评测目标：样本高效的Atari或CARL控制分数、驾驶数据保真度、机器人视频质量与策略效用，或开放域记忆与动作一致性各不相同。
    - 部署场景：仅仿真机器人评测、闭环游戏或基准评测和驾驶数据集验证形成不同的外部效度主张。
    开放问题:
    - 驾驶世界模型的数据集层面提升是否会转化为真实安全或运营结果？现有证据未报告这种对应关系。
    - 机器人世界模型能否处理全新原语、不可观测上下文或真实世界执行，而不仅是已见原语组合和仿真？
    - 哪些表示或记忆机制能让世界模型在跨动作空间和长时域下维持空间与记忆一致性？
    - 当前证据往往只报告视觉保真度、下游策略效用或物理合理性的部分维度，应如何建立更平衡的评测？
    - 多篇应用论文缺少可见的局限性或真实部署证据，难以从分数之外评估失败模式与可复现性。
