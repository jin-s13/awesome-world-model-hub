  related_work_outline:
  - 'Mainstream direction: Recent world-model methods center on generative video diffusion
    or transformer architectures with auxiliary mask, physics, language, context,
    or action objectives for driving, robotics, and model-based RL.'
  - 'Shared research pattern: Papers add an auxiliary learning signal or coupled modality
    to improve long-horizon fidelity, physical plausibility, controllability, or zero-shot
    generalization beyond single-step prediction.'
  - 'Key differences: Representation spans stochastic latent state-space models and
    video diffusion transformers; supervision spans observable context, language primitives,
    physics tasks, and action-video coupling; evaluation spans RL, driving, robot,
    and Minecraft benchmarks.'
  - 'Trend evolution: Evidence is concentrated in the 2023–2026 frontier, moving from
    sample-efficient stochastic world models toward large-scale generative and action-coupled
    world models, with new consistency-oriented benchmarks emerging in 2025–2026.'
  - 'Open questions: Transferability of auxiliary objectives, long-term memory and
    spatial consistency, cross-action generalization, and whether reported gains isolate
    the model from dataset, planner, and evaluation choices remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期世界模型方法以生成式视频扩散或Transformer架构为主，并结合掩码、物理、语言、上下文或动作目标，应用于驾驶、机器人和基于模型的强化学习。
  - 研究共性：通过辅助学习信号或耦合模态提升长时域保真度、物理合理性、可控性或零样本泛化，而非只做单步预测。
  - 关键差异：表示涵盖随机潜状态空间和视频扩散Transformer；监督信号涵盖可观测上下文、语言原语、物理任务和动作-视频耦合；评测涵盖RL、驾驶、机器人和Minecraft基准。
  - 趋势演进：证据集中在2023–2026前沿，从高效随机世界模型转向大规模生成式与动作耦合世界模型，2025–2026出现一致性导向的新基准。
  - 开放问题：辅助目标的迁移性、长期记忆与空间一致性、跨动作泛化，以及报告收益是否与数据集、规划器和评测选择分离仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion/transformer generative world models with auxiliary physical
        or reconstruction tasks, e.g., MaskGWM, RoboScape
      what_it_solves: High-fidelity, long-horizon, multi-view or physics-plausible
        video generation for driving and robotic scenarios.
      what_remains_open: Transfer beyond reported datasets and auxiliary masks or
        physics tasks; missing limitations and component ablations leave contribution
        unclear.
    - line: Unified action-video diffusion world models, e.g., UWM
      what_it_solves: Representing policy, forward dynamics, inverse dynamics, and
        video generation in one transformer by controlling modality-specific diffusion
        timesteps.
      what_remains_open: Evidence on scaling across heterogeneous action spaces and
        whether the unified formulation remains robust beyond pretraining and finetuning
        settings.
    - line: Stochastic latent world models for model-based reinforcement learning,
        e.g., STORM, cRSSM
      what_it_solves: Sample-efficient policy learning via imagined rollouts; context-conditioned
        latent dynamics can improve zero-shot generalization to unseen dynamics values.
      what_remains_open: Observability of context is assumed; evaluation is narrow
        in task breadth, and gains may not disentangle model quality from planner
        or task prior.
    - line: Compositional language-conditioned world models, e.g., RoboDreamer
      what_it_solves: Zero-shot composition of seen language primitives into unseen
        task videos and goals for robot imagination.
      what_remains_open: Entirely new primitives are unsupported, parsing accuracy
        is a dependency, and real-robot execution is not demonstrated.
    - line: Consistency-oriented world-model benchmarks, e.g., LoopNav, MIND
      what_it_solves: Quantifying spatial consistency, long-term memory consistency,
        and action control beyond pixel-level similarity.
      what_remains_open: Benchmark construction is documented but current models still
        show weak long-term consistency and cross-action generalization; stronger
        baselines are needed.
    consensus:
    - Recent world-model work moves beyond single-step reconstruction toward long-horizon,
      multi-view, closed-loop, or action-conditioned generation.
    - Auxiliary objectives or coupled modalities—such as mask reconstruction, depth,
      keypoints, language primitives, context conditioning, or action diffusion—are
      used to inject physical, spatial, or control information.
    - Current models still struggle with long-term memory consistency, unseen dynamics,
      and generalization across action spaces.
    - Evaluation is shifting toward consistency and controllability metrics rather
      than only visual reconstruction quality.
    disagreements:
    - 'Representation differs: stochastic latent state-space models for imagined rollouts
      versus diffusion or transformer video generation for high-dimensional observations.'
    - 'Supervision differs: observable context conditioning, language-primitive decomposition,
      physics tasks, mask reconstruction, or joint action-video diffusion.'
    - 'Evaluation target differs: RL sample-efficiency benchmarks, driving and robot
      video realism, closed-loop navigation memory, and action-control benchmarks.'
    - 'Deployment assumptions differ: some methods require known action spaces or
      observable context, while others learn from action-free video or parsed language.'
    open_questions:
    - Which auxiliary objectives transfer beyond the reported driving, robotic, or
      Atari/CARL task families?
    - Can world models maintain long-term memory and spatial consistency under loop
      closure without external memory or scene-graph modules?
    - How should evaluations isolate the proposed model from planner, controller,
      dataset, and implementation choices?
    - What is the performance boundary for compositional or context-conditioned methods
      when encountering entirely new primitives or context values?
    - Does unified action-video diffusion remain efficient as action spaces become
      more heterogeneous across datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带辅助物理或重建任务的扩散/Transformer生成式世界模型，如MaskGWM、RoboScape
      解决的问题: 面向驾驶和机器人场景的高保真、长时域、多视角或物理合理的视频生成。
      尚未覆盖: 在报告数据集和辅助掩码/物理任务之外的迁移；缺失限制与组件消融使方法贡献难以确定。
    - 路线: 统一动作-视频扩散世界模型，如UWM
      解决的问题: 通过控制模态特定扩散时间步，在单一Transformer中表示策略、前向动力学、逆动力学和视频生成。
      尚未覆盖: 异构动作空间上的扩展性证据，以及统一公式在预训练和微调设置之外的鲁棒性。
    - 路线: 基于模型的强化学习随机潜世界模型，如STORM、cRSSM
      解决的问题: 通过想象轨迹进行样本高效策略学习；上下文条件潜动力学可改善对未见动力学值的零样本泛化。
      尚未覆盖: 假设上下文可观测；任务范围评估较窄；收益未与规划器或任务先验清晰分离。
    - 路线: 组合式语言条件世界模型，如RoboDreamer
      解决的问题: 把已见过的语言原语组合成未见任务视频和目标，用于机器人想象。
      尚未覆盖: 不支持全新原语；依赖解析准确性；尚未展示真实机器人执行。
    - 路线: 一致性导向的世界模型基准，如LoopNav、MIND
      解决的问题: 在像素相似度之外量化空间一致性、长期记忆一致性和动作控制。
      尚未覆盖: 基准构建已有记录，但当前模型长期一致性和跨动作泛化仍弱，需要更强基线。
    共识:
    - 近期工作从单步重建转向长时域、多视角、闭环或动作条件生成。
    - 通过掩码重建、深度、关键点、语言原语、上下文条件或动作扩散等辅助目标注入物理、空间或控制信息。
    - 当前模型在长期记忆一致性、未见动力学和跨动作空间泛化上仍存在不足。
    - 评测正从纯视觉重建质量转向一致性和可控性指标。
    分歧:
    - 表示方式不同：随机潜状态空间用于想象推演，扩散或Transformer视频生成用于高维观测。
    - 监督信号不同：可观测上下文条件、语言原语分解、物理任务、掩码重建或动作-视频联合扩散。
    - 评测目标不同：RL样本效率基准、驾驶与机器人视频真实感、闭环导航记忆、动作控制基准。
    - 部署假设不同：有些方法需要已知动作空间或可观测上下文，有些则利用无动作视频或语言解析。
    开放问题:
    - 哪些辅助目标能迁移到报告之外的驾驶、机器人或Atari/CARL任务族？
    - 世界模型能否在闭环条件下不依赖外部记忆或场景图模块维持长期记忆与空间一致性？
    - 评测如何将模型贡献与规划器、控制器、数据集和实现选择隔离开来？
    - 组合式或上下文条件方法遇到全新原语或上下文值时的性能边界是什么？
    - 当动作空间跨数据集变得更加异构时，统一动作-视频扩散是否仍然高效？
