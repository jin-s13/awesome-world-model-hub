  related_work_outline:
  - 'Mainstream direction: The bounded evidence centers on learning action-conditioned
    video world models for embodied and robotic settings, with recent work adding
    physics or human-preference alignment to improve rollout usefulness.'
  - 'Shared research pattern: Papers use generative sequence models, especially diffusion
    transformers or masked autoregressive models, to predict future observations from
    actions and past frames; evaluation emphasizes visual fidelity, controllability,
    planning correlation, and benchmark transfer, while formal guarantees remain sparse.'
  - 'Key differences: They differ in action-conditioning mechanisms, alignment signals
    such as learned reward, DPO-style discriminators, or test-time verifiers, and
    evaluation targets including robot manipulation, zero-shot embodiment, and spatial
    reasoning.'
  - 'Trend evolution: From 2024-2025 unified or adapter-based video world models,
    the evidence moves toward 2026 work on physical alignment, mechanistic taxonomy,
    functional benchmarks, and test-time scaling; the trend is still within the current
    frontier.'
  - 'Open questions: Formal conditions under which generated video dynamics support
    causal prediction; whether scaling and alignment gains transfer across embodiments
    and tasks; and how to evaluate physical persistence separately from visual realism.'
  related_work_outline_zh:
  - 主流方向：证据集中在面向具身与机器人场景的动作条件视频世界模型，近期进一步加入物理合理性或人类偏好对齐，以提升生成轨迹的实用性。
  - 研究共性：研究多采用扩散Transformer或掩码自回归等生成式序列模型，从动作和过去帧预测未来观测；评估注重视觉保真度、可控性、规划相关性或基准迁移，形式化保证仍较少。
  - 关键差异：差异体现在动作条件化机制、对齐监督信号（学习奖励、DPO式判别器或测试时验证器）以及评测目标（机器人操作、零样本具身、空间推理）上。
  - 趋势演进：从2024-2025年的统一或适配式视频世界模型，走向2026年的物理对齐、机制化分类、功能基准和测试时缩放；整体仍处于当前前沿内。
  - 开放问题：生成视频动态在何种形式条件下支持因果预测；缩放与对齐收益能否跨本体和任务泛化；如何将物理持久性与视觉真实感分开评测。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world model learning
      what_it_solves: Learning a unified generative model of future video, policy,
        forward dynamics, and inverse dynamics from paired action-observation data
        across robot datasets.
      what_remains_open: Formal conditions for learned video dynamics to preserve
        causal state are not stated; evaluations rely on visual fidelity, controllability,
        or task-specific planning rather than causal guarantees.
    - line: Adapter-based reuse of pretrained video generators
      what_it_solves: Converting pretrained video diffusion models into action-conditioned
        world models without accessing or finetuning model parameters, using a learned
        mask and small domain-specific data.
      what_remains_open: Requires action-labeled domain videos and inherits biases
        and limits of the closed pretrained generator; generalization beyond video
        game and robotics settings is not demonstrated.
    - line: Physics and preference alignment for world model rollouts
      what_it_solves: Post-training generated rollouts to improve physical realism,
        task completion, embodiment plausibility, and visual quality through multi-dimensional
        reward or decoupled discriminators.
      what_remains_open: Human-preference signals may be subjective and costly; evaluation
        is concentrated on contact-rich manipulation, with no formal account of when
        alignment improves downstream control.
    - line: Test-time verification and model-based spatial reasoning
      what_it_solves: Grounding model-based trajectory selection in verifiable, frame-anchored
        claims to improve spatial reasoning under test-time scaling.
      what_remains_open: Verifier calibration and action biases remain unreliable;
        consistent scaling fails on some benchmarks, suggesting an information bottleneck
        in current world models.
    - line: Conceptual taxonomy and boundary analysis
      what_it_solves: Clarifying video generation as world models through state construction
        and dynamics modeling categories, and identifying persistence and causality
        as frontiers.
      what_remains_open: The taxonomy is conceptual; the packet contains no formal
        or experimental validation that these categories change model design or evaluation.
    consensus:
    - Generative sequence models are treated as the central substrate for world models,
      predicting future observations conditioned on actions and past context.
    - Visual fidelity and action controllability are the most common evidence of model
      quality, while physical persistence and causal reasoning are recognized as under-evaluated.
    - World models are expected to support multiple downstream uses, including policy
      learning, planning, synthetic data generation, and model-based evaluation.
    - The available papers provide methodology and benchmark evidence but little formal
      theory or guarantee, leaving theory-level claims as open verification gaps.
    disagreements:
    - 'Action conditioning mechanisms differ substantially: unified video-action diffusion
      timesteps, frame-level action-conditioning modules, learned adapters on intermediate
      outputs, and heterogeneous masked autoregression.'
    - 'Alignment and reward signals differ: multi-dimensional learned video preferences,
      DPO-style decoupled physical discriminators, and test-time verifiers grounded
      in spatial assertions.'
    - 'Evaluation targets differ: contact-rich robot manipulation, spatial reasoning
      QA, simulation-to-reality policy correlation, and training-independent zero-shot
      embodiment benchmarks.'
    - 'Deployment assumptions differ: some adapt closed-source pretrained video generators
      without parameter access, while others train large open models or perform conceptual
      analysis without experiments.'
    open_questions:
    - What formal conditions must an action-conditioned video generator satisfy for
      its state and dynamics to support causal prediction and planning?
    - Do alignment and scaling gains transfer across unseen embodiments, tasks, and
      domains, or are they specific to the evaluated manipulation and reasoning benchmarks?
    - How can evaluation separate visual realism, physical persistence, and causal
      reasoning instead of using visual fidelity as a proxy?
    - Where exactly does the information bottleneck arise in test-time model-based
      reasoning, and what architecture or reward changes would remove it?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频世界模型学习
      解决的问题: 从机器人动作-观测配对数据中学习未来视频、策略、前向动力学和逆动力学的统一生成模型。
      尚未覆盖: 未说明学习到的视频动态在何种形式条件下保留因果状态；评估依赖视觉保真度、可控性或任务特定规划，而非因果保证。
    - 路线: 基于适配器的预训练视频生成器复用
      解决的问题: 在不获取或微调模型参数的情况下，用学习掩码和少量领域数据将预训练视频扩散模型转为动作条件世界模型。
      尚未覆盖: 依赖领域动作标注视频，并继承闭源预训练生成器的偏差和限制；尚未展示在视频游戏与机器人之外更广的设置中泛化。
    - 路线: 面向物理与偏好的世界模型轨迹对齐
      解决的问题: 通过多维奖励或解耦判别器对生成轨迹进行后训练，改善物理真实性、任务完成、具身合理性和视觉质量。
      尚未覆盖: 人类偏好信号可能主观且收集成本高；评估集中在接触丰富操作任务，缺少对齐何时改善下游控制的形式化说明。
    - 路线: 测试时验证与基于模型的空间推理
      解决的问题: 将基于模型的轨迹选择奖励建立在可验证、以帧为锚点的断言上，以改善空间推理中的测试时缩放。
      尚未覆盖: 验证器校准和动作偏差仍不可靠；在一些基准上无法一致缩放，表明当前世界模型存在信息瓶颈。
    - 路线: 概念分类与边界分析
      解决的问题: 通过状态构建和动态建模类别澄清视频生成即世界模型，并指出持久性与因果性两个关键前沿。
      尚未覆盖: 分类仍为概念性工作；证据包中没有正式或实验验证这些类别会改变模型设计或评测。
    共识:
    - 生成式序列模型被视为世界模型的核心基础，依赖过去上下文和动作预测未来观测。
    - 视觉保真度和动作可控性是常见质量证据，而物理持久性和因果推理被认为评测不足。
    - 世界模型被期望用于多种下游任务，包括策略学习、规划、合成数据生成和基于模型的评测。
    - 现有论文多提供方法和基准证据，形式化理论或保证较少，理论层面的主张仍是开放的验证缺口。
    分歧:
    - 动作条件化机制不同：统一视频-动作扩散时间步、帧级动作条件模块、在中间输出上学习的适配器，以及异构掩码自回归各有取向。
    - 对齐与奖励信号不同：多维学习视频偏好、DPO式解耦物理判别器和基于空间断言的测试时验证器分别体现不同监督思路。
    - 评测目标不同：接触丰富机器人操作、空间推理问答、与模拟器的策略相关性，以及训练无关的零样本具身基准强调不同能力。
    - 部署假设不同：有的适配闭源预训练视频生成器而不获取参数，有的训练大型开放模型，也有仅做概念分析而无实验。
    开放问题:
    - 动作条件视频生成器需满足何种形式条件，其状态和动态才能支持因果预测和规划？
    - 对齐和缩放收益能否跨未见本体、任务和领域泛化，还是仅限于当前评估的操作与推理基准？
    - 评测如何区分视觉真实感、物理持久性和因果推理，而不是用视觉保真度代替？
    - 测试时基于模型推理中的信息瓶颈具体来自何处，何种架构或奖励变化能消除它？
