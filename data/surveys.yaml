    研究路线矩阵:
    - 路线: 驾驶世界模型与面向仿真的场景预测
      解决的问题: 对驾驶场景进行长时域、多视角视频预测，并跨数据集零样本迁移。
      尚未覆盖: 预测或仿真质量能否转化为真实驾驶安全与操作结果；部分论文未报告局限性。
    - 路线: 具身机器人世界模型与视频-策略学习
      解决的问题: 从语言、目标、物理信号和动作生成机器人视频或计划，支持策略训练、评估和机器人数据预训练。
      尚未覆盖: 真实机器人执行证据不足；对未见语言原语、本体和物理环境的泛化仍不明确。
    - 路线: 基于潜在世界模型的高效模型强化学习
      解决的问题: 通过想象轨迹实现样本高效的视觉游戏和上下文控制策略学习；部分方法用上下文提升零样本动力学泛化。
      尚未覆盖: 评估仅覆盖少量基准任务并假设上下文可观测；更广泛任务与领域迁移未验证。
    - 路线: 记忆、空间一致性与动作控制基准
      解决的问题: 衡量世界模型在开放交互环境中是否维持场景一致性、重访视角记忆和动作对齐。
      尚未覆盖: 当前模型在长期一致性和跨动作空间泛化上仍存在困难；基准对模型覆盖仍需扩展。
    共识:
    - 世界模型的应用方式趋于一致：以动作、上下文、语言指令、目标、深度或关键点等任务相关信号为条件，生成未来观测或潜在状态。
    - 生成式架构（尤其是扩散Transformer和潜在序列模型）在驾驶、机器人和游戏/强化学习应用中反复出现。
    - 应用任务越来越不只评价视觉质量，还把控制、一致性、零样本迁移、物理合理性和策略效用作为证据。
    - 基准正在形成，用于系统揭示开放世界中的空间、记忆和动作控制失效。
    分歧:
    - 表示方式不同：有的使用潜在状态空间模型进行想象强化学习，有的直接生成像素或视频帧。
    - 监督信号不同：可观测上下文值、解析为原语的语言、深度/关键点物理目标、无动作视频或耦合的视频-动作扩散。
    - 评测目标不同：游戏基准表现、上下文零样本强化学习、驾驶视频指标、机器人仿真成功率或开放域一致性指标。
    - 交互模式不同：开环未来预测或计划合成，与闭环交互式世界仿真并存。
    开放问题:
    - 驾驶视频预测的提升能否转化为真实安全结果或运营规划？现有证据仍停留在基准层面。
    - 世界模型能否在跨视角和动作空间变化中保持长期记忆与空间一致性，而不依赖任务特定的定位或图约束？
    - 机器人世界模型能否泛化到训练中未见过的原语组合、新本体或新物理环境？
    - 哪些监督假设是必要的：可观测上下文、语言解析、物理信号和无动作视频均出现，但缺少受控比较。
