  related_work_outline:
  - 'Mainstream direction: Building dedicated benchmarks and evaluation suites for
    world models, shifting from aggregate game scores to multi-dimensional probes
    of spatial consistency, memory, action control, and physical plausibility.'
  - 'Shared research pattern: A new benchmark proposes a dataset with targeted tasks
    (loop navigation, varied action spaces) and designs a metric that captures a specific
    capability beyond pixel-level fidelity, then uses it to reveal limitations of
    current models.'
  - 'Key differences: The evaluated capabilities differ—spatial consistency in Minecraft
    vs. memory and action control in open-domain videos vs. zero-shot generalization
    in contextual RL—and the metrics range from scene graph scores to human-normalized
    performance.'
  - 'Trend evolution: From 2023–2024, methods used existing benchmarks (Atari 100k,
    CARL) to claim state-of-the-art; by 2025–2026, the focus shifts to constructing
    new benchmarks (LoopNav, MIND) that diagnose weaknesses like long-term memory
    and cross-action generalization.'
  - 'Open questions: How to align proxy metrics with real-world decision utility;
    whether benchmark conclusions remain stable across implementations and compute
    budgets; and how to cover the diverse settings where world models are expected
    to help.'
  related_work_outline_zh:
  - 主流方向：构建专门的世界模型基准与评估套件，从单一游戏总分转向空间一致性、记忆、动作控制、物理合理性等多维度探测。
  - 研究共性：新基准提出一个包含针对性任务（如环路导航、多样化动作空间）的数据集，并设计一个超越像素级保真度的指标来捕捉特定能力，然后用它揭示当前模型的局限。
  - 关键差异：评估的能力不同——Minecraft中的空间一致性、开放域视频的记忆与动作控制、上下文强化学习的零样本泛化——指标从场景图分数到人类归一化得分各不相同。
  - 趋势演进：2023–2024年方法使用现有基准（Atari 100k、CARL）宣称最优；到2025–2026年转向构建新基准（LoopNav、MIND）来诊断长期记忆和跨动作泛化等弱点。
  - 开放问题：代理指标与真实决策效用如何对齐；基准结论在不同实现和算力预算下是否稳定；如何覆盖世界模型预期发挥作用的多样化设置。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that isolate specific world-model
        capabilities such as spatial consistency, memory, and action controllability,
        enabling systematic comparison beyond generic generation metrics.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings where world models are expected to assist; current benchmarks are
        limited to a few domains (games, driving, robotics) and short-term evaluations.
    - line: Metric and stress-test design
      what_it_solves: Develops evaluation protocols that probe prediction, controllability,
        robustness, and decision utility, such as scene graph consistency scores,
        memory consistency, and action control measurements, rather than relying solely
        on visual fidelity or aggregate scores.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; evidence that improved benchmark scores
        translate to better policy performance in real tasks is still sparse.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditable results through common baselines (e.g., Atari
        100k, NuScenes) and standard reporting practices, allowing fair comparison
        of world-model methods across papers.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets; many papers omit limitations and code,
        making reproducibility and robustness verification difficult.
    consensus:
    - World-model evaluation is moving beyond single aggregate scores to multi-dimensional
      assessments of specific capabilities.
    - Standardized benchmarks such as Atari 100k and NuScenes are widely adopted to
      ensure comparability across methods.
    - Visual quality and physical plausibility have a direct impact on downstream
      task performance, motivating metrics that capture these properties.
    - New benchmarks focus on revealing failure modes of current models, such as long-term
      memory inconsistency and poor cross-action generalization.
    disagreements:
    - 'The choice of evaluated capability: some benchmarks target spatial consistency
      (scene graph invariance), others target memory and action control, and yet others
      target zero-shot generalization to physics variations.'
    - 'The domain of evaluation: driving simulators, Minecraft, robotic manipulation,
      and Atari games represent different interaction modes and observation spaces.'
    - 'Metric design: pixel-level reconstruction similarity versus semantic-level
      consistency scores versus task-level human-normalized performance, reflecting
      different assumptions about what matters for world models.'
    - 'Closed-loop versus open-loop evaluation: some benchmarks require interactive
      rollouts with actions, others assess only prediction quality on fixed sequences.'
    open_questions:
    - How can we design benchmarks that cover the diverse real-world settings and
      long-horizon tasks where world models are expected to provide decision support?
    - To what extent do current proxy metrics (scene graph scores, memory consistency,
      visual fidelity) predict actual downstream task success in robotic control or
      autonomous driving?
    - How stable are benchmark conclusions when models are retrained with different
      random seeds, compute budgets, or codebases, given that many papers do not report
      these details or limitations?
    - What is the minimal set of stress tests that can reliably diagnose the core
      weaknesses of a world model across domains, avoiding the need for dozens of
      domain-specific benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集，将空间一致性、记忆、动作可控性等特定世界模型能力隔离开来，实现超越通用生成指标的系统性比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部真实设置；当前基准仅限于少数领域（游戏、驾驶、机器人）和短期评估。
    - 路线: 指标与压力测试设计
      解决的问题: 开发评估协议，探测预测、可控性、鲁棒性和决策效用，例如场景图一致性分数、记忆一致性和动作控制测量，而非仅依赖视觉保真度或总分。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的一致性；改进的基准分数能否转化为真实任务中更好的策略性能，证据仍然不足。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（如Atari 100k、NuScenes）和标准报告实践，使结果可审计，支持跨论文的世界模型方法公平比较。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；许多论文省略了局限性和代码，使得可重复性和鲁棒性验证困难。
    共识:
    - 世界模型评估正从单一总分转向对特定能力的多维度评估。
    - Atari 100k 和 NuScenes 等标准化基准被广泛采用，以确保方法间的可比性。
    - 视觉质量和物理合理性直接影响下游任务性能，推动了捕捉这些属性的指标设计。
    - 新基准侧重于揭示当前模型的失败模式，如长期记忆不一致和跨动作泛化能力差。
    分歧:
    - 评估能力的选择：有的基准针对空间一致性（场景图不变性），有的针对记忆和动作控制，还有的针对物理变化下的零样本泛化。
    - 评估领域：驾驶模拟器、Minecraft、机器人操作和Atari游戏代表了不同的交互模式和观测空间。
    - 指标设计：像素级重建相似度、语义级一致性分数、任务级人类归一化性能，反映了对世界模型关键属性的不同假设。
    - 闭环与开环评估：一些基准需要带动作的交互式推演，另一些仅评估固定序列上的预测质量。
    开放问题:
    - 如何设计覆盖多样化真实世界设置和长时域任务的基准，以测试世界模型在决策支持中的实际效用？
    - 当前的代理指标（场景图分数、记忆一致性、视觉保真度）在多大程度上能预测机器控制或自动驾驶中的实际下游任务成功？
    - 当模型使用不同随机种子、算力预算或代码库重新训练时，基准结论的稳定性如何，尤其是许多论文未报告这些细节或局限性？
    - 什么样的最小压力测试集能够可靠地诊断跨领域世界模型的核心弱点，从而避免需要数十个特定领域的基准？
