  related_work_outline_zh:
  - 主流方向：主流工作集中在为具身/机器人世界模拟构建动作条件视频动态模型，而非从第一性原理证明形式理论。
  - 研究共性：在统一生成架构中耦合视频与动作模态，并通过下游策略、规划、物理或空间推理任务进行评估。
  - 关键差异：生成主干、动作注入方式、对齐/验证信号和评测目标不同；这些是内容层面的设计选择，不是标签差异。
  - 趋势演进：在现有前沿证据内，工作从2024-2025年的任务专用机器人世界模型，走向2025-2026年带有对齐、验证器和物理感知零样本基准的基础模型级方法。
  - 开放问题：测试时缩放的校准、跨本体泛化、形式保证，以及视觉保真度之外的功能评估仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Formal state-dynamics definitions and assumptions
      what_it_solves: Clarifying what video-based world models must represent as state
        and dynamics, and under which assumptions action-conditioned predictions qualify
        as world-model behavior.
      what_remains_open: No formal guarantees or assumption-to-behavior validation
        appear in the top-paper evidence; the gap between formal conditions and empirical
        model performance is unresolved.
    - line: Unified action-video generative dynamics models (e.g., UWM, IRASim, HMA)
      what_it_solves: Learning action-conditioned video dynamics for robot manipulation,
        enabling policy learning, planning, simulation, and synthetic data generation
        from large or heterogeneous robot datasets.
      what_remains_open: Evidence remains concentrated in manipulation settings; long-horizon
        physical persistence, cross-embodiment transfer, and use beyond video simulation
        are not fully demonstrated.
    - line: Adapter-based reuse of pretrained video diffusion models (e.g., AVID)
      what_it_solves: Converting pretrained or closed video diffusion models into
        action-conditioned world models without accessing original parameters.
      what_remains_open: It requires domain-specific action-labeled video; generalization
        to sequential decision tasks beyond the tested video game and robotics domains
        remains open.
    - line: Alignment and verification of embodied world models (e.g., ReWorld, ABot-PhysWorld,
        ViSA)
      what_it_solves: Improving physical realism, task logic, visual quality, and
        spatial reasoning through reward modeling, preference post-training, or test-time
        verifiers.
      what_remains_open: Verifier calibration, action biases, and inconsistent test-time
        scaling persist; evaluation is often limited to contact-rich manipulation
        or specific spatial benchmarks.
    - line: Conceptual taxonomy and functional evaluation boundaries
      what_it_solves: Organizing state construction and dynamics modeling while advocating
        benchmarks for physical persistence and causal reasoning rather than visual
        fidelity.
      what_remains_open: Whether the taxonomy changes model design or evaluation is
        not yet shown; proposed functional benchmarks are not adopted widely enough
        to validate claims.
    consensus:
    - Action-conditioned video generation is the common operationalization of world
      models for embodied and robotic tasks in the current frontier.
    - Visual quality alone is treated as insufficient; papers increasingly evaluate
      policy correlation, planning quality, physical plausibility, trajectory consistency,
      or spatial reasoning.
    - Large pretraining, heterogeneous robot datasets, and reusable video models are
      shared strategies for building world models, with explicit conditioning and
      alignment as common components.
    - Across the evidence, current models are acknowledged to lack reliable physical
      persistence, causal consistency, or calibrated uncertainty.
    disagreements:
    - Representation/generation backbone differs among diffusion transformers, masked
      autoregression, flow-based models, and frozen video-diffusion adapters.
    - 'Action-conditioning mechanism differs: frame-level conditioning, independent
      per-modality timesteps, learned masks over intermediate outputs, or parallel
      context injection.'
    - 'Alignment supervision differs: human-preference reward models, DPO-style decoupled
      discriminators, or test-time spatial-assertion verifiers.'
    - 'Evaluation target differs: manipulation benchmarks such as Push-T, PBench,
      and EZSbench versus spatial-reasoning benchmarks such as SAT-Real and MMSI-Bench,
      with inconsistent scaling evidence.'
    open_questions:
    - Under what formal conditions does a learned video-action model guarantee physically
      persistent, causally consistent state transitions?
    - Can test-time verifiers be calibrated to remove action biases and scale consistently
      on difficult spatial-reasoning benchmarks?
    - Do alignment-trained manipulation world models transfer to unseen embodiments,
      object sets, or non-contact-rich tasks?
    - How can functional benchmarks separately measure physical persistence, causal
      reasoning, and action alignment without being confounded by visual fidelity?
    - The provided evidence does not include direct scaling-law or formal-guarantee
      validation; missing code, data, or baseline details for several top papers remain
      verification gaps rather than evidence of absence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化状态—动态定义与假设
      解决的问题: 澄清基于视频的世界模型必须将状态和动态表示成什么，以及动作条件预测在哪些假设下可称为世界模型行为。
      尚未覆盖: 顶级论文证据中未出现形式化保证或从假设到行为的直接验证；形式条件与经验模型行为之间的差距仍未解决。
    - 路线: 统一动作—视频生成式动态模型（如 UWM、IRASim、HMA）
      解决的问题: 为机器人操作学习动作条件视频动态，支撑策略学习、规划、模拟与合成数据生成。
      尚未覆盖: 证据集中在操作场景；长时域物理持久性、跨本体迁移以及视频模拟之外的应用尚未充分验证。
    - 路线: 基于适配器复用预训练视频扩散模型（如 AVID）
      解决的问题: 在无法访问原始参数时，把预训练或闭源视频扩散模型转换为动作条件世界模型。
      尚未覆盖: 依赖领域特定的动作标注视频；在已测视频游戏和机器人领域之外的顺序决策任务上泛化仍未验证。
    - 路线: 具身世界模型的对齐与验证（如 ReWorld、ABot-PhysWorld、ViSA）
      解决的问题: 通过奖励建模、偏好后训练或测试时验证器改善物理真实性、任务逻辑、视觉质量和空间推理。
      尚未覆盖: 验证器校准、动作偏差和测试时缩放不一致仍存在；评估常限于接触丰富操作或特定空间基准。
    - 路线: 概念分类与功能评测边界
      解决的问题: 组织状态构建和动态建模，倡导面向物理持久性与因果推理的基准，而非只看视觉保真度。
      尚未覆盖: 分类法是否改变模型设计或评测尚未证明；所提议的功能基准尚未被广泛采用以证实其主张。
    共识:
    - 当前前沿普遍把动作条件视频生成作为具身与机器人任务中世界模型的主要实现方式。
    - 视觉质量单独不够，越来越强调策略相关性、规划质量、物理合理性、轨迹一致性或空间推理等下游评估。
    - 大规模预训练、异构机器人数据和可复用视频模型是共同策略，显式条件注入与对齐是常见组件。
    - 证据普遍承认当前模型在物理持久性、因果一致性或校准不确定性方面仍不足。
    分歧:
    - 表示/生成主干不同：扩散 Transformer、掩码自回归、基于流的模型或冻结的视频扩散适配器。
    - 动作条件机制不同：帧级条件、逐模态独立时间步、对中间输出学习掩码或并行上下文注入。
    - 对齐监督不同：人类偏好奖励模型、DPO 式解耦判别器或基于空间断言的测试时验证器。
    - 评测目标不同：Push-T、PBench、EZSbench 等操作基准与 SAT-Real、MMSI-Bench 等空间推理基准，缩放证据不一致。
    开放问题:
    - 在何种形式条件下，学习到的视频—动作模型能保证物理持久且因果一致的状态转移？
    - 测试时验证器能否被校准，以消除动作偏差并在困难空间推理基准上保持一致缩放？
    - 经对齐训练的操作世界模型能否迁移到未见本体、物体集合或非接触丰富任务？
    - 功能基准如何分别测量物理持久性、因果推理和动作对齐，而不被视觉保真度混淆？
    - 现有证据未包含直接的缩放规律或形式保证验证；若干顶级论文缺少代码、数据或基线细节，应视为验证缺口而非不存在证据。
