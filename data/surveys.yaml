  related_work_outline:
  - 'Mainstream direction: The dominant direction is action-conditioned video generation
    as world models, using diffusion transformers or masked autoregressive models
    trained on robot manipulation data to predict future frames from action sequences.'
  - 'Shared research pattern: Most work couples observation or video dynamics with
    action inputs, evaluates generated rollouts against baselines, and uses the video
    model for policy learning, planning, evaluation, or synthetic data generation.'
  - 'Key differences: They differ in generation architecture, alignment mechanism,
    and evaluation target. Architectures include unified diffusion, frame-level conditioning,
    masked autoregression, and adapted pretrained diffusion. Alignment includes preference
    reward, DPO, or test-time verifiers. Evaluation targets visual fidelity, physical
    plausibility, or downstream policy and planning utility.'
  - 'Trend evolution: Available top-paper evidence is mostly from 2024-2026, so this
    reflects the current frontier. The trend moves from producing controllable video
    rollouts toward aligning rollouts with physical realism, functional behavior,
    and causal or physical persistence benchmarks.'
  - 'Open questions: Formal state and dynamics assumptions are not yet connected to
    empirical model behavior. Visual fidelity has not been shown to guarantee reliable
    spatial reasoning, physical persistence, or generalization beyond evaluated manipulation
    tasks. Alignment rewards and verifiers need consistency across benchmarks.'
  related_work_outline_zh:
  - 主流方向：以动作条件视频生成作为世界模型，使用扩散Transformer或掩码自回归在机器人操作数据上根据动作序列预测未来帧。
  - 研究共性：多数研究把观测或视频动态与动作输入耦合，将生成轨迹与基线比较，并用于策略学习、规划、评估或合成数据生成。
  - 关键差异：生成架构、对齐机制和评测目标不同。架构包括统一扩散、帧级条件、掩码自回归和适配预训练扩散；对齐包括偏好奖励、DPO或测试时验证器；评测目标可以是视觉保真、物理合理性或下游策略与规划效用。
  - 趋势演进：可用高排名论文证据主要集中在2024-2026年，因此反映当前前沿趋势。趋势从可控视频生成转向对物理合理性、功能行为以及因果或物理持续性的对齐与评测。
  - 开放问题：形式化状态与动态假设尚未与经验模型行为建立关联。视觉保真尚未证明能带来可靠空间推理、物理持续性或对受评操作任务之外的泛化。对齐奖励与验证器需要在不同基准上保持一致。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation with unified diffusion or masked sequence
        modeling
      what_it_solves: Builds predictive video dynamics from observation-action sequences
        and enables policy, forward or inverse dynamics, and future trajectory simulation
        for robot manipulation.
      what_remains_open: Evaluation often emphasizes visual fidelity and controllability.
        Physical persistence, causal correctness, and transfer of generated rollouts
        to reliable decision-making remain insufficiently verified.
    - line: Parameter-efficient adaptation of pretrained video diffusion models
      what_it_solves: Extends closed or large video generation models to action-conditioned
        world models using small action-labeled datasets and lightweight adapters
        rather than full retraining.
      what_remains_open: It depends on pretrained model biases and domain-specific
        action-labeled data. Generalization beyond video game and robot manipulation
        domains has not been demonstrated.
    - line: Alignment of world-model rollouts through rewards, preferences, and verifiers
      what_it_solves: Aligns generated trajectories with physical realism, task logic,
        embodiment plausibility, visual quality, or spatial reasoning through reward
        models, preference post-training, or test-time verification.
      what_remains_open: Reward and preference signals can be subjective and costly.
        Test-time verifiers show inconsistent gains across benchmarks and may inherit
        the world model's information bottleneck.
    - line: Conceptual taxonomy and functional evaluation of video-generation world
        models
      what_it_solves: Organizes video world-model research into state construction
        and dynamics modeling dimensions and argues for evaluating physical persistence
        and causal reasoning rather than only visual fidelity.
      what_remains_open: The taxonomy is conceptual and not empirically validated.
        It leaves open how to turn persistence and causality criteria into standardized
        benchmarks and diagnostics.
    - line: Scaling and test-time scaling diagnostics
      what_it_solves: Connects model size, generation speed, or test-time trajectory
        selection to world-model performance in robot settings.
      what_remains_open: Evidence is empirical and narrow. No formal scaling laws
        or guarantees have been established that predict world-model failures or transfer
        to new embodiments and tasks.
    consensus:
    - Across the evidence, a world model is implicitly defined as action-conditioned
      or observation-conditioned generation of future video frames, rather than as
      an explicit probabilistic state-space model.
    - Generated rollout quality is measured primarily through fidelity, controllability,
      or physical and visual realism, and it is treated as a proxy for downstream
      decision-making ability.
    - Pretraining or post-training on realistic robot manipulation video is considered
      central to obtaining useful embodied world models.
    - Evaluation is shifting from static visual quality toward functional behavior
      such as physical plausibility, trajectory consistency, policy transfer, and
      test-time reasoning.
    disagreements:
    - One line couples action and video in a unified diffusion objective, another
      uses masked autoregression, and another adapts a fixed pretrained video diffusion
      model without accessing its parameters.
    - Some work aligns models with human preference rewards or direct preference optimization,
      while others rely on heuristic test-time verifiers or no explicit alignment
      step.
    - 'Evaluation targets differ: visual fidelity and speed, policy or planning correlation
      with ground-truth simulators, physical reasoning benchmarks, or spatial reasoning
      benchmarks.'
    - Some approaches require full training on large robot datasets, while one adaptation
      line uses only a small action-labeled dataset and treats the pretrained model
      as closed-source.
    open_questions:
    - Do current video-generation world models learn an explicit enough state and
      dynamics representation to satisfy formal definitions of a world model?
    - Do visual fidelity, generation speed, or trajectory selection improvements translate
      into reliable physical persistence, causal reasoning, and policy deployment
      outside evaluated manipulation tasks?
    - Which standardized functional benchmarks can separate visual rendering quality
      from usefulness as a world model?
    - Can reward or preference alignment and test-time verifiers produce consistent
      scaling across heterogeneous spatial reasoning benchmarks without inheriting
      the world model's information bottleneck?
    - What scaling laws or guarantees, if any, predict when action-conditioned video
      models will fail in novel embodiment or task settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频生成：统一扩散或掩码序列建模
      解决的问题: 从观察-动作序列建立预测性视频动态模型，用于机器人操作的策略、前向或逆向动力学和未来轨迹模拟。
      尚未覆盖: 评测常偏重视觉保真与可控性；物理持续性、因果正确性以及生成轨迹迁移到可靠决策的边界仍未系统验证。
    - 路线: 预训练视频扩散模型的参数高效适配
      解决的问题: 将闭源或大型视频生成模型扩展为动作条件世界模型，使用小型动作标注数据集和轻量适配器，而非完全重训。
      尚未覆盖: 依赖预训练模型偏差和领域特定动作标注数据；尚未证明可泛化到视频游戏和机器人操作之外的场景。
    - 路线: 通过奖励、偏好与验证器对齐世界模型轨迹
      解决的问题: 用奖励模型、偏好后训练或测试时验证，使生成轨迹符合物理真实性、任务逻辑、具身合理性、视觉质量或空间推理要求。
      尚未覆盖: 奖励和偏好信号可能主观且收集成本高；测试时验证器在不同基准上收益不一致，并可能继承世界模型的信息瓶颈。
    - 路线: 视频生成世界模型的概念分类与功能性评测
      解决的问题: 把相关工作组织为状态构建和动态建模两个维度，并主张评估物理持续性和因果推理，而不仅是视觉保真度。
      尚未覆盖: 该分类为概念性且未经验证；如何把持续性和因果性标准转化为统一基准与诊断方法仍未解决。
    - 路线: 缩放与测试时缩放诊断
      解决的问题: 将模型规模、生成速度或测试时轨迹选择与机器人场景中的世界模型表现相关联。
      尚未覆盖: 现有证据多为经验性且范围较窄；尚未建立能预测世界模型失败和向新本体、新任务迁移的正式缩放规律或保证。
    共识:
    - 多数证据隐含地把世界模型定义为以动作或观测为条件的未来视频生成，而不是显式概率状态空间模型。
    - 生成轨迹质量主要通过保真度、可控性或物理与视觉合理性来衡量，并作为下游决策能力的代理指标。
    - 研究共识认为在真实机器人操作视频上进行预训练或后训练对获得有用的具身世界模型至关重要。
    - 评测正在从静态视觉质量转向功能性行为，例如物理合理性、轨迹一致性、策略迁移和测试时推理。
    分歧:
    - 一条路线在统一扩散目标中联合建模动作和视频，另一条使用掩码自回归，还有一条在不访问参数的情况下适配固定预训练视频扩散模型。
    - 部分工作用人类偏好奖励或直接偏好优化对齐模型，部分依赖启发式测试时验证器，部分没有显式对齐。
    - 评测目标不同：视觉保真度与速度、策略或规划与真值模拟器的相关性、物理推理基准或空间推理基准。
