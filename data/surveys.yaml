  - 'Shared research pattern: Papers treat world models as generative simulators conditioned
    on language, multimodal goals, ego-trajectories, or road nodes, and evaluate temporal
    consistency, controllability, and downstream driving or robot execution.'
  - 'Key differences: They differ in scope—general video, driving, ego-vision—and
    in representation, supervision, and evaluation: compositional primitives, global
    3D/4D state, latent autoregressive fusion, open-loop synthesis, closed-loop metrics,
    georeferencing, or out-of-sight dynamics.'
  - 'Trend evolution: Available evidence runs from 2023 to 2026, moving from domain-specific
    traffic simulation toward general generative video world models, then toward persistent,
    controllable, open-source systems and evaluation frameworks. The trend is within
    the current frontier.'
  - 'Open questions: Taxonomies lack systematic empirical validation; evaluation settings
    may be incompatible; long-horizon, out-of-sight, and real-world robot evidence
    is sparse; reproducibility artifacts and limitation details are unevenly evidenced.'
  related_work_outline_zh:
  - 主流方向：证据集中在世界模型的综述与分类法，尤其是生成式视频模拟、自动驾驶和具身控制；它们组织潜在表示、结构先验、评测框架与开放挑战，而不是给出统一实证基准。
  - 研究共性：论文将世界模型视为生成式模拟器，并通过语言、多模态目标、自我轨迹、道路节点等条件提升可控性与泛化性；时间一致性和可控性是常见评测重点。
  - 关键差异：覆盖范围、表示方式、监督信号和评测目标不同：通用视频、驾驶、自我中心视觉；组合原语、全局3D/4D状态、潜在自回归；开环合成、闭环指标、地理参考、视线外动态等。
  - 趋势演进：2023至2026年证据从领域特定的交通仿真走向通用生成式视频世界模型，再走向持久、可控、开源系统与评测框架；整体处于当前前沿窗口内。
  - 开放问题：分类法缺乏系统实证验证；不同评测设置可能不可比；长时、视线外和真实机器人证据稀缺；复现工件与局限性细节在证据包中不均衡。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes a fragmented world-model field into latent representations,
        structural priors, evaluation dimensions, and open research directions
      what_remains_open: Whether the taxonomy is grounded in systematic literature
        coverage rather than selective examples; empirical validation is largely missing
    - line: Comparative evaluation synthesis
      what_it_solves: Connects evaluation choices such as controllability, temporal
        consistency, georeferencing, and closed-loop metrics to conclusions about
        world-model progress
      what_remains_open: Cross-setting compatibility is not established because datasets,
        metrics, and real or simulated deployments differ
    - line: Open problem and gap mapping
      what_it_solves: Converts surveys and method evidence into concrete gaps, including
        out-of-sight dynamics, long-horizon memory, real-time interaction, and open-source
        availability
      what_remains_open: Prioritizing which gaps matter most for embodied or driving
        progress remains unresolved
    consensus:
    - World models are presented as generative simulators that connect visual observations
      to planning, control, or agent behavior.
    - Conditioning signals such as language, multimodal goals, destinations, ego-trajectories,
      and road nodes are used to improve controllability and generalization.
    - Temporal consistency and controllability are treated as central evaluation concerns,
      even when the exact benchmarks differ.
    - Surveys and taxonomies agree on the need for unified design spaces and explicit
      open-challenge identification.
    disagreements:
    - 'Coverage differs: some work targets general video simulation, while other work
      targets domain-specific driving or ego-vision settings.'
    - Representation choices differ, including compositional language-derived primitives,
      persistent global 3D/4D state, latent autoregressive fusion, and multi-agent
      vectorized traffic models.
    - 'Evaluation target differs: open-loop video synthesis, closed-loop driving metrics,
      georeferencing, out-of-sight dynamics, and real-time interaction are not directly
      comparable.'
    - Supervision and interaction modes differ, including instruction parsing, per-agent
      destinations and latent personalities, pseudo-labeled depth and trajectory,
      and real-time open-source simulator deployment.
    - Some works present conceptual frameworks without experimental validation, while
      others provide simulation or benchmark results.
    open_questions:
    - Are the taxonomies based on systematic retrieval and able to cover future methods,
      or do they mainly reflect selective examples?
    - Which evaluation settings are compatible enough to support cross-paper comparison
      of world-model capabilities?
    - What priority should be assigned among out-of-sight dynamics, long-horizon memory,
      real-time interaction, and open-source reproducibility?
    - Does progress in simulated video planning transfer to real robot execution,
      given that some evidence covers only simulation?
    - Which reproducibility and limitation details are missing from the packet, such
      as code, dataset, baseline, metric, and failure conditions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型与驾驶模型研究整理为潜在表示、结构先验、评测维度和开放方向
      尚未覆盖: 分类法是否基于系统文献覆盖而非选择性举例尚不明确；实证验证基本缺失
    - 路线: 对比评测综合
      解决的问题: 关联可控性、时间一致性、地理参考和闭环指标等评测选择与世界模型进展结论
      尚未覆盖: 由于数据集、指标和真实或仿真部署不同，跨设置可比性尚未建立
    - 路线: 开放问题与缺口映射
      解决的问题: 把综述和方法证据转化为具体缺口，包括视线外动态、长时记忆、实时交互和开源可用性
      尚未覆盖: 哪些缺口对具身智能或驾驶进展最关键的优先级仍未解决
    共识:
    - 世界模型被表述为连接视觉观测与规划、控制或智能体行为的生成式模拟器。
    - 语言、多模态目标、目的地、自我轨迹和道路节点等条件信号被用于提升可控性与泛化性。
    - 时间一致性和可控性被视为核心评测关注点，尽管具体基准不同。
    - 综述和分类法一致认为需要统一设计空间并显式识别开放挑战。
    分歧:
    - 覆盖范围不同：部分关注通用视频模拟，部分聚焦驾驶或自我中心视觉等特定场景。
    - 表示方式不同：包括语言驱动的组合原语、持久全局3D/4D状态、潜在自回归融合和多智能体向量化交通模型。
    - 评测目标不同：开环视频合成、闭环驾驶指标、地理参考、视线外动态和实时交互不可直接比较。
    - 监督与交互模式不同：包括指令解析、每智能体目的地与潜在个性、伪标注深度和轨迹，以及实时开源模拟器部署。
    - 部分工作只给出概念框架而未做实验验证，另一些则提供仿真或基准结果。
    开放问题:
    - 分类法是否基于系统检索并能延展到未来方法，还是主要反映选择性举例？
    - 哪些评测设置足够兼容，可以支持世界模型能力的跨论文比较？
    - 在视线外动态、长时记忆、实时交互与开源可复现性之间，应如何排序优先级？
    - 仿真视频规划的结果能否迁移到真实机器人执行，目前部分证据仅覆盖仿真？
    - 证据包中缺失哪些可复现性与局限性细节，例如代码、数据集、基线、指标和失败条件？
