  related_work_outline:
  - 'Mainstream direction: Most work centers on world-model evaluation and development.
    Benchmark papers such as LoopNav and MIND introduce closed-loop datasets and metrics
    for spatial consistency, memory, and action control, while method papers validate
    on Atari, driving, robotics, and Minecraft settings.'
  - 'Shared research pattern: Papers converge on using controlled or simulated navigation
    and interaction environments to stress-test prediction quality, long-horizon consistency,
    and controllability beyond aggregate visual similarity.'
  - 'Key differences: Contributions differ in evaluation target, representation choice,
    supervision signal, and contribution type. Some focus on datasets and metrics,
    while others propose diffusion, transformer-VAE, contextual state-space, or mask-reconstruction
    world models.'
  - 'Trend evolution: From 2023 to 2025, benchmark-aligned world models and specialized
    consistency benchmarks appear. The 2025-2026 frontier shifts toward open-domain
    memory and action-control evaluation and cross-domain generalization.'
  - 'Open questions: Whether proxy metrics align with downstream policy quality, whether
    datasets cover real deployment settings, and whether conclusions remain stable
    across implementations and compute budgets remain open.'
  related_work_outline_zh:
  - 主流方向：多数工作围绕世界模型评测与开发，基准论文引入闭环数据集与指标，方法论文在Atari、驾驶、机器人和Minecraft等场景验证。
  - 研究共性：普遍使用受控或仿真环境进行压力测试，超越聚合视觉质量，关注预测、长时域一致性与可控性。
  - 关键差异：评测目标、表示方式、监督信号和贡献性质不同；部分工作提供数据集或指标，部分工作提出新的世界模型。
  - 趋势演进：2023—2025年出现基准对齐的世界模型与专项一致性基准，2025—2026年前沿趋向开放域记忆、动作控制和跨域泛化。
  - 开放问题：代理指标与下游决策一致性、数据集对真实部署场景的覆盖、以及跨实现和算力预算的结论稳定性仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Spatial and memory consistency benchmark construction
      what_it_solves: Creates open-world navigation datasets and loop-based evaluation
        for assessing long-horizon scene consistency and memory behavior in world
        models.
      what_remains_open: Current evidence is concentrated in Minecraft-like or curated
        video settings, leaving real-world closed-loop diversity and dynamic scene
        coverage under-tested.
    - line: Action-controlled and closed-loop evaluation protocol design
      what_it_solves: Measures whether world models maintain temporal stability, contextual
        coherence, and action responsiveness across viewpoints and action spaces.
      what_remains_open: Standardization is incomplete, and the alignment between
        these evaluation scores and downstream decision utility is not yet established.
    - line: Model-based control benchmark performance
      what_it_solves: Evaluates sample-efficient training and zero-shot generalization
        of world-model agents on established control and game suites.
      what_remains_open: Task diversity is limited, some methods assume observable
        context values, and several papers lack explicit limitation reporting or artifact
        verification.
    - line: Driving and robotics video-dynamics evaluation
      what_it_solves: Tests long-horizon, multi-view, and embodied video prediction
        for driving or robotic policy training and evaluation.
      what_remains_open: Physical plausibility metrics, zero-shot robustness across
        domains, and reproducibility across implementations and compute budgets remain
        insufficiently covered.
    consensus:
    - Benchmarks are shifting from aggregate visual quality toward long-horizon consistency,
      memory, action control, and generalization.
    - World-model papers use standardized tasks and normalized scores to compare with
      prior methods, usually reporting video prediction or policy improvement.
    - Datasets and metrics are treated as necessary for making world-model claims
      comparable and for exposing failures such as long-term memory loss or limited
      cross-action generalization.
    disagreements:
    - Evaluation targets differ across game/control suites, driving multi-view video,
      robotic interaction, and Minecraft spatial navigation.
    - Representation choices differ, including diffusion-based generation, transformer-VAE
      stochastic models, contextual recurrent state-space models, and mask/autoencoder-like
      reconstruction.
    - 'Supervision and interaction modes differ: some evaluate zero-shot generalization
      to unseen contexts, others test closed-loop action-conditioned video, and still
      others focus on long-horizon or multi-view prediction.'
    - Some contributions are dataset and metric benchmarks without reported model
      results, while others report state-of-the-art results but do not provide comparable
      benchmark artifacts.
    open_questions:
    - Do spatial consistency and memory scores predict downstream policy success or
      human preference?
    - How well do game and driving benchmarks transfer to open-domain embodied settings
      with partial observability and unseen action spaces?
    - Are benchmark conclusions stable across implementation choices, compute budgets,
      and missing code or dataset artifacts?
    - Which evaluation protocols can separate visual fidelity, physical plausibility,
      and decision utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 空间与记忆一致性基准构建
      解决的问题: 构建开放世界导航数据集和循环式评测，用于评估世界模型的长时域场景一致性和记忆行为。
      尚未覆盖: 现有证据集中在Minecraft等受控或精选视频场景，真实开放域闭环多样性和动态场景覆盖仍不足。
    - 路线: 行动控制与闭环评测协议设计
      解决的问题: 衡量世界模型在跨视角和不同动作空间下是否保持时间稳定、上下文连贯并正确响应控制。
      尚未覆盖: 标准化仍不完整，评估得分与下游决策效用之间的一致性尚未建立。
    - 路线: 基于标准控制基准的模型评测与训练
      解决的问题: 在既定控制与游戏套件上评估世界模型智能体的样本效率和零样本泛化能力。
      尚未覆盖: 任务多样性有限，部分方法假设上下文值可观测，且若干论文缺少明确的局限性说明或工件验证。
    - 路线: 驾驶与机器人视频动力学评测
      解决的问题: 检验长时域、多视角和具身视频预测在驾驶或机器人策略训练与评估中的表现。
      尚未覆盖: 物理合理性指标、跨域零样本鲁棒性以及不同实现和算力预算下的可复现性仍覆盖不足。
    共识:
    - 基准正在从聚合视觉质量转向长时域一致性、记忆、动作控制和泛化能力。
    - 世界模型方法使用统一任务和归一化分数与先前方法比较，通常报告视频预测或策略改进。
    - 数据集和指标被视为使世界模型主张可比、并暴露长时记忆损失或跨动作空间泛化不足等失败模式的关键。
    分歧:
    - 评测目标不同：涉及游戏/控制套件、驾驶多视角视频、机器人交互和Minecraft空间导航。
    - 表示方式不同：包括扩散生成、Transformer-VAE随机模型、上下文循环状态空间模型和掩码/自编码式重建。
    - 监督与交互模式不同：有的评估未见上下文的零样本泛化，有的测试闭环动作条件视频，有的关注长时域或多视角预测。
    - 有的工作贡献数据集和指标基准但未报告模型结果，有的报告最优结果但未提供可比的基准工件。
    开放问题:
    - 空间一致性和记忆得分能否预测下游策略成功或人类偏好？
    - 游戏与驾驶基准能否迁移到部分可观测和未见动作空间的开放域具身环境？
    - 基准结论在不同实现、算力预算以及缺少代码或数据集工件时是否仍然稳定？
    - 哪些评测协议可以区分视觉保真度、物理合理性和决策效用？
