  related_work_outline:
  - 'Mainstream direction: Generative video/latent world models using diffusion transformers
    or stochastic state-space models, with increasing coupling to actions and robotics/driving
    benchmarks.'
  - 'Shared research pattern: Learning predictive objectives from video or trajectories,
    then evaluating through rollout fidelity, policy transfer, or consistency benchmarks.'
  - 'Key differences: Representations and objectives vary from VAE recurrent state-space
    to diffusion with mask, physics, language-composition, or action-diffusion auxiliary
    tasks; evaluation settings vary too.'
  - 'Trend evolution: 2023-2024 work emphasizes sample-efficient model-based RL and
    contextual latent dynamics; 2025-2026 shifts toward large-scale video/action diffusion
    and memory/action control benchmarks. Trend is within the current frontier.'
  - 'Open questions: Whether gains isolate method contribution; how to generalize
    across unseen contexts, primitives, action spaces, and long horizons; limited
    ablation and missing limitation evidence.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或随机状态空间模型构建生成式/隐式世界模型，并越来越多地与动作、机器人或驾驶场景耦合。
  - 研究共性：从视频或轨迹学习预测目标，并通过保真度、策略迁移或一致性基准评估模型能力。
  - 关键差异：表示与目标不同，例如变分循环状态空间、掩码重建、物理辅助、语言组合或动作扩散；评测场景也不一致。
  - 趋势演进：2023-2024年工作偏重样本高效模型强化学习与上下文隐动力学；2025-2026年转向大规模视频/动作扩散和记忆/动作控制基准，仍处当前前沿内。
  - 开放问题：收益是否隔离了方法贡献；如何跨未见上下文、原语、动作空间和长时域泛化；多篇论文缺少消融或局限说明。
  literature_review:
    line_of_work_matrix:
    - line: Generative video and latent objective design
      what_it_solves: Converts video or trajectory observations into predictive world
        models via diffusion, transformer, or recurrent state-space objectives.
      what_remains_open: Which representation and auxiliary-loss choices transfer
        beyond reported datasets; physics, geometry, and action coupling are not standardized.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to policies, controllers, or generated
        video plans for decision-time use.
      what_remains_open: How much gain comes from model versus planner, controller,
        or task prior, and whether action control generalizes across unseen action
        spaces.
    - line: Evaluation and evidence protocols
      what_it_solves: Defines datasets, metrics, and baselines for spatial, memory,
        and action-control consistency to isolate world-model capability.
      what_remains_open: Long-horizon and cross-domain evidence remains sparse; many
        method papers lack reported ablations or limitations.
    consensus:
    - World modeling is framed as learning a predictive generative or latent-dynamics
      objective from video or trajectory data.
    - Models are evaluated on rollout fidelity, downstream policy quality, or task-specific
      consistency benchmarks.
    - Recent architectures favor diffusion/transformers for high-dimensional generation,
      while model-based RL keeps stochastic latent state-space components.
    - Benchmark construction highlights memory, spatial, and action-control consistency
      as necessary evaluation targets.
    disagreements:
    - 'Representation choices differ: stochastic recurrent state-space for compact
      latent dynamics versus diffusion/transformer generation with mask, physics,
      or language-composition objectives.'
    - 'Supervision and data differ: some methods assume observable context or parsed
      language primitives; others use action-free video or coupled video-action diffusion.'
    - Evaluation settings differ across Atari/contextual RL, driving video prediction,
      robotic video plan synthesis, and open-domain consistency benchmarks.
    - 'Action interface differs: imagined latent rollouts, generated video plans,
      or unified policy/dynamics through diffusion timesteps.'
    open_questions:
    - Does reported performance reflect architecture/loss design or dataset scale,
      baseline strength, and evaluation protocol? Several papers lack ablation or
      limitation evidence.
    - Can context-conditioned world models transfer to unobserved contexts and beyond
      small benchmark suites?
    - Do spatial and memory consistency metrics transfer from Minecraft-style navigation
      to driving and robotic manipulation?
    - Can language-primitive compositional models handle novel primitives rather than
      only seen combinations?
    - Which action-interface choices provide robust control without task-specific
      priors or planner tuning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频与隐式目标设计
      解决的问题: 将视频或轨迹观测转化为可通过扩散、Transformer或循环状态空间目标预测的世界模型。
      尚未覆盖: 哪些表示和辅助损失选择能迁移到报告数据集之外；物理、几何和动作耦合尚未标准化。
    - 路线: 规划与动作接口方法
      解决的问题: 把学习到的动力学连接到策略、控制器或生成式视频计划以用于决策。
      尚未覆盖: 收益有多少来自模型而非规划器、控制器或任务先验；动作控制能否跨未见动作空间泛化。
    - 路线: 评测与证据协议
      解决的问题: 定义数据集、指标和基线，以评估空间、记忆和动作控制一致性并隔离世界模型能力。
      尚未覆盖: 长时域和跨领域证据仍少；许多方法论文缺少消融或局限性报告。
    共识:
    - 世界建模被框架化为从视频或轨迹数据学习预测性生成目标或隐动力学目标。
    - 模型通过展开保真度、下游策略质量或任务特定一致性基准进行评估。
    - 近期架构偏好扩散/Transformer处理高维生成，而模型强化学习保留随机隐状态空间组件。
    - 基准构建将记忆、空间和动作控制一致性视为必要评测维度。
    分歧:
    - 表示选择不同：随机循环状态空间用于紧凑隐动力学，而扩散/Transformer生成加入掩码、物理或语言组合目标。
    - 监督与数据不同：部分方法假设置可观测上下文或可解析语言原语，部分方法使用无动作视频或耦合视频-动作扩散。
    - 评测场景不同：覆盖Atari/上下文强化学习、驾驶视频预测、机器人视频计划合成与开放域一致性基准。
    - 动作接口不同：通过想象隐轨迹、生成视频计划或扩散时间步统一策略与动力学。
    开放问题:
    - 报告性能反映的是架构/损失设计还是数据集规模、基线强度与评测协议？若干论文缺少消融或局限性证据。
    - 上下文条件世界模型能否迁移到未见上下文以及小基准套件之外？
    - 空间和记忆一致性指标能否从Minecraft式导航迁移到驾驶和机器人操作？
    - 基于语言原语组合的模型能否处理全新原语，而不仅是已见组合？
    - 哪些动作接口选择能在不需任务特定先验或规划器调参的情况下提供稳健控制？
