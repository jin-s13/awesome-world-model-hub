  related_work_outline:
  - 'Mainstream direction: The convergence of video generation, reinforcement learning,
    and multimodal interaction into general world models that simulate or predict
    dynamic environments, with a strong recent emphasis on interactive, controllable,
    and long-horizon consistent simulation for robotics, autonomous driving, and embodied
    AI.'
  - 'Shared research pattern: Works either propose a new world model architecture
    (often compositional, latent, or open-source) and evaluate it on downstream task
    success or video fidelity, or they synthesize the field into taxonomies, benchmarks,
    and challenge lists, frequently centering on action-conditioned generation and
    out-of-sight dynamics.'
  - 'Key differences: Methods differ in representation (continuous latent states vs.
    discrete tokens vs. hybrid), the source of supervision (language, multisensory,
    or ego-trajectory), the interaction mode (real-time responsive vs. offline planning),
    and the target deployment (simulation only vs. physical robots). Surveys differ
    in scope: one focuses on interactive video, another on Sora-like general simulators,
    and another on latent models for driving.'
  - 'Trend evolution: From 2022–2026, the topic moves from demonstrating world models
    on physical robots (DayDreamer) toward open-source, interactive, and persistent
    4D simulation (LiveWorld, LingBot-World), and from single-paper results to systematic
    surveys and unified evaluation frameworks (latent driving taxonomy, interactive
    video benchmarks), with an increasing focus on out-of-sight reasoning and real-time
    control.'
  - 'Open questions: How to prioritize which capability gaps (compositional generalization,
    long-term memory, safety, resource-aware inference) matter most for real-world
    deployment; whether the proposed evaluation benchmarks capture the full spectrum
    of world model abilities; and how to move from separate taxonomies to a shared,
    empirically validated framework that guides both model design and evaluation.'
  related_work_outline_zh:
  - 主流方向：视频生成、强化学习和多模态交互融合为通用世界模型，用于模拟或预测动态环境，近期重点强调面向机器人、自动驾驶和具身智能的可交互、可控制、长时间一致性的模拟。
  - 研究共性：工作要么提出新的世界模型架构（常为组合式、潜在空间或开源），并以下游任务成功或视频保真度进行评估，要么将领域综合为分类法、基准和挑战列表，常围绕动作条件生成和视线外动态展开。
  - 关键差异：方法在表示（连续潜在状态、离散令牌或混合）、监督来源（语言、多感官或自我轨迹）、交互模式（实时响应 vs. 离线规划）和部署目标（仅仿真 vs.
    物理机器人）上存在差异。综述在范围上不同：一篇聚焦交互式视频，一篇关注 Sora 类通用模拟器，另一篇关注自动驾驶的潜在模型。
  - 趋势演进：2022–2026 年，主题从在物理机器人上展示世界模型（DayDreamer）转向开源、交互式和持久 4D 模拟（LiveWorld, LingBot-World），从单篇结果转向系统综述和统一评估框架（潜在驾驶分类法、交互式视频基准），越来越多地关注视线外推理和实时控制。
  - 开放问题：如何优先排序对真实部署最重要的能力缺口（组合泛化、长期记忆、安全性、资源感知推理）；所提出的评估基准是否捕捉了世界模型能力的全部范围；以及如何从分离的分类法走向共享的、实证验证的框架，以指导模型设计和评估。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes a fragmented landscape of world models – spanning
        video generation, autonomous driving, and robotics – into coherent design
        dimensions (latent representations, structural priors, interaction modes)
        and identifies cross-cutting challenges and future directions.
      what_remains_open: The proposed taxonomies are largely conceptual without empirical
        validation; they may not cover all emerging methods, and the relative importance
        of the identified challenges for practical progress is not established.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different evaluation protocols – open-loop video
        quality, closed-loop task success, controllability metrics, and resource-aware
        inference cost – shape conclusions about world model capabilities, and proposes
        unified benchmark suites for interactive video and driving.
      what_remains_open: Whether the proposed metrics and benchmarks are adopted and
        whether they truly capture the desired properties (e.g., physical plausibility,
        long-horizon consistency, out-of-sight dynamics) remains untested; many existing
        evaluations are not compatible across settings.
    - line: Open problem and gap mapping
      what_it_solves: 'Translates coverage of world model literature into concrete
        research gaps: action-conditioned controllability, long-horizon memory, real-time
        interactivity, out-of-sight simulation, compositional generalization, and
        safety/alignment.'
      what_remains_open: Prioritization of which gaps are most critical to close first
        for real-world impact is missing; most papers state the gaps but do not provide
        a principled ranking or an actionable roadmap connecting each gap to necessary
        methodological advances.
    consensus:
    - World models must move beyond passive video generation to interactive, action-conditioned
      simulation that supports long-horizon consistency and real-time control.
    - Existing monolithic models struggle with out-of-sight dynamics and compositional
      generalization; factorizing the model by language primitives, latent entities,
      or separate modules is a recurring theme.
    - 'Evaluation in world models is fragmented: there is a shared call for unified
      benchmarks that combine video quality, task execution, and resource efficiency,
      yet no single suite has been universally adopted.'
    - The field is converging on the idea that world models should be open, reproducible,
      and tested across diverse environments (robotics, driving, open-world games)
      rather than in a single domain.
    disagreements:
    - 'Representation: Some works advocate for continuous latent states (Dreamer-style)
      for planning, while others use discrete tokens or video diffusion for generative
      fidelity, and hybrid representations are emerging without a clear winner.'
    - 'Supervision and modality: Methods differ in whether they rely purely on language,
      ego-motion and depth, or multimodal signals; surveys highlight that no single
      modality captures all necessary world dynamics.'
    - 'Interaction mode: Real-time responsive simulation (under 1s latency) is prioritized
      in open-source systems like LingBot-World, whereas other works evaluate offline
      planning or imagination without real-time constraints.'
    - 'Deployment setting: DayDreamer and GEM emphasize physical robot learning without
      simulators, while RoboDreamer and LiveWorld operate in simulated or video-based
      environments, leading to different assumptions about safety, reset, and data
      availability.'
    open_questions:
    - How can we systematically prioritize the identified capability gaps (e.g., out-of-sight
      dynamics vs. compositional generalization vs. real-time interactivity) for the
      next wave of world model development?
    - What would a shared, empirically validated evaluation framework look like that
      spans the diverse settings of robotics, autonomous driving, and open-world games,
      and how can we ensure it measures the properties that matter for downstream
      deployment?
    - To what extent do the successes of open-source world models in controlled benchmarks
      transfer to unconstrained physical environments, and what verification gaps
      remain in reproducibility (code, datasets, hyperparameters)?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型领域（涵盖视频生成、自动驾驶和机器人）组织为连贯的设计维度（潜在表示、结构先验、交互模式），并识别跨领域挑战和未来方向。
      尚未覆盖: 所提出的分类法多为概念性，缺乏实证验证；可能无法涵盖所有新兴方法，且所识别挑战对实际进展的相对重要性尚未确定。
    - 路线: 对比评测综合
      解决的问题: 总结不同评估协议（开环视频质量、闭环任务成功率、可控性指标、资源感知推理成本）如何塑造关于世界模型能力的结论，并提出了交互式视频和驾驶的统一基准套件。
      尚未覆盖: 所提出的指标和基准是否被采纳，以及它们是否真正捕捉到所需属性（如物理合理性、长时间一致性、视线外动态）仍未经检验；许多现有评估在不同设置下不兼容。
    - 路线: 开放问题与缺口映射
      解决的问题: 将世界模型文献的覆盖范围转化为具体的研究缺口：动作条件可控性、长时记忆、实时交互性、视线外模拟、组合泛化以及安全/对齐。
      尚未覆盖: 缺乏对哪些缺口最应优先解决以产生实际影响的排序；大多数论文陈述了缺口，但未提供原则性排序或连接每个缺口与必要方法进展的可操作路线图。
    共识:
    - 世界模型必须从被动视频生成转向交互式、动作条件模拟，该模拟支持长时间一致性和实时控制。
    - 现有的单体模型在视线外动态和组合泛化方面存在困难；通过语言原语、潜在实体或独立模块进行因子分解是一个反复出现的主题。
    - 世界模型的评估是碎片化的：存在对结合视频质量、任务执行和资源效率的统一基准的共同呼吁，但尚无单一套件被普遍采纳。
    - 该领域正朝着世界模型应开源、可复现并在多样化环境（机器人、驾驶、开放世界游戏）中测试而非局限于单一域的方向收敛。
    分歧:
    - 表示：一些工作主张连续潜在状态（Dreamer 风格）用于规划，而另一些使用离散令牌或视频扩散以获得生成保真度，混合表示正在兴起但尚无明确赢家。
    - 监督与模态：方法在依赖纯语言、自我运动和深度还是多模态信号上存在差异；综述强调单一模态无法捕捉所有必要的世界动态。
    - 交互模式：在 LingBot-World 等开源系统中，实时响应模拟（延迟低于 1 秒）是优先考虑的，而其他工作评估离线规划或想象，没有实时约束。
    - 部署设置：DayDreamer 和 GEM 强调无需模拟器的物理机器人学习，而 RoboDreamer 和 LiveWorld 在仿真或视频环境中运行，导致对安全性、重置和数据可用性的不同假设。
    开放问题:
    - 如何系统性地优先排序已识别的能力缺口（例如视线外动态 vs. 组合泛化 vs. 实时交互性），以指导下一波世界模型发展？
    - 一个共享的、实证验证的评估框架应该是什么样子的，该框架能跨越机器人、自动驾驶和开放世界游戏的多样化设置，并确保它衡量对下游部署至关重要的属性？
    - 开源世界模型在受控基准上的成功在多大程度上能迁移到无约束的物理环境，以及在可复现性（代码、数据集、超参数）方面还存在哪些验证缺口？
