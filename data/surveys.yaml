  related_work_outline:
  - 'Mainstream direction: World models are increasingly formulated as video generation
    tasks using diffusion transformers and masked autoencoders, with a strong focus
    on robotics and autonomous driving.'
  - 'Shared research pattern: Most works jointly learn scene dynamics and action-conditioned
    generation, often combining self-supervised representation learning with model-based
    planning or policy learning.'
  - 'Key differences: Methods diverge on whether to model physics explicitly, use
    compositional or unified architectures, incorporate action information via diffusion
    or conditioning, and evaluate via open-loop video quality or closed-loop policy
    performance.'
  - 'Trend evolution: The field has moved from recurrent state-space models (e.g.,
    Dreamer) toward transformer-based diffusion world models, and recently toward
    unified video–action diffusion pretraining on large robotic datasets, with growing
    emphasis on benchmark-driven evaluation of consistency and controllability.'
  - 'Open questions: Long-term memory and spatial consistency, zero-shot generalization
    to unseen dynamics, the isolation of model contribution from planner or task priors,
    and the lack of standardized evaluation protocols for physical plausibility remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型越来越多地被定义为视频生成任务，使用扩散变换器和掩码自编码器，重点用于机器人和自动驾驶。
  - 研究共性：大多数工作联合学习场景动力学和动作条件生成，通常将自监督表示学习与基于模型的规划或策略学习相结合。
  - 关键差异：方法在是否显式建模物理、使用组合式还是统一架构、通过扩散或条件化引入动作信息、以及通过开环视频质量还是闭环策略性能进行评估等问题上存在分歧。
  - 趋势演进：该领域已从循环状态空间模型（如Dreamer）转向基于Transformer的扩散世界模型，最近又转向在大规模机器人数据集上统一视频–动作扩散预训练，并越来越强调基于基准的一致性和可控性评估。
  - 开放问题：长期记忆和空间一致性、对未见动力学的零样本泛化、模型贡献与规划器或任务先验的隔离、以及缺乏标准化的物理合理性评估协议，这些问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforming world-model concepts into concrete architectures,
        losses, and training recipes (e.g., DiT with mask reconstruction for generalizable
        driving video, VAE–Transformer for efficient RL, or compositional video generation
        from language primitives).
      what_remains_open: Which algorithmic choices (e.g., mask vs. diffusion, explicit
        physics vs. implicit learning, unification of modalities) transfer beyond
        the reported task families, and how to verify that the learned representations
        capture causal dynamics rather than visual correlations.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by coupling action
        and video diffusion, incorporating context into latent state inference for
        zero-shot generalization, or using world-model dreams for policy optimization.
      what_remains_open: How much performance gain stems from the model versus the
        planner, controller, or task-specific prior; whether the action interface
        can handle diverse action spaces without retraining; and whether closed-loop
        performance improvements are attributable to better dynamics or better exploration.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing datasets and benchmarks that isolate specific capabilities—spatial
        consistency via loop-based navigation, memory consistency and action control
        across viewpoints and action spaces—to evaluate models beyond pixel-level
        accuracy.
      what_remains_open: Existing benchmarks focus on a narrow set of environments
        and often lack real-world robot validation; ablation studies rarely separate
        the contribution of data scale, architecture, and training objective, leaving
        open whether reported gains come from the method or from implementation details.
    consensus:
    - World models are treated as action-conditioned or goal-conditioned video prediction
      systems, with diffusion models and transformers as the dominant backbones.
    - Combining self-supervised representation learning (e.g., mask reconstruction,
      VAE) with generative objectives improves sample efficiency and generalization.
    - Evaluating spatial or memory consistency over long horizons is recognized as
      a critical missing dimension in current benchmarks, motivating new datasets.
    - Pretraining on large-scale multitask robotic datasets is emerging as a promising
      paradigm for building generalist world models.
    disagreements:
    - Whether to explicitly inject physics knowledge (e.g., keypoint dynamics, depth
      prediction) or rely on data-driven emergence of physical understanding from
      video.
    - Whether to factorize generation into compositional primitives (language-based)
      or use a monolithic unified architecture for all modalities and tasks.
    - 'The choice of evaluation protocol: open-loop video quality metrics (FID, PSNR)
      vs. closed-loop policy performance (RL success rate, human-normalized score)
      vs. dedicated consistency scores (SGCS, memory/action control scores).'
    - Whether the action modality should be integrated via diffusion with independent
      timesteps or via simple conditioning on the input history, and under which setting
      each performs best.
    open_questions:
    - How can world models maintain spatial and memory consistency over long rollouts
      without prohibitive compute, given that current benchmarks expose failures in
      this regime?
    - To what extent do explicit physics priors (e.g., depth, keypoints) actually
      improve downstream policy robustness compared to implicit physics learned from
      scale, and under what distribution shift?
    - When a unified video–action diffusion model improves policy performance, is
      the gain due to better dynamics modeling, better action representation, or simply
      co-training with more data?
    - Can the recently proposed consistency benchmarks (LoopNav, MIND) be transferred
      to real-world robotic settings, and what adaptation is needed to close the sim-to-real
      gap?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念转化为具体架构、损失函数和训练配方（例如，用于可泛化驾驶视频的DiT配合掩码重建、用于高效RL的VAE-Transformer、或从语言原语组合式视频生成）。
      尚未覆盖: 哪些算法选择（如掩码vs.扩散、显式物理vs.隐式学习、模态统一）能迁移到报告的任务族之外，以及如何验证所学表示捕获的是因果动力学而非视觉相关性。
    - 路线: 规划与动作接口方法
      解决的问题: 通过耦合视频与动作扩散、将上下文纳入潜在状态推断以实现零样本泛化，或使用世界模型梦境进行策略优化，将学习到的动力学连接到决策制定。
      尚未覆盖: 性能收益有多少来自模型本身，而非来自规划器、控制器或任务特定先验；动作接口能否在不重新训练的情况下处理多样化的动作空间；闭环性能提升归因于更好的动力学还是更好的探索。
    - 路线: 方法证据与消融协议
      解决的问题: 提供数据集和基准，以隔离特定能力——通过基于循环的导航评估空间一致性，通过跨视角和动作空间评估记忆一致性和动作控制——从而超越像素级精度进行模型评估。
      尚未覆盖: 现有基准集中在少数环境，缺乏真实机器人验证；消融研究很少分离数据规模、架构和训练目标的贡献，因此报告的收益是来自方法还是实现细节仍不明确。
    共识:
    - 世界模型被视为动作条件或目标条件的视频预测系统，扩散模型和Transformer是主要骨干网络。
    - 将自监督表示学习（如掩码重建、VAE）与生成目标相结合，能提高样本效率和泛化能力。
    - 在长时域上评估空间或记忆一致性被公认为当前基准中缺失的关键维度，推动了新数据集的出现。
    - 在大规模多任务机器人数据集上进行预训练正成为构建通用世界模型的有前景范式。
    分歧:
    - 是显式注入物理知识（如关键点动力学、深度预测），还是依赖从视频中数据驱动的物理理解涌现。
    - 是将生成分解为组合式原语（基于语言），还是为所有模态和任务使用单一的统一架构。
    - 评估协议的选择：开环视频质量指标（FID、PSNR） vs. 闭环策略性能（RL成功率、人类归一化得分） vs. 专用一致性分数（SGCS、记忆/动作控制分数）。
    - 动作模态应通过独立时间步的扩散来集成，还是通过对输入历史的简单条件化来集成，以及在何种设置下每种方法表现最佳。
    开放问题:
    - 在计算资源有限的条件下，世界模型如何在长时域展开中保持空间和记忆一致性，而当前基准已暴露了此方面的问题？
    - 与从大规模数据中隐式学习的物理相比，显式物理先验（如深度、关键点）在何种分布偏移下能真正提升下游策略的鲁棒性？
    - 当统一的视频–动作扩散模型改善了策略性能时，增益是源于更好的动力学建模、更好的动作表示，还是仅仅因为用了更多数据进行联合训练？
    - 最近提出的一致性基准（LoopNav、MIND）能否迁移到真实机器人场景，以及需要什么适配来弥合仿真到现实的差距？
