  related_work_outline:
  - 'Mainstream direction: Designing scalable world model architectures via diffusion-based
    video generation, often combined with action conditioning or physical priors,
    as seen in MaskGWM, Unified World Models, and RoboScape.'
  - 'Shared research pattern: Use self-supervised or conditional video prediction
    as the core training objective, and evaluate on either visual fidelity or downstream
    task performance, while increasingly incorporating memory consistency and spatial
    awareness benchmarks.'
  - 'Key differences: Representation choices split between diffusion transformers,
    recurrent state-space models, and compositional primitives; supervision ranges
    from pure video reconstruction to physics-informed losses; evaluation targets
    vary from closed-loop policy learning to open-loop video quality.'
  - 'Trend evolution: The field moves from 2023''s efficient single-task models (STORM)
    toward 2024–2025''s context-aware and physics-informed generation, culminating
    in 2026''s comprehensive diagnostic benchmarks that measure memory consistency
    and action control across diverse scenarios.'
  - 'Open questions: How to unify architecture design with standardized evaluation
    protocols that isolate model capabilities from planner/controller contributions,
    and how to scale physics-informed world models to real-world noisy domains without
    prohibitive computation.'
  related_work_outline_zh:
  - 主流方向：设计基于扩散视频生成的可扩展世界模型架构，常结合动作条件或物理先验，如MaskGWM、Unified World Models和RoboScape所示。
  - 研究共性：以自监督或条件视频预测为核心训练目标，评估视觉保真度或下游任务表现，同时越来越多地纳入记忆一致性和空间感知基准。
  - 关键差异：表示选择在扩散Transformer、循环状态空间模型和组合原语之间分化；监督信号从纯视频重建到物理信息损失；评测目标从闭环策略学习到开环视频质量各异。
  - 趋势演进：领域从2023年高效单任务模型（STORM）发展到2024–2025年的上下文感知和物理信息生成，至2026年出现全面诊断基准，衡量跨场景的记忆一致性和动作控制。
  - 开放问题：如何将架构设计与标准化评估协议统一，以隔离模型能力与规划器/控制器贡献；如何在不带来过高计算开销的前提下，将物理信息世界模型扩展到真实世界的噪声域。
  literature_review:
    line_of_work_matrix:
    - line: World model representation and architecture design
      what_it_solves: Developing efficient and generalizable architectures for modeling
        environment dynamics, including diffusion transformers, stochastic recurrent
        models, and compositional primitives, to generate high-fidelity videos or
        latent states.
      what_remains_open: Which architectural inductive biases (e.g., masking, physics
        priors) transfer across tasks; how to balance model capacity with training
        and inference speed; and the lack of consistent metrics to compare architectures
        beyond visual quality.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned world models to decision-making by training
        policies on imagined rollouts, generating video plans from language, or jointly
        diffusing actions and observations within a unified framework.
      what_remains_open: The extent to which performance gains are attributable to
        the world model versus the planner or action prior; limited evaluation beyond
        simulated or controlled environments; and the assumption of observable context
        or pre-defined action primitives.
    - line: Evaluation benchmarks and capability diagnostics
      what_it_solves: Providing standardized datasets and metrics to assess specific
        world model capabilities such as spatial consistency, long-term memory, and
        action controllability, moving beyond aggregate task scores.
      what_remains_open: Coverage of real-world sensory noise and diverse embodiment;
        alignment of diagnostic metrics with downstream robot performance; and the
        need for benchmarks that simultaneously test multiple capabilities under a
        unified protocol.
    consensus:
    - Video prediction is the dominant self-supervised task for learning world models.
    - Temporal and spatial consistency are critical for coherent rollouts, yet current
      models still struggle with long-horizon memory.
    - Incorporating actions or physical signals improves model fidelity and generalization.
    - Standardized evaluation is urgently needed to separate model capabilities from
      training or planning choices.
    disagreements:
    - 'Representation approach: diffusion-based models vs. recurrent state-space models
      vs. compositional factorized generators.'
    - 'Supervision signal: some works rely solely on video reconstruction, while others
      inject physics-informed losses (depth, keypoints) or action-conditioned diffusion.'
    - 'Evaluation target: visual quality metrics (FVD, PSNR) vs. task success in policy
      learning vs. diagnostic scores for memory and action control.'
    - 'Interaction mode: open-loop video generation for inspection vs. closed-loop
      policy training inside the world model vs. unified diffusion of both actions
      and frames.'
    open_questions:
    - How can we design a single unified evaluation protocol that covers spatial consistency,
      memory, physical plausibility, and action controllability?
    - What is the minimal set of inductive biases needed for a world model to generalize
      across diverse embodiments and environments?
    - Can physics-informed world models be trained efficiently on real-world data
      without requiring dense physical annotations?
    - To what extent do improvements in video generation quality translate to better
      policy performance in downstream tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型表示与架构设计
      解决的问题: 开发高效且可泛化的架构以建模环境动力学，包括扩散Transformer、随机循环模型和组合原语，以生成高保真视频或潜在状态。
      尚未覆盖: 哪些架构归纳偏置（如掩码、物理先验）能跨任务迁移；如何在模型容量与训练推理速度间取得平衡；缺乏超越视觉质量的一致性指标来比较架构。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的世界模型与决策相连，通过在想象轨迹上训练策略、从语言生成视频计划，或在统一框架中联合扩散动作与观测。
      尚未覆盖: 性能增益中有多少来自世界模型而非规划器或动作先验；评估局限于仿真或受控环境；假设上下文可观测或依赖预定义动作原语。
    - 路线: 评估基准与能力诊断
      解决的问题: 提供标准化数据集和指标，以评估特定世界模型能力，如空间一致性、长期记忆和动作可控性，超越了聚合任务分数。
      尚未覆盖: 覆盖真实世界感知噪声和多样化具身形态；诊断指标与下游机器人性能的对齐；需要在统一协议下同时测试多种能力的基准。
    共识:
    - 视频预测是学习世界模型的主要自监督任务。
    - 时空一致性对于连贯的展开至关重要，但当前模型在长期记忆上仍面临困难。
    - 融入动作或物理信号可提升模型保真度和泛化能力。
    - 亟需标准化评估以将模型能力与训练或规划选择分离。
    分歧:
    - 表示方法：基于扩散的模型 vs. 循环状态空间模型 vs. 组合分解生成器。
    - 监督信号：部分工作仅依赖视频重建，而其他工作注入物理信息损失（深度、关键点）或动作条件扩散。
    - 评估目标：视觉质量指标（FVD、PSNR） vs. 策略学习中的任务成功率 vs. 记忆与动作控制的诊断分数。
    - 交互模式：用于检查的开环视频生成 vs. 在世界模型中的闭环策略训练 vs. 动作与帧的统一扩散。
    开放问题:
    - 如何设计一个统一的评估协议，同时覆盖空间一致性、记忆、物理合理性和动作可控性？
    - 世界模型跨多样具身形态和环境泛化所需的最小归纳偏置集是什么？
    - 物理信息驱动的世界模型能否在真实世界数据上高效训练，而不依赖密集的物理标注？
    - 视频生成质量的提升在多大程度上转化为下游任务中策略性能的提升？
