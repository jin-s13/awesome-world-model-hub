  related_work_outline:
  - 'Mainstream direction: Current work treats learned world simulators as testable
    systems and stresses them with standardized tasks, favoring diffusion-based or
    transformer architectures that preserve visual detail and support video/action
    generation.'
  - 'Shared research pattern: Papers jointly evaluate visual fidelity, temporal consistency,
    action controllability, and zero-shot generalization, often against established
    baselines or datasets rather than isolated qualitative examples.'
  - 'Key differences: Evaluation targets differ across Atari game performance, open-domain
    spatial/memory consistency, driving video prediction, and robotic policy utility;
    supervision also ranges from context-conditioned latent dynamics to physics-informed
    generation.'
  - 'Trend evolution: Within the available 2023–2026 frontier, work moves from efficient
    discrete/transformer world models toward diffusion-based visual world models,
    and from method-only claims toward closed-loop, memory- and consistency-oriented
    benchmarks.'
  - 'Open questions: Whether consistency metrics align with downstream control, how
    stable benchmark gains are across implementations and compute budgets, and how
    well dataset-only benchmarks report baselines and limitations.'
  related_work_outline_zh:
  - 主流方向：当前前沿将世界模型视为可测试的学习式模拟器，并通过标准化任务做压力测试，偏向扩散或Transformer架构以保留视觉细节并支持视频/动作生成。
  - 研究共性：论文普遍同时关注视觉保真、时间一致性、动作可控性和零样本泛化，并依赖既有基线或数据集进行验证。
  - 关键差异：评测目标不同，包括Atari游戏表现、开放域空间/记忆一致性、驾驶视频预测和机器人策略效用；监督信号也各异。
  - 趋势演进：在2023–2026证据窗口内，研究从高效离散/Transformer世界模型转向扩散视觉世界模型，并从方法主张转向闭环、记忆与一致性导向的基准。
  - 开放问题：一致性指标能否预测下游控制表现、基准增益在实现和算力预算下是否稳定，以及数据集型基准是否报告充分基线和局限。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared datasets and closed-loop tasks for targeted evaluation
        of spatial consistency, memory consistency, and action control in learned
        simulators.
      what_remains_open: Whether the task distribution covers real deployment settings,
        and whether dataset-first contributions provide enough quantitative baseline
        results.
    - line: Metric and stress-test design
      what_it_solves: Designs metrics that isolate long-term temporal stability, cross-view
        coherence, controllability, and zero-shot generalization instead of relying
        on aggregate scores.
      what_remains_open: Alignment between proxy metrics and downstream decision utility,
        and robustness of these metrics across domains and action spaces.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared tasks and baselines to make visual fidelity, sample
        efficiency, generalization, and pretraining gains auditable across implementations.
      what_remains_open: Whether reported comparisons remain stable under different
        compute budgets and implementation choices; several visible limitation fields
        are empty verification gaps.
    consensus:
    - Learned-simulator evaluation now treats visual quality, temporal coherence,
      memory, and action conditioning as separate evidence dimensions rather than
      a single reward score.
    - Standardized tasks and datasets are the dominant comparison method across game,
      driving, navigation, and robotic settings.
    - Diffusion-based and transformer-based generation has become the current frontier
      because it better preserves visual detail and supports multimodal prediction.
    - Recent benchmarks move toward closed-loop or loop-navigation-style testing to
      expose failures that open-loop generation scores may miss.
    disagreements:
    - 'Evaluation target differs: some work optimizes human-normalized game scores,
      while other work targets open-domain consistency or downstream robot-policy
      utility.'
    - 'Supervision and modeling differ: some approaches condition latent dynamics
      on context, some couple video and action diffusion, and others inject depth-
      or keypoint-based physical constraints.'
    - 'Interaction mode differs: open-loop prediction, closed-loop rollout, and action-free
      video pretraining are used across studies, making direct comparison difficult.'
    - Assumptions differ around context observability, action-space availability,
      and the role of physics constraints during evaluation.
    open_questions:
    - Do the proposed consistency and realism metrics predict downstream policy success
      in driving, robotics, or control tasks?
    - How stable are benchmark gains across architectures, implementation details,
      and compute budgets?
    - Can benchmarks test unseen action spaces and long-horizon memory without introducing
      dataset-specific shortcuts?
    - What verification standards are needed for benchmark-first or dataset-only contributions
      that report no experimental baselines or limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享数据集和闭环任务，专项评测学习式模拟器的空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 任务是否覆盖真实部署分布，以及数据集型工作是否提供足够定量基线。
    - 路线: 指标与压力测试设计
      解决的问题: 设计能分离长时域稳定性、跨视角连贯性、可控性和零样本泛化的指标，避免只看总体分数。
      尚未覆盖: 代理指标与下游决策效用是否一致，以及这些指标在不同领域和动作空间中的稳健性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享任务和基线，审计视觉保真、样本效率、泛化和预训练收益。
      尚未覆盖: 报告结论在不同实现和算力预算下是否稳定；多个前沿论文的局限字段为空，属验证缺口。
    共识:
    - 当前评估将视觉质量、时间一致性、记忆和动作条件化视为独立能力维度，而不是单一奖励分数。
    - 标准化任务和数据集是主流比较方式，覆盖游戏、驾驶、导航和机器人等场景。
    - 扩散式与Transformer式生成成为当前前沿，因为其更利于保留视觉细节并支持多模态预测。
    - 近期基准倾向闭环或循环导航式测试，以暴露开环生成分数无法捕捉的失败。
    分歧:
    - 评测目标不同：有的优化人类归一化游戏得分，有的评测空间或记忆一致性，有的验证下游机器人策略效用。
    - 监督与建模方式不同：有的以上下文条件隐动态，有的耦合视频与动作扩散，有的通过深度或关键点注入物理约束。
    - 交互模式不同：开环预测、闭环展开和被动视频预训练并存，导致直接比较困难。
    - 关键假设不同：上下文可观测性、动作空间可得性以及物理约束的作用在各项工作中存在差异。
    开放问题:
    - 现有视觉与一致性指标能否预测驾驶、机器人或控制任务中的下游策略成功？
    - 基准增益在不同架构、实现细节和算力预算下是否稳定？
    - 基准能否在测试未见动作空间和长时记忆的同时避免数据集特定捷径？
    - 对于不报告实验基线或局限性的数据集型或基准型工作，应建立哪些验证标准？
