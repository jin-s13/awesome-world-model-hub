    and open-source simulation.'
  - 'Shared research pattern: Papers treat future visual or state generation as a
    controllable simulation problem by conditioning on language, actions, ego-motion,
    goals, or latent states, and evaluate through video prediction, motion prediction,
    driving, or robot control tasks.'
  - 'Key differences: They diverge in representation (language-derived primitives,
    persistent global state, latent spaces, autoregressive transformers), scope (general
    taxonomy vs driving, ego-vision, or robot settings), and evaluation depth (empirical
    benchmarks vs conceptual frameworks).'
  - 'Trend evolution: From 2023 driving simulation to 2024 Sora-centered surveys and
    compositional robot world models, then 2025 multimodal datasets and 2026 persistent
    out-of-sight, real-time open-source, and latent driving taxonomy work; the trend
    is toward consistency, interactivity, openness, and evaluation-grounded synthesis.'
  - 'Open questions: Real-robot and out-of-distribution generalization beyond seen
    primitives, standardized closed-loop versus open-loop evaluation, empirical validation
    of proposed taxonomies, and balancing persistent long-horizon state with real-time
