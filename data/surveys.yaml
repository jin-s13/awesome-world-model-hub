  related_work_outline:
  - 'Mainstream direction: World models are being specialized into controllable, closed-loop
    simulators for driving, robotics, and interactive environments, with action- or
    context-conditioned generation serving policy learning and evaluation.'
  - 'Shared research pattern: Diffusion or recurrent sequence models are combined
    with auxiliary objectives such as masked reconstruction, depth, physics, context,
    or action prediction to improve long-horizon consistency and generalization.'
  - 'Key differences: Evaluation targets vary from visual fidelity and dataset metrics
    to spatial or memory consistency, action controllability, zero-shot reward, and
    policy execution; deployment settings range from driving and robotics to Atari
    and Minecraft.'
  - 'Trend evolution: Available top-paper evidence moves from efficient latent world
    models for Atari-style RL toward diffusion-based driving and robot video models
    and dedicated consistency benchmarks, concentrated in 2023–2026.'
  - 'Open questions: Real-world transfer, unseen primitive and embodiment generalization,
    links between consistency benchmarks and downstream performance, and scalable
    long-horizon closed-loop evaluation remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型正被特化为面向驾驶、机器人和交互环境的可控闭环模拟器，用动作或上下文条件生成来支撑策略学习与评测。
  - 研究共性：扩散或循环序列模型常与掩码重建、深度、物理、上下文或动作预测等辅助目标结合，以改善长时域一致性和泛化。
  - 关键差异：评测目标从视觉保真和数据指标到空间/记忆一致性、动作可控、零样本奖励及策略执行各不相同；部署环境涵盖驾驶、机器人、Atari 和 Minecraft。
  - 趋势演进：现有高读论文显示，研究从面向Atari式RL的高效潜在世界模型，转向基于扩散的驾驶/机器人视频模型和专门一致性基准，集中在2023–2026年。
  - 开放问题：真实世界迁移、未见原语与本体泛化、一致性基准与下游性能的关系，以及可扩展的长时域闭环评测仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and closed-loop scene prediction
      what_it_solves: Uses diffusion-based video generation with masked reconstruction
        to predict multi-view, long-horizon driving scenes across datasets and camera
        views.
      what_remains_open: Evidence does not yet tie improved validation or rollout
        metrics to real driving safety, planning quality, or operational deployment
        outcomes.
    - line: Embodied robot world models with physics and action grounding
      what_it_solves: Learns video generation conditioned on language, keypoints,
        depth, or coupled action diffusion to synthesize robot plans and pretrain
        policies.
      what_remains_open: Generalization beyond training primitive combinations, embodiments,
        and simulation remains unresolved; real-robot validation and physical plausibility
        across unseen tasks are limited.
    - line: Model-based RL and contextual zero-shot dynamics
      what_it_solves: Builds latent or stochastic world models for efficient policy
        learning and zero-shot generalization under changing dynamics in Atari and
        contextual control tasks.
      what_remains_open: Context observability assumptions and limited task suites
        leave broader generalization, partial observability, and transfer to physical
        systems unverified.
    - line: Spatial, memory, and action-consistency benchmarking
      what_it_solves: Creates open-domain navigation and video benchmarks that measure
        loop closure, memory consistency, and action controllability beyond pixel-level
        generation quality.
      what_remains_open: Whether these consistency scores predict downstream task
        performance or real-world reliability is not established; current baselines
        reveal long-term and cross-action-space failures.
    consensus:
    - Application work increasingly treats world models as controllable, closed-loop
      simulators, not just open-loop video generators, by conditioning on actions,
      context, language, keypoints, or depth.
    - Across domains, diffusion transformers and recurrent state-space models are
      paired with auxiliary objectives such as mask reconstruction, depth prediction,
      or dynamics prediction to address long-horizon consistency.
    - Evaluation is shifting toward dedicated benchmarks that score temporal or spatial
      consistency, action control, and zero-shot transfer, with public datasets and
      code becoming common signals.
    disagreements:
    - 'Representation: some methods operate in latent state-space rollouts for policy
      learning, while others synthesize high-dimensional video frames.'
    - 'Action coupling: one line joins video and action diffusion in a unified model,
      whereas others factorize video generation from language or use separate policy
      training.'
    - 'Evaluation target: some optimize visual fidelity and dataset metrics, while
      others target spatial loop consistency, memory consistency, zero-shot reward,
      or policy execution success.'
    - 'Deployment setting: driving, robot simulation, and game or Minecraft setups
      differ in action spaces and in whether real-world safety or physical interaction
      is evaluated.'
    open_questions:
    - Do improved driving world-model metrics on Nuscenes, OpenDV-2K, or Waymo translate
      to better planning and real-world safety outcomes?
    - Can compositional robot world models handle new primitives, unseen embodiments,
      and real-robot execution beyond simulation?
    - Are spatial consistency and memory/action control benchmarks predictive of downstream
      policy performance?
    - Does unified video-action pretraining scale across heterogeneous robot datasets
      without entangling action and dynamics predictions?
    - How can long-horizon closed-loop evaluation remain affordable while measuring
      control precision and consistency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与闭环场景预测
      解决的问题: 利用基于扩散的视频生成和掩码重建，预测跨数据集、多视角、长时域驾驶场景，服务闭环仿真。
      尚未覆盖: 现有证据尚未把验证或 rollout 指标提升与真实驾驶安全、规划质量或部署效果直接关联。
    - 路线: 具身机器人世界模型与物理动作基础
      解决的问题: 通过语言、关键点、深度或耦合动作扩散条件生成视频，合成机器人计划并预训练策略。
      尚未覆盖: 对训练原语组合、本体和仿真之外的泛化仍不明确，现实机器人验证和未知任务物理合理性有限。
    - 路线: 基于模型的强化学习与上下文零样本动力学
      解决的问题: 构建潜在或随机世界模型，在 Atari 和上下文控制任务中实现高效策略学习与变化动力学下的零样本泛化。
      尚未覆盖: 上下文可观测假设和有限任务套件使更广泛泛化、部分可观测和物理系统迁移尚未得到验证。
    - 路线: 空间、记忆与动作一致性基准
      解决的问题: 建立开放域导航和视频基准，超越像素级生成质量，测量闭环、记忆一致性和动作可控性。
      尚未覆盖: 这些一致性分数能否预测下游任务表现或现实可靠性尚未证实，现有基线暴露出长时域和跨动作空间失败。
    共识:
    - 应用研究越来越把世界模型视为可控闭环模拟器，而非仅做开环视频生成，常用条件包括动作、上下文、语言、关键点或深度。
    - 不同方法倾向于将扩散Transformer或循环状态空间模型与掩码重建、深度预测、动力学预测等辅助目标结合，以处理长时域一致性和泛化。
    - 评测正从单一视觉质量转向时空一致性、动作控制和零样本迁移，并越来越多地公开数据集与代码。
    分歧:
    - 表示方式：一些方法在潜在状态空间中 rollout 训练策略，另一些直接生成高维视频帧。
    - 动作耦合：一部分将视频与动作扩散统一建模，另一部分把视频生成从语言中分解，策略学习与视频生成可分离。
    - 评测目标：有的重视视觉保真与数据集指标，有的强调空间闭环、记忆一致性、零样本奖励或策略执行成功。
    - 部署场景：驾驶、机器人仿真和 Atari/Minecraft 等环境在动作空间及是否评估真实安全或物理交互上存在明显差异。
    开放问题:
    - 驾驶世界模型在 Nuscenes、OpenDV-2K 或 Waymo 上的指标提升是否转化为更好的规划质量和真实安全结果？
    - 组合式机器人世界模型能否处理训练中未见的新原语、未见本体，并支持仿真之外的现实机器人执行？
    - 空间一致性、记忆一致性和动作控制基准能否预测下游策略性能？
    - 统一视频-动作预训练能否在异构机器人数据集上扩展，同时避免动作与动力学预测相互纠缠？
    - 如何在可接受成本下闭环评估长时域控制精度和一致性？
