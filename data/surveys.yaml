  related_work_outline_zh:
  - 主流方向：近期方法工作以扩散与Transformer视频世界模型为主，面向驾驶和机器人，核心是动作、上下文或语言条件控制。
  - 研究共性：在生成或预测目标之外引入结构化辅助目标，如掩码重建、物理信息、动作扩散、上下文条件或组合原语。
  - 关键差异：表示方式（潜在循环状态与像素扩散）、监督信号、评测目标及部署域各不相同。
  - 趋势演进：可见高相关性证据从2023年Transformer/VAE模型强化学习，走向2024–2026年扩散视频世界模型和一致性/动作控制基准，趋势处在前沿窗口。
  - 开放问题：长时空间/记忆/动作一致性、物理合理性、跨域迁移以及方法贡献隔离仍不清晰。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion and transformer video world models for embodied and driving
        prediction
      what_it_solves: Generate action-, context-, or language-conditioned video rollouts,
        including multi-view and long-horizon scenarios, for prediction and robot/driving
        applications.
      what_remains_open: Generalization to unseen scenes, action spaces, physical
        plausibility, and whether generated videos improve downstream control rather
        than only visual metrics.
    - line: Latent stochastic dynamics world models for sample-efficient model-based
        RL
      what_it_solves: Learn compact state representations and imagined rollouts for
        policy improvement, with fast training and zero-shot transfer over observed
        context variables.
      what_remains_open: Assumes context observability and is evaluated on narrow
        benchmarks; broader task families and unknown-dynamics generalization remain
        unverified.
    - line: Structured and compositional world models
      what_it_solves: Decompose instructions or observations into primitives/components
        to enable unseen combinations in video generation or masked reconstruction.
      what_remains_open: Entirely novel primitives, parsing reliability, and transfer
        beyond the demonstrated datasets are not established.
    - line: Physics-informed auxiliary objectives for visual world models
      what_it_solves: Embed 3D geometric or physical information via tasks such as
        temporal depth or keypoint dynamics to improve video fidelity and physical
        plausibility.
      what_remains_open: Which physical properties are captured, how this transfers
        across embodiments, and downstream policy impact are not isolated.
    - line: World model consistency and action-control benchmarks
      what_it_solves: Provide datasets and metrics for spatial, memory, and action-control
        consistency beyond pixel reconstruction.
      what_remains_open: Limited scene coverage and baselines; connection to real
        task performance and standard training/evaluation protocols still missing.
    consensus:
    - Recent methods treat world models as video or state predictors whose rollouts
      must be conditioned on action, context, or language rather than unconditioned
      generation.
    - Many methods add structured auxiliary objectives to the core generative or predictive
      loss to address temporal, spatial, physical, or control consistency.
    - Benchmark-oriented work is shifting evaluation from pixel quality toward memory
      consistency, spatial consistency, and closed-loop action control.
    - Several top papers report strong in-domain results, but limitation reporting
      and cross-domain validation are uneven, leaving method-level verification gaps.
    disagreements:
    - 'Representation differs: compact latent recurrent state-space models coexist
      with pixel-level diffusion transformer video generation.'
    - 'Supervision differs: model-based RL uses imagined rollouts for policy learning,
      while other lines use video/action diffusion, physics auxiliary tasks, or language-primitive
      composition.'
    - 'Evaluation target differs: sample-efficient Atari RL, driving video prediction,
      zero-shot dynamics generalization, robot video planning, and consistency/action-control
      benchmarks are separate goals.'
    - 'Interaction and deployment differ: settings range from action-free video generation
      to action-conditioned rollouts, policy/dynamics timestep control, and open-world,
      driving, robot, or control environments.'
    open_questions:
    - Can current consistency benchmarks reliably measure long-horizon spatial, memory,
      and action control, and do they predict real downstream control performance?
    - Which auxiliary objectives, such as mask reconstruction, physics prediction,
      action diffusion, or context conditioning, are necessary and transferable across
      domains?
    - Do compositional world models only recombine seen primitives, or can they support
      entirely novel objects, actions, and instructions?
    - When limitations, code, dataset, or evaluation protocols are missing, how should
      the field separate method contribution from system implementation and benchmark
      choice?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向具身与驾驶的扩散/Transformer视频世界模型
      解决的问题: 生成以动作、上下文或语言为条件的视频推演，包括多视角与长时域预测，用于驾驶和机器人应用。
      尚未覆盖: 对未见场景、动作空间和物理合理性的泛化，以及生成视频是否改善下游控制而不仅是视觉指标。
    - 路线: 面向采样高效模型强化学习的潜在随机动力学世界模型
      解决的问题: 学习紧凑状态表示与想象轨迹，用于策略改进，实现快速训练和对已观测上下文变量的零样本迁移。
      尚未覆盖: 假设上下文可观测且在较窄基准上评估，更广泛任务族和未知动力学泛化尚未验证。
    - 路线: 结构化与组合式世界模型
      解决的问题: 将指令或观测分解为原语/组件，用于视频生成或掩码重建中的未见组合。
      尚未覆盖: 偏全新原语、解析可靠性以及超出演示数据集的迁移均未确立。
    - 路线: 面向视觉世界模型的物理信息辅助目标
      解决的问题: 通过时序深度或关键点动力学等任务嵌入3D几何或物理信息，改善视觉保真度和物理合理性。
      尚未覆盖: 捕获了哪些物理属性、跨实体的迁移以及下游策略影响尚未隔离。
    - 路线: 世界模型一致性与动作控制基准
      解决的问题: 提供用于空间、记忆和动作控制一致性的数据集与指标，超越像素重建。
      尚未覆盖: 场景覆盖与基线仍有限，与真实任务性能的连接及标准化训练评测协议尚缺。
    共识:
    - 近期方法普遍将世界模型视为以动作、上下文或语言为条件的视频/状态推演模型，强调条件控制。
    - 许多工作在生成或预测目标之外引入辅助结构化目标，如掩码重建、物理信息、动作扩散与组合原语。
    - 基准工作开始从像素质量转向记忆一致性、空间一致性和闭环动作控制。
    - 多个报告的方法在特定基准上显示优势，但局限性和跨域验证不均衡，方法级证据仍有缺口。
    分歧:
    - 表示方式不同：潜在循环状态空间模型与像素级扩散视频Transformer并行存在。
    - 监督信号不同：基于RL想象轨迹的策略学习、视频/动作联合扩散、物理辅助任务和语言原语组合各自形成路线。
    - 评测目标不同：Atari采样效率、驾驶视频预测、零样本动力学泛化、机器人视频规划以及一致性/动作控制基准分别被强调。
    - 交互与部署不同：从无动作视频生成到动作条件推演、策略/动力学时间步控制，以及开放世界、驾驶、机器人和控制任务。
    开放问题:
    - 当前一致性基准能否可靠衡量长时空间/记忆/动作控制，并预测真实下游控制性能？
    - 掩码重建、物理预测、动作扩散或上下文条件等辅助目标中，哪些对跨域世界模型是必需且可迁移的？
    - 组合式世界模型只是重组已知原语，还是能支持全新物体、动作和指令？
    - 当局限性、代码、数据集或评测协议缺失时，如何区分方法贡献与系统实现和基准选择？
