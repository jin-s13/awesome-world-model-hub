  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving, robotics, and
    interactive RL are converging on generative video/diffusion backbones that predict
    future observations conditioned on actions, language, or context.'
  - 'Shared research pattern: Most works learn a predictive model from high-dimensional
    visual experience and then use imagined rollouts or generated videos for policy
    learning, planning, or benchmark evaluation.'
  - 'Key differences: Papers split by representation (diffusion transformer, recurrent
    state-space, transformer-VAE), supervision (video-only, action, context, physics
    auxiliaries), and evaluation target (driving, robot manipulation, Atari, memory/action
    consistency).'
  - 'Trend evolution: Within the visible top evidence from 2023-2026, work is shifting
    from sample-efficient model-based RL toward large-scale video generation world
    models, unified video-action pretraining, and dedicated consistency benchmarks.'
  - 'Open questions: Real-world transfer, long-horizon consistency, generalization
    beyond training primitives or contexts, and whether benchmark scores predict downstream
    task success remain unresolved.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互式强化学习的领域世界模型，主流采用生成式视频或扩散主干，按动作、语言或上下文预测未来观测。
  - 研究共性：多数方法从高维视觉经验学习预测模型，并利用想象轨迹或生成视频进行策略学习、规划或基准评测。
  - 关键差异：表示方式（扩散Transformer、循环状态空间、Transformer-VAE）、监督信号（仅视频、动作、上下文、物理辅助）和评测目标（驾驶、机器人、Atari、记忆/动作一致性）不同。
  - 趋势演进：在可见的2023-2026年主要证据中，研究正从样本高效的模型式强化学习转向大规模视频生成世界模型、统一视频-动作预训练和专门一致性基准。
  - 开放问题：真实世界迁移、长时域一致性、对训练原语或上下文之外的泛化，以及基准分数能否预测下游任务成功，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving and closed-loop simulation world models (e.g., MaskGWM)
      what_it_solves: Long-horizon and multi-view driving scene prediction across
        datasets by combining diffusion transformers with mask reconstruction.
      what_remains_open: Alignment between simulator or video-prediction gains and
        real-world safety, interactive closed-loop driving outcomes, or operational
        deployment remains unverified.
    - line: Robot video generation and video-action world models (e.g., RoboDreamer,
        RoboScape, UWM)
      what_it_solves: Generating robot manipulation videos or coupled action-video
        predictions for policy pretraining, compositional task generalization, and
        physics-informed planning.
      what_remains_open: Generalization beyond seen language primitives, transfer
        from simulated video generation to real robot execution, and open-domain robustness
        across embodiments and scenes.
    - line: Model-based RL with learned world dynamics (e.g., STORM, cRSSM)
      what_it_solves: Sample-efficient policy learning from imagined trajectories
        for visual control and zero-shot generalization under observable context changes.
      what_remains_open: Context observability assumptions, narrow benchmark coverage,
        and transfer across tasks or non-stationary environments are only partly tested.
    - line: World-model consistency and action-control benchmarks (e.g., LoopNav,
        MIND)
      what_it_solves: Quantifying spatial consistency, memory consistency, and action
        control in open interactive environments via datasets and metrics.
      what_remains_open: Evidence that these metrics predict downstream world-model
        quality or task performance across diverse scenes and action spaces is missing.
    consensus:
    - Generative modeling dominates recent domain applications, with many approaches
      using diffusion or transformer architectures to predict future frames or latent
      states.
    - World-model training is increasingly used beyond passive prediction, often for
      policy learning, pretraining, planning, or interactive evaluation.
    - Evaluation is tied to domain-specific benchmarks and datasets, with recent work
      emphasizing generalization across scenes, datasets, or task variations.
    - Auxiliary signals such as action, language, context, or physics knowledge are
      treated as important for controllability and plausibility.
    disagreements:
    - 'Representation: some works use diffusion transformers with mask reconstruction,
      others use recurrent state-space models, transformer-VAE models, or unified
      video-action diffusion.'
    - 'Supervision: methods differ between video-only generation, action-conditioned
      rollouts, observable context conditioning, and physics auxiliary tasks.'
    - 'Evaluation target: success is measured as driving video quality, robot video
      fidelity or execution, Atari human-normalized score, zero-shot policy generalization,
      or consistency benchmark metrics.'
    - 'Interaction mode: some evaluations are open-loop future prediction or imagined
      rollout, while others use closed-loop revisited navigation or action-control
      settings.'
    - 'Deployment setting: evidence spans simulated robot execution, large robot datasets,
      game environments, and driving datasets, with different reliance on synthetic
      versus real-world validation.'
    open_questions:
    - Do improvements in driving video prediction transfer to safer closed-loop driving
      or real-world operational outcomes?
    - Can robot world models handle genuinely novel primitives, real-world execution,
      and unseen embodiments beyond simulated or dataset-specific evaluation?
    - How well do consistency benchmark metrics predict downstream policy success
      or world-model usefulness across scenes and action spaces?
    - Which assumptions, such as observable context values or closed action spaces,
      are necessary for current world models to generalize?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶与闭环仿真世界模型（如MaskGWM）
      解决的问题: 通过扩散Transformer与掩码重建进行长时域、多视角驾驶场景预测，并跨数据集泛化。
      尚未覆盖: 仿真或视频预测收益与真实安全、交互式闭环驾驶或运营部署之间的对应关系尚未验证。
    - 路线: 机器人视频生成与视频-动作世界模型（如RoboDreamer、RoboScape、UWM）
      解决的问题: 生成机器人操作视频或耦合动作-视频预测，用于策略预训练、组合任务泛化和物理合理的规划。
      尚未覆盖: 对训练原语之外的新组合、从仿真视频到真实机器人执行的迁移，以及跨本体和场景的开放域鲁棒性仍有缺口。
    - 路线: 基于模型强化学习的动力学世界模型（如STORM、cRSSM）
      解决的问题: 通过想象轨迹进行样本高效策略学习，并在可观测上下文变化下实现零样本泛化。
      尚未覆盖: 上下文可观测假设、狭窄基准覆盖，以及跨任务或非平稳环境的迁移仅被部分验证。
    - 路线: 世界模型一致性与动作控制基准（如LoopNav、MIND）
      解决的问题: 通过数据集和度量量化开放交互环境中的空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些度量能否预测下游世界模型质量或跨场景、跨动作空间的任务表现仍缺乏证据。
    共识:
    - 生成式建模主导近期领域应用，许多方法使用扩散或Transformer架构预测未来帧或潜在状态。
    - 世界模型训练越来越多地超越被动预测，用于策略学习、预训练、规划或交互式评测。
    - 评测依赖领域特定基准和数据集，近期工作强调跨场景、跨数据集或跨任务变化的泛化。
    - 动作、语言、上下文或物理知识等辅助信号被视为可控性和合理性的重要来源。
    分歧:
    - 表示方式：有的使用带掩码重建的扩散Transformer，有的使用循环状态空间、Transformer-VAE或统一视频-动作扩散。
    - 监督信号：方法在仅视频生成、动作条件轨迹、可观测上下文条件和物理辅助任务之间不同。
    - 评测目标：成功标准包括驾驶视频质量、机器人视频保真或执行、Atari人类标准化得分、零样本策略泛化或一致性度量。
    - 交互模式：部分评测是开环未来预测或想象轨迹，另一些采用闭环回访导航或动作控制设置。
    - 部署场景：证据涵盖仿真机器人执行、大规模机器人数据集、游戏环境和驾驶数据集，对合成与真实验证的依赖不同。
    开放问题:
    - 驾驶视频预测的提升能否迁移到更安全的闭环驾驶或真实运营结果？
    - 机器人世界模型能否处理真正的新原语、真实执行和训练本体之外的未见场景？
    - 一致性基准度量能否预测跨场景和动作空间的下游策略成功或世界模型有用性？
    - 当前世界模型依赖哪些假设（如可观测上下文值或闭集动作空间）？这些假设在开放环境中是否成立？
