  related_work_outline:
  - 'Mainstream direction: Designing domain-specific benchmarks and metrics to evaluate
    world model capabilities beyond aggregate scores, with a focus on spatial-temporal
    consistency, memory, and action controllability.'
  - 'Shared research pattern: Proposing new datasets with controlled variations and
    tailored metrics to probe specific world model weaknesses, while existing methods
    rely on standard benchmarks like Atari 100k and Nuscenes for overall performance.'
  - 'Key differences: Benchmarks differ in domain (Minecraft vs. driving vs. robotics),
    evaluation modality (video prediction vs. policy learning), and the specific capability
    tested (spatial consistency vs. memory consistency vs. action control).'
  - 'Trend evolution: From generic RL benchmarks (Atari) to specialized benchmarks
    testing long-horizon consistency and action-conditioned generation, with recent
    works (2025–2026) emphasizing memory and spatial coherence.'
  - 'Open questions: How to align benchmark metrics with real-world deployment needs;
    whether current benchmarks cover the full range of world model applications; and
    the lack of standardized evaluation protocols across domains.'
  related_work_outline_zh:
  - 主流方向：设计领域特定的基准和指标，以评估世界模型在总分之外的能力，重点关注时空一致性、记忆和动作可控性。
  - 研究共性：提出具有受控变化和定制指标的新数据集，以探测世界模型的特定弱点，同时现有方法依赖 Atari 100k 和 Nuscenes 等标准基准进行整体性能评估。
  - 关键差异：基准在领域（Minecraft、驾驶、机器人）、评估模态（视频预测 vs. 策略学习）和测试的具体能力（空间一致性 vs. 记忆一致性 vs. 动作控制）上存在差异。
  - 趋势演进：从通用 RL 基准（Atari）转向测试长时域一致性和动作条件生成的专业基准，近期工作（2025–2026）强调记忆和空间连贯性。
  - 开放问题：如何使基准指标与实际部署需求对齐；当前基准是否覆盖世界模型应用的全部范围；以及跨领域标准化评估协议的缺失。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared tasks and datasets to compare world models on
        specific capabilities like spatial consistency (e.g., LoopNav) or memory and
        action control (e.g., MIND).
      what_remains_open: Coverage of diverse real-world settings and long-horizon
        scenarios; most benchmarks are limited to simulated or game environments,
        and their task distributions may not reflect deployment conditions.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, and robustness beyond aggregate
        scores, using metrics like Scene Graph Consistency Score for spatial consistency
        or memory consistency measures.
      what_remains_open: Alignment between proxy metrics and downstream decision utility;
        metrics often lack validation against human judgments or task success, and
        their sensitivity to implementation details is unclear.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditable comparisons through common baselines (Dreamer,
        STORM, DIAMOND) on standard benchmarks (Atari 100k, Nuscenes), facilitating
        progress tracking.
      what_remains_open: Stability of conclusions across implementations and compute
        budgets; many method papers lack code or detailed hyperparameters, and benchmark
        results may not reproduce under different conditions.
    consensus:
    - World models require evaluation beyond simple reconstruction loss or game scores,
      as aggregate metrics mask failures in long-term consistency and action responsiveness.
    - Specialized benchmarks are emerging to test spatial-temporal coherence and action-conditioned
      generation, filling gaps left by generic RL benchmarks.
    - Visual fidelity alone is insufficient; metrics must capture physical plausibility
      and memory consistency to reflect real-world utility.
    disagreements:
    - Whether evaluation should prioritize visual quality (pixel-level accuracy) or
      downstream task performance (policy success rate), leading to different metric
      choices.
    - Whether benchmarks should use open-ended environments (Minecraft) for diversity
      or controlled simulations (Atari, CARL) for reproducibility.
    - Whether metrics should be graph-based and invariant to pixel variations (SGCS)
      or directly measure pixel-wise prediction error.
    open_questions:
    - How to design benchmarks that capture long-term memory and physical plausibility
      without making evaluation computationally prohibitive.
    - How to ensure benchmark metrics correlate with real-world robot performance
      when most benchmarks are in simulation.
    - How to standardize evaluation protocols across different world model architectures
      (diffusion, transformer, VAE) to enable fair comparisons.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享任务和数据集，以比较世界模型在特定能力上的表现，如空间一致性（如 LoopNav）或记忆与动作控制（如 MIND）。
      尚未覆盖: 多样化真实场景和长时域场景的覆盖；多数基准仅限于模拟或游戏环境，其任务分布可能无法反映部署条件。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性和鲁棒性，使用如场景图一致性分数等指标衡量空间一致性或记忆一致性。
      尚未覆盖: 代理指标与下游决策效用之间的一致性；指标往往缺乏针对人类判断或任务成功的验证，且其对实现细节的敏感性不明确。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准基准（Atari 100k、Nuscenes）上的共同基线（Dreamer、STORM、DIAMOND）实现可审计的比较，便于追踪进展。
      尚未覆盖: 结论在不同实现和算力预算下的稳定性；许多方法论文缺少代码或详细超参数，基准结果可能在不同条件下无法复现。
    共识:
    - 世界模型需要超越简单重建损失或游戏得分的评估，因为总分掩盖了长期一致性和动作响应方面的失败。
    - 专门的基准正在涌现，以测试时空连贯性和动作条件生成，填补了通用 RL 基准留下的空白。
    - 仅靠视觉保真度不够；指标必须捕捉物理合理性和记忆一致性，以反映真实世界的实用性。
    分歧:
    - 评估应优先考虑视觉质量（像素级精度）还是下游任务性能（策略成功率），导致不同的指标选择。
    - 基准应使用开放环境（Minecraft）以获取多样性，还是使用受控模拟（Atari、CARL）以确保可复现性。
    - 指标应基于图并对像素变化不变（SGCS），还是直接测量像素级预测误差。
    开放问题:
    - 如何设计能捕捉长期记忆和物理合理性的基准，同时不使评估计算成本过高。
    - 当多数基准在模拟中时，如何确保基准指标与真实机器人性能相关。
    - 如何标准化不同世界模型架构（扩散、Transformer、VAE）的评估协议，以实现公平比较。
