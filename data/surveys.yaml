  related_work_outline:
  - 'Mainstream direction: Developing specialized benchmarks and metrics for world
    models that evaluate spatial consistency, memory, action control, and video prediction
    fidelity, moving beyond generic computer vision metrics.'
  - 'Shared research pattern: All works propose or use benchmarks based on video generation/prediction
    tasks, with evaluation metrics that go beyond pixel-level accuracy, such as scene
    graph consistency or agent-based scores.'
  - 'Key differences: Benchmarks target different domains—autonomous driving, robotics,
    open-world games—leading to varied evaluation scopes. Metrics range from low-level
    visual quality to high-level consistency and decision utility. Some are closed-loop
    with action control, others open-loop.'
  - 'Trend evolution: The frontier has shifted from reliance on general game benchmarks
    (Atari 100k, ca. 2023) to recently proposed dedicated benchmarks like LoopNav
    (2025) and MIND (2026), emphasizing memory, consistency, and cross-domain generalization.'
  - 'Open questions: Whether current benchmark metrics reliably predict downstream
    task performance; how to evaluate long-term physical plausibility and consistency
    across diverse environments; and the need for unified evaluation protocols.'
  related_work_outline_zh:
  - 主流方向：为世界模型开发专门基准和指标，评估空间一致性、记忆、动作控制和视频预测保真度，超越通用计算机视觉指标。
  - 研究共性：所有工作都提出或使用基于视频生成/预测任务的基准，评估指标超越像素精度，如场景图一致性分数或智能体分数。
  - 关键差异：基准针对不同领域——自动驾驶、机器人、开放世界游戏——导致评估范围各异。指标从低级视觉质量到高级一致性和决策效用。一些是闭环动作控制，另一些是开环预测。
  - 趋势演进：从依赖通用游戏基准（Atari 100k，约2023年）转向近期提出的专用基准，如LoopNav（2025）和MIND（2026），强调记忆、一致性和跨领域泛化。
  - 开放问题：当前基准指标能否可靠预测下游任务性能；如何评估不同环境下的长期物理合理性和一致性；需要统一的评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world models
      what_it_solves: Creating shared tasks and datasets (e.g., loop-based navigation,
        memory consistency videos) to evaluate spatial consistency, action control,
        and generalization of world models.
      what_remains_open: Whether these task distributions cover the full range of
        real-world settings where world models are expected to assist, and the lack
        of large-scale, diverse benchmarks.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate video quality scores, e.g., Scene Graph Consistency
        Score, memory consistency measures.
      what_remains_open: Alignment between these proxy metrics and actual downstream
        decision performance; sensitivity to model architecture and training details.
    - line: Standardized baselines and evaluation protocols
      what_it_solves: Enabling fair comparison through common benchmarks like Atari
        100k, Nuscenes, and evaluation suites, establishing baseline performance.
      what_remains_open: Reproducibility across implementations and compute budgets;
        stability of rankings under different training conditions; absence of unified
        reporting standards.
    consensus:
    - All papers recognize the need for dedicated world model benchmarks that go beyond
      simple video prediction, incorporating spatial consistency, memory, and action
      control.
    - They agree that standard computer vision metrics are insufficient and that benchmarks
      should be coupled with agent-based evaluation.
    disagreements:
    - 'Domain specificity: some benchmarks are designed for autonomous driving, others
      for robotics or open-world games, leading to different evaluation scopes.'
    - 'Metric design: low-level visual fidelity (FID, LPIPS) vs. high-level scene
      graph consistency (SGCS) vs. decision-based scores (Atari human normalized).'
    - 'Interaction mode: open-loop prediction vs. closed-loop action-conditioned generation.'
    - 'Supervision: some methods require ground-truth actions, others learn from passive
      video.'
    open_questions:
    - How well do current benchmark metrics correlate with real-world decision-making
      quality?
    - Can a single benchmark effectively evaluate world models across diverse domains
      without losing diagnostic power?
    - What are the limits of video-based evaluation for capturing physical reasoning
      and long-term memory?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 建立共享任务和数据集（如循环导航、记忆一致性视频），以评估世界模型的空间一致性、动作控制和泛化能力。
      尚未覆盖: 这些任务分布是否覆盖世界模型预期发挥作用的真实场景全部范围，以及缺乏大规模、多样化的基准。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合视频质量评分之外，检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数、记忆一致性度量。
      尚未覆盖: 这些代理指标与实际下游决策性能的一致性；对模型架构和训练细节的敏感性。
    - 路线: 标准化基线与评估协议
      解决的问题: 通过Atari 100k、Nuscenes等通用基准和评估套件实现公平比较，建立基线性能。
      尚未覆盖: 不同实现和算力预算下的可复现性；不同训练条件下排名的稳定性；缺乏统一的报告标准。
    共识:
    - 所有论文都认识到需要专门的世界模型基准，超越简单的视频预测，纳入空间一致性、记忆和动作控制。
    - 它们认同标准计算机视觉指标不够，基准应与基于智能体的评估相结合。
    分歧:
    - 领域特异性：一些基准针对自动驾驶，另一些针对机器人或开放世界游戏，导致评估范围不同。
    - 指标设计：低级视觉保真度（FID、LPIPS）与高级场景图一致性（SGCS）与基于决策的分数（Atari人类归一化）。
    - 交互模式：开环预测与闭环动作条件生成。
    - 监督信号：某些方法需要真值动作，其他则从被动视频中学习。
    开放问题:
    - 当前基准指标与真实世界决策质量的相关性如何？
    - 一个基准能否有效评估不同领域的世界模型而不丧失诊断能力？
    - 基于视频的评估在捕捉物理推理和长期记忆方面的局限性是什么？
