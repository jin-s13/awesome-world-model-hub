  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    or variational/state-space sequence models for embodied settings such as driving,
    robotics, and navigation, predicting future video or latent states under action,
    language, goal, or context conditions.'
  - 'Shared research pattern: Jointly learn dynamics and perception through generation
    objectives or auxiliary tasks, then evaluate visual fidelity, physical plausibility,
    spatial/memory consistency, downstream policy utility, or zero-shot generalization.'
  - 'Key differences: Representations range from stochastic state-space or VAE units
    to masked diffusion transformers and physics-informed video learning; supervision,
    action interfaces, and evaluation targets also differ.'
  - 'Trend evolution: The frontier moves from 2023 sample-efficient Atari world models
    toward 2024-2025 diffusion-based robot imagination and driving prediction, followed
    by 2025-2026 benchmarks for spatial, memory, and action consistency.'
  - 'Open questions: Evidence rarely isolates model representation from auxiliary
    objectives, data scale, and planner/action-interface effects; unseen primitive,
    context, and action-space generalization plus long-term memory consistency remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或变分/状态空间序列模型为核心的生成式世界模型，面向驾驶、机器人和导航，预测未来视频或潜在状态，并逐步加入动作、语言、目标或上下文条件。
  - 研究共性：联合学习动力学与感知，通过生成目标或辅助任务训练未来预测，并以视觉保真、物理合理性、空间/记忆一致性或下游策略效用作为评估维度。
  - 关键差异：表示方式涵盖随机状态空间、VAE-Transformer、掩码扩散Transformer与物理信息辅助学习；监督目标、评测设置和动作接口也明显不同。
  - 趋势演进：从2023年强调Atari采样效率的随机Transformer世界模型，转向2024-2025年面向机器人想象与驾驶预测的扩散视频世界模型，2025-2026年出现空间/记忆一致性基准。
  - 开放问题：模型表示、辅助目标、数据和动作接口各自贡献多大仍不清楚；未见原语、上下文和动作空间泛化以及长期记忆一致性尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic and context-conditioned latent dynamics models
      what_it_solves: Learning compact state-space or variational sequence models
        that predict future latent states for model-based reinforcement learning and
        zero-shot transfer under changing dynamics.
      what_remains_open: Whether gains transfer beyond small contextual benchmarks
        or observable context values, and whether stochasticity versus architecture
        choice matters.
    - line: Diffusion-based embodied video generation with auxiliary reconstruction
        or physics objectives
      what_it_solves: Creating high-fidelity long-horizon or multi-view video predictions
        for driving and robotics by combining diffusion transformers with mask reconstruction,
        depth, or keypoint dynamics tasks.
      what_remains_open: Limited evidence on transfer beyond reported datasets and
        environments, with missing explicit limitations or controlled ablation details
        for several models.
    - line: Compositional and unified video-action world models for robot planning
        and pretraining
      what_it_solves: Connecting language or action conditions to generated video
        plans and policies, including compositional primitive generalization and joint
        video-action pretraining.
      what_remains_open: Unseen primitive or action-space generalization, reliance
        on predefined parsing, simulation-only evidence, and unclear separation between
        model and policy/planner contributions.
    - line: Open-domain consistency benchmarks for memory, action control, and spatial
        coherence
      what_it_solves: Quantifying whether world models maintain spatial consistency
        and action-compatible video generation across views, loops, and scene changes.
      what_remains_open: Benchmarks introduce evaluation criteria but do not yet show
        which model architecture solves the identified long-term memory and cross-action-space
        gaps.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects in world-model evaluation.
      what_remains_open: Several top papers report scores and results without visible
        limitation or controlled ablation evidence, so contribution isolation remains
        unverified.
    consensus:
    - 'Learned generative dynamics models are the common object of study: they predict
      future observations or latent states conditioned on actions, context, language,
      or goals.'
    - Transformers, diffusion objectives, and variational or state-space sequence
      models are the dominant representational building blocks in the current frontier.
    - Methods are evaluated not only on visual quality but also on downstream task
      utility such as policy training, zero-shot generalization, physical plausibility,
      or consistency benchmarks.
    - Action conditioning and multimodal conditions are treated as necessary for connecting
      world models to robotic, driving, or navigation tasks.
    - Reproducibility signals vary; some works release code or datasets, while others
      provide only paper-level evidence, so verification gaps remain.
    disagreements:
    - 'Representation and stochasticity: some models use recurrent state-space or
      VAE-style stochastic units, while others use diffusion transformers with mask
      tokens or deterministic auxiliary tasks.'
    - Training objectives differ among mask reconstruction, physics-informed depth/keypoint
      learning, contextual model-based reinforcement learning, and joint video-action
      diffusion.
    - Evaluation targets vary from Atari sample-efficiency and driving video prediction
      to robot policy execution and closed-loop memory/action consistency benchmarks.
    - 'Interaction assumptions vary: observable context values, predefined language
      primitives, action-free video, or explicit action spaces are treated differently
      across settings.'
    - Deployment evidence ranges from simulation-only robot execution to real-world-oriented
      video benchmarks without a common physical or closed-loop standard.
    open_questions:
    - Do reported gains reflect model representation, auxiliary objectives, data scale,
      or action/planner interfaces? Controlled ablations are sparse in the visible
      evidence.
    - Can compositional or context-conditioned world models generalize to entirely
      new primitives, context values, or action spaces beyond combinations seen in
      training?
    - What metric or benchmark design best captures long-horizon spatial/memory consistency
      and physical plausibility without conflating pixel fidelity with dynamics correctness?
    - Are the generated videos robust enough for closed-loop policy training and real
      robot execution, or do they mainly improve visual realism?
    - Which architectural features transfer from driving and robotics to other embodied
      settings, and what assumptions limit that transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 随机与上下文条件潜在动力学模型
      解决的问题: 学习紧凑状态空间或变分序列模型，预测未来潜在状态，用于基于模型的强化学习和动力学变化下的零样本迁移。
      尚未覆盖: 是否超越小型上下文基准或可观测上下文值仍有待验证；随机性与架构选择哪个更重要不明确。
    - 路线: 面向具身视频生成的扩散模型与辅助重建/物理目标
      解决的问题: 用扩散Transformer结合掩码重建、深度或关键点动力学任务，为驾驶/机器人预测长时域或多视角视频。
      尚未覆盖: 在报告数据集和场景之外迁移证据有限；多篇论文缺少显式局限或受控消融信息。
    - 路线: 面向机器人规划与预训练的组合式/统一视频-动作世界模型
      解决的问题: 将语言或动作条件连接到视频计划和策略，包括组合原语泛化和视频-动作联合预训练。
      尚未覆盖: 未见原语或动作空间泛化不足；依赖预定义语言解析；证据多在仿真环境，模型与策略/规划器贡献难分离。
    - 路线: 面向记忆、动作控制与空间一致性的开放域基准
      解决的问题: 量化世界模型在视角变化、闭环导航和场景切换下是否保持空间一致性与动作可控制视频生成。
      尚未覆盖: 基准提出评价标准，但尚未表明哪种架构能解决已识别的长期记忆和跨动作空间缺口。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素的影响。
      尚未覆盖: 若可见字段缺少局限说明、代码/数据集信号或受控消融，方法隔离仍不可验证。
    共识:
    - 学到的生成式动力学模型是共同研究对象：它们根据动作、上下文、语言或目标预测未来观测或潜在状态。
    - 当前前沿主要采用Transformer、扩散目标以及变分或状态空间序列模型作为表示骨干。
    - 评估不只依赖视觉质量，还关注下游任务效用，例如策略训练、零样本泛化、物理合理性或一致性基准。
    - 动作条件与多模态条件被视为连接世界模型与机器人、驾驶或导航任务的必要方式。
    - 可复现信号差异明显：部分工作发布代码或数据集，部分仅提供论文级证据，存在验证缺口。
    分歧:
    - 表示与随机性：一些模型使用循环状态空间或变分随机单元，另一些使用带掩码令牌的扩散Transformer或确定性辅助任务。
    - 训练目标不同：掩码重建、物理信息深度/关键点学习、上下文基于模型的强化学习以及视频-动作联合扩散各有侧重。
    - 评测目标不同：从Atari采样效率和驾驶视频预测，到机器人策略执行以及闭环记忆/动作一致性基准。
    - 交互假设不同：可观测上下文值、预定义语言原语、无动作视频或显式动作空间被不同场景采用。
    - 部署证据不同：机器人执行证据多为仿真，部分视频基准面向真实世界但缺乏统一物理或闭环标准。
    开放问题:
    - 可见证据中受控消融较少，报告的提升有多少来自模型表示、辅助目标、数据规模或动作/规划器接口尚不清楚。
    - 组合式或上下文条件世界模型能否泛化到训练中未见过的原语、上下文值或动作空间？
    - 哪种度量或基准设计能更好地衡量长期空间/记忆一致性和物理合理性，而不混淆像素保真与动力学正确性？
    - 生成视频是否足够稳健以支撑闭环策略训练和真实机器人执行，还是主要改善视觉真实感？
    - 哪些架构特征可以从驾驶和机器人迁移到其他具身场景，哪些假设限制迁移？
