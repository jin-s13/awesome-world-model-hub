  related_work_outline:
  - 'Mainstream direction: Survey and taxonomy synthesis centered on world models,
    especially generative video world models for robotics and autonomous driving;
    ''Is Sora a World Simulator?'' and a latent world model taxonomy for automated
    driving are representative anchors.'
  - 'Shared research pattern: Papers organize model design along latent representation,
    structural priors, generation mechanisms, and evaluation; they connect video generation,
    prediction, simulation, and agent control.'
  - 'Key differences: Some synthesize conceptual taxonomies with no empirical validation,
    while others contribute datasets, benchmarks, or methods with experimental results;
    coverage ranges from general video world models to driving-specific settings.'
  - 'Trend evolution: Within the current frontier (visible years 2022-2026), the evidence
    shifts from data-driven driving simulation and motion prediction toward more recent
    surveys and systems emphasizing open-source, long-horizon consistency, out-of-sight
    dynamics, multimodal control, and evaluation frameworks.'
  - 'Open questions: Whether taxonomies generalize beyond selected examples, whether
    evaluation metrics close the open-loop/closed-loop gap, and what priorities matter
    for resource-aware, decision-ready world models.'
  related_work_outline_zh:
  - 主流方向：以世界模型为核心的综述与分类体系，覆盖生成式视频世界模型、机器人想象、自动驾驶仿真和自主智能体；可代表性地参见《Is Sora a World Simulator?》和自动驾驶潜在世界模型分类法。
  - 研究共性：论文都试图把碎片化进展组织为设计维度、机制、任务与评估；强调视频生成、预测、仿真与智能体控制之间的联系。
  - 关键差异：部分工作提供概念性分类但缺乏实证验证，部分贡献数据集、基准或方法并给出实验结果；覆盖范围从通用视频世界模型延伸到驾驶特定设置。
  - 趋势演进：在可见的2022-2026年前沿窗口内，证据从数据驱动交通仿真与运动预测转向更近期的综述与系统，强调开源、长时程一致性、视线外动态、多模态控制与评估框架。
  - 开放问题：分类法能否从选择性示例推至完整领域，指标能否弥合开环与闭环差距，以及如何优先排序资源敏感、可决策的世界模型路线。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented generative world-model research into design
        spaces, evaluation criteria, and open challenges, unifying video generation,
        autonomous driving, and agents.
      what_remains_open: Evidence selection criteria are often not made systematic;
        proposed taxonomies and evaluation frameworks can be theoretical and lack
        empirical validation or coverage guarantees.
    - line: Benchmark and dataset construction for world-model evaluation
      what_it_solves: Provides spatio-temporal datasets and evaluation settings for
        controllable generation, long-horizon consistency, out-of-sight dynamics,
        and autonomous driving tasks.
      what_remains_open: Many papers leave limitations empty or do not show reproducible
        artifacts; coverage may be domain-specific and open-loop metrics may not match
        closed-loop deployment.
    - line: Generative world-model method and system design
      what_it_solves: Constructs video-generation-based simulators that support compositional
        goals, persistent state, real-time interaction, multimodal control, or multi-agent
        traffic simulation.
      what_remains_open: Generalization is often limited to seen primitives or training
        distributions, long-horizon physical consistency is not guaranteed, and real-robot
        or closed-loop validation is frequently absent.
    consensus:
    - World models are treated as a unifying abstraction across generative video,
      simulation, prediction, and agent control.
    - There is convergence on explicit design dimensions such as latent representation,
      structural priors, temporal memory, controllable generation, and evaluation
      protocols.
    - Visual fidelity alone is treated as insufficient; temporal consistency, state
      persistence, interactivity, and downstream task utility are recurring concerns.
    - Autonomous driving and robotic manipulation are recurring application settings,
      with datasets and metrics central to claims.
    disagreements:
    - Some contributions are conceptual taxonomies without new empirical results,
      while others emphasize task-specific datasets, benchmarks, or model implementations.
    - Supervision and control signals differ across language-parsed primitives, ego-motion
      and pose trajectories, road panorama action nodes, agent destinations, and latent
      personalities.
    - Evaluation targets differ across video synthesis quality, georeferencing, motion
      prediction, closed-loop control, long-horizon consistency, and out-of-sight
      dynamics.
    - Deployment settings range from simulation-only robot imagination to real-world
      ego-vision data and autonomous driving, which changes what a world model must
      preserve.
    - 'Reproducibility signals are uneven: some systems expose open-source code or
      models, while several papers show no visible code, dataset, or limitation details.'
    open_questions:
    - What evidence criteria would make survey taxonomies systematic and exhaustive
      rather than illustrative?
    - Which evaluation protocols can narrow the gap between open-loop generation quality
      and closed-loop decision performance?
    - How do world models generalize to unseen primitive combinations, objects, or
      driving scenes beyond training distributions?
    - What minimal structural priors, memory representations, and control signals
      are needed for persistent 4D simulation?
    - Do open-source world-model systems with real-time interactivity remain reliable
      under long-horizon, out-of-sight, or physical reasoning demands?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将生成式世界模型研究组织为设计空间、评估标准和开放挑战，统一视频生成、自动驾驶和智能体等方向。
      尚未覆盖: 综述选择证据的标准常未系统说明；分类法和评估框架可能只有理论描述，缺少实证验证或覆盖保证。
    - 路线: 基准与数据集构建
      解决的问题: 为可控生成、长时程一致性、视线外动态和自动驾驶任务提供时空数据与评测设置。
      尚未覆盖: 多篇论文未填局限性或未展示可复现工件；数据覆盖可能局限于特定领域，开环指标未必对应闭环部署。
    - 路线: 生成式世界模型方法与系统
      解决的问题: 构建基于视频生成的模拟器，支持组合目标、持久状态、实时交互、多模态控制或多智能体仿真。
      尚未覆盖: 泛化通常限于已见原语或训练分布，长时程物理一致性未保证，真机或闭环验证常缺失。
    共识:
    - 世界模型被视为连接生成视频、仿真、预测和智能体控制的统一抽象。
    - 研究趋向显式化设计维度：潜在表示、结构先验、时间记忆、可控生成与评估协议。
    - 仅有视觉逼真度不够，时间一致性、状态持久性、交互性和下游任务效用被反复强调。
    - 自动驾驶和机器人操作是常见应用场景，数据集和指标对结论很重要。
    分歧:
    - 有的工作提供概念性分类而无新实验，有的则贡献任务特定数据集、基准或模型实现。
    - 控制信号不同：语言解析原语、自我运动与姿态轨迹、道路全景动作节点、智能体目的地与潜在个性等。
    - 评测目标不同：视频合成质量、地理参考、运动预测、闭环控制、长时程一致性、视线外动态等各有侧重。
    - 部署环境从纯仿真机器人想象到真实自我中心视觉和自动驾驶不等，对世界模型应保留的状态提出不同要求。
    - 可复现证据不均：部分系统公开代码与模型，若干论文没有可见代码、数据集或局限性说明。
    开放问题:
    - 什么样的证据标准能让综述分类从举例式走向系统且可穷尽？
    - 哪些评测协议能缩小开环生成质量与闭环决策性能之间的差距？
    - 世界模型如何泛化到训练分布之外的未见物体、原语组合或驾驶场景？
    - 实现持久四维仿真最少需要哪些结构先验、记忆表示与控制信号？
    - 具有实时交互能力的开源世界模型在长时程、视线外或物理推理需求下是否仍可靠？
