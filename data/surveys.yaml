      解决的问题: 将世界模型用于游戏策略的样本高效学习，并用于探测交互环境中的空间、记忆和动作控制一致性。
      尚未覆盖: 环境规则、目标、用户交互或动作空间变化时的泛化，只通过选定基准测得，下游迁移证据有限。
    共识:
    - 近期工作汇聚于高维观测上的学习型预测模型，常用扩散或Transformer架构，以动作或上下文为条件生成未来视频或潜在轨迹。
    - 世界模型既作为生成式仿真器，也作为策略学习基底，融合视觉质量目标与控制或一致性目标。
    - 评测越来越多地探查长时域一致性、零样本泛化和动作可控性，而不仅仅关注短帧视觉相似性。
    - 多篇工作将真实部署证据的缺失视为验证缺口，而非已解决能力。
    分歧:
    - 监督与条件方式不同：有的只以动作为条件，有的将语言分解为原语，有的注入深度或关键点动力学等物理信号。
    - 有的系统优化标准驾驶或机器人数据集上的开环视频真实度，有的通过闭环或交互评测优化策略回报或基准一致性。
