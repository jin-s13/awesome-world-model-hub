  related_work_outline_zh:
  - 主流方向：构建可运行的具身控制与自动驾驶世界模型模拟器，强调动作条件视频生成、物理/深度/场景图一致性以及闭环运行时约束。
  - 研究共性：将学习到的生成动力学作为策略学习或评测的推演环境，并借助辅助信号和开放基准量化可控性、保真度与空间/物理一致性。
  - 关键差异：评测目标包括动作忠实度、空间一致性、物理合理性和零样本泛化；交互模式从真实机器人在线学习到离线预训练视频生成；部署延迟与基准范围不同。
  - 趋势演进：在2022至2026年的高排序证据中，重点从物理机器人在线世界模型转向大规模驾驶/机器人模拟器与开放基准，再转向延迟感知的闭环帧级自回归系统。
  - 开放问题：跨狭窄数据集泛化、长时域自回归漂移、未观测上下文/物理属性推断、延迟与保真度/可控性边界、跨团队独立复现仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Context-conditioned latent dynamics learning for model-based control
      what_it_solves: Trains policies on imagined rollouts from learned dynamics and
        improves zero-shot transfer when task context changes.
      what_remains_open: Assumes observable context and is evaluated on a narrow set
        of control tasks; real-world dynamics and broader unseen contexts remain unverified.
    - line: Physics-informed embodied video simulation
      what_it_solves: Generates visually plausible robot videos with auxiliary depth
        and keypoint physics signals to support policy training and evaluation.
      what_remains_open: The available evidence does not report detailed limitations
        or independent reproduction; physical plausibility beyond trained robotic
        scenarios is unclear.
    - line: Action-controllable driving simulation and evaluation
      what_it_solves: Produces future driving frames conditioned on trajectories or
        actions and provides benchmark metrics for action fidelity.
      what_remains_open: Evaluation focuses on nuScenes or similar driving data; existing
        models still do not fully follow action instructions, and cross-view and long-horizon
        consistency remain open boundaries.
    - line: Spatial-consistency evaluation artifacts
      what_it_solves: Measures whether generated navigation rollouts preserve scene-graph
        spatial relationships rather than only pixel similarity.
      what_remains_open: Evidence reports dataset and benchmark construction but no
        experimental results; utility beyond Minecraft-style loop navigation is not
        established.
    - line: Latency-aware closed-loop deployment stacks
      what_it_solves: Combines world-model training, rollout generation, and runtime
        optimization for real robot learning or single-GPU multi-camera simulation.
      what_remains_open: Demonstrated on limited robot platforms and driving datasets;
        extreme conditions, different sensors, and multi-GPU scalability are unresolved.
    consensus:
    - Learned generative dynamics are treated as runnable rollouts for policy learning
      or evaluation, with action, trajectory, or context conditioning added to improve
      controllability.
    - Systems increasingly couple generation quality with quantitative evaluation
      artifacts such as fidelity metrics, consistency scores, benchmarks, or open-source
      frameworks.
    - Recent work emphasizes reducing dependency on fixed simulators or ground-truth
      action labels by learning multi-modal dynamics from video and interaction data.
    - Auxiliary signals such as depth, keypoints, scene graphs, or context variables
      are used to encode structure beyond raw RGB frames.
    disagreements:
    - 'Control interface granularity differs: context variables, high-level commands
      and goal points, future trajectories, or action instructions coexist without
      a shared control abstraction.'
    - 'Evaluation targets differ: spatial consistency in navigation, action fidelity
      in driving, visual and physical plausibility in robot video, and zero-shot dynamics
      generalization are measured by separate metrics.'
    - 'Deployment mode differs: online real-robot learning without simulators, offline
      adaptation of pre-trained video generators, and closed-loop single-GPU simulation
      make different trade-offs.'
    - Assumptions differ around whether context is observable, whether future trajectories
      are available, and whether the setting is a known environment such as Minecraft
      or a fixed driving dataset.
    open_questions:
    - Can learned simulators transfer beyond narrow evaluation settings such as nuScenes,
      CARL tasks, or Minecraft loop navigation to new sensors, robots, and interaction
      domains?
    - What training or inference mechanisms can prevent autoregressive drift and cross-view
      inconsistency over very long closed-loop rollouts?
    - How can context- and physics-conditioned dynamics be inferred when context values,
      depth, keypoints, or scene graphs are not directly observable?
    - What are the practical boundaries between latency, fidelity, controllability,
      and system complexity for real-time physical and multi-camera deployment?
    - Which reported systems can be independently reproduced across teams and infrastructure
      given varying release of code, data, baselines, and limitation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 上下文条件潜在动力学模型用于基于模型的控制
      解决的问题: 在想象轨迹上训练策略，并在任务上下文变化时改善零样本迁移。
      尚未覆盖: 假设上下文可观测，且仅在少量控制任务上验证；真实世界动力学和更广泛未见上下文仍未覆盖。
    - 路线: 物理信息驱动的具身视频模拟
      解决的问题: 利用深度和关键点等物理信号生成视觉上合理的机器人视频，以支持策略训练和评估。
      尚未覆盖: 已有证据未报告详细局限或独立复现；在训练机器人场景之外的物理合理性尚不明确。
    - 路线: 动作可控的驾驶模拟与评测
      解决的问题: 根据轨迹或动作生成未来驾驶帧，并提供动作忠实度评测指标。
      尚未覆盖: 主要围绕nuScenes等驾驶数据；现有模型仍未完全遵循动作指令，跨视图与长时域一致性仍待解决。
    - 路线: 空间一致性评测工件
      解决的问题: 评估生成导航推演是否保持场景图空间关系，而不只看像素相似度。
      尚未覆盖: 证据仅报告数据集和基准构建而无实验结果；在Minecraft式循环导航之外的效用尚未确认。
    - 路线: 关注延迟的闭环部署栈
      解决的问题: 将世界模型训练、推演生成和运行时优化结合，用于真实机器人学习或单GPU多相机模拟。
      尚未覆盖: 仅在有限机器人平台和驾驶数据上展示；极端条件、不同传感器和多GPU可扩展性未解决。
    共识:
    - 多类工作把学习到的生成动力学视为可运行的推演环境，用于策略学习或评测，并通过动作、轨迹或上下文条件提升可控性。
    - 系统越来越多地同时强调生成质量与可量化评测工件，例如保真度指标、一致性分数、基准或开源框架。
    - 近期工作试图减少对固定模拟器或真实动作标注的依赖，从视频和交互数据中学习多模态动力学。
    - 深度、关键点、场景图或上下文变量等辅助信号被用于编码RGB帧之外的结构信息。
    分歧:
    - 控制接口粒度不同：上下文变量、高层指令与目标点、未来轨迹或动作指令并存，缺乏统一的控制抽象。
    - 评测目标不同：导航空间一致性、驾驶动作忠实度、机器人视频视觉/物理合理性和零样本动力学泛化分别由不同指标衡量。
    - 部署模式不同：真实机器人在线学习无需模拟器、离线改造预训练视频生成器、闭环单GPU模拟各有取舍。
    - 假设不同：上下文是否可观测、未来轨迹是否可用、环境是否为Minecraft或固定驾驶数据集等设置差异影响可比性。
    开放问题:
    - 学习到的模拟器能否从nuScenes、CARL任务或Minecraft循环导航等狭窄评测环境迁移到新传感器、机器人和交互领域？
    - 何种训练或推理机制可以防止极长闭环推演中的自回归漂移和跨视图不一致？
    - 当上下文值、深度、关键点或场景图无法直接观测时，如何推断上下文和物理条件下的动力学？
    - 实时物理机器人与多相机部署中，延迟、保真度、可控性和系统复杂度之间的实际边界是什么？
    - 在代码、数据、基线和局限性证据发布不一致的情况下，哪些系统能被跨团队和基础设施独立复现？
