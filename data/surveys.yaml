  related_work_outline:
  - 'Mainstream direction: Embodied robotics and autonomous driving dominate recent
    applied world-model research, with multiple 2024-2026 papers using diffusion or
    unified video-generation models for robot control, driving prediction, and interactive
    evaluation.'
  - 'Shared research pattern: Methods learn predictive dynamics from visual or action-rich
    data, often via self-supervised generation or reconstruction objectives, then
    test generalization on domain datasets such as NuScenes, Waymo, RT-X, CARL, Atari
    100k, and Minecraft.'
  - 'Key differences: They differ in generative representation—recurrent state-space
    or Transformer+VAE for policies versus diffusion for video or unified video-action
    modeling—and in supervision signals, including context values, language primitives,
    physics signals, and benchmark action controls.'
  - 'Trend evolution: From 2023-2024 model-based RL and contextual dreaming for Atari/CARL
    toward 2024-2026 diffusion-based driving, robot imagination, large-scale robot
    pretraining, and diagnostic benchmarks for memory and spatial consistency.'
  - 'Open questions: Real-world safety and operational alignment, cross-embodiment
    and cross-dataset transfer, handling novel task primitives or contexts, long-term
    memory consistency, and closed-loop action generalization remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：具身机器人与自动驾驶是近期应用世界模型的主战场，多篇2024-2026年工作使用扩散或统一视频生成模型处理机器人控制、驾驶预测和交互评测。
  - 研究共性：方法通常从视觉或动作丰富的数据中学习预测动力学，采用自监督生成或重建目标，并在NuScenes、Waymo、RT-X、CARL、Atari 100k和Minecraft等领域数据集上检验泛化。
  - 关键差异：生成表示不同，包括循环状态空间或Transformer+VAE用于策略学习，以及扩散用于视频或统一视频-动作建模；监督信号也涵盖上下文值、语言原语、物理信号和基准动作控制。
  - 趋势演进：从2023-2024年面向Atari/CARL的基于模型强化学习和上下文梦境，转向2024-2026年的扩散驾驶、机器人想象、大规模机器人预训练和记忆/空间一致性诊断基准。
  - 开放问题：真实安全与运营对齐、跨本体和跨数据集迁移、新原语或上下文的泛化、长期记忆一致性，以及闭环动作泛化仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot and contextual control tasks through
        language-primitive factorization, physics-informed signals, unified video-action
        pretraining, and context-conditioned latent dynamics.
      what_remains_open: Generalization beyond seen primitives, simulation-only evaluation,
        context observability, and cross-embodiment transfer remain sparsely verified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Builds generative driving world models that predict multi-view,
        long-horizon driving video and can transfer across driving datasets.
      what_remains_open: Whether cross-dataset video prediction gains translate to
        closed-loop safety or operational driving outcomes is not established.
    - line: Interactive agents and games with memory/action evaluation
      what_it_solves: Develops efficient model-based RL agents and benchmark suites
        for spatial consistency, memory consistency, and action-controlled world models
        in games and open-domain scenes.
      what_remains_open: Long-term memory consistency, cross-action-space generalization,
        and transfer beyond controlled game or benchmark environments need stronger
        evidence.
    consensus:
    - World models are increasingly treated as task-domain simulators or generative
      predictors learned from visual and action data.
    - Self-supervised generation, reconstruction, and diffusion objectives are the
      dominant learning machinery across these applications.
    - Evaluation is moving beyond single-task reward toward long-horizon, multi-view,
      zero-sample, physical, spatial, and memory consistency measures.
    - Public domain datasets and benchmarks are used to compare generalization, but
      many papers do not report full limitation or real-world deployment evidence.
    disagreements:
    - 'Representation differs: recurrent state-space or Transformer+VAE for policy
      learning versus diffusion-based video or unified video-action transformers.'
    - 'Supervision differs: pure video reconstruction, context-conditioned dynamics,
      language-primitive factorization, physics signals such as depth and keypoints,
      and benchmark action-control signals.'
    - 'Evaluation targets differ: RL task performance on Atari or CARL versus driving
      scene prediction, robot manipulation or policy learning, and memory/spatial
      consistency diagnostics.'
    - 'Interaction mode differs: open-loop video prediction and imagination versus
      closed-loop action-conditioned control and revisited open-domain navigation.'
    - 'Deployment setting differs: simulation-only robot or game evaluation versus
      pretraining on large real robotic datasets or cross-dataset driving validation.'
    open_questions:
    - Do driving world-model improvements measured on NuScenes, OpenDV-2K, and Waymo
      correspond to safer or more reliable closed-loop driving policies?
    - Can robot world models handle novel language primitives, unseen contexts, or
      unseen embodiments beyond the combinations present in training data?
    - What evaluation protocols can verify long-term memory consistency and cross-action-space
      generalization in open-domain world models?
    - How far can physics-informed signals such as depth and keypoint dynamics improve
      policy training and policy evaluation across diverse robot hardware?
