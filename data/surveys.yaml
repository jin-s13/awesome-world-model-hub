  related_work_outline:
  - 'Mainstream direction: Robotics and embodied interaction dominate the application
    landscape, with video generation used as the core world model, often conditioned
    on actions or language and trained on large-scale datasets.'
  - 'Shared research pattern: Almost all works frame world modeling as video prediction
    or generation, and seek to improve generalization by incorporating external knowledge
    (context, physics, language primitives) or by unifying action and video modalities.'
  - 'Key differences: Representations range from diffusion models to Transformer-VAEs
    and Dreamer-style recurrent state-space models; evaluation targets diverge into
    visual fidelity, spatial consistency, memory, action control, or downstream policy
    performance.'
  - 'Trend evolution: From 2023 onward, the field moves from pure video generation
    towards physically grounded models, unified action–video architectures, and newly
    proposed benchmarks that explicitly measure memory and action controllability.'
  - 'Open questions: How to close the gap between simulated video quality and real-world
    physical feasibility, how to evaluate long-term memory consistency, and whether
    current models transfer across diverse embodiments and environments.'
  related_work_outline_zh:
  - 主流方向：机器人及具身交互是应用核心，世界模型以视频生成为主，常以动作或语言作为条件，并依赖大规模数据集训练。
  - 研究共性：几乎所有工作将世界建模视为视频预测或生成，并通过引入外部知识（上下文、物理、语言原语）或统一动作与视频模态来提升泛化能力。
  - 关键差异：表示方式涵盖扩散模型、Transformer-VAE、Dreamer式循环状态空间模型；评测目标分化为视觉保真度、空间一致性、记忆、动作控制或下游策略性能。
  - 趋势演进：自2023年起，从纯视频生成向物理驱动的模型、统一动作-视频架构以及明确衡量记忆和动作可控性的新基准演进。
  - 开放问题：如何弥合仿真视频质量与真实物理可行性之间的差距，如何评估长期记忆一致性，以及当前模型能否跨不同形态和环境迁移。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to concrete robotic tasks by conditioning
        on context, language instructions, or physics priors, enabling video-based
        planning and policy learning.
      what_remains_open: Generalization across unseen robot embodiments, tasks, and
        real-world physical interactions is not systematically verified; many evaluations
        stay in simulation with limited context observability.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Uses world models for multi-view video prediction and long-horizon
        scene generation, enabling closed-loop simulation and off-policy evaluation.
      what_remains_open: Alignment between simulation-based metrics and real-world
        safety or operational outcomes is unexplored; the evidence is limited to a
        single high-scoring paper.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in open-ended interactive environments
        to assess spatial consistency, memory, action control, and sample efficiency
        for agent learning.
      what_remains_open: Generalization under changing environment rules, goals, or
        user interactions is not tested; benchmarks currently rely on Minecraft, Atari,
        or custom video clips.
    consensus:
    - World models in applications are predominantly implemented as video generation
      models conditioned on actions or context.
    - Large-scale multi-task datasets and pretraining are widely adopted to improve
      generalization.
    - Incorporating auxiliary knowledge such as physics, context, or language primitives
      improves the plausibility of generated videos.
    - Memory and action controllability are emerging as critical evaluation dimensions
      beyond standard visual fidelity.
    disagreements:
    - 'Representation choice: some works use diffusion-based architectures, others
      rely on Transformer-VAEs or recurrent state-space models.'
    - 'Supervision signal: mask reconstruction, depth prediction, keypoint dynamics,
      and language parsing are used to inject different inductive biases.'
    - 'Evaluation target: one group prioritizes pixel-level video quality, while another
      group measures spatial consistency, memory, or action controllability.'
    - 'Action handling: some models condition on external actions, others unify video
      and action diffusion within a single Transformer.'
    open_questions:
    - Can world models maintain long-term memory consistency and spatial accuracy
      over minutes-long interactions in open environments?
    - How should we evaluate the transfer from simulation video predictions to real-world
      robotic execution without extensive real-world trials?
    - What is the minimal set of physical priors needed to make generated videos physically
      feasible, and how do those priors generalize across tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到具体机器人任务，通过上下文、语言指令或物理先验进行条件化，支持基于视频的规划与策略学习。
      尚未覆盖: 跨未见机器人形态、任务和真实物理交互的泛化尚未系统验证；多数评估停留在仿真中，上下文可观测性受限。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角视频预测和长时域场景生成，支持闭环仿真与离线策略评估。
      尚未覆盖: 仿真指标与真实安全或运营结果之间的对齐尚未探索；证据仅来自单篇高分论文。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落地于开放交互环境，评估空间一致性、记忆、动作控制和样本效率，用于智能体学习。
      尚未覆盖: 环境规则、目标或用户交互变化下的泛化未测试；当前基准依赖Minecraft、Atari或定制视频片段。
    共识:
    - 应用中的世界模型主要以动作或上下文为条件的视频生成模型实现。
    - 大规模多任务数据集和预训练被广泛采用以提升泛化能力。
    - 引入物理、上下文或语言原语等辅助知识可改善生成视频的合理性。
    - 记忆和动作可控性正在成为超越传统视觉保真度的重要评估维度。
    分歧:
    - 表示选择：部分工作使用扩散架构，其他依赖Transformer-VAE或循环状态空间模型。
    - 监督信号：掩码重建、深度预测、关键点动力学和语言解析等被用于注入不同归纳偏置。
    - 评测目标：一组重视像素级视频质量，另一组衡量空间一致性、记忆或动作可控性。
    - 动作处理：有的模型以外部动作为条件，有的将视频与动作扩散统一在单个Transformer中。
    开放问题:
    - 世界模型能否在开放环境中维持数分钟交互的长期记忆一致性和空间准确性？
    - 如何在不进行大量真实实验的条件下，评估从仿真视频预测到真实机器人执行的迁移？
    - 使生成视频物理可行所需的最小物理先验集是什么，这些先验如何跨任务泛化？
