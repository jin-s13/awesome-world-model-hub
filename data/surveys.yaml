  related_work_outline:
  - 'Mainstream direction: evaluating world models through diagnostic benchmarks that
    target spatial consistency, memory consistency, action control, and generalization
    rather than only visual quality.'
  - 'Shared research pattern: datasets define closed-loop or long-horizon tasks; metrics
    try to separate visual fidelity from dynamics or decision utility; model-side
    work increasingly couples video generation with action or dynamics learning.'
  - 'Key differences: benchmarks emphasize different failure modes such as loop-based
    spatial consistency, memory and action control, zero-shot context transfer, or
    long-horizon driving prediction; model supervision and representations also differ.'
  - 'Trend evolution: from the provided high-ranking papers, the visible frontier
    is mainly 2023-2026, moving from aggregate scores like Atari 100k toward finer
    diagnostic probes for memory, space, action, driving, and robotics.'
  - 'Open questions: whether diagnostic metrics predict downstream decision quality,
    whether current datasets cover real deployment settings, and whether reported
    conclusions remain stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型构建诊断性基准，重点评测空间一致性、记忆一致性、动作可控性和泛化能力，常用扩散或Transformer世界模型作为受试对象。
  - 研究共性：数据集定义闭环或长时域任务；指标尝试区分视觉拟真、动力学/控制与下游策略效用；方法侧倾向统一视频生成与动作/动力学建模。
  - 关键差异：基准覆盖的失败模式不同，如循环空间一致性、记忆与动作控制、上下文零样本泛化、视觉滚动预测；方法在离散潜变量、扩散去噪、掩码重建、物理/关键点监督等方面不同。
  - 趋势演进：根据现有高排名论文，2023-2026年前沿从Atari 100k等聚合分数转向更细粒度的记忆/空间/控制和驾驶/机器人评测；更早年份在本证据包中缺少代表论文。
  - 开放问题：诊断指标是否能预测下游决策质量；现有数据集能否覆盖长时域记忆和跨动作空间泛化；基线与报告差异是否影响排名稳定性；模拟环境结论能否迁移到真实驾驶或机器人。
  literature_review:
    line_of_work_matrix:
    - line: Diagnostic benchmark construction for consistency and control
      what_it_solves: Creates loop-based navigation or closed-loop revisited video
        tasks to evaluate spatial consistency, memory consistency, and action controllability
        in world models; LoopNav and MIND are representative examples.
      what_remains_open: Whether simulated or curated video distributions cover real
        deployment settings such as long-horizon driving, robot manipulation, or cross-embodiment
        control.
    - line: World-model method evaluation on shared control and prediction suites
      what_it_solves: Provides common testbeds such as Atari 100k, CARL, and driving
        datasets for comparing model-based RL and video-generation world models on
        generalization, visual fidelity, and downstream policy quality.
      what_remains_open: Stability of results across implementation choices, compute
        budgets, baseline tuning, and dataset splits is not fully reported; several
        provided analyses leave limitation fields empty.
    - line: Metric design beyond aggregate scores
      what_it_solves: Introduces targeted proxies such as scene-graph consistency,
        memory consistency, action control, human-normalized agent scores, and physics-informed
        visual plausibility to separate visual detail from dynamics or decision utility.
      what_remains_open: Proxy metrics remain weakly tied to the downstream decisions
        users care about; cross-metric and cross-benchmark agreement is not established.
    consensus:
    - Evaluation is moving beyond visual fidelity toward diagnostic probes of consistency,
      controllability, and generalization in world models.
    - A common evaluation pattern combines video prediction or generation with a downstream
      task, using shared datasets and normalized metrics to compare model-based agents.
    - Recent model designs increasingly couple video and action or dynamics in unified
      architectures, so benchmarks need to assess both modality generation and decision-relevant
      behavior.
    disagreements:
    - 'Representation and supervision differ: discrete latent world models, diffusion-based
      denoising, mask reconstruction, context-conditioned latent dynamics, and physics
      or keypoint-shaped learning target different failure modes.'
    - 'Evaluation domain and interaction type differ: closed-loop gaming or simulated
      navigation tasks such as Atari, Minecraft, and CARL emphasize different evidence
      than driving and robotic video generation.'
    - 'Measured target differs: aggregate human-normalized score, long-horizon rollout,
      spatial or memory consistency, action control, zero-shot context transfer, and
      visual-physical plausibility each capture a different aspect of world-model
      quality.'
    open_questions:
    - Do consistency and control metrics predict downstream policy success beyond
      the specific benchmark environments?
    - Can current datasets and metrics cover long-horizon memory and cross-action-space
      generalization without overfitting to curated action spaces?
    - How much do baseline implementation, compute budget, and reporting omissions
      affect the stability of current world-model rankings?
    - What evidence connects success in simulated game or navigation benchmarks to
      real driving or robotics deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 诊断性基准构建：一致性与控制
      解决的问题: 构建循环导航或闭环重访视频任务，评估世界模型的空间一致性、记忆一致性和动作可控性；LoopNav和MIND是代表性示例。
      尚未覆盖: 模拟或筛选视频分布是否覆盖真实部署设置，例如长时域驾驶、机器人操作或跨具身控制。
    - 路线: 共享评测套件上的世界模型方法比较
      解决的问题: 通过Atari 100k、CARL和驾驶数据集等共享测试平台，比较基于模型的强化学习与视频生成世界模型在泛化、视觉保真度和下游策略质量上的表现。
      尚未覆盖: 结论在不同实现、算力预算、基线调优和数据划分下是否稳定尚未充分报告；部分分析字段未提供局限性。
    - 路线: 超越聚合分数的指标设计
      解决的问题: 引入场景图一致性、记忆一致性、动作控制、人类归一化智能体得分和物理知情视觉合理性等定向代理指标，以区分视觉细节与动力学或决策效用。
      尚未覆盖: 代理指标与用户真正关心的下游决策仍缺乏明确对齐；跨指标和跨基准的一致性尚未建立。
    共识:
    - 评测正在从视觉保真度转向对一致性、可控性和泛化能力的诊断性探测。
    - 常见评测模式将视频预测或生成与下游任务结合，并使用共享数据集和归一化指标比较基于模型的智能体。
    - 近期模型设计倾向于在统一架构中耦合视频与动作/动力学，因此基准需要同时评估模态生成和决策相关行为。
    分歧:
    - 表示与监督信号不同：离散潜变量、扩散去噪、掩码重建、上下文条件潜变量动态以及物理/关键点约束分别针对不同失败模式。
    - 评测域和交互类型不同：Atari、Minecraft、CARL等游戏或模拟导航任务与驾驶和机器人视频生成场景不同，因而证据类型也不同。
    - 测量目标不同：聚合人类归一化分数、长时域滚动、空间/记忆一致性、动作控制、零样本上下文迁移或视觉物理合理性各有侧重，尚未形成统一靶标。
    开放问题:
    - 一致性与控制指标能否预测下游策略在特定基准环境之外的成功？
    - 现有数据集和指标能否覆盖长时域记忆和跨动作空间泛化，而不只是过拟合到人工设计的动作空间？
    - 基线实现、算力预算和报告缺失会在多大程度上影响当前世界模型排序的稳定性？
    - 模拟游戏或导航基准中的成功是否有证据支持可迁移到真实驾驶或机器人部署？
