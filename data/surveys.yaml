  related_work_outline:
  - 'Mainstream direction: Comprehensive surveys and taxonomies are consolidating
    the fragmented world-model landscape, organizing methods by latent representations,
    structural priors, and application domains.'
  - 'Shared research pattern: Most works use video generation as the backbone for
    world models, focus on long-horizon consistency, and highlight action-conditioned
    controllability as a core challenge.'
  - 'Key differences: Disagreements center on evaluation philosophy (open-loop generation
    quality vs. closed-loop task success), representation granularity (continuous
    latent states, discrete tokens, compositional primitives), and the level of interactivity
    and memory required.'
  - 'Trend evolution: From early physical robot learning (2022) to Sora-driven general
    simulators (2024) and now toward interactive, persistent, and fine-grained controllable
    world models with systematic benchmarking (2025–2026).'
  - 'Open questions: How to unify evaluation across settings, how to handle unseen
    primitives or environments, and how to bridge simulated world models to real-world
    deployment without sim-to-real gaps.'
  related_work_outline_zh:
  - 主流方向：综述和分类法正在整合碎片化的世界模型领域，通过潜在表示、结构先验和应用领域来组织方法。
  - 研究共性：多数工作以视频生成为世界模型骨干，关注长时程一致性，并将动作条件可控性视为核心挑战。
  - 关键差异：分歧围绕评估哲学（开环生成质量 vs. 闭环任务成功）、表示粒度（连续潜在状态、离散令牌、组合原语）以及所需的交互性和记忆级别。
  - 趋势演进：从早期物理机器人学习（2022年），到Sora驱动的通用模拟器（2024年），现在转向具有系统基准的交互式、持久性和细粒度可控世界模型（2025–2026年）。
  - 开放问题：如何统一跨场景评估，如何处理未见过的原语或环境，以及如何弥合模拟世界模型到真实世界部署的sim-to-real差距。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for world models
      what_it_solves: Organizing a fragmented field into design dimensions (latent
        representations, structural priors, internal mechanics) and application-specific
        roadmaps, helping researchers navigate the space of generative world models.
      what_remains_open: Whether the proposed taxonomies are backed by systematic
        evidence across all covered works rather than selective examples, and whether
        they capture rapidly evolving future methods.
    - line: Comparative evaluation synthesis for world models
      what_it_solves: Aggregating benchmarks and metrics (e.g., open-world exploration,
        game engines, autonomous driving, robotics) to reveal how evaluation choices
        shape performance conclusions across different world-model implementations.
      what_remains_open: Cross-setting compatibility of results; most comparisons
        are within silos, and there is no unified, resource-aware protocol that reconciles
        open-loop and closed-loop evaluation gaps.
    - line: Open problem and gap mapping for world models
      what_it_solves: Turning broad literature coverage into concrete technical challenges
        such as long-horizon memory, real-time interactivity, out-of-sight dynamics,
        and physical-law comprehension, and suggesting future research directions.
      what_remains_open: Prioritization of which gaps matter most for progress; the
        identified challenges are not empirically validated, and the field lacks a
        consensus on the minimal set of capabilities that define a true world simulator.
    consensus:
    - Video generation is the dominant backbone for implementing world models, with
      action-conditioned generation seen as essential for controllability and interactivity.
    - Long-horizon consistency and memory are critical open problems, and most approaches
      decompose the problem into latent states, scene graphs, or compositional primitives
      to manage complexity.
    - World models are viewed as pivotal for embodied AI, autonomous driving, and
      general simulation, bridging perception, planning, and decision-making.
    disagreements:
    - 'Evaluation target: some works prioritize open-loop reconstruction or generation
      fidelity, while others insist on closed-loop task success in downstream applications
      like robot execution or driving.'
    - 'Representation choice: continuous latent states, discrete tokens, and hybrid
      approaches are each advocated, with different trade-offs for stability, generalization,
      and computational cost.'
    - 'Interaction mode: real-time interactivity with sub-second latency is a requirement
      for a few systems, but many methods treat generation as an offline planning
      step, leading to conflicting design priorities.'
    - 'Supervision granularity: methods rely on language parsing, dense action labels,
      or self-supervised next-frame prediction, creating a divergence in what kind
      of data is needed and how it scales.'
    open_questions:
    - How can we design a unified evaluation suite that spans open-loop visual quality,
      closed-loop task performance, and resource efficiency across different domains?
    - What is the minimal set of physical laws and commonsense reasoning that a world
      model must internalize to be considered a general simulator, and how can we
      verify it?
    - Can compositional world models generalize to entirely novel primitives not seen
      during training, or do they fundamentally rely on recombination of known elements?
    - How do we close the loop between simulated world models and real-world robot
      execution without extensive sim-to-real transfer, given the evidence gap in
      real-robot evaluation for many proposed methods?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的分类法和路线图综合
      解决的问题: 将碎片化领域组织为设计维度（潜在表示、结构先验、内部机制）和特定应用的路线图，帮助研究者导航生成式世界模型的空间。
      尚未覆盖: 所提出的分类法是否由涵盖所有工作的系统证据支撑，而非选择性举例；它们能否捕捉快速演进的未来方法。
    - 路线: 世界模型的对比评估综合
      解决的问题: 汇总基准和指标（如开放世界探索、游戏引擎、自动驾驶、机器人），揭示评估选择如何塑造不同世界模型实现间的性能结论。
      尚未覆盖: 跨设置的结果兼容性；大多数比较停留在各自领域内，缺乏一个统一的、资源感知的协议来调和开环与闭环评估差距。
    - 路线: 世界模型的开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体技术挑战，如长时记忆、实时交互、视线外动态、物理规律理解，并建议未来研究方向。
      尚未覆盖: 哪些缺口最值得优先解决仍缺乏排序；识别的挑战未经实证验证，领域对定义真正世界模拟器所需的最小能力集尚未达成共识。
    共识:
    - 视频生成是实现世界模型的主导骨干，动作条件生成被视为可控性和交互性的基础。
    - 长时程一致性和记忆是关键开放问题，多数方法通过将问题分解为潜在状态、场景图或组合原语来管理复杂性。
    - 世界模型被视为具身智能、自动驾驶和通用模拟的枢纽，连接感知、规划和决策。
    分歧:
    - 评估目标：部分工作优先考虑开环重建或生成保真度，而其他工作则坚持在机器人执行或驾驶等下游应用中的闭环任务成功。
    - 表示选择：连续潜在状态、离散令牌和混合方法各有拥护者，在稳定性、泛化能力和计算成本上存在不同权衡。
    - 交互模式：实时交互与亚秒级延迟是某些系统的需求，但许多方法将生成视为离线规划步骤，造成设计优先级的冲突。
    - 监督粒度：方法分别依赖语言解析、密集动作标签或自监督下一帧预测，导致所需数据类型和扩展方式的分歧。
    开放问题:
    - 如何设计一个统一的评估套件，能够跨不同领域覆盖开环视觉质量、闭环任务性能和资源效率？
    - 世界模型必须内化的最小物理规律和常识推理集是什么，才能被视为通用模拟器，且如何验证？
    - 组合世界模型能否泛化到训练中未见过的全新原语，还是它们根本上依赖于已知元素的重组？
    - 在缺乏许多方法所缺乏的真实机器人评估证据的情况下，如何弥合模拟世界模型与真实世界机器人执行之间的差距，而无需大量sim-to-real迁移？
