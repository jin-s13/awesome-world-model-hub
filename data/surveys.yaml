  related_work_outline:
  - 'Mainstream direction: Generative world models are being built with diffusion
    transformers and mask reconstruction to produce high-fidelity future video predictions,
    with strong emphasis on driving and robotics scenarios.'
  - 'Shared research pattern: Most methods combine self-supervised learning objectives
    with autoregressive or diffusion-based architectures, aiming to capture environment
    dynamics from large-scale video data without explicit physics equations.'
  - 'Key differences: The primary split lies in whether the world model is optimized
    for visual quality (MaskGWM, RoboScape) or for downstream task performance like
    zero-shot generalization and sample-efficient RL (cRSSM, STORM), and whether action,
    language, or physics priors are explicitly integrated versus learned implicitly.'
  - 'Trend evolution: From 2023 to 2026, the field moved from efficient transformer-based
    stochastic world models for Atari to multi-modal, physics-informed, and compositionally
    generalizable video models pretrained on robot and driving datasets, with a recent
    emergence of dedicated evaluation benchmarks.'
  - 'Open questions: How to disentangle model capability from planner/controller contribution,
    define a unified evaluation protocol for visual fidelity, physical plausibility,
    and task utility, and extend world models to out-of-distribution action-object
    combinations reliably.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和掩码重建为核心的生成式世界模型，旨在生成高保真未来视频预测，重点关注驾驶和机器人场景。
  - 研究共性：多数方法将自监督学习目标与自回归或扩散架构结合，从大规模视频数据中捕捉环境动力学，而不依赖显式物理方程。
  - 关键差异：主要分歧在于世界模型优化目标是视觉质量（如MaskGWM、RoboScape）还是下游任务表现（如零样本泛化、样本高效RL，如cRSSM、STORM），以及动作、语言或物理先验是显式集成还是隐式学习。
  - 趋势演进：2023至2026年，领域从Atari上的高效随机Transformer世界模型，转向在机器人和驾驶数据集上预训练的多模态、物理信息驱动、具备组合泛化能力的视频模型，近年还出现了专用的评估基准。
  - 开放问题：如何解耦模型能力与规划器/控制器的贡献，定义统一的视觉保真度、物理合理性和任务效用的评估协议，以及将世界模型可靠地扩展到分布外动作-物体组合。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion- and Transformer-based generative architectures for video prediction
        (e.g., combining mask reconstruction, depth prediction, compositional language
        decomposition).
      what_it_solves: Turning high-dimensional sensory inputs into predictable future
        video frames, enabling long-horizon, multi-view, and multi-task visual planning
        without explicit simulators.
      what_remains_open: Compositional generalization to unseen physical interactions,
        robustness to real-world perturbations, and the trade-off between generation
        quality and computational efficiency.
    - line: Integration of world models with reinforcement learning and control policies
        (contextual RSSM, RL-optimized world model objectives, efficient transformer
        world models).
      what_it_solves: Leveraging learned dynamics to improve sample efficiency, zero-shot
        generalization, and policy evaluation accuracy in interactive tasks.
      what_remains_open: The relative contribution of the model versus the planner
        or controller is not isolated; model reliability under out-of-distribution
        actions and the assumption of observable context remain unverified.
    - line: Evaluation benchmarks and metrics for spatial/physical consistency (loop-based
        navigation, scene graph consistency scores).
      what_it_solves: Providing assessment dimensions beyond pixel-level similarity,
        such as spatial coherence and physical plausibility, to diagnose world model
        failures.
      what_remains_open: A unified, cross-domain evaluation framework is missing;
        current benchmarks cover limited environments and may not represent real-world
        deployment demands.
    consensus:
    - World model research is shifting from pure pixel prediction to emphasizing physical
      consistency, spatial coherence, and action-conditioned generation.
    - Self-supervised learning on large-scale video data is the dominant paradigm
      for acquiring dynamics without hand-crafted simulators.
    - World models are increasingly positioned as a foundation for downstream decision-making,
      including planning, policy learning, and evaluation.
    disagreements:
    - 'Core capability definition: visual fidelity vs. physical plausibility vs. task
      efficiency as the primary optimization target.'
    - 'Conditioning design: whether to couple action and video generation in a unified
      diffusion process or to treat them separately, and whether to incorporate language
      or physics priors explicitly.'
    - 'Evaluation methodology: mid- to long-term rollout quality, zero-shot task performance,
      spatial consistency scores, and human preference metrics are used inconsistently
      across works.'
    open_questions:
    - How can we systematically isolate the contribution of the world model architecture
      from the surrounding planner, data scale, and evaluation protocol?
    - To what extent must explicit physical knowledge be introduced, versus can it
      emerge implicitly from data, and how does that affect generalization?
    - What constitutes a minimal yet comprehensive evaluation suite that captures
      visual, physical, interaction, and planning capabilities of a world model in
      a unified way?
    - What are the precise boundaries of current world models in handling compositional
      out-of-distribution scenarios involving novel object-action combinations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散与Transformer的生成式架构（如结合掩码重建、深度预测、组合性语言分解）。
      解决的问题: 将高维感官输入转化为可预测的未来视频帧，支持长时域、多视角、多任务视觉规划，无需显式仿真器。
      尚未覆盖: 对未见物理交互的组合泛化、对真实世界扰动的鲁棒性，以及生成质量与计算效率的权衡。
    - 路线: 世界模型与强化学习及控制策略的集成（上下文RSSM、RL优化世界模型目标、高效Transformer世界模型）。
      解决的问题: 利用学习到的动力学提升交互任务中的样本效率、零样本泛化能力和策略评估准确性。
      尚未覆盖: 模型与规划器或控制器的贡献未被解耦；分布外动作下模型的可靠性以及上下文可观测假设尚未得到充分验证。
    - 路线: 空间/物理一致性的评估基准与度量（基于循环导航、场景图一致性分数）。
      解决的问题: 提供超越像素级相似度的评估维度，如空间连贯性和物理合理性，以诊断世界模型故障。
      尚未覆盖: 缺乏统一的跨领域评估框架；现有基准覆盖的环境有限，可能无法代表真实部署需求。
    共识:
    - 世界模型研究正从纯像素预测转向强调物理一致性、空间连贯性和动作条件生成。
    - 在大规模视频数据上进行自监督学习是获取动力学的主流范式，无需手工构建仿真器。
    - 世界模型越来越多地被定位为下游决策的基础，包括规划、策略学习和评估。
    分歧:
    - 核心能力定义：视觉保真度、物理合理性还是任务效率作为主要优化目标。
    - 条件化设计：是将动作与视频生成耦合在统一扩散过程中，还是分别处理，以及是否显式引入语言或物理先验。
    - 评估方法：中长期 rollout 质量、零样本任务表现、空间一致性分数和人类偏好指标在不同工作中使用不一致。
    开放问题:
    - 如何系统性地分离世界模型架构与周围规划器、数据规模和评估协议的影响？
    - 显式物理知识需要引入到何种程度，能否从数据中隐式涌现，这又如何影响泛化？
    - 怎样的最小化但全面的评估套件能够统一衡量世界模型的视觉、物理、交互和规划能力？
    - 当前世界模型在处理涉及新颖物体-动作组合的组合性分布外场景时，精确的能力边界在哪里？
