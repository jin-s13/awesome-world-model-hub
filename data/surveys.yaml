  related_work_outline:
  - 'Mainstream direction: Building world models as controllable video simulators
    for autonomous driving and robotics, enabling action-conditioned future prediction
    and closed-loop policy evaluation.'
  - 'Shared research pattern: Adapting pretrained video diffusion or autoregressive
    transformers with action-conditioning modules, motion-focused losses, and structured
    control to improve dynamic consistency.'
  - 'Key differences: The evaluation target varies—spatial consistency (LoopNav),
    action fidelity (ACT-Bench), visual quality (Vista), or physical plausibility
    (RoboScape)—and the training data ranges from Minecraft to nuScenes to CARL.'
  - 'Trend evolution: From 2024 onward, a shift from open-loop video generation to
    interactive, closed-loop simulation with emphasis on real-time latency, long-horizon
    rollouts, and standardized benchmarks.'
  - 'Open questions: How to guarantee long-horizon consistency and out-of-distribution
    generalization while maintaining visual fidelity and real-time interactivity for
    safety-critical deployment.'
  related_work_outline_zh:
  - 主流方向：构建作为可控视频模拟器的世界模型，用于自动驾驶和机器人，支持动作条件化的未来预测和闭环策略评估。
  - 研究共性：基于预训练视频扩散或自回归Transformer，加入动作条件模块、运动增强损失和结构化控制，以提升动态一致性。
  - 关键差异：评测目标不同——空间一致性（LoopNav）、动作忠实度（ACT-Bench）、视觉质量（Vista）或物理合理性（RoboScape）——训练数据从Minecraft到nuScenes、CARL各异。
  - 趋势演进：从2024年起，从开环视频生成转向交互式闭环模拟，强调实时延迟、长时域推演和标准化基准。
  - 开放问题：如何在保证视觉保真度和实时交互的前提下，实现长时域一致性和分布外泛化，以满足安全关键部署需求。
  literature_review:
    line_of_work_matrix:
    - line: Simulator evaluation benchmarks and datasets
      what_it_solves: Provides standardized metrics and data for quantifying specific
        world model capabilities such as spatial consistency, action fidelity, and
        dynamic realism.
      what_remains_open: Existing benchmarks are domain-specific (Minecraft, nuScenes)
        and the link between measured metrics and real-world decision-making performance
        remains unverified; cross-domain generalization is unexplored.
    - line: Action-controllable video generation as world simulators
      what_it_solves: Transforms pretrained or custom video generation models into
        simulators that accept high-level or low-level actions and produce future
        frames, enabling closed-loop planning and policy training.
      what_remains_open: Long-horizon temporal consistency, out-of-distribution robustness,
        and multi-view geometric consistency degrade under autoregressive rollout;
        real-time inference remains a challenge for complex models.
    - line: Physics-informed and context-aware world models
      what_it_solves: Incorporates physical priors or observable context to improve
        the plausibility of generated dynamics and to disentangle latent state from
        external factors, aiding zero-shot generalization.
      what_remains_open: Relies on explicit physics assumptions or observable context,
        limiting applicability to scenarios where such information is unavailable
        or insufficient; broad physical interaction modeling is still lacking.
    - line: Interactive world model system architectures
      what_it_solves: Integrates action controllability, long-horizon memory, and
        responsiveness into a unified framework for real-time interactive simulation
        across domains.
      what_remains_open: No consensus on the optimal architecture trade-off between
        speed, fidelity, and controllability; practical deployment on edge hardware
        and robustness to user variability are not yet demonstrated.
    consensus:
    - World models as video simulators are valuable for model-based reinforcement
      learning and autonomous driving evaluation.
    - Action-conditioned generation is essential for closed-loop interaction, and
      motion-focused losses improve dynamic consistency.
    - Diffusion and autoregressive transformers are the dominant backbones for generating
      future frames, often combined with structured control mechanisms.
    - Standardized benchmarks are necessary to compare different simulators, but current
      benchmarks emphasize different capabilities and are not unified.
    disagreements:
    - 'The primary evaluation target differs: some works prioritize spatial consistency
      (e.g., loop-based navigation), others action fidelity, visual quality, or physical
      plausibility, leading to incompatible metrics.'
    - Training data domains vary widely (Minecraft, nuScenes driving, CARL contextual
      tasks, robotic manipulation), making it unclear whether improvements transfer
      across domains.
    - Approaches diverge on whether to fine-tune a pretrained video generator (DWS)
      or build a dedicated world model from scratch (Vista, FAR-Drive), impacting
      model capacity and data requirements.
    - Real-time interactivity is a central claim in some works but is only partially
      validated (single GPU, sub-second latency), while others ignore latency constraints.
    open_questions:
    - How can we design a unified evaluation benchmark that covers spatial consistency,
      action fidelity, physical plausibility, and long-horizon stability across multiple
      domains?
    - What architectural choices allow world models to maintain consistent dynamics
      and visual quality over extended rollouts without catastrophic forgetting or
      error accumulation?
    - Can the performance of a world model on a benchmark be causally linked to downstream
      policy performance in real-world robotic or driving tasks?
    - How to ensure safe deployment of learned world simulators in safety-critical
      systems given their known vulnerabilities to distribution shift and adversarial
      perturbations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 模拟器评估基准与数据集
      解决的问题: 提供标准化指标和数据，用于量化世界模型在空间一致性、动作忠实度和动态真实性等方面的特定能力。
      尚未覆盖: 现有基准局限于特定领域（Minecraft、nuScenes），测量指标与真实世界决策性能之间的关联未经验证，跨域泛化能力未被探索。
    - 路线: 动作可控的视频生成作为世界模拟器
      解决的问题: 将预训练或定制视频生成模型转化为可接受高层或低层动作并生成未来帧的模拟器，支持闭环规划和策略训练。
      尚未覆盖: 长时域时序一致性、分布外鲁棒性和多视图几何一致性在自回归推演下会退化，复杂模型的实时推理仍是挑战。
    - 路线: 物理信息与上下文感知的世界模型
      解决的问题: 融合物理先验或可观测上下文，提升生成动态的合理性，并将潜在状态与外部因素解耦，辅助零样本泛化。
      尚未覆盖: 依赖显式物理假设或可观测上下文，在缺乏此类信息或信息不足的场景中受限，广泛的物理交互建模仍缺失。
    - 路线: 交互式世界模型系统架构
      解决的问题: 将动作可控性、长时域记忆和响应能力整合到统一框架中，实现跨领域的实时交互模拟。
      尚未覆盖: 在速度、保真度和可控性之间尚无最优架构权衡的共识，边缘设备上的实际部署和对用户可变性的鲁棒性尚未得到验证。
    共识:
    - 作为视频模拟器的世界模型对基于模型的强化学习和自动驾驶评估具有重要价值。
    - 动作条件生成是闭环交互的关键，运动增强损失可提升动态一致性。
    - 扩散模型和自回归Transformer是生成未来帧的主流骨干网络，常与结构化控制机制结合。
    - 标准化基准对于比较不同模拟器是必要的，但当前基准强调不同能力，尚未统一。
    分歧:
    - 主要评测目标不同：有些工作侧重空间一致性（如循环导航），有些侧重动作忠实度、视觉质量或物理合理性，导致指标不兼容。
    - 训练数据领域差异大（Minecraft、nuScenes驾驶、CARL上下文任务、机器人操作），尚不清楚改进能否跨领域迁移。
    - 方法在是否微调预训练视频生成器（DWS）或从头构建专用世界模型（Vista、FAR-Drive）上存在分歧，影响模型容量与数据需求。
    - 部分工作强调实时交互性，但仅在单GPU亚秒级延迟上部分验证，而其他工作则忽略延迟约束。
    开放问题:
    - 如何设计一个统一的评估基准，覆盖跨域的空间一致性、动作忠实度、物理合理性和长时域稳定性？
    - 何种架构选择能使世界模型在长时间推演中保持一致的动态和视觉质量，而不会出现灾难性遗忘或误差累积？
    - 世界模型在基准上的性能能否因果地关联到下游策略在真实机器人或驾驶任务中的表现？
    - 考虑到学习型世界模拟器对分布偏移和对抗扰动的已知脆弱性，如何确保其在安全关键系统中的安全部署？
