  related_work_outline:
  - 'Mainstream direction: task-specific world-model benchmarks are the dominant evaluation
    route, with datasets and closed-loop tests for visual fidelity, spatial/temporal
    consistency, memory, action control, and downstream policy utility. Representative
    examples include LoopNav, MIND, MaskGWM, and RoboScape.'
  - 'Shared research pattern: papers construct video/action sequences, define capability-specific
    metrics beyond pixel error, and evaluate generative world models in navigation,
    driving, Atari, or robotic settings under open-loop, closed-loop, or zero-shot
    transfer protocols.'
  - 'Key differences: evaluation targets range from Atari human-normalized performance
    to driving multi-view prediction, Minecraft spatial consistency, and robot policy
    training/evaluation; representation and supervision differ across diffusion transformers,
    recurrent state-space models, VAE-transformers, physics-informed auxiliary tasks,
    and unified video-action diffusion.'
  - 'Trend evolution: recent work moves from aggregate generation quality toward open-domain
    revisited and loop-based stress tests that expose long-term memory and cross-action-space
    failures; the available evidence is concentrated in 2023-2026, so this is a frontier-level
    shift rather than a long historical trajectory.'
  - 'Open questions: proxy metrics for visual realism or consistency are not yet tied
    to downstream decisions; long-horizon, cross-action, and unobserved-context generalization
    remain underevidenced; several papers omit limitations, baselines, or stability
    evidence, so comparability is unverified.'
  related_work_outline_zh:
  - 主流方向：以任务特定的世界模型基准为主要评估路径，数据集与闭环测试覆盖视觉保真、时空一致性、记忆与动作控制，以及下游策略效用。代表性例子包括 LoopNav、MIND、MaskGWM、RoboScape。
  - 研究共性：论文构建视频/动作序列，定义超越像素误差的能力指标，并在导航、驾驶、Atari 或机器人场景中评估生成式世界模型，采用开环、闭环或零样本迁移协议。
  - 关键差异：评测目标从 Atari 人类归一化分数、驾驶多视角预测、Minecraft 空间一致性到机器人策略训练/评估不等；表示与监督方式涵盖扩散Transformer、循环状态空间、VAE-Transformer、物理信息辅助任务和视频-动作统一扩散。
  - 趋势演进：近期工作从整体生成质量转向开放域重访与循环式压力测试，以暴露长期记忆和跨动作空间失败；可用证据集中在 2023-2026 年，因此这是前沿层面的转变而非长期历史轨迹。
  - 开放问题：视觉真实或一致性代理指标尚未与下游决策建立明确关系；长时域、跨动作和不可观测上下文泛化仍缺少充分证据；部分论文未报告局限性、基线或稳定性，可比性未得到验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video/action datasets and benchmark protocols
        for evaluating spatial consistency, memory consistency, and action control
        in world models.
      what_remains_open: Coverage beyond specific settings such as navigation loops,
        open-domain revisited videos, driving scenes, Atari, or robot data is not
        yet established; some dataset papers report no baseline results in the visible
        abstract.
    - line: Metric and stress-test design
      what_it_solves: Probes capability-level evidence such as scene-graph consistency,
        temporal stability, contextual coherence, physical plausibility, visual fidelity,
        and downstream policy utility beyond aggregate generation scores.
      what_remains_open: Proxy metrics are not yet aligned with real downstream decisions;
        long-term memory consistency and cross-action-space generalization remain
        shown as failure modes.
    - line: Comparable baselines and reporting
      what_it_solves: Provides model-based RL, diffusion world-model, contextual recurrent,
        and physics-informed baselines evaluated on shared benchmarks for training
        efficiency, zero-shot generalization, video prediction, and robot policy learning.
      what_remains_open: Several top papers have empty limitation fields or partial
        reproducibility signals, leaving cross-implementation stability, compute-budget
        sensitivity, and baseline comparability underverified.
    consensus:
    - World-model evaluations increasingly use action-conditioned or action-free video
      prediction as evidence of learned dynamics.
    - Benchmark design is moving toward capability-specific stress tests rather than
      relying only on aggregate generation quality.
    - Downstream utility signals, such as policy training, policy evaluation, or zero-shot
      transfer, are treated as important validation.
    - Open-domain, loop-based, or closed-loop revisited protocols are used to expose
      memory and spatial consistency failures.
    disagreements:
    - 'Evaluation target differs: some papers optimize Atari human-normalized agent
      performance, while others target driving multi-view prediction, navigation spatial
      consistency, open-domain memory/action control, or robot video and policy utility.'
    - 'Representation differs: diffusion transformers, recurrent state-space models,
      VAE-transformers, physics-informed joint objectives, and unified video-action
      diffusion are used across the packet.'
    - 'Supervision and training differ: self-supervised video prediction, MAE-style
      mask reconstruction, context-conditioned RL, physics-related auxiliary tasks,
      and action-free pretraining are not interchangeable.'
    - 'Interaction mode differs: open-loop generation, zero-shot cross-dataset validation,
      closed-loop revisited navigation, multi-view future prediction, and imagined-rollout
      policy training emphasize different failure modes.'
    open_questions:
    - How well do spatial-consistency or scene-graph scores predict real navigation
      or manipulation performance outside the benchmark environment?
    - Can current world models maintain long-term memory consistency and generalize
      across action spaces when tested in open-domain closed-loop settings?
    - Does improved visual detail in diffusion world models transfer from Atari to
      real-world robot policy robustness or merely benchmark performance?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      missing baseline details when several top papers do not report limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享视频/动作数据集与基准协议，评估世界模型的空间一致性、记忆一致性和动作控制。
      尚未覆盖: 目前主要覆盖导航循环、开放域重访、驾驶、Atari 或机器人数据；部分数据集论文在可见摘要中未报告基线结果，更广泛设置的覆盖尚不明确。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验场景图一致性、时间稳定性、上下文连贯性、物理合理性、视觉保真度和下游策略效用。
      尚未覆盖: 代理指标尚未与真实下游决策对齐；长期记忆一致性、跨动作空间泛化仍表现为失败模式。
    - 路线: 可比基线与报告规范
      解决的问题: 提供基于模型RL、扩散世界模型、上下文循环模型和物理信息基线的共享基准评测，覆盖训练效率、零样本泛化、视频预测和机器人策略学习。
      尚未覆盖: 多篇论文局限性为空或可复现信号不完整，跨实现稳定性、算力预算敏感性和基线可比性仍未被充分验证。
    共识:
    - 世界模型评估越来越多地把受动作条件或不受动作条件约束的视频预测作为动力学学习的证据。
    - 基准设计正从只看整体生成质量转向针对具体能力进行压力测试。
    - 策略训练、策略评估或零样本迁移等下游效用信号被视为重要验证。
    - 开放域、循环式或闭环重访协议被用来暴露记忆和空间一致性失败。
    分歧:
    - 评测目标不同：有的优化 Atari 人类归一化智能体表现，有的瞄准驾驶多视角预测、导航空间一致性、开放域记忆/动作控制，或机器人视频与策略效用。
    - 表示方式不同：证据中使用了扩散Transformer、循环状态空间、VAE-Transformer、物理信息联合目标以及视频-动作统一扩散。
    - 监督与训练方式不同：自监督视频预测、MAE式掩码重建、上下文条件RL、物理相关辅助任务和动作缺失预训练并不等价。
    - 交互模式不同：开环生成、跨数据集零样本验证、闭环重访导航、多视角未来预测和想象轨迹策略训练强调不同的失败模式。
