  related_work_outline:
  - 'Mainstream direction: Application-specific world models dominate, especially
    driving video prediction, robotic imagination, and interactive game/environment
    benchmarks; recent work uses diffusion transformers or latent dynamics conditioned
    on domain signals.'
  - 'Shared research pattern: Learn a world model that predicts future observations
    or latent states under actions/context, then use it for policy learning, planning,
    consistency evaluation, or simulation.'
  - 'Key differences: Methods vary by modality coupling such as video-only, video-action,
    or physics-informed; supervision assumptions such as observable context, language
    primitives, or action-free video; and evaluation targets such as Atari, CARL,
    driving datasets, robot simulation, or open-domain benchmarks.'
  - 'Trend evolution: Within the current frontier, 2023 efficient RL world models
    such as STORM lead into 2024-2026 generative embodied and driving world models
    plus benchmarks for memory and spatial consistency.'
  - 'Open questions: Cross-domain transfer, long-term consistency, real-world safety
    alignment, and generalization beyond seen primitives or contexts remain unresolved;
    several papers lack limitation details or real deployment evidence.'
  related_work_outline_zh:
  - 主流方向：以自动驾驶视频预测、机器人想象和交互式游戏/环境评测为主的应用型世界模型；近期方法多用扩散Transformer或潜在动力学，并以领域信号为条件。
  - 研究共性：学习在动作或上下文条件下预测未来观测或潜在状态，再用于策略学习、规划、一致性评测或仿真。
  - 关键差异：模态耦合方式（纯视频、视频-动作、物理信息）、监督假设（可观测上下文、语言原语、无动作视频）及评测目标（Atari、CARL、驾驶数据集、机器人仿真、开放域基准）不同。
  - 趋势演进：当前前沿内，2023年高效强化学习世界模型（如STORM）逐渐演进到2024-2026年生成式具身/驾驶世界模型，并出现记忆与空间一致性基准。
  - 开放问题：跨域迁移、长期一致性、真实安全对齐和超出已见原语/上下文的泛化仍未解决；多篇论文缺少局限性说明或真实部署证据。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models and simulation-oriented scene prediction
      what_it_solves: Long-horizon and multi-view video prediction for driving scenes,
        including zero-shot transfer across driving datasets.
      what_remains_open: Whether predicted or simulated video quality translates to
        real-world driving safety and operational decisions; limitation details are
        not reported.
    - line: Embodied robot world models for video generation and policy learning
      what_it_solves: Generating robot videos or plans from language, goals, physics
        signals, and actions; supporting policy training, evaluation, and pretraining
        on robot data.
      what_remains_open: Real-robot execution is underevidenced; generalization to
        unseen language primitives, embodiments, and physical environments remains
        unclear.
    - line: Efficient model-based RL with latent world models
      what_it_solves: Sample-efficient policy learning from imagined trajectories
        in visual game and contextual control tasks; one line adds context to improve
        zero-shot dynamics generalization.
      what_remains_open: Evaluations cover few benchmark tasks and assume observable
        context; broader task and domain transfer is unverified.
    - line: Memory, spatial consistency, and action-control benchmarks
      what_it_solves: Measuring whether world models maintain scene consistency, memory
        across revisited views, and action alignment in open interactive environments.
      what_remains_open: Current models show difficulty in long-term consistency and
        cross-action-space generalization; these benchmarks need broader model coverage.
    consensus:
    - World models are applied by conditioning future observation or latent-state
      generation on task-relevant signals such as actions, contexts, language instructions,
      goals, depth, or keypoints.
    - Generative architectures, especially diffusion transformers and latent sequence
      models, recur across driving, robotics, and game/RL applications.
    - 'Application tasks increasingly evaluate beyond visual quality: control, consistency,
      zero-shot transfer, physical plausibility, and policy utility are used as evidence.'
    - Benchmarks are emerging to formalize open-world spatial, memory, and action-control
      failures.
    disagreements:
    - 'Representation differs: some methods use latent state-space models for imagined
      RL, while others generate pixels or video frames directly.'
    - 'Supervision differs: observable context values, language parsed into primitives,
      physics targets such as depth/keypoints, action-free video, or coupled action-video
      diffusion.'
    - 'Evaluation target differs: game benchmark performance, contextual zero-shot
      RL, driving video metrics, robot simulation success, or open-domain consistency
      metrics.'
    - 'Interaction mode differs: open-loop future prediction or plan synthesis versus
      closed-loop interactive world simulation.'
    open_questions:
    - Does improved driving video prediction transfer to real-world safety outcomes
      or operational planning? Current evidence is benchmark-level.
    - Can world models maintain long-term memory and spatial consistency across viewpoints
      and action spaces without task-specific localization or graph constraints?
    - Can robot world models generalize to unseen primitive combinations, new embodiments,
      or physical environments beyond seen training data?
    - 'Which supervision assumptions are necessary: observable context, parsed language,
      physics signals, and action-free video all appear but lack controlled comparison.'
