  related_work_outline:
  - 'Mainstream direction: Applying world models to robotics, driving, and games by
    generating future states (video or latent) that support planning, policy learning,
    or simulation.'
  - 'Shared research pattern: Using diffusion or Transformer-based architectures to
    model dynamics, often integrating actions, language, or physics priors to improve
    controllability and generalization.'
  - 'Key differences: Some works focus on domain-specific simulation (e.g., driving
    with multi-view consistency), while others aim for general embodied pretraining;
    evaluation spans visual fidelity, policy success, and dedicated benchmarks like
    spatial or memory consistency.'
  - 'Trend evolution: The field is moving from single-domain, video-only generation
    toward action-coupled, physically informed, and multi-task pretraining, with recent
    emergence of specialized benchmarks for long-term memory and spatial consistency.'
  - 'Open questions: Real-world transfer of simulated world models, robust generalization
    to novel primitive combinations or environment rules, and alignment between visual
    generation metrics and downstream task performance remain unverified.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于机器人、自动驾驶与游戏，通过生成未来状态（视频或潜在表示）支持规划、策略学习或仿真。
  - 研究共性：采用扩散模型或Transformer架构建模动力学，常融合动作、语言或物理先验以提升可控性与泛化性。
  - 关键差异：部分工作专注领域特定仿真（如驾驶多视角一致性），其他则追求通用具身预训练；评测涵盖视觉保真度、策略成功率及专用基准（如空间/记忆一致性）。
  - 趋势演进：从单一领域、纯视频生成向动作耦合、物理引导和多任务预训练演进，并出现评估长期记忆与空间一致性的专门基准。
  - 开放问题：仿真世界模型到真实世界的迁移、对新原语组合或环境规则的泛化、视觉生成指标与下游任务性能的对齐关系仍未验证。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Long-horizon, multi-view video prediction for driving scenes
        with zero-shot generalization to unseen datasets, reducing the need for exhaustive
        real-world data collection.
      what_remains_open: Closed-loop safety and causal reasoning in real driving are
        not evaluated; reliance on offline datasets leaves open how well the model
        aligns with real operational outcomes.
    - line: Embodied robotic world models
      what_it_solves: Generating physically plausible, controllable robot videos from
        language or multimodal inputs, and pretraining policies that generalize across
        diverse robotic tasks and embodiments.
      what_remains_open: Compositional generalization is limited to seen primitives;
        real-world deployment and long-horizon task execution are not verified; physical
        fidelity metrics are not yet correlated with real robot success.
    - line: Interactive environment and game world models
      what_it_solves: Efficient world model learning in game environments like Atari,
        and spatial consistency evaluation in open worlds like Minecraft, enabling
        fast policy improvement and benchmarked spatial reasoning.
      what_remains_open: Generalization to entirely new games or changing environment
        rules is unknown; spatial consistency benchmarks do not yet assess long-term
        planning or action control under novel dynamics.
    - line: World model evaluation benchmarks
      what_it_solves: Providing reproducible, domain-agnostic frameworks to measure
        memory consistency and action control in world models, revealing failure modes
        in temporal stability and cross-view coherence.
      what_remains_open: Coverage of physical interaction and causal reasoning is
        limited; the relationship between benchmark scores and real-world task performance
        has not been established.
    consensus:
    - World models are built as video generation or latent dynamics models that enable
      downstream tasks such as policy learning, planning, or simulation.
    - Generalization is a central goal, whether to new datasets, tasks, or environments,
      and is often pursued via self-supervised pretraining or architectural innovations.
    - Integrating action, language, or physics information improves controllability,
      compositionality, or physical plausibility of generated futures.
    - Evaluation is moving beyond visual quality to include task-specific metrics
      (e.g., policy success) and dedicated consistency benchmarks.
    disagreements:
    - Some works use diffusion-based generation (MaskGWM, UWM), while others rely
      on recurrent state-space models or Transformer-VAE hybrids (STORM, cRSSM).
    - 'Supervision signals vary: physics priors like depth and keypoint dynamics (RoboScape),
      language parsing (RoboDreamer), or fully self-supervised learning from video
      and actions.'
    - 'Evaluation targets differ: visual fidelity and realism, policy performance
      in RL, spatial consistency, or memory and action control in dedicated benchmarks.'
    - Interaction modes range from open-loop video generation to closed-loop policy
      execution and interactive video-to-world baselines; deployment settings cover
      single domains, broad pretraining, or evaluation-only benchmarks.
    open_questions:
    - How can world models trained in simulation be transferred to real robots without
      severe domain gaps, and what additional sensor or physics priors are needed?
    - Can current world models maintain causal consistency and physical plausibility
      over long, closed-loop interactions, and how should such capabilities be measured?
    - To what extent do improvements in visual generation or consistency benchmarks
      translate into safer or more reliable real-world task performance?
    - How do world models generalize to completely novel object/action primitives
      or environment dynamics beyond recombinations of seen training data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 实现驾驶场景的长时域、多视角视频预测，并具备对未见数据集的零样本泛化，减少对大量真实数据采集的依赖。
      尚未覆盖: 未评估真实驾驶中的闭环安全性与因果推理；依赖离线数据集，模型与真实运营结果的一致性未知。
    - 路线: 具身机器人世界模型
      解决的问题: 从语言或多模态输入生成物理合理、可控的机器人视频，并预训练跨任务和本体的泛化策略。
      尚未覆盖: 组合泛化局限于已见原语；真实世界部署和长周期任务执行未验证；物理保真度指标与真实机器人成功率的关联未建立。
    - 路线: 交互式环境与游戏世界模型
      解决的问题: 在Atari等游戏中高效学习世界模型，在Minecraft等开放世界中评估空间一致性，实现快速策略提升和空间推理的基准测试。
      尚未覆盖: 对全新游戏或环境规则变化的泛化未知；空间一致性基准尚未评估新动态下的长期规划与动作控制。
    - 路线: 世界模型评估基准
      解决的问题: 提供可复现、域无关的框架，测量世界模型的记忆一致性与动作控制，揭示时间稳定性与跨视角连贯性的失效模式。
      尚未覆盖: 物理交互与因果推理的覆盖有限；基准分数与真实任务性能的关系尚未建立。
    共识:
    - 世界模型被构建为视频生成或潜在动力学模型，以支撑策略学习、规划或仿真等下游任务。
    - 泛化是核心目标，无论是对新数据集、新任务还是新环境，常通过自监督预训练或架构创新来实现。
    - 融合动作、语言或物理信息可改善生成内容的可控性、组合性或物理合理性。
    - 评估正从视觉质量扩展到任务特定指标（如策略成功率）和专用一致性基准。
    分歧:
    - 部分工作采用扩散生成（MaskGWM、UWM），另一些则依赖循环状态空间模型或Transformer-VAE混合架构（STORM、cRSSM）。
    - 监督信号不同：有的使用深度和关键点动力学等物理先验（RoboScape），有的借助语言解析（RoboDreamer），有的完全基于视频和动作的自监督学习。
    - 评测目标各异：视觉保真度与真实感、RL中的策略性能、空间一致性，或专用基准中的记忆与动作控制。
    - 交互模式涵盖开环视频生成、闭环策略执行和交互式视频到世界基线；部署设定包括单一领域、大规模预训练或纯评测基准。
    开放问题:
    - 如何在仿真中训练的世界模型迁移到真实机器人时避免严重域差距，需要哪些额外的传感器或物理先验？
    - 当前世界模型能否在长期的闭环交互中保持因果一致性和物理合理性，应如何测量这些能力？
    - 视觉生成或一致性基准的提升在多大程度上能转化为更安全、更可靠的真实任务表现？
    - 世界模型在何种程度上能泛化到超出训练数据组合的全新物体/动作原语或环境动力学？
