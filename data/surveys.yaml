    - 部署场景不同：单GPU亚秒级闭环驾驶模拟 vs 跨具身机器人视频生成和策略后训练，后者没有单一延迟约束。
    - 监督与评测目标不同：空间一致性、驾驶动作忠实度、视觉保真度与物理合理性、或下游策略成功率。
    - 动力学假设不同：有的假设上下文值可观测，有的通过视频、深度或关键点辅助任务隐式推断物理或隐动力学。
