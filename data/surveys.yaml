  related_work_outline:
  - 'Mainstream direction: Building world models as generative video predictors combined
    with action-conditioning, using diffusion transformers or stochastic state-space
    models. The dominant aim is to enable planning, policy learning, and zero-shot
    generalization in robotics and autonomous driving.'
  - 'Shared research pattern: Most works formulate world models as self-supervised
    future frame prediction, then integrate action modalities via conditioning or
    joint diffusion. They share a focus on improving visual fidelity, temporal consistency,
    and generalization to unseen scenarios, often validated on standard benchmarks
    like Atari, CARL, or driving datasets.'
  - 'Key differences: Representations diverge into stochastic recurrent state-space
    models (cRSSM/Dreamer), pure video diffusion (MaskGWM, RoboScape), and unified
    video-action diffusion (UWM). Some factorize generation via language (RoboDreamer),
    while others incorporate physics knowledge. Evaluation targets differ: visual
    quality, policy performance, spatial consistency, or memory and action control.'
  - 'Trend evolution: From 2023''s efficient Transformer world models for Atari (STORM)
    to 2024–2025''s explosion of diffusion-based video world models for robotics and
    driving, accompanied by specialized benchmarks (LoopNav, MIND) that test memory
    consistency and spatial coherence. The 2026 entry suggests the frontier is moving
    toward closed-loop, action-aware evaluation.'
  - 'Open questions: How to systematically evaluate long-term memory and physical
    plausibility? How much gain comes from the model architecture versus the planner
    or controller? Can world models generalize to novel action spaces and compositional
    tasks beyond training primitives? What is the role of large-scale pretraining
    across diverse embodiments?'
  related_work_outline_zh:
  - 主流方向：构建以生成式视频预测为核心的世界模型，并结合动作条件，使用扩散变压器或随机状态空间模型。主要目标是为机器人和自动驾驶中的规划、策略学习与零样本泛化提供基础。
  - 研究共性：多数工作将世界模型形式化为自监督未来帧预测，然后通过条件控制或联合扩散整合动作模态。它们共同关注提升视觉保真度、时间一致性和对未见场景的泛化，通常以Atari、CARL或驾驶数据集为基准验证。
  - 关键差异：表示方式分化为随机循环状态空间模型（cRSSM/Dreamer）、纯视频扩散（MaskGWM、RoboScape）和统一视频-动作扩散（UWM）。部分工作通过语言分解视频生成（RoboDreamer），另一些则融入物理知识。评估目标各异：视觉质量、策略性能、空间一致性或记忆与动作控制。
  - 趋势演进：从2023年面向Atari的高效Transformer世界模型（STORM），到2024–2025年基于扩散的视频世界模型在机器人和驾驶领域的爆发，并伴随专用基准（LoopNav、MIND）的出现，测试记忆一致性和空间连贯性。2026年的条目表明前沿正在转向闭环、动作感知的评估。
  - 开放问题：如何系统评估长期记忆和物理合理性？模型架构与规划器/控制器的贡献如何分离？世界模型能否泛化到训练原语之外的新动作空间和组合任务？跨不同具身形态的大规模预训练作用如何？
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforms world-model ideas into concrete architectures, losses,
        and training recipes. Examples include diffusion transformers with mask reconstruction
        for driving (MaskGWM), stochastic transformer world models for Atari (STORM),
        contextual recurrent state-space models for zero-shot RL (cRSSM), and physics-informed
        joint training of RGB and depth/keypoints (RoboScape).
      what_remains_open: Which architectural choices (e.g., diffusion vs. state-space
        vs. VAE) transfer across tasks, and how to design objectives that jointly
        optimize visual quality, physical plausibility, and long-horizon consistency
        without task-specific tuning.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decision-making by coupling video
        and action diffusion (UWM), training policies in world-model dreams (STORM,
        cRSSM), or factorizing video plans from language into composable primitives
        (RoboDreamer). These methods enable action-conditioned generation and zero-shot
        policy generalization.
      what_remains_open: How much of the performance gain comes from the model itself
        versus the planner or controller. Generalization to novel action spaces and
        compositional tasks beyond those seen during training remains largely untested.
        Real-world deployment and closed-loop interaction are underexplored.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides benchmarks and metrics to isolate method contributions,
        such as spatial consistency (LoopNav with Scene Graph Consistency Score) and
        memory consistency/action control (MIND). These tools highlight failures in
        long-term memory and cross-action-space generalization.
      what_remains_open: Whether existing benchmarks capture the full spectrum of
        world-model capabilities, especially physical plausibility and real-world
        transfer. The field lacks a unified evaluation protocol covering diverse embodiments,
        and many papers do not report comprehensive ablation of architectural choices
        versus training data effects.
    consensus:
    - World models are primarily built as generative models of future observations,
      often video frames, trained via self-supervised prediction.
    - Action conditioning is essential for enabling downstream planning or policy
      learning, either by feeding actions as input or by jointly modeling action and
      observation sequences.
    - Generalization to unseen dynamics, goals, or viewpoints is a key desired property,
      with zero-shot or few-shot evaluation becoming common.
    - Diffusion models and transformers are the dominant architectural backbones in
      recent work, replacing earlier recurrent-only approaches.
    disagreements:
    - 'Representation choice: stochastic state-space models with latent variables
      (cRSSM) versus purely video-based diffusion without explicit state (MaskGWM,
      RoboScape) versus unified video-action diffusion (UWM).'
    - 'Supervision: some works rely solely on video prediction loss, while others
      incorporate explicit physics knowledge (depth, keypoints) or language-based
      factorization.'
    - 'Evaluation target: policy performance on RL benchmarks (Atari, CARL) versus
      video fidelity metrics versus specialized consistency scores (spatial, memory).'
    - 'Interaction mode: open-loop video generation versus closed-loop action-conditioned
      rollout, and the extent to which models are tested in real-world or simulated
      environments.'
    open_questions:
    - How to design a unified evaluation framework that jointly measures visual fidelity,
      physical plausibility, long-term memory, and action controllability across diverse
      embodiments?
    - What is the minimal set of inductive biases (e.g., physics, compositionality,
      context) needed for world models to generalize to novel tasks and action spaces
      without overfitting to training domains?
    - To what extent can large-scale pretraining on heterogeneous robotic datasets
      (as in UWM) compensate for the lack of task-specific architecture design, and
      how should we ablate data versus model contributions?
    - How can we separate the contributions of the world model, the planner, and the
      controller in end-to-end systems, given that many works report only aggregate
      performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型构想转化为具体架构、损失函数和训练配方。例如，MaskGWM利用扩散变压器与掩码重建进行驾驶视频预测，STORM结合Transformer与VAE用于Atari，cRSSM在Dreamer中引入上下文以实现零样本RL，RoboScape联合学习RGB视频与深度/关键点物理知识。
      尚未覆盖: 哪些架构选择（扩散、状态空间、VAE）能跨任务迁移，以及如何设计目标函数以同时优化视觉质量、物理合理性和长时域一致性，而不依赖任务特定调优。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学与决策联系起来，例如UWM耦合视频和动作扩散，STORM和cRSSM在世界模型梦境中训练策略，RoboDreamer将语言指令分解为可组合的视频原语。这些方法支持动作条件生成和零样本策略泛化。
      尚未覆盖: 性能增益多少来自模型本身，多少来自规划器或控制器。对训练中未见的新动作空间和组合任务的泛化仍缺乏验证。真实世界部署和闭环交互探索不足。
    - 路线: 方法证据与消融协议
      解决的问题: 提供基准和指标以分离方法贡献，如LoopNav的空间一致性分数（SGCS）和MIND的记忆一致性与动作控制评估。这些工具揭示了长时记忆和跨动作空间泛化的失败。
      尚未覆盖: 现有基准是否覆盖了世界模型能力的完整谱系，尤其是物理合理性和真实世界迁移。领域缺乏涵盖不同具身形态的统一评估协议，许多论文未对架构选择与训练数据效应进行充分消融。
    共识:
    - 世界模型主要作为未来观测（通常是视频帧）的生成模型，通过自监督预测训练。
    - 动作条件对于下游规划或策略学习至关重要，方式包括将动作作为输入或联合建模动作与观测序列。
    - 对未见动力学、目标或视角的泛化是核心期望属性，零样本或少样本评估逐渐成为常态。
    - 扩散模型和Transformer是近期工作的主导架构，取代了早期纯循环方法。
    分歧:
    - 表示选择：随机状态空间模型（cRSSM）与纯视频扩散（MaskGWM、RoboScape）与统一视频-动作扩散（UWM）。
    - 监督信号：一些工作仅依赖视频预测损失，另一些则融入显式物理知识（深度、关键点）或基于语言的分解。
    - 评估目标：RL基准上的策略性能（Atari、CARL）对比视频保真度指标对比专门设计的一致性分数（空间、记忆）。
    - 交互模式：开环视频生成对比闭环动作条件推演，以及模型在真实环境或仿真中测试的程度。
    开放问题:
    - 如何设计统一评估框架，能同时衡量视觉保真度、物理合理性、长期记忆和动作可控性，并覆盖不同具身形态？
    - 世界模型需要多少最小的归纳偏置（如物理、组合性、上下文）才能泛化到新任务和动作空间，而不在训练域上过拟合？
    - 大规模异构机器人数据集预训练（如UWM）在多大程度上能弥补任务特定架构设计的缺失，如何消融数据与模型各自的贡献？
    - 在端到端系统中，如何分离世界模型、规划器和控制器的贡献，因为许多工作仅报告聚合性能？
