    - 'Supervision signal differs: approaches use loop navigation, temporal depth,
      keypoint dynamics, observable context values, or trajectory annotations.'
    - 'Evaluation target differs: spatial consistency, action fidelity, zero-shot
      policy generalization, physical plausibility, and closed-loop latency are weighted
      differently across works.'
    - 'Deployment posture differs: some contributions emphasize open benchmarks or
      model artifacts, while others optimize single-GPU latency; multi-GPU and cross-infrastructure
      deployment is rarely addressed.'
    open_questions:
