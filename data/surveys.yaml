  related_work_outline:
  - 'Mainstream direction: Designing benchmarks and metrics that evaluate world-model
    consistency, controllability, and long-horizon generalization beyond visual fidelity,
    with a focus on driving, robotics, and game environments.'
  - 'Shared research pattern: Replacing discrete latent-variable world models with
    diffusion-based or transformer-based architectures, while coupling video generation
    with action-conditioned dynamics to improve agent performance and visual detail.'
  - 'Key differences: Representation choices—diffusion over pixels vs. discrete latent
    states; evaluation protocols—open-loop video metrics vs. closed-loop agent scores;
    and action-space generality—single-domain (Atari) vs. multi-scenario (robotics,
    driving) control.'
  - 'Trend evolution: Since 2023, the field has moved from lightweight Atari world
    models (STORM) to diffusion-based visual world models (DIAMOND), and then to embodied,
    physics-informed, and multi-modal benchmarks (RoboScape, UWM, MIND) in 2025–2026,
    indicating a shift toward physically grounded, interactive evaluation.'
  - 'Open questions: Whether proxy metrics (e.g., SGCS, memory consistency scores)
    align with downstream task performance; how to design benchmarks that cover rare
    but safety-critical long-tail events; and the stability of conclusions across
    different compute budgets and implementations.'
  related_work_outline_zh:
  - 主流方向：设计超越视觉保真度的基准与指标，评估世界模型的一致性、可控性和长时域泛化，重点集中在驾驶、机器人和游戏环境。
  - 研究共性：用扩散或Transformer架构替代离散潜变量世界模型，同时将视频生成与动作条件动力学耦合，以提升智能体性能和视觉细节。
  - 关键差异：表示方式——像素级扩散 vs. 离散潜状态；评估协议——开环视频指标 vs. 闭环智能体得分；动作空间通用性——单一领域（Atari） vs. 多场景（机器人、驾驶）控制。
  - 趋势演进：自2023年起，从轻量级Atari世界模型（STORM）发展到基于扩散的视觉世界模型（DIAMOND），再到2025–2026年的具身、物理信息驱动和多模态基准（RoboScape、UWM、MIND），表明向物理耦合的交互式评估转变。
  - 开放问题：代理指标（如SGCS、记忆一致性分数）与下游任务性能是否一致；如何设计覆盖罕见但安全关键的长尾事件的基准；不同算力预算与实现下结论的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, e.g., LoopNav (Minecraft loop navigation) and MIND (open-domain
        memory/action control) provide standardized videos and action spaces for evaluating
        spatial and temporal consistency.
      what_remains_open: Whether the scene diversity and action distributions in these
        benchmarks cover the real-world settings (e.g., dynamic traffic, physical
        interactions) where world models are expected to operate; long-term memory
        stress beyond the provided clip lengths.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., Scene Graph Consistency Score (SGCS)
        for spatial invariance, and memory consistency/action control metrics in MIND.
      what_remains_open: Alignment between these proxy metrics and downstream task
        performance (e.g., policy success rate); lack of stress tests for physical
        plausibility, such as violations of object permanence or collision constraints.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common environments (Atari
        100k, NuScenes, CARL) and reporting conventions, enabling comparisons among
        STORM, DIAMOND, MaskGWM, and Dreamer variants.
      what_remains_open: Stability of benchmark rankings across different implementations
        and compute budgets; limited zero-shot evaluation across datasets (e.g., Waymo)
        is not yet standardized, and many methods lack reported limitations or failure
        modes.
    consensus:
    - 'Visual fidelity and detail matter for world-model performance: higher-quality
      image generation correlates with better agent behavior in Atari and driving
      tasks.'
    - Action-conditioned generation is essential for controllable world models; both
      discrete and continuous action spaces are being explored, with a trend toward
      multi-modal action control.
    - Standard benchmarks (Atari 100k, NuScenes) remain the primary comparison ground,
      but they do not capture spatial/temporal consistency or interactive memory,
      motivating new benchmarks like LoopNav and MIND.
    - Diffusion-based world models can outperform discrete latent-variable models
      in terms of visual quality and agent scores, as demonstrated by DIAMOND, MaskGWM,
      and UWM.
    disagreements:
    - 'Representation level: Diffusion over pixels (DIAMOND, MaskGWM) vs. latent state-space
      models (Dreamer3, STORM, cRSSM) – the former preserves visual details but is
      computationally heavy, the latter is sample-efficient but may lose fine-grained
      information.'
    - 'Evaluation protocol: Closed-loop agent rewards (DIAMOND, STORM) vs. open-loop
      video prediction metrics (FVD, PSNR) used in driving benchmarks – the former
      measures task utility, the latter measures generative quality, and they can
      lead to different model rankings.'
    - 'Action space design: Single, fixed action space (Atari discrete actions) vs.
      multi-action space generalization (MIND’s varied camera speeds, UWM’s multi-task
      robotic actions) – the latter introduces challenges in cross-action transfer
      that most current models do not address.'
    - 'Integration of physics: Explicit physics-informed training (RoboScape’s temporal
      depth and keypoint dynamics) vs. implicit physics learned from data (MaskGWM,
      STORM) – the trade-off between inductive bias and data-driven generality is
      unresolved.'
    open_questions:
    - How can we design benchmarks that evaluate long-term memory consistency over
      hundreds of time steps, and what are the failure modes of current models in
      such settings?
    - To what extent do proxy metrics (scene graph consistency, memory scores) correlate
      with downstream decision-making in embodied tasks, and can we create a unified
      evaluation protocol?
    - Can diffusion-based world models maintain sample efficiency and real-time constraints
      for online reinforcement learning, or will hybrid architectures be necessary?
    - How should benchmarks incorporate physical plausibility and safety constraints,
      especially for autonomous driving and robotics, where rare events are critical?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具备可比性，例如 LoopNav（Minecraft 循环导航）和 MIND（开放域记忆/动作控制）提供标准化视频和动作空间，用于评估空间和时间一致性。
      尚未覆盖: 这些基准中的场景多样性和动作分布是否覆盖世界模型预期发挥作用的真实设置（如动态交通、物理交互）；超出所提供片段长度的长期记忆压力测试。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数（SGCS）用于空间不变性，以及 MIND 中的记忆一致性和动作控制指标。
      尚未覆盖: 这些代理指标与下游任务性能（如策略成功率）之间的一致性；缺乏对物理合理性的压力测试，例如违反物体持久性或碰撞约束。
    - 路线: 可比基线与报告规范
      解决的问题: 通过公共环境（Atari 100k、NuScenes、CARL）和报告约定使结果可审计，支持 STORM、DIAMOND、MaskGWM
        和 Dreamer 变体之间的比较。
      尚未覆盖: 不同实现和算力预算下基准排名的稳定性；跨数据集的零样本评估（如 Waymo）尚未标准化，许多方法缺乏报告的局限性或失效模式。
    共识:
    - 视觉保真度和细节对世界模型性能至关重要：更高质量的图像生成与 Atari 和驾驶任务中更好的智能体行为相关。
    - 动作条件生成对于可控世界模型必不可少；离散和连续动作空间都在探索中，趋势是向多模态动作控制发展。
    - 标准基准（Atari 100k、NuScenes）仍是主要比较场，但它们无法捕捉空间/时间一致性或交互式记忆，这推动了 LoopNav 和 MIND 等新基准的出现。
    - 基于扩散的世界模型在视觉质量和智能体得分上可以超越离散潜变量模型，如 DIAMOND、MaskGWM 和 UWM 所示。
    分歧:
    - 表示层面：像素级扩散（DIAMOND、MaskGWM）与潜状态空间模型（Dreamer3、STORM、cRSSM）——前者保留视觉细节但计算量大，后者样本效率高但可能丢失细粒度信息。
    - 评估协议：闭环智能体奖励（DIAMOND、STORM）与驾驶基准中使用的开环视频预测指标（FVD、PSNR）——前者衡量任务效用，后者衡量生成质量，可能导致不同的模型排名。
    - 动作空间设计：单一固定动作空间（Atari 离散动作）与多动作空间泛化（MIND 的不同摄像机速度、UWM 的多任务机器人动作）——后者引入了大多数当前模型未解决的跨动作迁移挑战。
    - 物理集成：显式物理信息训练（RoboScape 的时间深度和关键点动力学）与从数据中学习的隐式物理（MaskGWM、STORM）——归纳偏置与数据驱动通用性之间的权衡尚未解决。
    开放问题:
    - 如何设计评估数百步长期记忆一致性的基准，以及当前模型在此类设置中的失效模式是什么？
    - 代理指标（场景图一致性、记忆分数）在多大程度上与具身任务中的下游决策相关，能否建立统一的评估协议？
    - 基于扩散的世界模型能否在在线强化学习中保持样本效率和实时性，还是需要混合架构？
    - 基准应如何纳入物理合理性和安全约束，特别是对于自动驾驶和机器人等罕见事件至关重要的领域？
