  related_work_outline:
  - 'Mainstream direction: World-model capability benchmarking is dominant, with datasets
    and metrics for spatial consistency, memory consistency, action control, and physics-informed
    prediction, while standardized control benchmarks remain in use.'
  - 'Shared research pattern: Papers introduce a dataset or adopt a shared suite,
    define a controllable or closed-loop evaluation criterion, compare model variants,
    and report benchmark-specific gains, often without complete limitation analysis.'
  - 'Key differences: They differ in representation, evaluation target, interaction
    mode, and metric focus: diffusion versus VAE/Transformer versus physics-informed
    models; Atari, driving, robot, or contextual RL settings; loop navigation, action
    control, or action-free video.'
  - 'Trend evolution: Evidence is concentrated in 2023-2026: older standardized RL
    and control evaluation persists, while newer work adds closed-loop, memory, spatial,
    and physical-plausibility stress tests for embodied and driving settings.'
  - 'Open questions: Whether consistency and visual-fidelity proxies align with downstream
    decisions, whether benchmarks cover deployment distributions, and whether conclusions
    remain stable without shared artifacts, leaderboards, or documented limitations.'
  related_work_outline_zh:
  - 主流方向：世界模型能力基准评测成为主流，围绕空间一致性、记忆一致性、动作控制和物理信息预测构建数据集与指标，同时继续使用标准化控制基准进行比较。
  - 研究共性：论文通常提出数据集或采用共享基准，定义可控或闭环评测准则，比较模型变体，并报告特定基准上的提升；局限分析常不完整。
  - 关键差异：差异集中在表示方式、评测目标、交互模式和指标重点：扩散、VAE/Transformer、物理信息模型并存；覆盖Atari、驾驶、机器人、上下文强化学习；交互包括循环导航、动作控制、无动作视频。
  - 趋势演进：证据集中在2023–2026年：早期标准化强化学习与控制评测延续，近期新增面向具身和驾驶的闭环、记忆、空间和物理合理性压力测试。
  - 开放问题：一致性指标与下游决策是否对齐、基准是否覆盖部署分布、在缺少共享工件、排行榜或局限性说明时结论是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Spatial and memory consistency benchmarks
      what_it_solves: Creates loop-navigation and multi-scene video benchmarks with
        consistency scores to compare world models on long-term spatial and memory
        behavior.
      what_remains_open: Scene-graph consistency may miss pixel or geometry details;
        domain coverage is limited to Minecraft and a small set of scenes, and no
        full community leaderboard evidence is shown.
    - line: Standardized visual control and reinforcement learning evaluation
      what_it_solves: Uses shared suites such as Atari 100k, CARL, Nuscenes, OpenDV-2K,
        and Waymo to produce comparable model-based control or visual prediction results.
      what_remains_open: Aggregate scores and benchmark-specific protocols leave long-horizon,
        zero-shot, cross-action, and cross-implementation stability under-tested.
    - line: Physics-informed and embodied evaluation
      what_it_solves: Probes physical plausibility and downstream policy or dynamics
        utility through RGB video generation, temporal depth, keypoint dynamics, and
        action-coupled robotics evaluation.
      what_remains_open: Visual fidelity and physical-plausibility judgments are not
        yet shown to align with real robotic task success or consistent physical metrics.
    - line: Contextual generalization stress tests
      what_it_solves: Tests zero-shot generalization to unseen contexts or action
        spaces by varying observable context values and task dynamics.
      what_remains_open: Current stress tests often assume observable context and
        use few CARL tasks; broader unknown dynamics and larger action-space transfers
        remain unverified.
    consensus:
    - Action-conditioned generation and closed-loop or loop-based evaluation are increasingly
      treated as core capabilities for world models.
    - Single aggregate visual or reward metrics are seen as insufficient; consistency,
      controllability, generalization, and physical plausibility are emphasized.
    - Shared benchmarks improve comparability, but most reported gains are benchmark-specific
      and do not establish deployment robustness.
    - Read-first scores, citation impact, and tag-based popularity are separated from
      methodology; several top entries have empty limitation fields or missing OpenAlex/citation
      signals, creating verification gaps.
    disagreements:
    - 'Representation: diffusion transformers and diffusion-based generators versus
      VAE/Transformer recurrent state-space models versus physics-informed joint RGB-depth-keypoint
      models.'
    - 'Evaluation target: Atari control return versus driving long-horizon and multi-view
      prediction versus embodied robot visual quality versus zero-shot context generalization.'
    - 'Interaction mode: closed-loop revisited action control, loop-based navigation,
      action-free video pretraining, or environment-specific action spaces.'
    - 'Metric focus: human-normalized scores and visual fidelity versus scene-graph
      spatial consistency versus memory and action control versus physical plausibility.'
    - 'Deployment setting: simulated Atari, Minecraft, and CARL environments versus
      real-world driving and robot scenarios.'
    open_questions:
    - Can the new spatial-consistency and action-control probes cover the real deployment
      distributions where world models are expected to help?
    - Do proxy scores such as scene-graph consistency, visual fidelity, and human-normalized
      return align with downstream driving or robot decisions?
    - Are benchmark conclusions stable across implementations, compute budgets, and
      missing artifact links when several top papers lack documented limitations?
    - How well do memory and action-control evaluations transfer across viewpoints,
      action spaces, and unseen physical contexts beyond the limited CARL tasks?
    - What shared leaderboard and reporting conventions are needed to close the gap
      between benchmark construction and auditable model comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 空间与记忆一致性基准
      解决的问题: 通过循环导航和多场景视频基准，评估世界模型在长时空间与记忆一致性上的表现。
      尚未覆盖: 场景图一致性可能忽略像素或几何细节；领域覆盖限于Minecraft和少量场景，且缺少完整社区排行榜证据。
    - 路线: 标准视觉控制与强化学习评测
      解决的问题: 利用Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo等共享测试比较模型控制或视觉预测能力。
      尚未覆盖: 聚合分数和特定基准协议尚不足以检验长时域、零样本、跨动作与跨实现稳定性。
    - 路线: 物理信息与具身评测
      解决的问题: 通过RGB视频生成、时间深度、关键点动力学和动作耦合机器人评估来检验物理合理性和下游策略效用。
      尚未覆盖: 视觉保真和物理合理性与真实机器人任务成功率或稳定物理指标的一致性尚未建立。
    - 路线: 上下文泛化压力测试
      解决的问题: 通过改变可观测上下文和任务动力学，检验零样本与跨上下文的泛化能力。
      尚未覆盖: 现有压力测试多假设上下文可观测且仅覆盖少量CARL任务，更广未知动力学和动作空间迁移未验证。
    共识:
    - 行动条件生成和闭环或循环式评估逐渐被视为世界模型的核心能力。
    - 单一聚合视觉或奖励指标不够，需同时检验一致性、可控性、泛化性和物理合理性。
    - 共享基准提高可比性，但多数收益是基准特定结果，未证明部署鲁棒性。
    - 阅读优先分数、引用影响和标签热度与方法学证据分离；部分论文局限字段为空或缺少OpenAlex信号，存在验证缺口。
    分歧:
    - 表示方式：扩散Transformer和扩散生成器、VAE/Transformer循环状态空间、物理信息联合RGB-深度-关键点模型并存。
