  related_work_outline:
  - 'Mainstream direction: The evidence concentrates on controllable generative video
    and future-state prediction used as world simulators, with surveys and taxonomies
    organizing progress across robotics, driving, and interactive media.'
  - 'Shared research pattern: Most papers either decompose dynamics into explicit
    primitives, latent states, or conditioning signals, or synthesize a design space
    around those choices; they pair modeling claims with datasets, benchmarks, or
    evaluation frameworks.'
  - 'Key differences: Primary studies differ in control interface, memory mechanism,
    and deployment target; surveys differ in scope and organizing dimensions; evaluation
    settings range from simulated video plans to physical robot learning and unimplemented
    metric suites.'
  - 'Trend evolution: From 2022 physical-robot online learning, the sample shifts
    to compositional, multimodal, and survey consolidation by 2024-2025, then to persistent
    out-of-sight dynamics, open-source real-time simulators, and application-specific
    taxonomies by 2026.'
  - 'Open questions: The packet lacks systematic cross-benchmark compatibility, real-world
    validation, limits for novel primitives, and empirical verification of proposed
    taxonomies and evaluation frameworks.'
  related_work_outline_zh:
  - 主流方向：证据集中在可控生成式视频与未来状态预测作为世界模拟器，综述和分类体系则组织机器人、驾驶和交互媒体方向的进展。
  - 研究共性：多数工作或将动态分解为显式原语、潜在状态或条件信号，或围绕这些选择综合设计空间，并将建模声明与数据集、基准或评估框架配对。
  - 关键差异：实证研究在控制接口、记忆机制和部署目标上不同；综述在范围和组织维度上不同；评估设置从仿真视频计划到物理机器人学习，再到未实施的指标套件。
  - 趋势演进：样本从2022年物理机器人在线学习，到2024-2025年组合、多模态和综述整合，再到2026年持久视线外动态、开源实时模拟器和应用特定分类法。
  - 开放问题：缺乏跨基准兼容性、真实世界验证、新原语限制以及所提分类法与评估框架的实证检验。
  literature_review:
    line_of_work_matrix:
    - line: Generative simulation construction
      what_it_solves: Builds controllable video or future-frame predictors by conditioning
        on language, actions, ego-motion, human pose, or persistent scene state, enabling
        robot imagination, ego-vision prediction, and interactive simulation.
      what_remains_open: Most evidence reports simulation or limited real-robot results;
        novel primitive composition, persistent out-of-sight dynamics, and reproducible
        real-time claims need stronger verification.
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented generative simulation research into design
        spaces, application scenarios, modalities, internal mechanics, challenges,
        and milestones.
      what_remains_open: The taxonomies are conceptual and may miss recent work; inclusion
        criteria and empirical support are not consistently documented.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes benchmarks and metrics across open-world exploration,
        game engines, autonomous driving, and robotics; exposes gaps such as open-loop
        versus closed-loop mismatch.
      what_remains_open: Compared results are often not shown to be compatible across
        settings, and proposed closed-loop or resource-aware metrics lack implemented
        validation.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete next research
        questions such as real-time action following, long-horizon memory, and open-source
        availability.
      what_remains_open: Which gaps matter most for progress remains unranked, and
        many works omit explicit limitations or cost constraints.
    consensus:
    - The literature agrees that generative future prediction should be controllable
      and must maintain temporal consistency over longer horizons.
    - Several works agree that simulation and evaluation infrastructure is as important
      as the generative model itself, leading to benchmarks, metrics, or evaluation
      frameworks.
    - There is a common distinction between modeling choices and deployment requirements,
      especially around real-time interactivity and memory.
    disagreements:
    - 'Works differ in control interface and supervision: language-factored primitives,
      ego-motion and human-pose conditioning, persistent global-state monitoring,
      or reward-driven physical-robot learning.'
    - 'Surveys differ in organizational scope: one emphasizes a single high-profile
      generator''s capabilities, another foregrounds interactive challenges and benchmarks,
      and another structures driving-specific latent representations and inference-cost
      tradeoffs.'
    - 'Evaluation settings differ: simulated video planning, out-of-sight benchmark
      evaluation, real-robot sparse-reward learning, ego-vision dataset metrics, and
      conceptual driving metrics without implementation.'
    open_questions:
    - Can compositional video generation extrapolate to entirely new primitives beyond
      combinations observed in training?
    - Are the proposed taxonomies and evaluation frameworks sufficiently systematic
      and reproducible when applied to recent, fast-moving literature?
    - How can out-of-sight, long-horizon, and real-time interactive claims be benchmarked
      in a comparable and closed-loop way?
    - What real-robot and resource-cost evidence is needed to move world-model simulators
      from simulation to dependable deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式模拟构建
      解决的问题: 通过语言、动作、自我运动、人体姿态或持久场景状态条件构建可控视频或未来帧预测器，支持机器人想象、自我视觉预测和交互模拟。
      尚未覆盖: 多数证据报告仿真或有限真实机器人结果；新原语组合、持久视线外动态和可复现的实时声明仍需更强验证。
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的生成式模拟研究组织为设计空间、应用场景、模态、内部机制、挑战和里程碑。
      尚未覆盖: 分类体系多为概念性，可能遗漏近期工作；纳入标准和实证支持未一致记录。
    - 路线: 对比评测综合
      解决的问题: 总结开放世界探索、游戏引擎、自动驾驶和机器人中的基准与指标，暴露开环与闭环不匹配等缺口。
      尚未覆盖: 被比较的结果未证明跨设置兼容，所提闭环或资源感知指标缺乏实现验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体下一步研究问题，例如实时动作跟随、长时记忆和开源可用性。
      尚未覆盖: 哪些缺口最值得优先解决尚未排序，许多工作省略明确限制或成本约束。
    共识:
    - 文献一致认为生成式未来预测应当可控，并需在更长时间跨度上保持时间一致性。
    - 多项工作认为仿真与评估基础设施与生成模型本身同样重要，因此引入基准、指标或评估框架。
    - 研究普遍区分建模选择与部署要求，尤其关注实时交互性和记忆机制。
    分歧:
    - 工作控制接口与监督信号不同：语言分解原语、自我运动和人体姿态条件、持久全局状态监控，或奖励驱动的物理机器人学习。
    - 综述组织范围不同：一种强调单一高关注度生成器的能力，一种侧重交互挑战与基准，另一种围绕驾驶场景的潜在表示和推理成本组织。
    - 评估设置不同：仿真视频规划、视线外基准评测、真实机器人稀疏奖励学习、自我视觉数据集指标，以及未实施的概念性驾驶指标。
    开放问题:
    - 组合式视频生成能否泛化到训练组合之外的全新原语？
    - 所提分类体系和评估框架在应用于快速更新的近期文献时是否足够系统且可复现？
    - 如何以可比较和闭环方式基准化视线外、长时程和实时交互声明？
    - 需要哪些真实机器人和资源成本证据，才能使世界模型模拟器从仿真走向可靠部署？
