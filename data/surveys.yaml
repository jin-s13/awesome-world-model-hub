  related_work_outline:
  - 'Mainstream direction: World-model work is converging on evaluation beyond visual
    realism, probing spatial/memory consistency, action control, long-horizon prediction,
    and downstream decision utility in driving, robotics, gaming, and open-world settings.'
  - 'Shared research pattern: Studies couple generative world-model training with
    targeted benchmarks, datasets, or stress tests; LoopNav and MIND exemplify diagnostic
    benchmark construction, while model papers use Atari 100k, CARL, driving datasets,
    or robotic video data as transfer evidence.'
  - 'Key differences: One line explicitly constructs datasets and metrics for world-model
    capabilities; another improves architectures and uses benchmark scores as validation.
    Evaluation settings, supervision assumptions, action availability, and physics/context
    conditioning also differ across proofs.'
  - 'Trend evolution: The visible 2023-2026 frontier moves from Atari 100k model-based
    RL scoring and contextual RL evaluation toward specialized 2025-2026 benchmarks
    and driving/robotics settings that stress memory, closed-loop revisiting, cross-action
    generalization, and long-horizon consistency.'
  - 'Open questions: Whether proxy metrics predict downstream policy reliability,
    whether task distributions cover real deployment settings, whether benchmark conclusions
    remain stable across implementations/compute, and whether missing artifact or
    limitation details create verification gaps.'
  related_work_outline_zh:
  - 主流方向：世界模型研究正超越视觉真实感，转向检验空间/记忆一致性、动作控制、长时域预测，以及驾驶、机器人、游戏和开放世界中的下游决策效用。
  - 研究共性：研究将生成式世界模型训练与特定基准、数据集或压力测试结合；LoopNav 与 MIND 是诊断基准构建的典型，模型论文则常以 Atari 100k、CARL、驾驶数据集或机器人视频数据作为迁移证据。
  - 关键差异：一类显式构建数据集与指标来测世界模型能力；另一类改善架构并以基准分数作为验证。评测场景、监督假设、动作是否可用、物理/上下文条件也存在不同。
  - 趋势演进：可见的2023-2026前沿从 Atari 100k 模型式强化学习评分与上下文强化学习评测，走向2025-2026专门基准及驾驶/机器人场景，强调记忆、闭环重访、跨动作泛化与长时域一致性。
  - 开放问题：代理指标是否预测下游策略可靠性；任务分布是否覆盖真实部署场景；基准结论在不同实现和算力下是否稳定；缺失工件或局限性细节是否构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared visual-action tasks that expose world-model memory,
        loop closure, spatial structure, and cross-scene/cross-action generalization;
        LoopNav and MIND are examples of loop-based or revisited video suites.
      what_remains_open: Coverage of deployment-scale variation beyond Minecraft-style
        navigation or curated scenes; real-world transfer and broader environment
        diversity remain unproven.
    - line: Metric and stress-test design
      what_it_solves: Replaces aggregate generation scores with targeted diagnostics
        such as Scene Graph Consistency Score and memory/action-control tests that
        isolate spatial consistency and controllability.
      what_remains_open: Alignment with downstream policy quality is not established;
        pixel-invariant or scene-specific metrics may miss decision-relevant failures
        and need calibration across viewpoints, actions, and horizons.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared benchmarks such as Atari 100k, CARL, Nuscenes/OpenDV-2K/Waymo,
        and robot video pretraining protocols to compare architecture, context, and
        training choices under standard scores.
      what_remains_open: Reported gains depend on limited tasks and benchmark settings;
        reproducibility is uneven, with missing code, datasets, limitations, or artifact
        details and unknown sensitivity to implementation or compute.
    consensus:
    - 'World models are judged on more than frame realism: spatial consistency, memory,
      action control, long-horizon rollout, zero-shot transfer, and downstream policy/task
      utility appear as complementary evidence.'
    - Diagnostic datasets, metrics, and model improvements are tightly coupled; targeted
      benchmarks are used to validate architectural choices rather than only ranking
      final models.
    - Evaluation settings recur across high-sample-efficiency RL, contextual control,
      driving, robotic video-action, and open-world navigation benchmarks.
    - Geometry, physics, or loop-closure structures are introduced to strengthen or
      measure realism beyond pixel-level generation.
    disagreements:
    - 'Representation: discrete latent world models, diffusion-based generation, physics-informed
      keypoint/depth modules, and contextual recurrent state-space models are validated
      under different assumptions.'
    - 'Supervision: some methods require action labels and observable context; others
      learn from action-free video, mask reconstruction, or physics-related signals.'
    - 'Evaluation target: benchmark construction evaluates model limitations directly,
      while other work targets downstream policy performance, robot video physical
      plausibility, or driving long-horizon/zero-shot rollout.'
    - 'Interaction mode: closed-loop revisited navigation and action rollout differ
      from open-loop next-frame prediction, imagined-policy training, and large-scale
      multimodal pretraining.'
    - 'Deployment setting: game/control tasks, driving, robotic manipulation, and
      open-world navigation impose different distributional assumptions and generalization
      requirements.'
    open_questions:
    - Do diagnostic metrics such as scene-graph consistency, memory consistency, and
      action control correlate with downstream policy robustness under unseen dynamics?
    - Are current benchmarks diverse enough to cover real deployment conditions for
      driving, robotics, and open-world interaction?
    - Can benchmark conclusions be replicated when code, datasets, and limitation
      details are incomplete, and do they remain stable across implementation and
      compute changes?
    - How should world-model evaluation handle partially observable context, missing
      action labels, and long-horizon memory simultaneously?
    - What failure modes relevant to decision-making are hidden by aggregate benchmark
      scores?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享视觉-动作任务，暴露世界模型在记忆、闭环重访、空间结构以及跨场景/跨动作泛化上的能力；LoopNav 与 MIND 分别提供循环导航和重访视频评测。
      尚未覆盖: 场景是否覆盖真实部署规模的变化仍未证明；Minecraft 式导航或精选场景之外的多样性、现实世界迁移仍缺乏证据。
    - 路线: 指标与压力测试设计
      解决的问题: 用针对性诊断指标替代单一生成分数，例如场景图一致性分数和记忆/动作控制测试，以隔离空间一致性与可控性。
      尚未覆盖: 这些指标与下游策略质量的对应关系尚未建立；对像素变化不变的指标可能忽略与决策相关的失败模式，也需在视角、动作和时域上校准。
    - 路线: 可比基线与报告规范
      解决的问题: 利用 Atari 100k、CARL、Nuscenes/OpenDV-2K/Waymo、机器人视频预训练等共享基准，在统一分数下比较架构、上下文和训练选择。
      尚未覆盖: 结论依赖有限任务和基准设置；代码、数据集、局限性或工件细节缺失使可复现性不一，对实现或算力的敏感性尚不清楚。
    共识:
    - 世界模型不能只以视觉真实感评估；空间一致性、记忆、动作控制、长时域展开、零样本迁移和下游策略/任务效用都被作为互补证据。
    - 诊断性数据集、指标与模型改进相互耦合：为揭示模型局限而设计的数据和度量，常被用来验证架构选择。
    - 评估场景集中出现于高样本效率强化学习、上下文控制、自动驾驶、机器人视频-动作和开放世界导航等共享基准。
    - 几何、物理或闭环结构被引入，以测量或增强像素级生成之外的真实性和闭环稳定性。
    分歧:
    - 表示方式：离散潜变量、扩散生成、物理信息关键点/深度、上下文循环状态空间等不同世界模型表示被分别验证。
    - 监督信号：有的依赖动作标签与可观测上下文；有的利用无动作视频、掩码重建或物理相关监督。
    - 评测目标：有的侧重于基准构建并直接检验模型局限，有的关注下游策略性能、机器人视频物理合理性或驾驶长时域/零样本 rollout。
    - 交互模式：闭环重访导航与动作 rollout 不同于开环下一帧预测、在想象动态中训练策略及大规模多模态预训练。
