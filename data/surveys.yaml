  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    or Transformer/VAE hybrids, applied to driving and robot video prediction, with
    action conditioning and auxiliary reconstruction or physics objectives.'
  - 'Shared research pattern: Learn future visual states or latent dynamics from interaction
    or video data, then use the learned model for policy training, evaluation, or
    closed-loop consistency testing.'
  - 'Key differences: Representation choices include stochastic state-space, Transformer,
    or diffusion; conditioning includes language, context variables, actions, or multimodal
    goals; evaluation targets downstream control, visual fidelity, or consistency
    benchmarks.'
  - 'Trend evolution: From efficient recurrent/Transformer RL world models in 2023-2024
    toward 2025-2026 diffusion-based, physics-informed, memory-consistency-oriented,
    and benchmarked embodied/driving world models.'
  - 'Open questions: Long-horizon memory and spatial consistency, generalization across
    unseen contexts/action spaces, and evidence separation of model contributions
    from planners and datasets remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer或Transformer/VAE混合的生成式世界模型，用于驾驶和机器人视频预测，并加入动作条件与辅助重建或物理目标。
  - 研究共性：从交互或视频数据学习未来视觉状态或潜在动力学，再将模型用于策略训练、评测或闭环一致性测试。
  - 关键差异：表示选择包括随机状态空间、Transformer或扩散；条件信号包括语言、上下文变量、动作或多模态目标；评测以下游控制、视觉保真度或一致性基准为主。
  - 趋势演进：从2023-2024年高效循环/Transformer强化学习世界模型，演进到2025-2026年扩散、物理信息、记忆一致性和面向评测的具身/驾驶世界模型。
  - 开放问题：长时域记忆与空间一致性、跨未见上下文/动作空间泛化，以及将模型贡献与规划器/数据集作用分离，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Generative representation and objective design
      what_it_solves: 'Turns world-model learning into concrete architectures and
        losses: diffusion transformers, mask reconstruction, VAE-transformer hybrids,
        physics/keypoint auxiliary tasks, and language-compositional video generation.'
      what_remains_open: Transfer beyond driving, robot, and Atari task families;
        limitations are often unreported; and whether fidelity gains require task-specific
        priors or scale remains unclear.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to control by coupling actions and
        video diffusion, conditioning latent dynamics on context, or generating video
        plans from language primitives.
      what_remains_open: Contribution of model versus planner/controller is not isolated;
        context observability and seen-primitive coverage are assumptions; cross-action-space
        generalization is underevidenced.
    - line: Evaluation and ablation protocol
      what_it_solves: Provides consistency, memory, and action-control benchmarks
        using loop navigation, scene-graph consistency, and revisited video-action
        settings to probe world-model capabilities beyond pixel fidelity.
      what_remains_open: Some benchmark papers report construction without experimental
        baselines; robustness to metric design, baseline choice, and dataset domain
        remains a verification gap.
    consensus:
    - World models are often trained self-supervised on visual observations to predict
      future frames, latent states, or video conditioned on actions.
    - Action conditioning or action-coupled prediction is treated as necessary for
      downstream control and robust policy learning.
    - Auxiliary signals such as mask reconstruction, depth, keypoints, or consistency
      metrics are used to improve physical and spatial plausibility.
    - Recent evaluations emphasize generalization beyond training scenes, including
      zero-shot driving views, unseen context, new composition, or loop navigation
      consistency.
    disagreements:
    - 'Representation differs: recurrent state-space, Transformer, and diffusion models
      impose different stochasticity and sequence assumptions.'
    - 'Supervision differs: MAE-style masks, language primitives, context variables,
      action diffusion, and physics-informed depth/keypoints encode different inductive
      biases.'
    - 'Evaluation target differs: human-normalized game score on Atari, contextual
      RL zero-shot, robot video/simulation success, driving multi-view prediction,
      and closed-loop memory/consistency.'
    - 'Interaction mode differs: imagined rollouts for policy training, goal-conditioned
      video generation, and unified video-action diffusion with independent timesteps.'
    - Deployment setting spans driving, Atari, contextual control, and robot manipulation,
      so failure boundaries may not transfer.
    open_questions:
    - Does improved video fidelity and physical plausibility consistently improve
      policy learning or real-world robot execution?
    - How can world models maintain long-term memory and spatial consistency while
      generalizing to unseen views, dynamics, or action spaces?
    - 'Which assumptions can be relaxed: observable context, predefined language primitives,
      shared action spaces, and narrow benchmark domains?'
    - Are reported gains due to the world model itself rather than planner, controller,
      dataset, or metric choices; current ablations often leave this unresolved.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式表示与目标设计
      解决的问题: 将世界模型学习落实为具体架构和损失：扩散Transformer、掩码重建、VAE-Transformer混合、物理/关键点辅助任务，以及基于语言原语的组合视频生成。
      尚未覆盖: 向驾驶、机器人、Atari任务族之外的迁移；局限性常未报告；保真度提升是否依赖任务先验或规模仍不明确。
    - 路线: 规划与动作接口方法
      解决的问题: 通过动作与视频扩散耦合、基于上下文条件潜在动力学，或从语言原语生成视频计划，把学习到的动力学连接到控制。
      尚未覆盖: 模型与规划器/控制器的贡献未隔离；上下文可观测和被见原语覆盖是假设；跨动作空间泛化证据不足。
    - 路线: 评测与消融协议
      解决的问题: 用循环导航、场景图一致性和回访视频-动作设置，提供一致性、记忆与动作控制基准，探测像素保真度之外的世界模型能力。
      尚未覆盖: 部分基准论文只报告构建而无实验基线；指标设计、基线选择和数据集域上的稳健性仍是验证缺口。
    共识:
    - 世界模型通常以自监督方式在视觉观察上训练，以动作或目标为条件预测未来帧、潜在状态或视频。
    - 动作条件或动作耦合预测被视为实现下游控制和鲁棒策略学习的必要条件。
    - 掩码重建、深度、关键点或一致性度量等辅助信号被用来提升物理和空间合理性。
    - 近期评测强调超越训练场景的泛化，包括零样本驾驶视角、未见上下文、新组合和循环导航一致性。
    分歧:
    - 表示方式不同：循环状态空间、Transformer和扩散模型对随机性和序列建模有不同假设。
    - 监督信号不同：MAE式掩码、语言原语、上下文变量、动作扩散以及物理信息深度/关键点编码不同归纳偏置。
    - 评测目标不同：Atari人类标准化得分、上下文RL零样本、机器人视频/仿真成功、驾驶多视图预测和闭环记忆一致性。
    - 交互模式不同：用于策略训练的想象轨迹、目标条件视频生成，以及具有独立时间步的统一视频-动作扩散。
    - 部署场景覆盖驾驶、Atari、上下文控制和机器人操作，因此失败边界可能无法迁移。
    开放问题:
    - 视频保真度和物理合理性的提升是否能稳定改善策略学习或真实机器人执行？
    - 世界模型如何在维持长期记忆和空间一致性的同时，泛化到未见视角、动力学或动作空间？
    - 哪些假设可以被放宽：可观测上下文、预定义语言原语、共享动作空间和窄基准域？
    - 报告增益是否来源于世界模型本身，而非规划器、控制器、数据集或指标选择；当前消融通常未能清晰地分离这些因素。
