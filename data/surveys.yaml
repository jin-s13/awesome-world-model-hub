  related_work_outline_zh:
  - 主流方向：构建可控、高保真的世界模型系统，作为自动驾驶、机器人和游戏环境的模拟器，重点关注动作条件视频生成与空间一致性。
  - 研究共性：在领域特定数据集上预训练或微调生成模型，注入控制信号（动作、轨迹、上下文），并通过设计的基准评测保真度、一致性和可控性。
  - 关键差异：系统在底层生成架构（扩散、自回归、Dreamer式）、控制机制（结构化、潜在、物理信息）和评测目标（动作忠实度、空间一致性、零样本泛化、视觉质量）上存在差异。
  - 趋势演进：2024–2026 年论文显示，从静态世界模型转向交互式闭环模拟器，越来越关注真实物理、长时域一致性和轻量部署，交互式视频世界建模综述也印证了这一趋势。
  - 开放问题：如何保证闭环推演下的长时域时序与跨视图一致性；物理信息设计是否真正改善下游决策；如何在不重新训练的前提下适应新领域；如何在有限算力下实现实时性能并保持控制保真度。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning model concepts into end-to-end workflows that cover
        data, training, inference, and evaluation for world simulators, as seen in
        systems like FAR-Drive (closed-loop autonomous driving), Terra ACT-Bench (action
        fidelity evaluation), and LoopNav (spatial consistency benchmark).
      what_remains_open: Robustness to external deployment, hardware changes, and
        unseen user settings remains unverified; most evaluations are limited to controlled
        benchmarks like nuScenes or Minecraft, and long-horizon stability under distribution
        shift is rarely tested.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        use, for example, FAR-Drive achieves sub-second latency on a single GPU, and
        DWS enables prioritized imagination for model-based RL.
      what_remains_open: Trade-offs between speed, fidelity, controllability, and
        system complexity are not systematically studied; real-time performance is
        demonstrated on a single GPU but not under resource-constrained or multi-agent
        scenarios, and the effect of reduced latency on policy learning is not quantified.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making systems inspectable and reusable through code, datasets,
        and benchmarks, e.g., LoopNav, ACT-Bench, and Vista provide open-source code
        and data to enable replication.
      what_remains_open: Independent reproduction across different teams, datasets,
        and infrastructure environments is still missing; several papers lack code
        or detail training recipes, and the reliance on specific sensor configurations
        (e.g., nuScenes multi-camera) limits reusability in other settings.
    consensus:
    - World models are treated as simulators that should generate future frames conditioned
      on actions or context, with evaluation focusing on fidelity, consistency, and
      controllability rather than just visual quality.
    - Standard benchmarks and datasets (nuScenes, CARL, Minecraft) are used to compare
      systems, and open-source release of code and data is becoming a common practice
      to support reproducibility.
    - Action-conditioned video generation is the dominant paradigm, with control signals
      ranging from high-level commands to low-level trajectories, and the community
      is moving toward closed-loop simulation where the model's output feeds back
      into the control loop.
    disagreements:
    - 'Generative backbones vary: diffusion transformers (Vista, FAR-Drive) vs. autoregressive
      transformers (DWS) vs. Dreamer-style recurrent state-space models (cRSSM), each
      with different assumptions about temporal modeling and training stability.'
    - 'Control integration differs: some inject structured physical priors (RoboScape
      uses depth and keypoints), others rely on latent context (cRSSM) or lightweight
      action-conditioned modules (DWS), leading to trade-offs between physical plausibility
      and flexibility.'
    - 'Evaluation targets are not unified: LoopNav emphasizes spatial consistency,
      ACT-Bench action fidelity, Vista visual quality, and cRSSM zero-shot generalization,
      making it hard to compare systems across papers without a standardized metric
      suite.'
    open_questions:
    - What evidence shows that improved spatial consistency or action fidelity in
      a world model leads to better policy performance in downstream tasks, beyond
      the reported surrogate metrics?
    - How do these systems behave when deployed in real-world settings with noisy
      sensors, missing observations, and dynamic environments, given that all current
      evaluations are on curated datasets?
    - Can the lightweight control modules proposed in DWS be scaled to complex, multi-agent
      scenarios without losing dynamic consistency, and what are the minimal data
      requirements for such adaptation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型概念转化为覆盖数据、训练、推理和评测的端到端工作流，例如FAR-Drive（闭环自动驾驶）、Terra ACT-Bench（动作忠实度评估）和LoopNav（空间一致性基准）。
      尚未覆盖: 对外部部署、硬件变化和未见用户设置的鲁棒性未经验证；大多数评估局限于nuScenes或Minecraft等受控基准，分布偏移下的长时域稳定性很少被测试。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟和交互性要求，例如FAR-Drive在单GPU上实现亚秒级延迟，DWS为基于模型的RL提供优先想象。
      尚未覆盖: 速度、保真度、可控性和系统复杂度之间的权衡未被系统研究；实时性能仅在单GPU上验证，未涉及资源受限或多智能体场景，且延迟降低对策略学习的影响未量化。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、数据集和基准使系统可检查、可复用，例如LoopNav、ACT-Bench和Vista提供开源代码和数据以支持复现。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现仍然缺失；若干论文未提供代码或详细训练配方，且对特定传感器配置（如nuScenes多相机）的依赖限制了在其他场景的复用性。
    共识:
    - 世界模型被视为模拟器，应根据动作或上下文生成未来帧，评估重点在于保真度、一致性和可控性，而非仅视觉质量。
    - 标准基准和数据集（nuScenes、CARL、Minecraft）被用于系统比较，代码和数据的开源发布正成为支持可复现性的常见做法。
    - 动作条件视频生成是主流范式，控制信号从高层指令到低层轨迹，社区正朝着闭环模拟发展，模型输出反馈回控制回路。
    分歧:
    - 生成架构不同：扩散Transformer（Vista、FAR-Drive） vs. 自回归Transformer（DWS） vs. Dreamer式循环状态空间模型（cRSSM），各自对时间建模和训练稳定性有不同假设。
    - 控制集成方式不同：有的注入结构化物理先验（RoboScape使用深度和关键点），有的依赖潜在上下文（cRSSM）或轻量级动作条件模块（DWS），导致物理合理性与灵活性之间的权衡。
    - 评测目标不统一：LoopNav强调空间一致性，ACT-Bench动作忠实度，Vista视觉质量，cRSSM零样本泛化，缺乏标准化指标套件使得跨论文系统比较困难。
    开放问题:
    - 哪些证据表明世界模型中改进的空间一致性或动作忠实度能提升下游任务策略性能，而不仅仅是报告替代指标？
    - 这些系统在真实世界部署中，面对噪声传感器、缺失观测和动态环境时表现如何？当前所有评估均基于精选数据集。
    - DWS中提出的轻量控制模块能否扩展到复杂多智能体场景而不失动态一致性，这种适应所需的最小数据量是多少？
