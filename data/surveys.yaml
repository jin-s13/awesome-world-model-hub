  related_work_outline:
  - 'Mainstream direction: The center of gravity is generative video world models
    built from diffusion Transformers or stochastic sequence models, trained on visual-dynamics
    prediction and conditioned on actions, language, or context; applications concentrate
    on driving, robot manipulation, and embodied video generation.'
  - 'Shared research pattern: Methods couple a learned latent or video dynamics model
    with one or more auxiliary tasks—mask reconstruction, depth or keypoint prediction,
    action diffusion, or context conditioning—to improve long-horizon coherence, zero-shot
    generalization, or actionable prediction.'
  - 'Key differences: Papers split between task-specific embodied and driving video
    generators, model-based RL stochastic world models, unified policy-dynamics models,
    and benchmark-only evaluations; they differ in whether control is modeled jointly,
    whether context is observable, and whether evaluation targets visual quality,
    policy generalization, or memory consistency.'
  - 'Trend evolution: Evidence is concentrated in 2023-2026, so the visible trend
    is within the current frontier: from Dreamer-style recurrent state-space models
    toward scalable diffusion/Transformer generative architectures, and from single-scene
    visual prediction toward open-domain, memory- and action-aware evaluation.'
  - 'Open questions: Transfer of architectural choices beyond reported tasks, attribution
    of gains between model and planner or controller, coverage and realism of new
    consistency benchmarks, and the degree to which unobserved physical or semantic
    constraints are actually learned remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或随机序列模型为核心的生成式视频世界模型，预测视觉动力学，并大多以动作、语言或上下文为条件；应用集中于驾驶、机器人操作和具身视频生成。
  - 研究共性：将潜在或视频动力学模型与掩码重建、深度/关键点预测、动作扩散或上下文条件等辅助任务联合，改善长时域一致性、零样本泛化或可执行预测。
  - 关键差异：方法分为任务专用具身/驾驶视频生成、基于模型的强化学习随机世界模型、统一策略-动力学模型以及纯基准评测；差异在于是否联合建模动作、上下文是否可观测，以及评测目标是视觉质量、策略泛化还是记忆一致性。
  - 趋势演进：证据集中在2023—2026年，因此可见趋势属于当前前沿：从Dreamer式循环状态空间模型走向可扩展的扩散/Transformer架构，并从单一场景预测走向开放域、记忆与动作感知评测。
  - 开放问题：架构选择能否跨任务迁移、模型与规划/控制器之间的收益归因、新一致性基准的覆盖与真实性，以及未观测物理/语义约束是否真正被学习，仍是证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative video dynamics with auxiliary objectives
      what_it_solves: Turns world-model training into controllable video prediction
        and stabilizes long-horizon generation through mask reconstruction, depth
        prediction, keypoint dynamics, or physics-informed auxiliary tasks.
      what_remains_open: Which auxiliary objectives and supervision signals transfer
        beyond the reported driving, robot, or simulation domains without fitting
        domain-specific appearance and scene priors.
    - line: Stochastic and state-space world models for model-based RL
      what_it_solves: Sample-efficient policy learning through imagined rollouts and
        context-conditioned latent dynamics, improving zero-shot generalization when
        dynamics vary.
      what_remains_open: Assumes observable context values and evaluates on a small
        set of tasks; the separation between model quality and downstream policy gains
        remains unclear.
    - line: Unified action-video diffusion dynamics and planning interfaces
      what_it_solves: Represents policy, forward dynamics, inverse dynamics, and video
        generation in one model, enabling robot pretraining and planning from action-free
        or action-paired video.
      what_remains_open: Whether gains come from unified modeling or from large-scale
        pretraining data, and whether action consistency holds over long closed-loop
        rollouts.
    - line: Spatial, memory, and action-control consistency benchmarks
      what_it_solves: Evaluates world models beyond short-range visual fidelity by
        measuring spatial consistency, long-term memory, and action control in open-domain
        settings.
      what_remains_open: Benchmark coverage is new and lacks mature baseline results
        across many world-model families; metric sensitivity to pixel variation and
        domain gap is not yet established.
    consensus:
    - World-model training is increasingly formulated as self-supervised visual dynamics
      prediction, often in latent or pixel space, with auxiliary losses to stabilize
      long-horizon generation.
    - Action or language conditioning is used to turn predictive dynamics into executable
      policies or task-specific rollouts, making the action interface central to downstream
      utility.
    - Recent methods rely on scalable sequence models—diffusion Transformers, recurrent
      state-space models, or VAEs—rather than single-step forward predictors.
    - Evaluation is moving beyond short-range visual fidelity toward spatial consistency,
      memory consistency, and action-control metrics.
    - Reported gains are concentrated in standard domains such as Atari, CARL, driving
      datasets, Minecraft, and robot manipulation; evidence beyond these families
      remains limited.
    disagreements:
    - 'Representation differs: some methods learn compact latent state-space dynamics,
      while others directly generate high-dimensional RGB video with diffusion or
      transformer decoders.'
    - 'Supervision and conditioning differ: some assume observable context values
      or language primitives, while others learn from action-free video diffusion
      or joint action-video denoising.'
    - 'Evaluation targets differ: one line optimizes visual fidelity and physical
      plausibility, another zero-shot policy generalization, and another long-horizon
      memory and action control.'
    - 'Interaction mode differs: some models produce imagined rollouts for policy
      training, while others serve as video planners or closed-loop interactive video-to-world
      baselines.'
    - 'Evidence strength differs: some papers report benchmark comparisons across
      multiple datasets, while benchmark-only papers provide infrastructure without
      reporting baseline results.'
    open_questions:
    - Do auxiliary reconstruction or physics-informed tasks improve cross-domain transfer,
      or mainly regularize domain-specific generators?
    - Can generative video world models maintain long-horizon memory and action consistency
      beyond loop navigation or curated video benchmarks?
    - How much of the reported policy improvement comes from the world model itself
      versus the surrounding planner, action decoder, or data scale?
    - Under what conditions do observable-context assumptions break, and can context
      be inferred instead of given?
    - Are current benchmarks sufficient to isolate method contributions from implementation,
      dataset, and metric choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频动力学与辅助目标设计
      解决的问题: 将世界模型训练转化为可控视频预测，并通过掩码重建、深度预测、关键点动力学或物理信息辅助任务稳定长时域生成。
      尚未覆盖: 哪些辅助目标与监督信号能跨驾驶、机器人或仿真域迁移，而不只是适配特定域外观与场景先验。
    - 路线: 面向模型强化学习的随机/状态空间世界模型
      解决的问题: 通过想象轨迹和上下文条件潜在动力学提升样本效率，并在动力学变化时改善零样本策略泛化。
      尚未覆盖: 假设上下文值可观测且仅在少量任务上评估；模型质量与下游策略增益之间的分离仍不清晰。
    - 路线: 统一动作-视频扩散动力学与规划接口
      解决的问题: 在单一模型中表达策略、前向动力学、逆动力学和视频生成，支持从无动作或有动作视频进行机器人预训练与规划。
      尚未覆盖: 增益来自统一建模还是大规模预训练数据尚不明确；长时域闭环中的动作一致性还未充分验证。
    - 路线: 空间、记忆与动作控制一致性基准
      解决的问题: 超越短时视觉保真度，评估世界模型在开放域中的空间一致性、长期记忆和动作控制能力。
      尚未覆盖: 基准较新，尚缺跨世界模型族的成熟基线结果；指标对像素变化和域差距的敏感性尚未建立。
    共识:
    - 世界模型训练越来越多地以自监督视觉动力学预测为核心，并在潜在或像素空间加入辅助损失以稳定长时域生成。
    - 动作或语言条件被广泛用于把预测动力学转化为可执行策略或任务轨迹，使动作接口成为下游能力的关键。
    - 近期方法主要采用可扩展序列模型，如扩散Transformer、循环状态空间模型或VAE，而不是单步前向预测器。
    - 评测正在从短时视觉保真度转向空间一致性、记忆一致性和动作控制指标。
    - 报告的性能提升大多集中在Atari、CARL、驾驶数据、Minecraft和机器人操作等标准域，跨域证据仍然有限。
    分歧:
    - 表示方式不同：有的学习紧凑潜在状态空间动力学，有的直接生成高维RGB视频。
    - 监督与条件不同：有的假设上下文值可观测或使用语言原语，有的从无动作视频或联合动作-视频扩散中学习。
    - 评测目标不同：分别侧重视觉保真度与物理合理性、零样本策略泛化、或长时记忆与动作控制。
    - 交互模式不同：有的生成想象轨迹用于策略训练，有的作为视频规划器或闭环交互式视频到世界基线。
    - 证据强度不同：部分方法提供多数据集比较，部分基准工作仅提供基础设施而未报告基线结果。
    开放问题:
    - 辅助重建或物理信息任务到底提升了跨域迁移，还主要是正则化了特定域生成器？
    - 生成式视频世界模型能否在循环导航或精选视频基准之外维持长时记忆和动作一致性？
    - 所报告的策略提升有多少来自世界模型本身，而不是规划器、动作解码器或数据规模？
    - 可观测上下文假设在哪些条件下会失效，上下文能否被推断而不是直接给定？
    - 当前基准是否足以区分方法贡献与实现、数据集和指标选择的影响？
