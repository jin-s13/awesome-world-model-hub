  related_work_outline:
  - 'Mainstream direction: The topic is centered on turning world-model evaluation
    into explicit benchmark tasks: action-conditioned video prediction, loop-navigation
    consistency, memory/action-control suites, and RL world-model benchmarks such
    as Atari 100k and CARL.'
  - 'Shared research pattern: Papers introduce or reuse shared datasets and metrics
    to compare models under normal validation, long-horizon rollout, zero-shot transfer,
    and downstream policy-training conditions.'
  - 'Key differences: Evaluation targets diverge across visual fidelity, spatial consistency,
    memory consistency, action controllability, downstream policy performance, and
    physical plausibility; they also differ in diffusion, VAE/Transformer, and physics-informed
    formulations.'
  - 'Trend evolution: The observable top-paper frontier is 2023-2026, moving from
    RL-centric benchmarks toward open-domain, embodied, and driving consistency suites
    with long-horizon and closed-loop stress tests added to aggregate scores.'
  - 'Open questions: Whether proxy consistency or visual metrics predict downstream
    decision quality, how well benchmarks cover unseen embodiments and action spaces,
    and whether rankings remain stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：研究集中在将世界模型评估转化为明确基准任务，包括动作条件视频预测、循环导航一致性、记忆/动作控制套件，以及 Atari 100k 和 CARL 等强化学习世界模型基准。
  - 研究共性：论文引入或复用共享数据集和指标，在正常验证、长时域展开、零样本迁移和下游策略训练条件下对模型进行对比。
  - 关键差异：评测目标在视觉保真度、空间一致性、记忆一致性、动作可控性、下游策略表现和物理合理性之间分化；模型表示和监督信号也存在扩散、VAE/Transformer、物理信息等不同路线。
  - 趋势演进：可观察的高分论文集中在 2023-2026 年，趋势从强化学习中心基准转向开放域、具身和驾驶一致性套件，并在聚合分数之外加入长时域和闭环压力测试。
  - 开放问题：代理一致性或视觉指标是否预测下游决策质量，当前基准在多大程度上覆盖未见具身形态和动作空间，以及排行榜在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world-model evaluation
      what_it_solves: Creates shared tasks and datasets, such as loop-navigation videos
        or closed-loop action-controlled clips, making spatial, temporal, and action-conditioned
        claims comparable across models.
      what_remains_open: Whether task distributions cover the open-world, embodiment,
        and action-space settings where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality beyond aggregate scores by measuring
        spatial consistency, memory consistency, action control, human-normalized
        performance, long-horizon rollouts, and physical plausibility.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        such as policy training or planning remains unclear.
    - line: Comparable baselines and reporting
      what_it_solves: Provides model baselines, benchmark results, and artifact/code
        availability so evaluations can be audited under fixed tasks such as Atari
        100k, CARL, driving datasets, and robotic video datasets.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and missing artifact details is not consistently verified.
    consensus:
    - Recent papers treat world models as systems that need explicit benchmark tasks
      and standardized metrics rather than qualitative generation demos.
    - 'Evaluation is expanding from single-dataset aggregate scores to multi-condition
      testing: normal validation, long-horizon rollout, zero-shot transfer, and downstream
      policy training.'
    - Action-conditioned video prediction is widely used as a core surrogate task
      for world-model capability, while additional consistency or physics checks are
      layered on to expose failure modes.
    disagreements:
    - Some evaluations target reconstruction and visual fidelity, while others target
      downstream agent performance, spatial consistency, memory stability, or physical
      plausibility.
    - Some works emphasize open-loop video generation quality, while others emphasize
      closed-loop action controllability or policy learning inside the world model.
    - 'Supervisory signals differ: self-supervised reconstruction and diffusion generation,
      auxiliary depth/keypoint physics objectives, context-conditioned dynamics, or
      coupled video-action diffusion.'
    - Benchmark domains and action spaces differ substantially, including driving,
      robotic manipulation, Atari games, and open-world navigation, which can favor
      different world-model designs.
    open_questions:
    - Do memory consistency, spatial consistency, or visual fidelity metrics predict
      downstream policy success or planning reliability?
    - How well do current benchmarks cover unseen embodiments, action spaces, and
      long-horizon closed-loop scenarios?
    - Are leaderboard rankings stable across different model implementations, compute
      budgets, and reproducibility artifacts?
    - Can evaluation move beyond aggregate scores to diagnose long-term physical plausibility
      and cross-view coherence under distribution shift?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评估的基准任务与数据集设计
      解决的问题: 通过循环导航、闭环动作控制等共享任务和数据集，使空间一致性、时间一致性和动作条件生成在不同模型间可比较。
      尚未覆盖: 任务分布是否覆盖开放世界、不同具身形态和动作空间等世界模型预期发挥作用的设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、人类归一化表现、长时域展开和物理合理性。
      尚未覆盖: 代理指标与下游决策（如策略训练或规划）之间的一致性仍不明确。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、CARL、驾驶数据和机器人视频数据等固定任务提供模型基线、结果与代码/工件信号，使评测可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和缺失工件细节下是否稳定尚未充分验证。
    共识:
    - 近期研究将世界模型视为需要明确基准任务和标准化指标的系统，而不再只依赖定性生成演示。
    - 评测正从单一数据集的聚合分数，扩展到正常验证、长时域展开、零样本迁移和下游策略训练等多条件检验。
    - 动作条件视频预测被广泛用作世界模型能力的核心代理任务，并叠加一致性或物理检查以暴露失败模式。
    分歧:
    - 一些工作侧重重建质量和视觉保真度，另一些工作侧重下游智能体表现、空间一致性、记忆稳定性或物理合理性。
    - 一些工作强调开环视频生成质量，另一些强调闭环动作可控性或在世界模型内训练策略。
    - 监督信号不同：自监督重建与扩散生成、深度/关键点物理辅助目标、上下文条件动力学，或视频-动作耦合扩散。
    - 评测领域和动作空间差异很大，包括驾驶、机器人操作、Atari 游戏和开放世界导航，这些差异可能偏好不同的世界模型设计。
    开放问题:
    - 记忆一致性、空间一致性或视觉保真度指标是否能够预测下游策略成功或规划可靠性？
    - 当前基准在多大程度上覆盖未见具身形态、动作空间和长时域闭环场景？
    - 排行榜排序在不同模型实现、算力预算和复现工件下是否稳定？
    - 评测能否超越聚合分数，诊断分布偏移下的长期物理合理性和跨视角一致性？
