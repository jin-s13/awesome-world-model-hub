  related_work_outline:
  - 'Mainstream direction: Domain-specific generative world models now dominate the
    application frontier, especially for driving and robot videos; recent work couples
    video and action diffusion in unified models or uses diffusion transformers for
    multi-view, long-horizon scene prediction, as in MaskGWM and UWM.'
  - 'Shared research pattern: Learn to predict future observations conditioned on
    actions, language, context, or goals; add auxiliary objectives such as mask reconstruction,
    physics-informed depth/keypoints, or context conditioning to improve generalization
    and downstream policy training.'
  - 'Key differences: The works split by architecture—diffusion transformer, recurrent
    state-space, transformer-VAE, compositional video modules—by supervision signal—paired
    actions, action-free video, observable context, physics proxy tasks—and by evaluation
    target—video fidelity, zero-shot policy generalization, or memory/action consistency
    benchmarks.'
  - 'Trend evolution: From 2023 sample-efficient model-based RL on Atari (STORM) and
    2024 contextual/robot world models (cRSSM, RoboDreamer) toward 2025-2026 large-scale
    driving/robot video models and dedicated consistency benchmarks (MaskGWM, UWM,
    MIND); the field is moving from policy-centric dreams to scalable, benchmarked
    generative environment models.'
  - 'Open questions: Whether simulator and video gains transfer to real driving safety
    and robot execution; whether long-horizon memory consistency and cross-action-space
    generalization can be achieved without restrictive assumptions; whether consistency
    metrics predict downstream task performance; and sparse reported limitations leave
    verification gaps for several top methods.'
  related_work_outline_zh:
  - 主流方向：领域专用的生成式世界模型成为应用前沿，尤其是驾驶与机器人视频；近期工作将视频与动作扩散耦合到统一模型，或使用扩散Transformer进行多视角、长时域场景预测，如MaskGWM和UWM。
  - 研究共性：学习以动作、语言、上下文或目标为条件的未来观测预测；通过掩码重建、物理信息深度/关键点或上下文条件等辅助目标提升泛化与下游策略训练。
  - 关键差异：模型路线分为扩散Transformer、循环状态空间、Transformer-VAE、组合式视频生成；监督信号包括成对动作、无动作视频、可观测上下文和物理代理任务；评测目标包括视频保真度、零样本策略泛化、记忆与动作一致性。
  - 趋势演进：从2023年Atari上的样本高效模型强化学习（STORM）和2024年上下文/机器人世界模型（cRSSM、RoboDreamer），走向2025-2026年大规模驾驶/机器人视频模型与专门一致性基准（MaskGWM、UWM、MIND）；领域正从策略中心的想象训练转向可扩展、可评测的生成式环境模型。
  - 开放问题：仿真与视频收益能否迁移到真实驾驶安全和机器人执行；能否在不过度依赖强假设下实现长时域记忆一致性和跨动作空间泛化；一致性指标是否预测下游任务表现；若干论文未在证据中报告局限性，真实迁移的验证缺口仍存在。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving video prediction and cross-dataset transfer
      what_it_solves: Long-horizon and multi-view future scene prediction for driving
        simulation and policy evaluation, including zero-shot transfer across driving
        datasets.
      what_remains_open: Whether improved prediction and simulator metrics align with
        closed-loop real-world driving safety and operational outcomes; evidence for
        cross-institution or physical-environment transfer is limited.
    - line: Robot video world models for manipulation and task generalization
      what_it_solves: Generates robot action-conditioned future videos by factorizing
        language primitives or jointly learning physics-related depth/keypoint signals,
        supporting robot policy training and evaluation.
      what_remains_open: Generalization beyond seen language primitives and training
        embodiments; physical plausibility in contact-rich real-world manipulation
        remains underevidenced, with most results at dataset or simulation level.
    - line: Model-based reinforcement learning with world models in interactive environments
      what_it_solves: Uses world models to generate imagined rollouts or latent dynamics
        for sample-efficient policy learning and zero-shot or contextual generalization
        on Atari and CARL-style tasks.
      what_remains_open: Evaluation is limited to a few benchmark tasks; context observability
        is assumed; broader partial observability, long-horizon behavior, and real-world
        transfer remain open.
    - line: World model consistency and action-control benchmarks
      what_it_solves: Provides datasets and protocols to measure spatial consistency,
        memory consistency, and action control in open-ended interactive environments
        such as Minecraft and open-domain videos.
      what_remains_open: Whether consistency scores track downstream task or policy
        performance; benchmark coverage across scenes and action spaces, and long-horizon
        closed-loop generalization are still under-characterized.
    consensus:
    - World model application work is converging on generative future-observation
      prediction conditioned on actions, goals, language, or context as the core abstraction.
    - Auxiliary self-supervised objectives—mask reconstruction, context conditioning,
      physics-informed depth/keypoints, and independent modality diffusion—are widely
      used to improve generalization and controllability.
    - 'Evaluation increasingly emphasizes out-of-distribution generalization: zero-shot
      transfer to unseen datasets, tasks, or contexts, not just training-distribution
      reconstruction.'
    - Long-horizon consistency, memory, and physical plausibility are treated as central
      open evaluation criteria rather than solved capabilities.
    disagreements:
    - 'Architectural representation differs: diffusion transformers, recurrent state-space
      models, transformer variational autoencoders, and compositional video-generation
      modules are used for similar world-model roles.'
    - 'Supervision and data assumptions differ: some require paired action-video or
      observable context; some exploit action-free video and independent diffusion
      timesteps; others rely on language parsing or physics proxy tasks.'
    - 'Evaluation targets differ: video fidelity, zero-shot policy performance, spatial/scene-graph
      consistency, and memory/action-control benchmarks are not interchangeable.'
    - Interaction and deployment settings differ from driving datasets and robot manipulation
      to Atari/CARL/Minecraft and open-domain video, creating incomparable generalization
      barriers.
    open_questions:
    - How do improvements on driving video prediction or consistency benchmarks translate
      to closed-loop safety and real-world operational outcomes?
    - Can long-horizon spatial/memory consistency and cross-action-space control be
      achieved without restrictive assumptions such as observable context or pre-seen
      language primitives?
    - Do scene-graph or memory consistency scores predict downstream robot policy
      or driving policy quality?
    - What verification gaps remain because several top papers provide no limitations,
      code, or real-world deployment evidence in the supplied packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶视频预测与跨数据集迁移
      解决的问题: 用于驾驶仿真和策略评测的长时域、多视角未来场景预测，并实现跨驾驶数据集的零样本迁移。
      尚未覆盖: 改进的预测和仿真指标是否与闭环真实驾驶安全和运营结果一致；跨机构或物理环境的迁移证据仍然有限。
    - 路线: 面向操作和任务泛化的机器人视频世界模型
      解决的问题: 通过分解语言原语或联合学习物理相关的深度/关键点信号，生成以机器人动作为条件的未来视频，支持策略训练和评测。
      尚未覆盖: 对未见语言原语和训练本体的泛化仍有限；接触密集型真实操作中的物理合理性证据不足，评测主要停留在仿真或数据集层面。
    - 路线: 交互环境中的基于模型的强化学习
      解决的问题: 用世界模型生成想象轨迹或潜在动力学，在Atari和CARL类任务上实现样本高效的策略学习与零样本/上下文泛化。
      尚未覆盖: 评测集中在少数基准任务；假设上下文可观测；部分可观测、长时域和真实世界迁移未被充分验证。
    - 路线: 世界模型一致性与动作控制基准
      解决的问题: 在Minecraft和开放域视频等交互式环境中提供数据集和协议，衡量空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 一致性分数是否与下游任务或策略表现相关尚未证明；跨场景、跨动作空间的覆盖率及长时域闭环泛化仍缺乏表征。
    共识:
    - 世界模型应用工作正以动作、目标、语言或上下文条件下的未来观测生成为核心抽象。
    - 通过掩码重建、上下文条件、物理信息深度/关键点和独立模态扩散等辅助自监督目标来改善泛化与可控性已成常见路径。
    - 评测越来越关注分布外泛化，如跨数据集、跨任务、跨上下文的零样本表现，而不只是训练分布重建。
    - 长时域一致性、记忆和物理合理性被视作核心开放评测标准，尚未被现有工作解决。
