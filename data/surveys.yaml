  related_work_outline_zh:
  - 主流方向：构建可运行的世界模型模拟器与动作可控视频生成系统，用于自动驾驶、机器人和交互环境，并越来越重视闭环服务与评测工件。
  - 研究共性：工作将生成式视频或状态空间模型与动作、轨迹或上下文条件结合；许多工作还发布基准或基线，并评测下游策略或奖励用途。
  - 关键差异：系统在表示、训练目标和评测目标上不同——有的优化动作忠实度或空间一致性，有的优化视觉质量或零样本动力学泛化；部署从开环基准到亚秒级闭环服务不等。
  - 趋势演进：可用年份从2015到2026，但主要集中在2024–2026的世界模型系统；主题正从通用视频生成走向当前前沿中的可控、闭环、可基准化的模拟栈。
  - 开放问题：跨域泛化、长时程一致性、跨基础设施的独立复现，以及延迟-保真度-可控性权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world-model simulation systems
      what_it_solves: Converts generative video or state-space models into simulators
        that produce future frames or latent rollouts conditioned on actions, trajectories,
        or context.
      what_remains_open: Long-horizon consistency, cross-domain or sensor generalization,
        and physical plausibility beyond selected benchmarks remain unverified.
    - line: Benchmark and evaluation artifact stacks
      what_it_solves: Quantifies spatial consistency, action fidelity, or control
        adherence with datasets, metrics, and open-access evaluation frameworks.
      what_remains_open: Benchmark coverage is often narrow, and results have not
        been shown to transfer to real-world deployment or independent evaluation
        settings.
    - line: Real-time closed-loop serving and deployment engineering
      what_it_solves: Packages simulation or generation into runnable systems with
        low-latency inference, policy training, or reward evaluation loops.
      what_remains_open: Scalability beyond a single GPU, complex scenes, hardware
        variation, and user-specific integration are underexplained.
    - line: Context-aware and physics-informed embodied model stacks
      what_it_solves: Integrates observable context, temporal depth, or keypoint dynamics
        into learned models to improve zero-shot generalization or physical plausibility.
      what_remains_open: Assumes observable context or specific physics signals; broader
        embodied and unseen dynamics remain unproven.
    consensus:
    - The dominant pattern is to build generative models that act as runnable simulators,
      using action or trajectory conditioning to produce future frames or latent rollouts.
    - Evaluation is shifting toward control-oriented measures such as action fidelity,
      spatial consistency, and closed-loop utility, rather than only visual quality.
    - Several systems combine model training, dataset construction, and downstream
      policy or reward evaluation into a single artifact.
    - Reproducibility is signaled through open code or dataset releases, but independent
      deployment evidence is limited.
    disagreements:
    - 'Representation choices differ: recurrent state-space world models, frame-level
      autoregressive diffusion transformers, and lightweight action-conditioned modules
      inserted into pretrained video generators.'
    - 'Training supervision differs: some rely on physics-informed auxiliary tasks
      such as depth prediction and keypoint dynamics, others on motion-reinforced
      or structural losses, and still others on context conditioning.'
    - 'Primary evaluation target differs: spatial consistency, zero-shot dynamics
      generalization, action fidelity, visual fidelity, or sub-second serving latency.'
    - 'Deployment setting differs: open-loop benchmark generation, closed-loop autonomous
      driving simulation, and model-based reinforcement-learning imagination.'
    open_questions:
    - How well do current simulators generalize beyond the single datasets and tasks
      used, especially to unseen sensors, environments, and real-world deployments?
    - What are the concrete trade-offs between latency, visual fidelity, physical
      plausibility, and controllability as systems scale beyond one GPU?
    - Can evaluation artifacts for spatial consistency and action fidelity be independently
      reproduced and extended across research teams and infrastructure?
    - Do context- or physics-informed assumptions hold when context is unobservable
      or physical properties cannot be specified in advance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的世界模型仿真系统
      解决的问题: 将生成式视频或状态空间模型转化为模拟器，根据动作、轨迹或上下文生成未来帧或潜在推演。
      尚未覆盖: 长时程一致性、跨域或传感器泛化，以及在所选基准之外的物理合理性仍未验证。
    - 路线: 基准与评测工件栈
      解决的问题: 通过数据集、指标和开放评测框架，量化空间一致性、动作忠实度或控制遵循程度。
      尚未覆盖: 基准覆盖通常较窄，向真实部署或独立评测环境的迁移尚未得到证明。
    - 路线: 实时闭环服务与部署工程
      解决的问题: 把仿真或生成打包为具有低延迟推理、策略训练或奖励评测回路的可运行系统。
      尚未覆盖: 单GPU之外的可扩展性、复杂场景、硬件差异和用户特定集成说明不足。
    - 路线: 上下文感知与物理信息的具身模型栈
      解决的问题: 将可观测上下文、时序深度或关键点动力学引入学习模型，以改善零样本泛化或物理合理性。
      尚未覆盖: 假设上下文可观测或依赖特定物理信号；更广泛的具身场景和未知动力学仍未证实。
    共识:
    - 主导模式是构建作为可运行模拟器的生成模型，以动作或轨迹为条件生成未来帧或潜在推演。
    - 评测正在转向面向控制的指标，如动作忠实度、空间一致性和闭环实用性，而不只是视觉质量。
    - 多个系统把模型训练、数据集构建和下游策略或奖励评测整合为同一工件。
    - 可复现性通过开放代码或数据集发布体现，但独立部署证据仍然有限。
    分歧:
    - 表示方式不同：循环状态空间世界模型、帧级自回归扩散Transformer，以及插入预训练视频生成器的轻量动作条件模块。
    - 训练监督不同：有的依赖物理信息辅助任务，如深度预测和关键点动力学；有的依赖运动增强或结构损失；还有的依赖上下文条件。
    - 主要评测目标不同：空间一致性、零样本动力学泛化、动作忠实度、视觉保真度或亚秒级服务延迟。
    - 部署设置不同：开环基准生成、闭环自动驾驶仿真和基于模型的强化学习想象。
    开放问题:
    - 当前模拟器在多大程度上能泛化到所用数据集和任务之外，特别是未知传感器、环境和真实部署？
    - 系统在超过单GPU规模时，延迟、视觉保真度、物理合理性与可控性之间的具体权衡是什么？
    - 用于空间一致性和动作忠实度的评测工件能否跨团队和基础设施独立复现并扩展？
    - 当上下文不可观测或物理属性无法预先指定时，上下文或物理信息相关假设是否仍然成立？
