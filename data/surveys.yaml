  related_work_outline:
  - 'Mainstream direction: Building and refining benchmarks to evaluate world models
    across prediction, consistency, and decision-making, with a growing focus on closed-loop,
    action-conditioned, and long-horizon tasks.'
  - 'Shared research pattern: New world model methods are primarily validated on established
    benchmarks like Atari 100k or driving datasets, while dedicated benchmark papers
    introduce datasets and metrics that probe specific weaknesses such as spatial
    consistency, memory, and action control.'
  - 'Key differences: Evaluations diverge in what they measure—visual fidelity, agent
    performance, or structural consistency—and in their interaction mode (open-loop
    prediction vs. closed-loop action-conditioned generation). Some benchmarks prioritize
    single-domain realism, others aim for cross-domain generalization.'
  - 'Trend evolution: The field is shifting from static, short-horizon game benchmarks
    toward complex embodied settings (driving, robotic manipulation) and from aggregate
    scores to fine-grained capability probes, with a recent emphasis on memory and
    spatial reasoning.'
  - 'Open questions: How to align benchmark metrics with real-world deployment success;
    whether current benchmarks saturate and fail to distinguish genuine progress;
    and how to balance open-loop and closed-loop evaluation without overfitting to
    a single proxy.'
  related_work_outline_zh:
  - 主流方向：构建和完善用于评估世界模型的基准，重点关注预测、一致性和决策能力，并越来越多地采用闭环、动作条件和长时域任务。
  - 研究共性：新的世界模型方法主要在类似Atari 100k或驾驶数据集等既有基准上验证，而专门的基准论文则提出数据集和指标，用以探测空间一致性、记忆和动作控制等特定弱点。
  - 关键差异：评估在测量内容（视觉保真度、智能体性能或结构一致性）和交互模式（开环预测与闭环动作条件生成）上存在分歧。部分基准优先考虑单一领域真实感，另一些则追求跨领域泛化。
  - 趋势演进：该领域正从静态、短时域游戏基准转向复杂的具身环境（驾驶、机器人操作），从总体得分转向细粒度能力探测，近期更强调记忆和空间推理。
  - 开放问题：如何使基准指标与实际部署成功对齐；现有基准是否饱和而无法区分真正进步；如何在开环与闭环评估之间取得平衡，同时避免对单一代理目标过拟合。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that probe specific world-model
        capabilities like spatial consistency, memory, and action control, moving
        beyond generic generation quality.
      what_remains_open: Coverage of the wide range of real-world settings where world
        models are expected to help; ecological validity; and whether these benchmarks
        see broad adoption beyond the proposing group.
    - line: Metric and stress-test design
      what_it_solves: Introduces metrics such as Scene Graph Consistency Score, memory
        consistency, and action control scores that quantify targeted weaknesses and
        provide diagnostic signals beyond aggregate performance.
      what_remains_open: Correlation between these proxy metrics and the downstream
        decisions users actually care about; sensitivity to implementation details;
        and whether improvements on these metrics translate to better policies or
        planning.
    - line: Comparable baselines and reporting
      what_it_solves: Uses standard suites like Atari 100k or Nuscenes to enable head-to-head
        comparisons and track progress, often with open-source code and artifacts.
      what_remains_open: Stability of conclusions across different implementations
        and compute budgets; reproducibility of leaderboard rankings; and whether
        the baselines are truly representative of the state of the art or just early
        checkpoints.
    consensus:
    - World models need systematic evaluation beyond simple generation quality; benchmarks
      should reflect the intended use case like decision-making or planning.
    - New benchmarks are necessary to expose shortcomings that existing benchmarks
      overlook, such as long-term memory consistency and spatial reasoning.
    - Evaluation should be reproducible and use standardized tasks, metrics, and baselines
      to enable fair comparison.
    disagreements:
    - Some works evaluate world models by the performance of a policy trained inside
      them (agent scores on Atari), while others judge the model by visual fidelity
      or structural consistency of the generated videos.
    - There is a split between open-loop evaluation (predicting future frames given
      past) and closed-loop evaluation (action-conditioned generation), with different
      assumptions about what makes a world model useful.
    - Benchmarks differ in their reliance on ground-truth actions versus action-free
      video, affecting which models can be compared and how transferable the findings
      are.
    open_questions:
    - Under what conditions do benchmark rankings predict real-world deployment success,
      and how can we design benchmarks to be more ecologically valid?
    - Can we create a unified evaluation framework that jointly measures prediction
      fidelity and decision-making utility without overfitting to a single metric?
    - How do we prevent benchmarks from saturating and ensure they continue to distinguish
      genuine advances in world modeling?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，探测空间一致性、记忆和动作控制等特定世界模型能力，超越通用生成质量。
      尚未覆盖: 世界模型预期发挥作用的真实设置覆盖范围；生态效度；以及这些基准是否在被提出小组之外得到广泛采用。
    - 路线: 指标与压力测试设计
      解决的问题: 引入场景图一致性分数、记忆一致性和动作控制分数等指标，量化特定弱点，提供超越总体性能的诊断信号。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的相关性；对实现细节的敏感性；指标上的改进是否转化为更好的策略或规划。
    - 路线: 可比基线与报告规范
      解决的问题: 使用Atari 100k或Nuscenes等标准套件实现头对头比较并跟踪进展，通常附带开源代码和工件。
      尚未覆盖: 结论在不同实现和算力预算下的稳定性；排行榜排名的可复现性；基线是否真正代表当前最优，或仅是早期检查点。
    共识:
    - 世界模型需要超越简单生成质量的系统化评估；基准应反映预期用途，如决策或规划。
    - 需要新的基准来暴露现有基准忽视的不足，例如长期记忆一致性和空间推理。
    - 评估应可复现，并使用标准化任务、指标和基线以实现公平比较。
    分歧:
    - 部分工作通过在世界模型内部训练的策略性能（Atari上的智能体得分）来评估世界模型，而另一些则通过生成视频的视觉保真度或结构一致性来判断。
    - 在开环评估（基于过去预测未来帧）与闭环评估（动作条件生成）之间存在分歧，二者对世界模型有用性的前提假设不同。
    - 基准在依赖真实动作还是无动作视频方面存在差异，这影响了哪些模型可被比较以及研究发现的迁移性。
    开放问题:
    - 在何种条件下，基准排名能预测真实部署的成功，以及如何设计更具生态效度的基准？
    - 能否创建一个统一评估框架，共同衡量预测保真度和决策效用，同时避免对单一指标过拟合？
    - 如何防止基准饱和，并确保其持续区分世界建模的真正进步？
