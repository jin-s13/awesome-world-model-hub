    targets range from spatial consistency and action fidelity to zero-shot policy
    success; deployment settings split between simulation benchmarks and real-robot
    or single-GPU real-time pipelines.'
  - 'Trend evolution: The visible top-paper evidence is concentrated in 2024-2026,
    moving from task-specific context-aware models and driving-world benchmarks toward
    larger cross-embodiment latent-action models, physics-informed generation, and
    low-latency frame-autoregressive closed-loop simulation.'
  - 'Open questions: Long-horizon consistency under distribution shift, independent
    reproduction across datasets and infrastructure, trade-offs between latency, fidelity
    and controllability, and validity of context observability assumptions remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：面向具身智能和自动驾驶闭环使用场景的可运行世界模型系统与模拟器，例如 FAR-Drive、Terra ACT-Bench、Vista 和 RynnWorld-Latent。
  - 研究共性：条件视频生成或循环状态空间模型学习动作、上下文或物理接口，并通过开放基准、策略推演或视觉与控制保真度指标进行评估。
  - 关键差异：条件接口分为轨迹动作、通用潜在动作、显式上下文值和物理信息线索；评测目标涵盖空间一致性、动作忠实度、零样本策略成功率；部署设置分化为仿真基准、真实机器人或单GPU实时流水线。
  - 趋势演进：现有高相关论文集中在 2024-2026 年，从任务特定的上下文感知模型和驾驶世界基准，走向更大规模跨具身潜在动作模型、物理信息生成和低延迟帧级自回归闭环仿真。
  - 开放问题：长时域一致性、分布外场景鲁棒性、跨数据集与基础设施的独立复现、延迟/保真度/可控性权衡，以及上下文可观测假设的有效性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turns model ideas into end-to-end workflows for data, training,
        inference, and evaluation; examples include Terra ACT-Bench as an open evaluation
        framework and FAR-Drive as a closed-loop driving simulator.
      what_remains_open: How well these stacks survive external deployment, hardware
        changes, and user-specific settings beyond their original benchmark domains.
    - line: Real-time and interactive serving
      what_it_solves: Meets latency and interactivity requirements for closed-loop
        use; FAR-Drive reports sub-second single-GPU latency, while action-controllable
        and controllable driving models target interactive simulation.
      what_remains_open: Trade-offs between speed, fidelity, controllability, and
        system complexity under longer horizons or multi-GPU and complex-scene deployment.
    - line: Artifacts and reproducible engineering
      what_it_solves: Makes systems inspectable and reusable through code, datasets,
        benchmarks, and experiment artifacts; LoopNav and Terra ACT-Bench provide
        open resources, and several papers expose baseline comparisons.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        environments, especially where code, dataset, or limitation evidence is sparse
        or unverified.
    consensus:
    - Conditional world/video models are treated as reusable engines for future-state
      prediction, policy evaluation, or simulation rather than isolated generative
      demos.
    - Action, context, or physics conditioning improves transfer, control fidelity,
      or physical plausibility over generic or unconditional baselines.
    - Benchmarks and datasets are becoming first-class artifacts for measuring spatial
      consistency, action fidelity, visual quality, or policy success.
    - Recent system work pays increasing attention to deployment constraints such
      as closed-loop latency and single-GPU inference.
    disagreements:
    - 'Control interface varies: explicit trajectory/action instructions versus universal
      latent actions versus observable context values versus physics-informed cues
      from depth and keypoints.'
    - 'Evaluation target differs: Minecraft spatial consistency, nuScenes action fidelity
      and closed-loop driving, CARL zero-shot policy generalization, robotic visual/physical
      plausibility, or real-robot policy success.'
    - 'Training and interaction mode differs: recurrent latent imagination in Dreamer-style
      models, joint physics and RGB video training, large-scale cross-embodiment pretraining
      followed by adaptation, or frame-level autoregressive closed-loop generation.'
    - 'Deployment setting differs: offline benchmark evaluation, open-loop generation,
      closed-loop simulation, real-robot adaptation, or latency-constrained single-GPU
      serving.'
    open_questions:
    - How can long-horizon spatial, temporal, and cross-view consistency be maintained
      as autoregressive video generation extends beyond the reported nuScenes or benchmark
      sequences?
    - What generalization evidence exists outside CARL's two tasks, nuScenes-only
      driving settings, or the specific robot platforms and datasets evaluated?
    - Can the reported sub-second single-GPU latency be preserved under multi-GPU,
      more complex scenes, or real-world deployment with distribution shifts?
    - Are context observability assumptions realistic beyond controlled benchmarks,
      and how do systems degrade when context or action interfaces are partially observed?
    - Which reproducibility claims are independently verifiable when code, dataset,
      limitation, and citation evidence are incomplete or absent?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型想法转化为覆盖数据、训练、推理和评测的端到端工作流；例如 Terra ACT-Bench 作为开放评测框架，FAR-Drive 作为闭环驾驶模拟器。
      尚未覆盖: 这些系统栈在原始基准域之外的外部部署、硬件变化和用户特定设置下是否仍可靠尚不明确。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟和交互需求；FAR-Drive 报告单GPU亚秒级延迟，动作可控和可控驾驶模型面向交互式仿真。
      尚未覆盖: 在更长时域、多GPU或复杂场景部署下，速度、保真度、可控性和系统复杂度之间的权衡仍未充分覆盖。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、数据集、基准和实验工件让系统可检查、可复用；LoopNav 和 Terra ACT-Bench 提供开放资源，多篇论文包含基线比较。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现仍不充分，尤其当代码、数据集或局限性证据稀疏或未经验证时。
    共识:
    - 条件世界/视频模型被作为可复用的未来状态预测、策略评估或仿真引擎，而非孤立的生成演示。
    - 动作、上下文或物理条件化相比通用或无条件基线能改善迁移、控制忠实度或物理合理性。
    - 基准和数据集正成为衡量空间一致性、动作忠实度、视觉质量或策略成功率的一等公民工件。
    - 近期系统工作越来越关注闭环延迟和单GPU推理等部署约束。
    分歧:
    - 控制接口不同：显式轨迹/动作指令、通用潜在动作、可观测上下文值，以及来自深度和关键点的物理信息线索。
    - 评测目标不同：Minecraft 空间一致性、nuScenes 动作忠实度与闭环驾驶、CARL 零样本策略泛化、机器人视觉/物理合理性或真实机器人策略成功率。
    - 训练与交互模式不同：Dreamer 风格的循环潜在想象、联合物理与RGB视频训练、大规模跨具身预训练后适配，以及帧级自回归闭环生成。
    - 部署场景不同：离线基准评测、开环生成、闭环仿真、真实机器人适配，或受延迟约束的单GPU服务。
    开放问题:
    - 当自回归视频生成扩展到超过所报告 nuScenes 或基准序列的长度时，如何保持长时域空间、时间和跨视图一致性？
    - 在 CARL 的两个任务、仅 nuScenes 的驾驶设置或所评估的特定机器人平台与数据集之外，还有哪些泛化证据？
    - 在多GPU、更复杂场景或存在分布偏移的真实部署中，所报告的单GPU亚秒级延迟能否保持？
    - 上下文可观测假设在受控基准之外是否现实？当上下文或动作接口部分可观测时系统会如何退化？
    - 当代码、数据集、局限性和引文证据不完整或缺失时，哪些可复现声明可以被独立验证？
