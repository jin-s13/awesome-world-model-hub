  related_work_outline:
  - 'Mainstream direction: Designing multi-dimensional benchmarks that evaluate world
    models beyond visual fidelity, incorporating physical plausibility, action controllability,
    spatial consistency, and memory persistence.'
  - 'Shared research pattern: Proposing new datasets with tailored metrics (e.g.,
    scene graph consistency, memory consistency scores) to probe specific model weaknesses,
    then using these benchmarks to reveal systematic failures in existing models.'
  - 'Key differences: Evaluation dimensions differ (spatial consistency vs. physical
    plausibility vs. action controllability vs. memory); environments range from driving
    and robotics to games; some benchmarks require explicit actions while others target
    action-free settings.'
  - 'Trend evolution: Within the 2020–2026 frontier, benchmarks have shifted from
    repurposing standard RL suites (Atari, CARL) to purpose-built world-model datasets
    (LoopNav, MIND) with closed-loop, multi-view, and long-horizon evaluation protocols.'
  - 'Open questions: How well current proxy metrics align with downstream task performance;
    whether benchmark conclusions remain stable across implementations and compute
    budgets; and how to design unified benchmarks that cover the settings where world
    models are actually deployed.'
  related_work_outline_zh:
  - 主流方向：设计超越视觉保真度的多维基准，纳入物理合理性、动作可控性、空间一致性和记忆持久性来评估世界模型。
  - 研究共性：提出新数据集和定制指标（如场景图一致性、记忆一致性分数）以探测模型弱点，并用这些基准揭示现有模型的系统性失败。
  - 关键差异：评估维度不同（空间一致性 vs. 物理合理性 vs. 动作可控性 vs. 记忆）；环境涵盖驾驶、机器人、游戏等；部分基准依赖显式动作，另一些针对无动作设置。
  - 趋势演进：在2020–2026前沿内，基准从复用标准RL套件（Atari、CARL）转向专为世界模型构建的数据集（LoopNav、MIND），并采用闭环、多视角和长时域评估协议。
  - 开放问题：当前代理指标与下游任务性能的对齐程度；基准结论在不同实现和算力下是否稳定；如何设计统一基准以覆盖世界模型实际部署的场景。
  literature_review:
    line_of_work_matrix:
    - line: Purpose-built benchmark dataset design
      what_it_solves: Creates shared, targeted tasks and datasets for world models,
        filling the gap where generic benchmarks fail to capture spatial, temporal,
        or physical consistency.
      what_remains_open: Whether the dataset distribution and scale capture the open-world
        variability and long-tail events of real deployment, and how well the tasks
        transfer to practical decision-making.
    - line: Multi-dimensional metric and stress-test design
      what_it_solves: Probes world models beyond aggregate visual quality by measuring
        physical plausibility, action adherence, memory consistency, and spatial invariance,
        revealing strengths and weaknesses invisible to pixel-level metrics.
      what_remains_open: Alignment between these proxy metrics and human judgments
        or downstream task success; risk of overfitting to metric-specific shortcuts
        without improving real-world utility.
    - line: Benchmark-driven model diagnosis and improvement
      what_it_solves: Uses benchmarks to expose systematic failures (e.g., long-term
        memory loss, cross-action generalization) and guides model design, such as
        incorporating context or RL-based optimization of benchmark-defined objectives.
      what_remains_open: Whether improvements on benchmark metrics translate to consistent
        gains across diverse implementations and compute budgets, and whether benchmark
        conclusions remain robust under distribution shift.
    consensus:
    - World model evaluation must move beyond pixel-level reconstruction quality to
      include physical plausibility, action controllability, and spatial/memory consistency.
    - There is a need for dedicated benchmarks with tailored metrics, as standard
      RL or video generation suites do not adequately reflect the unique challenges
      of world models.
    - Closed-loop, interactive, and multi-view evaluation protocols provide more informative
      signals than open-loop next-frame prediction.
    - Large-scale, multi-task datasets are critical for assessing generalization,
      and benchmark artifacts should be open-sourced to enable reproducibility.
    disagreements:
    - 'Which evaluation dimensions matter most: spatial consistency (LoopNav), physical
      plausibility and action adherence (PAVXploreRL), memory consistency and action
      control (MIND), or zero-shot generalization to unseen dynamics (Dreaming of
      Many Worlds).'
    - Whether environments should be synthetic gaming domains (Minecraft, Atari) or
      realistic driving/robotics scenarios, and the corresponding trade-off between
      controllability and realism.
    - 'The role of action supervision: some benchmarks require explicit action sequences,
      while others explore learning from action-free video or inferring dynamics from
      contextual cues, leading to different assumptions about data availability.'
    - 'Evaluation granularity: aggregate scores vs. diagnostic breakdowns; some benchmarks
      provide a single metric, others offer fine-grained analyses of specific failure
      modes, with no consensus on the right level of detail.'
    open_questions:
    - How to design a unified benchmark that simultaneously measures physical plausibility,
      memory, action control, and decision utility without conflating these dimensions?
    - Do improvements on current benchmark metrics (e.g., SGCS, PAV scores) reliably
      predict better performance in real-world downstream tasks like robotic manipulation
      or autonomous driving?
    - How can benchmarks be made robust to overfitting, ensuring that models optimized
      for test set metrics do not sacrifice generalization to unseen scenarios?
    - What is the minimum set of evaluation protocols and datasets needed to cover
      the diverse deployment settings claimed by world model research, from low-data
      RL to large-scale video generation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 专用基准数据集设计
      解决的问题: 创建共享的、针对性的任务和数据集，填补通用基准无法捕捉空间、时间或物理一致性的空白。
      尚未覆盖: 数据集分布和规模是否覆盖真实部署的开放世界可变性和长尾事件，以及任务是否能迁移到实际决策中。
    - 路线: 多维度指标与压力测试设计
      解决的问题: 通过衡量物理合理性、动作一致性、记忆一致性和空间不变性，超越像素级视觉质量来探测世界模型，揭示像素级指标无法发现的优劣。
      尚未覆盖: 这些代理指标与人类判断或下游任务成功之间的对齐；过度拟合指标特定捷径而无法提升实际效用的风险。
    - 路线: 基准驱动的模型诊断与改进
      解决的问题: 使用基准揭示系统性失败（如长期记忆遗忘、跨动作泛化）并指导模型设计，例如结合上下文或使用RL优化基准定义的目标。
      尚未覆盖: 基准指标上的改进能否在不同实现和算力预算下持续转化为一致提升，以及基准结论在分布偏移下是否稳健。
    共识:
    - 世界模型评估必须超越像素级重建质量，纳入物理合理性、动作可控性和空间/记忆一致性。
    - 需要具有定制指标的专用基准，因为标准RL或视频生成套件无法充分反映世界模型的独特挑战。
    - 闭环、交互式和多视角评估协议比开环单帧预测提供更有信息量的信号。
    - 大规模多任务数据集对评估泛化性至关重要，基准工件应开源以实现可复现性。
    分歧:
    - 哪些评估维度最重要：空间一致性（LoopNav）、物理合理性与动作一致性（PAVXploreRL）、记忆一致性与动作控制（MIND），还是对未知动力学的零样本泛化（Dreaming
      of Many Worlds）。
    - 环境应选择合成游戏域（Minecraft、Atari）还是真实驾驶/机器人场景，以及可控性和真实性之间的权衡。
    - 动作监督的角色：部分基准要求显式动作序列，其他则探索从无动作视频中学习或从上下文线索推断动力学，导致对数据可用性的不同假设。
    - 评估粒度：聚合分数还是诊断性分解；有些基准提供单一指标，另一些提供精细的故障模式分析，尚缺乏共识。
    开放问题:
    - 如何设计一个统一基准，同时衡量物理合理性、记忆、动作控制和决策效用而不混淆这些维度？
    - 当前基准指标（如SGCS、PAV分数）的改进是否能可靠预测真实下游任务（如机器人操作或自动驾驶）中更好的性能？
    - 如何使基准对过度拟合具有鲁棒性，确保为测试集指标优化的模型不会牺牲对未见场景的泛化？
    - 覆盖世界模型研究所声称的多样化部署设置（从低数据RL到大规模视频生成）所需的最小评估协议和数据集集合是什么？
