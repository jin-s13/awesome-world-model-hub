    - 任务设置从模拟环境（Minecraft, Atari, CARL）到驾驶数据集（Nuscenes, Waymo），影响了可测量的一致性类型及其与真实部署的相关性。
    开放问题:
    - 现有的代理指标（如场景图一致性分数）是否与下游任务成功或人类对空间连贯性的判断相关？
