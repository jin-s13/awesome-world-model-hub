  related_work_outline:
  - 'Mainstream direction: Building video-generation world models with diffusion transformers
    and VAE-Transformer hybrids, progressively incorporating action, physics, and
    context to improve generalization and controllability.'
  - 'Shared research pattern: Treating world models as sequence generation under self-supervised
    learning; recent works emphasize out-of-distribution generalization (zero-shot,
    compositional, contextual) and standardized evaluation benchmarks.'
  - 'Key differences: Representation (pure video generation vs. video-action coupling),
    supervision (reconstruction only vs. physics or context injection), evaluation
    domain (Atari, driving, robotics), and interaction mode (open-loop prediction
    vs. closed-loop action-conditioned control).'
  - 'Trend evolution: From efficient Atari world models (2023) to contextual/compositional
    generalization (2024), then to large-scale pretraining, physics-informed fusion,
    and dedicated benchmarks in driving and robotics (2025), with deeper memory and
    action control assessment in 2026—moving toward multimodal, embodied, and evaluable
    world models.'
  - 'Open questions: Long-term memory consistency and spatial coherence, architectural
    generalization to novel tasks and environments, integration of physical principles
    without sacrificing flexibility, separation of model contribution from planner/controller
    effects, and real-world deployment validation.'
  related_work_outline_zh:
  - 主流方向：以扩散变换器和VAE-Transformer混合架构构建视频生成式世界模型，逐步融入动作、物理和上下文信息，提升泛化性和可控性。
  - 研究共性：将世界模型视为自监督序列生成，近期工作普遍关注分布外泛化（零样本、组合、上下文）和标准化评测基准。
  - 关键差异：表示（纯视频生成 vs. 视频-动作耦合）、监督信号（仅重建 vs. 注入物理或上下文）、评测域（Atari、驾驶、机器人）和交互模式（开环预测
    vs. 闭环动作条件控制）。
  - 趋势演进：从2023年高效Atari世界模型，到2024年上下文/组合泛化，再到2025年驾驶与机器人的大规模预训练、物理信息融合和专用基准，2026年进一步深化记忆与动作控制评估，整体趋向多模态、具身化和可评估。
  - 开放问题：长期记忆一致性、空间连贯性、架构对新任务泛化、物理规律与数据驱动学习的结合、模型与规划器贡献分离，以及真实世界部署验证。
  literature_review:
    line_of_work_matrix:
    - line: Video-generative world model architectures
      what_it_solves: Learning to generate future frames from history, capturing environment
        dynamics and appearance via diffusion or VAE-Transformer hybrids.
      what_remains_open: Long-horizon consistency, physical plausibility, cross-domain
        generalization, and training efficiency; many designs are validated on narrow
        domains.
    - line: Compositional and contextual world models
      what_it_solves: Improving zero-shot generalization by factorizing instructions
        into primitives (compositional) or conditioning dynamics on explicit context
        variables.
      what_remains_open: Generalization to entirely novel primitives or unobserved
        context, limited task diversity, and sensitivity to parsing accuracy.
    - line: Action-coupled planning interfaces
      what_it_solves: Integrating action prediction or policy learning with video
        generation so that the world model directly supports decision-making and control.
      what_remains_open: Real-world action-space generalization, disentangling model
        gains from planner/controller choice, and sim-to-real transfer.
    - line: World model evaluation benchmarks
      what_it_solves: Providing standardized metrics for memory consistency, action
        control, and spatial coherence, moving beyond per-task video quality.
      what_remains_open: Coverage of diverse scenes and tasks, dataset bias removal,
        and linking benchmark scores to downstream task improvements.
    consensus:
    - World models are predominantly built with diffusion or Transformer backbones.
    - Self-supervised video/state prediction is the core learning objective.
    - Generalization beyond training distributions (zero-shot, compositional, contextual)
      is a central concern.
    - Memory consistency and action control are identified as fundamental challenges.
    disagreements:
    - 'Representation choice: some works generate pure video, others jointly model
      video and action tokens within a unified transformer.'
    - 'Supervision signal: several methods rely only on reconstruction loss, while
      others incorporate depth, keypoint dynamics, or explicit context variables.'
    - 'Evaluation domain: benchmarks span Atari games, autonomous driving, and robotic
      manipulation, each with different success criteria.'
    - 'Interaction mode: open-loop video prediction versus closed-loop action-conditioned
      generation with policy learning.'
    - 'Deployment setting: evaluation is split between simulation, offline datasets,
      and early real-world usage, with no consistent real-world baseline.'
    open_questions:
    - How can physical constraints be integrated into flexible generative architectures
      without limiting their expressiveness?
    - Do existing benchmarks capture the requirements of real-world deployment, and
      what additional metrics are needed?
    - What mechanisms enable world models to maintain temporal and spatial consistency
      over long horizons?
    - How can we isolate the contribution of the world model itself from the choice
      of planner, controller, or training data scale?
    - What are the limits of zero-shot generalization to dynamics and scenes that
      are fundamentally different from the training distribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成式世界模型架构
      解决的问题: 从历史观测学习生成未来帧，通过扩散或VAE-Transformer混合建模捕捉环境动态和外观。
      尚未覆盖: 长时域一致性、物理合理性、跨域泛化能力及训练效率，多数设计仅在单一领域验证。
    - 路线: 组合与上下文世界模型
      解决的问题: 通过将指令分解为原语（组合）或将动态条件化于显式上下文变量，提升零样本泛化。
      尚未覆盖: 对全新原语或不可观测上下文的泛化、任务多样性有限、对解析精度的依赖。
    - 路线: 动作耦合的规划接口
      解决的问题: 将动作预测或策略学习与视频生成集成，使世界模型直接支持决策与控制。
      尚未覆盖: 真实动作空间泛化、模型增益与规划器/控制器贡献的分离、仿真到现实的迁移。
    - 路线: 世界模型评估基准
      解决的问题: 提供记忆一致性、动作控制和空间连贯性的标准化度量，超越单纯视频质量评估。
      尚未覆盖: 多样化场景与任务覆盖、消除数据集偏差、将基准分数与下游任务改进关联。
    共识:
    - 世界模型普遍采用扩散或Transformer骨干架构。
    - 自监督视频/状态预测是核心学习范式。
    - 超出训练分布的泛化（零样本、组合、上下文）成为关注焦点。
    - 记忆一致性和动作控制被识别为根本性挑战。
    分歧:
    - 表示选择：部分工作生成纯视频，另一些在统一Transformer中联合建模视频和动作令牌。
    - 监督信号：有的仅依赖重建损失，有的融合深度、关键点动力学或显式上下文变量。
    - 评测域：基准涵盖Atari游戏、自动驾驶和机器人操作，各自采用不同的成功标准。
    - 交互模式：开环视频预测 vs. 闭环动作条件生成与策略学习。
    - 部署环境：评估在仿真、离线数据集和有限真实场景中分割，缺乏一致的真实世界基线。
    开放问题:
    - 如何在不限制表达性的前提下将物理约束融入灵活的生成式架构？
    - 现有基准是否捕捉了真实部署的需求，还需要哪些额外度量？
    - 什么机制能确保世界模型在长时域保持时间和空间一致性？
    - 如何分离世界模型本身的贡献与规划器、控制器或训练数据规模的影响？
    - 零样本泛化到与训练分布根本不同的动力学和场景的极限在哪里？
