  related_work_outline:
  - 'Mainstream direction: World model architectures are shifting from standalone
    video generators toward multi-modal frameworks that couple action, language, and
    physics signals with diffusion or transformer backbones to improve long-horizon
    prediction and generalization.'
  - 'Shared research pattern: Most works integrate generative models with structured
    knowledge (masks, context, keypoints, language primitives) and evaluate on simulation
    benchmarks, with a recent emphasis on memory consistency and action controllability.'
  - 'Key differences: Architectures diverge in how they couple modalities (joint diffusion,
    factorized composition, physics-informed joint training), what supervision they
    use (video reconstruction, depth, keypoints, action prediction), and whether they
    target zero-shot, compositional, or cross-dataset generalization.'
  - 'Trend evolution: Within the 2023–2026 frontier, the field is moving from visual
    fidelity-only evaluation toward benchmarks that explicitly measure spatial consistency,
    memory, and closed-loop action control, while beginning to incorporate physical
    priors and large-scale pretraining.'
  - 'Open questions: How much of the performance gain stems from the world model itself
    versus the planner or controller; whether context and physics assumptions hold
    in more realistic, unobservable settings; and how to verify long-term memory consistency
    and cross-action-space generalization in real-world deployments.'
  related_work_outline_zh:
  - 主流方向：世界模型架构正从单一视频生成器转向多模态框架，通过扩散或Transformer骨干耦合动作、语言和物理信号，以提升长时域预测和泛化能力。
  - 研究共性：多数工作将生成模型与结构化知识（掩码、上下文、关键点、语言原语）整合，并在仿真基准上评估，近期开始关注记忆一致性和动作可控性。
  - 关键差异：架构在模态耦合方式（联合扩散、分解组合、物理信息联合训练）、监督信号（视频重建、深度、关键点、动作预测）以及泛化目标（零样本、组合、跨数据集）上存在显著分歧。
  - 趋势演进：在2023–2026前沿期内，领域从仅关注视觉保真度评估，转向明确测量空间一致性、记忆和闭环动作控制的基准，同时开始引入物理先验和大规模预训练。
  - 开放问题：性能增益有多少来自世界模型本身而非规划器或控制器；上下文和物理假设在更真实、不可观测场景中是否成立；以及如何在真实部署中验证长期记忆一致性和跨动作空间泛化。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based world models with mask reconstruction
      what_it_solves: Long-horizon and multi-view video prediction for driving scenes
        by combining diffusion transformers with masked feature learning, improving
        generalization across datasets.
      what_remains_open: How to integrate action-control interfaces and decision-making;
        evaluation is limited to video generation metrics without downstream planning
        or real-world driving validation.
    - line: Contextual state-space world models
      what_it_solves: Zero-shot generalization to unseen dynamics in model-based RL
        by conditioning latent dynamics on observable context variables within the
        Dreamer framework.
      what_remains_open: Relies on explicit observability of context values; tested
        on only two CARL tasks, leaving broader task families and unobservable context
        settings unverified.
    - line: Efficient stochastic transformer world models
      what_it_solves: Sample-efficient model-based RL on Atari by combining transformer
        sequence modeling with variational autoencoders, achieving high human-normalized
        scores without lookahead search.
      what_remains_open: Scalability to continuous control or more complex, visually
        diverse environments beyond Atari; no evidence on how the architecture transfers
        to physical interaction tasks.
    - line: Compositional world models via language factorization
      what_it_solves: Compositional generalization to unseen object-action combinations
        by parsing language instructions into primitives and conditioning separate
        video generation models.
      what_remains_open: Generalization is limited to seen primitive combinations;
        entirely novel primitives are unsupported; no real-robot execution results,
        only simulation.
    - line: Physics-informed embodied world models
      what_it_solves: Realistic robotic video synthesis by jointly learning RGB generation
        with temporal depth and keypoint dynamics, implicitly encoding physical properties
        for better motion.
      what_remains_open: Whether the physics knowledge generalizes across different
        robot embodiments or task categories; no downstream policy comparison with
        non-physics baselines on real tasks.
    - line: Unified video and action diffusion pretraining
      what_it_solves: Pretraining policies and dynamics models on large-scale robotic
        datasets by coupling video and action diffusion in a single transformer, with
        flexible modality control.
      what_remains_open: Absence of explicit limitations or failure case analysis;
        unclear how the approach handles diverse action spaces or data efficiency
        compared to single-modality pretraining.
    - line: Benchmarks for spatial and memory consistency in world models
      what_it_solves: Evaluating spatial consistency via loop-based navigation (LoopNav)
        and memory consistency plus action control via diverse videos (MIND), revealing
        failures in long-term memory and cross-action generalization.
      what_remains_open: Benchmarks are not yet aligned with real-world task completion;
        the link between proposed metrics and downstream policy performance is not
        established.
    consensus:
    - World models are increasingly treated as multi-modal generative systems that
      can be jointly trained with action, language, or physics signals rather than
      pure video predictors.
    - Diffusion models and transformers have become dominant architectural components,
      often combined with variational or masked learning objectives.
    - Evaluation is moving beyond frame-wise visual quality toward consistency, controllability,
      and memory, as evidenced by new benchmarks and metrics like SGCS, MIND, and
      LoopNav.
    - All methods validate in simulation or on fixed datasets; real-world closed-loop
      experiments are absent or not reported, creating a verification gap for deployment
      claims.
    - Pretraining on large-scale datasets (e.g., OpenDV-2K, multi-task robot data)
      is emerging as a common strategy to improve generalization, though the evidence
      is limited to the reported settings.
    disagreements:
    - 'Representation: some models learn implicit physics through joint depth/keypoint
      prediction, while others rely on explicit context variables or language primitives
      to structure dynamics.'
    - 'Supervision: objective functions differ substantially—video reconstruction
      loss, mask reconstruction, action prediction, depth prediction, and keypoint
      dynamics are used alone or in combination.'
    - 'Interaction mode: some works couple action diffusion directly into the world
      model for policy learning, whereas others use the world model as a dream simulator
      to train a separate policy.'
    - 'Generalization target: zero-shot generalization to unseen dynamics, compositional
      generalization to new primitive combinations, and cross-dataset generalization
      to new domains represent distinct evaluation goals.'
    - 'Action space handling: benchmarks like MIND test multiple action spaces, but
      most method papers assume a fixed, pre-defined action space without testing
      across varied control dimensions.'
    open_questions:
    - How much of the reported performance gain is attributable to the world model
      itself versus the planner, controller, or task-specific prior used in evaluation?
    - Can contextual and physics-informed world models maintain their advantages when
      context variables are partially observable or unknown, as is common in real-world
      settings?
    - What are the minimal benchmark requirements to establish that a world model
      reliably supports downstream decision-making in real robots, beyond simulation-based
      video quality scores?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散和掩码重建的世界模型
      解决的问题: 通过扩散Transformer与掩码特征学习相结合，实现驾驶场景的长时域和多视角视频预测，提升跨数据集泛化能力。
      尚未覆盖: 如何集成动作控制接口与决策；评估仅限于视频生成指标，缺乏下游规划或真实驾驶验证。
    - 路线: 上下文状态空间世界模型
      解决的问题: 在Dreamer框架内，通过将潜在动力学条件化于可观测上下文变量，实现模型对未见动力学的零样本泛化。
      尚未覆盖: 依赖上下文值的显式可观测性；仅在两个CARL任务上测试，更广泛的任务族和不可观测上下文场景尚未验证。
    - 路线: 高效随机Transformer世界模型
      解决的问题: 在Atari上实现样本高效的基于模型的RL，结合Transformer序列建模与变分自编码器，在不使用前瞻搜索的情况下达到高人类归一化分数。
      尚未覆盖: 向连续控制或更复杂视觉环境的扩展性；无证据表明该架构能迁移到物理交互任务。
    - 路线: 基于语言分解的组合世界模型
      解决的问题: 通过将语言指令解析为原语并条件化独立视频生成模型，实现对未见物体-动作组合的组合泛化。
      尚未覆盖: 泛化仅限于训练中见过的原语组合；全新原语不支持；仅有仿真结果，无真实机器人执行。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 通过联合学习RGB生成与时序深度和关键点动力学，隐式编码物理属性，生成更逼真的机器人视频并改善运动建模。
      尚未覆盖: 物理知识能否泛化到不同机器人形态或任务类别；未在真实任务上与无物理基线进行下游策略比较。
    - 路线: 统一视频与动作扩散预训练
      解决的问题: 在单个Transformer中耦合视频和动作扩散，在大规模机器人数据集上预训练策略和动力学模型，具备灵活的模态控制。
      尚未覆盖: 缺少明确的局限性或失败案例分析；不清楚该方法如何处理多样化动作空间，以及与单模态预训练相比的数据效率。
    - 路线: 空间与记忆一致性基准测试
      解决的问题: 通过基于循环的导航（LoopNav）评估空间一致性，通过多样化视频（MIND）评估记忆一致性和动作控制，揭示当前模型在长期记忆和跨动作泛化上的失败。
      尚未覆盖: 基准尚未与真实世界任务完成度对齐；所提指标与下游策略性能之间的关联尚未建立。
    共识:
    - 世界模型正越来越多地被当作多模态生成系统，可与动作、语言或物理信号联合训练，而非仅仅作为视频预测器。
    - 扩散模型和Transformer已成为主要架构组件，常与变分或掩码学习目标相结合。
    - 评估正从逐帧视觉质量转向一致性、可控性和记忆，LoopNav、MIND和SGCS等新基准和指标的出现证明了这一点。
    - 所有方法均在仿真或固定数据集上验证；真实世界闭环实验缺失或未报告，构成部署声称的验证缺口。
    - 在大规模数据集（如OpenDV-2K、多任务机器人数据）上预训练正成为提升泛化性的常见策略，尽管证据仅限于所报告的场景。
    分歧:
    - 表示方式：一些模型通过联合深度/关键点预测隐式学习物理，另一些则依赖显式上下文变量或语言原语来结构化动力学。
    - 监督信号：目标函数差异显著——视频重建损失、掩码重建、动作预测、深度预测和关键点动力学被单独或组合使用。
    - 交互模式：有些工作直接在扩散世界中耦合动作以进行策略学习，而另一些则将世界模型作为梦境模拟器来训练独立策略。
    - 泛化目标：对未见动力学的零样本泛化、对新原语组合的组合泛化以及跨数据集泛化代表了不同的评估目标。
    - 动作空间处理：MIND等基准测试了多种动作空间，但多数方法论文假设固定、预定义的动作空间，未在不同控制维度上进行测试。
    开放问题:
    - 所报告的性能增益有多少来自世界模型本身，而非规划器、控制器或评估中使用的任务特定先验？
    - 当上下文变量部分可观测或未知时（如真实世界中常见），上下文和物理信息世界模型能否保持其优势？
    - 要证明世界模型能可靠地支持真实机器人下游决策，除仿真视频质量分数外，最低限度的基准要求是什么？
