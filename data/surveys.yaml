  - 'Shared research pattern: Papers combine future visual generation with control
    signals, then evaluate through benchmarks, policy-learning loops, or deployment-style
    metrics such as fidelity, consistency, latency, and generalization.'
  - 'Key differences: The evidence splits among evaluation benchmarks, physics-informed
    robot video synthesis, contextual model-based RL, and autonomous-driving simulation;
    representations range from recurrent state-space models to diffusion and autoregressive
    video generators.'
  - 'Trend evolution: Available top evidence runs from 2022 physical-robot Dreamer
    deployment to 2024-2026 closed-loop driving and video-generation-based world models,
    indicating a frontier shift toward real-time, benchmarked, deployable simulators.'
  - 'Open questions: Whether narrow dataset successes transfer across hardware and
    domains, how to balance long-horizon consistency with visual fidelity and low
    latency, and how missing reproducibility details limit independent verification.'
  related_work_outline_zh:
  - 主流方向：学习式世界模型正被构建为可运行的模拟器与闭环系统，用于具身控制；最强证据集中在驾驶和机器人，以动作条件化未来预测为核心抽象。
  - 研究共性：多数工作将未来视觉生成与控制信号结合，并通过基准、策略学习闭环或部署类指标评测保真度、一致性、延迟和泛化性。
  - 关键差异：证据分为评测基准、物理信息机器人视频合成、上下文模型化强化学习和自动驾驶仿真；表示从循环状态空间模型到扩散与自回归视频生成不等。
  - 趋势演进：现有高证据论文集中在2022年至2026年，从物理机器人Dreamer部署转向闭环驾驶和基于视频生成的世界模型，前沿偏向实时、可评测、可部署模拟器。
  - 开放问题：窄数据集表现能否跨硬件和领域迁移；长时程一致性与视觉保真、低延迟如何平衡；复现细节缺失在多大程度上限制独立验证。
  literature_review:
    line_of_work_matrix:
    - line: Runnable robot-learning and real-world deployment stacks
      what_it_solves: Turning learned dynamics into physical robot loops for online
        learning, video synthesis, and policy training or evaluation without simulators.
      what_remains_open: Only a few robot platforms are covered; cross-hardware generalization,
        optimal hyperparameter settings, and access costs remain unresolved.
    - line: Autonomous-driving and real-time simulation systems
      what_it_solves: Generating action-controlled future scenes for closed-loop driving
        and low-latency serving.
      what_remains_open: Evidence is concentrated on nuScenes; long-horizon, multi-view,
        and sensor-configuration generalization remains under-verified.
    - line: Benchmarked evaluation artifacts for world-model consistency
      what_it_solves: Quantifying spatial or action fidelity with datasets and metrics
        so model behavior becomes comparable.
      what_remains_open: Some benchmarks lack reported experimental results, and cross-team
        independent reproduction has not been demonstrated.
    - line: Contextual and model-based reinforcement with learned simulators
      what_it_solves: Using world models to imagine trajectories for zero-shot or
        sample-efficient policy learning under context or video-generation priors.
      what_remains_open: Evaluation is narrow, assumptions about observable context
        persist, and pretrained video-model biases are inherited.
    consensus:
    - 'Action-conditioned future prediction is a shared abstraction: systems generate
      future observations from control inputs.'
    - Evaluation increasingly uses benchmarks and metrics for controllability, consistency,
      or visual quality, not only downstream task success.
    - World models are treated as runnable artifacts connecting generation with policy
      training, policy evaluation, or closed-loop serving.
    - Several works expose code or dataset signals, but independent reproduction across
      teams and infrastructure remains a verification gap.
    disagreements:
    - 'Representation differs: recurrent state-space models, physics-informed keypoint/depth
      learning, diffusion transformers, and autoregressive frame generation coexist.'
    - 'Supervision and training targets differ: physical-knowledge losses, context-conditioned
      latent dynamics, trajectory-annotated video generation, and motion-reinforced
      losses emphasize different signals.'
    - 'Evaluation target differs: spatial consistency, action fidelity, visual fidelity,
      zero-shot generalization, and real-robot learning speed are each prioritized
      differently.'
    - 'Deployment setting differs: online physical robots without simulators, offline
      benchmark scoring, single-GPU closed-loop driving, and pretrained video-model
      adaptation.'
    open_questions:
    - Can strong nuScenes or CARL results transfer to unseen sensor configurations,
      hardware platforms, and task distributions?
    - How can long-horizon spatial, cross-view, and action consistency be maintained
      without sacrificing visual detail or latency?
    - To what extent do missing limitation details and uneven reproducibility signals
      limit independent verification of system-level gains?
    - What evaluation protocol can compare world-model simulators across driving,
      robotics, and game domains without collapsing into dataset-specific metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的机器人学习与真实世界部署栈
      解决的问题: 将学习到的动态模型接入物理机器人闭环，支持在线学习、视频合成以及策略训练或评测，无需模拟器。
      尚未覆盖: 仅覆盖少数机器人平台；跨硬件泛化、最优超参数和访问成本仍未解决。
    - 路线: 自动驾驶与实时仿真系统
      解决的问题: 生成动作控制的未来场景，用于闭环驾驶和低延迟服务。
      尚未覆盖: 证据集中在 nuScenes；长时域、多视角和传感器配置泛化仍缺乏验证。
    - 路线: 面向世界模型一致性的基准评测工件
      解决的问题: 用数据集和指标量化空间或动作保真度，使模型行为可比较。
      尚未覆盖: 部分基准缺少实验结果；跨团队的独立复现尚未得到证明。
    - 路线: 基于学习模拟器的上下文与模型化强化学习
      解决的问题: 利用世界模型想象轨迹，在上下文或视频生成先验下提升零样本或样本效率策略学习。
      尚未覆盖: 评估范围较窄；上下文可观测假设仍然存在，并继承了预训练视频模型的偏置。
    共识:
    - 动作条件化的未来预测是共同抽象：系统根据控制输入生成未来观测。
    - 评测越来越用基准和指标衡量可控性、一致性或视觉质量，而不是仅看下游任务成功率。
    - 世界模型被当作可运行工件，连接生成、策略训练、策略评估或闭环服务。
    - 多项工作暴露代码或数据集信号，但跨团队和基础设施的独立复现仍是验证缺口。
    分歧:
    - 表示方式不同：循环状态空间模型、物理信息关键点/深度学习、扩散Transformer和自回归帧生成并存。
    - 监督与训练目标不同：物理知识损失、上下文条件潜在动力学、轨迹标注视频生成和运动增强损失侧重不同信号。
    - 评测目标不同：空间一致性、动作保真度、视觉保真度、零样本泛化和真实机器人学习速度被分别强调。
    - 部署场景不同：无模拟器的在线物理机器人、离线基准评分、单GPU闭环驾驶和预训练视频模型适配。
    开放问题:
    - 在 nuScenes 或 CARL 上的强结果能否迁移到未知传感器配置、硬件平台和任务分布？
    - 如何在不牺牲视觉细节或延迟的情况下维持长时程空间、跨视角和动作一致性？
    - 缺失的局限性说明与不一致的复现信号在多大程度上限制系统级成果验证？
    - 何种评测协议能跨驾驶、机器人和游戏域比较世界模型模拟器，而不退化为数据集特定指标？
