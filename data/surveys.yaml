    - 动作表征各异：UWM采用连续动作扩散，Atari世界模型使用离散动作，RoboDreamer采用语言解析的原语。
    - 评测目标分化：驾驶模型关注多视角预测，机器人模型关注任务完成，而基准关注空间或记忆一致性。
    开放问题:
    - 在缺乏严格物理验证指标的情况下，如何确保物理信息驱动的世界模型在长时域推演中保持物理合理性？
    - 在世界模型内部训练的策略能否跨不同机器人本体或驾驶环境迁移，而无需在目标数据上重新训练？
    - 利用无动作视频数据提升世界模型学习的有效方式是什么，与全标注数据相比效果如何？
