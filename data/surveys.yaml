  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video generation world models
    for embodied AI, primarily using diffusion transformers or autoregressive architectures
    to simulate future visual observations for robot manipulation and decision-making.'
  - 'Shared research pattern: Most works view high-fidelity video prediction as a
    proxy for world modeling, conditioning on actions and past frames, then using
    the generated rollouts for planning, policy evaluation, or synthetic data generation.'
  - 'Key differences: Some train unified models from scratch on large-scale robot
    datasets, while others adapt pretrained general video diffusion models via adapters
    or post-training alignment; evaluation targets range from visual quality and action
    alignment to physical plausibility and downstream task performance.'
  - 'Trend evolution: The frontier (2024–2026) is shifting from standalone video prediction
    models toward leveraging large-scale pretrained models and aligning them with
    human preferences or physics constraints through reward-based post-training and
    DPO.'
  - 'Open questions: It remains unclear whether these video models develop an internal
    state representation that supports causal reasoning and long-horizon planning,
    and how to design benchmarks that measure physical persistence and failure modes
    beyond visual fidelity.'
  related_work_outline_zh:
  - 主流方向：构建以动作为条件的视频生成世界模型，主要采用扩散Transformer或自回归架构，为机器人操作和决策模拟未来视觉观测。
  - 研究共性：多数工作将高保真视频预测视为世界模型的代理，以动作和历史帧为条件，然后将生成的轨迹用于规划、策略评估或合成数据生成。
  - 关键差异：部分工作从头训练统一模型，另一些则通过适配器或后训练对齐方式适配预训练通用视频模型；评测目标从视觉质量、动作对齐到物理合理性和下游任务性能不等。
  - 趋势演进：2024–2026年前沿从独立视频预测模型转向利用大规模预训练模型，并通过基于奖励的后训练和DPO将其与人类偏好或物理约束对齐。
  - 开放问题：这些视频模型是否发展出支持因果推理和长时域规划的内部状态表示，以及如何设计衡量物理持久性和故障模式的基准，仍是未解问题。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video diffusion world models for robotic manipulation
      what_it_solves: Generating visually plausible future frames conditioned on robot
        actions and past observations, enabling policy learning, evaluation, and model-based
        planning in contact-rich tasks.
      what_remains_open: Physical plausibility is not guaranteed; models often fail
        on long-horizon consistency and causal reasoning; evaluation is dominated
        by visual fidelity metrics rather than task success or robustness.
    - line: Unified video-action pretraining with heterogeneous architectures
      what_it_solves: Leveraging large-scale, multi-embodiment robot datasets to learn
        joint representations of video and action, allowing flexible downstream use
        as dynamics model, policy, or inverse model.
      what_remains_open: Generalization to unseen embodiments and tasks is limited;
        the models still rely on visual quality heuristics and lack explicit state
        abstraction, making transfer to new physical environments unreliable.
    - line: Adaptation of pretrained video diffusion models to world models
      what_it_solves: Enabling closed-source or generic video models to serve as action-conditioned
        world models without full finetuning, using lightweight adapters and learned
        masks to inject action control.
      what_remains_open: Requires domain-specific action-labeled video datasets; the
        adapted model inherits biases of the original pretrained model and may not
        capture fine-grained physical interactions.
    - line: Alignment of video world models via human preferences and physics
      what_it_solves: Improving physical realism, task logic, and visual quality of
        generated rollouts by post-training with multi-dimensional reward models or
        DPO-based discriminators.
      what_remains_open: Alignment depends on costly human preference data and has
        only been shown on narrow manipulation tasks; the reward models themselves
        may not generalize to new tasks or embodiments.
    - line: Conceptual taxonomy and mechanistic analysis of video generation as world
        models
      what_it_solves: Organizing existing video generation methods into categories
        of state construction (implicit/explicit) and dynamics modeling, and identifying
        gaps between current models and classic world-model theory.
      what_remains_open: The taxonomy is not yet validated by empirical evidence showing
        that it changes model design; benchmarks that test physical persistence and
        causal reasoning are still absent from the proposed evaluation framework.
    consensus:
    - High-fidelity video generation conditioned on actions is a promising, but currently
      insufficient, route to world models for embodied AI.
    - Current models lack an explicit state representation; they are stateless and
      rely on short-term visual consistency rather than latent physical understanding.
    - Evaluation must move beyond visual fidelity metrics (e.g., FVD, PSNR) to include
      task success, physical plausibility, and causal reasoning.
    - Large-scale pretraining on diverse robot data improves video generation quality
      and controllability, but does not automatically close the gap to true world
      models.
    disagreements:
    - Approaches differ on whether to train world models from scratch on domain-specific
      data or to adapt large pretrained video models with minimal additional training.
    - 'The choice of generative backbone varies: some use diffusion transformers,
      others use autoregressive or masked autoregressive models, and there is no consensus
      on which is better for physical reasoning.'
    - 'Alignment strategies diverge: some focus on reward-based optimization with
      human preferences, others on DPO-based physics alignment, and some rely on heuristic
      verifiers for test-time selection.'
    - The survey paper argues that current video models are fundamentally stateless
      and thus not true world models, while the method papers implicitly treat video
      generation as sufficient for downstream decision-making.
    open_questions:
    - Can video generation models develop an internal state representation that supports
      causal reasoning and long-horizon planning, or will architectural changes be
      required?
    - How should benchmarks be designed to evaluate physical persistence, object permanence,
      and counterfactual reasoning in video-based world models?
    - What is the minimal amount of domain-specific data needed to adapt a general
      video model to a reliable world model for a new robot or task?
    - Do improvements in visual quality and alignment metrics translate to better
      real-world robot policy performance, or are they uncorrelated?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 以动作为条件的视频扩散世界模型，用于机器人操作
      解决的问题: 根据机器动作和历史观测生成视觉上合理的未来帧，从而支持接触丰富任务中的策略学习、评估和基于模型的规划。
      尚未覆盖: 物理合理性无法保证；模型在长时域一致性和因果推理上经常失败；评估主要依赖视觉保真度指标而非任务成功率或鲁棒性。
    - 路线: 统一视频-动作预训练及异构架构
      解决的问题: 利用大规模多实体机器人数据集学习视频与动作的联合表示，灵活地作为动力学模型、策略或逆模型使用。
      尚未覆盖: 对未见实体和任务的泛化能力有限；模型仍依赖视觉质量启发式方法，缺乏显式状态抽象，导致向新物理环境的迁移不可靠。
    - 路线: 将预训练视频扩散模型适配为世界模型
      解决的问题: 使闭源或通用视频模型无需完全微调即可作为动作条件世界模型，通过轻量适配器和学习到的掩码注入动作控制。
      尚未覆盖: 需要领域特定的动作标注视频数据集；适配后的模型继承了原始预训练模型的偏差，可能无法捕获细粒度物理交互。
    - 路线: 通过人类偏好和物理约束对齐视频世界模型
      解决的问题: 通过多维度奖励模型或基于DPO的判别器进行后训练，提升生成轨迹的物理真实性、任务逻辑和视觉质量。
      尚未覆盖: 对齐依赖于昂贵的人类偏好数据，且仅在狭窄的操作任务上得到验证；奖励模型本身可能无法泛化到新任务或实体。
    - 路线: 视频生成作为世界模型的概念分类与机制分析
      解决的问题: 将现有视频生成方法按状态构建（隐式/显式）和动态建模进行归类，并识别当前模型与经典世界模型理论之间的差距。
      尚未覆盖: 该分类法尚未被实证证明能改变模型设计；测试物理持久性和因果推理的基准在提出的评估框架中仍然缺失。
    共识:
    - 基于动作的高保真视频生成是通往具身AI世界模型的一条有前景但当前不足的路径。
    - 当前模型缺乏显式状态表示；它们是无状态的，依赖短期视觉一致性而非潜在物理理解。
    - 评估必须超越视觉保真度指标（如FVD、PSNR），纳入任务成功、物理合理性和因果推理。
    - 在多样化机器人数据上进行大规模预训练可提升视频生成质量和可控性，但不会自动填补与真正世界模型之间的鸿沟。
    分歧:
    - 方法在是从头训练领域特定世界模型，还是用最少额外训练适配大型预训练视频模型上存在分歧。
    - 生成主干选择各异：有的使用扩散Transformer，有的使用自回归或掩码自回归模型，尚无共识哪种更有利于物理推理。
    - 对齐策略不同：有的侧重基于人类偏好的奖励优化，有的依赖基于DPO的物理对齐，还有的采用启发式验证器进行测试时选择。
    - 综述论文认为当前视频模型本质上是无状态的，因此不是真正的世界模型，而方法论文则隐含地将视频生成视为足以支持下游决策。
    开放问题:
    - 视频生成模型能否发展出支持因果推理和长时域规划的内部状态表示，还是需要架构上的改变？
    - 如何设计基准来评估基于视频的世界模型中的物理持久性、物体恒存性和反事实推理？
    - 将通用视频模型适配为可靠的新机器人或任务世界模型所需的最小领域特定数据量是多少？
    - 视觉质量和对齐指标的提升是否能转化为真实世界机器人策略的更好性能，还是两者无关？
