  related_work_outline_zh:
  - 主流方向：证据集中在面向机器人操作的动作条件视频世界模型，理论通过状态构建、动态建模和对齐假设表达。
  - 研究共性：论文将世界模型形式化为观测与动作上的条件生成模型，并通过轨迹质量、规划或验证器锚定推理进行评估。
  - 关键差异：架构与动作注入方式不同，包括统一扩散、掩码自回归或适配器修改预训练视频扩散；监督与评测目标从视觉保真到物理合理性、测试时空间推理不等。
  - 趋势演进：2024-2026年证据显示从适配/预训练走向后训练对齐、物理合理性基准和机制分类；更早年份未在 top 证据中直接体现。
  - 开放问题：形式化假设是否匹配真实模型行为、奖励或验证器信号能否预测失败、分类法是否真正改变设计或评测，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent and under which
        assumptions claims about state and dynamics hold.
      what_remains_open: Whether formal state/dynamics conditions match empirical
        behavior of stateless video generators in realistic settings.
    - line: Conditional generation and action-dynamics modeling
      what_it_solves: Provides mechanisms for action-conditioned video prediction
        and policy/forward/inverse dynamics as a shared world-model abstraction.
      what_remains_open: Direct evidence that these mechanisms transfer across embodiments,
        domains, and tasks, and that missing failure modes are characterized.
    - line: Alignment and verifier-grounded guarantees
      what_it_solves: Uses reward modeling, preference post-training, or test-time
        assertions to align world-model outputs with physical realism, task logic,
        or spatial reasoning.
      what_remains_open: Calibration and scaling of reward/verifier signals, especially
        on benchmarks where consistent improvement is not observed.
    - line: Conceptual taxonomy and evaluation boundaries
      what_it_solves: Organizes video-generation-as-world-model work by state construction
        and dynamics modeling, and argues for functional benchmarks.
      what_remains_open: Whether taxonomy-driven functional benchmarks alter model
        design and evaluation beyond visual fidelity metrics.
    consensus:
    - 'World models are treated as action-conditioned generative systems whose intended
      output is more than a single image: future observations, trajectories, or decision-relevant
      dynamics.'
    - Visual fidelity alone is not accepted as sufficient evidence; recent evidence
      adds physical plausibility, task logic, causality, or verifier-grounded rewards.
    - Pretrained video generators can be reused for world modeling through adapters
      or post-training, but formal guarantees and failure boundaries remain under-specified.
    disagreements:
    - 'Representation differs: one line learns unified video-action diffusion, another
      uses masked autoregressive prediction, another adapts closed-source video diffusion
      with masks.'
    - 'Control differs: some methods inject action per frame or per block; others
      treat action and video with independent diffusion timesteps or spatial action
      conditioning.'
    - 'Evaluation target differs: improvements are reported on visual quality, policy
      correlation, planning IoU, physical plausibility, trajectory consistency, or
      spatial benchmark accuracy.'
    - 'Signals differ: train-time preference alignment is contrasted with test-time
      verifier selection; one test-time assertion method improves one benchmark but
      fails to scale on another.'
    open_questions:
    - Which formal assumptions are violated when current stateless video generators
      are used as world models?
    - Can reward or verifier signals be calibrated to predict downstream decision-making
      or simulation failures rather than local visual quality?
    - Do functional benchmarks for persistence and causality actually change model
      design, or only evaluation vocabulary?
    - How does post-training alignment transfer beyond contact-rich manipulation to
      unseen embodiments and domains?
    - Where are the missing direct validations for scaling-law and formal-guarantee
      claims in this frontier?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么状态与动态，以及相关主张在哪些假设下成立。
      尚未覆盖: 形式条件是否符合真实设置中无状态视频生成器的经验行为。
    - 路线: 条件生成与动作-动态建模
      解决的问题: 以动作条件视频预测或策略/前向/逆动态作为共享抽象，提供世界模型的生成机制。
      尚未覆盖: 这些机制跨本体、领域和任务迁移的直接证据，以及对未记录失败模式的刻画。
    - 路线: 对齐与验证器锚定的保证
      解决的问题: 通过奖励建模、偏好后训练或测试时断言，对齐世界模型输出与物理真实性、任务逻辑或空间推理。
      尚未覆盖: 奖励/验证器信号的校准与缩放，尤其在改进不一致的基准上。
    - 路线: 概念分类与评测边界
      解决的问题: 按状态构建与动态建模组织视频生成即世界模型的工作，并主张功能性基准。
      尚未覆盖: 分类驱动的功能基准是否真正改变模型设计与评测，而非仅改变评测术语。
    共识:
    - 世界模型被视作动作条件生成系统，输出未来观测、轨迹或决策相关动态，而非单个图像。
    - 视觉保真不是充分证据；近期证据补充物理合理性、任务逻辑、因果性或用验证器锚定的奖励。
    - 预训练视频生成器可通过适配或后训练复用于世界模型，但形式化保证和失败边界仍不明确。
    分歧:
    - 表示方式不同：一条路线学习统一视频-动作扩散，另一条使用掩码自回归预测，还有路线用掩码适配闭源视频扩散。
    - 动作控制不同：有的方法逐帧或逐块注入动作，有的通过独立扩散时间步或空间动作条件实现控制。
    - 评测目标不同：证据分别报告视觉质量、策略相关性、规划IoU、物理合理性、轨迹一致性或空间基准精度。
    - 监督信号不同：训练时偏好对齐与测试时验证器选择形成对比；某测试时断言方法在一个基准改善，在另一个基准未能一致缩放。
    开放问题:
    - 当前无状态视频生成器被用作世界模型时，违反了哪些形式化假设？
    - 奖励或验证器信号能否被校准以预测下游决策或模拟失败，而非仅评估局部视觉质量？
    - 面向持久性和因果性的功能基准是否真正改变模型设计，还是只改变评测词汇？
    - 后训练对齐如何从接触丰富操作迁移到未见本体和领域？
    - 该前沿中缺失缩放规律与形式化保证的直接验证，具体验证缺口在哪里？
