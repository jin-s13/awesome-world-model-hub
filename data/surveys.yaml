  related_work_outline:
  - 'Mainstream direction: recent work centers on generative world models using transformer
    or diffusion backbones for video prediction in driving, robotics, and embodied
    settings, increasingly unified with actions, physics, or memory and consistency
    evaluation.'
  - 'Shared research pattern: methods combine self-supervised visual representation
    with auxiliary tasks such as mask reconstruction, context conditioning, depth/keypoint
    learning, or action diffusion to improve long-horizon, spatial, and control consistency.'
  - 'Key differences: choices differ in representation and loss, supervision signal,
    domain, and evaluation target, including recurrent state-space/VAE, diffusion
    transformer, compositional primitives, unified video-action diffusion, visual
    fidelity, zero-shot dynamics, and memory/action-control benchmarks.'
  - 'Trend evolution: available high-ranked evidence spans 2023-2026 and moves from
    efficient stochastic world models for model-based reinforcement learning toward
    video-action diffusion and physics-informed embodied models, with 2025-2026 benchmarks
    formalizing consistency and action-control evaluation.'
  - 'Open questions: generalization beyond seen contexts, primitives, or domains;
    separation of model gains from data scale and downstream planner/controller contributions;
    standard metrics for memory and spatial consistency; and verification gaps where
    limitations or benchmark results are not fully reported.'
  related_work_outline_zh:
  - 主流方向：近期工作集中在以Transformer或扩散为骨干的生成式世界模型，用于驾驶、机器人和具身场景的视频预测，并越来越多地与动作、物理或记忆/一致性评测结合。
  - 研究共性：方法通常将自监督视觉表示与掩码重建、上下文条件、深度/关键点、动作扩散等辅助任务结合，以改进长时域、空间和控制一致性。
  - 关键差异：在表示与损失、监督信号、领域和评测目标上有差异，例如循环状态空间/VAE、扩散Transformer、组合原语、统一视频-动作扩散，以及视觉保真、零样本动力学、记忆/动作控制等不同侧重。
  - 趋势演进：可用高排名证据集中在2023-2026年，从高效随机世界模型用于基于模型的强化学习，走向视频-动作扩散与物理信息具身模型，2025-2026年基准开始正式化一致性与动作控制评测。
  - 开放问题：跨未见上下文/原语/领域的泛化、模型收益与数据规模和下游规划器/控制器贡献的分离、记忆与空间一致性标准指标，以及部分工作未充分报告局限或基准结果的验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative diffusion/transformer video world models for embodied and driving
        scenes
      what_it_solves: Predict long-horizon or multi-view video from context, language,
        or prior frames, often via mask reconstruction, compositional primitives,
        or physics side tasks.
      what_remains_open: Transfer beyond reported driving and robot datasets is uncertain;
        visual fidelity, physical plausibility, and unseen primitive or context generalization
        remain not fully isolated.
    - line: Stochastic state-space/transformer world models for model-based reinforcement
        learning
      what_it_solves: Learn compact latent dynamics for imagined rollouts and policy
        improvement under limited environment interactions.
      what_remains_open: Evidence is limited to narrow suites such as CARL tasks or
        Atari 100k; assumptions like observable context and separation from planner
        or controller gains need more testing.
    - line: Unified video-action diffusion pretraining and action-interface models
      what_it_solves: Couple visual generation with action prediction or control in
        one model, enabling policy, forward or inverse dynamics, and action-free video
        pretraining.
      what_remains_open: Cross-action-space generalization, whether gains come from
        pretraining scale, modality timestep control, or downstream policy adaptation
        remains unclear.
    - line: Physics-informed embodied world models
      what_it_solves: Add depth and keypoint dynamics tasks to improve 3D geometric
        consistency and physical plausibility in generated robot videos.
      what_remains_open: Ablations isolating physics tasks from architecture and data
        scale, robustness beyond simulated or diverse robotic scenarios, and downstream
        policy evaluation remain partially open.
    - line: Benchmark and evaluation protocols for spatial, memory, and action-control
        consistency
      what_it_solves: Provide datasets and metrics to measure loop and spatial consistency,
        memory consistency, and action control in open-domain world models.
      what_remains_open: Some benchmark papers do not report baseline model results;
        metric validity, real-world relevance, and scalability beyond Minecraft or
        video scenes need further evidence.
    consensus:
    - Recent world-model methods favor generative video and dynamics prediction with
      transformer or diffusion components and auxiliary self-supervised tasks.
    - There is convergence toward unifying visual generation with action, control,
      context, or physics signals rather than keeping dynamics prediction separate
      from decision-making.
    - Evaluation is expanding from per-frame visual quality or task score toward long-horizon,
      spatial, memory, and action-control consistency.
    - Papers commonly release code or datasets, while limitation reporting and ablation
      evidence remain inconsistent.
    disagreements:
    - 'Representation and loss differ: recurrent state-space or variational models,
      diffusion transformers, compositional language-primitive factorizations, and
      unified video-action diffusion.'
    - 'Supervision signals differ: observable context variables, language instructions,
      action-video pairs, or auxiliary depth and keypoint physics tasks.'
    - 'Evaluation targets differ: game benchmark performance, driving video prediction,
      robot video plans and execution, and open-domain memory or action-control benchmarks.'
    - 'Interaction settings differ: some learn policies inside imagined rollouts,
      some pretrain on robot datasets for downstream control, and some define benchmark-only
      protocols without reported policy results.'
    - 'Domain assumptions differ: known context values, predefined language primitives,
      shared or varied action spaces, and simulation-only versus real dataset evaluation.'
    open_questions:
    - Can context- and composition-based world models generalize to unseen context
      values, primitives, or domains beyond the limited CARL, RT-X, driving, and Minecraft
      evidence?
    - How much of reported improvement comes from model architecture versus data scale,
      auxiliary tasks, pretraining, or downstream planners and controllers?
    - What standardized metrics can reliably compare spatial consistency, memory consistency,
      and action control across video world models without overfitting to pixel-level
      or scene-specific cues?
    - 'Where are the verification gaps: several top-ranked papers have empty limitations
      or no experimental results in the abstract, so missing baselines, ablations,
      and robustness evidence need follow-up.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式扩散/Transformer视频世界模型（用于具身与驾驶场景）
      解决的问题: 从上下文、语言或先前帧预测长时域或多视角视频，常通过掩码重建、组合原语或物理辅助任务实现。
      尚未覆盖: 在已报告的驾驶/机器人数据集之外的迁移尚不确定；视觉保真、物理合理性及未见原语/上下文的泛化未被充分隔离。
    - 路线: 基于随机状态空间/Transformer的世界模型用于基于模型的强化学习
      解决的问题: 学习紧凑潜在动力学，用于想象轨迹和有限交互下的策略改进。
      尚未覆盖: 证据限于CARL任务或Atari 100k等较窄套件；可观测上下文假设及与规划器/控制器收益的分离仍需检验。
    - 路线: 统一视频-动作扩散预训练与动作接口模型
      解决的问题: 将视觉生成与动作预测/控制耦合在单一模型中，支持策略、前向/逆向动力学或无动作视频预训练。
      尚未覆盖: 跨动作空间泛化、收益是否来自预训练规模、模态时间步控制或下游策略适配仍未明确。
    - 路线: 物理信息具身世界模型
      解决的问题: 增加深度和关键点动力学任务，以改进生成机器人视频中的三维几何一致性和物理合理性。
      尚未覆盖: 将物理任务与架构/数据规模分离的消融、模拟/多样机器人场景之外的鲁棒性、下游策略评估仍部分开放。
    - 路线: 面向空间、记忆和动作控制一致性的基准与评测协议
      解决的问题: 提供数据集和指标，衡量开放域世界模型的循环/空间一致性、记忆一致性和动作控制。
      尚未覆盖: 部分基准论文未报告基线结果；指标有效性、真实世界相关性及超出Minecraft/视频场景的可扩展性需要进一步证据。
    共识:
    - 近期世界模型方法倾向于使用Transformer或扩散组件配合自监督辅助任务进行生成式视频/动力学预测。
    - 正在从把动力学预测与决策分离，转向将视觉生成与动作、控制、上下文或物理信号统一。
    - 评测正从单帧视觉质量或任务得分扩展至长时域、空间、记忆和动作控制一致性。
    - 论文通常发布代码或数据集，但局限报告和消融不一致。
    分歧:
    - 表示与损失不同：循环状态空间/变分模型、扩散Transformer、组合语言原语分解以及统一视频-动作扩散。
    - 监督信号不同：可观测上下文变量、语言指令、动作-视频对或深度/关键点等辅助物理任务。
    - 评测目标不同：游戏基准表现、驾驶视频预测、机器人视频计划/执行以及开放域记忆/动作控制基准。
    - 交互设置不同：有些在想象轨迹中学习策略，有些在机器人数据集上预训练以供下游控制，有些仅定义基准协议而未报告策略结果。
    - 领域假设不同：已知上下文值、预定义语言原语、共享或多样动作空间，以及仿真与真实数据集评估的差异。
    开放问题:
    - 基于上下文和组合的世界模型能否泛化到CARL、RT-X、驾驶和Minecraft证据之外的未见上下文、原语或领域？
    - 报告的性能提升有多少来自模型架构，而不是数据规模、辅助任务、预训练或下游规划器与控制器？
    - 哪些标准化指标能可靠比较视频世界模型的空间一致性、记忆一致性和动作控制，同时避免过拟合像素级或场景特定线索？
    - 验证缺口在哪里：若干高排名论文缺少局限或在摘要中未报告实验结果，基线、消融和鲁棒性证据需要后续补充。
