  related_work_outline_zh:
  - 主流方向：生成式视频模型正被适配或后训练为动作条件化的世界模型，用于具身控制，并逐步强调物理合理性与决策可用性，而非仅关注帧质量。
  - 研究共性：论文将动作与视觉动态耦合到统一生成模型中，并通过下游规划、策略或物理/任务对齐基准来评估生成轨迹，而不只使用视觉指标。
  - 关键差异：训练范式包括统一扩散、掩码自回归、适配器适配和流模型对齐；监督信号包括动作标签、人类偏好、DPO判别器与测试时验证器；评测对象和基准各异。
  - 趋势演进：从2024年关注动作-帧对齐和模型适配，转向2025-2026年的对齐、物理基准、测试时验证和机制分类；可见证据集中在当前前沿，难以推断更早年份趋势。
  - 开放问题：形式化状态/动态假设是否与经验模型行为一致；缩放规律能否预测迁移和失败；新功能基准与验证器是否真正预测下游策略改进。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics and policy pretraining
      what_it_solves: Learning future visual rollouts from robot action and observation
        data to support policy learning, forward/inverse dynamics, and planning.
      what_remains_open: Whether generated rollouts remain physically and causally
        consistent beyond training domains and can predict real downstream policy
        performance.
    - line: Adaptation and efficient dynamics modeling
      what_it_solves: Reusing pretrained video generation or autoregressive models
        for world-model simulation with fewer parameters, labels, or faster inference.
      what_remains_open: Closed-model dependence, domain-specific action-labelled
        data needs, and trade-offs between visual controllability and physical fidelity.
    - line: Alignment, verification, and reward-based evaluation
      what_it_solves: Post-training or test-time mechanisms to align generated trajectories
        with physical realism, task logic, human preference, or spatial assertions.
      what_remains_open: Verifier calibration, benchmark consistency, and whether
        alignment signals transfer across settings without an information bottleneck.
    - line: Conceptual taxonomies and evaluation foundations
      what_it_solves: Organizing video world models into state construction and dynamics
        modeling categories and motivating functional benchmarks.
      what_remains_open: Whether the taxonomy changes model design or evaluation practice,
        and lack of direct empirical validation for its proposed boundaries.
    consensus:
    - The field is converging on action-conditioned video generation as a pre/post-training
      formulation of world models for embodied decision-making.
    - Visual realism alone is an insufficient target; physical plausibility, action
      alignment, trajectory consistency, and task usefulness must be explicitly evaluated.
    - Large robot/video pretraining and explicit action conditioning are repeatedly
      associated with better generalization or control over imitation-only or non-conditioned
      generation.
    - There is a shared turn toward functional or physical benchmarks, not purely
      reconstruction or view quality metrics.
    disagreements:
    - 'Generative formulation differs: unified diffusion timesteps, masked autoregression,
      adapter-based modification of pretrained models, and flow-based world models
      with reinforcement-learning alignment.'
    - 'Supervision and alignment signals differ: action-labelled demonstrations, human
      preference reward, DPO with decoupled discriminators, and test-time spatial
      assertion verifiers.'
    - 'Evaluation targets differ: some work prioritizes policy/planning correlation
      in manipulation simulators, while others target zero-shot physical plausibility
      or spatial reasoning benchmark gains.'
    - 'Deployment assumptions differ: methods assume different levels of access to
      pretrained model internals or action-labelled adaptation data.'
    open_questions:
    - Do the formal state/dynamics distinctions in the taxonomy correspond to measurable
      gaps in real-world model behavior?
    - Can scaling behavior observed for visual quality or model size predict failure
      modes and transfer to unseen robot/scene combinations?
    - Which functional benchmarks or verifier designs actually track downstream policy
      and planning improvement across domains?
    - How much of the missing formal guarantees or scaling evidence is a verification
      gap from incomplete limitation, code, dataset, and metric details rather than
      confirmed absence?
