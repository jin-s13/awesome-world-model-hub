  related_work_outline:
  - 'Mainstream direction: The central movement is toward formalizing video generation
    models as world models through explicit state construction, dynamics modeling,
    and action conditioning, while shifting evaluation from visual fidelity to functional
    benchmarks like physical plausibility and causal reasoning.'
  - 'Shared research pattern: Papers consistently treat world models as action-conditioned
    video generators, propose architectural improvements for action-frame alignment,
    and attempt to close the gap between generated videos and physically plausible
    rollouts via post-training or test-time alignment.'
  - 'Key differences: Methods diverge in state representation (implicit context management
    vs. explicit latent compression), action integration (unified diffusion, frame-level
    modules, adapter-based conditioning), and alignment strategy (multidimensional
    reward modeling, DPO, or test-time verifiers).'
  - 'Trend evolution: From 2022 to 2026, the focus moved from building fine-grained
    video prediction models toward large-scale pretraining, then toward physics alignment
    and mechanistic analysis, indicating a maturation from generative quality to foundational
    theory and reliability.'
  - 'Open questions: Whether formal state definitions can be realized in current architectures,
    whether scaling laws predict failure modes, how to evaluate causal reasoning without
    human preference data, and why test-time scaling faces information bottlenecks
    in spatial reasoning.'
  related_work_outline_zh:
  - 主流方向：围绕通过显式状态构建、动态建模和动作条件化将视频生成模型形式化为世界模型，同时将评估从视觉保真度转向物理合理性和因果推理等功能基准。
  - 研究共性：各工作一致将世界模型视为动作条件视频生成器，提出改进动作-帧对齐的架构，并尝试通过后训练或测试时对齐弥合生成视频与物理合理轨迹之间的差距。
  - 关键差异：方法在状态表示（隐式上下文管理 vs. 显式潜在压缩）、动作整合（统一扩散、帧级模块、适配器条件化）和对齐策略（多维奖励建模、DPO、测试时验证器）上存在分歧。
  - 趋势演进：从2022到2026年，焦点从构建细粒度视频预测模型转向大规模预训练，再转向物理对齐和机制分析，显示出从生成质量到基础理论和可靠性的成熟。
  - 开放问题：形式化状态定义能否在当前架构中实现，缩放律是否预测失败模式，如何在没有人类偏好数据的情况下评估因果推理，以及为何测试时缩放在空间推理中遭遇信息瓶颈。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent (state, dynamics)
        and under which assumptions the generated behavior aligns with physical reality,
        using taxonomies like implicit/explicit state construction.
      what_remains_open: Whether the formal conditions match empirical model behavior
        in realistic settings, and whether the taxonomy changes how researchers evaluate
        or design models.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size, data, test-time compute, or objectives
        to expected improvements in visual quality and controllability; some evidence
        shows quality scales with model size.
      what_remains_open: Direct validation that claimed scaling laws predict failures,
        transfer, and causal reasoning capabilities; test-time scaling for spatial
        reasoning currently shows inconsistent benefits and an information bottleneck.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into structured categories
        such as state construction (implicit/explicit) and dynamics modeling (knowledge
        integration, architectural reformulation), and advocates for functional benchmarks.
      what_remains_open: Whether these taxonomies influence practical model design
        and evaluation, and whether they can guide the development of models that
        genuinely exhibit persistence and causality.
    consensus:
    - Video generation models used as world models lack explicit state representations,
      creating a gap with classical world-model theory.
    - Evaluation must move beyond visual fidelity to test physical persistence, causal
      reasoning, and action-conditioned consistency.
    - Action conditioning is essential for decision-making, and frame-level alignment
      improves control and realism.
    - Post-training or alignment stages (e.g., RL, DPO, test-time verification) are
      necessary to suppress unphysical behaviors.
    disagreements:
    - 'State representation: implicit context management (e.g., large transformer
      memories) versus explicit latent compression (e.g., learned compact priors).'
    - 'Alignment mechanism: online reward-based RL post-training versus offline preference
      optimization (DPO) versus test-time verifier selection.'
    - 'Training paradigm: end-to-end unified pretraining on diverse robot data versus
      adapting frozen pretrained video models with lightweight adapters.'
    - 'Evaluation target: multidimensional alignment (physical realism, task logic,
      visual quality) versus single-dimension visual or spatial reasoning benchmarks.'
    open_questions:
    - How can formal state definitions be instantiated in current diffusion or autoregressive
      architectures to guarantee long-term causal consistency?
    - Do scaling laws for model size or test-time compute reliably predict improvements
      in physical plausibility and failure recovery?
    - What are the minimal supervision signals needed for physical alignment without
      expensive human preference datasets?
    - Why does test-time scaling with current world models fail to improve fine-grained
      spatial reasoning, and what architectural changes would remove this information
      bottleneck?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么（状态、动态）以及在哪些假设下生成行为与物理现实一致，使用隐式/显式状态构建等分类法。
      尚未覆盖: 形式条件是否符合真实场景中的经验模型行为，以及该分类法是否改变研究者的评估或设计方式。
    - 路线: 缩放规律与保证
      解决的问题: 将模型大小、数据、测试时计算或目标与视觉质量和可控性的预期改进联系起来；有证据表明质量随模型大小扩展。
      尚未覆盖: 直接验证所声称的缩放规律能预测失败、迁移和因果推理能力；测试时缩放对空间推理目前显示出不一致的收益和信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为结构化类别，如状态构建（隐式/显式）和动态建模（知识整合、架构重构），并倡导功能基准。
      尚未覆盖: 这些分类法是否影响实际的模型设计和评估，以及能否指导开发真正具备持久性和因果性的模型。
    共识:
    - 用作世界模型的视频生成模型缺乏显式状态表示，与经典世界模型理论存在差距。
    - 评估必须超越视觉保真度，测试物理持久性、因果推理和动作条件一致性。
    - 动作条件化对决策至关重要，帧级对齐提高了控制力和真实感。
    - 需要后训练或对齐阶段（如RL、DPO、测试时验证）来抑制非物理行为。
    分歧:
    - 状态表示：隐式上下文管理（如大Transformer记忆）对比显式潜在压缩（如学习的紧凑先验）。
    - 对齐机制：基于奖励的在线RL后训练对比离线偏好优化（DPO）对比测试时验证器选择。
    - 训练范式：在多样化机器人数据上端到端统一预训练对比使用轻量适配器适配冻结的预训练视频模型。
    - 评估目标：多维对齐（物理真实性、任务逻辑、视觉质量）对比单一维度的视觉或空间推理基准。
    开放问题:
    - 形式化状态定义如何在当前扩散或自回归架构中实例化，以保证长期因果一致性？
    - 模型大小或测试时计算的缩放律是否能可靠预测物理合理性和故障恢复的改进？
    - 在不依赖昂贵人类偏好数据集的情况下，实现物理对齐所需的最小监督信号是什么？
    - 为何当前世界模型的测试时缩放未能改善细粒度空间推理，哪些架构变化能消除这一信息瓶颈？
