        与开放域视频中的空间、记忆和动作控制评测。
      尚未覆盖: 环境规则、目标、动作空间或用户交互变化时的泛化仍待解决；长期记忆一致性和跨动作评测仍不充分。
    共识:
    - 世界模型被用作视觉控制与策略学习的学习式预测仿真器，而非仅用于生成媒体。
    - 多数工作将预测模型与动作、语言、上下文、物理或掩码重建等结构化条件结合，以提升任务相关预测与控制。
    - 评测逐渐纳入任务特定基准与指标，如零样本泛化、空间一致性、记忆一致性和动作控制，而不只看视觉保真度。
