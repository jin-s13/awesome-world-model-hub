  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models for embodied control,
    especially robot manipulation, built on diffusion transformers or masked autoregressive
    video prediction (e.g., UWM, IRASim).'
  - 'Shared research pattern: Use predicted future frames as learned dynamics, explicitly
    align actions to frames, and evaluate through visual quality, downstream policy/planning
    utility, and increasingly physical or task-oriented criteria.'
  - 'Key differences: Conditioning and adaptation mechanisms differ across unified
    diffusion, frame-level action injection, learned adapter masks, and masked autoregression;
    supervision differs across dynamics/imitation, human-preference reward, DPO, and
    test-time verifiers; evaluation spans robot manipulation, gaming, and spatial
    reasoning.'
  - 'Trend evolution: Within the top-ranked 2024-2026 evidence, the field moves from
    controllable action-conditioned generation toward unified pretraining, reward/physics
    alignment, zero-shot benchmark design, and mechanistic taxonomy; older years are
    present in the span but do not surface in this evidence set.'
  - 'Open questions: Whether action-frame alignment transfers across embodiments and
    tasks; whether visual or human alignment implies physical persistence and causal
    reasoning; why verifier-based test-time scaling fails on some spatial-reasoning
    benchmarks; and how formal state/dynamics taxonomies can become functional evaluations.
    Missing code/data signals remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：以动作条件化的视频世界模型为主，面向机器人操作等具身控制，常见扩散Transformer或掩码自回归视频预测（如 UWM、IRASim）。
  - 研究共性：用预测未来帧学习动力学，显式对齐动作和帧，并以视觉质量、策略/规划效用及物理或任务指标做评测。
  - 关键差异：条件化与适配机制不同，包括统一扩散、帧级动作注入、学习掩码适配和掩码自回归；监督信号不同，包括动力学/模仿、人类偏好奖励、DPO和测试时验证器；评测场景涵盖机器人操作、游戏和空间推理。
  - 趋势演进：在排名靠前的2024-2026证据中，从可控动作条件生成走向统一预训练、奖励/物理对齐、零样本基准和机制化分类；较早年份虽在时间跨度内，但未在该证据中体现。
  - 开放问题：动作-帧对齐能否跨本体和任务迁移；视觉或人类对齐是否对应物理持续性和因果推理；基于验证器的测试时缩放为何在部分空间推理基准失效；形式化状态/动态分类如何转成功能评测。代码/数据信号缺失仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video diffusion world models
      what_it_solves: Generating controllable future video frames from action trajectories
        for robot manipulation and decision-making.
      what_remains_open: Whether frame-level action alignment generalizes across embodiments
        and tasks; some methods require closed-source pretrained video models or scarce
        action-labeled data.
    - line: Unified and heterogeneous pretraining for action-video dynamics
      what_it_solves: Pretraining over diverse robot observations, actions, tasks,
        and embodiments to enable fast, controllable video simulation and policy learning.
      what_remains_open: Direct evidence on downstream policy reliability and failure
        modes is limited; several limitation sections are empty, leaving robustness
        boundaries unclear.
    - line: Reward and physics alignment of embodied video world models
      what_it_solves: Improving physical plausibility, task consistency, and visual
        quality of generated rollouts through human-preference reward models or DPO-based
        post-training.
      what_remains_open: Reported evaluations are concentrated in contact-rich manipulation;
        human preference supervision may be subjective and expensive, and generalization
        to other domains is undemonstrated.
    - line: Test-time verification and spatial reasoning over world-model rollouts
      what_it_solves: Selecting helpful imagined views or trajectories by grounding
        test-time rewards in frame-anchored assertions, aiming to improve spatial
        reasoning.
      what_remains_open: Verifier calibration and action biases persist; on some spatial-reasoning
        benchmarks no verifier gives consistent scaling because imagined views form
        an information bottleneck.
    - line: Mechanistic taxonomy of video generation as world models
      what_it_solves: Organizing explicit/implicit state construction and dynamics
        modeling, and arguing for functional benchmarks beyond visual fidelity.
      what_remains_open: The taxonomy is conceptual and lacks new experiments; it
        does not yet show that the categories change model design or evaluation outcomes.
    consensus:
    - Video generation models can serve as learned world models when conditioned on
      actions and evaluated through downstream control or reasoning tasks.
    - Visual quality alone is insufficient; evaluation should include task utility,
      physical plausibility, trajectory consistency, or causal/spatial behavior.
    - Explicit action-frame alignment is a core mechanism for producing useful, controllable
      future rollouts.
    - Current methods remain constrained by data, evaluation domain, and verifier
      or reward reliability.
    disagreements:
    - 'Conditioning mechanisms differ: unified modality diffusion, frame-level action
      injection, learned adapter masks over pretrained video models, and masked autoregression.'
    - 'Supervision differs: dynamics/imitation objectives, human preference reward
      alignment, DPO-based physics alignment, and test-time verifier rewards.'
    - 'Evaluation targets differ: policy correlation and manipulation planning, physical
      plausibility and trajectory consistency, spatial reasoning benchmark accuracy,
      and video-generation speed/controllability.'
    - 'Deployment domains differ: robot manipulation datasets, video game and real-world
      robotics adaptation, contact-rich manipulation, and spatial reasoning tasks.'
    open_questions:
    - Can action-conditioned video world models trained on manipulation data transfer
      to new embodiments, tasks, or domains beyond contact-rich settings?
    - Does optimizing human preference or visual quality produce causal persistence
      and physical reasoning, or are these only correlated in current benchmarks?
    - Why does verifier-based test-time scaling improve one spatial-reasoning benchmark
      but fail to show consistent scaling on another, and what component causes the
      information bottleneck?
    - Can conceptual state/dynamics taxonomies be translated into functional benchmarks
      that distinguish world models from stateless video generators?
    - Several top papers have weak or absent code/dataset artifact signals; how much
      of the reproducibility gap is a documentation issue rather than a methodological
      one?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件化的视频扩散世界模型
      解决的问题: 从动作轨迹生成可控的未来视频帧，用于机器人操作和决策。
      尚未覆盖: 帧级动作对齐能否跨本体和任务泛化；部分方法依赖闭源预训练视频模型或稀缺的动作标注数据。
    - 路线: 动作-视频动态的统一与异构预训练
      解决的问题: 在多样机器人观测、动作、任务和本体上预训练，实现快速、可控的视频仿真和策略学习。
      尚未覆盖: 下游策略可靠性和失效模式的直接证据有限；部分局限性字段为空，鲁棒边界不清晰。
    - 路线: 具身视频世界模型的奖励与物理对齐
      解决的问题: 通过人类偏好奖励模型或DPO后训练，提升生成轨迹的物理合理性、任务一致性和视觉质量。
      尚未覆盖: 评估集中在接触丰富操作；人类偏好监督主观且成本高，其他领域泛化未见展示。
    - 路线: 世界模型轨迹的测试时验证与空间推理
      解决的问题: 通过帧锚定的空间断言为测试时奖励提供依据，选择有用视图或轨迹以改进空间推理。
      尚未覆盖: 验证器校准和动作偏差仍存在；部分空间推理基准上，想象视图形成信息瓶颈，验证器缩放不一致。
    - 路线: 视频生成作为世界模型的机制化分类
      解决的问题: 整理隐式/显式状态构建与动力建模，并倡导超越视觉保真度的功能基准。
      尚未覆盖: 分类为概念性工作，缺少新实验；尚未证明分类能改变模型设计或评测结果。
    共识:
    - 视频生成模型在动作条件化和下游控制/推理评估下，可作为学习的世界模型。
    - 仅靠视觉质量不够，评测应包含任务效用、物理合理性、轨迹一致性或因果/空间行为。
    - 显式动作-帧对齐是产生有用、可控未来轨迹的核心机制。
