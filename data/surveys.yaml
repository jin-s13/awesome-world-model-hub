  related_work_outline_zh:
  - 主流方向：证据集中在世界模型研究，特别是生成式视频世界模型和自动驾驶世界模拟，并由综述/分类法论文组织该领域。
  - 研究共性：将未来状态生成、场景一致性、可控性以及从模拟到规划统一为世界模型问题。
  - 关键差异：在单一 next-token 生成与分解式 latent/primitive/global-state 架构、仅仿真与真实/闭环评测、概念框架与开源系统之间存在分歧。
  - 趋势演进：从 2023 年交通仿真，到 2024 年 Sora 式生成式世界模型，再到 2025-2026 年持久 4D 状态、细粒度控制、实时开源系统与评测分类法。
  - 开放问题：分类法框架是否经实证验证，未见 primitive 组合/视线外动态能否泛化，以及开环基准与闭环部署如何对齐。
  literature_review:
    line_of_work_matrix:
    - line: Survey and taxonomy synthesis for world-model research
      what_it_solves: Organizes fragmented design choices, generative methods, and
        evaluation dimensions into a structured research map.
      what_remains_open: Whether the proposed taxonomies follow systematic inclusion
        criteria and produce empirically validated, comparable evaluation prescriptions.
    - line: Generative video world models with compositional control
      what_it_solves: Synthesizes future video from language, goals, ego-motion, object
        dynamics, or human pose while maintaining temporal consistency.
      what_remains_open: Generalization to unseen primitive combinations or domains
        is limited; real-world execution and detailed limitation evidence are often
        missing.
    - line: Persistent-state and out-of-sight simulation
      what_it_solves: Extends video world models beyond visible frames by maintaining
        global static 3D background and dynamic entities that evolve when unobserved.
      what_remains_open: LiveBench is newly introduced, but robustness, scaling, and
        compatibility with existing video world-model metrics have not been established.
    - line: Autonomous driving world models and multi-agent traffic simulation
      what_it_solves: Unifies traffic behavior simulation, motion prediction, perception,
        and planning through configurable agent policies or next-token generation.
      what_remains_open: Closed-loop real-world validation and the gap between open-loop
        metrics and decision-ready driving remain unresolved.
    - line: Open-source world-model systems
      what_it_solves: Provides public code/models and real-time generative simulation
        infrastructure for diverse visual environments.
      what_remains_open: Visible evidence is thin on methodology details, baseline
        comparisons, and limitations, making independent verification difficult.
    consensus:
    - Across the packet, researchers treat future-state generation as a core abstraction
      for simulation, prediction, and planning.
    - They agree that controllability—through language, goals, ego-trajectory, human
      pose, or destinations—is necessary for useful generative simulation.
    - Long-horizon temporal consistency and scene coherence are recurring challenges
      across video generation and driving simulation.
    - Evaluation frameworks are recognized as underdeveloped, but few papers provide
      empirical validation for their proposed metrics.
    disagreements:
    - Some approaches factor generation into lower-level primitives, latent representations,
      or global states; others use monolithic end-to-end next-token generation.
    - Some emphasize out-of-sight persistent 4D dynamics, while others remain focused
      on visible-frame future prediction or traffic behavior.
    - 'Evaluation settings differ: simulation-only versus real-world execution, open-loop
      versus closed-loop planning, and newly proposed benchmarks versus established
      datasets.'
    - Some contributions deliver open-source code/models and real-time interaction,
      while others are conceptual taxonomies without implemented evaluation suites.
    - Representation choices differ, including RGB-only, paired RGB and depth, text
      tokens, and position-aware action tokens.
    open_questions:
    - Can compositional world models handle primitives or combinations completely
      unseen during training, beyond the simulation-only results reported?
    - How can out-of-sight dynamics and persistent scene state be evaluated against
      existing scene consistency metrics when LiveBench adoption is still unproven?
    - Which design choices in latent world models for automated driving produce decision-ready
      closed-loop performance rather than only conceptual or open-loop success?
    - Are the proposed evaluation frameworks supported by systematic evidence across
      compatible settings, or do inconsistent datasets and metrics limit cross-paper
      conclusions?
    - What real-world deployment evidence is missing because several top papers lack
      limitations and external validation artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向世界模型研究的综述与分类法综合
      解决的问题: 把分散的设计选择、生成方法和评测维度组织成结构化研究地图。
      尚未覆盖: 分类法是否采用系统纳入标准，并能产生经过实证验证且可比较的评测建议，仍不明确。
    - 路线: 具有组合控制的生成式视频世界模型
      解决的问题: 从语言、目标、自我运动、物体动态或人体姿态合成未来视频，并保持时间一致性。
      尚未覆盖: 对未见 primitive 组合或领域的泛化有限；真实执行与详细局限证据常缺失。
    - 路线: 持久状态与视线外动态模拟
      解决的问题: 通过维护静态 3D 背景和动态实体，在未被观察时继续演化，扩展视频世界模型到可见帧之外。
      尚未覆盖: LiveBench 新引入，但其鲁棒性、可扩展性与既有视频世界模型指标的兼容性尚未确立。
    - 路线: 自动驾驶世界模型与多智能体交通仿真
      解决的问题: 通过可配置智能体策略或 next-token 生成统一交通行为模拟、运动预测、感知与规划。
      尚未覆盖: 闭环真实世界验证，以及开环指标与面向决策的驾驶性能之间的差距仍未解决。
    - 路线: 开源世界模型系统
      解决的问题: 提供公开代码/模型和实时生成式模拟基础设施，覆盖多样视觉环境。
      尚未覆盖: 可见的方法细节、基线比较和局限证据较薄，难以独立验证。
    共识:
    - 证据中的研究将未来状态生成视为仿真、预测和规划的核心抽象。
    - 可控性（语言、目标、自我轨迹、人体姿态或目的地）被普遍视为实用生成式模拟的关键。
    - 长时域时间一致性与场景连贯性是视频生成和驾驶仿真中的共同挑战。
    - 评测框架被认为尚不成熟，但多数论文未对自己提出的指标进行实证验证。
    分歧:
    - 部分方法把生成分解为低级 primitive、latent 表示或全局状态；另一些采用端到端 next-token 生成。
    - 部分强调视线外持久 4D 动态，另一些仍聚焦可见帧未来预测或交通行为。
    - 评测设置不同：仅仿真与真实执行、开环与闭环规划、新提出基准与既有数据集。
    - 部分贡献交付开源代码/模型和实时交互，另一些是未实现评测组件的概念分类法。
    - 表示选择存在差异，包括仅 RGB、RGB 与深度配对、文本 token、位置感知动作 token。
    开放问题:
    - 组合世界模型能否处理训练中完全未见过的 primitive 或组合，而不仅限于已报告的仿真结果？
    - 在 LiveBench 采用尚未被证明的情况下，如何用现有场景一致性指标评估视线外动态与持久状态？
    - 自动驾驶 latent world model 的哪些设计选择能带来面向决策的闭环性能，而不仅是概念性或开环成功？
    - 所提出的评测框架是否由跨兼容设置的系统证据支撑，还是数据集与指标不一致限制了跨论文结论？
    - 由于多篇高排序论文缺少局限说明和外部验证工件，缺少哪些真实部署证据？
