  related_work_outline:
  - 'Mainstream direction: Generative video/diffusion and transformer-based world
    models dominate, with strong focus on embodied agents, driving, and model-based
    RL; evaluation is moving toward diagnostic capability benchmarks.'
  - 'Shared research pattern: Most papers learn predictive dynamics from visual observations
    and connect the learned model to actions or control, using either generative video
    prediction or latent rollout.'
  - 'Key differences: They differ in representation, conditioning, and evaluation
    target: stochastic latent, diffusion, or physics-informed models; context, primitive
    composition, or unified action-video diffusion; task scores or spatial/memory/action
    diagnostics.'
  - 'Trend evolution: Visible top-paper evidence is concentrated in 2023-2026, moving
    from Atari-oriented stochastic world models toward large-scale embodied/driving
    diffusion world models and diagnostic benchmarks by 2025-2026.'
  - 'Open questions: Missing limitation and ablation details leave transfer and credit
    assignment unclear; generalization beyond seen contexts/primitives; standardized
    diagnostic comparison.'
  related_work_outline_zh:
  - 主流方向：生成式视频/扩散和Transformer世界模型占主导，重点关注具身智能、驾驶和基于模型的强化学习；评估正向诊断性基准演进。
  - 研究共性：多数工作从视觉观测中学习预测动力学，并将模型连接到动作或控制，常用生成式视频预测或潜在轨迹推演。
  - 关键差异：表示、条件机制和评估目标不同：随机潜变量、扩散或物理信息模型；上下文、原语组合或统一动作-视频扩散；任务分数或空间/记忆/动作诊断。
  - 趋势演进：可见重要证据集中在2023-2026年，从面向Atari的随机世界模型走向大规模具身/驾驶扩散世界模型，并在2025-2026出现诊断基准。
  - 开放问题：局限性和消融信息缺失使迁移与归因不清；对完全新上下文/原语/动作空间的泛化；诊断基准的标准化比较。
  literature_review:
    line_of_work_matrix:
    - line: Generative dynamics architectures and training objectives
      what_it_solves: Converts visual observations into predictive video or latent
        dynamics via diffusion, masked reconstruction, transformer state-space, or
        physics-informed auxiliary losses.
      what_remains_open: Which representational choices or auxiliary losses transfer
        beyond the tested domain; several reports do not state limitations, leaving
        negative results unclear.
    - line: Contextual and compositional generalization
      what_it_solves: Improves zero-shot or unseen-task prediction by conditioning
        on observable context or decomposing language instructions into reusable primitives.
      what_remains_open: Evaluations cover narrow context sets, simulated execution,
        or seen primitive combinations; entirely novel contexts and primitives remain
        unverified.
    - line: Action-coupled and planning-oriented dynamics learning
      what_it_solves: Links learned dynamics to actions, policies, forward/inverse
        dynamics, or video plans for decision-time use.
      what_remains_open: Attribution between model, planner, and task prior is not
        isolated; action-free video learning and real-robot execution need more evidence.
    - line: World-model evaluation benchmarks and capability diagnostics
      what_it_solves: Measures spatial consistency, memory consistency, and action
        control rather than only aggregate task performance.
      what_remains_open: Some benchmark papers describe construction without full
        experimental findings; comparability across datasets and metrics is still
        open.
    consensus:
    - Recent work converges on learning world dynamics from high-dimensional video
      using generative or sequence models, with actions or context as conditioning
      signals.
    - World models are increasingly expected to support downstream control or policy
      learning through imagined trajectories, video plans, or coupled action diffusion.
    - Evaluation is expanding from single-task scores to diagnostic properties such
      as spatial consistency, memory consistency, and action controllability.
    disagreements:
    - 'Representation differs: stochastic latent state-space models versus deterministic/diffusion
      video prediction versus physics-informed auxiliary learning.'
    - 'Generalization strategy differs: explicit context conditioning versus compositional
      primitive decomposition versus unified modality diffusion.'
    - 'Evaluation target differs: RL benchmark scores, driving/robot video quality
      and downstream execution, or dedicated diagnostic benchmarks for consistency
      and control.'
    - 'Action interface differs: action-conditioned generation, action-free video
      learning via diffusion timesteps, or coupled policy/dynamics models.'
    open_questions:
    - Do auxiliary objectives such as mask reconstruction, depth prediction, or keypoint
      dynamics transfer beyond driving and robot video, or are they domain-specific?
    - Which generalization claims survive when context values are unobserved, primitives
      are wholly novel, or action spaces differ from training?
    - Can diagnostic benchmarks yield standardized, comparable evidence across model
      families, given currently limited experimental reporting?
    - How should future work separate model architecture gains from planner, dataset-scale,
      and implementation choices when limitations and ablations are often unspecified?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式动力学架构与训练目标
      解决的问题: 通过扩散、掩码重建、Transformer状态空间或物理信息辅助损失，将视觉观测转化为预测视频或潜在动力学。
      尚未覆盖: 哪些表示或辅助损失能迁移到已测领域之外尚不清楚；部分报告未说明局限性，负结果不明。
    - 路线: 上下文与组合泛化
      解决的问题: 通过可观测上下文条件或把语言指令分解为可重用原语，改善零样本或未见任务预测。
      尚未覆盖: 评估覆盖上下文较少、仅在仿真执行或只覆盖已见原语组合；全新上下文和原语仍待验证。
    - 路线: 动作耦合与规划导向的动力学学习
      解决的问题: 把学习到的动力学连接到动作、策略、前向/逆动力学或视频规划，以用于决策时刻。
      尚未覆盖: 模型、规划器和任务先验之间的贡献未隔离；无动作视频学习和真实机器人执行的证据仍不足。
    - 路线: 世界模型评估基准与能力诊断
      解决的问题: 衡量空间一致性、记忆一致性和动作控制，而不是只关注聚合任务分数。
      尚未覆盖: 部分基准主要描述构建而缺少完整实验发现；跨数据集和指标的可比性仍未解决。
    共识:
    - 近期工作收敛于用生成式或序列模型从高维视频学习环境动力学，并以动作或上下文作为条件信号。
    - 世界模型越来越需要支持下游控制或策略学习，通过想象轨迹、视频规划或耦合动作扩散实现。
    - 评估正从单一任务分数扩展到空间一致性、记忆一致性和动作可控性等诊断性质。
    分歧:
    - 表示方式不同：随机潜状态空间模型、确定性/扩散视频预测或物理信息辅助学习。
    - 泛化策略不同：显式上下文条件、组合原语分解或统一模态扩散。
    - 评估目标不同：RL任务分数、驾驶/机器人视频质量和下游执行，或专门的一致性/控制诊断基准。
    - 动作接口不同：动作条件生成、通过扩散时间步从无动作视频学习，或策略与动力学混合建模。
    开放问题:
    - 掩码重建、深度预测或关键点动力学等辅助目标能否迁移到驾驶和机器人视频之外的领域？
    - 当上下文不可观测、原语完全陌生或动作空间与训练不同时，泛化声明是否仍然成立？
    - LoopNav、MIND等诊断基准能否在不同模型族之间形成标准化、可比的证据？
    - 在局限性和消融常被省略的情况下，如何分离模型架构增益与规划器、数据规模和实现选择的影响？
