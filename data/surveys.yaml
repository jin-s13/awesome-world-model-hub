  related_work_outline:
  - 'Mainstream direction: Most works embed world models into concrete domains—autonomous
    driving, robotics, and interactive games—using video generation or state prediction
    as the core framework, with diffusion transformers and autoregressive models as
    dominant backbones.'
  - 'Shared research pattern: Pre-training on large-scale domain-specific datasets,
    then fine-tuning or conditioning on actions, language, or context; models are
    evaluated on visual fidelity, policy performance, or downstream task success.'
  - 'Key differences: Some approaches emphasize physical plausibility through auxiliary
    physics tasks, others focus on compositional generalization from language, and
    still others couple action and video generation in a unified model; evaluation
    protocols vary from offline benchmarks to simulated and real-robot rollouts.'
  - 'Trend evolution: From 2015–2022, world models were mostly explored in model-based
    RL for games; 2023–2026 shows a surge in diffusion-based world models for driving
    and robotics, accompanied by new benchmarks for memory, consistency, and action
    controllability.'
  - 'Open questions: No consensus on how to evaluate long-term memory, physical consistency,
    or safety; transfer across embodiments and datasets remains brittle; real-world
    deployment gaps are largely unverified.'
  related_work_outline_zh:
  - 主流方向：多数工作将世界模型嵌入自动驾驶、机器人、交互游戏等具体领域，以视频生成或状态预测为核心框架，扩散Transformer和自回归模型成为主流骨干。
  - 研究共性：在大规模领域数据集上预训练，再通过动作、语言或上下文进行微调或条件化；评估集中在视觉保真度、策略表现或下游任务成功率。
  - 关键差异：部分方法通过辅助物理任务强调物理合理性，部分聚焦语言驱动的组合泛化，还有方法将动作与视频生成耦合在统一模型中；评测方式从离线基准到仿真及真实机器人执行不等。
  - 趋势演进：2015至2022年，世界模型主要在基于模型的强化学习游戏环境中探索；2023至2026年，基于扩散的驾驶与机器人世界模型涌现，并出现针对记忆、一致性和动作可控性的新基准。
  - 开放问题：缺乏对长期记忆、物理一致性和安全性的统一评估标准；跨本体和数据集的迁移仍脆弱；真实世界部署的差距大多未经验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to physical tasks—robotics and contextual
        RL—by learning latent dynamics or generating video plans conditioned on actions,
        language, and physical context.
      what_remains_open: Physical plausibility beyond visual appearance, generalization
        to unseen embodiments and physical properties, and validation on real robots
        remain open; most evidence is from simulation or limited datasets.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon video prediction
        and zero-shot generalization across driving datasets, enabling closed-loop
        simulation and policy evaluation.
      what_remains_open: Alignment between simulation gains and real-world safety
        or operational metrics is unverified; handling rare and adversarial driving
        scenarios is not addressed in current benchmarks.
    - line: Interactive agents and games
      what_it_solves: Building efficient world models that enable fast policy learning
        in Atari or Minecraft, and evaluating spatial consistency and memory over
        long trajectories.
      what_remains_open: Generalization when game rules, goals, or user interactions
        change is not assessed; current benchmarks focus on specific action spaces
        and static environments.
    consensus:
    - World models in applications are predominantly implemented as generative models
      of observations or states, with diffusion and transformer architectures replacing
      earlier recurrent-state-space models.
    - Pre-training on large, domain-relevant datasets (driving logs, robot manipulation
      videos, game play) is a common strategy, followed by fine-tuning or conditioning
      for specific tasks.
    - Evaluation increasingly includes both generation quality and downstream task
      performance, but the metrics and tasks differ widely across domains.
    disagreements:
    - Whether to model physics explicitly through auxiliary tasks or to learn it implicitly
      from data; some works inject depth or keypoint dynamics, while others rely purely
      on RGB video prediction.
    - 'The role of actions: some models only generate observations for planning, while
      others jointly diffuse actions and videos, leading to different trade-offs in
      controllability and flexibility.'
    - Evaluation settings split between offline dataset benchmarks, simulated rollouts,
      and real-robot experiments, making cross-paper comparison difficult and leaving
      real-world safety largely untested.
    open_questions:
    - How can we build a unified benchmark that measures long-term memory, physical
      consistency, and action controllability across diverse embodiments and domains?
    - To what extent do improvements in visual prediction quality translate to better
      policy learning or safer real-world deployment?
    - Can world models extrapolate to unseen physical dynamics, object compositions,
      or environment rules without retraining on each new setting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人、上下文强化学习等物理任务，通过条件化动作、语言和物理上下文来学习潜在动力学或生成视频计划。
      尚未覆盖: 超出视觉外观的物理合理性，对未见本体和物理属性的泛化，以及真实机器人验证仍待解决；多数证据来自仿真或有限数据集。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行多视角、长时域视频预测，在不同驾驶数据集上实现零样本泛化，支撑闭环仿真和策略评测。
      尚未覆盖: 仿真收益与真实安全或运营指标的一致性未经验证；当前基准未涵盖罕见和对抗性驾驶场景。
    - 路线: 交互式智能体与游戏
      解决的问题: 构建高效世界模型，在Atari或Minecraft中实现快速策略学习，并评估长轨迹上的空间一致性和记忆。
      尚未覆盖: 游戏规则、目标或用户交互变化时的泛化能力未被评估；当前基准聚焦于特定动作空间和静态环境。
    共识:
    - 应用中的世界模型主要以观察或状态的生成模型形式实现，扩散和Transformer架构逐渐取代早期的循环状态空间模型。
    - 在大规模领域相关数据集（驾驶日志、机器人操作视频、游戏过程）上预训练，然后针对特定任务进行微调或条件化是常见策略。
    - 评估越来越多地同时包含生成质量和下游任务表现，但各领域的指标和任务差异显著。
    分歧:
    - 是显式建模物理（通过辅助任务注入深度或关键点动力学），还是从数据中隐式学习物理，不同方法选择不同，前者以RoboScape为代表，后者以纯RGB视频预测为代表。
    - 动作的角色：部分模型仅生成观测用于规划，另一些则将动作与视频联合扩散，导致可控性与灵活性的不同权衡。
    - 评测环境分为离线数据集基准、仿真回放和真实机器人实验，难以进行跨论文比较，且真实世界安全性几乎未被测试。
    开放问题:
    - 如何构建一个统一的基准，能够跨多样本体和领域衡量长期记忆、物理一致性和动作可控性？
    - 视觉预测质量的提升在多大程度上能转化为更好的策略学习或更安全的真实部署？
    - 世界模型能否在不重新训练每个新场景的情况下，外推到未见物理动力学、物体组合或环境规则？
