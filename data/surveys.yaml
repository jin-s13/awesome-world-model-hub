  related_work_outline:
  - 'Mainstream direction: Domain-specific generative world models that predict video
    or latent futures conditioned on actions, language, or physics signals, especially
    for driving and robotics; examples include MaskGWM, RoboScape, and UWM.'
  - 'Shared research pattern: Models combine generative sequence modeling, such as
    diffusion, Transformers, or VAEs, with domain signals including actions, language
    instructions, context variables, or physics proxies; evaluation occurs on domain
    benchmarks and datasets.'
  - 'Key differences: Training objectives differ, including mask reconstruction, physics-informed
    depth and keypoints, context-conditioned state-space dynamics, coupled video-action
    diffusion, and language-primitive factorization. Evaluation targets also differ:
    driving scene consistency, zero-shot policy generalization, robot video plausibility,
    and memory/action control.'
  - 'Trend evolution: Evidence shows 2023 efficiency-oriented Atari world models,
    2024 contextual/compositional generalization and robot imagination, then 2025-2026
    large-scale driving/robotics video-action pretraining and open-domain memory,
    spatial, and action-control benchmarks; the trend is toward application-specific
    closed-loop evaluation.'
  - 'Open questions: It remains unclear whether dataset or simulator gains transfer
    across embodiments, datasets, and physical environments; how long-term memory
    and action control persist in open domains; and whether physics-informed generation
    aligns with real-world safety and operational outcomes.'
  related_work_outline_zh:
  - 主流方向：当前主流是面向驾驶与机器人的领域专用生成式世界模型，基于动作、语言或物理信号预测视频/未来状态，例如 MaskGWM、UWM、RoboScape。
  - 研究共性：把扩散、Transformer、VAE 等生成式序列建模与领域任务信号结合，并在领域数据集或基准上评估视觉保真度、可控性、泛化或下游策略效用。
  - 关键差异：训练目标不同，如掩码重建、物理信息深度/关键点、上下文条件状态空间、视频-动作耦合扩散、语言原语组合；评测目标也不同，如场景一致性、策略泛化、视觉/物理合理性、记忆与动作控制。
  - 趋势演进：从 2023 年 Atari 基于模型的强化学习效率，到 2024 年上下文/组合泛化与机器人想象，再到 2025-2026 年大规模机器人/驾驶视频-动作预训练和开放域记忆/空间/动作控制基准，趋势朝向应用闭环评测。
  - 开放问题：数据集或仿真收益能否跨本体、数据集、物理环境迁移？模型能否在开放域保持长期记忆一致性和动作控制？物理信息生成是否与真实安全/运营结果对齐？
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robot or embodied tasks with domain-specific
        language, actions, goals, and physical constraints.
      what_remains_open: Whether improvements transfer across embodiments, datasets,
        institutions, or physical environments; assumptions about observable context
        and seen primitives; limited real-robot evidence.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for long-horizon, multi-view driving scene
        prediction, closed-loop simulation, and policy evaluation.
      what_remains_open: Alignment between simulator/dataset gains and real-world
        safety or operational outcomes; cross-dataset generalization such as nuScenes,
        OpenDV-2K, and Waymo.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments where agents
        act over time, covering policy learning, spatial consistency, and action control.
      what_remains_open: Long-term memory consistency, action control across varied
        action spaces, and connection from open-domain benchmark performance to downstream
        task success.
    consensus:
    - World models are shifting from generic next-frame prediction toward task-conditioned
      generative models that integrate actions, language, context, or physics signals.
    - Application evaluation increasingly considers not only visual fidelity but also
      controllability, spatial or temporal consistency, zero-shot generalization,
      and downstream policy utility.
    - Diffusion, Transformer, and VAE-style architectures with large datasets or benchmarks
      are common enabling choices, often trained with generative or self-supervised
      objectives.
    - Domain-specific states, actions, and constraints are treated as core modeling
      objects, while cross-domain transfer evidence remains limited.
    disagreements:
    - 'Representation: latent state-space dynamics models coexist with video-generation
      diffusion and Transformer architectures.'
    - 'Supervision signal: physics-informed auxiliary tasks, mask reconstruction,
      context conditioning, video-action joint diffusion, and language-primitive factorization
      are used differently across studies.'
    - 'Evaluation target: closed-loop memory/action control, driving scene prediction,
      zero-shot policy generalization, and robot-video physical plausibility are emphasized
      to different degrees.'
    - 'Interaction mode: policy learning from imagined rollouts, goal-conditioned
      video planning, and pass/fail benchmark measurement reflect different assumptions
      about how agents use world models.'
    - 'Deployment setting: simulation-only evaluation and dataset-specific validation
      are common, while evidence for real-world safety or operational alignment varies.'
    open_questions:
    - Do improvements in driving or robot video generation transfer across datasets,
      embodiments, and physical environments?
    - Can current models maintain long-term memory consistency and action control
      across camera viewpoints and varied action spaces?
    - What evidence links simulator or world-model fidelity gains to real-world safety,
      task success, or operational outcomes?
    - Do assumptions such as observable context and seen primitives limit generalization
      to unseen dynamics or novel object-action combinations?
    - How should evaluation balance generation quality against downstream policy learning,
      control performance, and closed-loop usefulness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人或具身任务，融合语言、动作、目标和物理约束。
      尚未覆盖: 改进能否跨本体、数据集、机构或物理环境迁移；可观测上下文和已见原语假设；真实机器人证据有限。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于驾驶中的长时域、多视角场景预测、闭环仿真和策略评测。
      尚未覆盖: 仿真或数据集收益与真实安全/运营结果之间是否一致；跨 nuScenes、OpenDV-2K、Waymo 等数据集的泛化。
    - 路线: 交互式智能体与游戏
      解决的问题: 在智能体需要长期行动的交互环境中建立世界模型，用于策略学习、空间一致性和动作控制。
      尚未覆盖: 长期记忆一致性、跨动作空间的动作控制，以及开放域基准表现到下游任务成功的连接。
    共识:
    - 世界模型正从通用下一帧预测转向任务条件生成模型，整合动作、语言、上下文或物理信号。
    - 应用评测开始同时关注视觉保真度、可控性、时空一致性、零样本泛化和下游策略效用。
    - 扩散、Transformer 和 VAE 式架构配合大规模数据集或基准是常见支撑，生成式或自监督目标被广泛使用。
    - 领域特定的状态、动作和约束成为核心建模对象，但跨领域迁移证据仍然有限。
    分歧:
    - 表示方式：潜状态空间动力学模型与视频生成式扩散、Transformer 架构并存。
    - 监督信号：物理信息辅助任务、掩码重建、上下文条件、视频-动作联合扩散和语言原语分解各有侧重。
    - 评测目标：闭环记忆/动作控制、驾驶场景预测、零样本策略泛化、机器人视频物理合理性等目标不同。
    - 交互模式：想象轨迹上的策略学习、目标条件视频规划、基准通过/失败测量等方式存在差异。
    - 部署场景：仿真为主与真实安全/运营视角之间存在分野；单数据集验证与跨数据集零样本验证也有不同侧重。
    开放问题:
    - 驾驶或机器人视频生成上的提升能否跨数据集、本体和物理环境迁移？
    - 当前模型能否在相机视角变化和不同动作空间下保持长期记忆一致性与动作控制？
    - 什么证据能把仿真或世界模型保真度提升与真实安全、任务成功或运营结果联系起来？
    - 可观测上下文和已见原语假设是否会限制未见动力学或新物体-动作组合的泛化？
    - 评测应如何在生成质量与下游策略学习、控制性能和闭环效用之间取得平衡？
