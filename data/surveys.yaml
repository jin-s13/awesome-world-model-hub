  - 主流方向：动作条件化的生成式视频世界模型主导证据，主要面向具身与机器人任务。
  - 研究共性：将视频生成视为动作条件下的状态与动力学建模，并使用大规模动作-观测数据。
  - 关键差异：条件化架构、适配冻结模型与统一预训练、监督信号和评测目标各不相同。
  - 趋势演进：主要证据集中在2024–2026年前沿，从动作条件化视频生成走向物理对齐、零样本基准和测试时缩放审查。
