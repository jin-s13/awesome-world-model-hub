  related_work_outline:
  - 'Mainstream direction: World model benchmarking is shifting from aggregate performance
    on standard tasks (Atari, Nuscenes) to targeted evaluation of spatial consistency,
    memory, and action controllability in open-ended environments, using custom metrics
    and datasets.'
  - 'Shared research pattern: Every work either introduces a new benchmark with tailored
    metrics (SGCS, memory consistency) or leverages established benchmarks to validate
    novel world model architectures, with a strong emphasis on visualizing and quantifying
    generation quality beyond simple scores.'
  - 'Key differences: Some efforts focus on designing new datasets and metrics for
    specific capabilities like spatial consistency (LoopNav) or memory-action control
    (MIND), while others use existing benchmarks (Atari 100k, CARL) to push model
    performance; the former prioritize evaluation rigor, the latter prioritize model
    innovation.'
  - 'Trend evolution: From 2023-2026, benchmarks have evolved from simple game environments
    (Atari) to complex, embodied, and multi-view scenarios (driving, robotics, Minecraft),
    adding demands for long-horizon consistency, physics realism, and cross-embodiment
    evaluation.'
  - 'Open questions: Are current benchmarks aligned with real-world deployment needs?
    How well do proxy metrics like consistency scores or FID correlate with downstream
    task success? The lack of standardized compute reporting and cross-implementation
    stability remains a verification gap.'
  related_work_outline_zh:
  - 主流方向：世界模型基准测试正从标准任务（Atari、Nuscenes）的聚合性能，转向在开放环境中针对空间一致性、记忆与动作可控性的定向评估，并使用定制指标和数据集。
  - 研究共性：每项工作要么引入带有定制指标（如SGCS、记忆一致性）的新基准，要么利用现有基准验证新型世界模型架构，并强调可视化与量化生成质量，超越简单评分。
  - 关键差异：部分工作专注于设计新数据集和指标，评估特定能力如空间一致性（LoopNav）或记忆-动作控制（MIND），而其他工作则利用现有基准（Atari 100k、CARL）推动模型性能；前者重视评估严谨性，后者重视模型创新。
  - 趋势演进：2023年至2026年，基准从简单游戏环境（Atari）演进到复杂的具身、多视角场景（自动驾驶、机器人、Minecraft），增加了对长时域一致性、物理真实性和跨具身评估的要求。
  - 开放问题：当前基准是否与真实世界部署需求对齐？代理指标（如一致性评分或FID）与下游任务成功之间的相关性如何？缺乏标准化的算力报告和跨实现稳定性仍是一个验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, such as LoopNav's Minecraft navigation loops and MIND's diverse
        video clips with action spaces.
      what_remains_open: Whether the task distribution covers the real-world settings
        where world models are expected to help, e.g., autonomous driving under rare
        events or long-term manipulation tasks.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., Scene Graph Consistency Score (SGCS)
        for spatial invariance, memory consistency and action control metrics in MIND,
        and human-normalized scores in Atari.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; for instance, does better spatial consistency guarantee
        safer navigation?
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines (Atari 100k,
        Nuscenes), artifacts, and reporting conventions; many papers provide code
        and datasets.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets; few papers detail the compute used for
        training, making reproducibility incomplete.
    consensus:
    - World models should be evaluated on their ability to maintain visual and state
      consistency across time and viewpoints, as well as their responsiveness to actions.
    - High-quality, diverse benchmarks are necessary to move beyond simple game environments
      and test generalization to unseen dynamics and scenes.
    - Open-source code, datasets, and evaluation protocols are critical for reproducibility
      and fair comparison.
    disagreements:
    - 'Evaluation focus: some prioritize pixel-level visual fidelity (e.g., DIAMOND,
      MaskGWM) while others emphasize structural consistency through graph-based or
      memory-based metrics (LoopNav, MIND).'
    - 'Metric selection: aggregate human-normalized scores on Atari vs. domain-specific
      consistency scores that may not capture task utility.'
    - 'Task setting: reinforcement learning using world model rollouts (Dreamer, STORM)
      vs. video prediction quality in isolation (RoboScape, UWM), leading to different
      evaluation protocols.'
    open_questions:
    - How can benchmarks be designed to test world models' utility in closed-loop
      decision-making rather than just open-loop prediction quality?
    - To what extent do current metrics measure real-world readiness, and what behavioral
      failures are invisible to them?
    - Can we standardize compute and training budget reporting to ensure that benchmark
      improvements are not merely due to larger resources?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，让世界模型主张具备可比性，例如LoopNav的Minecraft循环导航和MIND的多样化动作空间视频。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的真实场景，如罕见事件下的自动驾驶或长程操作任务。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数（SGCS）用于空间不变性，MIND的记忆一致性和动作控制指标，以及Atari的人类归一化得分。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间的一致性；例如，更好的空间一致性是否保证更安全的导航？
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（Atari 100k、Nuscenes）、工件和报告规范让结果可审计；许多论文提供代码和数据集。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；很少有论文详细说明训练所用算力，导致可复现性不完整。
    共识:
    - 世界模型应根据其跨时间和视角的视觉与状态一致性，以及对动作的响应能力来评估。
    - 高质量、多样化的基准对于超越简单游戏环境、测试对未见动态和场景的泛化至关重要。
    - 开源代码、数据集和评估协议对可复现性和公平比较至关重要。
    分歧:
    - 评估焦点：部分工作优先考虑像素级视觉保真度（如DIAMOND、MaskGWM），其他工作则通过基于图或记忆的指标强调结构一致性（LoopNav、MIND）。
    - 指标选择：Atari上的人类归一化总分与特定领域的一致性评分，后者可能无法反映任务效用。
    - 任务设置：使用世界模型rollout的强化学习（Dreamer、STORM）与孤立的视频预测质量（RoboScape、UWM），导致不同的评估协议。
    开放问题:
    - 如何设计基准来测试世界模型在闭环决策中的效用，而不仅仅是开环预测质量？
    - 当前指标在多大程度上衡量了真实世界就绪性，哪些行为失败对它们是不可见的？
    - 能否标准化算力和训练预算的报告，以确保基准提升不仅仅源于更大的资源？
