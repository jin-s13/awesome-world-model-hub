  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on learning generative world models
    with diffusion or transformer backbones and auxiliary self-supervised objectives,
    then coupling them to action or policy interfaces for control in driving, robotics,
    and embodied settings.'
  - 'Shared research pattern: Papers combine a learned dynamics or video prediction
    component with evaluation that tests generalization, spatiotemporal consistency,
    or downstream policy performance; most treat world models as compact predictors
    for control rather than only video generators.'
  - 'Key differences: Model families differ in representation and supervision—recurrent
    state-space, transformer-VAE, diffusion transformer, and compositional language-parsed
    generators—while evaluation targets range from Atari/CARL policy returns to driving
    video metrics and spatial or memory consistency benchmarks.'
  - 'Trend evolution: The available years are concentrated in 2023–2026; the frontier
    moves from efficient model-based RL world models toward large-scale video/action
    diffusion pretraining and specialized benchmarks for consistency and action control.'
  - 'Open questions: How well reconstruction, physical plausibility, and policy gains
    transfer beyond reported datasets; whether gains come from model, planner, or
    task prior; and how to verify long-term memory consistency and cross-action generalization
    when several abstracts omit limitations or results.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于用扩散或Transformer骨干加自监督辅助目标学习生成式世界模型，并将其连接到动作或策略接口，用于驾驶、机器人和具身场景的控制。
  - 研究共性：论文通常把学习到的动力学或视频预测组件与泛化、时空一致性或下游策略性能评估结合，将世界模型视为面向控制的紧凑预测器，而非单纯的视频生成器。
  - 关键差异：模型族在表示和监督上不同，如循环状态空间、Transformer-VAE、扩散Transformer、基于语言解析的组合生成器；评测目标从Atari/CARL策略回报到驾驶视频指标及空间/记忆一致性基准。
  - 趋势演进：可用年份集中在2023–2026，前沿从高效基于模型的强化学习世界模型，转向大规模视频/动作扩散预训练以及针对一致性和动作控制的专门基准。
  - 开放问题：重建、物理合理性和策略收益能否迁移到报告数据集之外；收益来自模型、规划器还是任务先验；在多个摘要缺失局限或结果时如何验证长期记忆一致性和跨动作泛化。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: 'Turns world-model ideas into concrete representations, losses,
        and training recipes: recurrent state-space priors, transformer-VAE stochastic
        models, diffusion transformers with mask/depth/keypoint auxiliary tasks, compositional
        language-parsed generators, and unified video-action diffusion.'
      what_remains_open: Which representation or auxiliary objective transfers beyond
        the reported task family; whether reported video quality, physical plausibility,
        or policy learning is attributable to the representation rather than surrounding
        system choices.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention and decision-time
        interfaces through imagined rollouts, policies trained on model dreams, video
        plans assembled from language primitives, or coupled action-video diffusion.
      what_remains_open: How much gain comes from the learned model versus the planner
        or controller or task prior; whether simulation-only results transfer to real
        robots and larger unseen action spaces.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects, and introduces benchmarks for spatial consistency,
        memory consistency, and action control in open-domain video.
      what_remains_open: Whether the reported protocols isolate the proposed method;
        LoopNav reports no experimental results in the abstract; several top papers
        provide no limitation text, leaving boundary conditions unverified.
    consensus:
    - World models are moving toward generative sequence or video predictors with
      self-supervised auxiliary signals, including mask reconstruction, depth, keypoints,
      and stochastic latent objectives.
    - 'Downstream control is a recurring motivation: methods evaluate imagined rollouts,
      policy learning, video plans, or coupled action prediction rather than video
      realism alone.'
    - Recent benchmarks explicitly treat temporal stability, spatial consistency,
      and action control as core world-model capabilities, not optional side metrics.
    - Large-scale pretraining on robot, driving, or open-world video is used to improve
      generalization to unseen views, tasks, dynamics, or goals.
    disagreements:
    - 'Representational choices differ: recurrent state-space models, transformer-VAE
      hybrids, diffusion transformers, compositional primitive-based generators, and
      unified video-action diffusion coexist in the evidence.'
    - 'Supervision and conditioning differ: observable context values, language-parsed
      task primitives, physics-inspired depth/keypoint tasks, or mask reconstruction
      enforce different inductive biases.'
    - 'Evaluation targets differ: Atari/CARL policy return, driving video quality
      on NuScenes/OpenDV-2K/Waymo, loop-navigation scene-graph consistency, and memory/action-control
      benchmarks are not directly comparable.'
    - 'Deployment evidence differs: some methods show only simulation results or no
      reported benchmark results, while others report zero-shot multi-dataset driving
      or real-time RL training; several abstracts omit limitations.'
    open_questions:
    - Does improved video prediction or spatial consistency reliably translate into
      better policy learning and real-world control?
    - Which inductive bias—mask reconstruction, context decoupling, physics auxiliary
      tasks, language composition, or coupled action diffusion—best supports long-horizon
      and cross-action generalization?
    - How can world-model benchmarks separate model quality from planner, controller,
      dataset, and evaluation-protocol effects?
    - What are the failure boundaries for unseen action spaces, unseen dynamics, and
      long-term memory consistency when current abstracts often omit limitations or
      result details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思路落实为具体表示、损失和训练配方，包括循环状态空间先验、Transformer-VAE随机模型、扩散Transformer加掩码/深度/关键点辅助任务、基于语言解析的组合生成器，以及视频-动作扩散统一模型。
      尚未覆盖: 哪种表示或辅助目标能迁移到报告任务族之外；视频质量、物理合理性或策略学习收益是否真正来自表示本身，而非周边系统选择。
    - 路线: 规划与动作接口方法
      解决的问题: 通过想象轨迹、在模型梦境上训练策略、由语言原语组装的视频计划，或耦合动作-视频扩散，把学习到的动力学连接到干预和决策时接口。
      尚未覆盖: 收益有多少来自模型本身而非规划器、控制器或任务先验；仿真结果能否迁移到真实机器人及更大的未知动作空间。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素，并提出针对空间一致性、记忆一致性和动作控制的开放域视频基准。
      尚未覆盖: 报告协议是否真正隔离所提方法；LoopNav摘要未报告实验结果；多篇高排序论文未提供局限性文本，边界条件仍未验证。
    共识:
    - 世界模型正转向生成式序列或视频预测器，并引入掩码重建、深度、关键点和随机潜在目标等自监督辅助信号。
    - 下游控制是反复出现的动机：方法评估想象轨迹、策略学习、视频计划或耦合动作预测，而不是仅评估视频真实感。
    - 近期基准明确把时间稳定性、空间一致性和动作控制作为世界模型核心能力，而非可选边侧指标。
    - 大规模机器人、驾驶或开放世界视频预训练被用于改善对未见视角、任务、动力学或目标的泛化。
    分歧:
    - 表示选择不同：循环状态空间模型、Transformer-VAE混合、扩散Transformer、基于组合原语的生成器，以及统一视频-动作扩散在证据中共存。
    - 监督与条件方式不同：可观测上下文值、语言解析的任务原语、物理启发的深度/关键点任务或掩码重建施加了不同归纳偏置。
    - 评测目标不同：Atari/CARL策略回报、驾驶视频质量、循环导航场景图一致性，以及记忆/动作控制基准之间不可直接比较。
    - 部署证据不同：部分方法仅有仿真结果或未报告基准结果，部分报告零样本多数据集驾驶或实时RL训练；多篇摘要缺失局限性说明。
    开放问题:
    - 更好的视频预测或空间一致性是否可靠转化为更好的策略学习和真实控制？
    - 掩码重建、上下文解耦、物理辅助任务、语言组合或耦合动作扩散中，哪种归纳偏置更支持长时域和跨动作泛化？
    - 世界模型基准如何区分模型质量与规划器、控制器、数据集和评测协议的影响？
    - 在当前摘要常缺失局限性或结果细节的情况下，未知动作空间、未知动力学和长期记忆一致的失败边界在哪里？
