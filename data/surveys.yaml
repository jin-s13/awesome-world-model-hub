      解决的问题: 把指令分解为低级原语以合成机器人视频计划，并支持未见组合的仿真执行
      尚未覆盖: 泛化受限于已见原语和准确的语言解析；缺少真实机器人执行证据
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 联合学习RGB视频生成与深度和关键点动力学，以提高机器人视频的视觉保真度和物理合理性
      尚未覆盖: 物理合理性提升能否跨本体或在含噪声的真实机器人环境中迁移，证据有限
    - 路线: 统一视频-动作扩散预训练
      解决的问题: 在单一模型中耦合视频与动作扩散，从大规模机器人数据和未标注动作的视频中学习策略、前向/逆向动力学及视频生成
      尚未覆盖: 真实机器人部署、跨本体迁移和失效边界尚未得到证明
    - 路线: 记忆一致性与动作控制基准
      解决的问题: 通过基于循环和重访场景的开放域交互视频，量化空间一致性和动作控制
      尚未覆盖: 基准分数与下游任务改善或长时域世界模型能力之间的关系尚未证明
