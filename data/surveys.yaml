  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics for robot manipulation
      what_it_solves: Learning predictive action-to-video models that can serve as
        policies, forward dynamics, inverse dynamics, or planners on large robot datasets.
      what_remains_open: Action-frame alignment, cross-embodiment generalization,
        adaptation to closed-source video diffusion, and whether generated dynamics
        match formal world-model assumptions in realistic settings.
    - line: Physics-aware alignment for embodied video world models
      what_it_solves: Post-training generated rollouts toward physical realism, task
        logic, embodiment plausibility, and visual quality through preference or reward
        modeling.
      what_remains_open: Evaluation is concentrated on contact-rich manipulation,
        reward signals depend on subjective human preferences, and transfer to other
        domains remains undemonstrated.
    - line: Conceptual taxonomy and functional evaluation of world models
      what_it_solves: Clarifying world models through state construction, dynamics
        modeling, test-time verification, and training-independent benchmarks beyond
        visual fidelity.
      what_remains_open: Whether taxonomies and verifiers change model design or evaluation,
        and whether current imagined views are calibrated enough to improve fine-grained
        reasoning.
    consensus:
    - Learned action-conditioned video generation is treated as a promising substrate
      for embodied world models.
    - Large-scale robot-video pretraining or small-domain adaptation is a recurring
      ingredient across recent work.
    - Evaluation increasingly includes physical plausibility, action controllability,
      or downstream decision value rather than visual quality alone.
    - There is shared recognition that current models face persistence, causality,
      or information-bottleneck limitations.
    disagreements:
    - 'Generative formulation differs: unified video-action diffusion, heterogeneous
      masked autoregression, adapters on fixed pretrained video diffusion, and flow-based
      reward post-training coexist.'
    - Evaluation target differs across visual fidelity and controllability, physical
      realism and task logic, verifier-selected spatial reasoning, or policy-simulator
      correlation.
    - Action interaction differs through diffusion timesteps, frame-level action modules,
      learned intermediate masks, parallel spatial context blocks, or trajectory selection.
    - 'Data assumptions differ: some adapt closed-source video models with small action-labeled
      datasets, while others require millions of curated robot clips or zero-shot
      protocols.'
    open_questions:
    - Can formal definitions of state, dynamics, and persistence be linked to measurable
      behavior of current video generation models?
    - Will physics-aligned embodied world models generalize beyond contact-rich manipulation
      and the reported benchmarks?
    - Are test-time verifiers or learned reward models calibrated enough to provide
      reliable signals for spatial reasoning and policy improvement?
    - How should future benchmarks separate physical realism, action-conditioned controllability,
      and downstream decision usefulness?
