  related_work_outline:
  - 'Mainstream direction: Generative world-model methods using diffusion Transformers,
    VAEs, and unified video-action models for visual dynamics; two main poles are
    model-based RL from imagined trajectories and embodied/driving video generation,
    with consistency/control benchmarks emerging.'
  - 'Shared research pattern: Learn a dynamics or video model under structured conditioning
    such as context, language primitives, physics signals, mask reconstruction, or
    action diffusion, then evaluate via video prediction, policy learning, or closed-loop
    consistency.'
  - 'Key differences: Representations range from compact latent state-space/VAE models
    to full video diffusion, compositional language-factorized generators, and unified
    video-action diffusion; supervision and evaluation targets include Atari human-normalized
    score, CARL zero-shot generalization, driving/robot video quality, and spatial/memory/action
    consistency.'
  - 'Trend evolution: Evidence spans 2023-2026 within the current frontier: efficient
    Transformer-VAE Atari world models in 2023, contextual and compositional robot/RL
    world models in 2024, then 2025-2026 physics-informed, unified video-action pretraining
    and spatial/memory/action consistency benchmarks.'
  - 'Open questions: Whether gains come from the model or surrounding planner/data/task
    prior; how to handle unobserved context, novel language primitives, and unseen
    action spaces; how to standardize physical plausibility and long-term memory/consistency
    metrics; and how evidence transfers beyond simulation or reported datasets.'
  related_work_outline_zh:
  - 主流方向：世界模型方法集中于扩散Transformer、VAE和统一视频-动作生成式架构，用于视觉动力学、机器人想象和基于模型的强化学习，并出现一致性与控制基准。
  - 研究共性：通过上下文、语言原语、物理信号、掩码重建或动作扩散等结构化条件学习动力学或视频模型，并以视频预测、策略学习或闭环一致性进行评测。
  - 关键差异：表示从紧凑隐状态VAE模型到视频扩散、组合语言生成和视频-动作统一扩散不等；监督与评测目标包括Atari人类标准化得分、CARL零样本泛化、驾驶/机器人视频质量及空间/记忆/动作一致性。
  - 趋势演进：证据集中在2023-2026当前前沿：2023年高效Transformer-VAE Atari世界模型，2024年上下文与组合机器人/RL世界模型，2025-2026年物理信息、统一视频-动作预训练和一致性基准。
  - 开放问题：收益来自模型还是规划器/数据/任务先验；如何处理不可见上下文、新语言原语和未见过动作空间；如何标准化物理合理性、长时记忆一致性指标；证据能否迁移到仿真外或真实部署。
  literature_review:
    line_of_work_matrix:
    - line: Context-conditioned stochastic state-space world models for model-based
        RL
      what_it_solves: Encodes observable context into latent state inference and dynamics
        so policies trained on imagined trajectories generalize zero-shot to unseen
        dynamics.
      what_remains_open: Assumes context values are observable; evidence is limited
        to two CARL tasks, leaving hidden-context settings and broader task families
        unverified.
    - line: Efficient stochastic Transformer-VAE world models for visual control
      what_it_solves: Combines sequence modeling with stochastic latent generation
        to train control policies on imagined rollouts at low interaction budgets.
      what_remains_open: Reported evidence is mainly Atari 100k; no limitations or
        ablation details are present, so domain transfer and contribution isolation
        remain open.
    - line: Diffusion-based video world models with structural reconstruction or physics
        priors
      what_it_solves: Generates long-horizon, multi-view, or physically plausible
        videos for driving and robot scenarios by adding mask reconstruction, temporal
        depth prediction, or keypoint dynamics.
      what_remains_open: Standardized metrics for physical plausibility and cross-scene/dataset
        generalization are not established; several limitations are unreported.
    - line: Compositional and unified video-action generative world models
      what_it_solves: Uses language-derived primitives or independent video/action
        diffusion timesteps to represent policy, forward/inverse dynamics, and video
        generation for robot tasks.
      what_remains_open: Generalization is constrained to seen primitive combinations
        or pre-training/fine-tuning setups; simulation and large-dataset evidence
        do not yet show real-world closed-loop transfer.
    - line: Evaluation benchmarks for spatial, memory, and action-control consistency
      what_it_solves: Operationalizes consistency through loop navigation and scene-graph
        scores, or video suites measuring memory consistency and action control.
      what_remains_open: Evidence is benchmark-centric; adoption across models and
        connection to downstream policy performance are still unexplored.
    - line: Ablation and evidence protocols for world-model method claims
      what_it_solves: Separates architecture contributions from dataset, baseline,
        metric, and implementation choices.
      what_remains_open: The packet often lacks limitations or detailed ablations,
        so contribution separation remains a verification gap.
    consensus:
    - World models are shifting from purely reward-driven dynamics learning toward
      generative video/sequence models that can serve policy learning, dynamics prediction,
      and evaluation.
    - Adding structured conditioning such as context, language primitives, physics
      signals, mask reconstruction, or action diffusion is a shared route for improving
      generalization or realism.
    - Short-horizon visual quality alone is insufficient; evaluation is expanding
      toward long-horizon rollout, zero-shot generalization, spatial consistency,
      memory consistency, and action controllability.
    - Several methods use generated video or imagined trajectories as the environment
      for policy training or evaluation.
    disagreements:
    - 'Representation choices differ: compact latent state-space/VAE models, full
      video diffusion models, compositional language-factorized generators, and unified
      video-action diffusion models.'
    - 'Action interfaces differ: action-conditioned dynamics rollouts, video-only
      generation, and independent video/action diffusion timesteps that can represent
      policy, forward dynamics, or inverse dynamics.'
    - 'Supervision and evaluation targets differ: Atari human-normalized performance,
      zero-shot generalization on CARL, driving video quality, robot visual/physical
      plausibility, and spatial/memory/action-control benchmarks.'
    - Generalization boundaries differ across unseen dynamics/contexts, unseen language
      primitive combinations, unseen viewpoints or datasets, and unseen action spaces.
    open_questions:
    - How much of the reported gain comes from the model representation versus data
      scale, task priors, planners, controllers, or evaluation protocols?
    - Can context-conditioned and compositional methods handle unobserved context,
      entirely novel language primitives, or cross-domain action spaces?
    - What metrics can isolate physical plausibility, spatial/memory consistency,
      and action controllability without being confounded by pixel-level fidelity?
    - Do Atari, driving, Minecraft, and robot evidence transfer to real-world closed-loop
      deployment or to unseen task families?
    - Several top papers omit limitations or ablations; what is the reproducibility
      boundary of their main claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 上下文条件状态空间世界模型
      解决的问题: 将可观测上下文显式注入隐状态推断与动力学，提升策略在未见动力学上的零样本泛化。
      尚未覆盖: 假设上下文可观测；现有证据仅覆盖CARL两个任务，隐藏上下文和更广泛任务族仍未验证。
    - 路线: 高效随机Transformer-VAE世界模型
      解决的问题: 结合序列建模与随机隐变量生成，在低交互预算下用想象轨迹训练控制策略。
      尚未覆盖: 证据主要在Atari 100k；缺少限制与消融说明，领域迁移和方法贡献隔离仍不明确。
    - 路线: 带结构重建或物理先验的扩散式视频世界模型
      解决的问题: 通过掩码重建、时间深度预测或关键点动力学生成长时域、多视角或物理更合理的视频。
      尚未覆盖: 物理合理性、跨场景/数据集泛化的标准化指标尚缺，部分论文未报告限制。
    - 路线: 组合式与统一视频-动作生成世界模型
      解决的问题: 用语言原语或独立视频/动作扩散时间步表示策略、前向/逆动力学和视频生成。
      尚未覆盖: 泛化限于见过的原语组合或预训练/微调设置；仿真和大数据证据尚未证明真实闭环迁移。
    - 路线: 面向空间、记忆与动作控制一致性的评测基准
      解决的问题: 通过循环导航与场景图分数，或视频套件来测量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 证据以基准建设为主；跨模型采用和与下游策略性能的关联仍待探索。
    - 路线: 世界模型方法证据与消融协议
      解决的问题: 区分架构贡献与数据集、基线、指标和实现选择的影响。
      尚未覆盖: 证据包常缺少限制或详细消融，贡献分离仍是验证缺口。
    共识:
    - 世界模型正从单纯奖励驱动动力学学习转向生成式视频/序列模型，可同时服务策略学习、动力学预测和评估。
    - 加入上下文、语言原语、物理信号、掩码重建或动作扩散等结构化条件是提升泛化或真实感的共同方式。
    - 仅看短时视觉质量不够，评测正在扩展到长时展开、零样本泛化、空间一致性、记忆一致性和动作可控性。
    - 多个方法使用生成视频或想象轨迹作为策略训练或评估环境。
    分歧:
    - 表示选择不同：紧凑隐状态VAE模型、全视频扩散模型、组合语言分解生成器、统一视频-动作扩散模型。
    - 动作接口不同：动作条件动力学推演、纯视频生成，以及用独立视频/动作扩散时间步表示策略、前向动力学或逆动力学。
    - 监督与评测目标不同：Atari人类标准化表现、CARL零样本泛化、驾驶视频质量、机器人视觉/物理合理性、空间/记忆/动作控制基准。
    - 泛化边界不同：分别面向未见动力学/上下文、未见语言原语组合、未见视角或数据集、未见动作空间。
    开放问题:
    - 报告增益有多大来自模型表示本身，而非数据规模、任务先验、规划器、控制器或评测协议？
    - 上下文条件与组合方法能否处理不可观测上下文、全新语言原语或跨域动作空间？
    - 哪些指标能隔离物理合理性、空间/记忆一致性和动作可控性，而不被像素级一致性混淆？
    - Atari、驾驶、Minecraft和机器人证据能否迁移到真实闭环部署或未见的任务族？
    - 多个前沿论文未报告限制或消融，其核心结论的可复现边界是什么？
