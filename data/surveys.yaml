  related_work_outline:
  - 'Mainstream direction: Domain-specific generative world models are being built
    for driving, robotics, and interactive agents, with video prediction or latent
    dynamics as the core capability.'
  - 'Shared research pattern: Most works train a world model from video or environment
    interaction, then use it for prediction, policy learning, or evaluation; recent
    work adds action, context, language, or physics conditions.'
  - 'Key differences: They differ in representation, supervision, and evaluation targets,
    including latent state-space models, diffusion transformers, VAE-transformer hybrids,
    coupled video-action diffusion, driving prediction, robot simulation, Atari, Minecraft,
    and memory/action-control protocols.'
  - 'Trend evolution: The evidence moves from efficient reinforcement-learning world
    models on Atari and contextual control toward larger diffusion-based driving and
    robot video models and explicit consistency evaluation.'
  - 'Open questions: Major gaps include real-world transfer, closed-loop safety alignment,
    generalization to unseen dynamics and actions, long-term memory consistency, and
    limited reported limitations or reproducibility details.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互式智能体构建领域专用的生成式世界模型，以视频预测或潜在动力学为核心能力。
  - 研究共性：多数工作从视频或环境交互训练世界模型，再用于预测、策略学习或评测；近期通过动作、上下文、语言或物理条件增强领域适配。
  - 关键差异：表示方式、监督信号和评测目标不同，包括潜在状态空间、扩散Transformer、VAE-Transformer、视频-动作耦合扩散，以及驾驶、机器人仿真、Atari、Minecraft
    和记忆/动作控制协议。
  - 趋势演进：从Atari和上下文控制中的高效强化学习世界模型，转向更大规模的扩散驾驶与机器人视频模型，并引入显式一致性评测。
  - 开放问题：真实环境迁移、闭环安全对齐、对未见动力学和动作的泛化、长期记忆一致性，以及局限性或可复现性证据不足。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models using masked video reconstruction, such as MaskGWM
      what_it_solves: Long-horizon, multi-view driving scene prediction and zero-shot
        transfer across driving datasets.
      what_remains_open: Evidence does not show closed-loop driving policy outcomes
        or real-world safety alignment; cross-view and cross-dataset gains remain
        mostly on benchmark prediction metrics.
    - line: Embodied robot world models with compositional, physics-informed, or coupled
        video-action generation, such as RoboDreamer, RoboScape, and Unified World
        Models
      what_it_solves: Generating robot-centric video or policy representations by
        conditioning on language primitives, physics/depth/keypoint signals, or coupled
        action-video diffusion.
      what_remains_open: Generalization beyond training primitives, physical plausibility
        under unseen embodiments, simulation-only validation, and real robot transfer
        are not fully evidenced.
    - line: Model-based reinforcement learning world models for interactive agents
        and games, such as STORM and cRSSM
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        in visual or contextual reinforcement learning settings.
      what_remains_open: Context observability assumptions, limited task suites, and
        long-horizon or cross-domain generalization remain unresolved.
    - line: Consistency and action-control evaluation for world models, such as LoopNav
        and MIND
      what_it_solves: Quantifying spatial, memory, and action-control consistency
        beyond pixel-level prediction quality in open-domain interactive settings.
      what_remains_open: Dataset and evaluation construction is stronger than reported
        model results; the relationship to real-world task success and long-term closed-loop
        usefulness remains missing.
    consensus:
    - World models are specialized to concrete domains by adding action, context,
      language, physics, or viewpoint conditions rather than only training generic
      next-frame predictors.
    - Evaluation is shifting toward closed-loop, long-horizon, or consistency-based
      protocols that move beyond short-horizon reconstruction quality.
    - Domain knowledge such as parsed language primitives, explicit context values,
      physics-related auxiliary tasks, or designed action spaces is used to improve
      downstream policy learning or diagnostic control.
    disagreements:
    - 'Representation choices differ: latent recurrent state-space models, VAE-transformer
      hybrids, diffusion transformers, and coupled video-action diffusion models are
      all present.'
    - 'Supervision and conditioning differ: some rely on observable context variables,
      others on language-to-primitive parsing, physics/depth/keypoint signals, or
      independent diffusion timesteps for video and action.'
    - 'Evaluation targets differ substantially: driving multi-view prediction, robot
      video planning in simulation, Atari human-normalized scores, Minecraft spatial
      consistency, and memory/action-control protocols each test different world-model
      capabilities.'
    - 'Deployment setting differs: some evidence covers zero-shot dataset transfer,
      some covers simulated robot execution, and some covers evaluation-dataset construction
      with limited model-result evidence.'
    open_questions:
    - How can benchmark-level prediction or consistency gains be connected to closed-loop
      safety and real-world operational outcomes in driving and robotics?
    - Under what conditions do world models generalize to unseen dynamics, novel action
      spaces, or entirely new language primitives beyond combinations seen in training?
    - What metrics best capture long-term memory and spatial consistency without overfitting
      to pixel-level similarity, and how do they trade off with action control?
    - What evidence is still needed to verify that physics, depth, and keypoint auxiliary
      tasks improve physical plausibility and policy quality in real deployment rather
      than only in simulation?
    - Where code, dataset, metric, baseline, or limitation details are missing, which
      reported results should be treated as pending external verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 使用掩码视频重建的驾驶世界模型，如 MaskGWM
      解决的问题: 长时域、多视角驾驶场景预测及跨驾驶数据集的零样本迁移。
      尚未覆盖: 证据未显示闭环驾驶策略结果或真实安全对齐；跨数据集提升仍主要停留在基准预测指标。
