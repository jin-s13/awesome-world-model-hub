    - 'Evaluation target differs: loop-based spatial consistency, driving action fidelity,
      zero-shot policy generalization, or visual-physical plausibility.'
    - 'Deployment setting differs: offline benchmark evaluation, sub-second closed-loop
      serving, and synthetic demonstration generation for policy training.'
    - 'Supervision assumption differs: some systems assume observed context values,
      others require trajectory annotations or rely on pretrained latent action interfaces.'
    open_questions:
