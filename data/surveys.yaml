  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is shifting from visual fidelity
    alone toward closed-loop, task-specific protocols that measure spatial consistency,
    memory, action control, physical plausibility, and downstream policy utility;
    driving, robotics, Minecraft, and Atari are common testbeds.'
  - 'Shared research pattern: Works either introduce datasets and metrics or train
    world models and evaluate them on named benchmarks; they often pair a generative
    model with a standardized protocol and report aggregate scores plus training or
    reproducibility signals.'
  - 'Key differences: Evaluation targets differ across pixel-level video quality,
    scene-graph spatial consistency, action control, memory consistency, zero-shot
    reinforcement-learning generalization, physical plausibility, and downstream robot
    policy utility; supervision also varies from reconstruction to action dynamics
    and physics-informed signals.'
  - 'Trend evolution: Available high-rank evidence spans 2023–2026, within the current
    frontier. Evaluation is becoming more specialized and closed-loop: early Atari
    and reinforcement-learning score-focused results are joined by open-domain memory,
    spatial, action-control, and robotic pretraining benchmarks.'
  - 'Open questions: Which consistency metrics transfer to downstream control, how
    protocols generalize across scenes and action spaces, and whether benchmark rankings
    remain stable across compute and implementation choices remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：世界模型基准测试正从单一视觉保真度转向闭环、任务特定协议，衡量空间一致性、记忆、动作控制、物理合理性和下游策略效用；驾驶、机器人、Minecraft
    和 Atari 是常见测试平台。
  - 研究共性：工作通常要么提出数据集或指标，要么训练世界模型并在现有或新基准上评测；常将生成模型与标准化协议结合，报告聚合分数及训练或复现信号。
  - 关键差异：评测目标在像素级视频质量、场景图空间一致性、动作控制、记忆一致性、零样本强化学习泛化、物理合理性和下游机器人策略效用之间分化；监督信号也覆盖重建、动作动力学和物理信息学习。
  - 趋势演进：可用高排名证据集中在 2023–2026，属当前前沿；评测正变得专门化和闭环化，早期以 Atari 和强化学习分数为中心，之后加入开放域记忆、空间、动作控制基准与机器人预训练评测。
  - 开放问题：一致性指标能否迁移到下游控制、协议如何在场景与动作空间之间泛化、基准排名在不同算力和实现下是否稳定，仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared closed-loop or open-domain tasks and datasets
        for evaluating long-horizon prediction, memory consistency, spatial consistency,
        action control, and cross-scene or cross-view generalization.
      what_remains_open: Domain, scene, and action-space coverage is narrow; loop-navigation
        Minecraft tasks lack reported experimental baselines, and current benchmarks
        do not yet directly connect to downstream control success.
    - line: Metric and stress-test design
      what_it_solves: Designs aggregate and diagnostic metrics beyond visual fidelity,
        including scene-graph consistency, memory and action control, physical plausibility,
        and standard reinforcement-learning scores such as Atari human-normalized
        score.
      what_remains_open: Whether these proxy metrics align with downstream decision
        quality is unverified; pixel-level fidelity, scene-structure, and policy-utility
        metrics have not been unified into a stable evaluation protocol.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common baselines, named datasets, and reproducibility
        signals to make world-model claims auditable across diffusion, transformer,
        VAE, and physics-informed approaches.
      what_remains_open: Benchmark conclusions may shift under different implementations,
        compute budgets, or missing limitation reports; several works evaluate only
        a few tasks or omit formal limitations, leaving ranking stability unverified.
    consensus:
    - Recent world-model evaluations agree that visual fidelity alone is insufficient;
      they add memory, spatial consistency, action controllability, physical plausibility,
      or downstream policy performance as quality signals.
    - There is a shared move toward standardized evaluation protocols and named open
      benchmarks, with common testbeds including Atari 100k, driving video datasets,
      Minecraft navigation, robot video collections, and CARL tasks.
    - Generative world-model families such as diffusion, transformer, VAE, and physics-informed
      video models are compared against baselines or prior state of the art using
      aggregate scores and often report training or inference efficiency.
    - Reproducibility is treated as important through code, dataset, or artifact releases,
      but several works lack full limitation statements or broad baselines, making
      verification uneven.
    disagreements:
    - 'Evaluation targets diverge: some work stresses pixel-level video quality, others
      scene-graph spatial consistency, others memory and action control, and others
      downstream reinforcement-learning or robot policy success.'
    - 'Supervision and representation differ: discrete latent or VAE world models,
      diffusion generation, transformer sequence models, and physics-informed depth
      and keypoint learning are used, with reconstruction, action dynamics, or contextual
      signals.'
    - 'Benchmark scale and domain differ: compact low-data game settings contrast
      with large multi-task robot datasets, driving multi-view video, and open-domain
      navigation; these settings change long-horizon and action-space demands.'
    - 'Metrics are not standardized: aggregate human-normalized scores, training time,
      visual plausibility, scene-graph consistency, and policy transfer do not yet
      lead to a single comparable measurement framework.'
    open_questions:
    - Which memory, spatial, or action-control metrics best predict downstream control
      and policy success across domains?
    - Can current benchmark protocols generalize to unseen scenes, action spaces,
      and longer horizons without overfitting to dataset-specific regularities?
    - How stable are benchmark rankings when backbone implementations, compute budgets,
      and evaluation code change?
    - What level of physical plausibility or video detail is necessary for policies
      trained in world models to transfer to real robotic or driving settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的闭环或开放域任务与数据集，用于评估长时域预测、记忆一致性、空间一致性、动作控制以及跨场景或跨视角泛化。
      尚未覆盖: 领域、场景和动作空间覆盖仍较窄；循环导航类 Minecraft 任务尚无实验基线，现有基准也未直接关联下游控制成功率。
    - 路线: 指标与压力测试设计
      解决的问题: 在视觉保真度之外设计聚合与诊断指标，包括场景图一致性、记忆与动作控制、物理合理性以及 Atari 人类归一化分数等标准强化学习分数。
      尚未覆盖: 这些代理指标是否与下游决策质量一致尚未证实；像素级保真、场景结构和策略效用指标尚未统一为稳定评测协议。
    - 路线: 可比基线与报告规范
      解决的问题: 提供公共基线、命名数据集和可复现信号，使扩散、Transformer、VAE 和物理信息方法的结果可审计。
      尚未覆盖: 结论可能随实现、算力预算或缺失的局限性说明而改变；部分工作只评估少量任务或未正式报告局限，排名稳定性仍待验证。
    共识:
    - 近期世界模型评测普遍认为单一视觉保真度不够，需加入记忆、空间一致性、动作可控性、物理合理性或下游策略表现作为质量信号。
    - 研究共同趋向标准化评测协议和公开命名基准，常见测试平台包括 Atari 100k、驾驶视频数据集、Minecraft 导航、机器人视频集合和 CARL
      任务。
    - 扩散、Transformer、VAE 或物理信息视频模型等生成式世界模型家族通常与基线或前人工作比较，报告聚合分数并常提供训练或推理效率。
    - 通过代码、数据集或工件发布强调可复现性，但部分工作缺少完整局限性说明或广泛基线，验证仍不均衡。
    分歧:
    - 评测目标分化：部分工作偏重像素级视频质量，另一些关注场景图空间一致性、记忆与动作控制，或下游强化学习与机器人策略成功率。
    - 表示与监督不同：离散潜变量或 VAE 世界模型、扩散生成、Transformer 序列模型、物理信息深度与关键点学习并存，监督信号包括重建、动作动力学或上下文。
    - 基准规模与领域不同：低数据游戏设置与大规模多任务机器人数据、驾驶多视角视频、开放域导航形成对比，长时域和动作空间要求不同。
    - 指标尚未统一：人类归一化分数、训练时间、视觉合理性、场景图一致性和策略迁移尚未形成单一可比的评测框架。
    开放问题:
    - 哪类记忆、空间或动作控制指标最能预测跨领域下游控制和策略成功？
    - 当前基准协议能否在未见场景、动作空间和更长时域上泛化，而不只是拟合数据集特定规律？
    - 当骨干实现、算力预算和评测代码变化时，基准排名是否稳定？
