  related_work_outline:
  - 'Mainstream direction: Application work clusters around embodied robotics, driving,
    and interactive environments, with generative video or dynamics world models conditioned
    on actions, language, context, or physics.'
  - 'Shared research pattern: Models learn from visual-action sequences and use generative
    or self-supervised objectives; recent work adds benchmarks for spatial, memory,
    and action-control consistency.'
  - 'Key differences: Representations range from stochastic state-space models to
    diffusion transformers; supervision and evaluation targets differ across simulation,
    video rollout, and policy learning.'
  - 'Trend evolution: The visible frontier moves from sample-efficient game world
    models toward large-scale robot and driving video models, then toward dedicated
    consistency benchmarks in 2025-2026.'
  - 'Open questions: Real-world transfer, long-horizon consistency, unseen context/action
    compositions, and whether benchmark gains align with deployment outcomes remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型正被用于机器人、驾驶和交互环境的视频生成与动作条件控制，近期以扩散Transformer和统一视频-动作预训练为主。
  - 研究共性：从视觉-动作序列中学习可预测、可控制的动态模型，并用生成目标或辅助物理信号提升任务一致性。
  - 关键差异：表示方式、监督信号、评测目标和部署设置不同，包括状态空间模型与扩散模型、仿真评测与闭环控制等。
  - 趋势演进：从样本高效的游戏模型向机器人/驾驶大规模生成世界模型演进，2025年后出现空间、记忆和动作控制基准。
  - 开放问题：真实环境迁移、长时域一致性、不可见动作组合及基准与真实任务结果之间的对齐仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robot imagination, contextual control,
        and policy learning by conditioning video or dynamics generation on language,
        actions, or physical context; examples include RoboDreamer, UWM, cRSSM, and
        RoboScape.
      what_remains_open: Cross-embodiment, cross-dataset, and real-world transfer
        remain under-evidenced; several evaluations are simulation-only or limited
        to a small number of tasks, and unseen primitives or partially observed context
        are unresolved.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Building generative driving world models for long-horizon and
        multi-view scene prediction, including zero-shot evaluation on driving datasets;
        MaskGWM exemplifies this direction.
      what_remains_open: The packet lacks evidence connecting simulator or dataset
        gains to real-world driving safety and operational outcomes, and the representative
        paper provides no visible limitation statement.
    - line: Interactive agent and game environments
      what_it_solves: Using model-based reinforcement learning to learn efficient
        action-conditioned world models that improve policy performance and sample
        efficiency in interactive tasks; STORM is a clear example.
      what_remains_open: Long-term memory consistency, cross-action-space generalization,
        and robustness to rule or goal changes are not fully benchmarked, and limitation
        details are missing from the evidence.
    - line: World-model evaluation benchmarks
      what_it_solves: Creating datasets and metrics to quantify spatial consistency,
        memory consistency, and action control that generic video-generation metrics
        do not capture; LoopNav and MIND represent this line.
      what_remains_open: These benchmarks identify current challenges but do not yet
        establish standardized links to downstream task success, real-world deployment,
        or broad baseline comparability.
    consensus:
    - Application-oriented world models increasingly share a video generation or dynamics
      learning objective trained on visual-action sequences to support prediction
      or policy learning.
    - Controllability is a common focus, with conditioning on actions, language, context,
      or physics to ground generated futures in task-relevant behavior.
    - Dedicated evaluation is emerging as a contribution in its own right, targeting
      spatial coherence, memory, and action control rather than relying only on visual
      quality.
    disagreements:
    - 'Representation differs: stochastic state-space models emphasize sample-efficient
      policy learning, while diffusion transformers emphasize high-dimensional visual
      generation.'
    - 'Supervision differs: approaches use context-conditioned dynamics, compositional
      language-primitive generation, physics-informed auxiliary tasks, or multimodal
      video-action diffusion.'
    - 'Evaluation target differs: some work optimizes Atari human-normalized performance,
      others driving video rollout metrics, robot simulation execution, or memory
      and action benchmark scores.'
    - 'Deployment setting differs: offline video prediction, closed-loop interactive
      control, and simulated policy training make different assumptions about observability
      and environment feedback.'
    open_questions:
    - Does improved simulation or benchmark performance transfer to real robot and
      driving deployments?
    - Can world models generalize to unseen physical contexts, action spaces, or object-action
      compositions beyond training distributions?
    - How should long-horizon spatial consistency, memory consistency, and action
      controllability be jointly improved and measured?
    - What failure modes and boundary conditions remain hidden when application papers
      do not report limitation statements?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型用于机器人想象、上下文控制和策略学习，结合语言、动作或物理上下文生成可执行计划；例如RoboDreamer、UWM、cRSSM和RoboScape。
      尚未覆盖: 跨本体、跨数据集和真实环境迁移证据不足；部分评估仅限于仿真或少量任务，未见原语组合和部分观测上下文仍未解决。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 构建驾驶世界模型进行长时域、多视角场景预测，并在驾驶数据集上进行零样本验证；MaskGWM是代表性工作。
      尚未覆盖: 证据包中缺少仿真或数据集收益与真实驾驶安全、运营结果之间的对齐证据，代表性论文也未提供可见的局限性说明。
    - 路线: 交互式智能体与游戏
      解决的问题: 使用基于模型的强化学习学习高效的动作条件世界模型，以提升交互任务中的策略表现和样本效率；STORM是代表性工作。
      尚未覆盖: 长期记忆一致性、跨动作空间泛化以及规则或目标变化下的鲁棒性尚未被充分基准测试，局限性细节在证据中缺失。
    - 路线: 世界模型评测基准
      解决的问题: 构建数据集和指标以量化空间一致性、记忆一致性与动作控制，弥补通用视频生成指标无法捕捉的能力；LoopNav和MIND代表该路线。
      尚未覆盖: 这些基准揭示了当前挑战，但尚未建立与下游任务成功、真实部署或广泛基线可比较性之间的标准化联系。
    共识:
    - 应用型世界模型越来越多地采用视频生成或动力学学习目标，并在视觉-动作序列上训练以支持预测或策略学习。
    - 可控性是共同关注点，方法通过动作、语言、上下文或物理条件将生成未来与任务相关行为绑定。
    - 专门评测正在成为独立贡献，关注空间一致性、记忆一致性和动作控制，而非仅依赖视觉质量。
    分歧:
    - 表示方式不同：随机状态空间模型强调样本高效策略学习，扩散Transformer强调高维视觉生成。
    - 监督信号不同：方法分别使用上下文条件动力学、组合语言原语生成、物理信息辅助任务或多模态视频-动作扩散。
    - 评测目标不同：有的优化Atari人类归一化表现，有的关注驾驶视频展开指标、机器人仿真执行或记忆与动作基准得分。
    - 部署设置不同：离线视频预测、闭环交互控制和仿真策略训练对可观测性与环境反馈的假设不同。
    开放问题:
    - 仿真或基准上的改进能否迁移到真实机器人和真实驾驶部署？
    - 世界模型能否泛化到训练分布之外的物理上下文、动作空间或物体-动作组合？
    - 如何共同提升和测量长时域空间一致性、记忆一致性与动作可控性？
    - 当应用论文未报告局限性时，哪些失败模式和边界条件仍然被隐藏？
