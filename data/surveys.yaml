  related_work_outline_zh:
  - 主流方向：证据集中在生成式视频、自动驾驶和机器人领域的世界模型，综述类文章给出分类与路线图，方法类工作强化可控性、持久性与交互性。
  - 研究共性：按应用或表示整理世界模型，识别动作条件控制、长时记忆和评测等技术挑战。
  - 关键差异：部分工作综合设计空间或基准，部分面向组合视频、视线外动态、实时开源模拟或在线机器人学习，验证设置不同。
  - 趋势演进：从物理机器人学习扩展到视频世界模型与交互模拟，前沿正走向持久、实时、多模态和开放评测。
  - 开放问题：系统证据、可实现的评测框架、未见原语泛化、真实世界验证和跨基准兼容性仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Survey-driven taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world model research by application scenarios,
        world state evolution, scene modality, and latent design space; converts coverage
        into technical challenges and future directions.
      what_remains_open: Whether the synthesis is backed by systematic inclusion criteria
        rather than selective examples; several survey frameworks remain theoretical
        and lack empirical validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes benchmark, metric, and evaluation choices across
        domains such as interactive video, game engines, autonomous driving, and robotics,
        and exposes open-loop/closed-loop gaps.
      what_remains_open: Proposed evaluation frameworks and metrics are often not
        implemented or tested; compatibility of compared results across different
        settings is unverified.
    - line: Compositional video world modeling for robot imagination
      what_it_solves: Factors language instructions into primitives to generate video
        plans and generalize to unseen objects and actions.
      what_remains_open: Generalization is limited to combinations of seen primitives,
        depends on language parsing accuracy, and is evaluated only in simulation.
    - line: Persistent and controllable generative world simulation
      what_it_solves: Maintains long-horizon scene consistency, out-of-sight entity
        dynamics, real-time interaction, and fine-grained control over ego-motion,
        object dynamics, and human pose.
      what_remains_open: Limitation evidence is often missing; real-world versus curated
        benchmark validation is uneven, and open-source or reproducibility signals
        vary.
    - line: Online world-model learning for physical robots
      what_it_solves: Learns locomotion, manipulation, and navigation directly on
        physical systems from camera images and sparse rewards without simulators
        or resets.
      what_remains_open: Results are demonstrated on a small set of robot platforms
        with shared hyperparameters, and physical access plus training infrastructure
        remains a barrier.
    consensus:
    - World models are treated as a core abstraction for generative video, autonomous
      driving, robotics, and interactive simulation.
    - Controllability, long-horizon consistency, and benchmark-based evaluation are
      recurring priorities across surveys and method papers.
    - Conditioning on language, task descriptions, ego-motion, or sparse features
      is widely used to steer future-state generation.
    - Survey-style contributions converge on identifying action-conditioned generation,
      memory, and evaluation as central technical challenges.
    disagreements:
    - 'Representation choices differ: latent-space frameworks, language-primitive
      composition, global 3D/dynamic entity states, and ego-motion or pose-conditioned
      prediction structure the world state differently.'
    - Validation settings diverge across simulation, benchmark-only comparison, physical
      robot trials, and conceptual framework proposals; some works report limitations
      while others leave them undocumented.
    - 'Evaluation orientation differs: some papers prioritize taxonomy and challenge
      mapping, while others focus on a single capability such as out-of-sight dynamics,
      real-time interaction, or online robot learning.'
    - Reproducibility and artifact availability vary widely, with some works offering
      public code or benchmarks and others providing only descriptive evidence.
    open_questions:
    - Which taxonomic and evaluation frameworks are grounded in systematic evidence
      and can be operationalized for closed-loop testing?
    - How can world models generalize beyond previously seen primitive combinations
      or scenes without brittle language parsing?
    - How well do simulation and curated benchmark results transfer to physical robots
      and real autonomous driving deployments?
    - Can interactive world models jointly achieve long-horizon memory, out-of-sight
      consistency, and real-time action-following under resource constraints?
    - What cross-benchmark compatibility issues prevent meaningful comparison of world
      model capabilities across domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 综述驱动的分类与路线图综合
      解决的问题: 将碎片化的世界模型研究按应用场景、世界状态演进、模态和潜在表示组织起来，提炼技术挑战和未来方向。
      尚未覆盖: 分类综合是否基于系统证据仍不明确；部分综述框架偏理论，缺乏实证验证。
    - 路线: 对比评测综合
      解决的问题: 总结交互视频、游戏引擎、自动驾驶和机器人等领域的基准、指标与评测选择，揭示开环与闭环差异。
      尚未覆盖: 所提评测框架和指标多未实现或测试；不同设置下结果的可兼容性未被验证。
    - 路线: 面向机器人想象的组合视频世界建模
      解决的问题: 将语言指令分解为原语，生成视频计划，并泛化到未见物体与动作组合。
      尚未覆盖: 泛化局限于已见原语组合，依赖语言解析准确性，且仅在仿真中评估。
    - 路线: 持久可控的生成式世界模拟
      解决的问题: 维护长时场景一致性、视线外实体动态、实时交互，并对自我运动、物体动态和人体姿态进行细粒度控制。
      尚未覆盖: 局限性证据常有缺失；真实场景与基准评测验证不均衡，可复现信号不一。
    - 路线: 物理机器人的在线世界模型学习
      解决的问题: 基于摄像头图像和稀疏奖励，在无模拟器、无重置条件下直接学习物理机器人的运动、操纵和导航。
      尚未覆盖: 仅在少量机器人平台上验证，超参数通用性有限，物理访问和训练基础设施仍是门槛。
    共识:
    - 世界模型被视为生成式视频、自动驾驶、机器人和交互模拟中的核心抽象。
    - 可控性、长时一致性和基于基准的评测是综述与方法论文共同关注的方向。
    - 通过语言、任务描述、自我运动或稀疏特征进行条件化，被广泛用于引导未来状态生成。
    - 综述类工作一致将动作条件生成、记忆和评测识别为核心技术挑战。
    分歧:
    - 表示方式不同：潜在空间框架、语言原语组合、全局三维动态实体状态，以及自我运动或姿态条件预测对世界状态的建模方式各异。
    - 验证设置不同：仿真、纯基准比较、物理机器人试验和概念框架提议均有出现，部分工作报告局限性，部分则未记录。
    - 评测取向不同：有些研究侧重分类体系和挑战映射，有些专注单一能力，如视线外动态、实时交互或在线机器人学习。
    - 可复现性和工件可用性差异明显，部分工作公开代码或基准，部分仅提供描述性证据。
    开放问题:
    - 哪些分类与评测框架有系统证据支撑，并能用于闭环测试？
    - 世界模型如何在语言解析不脆弱的条件下泛化到未见原语组合或新场景？
    - 仿真和精选基准的结果能否迁移到物理机器人和真实自动驾驶部署？
    - 交互世界模型能否在资源约束下同时实现长时记忆、视线外一致性和实时动作跟随？
    - 哪些跨基准兼容性问题阻碍了世界模型能力的有意义比较？
