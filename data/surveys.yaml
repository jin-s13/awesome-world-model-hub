  related_work_outline:
  - 'Mainstream direction: Developing and evaluating world models in embodied settings
    (driving, robotics, games) through video prediction, with growing emphasis on
    spatial consistency, memory, and physical plausibility.'
  - 'Shared research pattern: Adopting diffusion transformers or recurrent state-space
    models trained on visual sequences, and quantifying model quality via standardized
    benchmarks or newly proposed stress tests.'
  - 'Key differences: Evaluation domains diverge—Atari, CARL, Minecraft, Nuscenes,
    robotic manipulation—and metrics shift from aggregate game scores to spatial consistency,
    action control, and physics alignment.'
  - 'Trend evolution: The frontier moves from Atari 100k efficiency (2023) to diffusion-based
    world models (2024), then to specialized benchmarks for spatial and memory consistency
    (2025–2026) and physics-informed generation.'
  - 'Open questions: How well proxy metrics (FVD, SGCS, human-normalized score) align
    with downstream decision quality; whether benchmark conclusions remain stable
    across architectures and compute budgets; and how to build a unified evaluation
    protocol across diverse embodiments.'
  related_work_outline_zh:
  - 主流方向：在具身场景（驾驶、机器人、游戏）中通过视频预测构建和评估世界模型，越来越关注空间一致性、记忆和物理合理性。
  - 研究共性：采用扩散Transformer或循环状态空间模型，在视觉序列上训练，并通过标准化基准或新提出的压力测试量化模型质量。
  - 关键差异：评估领域分化——Atari、CARL、Minecraft、Nuscenes、机器人操作——且指标从聚合游戏得分转向空间一致性、动作控制和物理对齐。
  - 趋势演进：前沿从Atari 100k效率（2023）到基于扩散的世界模型（2024），再到针对空间和记忆一致性的专门基准（2025–2026）以及物理信息生成。
  - 开放问题：代理指标（FVD、SGCS、人类归一化得分）与下游决策质量的对齐程度；基准结论在不同架构和算力下是否稳定；如何构建跨多样具身环境的统一评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared evaluation tasks and datasets (e.g., LoopNav,
        MIND) that isolate specific world-model capabilities such as spatial consistency,
        memory, and action control, making claims comparable across methods.
      what_remains_open: Whether the constructed task distribution captures the full
        complexity of real-world settings where world models are deployed, and whether
        the benchmarks generalize to models with different input modalities or action
        spaces.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores—e.g., Scene Graph Consistency Score, memory
        consistency and action control metrics, zero-shot generalization tests, and
        physical plausibility evaluations.
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        decisions users care about (e.g., safety in driving, policy success in robotics);
        the sensitivity of metrics to hyperparameter choices and model scale.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines (e.g., Dreamer,
        STORM, DIAMOND), open-source artifacts, and standardized reporting conventions,
        enabling fair comparison of world-model architectures.
      what_remains_open: Stability of conclusions under different implementations,
        compute budgets, and data pre-processing; the absence of agreed-upon protocols
        for reporting limitations and failure modes.
    consensus:
    - World models should be evaluated on their ability to generate temporally coherent
      and physically plausible video predictions.
    - Standardized benchmarks like Atari 100k and Nuscenes provide a common ground
      for comparing model-based RL and video generation, but they are insufficient
      to capture nuanced capabilities such as spatial memory or long-term consistency.
    - Recent work introduces dedicated benchmarks (LoopNav, MIND) that target specific
      weaknesses—invariant spatial consistency, memory, and action controllability—and
      these complement existing suites.
    - There is growing agreement that visual fidelity alone is not enough; evaluation
      must incorporate downstream task performance or explicit consistency metrics.
    disagreements:
    - 'Evaluation domains differ substantially: some works focus on 2D games (Atari),
      others on 3D driving (Nuscenes, Waymo), robotic manipulation, or open-world
      navigation (Minecraft), making direct cross-paper comparison difficult.'
    - Metrics vary from human-normalized game scores and FVD to task-specific scores
      like SGCS and action control accuracy, reflecting different assumptions about
      what constitutes a good world model.
    - 'The role of physics knowledge is treated differently: one line integrates explicit
      physics-informed losses (RoboScape), while most others rely on data-driven dynamics
      learning without explicit physical constraints.'
    - The definition of generalization spans zero-shot dynamics transfer (cRSSM),
      long-horizon rollout (MaskGWM), and cross-action-space control (MIND), leading
      to different evaluation protocols and stress tests.
    open_questions:
    - How can we design a unified evaluation framework that spans multiple embodiments
      and action spaces while preserving the diagnostic power of specialized benchmarks?
    - What is the minimum set of stress tests required to guarantee that a world model
      is safe and reliable for downstream decision-making in physical systems?
    - How do proxy metrics such as FVD, SGCS, or human-normalized score correlate
      with actual policy performance or human judgments in open-ended tasks?
    - Under what conditions do benchmark rankings remain stable across different model
      sizes, training budgets, and codebases, and how should we report uncertainty
      in these rankings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享的评估任务和数据集（如LoopNav、MIND），隔离空间一致性、记忆和动作控制等特定世界模型能力，使不同方法的主张可比较。
      尚未覆盖: 所构建的任务分布是否覆盖了世界模型实际部署的真实场景复杂程度，以及基准是否能泛化到不同输入模态或动作空间的模型。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用——例如场景图一致性评分、记忆一致性和动作控制指标、零样本泛化测试以及物理合理性评估。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策（如驾驶安全性、机器人策略成功率）之间是否对齐；指标对超参数选择和模型规模的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（如Dreamer、STORM、DIAMOND）、开源工件和标准化报告惯例使结果可审计，支持世界模型架构的公平比较。
      尚未覆盖: 在不同实现、算力预算和数据预处理下结论的稳定性；缺乏公认的报告局限性和失败模式的协议。
    共识:
    - 世界模型应依据其生成时间连贯且物理上合理的视频预测的能力进行评估。
    - 标准化基准如Atari 100k和Nuscenes为比较基于模型的强化学习和视频生成提供了共同基础，但不足以捕捉空间记忆或长期一致性等细微能力。
    - 近期工作引入专用基准（LoopNav、MIND），针对特定弱点——不变性空间一致性、记忆和动作可控性——并补充了现有评测套件。
    - 越来越多共识认为，仅有视觉保真度不够；评估必须包含下游任务性能或显式的一致性指标。
    分歧:
    - 评估领域差异显著：部分工作聚焦2D游戏（Atari），其他聚焦3D驾驶（Nuscenes、Waymo）、机器人操作或开放世界导航（Minecraft），致使跨论文直接比较困难。
    - 指标从人类归一化游戏得分和FVD到任务特定评分如SGCS和动作控制精度各不相同，反映了对何为良好世界模型的不同假设。
    - 物理知识的处理方式不同：一条路线集成显式的物理信息损失（RoboScape），而多数其他工作依赖数据驱动的动力学学习，不施加显式物理约束。
    - 泛化的定义涵盖零样本动力学迁移（cRSSM）、长时域推演（MaskGWM）和跨动作空间控制（MIND），导致不同的评估协议和压力测试。
    开放问题:
    - 如何设计一个统一的评估框架，跨越多个具身环境和动作空间，同时保留专用基准的诊断能力？
    - 保证世界模型在物理系统中安全可靠地用于下游决策所需的最小压力测试集是什么？
    - FVD、SGCS或人类归一化得分等代理指标与开放任务中的实际策略性能或人类判断之间如何关联？
    - 在何种条件下基准排名在不同模型大小、训练预算和代码库中保持稳定，我们应如何报告这些排名中的不确定性？
