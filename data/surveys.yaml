  related_work_outline_zh:
  - 主流方向：以世界模型为焦点的综述与路线图综合占主导，围绕生成式视频、自动驾驶和具身机器人学习构建分类体系、评估框架与开放挑战。
  - 研究共性：将世界模型视为从条件信号生成未来状态的学习模拟器，强调可控性、时间一致性、记忆以及真实世界或闭环评测。
  - 关键差异：一类是概念性分类与评估框架但缺乏实证验证，另一类给出已训练模型和基准；条件信号与状态表示在语言原语、自我运动与姿态、目的地与个性、持久全局状态之间分化。
  - 趋势演进：从2022-2023年的物理机器人学习与驾驶仿真，经过2024年以Sora为中心的综述和组合视频生成，走向2025-2026年的开源、实时、长时程、视线外动态与评估框架。趋势位于当前前沿内。
  - 开放问题：综述的系统筛选标准、分类框架的实证验证、跨仿真与物理环境的可比指标、训练原语或平台之外的泛化，以及缺失代码或基线证据，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world-model work in generative video, autonomous
        driving, and embodied agents into conceptual categories, design dimensions,
        and open research directions.
      what_remains_open: The evidence does not show whether synthesis follows systematic
        literature search or quality filtering; at least one driving taxonomy is presented
        without empirical validation, so its categories remain conceptual.
    - line: Benchmark and evaluation framing
      what_it_solves: Articulates evaluation needs for controllability, out-of-sight
        dynamics, long-horizon consistency, and closed-loop driving through datasets,
        metrics, or evaluation prescriptions.
      what_remains_open: Comparability across proposed benchmarks and metrics is not
        demonstrated; some evaluation prescriptions lack implementation, and several
        artifacts have missing code or baseline details, leaving reproducibility a
        gap.
    - line: World-model method and application studies
      what_it_solves: Provides concrete learned-simulator mechanisms for compositional
        video generation, real-robot online learning, open-source interactive simulation,
        and persistent scene dynamics.
      what_remains_open: Generalization is bounded by training primitives, selected
        robot platforms, or chosen environments; real-robot transfer and limitation
        reporting are uneven, so broader deployment boundaries remain unresolved.
    consensus:
    - World models are treated as learned simulators that generate or predict future
      states rather than as passive representations.
    - Recent evidence increasingly values controllability, temporal consistency, long-horizon
      memory, and task-specific or closed-loop evaluation over static generation quality
      alone.
    - Open-source access, real-time interactivity, and robustness to unseen conditions
      are recurring priorities across methods, surveys, and evaluation discussions.
    disagreements:
    - Contributions range from conceptual taxonomies and evaluation frameworks lacking
      empirical experiments to system and benchmark papers with trained models and
      quantitative results.
    - 'Conditioning and factorization choices differ: language-separated primitives,
      ego-motion and human-pose trajectories, per-agent destination and personality,
      and persistent global state with monitor-based updates.'
    - 'Deployment and evaluation contexts differ: simulated video or control tasks,
      physical robot learning, generative world simulation, and automated driving;
      these settings may not share compatible metrics or assumptions.'
    open_questions:
    - What systematic review or quality-control criteria would make world-model taxonomies
      and surveys evidence-backed rather than selective?
    - How can benchmarks for controllable generation, out-of-sight dynamics, and closed-loop
      driving be empirically aligned and validated across simulation and physical
      settings?
    - Which compositional or state-factorization designs would generalize to unseen
      primitives, tasks, and robot platforms when current evidence only covers seen
      combinations or selected hardware?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将生成式视频、自动驾驶和具身智能体中碎片化的世界模型研究整理为概念类别、设计维度和开放研究方向。
      尚未覆盖: 证据未显示是否采用系统文献检索或质量过滤；至少一个自动驾驶分类框架缺少实证验证，因此其类别仍偏概念化。
    - 路线: 基准与评估框架构建
      解决的问题: 通过数据集、指标或评估建议，明确可控性、视线外动态、长时程一致性和闭环驾驶等评测需求。
      尚未覆盖: 不同基准和指标之间的可比性尚未展示；部分评估方案未实施，若干工件缺少代码或基线细节，可复现性仍是缺口。
    - 路线: 世界模型方法与系统研究
      解决的问题: 提供具体的学习模拟器机制，用于组合视频生成、物理机器人在线学习、开源交互仿真和持久场景动态。
      尚未覆盖: 泛化受训练原语、所选机器人平台或环境的限制；真实机器人迁移和局限报告不一致，更广泛部署边界未解决。
    共识:
    - 将世界模型视为能够生成或预测未来状态的学习模拟器，而不是被动表示。
    - 近期证据越来越重视可控性、时间一致性、长时程记忆和任务特定或闭环评测，而非仅看静态生成质量。
    - 开源访问、实时交互和对未见条件的鲁棒性是方法、综述和评估讨论中反复出现的优先项。
    分歧:
    - 一些是概念性分类和评估框架，缺乏实证实验；另一些是带已训练模型和量化结果的系统或基准工作。
    - 条件信号与分解方式不同：语言分离原语、自我运动与人体姿态轨迹、每个智能体的目的地与个性、以及带监控更新的持久全局状态。
    - 部署与评测环境不同：仿真视频或控制任务、物理机器人学习、生成式世界模拟和自动驾驶；这些设置可能不共享兼容的指标或假设。
    开放问题:
    - 什么样的系统综述或质量控制标准能让世界模型分类和综述建立在证据基础上，而不是选择性示例？
    - 如何让可控生成、视线外动态和闭环驾驶的基准在仿真与物理环境中得到实证对齐和验证？
    - 当前证据仅覆盖已见组合或选定硬件时，哪些组合化或状态分解设计能泛化到未见原语、任务和机器人平台？
