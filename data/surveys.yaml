  related_work_outline:
  - 'Mainstream direction: Research is converging on generative world models that
    combine diffusion or Transformer architectures with self-supervised training objectives
    (mask reconstruction, variational inference, coupled video-action diffusion) for
    video prediction and control, predominantly in autonomous driving and robotic
    manipulation.'
  - 'Shared research pattern: Most works learn a latent dynamics model from visual
    observations and optionally actions, then use it for either video generation,
    planning, or policy learning. They emphasize long-horizon consistency, compositional
    generalization, and sample efficiency, often via pretraining on large-scale datasets.'
  - 'Key differences: Methods diverge in representation (diffusion vs. VAE vs. deterministic
    Transformer), in how they incorporate actions (conditioning vs. coupled diffusion),
    in whether they inject explicit physics knowledge, and in evaluation targets (visual
    fidelity, policy performance, spatial/memory consistency).'
  - 'Trend evolution: Early works (2023) explored Transformer-VAE hybrids; from 2024
    onward, diffusion-based models and physics-informed architectures dominate, and
    dedicated benchmarks (2025–2026) have emerged to measure memory, spatial consistency,
    and action control, indicating a shift from pure generation quality to controlled,
    consistent world simulation.'
  - 'Open questions: How to decouple the contributions of model architecture, training
    objective, and planner; how to guarantee long-term memory and physical consistency
    without privileged information; how to evaluate world models in closed-loop, interactive
    settings; and whether current benchmarks capture the full spectrum of capabilities
    needed for real-world deployment.'
  related_work_outline_zh:
  - 主流方向：研究集中在结合扩散或Transformer架构与自监督训练目标（如掩码重建、变分推断、视频-动作耦合扩散）的生成式世界模型，用于视频预测和控制，主要应用于自动驾驶和机器人操作。
  - 研究共性：多数工作从视觉观测和可选动作中学习潜在动力学模型，然后用于视频生成、规划或策略学习，强调长时域一致性、组合泛化和样本效率，通常通过大规模数据集预训练。
  - 关键差异：方法在表示（扩散 vs. VAE vs. 确定性Transformer）、动作整合方式（条件化 vs. 耦合扩散）、是否注入显式物理知识，以及评估目标（视觉保真度、策略性能、空间/记忆一致性）上存在分化。
  - 趋势演进：早期工作（2023年）探索Transformer-VAE混合架构；从2024年起，基于扩散的模型和物理信息架构占据主导，并出现了专门衡量记忆、空间一致性和动作控制的基准（2025–2026年），表明焦点从纯粹生成质量转向受控、一致的世界模拟。
  - 开放问题：如何解耦模型架构、训练目标和规划器的贡献；如何在没有特权信息的情况下保证长期记忆和物理一致性；如何在闭环、交互式环境中评估世界模型；当前基准是否覆盖了真实部署所需的全部能力维度。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures and training objectives
      what_it_solves: Transforms the abstract world-model idea into concrete representations
        and losses—e.g., diffusion transformers with mask reconstruction, contextual
        VAEs, compositional video generation, or physics-informed keypoint dynamics—to
        enable high-fidelity video prediction in specific domains.
      what_remains_open: Which design choices (e.g., mask strategy, diffusion step,
        physics prior) transfer beyond the reported task family, and whether the performance
        gains are due to the architecture or the training recipe.
    - line: Planning and action-interface design
      what_it_solves: Connects learned dynamics to decision-making by training policies
        inside imagined rollouts, coupling video and action diffusion for joint pretraining,
        or generating video plans conditioned on language goals, enabling action-conditional
        prediction and control.
      what_remains_open: How much of the improvement comes from the world model versus
        the planner, controller, or task-specific prior; closed-loop execution and
        long-horizon planning remain under-validated outside simulation.
    - line: Evaluation benchmarks and evidence protocols
      what_it_solves: Isolates specific world-model capabilities—spatial consistency,
        memory consistency, action controllability—by providing standardized datasets
        and metrics (e.g., loop-based navigation, scene graph consistency scores),
        which helps separate method contributions from implementation factors.
      what_remains_open: Whether these benchmarks cover all critical dimensions (physical
        interaction, causal reasoning, multi-task generalization) and why method papers
        often lack rigorous ablation studies and limitation analyses, making it hard
        to pinpoint the true source of gains.
    consensus:
    - World models must balance visual realism with physical plausibility; purely
      data-driven generation often fails to maintain long-term consistency.
    - Transformer-based backbones, especially diffusion transformers, have become
      the default architecture for scalable world models.
    - Self-supervised learning on large-scale video datasets (with or without actions)
      is a promising path to generalization, and pretraining followed by fine-tuning
      is a recurring paradigm.
    - Memory and spatial consistency are emerging as critical evaluation dimensions
      beyond short-term frame quality.
    disagreements:
    - 'Action integration: some models treat actions as conditional inputs to the
      video generator, while others jointly diffuse actions and videos, reflecting
      different assumptions about the role of action in dynamics.'
    - 'Physical grounding: one line of work explicitly injects physics knowledge (e.g.,
      depth, keypoints), whereas others rely on the model to learn physics implicitly
      from data, leading to trade-offs in data efficiency and generalizability.'
    - 'Evaluation focus: works disagree on whether the primary metric should be video
      fidelity (FVD, PSNR), downstream task performance (Atari scores, robot success
      rate), or specially designed consistency scores (SGCS, memory/action control
      metrics), complicating direct comparisons.'
    open_questions:
    - Can we design world models that maintain spatial and memory consistency over
      arbitrarily long horizons without accumulating errors that break the simulation?
    - How should we evaluate world models in interactive, closed-loop settings where
      the model's predictions influence future inputs, and current open-loop metrics
      may not reflect real-world utility?
    - What are the minimal supervision signals (e.g., no actions, sparse rewards)
      needed to learn a world model that supports effective planning and causal reasoning?
    - To what extent do the reported improvements in generation quality translate
      into better policy learning or decision-making, and how can we ablate the specific
      contribution of the world model?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构与训练目标设计
      解决的问题: 将世界模型概念转化为具体表示和损失函数，例如扩散Transformer加掩码重建、上下文VAE、组合视频生成或物理信息关键点动力学，在特定领域实现高保真视频预测。
      尚未覆盖: 哪些设计选择（如掩码策略、扩散步数、物理先验）能迁移到报告任务族之外，以及性能提升到底源于架构还是训练配方。
    - 路线: 规划与动作接口设计
      解决的问题: 将学习到的动力学连接到决策，通过在想象轨迹中训练策略、耦合视频和动作扩散进行联合预训练，或基于语言目标生成视频计划，实现动作条件预测和控制。
      尚未覆盖: 改善有多少来自世界模型本身，而非规划器、控制器或任务特定先验；闭环执行和长时域规划在仿真之外的验证不足。
    - 路线: 评估基准与证据协议
      解决的问题: 通过提供标准化数据集和指标（如循环导航、场景图一致性分数），隔离世界模型的特定能力——空间一致性、记忆一致性、动作可控性，有助于将方法贡献与实现因素分离。
      尚未覆盖: 这些基准是否覆盖了所有关键维度（物理交互、因果推理、多任务泛化），以及方法论文为何普遍缺乏严格的消融研究和局限性分析，导致难以确定增益的真正来源。
    共识:
    - 世界模型必须在视觉逼真度和物理合理性之间取得平衡，纯数据驱动的生成往往无法维持长期一致性。
    - 基于Transformer的骨干网络，尤其是扩散Transformer，已成为可扩展世界模型的主流架构。
    - 在大规模视频数据集上进行自监督学习（无论有无动作）是实现泛化的有前景途径，预训练后微调已成为常见范式。
    - 记忆和空间一致性正在成为超越短期帧质量的关键评估维度。
    分歧:
    - 动作整合：一些模型将动作作为视频生成器的条件输入，而另一些则联合扩散动作和视频，反映了对动作在动力学中作用的不同假设。
    - 物理基础：一类工作显式注入物理知识（如深度、关键点），另一类依赖模型从数据中隐式学习物理，导致数据效率和泛化能力之间的权衡。
    - 评估焦点：工作对主要指标是视频保真度（FVD、PSNR）、下游任务性能（Atari分数、机器人成功率）还是专门设计的一致性分数（SGCS、记忆/动作控制指标）存在分歧，使得直接比较复杂化。
    开放问题:
    - 能否设计出在任意长时域上保持空间和记忆一致性，且不会累积错误导致模拟崩溃的世界模型？
    - 如何在交互式、闭环环境中评估世界模型，因为当前的开放环指标可能无法反映真实世界的效用，而模型的预测会反过来影响未来输入？
    - 学习一个支持有效规划和因果推理的世界模型所需的最小监督信号（如无动作、稀疏奖励）是什么？
    - 报告中的生成质量提升在多大程度上转化为更好的策略学习或决策，我们如何消融世界模型的具体贡献？
