  related_work_outline_zh:
  - 主流方向：以动作条件视频生成作为具身/机器人操作世界模型的主流方向，尤其是统一或适配的扩散/自回归模型，从观测和动作预测未来帧；代表如 Unified World
    Models、IRASim、HMA。
  - 研究共性：多项工作将视觉与动作模态耦合到同一生成架构中，并在视觉质量之外评测规划、策略推演或物理/轨迹一致性；近期工作加入偏好或验证器信号以提升可靠性。
  - 关键差异：生成范式、动作注入方式、监督信号和评测设置不同：扩散/掩码自回归/流式，帧级或并行空间注入，自监督、RL偏好或测试时验证器，以及不同基准。
  - 趋势演进：证据主要集中在2024-2026的前沿内；趋势从适配预训练视频扩散模型，走向面向机器人的大规模统一模型、后训练对齐和功能基准评测。
  - 开放问题：状态/动态结构、缩放规律和验证器信号能否带来校准规划或因果持久性仍未验证；许多记录缺少 limitations 和 OpenAlex 指标，引用得分不能作为方法证据。
  literature_review:
    line_of_work_matrix:
    - line: Mechanistic and taxonomic accounts of video generation as world models
      what_it_solves: Organizes video generation approaches into state construction
        and dynamics modeling, making theoretical world-model requirements more explicit.
      what_remains_open: The taxonomy is conceptual and lacks new experiments; it
        does not yet show that its categories change model design or evaluation outcomes.
    - line: Scaling laws and formal guarantees for world-model behavior
      what_it_solves: Connects model size, data, objectives, or assumptions to expected
        behavior; 2026 work touches on verifier scaling and information bottlenecks.
      what_remains_open: No direct scaling-law validation is present in the bounded
        evidence, so failure and transfer prediction remains a verification gap.
    - line: Unified action-video generative world models for robot learning
      what_it_solves: Learns policies, forward/inverse dynamics, or video generation
        from large robot datasets by coupling visual and action modalities in one
        model.
      what_remains_open: Evidence focuses on manipulation and visual/action controllability;
        limitation fields are often missing, and formal guarantees or broader transfer
        are not shown.
    - line: Black-box adaptation of pretrained video diffusion into action-conditioned
        world models
      what_it_solves: Adds action conditioning to closed-source video diffusion models
        without accessing parameters, reducing the need for full pretraining.
      what_remains_open: Relies on domain-specific action-labeled videos and inherits
        pretrained model biases; evaluation is limited to video game and robotics
        settings.
    - line: Preference and physics alignment post-training for embodied world models
      what_it_solves: Aligns generated rollouts with physical realism, task logic,
        embodiment plausibility, and visual quality using human preference or physics-aware
        annotations.
      what_remains_open: Human preferences are costly and subjective; results mainly
        cover contact-rich manipulation, and physical plausibility benchmarks remain
        narrow.
    - line: Test-time verifier and spatial reasoning evaluation
      what_it_solves: Probes whether world-model-generated trajectories and verifier
        rewards can improve spatial reasoning through test-time scaling.
      what_remains_open: Verifier rewards are poorly calibrated and improve SAT-Real
        but not MMSI-Bench; current models may bottleneck fine-grained reasoning.
    consensus:
    - Recent work converges on action-conditioned video generation as a substrate
      for embodied world models, predicting future observations from observations
      and actions.
    - Visual and action modalities are increasingly coupled within shared generative
      architectures, so the same model can act as policy, dynamics model, inverse
      model, or video generator depending on conditioning, timesteps, or masks.
    - There is shared recognition that visual fidelity alone is not enough; evaluation
      must include action-frame alignment, physical plausibility, trajectory consistency,
      or downstream planning.
    - Pretrained video models are treated as foundations, but they require adaptation,
      conditioning, or post-training before they can serve as reliable decision-making
      world models.
    - Several 2025-2026 works introduce external reward or preference signals, while
      also showing that these signals can be biased, poorly calibrated, or domain-limited.
    disagreements:
    - 'Generation paradigm differs: diffusion transformers are used for fine-grained
      frame generation, masked autoregression for faster controllable prediction,
      and flow-based models for post-training alignment.'
    - 'Action integration differs: independent modality-specific diffusion timesteps,
      frame-level action-conditioning modules, parallel spatial action injection,
      or learned masks over pretrained intermediate outputs.'
    - 'Supervision differs: self-supervised multimodal pretraining, black-box adaptation
      on action-labeled video, RL/preference alignment, and test-time verifier-based
      selection.'
    - 'Evaluation targets differ: video game and real robot quality, Push-T IoU, SAT-Real
      versus MMSI-Bench, and PBench/EZSbench; these settings make generalization claims
      difficult to compare.'
    - Some work assumes access to large curated robot datasets or full model training,
      while other work assumes only a small action-labeled dataset and closed-source
      pretrained models.
    open_questions:
    - Can taxonomic categories such as state construction and dynamics modeling be
      operationalized into benchmarks that predict planning or causal persistence?
    - Are test-time verifier rewards calibrated enough to support reliable scaling,
      especially outside SAT-Real and on MMSI-Bench?
    - Do preference/DPO-aligned world models maintain physical consistency beyond
      contact-rich manipulation and human-preferred appearance?
    - Where is the direct scaling-law or guarantee evidence linking model size, data,
      and objective to failure modes and transfer?
    - Can black-box adapters generalize when action-labeled domain data are scarce
      and pretrained model biases are unmeasured?
    - How should missing limitation fields, artifacts, and OpenAlex metrics be treated
      in aggregate evidence? They appear as verification gaps, not proof of absence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成作为世界模型的机制与分类分析
      解决的问题: 将视频生成方法组织为状态构建与动态建模，使世界模型理论要求更明确。
      尚未覆盖: 分类属概念分析、无新实验；尚未证明其分类会改变模型设计或评测结果。
    - 路线: 缩放规律与形式保证
      解决的问题: 试图连接模型规模、数据、目标或假设与预期行为；2026年工作触及验证器缩放与信息瓶颈。
      尚未覆盖: 证据包内没有直接的缩放规律验证，失败和迁移预测仍是缺口。
    - 路线: 统一动作-视频生成世界模型
      解决的问题: 在大规模机器人数据上联合建模动作与视频，可表示策略、前向/逆动力学或视频生成。
      尚未覆盖: 多聚焦操作任务与视觉/动作控制；局限性字段缺失，形式保证和更广迁移未展示。
    - 路线: 预训练视频扩散的黑盒适配
      解决的问题: 在不访问参数的情况下为预训练视频扩散模型加入动作条件，用于具身决策。
      尚未覆盖: 依赖领域特定动作标注视频并继承预训练模型偏差；仅在视频游戏和机器人领域评测。
    - 路线: 具身世界模型的偏好与物理对齐
      解决的问题: 用人类偏好或物理感知标注对生成轨迹进行后训练，提升物理真实性、任务逻辑和视觉质量。
      尚未覆盖: 偏好成本高且主观；主要集中在接触丰富操作任务，物理合理性基准仍有限。
    - 路线: 测试时验证器与空间推理评测
      解决的问题: 检验世界模型生成轨迹和验证器奖励能否通过测试时缩放改善空间推理。
      尚未覆盖: 验证器校准差，ViSA在SAT-Real有效但MMSI-Bench未一致缩放，存在信息瓶颈。
    共识:
    - 近期工作汇聚到动作条件视频生成作为具身世界模型的基础，从观测和动作预测未来观测。
    - 视觉与动作模态越来越多地在共享生成架构中耦合，同一模型可根据条件、时间步或掩码表示策略、动力学或视频生成。
    - 研究普遍认为仅看视觉保真度不够，需要动作-帧对齐、物理合理性、轨迹一致性或下游规划评测。
    - 预训练视频模型被视为基础，但需适配、条件化或后训练才能成为可靠决策世界模型。
    - 多篇2025-2026工作引入外部奖励或偏好信号，但也显示这些信号可能存在偏差、校准差或域限制。
    分歧:
    - 生成范式不同：扩散Transformer用于细粒度帧生成，掩码自回归用于更快可控预测，流模型用于后训练对齐。
    - 动作注入方式不同：独立模态扩散时间步、帧级条件模块、并行空间注入或学习掩码修改中间输出。
    - 监督信号不同：自监督多模态预训练、基于动作标注视频的黑盒适配、RL/偏好对齐和测试时验证器选择。
    - 评测目标不同：视频游戏与真实机器人质量、Push-T IoU、SAT-Real 与 MMSI-Bench、PBench/EZSbench，难以比较泛化性。
    - 有些工作假设大规模剪辑数据集或全模型训练，有些假设小规模动作标注数据和闭源预训练模型。
    开放问题:
    - 状态构建与动态建模等分类概念能否转化为预测规划或因果持久性的基准？
    - 测试时验证器奖励是否足够校准，能否在MMSI-Bench等之外稳定扩展？
    - 偏好/DPO对齐的世界模型在接触丰富操作和人类偏好外观之外是否保持物理一致性？
