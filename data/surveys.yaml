  - 'Mainstream direction: Action-conditioned video generation serves as the dominant
    world-model form in this evidence, applied mainly to robot manipulation and evaluated
    for physical plausibility, trajectory consistency, and downstream policy utility.'
  - 'Shared research pattern: Methods generate future video from past observations
    and actions, then evaluate action-frame alignment, control, visual quality, planning,
    or policy usefulness; large-scale pretraining and post-training are common.'
  - 'Key differences: Generative formulation, action injection, alignment signal,
    and evaluation target vary, including unified diffusion, masked autoregression,
    adapted pretrained video diffusion, flow-based reward alignment, and test-time
    verification.'
  - 'Trend evolution: Representative evidence clusters in 2024-2026; work moves from
    fine-grained action-conditioned manipulation video and adaptation toward physics
    alignment, benchmark-driven analysis, and conceptual state/dynamics taxonomies.'
  - 'Open questions: Formal guarantees, scaling laws, cross-domain generalization,
    causal persistence, and whether conceptual taxonomies or reward/verifier frameworks
    change model design remain open; direct formalization evidence is scarce.'
  related_work_outline_zh:
  - 主流方向：证据中动作条件视频生成是世界模型的主要形式，主要用于机器人操作，并围绕物理合理性、轨迹一致性和下游策略效用进行评测。
  - 研究共性：方法从历史观测与动作生成未来视频，再评估动作-帧对齐、可控性、视觉质量、规划或策略效用；大规模预训练和后训练较常见。
  - 关键差异：生成范式、动作注入、对齐信号和评测目标不同，包括统一扩散、掩码自回归、适配预训练视频扩散、基于流的奖励对齐和测试时验证。
  - 趋势演进：代表性证据集中在2024-2026年，从细粒度操作视频生成和适配，转向物理对齐、基准驱动分析以及状态/动态概念分类。
  - 开放问题：形式化保证、缩放规律、跨域泛化、因果持久性，以及分类法或奖励/验证器框架是否改变模型设计仍不清楚；形式化证据较少。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world modeling
      what_it_solves: Generating future frames from observations and actions for manipulation,
        policy learning, planning, and evaluation.
      what_remains_open: Generalization beyond trained embodiments/tasks, physical
        persistence, and formal guarantees remain unresolved.
    - line: Adaptation of pretrained video diffusion models
      what_it_solves: Reusing large video generators without full retraining or parameter
        access for action-conditioned generation.
      what_remains_open: Dependence on closed models and small action-labeled datasets;
        model bias and domain shift are not fully characterized.
    - line: Reward and verifier alignment for generated rollouts
      what_it_solves: Aligning world-model outputs with physical realism, task completion,
        logical coherence, visual quality, or test-time view selection.
      what_remains_open: Human preferences may be subjective and costly; verifier
        scaling fails on some benchmarks, revealing information bottlenecks.
    - line: State/dynamics formalization and taxonomy
      what_it_solves: Clarifying what a world model must represent by categorizing
        state construction and dynamics modeling, and shifting evaluation toward functional/causal
        benchmarks.
      what_remains_open: No direct evidence that these categories predict empirical
        model behavior or produce formal guarantees for realistic settings.
    consensus:
    - Action-conditioned video generation is treated as a practical world-model substrate
      for embodied decision-making.
    - Visual fidelity alone is insufficient; physical plausibility, action-frame alignment,
      trajectory consistency, and downstream utility are recurring concerns.
    - Large pretrained video/diffusion backbones are valuable but usually require
      domain-specific action conditioning, adaptation, or post-training.
    - Evaluation is shifting toward functional benchmarks, reward models, or verifiers
      rather than only reconstruction/generation quality.
    disagreements:
    - 'Generator parameterization differs: unified diffusion timesteps, masked autoregression,
      adapted pretrained diffusion, or flow-based post-training.'
    - 'Action injection differs: independent diffusion timesteps, frame-level action-conditioning
      modules, learned masks over intermediate outputs, or parallel spatial action
      context.'
    - 'Alignment supervision differs: pretraining objectives, human preference reward
      models with RL/DPO, or test-time verifier selection.'
    - 'Evaluation target differs: robot manipulation simulation quality, spatial reasoning
      benchmarks, physical plausibility and trajectory consistency, or zero-shot cross-embodiment
      control.'
    - 'Deployment assumptions differ: training from large robot datasets, adapting
      closed-source video models, or using synthetic/zero-shot benchmarks.'
    open_questions:
    - What formal assumptions and guarantees should action-conditioned video world
      models satisfy for safe planning and control? The packet lacks direct formalization
      or scaling-law validation.
    - Can models optimized for visual fidelity generalize to unseen embodiments and
      tasks, or do they function only as narrow manipulation-domain simulators?
    - Why does verifier-based test-time scaling improve one spatial reasoning benchmark
      but fail on another, and what does that reveal about world-model information
      bottlenecks?
    - How should evaluation separate physical persistence and causal reasoning from
      visual plausibility across real and synthetic settings?
    - Does aligning with human preference rewards remain practical beyond contact-rich
      manipulation tasks, and can it overfit subjective judgments?
