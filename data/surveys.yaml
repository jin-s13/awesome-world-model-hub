    - 路线: 物理与上下文感知的生成栈
      解决的问题: 嵌入上下文值、深度或关键点动力学，使生成未来更物理合理并改善零样本或下游策略迁移。
      尚未覆盖: 上下文可观测假设、基准覆盖范围有限，以及跨具身和真实环境验证缺失。
    - 路线: 动作忠实度与空间一致性的评测工件
      解决的问题: 提供数据集、指标和基线平台，量化生成轨迹是否遵循动作并在循环或驾驶场景中保持空间连贯。
      尚未覆盖: 部分工件摘要未报告实验结果，跨团队和基础设施的独立复现仍是证据缺口。
    共识:
    - 系统评估越来越多采用任务导向输出：未来帧真实度、动作跟随忠实度或下游策略成功率。
    - 开放数据集、基准或代码被视作系统贡献的一部分，而非仅作为补充材料。
    - 动作条件正从原始动作向量走向共享接口或结构化控制。
    - 单GPU延迟或闭环模拟行为等部署相关证据逐渐成为系统质量的一部分。
    分歧:
    - 表示方式不同：有的系统用场景图或关键点动力学施加结构与物理约束，有的依赖潜在动作token或扩散生成特征。
    - 评测目标不同：分别强调导航空间一致性、驾驶动作忠实度、视觉保真度或机器人策略成功率，这些目标不可互换。
    - 交互模式不同：帧级自回归闭环推演、基准式未来预测和跨具身潜在动作仿真并存。
    - 部署场景不同：证据分布在Minecraft、CARL、基于nuScenes的驾驶数据和真实机器人平台之间，跨场景泛化尚未建立。
    开放问题:
    - 这些动作可控仿真器能否在不重训或轻适配的情况下迁移到nuScenes、CARL、Minecraft之外的环境？
    - 当部分工件在摘要层面省略结果细节时，空间一致性和动作忠实度指标能否跨团队与硬件独立复现？
    - 闭环帧级生成在真实部署中的最小延迟、显存和多GPU扩展要求是什么？
    - 物理感知或上下文感知的归纳偏置在分布偏移或部分可观测条件下是否仍然可靠？
