  related_work_outline:
  - 'Mainstream direction: The current frontier clusters around evaluating world models
    through closed-loop video and action rollouts. Benchmark-style contributions such
    as LoopNav and MIND introduce open datasets and consistency metrics, while method
    papers are validated on Atari 100k or driving datasets such as nuScenes, OpenDV-2K,
    and Waymo.'
  - 'Shared research pattern: Papers combine generated future observations, task-specific
    metrics, and normalized aggregate scores. Recent benchmarks release code or datasets
    and emphasize invariance to pixel-level variation, while method evaluations report
    visual fidelity, training efficiency, and policy or dynamics utility rather than
    only realism.'
  - 'Key differences: Evaluations diverge on which capability is stressed: spatial
    consistency via loop navigation, memory and action control across viewpoints,
    zero-shot generalization under context shifts, or physical plausibility in driving
    and robotics. Supervision also differs across action-conditioned video, action-free
    video, and observable context values.'
  - 'Trend evolution: Top-paper years are mostly 2023-2026, so the visible trend is
    within the current frontier: from Atari-centric aggregate game benchmarks toward
    open-domain consistency benchmarks, and from discrete latent world models toward
    diffusion and transformer architectures with efficiency and generalization comparisons.'
  - 'Open questions: Whether consistency metrics align with downstream robot policy
    utility; whether benchmark distributions cover deployment settings; whether rankings
    remain stable across implementations and compute budgets; and whether reproducibility
    can be assessed given missing citation, limitation, and artifact details in several
    entries.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在通过闭环视频与动作推演评估世界模型。LoopNav、MIND等具有基准性质的工作发布开放数据集与一致性指标，而方法论文多在Atari
    100k或nuScenes、OpenDV-2K、Waymo等驾驶数据上验证。
  - 研究共性：论文普遍结合未来观测生成、任务特定指标和归一化总分。近期基准更倾向开源代码或数据集，并强调对像素级变化的不变性；方法评估同时报告视觉保真度、训练效率以及策略或动力学效用。
  - 关键差异：评测侧重点不同：循环导航强调空间一致性，跨视角评测强调记忆与动作控制，上下文迁移强调零样本泛化，驾驶与机器人任务强调物理合理性。监督信号也分为动作条件视频、无动作视频和可观测上下文值。
  - 趋势演进：主要论文集中在2023至2026年，可见趋势处于当前前沿：从以Atari为中心的聚合分数转向开放域一致性基准，并从离散潜变量世界模型转向扩散和Transformer世界模型，同时更多报告效率与泛化比较。
  - 开放问题：一致性与记忆指标能否预测下游机器人策略效用；基准分布是否覆盖真实部署环境；不同实现和算力预算下排名是否稳定；部分论文缺少局限性、引文或工件信息，可复现性尚待验证。
  literature_review:
    line_of_work_matrix:
    - line: World-model benchmark task and dataset design
      what_it_solves: Creates shared video-plus-action evaluation tasks; for example,
        LoopNav contributes a Minecraft loop-navigation dataset and MIND contributes
        open-domain revisited videos with varied action spaces.
      what_remains_open: Whether these task distributions extend to real driving or
        robot deployment is not shown. MIND reports long-term memory and cross-action
        gaps, but broad coverage across deployment conditions remains untested.
    - line: Metric and stress-test design for visual and temporal consistency
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual detail, and physical plausibility. Atari 100k human-normalized scores
        and driving dataset comparisons are recurring aggregate metrics.
      what_remains_open: Alignment between these proxy metrics and downstream policy
        utility or physical correctness is not established. Several abstract-level
        results lack detailed metric sensitivity and failure analysis.
    - line: Comparable baselines and evaluation reporting for world models
      what_it_solves: 'Standardizes comparisons through shared benchmarks and baselines:
        Atari 100k for sample-efficient RL, CARL for contextual RL, nuScenes/OpenDV-2K/Waymo
        for driving generalization, plus released code or datasets in LoopNav and
        MIND.'
      what_remains_open: Cross-implementation and compute-budget stability is not
        shown. Missing OpenAlex identifiers and sparse limitation fields limit auditability,
        so score and popularity signals cannot be verified as impact evidence.
    consensus:
    - 'World-model evaluation is moving toward closed-loop rollout or revisited-video
      settings: models must predict future observations under action sequences and
      are judged on consistency, controllability, and visual fidelity.'
    - Benchmark construction is treated as a research contribution when it adds open
      datasets, reproducible metrics, or code, not only a leaderboard entry.
    - Diffusion and transformer world models have become common evaluation targets,
      with Atari 100k and driving or robotic video tasks recurring.
    - A single aggregate game score or visual quality measure is generally seen as
      insufficient; task-specific probes such as spatial or memory consistency are
      increasingly expected.
    disagreements:
    - 'Representation: discrete latent world models, diffusion-based visual generation,
      and stochastic transformer world models emphasize different failure modes and
      evaluation strengths.'
    - 'Supervision: some benchmarks use action-conditioned video with shared action
      spaces, while others exploit action-free video or observable context values,
      so the tested capabilities differ.'
    - 'Evaluation target: loop-based spatial consistency, long-horizon memory and
      action control, zero-shot policy generalization, and physical plausibility each
      stress different world-model abilities.'
    - 'Deployment setting: Atari, Minecraft, driving scenes, and robotic manipulation
      use distinct observation and action distributions, making cross-setting transfer
      uncertain.'
    open_questions:
    - Do spatial consistency and memory consistency metrics predict downstream decision
      or policy performance in robotics and driving?
    - How stable are current world-model rankings across different implementations,
      visual feature extractors, and compute budgets?
    - Can benchmarks cover the full action and scene distribution that real-world
      world models are expected to handle?
    - Several top papers lack reported limitations or complete citation and artifact
      metadata, so reliability and reproducibility remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 构建共享的视频与动作评测任务；例如LoopNav提供Minecraft循环导航数据集，MIND提供不同动作空间的开放域回访视频。
      尚未覆盖: 这些任务分布能否迁移到真实驾驶或机器人部署仍未证实；MIND显示长期记忆和跨动作空间仍存在缺口，覆盖面有限。
    - 路线: 视觉与时间一致性的指标和压力测试设计
      解决的问题: 检验空间一致性、记忆一致性、动作控制、视觉细节和物理合理性；Atari 100k人类归一化分数及驾驶数据对比是常见总分指标。
      尚未覆盖: 这些代理指标与下游策略效用或物理正确性之间的对应关系尚未建立；部分摘要结果缺少指标敏感性与失败分析。
    - 路线: 可比的基线与评测报告规范
      解决的问题: 通过共享基准和基线标准化比较，如Atari 100k、CARL、nuScenes/OpenDV-2K/Waymo，辅以LoopNav、MIND等开源代码或数据集。
      尚未覆盖: 不同实现和算力预算下的稳定性未展示；缺少OpenAlex标识与局限性字段使审计受限，评分与流行度信号不能作为可靠影响力证据。
    共识:
    - 世界模型评测正转向闭环推演或回访式设置：模型在动作序列下预测未来观测，并从一致性、可控性和视觉保真度进行判断。
    - 基准构建本身被视为研究贡献，前提是提供开放数据集、可复现指标或代码，而不只是排行榜分数。
    - 扩散和Transformer世界模型已成为常见评测对象，Atari 100k以及驾驶和机器人视频任务反复出现。
    - 研究者普遍认为单一聚合游戏分数或视觉质量不够，需要空间一致性、记忆一致性等任务特定探针。
    分歧:
