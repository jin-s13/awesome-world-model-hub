  related_work_outline_zh:
  - 主流方向：构建动作可控的视频生成世界模型作为具身任务模拟器，重点关注闭环交互、物理合理性和长时域一致性。
  - 研究共性：以动作或上下文为条件进行视频生成，采用自回归或扩散架构，并通过任务特定指标和公开基准进行评估。
  - 关键差异：领域特化（自动驾驶、机器人、游戏）与通用性；监督信号（物理信息、上下文条件、运动增强）；交互模式（闭环仿真、开放世界探索、策略学习）；评估重点（空间一致性、动作保真度、视觉质量）。
  - 趋势演进：2024至2026年，领域从适配通用视频生成器转向构建专用闭环世界模型，集成物理先验，强调实时推理，并建立新的可复现基准。
  - 开放问题：如何在不牺牲视觉质量的前提下保持长时域一致性？如何跨领域、传感器配置和硬件泛化？物理信息模型能否充分捕捉真实世界动力学？结果能否被不同团队和基础设施独立复现？
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning world model ideas into end-to-end workflows for video
        generation, simulation, and evaluation, exemplified by closed-loop autonomous
        driving simulators and physics-informed robotic world models.
      what_remains_open: How well these stacks survive deployment in unseen environments,
        adapt to sensor and hardware changes, and maintain performance under distribution
        shift without overfitting to specific datasets.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        control and policy learning, with sub-second inference on a single GPU and
        support for action-conditioned future prediction.
      what_remains_open: Trade-offs between inference speed, visual fidelity, and
        action controllability; scalability to multi-agent or very long-horizon scenarios
        where autoregressive drift may accumulate.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making world model systems inspectable and reusable through
        benchmarks, datasets, and open-source code, enabling standardized evaluation
        of spatial consistency, action fidelity, and visual quality.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure;
        many systems either lack code releases or are evaluated on narrow domains,
        limiting verification of claimed improvements.
    consensus:
    - World models must be action-conditioned to generate future states and support
      decision-making in interactive environments.
    - Large-scale video datasets with trajectory annotations are essential for training
      high-fidelity simulators.
    - Evaluation should go beyond visual quality and include action fidelity, spatial
      consistency, and physical plausibility.
    - Closed-loop simulation offers a more rigorous test of world models than open-loop
      generation alone.
    - Releasing benchmarks and baselines accelerates progress and enables fair comparisons
      across different approaches.
    disagreements:
    - 'Representation: some methods use diffusion transformers, others use autoregressive
      recurrent state-space models or lightweight adapters on pre-trained generators.'
    - 'Supervision: some integrate explicit physics knowledge (depth, keypoints),
      while others rely on context conditioning or motion-reinforced losses without
      explicit physics.'
    - 'Evaluation target: spatial consistency (loop navigation), action fidelity (trajectory-following),
      visual quality (FID/FVD), or downstream task performance (policy learning).'
    - 'Interaction mode: closed-loop driving simulation vs. open-world game exploration
      vs. model-based reinforcement learning with imagined rollouts.'
    - 'Deployment setting: specialized for autonomous driving (nuScenes), robotics,
      or gaming (Minecraft), with limited cross-domain transfer.'
    open_questions:
    - Can long-horizon consistency be maintained without sacrificing visual fidelity,
      especially when autoregressive drift accumulates over thousands of frames?
    - How well do these world models generalize to unseen environments, sensor configurations,
      or physical parameters beyond the training distribution?
    - What is the minimal set of supervision signals (physics, context, actions) needed
      to achieve a robust and generalizable world model?
    - To what extent can independent teams reproduce the reported results using only
      the provided artifacts, given varied hardware and infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将世界模型理念转化为覆盖视频生成、仿真和评估的端到端工作流，例如闭环自动驾驶模拟器和物理信息机器人世界模型。
      尚未覆盖: 这些栈在未见过的环境、传感器和硬件变化下的部署鲁棒性，以及在分布偏移下维持性能而不对特定数据集过拟合的能力。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环控制和策略学习的延迟与交互需求，在单GPU上实现亚秒级推理，并支持动作条件的未来预测。
      尚未覆盖: 推理速度、视觉保真度与动作可控性之间的权衡；在多智能体或极长时域场景中的可扩展性，其中自回归漂移可能累积。
    - 路线: 工件与可复现工程
      解决的问题: 通过基准、数据集和开源代码，使世界模型系统可检查、可复用，实现对空间一致性、动作保真度和视觉质量的标准化评估。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现；许多系统要么未发布代码，要么仅在狭窄领域评估，限制了所声称改进的可验证性。
    共识:
    - 世界模型必须支持动作条件，以生成未来状态并支持交互环境中的决策。
    - 大规模带有轨迹标注的视频数据集是训练高保真模拟器的关键。
    - 评估应超越视觉质量，纳入动作保真度、空间一致性和物理合理性。
    - 闭环仿真比单纯的开环生成更能严格检验世界模型。
    - 发布基准和基线可加速进展，并促成不同方法之间的公平比较。
    分歧:
    - 表示方式：有些方法使用扩散Transformer，有些使用自回归循环状态空间模型，或在预训练生成器上添加轻量级适配器。
    - 监督信号：有些集成显式物理知识（深度、关键点），而另一些依赖上下文条件或运动增强损失，未使用显式物理。
    - 评测目标：空间一致性（循环导航）、动作保真度（轨迹跟随）、视觉质量（FID/FVD）或下游任务性能（策略学习）。
    - 交互模式：闭环驾驶仿真 vs. 开放世界游戏探索 vs. 基于模型并利用想象轨迹的强化学习。
    - 部署场景：专用于自动驾驶（nuScenes）、机器人或游戏（Minecraft），跨领域迁移能力有限。
    开放问题:
    - 长时域一致性能否在不牺牲视觉质量的前提下维持，尤其是当自回归漂移在数千帧上累积时？
    - 这些世界模型在未见过的环境、传感器配置或超出训练分布的物理参数上泛化能力如何？
    - 实现鲁棒且可泛化的世界模型所需的最小监督信号集（物理、上下文、动作）是什么？
    - 在仅提供公开工件的情况下，独立团队在各种硬件和基础设施上复现报告结果的程度如何？
