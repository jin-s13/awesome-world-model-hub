  related_work_outline:
  - 'Mainstream direction: Diffusion-based and latent generative world models dominate,
    with sub-directions in embodied/driving video generation, model-based RL dynamics,
    and benchmarks for memory, spatial consistency, and action control.'
  - 'Shared research pattern: Most works learn dynamics from high-dimensional observations
    via self-supervised generation or prediction, condition on actions, context, language,
    or multimodal goals, and use imagined or generated trajectories for control or
    generalization.'
  - 'Key differences: They differ in representation and objective, such as recurrent
    state-space models, variational Transformer models, or diffusion Transformers
    with auxiliary tasks; in action interfaces, from action-free video to coupled
    video-action diffusion; and in evaluation targets, including Atari return, zero-shot
    transfer, driving video quality, robot execution, and consistency benchmarks.'
  - 'Trend evolution: The available high-ranked evidence is concentrated in 2023-2026,
    suggesting a current-frontier shift from efficient latent world models for RL
    toward diffusion-based embodied/driving generation and explicit memory/action-control
    evaluation.'
  - 'Open questions: Evidence does not yet isolate model contributions from planners,
    task priors, or benchmark protocols; generalization beyond seen primitives or
    contexts, long-horizon memory, cross-action-space control, and missing code, data,
    baselines, or limitation details remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：扩散式与隐式生成世界模型为主，覆盖具身/驾驶视频生成、基于模型的强化学习动力学，以及记忆一致性与动作控制基准。
  - 研究共性：多数工作从高维观测中自监督学习动力学或生成，并以动作、上下文或语言为条件，用想象轨迹或生成视频支持控制与泛化。
  - 关键差异：表示与目标不同，如循环状态空间模型、Transformer+VAE、扩散Transformer加辅助任务；动作接口从无动作视频到视频-动作联合扩散；评测目标涵盖Atari、零样本、驾驶、机器人与记忆一致性。
  - 趋势演进：高相关证据集中在2023-2026，属于当前前沿；从高效隐式世界模型转向扩散式具身/驾驶生成，并出现显式一致性与动作控制评测。
  - 开放问题：方法贡献尚未与规划器、任务先验和评测协议隔离；对未见原语/上下文的泛化；长时记忆与跨动作空间控制；代码、数据、基线与局限性缺失的验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete architectures, losses,
        and auxiliary training signals such as mask reconstruction, variational latent
        dynamics, physics-informed depth/keypoints, or coupled diffusion.
      what_remains_open: Which representation and auxiliary objective choices transfer
        beyond the reported task family; many high-ranked papers lack explicit limitation
        evidence, so negative boundaries are unverified.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to intervention and control by conditioning
        on actions, context, language primitives, or multimodal goals, and by generating
        imagined trajectories or video plans.
      what_remains_open: How much improvement comes from the model versus the planner,
        policy, parser, or task prior; support for entirely novel primitives and real-world
        execution remains weakly evidenced.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides datasets, metrics, and benchmarks such as loop-based
        navigation or memory/action-control evaluation to measure spatial consistency,
        long-horizon behavior, and generalization.
      what_remains_open: Benchmark papers often do not isolate a proposed method contribution,
        and several method papers do not report ablations or limitations, leaving
        system-level choices confounded with the method.
    consensus:
    - Learned world models are increasingly built around generative or predictive
      objectives over high-dimensional observations.
    - Conditioning on actions, context, language, or multimodal goals is a shared
      route to task-relevant behavior and generalization.
    - Evaluation is expanding beyond pixel-level generation quality or policy return
      to include physical plausibility, spatial consistency, memory, and action control.
    - Model-based imagination or generated trajectory data is widely used to improve
      policy learning or zero-shot transfer.
    disagreements:
    - 'Representation choices differ: recurrent state-space models, variational Transformer
      models, and diffusion-based video models make different assumptions about stochasticity,
      memory, and generation quality.'
    - 'Training objectives differ: some rely on generation or prediction losses alone,
      while others add mask reconstruction, depth prediction, keypoint dynamics, or
      physics-informed auxiliary tasks.'
    - 'Action-conditioning interfaces differ: some models learn action-free video
      or use separate action modules, while others jointly diffuse actions and video
      in a unified model.'
    - Evaluation settings differ across Atari game return, contextual zero-shot transfer,
      driving and multi-view video prediction, simulated robot execution, and open-domain
      memory/action-control benchmarks.
    - 'Supervision and prior assumptions differ: context observability, language parsing
      into primitives, and physics or geometry priors are introduced in some works
      but not others.'
    open_questions:
    - How much of reported improvement is attributable to the world model itself rather
      than to planners, policy optimization, task decomposition, or benchmark protocol
      choices?
    - Which representation and auxiliary objective choices transfer to tasks outside
      narrow reported datasets, especially when only one or two task families are
      evaluated?
    - Can world models generalize to entirely novel action primitives or unobserved
      context values, beyond combinations already present in training?
    - What metrics and models can robustly capture long-horizon memory consistency
      and cross-action-space control in open-domain environments?
    - Are missing code, datasets, baselines, ablations, and limitation sections hiding
      negative results or system-level contributions that would change the evidence
      picture?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型思路落实为具体架构、损失和辅助训练信号，如掩码重建、变分隐式动力学、物理信息深度/关键点或耦合扩散。
      尚未覆盖: 哪些表示与辅助目标选择能迁移到已报告任务族之外；多篇高排名论文缺少明确局限性证据，负面边界未经验证。
    - 路线: 规划与动作接口方法
      解决的问题: 通过动作、上下文、语言原语或多模态目标等条件，把学习到的动力学连接到干预、规划与想象轨迹生成。
      尚未覆盖: 提升有多少来自模型本身而非规划器、策略、解析器或任务先验；对全新原语和真实环境执行的证据仍较弱。
    - 路线: 方法证据与消融协议
      解决的问题: 提供数据集、指标和基准，如循环导航或记忆/动作控制评测，以衡量空间一致性、长时行为和泛化能力。
      尚未覆盖: 基准论文通常未隔离方法贡献；部分方法论文未报告消融或局限性，使系统级选择与方法贡献混杂。
    共识:
    - 世界模型越来越围绕高维观测的生成或预测目标构建。
    - 以动作、上下文、语言或多模态目标为条件，是实现任务相关行为和泛化的共同路径。
    - 评测正从像素级生成质量或策略回报扩展到物理合理性、空间一致性、记忆和动作控制。
    - 基于模型的想象或生成轨迹数据被广泛用于提升策略学习或零样本迁移。
    分歧:
    - 表示选择不同：循环状态空间模型、变分Transformer和扩散视频模型对随机性、记忆和生成质量有不同假设。
    - 训练目标不同：有些仅使用生成或预测损失，其他则加入掩码重建、深度预测、关键点动力学或物理信息辅助任务。
    - 动作条件接口不同：有些学习无动作视频或独立动作模块，有些则在统一模型中联合扩散动作和视频。
    - 评测设置不同：涵盖Atari游戏得分、上下文零样本迁移、驾驶与多视角视频预测、仿真机器人执行，以及开放域记忆/动作控制基准。
    - 监督与先验假设不同：上下文可观测性、语言到原语的解析、物理或几何先验在某些工作中引入，在另一些工作中没有。
    开放问题:
    - 报告的性能提升有多少来自世界模型本身，而不是规划器、策略优化、任务分解或评测协议？
    - 哪些表示与辅助目标选择能迁移到狭窄报告数据集之外的任务，尤其是当仅有一两个任务族被评估时？
    - 世界模型能否泛化到训练中未见过的全新动作原语或上下文值，而不仅是训练中已有的组合？
    - 哪些指标和模型能稳健刻画开放域环境中的长时记忆一致性和跨动作空间控制？
    - 缺失的代码、数据、基线、消融和局限性段落是否隐藏了负面结果或系统级贡献？
