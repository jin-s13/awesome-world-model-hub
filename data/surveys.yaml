  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video world models for
    embodied applications, especially driving and robotics, using diffusion transformers
    or sequence models to predict future observations and actions, with examples such
    as MaskGWM, UWM, and RoboScape.'
  - 'Shared research pattern: Works couple visual prediction with auxiliary signals
    such as masks, context, physics depth/keypoints, or actions, then evaluate on
    domain benchmarks, policy learning, or consistency metrics; many also expose generalization
    or memory gaps rather than only reporting frame fidelity.'
  - 'Key differences: They differ in domain (driving, robotics, games/open worlds),
    auxiliary task or action coupling, and evaluation target: pixel/video fidelity,
    zero-shot policy transfer, spatial consistency, or memory/action control.'
  - 'Trend evolution: Evidence spans 2023–2026, moving from efficient Transformer-VAE
    world models for Atari toward diffusion-based driving and robot simulators, plus
    dedicated benchmark datasets for spatial, memory, and action-control consistency.'
  - 'Open questions: Open issues include real-world safety/operation transfer, cross-dataset/embodiment/action-space
    generalization, limited or unreported limitations and ablation evidence, and unclear
    links between benchmark metrics and downstream task success.'
  related_work_outline_zh:
  - 主流方向：近期工作聚焦面向具身应用的生成式视频世界模型，尤其是驾驶与机器人，采用扩散Transformer或序列模型预测未来观测与动作，例如MaskGWM、UWM和RoboScape。
  - 研究共性：将视频预测与掩码、上下文、物理深度/关键点或动作等辅助信号耦合，并在领域基准、策略学习或一致性指标上评测。
  - 关键差异：领域不同（驾驶、机器人、游戏/开放世界），辅助任务与动作耦合不同，评测目标也不同：视频保真、零样本策略迁移、空间一致性或记忆/动作控制。
  - 趋势演进：证据集中在2023–2026年前沿：从高效Transformer-VAE的Atari世界模型，转向驾驶与机器人的扩散式仿真器，并出现空间、记忆和动作控制基准。
  - 开放问题：真实安全与运营迁移、跨数据集/本体/动作空间泛化、局限性与消融证据缺失，以及基准指标与下游任务成功之间的关联仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Driving world modeling via masked video diffusion and multi-view prediction
      what_it_solves: Long-horizon, multi-view driving scene prediction for simulation
        and policy evaluation on public driving datasets.
      what_remains_open: Whether benchmark gains on Nuscenes, OpenDV-2K, and Waymo
        transfer to real-world safety or closed-loop operational outcomes; limitation
        and ablation evidence is not visible.
    - line: Robot world modeling by coupling video generation with actions, language,
        or physics
      what_it_solves: Physically plausible robot video synthesis and pretraining of
        policy, forward/inverse dynamics, or plan generation from large robot datasets.
      what_remains_open: Generalization beyond seen language primitives, sim-only
        or dataset-level evaluation, and cross-embodiment or real-robot transfer remain
        unverified.
    - line: Contextual recurrent world models for zero-shot reinforcement learning
      what_it_solves: Adapting latent dynamics and policy training to observable context
        so learned policies generalize to unseen context values.
      what_remains_open: Assumes observable context and is evaluated on only two CARL
        tasks, leaving broader unknown dynamics and hidden-context settings open.
    - line: Efficient stochastic Transformer-VAE world models for sample-limited control
      what_it_solves: Improving sample efficiency and training speed in model-based
        RL on visually complex control tasks such as Atari 100k.
      what_remains_open: Evidence is Atari-specific; transfer to embodied or continuous
        multi-task settings, and missing limitation or ablation details, remain open.
    - line: Benchmarks for spatial, memory, and action-control consistency in open-world
        video
      what_it_solves: Measuring whether generative world models maintain loop closure,
        temporal coherence, and action-conditional control across views or action
        spaces.
      what_remains_open: Connecting consistency scores to downstream task success
        and showing current models can overcome long-term memory and cross-action-space
        gaps.
    consensus:
    - World models in this evidence are treated as generative forward simulators that
      map observations and actions/context/language to future observations, used for
      prediction, policy learning, or evaluation.
    - Auxiliary conditioning or training tasks such as mask reconstruction, context
      encoding, physics depth/keypoint learning, action diffusion, or consistency
      metrics are common strategies to improve generalization and coherence.
    - Evaluation is anchored in public datasets and benchmarks with comparisons to
      prior state-of-art; visual fidelity is often separated from physical plausibility
      or control consistency.
    - Recent work increasingly highlights long-horizon, zero-shot, and cross-view/action-space
      generalization gaps rather than only frame-level reconstruction.
    disagreements:
    - 'Representation and modeling choices differ: recurrent state-space and VAE-based
      models versus diffusion transformers and unified video-action transformers.'
    - 'Auxiliary supervision differs: mask reconstruction, context conditioning, physics-informed
      depth/keypoint tasks, language-primitive factorization, or explicit action diffusion.'
    - 'Evaluation target differs: frame fidelity on driving or robot video, zero-shot
      policy performance on CARL or Atari, and memory/spatial/action-control benchmark
      scores.'
    - 'Deployment assumptions differ: some require observable context or parseable
      language primitives; others learn from action-free video or assume simulator
      evaluation only.'
    open_questions:
    - Do reported driving, robot, and Atari gains survive real-world deployment with
      safety, embodiment, and environment shifts? The evidence does not include such
      transfer.
    - Can compositional and contextual models handle unseen primitives, hidden context,
      or entirely new domains beyond the limited CARL tasks and simulation/dataset
      evaluations?
    - Do spatial or memory consistency benchmark scores predict downstream policy
      quality or closed-loop task success? Benchmark papers expose gaps but do not
      yet close this connection.
    - How much confidence is lost because several high-relevance works lack visible
      limitations, ablation details, or full reproducibility artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于掩码视频扩散和多视角预测的驾驶世界模型
      解决的问题: 长时域、多视角驾驶场景预测，用于仿真和策略评测，覆盖公开驾驶数据集。
      尚未覆盖: 在Nuscenes、OpenDV-2K和Waymo上的提升能否迁移到真实安全或闭环运营结果仍不明确；局限性与消融证据不可见。
    - 路线: 通过视频与动作、语言或物理耦合的机器人世界模型
      解决的问题: 生成物理合理的机器人视频，并在大规模机器人数据集上预训练策略、前向/逆动力学或计划生成。
      尚未覆盖: 超出已见语言原语的泛化、仅仿真或数据集层面的评测，以及跨本体或真实机器人迁移仍未验证。
    - 路线: 面向零样本强化学习的上下文循环世界模型
      解决的问题: 将潜在动力学和策略训练适配到可观测上下文，使策略能泛化到未见上下文值。
      尚未覆盖: 假设上下文可观测且仅在两个CARL任务上评测，更广泛的未知动力学和隐藏上下文设置仍未覆盖。
    - 路线: 面向样本受限控制的高效随机Transformer-VAE世界模型
      解决的问题: 在视觉复杂控制任务（如Atari 100k）中提升基于模型强化学习的样本效率和训练速度。
      尚未覆盖: 证据集中在Atari；向具身或连续多任务场景的迁移，以及缺失的局限性和消融细节仍未知。
    - 路线: 面向开放世界中空间、记忆和动作控制一致性的基准
      解决的问题: 衡量生成式世界模型是否在跨视角或不同动作空间下保持回环、时间一致和动作条件控制。
      尚未覆盖: 一致性分数如何关联下游任务成功，以及现有模型如何克服长时记忆和跨动作空间缺口仍不清楚。
    共识:
    - 本证据中的世界模型被视作生成式前向模拟器，将观测和动作/上下文/语言映射到未来观测，用于预测、策略学习或评测。
    - 通过辅助条件或训练任务（如掩码重建、上下文编码、物理深度/关键点、动作扩散、一致性指标）改善泛化与一致性是常见策略。
    - 评测依赖公开数据集和基准，并与先前方法比较；视觉保真度通常与物理合理性或控制一致性分开讨论。
    - 近年工作更关注长时域、零样本、跨视角/动作空间的泛化缺口，而非仅帧级重建。
    分歧:
    - 表示与建模选择不同：循环状态空间和VAE类模型 vs 扩散Transformer和统一视频-动作Transformer。
    - 辅助监督不同：掩码重建、上下文条件、物理深度/关键点、语言原语分解或显式动作扩散。
    - 评测目标不同：驾驶或机器人视频的帧保真、CARL/Atari的零样本策略表现，以及记忆/空间/动作控制基准分数。
    - 部署假设不同：有些依赖可观测上下文或可解析语言原语，有些从未标注动作的视频学习，或仅在仿真中评测。
    开放问题:
    - 报告中的驾驶、机器人和Atari收益能否在真实部署、本体和环境变化下生存？现有证据不包含这类迁移。
    - 组合式和上下文模型能否处理未见原语、隐藏上下文或超出有限CARL任务与仿真/数据集的域？
    - 空间或记忆一致性基准分数能否预测下游策略质量或闭环任务成功？基准工作暴露了缺口但尚未闭合该联系。
    - 若干高相关度工作缺少可见的局限性、消融细节或完整可复现工件，这对结论置信度影响多大？
