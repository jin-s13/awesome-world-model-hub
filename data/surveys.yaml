  related_work_outline:
  - 'Mainstream direction: World-model evaluation is dominated by action-conditioned
    video generation across driving, robotics, games, and open-world navigation, with
    methods shifting toward diffusion transformers and explicit consistency or physics-informed
    objectives.'
  - 'Shared research pattern: Work pairs dataset and metric construction with generative
    world-model baselines to test reconstruction quality, long-horizon prediction,
    memory and action consistency, or downstream policy utility instead of relying
    only on aggregate scores.'
  - 'Key differences: Evaluation settings split between sample-efficient RL on Atari/CARL,
    long-horizon driving video, Minecraft spatial consistency, and robotic video;
    supervision differs across mask reconstruction, diffusion, VAEs, physics losses,
    and context conditioning.'
  - 'Trend evolution: Within the current frontier, 2023-2024 focused on efficient
    Transformer and diffusion world models for Atari-style benchmarks; 2025-2026 shifted
    toward open-domain consistency benchmarks, driving and robotics datasets, and
    multi-task video-action pretraining.'
  - 'Open questions: Metric-to-decision alignment, cross-action and cross-domain generalization,
    ranking stability across implementations and compute budgets, and missing limitation
    or comparison evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以动作条件视频生成为核心评估载体，覆盖驾驶、机器人、游戏和开放世界导航，方法向扩散Transformer以及显式一致性或物理信息目标演进。
  - 研究共性：把数据集和指标构建与生成式世界模型基线配对，考查重建质量、长时域预测、记忆和动作一致性或下游策略效用，而非只看总分。
  - 关键差异：评估设置分为Atari和CARL样本效率、长时域驾驶视频、Minecraft空间一致性、机器人视频；监督信号涵盖掩码重建、扩散、VAE、物理损失和上下文条件。
  - 趋势演进：在当前前沿内，2023-2024年集中在Atari类基准上的高效Transformer和扩散世界模型；2025-2026年转向开放域一致性基准、驾驶与机器人数据集及多任务视频-动作预训练。
  - 开放问题：指标与决策对齐、跨动作和跨领域泛化、不同实现与算力预算下的排名稳定性，以及若干论文缺失局限性或比较证据，均待验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned video tasks for spatial consistency,
        memory consistency, and action control in open-world or driving settings.
      what_remains_open: Whether these task distributions cover deployment conditions
        where world models are expected to help, and whether datasets scale beyond
        selected scenes and action spaces.
    - line: Metric and stress-test design
      what_it_solves: Probes long-horizon consistency, action controllability, physical
        plausibility, and visual fidelity beyond aggregate generation scores.
      what_remains_open: Alignment between proxy metrics and downstream decisions,
        human judgment, or policy success is not yet demonstrated.
    - line: Architecture-oriented world-model evaluation on RL benchmarks
      what_it_solves: Compares Transformer, diffusion, and VAE world models on sample
        efficiency and agent performance using standardized game benchmarks such as
        Atari and CARL.
      what_remains_open: Generalization beyond limited tasks, sensitivity to implementation
        and compute budgets, and assumptions such as observable context remain underexplored.
    - line: Embodied video world-model generation for driving and robotics
      what_it_solves: Builds action-conditioned video models to support long-horizon
        prediction, multi-view synthesis, robot policy training, or policy evaluation.
      what_remains_open: Uniform cross-dataset comparisons, reliable physical-plausibility
        metrics, and open-domain generalization are still missing.
    consensus:
    - Recent work converges on action-conditioned video generation as a shared evaluation
      substrate for world models.
    - Evaluation is shifting from single-frame or aggregate scores toward targeted
      consistency, controllability, and downstream utility measures.
    - Transformer and diffusion backbones are widely used, often trained with self-supervised
      reconstruction or generative objectives.
    - Open datasets and formal metrics are treated as important for reproducible evaluation,
      while read-first and citation scores are not treated as methodology evidence.
    disagreements:
    - 'Evaluation target differs: standard RL sample efficiency, open-domain memory
      and spatial consistency, driving long-horizon prediction, or robotic video generation.'
    - 'Supervision signal differs: VAE and Transformer dynamics, diffusion generation,
      mask reconstruction, physics-informed depth and keypoint losses, or contextual
      latent dynamics.'
    - 'Interaction mode differs: open-loop multi-view prediction, closed-loop revisited
      navigation, policy rollouts in imagined environments, or pretraining from action-free
      video.'
    - 'Deployment setting differs: simulated games, Minecraft, driving, and robot
      manipulation impose different validity criteria for world-model quality.'
    - 'Evidence completeness differs: some works report benchmark metric gains while
      others present dataset or benchmark construction without experimental results
      or limitation details.'
    open_questions:
    - Do spatial consistency, memory consistency, or action control metrics predict
      downstream policy success, or are they primarily proxy scores?
    - How well do world models generalize across unseen action spaces, viewpoints,
      and environments beyond the selected benchmark scenes?
    - Are benchmark rankings stable across implementation choices, compute budgets,
      and dataset shifts given the absence of a common reporting protocol?
    - Does observable context conditioning capture realistic zero-shot dynamics, or
      do methods fail when context is partially observed or hidden?
    - Several papers in the evidence packet omit limitation details; what systematic
      failure modes are therefore missed in current comparisons?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的动作条件视频任务，评估空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些任务分布是否覆盖世界模型预期发挥作用的真实部署条件，以及数据集能否扩展到选定场景和动作空间之外，仍待验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验长时域一致性、动作可控性、物理合理性和视觉保真度。
      尚未覆盖: 代理指标与下游决策、人类判断或策略成功率之间的对齐尚未得到证明。
    - 路线: 基于标准强化学习基准的架构导向评估
      解决的问题: 在Atari、CARL等标准化游戏基准上比较Transformer、扩散和VAE世界模型的样本效率与智能体表现。
      尚未覆盖: 有限任务之外的泛化、实现和算力预算敏感性，以及可观测上下文等假设仍缺少系统验证。
    - 路线: 面向驾驶与机器人的具身视频世界模型生成
      解决的问题: 构建动作条件视频模型，支持长时域预测、多视角合成、机器人策略训练或策略评估。
      尚未覆盖: 跨数据集统一比较、可靠的物理合理性指标和开放域泛化仍然缺失。
    共识:
    - 最近工作趋向于把动作条件视频生成作为世界模型的共享评估载体。
    - 评估正从单帧或总分转向有针对性的长期一致性、可控性和下游效用测量。
    - Transformer和扩散骨干模型被广泛采用，通常使用自监督重建或生成目标训练。
    - 开放数据集和正式指标对可复现评估越来越重要，但读优先分数和引用分数不能代替方法或可复现性证据。
    分歧:
    - 评估目标不同：标准强化学习样本效率、开放域记忆和空间一致性、驾驶长时域预测或机器人视频生成。
    - 监督信号不同：VAE和Transformer动态、扩散生成、掩码重建、物理信息深度和关键点损失或上下文潜动态。
    - 交互模式不同：开环多视角预测、闭环回访导航、在想象环境中进行策略演练或从无动作视频预训练。
    - 部署场景不同：模拟游戏、Minecraft、驾驶和机器人操作对世界模型质量有不同要求。
    - 证据完整性不同：部分工作报告指标提升，部分工作仅提供数据集或基准构建而无实验结果或局限性说明。
    开放问题:
    - 空间一致性、记忆一致性或动作控制指标是否能预测下游策略成功，还是主要作为代理分数？
    - 世界模型在超出基准场景的未知动作空间、视角和环境中泛化程度如何？
    - 在缺乏统一报告规范的情况下，基准排名在不同实现和算力预算下是否稳定？
