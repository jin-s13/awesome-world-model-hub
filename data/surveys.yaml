  related_work_outline:
  - 'Mainstream direction: Evaluation of world-model capabilities is shifting from
    aggregate task scores to explicit consistency, memory, and action-control diagnostics
    in embodied and driving settings.'
  - 'Shared research pattern: Papers combine open datasets or standard suites with
    action annotations and define reference baselines; results are reported as visual
    fidelity, policy performance, or consistency scores.'
  - 'Key differences: Evaluation targets differ across closed-loop memory faithfulness,
    spatial scene-graph consistency, physical plausibility, and task-level RL performance,
    leading to different metrics and assumptions about observable context.'
  - 'Trend evolution: Within the 2023-2026 frontier, work moves from Atari-style model-based
    RL benchmarks toward open-domain video benchmarks and multimodal video-action
    benchmarks for long-horizon generalization.'
  - 'Open questions: Metric-to-decision alignment, cross-implementation stability,
    long-horizon coverage, and unobservable context settings remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从任务总分转向对一致性、记忆和动作控制的显式诊断，尤以具身和驾驶场景为主。
  - 研究共性：多数工作以开放数据集或标准任务套件配合动作标注，并建立参考基线；结果以视觉保真度、策略性能或一致性分数呈现。
  - 关键差异：评测目标在闭环记忆忠实度、空间场景图一致性、物理合理性和任务级强化学习性能之间分化，指标与上下文假设不同。
  - 趋势演进：在2023-2026前沿期内，研究从Atari式模型强化学习基准向开放域视频基准和多模态视频-动作基准演进，强调长时域泛化。
  - 开放问题：指标与决策一致性、跨实现稳定性、长时域覆盖以及不可观测上下文的证据仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Memory consistency and action-control benchmark design
      what_it_solves: Creates open-domain closed-loop datasets and metrics for evaluating
        temporal stability, spatial consistency, and action fidelity in world models.
      what_remains_open: Coverage of long-horizon memory, diverse action spaces, and
        alignment with downstream task utility remains uncertain.
    - line: Task-suite evaluation for model-based RL
      what_it_solves: Uses standardized control and game tasks to compare world-model-trained
        agents and zero-shot generalization.
      what_remains_open: Evaluations are limited to few tasks or observable context
        assumptions; cross-implementation stability is not fully verified.
    - line: Visual and physical fidelity stress tests
      what_it_solves: Probes geometry, keypoint dynamics, and visual detail to distinguish
        plausible generation from surface-level realism.
      what_remains_open: Proxy fidelity metrics are not yet tied to downstream policy
        or robot decision utility.
    - line: Unified multimodal world-model baselines
      what_it_solves: Provides reference architectures that couple video, action,
        or physics signals to support reproducible benchmark comparisons.
      what_remains_open: Many entries report limited limitations, and robustness across
        datasets, compute budgets, and implementation details is under-evidenced.
    consensus:
    - The field is converging on benchmarks that require more than aggregate video
      similarity, emphasizing memory, action control, and long-horizon behavior.
    - Open datasets with action annotations and open code are used to make world-model
      evaluation more reproducible.
    - Standard suites such as Atari 100k and CARL remain common for measuring agent
      performance, while newer driving, navigation, and robot datasets add task diversity.
    - Zero-shot or long-horizon generalization is a shared evaluation pressure, especially
      across unseen scenes, contexts, or action spaces.
    disagreements:
    - Some work evaluates closed-loop memory faithfulness in open-domain videos, while
      other work evaluates task-level human-normalized scores or policy performance.
    - 'Evaluation signals differ: scene-graph spatial consistency, pixel-level generation
      quality, keypoint/depth plausibility, and RL reward are not interchangeable.'
    - 'Interaction and deployment settings differ: first-person and third-person video
      control, action-free video pretraining, driving scenes, games, and robot tasks
      create different assumptions.'
    - 'The role of observable context differs: some methods assume explicit context
      values, while others rely on visual or action-only data.'
    open_questions:
    - How should consistency and fidelity metrics be weighted against downstream decision
      utility, and what evidence would validate that alignment?
    - Do benchmark rankings remain stable across different implementations, compute
      budgets, and baseline reproductions?
    - How can memory and action-control benchmarks cover longer horizons and broader
      action spaces without overfitting to a fixed set of scenes?
    - What happens to zero-shot generalization claims when context values or environment
      properties are unobservable, and how should benchmarks report this boundary?
    - Several top papers lack visible limitation or cross-benchmark stability details,
      leaving failure modes and robustness as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 记忆一致性与动作控制基准设计
      解决的问题: 构建开放域闭环数据集与指标，评估世界模型的时间稳定性、空间一致性和动作忠实度。
      尚未覆盖: 长时域记忆、多样动作空间覆盖，以及其与下游任务效用的对齐仍未充分验证。
    - 路线: 基于模型强化学习的任务套件评测
      解决的问题: 通过标准控制与游戏任务比较世界模型训练出的智能体及零样本泛化。
      尚未覆盖: 评测常限于少量任务或依赖可观测上下文假设，跨实现稳定性未见充分证据。
    - 路线: 视觉与物理保真度压力测试
      解决的问题: 通过几何、关键点动力学或视觉细节探针区分物理合理生成与表面真实感。
      尚未覆盖: 保真度代理指标与下游策略或机器人决策效用之间的关联仍不明确。
    - 路线: 统一多模态世界模型基线
      解决的问题: 提供耦合视频、动作或物理信号的参考架构，以支撑可复现的基准比较。
      尚未覆盖: 多数条目缺少局限性说明，跨数据集、算力预算和实现细节的鲁棒性证据不足。
    共识:
    - 领域正从单一视频相似度转向同时考察记忆、动作控制与长时域行为的基准。
    - 带有动作标注的开放数据集与开源代码被用于提升世界模型评测的可复现性。
    - Atari 100k、CARL等标准套件仍用于智能体性能比较，驾驶、导航和机器人数据增加任务多样性。
    - 零样本或长时域泛化成为共同评测压力，尤其涉及未见场景、上下文或动作空间。
    分歧:
    - 一部分工作评测开放域视频中的闭环记忆忠实度，另一部分工作则依据任务级人类归一化得分或策略表现。
    - 评测信号不同：场景图空间一致性、像素级生成质量、关键点/深度合理性与强化学习奖励不可互相替代。
    - 交互与部署设置不同：第一/第三人称视频控制、无动作视频预训练、驾驶、游戏和机器人任务隐含不同假设。
    - 可观测上下文的角色不同：有些方法假设上下文显式可观测，有些仅依赖视觉或动作数据。
    开放问题:
    - 一致性与保真度指标应如何与下游决策效用加权，何种证据能验证该对齐？
    - 基准排名在不同实现、算力预算和基线复现下是否稳定？
    - 记忆与动作控制基准如何覆盖更长时域和更广动作空间，同时避免对固定场景过拟合？
    - 当上下文值或环境属性不可观测时，零样本泛化主张如何成立，基准应如何报告该边界？
    - 若干顶部论文缺少局限性或跨基准稳定性细节，失败模式与鲁棒性仍是验证缺口。
