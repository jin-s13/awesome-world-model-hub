  related_work_outline:
  - 'Mainstream direction: Application work clusters around learned world models as
    predictive simulators, especially for driving scene generation and robot video
    imagination, with diffusion transformers and action, language, or context conditioning.'
  - 'Shared research pattern: Papers train models to predict future observations or
    latent dynamics from actions/context, then use rollouts for policy training, planning,
    or consistency evaluation; many add auxiliary objectives beyond pixel reconstruction.'
  - 'Key differences: Some optimize pixel-level video realism and view consistency;
    others optimize latent dynamics or policy control; evaluation settings range from
    offline benchmarks and simulation to robot policy execution, with differing emphasis
    on physics, memory, or generalization.'
  - 'Trend evolution: Within this frontier, earlier RL world models emphasize efficient
    Atari training; 2024-2025 work shifts toward multimodal embodied/driving generation
    and pretraining; 2025-2026 introduces targeted benchmarks for spatial, memory,
    and action consistency.'
  - 'Open questions: Whether simulator gains translate to real-world safety and task
    success; how to evaluate long-term consistency and physical plausibility; how
    to generalize across unseen contexts, action spaces, and embodiments without assuming
    observable context.'
  related_work_outline_zh:
  - 主流方向：应用研究集中在把世界模型当作预测性仿真器，尤其用于驾驶场景生成、机器人视频想象与策略学习，常采用扩散或Transformer架构并引入动作、语言或上下文条件。
  - 研究共性：多篇工作训练模型预测未来观测或潜在动态，并用生成轨迹支持策略训练、规划或一致性评测；除重建外，常加入物理、记忆或跨视角约束。
  - 关键差异：有的优化像素级视频真实性和视图一致性，有的优化潜在状态动态或动作控制；评测从基准指标到机器人执行不等，对物理、记忆和泛化强调不同。
  - 趋势演进：当前前沿中，早期工作关注高效强化学习世界模型，2024-2025转向具身与驾驶的多模态生成和预训练，2025-2026出现针对空间、记忆和动作一致性的评测基准。
  - 开放问题：仿真与驾驶指标提升能否转化为真实安全与任务成功率；长期记忆和物理合理性如何独立评估；如何跨未见上下文、动作空间和本体泛化。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and interactive task domains
        by learning visual dynamics, physical clues, or video-action couplings for
        policy training and video planning.
      what_remains_open: Transfer across embodiments, datasets, and sim-to-real settings;
        compositional generalization beyond seen primitives; physical plausibility
        under long horizons.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Building driving world models that predict multi-view, long-horizon
        scene videos from driving observations and support zero-shot or long-horizon
        benchmark evaluation.
      what_remains_open: Whether validation improvements on driving benchmarks align
        with closed-loop safety or real operational driving outcomes; limitation evidence
        is sparse.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments for efficient
        policy learning and for measuring action control and memory consistency in
        open-ended worlds.
      what_remains_open: Generalization when environment rules, goals, or action spaces
        change; long-term memory consistency and cross-action-space control remain
        difficult.
    - line: World-model evaluation and consistency benchmarks
      what_it_solves: Providing datasets and metrics for spatial consistency, memory
        consistency, and action control, moving beyond pixel-level generation quality.
      what_remains_open: Metrics are mostly domain-specific; no evidence that benchmark
        scores predict downstream task success or physical safety.
    consensus:
    - 'World models are used as learned predictive simulators: they forecast future
      observations or latent states and support downstream planning, policy training,
      or evaluation.'
    - Generative sequence models, especially diffusion or transformer-based architectures,
      are becoming a shared backbone, often combined with auxiliary objectives such
      as reconstruction, physics signals, or consistency checks.
    - Evaluation is shifting beyond short-horizon visual quality toward long-horizon,
      action-conditional, and consistency-aware assessment.
    disagreements:
    - 'Representation differs: latent state-space rollouts for efficient reinforcement
      learning versus pixel-space video generation versus coupled video-action diffusion.'
    - 'Supervision differs: some rely on self-supervised reconstruction or dynamics,
      while others add physics-informed depth and keypoint tasks, language-primitive
      composition, or context-conditioned latent inference.'
    - 'Evaluation target differs: Atari human-normalized score, driving scene prediction
      metrics, robot task execution, and spatial, memory, or action consistency benchmarks
      are not interchangeable.'
    - 'Interaction mode differs: action-conditional closed-loop control, action-free
      video pretraining, language conditioning, and multi-view generation imply different
      assumptions about available inputs.'
    - 'Deployment setting differs: simulation-only evaluation is common, with limited
      evidence for real-world safety or operational outcomes; several works report
      simulation or dataset results rather than physical robot execution.'
    open_questions:
    - Do improvements in driving video benchmarks transfer to closed-loop autonomous
      driving safety or real operational outcomes?
    - Can world models maintain long-term memory consistency and generalize across
      action spaces in open-ended environments beyond current benchmark settings?
    - How far can compositional generalization be pushed beyond seen primitives when
      language parsing or context observability is imperfect?
    - What physical validity guarantees can come from physics-informed visual generation,
      and how should physical plausibility be measured independently of visual fidelity?
    - Under what conditions can world models trained on large robotic datasets produce
      policies robust enough for real-robot execution?
