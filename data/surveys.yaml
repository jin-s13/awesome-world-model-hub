  related_work_outline:
  - 'Mainstream direction: Video generation models are adopted as world models by
    conditioning on actions, enabling dynamics learning and policy optimization for
    robotic manipulation.'
  - 'Shared research pattern: Most works inject action information into video diffusion
    or autoregressive models, pretrain on large-scale robot datasets, and evaluate
    via visual fidelity and downstream task performance.'
  - 'Key differences: Action conditioning mechanisms vary (frame-level, masked, unified
    timestep), as do physical alignment strategies (reward modeling, DPO, none) and
    reliance on pretrained video models.'
  - 'Trend evolution: The field is moving from pure visual generation toward physically
    plausible and functionally benchmarked world models, with a growing emphasis on
    test-time scaling and zero-shot generalization.'
  - 'Open questions: Whether current architectures can capture explicit state for
    long-term causal reasoning; how to define and automate functional benchmarks for
    physical persistence; and why test-time verifiers often fail to scale.'
  related_work_outline_zh:
  - 主流方向：以动作条件化的视频生成模型作为世界模型，用于机器人操作的动力学学习和策略优化。
  - 研究共性：多数工作将动作信息注入视频扩散或自回归模型，在大规模机器人数据集上预训练，并通过视觉保真度和下游任务性能评估。
  - 关键差异：动作条件化机制（帧级、掩码、统一时间步）、物理对齐策略（奖励建模、DPO、无）以及对预训练视频模型的依赖程度不同。
  - 趋势演进：从纯视觉生成向物理合理且功能基准化的世界模型演进，测试时缩放和零样本泛化受到更多关注。
  - 开放问题：现有架构能否捕捉显式状态以支持长期因果推理；如何定义和自动化物理持久性的功能基准；测试时验证器为何常无法一致缩放。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models for robotics
      what_it_solves: Learning forward dynamics and policies from action-labelled
        video by unifying generation and control within a single architecture.
      what_remains_open: Models lack explicit state construction and struggle with
        long-term physical persistence and causal reasoning; evaluation remains dominated
        by visual fidelity rather than functional benchmarks.
    - line: Test-time scaling and verification for world model reasoning
      what_it_solves: Investigating whether additional compute at inference via verifiers
        improves spatial reasoning from world model trajectories.
      what_remains_open: Current world models form an information bottleneck where
        imagined views fail to enrich fine-grained reasoning; verifiers exhibit poor
        calibration and action biases, and scaling is inconsistent across benchmarks.
    - line: Conceptual taxonomy and foundational gaps in video world models
      what_it_solves: Organizing video generation approaches into state construction
        and dynamics modeling paradigms, and proposing functional benchmarks focused
        on physical persistence and causality.
      what_remains_open: No empirical validation that the taxonomy changes design
        choices; the proposed evaluation shift has not yet been adopted in practice,
        and constructing scalable functional benchmarks remains challenging.
    consensus:
    - Video generation is the dominant medium for building world models in embodied
      AI, with action conditioning as the core mechanism to inject control.
    - Larger-scale pretraining on diverse robot datasets generally improves visual
      quality and downstream policy performance.
    - There is a growing recognition that visual fidelity alone is insufficient, and
      physical plausibility, task logic, and long-term consistency must be evaluated.
    disagreements:
    - 'How to inject action: some use per-frame conditioning inside transformer blocks,
      others use masked autoregression or unified diffusion timesteps, and some adapt
      pretrained models without touching their parameters.'
    - Whether to rely on frozen pretrained video diffusion models or train world models
      from scratch on domain-specific data.
    - 'How to align generated videos with physical reality: through human preference
      reward models, DPO-based post-training, or by relying solely on data scale.'
    - 'Evaluation methodology: some papers emphasize visual metrics and policy correlation,
      while others advocate for zero-shot physical benchmarks decoupled from training.'
    open_questions:
    - Can video generation models be augmented with explicit latent state representations
      to support long-horizon causal reasoning and compositional generalization?
    - Under what conditions does test-time compute scaling improve world model reasoning,
      and how can we design verifiers that are calibrated and unbiased?
    - How can we create automated, scalable functional benchmarks that measure physical
      persistence and task logic without relying on expensive human annotations or
      real-world rollouts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向机器人的动作条件化视频世界模型
      解决的问题: 通过统一生成与控制，从动作标记视频中学习前向动力学和策略。
      尚未覆盖: 模型缺乏显式状态构建，长期物理持久性和因果推理困难；评估仍以视觉保真度为主，功能基准未普及。
    - 路线: 世界模型推理中的测试时缩放与验证
      解决的问题: 研究通过测试时计算和验证器利用世界模型轨迹改善空间推理的可行性。
      尚未覆盖: 当前世界模型形成信息瓶颈，想象视图无法丰富细粒度推理；验证器校准差、存在动作偏差，缩放不一致。
    - 路线: 视频世界模型的概念分类与基础缺口
      解决的问题: 将视频生成方法归纳为状态构建和动态建模范式，并倡导以物理持久性和因果性为核心的功能基准。
      尚未覆盖: 尚无实证表明该分类法改变设计选择；评估范式转变尚未在实践中落地，可扩展的功能基准构建仍具挑战。
    共识:
    - 视频生成是具身AI中构建世界模型的主要媒介，动作条件化是注入控制的核心机制。
    - 在多样化机器人数据集上更大规模的预训练普遍提升视觉质量与下游策略性能。
    - 越来越多工作认识到仅视觉保真度不足，必须评估物理合理性、任务逻辑和长期一致性。
    分歧:
    - 动作注入方式：有的在Transformer块内使用逐帧条件化，有的采用掩码自回归或统一扩散时间步，还有的在不修改参数的情况下适配预训练模型。
    - 是否依赖冻结的预训练视频扩散模型，还是从头在领域数据上训练世界模型。
    - 生成视频与物理现实对齐的方式：通过人类偏好奖励模型、基于DPO的后训练，或仅依赖数据规模。
    - 评估方法论：部分工作强调视觉指标和策略相关性，另一些则倡导与训练解耦的零样本物理基准。
    开放问题:
    - 能否在视频生成模型中引入显式潜在状态表示，以支持长时域因果推理和组合泛化？
    - 测试时计算在什么条件下能改善世界模型推理，如何设计校准良好且无偏的验证器？
    - 如何创建自动化、可扩展的功能基准，衡量物理持久性和任务逻辑，而不依赖昂贵的人工标注或真实环境部署？
