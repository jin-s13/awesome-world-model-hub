  - 'Mainstream direction: Survey and roadmap synthesis around world models is consolidating
    video generation, autonomous driving, and embodied agent research into unified
    taxonomies and evaluation frameworks.'
  - 'Shared research pattern: Works organize design spaces by latent representations,
    structural priors, spatiotemporal dynamics, long-horizon memory, and controllable
    generation, often pairing conceptual frameworks with benchmark proposals.'
  - 'Key differences: Contributions range from general-purpose synthesis to application-specific
    roadmaps; some provide conceptual taxonomies without empirical validation, while
    others anchor claims in datasets, simulations, or released systems.'
  - 'Trend evolution: The 2022-2023 evidence shows early data-driven world-model methods;
    2024 pivots toward comprehensive simulation surveys; 2025-2026 shifts to unified
    taxonomies, evaluation frameworks, benchmarks, and open-source real-time systems.'
  - 'Open questions: Whether syntheses are grounded in systematic review criteria,
    which evaluation settings are comparable, how to prioritize gaps, and how to validate
    out-of-sight persistence and closed-loop behavior remain unresolved.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型的综述与路线图研究，正在将视频生成、自动驾驶和具身智能体等方向整合为统一分类体系与评估框架。
  - 研究共性：研究普遍按潜在表示、结构先验、时空动态、长期记忆和可控生成组织设计空间，并尝试将概念框架与基准或评估建议结合。
  - 关键差异：一部分工作提供通用综合，一部分聚焦自动驾驶或机器人等应用；有的以概念分类和开放挑战为主，有的以数据集、仿真或开源系统作为实证支撑。
  - 趋势演进：2022-2023 年更多是数据驱动的世界模型方法；2024 年出现围绕生成视频模拟的综合综述；2025-2026 年转向统一分类法、评估框架、基准和实时开源系统。
  - 开放问题：综述是否基于系统化筛选标准、不同评测设置是否可比、应优先解决哪些缺口，以及如何验证视线外动态和闭环行为仍待回答。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Consolidates fragmented world-model research into design dimensions,
        structural priors, and research directions across video, driving, and embodied
        settings.
      what_remains_open: Whether the synthesis follows systematic evidence criteria
        or relies on selected examples and unvalidated conceptual categories.
    - line: Comparative evaluation synthesis
      what_it_solves: Makes evaluation choices explicit, including benchmarks, metrics,
        and open-loop versus closed-loop assessment, so conclusions can be compared
        across studies.
      what_remains_open: Whether results are actually compatible across different
        datasets, simulation settings, and metric definitions; many evaluation prescriptions
        remain unimplemented.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad coverage of world models into concrete next-step
        questions such as persistent out-of-sight dynamics, real-robot execution,
        and open-source real-time accessibility.
      what_remains_open: Which gaps should be prioritized for progress, and how to
        verify that addressing a gap transfers from one application setting to another.
    consensus:
    - World models are positioned as a common substrate for video generation, autonomous
      driving, and embodied agent research rather than separate niche topics.
    - Long-horizon and controllable generation are recurring requirements; papers
      address them through memory, compositionality, latent state, or persistent dynamic
      state.
    - There is agreement that evaluation needs to move beyond short-horizon visual
      quality toward controllable behavior, closed-loop dynamics, and benchmark coverage.
    - Conceptual taxonomies and evaluation frameworks are treated as important consolidation
      tools, but several contributions do not yet empirically validate them.
    disagreements:
    - 'Representation choices differ: language-driven compositional primitives, unified
      latent-state frameworks, and explicit persistent 3D/dynamic state make different
      assumptions about what should be modeled.'
    - 'Supervision and evidence differ: some works rely on simulation results or motion
      metrics, others propose datasets and benchmarks, and some provide only conceptual
      frameworks without experiments.'
    - 'Interaction and deployment settings differ: some target offline video planning,
      others real-time interactive generation, open-source system release, or autonomous
      driving simulation.'
    - 'Scope differs: general-purpose world-model synthesis coexists with application-specific
      roadmaps for driving or robotics, producing different coverage boundaries.'
    open_questions:
    - Are the taxonomies and roadmaps grounded in systematic literature screening,
      or do they overgeneralize from selected examples?
    - Which benchmark settings and metrics can support fair comparison of world models
      across video, driving, and embodied domains?
    - How can out-of-sight dynamics and long-term persistence be measured without
      relying only on short-horizon visual consistency?
    - 'Which open gaps should the field prioritize: real-robot validation, open-source
      access, closed-loop metrics, or improved memory and controllability?'
    - Can conceptually proposed evaluation frameworks be implemented and shown to
      reduce open-loop to closed-loop mismatch?
    - 'Visible evidence leaves a verification gap: several contributions omit limitation
      details, implemented evaluations, or artifact access, so negative space cannot
      be separated from unreported evidence.'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将分散的世界模型研究整合为设计维度、结构先验和研究方向，覆盖视频、驾驶与具身场景。
      尚未覆盖: 综合是否基于系统化证据标准，还是依赖选择性示例和未经验证的概念分类。
    - 路线: 对比评测综合
      解决的问题: 明确评测选择，包括基准、指标以及开环与闭环评估，使跨研究结论更具可比性。
      尚未覆盖: 不同数据集、仿真设置和指标定义下的结果是否真正兼容；许多评测方案尚未被实现。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛的世界模型文献转化为具体后续问题，如持久化视线外动态、真实机器人执行和开源实时可访问性。
      尚未覆盖: 哪些缺口应优先解决，以及解决某一缺口是否能跨应用场景迁移。
    共识:
    - 世界模型被定位为视频生成、自动驾驶和具身智能体研究的共同基础，而不是彼此无关的小方向。
    - 长时程与可控生成是反复出现的要求，研究通过记忆、组合性、潜在状态或持久动态状态来应对。
    - 研究普遍认为评测需要超越短期视觉质量，转向可控行为、闭环动态和基准覆盖。
    - 概念性分类法和评估框架被视为重要整合工具，但部分工作尚未对其进行实证验证。
    分歧:
    - 表示方式不同：语言驱动的组合原语、统一潜在状态框架，以及显式持久三维/动态状态对不同建模对象做出不同假设。
    - 监督与证据不同：有的依赖仿真结果或运动指标，有的提出数据集和基准，也有工作只提供概念框架而缺少实验。
    - 交互与部署场景不同：有的面向离线视频规划，有的面向实时交互生成、开源系统发布或自动驾驶仿真。
    - 范围不同：通用世界模型综合与应用专属的驾驶或机器人路线图并存，覆盖边界不同。
    开放问题:
    - 分类法和路线图是否基于系统化文献筛选，还是会从选择性示例中过度外推？
    - 哪些基准设置和指标能够支持跨视频、驾驶与具身领域的公平比较？
    - 如何在不依赖短期视觉一致性的前提下评估视线外动态和长期持久性？
    - 应当优先推进哪些开放缺口：真实机器人验证、开源可访问性、闭环指标，还是改进记忆与可控性？
    - 概念性提出的评估框架能否被实现，并证明可以减少开环到闭环不一致？
    - 可见证据存在验证缺口：部分工作未披露局限性细节、未实现评估框架，或未提供工件访问，因此无法区分真实缺口和未报告证据。
