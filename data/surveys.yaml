  related_work_outline:
  - 'Mainstream direction: Building controllable world models as simulators for autonomous
    driving and robotics, using action-conditioned video generation to enable interactive
    closed-loop simulation.'
  - 'Shared research pattern: All works learn latent dynamics or diffusion models
    to predict future frames and incorporate action/control signals to improve controllability;
    they emphasize benchmarking spatial consistency, action fidelity, and visual quality.'
  - 'Key differences: Evaluation targets vary (spatial consistency vs. action fidelity
    vs. physical plausibility); application domains differ (Minecraft, autonomous
    driving, robotics); control granularity ranges from high-level commands to low-level
    trajectories; training strategies split between training from scratch and fine-tuning
    pretrained models.'
  - 'Trend evolution: The field shifted from single-environment world models (e.g.,
    Dreamer) to multi-domain controllable simulators in 2024–2025, and by 2026 there
    is a focus on frame-autoregressive closed-loop generation and interactive modeling,
    moving toward real-time, physically plausible systems.'
  - 'Open questions: How to ensure long-horizon consistency in autoregressive generation;
    how to generalize to unseen physical environments; how to balance speed and fidelity
    in real-time interaction; how to build unified cross-domain benchmarks for world
    model capability.'
  related_work_outline_zh:
  - 主流方向：构建可控世界模型作为自动驾驶和机器人领域的模拟器，通过动作条件视频生成实现交互式闭环模拟。
  - 研究共性：所有工作都学习潜在动力学或扩散模型预测未来帧，引入动作/控制信号提升可控性，并强调通过基准测试评估空间一致性、动作忠实度和视觉质量。
  - 关键差异：评测目标不同（空间一致性 vs 动作忠实度 vs 物理合理性）；应用领域不同（Minecraft、自动驾驶、机器人）；控制粒度不同（高层命令 vs
    低层轨迹）；训练策略不同（从头训练 vs 微调预训练模型）。
  - 趋势演进：从早期单一环境世界模型（如Dreamer）发展到2024–2025年的多领域可控模拟器，到2026年聚焦于帧级自回归闭环生成和交互式建模，逐步迈向实时、物理合理的系统。
  - 开放问题：长时域自回归生成的一致性如何保证；如何泛化到未见物理环境；实时交互中如何平衡速度与保真度；如何建立统一的跨领域世界模型基准。
  literature_review:
    line_of_work_matrix:
    - line: World model benchmarks and evaluation toolkits (e.g., LoopNav, ACT-Bench)
      what_it_solves: Quantifying spatial consistency, action fidelity, and other
        properties of world models through standardized testbeds.
      what_remains_open: Coverage is limited to a few environments; cross-domain generalization
        and unified evaluation protocols are missing.
    - line: Physics-informed embodied world models (e.g., RoboScape)
      what_it_solves: Generating physically plausible robot videos by jointly learning
        depth prediction and keypoint dynamics.
      what_remains_open: Accuracy of physical modeling for complex contacts and deformations
        is unverified; generalization across robot platforms is not shown.
    - line: High-fidelity controllable driving world models (e.g., Vista, FAR-Drive,
        Terra)
      what_it_solves: Producing high-quality multi-view driving videos with versatile
        control for closed-loop simulation.
      what_remains_open: Long-horizon and cross-view consistency still degrade; real-time
        multi-GPU deployment and generalization to different sensor setups remain
        unaddressed.
    - line: Contextual world models for zero-shot generalization (e.g., cRSSM)
      what_it_solves: Enabling zero-shot policy transfer to unseen dynamics by conditioning
        latent states on observable context.
      what_remains_open: Assumes context observability, limiting applicability to
        partial-observation settings; validated on only two tasks.
    - line: Pretrained video models as world simulators (e.g., DWS)
      what_it_solves: Turning pretrained video generators into controllable simulators
        with lightweight action-conditioned modules, reducing training cost.
      what_remains_open: Focus on dynamics may sacrifice fine visual details; inherited
        biases from pretrained models; generalization to specialized domains remains
        untested.
    consensus:
    - All works aim to build controllable generative world models as simulators for
      policy learning or evaluation.
    - Action-conditioning is a central mechanism to achieve controllable future prediction.
    - Most contributions release code, datasets, or benchmarks to support reproducibility.
    disagreements:
    - 'Evaluation metrics differ: some prioritize spatial consistency, others action
      fidelity or visual quality, leading to incomparable claims.'
    - Application domains (Minecraft, robotics, autonomous driving) impose distinct
      dynamics assumptions and control requirements.
    - Control signal formats vary from continuous trajectories and discrete commands
      to high-level goals, affecting model architecture design.
    - The role of physical priors ranges from purely data-driven learning to explicit
      integration of depth and keypoint dynamics.
    open_questions:
    - How to design a unified cross-domain benchmark that evaluates controllability,
      consistency, and physical plausibility under a single protocol?
    - What mechanisms can mitigate accumulated error in long-horizon autoregressive
      world model rollouts without sacrificing responsiveness?
    - What are the latency–fidelity trade-offs when deploying world models in real-time
      closed-loop systems?
    - How can world models be adapted to unknown dynamics and unseen environments
      without assuming observable context variables?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准与评估工具（如LoopNav、ACT-Bench）
      解决的问题: 通过标准化测试平台量化世界模型的空间一致性、动作忠实度等属性。
      尚未覆盖: 覆盖的环境和任务有限，缺乏跨领域泛化评测和统一的评估协议。
    - 路线: 物理信息具身世界模型（如RoboScape）
      解决的问题: 通过联合学习深度预测和关键点动力学，生成物理上合理的机器人视频。
      尚未覆盖: 复杂接触和形变的物理建模精度未验证，跨机器人平台泛化能力未展示。
    - 路线: 高保真可控驾驶世界模型（如Vista、FAR-Drive、Terra）
      解决的问题: 生成高质量多视角驾驶视频，提供多种控制方式用于闭环模拟。
      尚未覆盖: 长时域和跨视图一致性仍会退化，多GPU实时部署和不同传感器设置的泛化未解决。
    - 路线: 上下文世界模型与零样本泛化（如cRSSM）
      解决的问题: 通过将潜在状态条件化于可观测上下文，实现对新动力学的零样本策略迁移。
      尚未覆盖: 假设上下文可观测，限制了对部分可观测环境的适用性，仅在两个任务上验证。
    - 路线: 预训练视频模型作为世界模拟器（如DWS）
      解决的问题: 利用轻量级动作条件模块将预训练视频生成器转换为可控模拟器，降低训练成本。
      尚未覆盖: 专注动态可能牺牲细粒度视觉细节，继承预训练模型偏差，专业领域泛化未测试。
    共识:
    - 所有工作都致力于构建可控生成式世界模型，作为策略学习或评估的模拟器。
    - 动作条件化是实现可控未来预测的核心机制。
    - 大多数贡献公开了代码、数据集或基准，以支持可复现性。
    分歧:
    - 评估指标不同：有的侧重空间一致性，有的侧重动作忠实度或视觉质量，导致难以直接比较。
    - 应用领域（Minecraft、机器人、自动驾驶）施加了不同的动力学假设和控制需求。
    - 控制信号形式从连续轨迹、离散指令到高层目标不等，影响模型架构设计。
    - 物理先验的作用从纯数据驱动学习到显式集成深度和关键点动力学，程度不一。
    开放问题:
    - 如何设计统一的跨领域基准，在单一协议下评估可控性、一致性和物理合理性？
    - 何种机制能在不牺牲响应速度的情况下，缓解长时域自回归世界模型推演中的累积误差？
    - 在实时闭环系统中部署世界模型时，延迟与保真度的权衡如何？
    - 如何在不假设可观测上下文变量的情况下，使世界模型适应未知动力学和未见环境？
