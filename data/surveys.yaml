  related_work_outline:
  - 'Mainstream direction: Recent benchmark-oriented work centers on evaluating world
    models through action-conditioned video prediction and control rollouts, especially
    in driving, robotics, and open-domain scenes.'
  - 'Shared research pattern: Studies combine shared datasets or suites with visual
    fidelity, consistency, action-control, or policy-performance metrics rather than
    relying only on aggregate reconstruction scores.'
  - 'Key differences: Work splits between proposing new benchmark tasks or metrics,
    and using existing suites to validate generative or model-based agents; representations
    and supervision also differ across diffusion, recurrent state-space, and physics-informed
    designs.'
  - 'Trend evolution: The evidence moves from Atari/CARL model-based RL in 2023-2024
    toward 2025-2026 open-domain, long-horizon, memory, physics, and cross-action
    benchmarks for driving and robotics.'
  - 'Open questions: How proxy consistency scores align with downstream decisions,
    how stable conclusions are across datasets and action spaces, and whether current
    tasks cover real deployment boundaries remain unresolved.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型的基准工作近年集中于驾驶、机器人和开放域场景中的动作条件视频预测与控制展开评测。
  - 研究共性：研究通常将共享数据集或评测套件与视觉保真度、一致性、动作控制或策略性能指标结合，而非仅看聚合重建分数。
  - 关键差异：一部分工作提出新的基准任务与指标，另一部分使用现有套件验证生成式或基于模型的智能体；表示方式和监督信号也不同。
  - 趋势演进：证据显示从2023-2024年Atari/CARL的基于模型的强化学习，转向2025-2026年面向驾驶与机器人的长时域、记忆、物理和跨动作空间基准。
  - 开放问题：代理一致性分数是否与下游决策一致、结论能否跨数据集与动作空间保持稳定、当前任务是否覆盖真实部署边界，仍无定论。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared datasets for world-model abilities such as spatial
        consistency, memory consistency, and action control.
      what_remains_open: Whether curated open-domain videos capture the physical,
        long-horizon, and multi-agent settings where world models are deployed.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate reconstruction by scoring spatial consistency,
        memory consistency, and action control across viewpoints and action spaces.
      what_remains_open: Alignment between these proxy metrics and downstream control
        or decision utility remains largely unverified.
    - line: Standardized model-based control and driving evaluation
      what_it_solves: Uses shared suites and baselines to compare world-model qualities
        through Atari 100k, CARL, driving datasets, and large robot pretraining corpora.
      what_remains_open: Conclusions may not transfer across datasets, embodiments,
        or compute budgets; several limitation and artifact details are missing.
    - line: Physics-informed and context-conditioned world-model evaluation
      what_it_solves: Evaluates visual fidelity, physical plausibility, and zero-shot
        generalization by adding physics or context signals to world models.
      what_remains_open: 'Evidence is narrow: contextual evaluation covers two CARL
        tasks, while physics-informed results rely heavily on visual and downstream
        robot task scores.'
    consensus:
    - Recent work treats world-model quality as measurable through action-conditioned
      video prediction, control rollouts, or policy performance on shared suites.
    - Benchmarks increasingly emphasize temporal or spatial consistency and action
      control rather than aggregate visual quality alone.
    - Many studies pair visual realism with auxiliary cues such as physics, context,
      or memory to stress world-model generalization.
    disagreements:
    - 'Evaluation target differs: some studies measure agent performance on Atari/CARL
      benchmarks, while others target driving or robot video fidelity, spatial memory,
      or cross-action control.'
    - 'Representation choice differs: diffusion-based generative models, recurrent
      state-space models, and transformer-VAE hybrids are used with different trade-offs.'
    - 'Supervision signal differs: approaches use mask reconstruction, context conditioning,
      physics-informed depth and keypoint tasks, or coupled video-action diffusion.'
    open_questions:
    - Do spatial-consistency and memory-consistency scores predict downstream control
      success in real deployments?
    - How stable are world-model benchmark rankings across datasets, embodiments,
      action spaces, and compute budgets?
    - Are current benchmark distributions representative of the long-horizon physical
      and multi-agent settings where world models are expected to help?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享数据集，用于评估世界模型的空间一致性、记忆一致性和动作控制等能力。
      尚未覆盖: 精选的开放域视频是否覆盖物理、长时域和多智能体等真实部署场景仍有待验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合重建之外，对空间一致性、记忆一致性和跨视角/动作空间的动作控制进行评分。
      尚未覆盖: 这些代理指标与下游控制或决策效用之间的一致性尚未得到充分验证。
    - 路线: 标准化基于模型的控制与驾驶评测
      解决的问题: 通过 Atari 100k、CARL、驾驶数据集和大规模机器人预训练语料等共享套件比较世界模型质量。
      尚未覆盖: 结论未必能跨数据集、具身形态或算力预算迁移；部分局限和工件细节缺失。
    - 路线: 物理信息与上下文条件的世界模型评测
      解决的问题: 通过加入物理或上下文信号评估视觉保真度、物理合理性和零样本泛化能力。
      尚未覆盖: 证据范围较窄；上下文评估仅覆盖两个CARL任务，物理信息结果高度依赖视觉和机器人下游任务分数。
    共识:
    - 近期研究将世界模型质量视为可通过动作条件视频预测、控制展开或共享套件上的策略性能来衡量。
    - 基准越来越多地强调时序或空间一致性与动作控制，而非仅关注聚合视觉质量。
    - 许多研究将视觉真实感与物理、上下文或记忆等辅助线索结合，以考验世界模型的泛化能力。
    分歧:
    - 评测目标不同：一些研究测量 Atari/CARL 基准上的智能体性能，另一些则关注驾驶或机器人视频保真度、空间记忆或跨动作控制。
    - 表示方式不同：基于扩散的生成模型、循环状态空间模型和 Transformer-VAE 混合模型各有取舍。
    - 监督信号不同：方法分别使用掩码重建、上下文条件、物理信息深度与关键点任务，或视频与动作扩散耦合训练。
    开放问题:
    - 空间一致性和记忆一致性评分能否预测真实部署中的下游控制成功率？
    - 世界模型基准排名在不同数据集、具身形态、动作空间和算力预算下是否稳定？
    - 当前基准分布是否代表世界模型预期发挥作用的长时域物理和多智能体设置？
