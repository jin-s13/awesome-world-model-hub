  - 关键差异：表示方式涵盖隐状态世界模型与扩散/自回归视频模型；监督信号包括物理任务、运动增强损失和基准指标；评测从零样本强化学习到闭环驾驶不等。
  - 趋势演进：可用高排序证据集中在 2024–2026，趋势处于当前前沿：从高保真生成走向闭环、实时、基准化的模拟系统。
