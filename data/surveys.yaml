  related_work_outline:
  - 'Mainstream direction: Generative world models based on diffusion transformers
    and structured priors are being developed for high-fidelity video prediction and
    downstream decision-making, with a strong focus on driving, robotics, and gaming
    domains.'
  - 'Shared research pattern: Most works treat world modeling as a video generation
    task, incorporate action, language, or physics as conditioning signals, and evaluate
    on visual quality or task-specific metrics, often using self-supervised or weakly
    supervised learning.'
  - 'Key differences: Methods diverge on the representation space (pixel-space video
    generation vs. latent-state dynamics), the supervision modalities (actions, language,
    depth, keypoints), and the evaluation targets (visual fidelity, spatial consistency,
    policy performance, or zero-shot generalization).'
  - 'Trend evolution: The field is moving from compact latent dynamics for RL (e.g.,
    Dreamer variants) toward large-scale diffusion-based video architectures, increasingly
    integrating structured information (physics, compositionality, unified action-video
    diffusion), and recently adding dedicated benchmarks for memory and control.'
  - 'Open questions: Long-term memory consistency and cross-action generalization
    remain unsolved; the transferability of structured priors to real-world open environments
    is largely unverified; and a unified evaluation protocol that links generation
    quality to task success is still missing.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer和结构化先验的生成式世界模型，旨在实现高保真视频预测并支持下游决策，重点关注驾驶、机器人和游戏领域。
  - 研究共性：多数工作将世界模型视为视频生成任务，以动作、语言或物理作为条件信号，通过自监督或弱监督训练，并在视觉质量或任务特定指标上评估。
  - 关键差异：方法在表示空间（像素级视频生成 vs. 潜在状态动力学）、监督模态（动作、语言、深度、关键点）和评估目标（视觉保真度、空间一致性、策略性能或零样本泛化）上存在分歧。
  - 趋势演进：领域正从用于RL的紧凑潜在动力学模型（如Dreamer变体）转向大规模扩散视频架构，并逐步融入结构化信息（物理、组合性、统一动作-视频扩散），近期还出现了专门评估记忆和控制的基准。
  - 开放问题：长时域记忆一致性和跨动作空间泛化仍待解决；结构化先验向真实开放环境的迁移性尚未得到广泛验证；缺少将生成质量与任务成功率关联的统一评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures and training
        recipes, such as diffusion transformers with mask reconstruction, compositional
        language-conditioned video generation, physics-informed joint learning, and
        unified video-action diffusion, to produce high-fidelity, controllable future
        predictions.
      what_remains_open: How well these structured representations transfer to unseen
        environments, real-world robotics, or novel physical interactions beyond the
        training distribution, and whether the added complexity is justified by the
        gain over simpler baselines.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making by embedding
        actions within world models, enabling policies trained in imagination, conditional
        video plans, and flexible rollouts that combine policy and dynamics.
      what_remains_open: Disentangling the contributions of the world model from the
        planner or policy; the reliance on observable context or predefined action
        spaces; and the limited evaluation on narrow task suites that may not reflect
        open-world deployment.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing standardized benchmarks and metrics to evaluate world
        model capabilities like spatial consistency, memory, and action controllability,
        moving beyond visual fidelity alone.
      what_remains_open: The gap between benchmark metrics and downstream task performance;
        the coverage of diverse scenarios and action spaces; and the absence of rigorous
        ablation studies that isolate the proposed method from dataset, implementation,
        or pretraining effects.
    consensus:
    - Generative models, especially diffusion and transformer architectures, have
      become the backbone for world models that predict future video frames.
    - Incorporating structured priors—such as object masks, language primitives, physics
      knowledge, or action embeddings—improves generation quality and downstream task
      relevance.
    - World models are evaluated primarily through visual fidelity, task-specific
      metrics, or benchmarked consistency; their claimed benefits for policy learning
      are often demonstrated in simulation or narrow domains.
    - Recent benchmarks reveal that existing world models still struggle with long-term
      memory, spatial consistency, and action control, indicating a need for better
      evaluation standards.
    disagreements:
    - Pixel-space video generation (e.g., diffusion-based models) versus latent-state
      dynamics (e.g., Dreamer variants) as the core representation for world models.
    - 'Supervision signals vary significantly: some rely on action-annotated sequences,
      some use language instructions, others incorporate depth and keypoints, and
      a few learn from action-free video.'
    - 'Evaluation targets differ: some papers prioritize visual quality and FID-like
      metrics, while others focus on spatial consistency scores, memory consistency,
      or zero-shot policy generalization.'
    - 'The degree of grounding in physical realism differs: some models enforce physics
      through auxiliary losses, while others rely purely on data-driven appearance
      learning without explicit physics constraints.'
    open_questions:
    - How can world models maintain memory consistency over long horizons, especially
      when the viewpoint changes or objects are temporarily occluded?
    - Can structured priors learned in simulated or narrow domains transfer to open-ended
      real-world scenarios without catastrophic forgetting or domain gap?
    - What evaluation protocol would best correlate world model quality with downstream
      task success, and can it be standardized across diverse environments and action
      spaces?
    - Is the added complexity of physics-informed or compositional models justified
      by consistent gains over simpler, scalable baselines when tested under rigorous
      ablation protocols?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念转化为具体架构和训练配方，如基于掩码重建的扩散Transformer、组合式语言条件视频生成、物理信息联合学习以及统一视频-动作扩散，以生成高保真、可控的未来预测。
      尚未覆盖: 这些结构化表示在未见环境、真实机器人操作或训练分布外的新型物理交互中的迁移能力，以及增加的复杂性是否比简单基线带来足够收益。
    - 路线: 规划与动作接口方法
      解决的问题: 通过将动作嵌入世界模型，将学习到的动力学与决策相连接，实现基于想象的策略训练、条件视频规划以及策略与动力学相结合的灵活推演。
      尚未覆盖: 世界模型与规划器/策略的贡献难以分离；对可观测上下文或预定义动作空间的依赖；评估局限于狭窄任务套件，可能无法反映开放世界部署。
    - 路线: 方法证据与消融协议
      解决的问题: 提供标准化基准和指标，用于评估世界模型的空间一致性、记忆和动作可控性等能力，超越单一的视觉保真度。
      尚未覆盖: 基准指标与下游任务性能之间的差距；多样化场景和动作空间的覆盖范围；缺乏将所提方法从数据集、实现或预训练效果中分离出来的严格消融研究。
    共识:
    - 生成式模型，特别是扩散和Transformer架构，已成为预测未来视频帧的世界模型的核心基础。
    - 引入结构化先验（如物体掩码、语言原语、物理知识或动作嵌入）可提升生成质量和下游任务相关性。
    - 世界模型主要通过视觉保真度、任务特定指标或基准一致性来评估，其对策略学习的好处通常在仿真或狭窄领域中得到展示。
    - 近期基准测试表明，现有世界模型在长期记忆、空间一致性和动作控制方面仍面临困难，需要更好的评估标准。
    分歧:
    - 像素级视频生成（如基于扩散的模型）与潜在状态动力学（如Dreamer变体）作为世界模型的核心表示存在分歧。
    - 监督信号差异显著：有的依赖动作标注序列，有的使用语言指令，有的融入深度和关键点，还有的从无动作视频中学习。
    - 评估目标不同：有些工作优先考虑视觉质量和FID类指标，而另一些则聚焦于空间一致性分数、记忆一致性或零样本策略泛化。
    - 物理真实性的依据程度不同：部分模型通过辅助损失强制执行物理约束，而其他模型则完全依赖数据驱动的外观学习，未显式建模物理。
    开放问题:
    - 世界模型如何在长时域上保持记忆一致性，尤其是在视角变化或物体暂时被遮挡时？
    - 在模拟或狭窄领域中学到的结构化先验能否迁移到开放的真实世界场景，而不出现灾难性遗忘或领域差距？
    - 哪种评估协议能最好地将世界模型质量与下游任务成功率关联起来，并能在多样化环境和动作空间中标准化？
    - 在严格的消融协议下，物理信息或组合模型所增加的复杂性是否比简单且可扩展的基线带来持续且显著的收益？
