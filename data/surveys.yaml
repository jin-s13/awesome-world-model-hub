      尚未覆盖: 对训练中未见原语组合之外的新指令和真实机器人迁移未充分验证
    - 路线: 世界模型一致性评测基准
      解决的问题: 在像素生成质量之外量化空间一致性、记忆一致性和动作控制
      尚未覆盖: 评测环境集中于Minecraft或策展视频，跨环境和下游任务有效性仍待证明
    共识:
    - 应用型世界模型越来越多地把未来视频生成作为可用于控制或评测的中间对象。
    - 动作、语言或上下文条件化是让生成未来与任务相关的常见机制。
    - 除像素重建外，方法还引入掩码重建、深度/关键点预测、动力学建模或一致性评分等辅助目标。
    - 新基准开始从视觉质量和任务得分之外，评测空间、记忆和动作控制等一致性属性。
    - 当前证据主要来自仿真或基准测试，真实世界验证仍然有限。
    分歧:
    - 架构与动力学表示不同：循环状态空间或Transformer-VAE的潜在推演，对比扩散式视频生成。
    - 监督信号不同：可观测上下文、语言原语、物理深度/关键点、动作扩散或掩码重建。
    - 评测领域不同：驾驶数据集、机器人操作数据集、Atari/CARL和Minecraft类开放世界。
    - 交互模式不同：用于策略优化的潜在想象、显式视频生成，或闭环一致性探测。
    - 部署成熟度不同：部分工作面向仿真中的策略学习与评估，驾驶相关工作未闭合真实安全差距。
    开放问题:
    - 驾驶视频预测基准在多大程度上能预测真实安全结果，目前证据尚未提供运营层面的验证。
    - 基于可观测上下文的零样本动力学泛化能否扩展到更复杂的上下文强化学习任务之外。
    - 组合式机器人世界模型能否处理超出已见原语组合的新指令和真实物理交互。
    - 需要何种记忆或架构机制才能在跨视角和跨动作空间下维持长期一致性。
    - 物理信息驱动的生成是否真的带来可迁移到真实机器人的下游策略收益，而非仅仿真视觉合理性。
