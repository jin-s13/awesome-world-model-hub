  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video/diffusion transformer
    world models for embodied and driving settings, often adding auxiliary objectives
    such as mask reconstruction, physics signals, context conditioning, or unified
    action-video modeling.'
  - 'Shared research pattern: A learned dynamics or video model generates imagined
    or future observations, then is judged by prediction quality, downstream policy
    success, or consistency and controllability benchmarks.'
  - 'Key differences: Methods split between compact latent state-space RL models and
    high-dimensional video diffusion models; evaluations range from Atari efficiency
    and CARL zero-shot dynamics to driving video, robot imagination, and Minecraft/MIND
    consistency.'
  - 'Trend evolution: From 2023 stochastic transformer RL world models to 2024-2025
    embodied/driving video generation and benchmark construction, then to 2026 emphasis
    on long-term memory consistency and action-space generalization. The evidence
    here is concentrated in 2023-2026.'
  - 'Open questions: How to prove model gains isolate from planner, dataset, and baseline
    choices; how to measure physical plausibility and long-term spatial/memory consistency;
    and how to generalize beyond seen context, primitive, or action spaces.'
  related_work_outline_zh:
  - 主流方向：近年来以生成式视频/扩散Transformer世界模型为主，面向具身与驾驶场景，并加入掩码重建、物理信号、上下文条件或统一动作-视频建模等辅助目标。
  - 研究共性：学习动力学或视频模型以生成想象或未来观测，并通过预测质量、下游策略成功率或一致性/可控性基准进行评估。
  - 关键差异：方法分为紧凑隐状态空间RL模型与高维视频扩散模型；评测涵盖Atari效率、CARL零样本动力学、驾驶视频、机器人想象以及Minecraft/MIND一致性。
  - 趋势演进：从2023年随机Transformer RL世界模型，到2024-2025年具身/驾驶视频生成与基准构建，再到2026年关注长期记忆一致性和动作空间泛化；证据集中在2023-2026年。
  - 开放问题：如何证明模型收益与规划器/数据集/基线选择隔离，如何度量物理合理性与长期空间/记忆一致性，如何泛化到未见上下文、原语或动作空间。
  literature_review:
    line_of_work_matrix:
    - line: Generative video/diffusion transformer architectures for world modeling
        (e.g., MaskGWM, RoboScape, UWM)
      what_it_solves: High-dimensional future video prediction in driving and robot
        domains through diffusion/transformer objectives and auxiliary signals such
        as mask reconstruction, depth, keypoints, or action co-diffusion.
      what_remains_open: Several works lack explicit limitation analysis; physical
        plausibility, long-horizon memory, and cross-scene/action generalization remain
        under-specified.
    - line: Compositional and contextual dynamics models (e.g., RoboDreamer, cRSSM)
      what_it_solves: Representing tasks, language goals, or observable context to
        improve zero-shot or compositional generalization for learned dynamics.
      what_remains_open: They depend on observable context values or pre-parsed language
        primitives, so entirely novel primitives, unobserved dynamics, and partially
        observed settings are not covered.
    - line: Efficient stochastic model-based RL methods (e.g., STORM)
      what_it_solves: Learning latent dynamics and training policies from imagined
        trajectories under limited environment interaction.
      what_remains_open: Evidence is concentrated on Atari 100k; comparison with planning/search
        methods, longer-horizon tasks, and formal limitations remains unestablished.
    - line: Benchmark and evaluation protocols for world-model consistency (e.g.,
        LoopNav, MIND)
      what_it_solves: Quantifying spatial consistency, memory consistency, and action
        controllability in open-domain video generation.
      what_remains_open: Some benchmark papers report no experimental baselines; adoption
        across model families and connection to downstream policy success remain unproven.
    consensus:
    - Diffusion/transformer backbones are becoming a common substrate for world models
      that generate future observations.
    - Auxiliary objectives or structural decompositions such as mask reconstruction,
      context conditioning, language primitives, depth/keypoint physics, and action
      co-diffusion are used to improve transfer or fidelity.
    - Evaluation is expanding from single-task prediction or RL score toward spatial/memory
      consistency, action controllability, and downstream policy utility.
    - Model-generated trajectories or dreams serve both as training signal and as
      evidence for generalization.
    disagreements:
    - Latent-state recurrent models optimize policy learning over compact dynamics,
      whereas video/diffusion models optimize high-dimensional observation generation.
    - 'Training objectives differ: MAE-style feature reconstruction, VAE stochastic
      generation, contextual dynamics, primitive-factorized video generation, physics
      auxiliary tasks, and action-video co-diffusion.'
    - 'Evaluation targets differ: Atari average human performance, zero-shot CARL
      dynamics, driving video metrics, robotic task execution, and Minecraft/MIND
      consistency benchmarks.'
    - 'Interaction assumptions differ: action-free video generation, action-conditioned
      future prediction, closed-loop navigation, and policy learning over imagined
      rollouts.'
    - Some methods assume observable context or pre-parsed language primitives, while
      others rely on unified generative models without explicit factorization.
    open_questions:
    - Which evaluation protocol can separate world-model contribution from planner,
      controller, dataset, baseline, and implementation choices?
    - How can long-term memory consistency and cross-action-space generalization be
      measured beyond current small or narrowly scoped benchmarks?
    - Can compositional or contextual methods support truly unseen primitives, unobserved
      dynamics, or partially observed context?
    - Which physical-plausibility metrics are needed to validate RGB video generation
      as a reliable world model for policy training and evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频/扩散Transformer架构（如MaskGWM、RoboScape、UWM）
      解决的问题: 在驾驶和机器人领域生成高维未来视频，通过扩散/Transformer目标与掩码重建、深度、关键点或动作共扩散等辅助信号提升预测能力。
      尚未覆盖: 部分工作缺少明确局限性分析；物理合理性、长时域记忆和跨场景/动作泛化仍未充分验证。
    - 路线: 组合式与上下文动力学模型（如RoboDreamer、cRSSM）
      解决的问题: 通过语言目标或可观测上下文表示任务，改善零样本或组合泛化。
      尚未覆盖: 依赖上下文可观测或预解析原语；对全新原语、未观测动力学和部分观测场景缺乏证据。
    - 路线: 高效随机模型强化学习方法（如STORM）
      解决的问题: 在有限环境交互下学习隐动力学，并利用想象轨迹训练策略。
      尚未覆盖: 证据集中于Atari 100k；与规划/搜索方法、长期任务和正式局限性的比较仍不充分。
    - 路线: 世界模型一致性与动作控制的基准协议（如LoopNav、MIND）
      解决的问题: 量化开放域视频生成中的空间一致性、记忆一致性和动作可控性。
      尚未覆盖: 部分基准工作未报告实验基线；跨模型族采用度与下游策略成功之间的关联尚未证明。
    共识:
    - 扩散/Transformer骨干正成为生成未来观测的世界模型常用基础。
    - 掩码重建、上下文条件、语言原语、深度/关键点物理信号和动作-视频共扩散等辅助目标被用于改进迁移或保真度。
    - 评估正从单一任务预测或RL分数扩展到空间/记忆一致性、动作可控性和下游策略效用。
    - 模型生成的轨迹或梦境同时作为训练信号和泛化证据。
    分歧:
    - 隐状态循环模型优化紧凑动力学中的策略学习，而视频/扩散模型优化高维观测生成。
    - 训练目标不同：MAE式特征重建、VAE随机生成、上下文动力学、原语分解视频生成、物理辅助任务和动作-视频共扩散。
    - 评测目标不同：Atari平均人类表现、CARL零样本动力学、驾驶视频指标、机器人任务执行和Minecraft/MIND一致性。
    - 交互假设不同：无动作视频生成、动作条件未来预测、闭环导航和基于想象轨迹的策略学习。
    - 一些工作依赖可观测上下文或预解析语言原语，另一些则采用无显式分解的统一生成模型。
    开放问题:
    - 哪种评测协议能区分世界模型贡献与规划器、控制器、数据集、基线和实现选择的影响？
    - 如何在当前较小或场景狭窄的基准之外测量长期记忆一致性和跨动作空间泛化？
    - 组合式/上下文方法能否支持真正未见原语、未观测动力学或部分观测上下文？
    - 需要哪些物理合理性指标来验证RGB视频生成作为策略训练和评估的可靠世界模型？
