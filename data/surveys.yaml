  related_work_outline_zh:
  - 主流方向：动作条件视频生成是具身世界模型的主要形式，扩散Transformer是常见但非唯一的骨干。
  - 研究共性：系统从观测和动作生成未来帧，并在视觉保真之外逐步引入物理、任务或决策质量等标准。
  - 关键差异：表示方式涵盖统一扩散、掩码自回归和黑盒适配；对齐方式涵盖基于奖励的RL后训练、DPO式后训练和无显式对齐；评测目标从视觉质量到下游策略、物理合理性和空间推理不等。
  - 趋势演进：在可用的2024-2026前沿内，研究从统一动作-视频预训练走向物理感知后训练和更具诊断性的功能或空间推理评测。
  - 开放问题：生成轨迹是否支持长时程持久性和细粒度因果推理，形式化或概念框架能否改变模型设计，物理对齐能否泛化到操作以外场景。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative pretraining
      what_it_solves: Learning joint policy and dynamics representations from large
        robot datasets by coupling action and video generation in a single model.
      what_remains_open: Evidence centers on robot manipulation, visual controllability,
        and speed; long-horizon physical consistency and out-of-domain transfer remain
        underexplored.
    - line: Adaptation of pretrained video diffusion models to action-conditioned
        world models
      what_it_solves: Reusing closed-source video generation priors without accessing
        model parameters, using lightweight action-conditioning adapters.
      what_remains_open: This requires action-labeled domain data and assumes the
        pretrained video prior is sufficient; generalization beyond tested game and
        robotics domains is not established.
    - line: Physics and preference alignment for generated rollouts
      what_it_solves: Post-training world models to reduce unphysical behavior and
        improve physical fidelity, task logic, embodiment plausibility, and visual
        quality.
      what_remains_open: Human preference data is costly and subjective, evidence
        is concentrated in contact-rich manipulation, and broader domain validation
        or formal guarantees are absent.
    - line: Conceptual and evaluative analysis of state, dynamics, and spatial reasoning
      what_it_solves: Clarifying state construction and dynamics modeling gaps, and
        testing whether world-model rollouts support reliable reasoning, planning,
        or test-time scaling.
      what_remains_open: Whether taxonomies and verifier frameworks translate into
        better model design, persistent state, and causal reasoning remains unresolved.
    consensus:
    - Action-conditioned video generation is treated as a central testbed for embodied
      world models.
    - Visual quality alone is insufficient; physical plausibility, task logic, action
      alignment, or downstream decision quality are increasingly used as additional
      criteria.
    - Large-scale robot or video priors are seen as important for improving generalization
      and controllability.
    disagreements:
    - 'Representation differs: unified action-video diffusion and masked autoregression
      versus adapting an existing video diffusion model with a learned mask.'
    - 'Alignment strategy differs: multi-dimensional reward modeling with RL-style
      post-training versus DPO-style decoupled discriminators versus no explicit physics
      alignment.'
    - 'Evaluation target differs: downstream policy or planning correlation and simulator
      alignment versus visual fidelity and controllability versus physical plausibility
      and trajectory consistency versus spatial reasoning.'
    - 'Deployment assumption differs: black-box use of a pretrained video diffusion
      model versus controlled pretraining on curated robot data versus post-training
      with preference annotations.'
    open_questions:
    - Can generated rollouts preserve persistent state and causal dynamics long enough
      for reliable planning and fine-grained spatial reasoning?
    - Do formal taxonomies or verifier frameworks translate into improved model design
      and evaluation beyond visual benchmarks?
    - Does physics alignment generalize beyond contact-rich manipulation to unseen
      embodiments, tasks, and scenes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成式预训练
      解决的问题: 在单一模型中耦合动作与视频生成，从大规模机器人数据中学习联合策略与动力学表示。
      尚未覆盖: 证据集中在机器人操作、视觉可控性和速度；长时程物理一致性与分布外迁移仍未充分验证。
    - 路线: 预训练视频扩散模型的动作条件适配
      解决的问题: 在不访问模型参数的情况下复用闭源视频生成先验，通过轻量动作条件适配器构建世界模型。
      尚未覆盖: 依赖动作标注领域数据，并假设预训练视频先验足够；超出已测游戏和机器人领域的泛化尚未建立。
    - 路线: 生成轨迹的物理与偏好对齐
      解决的问题: 后训练世界模型以减少非物理行为，并提升物理保真度、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 人类偏好数据昂贵且主观，证据集中在接触丰富操作，缺少更广泛领域验证或形式保证。
    - 路线: 状态、动态与空间推理的概念和评测分析
      解决的问题: 澄清状态构建和动态建模缺口，并检验世界模型轨迹是否能支持可靠推理、规划或测试时缩放。
      尚未覆盖: 分类法和验证器框架能否转化为更好的模型设计、持久状态和因果推理仍未解决。
    共识:
    - 动作条件视频生成被视为具身世界模型的核心测试平台。
    - 仅凭视觉质量不够；物理合理性、任务逻辑、动作对齐或下游决策质量正被纳入额外标准。
    - 大规模机器人或视频先验被认为有助于提升泛化性和可控性。
    分歧:
    - 表示方式不同：统一动作-视频扩散和掩码自回归，与通过学习掩码适配现有视频扩散模型不同。
    - 对齐策略不同：多维奖励模型加RL式后训练，与DPO式解耦判别器或无显式物理对齐不同。
    - 评测目标不同：下游策略或规划相关性与模拟器一致性、视觉保真与可控性、物理合理性与轨迹一致性、空间推理各有侧重。
    - 部署假设不同：黑盒使用预训练视频扩散模型、在策展机器人数据上可控预训练、或带偏好标注后训练存在差异。
    开放问题:
    - 生成轨迹能否在足够长时间内保持持久状态和因果动态，以支持可靠规划与细粒度空间推理？
    - 形式化分类法或验证器框架能否转化为超越视觉基准的模型设计和评测改进？
    - 物理对齐能否泛化到接触丰富操作以外的未知本体、任务和场景？
