  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks and metrics that evaluate
    world models beyond aggregate scores, targeting spatial-temporal consistency,
    memory, and action controllability.'
  - 'Shared research pattern: Proposing new datasets with controlled variations and
    novel metrics that probe specific model capabilities, then benchmarking existing
    models to expose weaknesses.'
  - 'Key differences: Benchmarks differ in the capability probed (spatial consistency
    vs. memory consistency vs. action control), the environment (Minecraft vs. diverse
    video scenes), and the evaluation modality (open-loop video prediction vs. closed-loop
    interactive).'
  - 'Trend evolution: From using generic RL benchmarks (Atari) to dedicated world-model
    benchmarks with fine-grained capability tests; recent 2025–2026 works emphasize
    memory and action control.'
  - 'Open questions: How to ensure benchmark tasks cover real-world deployment scenarios,
    align proxy metrics with downstream decision quality, and maintain stability across
    model implementations.'
  related_work_outline_zh:
  - 主流方向：设计专门的基准和指标，超越总分评估世界模型，聚焦时空一致性、记忆和动作可控性。
  - 研究共性：提出具有受控变化的新数据集和新指标，探测特定模型能力，然后对现有模型进行基准测试以揭示弱点。
  - 关键差异：基准在探测的能力（空间一致性 vs. 记忆一致性 vs. 动作控制）、环境（Minecraft vs. 多样化视频场景）和评估模态（开环视频预测
    vs. 闭环交互）上存在差异。
  - 趋势演进：从使用通用强化学习基准（Atari）转向具有细粒度能力测试的专用世界模型基准；2025–2026 年的近期工作强调记忆和动作控制。
  - 开放问题：如何确保基准任务覆盖真实部署场景，使代理指标与下游决策质量对齐，并保持基准在不同模型实现间的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable by probing specific capabilities such as spatial consistency, memory,
        and action control.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings where world models are expected to help, and whether the designed
        tasks capture long-horizon and cross-action generalization.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores through metrics like scene graph consistency,
        memory consistency, and action control scores.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about, and the sensitivity of metrics to implementation
        details and compute budgets.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable by adopting common benchmarks (e.g.,
        Atari 100k, NuScenes) and reporting conventions, enabling fair comparison
        across world model architectures.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, hyperparameter choices, and compute budgets, and whether
        baseline selection covers the diversity of world model approaches.
    consensus:
    - World models require evaluation beyond aggregate scores, probing spatial-temporal
      consistency, memory, and action controllability.
    - Existing benchmarks reveal that current world models struggle with long-term
      memory consistency and generalization across action spaces.
    - Dedicated benchmarks with controlled variations and novel metrics are necessary
      to expose specific failure modes of world models.
    disagreements:
    - 'Benchmarks differ in the primary capability probed: spatial consistency via
      loop-based navigation versus memory consistency and action control across diverse
      scenes.'
    - 'Evaluation modalities vary: some benchmarks use open-loop video prediction,
      while others employ closed-loop interactive evaluation with action inputs.'
    - 'Metrics differ in design: scene graph consistency scores versus human-normalized
      aggregate scores versus specialized memory and action control metrics.'
    open_questions:
    - How to design benchmarks that capture the full spectrum of world model capabilities,
      including physical plausibility and decision utility, without overfitting to
      a single environment.
    - Whether proxy metrics like scene graph consistency align with downstream task
      performance in real-world applications such as autonomous driving or robotics.
    - How to ensure benchmark rankings remain stable across different model implementations,
      training seeds, and compute budgets.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，通过探测空间一致性、记忆和动作控制等特定能力，使世界模型主张具备可比性。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部真实设置，以及设计的任务是否捕捉到长时域和跨动作泛化。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性、记忆一致性和动作控制分数等指标，在总分之外检验预测、可控性、鲁棒性和决策效用。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致，以及指标对实现细节和算力预算的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过采用通用基准（如 Atari 100k、NuScenes）和报告惯例，使结果可审计，实现世界模型架构间的公平比较。
      尚未覆盖: 基准结论在不同实现、超参数选择和算力预算下是否稳定，以及基线选择是否覆盖世界模型方法的多样性。
    共识:
    - 世界模型需要超越总分的评估，探测时空一致性、记忆和动作可控性。
    - 现有基准揭示当前世界模型在长期记忆一致性和跨动作空间泛化方面存在困难。
    - 具有受控变化和新指标的专用基准对于暴露世界模型的特定失效模式是必要的。
    分歧:
    - 基准在探测的主要能力上存在差异：基于循环导航的空间一致性与跨多样化场景的记忆一致性和动作控制。
    - 评估模态不同：一些基准使用开环视频预测，另一些则采用带动作输入的闭环交互评估。
    - 指标设计不同：场景图一致性分数与人类归一化总分与专门的记忆和动作控制指标。
    开放问题:
    - 如何设计能够捕捉世界模型全部能力（包括物理合理性和决策效用）的基准，同时避免对单一环境过拟合。
    - 场景图一致性等代理指标是否与自动驾驶或机器人等真实应用中的下游任务性能对齐。
    - 如何确保基准排名在不同模型实现、训练种子和算力预算下保持稳定。
