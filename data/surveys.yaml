  related_work_outline:
  - 'Mainstream direction: Generative video and embodied world models dominate recent
    evidence, using diffusion or transformer architectures for driving, robot, and
    game-like video prediction; model-based RL with latent world models remains a
    parallel sub-direction.'
  - 'Shared research pattern: Methods learn predictive dynamics from visual observations,
    actions, language, or context, often adding auxiliary self-supervised objectives
    such as mask reconstruction, depth, keypoint dynamics, or action-video alignment.'
  - 'Key differences: Representation and supervision diverge: compact latent rollouts
    for policy learning vs explicit video generation; action-free video pretraining
    vs action-coupled or context-conditioned training; evaluation ranges from RL scores
    to closed-loop consistency and robot execution.'
  - 'Trend evolution: Within the available frontier evidence (mostly 2023-2026), work
    moves from efficient stochastic RL world models toward compositional, physics-informed,
    and unified video-action world models, alongside benchmarks that test long-horizon
    memory and action control.'
  - 'Open questions: How much gain comes from the model rather than planner, data
    scale, or auxiliary losses; whether compositional models support novel primitives
    or contexts; how to measure long-term spatial consistency and cross-action-space
    generalization; many top papers still lack explicit limitations or comparable
    evidence.'
  related_work_outline_zh:
  - 主流方向：生成式视频与具身世界模型在近期证据中占主导，采用扩散或Transformer架构处理驾驶、机器人和游戏类视频预测；基于模型强化学习的潜在世界模型仍是并行子方向。
  - 研究共性：方法从视觉观测、动作、语言或上下文中学习预测动力学，常加入掩码重建、深度、关键点动力学或视频-动作对齐等自监督辅助目标。
  - 关键差异：表示与监督信号分化：紧凑潜在推演用于策略学习 vs 显式视频生成；无动作视频预训练 vs 动作耦合或上下文条件训练；评测从强化学习分数到闭环一致性和机器人执行不等。
  - 趋势演进：在可用前沿证据（多为2023-2026）内，工作从高效随机强化学习世界模型转向组合式、物理信息和统一视频-动作世界模型，同时出现评测长期记忆与动作控制的基准。
  - 开放问题：提升有多少来自模型而非规划器、数据规模或辅助损失；组合式模型是否支持全新原语或上下文；如何度量长期空间一致性和跨动作空间泛化；许多顶部论文仍缺少明确局限或可比证据。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world models and objective design
      what_it_solves: Turning world-model goals into diffusion or transformer video
        predictors with conditioning on language, action, or context, plus auxiliary
        signals for realism and geometry
      what_remains_open: Which objectives and representations yield long-horizon,
        physically plausible, and novel-combination generation beyond reported datasets
    - line: Latent model-based RL and action-interface methods
      what_it_solves: Connecting learned latent dynamics to policy optimization through
        imagined rollouts, with context conditioning for zero-shot dynamics shifts
      what_remains_open: Whether improvement comes from the dynamics model rather
        than the policy, planner, context prior, or task simplification, and whether
        assumptions such as observed context hold
    - line: World-model evaluation and benchmark protocols
      what_it_solves: Measuring memory consistency, spatial consistency, and action
        control with closed-loop or loop-based navigation evaluations, rather than
        only generation fidelity
      what_remains_open: Baselines and experimental results are still partial for
        one benchmark; current evidence suggests long-term memory and cross-action-space
        generalization remain difficult to isolate
    consensus:
    - Predictive modeling of future observations or latent states is a central training
      objective across recent world-model methods.
    - Conditioning on action, language, or context is used broadly to improve controllability
      and downstream task generalization.
    - Auxiliary self-supervision such as mask reconstruction, depth prediction, or
      keypoint dynamics is often added to strengthen physical and geometric consistency.
    - Closed-loop evaluation is emerging as a necessary complement to open-loop video
      generation quality, especially for memory and action control.
    disagreements:
    - Representation differs between compact latent state-space rollouts used for
      model-based RL and explicit high-dimensional video generation used for planning
      or simulation.
    - 'Supervision and interaction modes differ: some methods learn from action-free
      video, others from action-conditioned video, and others from context-conditioned
      latent rollouts.'
    - 'Evaluation targets differ: Atari-style RL scores, driving video benchmarks,
      robot task execution, and closed-loop memory/action-control benchmarks capture
      different notions of world-model quality.'
    - 'Assumptions about input structure differ: some rely on observable context values
      or predefined language primitives, while others assume large multitask robot
      datasets with paired video and actions.'
    open_questions:
    - How much of reported improvement is attributable to the world-model architecture
      rather than the policy, planner, data scale, or auxiliary training loss?
    - Can compositional world models generalize to entirely novel primitives or contexts,
      rather than combinations of primitives seen during training?
    - Which benchmark metrics can isolate long-term memory consistency and action-control
      generalization across different action spaces and viewpoints?
    - Several top papers lack explicit limitation sections or comparable baseline/metric
      details; how much reproducibility and negative-evidence reporting remains missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频世界模型与目标设计
      解决的问题: 将世界模型目标落实为扩散或Transformer视频预测器，并以语言、动作或上下文为条件，加入几何与物理相关的辅助信号
      尚未覆盖: 哪些目标和表示能带来长时域、物理合理且支持新组合的生成，超出已报告数据集的范围
    - 路线: 潜在基于模型的强化学习与动作接口方法
      解决的问题: 通过想象推演把学到的潜在动力学连接到策略优化，并用上下文条件应对零样本动力学变化
      尚未覆盖: 提升来自动力学模型还是策略、规划器、上下文先验或任务简化；观测上下文等假设是否成立
    - 路线: 世界模型评测与基准协议
      解决的问题: 用闭环或循环导航评估衡量记忆一致性、空间一致性和动作控制，而不仅仅看生成保真度
      尚未覆盖: 某个基准的基线和实验结果仍不完整；当前证据显示长期记忆和跨动作空间泛化难以单独衡量
    共识:
    - 预测未来观测或潜在状态是近期世界模型方法的核心训练目标。
    - 动作、语言或上下文条件被广泛用于提升可控性和下游任务泛化。
    - 掩码重建、深度预测或关键点动力学等辅助自监督信号常用于增强物理和几何一致性。
    - 闭环评估正在成为开放域视频生成质量之外的必要补充，尤其关注记忆和动作控制。
    分歧:
    - 表示不同：紧凑潜在状态空间推演用于基于模型的强化学习，而显式高维视频生成用于规划或仿真。
    - 监督与交互模式不同：有的从无动作视频学习，有的从动作条件视频学习，有的从上下文条件潜在推演学习。
    - 评测目标不同：Atari式强化学习分数、驾驶视频基准、机器人任务执行和闭环记忆/动作控制基准捕捉的是世界模型质量的不同侧面。
    - 输入结构假设不同：有的依赖可观测上下文值或预定义语言原语，有的假设大规模多任务机器人数据集中视频与动作成对可得。
    开放问题:
    - 报告的提升有多少来自世界模型架构本身，而非策略、规划器、数据规模或辅助训练损失？
    - 组合式世界模型能否泛化到训练中未见过的新原语或新上下文，而不只是已见原语的组合？
    - 哪些基准指标能单独衡量长期记忆一致性以及跨动作空间和视角的动作控制泛化？
    - 多篇顶部论文缺少明确局限说明或可比的基线与指标细节；可复现性和负面证据报告还存在多少缺口？
