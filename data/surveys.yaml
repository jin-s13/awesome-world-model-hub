  related_work_outline:
  - 'Mainstream direction: Application-focused world models center on robotics and
    driving, using transformer or diffusion video generation and action-conditioned
    dynamics for simulation, policy learning, and evaluation.'
  - 'Shared research pattern: Models learn predictive dynamics from video, actions,
    language, or context; evaluation combines visual quality with rollout, policy,
    and consistency metrics.'
  - 'Key differences: Driving work optimizes scene prediction, embodied work couples
    video generation with action or physics signals, and game or benchmark work targets
    closed-loop memory and action control.'
  - 'Trend evolution: Available top evidence is concentrated in 2023-2026, moving
    from efficient model-based reinforcement learning toward embodied and driving
    generation and stricter consistency benchmarks.'
  - 'Open questions: Real-world transfer, long-term memory or physical consistency,
    unseen context or action generalization, and alignment between simulation gains
    and deployment outcomes remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以机器人与自动驾驶为主的应用型世界模型，使用Transformer或扩散视频生成和动作条件动力学进行仿真、策略学习与评测。
  - 研究共性：从视频、动作、语言或上下文中学习预测性动力学；评价同时关注视觉保真度、展开、策略和一致性。
  - 关键差异：驾驶侧重场景预测，具身工作耦合视频生成与动作或物理信号，游戏与基准侧重闭环记忆和动作控制。
  - 趋势演进：高证据集中在2023-2026年前沿，从高效基于模型的强化学习转向具身与驾驶生成及更严格的一致性基准。
  - 开放问题：真实迁移、长期记忆或物理一致性、未见的上下文或动作泛化，以及仿真收益与部署结果的对齐仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and embodied domains by conditioning
        on language, context, or physics signals to generate task-specific videos
        and support policy training or evaluation.
      what_remains_open: Real-robot deployment, unseen primitives or embodiments,
        and whether simulator or generated-video gains transfer to physical environments
        remain under-evidenced.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for driving scene prediction, including long-horizon
        and multi-view video generation, with validation across driving datasets.
      what_remains_open: Dataset-level prediction improvements are not yet connected
        to real-world driving safety or operational outcomes.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in action-conditioned environments for
        model-based reinforcement learning, policy learning, and consistency or control
        benchmarking.
      what_remains_open: Long-term memory consistency, generalization across action
        spaces, and closed-loop behavior after environment rules or goals change are
        still unresolved.
    consensus:
    - Recent work treats world models as learned simulators that predict future frames
      or latent states from multimodal conditioning such as actions, language, or
      context.
    - Evaluation is moving beyond short-term visual quality toward rollout quality,
      policy performance, spatial consistency, memory consistency, and action control.
    - Transformer and diffusion architectures dominate current application-focused
      models, often combined with self-supervised or physics-related auxiliary objectives.
    - Policy learning benefits from model-generated imagined data or action-coupled
      pretraining, but validation remains mostly in simulation or curated datasets.
    disagreements:
    - Driving-focused models evaluate multi-view and cross-dataset scene prediction,
      while embodied models evaluate physical plausibility or simulated policy execution,
      making their results difficult to compare.
    - Some methods explicitly condition on context, language primitives, or physics
      signals, whereas others learn implicit dynamics only from video-action pairs.
    - 'Interaction modes differ: offline video-to-video generation versus closed-loop
      action-conditioned rollout or policy evaluation.'
    - Benchmark tasks emphasize different properties such as spatial consistency,
      memory consistency, or action control, without a shared evaluation definition.
    open_questions:
    - Can gains in driving or robot video generation be translated into real-world
      safety and operational effectiveness?
    - Does generated video remain useful as training data when embodiment, scene,
      or action space changes?
    - How should world models be evaluated for long-term memory consistency and physical
      plausibility beyond short-horizon visual fidelity?
    - Do explicit context, language-primitive, or physics conditioning generalize
      to unseen environments and novel physical situations?
    - Evidence is concentrated in driving, robotics, and game-like benchmarks; cross-domain
      transfer to healthcare or scientific simulation remains unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等具体领域，通过语言、上下文或物理信号生成任务相关视频，并支持策略训练或评测。
      尚未覆盖: 真实机器人部署、未见原语或本体的泛化，以及仿真或生成视频收益能否迁移到物理环境仍缺乏证据。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 使用世界模型进行驾驶场景预测，包括长时域和多视角视频生成，并在驾驶数据集之间进行验证。
      尚未覆盖: 数据集预测指标的提升与真实驾驶安全或运营结果之间的关联尚未被直接衡量。
    - 路线: 交互式智能体与游戏
      解决的问题: 在动作条件环境中建立世界模型，用于基于模型的强化学习、策略学习以及一致性或控制基准评测。
      尚未覆盖: 长期记忆一致性、跨动作空间泛化，以及环境规则或目标变化后的闭环行为仍未解决。
    共识:
    - 近期工作把世界模型视为可学习仿真器，依据动作、语言或上下文预测未来帧或潜在状态。
    - 评价正从短时视觉质量扩展到展开质量、策略性能、空间一致性、记忆一致性和动作控制。
    - 当前应用模型大量使用Transformer与扩散结构，并常结合自监督或物理相关辅助目标。
    - 策略学习受益于模型生成的想象数据或动作耦合预训练，但验证仍主要集中在仿真或精选数据集。
    分歧:
    - 驾驶模型评估多视角和跨数据集场景预测，具身模型评估物理合理性或仿真策略执行，两者难以直接比较。
    - 部分方法显式加入上下文、语言原语或物理信号，其他方法仅从视频-动作对中学习隐式动力学。
    - 交互模式存在离线视频生成与闭环动作条件展开或策略评估之间的差异。
    - 基准任务分别强调空间一致性、记忆一致性或动作控制，缺乏共享的评测定义。
    开放问题:
    - 驾驶或机器人视频生成指标的提升能否转化为真实世界的安全和运行效果？
    - 在本体、场景或动作空间变化时，生成视频作为训练数据是否仍然有效？
    - 除了短时视觉保真度，如何系统评测世界模型的长期记忆一致性和物理合理性？
    - 显式上下文、语言原语或物理条件在未见环境和新的物理情境中能否泛化？
    - 当前证据集中在驾驶、机器人和游戏类基准，跨领域迁移到医疗或科学模拟仍未得到验证。
