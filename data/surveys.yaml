  related_work_outline_zh:
  - 主流方向：构建以动作条件为核心的世界模型，作为闭环任务的交互式模拟器，强调实时性、高保真度和可控视频生成，同时通过基准测试驱动评估。
  - 研究共性：论文均提出一种以动作或上下文为条件的生成模型（多为扩散或自回归模型），在大规模领域特定数据集上训练，并发布代码、数据集或基准以促进可复现性。
  - 关键差异：在表示（扩散 vs. 自回归 vs. 循环状态空间）、监督信号（物理先验 vs. 动作标签 vs. 场景图一致性）、评估目标（空间记忆 vs. 动作忠实度
    vs. 物理合理性）和部署场景（驾驶、机器人、游戏）上存在差异。
  - 趋势演进：从2024年的通用高保真驾驶世界模型，到2025年融入物理、记忆和预训练视频生成器，再到2026年的闭环自动驾驶系统和综合综述，整体向实时、低延迟、多模态交互模拟演进。
  - 开放问题：自回归推演的长时域一致性、对未见域和传感器配置的泛化、视觉质量与物理合理性的平衡，以及跨团队和基础设施环境的独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Real-time and interactive serving
      what_it_solves: meeting latency and interactivity requirements for closed-loop
        control, including action-conditioned video generation and policy training
        in simulated environments
      what_remains_open: trade-offs between speed, fidelity, and controllability;
        long-horizon consistency under autoregressive rollouts; and generalization
        to diverse hardware or sensor configurations
    - line: Artifacts and reproducible engineering
      what_it_solves: making systems inspectable and reusable through standardized
        benchmarks, datasets, and open-source code for evaluating spatial consistency,
        action fidelity, and physical plausibility
      what_remains_open: independent reproduction across teams, datasets, and infrastructure
        environments; unified metrics that span different evaluation dimensions
    - line: Runnable pipelines and deployment stacks
      what_it_solves: turning world model ideas into end-to-end workflows for data,
        training, inference, and evaluation, often by integrating pretrained generative
        models with lightweight action-conditioned modules
      what_remains_open: how well the stack survives external deployment, hardware
        changes, and user-specific settings; reliance on observability of context
        or action labels in real-world settings
    consensus:
    - Action-conditioned world models are the dominant paradigm for building interactive
      simulators, with broad agreement on using video generation as the core capability.
    - Large-scale, domain-specific datasets (e.g., driving, robotics) are essential
      for training, and most works release code or datasets to support reproducibility.
    - Benchmarks and quantitative metrics are critical for evaluating progress, with
      a shared emphasis on action fidelity and visual quality, though the exact metrics
      vary.
    disagreements:
    - 'Representational choices: some use diffusion transformers, others use autoregressive
      models or recurrent state-space models, leading to different trade-offs in generation
      quality and inference speed.'
    - 'Supervision signals: works differ in whether they incorporate explicit physics
      priors (e.g., depth, keypoints), rely solely on action labels, or use scene-graph
      consistency to measure spatial memory.'
    - 'Evaluation targets: some focus on visual fidelity and controllability, while
      others prioritize spatial consistency or physical plausibility, creating a fragmented
      landscape of benchmarks and metrics.'
    - 'Deployment domain: approaches are often specialized to autonomous driving,
      robot manipulation, or game environments, and it is unclear whether advances
      transfer across these settings.'
    open_questions:
    - How can long-horizon autoregressive world models maintain spatial and temporal
      consistency without accumulating errors?
    - What mechanisms enable zero-shot generalization to unseen dynamics, domains,
      or sensor configurations, especially when context or action labels are not observable?
    - Can a unified evaluation framework balance visual fidelity, action fidelity,
      and physical plausibility to replace the current patchwork of domain-specific
      benchmarks?
    - Under what conditions do lightweight action-conditioned modules on pretrained
      video generators outperform end-to-end trained world models, and where do they
      fail?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环控制中的延迟和交互需求，包括动作条件视频生成和在模拟环境中训练策略
      尚未覆盖: 速度、保真度和可控性之间的权衡；自回归推演下的长时域一致性；对多样化硬件或传感器配置的泛化能力
    - 路线: 工件与可复现工程
      解决的问题: 通过标准化基准、数据集和开源代码使系统可检查和可复用，用于评估空间一致性、动作忠实度和物理合理性
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现；覆盖不同评估维度的统一度量标准
    - 路线: 可运行流水线与部署栈
      解决的问题: 将世界模型想法转化为覆盖数据、训练、推理和评估的端到端工作流，通常通过集成预训练生成模型与轻量级动作条件模块
      尚未覆盖: 系统栈在外部部署、硬件变化和用户特定设置下是否仍然可靠；在真实场景中对上下文或动作标签可观测性的依赖
    共识:
    - 动作条件世界模型是构建交互式模拟器的主流范式，普遍同意以视频生成为核心能力。
    - 大规模领域特定数据集（如驾驶、机器人）对训练至关重要，且多数工作发布代码或数据集以支持可复现性。
    - 基准和定量指标对评估进展至关重要，普遍强调动作忠实度和视觉质量，但具体指标各有不同。
    分歧:
    - 表示选择：部分使用扩散变换器，其他使用自回归模型或循环状态空间模型，导致在生成质量和推理速度上产生不同权衡。
    - 监督信号：工作之间在是否整合显式物理先验（如深度、关键点）、仅依赖动作标签或使用场景图一致性衡量空间记忆上存在差异。
    - 评估目标：有些专注视觉保真度和可控性，而另一些优先考虑空间一致性或物理合理性，形成了碎片化的基准和指标景观。
    - 部署领域：方法通常专用于自动驾驶、机器人操作或游戏环境，且尚不清楚进展是否能在这些设定间迁移。
    开放问题:
    - 长时域自回归世界模型如何在不积累误差的情况下保持时空一致性？
    - 什么样的机制能让世界模型在未见动态、领域或传感器配置下实现零样本泛化，尤其在上下文或动作标签不可观测时？
    - 能否有一种统一的评估框架平衡视觉保真度、动作忠实度和物理合理性，以取代当前领域特定基准的拼凑局面？
    - 在何种条件下，预训练视频生成器上的轻量级动作条件模块能超越端到端训练的世界模型，又在何处会失败？
