  related_work_outline:
  - 'Mainstream direction: Video-generation-based world models are the dominant paradigm,
    with surveys and methods converging on using generative video as a testbed for
    physical simulation, interactivity, and long-horizon consistency.'
  - 'Shared research pattern: Most papers frame world models as predictive engines
    that learn from high-dimensional observations (video, ego-vision) and aim to support
    downstream tasks such as planning, control, or simulation; they all identify evaluation
    as a central gap.'
  - 'Key differences: Works diverge on whether the world model operates in latent
    space or pixel space, whether it targets real-time interactivity or offline planning,
    and whether the evaluation metric is open-loop generation quality or closed-loop
    task performance.'
  - 'Trend evolution: From 2022 to 2026, the field shifted from applying world models
    to physical robot learning (DayDreamer) toward systematic surveys, open-source
    infrastructure, and formalizing unsolved subproblems such as out-of-sight dynamics
    and interactive controllability.'
  - 'Open questions: Whether current video-generation models genuinely internalize
    physical laws rather than statistical frame correlations; how to build evaluation
    protocols that close the gap between open-loop metrics and closed-loop decision-making;
    and how to handle persistent state for entities that leave the field of view.'
  related_work_outline_zh:
  - 主流方向：基于视频生成的世界模型是主导范式，综述和方法论文均集中于将生成式视频用作物理模拟、交互性和长时一致性的测试平台。
  - 研究共性：多数论文将世界模型框架化为从高维观测（视频、自我中心视觉）中学习的预测引擎，并旨在支持规划、控制或模拟等下游任务；它们均将评测视为核心缺口。
  - 关键差异：工作在潜在空间还是像素空间操作、目标是实时交互还是离线规划，以及评测指标是开环生成质量还是闭环任务性能上存在分歧。
  - 趋势演进：从2022年到2026年，该领域从将世界模型应用于物理机器人学习（DayDreamer）转向系统化综述、开源基础设施，以及形式化视线外动态和交互可控性等未解决子问题。
  - 开放问题：当前的视频生成模型是否真正内化了物理规律而不仅仅是统计性的帧间关联；如何构建缩窄开环指标与闭环决策之间差距的评测协议；以及如何处理离开视野的实体的持久状态。
  literature_review:
    line_of_work_matrix:
    - line: Interactive video world modeling
      what_it_solves: Formalizes how generative video models can be controlled by
        actions and used as interactive simulators, covering action-conditioned generation,
        long-horizon memory, and real-time responsiveness.
      what_remains_open: Whether action-conditioned video generation truly captures
        world-state evolution or merely interpolates visual patterns; evaluation suites
        are proposed but not yet standardized across domains.
    - line: World models for physical robot learning
      what_it_solves: Demonstrates that world models learned from camera images and
        sparse rewards can drive online policy learning on physical robots without
        simulators, achieving fast adaptation to perturbations.
      what_remains_open: Generalization is limited to the specific robot platforms
        tested; the same hyperparameters are used across all tasks, so per-task optimality
        is unverified; requires physical robot access for reproduction.
    - line: Compositional and out-of-sight world modeling
      what_it_solves: Addresses generalization to unseen object-action combinations
        via language-driven factorization, and persistence of entity dynamics when
        they leave the camera frustum, moving beyond per-frame prediction.
      what_remains_open: Generalization is bounded by the primitives seen during training;
        entirely novel primitives remain unsupported; out-of-sight dynamics evaluation
        is currently limited to a single proposed benchmark.
    - line: Latent world models for autonomous driving
      what_it_solves: Proposes a unified taxonomy and evaluation framework for latent-space
        world models in driving, organizing design choices by representation type,
        structural priors, and internal mechanics.
      what_remains_open: The taxonomy is purely theoretical with no empirical validation;
        the prescribed evaluation metrics are not implemented or tested; the framework
        may not cover all emerging approaches as the field evolves.
    - line: Open-source and scalable world model infrastructure
      what_it_solves: Provides publicly accessible model weights and code for video-generation-based
        world simulators, enabling reproducibility and lowering the barrier for research
        on high-fidelity, real-time interactive environments.
      what_remains_open: Methodology quality evidence is limited in available abstracts;
        no explicit limitation analysis is provided, making it unclear where the model
        fails or under which distribution shifts it degrades.
    consensus:
    - Video generation is the central substrate for building and evaluating world
      models across applications from robotics to autonomous driving.
    - 'Current evaluation protocols are insufficient: open-loop generation metrics
      do not reliably predict closed-loop task performance.'
    - Long-horizon temporal consistency and memory remain an open technical challenge
      shared by all lines of work.
    - World models are positioned as a bridge toward general-purpose embodied intelligence,
      not merely as video predictors.
    disagreements:
    - 'Representation choice: some works operate entirely in pixel space via video
      generation, while others advocate for latent-space representations with structural
      priors such as geometry and topology.'
    - 'Evaluation target: interactive world modeling papers emphasize action-following
      responsiveness and real-time interactivity, whereas robot-learning papers measure
      task success rates and adaptation speed under physical execution.'
    - 'Interaction mode: real-time closed-loop control with sub-second latency versus
      offline planning in learned imagination—these imply different latency budgets,
      model architectures, and deployment assumptions.'
    - 'Supervision signal: approaches range from sparse task rewards on physical robots
      to dense video-frame prediction trained on large-scale web or egocentric datasets,
      leading to different generalization expectations.'
    open_questions:
    - Can current video-generation world models internalize causal physical laws,
      or do they rely on statistical shortcuts in frame-to-frame prediction?
    - How should evaluation transition from open-loop visual quality metrics to closed-loop
      decision-making metrics without requiring costly physical deployment?
    - What is the minimal set of primitives or structural priors needed for a world
      model to support compositional generalization to unseen tasks?
    - How can persistent entity state be maintained and queried across long temporal
      horizons when entities leave and re-enter the observation window?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 交互式视频世界建模
      解决的问题: 形式化如何通过动作控制生成式视频模型并将其用作交互式模拟器，涵盖动作条件生成、长时记忆和实时响应。
      尚未覆盖: 动作条件视频生成是否真正捕捉了世界状态演化还是仅插值了视觉模式；评测套件虽被提出但尚未跨领域标准化。
    - 路线: 面向物理机器人学习的世界模型
      解决的问题: 证明从摄像头图像和稀疏奖励中学习的世界模型可在物理机器人上驱动在线策略学习，无需模拟器，并实现对扰动的快速适应。
      尚未覆盖: 泛化仅限于测试的特定机器人平台；所有任务使用相同超参数，每任务最优性未验证；复现需要物理机器人访问权。
    - 路线: 组合式与视线外世界建模
      解决的问题: 通过语言驱动的分解解决对未见物体-动作组合的泛化，以及实体在离开相机视野时动态的持久性，超越了逐帧预测。
      尚未覆盖: 泛化受限于训练中见过的原语；全新原语仍不支持；视线外动态评测目前仅限于单一提出的基准。
    - 路线: 自动驾驶的潜在世界模型
      解决的问题: 提出自动驾驶中潜在空间世界模型的统一分类法和评估框架，按表示类型、结构先验和内部机制组织设计选择。
      尚未覆盖: 分类法纯理论性，缺乏实证验证；所述的评估指标未实施或测试；框架可能无法涵盖领域演进中的新兴方法。
    - 路线: 开源与可扩展的世界模型基础设施
      解决的问题: 提供基于视频生成的世界模拟器的公开模型权重和代码，实现可复现性并降低高保真、实时交互环境研究的门槛。
      尚未覆盖: 可用摘要中方法质量证据有限；未提供明确的局限性分析，无法判断模型在何处失效或在何种分布偏移下退化。
    共识:
    - 视频生成是构建和评估从机器人到自动驾驶等应用领域世界模型的核心基础。
    - 当前评测协议不足：开环生成指标不能可靠地预测闭环任务性能。
    - 长时域时间一致性和记忆仍是所有研究路线共同面临的开放技术挑战。
    - 世界模型被定位为通向通用具身智能的桥梁，而非仅仅是视频预测器。
    分歧:
    - 表示选择：部分工作完全在像素空间通过视频生成操作，而其他工作则主张使用具有几何和拓扑等结构先验的潜在空间表示。
    - 评测目标：交互式世界建模论文强调动作跟随响应性和实时交互，而机器人学习论文衡量物理执行下的任务成功率和适应速度。
    - 交互模式：亚秒级延迟的实时闭环控制与想象中学习的离线规划——这些意味着不同的延迟预算、模型架构和部署假设。
    - 监督信号：方法涵盖物理机器人上的稀疏任务奖励到在大规模网络或自我中心数据集上训练的密集视频帧预测，导致不同的泛化预期。
    开放问题:
    - 当前基于视频生成的世界模型能否内化因果物理规律，还是依赖帧间预测中的统计捷径？
    - 评测应如何从开环视觉质量指标过渡到闭环决策指标，而无需承担昂贵的物理部署成本？
    - 世界模型需要最小化的原语或结构先验集合是什么，才能支持对未见任务的组合泛化？
    - 当实体离开和重新进入观测窗口时，如何跨长时域维护和查询持久实体状态？
