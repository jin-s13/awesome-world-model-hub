  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on learned video and latent predictive
    models for embodied and driving domains, using diffusion or Transformer architectures
    to generate future observations conditioned on actions, context, or language.'
  - 'Shared research pattern: Most methods learn a predictive world representation
    from high-dimensional observations, then use it for imagined rollouts, policy
    training, or benchmark evaluation; evaluations combine visual quality with domain-specific
    control or consistency probes.'
  - 'Key differences: Application focus separates driving simulation, robot manipulation,
    and interactive agents/games; grounding signals vary among actions, language primitives,
    physics/depth/keypoints, or unimodal video; evaluation targets include visual
    fidelity, zero-shot dynamics, spatial consistency, and memory/action control.'
  - 'Trend evolution: Work moves from model-based RL world models around 2023 toward
    diffusion/Transformer video world models in 2024-2025, with increasing emphasis
    on robotics, driving, physical consistency, and standardized benchmark probes;
    the span is narrow and reflects the current frontier.'
  - 'Open questions: Whether simulation and video prediction gains transfer to real
    safety or deployment outcomes, how to handle unseen dynamics, primitive combinations,
    or action spaces, and which benchmarks best predict downstream capability remain
    open.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于具身与驾驶领域的视频/潜在预测模型，以扩散或Transformer架构基于动作、上下文或语言生成未来观测。
  - 研究共性：多数方法从高维观测学习预测性世界表征，再用于想象推演、策略训练或基准评测；评估结合视觉质量与领域控制或一致性探针。
  - 关键差异：应用焦点分为驾驶仿真、机器人操作和游戏/交互智能体；监督信号涉及动作、语言原语、物理/深度/关键点或纯视频；评测目标包括视觉保真、零样本动力学、空间一致性和记忆/动作控制。
  - 趋势演进：从约2023年的基于模型强化学习世界模型，发展到2024-2025年的扩散/Transformer视频世界模型，更强调机器人、驾驶、物理一致性和标准化基准探针；时间跨度较窄，反映当前前沿。
  - 开放问题：仿真和视频预测收益能否迁移到真实安全或部署结果，如何处理未见动力学、原语组合或动作空间，以及哪种基准最能预测下游能力，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot manipulation and domain-specific
        control by grounding video or latent dynamics in actions, language primitives,
        context, depth, or keypoints.
      what_remains_open: Whether learned policies and video plans transfer across
        novel primitive combinations, embodiments, and simulation-to-real deployments
        remains only partially tested.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Learns multi-view, long-horizon driving video prediction from
        sensor data to support scene prediction and closed-loop simulation.
      what_remains_open: Alignment between benchmark video prediction gains and real-world
        driving safety or operational outcomes has not been established.
    - line: Interactive agents and games
      what_it_solves: Uses world models for sample-efficient game policies and for
        probing spatial, memory, and action-control consistency in interactive environments.
      what_remains_open: Generalization when environment rules, goals, user interactions,
        or action spaces change is measured only through selected benchmarks and has
        limited downstream transfer evidence.
    consensus:
    - Recent work converges on learned predictive models over high-dimensional observations,
      often using diffusion or Transformer architectures to generate future video
      or latent trajectories conditioned on actions or context.
    - World models are used both as generative simulators and as policy-learning substrates,
      merging visual quality objectives with control or consistency objectives.
    - Evaluation increasingly probes long-horizon consistency, zero-shot generalization,
      and action controllability rather than only short-frame visual similarity.
    - Multiple papers treat missing real-world deployment evidence as a core verification
      gap, not as resolved capability.
    disagreements:
    - 'Supervision and conditioning differ: some methods adopt action-only conditioning,
      others factor language into primitives, and others inject physics signals such
      as depth or keypoint dynamics.'
    - Some systems optimize open-loop video realism on standard driving or robot datasets,
      while others optimize policy returns or benchmark consistency via closed-loop
      or interactive evaluation.
    - Evaluation domains split among driving datasets, robot manipulation/RT-X simulation,
      Atari/CARL, and Minecraft/open-domain video, making direct comparison difficult.
    - 'Assumptions differ: contextual world models rely on observable context values;
      compositional robot models rely on seen primitives; video-action diffusion uses
      independent modality timesteps to exploit action-free data.'
    open_questions:
    - Do improvements in driving or robot video prediction transfer to real-world
      safety, task success, and deployment robustness?
    - How can world models generalize to entirely unseen dynamics, primitive combinations,
      embodiments, or evaluation action spaces without strong observability or seen-primitive
      assumptions?
    - Which consistency or control benchmark scores are predictive of downstream policy
      quality and real-world usefulness?
    - Can physics-informed cues like depth and keypoint dynamics be learned implicitly
      by larger video models, or are explicit signals necessary for plausible embodied
      simulation?
