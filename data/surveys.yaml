  related_work_outline_zh:
  - 主流方向：应用工作集中在驾驶和机器人等具身视频预测与控制，并出现面向记忆一致性和动作控制的新基准。
  - 研究共性：普遍使用Transformer或扩散模型对视频和动作建模，常辅以时空或物理一致性目标，并通过策略或一致性任务进行评测。
  - 关键差异：方法在视频、动作、语言、上下文和物理信号的耦合方式上不同，评测目标也分别偏驾驶数据集、机器人执行或交互式基准一致性。
  - 趋势演进：现有高相关证据集中在2023-2026年，可观察趋势处于当前前沿，从基于模型的游戏RL世界转向大规模机器人与驾驶预训练及闭环基准。
  - 开放问题：真实部署迁移、长时域记忆一致性、跨动作空间泛化，以及放宽可观测上下文或已见原语假设仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon video prediction
      what_it_solves: predicts future driving video from observations, targeting multi-view
        spatial consistency and generalization across driving datasets
      what_remains_open: alignment between video prediction gains on driving benchmarks
        and real-world safety or operational outcomes is not established
    - line: Contextual world models for model-based reinforcement learning
      what_it_solves: conditions latent dynamics on observable context to improve
        zero-shot policy generalization in contextual RL
      what_remains_open: assumes context observability and is validated on few benchmark
        tasks; fully unseen dynamics remains uncovered
    - line: Compositional language-conditioned robot world models
      what_it_solves: decomposes instructions into lower-level primitives to synthesize
        robot video plans and enable simulated execution on unseen combinations
      what_remains_open: generalization is bounded by seen primitives and accurate
        language parsing; real-robot execution evidence is missing
    - line: Physics-informed embodied world models
      what_it_solves: jointly learns RGB video generation with depth and keypoint
        dynamics to improve visual fidelity and physical plausibility for robot videos
      what_remains_open: limited evidence on whether physical plausibility gains transfer
        across embodiments or to noisy real-world robot settings
    - line: Unified video-action diffusion pretraining
      what_it_solves: couples video and action diffusion in one model to learn policy,
        forward/inverse dynamics, and video generation from large robot datasets and
        action-free video
      what_remains_open: real-robot deployment, cross-embodiment transfer, and failure
        boundaries are not yet demonstrated
    - line: Memory-consistency and action-control benchmarks
      what_it_solves: quantifies spatial consistency and action control in open-domain
        interactive video through loop-based and revisited-scene evaluation
      what_remains_open: relationship between benchmark scores and downstream task
        improvement or long-horizon world-model capability remains unproven
    consensus:
    - Generative world models in this application slice center on video prediction
      conditioned on observations, actions, language, or context.
    - Transformer and diffusion architectures are the dominant modeling family, often
      combined with auxiliary tasks for spatial, temporal, or physical consistency.
    - Evaluation increasingly combines visual fidelity with task-oriented signals
      such as policy success, generalization, or memory and action consistency.
    - There is shared recognition that short-horizon pixel-level accuracy is insufficient,
      making long-horizon, spatial, and physical consistency important targets.
    disagreements:
    - 'Representation coupling differs: some approaches generate video only or factorize
      language into video primitives, while others unify video-action diffusion or
      add physics side objectives.'
    - 'Evaluation settings differ: driving work uses multi-dataset and zero-shot video
      benchmarks, robotics work uses simulated execution or policy learning from robot
      datasets, and interactive work measures loop or spatial consistency.'
    - 'Model assumptions differ: contextual models require observable context, compositional
      robot models rely on parsed primitives, and physics-informed models learn physical
      knowledge implicitly from data.'
    - 'Generalization targets differ: zero-shot dynamics, unseen combinations of seen
      primitives, cross-view or cross-dataset video prediction, or cross-action-space
      action control.'
    open_questions:
    - Does improved domain-specific video generation or benchmark consistency translate
      to safer real-world driving or robot deployment?
    - Can world models maintain long-term memory consistency and action control when
      viewpoints, action spaces, and environment rules change?
    - Can context- and primitive-based methods be extended beyond assumed observable
      context or seen primitives to fully novel dynamics?
    - What evidence would connect large-scale robot or driving video pretraining to
      cross-task or cross-embodiment generalization?
