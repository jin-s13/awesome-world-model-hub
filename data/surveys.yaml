  related_work_outline:
  - 'Mainstream direction: World models are being specialized for concrete domains—autonomous
    driving, robotic manipulation, and interactive games—by integrating physical constraints,
    action conditioning, and large-scale pretraining to improve video prediction fidelity
    and policy learning.'
  - 'Shared research pattern: Most works adopt generative architectures (diffusion
    or Transformer-VAE) to produce future video frames, while augmenting the generation
    with some form of spatial, temporal, or physical consistency objective, and evaluate
    on domain-specific benchmarks.'
  - 'Key differences: They diverge in how they incorporate actions (explicit conditioning,
    joint diffusion, or RL-based optimization), whether they rely on context observability,
    and the primary evaluation focus (visual quality, policy performance, spatial
    consistency, or physical plausibility).'
  - 'Trend evolution: The frontier moved from efficient game-world models (e.g., Atari)
    around 2023 toward embodied and driving applications in 2024–2026, with diffusion
    models, physics-informed losses, and compositional generalization gaining prominence.'
  - 'Open questions: Real-world transfer, sim-to-real validation, and generalization
    across unseen embodiments or tasks remain largely unverified; unified benchmarks
    for long-horizon physical consistency and memory are still missing.'
  related_work_outline_zh:
  - 主流方向：世界模型正被定制到自动驾驶、机器人操作和交互式游戏等具体领域，通过整合物理约束、动作条件和大规模预训练，提升视频预测的保真度和策略学习效果。
  - 研究共性：多数工作采用生成式架构（扩散或Transformer-VAE）生成未来视频帧，同时引入某种空间、时序或物理一致性目标，并在特定领域基准上评估。
  - 关键差异：差异体现在动作的融入方式（显式条件、联合扩散或基于RL的优化）、是否依赖上下文可观测性，以及主要评估焦点（视觉质量、策略性能、空间一致性或物理合理性）。
  - 趋势演进：前沿从2023年前后高效的游戏世界模型（如Atari）转向2024–2026年的具身和驾驶应用，扩散模型、物理信息损失和组合泛化日益突出。
  - 开放问题：真实世界迁移、sim-to-real验证以及跨未见本体或任务的泛化能力仍缺乏验证；面向长时域物理一致性和记忆的统一基准依然缺失。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation world models
      what_it_solves: Long-horizon, multi-view video prediction for driving scenes,
        enabling future scene generation and closed-loop simulation evaluation.
      what_remains_open: Alignment between simulation-based metrics and real-world
        driving safety or operational outcomes; evaluation is limited to offline video
        benchmarks without physical vehicle testing.
    - line: Interactive game and benchmark world models
      what_it_solves: Efficient model-based reinforcement learning in game environments
        and systematic evaluation of spatial consistency for world models.
      what_remains_open: Generalization when game rules, goals, or user interactions
        change drastically; the benchmark provides an evaluation protocol but does
        not propose a model that solves the spatial consistency problem.
    - line: Embodied robotic world models
      what_it_solves: Compositional video generation, physics-informed synthesis,
        and unified video-action pretraining for robot manipulation tasks, supporting
        policy learning and imagination.
      what_remains_open: Cross-embodiment transfer and real-robot deployment remain
        unverified; compositional generalization is bounded by known primitives, and
        physics-informed losses are tested only in simulation.
    consensus:
    - World models in applied domains are predominantly realized as video generation
      models conditioned on actions or goals, aiming to capture environment dynamics
      for either planning or policy training.
    - Incorporating structural priors—such as depth, keypoints, mask reconstruction,
      or physical consistency losses—is a common strategy to improve the fidelity
      and usefulness of generated rollouts.
    - Evaluation is tightly coupled to domain-specific benchmarks (nuScenes, Atari,
      RT-X, CARL) and relies on metrics for visual quality, task success, or policy
      performance, with limited cross-domain testing.
    disagreements:
    - 'Representation and supervision: Some works use explicit depth prediction and
      keypoint dynamics as auxiliary tasks, while others learn physical plausibility
      implicitly via reinforcement learning or rely purely on video reconstruction
      with mask tokens.'
    - 'Action integration: Methods differ in combining actions and observations—joint
      diffusion over video and action tokens, separate action-conditioned generation,
      or RL-based optimization of action adherence without paired video supervision.'
    - 'Evaluation emphasis: One line focuses on visual generation quality and zero-shot
      cross-dataset transfer, another on policy learning efficiency in games, and
      a third on physical consistency and spatial memory benchmarks.'
    - 'Deployment context: All top methods are validated in simulation or on pre-recorded
      datasets; none include real-world physical deployment, creating a gap between
      reported improvements and practical applicability.'
    open_questions:
    - Can world models trained in simulation or on offline datasets provide reliable
      policy training signals for real-world robots and vehicles, and what sim-to-real
      transfer strategies are needed?
    - How should we design a unified benchmark that jointly measures long-horizon
      physical consistency, spatial memory, and task completion for world models across
      different domains?
    - To what extent do current physics-informed or RL-optimized world models truly
      capture cause-and-effect dynamics, rather than exploiting dataset biases, when
      tested under distributional shift?
