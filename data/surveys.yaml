  related_work_outline_zh:
  - 主流方向：可见的综述与分类工作集中于世界模型，尤其是生成式视频世界模型和面向具身智能与自动驾驶的潜在世界模型。
  - 研究共性：将碎片化的世界模型方法组织为设计空间、潜在表示、结构先验、评测方案和开放挑战清单。
  - 关键差异：通用世界模型综述与应用特定的自动驾驶分类法并存；部分综合仅为概念性框架，部分基础系统报告仿真或物理机器人结果。
  - 趋势演进：从2022年物理机器人世界模型学习，到2024年Sora后的通用综述，再到2025-2026年的专门生成、自我视觉与驾驶评测。
  - 开放问题：分类法是否有系统证据、评测设置是否兼容、可复现与开源缺口、以及开放挑战的优先级。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into coherent design spaces,
        milestones, and research gaps for general and application-specific settings.
      what_remains_open: Whether taxonomies are derived from systematic screening
        or selective examples; conceptual frameworks often lack empirical validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as open-loop versus closed-loop,
        control metrics, and benchmark coverage affect conclusions across world-model
        studies.
      what_remains_open: Cross-setting result compatibility and missing baseline,
        metric, or dataset details remain verification gaps.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into concrete next research
        questions about dynamics, consistency, controllability, and deployment.
      what_remains_open: Prioritization of which gaps matter most, and how gaps link
        to measurable progress.
    - line: Primary world-model system evidence
      what_it_solves: Provides concrete capability demonstrations for robot learning,
        generative video, motion prediction, and ego-vision control that surveys abstract.
      what_remains_open: Many primary systems lack disclosed code, datasets, or limitations,
        so their support for synthesis conclusions is uneven.
    consensus:
    - World models are treated as a unifying abstraction across video generation,
      autonomous driving, robot learning, and ego-vision prediction.
    - Evaluation should include long-horizon temporal consistency, controllability,
      and open-loop/closed-loop alignment.
    - Latent or generative design choices need a structured taxonomy to compare approaches
      instead of isolated case studies.
    - Real-world or high-fidelity simulation evidence matters, but many synthesis
      claims depend on selective system demonstrations rather than full evidence.
    disagreements:
    - Some synthesis work covers general world models across multiple domains, while
      others restrict the design space to automated driving or ego-vision settings.
    - 'Evaluation target differs: physical robot learning, video-based scene simulation,
      traffic motion prediction, out-of-sight dynamics, and controllable future frame
      prediction.'
    - Some frameworks use continuous latent states, discrete tokens, or hybrid representations,
      implying different assumptions about what should be simulated and how actions
      are represented.
    - 'Validation depth differs: one survey proposes a conceptual taxonomy without
      experiments, while primary systems report simulation or physical robot results
      with varying reproducibility evidence.'
    open_questions:
    - Which taxonomy dimensions best predict downstream decision-making quality in
      world models?
    - How can open-loop generation metrics be aligned with closed-loop planning or
      control performance across different deployment settings?
    - What systematic screening or evidence criteria would make survey claims about
      general world models verifiable beyond selective examples?
    - How should open-source release, code, datasets, and benchmarks be weighted when
      synthesizing reproducibility across world-model work?
    - 'Where should effort concentrate first: compositionality, out-of-sight persistence,
      real-time interactivity, or fine-grained controllability?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究映射到连贯的设计空间、里程碑与研究缺口。
      尚未覆盖: 分类法是否源自系统筛选而非选择性示例；概念框架通常缺乏实证验证。
    - 路线: 对比评测综合
      解决的问题: 总结开环与闭环、控制指标、基准覆盖等评测选择如何影响跨研究结论。
      尚未覆盖: 不同设置下的结果是否真正兼容，基线、指标和数据集缺失仍是验证缺口。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为关于动态、一致性、可控性和部署的具体下一步问题。
      尚未覆盖: 哪些缺口最值得优先推进，以及缺口如何映射到可测量的进展。
    - 路线: 基础世界模型系统证据
      解决的问题: 提供机器人学习、生成视频、运动预测和自我视觉控制等具体能力证据，供综述抽象归纳。
      尚未覆盖: 许多基础系统未公开代码、数据集或局限性，导致对综述结论的支持不均衡。
    共识:
    - 世界模型被视为跨越视频生成、自动驾驶、机器人学习和自我视觉预测的统一抽象。
    - 评测应包含长时域时间一致性、可控性以及开环与闭环的一致性。
    - 潜在或生成设计选择需要通过结构化分类法进行比较，而不是孤立的案例罗列。
    - 真实世界或高保真仿真证据很重要，但许多综合结论依赖选择性系统演示而非完整证据。
    分歧:
    - 有的综合工作覆盖跨领域通用世界模型，有的将设计空间限定于自动驾驶或自我视觉场景。
    - 评测目标不同：物理机器人学习、视频场景仿真、交通运动预测、视线外动态和可控未来帧预测。
    - 表示方式不同：连续潜在状态、离散令牌或混合表示，隐含对模拟对象和动作表示的不同假设。
    - 验证深度不同：部分综述提出概念分类法但未做实验，基础系统则报告仿真或物理机器人结果，且可复现证据不一。
    开放问题:
    - 哪个分类维度最能预测世界模型在下游决策中的质量？
    - 如何在不同部署场景下对齐开环生成指标与闭环规划或控制性能？
    - 需要哪些系统筛选或证据标准，才能使通用世界模型的综述结论超越选择性示例而可验证？
    - 在综合复现性时，应如何衡量代码、数据集、基准和开源发布的权重？
    - 应优先集中解决哪个问题：组合性、视线外持久性、实时交互性还是细粒度可控性？
