      尚未覆盖: 证据报告了基准提升，但未展示真实安全或运营对齐；局限性细节缺失。
    - 路线: 语言与物理接地的机器人视频生成
      解决的问题: 通过组合式语言原语或物理辅助任务合成机器人动作计划与视频，用于策略训练和评估。
      尚未覆盖: 未见原语组合之外的泛化、仿真以外的真实机器人验证，以及物理合理性度量。
    - 路线: 面向视觉控制的样本高效随机模型强化学习
      解决的问题: 从像素中学习随机潜在动态和想象轨迹，实现样本高效策略学习。
      尚未覆盖: 证据主要集中在Atari上；向更广泛交互环境或真实任务的迁移尚未展示。
    - 路线: 面向零样本动力学泛化的上下文世界模型
      解决的问题: 将潜在状态与可观测上下文解耦，在未见上下文值下提升零样本控制。
      尚未覆盖: 假设上下文可观测，且仅在较窄基准上验证；更广动力学变化未覆盖。
    - 路线: 交互一致性与动作控制基准
      解决的问题: 用开放域数据和指标衡量空间一致性、记忆一致性及动作控制能力。
      尚未覆盖: 当前证据偏数据集和基准构建；现有模型在长期记忆一致性和跨动作泛化上仍不足。
    共识:
    - 驾驶、机器人、游戏和基准研究都围绕视频或视觉状态训练世界模型，并同时评估预测质量与下游任务表现。
    - 主流架构为Transformer或扩散模型，常引入掩码重建、物理信号、语言解析、动作扩散或上下文条件等辅助目标。
    - 公开数据集和基准开始测量传统单步指标遗漏的性质，如空间一致性、记忆一致性和动作控制。
    - 这些证据大多停留在基准或仿真层面，真实部署证据仍有限。
    分歧:
    - 监督信号不同：有的只用无动作视频，有的联合动作、语言原语、上下文值或物理辅助任务。
    - 评测目标不同：长时域驾驶展开、机器人策略成功率或视频合理性、Atari人类归一化分数、一致性基准指标并存。
