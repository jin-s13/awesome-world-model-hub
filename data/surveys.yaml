  related_work_outline:
  - 'Mainstream direction: Diffusion- or transformer-based generative world models
    applied to robotics, driving, and interactive benchmarks, centered on action/context/language/physics-conditioned
    video prediction.'
  - 'Shared research pattern: Coupling world models with domain-specific signals such
    as actions, observable context, language primitives, physics constraints, or multimodal
    goals; evaluation uses rollouts, visual fidelity, generalization, or consistency
    benchmarks.'
  - 'Key differences: Application routes split across driving multi-view prediction,
    robot manipulation, model-based RL games, and Minecraft/open-domain consistency
    benchmarks; they differ in conditioning signals, representations, and evaluation
    targets.'
  - 'Trend evolution: From model-based RL on Atari (e.g., STORM, 2023) to embodied
    and driving generative world models (e.g., RoboDreamer, MaskGWM) and, by 2025-2026,
    to spatial/memory/action-control benchmarks (e.g., MIND); evaluation is moving
    from aggregate task scores to capability diagnostics.'
  - 'Open questions: Real-world safety and deployment transfer remain untested; generalization
    beyond seen contexts/primitives/action spaces is unresolved; long-term memory
    consistency is weak; simulation/video metrics may not align with physical outcomes.'
  related_work_outline_zh:
  - 主流方向：基于扩散或Transformer的生成式世界模型应用于机器人、驾驶和交互式基准，核心是动作/上下文/语言/物理条件化的视频预测。
  - 研究共性：将世界模型与动作、可观测上下文、语言原语、物理约束或多模态目标等领域信号耦合；评测依赖轨迹推演、视觉保真、泛化或一致性基准。
  - 关键差异：驾驶多视角预测、机器人操作、基于模型的强化学习游戏、Minecraft/开放域一致性基准等应用路线不同；条件信号、表示方式和评测目标也不同。
  - 趋势演进：从2023年Atari模型强化学习（如STORM）到具身与驾驶生成式世界模型（如RoboDreamer、MaskGWM），再到2025-2026空间/记忆/动作控制基准（如MIND）；评测从任务总分走向能力诊断。
  - 开放问题：真实安全与部署迁移尚未验证；未见上下文/原语/动作空间的泛化未解决；长期记忆一致性较弱；仿真或视频指标可能无法对应物理结果。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot video generation and policy learning
      what_it_solves: Generates task-conditioned robotic videos or dynamics for planning
        and policy learning, with some variants adding physics, depth, or keypoint
        constraints.
      what_remains_open: Evaluations are mostly simulated or dataset-level; generalization
        to unseen primitives and real-robot transfer remain unresolved.
    - line: Driving world models for scene prediction
      what_it_solves: Supports long-horizon, multi-view driving video prediction and
        zero-shot transfer across common driving datasets.
      what_remains_open: Real-world safety or operational outcomes are not demonstrated;
        explicit limitations and failure modes are underreported.
    - line: Model-based RL world models for interactive control tasks
      what_it_solves: Improves policy efficiency through imagined trajectories in
        games and contextual control tasks.
      what_remains_open: Assumes observable context values and uses only limited CARL
        tasks; broader transfer and deployment links are not verified.
    - line: Benchmarks for spatial, memory, and action-control consistency
      what_it_solves: Quantifies whether world models maintain scene structure, long-term
        memory, and action responsiveness across views and action spaces.
      what_remains_open: LoopNav reports no experimental results; current models still
        struggle with long-term consistency and cross-action-space generalization.
    consensus:
    - World models are increasingly built as generative video or sequence models conditioned
      on actions, language, context, or physics signals rather than generic next-frame
      predictors.
    - There is shared use of scalable Transformer or diffusion architectures for spatiotemporal
      generation and model-based learning.
    - Evaluation is shifting from aggregate task scores toward generalization, consistency,
      and control diagnostics, often using open datasets or benchmarks.
    - Application claims are frequently validated in simulation or standard visual,
      driving, and game datasets; direct physical-world evidence is not yet established.
    disagreements:
    - 'Representation choices differ: masked diffusion transformers, stochastic Transformer-VAE,
      recurrent state-space with context, and language-factorized video generation.'
    - 'Supervision and conditioning differ: some require observable context values,
      some parse language into seen primitives, some inject physics/depth/keypoints,
      and some unify action-video diffusion.'
    - 'Evaluation targets differ: driving cross-dataset transfer, simulated robot
      execution, Atari human score, and Minecraft/open-domain consistency metrics.'
    - 'Deployment settings differ: closed simulated or robotic environments versus
      open-domain, real-world-like video benchmarks, leading to different generalization
      boundaries.'
    open_questions:
    - Does improved driving video prediction on Nuscenes/OpenDV-2K/Waymo translate
      into safer real-world driving behavior?
    - How can world models generalize when context values are unobserved, language
      primitives are unseen, or action spaces change across embodiments?
    - What memory mechanisms enable long-term spatial and temporal consistency under
      loop navigation or varied viewpoints?
    - How should benchmarks balance pixel-level fidelity with invariant spatial or
      physical consistency measurement?
    - LoopNav reports no experimental results, so its benchmark's discriminating power
      remains a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人视频生成与策略学习
      解决的问题: 生成任务条件化的机器人视频或动力学，用于规划和策略学习，部分工作加入物理、深度或关键点约束。
      尚未覆盖: 评估主要在仿真或数据集层面；未见原语组合和真机迁移仍未解决。
    - 路线: 驾驶世界模型与场景预测
      解决的问题: 在常见驾驶数据集上实现长时域、多视角驾驶视频预测和零样本迁移。
      尚未覆盖: 缺少真实安全或运营结果证据；明确局限和失败模式报告不足。
    - 路线: 用于交互控制的基于模型强化学习世界模型
      解决的问题: 通过想象轨迹提升游戏和上下文控制任务中的策略效率。
      尚未覆盖: 假设上下文值可观测且仅在少量CARL任务上验证；更广迁移和部署关联未验证。
    - 路线: 空间、记忆与动作控制一致性基准
      解决的问题: 量化世界模型是否在跨视角和跨动作空间下保持场景结构、长期记忆和动作响应能力。
      尚未覆盖: LoopNav未报告实验结果；现有模型在长期一致性和跨动作空间泛化上仍不足。
    共识:
    - 世界模型越来越多被构建为以动作、语言、上下文或物理信号为条件的生成式视频或序列模型，而非通用下一帧预测器。
    - 普遍采用可扩展的Transformer或扩散架构进行时空生成和基于模型的学习。
    - 评测从聚合任务分数转向泛化、一致性和控制诊断，常使用开放数据集或基准。
    - 应用声明多在仿真或标准视觉、驾驶、游戏数据集上验证，直接物理世界证据尚未建立。
    分歧:
    - 表示选择不同：掩码扩散Transformer、随机Transformer-VAE、带上下文的循环状态空间和语言分解的视频生成。
    - 监督与条件不同：有的依赖可观测上下文值，有的将语言解析为已见原语，有的注入物理/深度/关键点，有的统一动作与视频扩散。
    - 评测目标不同：驾驶跨数据集迁移、仿真机器人执行、Atari人类分数、Minecraft/开放域一致性指标。
    - 部署设置不同：封闭仿真或机器人环境与开放域类真实视频基准，导致泛化边界不同。
    开放问题:
    - 在Nuscenes/OpenDV-2K/Waymo上的驾驶视频预测提升能否转化为真实驾驶安全性？
    - 当上下文不可观测、语言原语未见过或动作空间跨本体变化时，世界模型如何泛化？
    - 什么记忆机制能在循环导航或跨视角条件下保持长期时空一致性？
    - 基准应如何在像素级保真度与空间或物理一致性等不变性度量之间取得平衡？
    - LoopNav未报告实验结果，其基准判别力仍是验证缺口。
