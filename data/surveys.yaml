  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models built from large-scale
    robot video-action data, using diffusion-transformer, masked autoregression, or
    flow-based architectures to couple video generation with policy and dynamics.'
  - 'Shared research pattern: Pretrain or adapt a generative video model, then condition
    it on actions and align it via action-frame conditioning, reward/preference post-training,
    or test-time verifiers for planning, policy evaluation, and spatial reasoning.'
  - 'Key differences: Representation spans unified diffusion, frame-level action conditioning,
    heterogeneous masked autoregression, and flow-based models; supervision spans
    parameter-free adapters, DPO/RL reward alignment, and test-time assertions; evaluation
    spans visual quality, planning/policy correlation, physical plausibility, and
    verifier scaling.'
  - 'Trend evolution: The available 2024-2026 frontier moves from adapting pretrained
    video diffusion and fine-grained action conditioning toward unified action-video
    pretraining, then toward physics alignment, zero-shot benchmarks, and test-time
    scaling verification.'
  - 'Open questions: Evidence is limited on whether visual or physical metrics predict
    real policy transfer, whether test-time scaling overcomes model information bottlenecks,
    and whether taxonomy assumptions generalize beyond contact-rich manipulation.'
  related_work_outline_zh:
  - 主流方向：以机器人操作视频-动作数据为核心，构建动作条件化视频世界模型，主流架构包括扩散Transformer、掩码自回归或流模型，统一视频生成与策略/动力学学习。
  - 研究共性：先预训练或适配生成式视频模型，再通过动作条件、奖励/偏好对齐或测试时验证器纠正，使生成轨迹服务于规划、策略评估和空间推理。
  - 关键差异：表示方式包括统一扩散、逐帧动作条件、异构掩码自回归和流模型；监督信号包括适配器、DPO/RL奖励和测试时断言；评测目标从视觉质量到物理合理性与策略关联。
  - 趋势演进：从2024年适配预训练视频扩散与细粒度动作条件，到2025年统一动作-视频预训练与加速，再到2026年物理对齐、奖励建模、零样本基准和测试时缩放验证。
  - 开放问题：视觉或物理指标能否预测真实策略迁移，测试时验证能否突破信息瓶颈，以及分类法假设在接触丰富操作之外的泛化仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative world modeling
      what_it_solves: Learning joint video dynamics and action-conditioned rollouts
        for robot manipulation, enabling policy, forward/inverse dynamics, or planning
        from a shared model.
      what_remains_open: Direct evidence that generated videos preserve physical dynamics
        and transfer across unseen embodiments or tasks; several entries omit limitations
        and release details.
    - line: Adapting pretrained video diffusion models
      what_it_solves: Reusing closed-source or large video diffusion models without
        parameter access, adding action conditioning via a learned mask on intermediate
        outputs.
      what_remains_open: Depends on action-labelled domain videos; generalization
        beyond video game and real robot domains, and inherited model biases, are
        not established.
    - line: Reward and preference alignment for world models
      what_it_solves: Improving physical realism, task logic, embodiment plausibility,
        and visual quality through multi-dimensional reward models or DPO-style post-training.
      what_remains_open: Evaluation is concentrated on contact-rich manipulation;
        human preference collection is subjective or costly, and code/data availability
        is weak.
    - line: Test-time verification and scaling for spatial reasoning
      what_it_solves: Selecting or verifying imagined action-conditioned trajectories
        with frame-anchored assertions, reducing action biases and poor calibration
        in heuristic verifiers.
      what_remains_open: Benefits are benchmark-dependent; world models may form an
        information bottleneck, and no verifier scaled consistently on some benchmarks.
    - line: Conceptual taxonomy and functional evaluation
      what_it_solves: Organizing video-generation-as-world-model claims into state
        construction and dynamics modeling categories and motivating functional benchmarks.
      what_remains_open: The taxonomy is not empirically validated; current metrics
        still emphasize visual fidelity over persistence and causality.
    - line: Scaling and speed of action-video generation
      what_it_solves: Connecting model size, data scale, or generation speed to visual
        fidelity, controllability, and real-time simulation capability.
      what_remains_open: Scaling evidence is fragmented; no law predicts failure modes,
        policy transfer, or robustness across domains.
    consensus:
    - Action-conditioned video generation is widely used as a surrogate for dynamics
      and policy in embodied settings.
    - 'The field is moving from visual fidelity toward functional evaluation: physical
      plausibility, policy correlation, benchmark transfer, and verifiable reasoning.'
    - Large pretrained video models or large robot datasets provide a foundation for
      world models, whether by adaptation, unified pretraining, or post-training.
    - Action-frame alignment and reward/physics alignment are recurring mechanisms
      for making generated rollouts more useful for decision-making.
    disagreements:
    - 'Supervision and adaptation vary: parameter-free adapters, unified diffusion
      pretraining, masked autoregression, and RL/DPO preference alignment are distinct
      routes.'
    - 'Evaluation targets differ: visual quality, planning/policy correlation, physical
      plausibility, zero-shot benchmark scores, or test-time verifier scaling.'
    - 'State and action representation differ: implicit context or latent state, explicit
      frame-level action conditioning, and learned masks on intermediate outputs.'
    - Whether test-time verification can reliably improve world-model reasoning is
      contested; one benchmark improves while another shows no consistent scaling.
    - 'Deployment setting differs: robot manipulation and contact-rich tasks dominate,
      while some evidence concerns spatial reasoning and mixed synthetic/real benchmarks.'
    open_questions:
    - What evaluation signal best predicts that an action-conditioned video world
      model will improve real downstream robot policy or planning?
    - Can world models maintain physical persistence and causal consistency over long
      horizons without large preference data or costly post-training?
    - Under what conditions does test-time scaling or verification overcome the world-model
      information bottleneck observed on challenging benchmarks?
    - Do current taxonomies and benchmarks change design decisions or only describe
      categories; what independent validation is missing?
    - Verification gaps remain because several papers omit code, datasets, metrics,
      or limitations, making reproducibility and failure boundaries unclear.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成式世界建模
      解决的问题: 学习联合视频动态与动作条件化轨迹，用于机器人操作中的策略、前向/逆动力学或规划。
      尚未覆盖: 生成视频是否保持物理动态并在未见的本体或任务上迁移仍缺少直接证据；部分工作未给出局限和发布细节。
    - 路线: 适配预训练视频扩散模型
      解决的问题: 无需访问参数即可复用闭源大型视频扩散模型，通过学习掩码在中间输出上加入动作条件。
      尚未覆盖: 依赖领域特定动作标注视频；在视频游戏和真实机器人之外的泛化及模型固有偏差未建立。
    - 路线: 世界模型奖励与偏好对齐
      解决的问题: 通过多维奖励或DPO风格后训练提升物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 评测集中在接触丰富操作；人类偏好主观且采集成本高；代码与数据可得性弱。
    - 路线: 测试时验证与缩放
      解决的问题: 用帧锚定断言选择或验证想象的动作条件轨迹，减少启发式验证器校准不良和动作偏差。
      尚未覆盖: 收益依赖基准；世界模型可能形成信息瓶颈，部分基准上验证器无法稳定缩放。
    - 路线: 概念分类与功能评测
      解决的问题: 将视频生成即世界模型的主张组织为状态构建与动态建模类别，并倡导功能基准。
      尚未覆盖: 分类法未被实证验证；现有指标仍重视视觉保真而非持久性和因果性。
    - 路线: 动作-视频生成缩放与加速
      解决的问题: 连接模型规模、数据规模或生成速度与视觉保真度、可控性和实时仿真能力。
      尚未覆盖: 缩放证据分散；没有给出预测失败模式、策略迁移或跨领域鲁棒性的规律。
    共识:
    - 动作条件化视频生成被广泛用作具身场景中动态和策略的替代模型。
    - 研究重心正从视觉保真度转向功能评测，包括物理合理性、策略相关性、基准迁移和可验证推理。
    - 大型预训练视频模型或大规模机器人数据集为世界模型提供基础，不论采用适配、统一预训练还是后训练。
    - 动作-帧对齐和奖励/物理对齐是让生成轨迹更适用于决策的反复出现机制。
    分歧:
    - 监督与适配方式不同：参数冻结适配器、统一扩散预训练、掩码自回归以及RL/DPO偏好对齐是不同路线。
    - 评测目标不同：视觉质量、规划/策略相关性、物理合理性、零样本基准分数或测试时验证器缩放。
    - 状态与动作表示不同：隐式上下文或潜在状态、显式逐帧动作条件，或对中间输出施加学习掩码。
    - 测试时验证能否稳定改善世界模型推理存在争议；一项基准改善，另一项基准未稳定缩放。
    - 部署场景不同：机器人操作和接触丰富任务占主导，部分证据涉及空间推理和合成/真实混合基准。
    开放问题:
