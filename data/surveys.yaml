  related_work_outline:
  - 'Mainstream direction: Building specialized benchmarks and evaluation suites for
    world models, targeting spatial consistency, memory, action control, and physical
    plausibility beyond visual quality.'
  - 'Shared research pattern: Introducing new datasets with loop-closure or revisit
    tasks, designing metrics like scene graph consistency or PAV objectives, and using
    standard RL/game/driving suites for comparability.'
  - 'Key differences: Evaluation settings range from passive video datasets to interactive
    closed-loop environments; metrics vary from pixel-level to semantic consistency;
    target domains include driving, robotics, and games.'
  - 'Trend evolution: From 2023–2026, the frontier shifts from generic Atari benchmarks
    toward embodied, physics-informed, and memory-consistency evaluations, with dedicated
    benchmark datasets emerging in 2025–2026.'
  - 'Open questions: Alignment between proxy metrics and downstream decision utility;
    long-term memory consistency across domains; generalizing evaluation across action
    spaces and embodiments.'
  related_work_outline_zh:
  - 主流方向：构建面向世界模型的专门基准与评估套件，关注空间一致性、记忆、动作控制和物理合理性，超越视觉质量。
  - 研究共性：提出基于闭环或重访任务的新数据集，设计场景图一致性或PAV目标等指标，并利用标准RL/游戏/驾驶套件进行可比较性评估。
  - 关键差异：评估设置从被动视频数据集到交互式闭环环境不等；指标从像素级到语义一致性；目标领域涵盖驾驶、机器人和游戏。
  - 趋势演进：2023–2026年，前沿从通用Atari基准转向具身、物理信息与记忆一致性评估，2025–2026年出现专用基准数据集。
  - 开放问题：代理指标与下游决策效用之间的对齐；跨域长期记忆一致性；跨动作空间和具身形态的泛化评估。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets (e.g., LoopNav, MIND) that
        make world-model claims on spatial consistency, memory, and action control
        comparable.
      what_remains_open: Whether these task distributions fully cover the real-world
        deployment settings where world models are expected to operate, and the gap
        between simulated loops and open-ended navigation.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and physical
        plausibility beyond aggregate scores via metrics like Scene Graph Consistency
        Score, PAV objectives, and temporal depth/keypoint dynamics.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about, such as policy success rate or safety
        in deployment.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable by adopting standard benchmarks (Atari
        100k, CARL, Nuscenes, OpenDV-2K, Waymo) and reporting human-normalized scores,
        training time, and zero-shot transfer.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and the lack of unified reporting protocols for world-model
        evaluation.
    consensus:
    - World-model evaluation must move beyond visual fidelity and aggregate scores
      to encompass spatial consistency, memory, action responsiveness, and physical
      plausibility.
    - Diverse environments (Minecraft, driving simulators, robotics) are necessary
      to test generalization, and closed-loop or interactive protocols are gaining
      traction.
    - Standard benchmarks from RL and autonomous driving are widely reused for comparability,
      but dedicated benchmarks are emerging to probe specific capabilities like revisiting
      consistency.
    disagreements:
    - 'Evaluation settings differ: some works use fixed video datasets with predefined
      actions, while others require interactive closed-loop simulation with continuous
      action spaces.'
    - 'Metrics diverge: scene graph-based consistency (SGCS) vs. PAV reward optimization
      vs. pixel-level reconstruction, reflecting different assumptions about what
      constitutes a good world model.'
    - 'Target deployment varies: driving world models emphasize multi-view and long-horizon
      prediction, robotic world models focus on action-conditioned video and policy
      learning, games focus on sample efficiency.'
    open_questions:
    - How can evaluations of spatial consistency and memory be linked to downstream
      task performance, such as navigation success or policy robustness?
    - Current world models still struggle with long-term memory consistency; what
      benchmarks and metrics can reliably expose this failure mode across domains?
    - To what extent do conclusions from existing benchmarks (e.g., Atari, CARL) transfer
      to embodied and real-world settings, and how should we design stress tests for
      distribution shifts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集（如LoopNav、MIND），使关于空间一致性、记忆和动作控制的世界模型主张具备可比性。
      尚未覆盖: 这些任务分布是否全面覆盖世界模型预期发挥作用的真实部署设置，以及模拟循环与开放导航之间的差距。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性分数、PAV目标、时间深度和关键点动力学等指标，在总分之外检验预测、可控性、鲁棒性和物理合理性。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策（如策略成功率或部署安全性）之间是否一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过采用标准基准（Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo）并报告人类标准化分数、训练时间和零样本迁移，使结果可审计。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定，以及缺乏统一的世界模型评估报告协议。
    共识:
    - 世界模型评估必须超越视觉保真度和总分数，涵盖空间一致性、记忆、动作响应和物理合理性。
    - 需要多样化的环境（Minecraft、驾驶模拟器、机器人）来测试泛化性，闭环或交互式协议正逐渐成为主流。
    - 尽管来自强化学习和自动驾驶的标准基准被广泛复用以实现可比性，但为探测重访一致性等特定能力而设计的专用基准正在兴起。
    分歧:
    - 评估设置不同：部分工作使用带有预定义动作的固定视频数据集，而另一些则需要具有连续动作空间的交互式闭环模拟。
    - 指标存在分歧：基于场景图的一致性（SGCS）与PAV奖励优化与像素级重建，反映了对什么是良好世界模型的不同假设。
    - 目标部署场景各异：驾驶世界模型强调多视角和长时域预测，机器人世界模型关注动作条件视频和策略学习，游戏世界模型侧重样本效率。
    开放问题:
    - 如何将空间一致性和记忆评估与下游任务性能（如导航成功率或策略鲁棒性）联系起来？
    - 当前世界模型在长期记忆一致性方面仍存在困难；哪些基准和指标能够可靠地揭示跨领域的这一失败模式？
    - 现有基准（如Atari、CARL）的结论能在多大程度上迁移到具身和真实世界设置，以及如何设计针对分布偏移的压力测试？
