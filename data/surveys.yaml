  related_work_outline:
  - 'Mainstream direction: World models are being applied to embodied tasks (robotics,
    driving) and interactive agents via video diffusion, physics-informed generation,
    and efficient RL, with growing emphasis on benchmarking memory and spatial consistency.'
  - 'Shared research pattern: Most works use diffusion transformers or VAE architectures
    for video/state prediction, train with self-supervision or action conditioning,
    and evaluate in simulation via visual quality, task score, or consistency metrics.'
  - 'Key differences: Some focus on pure video generation (RoboDreamer), others couple
    video and action (UWM) or embed physics (RoboScape); evaluation targets range
    from visual fidelity to memory consistency and action controllability.'
  - 'Trend evolution: The frontier moved from efficient Atari world models (2023)
    to robot video generation and driving models (2024-2025), then to dedicated benchmarks
    for memory and consistency (2025-2026), reflecting a shift toward rigorous evaluation.'
  - 'Open questions: Sim-to-real transfer, long-term memory consistency, generalization
    across action spaces and unseen primitives, and the trade-off between physical
    plausibility and visual quality remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型通过视频扩散、物理信息生成和高效强化学习应用于具身任务（机器人、驾驶）和交互式智能体，并越来越重视记忆和空间一致性的基准测试。
  - 研究共性：多数工作采用扩散Transformer或VAE架构进行视频/状态预测，通过自监督或动作条件训练，并在仿真中评估视觉质量、任务得分或一致性指标。
  - 关键差异：有的侧重纯视频生成（如RoboDreamer），有的耦合视频与动作（UWM）或嵌入物理信息（RoboScape）；评估目标从视觉保真度到记忆一致性和动作可控性各不相同。
  - 趋势演进：研究前沿从2023年高效的Atari世界模型，发展到2024-2025年的机器人视频生成与驾驶模型，再转向2025-2026年专门的记忆与一致性基准，反映出向严格评估的转变。
  - 开放问题：仿真到现实的迁移、长期记忆一致性、跨动作空间和未见原语的泛化，以及物理合理性与视觉质量之间的权衡仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robot and embodied tasks by generating
        videos, predicting actions, or incorporating physics, enabling policy learning
        and imagination.
      what_remains_open: Whether improvements transfer across embodiments, datasets,
        and physical environments; evaluation is mostly simulation-only, and generalization
        to novel compositions or unseen contexts is limited.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon video prediction
        in driving to enable scene understanding and closed-loop simulation.
      what_remains_open: Alignment between simulator gains and real-world safety or
        operational outcomes; zero-shot transfer across datasets is still limited.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments (Atari, Minecraft,
        contextual RL) for efficient policy training and for evaluating memory and
        spatial consistency.
      what_remains_open: Long-term memory consistency and generalization to changing
        rules, goals, or user interactions remain challenging; benchmarks reveal gaps
        in action control and spatial consistency.
    consensus:
    - World models in applications are increasingly built with diffusion-based or
      transformer architectures for video generation.
    - Self-supervised learning on visual data is a common pretraining strategy, often
      combined with action conditioning or physics priors.
    - Recent benchmarks emphasize the need to evaluate consistency (spatial, memory)
      and action controllability beyond short-term visual fidelity.
    - Simulation-based evaluation remains the primary validation method, with real-world
      deployment largely unverified.
    disagreements:
    - 'Representation: Some models use pure video diffusion, while others jointly
      model video and actions or focus on latent dynamics.'
    - 'Supervision: Methods differ in using action-free video, action-labeled data,
      or physics-based signals (depth, keypoints).'
    - 'Evaluation targets: Metrics range from visual quality to human-normalized Atari
      scores, to scene graph consistency and memory metrics.'
    - 'Interaction mode: Closed-loop evaluation with memory and action control benchmarks
      versus open-loop video generation for planning.'
    - 'Deployment setting: All top papers evaluate in simulation; real-world transfer
      is not demonstrated.'
    open_questions:
    - How can world models maintain long-term memory consistency across extended rollouts?
    - Can simulation-trained world models transfer their improvements to real-world
      robotics and driving without fine-tuning?
    - What is the optimal trade-off between using generic video generation models
      and incorporating domain-specific physics priors?
    - How to evaluate world models in a unified way that captures both visual quality
      and task-relevant controllability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等具身任务，通过生成视频、预测动作或融入物理信息，实现策略学习和想象。
      尚未覆盖: 改进能否跨本体、数据集和物理环境迁移；评估大多仅在仿真中进行，对未见组合或上下文的泛化有限。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行驾驶场景的多视角、长时域视频预测，支持场景理解和闭环仿真。
      尚未覆盖: 仿真收益与真实安全或运营结果之间的一致性；跨数据集的零样本迁移仍有限。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落地到交互式环境（Atari、Minecraft、上下文RL）中，用于高效策略训练和评估记忆与空间一致性。
      尚未覆盖: 长期记忆一致性和对变化规则、目标或用户交互的泛化仍具挑战；基准测试揭示了动作控制和空间一致性方面的差距。
    共识:
    - 应用中的世界模型越来越多地采用基于扩散或Transformer的架构进行视频生成。
    - 自监督学习在视觉数据上是一种常见的预训练策略，通常与动作条件或物理先验相结合。
    - 最近的基准测试强调需要评估一致性（空间、记忆）和动作可控性，而不仅仅是短期视觉保真度。
    - 基于仿真的评估仍是主要验证方式，真实世界部署大多未经验证。
    分歧:
    - 表示方式：有的模型使用纯视频扩散，有的联合建模视频和动作，或侧重于潜在动力学。
    - 监督信号：方法在使用无动作视频、动作标注数据或物理信号（深度、关键点）上存在差异。
    - 评估目标：指标从视觉质量到人类归一化Atari得分，再到场景图一致性和记忆指标，各不相同。
    - 交互模式：带有记忆和动作控制基准的闭环评估，与用于规划的开环视频生成形成对比。
    - 部署设置：所有顶尖论文均在仿真中评估，真实世界迁移尚未展示。
    开放问题:
    - 世界模型如何在长时间展开中保持长期记忆一致性？
    - 仿真训练的世界模型能否将其改进迁移到真实机器人操作和驾驶中，无需微调？
    - 使用通用视频生成模型与融入领域特定物理先验之间的最佳权衡是什么？
    - 如何以统一方式评估世界模型，同时捕捉视觉质量和任务相关的可控性？
