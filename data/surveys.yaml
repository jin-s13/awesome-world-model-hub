  related_work_outline:
  - 'Mainstream direction: Diffusion/transformer generative world models with auxiliary
    objectives dominate recent method work; model-based RL persists through stochastic
    architectures such as STORM and contextual Dreamer variants.'
  - 'Shared research pattern: Papers improve world models by adding structured inductive
    biases—mask reconstruction, context conditioning, language factorization, physics/depth/keypoints,
    and video-action coupling—and evaluate long-horizon, zero-shot, or physical-consistency
    behavior.'
  - 'Key differences: Representations span latent recurrent-state, VAE-transformer,
    diffusion-transformer, and factorized language-conditioned generators; supervision
    spans reconstruction, dynamics, physics auxiliary losses, and joint action-video
    diffusion across driving, Atari, robot, and navigation domains.'
  - 'Trend evolution: Within the 2023–2026 evidence, the field moves from sample-efficient
    model-based RL toward large-scale embodied generative world models and dedicated
    spatial/memory/action-control benchmarks.'
  - 'Open questions: Evidence is thin on which auxiliary objectives transfer across
    domains, which model component drives gains, and whether scene-graph or memory-consistency
    metrics predict real deployment or policy quality.'
  related_work_outline_zh:
  - 主流方向：扩散/Transformer生成式世界模型与辅助目标主导近期方法；基于模型的强化学习仍通过随机架构（如STORM和上下文Dreamer变体）延续。
  - 研究共性：论文通过掩码重建、上下文条件、语言分解、物理/深度/关键点、视频-动作耦合等结构化归纳偏置改进世界模型，并评测长时域、零样本或物理一致性行为。
  - 关键差异：表示涵盖隐式循环状态、VAE-Transformer、扩散Transformer和分解式语言条件生成器；监督涵盖重建、动力学、物理辅助损失与联合动作-视频扩散，覆盖驾驶、Atari、机器人与导航领域。
  - 趋势演进：在2023–2026证据内，领域从样本高效模型RL转向大规模具身生成式世界模型，以及专门的空间/记忆/动作控制基准。
  - 开放问题：哪些辅助目标可跨域迁移、模型哪个部分驱动收益，以及场景图或记忆一致性指标能否预测真实部署或策略质量，证据仍不足。
  literature_review:
    line_of_work_matrix:
    - line: Generative world-model representation and objective design
      what_it_solves: Turns world-model ideas into concrete diffusion, VAE, recurrent
        state-space, or factorized video generators with auxiliary objectives such
        as mask reconstruction, context conditioning, and physics/depth/keypoint losses.
      what_remains_open: Which representation and objective choices transfer beyond
        reported domains remains unclear; available evidence does not include limitation
        or ablation detail for several methods, so objective-versus-architecture effects
        are not isolated.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to decisions through dream-based policy
        training, video planning, or joint video-action diffusion that can represent
        policy, forward/inverse dynamics, and video generation.
      what_remains_open: Unclear how much gain comes from the world model versus planner
        or task prior; real-robot execution is underevidenced in the packet, and cross-action-space
        control remains challenging.
    - line: Method evidence and evaluation protocol
      what_it_solves: Builds benchmarks and metrics for spatial, memory, and action-control
        consistency to separate method contribution from pixel-level generation quality.
      what_remains_open: Current benchmarks mainly contribute datasets and metrics
        or reveal unresolved model failures; broad comparative results and complete
        reproducibility metadata are missing from the available evidence.
    consensus:
    - Recent methods treat purely pixel-level generation as insufficient and add auxiliary
      objectives or structured conditioning to improve generalization, physical plausibility,
      or action responsiveness.
    - There is converging interest in evaluating long-horizon consistency, zero-shot
      generalization, and closed-loop action effects, not only short-horizon video
      quality.
    - Learned world models are expected to serve downstream control or policy learning,
      whether via imagined rollouts, video plans, or joint action-video pretraining.
    disagreements:
    - 'Representation families differ: stochastic latent state-space models, VAE-transformer
      models, diffusion transformers, and factorized language-conditioned generators
      make distinct inference and training tradeoffs.'
    - 'Supervision signals differ: context-conditioned dynamics, mask reconstruction,
      physics/depth/keypoint auxiliary losses, and coupled action-video diffusion
      emphasize different failure modes.'
    - 'Evaluation targets and interaction modes differ: sample-efficient Atari rollouts,
      driving multi-view rollout, robot manipulation video plans, and Minecraft navigation
      benchmarks use incompatible assumptions and metrics.'
    - 'Conditioning assumptions differ: one method assumes observable context values,
      another assumes language can be parsed into previously seen primitives, while
      others rely on action-free video or shared action spaces.'
    open_questions:
    - Which auxiliary objectives or representations transfer across driving, robot,
      and game domains; current evidence is domain-specific and sometimes limited
      to two tasks.
    - Can spatial consistency and scene-graph metrics replace or complement human
      evaluation for long-horizon world models; available evidence proposes a metric
      but reports no experimental ranking.
    - How do joint action-video diffusion models isolate dynamics learning from policy
      learning, and what remains when action labels are missing or only partially
      observed?
    - Which missing limitation, baseline, and ablation details would distinguish method
      contributions from dataset scale, architecture scale, and compute effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型表示与目标设计
      解决的问题: 将世界模型想法落实为扩散、VAE、循环状态空间或分解式视频生成器，并引入掩码重建、上下文条件、物理/深度/关键点等辅助目标。
      尚未覆盖: 哪些表示和目标选择能迁移到报告领域之外仍不清楚；现有证据缺少若干方法的局限性或消融细节，难以隔离目标与架构、数据集的影响。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策，包括基于梦境训练策略、视频规划，以及联合视频-动作扩散表示策略、正/逆动力学和视频生成。
      尚未覆盖: 收益有多少来自世界模型而非规划器或任务先验仍不明确；真实机器人执行证据不足，跨动作空间控制仍是挑战。
    - 路线: 方法证据与评测协议
      解决的问题: 构建空间一致性、记忆一致性和动作控制等基准与指标，以区分方法贡献与像素级生成质量。
      尚未覆盖: 现有基准主要贡献数据集和指标或揭示未解决失败；现有证据中缺少广泛对比结果和完整可复现元数据。
    共识:
    - 近期方法认为纯像素级生成不够，并引入辅助目标或结构化条件来提高泛化、物理合理性或动作响应性。
    - 评测兴趣正在向长时域一致性、零样本泛化和闭环动作效果汇聚，而不仅是短时视频质量。
    - 学习到的世界模型被期望服务下游控制或策略学习，无论是通过想象轨迹、视频计划还是联合动作-视频预训练。
    分歧:
    - 表示族不同：随机隐状态空间模型、VAE-Transformer模型、扩散Transformer和分解式语言条件生成器在推理和训练取舍上不同。
    - 监督信号不同：上下文条件动力学、掩码重建、物理/深度/关键点辅助损失以及耦合动作-视频扩散强调不同失败模式。
    - 评测目标与交互模式不同：样本高效Atari轨迹、驾驶多视角轨迹、机器人操纵视频计划和Minecraft导航基准具有不兼容假设和指标。
    - 条件假设不同：有方法假设上下文值可观测，有方法假设语言可解析为已见原语，另一些依赖无动作视频或共享动作空间。
    开放问题:
    - 哪些辅助目标或表示能跨驾驶、机器人和游戏领域迁移；当前证据具有领域特异性，有时仅限两个任务。
    - 空间一致性与场景图指标能否替代或补充长时域世界模型的人工评测；现有证据提出指标但未报告实验排名。
    - 联合动作-视频扩散模型如何分离动力学学习与策略学习，当动作标签缺失或部分观测时还剩什么能力。
    - 缺失的局限性、基线和消融细节如何区分方法贡献与数据规模、架构规模和计算资源影响。
