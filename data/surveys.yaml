  related_work_outline:
  - 'Mainstream direction: World models are shifting from game-centric efficient architectures
    toward large-scale generative models (diffusion, Transformers) that integrate
    multimodality and physical knowledge for embodied AI and driving.'
  - 'Shared research pattern: Most works adopt generative modeling (diffusion, VAE,
    or masked reconstruction) to learn environment dynamics, then use imagined rollouts
    for policy learning, planning, or evaluation.'
  - 'Key differences: Representations differ in stochasticity (VAE vs. deterministic
    diffusion), coupling of actions (joint vs. separate), and inclusion of physical
    priors. Evaluation targets range from visual fidelity to spatial consistency and
    task success.'
  - 'Trend evolution: From 2023 efficient stochastic world models (STORM) to 2024
    contextual/compositional generalization (cRSSM, RoboDreamer), then 2025 physics-informed
    and unified diffusion architectures (RoboScape, UWM, MaskGWM), and emerging systematic
    benchmarks (MIND 2026) for memory and action control.'
  - 'Open questions: How to ensure long-horizon physical consistency and memory; whether
    gains stem from the model or the planner; how to generalize across unseen dynamics
    and action spaces with limited data; and how to design unified evaluation protocols.'
  related_work_outline_zh:
  - 主流方向：世界模型正从以游戏为中心的高效架构，转向融合多模态和物理知识的大规模生成式模型（扩散、Transformer），用于具身智能和驾驶。
  - 研究共性：多数工作采用生成建模（扩散、VAE或掩码重建）学习环境动力学，然后利用想象推演进行策略学习、规划或评估。
  - 关键差异：表示在随机性（VAE vs. 确定性扩散）、动作耦合方式（联合 vs. 分离）以及物理先验的引入上有所不同。评测目标从视觉保真度到空间一致性、任务成功等各异。
  - 趋势演进：从2023年高效随机世界模型（STORM），到2024年上下文/组合泛化（cRSSM、RoboDreamer），再到2025年物理信息与统一扩散架构（RoboScape、UWM、MaskGWM），以及2026年出现的面向记忆和动作控制的系统基准（MIND）。
  - 开放问题：如何保证长时域物理一致性和记忆；性能增益来自模型还是规划器；如何在有限数据下泛化到未见动力学和动作空间；如何设计统一的评测协议。
  literature_review:
    line_of_work_matrix:
    - line: World model architecture and training design
      what_it_solves: Constructing high-fidelity, generalizable, and efficient world
        models through novel architectures (e.g., diffusion Transformers, VAE-Transformer,
        contextual RSSM) and training objectives (MAE-style mask reconstruction, joint
        physics learning).
      what_remains_open: Whether architectural designs transfer beyond the studied
        domains (e.g., driving, Atari) and whether long-term physical consistency
        and memory can be preserved without explicit physics engines.
    - line: Evaluation and benchmarking of world models
      what_it_solves: Systematically measuring capabilities like spatial consistency,
        memory, and action control that are not captured by pixel-level metrics, using
        datasets like LoopNav or MIND.
      what_remains_open: Limited scene and action space coverage in benchmarks; gap
        between simulated evaluation and real-world deployment; absence of a unified
        metric that isolates the world model from the downstream policy.
    - line: Action and planning interfaces
      what_it_solves: Connecting learned dynamics to decision-making, including zero-shot
        generalization via contextual models (cRSSM), compositional video planning
        (RoboDreamer), and unified diffusion of actions and videos (UWM).
      what_remains_open: Disentangling the contribution of the world model from the
        planner or controller; reliance on observable context or language primitives;
        limited validation on real robots beyond simulation.
    consensus:
    - Generative world models are the dominant paradigm, with a shift from VAEs and
      RSSMs to diffusion-based and Transformer architectures.
    - Imagined rollouts from world models are a key enabler for sample-efficient policy
      learning and planning.
    - There is a recognized need for better evaluation beyond visual quality, addressing
      spatial-temporal consistency, memory, and action controllability.
    - All works aim to improve generalization, either to unseen dynamics, tasks, or
      environments, often via compositionality or context conditioning.
    disagreements:
    - 'Stochasticity: some models use variational latent states (STORM, cRSSM) while
      others adopt deterministic diffusion processes (MaskGWM, UWM).'
    - 'Action integration: UWM jointly diffuses video and actions, whereas RoboDreamer
      and MaskGWM treat actions as conditions or separate generation streams.'
    - 'Physical priors: RoboScape explicitly injects depth and keypoint dynamics,
      while most other architectures rely purely on data-driven video generation.'
    - 'Evaluation target: benchmarks like LoopNav and MIND prioritize spatial consistency
      and memory, whereas method papers measure task performance (e.g., Atari score,
      driving metrics) or video fidelity.'
    - 'Interaction mode: cRSSM and UWM focus on closed-loop policy learning, while
      RoboDreamer and MaskGWM emphasize open-loop video generation for planning.'
    open_questions:
    - How can world models maintain long-term memory and physical consistency over
      extended horizons without external physics supervision?
    - To what extent do observed improvements in downstream tasks come from the learned
      dynamics versus the planning algorithm or task-specific priors?
    - What is the minimal set of evaluation dimensions (spatial, temporal, action
      controllability) needed to fairly compare world models across diverse embodiments?
    - Can compositional strategies generalize to entirely novel primitives not seen
      during training, or do they remain bounded by the training distribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型架构与训练设计
      解决的问题: 通过新颖架构（如扩散Transformer、VAE-Transformer、上下文RSSM）和训练目标（MAE式掩码重建、联合物理学习）构建高保真、可泛化且高效的世界模型。
      尚未覆盖: 架构设计是否能迁移到驾驶、Atari以外的领域，长期物理一致性和记忆能否在无显式物理引擎的情况下保持。
    - 路线: 世界模型的评估与基准
      解决的问题: 系统性地衡量像素级指标无法捕捉的空间一致性、记忆和动作控制等能力，使用LoopNav或MIND等数据集。
      尚未覆盖: 基准覆盖的场景和动作空间有限；模拟评估与真实部署之间的差距；缺乏能够将世界模型与下游策略解耦的统一度量。
    - 路线: 动作与规划接口
      解决的问题: 将学习到的动力学连接到决策，包括通过上下文模型实现零样本泛化（cRSSM）、组合视频规划（RoboDreamer）以及视频与动作的统一扩散（UWM）。
      尚未覆盖: 世界模型的贡献与规划器或控制器的贡献尚未解耦；依赖可观测上下文或语言原语；真实机器人验证仅限于仿真。
    共识:
    - 生成式世界模型是主导范式，正从VAE和RSSM转向基于扩散和Transformer的架构。
    - 利用世界模型进行想象推演是实现样本高效策略学习和规划的关键手段。
    - 业界普遍认识到需要超越视觉质量的评估，关注时空一致性、记忆和动作可控性。
    - 所有工作均致力于提升泛化能力，无论是针对未见动力学、任务或环境，常通过组合性或上下文条件化实现。
    分歧:
    - 随机性：部分模型使用变分潜在状态（STORM、cRSSM），另一些采用确定性扩散过程（MaskGWM、UWM）。
    - 动作整合：UWM联合扩散视频与动作，而RoboDreamer和MaskGWM将动作作为条件或分离生成流。
    - 物理先验：RoboScape显式引入深度和关键点动力学，而多数其他架构完全依赖数据驱动的视频生成。
    - 评测目标：LoopNav和MIND基准优先评估空间一致性和记忆，而方法论文衡量任务性能（如Atari分数、驾驶指标）或视频保真度。
    - 交互模式：cRSSM和UWM侧重闭环策略学习，RoboDreamer和MaskGWM强调开环视频生成用于规划。
    开放问题:
    - 世界模型如何在长时域跨度中保持长期记忆和物理一致性，而无需外部物理监督？
    - 下游任务的性能提升在多大程度上归因于学习到的动力学，而非规划算法或任务特定先验？
    - 跨不同具身形态公平比较世界模型所需的最少评估维度（空间、时间、动作可控性）是什么？
    - 组合策略能否泛化到训练中未见过的新原语，还是始终受限于训练分布？
