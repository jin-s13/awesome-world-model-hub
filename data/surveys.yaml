  related_work_outline:
  - 'Mainstream direction: World models are being adapted to concrete application
    domains—autonomous driving, robotics, and interactive environments—by integrating
    video generation, action control, and physical reasoning into unified architectures.'
  - 'Shared research pattern: Most works combine generative models (diffusion, VAE,
    Transformers) with task-specific conditioning (language, actions, context) to
    predict future states, then use these predictions for policy learning or planning.'
  - 'Key differences: Approaches diverge in representation (pixel-level video vs.
    latent state), incorporation of explicit physics, handling of memory and long-horizon
    consistency, and evaluation targets (visual fidelity vs. task success vs. spatial
    consistency).'
  - 'Trend evolution: The field is moving from single-task, model-based RL (e.g.,
    Dreamer variants) toward large-scale pretraining on multi-task robotic or driving
    data, with growing emphasis on closed-loop memory benchmarks and physics-informed
    generation.'
  - 'Open questions: How to guarantee real-world safety and reliability, how to unify
    video quality with downstream task performance, how to evaluate long-term memory
    and physical plausibility, and how to leverage action-free video for actionable
    world models.'
  related_work_outline_zh:
  - 主流方向：世界模型正被适配到自动驾驶、机器人操作和交互式环境等具体应用领域，通过将视频生成、动作控制和物理推理整合到统一架构中。
  - 研究共性：多数工作将生成模型（扩散、VAE、Transformer）与任务特定条件（语言、动作、上下文）结合来预测未来状态，并利用这些预测进行策略学习或规划。
  - 关键差异：方法在表示层面（像素级视频 vs. 潜在状态）、是否显式引入物理、对记忆和长时域一致性的处理、以及评测目标（视觉保真度 vs. 任务成功率 vs.
    空间一致性）上存在分歧。
  - 趋势演进：领域正从单任务、基于模型的强化学习（如Dreamer变体）转向在多任务机器人或驾驶数据上的大规模预训练，并越来越重视闭环记忆基准和物理信息生成。
  - 开放问题：如何保证真实世界的安全性与可靠性，如何统一视频质量与下游任务性能，如何评估长期记忆和物理合理性，以及如何利用无动作视频构建可操作的世界模型。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Scene prediction, multi-view video generation, and closed-loop
        simulation for driving policy evaluation.
      what_remains_open: Alignment between simulation-based improvements and real-world
        safety or operational outcomes; generalization across diverse traffic scenarios
        and sensor setups.
    - line: Embodied robotic world models
      what_it_solves: Video-based planning, policy learning, and physical interaction
        prediction by conditioning on language, actions, or physics priors.
      what_remains_open: Transfer across robot embodiments and environments; integration
        of explicit physics without sacrificing visual fidelity; reliance on accurate
        language parsing or predefined primitives.
    - line: Interactive environment world models (games, navigation)
      what_it_solves: Spatial consistency, memory, and action-conditioned generation
        in open-ended environments for agent training and evaluation.
      what_remains_open: Long-term memory maintenance; generalization when environment
        rules, goals, or action spaces change; scalability to complex, open-world
        scenarios.
    - line: Model-based RL with world models
      what_it_solves: Sample-efficient policy learning by rolling out imagined trajectories
        in learned latent dynamics.
      what_remains_open: Zero-shot generalization to unseen dynamics without observable
        context; scaling beyond benchmark suites like Atari or CARL to real-world
        tasks.
    consensus:
    - World models must generate future states (as videos or latent representations)
      conditioned on actions or context to support decision-making.
    - Diffusion models and Transformers have become dominant architectures for world
      models, replacing earlier RNN/VAE-based designs.
    - Large-scale pretraining on diverse datasets improves generalization and robustness
      compared to training from scratch on single tasks.
    - There is a growing need for standardized benchmarks that evaluate not just visual
      quality but also memory consistency, physical plausibility, and action controllability.
    disagreements:
    - 'Representation: Some works generate pixel-level videos for visual inspection
      and planning, while others operate on compact latent states for policy optimization,
      trading off interpretability for efficiency.'
    - 'Supervision: Methods differ in whether they require explicit action labels,
      rely on language instructions, or learn purely from passive video; this affects
      applicability to real-world data with missing modalities.'
    - 'Evaluation target: Benchmarks focus on different aspects—visual fidelity (FVD,
      PSNR), task success rate in RL, spatial consistency scores, or memory and action
      control metrics—making cross-paper comparison difficult.'
    - 'Physics integration: Some models inject explicit physics knowledge (depth,
      keypoints) to improve plausibility, while others rely entirely on data-driven
      learning, leading to different failure modes in out-of-distribution scenarios.'
    open_questions:
    - How can world models be evaluated for long-term memory and physical consistency
      in a way that predicts real-world deployment success?
    - What is the minimal supervision (actions, language, physics priors) needed to
      build a world model that generalizes across embodiments and tasks?
    - Can video generation quality and downstream policy performance be jointly optimized,
      or is there an inherent trade-off?
    - How do we ensure safety and reliability when world models are used for decision-making
      in safety-critical applications like driving or healthcare?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 场景预测、多视角视频生成和用于驾驶策略评估的闭环仿真。
      尚未覆盖: 仿真改进与真实世界安全或运营结果之间的一致性；跨不同交通场景和传感器配置的泛化。
    - 路线: 具身机器人世界模型
      解决的问题: 通过语言、动作或物理先验进行条件化，实现基于视频的规划、策略学习和物理交互预测。
      尚未覆盖: 跨机器人本体和环境的迁移；在不牺牲视觉保真度的情况下整合显式物理；依赖准确的语言解析或预定义原语。
    - 路线: 交互式环境世界模型（游戏、导航）
      解决的问题: 在开放环境中实现空间一致性、记忆和动作条件生成，用于智能体训练和评估。
      尚未覆盖: 长期记忆维持；环境规则、目标或动作空间变化时的泛化；扩展到复杂的开放世界场景。
    - 路线: 基于模型的强化学习世界模型
      解决的问题: 通过在学习的潜在动力学中展开想象轨迹，实现样本高效的策略学习。
      尚未覆盖: 在无观测上下文的情况下对未见动力学的零样本泛化；从Atari或CARL等基准套件扩展到真实世界任务。
    共识:
    - 世界模型必须根据动作或上下文生成未来状态（视频或潜在表示），以支持决策。
    - 扩散模型和Transformer已成为世界模型的主流架构，取代了早期基于RNN/VAE的设计。
    - 在多样化数据集上进行大规模预训练相比单任务从头训练能提升泛化性和鲁棒性。
    - 越来越需要标准化的基准，不仅评估视觉质量，还要评估记忆一致性、物理合理性和动作可控性。
    分歧:
    - 表示方式：一些工作生成像素级视频用于视觉检查和规划，另一些则在紧凑的潜在状态上操作以优化策略，在可解释性和效率之间做出权衡。
    - 监督信号：方法在是否需要显式动作标签、依赖语言指令或仅从被动视频学习上存在差异，这影响了在模态缺失的真实数据上的适用性。
    - 评测目标：基准关注不同方面——视觉保真度（FVD、PSNR）、强化学习中的任务成功率、空间一致性分数或记忆与动作控制指标——导致跨论文比较困难。
    - 物理整合：一些模型注入显式物理知识（深度、关键点）以提高合理性，而另一些完全依赖数据驱动学习，在分布外场景中导致不同的失效模式。
    开放问题:
    - 如何以能预测真实世界部署成功的方式评估世界模型的长期记忆和物理一致性？
    - 构建一个能跨本体和任务泛化的世界模型所需的最小监督（动作、语言、物理先验）是什么？
    - 视频生成质量和下游策略性能能否联合优化，还是存在固有的权衡？
    - 当世界模型用于安全关键应用（如驾驶或医疗）的决策时，如何确保安全性和可靠性？
