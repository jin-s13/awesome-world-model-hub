  - 'Mainstream direction: Generative video world models using diffusion transformers
    or unified diffusion are becoming dominant, especially for embodied and driving
    tasks, with language, actions, or goals as conditioning.'
  - 'Shared research pattern: Methods add structured auxiliary losses or explicit
    factorization such as mask reconstruction, depth and keypoint estimation, context
    conditioning, compositional primitives, or coupled action-video diffusion to improve
    consistency, control, or generalization.'
  - 'Key differences: Work diverges between compact latent dynamics and pixel-level
    video generation, uses different supervision signals, and targets different evaluation
    settings such as Atari, driving, robot execution, or Minecraft consistency.'
  - 'Trend evolution: Within the available 2023-2026 frontier, the topic shifts from
    model-based RL world models like Transformer-VAE and contextual Dreamer variants
    toward 2024-2025 embodied/driving video generation and 2025-2026 consistency and
    action-control benchmarks.'
  - 'Open questions: Which auxiliary objectives transfer; whether gains come from
    model, planner, or controller; and how to benchmark long-horizon memory, spatial
    consistency, and action control under closed-loop rollouts.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或统一扩散为核心的生成式视频世界模型成为主流，尤其面向具身与驾驶任务，以语言、动作或目标作为条件。
  - 研究共性：通过掩码重建、深度与关键点、上下文、组合原语或动作-视频耦合等结构化辅助损失，改善一致性、可控性或泛化。
  - 关键差异：采用紧凑潜在动力学还是像素级视频生成、监督信号形式以及Atari、驾驶、机器人、Minecraft等评测目标各不相同。
  - 趋势演进：在2023-2026的前沿窗口内，从基于模型的RL世界模型转向2024-2025具身/驾驶视频生成，再到2025-2026一致性、记忆和动作控制基准。
  - 开放问题：辅助目标能否迁移、提升来自模型还是规划器/控制器、以及如何在闭环下统一评测长时记忆、空间一致性和动作控制。
  literature_review:
    line_of_work_matrix:
    - line: Latent stochastic world models for model-based reinforcement learning
      what_it_solves: Compact latent dynamics for policy learning in imagination,
        represented by Dreamer-style recurrent state-space and Transformer-VAE methods.
      what_remains_open: Whether gains persist beyond limited tasks, with context
        observability and disentanglement assumptions often untested.
    - line: Generative video world models for embodied and driving prediction
      what_it_solves: High-fidelity, long-horizon or multi-view video generation conditioned
        on language, goal images, or actions for robot and driving scenarios.
      what_remains_open: Physical plausibility, long-term spatial and memory consistency,
        and generalization to unseen primitives or action spaces beyond training compositions.
    - line: Unified action-video diffusion and policy/dynamics interfaces
      what_it_solves: Couples action and video diffusion in one model, representing
        policy, forward/inverse dynamics, and video generation while using action-free
        video.
      what_remains_open: Contribution of each prediction mode is not isolated, and
        evaluation beyond large pretraining corpora remains limited.
    - line: Benchmarks for spatial/memory consistency and action control
      what_it_solves: Closed-loop, revisitable evaluation protocols for spatial consistency,
        memory consistency, and action control in open-domain world models.
      what_remains_open: Some benchmark papers report dataset construction without
        experimental baselines; cross-environment validity and action-space coverage
        remain open.
    consensus:
    - Generative world models increasingly rely on scalable sequence or diffusion
      architectures with auxiliary spatiotemporal, physics, or context losses.
    - Structured conditioning such as language, goal images, action sequences, or
      explicit context is used to improve generalization and controllability over
      monolithic predictors.
    - Evaluation is shifting from visual quality alone toward closed-loop consistency,
      memory, spatial coherence, and action-control ability.
    - When factorization or context is explicit, models tend to show improved zero-shot
      or compositional generalization relative to baselines within the tested tasks.
    disagreements:
    - Latent state-space dynamics and pixel/video diffusion represent different choices
      for what the model should learn and output.
    - 'Supervision signals differ: mask reconstruction, depth and keypoint physics,
      context conditioning, language primitives, or joint action-video diffusion.'
    - Evaluation targets diverge across Atari 100k, driving multi-view rollouts, robot
      simulation, and Minecraft loop or memory benchmarks, preventing direct comparison.
    - 'Action handling differs: actions can be video conditions, planner/controller
      outputs, jointly diffused modalities, or solely evaluation criteria for control.'
    - Evidence is split on whether the main challenge is long-horizon generation,
      spatial/memory consistency, physical plausibility, or reward/control generalization.
    open_questions:
    - Which auxiliary objectives transfer beyond driving and robot video without dataset-specific
      re-tuning?
    - What part of reported policy or planning gains is attributable to the world
      model rather than the planner, controller, or task prior?
    - Can a common evaluation protocol measure memory consistency, spatial consistency,
      and action control in closed loop across domains?
    - Do current models generalize to entirely unseen contexts, primitives, or action
      spaces, or only to combinations of training evidence?
    - What missing baselines, failure modes, and code/dataset details are needed to
      verify methods and benchmark claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向基于模型强化学习的潜在随机世界模型
      解决的问题: 用紧凑潜在动力学在想象轨迹中训练策略，典型如Dreamer式循环状态空间和Transformer-VAE方案。
      尚未覆盖: 任务范围有限，上下文可观测性假设以及潜在状态与上下文解耦的迁移证据不足。
    - 路线: 面向具身与驾驶的生成式视频世界模型
      解决的问题: 在语言、目标图像或动作条件上生成高保真长时域或多视角视频。
      尚未覆盖: 物理合理性、长时记忆与空间一致性，以及对未见过原语和动作空间的泛化。
    - 路线: 视频-动作统一扩散与策略/动力学接口
      解决的问题: 在统一模型中耦合动作和视频扩散，表示策略、前向/逆动力学和视频生成，并利用无动作视频。
      尚未覆盖: 各预测模式贡献未隔离，超出预训练语料库的跨领域验证有限。
    - 路线: 空间/记忆一致性与动作控制基准
      解决的问题: 为世界模型提供闭环、可复现的一致性、记忆与动作控制评测。
      尚未覆盖: 部分基准缺乏实验结果；跨环境与动作空间覆盖的有效性仍待验证。
    共识:
    - 方法普遍转向可扩展的序列或扩散架构，并加入时空、物理或上下文等辅助损失。
    - 通过语言、目标图像、动作序列或显式上下文进行条件化，以提升泛化与控制能力。
    - 评测从单一视觉质量转向闭环一致性、记忆、空间一致性和动作控制能力。
    - 显式上下文或组合结构通常带来比单一基线更好的零样本或组合泛化。
    分歧:
    - 潜在状态空间动力学与像素/视频扩散代表不同的模型输出与学习目标选择。
    - 监督信号不同：掩码重建、深度与关键点物理、上下文条件、语言原语或动作-视频联合扩散并存。
    - 评测目标分散在Atari 100k、驾驶多视角、机器人仿真和Minecraft一致性基准上，难以直接比较。
    - 动作接口不同：动作可作为视频条件、规划器/控制器输出、联合扩散模态或评测控制维度。
    - 对于主要难点是长时域生成、空间/记忆一致性、物理合理性还是奖励/控制泛化，证据尚未收敛。
    开放问题:
    - 哪些辅助目标能在不依赖数据集特定调参的情况下迁移到驾驶与机器人视频之外？
    - 报告中的策略或规划提升有多少来自世界模型本身，而非规划器、控制器或任务先验？
    - 能否建立统一闭环协议，同时评测记忆一致性、空间一致性和动作控制？
    - 当前模型能否泛化到完全未见的上下文、原语或动作空间，而不只是训练证据的组合或插值？
    - 需要补充哪些基线、失效模式和代码/数据集细节，才能验证方法和基准结论？
