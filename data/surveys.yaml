  related_work_outline_zh:
  - 主流方向：证据中的世界模型研究以生成式视频世界模型和自动驾驶世界模型为核心，综述与分类工作试图把这些方向统一起来。
  - 研究共性：复杂动态被分解为可控制的原语、潜在状态或持久全局实体；大规模视频或驾驶数据被用于训练生成式模拟系统，以支持预测、规划或控制。
  - 关键差异：表示方式有语言分解原语、连续/离散/混合潜在表示、持久3D实体状态；监督信号可能来自语言、目标、自我运动、人体姿态或监控同步；评测目标包括合成质量、运动预测、地理参考、闭环控制和实时交互。
  - 趋势演进：从2023年数据驱动交通仿真，到2024年Sora相关综述和组合生成，再到2025-2026年持久视线外动态、开源实时世界模拟器，以及尚未实证验证的概念分类与评估框架。
  - 开放问题：分类法未经验证、未见原语泛化、仿真到真实迁移、开环与闭环指标不一致，以及代码、数据集、基线和局限性证据缺失，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for world models
      what_it_solves: Maps fragmented work in video generation, autonomous driving,
        and autonomous agents into common frameworks, design dimensions, and research
        gaps.
      what_remains_open: The proposed taxonomies and evaluation prescriptions are
        largely conceptual and lack systematic empirical validation or reproducibility
        evidence.
    - line: Generative video world model construction
      what_it_solves: Produces controllable future video and persistent dynamics through
        language-factorized primitives, global state entities, or open-source real-time
        generation.
      what_remains_open: Evidence is missing for generalization to entirely unseen
        primitives, transfer to physical robots, and complete limitation reporting.
    - line: Autonomous driving world models and datasets
      what_it_solves: Supports configurable multi-agent traffic simulation, motion
        prediction, ego-motion control, and scene composition control using road or
        ego-vision data.
      what_remains_open: Cross-dataset and cross-benchmark compatibility of results,
        baselines, and evaluation settings remains underevidenced.
    - line: Evaluation framework and gap mapping
      what_it_solves: Defines metrics or directions for temporal consistency, controllability,
        georeferencing, and open-loop versus closed-loop mismatch.
      what_remains_open: Whether these metrics are adopted across methods and which
        gaps matter most for real deployment have not been established.
    consensus:
    - World models are treated as generative simulators that should capture dynamics
      and support downstream prediction, planning, or control tasks.
    - The field is shifting from isolated video prediction toward frameworks that
      jointly consider representation, temporal consistency, and evaluation criteria.
    - Large-scale multimodal datasets and latent or global-state representations are
      common enabling conditions, while many papers omit detailed failure evidence.
    - Read-first, citation, and scoring signals are separated from methodology and
      reproducibility evidence; missing code, metrics, baselines, or limitation sections
      are interpreted as verification gaps rather than confirmed absence.
    disagreements:
    - 'Representation choices differ: some methods use language-factorized primitives,
      while others use continuous/discrete/hybrid latent spaces or persistent 3D global
      states with dynamic entities.'
    - Evaluation targets diverge across video synthesis quality, motion prediction,
      georeferencing, autonomous self-control, and real-time interactivity without
      a single shared protocol.
    - 'Supervision and interaction modes differ: conditioning may come from language
      instructions, target images, destination goals, ego-motion, human poses, or
      monitor-based state synchronization.'
    - Survey/taxonomy contributions provide conceptual structure without experiments,
      whereas method papers report simulation or benchmark results but often lack
      physical robot transfer and limitation detail.
    open_questions:
    - Can the proposed latent-space taxonomies and evaluation frameworks be empirically
      tested, or do they remain selective conceptual mappings?
    - How well do compositional or factorized video world models handle completely
      unseen primitives and transfer from simulation to physical robots?
    - Which benchmarks or metrics should be prioritized to align open-loop generation
      quality with closed-loop driving or robot performance?
    - What verification evidence is still missing for open-source world simulators,
      including code, dataset splits, baselines, metrics, and limitations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型分类与路线图综合
      解决的问题: 将视频生成、自动驾驶和自主智能体等碎片化工作组织为统一框架、设计维度和研究缺口。
      尚未覆盖: 所提分类法与评估规范多为概念性，缺乏系统性实证验证或可复现证据。
    - 路线: 生成式视频世界模型构建
      解决的问题: 通过语言分解原语、全局状态实体或开源实时生成，实现可控视频合成与持久动态。
      尚未覆盖: 缺少对完全未见原语的泛化、物理机器人迁移和完整局限性报告的证据。
    - 路线: 自动驾驶世界模型与数据集
      解决的问题: 使用道路或自我视觉数据支持可配置多智能体交通仿真、运动预测、自我运动控制和场景组成控制。
      尚未覆盖: 跨数据集、跨基准的结果兼容性以及基线和评测设置一致性仍缺少证据。
    - 路线: 评估框架与缺口映射
      解决的问题: 为时间一致性、可控性、地理参考以及开环与闭环差异定义指标或研究方向。
      尚未覆盖: 这些指标是否被广泛采用，以及哪些缺口对实际部署最值得优先解决尚未建立。
    共识:
    - 世界模型被共同视为生成式模拟器，应捕捉动态并支持下游预测、规划或控制任务。
    - 研究重心正从孤立视频预测转向同时考虑表示、时间一致性与评估标准的框架。
    - 大规模多模态数据和潜在或全局状态表示是常见使能条件，但许多论文未提供完整失败案例或局限性证据。
    - 阅读优先、引用和评分信号与方法论、可复现证据被区分对待；缺失代码、指标、基线和局限性被解释为验证缺口，而非确认不存在。
    分歧:
    - 表示方式不同：有语言分解原语、连续/离散/混合潜在空间，也有持久3D全局状态与动态实体。
    - 评测目标分散在视频合成质量、运动预测、地理参考、自主自控和实时交互上，没有统一协议。
    - 监督与交互模式不同：条件可能来自语言指令、目标图像、目的地目标、自我运动、人体姿态或监控同步。
    - 综述/分类式工作偏概念结构而缺少实验；方法类工作报告仿真或基准结果，但常缺物理机器人迁移和局限细节。
    开放问题:
    - 统一潜在空间分类法和评估框架能否被实证检验，还是仍停留在选择性概念梳理？
    - 组合式或分解式视频世界模型如何处理完全未见原语，并从仿真迁移到物理机器人？
    - 应优先采用哪些基准或指标来弥合开环生成质量与闭环驾驶或机器人性能之间的差异？
    - 开源世界模拟器在代码、数据集划分、基线、指标和局限性方面还缺哪些验证证据？
