  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion Transformers
    or stochastic sequence models are being coupled with actions, context, or physics
    constraints for driving and robotics tasks.'
  - 'Shared research pattern: Most papers use video or latent-state prediction as
    the core learning signal and add auxiliary tasks such as mask reconstruction,
    depth prediction, keypoint dynamics, or action diffusion to improve consistency
    and controllability.'
  - 'Key differences: Works differ in supervision signal, action interface, generalization
    strategy, and evaluation setting; some target unseen context, some compose language
    primitives, and others benchmark spatial or memory consistency.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2023-2026, so
    the visible trend is within the current frontier: from efficient RL world models
    toward unified video-action diffusion and open-domain consistency benchmarks.'
  - 'Open questions: It remains unclear whether gains come from the learned model
    or the surrounding planner, which auxiliary objectives transfer across domains,
    and how to handle unobserved context or novel primitives.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或随机序列模型为核心构建生成式世界模型，并逐步接入动作、上下文或物理约束，用于驾驶与机器人任务。
  - 研究共性：以视频或潜在状态预测为学习信号，并通过掩码重建、深度、关键点、动作扩散等辅助任务增强一致性和可控性。
  - 关键差异：监督信号、动作接口、泛化策略和评测设置不同；有的处理可观测上下文，有的组合语言原语，有的构建时空或记忆一致性基准。
  - 趋势演进：高相关论文集中在2023-2026年，趋势处于当前前沿：从高效强化学习世界模型走向统一视频-动作扩散与开放域一致性评测。
  - 开放问题：收益来自模型还是规划器？哪些辅助目标可跨域迁移？未观测上下文与新颖原语如何处理？如何公平衡量长时记忆和动作控制？
  literature_review:
    line_of_work_matrix:
    - line: Masked reconstruction and stochastic sequence world models
      what_it_solves: Converts visual observations into predictive video or latent
        dynamics via mask reconstruction, diffusion, Transformer, and VAE-style stochastic
        modeling for efficient long-horizon RL generation.
      what_remains_open: Whether reported gains transfer beyond driving and Atari
        benchmarks, and how mask or stochastic losses interact with downstream dynamics
        accuracy.
    - line: Contextual latent dynamics for zero-shot generalization
      what_it_solves: Conditions recurrent state-space world models on observable
        context so policies trained on imagined rollouts generalize to unseen dynamics.
      what_remains_open: Assumes context observability and validates on two CARL tasks,
        leaving hidden-context and broader real-world transfer unresolved.
    - line: Compositional language-conditioned video generation for robot imagination
      what_it_solves: Factorizes video generation into language primitives and goal
        images so unseen task combinations can be synthesized as robot video plans.
      what_remains_open: Generalization remains limited to seen primitive combinations
        and accurate parsing, with simulation-only execution evidence.
    - line: Physics-informed embodied world models
      what_it_solves: Augments RGB video generation with temporal depth and keypoint
        dynamics auxiliary tasks to improve 3D consistency and physical plausibility
        for robotics.
      what_remains_open: Reports fidelity and downstream policy utility, but explicit
        ablation of physics auxiliary contributions and failure modes are missing.
    - line: Unified video-action diffusion world models
      what_it_solves: Couples video and action diffusion in one Transformer so pretraining
        can flexibly represent policy, forward/inverse dynamics, and video generation,
        including action-free video.
      what_remains_open: Evidence focuses on policy robustness; the contribution of
        modality-specific diffusion timesteps and dataset composition is not fully
        isolated.
    - line: Consistency and action-control benchmarks
      what_it_solves: Introduces loop-navigation, scene-graph, and revisited-view
        metrics to measure spatial, memory, and action-control consistency in open-domain
        world models.
      what_remains_open: Benchmarks are early and lack broad model comparisons; pixel-invariant
        metrics may miss semantic correctness or downstream task success.
    consensus:
    - Recent world models use generative video or latent-state prediction as the core
      learning signal.
    - Auxiliary losses or modality coupling, such as mask reconstruction, depth prediction,
      keypoint dynamics, and action diffusion, are used to improve consistency and
      controllability.
    - Evaluation increasingly includes downstream policy training, robot execution,
      or consistency metrics rather than video quality alone.
    - There is shared interest in generalizing beyond training scenes, tasks, or dynamics.
    disagreements:
    - 'Supervision signal differs: some use observational video with reconstruction
      or physics auxiliary losses, while others condition on actions or observable
      context.'
    - 'Output interface differs: some generate video plans for robot execution, some
      train policies inside latent rollouts, and some switch among policy, dynamics,
      and video generation.'
    - 'Evaluation setting differs: closed-loop navigation/action-consistency benchmarks
      versus single-scene video fidelity and simulated downstream policy checks.'
    - 'Generalization strategy differs: contextual disentanglement, language-primitive
      composition, and large-scale video-action pretraining pursue different routes.'
    open_questions:
    - Which auxiliary objective transfers across driving, robotics, and open-domain
      video without dataset-specific tuning?
    - How should world models handle unobserved context or entirely novel primitives
      instead of assuming observability or known compositionality?
    - Do reported gains come from the learned dynamics model or from the planner,
      controller, and task priors surrounding it?
    - What metrics can fairly compare long-term memory consistency and action controllability
      across embodiments?
    - Several top papers lack explicit limitations or ablation details, leaving verification
      gaps for failure modes and component contributions.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码重建与随机序列世界模型
      解决的问题: 将视觉观测转化为预测视频或潜在动态，通过掩码重建、扩散、Transformer和VAE式随机建模实现长时域高效强化学习生成。
      尚未覆盖: 收益是否超出驾驶和Atari基准，掩码或随机损失如何影响下游动力学准确性仍不清楚。
    - 路线: 面向零样本泛化的上下文潜在动力学
      解决的问题: 将循环状态空间世界模型显式条件化于可观测上下文，使在想象轨迹上训练的策略泛化到未见动力学。
      尚未覆盖: 假设上下文可观测，仅在两个CARL任务验证，隐上下文与更广泛的真实迁移未解决。
    - 路线: 语言条件组合视频生成用于机器人想象
      解决的问题: 将视频生成分解为语言原语和目标图像，使未见任务组合能合成为机器人视频计划。
      尚未覆盖: 泛化仍局限于已见原语组合与准确解析，且仅有仿真执行证据。
    - 路线: 物理信息具身世界模型
      解决的问题: 通过时间深度和关键点动力学辅助任务增强RGB视频生成，改善机器人的3D一致性与物理合理性。
      尚未覆盖: 报告了保真度和下游策略效用，但缺少物理辅助目标贡献的消融与失败模式说明。
    - 路线: 统一视频-动作扩散世界模型
      解决的问题: 在单一Transformer中耦合视频与动作扩散，使预训练可灵活表示策略、前向/逆动力学和视频生成，包括无动作视频。
      尚未覆盖: 证据主要集中在策略鲁棒性，模态特定扩散时间步与数据构成的具体贡献未被充分隔离。
    - 路线: 一致性与动作控制基准
      解决的问题: 通过循环导航、场景图和重访视角指标评估开放域世界模型的空间一致性、记忆一致性与动作控制。
      尚未覆盖: 基准尚新且缺少广泛模型比较；像素不变指标可能忽略语义正确性或下游任务成功。
    共识:
    - 近期世界模型普遍以生成式视频或潜在状态预测为核心学习信号。
    - 掩码重建、深度预测、关键点动力学和动作扩散等辅助损失或模态耦合被用于提升一致性与可控性。
    - 评测开始纳入下游策略训练、机器人执行或一致性指标，而不仅是视频质量。
    - 多项工作共同关注对训练场景、任务或动力学之外的泛化。
    分歧:
    - 监督信号不同：有的使用观测视频加重建或物理辅助损失，有的则以动作或可观测上下文为条件。
    - 输出接口不同：有的生成视频计划用于机器人执行，有的在潜在想象中训练策略，有的在策略、动力学和视频生成之间切换。
    - 评测设置不同：闭环导航/动作一致性基准与单场景视频保真及仿真下游策略检查并存。
    - 泛化策略不同：上下文解耦、语言原语组合和大规模视频-动作预训练各走不同路线。
    开放问题:
    - 哪种辅助目标能跨驾驶、机器人和开放域视频迁移而不过度依赖数据集调参？
    - 当上下文不可观测或出现全新原语时，世界模型如何可靠泛化？
    - 报告的性能提升究竟来自学习到的动力学模型，还是周边规划器、控制器与任务先验？
    - 什么指标能跨具身设置公平比较长时记忆一致性与动作可控性？
    - 若多篇高相关论文缺少明确的局限性或消融细节，失败模式与组件贡献仍存在验证缺口。
