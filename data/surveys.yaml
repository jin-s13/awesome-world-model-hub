  related_work_outline_zh:
  - 主流方向：构建可交互、动作可控的视频世界模型，作为自动驾驶、机器人和游戏等领域的模拟器，并建立基准以评估动作保真度、空间一致性和物理合理性。
  - 研究共性：以视频生成为世界模型骨架，引入动作条件机制，并设计训练策略以增强动态一致性和长时域推演。
  - 关键差异：控制粒度（高层意图 vs 低层轨迹）、评估重点（视觉质量、动作忠实度、空间一致性）、是否集成物理知识或预训练模型，以及目标领域（自动驾驶、机器人、Minecraft）。
  - 趋势演进：从2024到2026年，研究重心从高保真生成转向闭环、实时交互仿真，对可控性、长时一致性和标准化基准的关注持续增强。
  - 开放问题：长时域自回归退化、跨领域和传感器配置的泛化能力、速度与保真度的权衡，以及缺乏统一评估协议和可复现工件。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning world model prototypes into deployable closed-loop simulators
        with data, training, inference, and evaluation workflows.
      what_remains_open: Generalization to new environments, hardware adaptability,
        and long-term stability under deployment.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        control, enabling high-fidelity, action-controllable video generation.
      what_remains_open: Trade-offs between speed, fidelity, and controllability;
        scalability to complex multi-agent scenes; integration of multimodal control
        signals.
    - line: Artifacts and reproducible engineering
      what_it_solves: Providing standardized benchmarks and datasets to evaluate world
        models, making them inspectable and comparable.
      what_remains_open: Independent cross-team reproduction, compatibility across
        diverse datasets and infrastructure, and comprehensive metrics that cover
        both visual quality and behavioral consistency.
    consensus:
    - Action-conditioned video generation is a core capability for world simulators;
      all works incorporate explicit action signals to control future frame prediction.
    - Benchmarks are essential for progress; multiple papers introduce new datasets
      and evaluation metrics for action fidelity, spatial consistency, or physical
      plausibility.
    - Long-horizon dynamic consistency is a central challenge; all works propose training
      strategies to mitigate autoregressive degradation over extended rollouts.
    disagreements:
    - 'Control interface: some systems use high-level commands (goal point, command)
      while others use low-level trajectories, angles, and speed, reflecting different
      assumptions about the planner''s input.'
    - 'Evaluation focus: visual quality metrics (FID, FVD), action fidelity metrics,
      and scene-graph consistency scores are used interchangeably, revealing no agreed-upon
      standard for world model performance.'
    - 'Model architecture: Dreamer-based recurrent latent models, diffusion transformers,
      and autoregressive transformers are all employed, with different trade-offs
      in training stability, inference speed, and generation quality.'
    - 'Reliance on pretrained models: one approach fine-tunes a pretrained video generator,
      while others train from scratch, leading to different generalization and bias
      properties.'
    - 'Domain specificity: works target distinct domains (autonomous driving, robotics,
      Minecraft), which differ in sensor configuration, action space, and physical
      dynamics, limiting cross-domain comparisons.'
    open_questions:
    - Can long-term temporal coherence be maintained without mode collapse in autoregressive
      video world models, and what mechanism best prevents iterative drift?
    - Do models trained on one domain (e.g., driving) transfer to others (e.g., robotics)
      without catastrophic forgetting, and what architecture or training strategy
      enables this?
    - How should real-time inference speed be balanced with high visual fidelity and
      physical plausibility in safety-critical closed-loop settings?
    - What combination of metrics—visual, behavioral, and physical—defines a reliable
      world model, and how can a standardized benchmark capture this multifaceted
      evaluation?
    - To what extent do omitted code, datasets, and training details limit independent
      reproduction, and how can the community enforce reproducibility standards for
      world model systems?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将世界模型原型转化为可部署的闭环模拟器，包含数据、训练、推理和评估工作流。
      尚未覆盖: 对新环境的泛化能力、硬件适应性，以及部署条件下的长期稳定性。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环控制的延迟和交互需求，实现高保真、动作可控的视频生成。
      尚未覆盖: 速度、保真度和可控性之间的权衡；复杂多智能体场景的可扩展性；多模态控制信号的集成。
    - 路线: 工件与可复现工程
      解决的问题: 提供标准化基准和数据集以评估世界模型，使其可检查、可比较。
      尚未覆盖: 跨团队独立复现，跨不同数据集和基础设施的兼容性，以及涵盖视觉质量与行为一致性的全面评估指标。
    共识:
    - 动作条件视频生成是世界模拟器的核心能力；所有工作都引入显式动作信号来控制未来帧预测。
    - 基准测试对进展至关重要；多篇论文提出了新的数据集和评估指标，用于衡量动作忠实度、空间一致性或物理合理性。
    - 长时域动态一致性是核心挑战；所有工作都设计了训练策略以缓解延展推演中的自回归退化。
    分歧:
    - 控制接口：部分系统使用高层命令（目标点、指令），另一些使用低层轨迹、角度和速度，反映了对规划器输入的不同假设。
    - 评估重点：视觉质量指标（FID、FVD）、动作忠实度指标和场景图一致性分数被交替使用，表明缺乏公认的世界模型性能标准。
    - 模型架构：采用基于Dreamer的循环潜变量模型、扩散Transformer以及自回归Transformer，在训练稳定性、推理速度和生成质量方面各有取舍。
    - 对预训练模型的依赖：一种方法微调预训练视频生成器，而其他方法从头训练，导致不同的泛化能力和偏差特性。
    - 领域特异性：工作针对不同领域（自动驾驶、机器人、Minecraft），这些领域在传感器配置、动作空间和物理动力学上存在差异，限制了跨领域比较。
    开放问题:
    - 在自回归视频世界模型中，能否维持长时域时间一致性而不出现模式崩溃，哪种机制最能防止迭代漂移？
    - 在某一领域（如驾驶）训练的模型能否迁移到其他领域（如机器人）而不发生灾难性遗忘，何种架构或训练策略能实现这一点？
    - 在安全关键的闭环环境中，如何权衡实时推理速度与高视觉保真度和物理合理性？
    - 视觉、行为和物理指标的何种组合能定义一个可靠的世界模型，标准化基准如何捕捉这种多维度评估？
    - 缺失的代码、数据集和训练细节在多大程度上限制了独立复现，社区如何落实世界模型系统的可复现性标准？
