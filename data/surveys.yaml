      what_remains_open: Long-horizon consistency, unseen-domain generalization, and
        whether visual fidelity translates to downstream policy performance.
    - line: Benchmarking and evaluation frameworks
      what_it_solves: Providing datasets, metrics, and baselines to quantify spatial,
        action, and physical fidelity of world-model systems.
      what_remains_open: Standardization across domains and evidence that these metrics
