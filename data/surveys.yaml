  - 主流方向：动作可控的视觉世界模型正被构建为可运行模拟器，尤其面向自动驾驶与具身控制，将视频生成与动作或轨迹条件结合，并评估闭环保真度与延迟。
  - 研究共性：将学习到的动力学或视频生成器与显式控制输入/上下文耦合，通过损失或辅助任务对齐生成未来与动作/物理，并在基准或下游策略上验证。
  - 关键差异：评测目标包括空间一致性、动作保真度、视觉/物理合理性或规划真实感；生成架构包括扩散或自回归；条件形式包括上下文变量、轨迹/关键点或高低层控制。
  - 趋势演进：高证据论文集中在2024-2026年，从通用视频生成转向专用驾驶和机器人模拟器，再转向闭环低延迟系统与显式评估基准；时间窗口较窄，趋势属于当前前沿。
  - 开放问题：基准指标能否迁移到下游任务表现；在已报告数据集之外长时域与跨视角一致性如何；上下文可观测假设在部署中是否成立；开放工件能否支撑独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving world models and closed-loop simulators
      what_it_solves: Turning video generation into driving simulation that follows
        trajectory or control inputs with visual fidelity and low latency for closed-loop
        evaluation and policy use.
      what_remains_open: Generalization beyond nuScenes, Waymo, or nuPlan; long-horizon
        cross-view consistency; changed sensor configurations; and multi-GPU or real-time
        deployment scaling.
    - line: Contextual and physics-informed embodied world models
      what_it_solves: Improving zero-shot generalization to unseen dynamics and physically
        plausible robot video by conditioning on context or auxiliary depth and keypoint
        dynamics.
      what_remains_open: Assumptions that context is observable, narrow evaluation
        over CARL or reported robot scenarios, and missing independent physical plausibility
        measurement.
    - line: Benchmarks and evaluation artifacts for world model consistency
      what_it_solves: Providing datasets, metrics, and open evaluation frameworks
        that quantify spatial consistency and action fidelity beyond pixel-level similarity.
      what_remains_open: Limited domain coverage, unclear correlation between these
        metrics and downstream policy performance, and unverified reproduction across
        teams and infrastructure.
    - line: Scalable generative models for motion planning and scenario simulation
      what_it_solves: Learning scene dynamics in dual-mode autoregressive models to
        generate diverse futures, scenarios, and planning rollouts for autonomous
        systems.
      what_remains_open: Trade-offs among inference speed, generation quality, and
        closed-loop control are only partially reported; downstream planning benefit
        needs stronger evidence.
    consensus:
    - World models are being reframed as runnable simulators that take actions, context,
      or trajectory prompts and generate future frames or rollouts for downstream
      control and evaluation.
    - Control alignment and dynamic consistency are core quality criteria, with losses
      or auxiliary tasks targeting action adherence, motion, depth, or structure.
    - Benchmarks and open datasets are treated as necessary to measure action fidelity,
      spatial consistency, or realism beyond perceptual quality alone.
    disagreements:
    - 'Conditioning differs: some systems use high-level or low-level driving controls,
      others use observable context variables, and others use keypoint or depth dynamics,
      which changes supervision and generalization claims.'
    - 'Evaluation targets differ: navigation spatial consistency, driving action fidelity,
      robot video physical plausibility, or motion planning realism.'
    - 'Deployment orientation differs: some work optimizes generation quality, while
      a subset explicitly reports low-latency single-GPU closed-loop constraints.'
    open_questions:
    - Do current action fidelity or spatial consistency metrics predict downstream
      policy training or evaluation quality?
    - How well do these simulators generalize outside nuScenes, Minecraft, CARL, or
      the reported robotics scenarios, especially under changed sensors or hardware?
    - Can long-horizon autoregressive rollouts avoid error accumulation in closed-loop
      use beyond tested sequence lengths?
    - Are the open-source artifacts sufficient for independent reproduction across
      different datasets and infrastructure environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的驾驶世界模型与闭环模拟器
      解决的问题: 将视频生成转化为遵循轨迹或控制输入、具备视觉保真度和低延迟的驾驶仿真，以支持闭环评测与策略使用。
      尚未覆盖: 在nuScenes、Waymo、nuPlan之外、传感器配置变化、长时域跨视角一致性，以及多GPU或实时部署扩展性仍缺验证。
    - 路线: 上下文与物理信息驱动的具身世界模型
      解决的问题: 通过上下文条件或深度与关键点辅助任务，改善未见动力学下的零样本泛化和机器人视频物理合理性。
      尚未覆盖: 上下文可观测假设、CARL或已报告机器人场景覆盖较窄，独立物理合理性评测仍不足。
    - 路线: 面向世界模型一致性的基准与评估工件
      解决的问题: 提供数据集、指标和开放评估框架，衡量空间一致性与动作保真度，超越像素级相似度。
      尚未覆盖: 领域覆盖有限，指标与下游策略表现的关联尚未证明，跨团队、跨基础设施复现未验证。
    - 路线: 面向运动规划与场景仿真的可扩展生成模型
      解决的问题: 以双模式自回归学习场景动力学，生成多样未来、场景和规划推演，用于自主系统。
      尚未覆盖: 推理速度、生成质量与闭环控制之间的权衡，以及仿真真实感对下游规划的实际收益仍需系统验证。
    共识:
    - 世界模型被重构为可运行模拟器：接收动作、上下文或轨迹提示，生成未来帧或推演，用于下游控制与评测。
    - 控制对齐和动态一致性是核心质量目标，通过动作遵循、运动、深度或结构相关损失或辅助任务实现。
    - 需要基准和开放数据集来量化动作保真度、空间一致性或真实感，而非只依赖感知质量。
    分歧:
    - 条件方式不同：有的用高层或低层驾驶控制，有的用可观测上下文变量，有的用关键点或深度动力学，导致监督信号和泛化声明不同。
    - 评测目标不同：导航空间一致性、驾驶动作保真度、机器人视频物理合理性或运动规划真实感。
    - 部署取向不同：部分系统关注生成质量，部分明确报告单GPU低延迟闭环限制。
    开放问题:
    - 当前动作保真度或空间一致性指标能否预测下游策略训练或评测质量？
    - 这些模拟器在nuScenes、Minecraft、CARL或已报告机器人场景之外，以及对传感器或硬件变化时泛化如何？
    - 长时域自回归推演能否在超出已测序列长度后控制误差累积？
    - 开放源码与数据是否足以支持跨数据集和基础设施环境的独立复现？
