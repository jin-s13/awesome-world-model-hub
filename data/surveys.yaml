  related_work_outline:
  - 'Mainstream direction: Building and evaluating world models as action-conditioned
    video generators, with diffusion or Transformer architectures and benchmarks focused
    on visual fidelity, policy utility, or consistency.'
  - 'Shared research pattern: Use standard evaluation suites such as Atari 100k, NuScenes,
    OpenDV-2K, Waymo, CARL, Minecraft navigation, and robot video data to compare
    generation quality, control response, and long-horizon stability.'
  - 'Key differences: Evaluation targets range from game human-normalized scores and
    driving rollout to contextual zero-shot generalization and spatial, memory, or
    action-control stress tests; supervision also differs across RGB video, actions,
    context, depth, masks, and keypoints.'
  - 'Trend evolution: The visible 2023-2026 evidence shifts from a single aggregate
    game-score frontier toward embodied, open-domain, and consistency-oriented benchmarking.'
  - 'Open questions: Proxy metrics may not align with downstream decision utility;
    long-horizon memory, cross-action-space generalization, and stability across implementations
    remain underevidenced.'
  related_work_outline_zh:
  - 主流方向：以动作条件视频生成作为世界模型核心能力，使用扩散或Transformer架构，并以视觉保真度、策略效用或一致性作为评测目标。
  - 研究共性：依托Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL、Minecraft导航和机器人视频等评测集合，比较生成质量、控制响应和长时域稳定性。
  - 关键差异：评测目标分为游戏人类归一化得分、驾驶长时域展开、上下文零样本泛化和空间/记忆/动作控制压力测试；监督信号涵盖RGB、动作、上下文、深度、掩码和关键点。
  - 趋势演进：可见证据集中在2023-2026年，从单一游戏总分前沿转向具身、开放域和一致性导向的基准测试。
  - 开放问题：代理指标与下游决策效用的对齐、长期记忆与跨动作空间泛化、以及不同实现下结论稳定性尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Constructs shared loop-navigation, driving, and open-domain
        video tasks so spatial consistency, memory, and action-controlled generation
        become comparable across world models.
      what_remains_open: Whether task distributions cover the physical, long-horizon,
        and multi-agent settings where world models are expected to help, and whether
        dataset scale is sufficient for generalization claims.
    - line: Metric and stress-test design
      what_it_solves: 'Probes capabilities beyond aggregate scores: scene-graph consistency,
        memory consistency, action control, physical plausibility, zero-shot contextual
        generalization, and human-normalized game performance.'
      what_remains_open: Alignment between these proxy metrics and downstream decision
        outcomes, and their sensitivity to pixel-level variation or implementation
        details, remains unresolved.
    - line: Comparable baselines and reporting
      what_it_solves: Provides auditable baselines and reporting conventions through
        common datasets such as Atari 100k, CARL, NuScenes, OpenDV-2K, Waymo, and
        robot video corpora.
      what_remains_open: Whether benchmark conclusions remain stable across diffusion,
        Transformer, VAE, and physics-informed implementations and across compute
        budgets; missing artifact or limitation evidence is a verification gap.
    consensus:
    - Evaluation increasingly treats world models as action-conditioned video predictors
      and assesses visual fidelity, policy performance, or consistency of generated
      observations.
    - There is convergence on adding targeted consistency and action-control stress
      tests rather than relying only on aggregate reconstruction or game scores.
    - Diffusion and Transformer-based generative models have become strong common
      baselines across game, driving, and robot settings.
    - Several sources agree that visual detail and physical plausibility affect downstream
      policy or interaction utility, not just compressed-latent reconstruction.
    disagreements:
    - Representation choice divides between compact stochastic latent models, pixel-space
      diffusion generators, and physics-aware keypoint or depth-conditioned generators.
    - 'Evaluation targets differ: some emphasize closed-loop action control and memory,
      while others emphasize one-step visual fidelity, zero-shot context generalization,
      or long-horizon driving rollout.'
    - 'Supervision and data requirements differ: some approaches need action labels,
      context values, masks, depth, or keypoints, while others learn from action-free
      video or large multitask robot datasets.'
    - 'Environment and scale differ: constrained Minecraft loops, simulated games,
      driving-style video, and robot data stress different failure modes, so findings
      may not transfer across settings.'
    open_questions:
    - Do scene-graph or memory-consistency metrics predict downstream policy success
      in robotics or driving?
    - Can small open-domain benchmarks with limited scene coverage or single-environment
      navigation support robust generalization claims?
    - Are benchmark rankings stable across different diffusion, Transformer, VAE,
      and physics-informed implementations and compute budgets when many sources lack
      full artifact or limitation evidence?
    - How should evaluation separate visual plausibility from physical plausibility
      and long-horizon causal consistency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的循环导航、驾驶和开放域视频任务，使空间一致性、记忆和动作控制在不同世界模型之间可比较。
      尚未覆盖: 任务分布是否覆盖真实物理、长时域和多智能体设置，以及当前数据规模是否足以支撑泛化声明。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外测量场景图一致性、记忆一致性、动作控制、物理合理性、零样本上下文泛化和人类归一化游戏表现。
      尚未覆盖: 代理指标与下游决策结果之间的对齐，以及对像素级变化和实现细节的敏感性尚未解决。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo和机器人视频语料等公共数据集提供可审计的基线和报告规范。
      尚未覆盖: 结论是否随扩散、Transformer、VAE和物理信息实现以及算力预算保持稳定；若干来源缺少工件或局限性说明，属于验证缺口。
    共识:
    - 评测越来越把世界模型视为动作条件视频预测器，并同时关注视觉保真度、策略性能或生成一致性。
    - 研究正从单一重建或游戏得分转向加入记忆、空间和动作控制等针对性压力测试。
    - 扩散和Transformer类生成模型在游戏、驾驶和机器人环境中被广泛接受为强基线。
    - 多项工作认为视觉细节和物理合理性会影响下游策略或交互效用，而不只是压缩潜在表示的重建。
    分歧:
    - 表示方式不同：紧凑随机潜在模型、像素空间扩散生成器、物理感知关键点或深度条件生成器之间存在取舍。
    - 评测目标不同：有的强调闭环动作控制与记忆，有的强调单步视觉保真度、零样本上下文泛化或驾驶长时域展开。
    - 监督信号不同：有的需要动作标签、上下文值、掩码、深度或关键点，有的从无动作视频或大规模多任务机器人数据学习。
    - 环境和规模不同：受控Minecraft循环、模拟游戏、驾驶类视频和机器人数据压力不同，结论不一定可迁移。
    开放问题:
    - 场景图或记忆一致性指标能否预测真实机器人或驾驶中的下游策略成效？
    - 场景覆盖有限或仅单一环境的导航基准是否足以支持稳健的泛化声明？
    - 在缺少工件和局限性证据的情况下，排名是否会在不同实现和算力预算下保持稳定？
    - 如何区分视觉逼真性、物理合理性与长期因果一致性，并分别评测？
