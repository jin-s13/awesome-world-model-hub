  related_work_outline_zh:
  - 主流方向：世界模型评测与设计是本基准主题的主导方向，覆盖驾驶、机器人、具身视频、Atari和上下文控制等设置。
  - 研究共性：相关工作通常将任务或数据集与预测质量、一致性、可控性或下游策略效用指标结合。
  - 关键差异：一些工作构建新基准，如LoopNav或MIND；另一些提出模型架构，并在Atari 100k、CARL或驾驶数据集等既有基准上报告结果。
  - 趋势演进：可见证据集中在2023-2026年，研究从基于模型的强化学习评测，转向带记忆、空间和动作控制压力测试的开放域具身与视频生成基准。
  - 开放问题：代理指标有效性、长时域与领域覆盖，以及在缺乏完整可复现证据时基准提升是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared navigation and video-rollout tasks so world-model
        spatial consistency, memory consistency, and action control can be compared.
      what_remains_open: Whether curated Minecraft or video scenes cover long-horizon
        open-domain deployment distributions remains unverified.
    - line: Metric and stress-test design
      what_it_solves: Probes consistency, controllability, and physical plausibility
        beyond aggregate scores through scene-graph consistency, memory/action-control
        evaluation, and human-normalized scores.
      what_remains_open: Alignment between these proxy metrics and downstream policy
        utility or real-world deployment is not established.
    - line: Comparable baselines and reporting
      what_it_solves: Makes model claims auditable by evaluating on common suites
        such as Atari 100k, NuScenes/OpenDV-2K/Waymo, CARL, and large robotic datasets.
      what_remains_open: Stability across implementations and compute budgets, plus
        missing limitation, code, and artifact details, leaves comparability uncertain.
    consensus:
    - World-model evaluation increasingly targets not only visual fidelity but also
      temporal consistency under action-conditioned rollouts.
    - Benchmark work tends to combine dataset or task construction with a specific
      metric or scoring protocol rather than only leaderboard ranking.
    - Evaluation settings are expanding toward open-domain embodied scenarios including
      driving, robotics, gaming, and first/third-person video.
    disagreements:
    - Some work creates new task and consistency metrics, while other work proposes
      model architectures and reports on existing benchmark metrics.
    - Supervision signals differ among mask reconstruction, physics-informed keypoint/depth,
      context conditioning, and coupled video-action diffusion.
    - 'Evaluation targets differ: visual fidelity and physical plausibility, policy
      performance, memory and spatial consistency, or zero-shot generalization.'
    - 'Interaction modes differ: open-loop video generation, closed-loop action-controlled
      rollouts, and policy learning in imagined trajectories.'
    open_questions:
    - How well do proxy consistency scores predict downstream policy success or deployment
      outcomes?
    - Can current benchmarks cover long-horizon memory, cross-action-space generalization,
      and diverse embodiment settings?
    - Are reported benchmark gains stable across implementations, compute budgets,
      and missing reproducibility artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享导航和视频推演任务，使世界模型的空间一致性、记忆一致性和动作控制可比较。
      尚未覆盖: 精选的Minecraft或视频场景是否覆盖长时域开放域部署分布仍未验证。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性、记忆与动作控制评测及人类归一化分数，检验总分之外的一致性、可控性与物理合理性。
      尚未覆盖: 这些代理指标与下游策略效用或真实部署之间的对齐尚未确立。
    - 路线: 可比基线与报告规范
      解决的问题: 让模型结果可在Atari 100k、NuScenes/OpenDV-2K/Waymo、CARL和大规模机器人数据集等共同基准上审计。
      尚未覆盖: 实现和算力预算变化时的稳定性，以及缺失的局限性、代码和工件细节使可比性不确定。
    共识:
    - 世界模型评测越来越同时关注视觉保真度与动作条件下的时间一致性，而非单一生成质量。
    - 基准工作通常将数据/任务构建与特定指标或评分协议结合，而非仅提供榜单排名。
    - 评测设置向开放域和具身场景扩展，包括驾驶、机器人、游戏以及第一/第三人称视频。
    分歧:
    - 一部分工作构建新的任务和一致性指标，另一部分工作提出模型架构并在既有指标上比较。
    - 监督信号不同：掩码重建、物理信息关键点/深度、上下文条件建模、视频与动作扩散等路线并存。
    - 评测目标不同：视觉保真/物理合理性、策略性能、记忆与空间一致性、零样本泛化各有侧重。
    - 交互模式不同：开环视频生成、闭环动作控制推演和想象轨迹中的策略学习混合存在。
    开放问题:
    - 代理一致性分数能在多大程度上预测下游策略成功或真实部署效果？
    - 现有基准是否足以覆盖长时域记忆、跨动作空间泛化和多样具身形态？
    - 在缺失代码、数据集、基线与局限性说明的情况下，报告的基准提升是否稳定可复现？
