  related_work_outline:
  - 'Mainstream direction: World-model benchmarks are shifting from aggregate game/RL
    scores toward closed-loop, memory-, spatial-, and action-control diagnostics,
    while model papers still report on suites like Atari 100k and driving/robotic
    datasets.'
  - 'Shared research pattern: Works use action-conditioned video/dynamics tasks, open
    datasets or shared evaluation protocols, and stress tests for consistency or zero-shot
    generalization.'
  - 'Key differences: Benchmark-focused contributions introduce specialized consistency
    scores and diagnostic video sets, while model-focused contributions optimize generation
    fidelity/efficiency; settings range from game and Minecraft simulators to driving
    and robot video.'
  - 'Trend evolution: Within the available 2023-2026 evidence, world-model evaluation
    moved from efficient RL world models to diffusion-based video/action models, then
    to explicit memory/action-control benchmarks by 2025-2026.'
  - 'Open questions: How proxy consistency metrics align with downstream decisions,
    how conclusions generalize across action spaces and scenes, and how stable results
    are across implementations and compute remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型基准正从游戏/RL总分转向闭环、记忆、空间与动作控制的诊断式评估，模型工作仍报告Atari 100k和驾驶/机器人数据集。
  - 研究共性：工作使用动作条件视频/动力学任务、开放数据集或共享评估协议，并测试一致性或零样本泛化。
  - 关键差异：基准类工作提出专门一致性分数和诊断视频集，模型类工作优化生成保真度与效率；场景从游戏、Minecraft到驾驶和机器人视频。
  - 趋势演进：在2023-2026证据范围内，从高效RL世界模型发展到扩散视频/动作模型，再到2025-2026年显式的记忆与动作控制基准。
  - 开放问题：代理一致性指标与下游决策是否一致、跨动作空间和场景的泛化、以及不同实现和算力下结论稳定性仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared video/dynamics tasks and datasets for comparing
        world-model claims, especially memory, spatial consistency, and action-conditioned
        prediction.
      what_remains_open: Whether fixed datasets cover the varied scenes, action spaces,
        and deployment conditions where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and generalization
        beyond aggregate scores through consistency or human-normalized control metrics.
      what_remains_open: Alignment between proxy metrics and downstream user decisions
        is not yet established.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable via common benchmarks, baselines, and
        reported training/evaluation conditions.
      what_remains_open: Stability of conclusions across implementations, compute
        budgets, and missing limitation or artifact details remains unclear.
    consensus:
    - Action-conditioned and closed-loop evaluation is becoming central for world-model
      claims.
    - Visual fidelity alone is insufficient; memory, spatial consistency, and physical
      plausibility are treated as necessary signals.
    - Shared datasets and standard RL/driving/robotic suites are used to improve comparability.
    - Zero-shot and long-horizon evaluation is used to reveal generalization failure
      modes.
    disagreements:
    - Aggregate control metrics such as Atari 100k human-normalized reward are used
      in some works, while others propose specialized spatial or memory consistency
      scores.
    - Simulated game environments and real-world-like driving/robotic videos create
      different evaluation coverage and failure assumptions.
    - Some approaches assume observable context or closed action spaces, whereas others
      target open-domain videos and cross-action-space generalization.
    - Model-focused evidence emphasizes generation quality and training efficiency;
      benchmark-focused evidence emphasizes diagnostic gaps and stress conditions.
    open_questions:
    - Do spatial-consistency and memory-consistency metrics predict downstream policy
      success in embodied tasks?
    - Can benchmark results remain stable across different implementations and compute
      budgets?
    - How can evaluation cover unseen scenes and varied action spaces without distribution
      leakage?
    - What evidence is needed to link physical plausibility or visual detail to long-horizon
      decision utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享视频/动力学任务和数据集，用于比较世界模型在记忆、空间一致性和动作条件预测等能力上的声称。
      尚未覆盖: 固定数据集是否覆盖世界模型预期发挥作用的多样化场景、动作空间和部署条件。
    - 路线: 指标与压力测试设计
      解决的问题: 通过一致性分数或人类归一化控制指标，在总分之外检验预测、可控性、鲁棒性和泛化能力。
      尚未覆盖: 代理指标与下游用户决策之间的一致性尚未被证实。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共同基准、基线和训练/评估条件提升结果的可审计性。
      尚未覆盖: 结论在不同实现、算力预算以及缺失限制或工件细节时是否稳定仍不清楚。
    共识:
    - 动作条件和闭环评估正成为验证世界模型能力的核心方式。
    - 仅靠视觉保真度不够，记忆、空间一致性和物理合理性被视为必要信号。
    - 使用共享数据集和标准RL/驾驶/机器人套件来提高可比性。
    - 零样本和长时域评估被用于发现泛化失败模式。
    分歧:
    - 一些工作使用Atari 100k人类归一化奖励等总分指标，另一些提出专门的空间或记忆一致性分数。
    - 模拟游戏环境与类真实的驾驶/机器人视频形成不同的评估覆盖和失败假设。
    - 部分方法假设上下文可观测或动作空间封闭，部分面向开放域视频和跨动作空间泛化。
    - 模型类证据强调生成质量和训练效率，基准类证据强调诊断缺口和压力条件。
    开放问题:
    - 空间一致性和记忆一致性指标能否预测具身任务中的下游策略成功？
    - 基准结果在不同实现和算力预算下能否保持稳定？
    - 评估如何覆盖未见场景和多样动作空间而不造成分布泄漏？
    - 需要什么证据才能将物理合理性或视觉细节与长时域决策效用关联起来？
