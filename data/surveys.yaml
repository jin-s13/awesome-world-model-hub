  related_work_outline:
  - 'Mainstream direction: domain-specific world models for driving, robotics, and
    interactive games; recent work favors action- or language-conditioned video generation
    with diffusion transformers and consistency benchmarks.'
  - 'Shared research pattern: models learn future visual states or latent dynamics
    from high-dimensional sensory-action sequences, then are judged on prediction
    fidelity, control return, or consistency metrics.'
  - 'Key differences: target domains vary across driving, robot manipulation, and
    game/RL; representations range from recurrent state-space models to stochastic
    transformer VAEs and video/action diffusion.'
  - 'Trend evolution: within the 2023–2026 frontier, work shifts from sample-efficient
    model-based RL and contextual Dreamer variants toward application-specific generative
    world models and explicit evaluation of memory/action consistency.'
  - 'Open questions: cross-domain transfer, real-world safety beyond simulation, long-horizon
    memory and novel primitive generalization, benchmark-to-downstream alignment,
    and missing code/dataset/limitation evidence remain open.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互式游戏等领域构建专用世界模型；近期工作倾向于使用扩散Transformer进行动作或语言条件的视频生成，并建立一致性基准。
  - 研究共性：模型从高维感知-动作序列中学习未来视觉状态或潜在动力学，并以预测保真度、控制回报或一致性指标进行评判。
  - 关键差异：部署领域涉及驾驶、机器人操作和游戏/强化学习；表示方式涵盖循环状态空间模型、随机Transformer VAE及视频/动作扩散。
  - 趋势演进：在2023–2026前沿内，工作从样本高效的基于模型强化学习和上下文Dreamer变体，转向应用特定的生成式世界模型及对记忆/动作一致性的显式评测。
  - 开放问题：跨领域迁移、仿真之外的真实安全性、长时域记忆与新原语泛化、基准分数与下游效用的一致性，以及代码/数据集/局限性证据缺失等仍需解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: predicts multi-view and long-horizon driving video; aims to
        generalize across driving datasets
      what_remains_open: whether improved dataset validation and zero-shot prediction
        align with closed-loop driving safety or operational outcomes
    - line: Embodied robot video generation and policy pretraining
      what_it_solves: learns action/language-conditioned future video and reusable
        robot policies from large multisensory datasets
      what_remains_open: generalization to novel task primitives and real-robot deployment;
        simulation-only evidence leaves physical execution uncertain
    - line: Sample-efficient model-based reinforcement learning
      what_it_solves: learns stochastic or contextual latent dynamics to train policies
        with limited environment interaction
      what_remains_open: assumptions such as observable context or benchmark-limited
        evaluation; broader task and environment transfer unverified
    - line: Physics-informed embodied world modeling
      what_it_solves: adds depth and keypoint-dynamics objectives to improve visual
        fidelity and physical plausibility of generated robot video
      what_remains_open: no explicit limitations reported; downstream policy benefits
        lack broad cross-embodiment or real-world evidence
    - line: World-model evaluation benchmarks
      what_it_solves: provides datasets and metrics for spatial consistency, memory
        consistency, and action control
      what_remains_open: whether benchmark metrics predict downstream task performance;
        current evidence focuses on open-domain video consistency rather than closed-loop
        task success
    consensus:
    - World models in this topic are increasingly built as future observation generators
      rather than only latent planners, often acting on actions, language, context,
      or physics signals.
    - Diffusion transformers and stochastic sequence models are common backbones for
      high-dimensional video prediction across driving, robotics, and game domains.
    - Evaluation is expanding beyond visual quality to include spatial consistency,
      memory consistency, action control, zero-shot dataset transfer, and policy return.
    - Structured conditioning—language primitives, context variables, physics objectives,
      or modality-specific diffusion steps—is used to improve generalization and plausibility.
    disagreements:
    - 'Representations differ: recurrent state-space latent dynamics, stochastic transformer
      VAEs, diffusion transformer video models, and coupled video-action diffusion
      models.'
    - 'Supervision and evaluation targets differ: driving dataset rollouts and zero-shot
      scenes; Atari human-normalized scores; robot video planning in simulation; loop/spatial
      or memory/action benchmarks.'
    - 'Assumptions about available information differ: context observability, predefined
      language primitives, paired action-video data, or action-free video usability.'
    - Some works explicitly inject physics or memory consistency objectives, while
      others rely on generative video loss and latent reconstruction without reported
      physical or long-term memory supervision.
    open_questions:
    - How well do driving world model gains on dataset validation and zero-shot prediction
      transfer to closed-loop safety and real operational outcomes?
    - Can robot-oriented world models generalize beyond seen primitive combinations
      and from simulation to real-robot execution?
    - What is the alignment between consistency benchmark scores and downstream policy
      success or deployment reliability?
    - How should world models handle long-horizon memory consistency and action-space
      shifts in open-domain interactive environments?
    - Which assumptions—observable context, paired actions, or parser-defined primitives—limit
      deployment, and can future methods relax them?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 预测多视角和长时域驾驶视频，并尝试跨驾驶数据集泛化
      尚未覆盖: 数据集验证和零样本预测的提升能否对应闭环驾驶安全或实际运营结果仍未证实
    - 路线: 具身机器人视频生成与策略预训练
      解决的问题: 从大规模多模态数据中学习动作/语言条件的未来视频和可复用机器人策略
      尚未覆盖: 对新任务原语和真实机器人部署的泛化；仅有仿真证据时，物理执行仍不确定
    - 路线: 样本高效的基于模型强化学习
      解决的问题: 学习随机或上下文潜在动力学，以在有限环境交互下训练策略
      尚未覆盖: 可观测上下文等假设或基准有限的评测；更广泛任务和环境迁移未验证
    - 路线: 物理信息驱动的具身世界建模
      解决的问题: 通过深度和关键点动力学目标提升生成机器人视频的视觉保真度与物理合理性
      尚未覆盖: 未见明确局限性说明；下游策略收益缺乏跨本体或真实世界证据
    - 路线: 世界模型评测基准
      解决的问题: 提供衡量空间一致性、记忆一致性和动作控制的数据集与指标
      尚未覆盖: 基准指标是否预测下游任务表现；现有证据主要关注开放域视频一致性而非闭环任务成功
    共识:
    - 该主题中的世界模型越来越多地被构建为未来观测生成器，而不仅是潜在规划器，通常依赖动作、语言、上下文或物理信号进行条件控制。
    - 扩散Transformer和随机序列模型是驾驶、机器人和游戏领域高维视频预测的常见主干。
    - 评测正在从视觉质量扩展到空间一致性、记忆一致性、动作控制、零样本数据集迁移和策略回报。
    - 结构化条件——语言原语、上下文变量、物理目标或模态特定扩散步——被用于提升泛化性和合理性。
    分歧:
    - 表示方式不同：循环状态空间潜在动力学、随机Transformer VAE、扩散Transformer视频模型以及视频-动作耦合扩散模型。
    - 监督与评测目标不同：驾驶数据集展开和零样本场景；Atari人类标准化分数；机器人视频规划仿真；环路/空间或记忆/动作基准。
    - 关于可用信息的假设不同：上下文可观测、预定义语言原语、成对动作-视频数据或可使用的无动作视频。
    - 一些工作显式注入物理或记忆一致性目标，另一些依赖生成视频损失和潜在重建，没有报告物理或长期记忆监督。
    开放问题:
    - 驾驶世界模型在数据集验证和零样本预测上的提升能否迁移到闭环安全和实际运营结果？
    - 面向机器人的世界模型能否泛化到已见原语组合之外，并从仿真迁移到真实机器人执行？
    - 一致性基准分数与下游策略成功或部署可靠性之间的一致性如何？
    - 在开放域交互环境中，世界模型应如何处理长时域记忆一致性和动作空间变化？
    - 哪些假设（如可观测上下文、成对动作或解析器定义的原语）限制了部署，未来方法如何放宽？
