    persistence and causal reasoning? How to unify functional evaluation across diverse
    tasks?'
  related_work_outline_zh:
  - 主流方向：构建以动作为条件的视频扩散模型作为具身控制的世界模型，侧重视觉预测以支持策略学习、规划和仿真。
  - 研究共性：使用基于Transformer的扩散架构，以机器人动作为条件，通过视频质量与任务相关指标评估；越来越强调物理合理性和任务对齐。
  - 关键差异：动作注入机制（独立时间步、帧级模块、学习掩码、并行上下文块）、对齐策略（人类偏好奖励、DPO）以及是否依赖预训练视频模型。
  - 趋势演进：2024-2026年快速增长，模型扩至14B参数，从单纯视觉保真度转向功能基准和物理一致性；理论分类法出现但与实证设计脱节。
  - 开放问题：当前世界模型是否满足形式化定义与假设？缩放定律如何作用于功能表现？能否实现长期持久性和因果推理？如何统一不同任务的功能评估？
  literature_review:
    line_of_work_matrix:
    - line: Conceptual taxonomy and theoretical framing
      what_it_solves: Bridges video generation and world model concepts by proposing
        state-construction and dynamics-modeling taxonomies, and advocates for functional
        benchmarks over visual fidelity.
      what_remains_open: Whether the taxonomy influences actual model design or evaluation;
        lacks formal validation of assumptions and guarantees.
    - line: Action-conditioned video world model architectures
      what_it_solves: Enables video generation models to serve as world models for
        embodied tasks by conditioning on actions, supporting policy learning, planning,
        and simulation.
      what_remains_open: Absence of formal definitions of state and dynamics; no guarantees
        on long-horizon persistence or causal reasoning; evaluation still dominated
        by visual quality, with limited functional benchmarks.
    - line: Physical and task alignment via reward and preference optimization
      what_it_solves: Improves physical plausibility, task logic, and visual quality
        of generated rollouts using human-preference-based reward models or DPO post-training.
      what_remains_open: Reward models rely on subjective human preferences, costly
        to scale; generalization beyond contact-rich manipulation is unverified; no
        unified physical consistency metric.
    - line: Test-time verification and spatial reasoning with world models
      what_it_solves: Examines the effectiveness of world models for spatial reasoning
        and reveals pitfalls in heuristic verifiers; proposes ViSA to ground rewards
        in frame-anchored assertions.
      what_remains_open: Information bottleneck prevents scaling on complex benchmarks
        like MMSI-Bench; verifier design is tightly coupled to specific world model
        architectures; no general solution for reliable test-time rewards.
    consensus:
    - Video diffusion models can be adapted as world models when conditioned on actions,
      but require additional mechanisms beyond standard video generation.
    - Evaluation must move beyond visual fidelity to include functional metrics such
      as task success, physical consistency, and trajectory accuracy.
    - Physical plausibility is a critical challenge; current models often produce
      physically inconsistent rollouts.
    - Action-labeled datasets are essential for training, with limited exploitation
      of action-free video data.
    disagreements:
    - 'Action conditioning mechanisms vary: independent diffusion timesteps, frame-level
      modules, learned masks modifying pretrained model intermediates, and parallel
      context blocks.'
    - 'Alignment strategies differ: some use human-preference-based hierarchical reward
      models with RL, others use DPO with decoupled discriminators, while many rely
      solely on supervised reconstruction.'
    - 'Evaluation protocols diverge: some use existing benchmarks like PBench, others
      introduce new zero-shot benchmarks (EZSbench) or spatial reasoning suites (SAT-Real,
      MMSI-Bench).'
    - 'Dependence on pretrained video models: AVID adapts a closed-source pretrained
      model, while others train world models from scratch on domain-specific data.'
    open_questions:
    - Do current world model implementations satisfy formal assumptions (e.g., Markov
      property, state abstraction) required for planning and control?
    - How do scaling laws apply to world model functional performance, and what are
      the trade-offs between model size, data, and long-horizon consistency?
    - Can we design a unified functional benchmark that assesses persistence, causal
      reasoning, and physical plausibility across diverse embodied tasks?
    - What architectural changes can overcome the information bottleneck observed
      in spatial reasoning tasks where no verifier achieves consistent scaling?
    - How can physical alignment methods be generalized beyond contact-rich manipulation
      without relying on expensive human preference data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 概念分类与理论框架
      解决的问题: 通过提出状态构建和动态建模分类法，桥接视频生成与世界模型概念，倡导功能基准替代视觉保真度。
      尚未覆盖: 分类法是否影响实际模型设计或评估；缺乏形式化假设和保证的验证。
    - 路线: 动作条件化视频世界模型架构
      解决的问题: 通过动作条件化使视频生成模型充当具身任务的世界模型，支持策略学习、规划和仿真。
      尚未覆盖: 缺乏状态和动态的形式化定义；长期持久性和因果推理无保证；评估仍以视觉质量为主，功能基准有限。
    - 路线: 通过奖励与偏好优化实现物理和任务对齐
      解决的问题: 利用基于人类偏好的奖励模型或DPO后训练，提升生成轨迹的物理合理性、任务逻辑和视觉质量。
      尚未覆盖: 奖励模型依赖主观人类偏好，扩展成本高；泛化至非接触丰富操作未知；缺乏统一的物理一致性度量。
    - 路线: 世界模型的测试时验证与空间推理
      解决的问题: 审视世界模型在空间推理中的有效性，揭示启发式验证器的缺陷，提出ViSA将奖励锚定于帧级断言。
      尚未覆盖: 信息瓶颈导致在MMSI-Bench等复杂基准上无法缩放；验证器设计与特定世界模型架构紧耦合；缺少可靠的通用测试时奖励方案。
    共识:
    - 视频扩散模型在动作条件化后可适配为世界模型，但需要超越标准视频生成的额外机制。
    - 评估必须超越视觉保真度，纳入任务成功率、物理一致性和轨迹准确性等功能指标。
    - 物理合理性是关键挑战，当前模型常产生物理不一致的预测。
    - 训练依赖动作标注数据集，缺乏对无动作视频数据的有效利用。
    分歧:
    - 动作条件化机制不同：独立扩散时间步、帧级模块、修改预训练模型中间输出的学习掩码、并行上下文块。
    - 对齐策略差异：基于人类偏好的分层奖励模型加RL，使用解耦判别器的DPO，或仅依赖监督重建。
    - 评估协议分歧：使用现有基准如PBench，或引入新零样本基准EZSbench，或空间推理套件SAT-Real、MMSI-Bench。
    - 对预训练视频模型的依赖：AVID适配闭源预训练模型，其他方法在领域数据上从头训练世界模型。
