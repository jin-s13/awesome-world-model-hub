  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models built with
    diffusion or transformer backbones for video-conditioned control, especially in
    driving and robotics, rather than small model-based RL dynamics.'
  - 'Shared research pattern: Papers couple learned dynamics with generation or prediction
    objectives and evaluate via visual fidelity, downstream policy learning, episodic
    control, or consistency metrics.'
  - 'Key differences: Supervision varies across RL returns, self-supervised reconstruction,
    language-conditioned video generation, physics-informed auxiliary tasks, and unified
    action-video diffusion; action interfaces and evaluation domains differ accordingly.'
  - 'Trend evolution: Within the available 2023-2026 frontier, the field is moving
    from efficient stochastic RL world models toward larger, multimodal, physics-aware,
    and benchmarked embodied world models.'
  - 'Open questions: Long-horizon memory, spatial consistency, cross-action generalization,
    context or primitive assumptions, and whether reported gains isolate the model
    from the surrounding system remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期研究集中在以扩散或Transformer为主的生成式世界模型，用于驾驶和机器人等具身场景的视频条件控制，而非仅面向小规模模型化强化学习动力学。
  - 研究共性：论文通常把学习到的动力学与生成或预测目标耦合，并通过视觉保真度、下游策略、回合控制或一致性指标来评估。
  - 关键差异：监督信号涵盖强化学习回报、自监督重建、语言条件视频生成、物理信息辅助任务以及视频-动作统一扩散；动作接口和评测域也随之不同。
  - 趋势演进：在现有2023-2026前沿证据内，领域正从高效随机强化学习世界模型走向大规模、多模态、物理感知且有基准评测的具身世界模型。
  - 开放问题：长时记忆、空间一致性、跨动作空间泛化、上下文或原语假设，以及报告增益是否隔离了模型本身而非周边系统，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Structured generative video world models with mask, physics, or VAE objectives
      what_it_solves: Turns world-model ideas into concrete video prediction models
        for long-horizon, multi-view, or physically plausible rollouts.
      what_remains_open: Whether gains come from the representation, auxiliary loss,
        or pretraining data mix; several papers leave limitation evidence missing,
        creating a verification gap.
    - line: Action-conditional and planning-oriented world models
      what_it_solves: Connects learned dynamics to intervention through context, language
        primitives, or diffusion timesteps for policy learning and control.
      what_remains_open: Assumptions such as observable context, known primitive vocabulary,
        or action-video pairing are not fully tested; model contribution versus planner
        or task prior is not isolated.
    - line: World-model evaluation and benchmark protocols
      what_it_solves: Measures spatial consistency, memory consistency, action control,
        and downstream utility of world models.
      what_remains_open: No shared cross-domain metric is evident; one benchmark reports
        no experimental results, and current benchmarks reveal model weaknesses without
        isolating method contribution.
    consensus:
    - Transformer and diffusion backbones are becoming the default substrate for learned
      world models.
    - World models are evaluated not only by reconstruction quality but also by downstream
      control, policy learning, or temporal and spatial consistency.
    - Action conditioning, whether explicit or learned from video, is central to making
      world models usable for decision making.
    disagreements:
    - Some methods use self-supervised generative video objectives, while others retain
      model-based RL losses or add physics-informed auxiliary tasks.
    - Action interfaces differ across language-primitive decomposition, unified action-video
      diffusion, context-conditioned latent dynamics, and action-free video pretraining.
    - Evaluation targets span Atari, contextual reinforcement learning, robot manipulation,
      driving, and Minecraft; no unified benchmark appears in the evidence.
    - Assumptions differ on whether context is observable, whether primitive vocabularies
      are known, whether paired action-video data is available, and whether physics
      priors are needed.
    open_questions:
    - To what extent do mask reconstruction, physics auxiliary tasks, or unified action-video
      objectives transfer beyond the reported datasets and domains?
    - Can current world models maintain long-horizon memory and spatial consistency
      when actions or viewpoints change across environments?
    - Which reported improvements should be attributed to the world model itself versus
      the policy, planner, data scale, implementation, or evaluation setting?
    - How should benchmarks handle missing limitation details and no-result dataset
      papers to support reproducible method comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 结构化生成视频世界模型（掩码、物理或VAE目标）
      解决的问题: 将世界模型思想转化为面向长时域、多视角或物理合理推演的视频预测模型。
      尚未覆盖: 增益来自表示、辅助损失还是预训练数据混合尚不明确；部分论文缺失局限性说明，形成验证缺口。
    - 路线: 动作条件与规划导向世界模型
      解决的问题: 通过上下文、语言原语或扩散时间步连接动力学与干预，用于策略学习和控制。
      尚未覆盖: 上下文可观测、原语词汇已知、动作-视频配对等假设未被充分检验；模型与规划器或任务先验的贡献未隔离。
    - 路线: 世界模型评测与基准协议
      解决的问题: 衡量空间一致性、记忆一致性、动作控制和下游任务效用。
      尚未覆盖: 证据中缺少统一跨域指标；个别基准未报告实验结果；现有基准揭示模型缺陷但未隔离方法贡献。
    共识:
    - Transformer和扩散主干正成为学习世界模型的主要载体。
    - 世界模型不仅用重建质量评估，也通过下游控制、策略学习或时空一致性评估。
    - 显式或从视频学习的动作条件，是让世界模型用于决策的关键。
    分歧:
    - 监督目标不同：自监督视频生成、模型化强化学习损失和物理信息辅助任务并存。
    - 动作接口不同：语言原语分解、统一动作-视频扩散、上下文条件潜在动力学和无关动作的视频预训练并存。
    - 评测域不同：覆盖Atari、上下文强化学习、机器人操作、驾驶和Minecraft，证据中没有统一基准。
    - 关键假设不同：上下文是否可观测、原语词汇是否已知、是否有配对动作-视频数据、是否需要物理先验。
    开放问题:
    - 掩码重建、物理辅助任务或统一动作-视频目标在报告的数据集和领域之外还能迁移多少？
    - 当前世界模型能否在动作或视角变化时维持长时记忆与空间一致性？
    - 报告改进中，多少应归因于世界模型本身，多少来自策略、规划器、数据规模、实现或评测设置？
    - 基准如何在不惩罚缺失局限性说明和无结果数据集论文的前提下，支撑可复现的方法比较？
