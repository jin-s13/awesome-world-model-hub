  related_work_outline:
  - 'Mainstream direction: World models are shifting from latent dynamics for RL to
    large-scale video generation with diffusion and transformer architectures, conditioning
    on actions and language for planning and control.'
  - 'Shared research pattern: Most works learn a forward dynamics model through self-supervised
    reconstruction or prediction, then use it for policy optimization, video planning,
    or benchmarking.'
  - 'Key differences: Representations vary from latent state-space models to pixel-space
    video diffusion; supervision ranges from pure reconstruction to physics-informed
    and spatial-consistency losses; action interfaces differ between conditional input
    and joint action-video diffusion.'
  - 'Trend evolution: Early work (2015-2020) focused on compact latent dynamics in
    toy domains, while recent papers (2023-2026) scale to open-world videos, robotics,
    and driving, with growing emphasis on compositionality, physical plausibility,
    and benchmark-driven evaluation.'
  - 'Open questions: How to build unified evaluation protocols that capture long-term
    memory, spatial consistency, and physical fidelity; whether gains originate from
    world model design or planner/controller; and how to transfer these methods to
    unseen dynamics without task-specific priors.'
  related_work_outline_zh:
  - 主流方向：世界模型正从用于强化学习的潜在动力学转向大规模视频生成，采用扩散模型和Transformer架构，并以动作和语言为条件实现规划与控制。
  - 研究共性：多数工作通过自监督重建或预测学习前向动力学模型，然后将其用于策略优化、视频规划或基准测试。
  - 关键差异：表示形式从潜在状态空间模型到像素空间视频扩散各不相同；监督信号涵盖纯重建、物理信息驱动和空间一致性损失；动作接口存在条件输入与联合动作-视频扩散之分。
  - 趋势演进：早期工作（2015-2020）聚焦于玩具领域的紧凑潜在动力学，近期论文（2023-2026）扩展至开放世界视频、机器人和自动驾驶，并日益强调组合性、物理合理性和以基准驱动的评估。
  - 开放问题：如何构建统一的评估协议以捕捉长期记忆、空间一致性和物理保真度；性能提升是源于世界模型设计还是规划器/控制器；以及如何在没有任务特定先验的情况下将这些方法迁移到未见动态环境。
  literature_review:
    line_of_work_matrix:
    - line: Latent dynamics world models for model-based RL
      what_it_solves: Sample-efficient policy learning by modeling environment transitions
        in a compact latent space, used to generate imagined rollouts for training.
      what_remains_open: Cross-domain generalization, scalability to complex visual
        scenes, and disentanglement of dynamics from task-specific context.
    - line: Video generation world models with action conditioning
      what_it_solves: High-fidelity future frame prediction from multimodal inputs
        (actions, language) supporting planning, policy learning, and visual imagination
        in robotics and driving.
      what_remains_open: Ensuring long-term temporal consistency, physical plausibility
        beyond appearance, and separation of model contribution from controller gains.
    - line: Benchmarks and evaluation protocols for world model capabilities
      what_it_solves: Targeted assessment of spatial consistency, memory, and action
        controllability that pixel-level metrics miss, providing standardized comparisons.
      what_remains_open: Coverage of all world model desiderata (e.g., physical interaction,
        generalization to novel dynamics) and adoption as community-wide standards.
    consensus:
    - World models must capture environment dynamics and support action-conditioned
      prediction, either through latent imagination or video generation.
    - Diffusion and transformer backbones are becoming the dominant architectures
      for capturing complex, high-dimensional transitions.
    - Pretraining on large-scale, diverse video datasets (e.g., driving, robotics,
      Minecraft) improves generalization and visual quality over training from scratch
      in a single environment.
    - Explicit separation of static context and dynamic state aids generalization
      to unseen situations, as seen in contextual and compositional models.
    disagreements:
    - 'Representation level: Some works operate in a compressed latent state space
      (e.g., RSSM, VAE) while others generate full RGB videos, trading off compactness
      versus visual fidelity and interpretability.'
    - 'Supervision signal: Approaches differ in whether they inject explicit physics
      knowledge (depth, keypoints), enforce spatial consistency via scene graphs,
      or rely purely on pixel reconstruction loss.'
    - 'Action interface: Models either treat actions as a conditioning input to the
      video generator, or couple action and video diffusion in a unified framework,
      affecting how planning and policy are derived.'
    - 'Evaluation target: Methods are validated on downstream task performance (RL
      returns, imitation success), visual quality metrics (FVD, FID), or custom consistency
      scores (SGCS, memory tests), without a shared gold standard.'
    open_questions:
    - To what extent do reported improvements come from the world model architecture
      versus the planning algorithm, reward design, or implementation details, given
      the lack of systematic ablation studies?
    - Can a single world model satisfy the conflicting requirements of high visual
      fidelity, long-term physical consistency, and real-time controllability for
      closed-loop robotics?
    - How should the community define and measure 'memory' and 'action control' in
      open-domain settings, and what benchmarks are needed to replace proxy metrics
      that correlate poorly with real-world deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 用于基于模型的强化学习的潜在动力学世界模型
      解决的问题: 通过在紧凑的潜在空间中建模环境过渡，实现样本高效的策略学习，生成想象轨迹用于训练。
      尚未覆盖: 跨领域泛化能力、对复杂视觉场景的扩展性，以及将动力学与任务特定上下文解耦。
    - 路线: 具有动作条件的视频生成世界模型
      解决的问题: 从多模态输入（动作、语言）生成高保真未来帧，支持机器人和自动驾驶中的规划、策略学习和视觉想象。
      尚未覆盖: 确保长期时间一致性、超越外观的物理合理性，以及分离模型贡献与控制器增益。
    - 路线: 世界模型能力的基准与评估协议
      解决的问题: 针对像素级指标无法捕捉的空间一致性、记忆和动作可控性进行定向评估，提供标准化比较。
      尚未覆盖: 覆盖所有世界模型期望（如物理交互、对新颖动态的泛化），并被社区广泛采用为标准。
    共识:
    - 世界模型必须捕捉环境动力学并支持动作条件预测，无论是通过潜在想象还是视频生成。
    - 扩散模型和Transformer正在成为捕捉复杂、高维过渡的主流架构。
    - 在大规模多样视频数据集（如驾驶、机器人、Minecraft）上预训练，比在单一环境中从头训练更能提升泛化能力和视觉质量。
    - 显式分离静态上下文与动态状态有助于泛化到未见情境，如上下文模型和组合模型所示。
    分歧:
    - 表示层面：部分工作在压缩的潜在状态空间（如RSSM、VAE）中操作，其他则生成完整RGB视频，在紧凑性与视觉保真度及可解释性之间进行权衡。
    - 监督信号：方法在是否注入显式物理知识（深度、关键点）、通过场景图强制空间一致性，还是仅依赖像素重建损失方面存在差异。
    - 动作接口：模型将动作作为视频生成器的条件输入，或在一个统一框架中耦合动作与视频扩散，影响规划和策略的导出方式。
    - 评估目标：方法通过下游任务性能（RL回报、模仿成功率）、视觉质量指标（FVD、FID）或自定义一致性分数（SGCS、记忆测试）进行验证，缺乏共享的黄金标准。
    开放问题:
    - 考虑到缺乏系统性消融研究，报告的性能提升在多大程度上来自世界模型架构，而非规划算法、奖励设计或实现细节？
    - 单一世界模型能否同时满足高视觉保真度、长期物理一致性和现实世界闭环机器人所需的实时可控性这些相互冲突的要求？
    - 社区应如何定义和衡量开放领域环境中的“记忆”和“动作控制”，并需要哪些基准来替代那些与真实部署相关性差的代理指标？
