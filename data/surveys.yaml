  related_work_outline:
  - 'Mainstream direction: Evaluation is moving from aggregate sample-efficiency scores
    toward targeted, action-conditioned consistency checks for learned dynamics models
    in driving, robotics, and game environments.'
  - 'Shared research pattern: Evidence pairs fixed evaluation suites with standardized
    metrics and shared baselines, while treating open datasets and code as key reproducibility
    artifacts.'
  - 'Key differences: Evaluation targets diverge across visual fidelity, scene-graph
    spatial consistency, long-term memory, action control, physical plausibility,
    and zero-shot policy generalization; supervision and interaction assumptions also
    differ.'
  - 'Trend evolution: Within the 2023-2026 frontier, early Atari-centric sample-efficiency
    reporting is being supplemented by embodied, multi-view, long-horizon, and physics-informed
    benchmarks.'
  - 'Open questions: Whether proxy benchmarks align with downstream decisions, cover
    deployment distribution shifts, remain stable across implementations and compute
    budgets, and transfer to unseen dynamics.'
  related_work_outline_zh:
  - 主流方向：评估正从聚合式样本效率得分转向对驾驶、机器人和游戏环境中学习动力学模型进行针对性、动作条件下的持续性检查。
  - 研究共性：证据通常将固定评估套件与标准化指标和共享基线配对，并强调开放数据集与代码作为可复现工件。
  - 关键差异：评测目标在像素/视觉保真度、场景图空间一致性、长期记忆、动作控制、物理合理性与零样本策略泛化之间分化；监督与交互假设也不同。
  - 趋势演进：在2023-2026前沿窗口内，早期以Atari为中心的样本效率报告正被具身、多视角、长时域和物理信息基准补充。
  - 开放问题：代理基准是否与下游决策对齐、是否覆盖部署分布偏移、在不同实现和算力预算下是否稳定、以及能否迁移到未见动态。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned tasks and datasets for evaluating
        spatial consistency, memory, and action control in dynamic environments.
      what_remains_open: Whether curated navigation loops and action spaces cover
        the deployment distribution and long-horizon settings where learned dynamics
        are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes scene-graph consistency, memory/action control, physical
        plausibility, and zero-shot generalization beyond aggregate task scores.
      what_remains_open: Alignment between these proxy metrics and downstream policy
        or control objectives, especially for unseen dynamics and cross-viewpoint
        generalization.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through fixed benchmark suites, shared
        baselines, open datasets, and reported training and compute signals.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and dataset-specific tuning.
    consensus:
    - Shared benchmark tasks and fixed metrics are treated as necessary for comparing
      learned dynamics models rather than isolated qualitative demonstrations.
    - Action-conditioned evaluation is increasingly central, with evidence covering
      loop navigation, shared action spaces, and long-horizon rollout.
    - Open datasets, code, and standardized benchmark splits appear repeatedly as
      reproducibility signals.
    disagreements:
    - 'Evaluation target differs: robot/driving video generation emphasizes pixel-level
      visual fidelity and physical plausibility, while other work targets scene-graph/memory/action
      consistency or aggregate task return and zero-shot policy generalization.'
    - 'Interaction and supervision assumptions differ: some work assumes observable
      context values or shared action spaces, while other work targets open-domain,
      multi-view, or action-free pretraining.'
    - 'Representation choices differ: discrete or continuous latent dynamics, video
      diffusion, and joint action-video diffusion stress different evaluation criteria,
      making direct comparison difficult.'
    open_questions:
    - Do spatial, memory, and action consistency metrics correlate with downstream
      control or driving policy quality?
    - Can benchmarks cover distribution shifts from curated Minecraft loops or CARL
      tasks to real-world driving and robot deployments?
    - Are current conclusions stable across implementation variations and compute
      budgets when fixed suites are reused?
    - How should evaluation handle unobservable context, action-free data, or multi-view
      long-horizon rollouts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的动作条件任务和数据集，用于评估动态环境中的空间一致性、记忆和动作控制。
      尚未覆盖: 策划的导航循环和动作空间是否覆盖部署分布以及学习动态预期发挥作用的长期设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合任务得分之外，考察场景图一致性、记忆/动作控制、物理合理性和零样本泛化。
      尚未覆盖: 这些代理指标与下游策略或控制目标之间的对齐，尤其是未见动态和跨视角泛化。
    - 路线: 可比基线与报告规范
      解决的问题: 通过固定基准套件、共享基线、开放数据集和报告的训练与计算信号使结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和数据集特定调参下是否保持稳定。
    共识:
    - 共享基准任务和固定指标被视为比较学习动态模型的必要条件，而非孤立的定性演示。
    - 动作条件下的评估日益成为核心，证据涵盖循环导航、共享动作空间和长时域展开。
    - 开放数据集、代码和标准化基准划分等可复现信号在证据中反复出现。
    分歧:
    - 评测目标不同：机器人/驾驶视频生成重视像素级视觉保真度与物理合理性，另有工作侧重场景图/记忆/动作一致性，还有工作关注聚合任务回报和零样本策略泛化。
    - 交互与监督假设不同：部分工作假设上下文值可观测或共享动作空间，其他工作面向开放域、多视角或无动作预训练。
    - 表示方式不同：离散或连续潜变量动态、视频扩散以及动作-视频联合扩散强调不同的评测标准，难以直接比较。
    开放问题:
    - 空间/记忆/动作一致性指标是否与下游控制或驾驶策略质量相关？
    - 基准能否覆盖从策划的Minecraft循环或CARL任务到真实驾驶和机器人部署的分布偏移？
    - 固定套件被复用时，当前结论在不同实现和算力预算下是否稳定？
    - 评估应如何处理不可观测上下文、无动作数据或多视角长时域展开？
