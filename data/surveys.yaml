  related_work_outline:
  - 'Mainstream direction: Designing world models as generative video predictors,
    often using diffusion transformers or state-space models, and simultaneously learning
    dynamics and policies for robotics and autonomous driving.'
  - 'Shared research pattern: Self-supervised or generative training on visual-action
    sequences, with strong emphasis on zero-shot, compositional, or long-horizon generalization.'
  - 'Key differences: Model representations range from explicit latent state-space
    (cRSSM) to implicit diffusion (MaskGWM, UWM); supervision signals may include
    physics priors, action coupling, or pure video reconstruction; evaluation targets
    span pixel-level fidelity, physical plausibility, memory consistency, and task
    success.'
  - 'Trend evolution: Starting from efficient stochastic world models for Atari (2023),
    moving to context-aware and compositional models (2024), then to physics-informed,
    unified video-action diffusion, and large-scale pretraining (2025), with new benchmarks
    for memory and action control emerging (2026).'
  - 'Open questions: Can long-term memory consistency be maintained in open domains?
    How do physics-informed models scale to unseen objects? What is the causal link
    between video generation quality and downstream policy robustness?'
  related_work_outline_zh:
  - 主流方向：将世界模型构建为生成式视频预测器，常用扩散Transformer或状态空间模型，并同时学习动力学和策略，用于机器人和自动驾驶。
  - 研究共性：对视觉-动作序列进行自监督或生成式训练，高度关注零样本、组合或长时域泛化。
  - 关键差异：模型表示从显式潜在状态空间（cRSSM）到隐式扩散（MaskGWM、UWM）；监督信号可包含物理先验、动作耦合或纯视频重建；评测目标涵盖像素级保真度、物理合理性、记忆一致性和任务成功率。
  - 趋势演进：从2023年Atari上的高效随机世界模型开始，到2024年的上下文感知和组合模型，再到2025年的物理信息嵌入、统一视频-动作扩散和大规模预训练，以及2026年出现的记忆与动作控制新基准。
  - 开放问题：开放域中能否维持长期记忆一致性？物理信息模型如何泛化到未见物体？视频生成质量与下游策略鲁棒性之间的因果联系是什么？
  literature_review:
    line_of_work_matrix:
    - line: Efficient stochastic world model architectures
      what_it_solves: Learning effective world models under limited interaction budgets,
        enabling fast policy improvement on visual control tasks.
      what_remains_open: Scalability to high-resolution, real-world robotics; whether
        the gain persists without lookahead search; transfer to long-horizon tasks.
    - line: Contextual world models for dynamics generalization
      what_it_solves: Zero-shot generalization to varying dynamics by conditioning
        latent state inference and dynamics on observable context variables.
      what_remains_open: Assumes context observability; validation limited to few
        tasks; unverified on partially observable or truly novel dynamics.
    - line: Compositional world models from language
      what_it_solves: Compositional generalization to unseen object–action combinations
        by factorizing video generation via language primitives.
      what_remains_open: Depends on predefined primitive sets; real-robot execution
        not demonstrated; generalization to entirely novel primitives unsupported.
    - line: Physics-informed world models
      what_it_solves: Improving physical plausibility of generated videos by jointly
        learning depth prediction and keypoint dynamics.
      what_remains_open: Physics knowledge may not transfer to unseen object categories;
        evaluation limited to visual fidelity, not downstream task success.
    - line: Unified video-action diffusion pretraining
      what_it_solves: Learning general-purpose robotic policies and dynamics from
        large-scale multitask data by coupling video and action diffusion in one transformer.
      what_remains_open: Trade-off between modality coupling and independent control;
        computational cost of large-scale pretraining; closed-loop deployment robustness
        not fully characterized.
    - line: Masked reconstruction for driving world models
      what_it_solves: Long-horizon, multi-view video prediction for autonomous driving
        by combining diffusion transformers with MAE-style mask learning.
      what_remains_open: Causal connection to real driving decisions; long-horizon
        consistency beyond visual similarity; zero-shot transfer across sensor configurations.
    - line: Benchmarks for spatial, memory, and action consistency
      what_it_solves: Providing standardized evaluation of world models' ability to
        maintain spatial consistency and respond to actions across diverse scenes.
      what_remains_open: Benchmarks are static; gap between benchmark scores and real-world
        closed-loop performance; coverage of complex dynamics and long-term memory.
    consensus:
    - World models are predominantly trained as generative video predictors with self-supervised
      objectives.
    - Transformer and diffusion-based backbones are the dominant architectural choices.
    - Generalization—whether zero-shot, compositional, or long-horizon—is a shared
      goal across methods.
    - There is a growing recognition that pure pixel-level metrics are insufficient,
      motivating physics-informed and consistency-oriented evaluation.
    disagreements:
    - 'Representation: explicit latent state-space models (e.g., cRSSM) versus implicit
      diffusion-based video generation (e.g., MaskGWM, UWM).'
    - 'Supervision: pure video reconstruction versus joint learning of physical properties
      (depth, keypoints) or action prediction.'
    - 'Coupling: whether to tightly integrate action and video within a single model
      (UWM) or keep them separate (RoboDreamer).'
    - 'Evaluation target: task success in Atari/RL versus pixel-level visual quality
      versus physical plausibility versus memory consistency.'
    - 'Deployment setting: short-horizon game-like environments versus long-horizon
      driving and multi-task robotic manipulation.'
    open_questions:
    - Can physics-informed world models maintain physical plausibility for objects
      and dynamics never seen during training?
    - Does large-scale video-action pretraining produce policies that are more robust
      than imitation learning in closed-loop deployment?
    - How can long-term memory consistency be explicitly enforced without sacrificing
      generation quality?
    - What is the minimal supervision required for compositional generalization to
      truly novel primitives beyond the training distribution?
    - How do benchmark scores on spatial and action consistency translate to real-world
      robot task performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 高效随机世界模型架构
      解决的问题: 在有限交互预算下学习有效世界模型，加速视觉控制任务的策略改进。
      尚未覆盖: 对高分辨率真实机器人场景的可扩展性；无前瞻搜索时增益是否持续；长时域任务迁移。
    - 路线: 面向动力学泛化的上下文世界模型
      解决的问题: 通过将潜在状态推断和动力学条件化于可观测上下文变量，实现对变化动力学的零样本泛化。
      尚未覆盖: 假设上下文可观测；验证仅限于少量任务；在部分可观测或全新动力学下未经验证。
    - 路线: 基于语言的组合世界模型
      解决的问题: 通过语言原语分解视频生成，实现对未见物体-动作组合的组合泛化。
      尚未覆盖: 依赖预定义原语集；未展示真实机器人执行；不支持全新原语的泛化。
    - 路线: 物理信息驱动的世界模型
      解决的问题: 通过联合学习深度预测和关键点动力学，提高生成视频的物理合理性。
      尚未覆盖: 物理知识可能无法迁移到未见物体类别；评估仅限于视觉保真度，非下游任务成功率。
    - 路线: 统一视频-动作扩散预训练
      解决的问题: 通过在一个Transformer中耦合视频和动作扩散，从大规模多任务数据中学习通用机器人策略和动力学。
      尚未覆盖: 模态耦合与独立控制之间的权衡；大规模预训练的计算成本；闭环部署的鲁棒性未充分表征。
    - 路线: 面向驾驶的掩码重建世界模型
      解决的问题: 通过结合扩散Transformer与MAE式掩码学习，实现自动驾驶的长时域多视角视频预测。
      尚未覆盖: 与真实驾驶决策的因果联系；超越视觉相似性的长时域一致性；跨传感器配置的零样本迁移。
    - 路线: 空间、记忆与动作一致性基准
      解决的问题: 提供标准化评估，衡量世界模型在多样化场景中维持空间一致性并响应动作的能力。
      尚未覆盖: 基准是静态的；基准分数与真实世界闭环性能之间存在差距；复杂动力学和长期记忆的覆盖不足。
    共识:
    - 世界模型主要被训练为生成式视频预测器，采用自监督目标。
    - Transformer和基于扩散的骨干网络是主要架构选择。
    - 泛化——无论是零样本、组合还是长时域——是各方法的共同目标。
    - 人们越来越认识到纯像素级指标不足，由此推动了物理信息驱动和一致性导向的评估。
    分歧:
    - 表示方式：显式潜在状态空间模型（如cRSSM）与隐式扩散视频生成（如MaskGWM、UWM）。
    - 监督信号：纯视频重建与联合学习物理属性（深度、关键点）或动作预测。
    - 耦合方式：将动作和视频紧密集成在单一模型中（UWM）还是保持分离（RoboDreamer）。
    - 评测目标：Atari/RL中的任务成功率与像素级视觉质量、物理合理性、记忆一致性。
    - 部署场景：短时域游戏类环境与长时域驾驶和多任务机器人操作。
    开放问题:
    - 物理信息世界模型能否在训练中未见过的物体和动力学上保持物理合理性？
    - 大规模视频-动作预训练产生的策略在闭环部署中是否比模仿学习更具鲁棒性？
    - 如何在不牺牲生成质量的情况下显式地强制长期记忆一致性？
    - 实现分布外全新原语组合泛化所需的最低监督是什么？
    - 空间和动作一致性基准分数如何转化为真实世界机器人任务性能？
