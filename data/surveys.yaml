  related_work_outline:
  - 'Mainstream direction: Building video generative world models as interactive simulators
    for autonomous driving, robotics, and games, with emphasis on action controllability,
    physical plausibility, and real-time serving.'
  - 'Shared research pattern: Extending pretrained video generators or recurrent state-space
    models with action-conditioned modules, training on large-scale trajectory-annotated
    datasets, and validating on domain-specific benchmarks.'
  - 'Key differences: Domains and input modalities diverge (autonomous driving multi-camera,
    Minecraft egocentric, robotic manipulation), supervision signals range from explicit
    trajectories to physics constraints, and evaluation targets either spatial consistency,
    action fidelity, or visual quality.'
  - 'Trend evolution: Within the 2024–2026 frontier, the shift is from open-loop generation
    toward closed-loop, frame-autoregressive systems with low latency, while benchmarks
    like ACT-Bench and LoopNav formalize the evaluation of world models as simulators.'
  - 'Open questions: How to maintain long-horizon temporal consistency and cross-view
    coherence under autoregressive rollout; trade-offs between lightweight action
    adapters and specialized architectures; and the absence of standardized benchmarks
    across diverse embodiments.'
  related_work_outline_zh:
  - 主流方向：将视频生成式世界模型构建为面向自动驾驶、机器人和游戏的交互式模拟器，重点关注动作可控性、物理合理性和实时服务。
  - 研究共性：在预训练视频生成器或循环状态空间模型上添加动作条件模块，利用大规模轨迹标注数据集训练，并在特定领域基准上验证。
  - 关键差异：领域和输入模态不同（自动驾驶多相机、Minecraft第一人称、机器人操作），监督信号包括显式轨迹、物理约束等，评估目标分为空间一致性、动作保真度或视觉质量。
  - 趋势演进：在2024–2026年前沿中，从开环生成转向闭环、帧级自回归低延迟系统，同时ACT-Bench和LoopNav等基准将世界模型作为模拟器的评估形式化。
  - 开放问题：如何在自回归推演下保持长时域一致性和跨视图连贯性；轻量级动作适配器与专用架构之间的权衡；以及在不同具身环境中缺乏标准化基准。
  literature_review:
    line_of_work_matrix:
    - line: Video-generative world models as driving simulators
      what_it_solves: Transforming diffusion or autoregressive video models into controllable,
        closed-loop simulators that generate future frames from driving actions, enabling
        model-based planning and evaluation without real-world deployment.
      what_remains_open: Generalization beyond the nuScenes dataset (e.g., different
        cities, weather, sensor layouts); long-horizon consistency over many minutes
        of driving; and real-time inference on resource-constrained hardware.
    - line: Context-aware and generic world model adaptation
      what_it_solves: Enabling world models (e.g., Dreamer, pretrained video generators)
        to adapt to varying dynamics or novel tasks via context conditioning or lightweight
        action modules, improving zero-shot generalization across domains.
      what_remains_open: Trade-off between dynamic fidelity and visual detail, reliance
        on observed context variables, and limited evaluation on only one or two tasks
        from specific benchmarks (CARL, games).
    - line: Physics-informed embodied world models
      what_it_solves: Incorporating temporal depth prediction and keypoint dynamics
        learning into video generation to produce physically plausible robotic videos,
        which can then be used for policy training or evaluation.
      what_remains_open: Validation on diverse robotic hardware and tasks beyond the
        presented scenarios; the closed-loop interaction quality when policies are
        trained solely on generated videos.
    - line: Benchmarks and evaluation frameworks for world model fidelity
      what_it_solves: Providing open-access datasets (LoopNav, ACT-Bench) and metrics
        (Scene Graph Consistency Score, action fidelity) to systematically measure
        spatial consistency, action controllability, and physical plausibility of
        world models.
      what_remains_open: Lack of unified benchmarks spanning multiple domains (driving,
        manipulation, navigation); metrics that correlate with downstream task performance
        are not yet established.
    consensus:
    - World models are shifting from passive video generation to interactive, action-conditioned
      simulators that can replace or augment real environment interactions.
    - Large-scale annotated datasets (e.g., nuScenes, Minecraft videos) are critical
      for training and evaluating world models, and open-source release of code and
      data is becoming standard.
    - Action controllability is a primary goal, achieved through conditioning on trajectory,
      command, or context, and evaluated by action fidelity or visual consistency.
    - Real-time or low-latency inference is a necessary requirement for closed-loop
      systems, leading to architectural optimizations like frame-autoregressive pipelines
      and lightweight adapters.
    disagreements:
    - 'Domains of application diverge: autonomous driving (multi-camera, structured
      roads) vs. robotics (manipulation, physics) vs. open-world navigation (Minecraft),
      each with distinct sensory input and action spaces.'
    - 'Supervision signals differ: some use explicit trajectory or action labels,
      others rely on physics priors (depth, keypoints), and still others use self-supervised
      or context variables.'
    - 'Evaluation targets vary: spatial consistency via scene graphs, action fidelity
      by comparing generated frames to ground-truth trajectories, visual quality via
      FID/FVD, and downstream task performance like policy success rate.'
    - Architectural choices range from diffusion transformers to recurrent state-space
      models, with some integrating pre-trained models and others training from scratch
      on domain-specific data.
    open_questions:
    - How can long-horizon memory and temporal consistency be maintained in autoregressive
      world models without mode collapse or drift?
    - What is the minimal set of evaluation metrics that reliably predicts the utility
      of a world model for downstream policy learning or planning?
    - Can the same world model architecture support both high-fidelity visual generation
      and fast, closed-loop control across multiple domains, or are domain-specific
      designs inevitable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成式世界模型作为驾驶模拟器
      解决的问题: 将扩散或自回归视频模型转化为可控闭环模拟器，根据驾驶动作生成未来帧，支持基于模型的规划与评估，避免真实部署风险。
      尚未覆盖: 在nuScenes之外的泛化（不同城市、天气、传感器布局）；长达数分钟驾驶的超长时域一致性；在资源受限硬件上的实时推理。
    - 路线: 上下文感知与通用世界模型适配
      解决的问题: 使世界模型（如Dreamer、预训练视频生成器）通过上下文条件或轻量动作模块适应变化的环境动态或新任务，提升跨领域零样本泛化。
      尚未覆盖: 动态保真度与视觉细节的权衡、对可观测上下文变量的依赖、仅在少量任务（CARL、游戏）上验证。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 在视频生成中融入时序深度预测和关键点动力学学习，产生物理合理的机器人视频，用于策略训练或评估。
      尚未覆盖: 在其他机器人硬件和任务上的验证；仅使用生成视频训练的策略在闭环交互中的表现。
    - 路线: 世界模型保真度的基准与评估框架
      解决的问题: 提供开放数据集（LoopNav、ACT-Bench）和指标（场景图一致性分数、动作保真度），系统衡量世界模型的空间一致性、动作可控性和物理合理性。
      尚未覆盖: 缺乏跨越驾驶、操控、导航等多领域的统一基准；与下游任务性能相关的指标尚未建立。
    共识:
    - 世界模型正从被动视频生成转向交互式、动作条件模拟器，能够替代或增强真实环境交互。
    - 大规模标注数据集（如nuScenes、Minecraft视频）对训练和评估世界模型至关重要，且代码与数据的开源发布正成为标准做法。
    - 动作可控性是首要目标，通过轨迹、命令或上下文条件实现，并以动作保真度或视觉一致性评估。
    - 实时或低延迟推理是闭环系统的必要条件，促使采用帧自回归流水线和轻量适配器等架构优化。
    分歧:
    - 应用领域不同：自动驾驶（多相机、结构化道路）vs 机器人（操控、物理）vs 开放世界导航（Minecraft），各自具有不同的感知输入和动作空间。
    - 监督信号差异：有的使用显式轨迹或动作标签，有的依赖物理先验（深度、关键点），还有的使用自监督或上下文变量。
    - 评估目标多样：基于场景图的空间一致性、通过比较生成帧与真实轨迹的动作保真度、FID/FVD等视觉质量指标，以及策略成功率等下游任务表现。
    - 架构选择范围从扩散Transformer到循环状态空间模型，部分集成预训练模型，部分在领域特定数据上从头训练。
    开放问题:
    - 如何在自回归世界模型中保持长时域记忆与时间一致性，避免模式崩塌或漂移？
    - 能够可靠预测世界模型对下游策略学习或规划效用的最小评估指标集是什么？
    - 同一世界模型架构能否同时支持高保真视觉生成和跨多领域的快速闭环控制，还是领域专用设计不可避免？
