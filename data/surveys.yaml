  related_work_outline:
  - 'Mainstream direction: World models are being applied to autonomous driving and
    robotics, using video generation and diffusion models to predict future observations
    and support policy learning.'
  - 'Shared research pattern: Diffusion Transformers and self-supervised learning
    on large-scale multimodal datasets are common, with world models used to generate
    imagined trajectories for planning.'
  - 'Key differences: Some works focus on pure video prediction (MaskGWM), others
    incorporate physics or 3D consistency (RoboScape), unify action and video diffusion
    (UWM), or evaluate memory and spatial consistency (LoopNav, MIND).'
  - 'Trend evolution: From 2023 Transformer-based Atari world models (STORM) to 2024–2025
    robotic and driving world models, and 2025–2026 dedicated benchmarks (LoopNav,
    MIND), the field is shifting from method development to capability diagnosis and
    real-world deployment.'
  - 'Open questions: Reliability in safety-critical real-world settings, long-term
    memory consistency, generalization across unseen tasks, and the absence of standardized
    real-world benchmarks remain open.'
  related_work_outline_zh:
  - 主流方向：世界模型正被应用于自动驾驶和机器人领域，通过视频生成和扩散模型预测未来观测并支持策略学习。
  - 研究共性：广泛采用扩散Transformer架构和自监督学习，在大规模多模态数据集上训练世界模型以生成想象轨迹用于规划。
  - 关键差异：部分工作专注纯视频预测（MaskGWM），部分引入物理或3D一致性（RoboScape），部分统一动作与视频扩散（UWM），还有基准工作评估记忆和空间一致性（LoopNav、MIND）。
  - 趋势演进：从2023年基于Transformer的Atari世界模型（STORM）到2024–2025年机器人和驾驶世界模型，再到2025–2026年专用基准（LoopNav、MIND），领域正从方法探索转向能力诊断和真实部署。
  - 开放问题：安全关键真实场景中的可靠性、长期记忆一致性、跨未见任务泛化以及缺乏标准化真实世界基准仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Generating multi-view, long-horizon video predictions for driving
        scenes to enable closed-loop simulation and policy evaluation.
      what_remains_open: Alignment between simulator fidelity and real-world safety
        outcomes; zero-shot transfer across different sensor setups and geographies
        is not verified.
    - line: Interactive agent and game world models
      what_it_solves: Learning efficient world models from limited interactions in
        RL environments (e.g., Atari, contextual control tasks) to improve sample
        efficiency and zero-shot generalization.
      what_remains_open: Generalization to entirely new tasks with different dynamics
        or reward structures; training on raw pixels still requires substantial compute.
    - line: Embodied robot world models
      what_it_solves: Generating video plans or learning dynamics models for robotic
        manipulation by conditioning on language, actions, and physical priors.
      what_remains_open: Real-world deployment beyond simulation; compositional generalization
        to novel object-action combinations and long-horizon tasks is limited.
    - line: World model evaluation benchmarks
      what_it_solves: Providing datasets and metrics to quantify spatial consistency,
        memory, and action control in world models across diverse environments.
      what_remains_open: Correlation between benchmark scores and downstream task
        performance is not established; coverage of real-world, unstructured environments
        is missing.
    consensus:
    - Diffusion models and Transformers are the dominant architectures for building
      world models across driving, robotics, and games.
    - Self-supervised or generative pretraining on large-scale datasets (video, action)
      improves generalization and downstream policy learning.
    - World models are increasingly used to generate imagined trajectories for planning
      or policy training, rather than just for prediction.
    - Memory and consistency over long horizons are recognized as critical challenges,
      with new benchmarks emerging to measure them.
    disagreements:
    - 'Modality coupling: Some works treat video and action as separate diffusion
      processes (UWM), while others use video-only generation with action as conditioning
      (RoboDreamer) or no action at all (MaskGWM).'
    - 'Incorporation of physics: RoboScape explicitly injects temporal depth and keypoint
      dynamics for physical plausibility, whereas others rely on data-driven generation
      without explicit physical constraints.'
    - 'Evaluation targets: Visual fidelity and FVD are common, but newer benchmarks
      (LoopNav, MIND) argue for spatial consistency and memory as distinct metrics,
      diverging from pure generation quality.'
    - 'Deployment assumption: Some methods are evaluated only in simulation or on
      curated datasets (cRSSM, RoboDreamer), while others target real-world driving
      (MaskGWM) or robotic execution (RoboScape), creating a gap in claimed applicability.'
    open_questions:
    - How can world models be validated for safety-critical real-world deployment
      when current evaluation is limited to offline metrics or simulation?
    - What architectures can maintain long-term memory and spatial consistency over
      extended rollouts without catastrophic forgetting?
    - Can compositional or physics-informed world models generalize to unseen object-action
      combinations beyond training primitives?
    - Do improvements in benchmarked memory consistency and action control translate
      to better task completion rates in real robots or vehicles?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 生成驾驶场景的多视角、长时域视频预测，支持闭环仿真和策略评测。
      尚未覆盖: 仿真保真度与真实安全结果的一致性；跨传感器配置和地域的零样本迁移未经验证。
    - 路线: 交互式智能体与游戏世界模型
      解决的问题: 在RL环境（如Atari、上下文控制任务）中利用有限交互学习高效世界模型，提升样本效率和零样本泛化。
      尚未覆盖: 对全新动态或奖励结构任务的泛化；基于原始像素的训练仍需大量计算。
    - 路线: 具身机器人世界模型
      解决的问题: 通过语言、动作和物理先验生成视频计划或学习动力学模型，用于机器人操作。
      尚未覆盖: 仿真以外的真实世界部署；对全新物体-动作组合和长时域任务的组合泛化有限。
    - 路线: 世界模型评估基准
      解决的问题: 提供数据集和指标，以量化世界模型在不同环境中的空间一致性、记忆和动作控制。
      尚未覆盖: 基准分数与下游任务性能的相关性未建立；缺乏对真实非结构化环境的覆盖。
    共识:
    - 扩散模型和Transformer是构建驾驶、机器人和游戏世界模型的主流架构。
    - 在大规模数据集（视频、动作）上进行自监督或生成式预训练能提升泛化能力和下游策略学习。
    - 世界模型越来越多地用于生成想象轨迹以支持规划或策略训练，而非仅用于预测。
    - 长时域记忆和一致性被公认为关键挑战，新基准正涌现以衡量这些能力。
    分歧:
    - 模态耦合方式：部分工作将视频和动作作为独立扩散过程（UWM），其他则以视频生成为主并用动作作为条件（RoboDreamer），或完全不使用动作（MaskGWM）。
    - 物理先验的引入：RoboScape显式注入时间深度和关键点动力学以实现物理合理性，而其他方法依赖数据驱动生成，无显式物理约束。
    - 评测目标：视觉保真度和FVD是常见指标，但新基准（LoopNav、MIND）主张以空间一致性和记忆作为独立指标，与纯生成质量产生分歧。
    - 部署假设：部分方法仅在仿真或精选数据集上评估（cRSSM、RoboDreamer），而其他方法瞄准真实驾驶（MaskGWM）或机器人执行（RoboScape），声明的适用性存在差距。
    开放问题:
    - 当现有评估局限于离线指标或仿真时，如何验证世界模型在安全关键真实部署中的可靠性？
    - 何种架构能在长时间展开中保持记忆和空间一致性而不发生灾难性遗忘？
    - 组合式或物理信息驱动的世界模型能否泛化到训练原语之外的未见物体-动作组合？
    - 基准测试中记忆一致性和动作控制的提升是否转化为真实机器人或车辆任务完成率的提高？
