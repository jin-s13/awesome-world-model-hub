  related_work_outline_zh:
  - 主流方向：面向机器人和驾驶的领域世界模型占据主要证据，采用动作或语言条件的视频生成，并常使用扩散或Transformer架构。
  - 研究共性：将世界模型作为未来观测或潜在状态的生成器，在目标领域用于策略学习、评测或规划。
  - 关键差异：表示与监督目标不同，包括潜在循环/VAE模型、RGB扩散、物理辅助损失，以及视频-动作独立扩散时间步。
  - 趋势演进：在可获得的2023-2026证据内，趋势从高效强化学习世界模型转向具身机器人和驾驶视频生成，再转向空间/记忆/动作一致性评测基准。
  - 开放问题：真实部署迁移、长时记忆与动作泛化、部分可观测上下文、全新语言原语，以及跨本体和跨数据集边界。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multiview and long-horizon scene prediction
      what_it_solves: Generates future driving videos across viewpoints and horizons,
        supporting scene prediction and simulation-oriented evaluation.
      what_remains_open: Whether improved video generation transfers to real-world
        safety or operational outcomes, and how well it generalizes across datasets,
        sensors, and environmental conditions.
    - line: Embodied robot world models with video-action co-generation
      what_it_solves: Learns action-conditioned future video, policy, and dynamics
        for robot tasks, including compositional language-primitive planning and physics-informed
        visual prediction.
      what_remains_open: Generalization beyond seen language primitives or contexts,
        evidence from real-robot deployment, and transfer from visual/physical plausibility
        to robust manipulation.
    - line: Model-based reinforcement-learning world models for sample-efficient control
      what_it_solves: Trains policies from imagined rollouts in visual control environments,
        reducing real interaction and improving zero-shot context generalization in
        some settings.
      what_remains_open: Assumes observable context in contextual variants, is evaluated
        on narrow benchmarks, and lacks broader evidence across partial observability
        and varied task families.
    - line: Benchmarks for spatial memory, action control, and closed-loop consistency
      what_it_solves: Measures whether world models maintain long-horizon spatial
        coherence, memory consistency, and controllability under actions in open-domain
        environments.
      what_remains_open: Connection between benchmark metrics and downstream task
        success is not established; current models still show long-term memory and
        cross-action-space generalization gaps.
    consensus:
    - World models are treated as generative predictors conditioned on observable
      context such as actions, language, or task variables.
    - Transformer and diffusion-based sequence models are common across driving, robotics,
      and visual RL settings.
    - World models are evaluated through downstream policy training, video generation
      quality, physical plausibility, or consistency and control metrics rather than
      a single universal criterion.
    - Recent work explicitly couples perception-like video generation with control
      or dynamics, shifting beyond purely latent next-state prediction.
    disagreements:
    - 'Training objectives differ: MAE-style mask reconstruction plus generation,
      physics-informed depth/keypoint losses, context-conditioned latent dynamics,
      and independent video/action diffusion timesteps.'
    - 'Representation choices differ: recurrent state-space or VAE latent models versus
      direct RGB video diffusion or unified video-action token models.'
    - 'Evaluation targets differ: policy sample efficiency and Atari/CARL scores,
      multiview driving video quality, robot execution in simulation, or long-term
      memory and action-control consistency.'
    - 'Deployment assumptions differ: some assume observable context or seen primitive
      combinations, while others rely on action-free video pretraining or zero-shot
      cross-dataset transfer.'
    open_questions:
    - Do improvements in simulation or video prediction metrics transfer to real-world
      driving safety, robot manipulation, or physical deployment outcomes?
    - How can current models maintain long-horizon memory consistency and generalize
      across action spaces, given the challenges reported in recent benchmarks?
    - Can contextual world models handle partially observable or fully unseen context
      values without explicit context inputs?
    - How can compositional robot world models extend to entirely novel language primitives
      instead of only recombining seen primitives?
    - What are the cross-embodiment, cross-dataset, and cross-environment generalization
      boundaries for driving and robotics world models beyond current zero-shot examples?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与多视角长时场景预测
      解决的问题: 生成不同视角和时域的未来驾驶视频，支持场景预测与仿真式评测。
      尚未覆盖: 视频或仿真质量提升向真实安全或运行结果的迁移，以及跨数据集、传感器和环境条件的泛化。
    - 路线: 具身机器人世界模型与视频-动作联合生成
      解决的问题: 学习动作条件下的未来视频、策略和动力学，涵盖组合语言原语规划和物理信息视觉预测。
      尚未覆盖: 对已见语言原语或上下文之外的泛化、真实机器人部署证据，以及视觉或物理合理性向鲁棒操控的转移。
    - 路线: 基于模型的强化学习世界模型用于样本高效控制
      解决的问题: 通过想象轨迹训练视觉控制策略，减少真实交互，并在部分设置中提升零样本上下文泛化。
      尚未覆盖: 上下文可观测假设、基准覆盖较窄，以及部分可观测和跨任务家族泛化证据不足。
    - 路线: 空间记忆、动作控制与闭环一致性评测基准
      解决的问题: 衡量世界模型是否保持长时空间一致性、记忆一致性及动作可控性。
      尚未覆盖: 基准指标与下游任务成功的关系尚未建立，当前模型仍暴露长时记忆和跨动作空间泛化缺口。
    共识:
    - 世界模型被构建为以动作、语言或任务变量等可观测条件为输入的生成式预测器。
    - Transformer和扩散类序列模型在驾驶、机器人和视觉强化学习中常见。
    - 评测通过下游策略训练、视频生成质量、物理合理性或一致性与可控性指标展开，没有单一通用标准。
    - 近期工作把类似感知的视频生成与控制或动力学联合建模，而非仅做潜在下一状态预测。
    分歧:
    - 训练目标不同：掩码重建加生成损失、物理辅助深度/关键点损失、上下文潜在动力学，以及视频-动作独立扩散时间步。
    - 表示选择不同：循环状态空间或VAE潜在模型，对比直接RGB视频扩散或统一视频-动作token模型。
    - 评测重点不同：策略样本效率与Atari/CARL得分、多视角驾驶视频质量、仿真中的机器人执行，或长时记忆与动作控制一致性。
    - 部署假设不同：部分假设上下文可观测或已见原语组合，部分依赖无动作视频预训练或零样本跨数据集迁移。
    开放问题:
    - 仿真或视频预测指标的改进能否迁移到真实驾驶安全、机器人操控或物理部署结果？
    - 面对近期基准揭示的挑战，当前模型如何维持长时记忆一致性并跨动作空间泛化？
    - 上下文世界模型能否在不显式提供上下文时处理部分可观测或完全未见的环境条件？
    - 组合机器人世界模型如何扩展到全新语言原语，而不仅是重组已见原语？
    - 驾驶和机器人世界模型在零样本示例之外的跨本体、跨数据集和跨环境泛化边界在哪里？
