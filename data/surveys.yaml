  related_work_outline:
  - 'Mainstream direction: Benchmarking world models through action-conditioned video
    prediction and embodied control, using standard suites such as Atari 100k, CARL,
    Nuscenes/OpenDV-2K/Waymo, LoopNav, and MIND; dedicated benchmarks now add spatial,
    memory, and action-control stress tests.'
  - 'Shared research pattern: Works construct or use standardized tasks and automated
    metrics, then pair visual fidelity or prediction quality with downstream policy/task
    utility; they also treat open-sourced datasets, baselines, and code as comparability
    signals.'
  - 'Key differences: Evaluated competencies split between pixel-level visual detail,
    spatial-scene consistency, long-term memory, action controllability, physical
    plausibility, and zero-shot context generalization; supervision varies from diffusion
    video generation and VAE/Transformer latent learning to explicit context, physics,
    and action signals.'
  - 'Trend evolution: Within the 2023-2026 frontier, evaluation moved from aggregate
    RL scores to visual quality and then to explicit memory/spatial/action consistency
    benchmarks; 2025-2026 evidence adds unified multi-modal robotic and driving evaluation
    plus open-domain loop/revisit protocols.'
  - 'Open questions: Whether automated proxy metrics align with downstream deployment
    decisions; whether conclusions remain stable across action spaces, scenes, implementations,
    and compute budgets; several method papers have empty limitation fields in the
    evidence, and some benchmark abstracts do not report model results.'
  related_work_outline_zh:
  - 主流方向：通过动作条件视频预测和具身控制评估世界模型，采用 Atari 100k、CARL、Nuscenes/OpenDV-2K/Waymo、LoopNav、MIND
    等标准套件；新基准加入空间、记忆与动作控制压力测试。
  - 研究共性：构建或采用标准化任务与自动化指标，将视觉保真度或预测质量与下游策略/任务效用结合；强调开源数据集、基线和代码，使世界模型结论可比较。
  - 关键差异：评估重点分为像素级视觉细节、空间-场景一致性、长期记忆、动作可控性、物理合理性与零样本上下文泛化；监督信号涵盖扩散视频、VAE/Transformer潜在学习，以及显式上下文、物理和动作信号。
  - 趋势演进：在2023-2026前沿中，评估从聚合RL分数转向视觉质量，再转向显式记忆/空间/动作一致性基准；2025-2026出现统一多模态机器人与驾驶评估、开放域循环/重访协议。
  - 开放问题：自动代理指标是否与真实部署决策一致；结论在动作空间、场景、实现和算力预算变化时是否稳定；证据中部分方法局限字段为空，部分基准摘要未报告模型结果。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared closed-loop or action-conditioned tasks and datasets
        for comparing world models on video prediction, navigation, memory, spatial
        consistency, and action control.
      what_remains_open: Coverage remains narrow in scenes and action spaces; some
        benchmark abstracts report construction without accompanying model results,
        so discrimination power is not yet established.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, visual detail, physical plausibility,
        spatial-scene consistency, memory consistency, action control, and zero-shot
        generalization beyond aggregate scores.
      what_remains_open: Alignment between these proxy metrics and downstream deployment
        utility is underevidenced, especially across viewpoints, long horizons, and
        varied action spaces.
    - line: Comparable baselines and reporting
      what_it_solves: Provides standard benchmark protocols, baselines, and artifact
        signals for auditing training cost and comparative gains across world-model
        methods.
      what_remains_open: Several method papers have empty limitation fields in the
        provided evidence or only high-level metric statements; stability under implementation
        and compute variation is not demonstrated.
    consensus:
    - World models are judged through action-conditioned or closed-loop evaluation
      rather than image generation alone.
    - Quantitative automated metrics are paired with downstream task evidence such
      as policy performance, control, or navigation consistency.
    - Open-source datasets, benchmark suites, and code are treated as key comparability
      signals.
    disagreements:
    - 'Evaluation target differs: visual fidelity and physical plausibility versus
      spatial-scene-graph consistency, long-term memory, action control, or zero-shot
      context generalization.'
    - 'Training and supervision differ: diffusion pixel-space generation, stochastic
      VAE/Transformer latent dynamics, explicit context conditioning, physics-informed
      losses, and coupled video-action diffusion.'
    - 'Interaction mode differs: open-loop video generation, closed-loop loop navigation,
      and policy rollouts expose different failure modes.'
    - 'Deployment setting differs: Atari, CARL contextual RL, Minecraft navigation,
      driving, and robotic manipulation lead to non-identical generalization claims.'
    open_questions:
    - Do spatial, memory, and action consistency metrics predict real-world driving
      or robot policy success?
    - Are benchmark conclusions robust across unseen scenes, wider action spaces,
      different implementations, and compute budgets?
    - What is the boundary of zero-shot context generalization when context observability
      is relaxed beyond two benchmark tasks?
    - What negative results or failure modes are hidden when limitation fields are
      empty in the evidence or only aggregate scores are provided?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享的闭环或动作条件任务与数据集，对视频预测、导航、记忆、空间一致性和动作控制进行比较。
      尚未覆盖: 场景和动作空间覆盖仍窄；部分基准摘要只报告构建过程，缺少模型结果，区分度尚未验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、视觉细节、物理合理性、空间-场景一致性、记忆一致性、动作控制和零样本泛化。
      尚未覆盖: 代理指标与真实下游部署效用之间的对齐证据不足，尤其是跨视角、长时域和多样动作空间。
    - 路线: 可比基线与报告规范
      解决的问题: 提供标准基准协议、基线与工件信号，用于审计训练成本和各世界模型方法的相对增益。
      尚未覆盖: 部分方法论文在证据中局限字段为空或仅有高层指标表述；结论在实现和算力变化下的稳定性未得到证明。
    共识:
    - 世界模型通过动作条件或闭环评估来判断，而不是仅靠图像生成。
    - 定量自动指标与下游任务证据（策略表现、控制、导航一致性）结合使用。
    - 开源数据集、基准套件和代码被视为可比较性的关键信号。
    分歧:
    - 评测目标不同：视觉保真度与物理合理性，对比空间-场景图一致性、长期记忆、动作控制或零样本上下文泛化。
    - 训练与监督信号不同：扩散像素级生成、随机VAE/Transformer潜在动力学、显式上下文条件、物理信息损失，以及视频-动作耦合扩散。
    - 交互模式不同：开环视频生成、闭环循环导航和策略展开暴露不同的失败模式。
    - 部署场景不同：Atari、CARL上下文强化学习、Minecraft导航、驾驶和机器人操作会导致不同的泛化结论。
    开放问题:
    - 空间、记忆和动作一致性指标是否预测真实驾驶或机器人策略的成功？
    - 基准结论在未见场景、更宽动作空间、不同实现和算力预算下是否稳健？
    - 当上下文可观测性假设放宽到两个基准任务之外时，零样本上下文泛化边界在哪里？
    - 当证据中局限字段为空或仅提供聚合分数时，哪些负面结果或失败模式被隐藏？
