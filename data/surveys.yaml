  related_work_outline:
  - 'Mainstream direction: World model research is converging on generative architectures
    (diffusion Transformers and VAEs) for high-fidelity video prediction, integrating
    multimodal conditions such as actions, language, and physics to support embodied
    tasks like robotic manipulation and autonomous driving.'
  - 'Shared research pattern: Most works learn latent dynamics from video and interaction
    data via self-supervised learning, then use imagined rollouts for policy learning
    or planning, with a strong emphasis on generalization and long-term consistency.'
  - 'Key differences: Architectures split between diffusion models, Transformer-based
    sequence models, and Dreamer-variant state-space models; some focus on pure video
    generation quality, while others jointly model actions and video, explicitly inject
    physics knowledge, or incorporate context; evaluation settings range from Atari
    games to robotic manipulation, driving, and open-world navigation, making direct
    comparison difficult.'
  - 'Trend evolution: Early work centered on Dreamer-style VAEs and RNNs; recent years
    (2023–2025) have seen a shift toward Transformers and diffusion models, expansion
    from single-modal to multimodal conditioning, and a push toward unified pretraining
    on large-scale robotic datasets. 2025–2026 introduces benchmarks for memory consistency
    and physical plausibility.'
  - 'Open questions: How to achieve long-term memory consistency across diverse tasks
    and modalities; how to guarantee physical plausibility without explicit physics
    engines; how to establish unified evaluation protocols that fairly compare heterogeneous
    world model approaches; how to learn controllable dynamics from large-scale action-free
    video data.'
  related_work_outline_zh:
  - 主流方向：世界模型研究正趋向于使用生成式架构（如扩散Transformer和VAE）进行高保真视频预测，并整合动作、语言、物理等多模态条件，以支持机器人操控和自动驾驶等具身任务。
  - 研究共性：多数工作通过自监督学习从视频和交互数据中学习潜在动力学，再利用模型生成的想象轨迹进行策略学习或规划，注重泛化能力与长期一致性。
  - 关键差异：架构上分为扩散模型、Transformer序列模型和Dreamer变体状态空间模型；一些专注于纯视频生成质量，另一些联合建模动作与视频、显式注入物理知识或整合上下文；评估场景从Atari游戏到机器人操控、驾驶和开放世界导航，差异显著。
  - 趋势演进：早期以Dreamer风格的VAE和RNN为主；近年来（2023–2025）转向Transformer和扩散模型，从单模态扩展到多模态条件，并推动在大规模机器人数据集上的统一预训练。2025–2026年出现专门针对记忆一致性和物理合理性的基准。
  - 开放问题：如何在多样任务和模态下实现长期记忆一致性；如何在无显式物理引擎时保证物理合理性；如何建立统一的评估准则以公平比较不同世界模型方法；如何从大规模无动作视频数据中学习可控的动力学。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures with diffusion and masking
      what_it_solves: Learning to generate future video frames or states from high-dimensional
        sensory inputs, enabling long-horizon prediction and multi-view consistency
        for autonomous driving and robotics.
      what_remains_open: Ensuring physical plausibility and long-term memory consistency
        across diverse scenes; generalization to novel action spaces and compositions
        beyond training primitives.
    - line: Contextual and stochastic state-space models for reinforcement learning
      what_it_solves: Building compact latent dynamics models that incorporate context
        or stochasticity to improve sample efficiency and zero-shot generalization
        in model-based RL.
      what_remains_open: Scaling to complex, partially observable real-world settings
        where context is not directly observable; evaluation beyond limited benchmark
        tasks like CARL or Atari 100k.
    - line: Benchmarking and evaluation of world model capabilities
      what_it_solves: Defining standardized metrics and datasets for measuring spatial
        consistency, memory, and action control in world models, revealing failure
        modes of current approaches.
      what_remains_open: Unifying evaluation across heterogeneous tasks (games, robotics,
        navigation) and extending to real-world embodied settings; quantifying physical
        plausibility and safety.
    consensus:
    - World models are predominantly built on generative architectures, with diffusion
      models emerging as a common backbone for high-quality video prediction.
    - Learning latent dynamics from visual observations and using imagined rollouts
      for policy optimization is a widely adopted paradigm across model-based RL and
      generative world models.
    - Multimodal conditioning (actions, language, goal images) is seen as essential
      for controllable and generalizable world models.
    - Pretraining on large-scale, diverse robotic or video datasets is increasingly
      recognized as critical for improving generalization and robustness.
    - There is a growing recognition of the need for benchmarks that specifically
      evaluate long-term consistency, memory, and physical plausibility beyond traditional
      reconstruction metrics.
    disagreements:
    - 'Representation: Some models treat world modeling as pure video generation conditioned
      on action, while others jointly embed actions and video in a unified latent
      space, affecting how policies are derived.'
    - 'Supervision: Methods differ in how they incorporate structure—some use explicit
      physics-informed losses (depth, keypoints), others rely on implicit learning
      through masked reconstruction or next-frame prediction, and some assume observable
      context variables.'
    - 'Evaluation target: Evaluation settings are highly fragmented—Atari 100k, CARL,
      CARLA, NuScenes, Minecraft, and general robotic datasets—each emphasizing different
      capabilities (sample efficiency, visual fidelity, compositional generalization,
      spatial consistency).'
    - 'Interaction mode: Worlds models are used for pure video planning, as differentiable
      simulators for policy training, or as predictive models for action evaluation;
      the optimal interface between model and decision-making remains unresolved.'
    - 'Deployment setting: Approaches range from fully simulated environments to zero-shot
      real-world transfer, with varying assumptions about the availability of actions,
      context, and task structure.'
    open_questions:
    - How can world models maintain long-term memory consistency without catastrophic
      forgetting of scene elements over extended rollouts?
    - What is the most effective way to incorporate physical commonsense (e.g., object
      permanence, rigid body dynamics) into learned generative models without access
      to explicit physics simulators?
    - How can we design a unified evaluation framework that spans the diverse capabilities
      claimed by different world models (prediction accuracy, controllability, compositional
      generalization, physical plausibility)?
    - Under what conditions can world models learn actionable dynamics from action-free
      video data, and what inductive biases are required?
    - What are the failure modes of world models when deployed in safety-critical
      real-world settings, and how can we systematically benchmark them?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散和掩码的生成式世界模型架构
      解决的问题: 从高维感知输入中学习生成未来视频帧或状态，实现长时域预测和多视角一致性，服务于自动驾驶和机器人。
      尚未覆盖: 确保跨场景的物理合理性和长期记忆一致性；泛化到训练原语之外的新动作空间和组合。
    - 路线: 用于强化学习的上下文和随机状态空间模型
      解决的问题: 构建紧凑的潜在动力学模型，通过整合上下文或随机性提高基于模型的强化学习的样本效率和零样本泛化能力。
      尚未覆盖: 扩展到上下文不可直接观测的复杂真实环境；评估超越CARL或Atari 100k等有限基准任务。
    - 路线: 世界模型能力的基准测试与评估
      解决的问题: 定义标准化度量和数据集，用于衡量世界模型的空间一致性、记忆和动作控制，揭示当前方法的失效模式。
      尚未覆盖: 统一跨越异构任务（游戏、机器人、导航）的评估，并扩展到真实具身环境；量化物理合理性和安全性。
    共识:
    - 世界模型主要建立在生成式架构之上，扩散模型正成为高质量视频预测的通用骨干。
    - 从视觉观测中学习潜在动力学，并利用想象轨迹进行策略优化，是基于模型的强化学习和生成式世界模型普遍采用的范式。
    - 多模态条件（动作、语言、目标图像）被视为构建可控且可泛化世界模型的关键。
    - 在大规模多样化机器人或视频数据集上进行预训练，越来越被认为是提升泛化性和鲁棒性的关键。
    - 研究者越来越认识到需要专门评估长期一致性、记忆和物理合理性的基准，而非仅依赖传统重建指标。
    分歧:
    - 表示方式：一些模型将世界模型视为以动作为条件的纯视频生成，另一些则将动作和视频联合嵌入统一潜在空间，影响策略的推导方式。
    - 监督信号：方法在如何注入结构信息上存在差异——有的使用显式物理启发损失（深度、关键点），有的通过掩码重建或下一帧预测进行隐式学习，有的假设上下文变量可观测。
    - 评测目标：评测场景高度碎片化——Atari 100k、CARL、CARLA、NuScenes、Minecraft和通用机器人数据集，各自强调不同能力（样本效率、视觉保真度、组合泛化、空间一致性）。
    - 交互模式：世界模型被用于纯视频规划、作为可微模拟器进行策略训练，或作为动作评估的预测模型；模型与决策之间的最优接口仍未解决。
    - 部署场景：方法范围从完全模拟环境到零样本真实世界迁移，对动作、上下文和任务结构可用性的假设各不相同。
    开放问题:
    - 世界模型如何能在长时域推演中维持长期记忆一致性，而不灾难性地遗忘场景元素？
    - 在无法访问显式物理模拟器的情况下，将物理常识（如物体持久性、刚体动力学）融入学习到的生成模型的最有效方法是什么？
    - 如何设计一个统一的评估框架，覆盖不同世界模型所声称的多样化能力（预测精度、可控性、组合泛化、物理合理性）？
    - 在什么条件下世界模型可以从无动作视频数据中学习可执行的动力学，需要哪些归纳偏置？
    - 世界模型在部署到安全关键的真实场景时存在哪些失效模式，如何系统地进行基准测试？
