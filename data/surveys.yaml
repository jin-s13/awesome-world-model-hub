  - 'Key differences: representation spans compact latent state-space or Transformer-VAE
    models to pixel-space diffusion video generation; supervision spans control returns,
    reconstruction/generation loss, auxiliary physics, and consistency metrics.'
  - 'Trend evolution: from Atari/CARL-style control tasks toward large driving, Minecraft,
