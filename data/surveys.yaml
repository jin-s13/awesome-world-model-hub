  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Consolidates fragmented research on interactive video generation,
        autonomous driving, and agent/general simulation into application scenarios,
        representation choices, design spaces, and challenge roadmaps.
      what_remains_open: Most taxonomies are trend-driven and conceptual; systematic
        inclusion criteria and empirical validation of the proposed frameworks remain
        sparse.
    - line: Controllable generative world simulation
      what_it_solves: Generates future frames or videos under language, ego-motion,
        object-dynamics, or human-pose control for planning and scenario synthesis.
      what_remains_open: Generalization to unseen primitive combinations, novel events,
        out-of-sight persistence, and long-horizon stability is still unresolved.
    - line: Embodied online world-model learning
      what_it_solves: Uses latent world-model planning for direct real-robot learning
        from camera images and sparse rewards without simulators.
      what_remains_open: Evidence is limited to a few robot platforms and shared hyperparameters;
        transfer to broader hardware, tasks, and deployment settings is unclear.
    - line: Evaluation benchmark and metric synthesis
      what_it_solves: Compares benchmark settings and proposes metrics or evaluation
        suites for open-loop versus closed-loop assessment of world simulation.
      what_remains_open: Whether the proposed benchmarks and metrics are compatible
        across simulation, ego-vision, autonomous driving, and real deployment is
        not systematically verified.
    consensus:
    - Long-horizon consistency and action-conditioned control are treated as central
      obstacles across surveys and model-focused work.
    - Explicit representational design is a common response, including compositional
      primitives, latent states/actions, persistent global scene state, and multimodal
      conditioning.
    - Evaluation is increasingly treated as a first-class research object, with emphasis
      on benchmarks, metrics, and evaluation frameworks rather than only model quality.
    - Real-time interactivity and low-latency inference are emerging as shared engineering
      and evaluation requirements.
    disagreements:
    - 'Representation: some approaches parse language into symbolic primitives, while
      others use latent states and actions, persistent 3D/dynamic scene state, or
      multimodal reference-frame conditioning.'
    - 'Evaluation target: some contributions are conceptual surveys without new experiments,
      while others report simulation, ego-vision, autonomous driving, or physical-robot
      results.'
    - 'Supervision and interaction mode: some methods learn online from sparse rewards
      on real robots, while others train on large-scale retrospective video with future-frame
      prediction.'
    - 'Deployment setting: real robots, autonomous driving scenes, ego-centric human/vehicle
      scenes, and open-ended interactive environments impose different constraints
      and metrics.'
    open_questions:
    - How can survey taxonomies and evaluation frameworks be empirically validated
      instead of remaining conceptual and trend-bound?
    - What mechanisms would enable generalization to unseen primitive combinations,
      persistent out-of-sight events, and longer-horizon interactions?
    - Which evaluation protocols best align open-loop generation quality with closed-loop
      real-world control?
    - What code, dataset, limitation, and real-robot transfer evidence is missing
      from the current systems?
