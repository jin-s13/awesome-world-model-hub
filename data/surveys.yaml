  related_work_outline:
  - 'Mainstream direction: Designing video-generative world models with diffusion
    transformers or VAEs that predict future frames, increasingly incorporating physical
    priors and supporting downstream policy learning or planning.'
  - 'Shared research pattern: Using self-supervised or supervised future prediction
    as the core training objective, then leveraging the learned dynamics for policy
    training, plan generation, or zero-shot generalization.'
  - 'Key differences: Approaches differ in how they handle actions (unified generation
    vs. external policy), whether they inject explicit physics knowledge, and the
    extent to which they evaluate compositional or long-horizon consistency.'
  - 'Trend evolution: From efficient stochastic world models (2023) to diffusion-based,
    context-aware, and physics-informed architectures (2024–2025), and toward dedicated
    benchmarks for memory, control, and spatial consistency (2025–2026).'
  - 'Open questions: How to achieve long-term memory and physical plausibility in
    open worlds, how to isolate the model''s contribution from the planner or controller,
    and how to design a standardized evaluation protocol that captures real-world
    deployment readiness.'
  related_work_outline_zh:
  - 主流方向：设计基于扩散变换器或VAE的视频生成式世界模型，预测未来帧，并越来越多地融入物理先验以支持下有策略学习或规划。
  - 研究共性：以自监督或监督的未来预测为核心训练目标，然后利用学习到的动力学进行策略训练、计划生成或零样本泛化。
  - 关键差异：各方法在动作处理方式（统一生成 vs. 外部策略）、是否注入显式物理知识以及评估组合性或长时域一致性的程度上存在区别。
  - 趋势演进：从2023年的高效随机世界模型，到2024–2025年基于扩散、上下文感知和物理信息的架构，再到2025–2026年面向记忆、控制和空间一致性的专用基准。
  - 开放问题：如何在开放世界中实现长期记忆和物理合理性，如何隔离模型贡献与规划器/控制器的影响，以及如何设计标准化的评估协议来衡量真实世界部署的成熟度。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures and training objectives
      what_it_solves: Produces high-fidelity future video predictions under diverse
        conditions, incorporating stochasticity, context, and physical constraints
        to improve visual quality and generalization.
      what_remains_open: Unifying architectural choices with physical plausibility
        across domains, verifying that reported gains transfer beyond the specific
        datasets and tasks used in evaluation.
    - line: Dynamics-to-policy coupling and action interfaces
      what_it_solves: Connects learned world dynamics to decision-making by training
        policies on imagined rollouts, generating video plans, or jointly modeling
        actions and observations.
      what_remains_open: Disentangling improvements from the world model versus the
        planner or controller; limited real-robot and open-domain validation; generalization
        beyond the exact context values seen during training.
    - line: Evaluable capabilities and dedicated benchmarks
      what_it_solves: Provides systematic measurement of spatial consistency, memory,
        and action control, highlighting failure modes that per-frame metrics miss.
      what_remains_open: Lack of standardized protocols across benchmarks; translation
        of benchmark scores to practical downstream task performance remains unverified.
    consensus:
    - World models benefit from future frame prediction as a training signal and can
      serve as learned simulators for policy learning or planning.
    - Diffusion-based and transformer-based architectures dominate recent designs,
      often combined with stochastic elements or variational objectives.
    - Dedicated benchmarks that evaluate consistency, memory, and controllability
      are necessary to reveal weaknesses invisible to reconstruction metrics alone.
    disagreements:
    - Whether actions should be integrated into a unified diffusion model (UWM) or
      treated as external inputs to a separate policy (cRSSM, STORM).
    - Whether explicit physics priors (depth, keypoint dynamics) are essential for
      physical plausibility or can be replaced by data-driven scaling.
    - Evaluation scope varies from simplified contextual RL tasks to photorealistic
      driving and robot manipulation, making cross-work comparisons fragile.
    open_questions:
    - How can long-term memory consistency and physical plausibility be guaranteed
      in open-world settings without per-scene retraining?
    - What is the minimal set of benchmarks and metrics that reliably predicts real-world
      deployment success of a world model-based system?
    - Can the compositional generalization seen in factored video generation (RoboDreamer)
      be extended to novel primitives and real robot platforms?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构与训练目标
      解决的问题: 在多样化条件下生成高保真未来视频，融合随机性、上下文和物理约束以提升视觉质量和泛化能力。
      尚未覆盖: 跨领域统一架构选择与物理合理性，验证所报告增益是否超出特定数据集和任务范围。
    - 路线: 动力学到策略的耦合与动作接口
      解决的问题: 通过想象轨迹训练策略、生成视频计划或联合建模动作与观测，将学习到的动力学连接到决策。
      尚未覆盖: 厘清世界模型与规划器/控制器的贡献；有限的实际机器人和开放域验证；泛化超出训练期间所见的确切上下文值。
    - 路线: 可评估能力与专用基准
      解决的问题: 系统测量空间一致性、记忆和动作控制，揭示逐帧指标无法发现的失败模式。
      尚未覆盖: 缺乏跨基准的标准化协议；基准分数向实际下游任务性能的转换尚未得到验证。
    共识:
    - 世界模型受益于未来帧预测作为训练信号，并可作为学习策略或规划的仿真器。
    - 基于扩散和Transformer的架构主导近期设计，常与随机元素或变分目标结合。
    - 评估一致性、记忆和可控性的专用基准对于揭示仅靠重建指标看不到的弱点十分必要。
    分歧:
    - 动作应集成到统一扩散模型中（UWM），还是作为外部策略的输入（cRSSM、STORM）。
    - 显式物理先验（深度、关键点动力学）对于物理合理性是否必不可少，还是可由数据驱动规模化替代。
    - 评估范围从简化的上下文RL任务到真实驾驶和机器人操作不等，导致跨工作比较脆弱。
    开放问题:
    - 如何在开放世界环境中保证长期记忆一致性和物理合理性，而无需按场景重新训练？
    - 能够可靠预测基于世界模型的系统在真实世界部署成功的最小基准和指标集是什么？
    - 在因子化视频生成（RoboDreamer）中观察到的组合泛化能否扩展到新原语和真实机器人平台？
