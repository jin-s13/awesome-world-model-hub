  - 'Key differences: General video world simulation surveys emphasize physical realism
    and large generative video models, while driving-focused surveys impose geometry,
    topology, and semantic priors; conceptual frameworks lack the empirical baselines
    found in method studies.'
  - 'Trend evolution: From 2022 physical robot world-model learning and 2023 traffic
    simulation, the field moves through 2024 general video world surveys to 2025-2026
    efforts on latent taxonomies, fine-grained controllable generation, and persistent
