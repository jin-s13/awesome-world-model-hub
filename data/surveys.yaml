  related_work_outline:
  - 'Mainstream direction: World models are shifting from Dreamer-style latent state-space
    models to diffusion-based video generation models using Transformer architectures,
    with a focus on generalizable driving and robotics scenarios.'
  - 'Shared research pattern: Most works leverage self-supervised or joint training
    with video prediction objectives, often incorporating action conditioning or context
    to enable planning and policy learning.'
  - 'Key differences: Methods diverge on whether they use pixel-level video diffusion
    or latent state-space models, whether they require explicit action labels, and
    whether they target video fidelity, spatial consistency, or zero-shot generalization.'
  - 'Trend evolution: From 2023-2024, efficient Transformer+VAE (STORM) and contextual
    Dreamer variants (cRSSM) emerged; 2025 saw a surge of diffusion-based world models
    (MaskGWM, RoboScape, UWM) and the first benchmarks for memory and action control
    (LoopNav, MIND), indicating a maturation toward systematic evaluation.'
  - 'Open questions: How to reliably evaluate long-term memory consistency and spatial
    coherence, how to integrate physics knowledge without loss of generalization,
    and how to isolate the contribution of the world model from the downstream planner
    or controller.'
  related_work_outline_zh:
  - 主流方向：世界模型正从Dreamer式潜在状态空间模型转向基于扩散的Transformer视频生成模型，重点关注泛化能力强的驾驶和机器人场景。
  - 研究共性：多数工作采用自监督或联合训练，以视频预测为目标，常结合动作条件或上下文，以支持规划与策略学习。
  - 关键差异：方法在像素级视频扩散与潜在状态空间模型、是否需要显式动作标签、以及优化视频保真度、空间一致性还是零样本泛化等方面存在分歧。
  - 趋势演进：2023-2024年出现高效Transformer+VAE（STORM）和上下文Dreamer变体（cRSSM）；2025年涌现大量扩散世界模型（MaskGWM、RoboScape、UWM）和首个记忆与动作控制基准（LoopNav、MIND），显示领域正走向系统化评估。
  - 开放问题：如何可靠评估长期记忆一致性与空间连贯性，如何在不牺牲泛化性的前提下融合物理知识，以及如何分离世界模型与下游规划器/控制器的贡献。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures and training
        recipes, such as Diffusion Transformers with mask reconstruction (e.g., MaskGWM),
        physics-informed joint training (e.g., RoboScape), or contextual latent state-space
        models (e.g., cRSSM).
      what_remains_open: Which architectural choices transfer beyond the reported
        task family; whether the chosen objectives capture causal structure or merely
        correlation; the scalability of physics-informed losses to open-world settings.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to intervention, planning, and decision-time
        interfaces, e.g., by factorizing video generation into compositional primitives
        (e.g., RoboDreamer) or coupling video and action diffusion in a unified transformer
        (e.g., UWM).
      what_remains_open: How much of the gain comes from the model versus the planner
        or task prior; generalization to unseen action spaces and primitives; robustness
        to inaccurate instruction parsing.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects via standardized benchmarks for spatial consistency
        (e.g., LoopNav) and memory-action control (e.g., MIND).
      what_remains_open: Whether existing benchmarks fully capture long-term memory,
        closed-loop consistency, and cross-action-space generalization; whether evidence
        isolates the proposed method rather than surrounding system choices.
    consensus:
    - Video prediction is the dominant testbed for world models, with generated frames
      serving as the primary signal for dynamics learning.
    - Self-supervised or joint training on large-scale datasets is preferred over
      task-specific supervised learning to improve generalization.
    - Incorporating explicit structure—whether physical, compositional, or contextual—improves
      plausibility and downstream task performance.
    - Transformer-based architectures are increasingly adopted as the backbone across
      both latent-space and pixel-space methods.
    disagreements:
    - 'Representation: latent state-space models (cRSSM, STORM) vs. pixel-space diffusion
      models (MaskGWM, RoboScape, UWM).'
    - 'Supervision signal: methods that require action labels (UWM, RoboDreamer) vs.
      those that learn from action-free video (MaskGWM, RoboScape).'
    - 'Evaluation target: visual fidelity and FVD-based metrics vs. spatial consistency
      and memory scores vs. zero-shot generalization to unseen dynamics.'
    - 'Interaction mode: open-loop video rollout benchmarks vs. closed-loop action-conditional
      evaluation with memory tests.'
    open_questions:
    - Can pixel-space diffusion models match the sample efficiency of latent state-space
      models for control tasks?
    - How can we disentangle the contribution of the world model from the planner
      or policy when the two are tightly coupled in evaluation?
    - What benchmarks can reliably measure long-term memory consistency without being
      confounded by pixel-level artifacts?
    - Do physics-informed world models retain their advantage when scaled to truly
      open-world, multi-task settings with diverse dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型理念落实为具体架构与训练配方，例如带掩码重建的扩散Transformer（如MaskGWM）、物理信息联合训练（如RoboScape）或上下文潜在状态空间模型（如cRSSM）。
      尚未覆盖: 哪些架构选择可迁移到报告任务族之外；所选目标是否捕捉因果结构而不仅是相关性；物理信息损失在开放世界场景中的可扩展性。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划与决策时接口，例如将视频生成分解为组合原语（如RoboDreamer）或在统一Transformer中耦合视频与动作扩散（如UWM）。
      尚未覆盖: 收益有多少来自模型本身而非规划器或任务先验；对未见动作空间与原语的泛化能力；对不准确指令解析的鲁棒性。
    - 路线: 方法证据与消融协议
      解决的问题: 通过标准化基准（如针对空间一致性的LoopNav、针对记忆-动作控制的MIND）分离方法贡献与数据集、基线、指标及实现因素的影响。
      尚未覆盖: 现有基准是否充分捕捉长期记忆、闭环一致性及跨动作空间泛化；证据是否隔离了所提方法，而非周边系统选择。
    共识:
    - 视频预测是世界模型的主要试验场，生成的帧作为动力学学习的主要信号。
    - 自监督或在大规模数据集上的联合训练优于任务特定的监督学习，以提升泛化性。
    - 引入显式结构——无论是物理的、组合的还是上下文的——能改善生成合理性与下游任务表现。
    - Transformer架构正在成为潜在空间和像素空间方法的共同骨干。
    分歧:
    - 表示方式：潜在状态空间模型（cRSSM、STORM） vs. 像素空间扩散模型（MaskGWM、RoboScape、UWM）。
    - 监督信号：需要动作标签的方法（UWM、RoboDreamer） vs. 从无动作视频中学习的方法（MaskGWM、RoboScape）。
    - 评测目标：视觉保真度与FVD类指标 vs. 空间一致性与记忆分数 vs. 对未见动力学的零样本泛化。
    - 交互模式：开环视频展开基准 vs. 带记忆测试的闭环动作条件评估。
    开放问题:
    - 像素空间扩散模型在控制任务中的样本效率能否匹敌潜在状态空间模型？
    - 当世界模型与规划器/策略在评估中紧密耦合时，如何解耦两者的贡献？
    - 哪些基准能可靠地衡量长期记忆一致性，而不被像素级伪影混淆？
    - 物理信息世界模型在扩展到真正开放世界、多任务、动力学多样化的场景时，其优势是否依然存在？
