  related_work_outline:
  - 'Mainstream direction: Domain-specific world models for driving, robotics, and
    interactive agents are moving toward generative video/diffusion models coupled
    with actions, physics, or memory benchmarks.'
  - 'Shared research pattern: Papers jointly learn predictive or generative world
    representations and downstream control signals, then evaluate via video fidelity,
    zero-shot rollout, or policy utility.'
  - 'Key differences: They differ in learned representation (recurrent state-space,
    transformer diffusion, physics-informed video), supervision modality (actions,
    context, masks, depth/keypoints, language primitives), and evaluation setting
    (Atari/CARL, driving datasets, robot execution/benchmarks).'
  - 'Trend evolution: Available top evidence is concentrated in 2023-2026, so the
    observed trend is within the current frontier: from sample-efficient model-based
    RL toward domain-specific diffusion world models and open-domain consistency benchmarks.'
  - 'Open questions: Real-world transfer, long-horizon memory consistency, cross-action/embodiment
    generalization, and simulator-to-safety alignment remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：面向驾驶、机器人和交互智能体的领域世界模型，正朝耦合动作、物理或记忆评估的生成式视频/扩散模型发展。
  - 研究共性：联合学习预测或生成式世界表征与下游控制信号，并通过视频保真度、零样本展开或策略效用进行评测。
  - 关键差异：在表示方式（循环状态空间、Transformer扩散、物理信息视频）、监督信号（动作、上下文、掩码、深度/关键点、语言原语）和评测场景（Atari/CARL、驾驶数据、机器人执行/基准）上分化。
  - 趋势演进：可见的高排序证据集中在2023-2026年，因此观察到的趋势属于当前前沿：从样本高效的模型型强化学习，演进到领域专用扩散世界模型与开放域一致性基准。
  - 开放问题：真实世界迁移、长时记忆一致性、跨动作/本体泛化以及仿真到安全结果的一致性仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for closed-loop video prediction and simulation
      what_it_solves: Long-horizon and multi-view scene prediction under driving actions,
        including zero-shot generalization across driving datasets.
      what_remains_open: Alignment between generated video quality and real-world
        driving safety or operational outcomes; strong real-world closed-loop evaluation
        is not established in the visible evidence.
    - line: Embodied and robotics world models with actions or physics
      what_it_solves: Compositional robot video planning, physics-informed video generation,
        and policy/dynamics pretraining from large robot datasets.
      what_remains_open: Generalization to novel language primitives or unseen embodiments,
        and transfer from simulation or learned video plans to real robot execution.
    - line: Contextual and efficient model-based reinforcement learning
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        to observed context changes in discrete and continuous control.
      what_remains_open: Assumes observable context or narrow benchmark coverage;
        broader environment dynamics and partial-observability settings remain unverified.
    - line: Open-domain benchmarks for spatial memory and action control
      what_it_solves: Measuring long-term spatial consistency, memory consistency,
        and action control in loop-based navigation and varied action spaces.
      what_remains_open: Relationships between benchmark scores and downstream task
        performance or real deployment are not yet demonstrated.
    consensus:
    - Application-oriented world models increasingly center on generative sequence
      or video prediction, with a shared goal of improving downstream control or policy
      utility.
    - Many methods integrate world modeling with task-relevant signals such as actions,
      language instructions, context variables, physics objectives, or multi-view
      consistency.
    - Recent benchmarks converge on long-horizon spatial memory, memory consistency,
      and action control as critical gaps beyond short-horizon visual quality.
    - Several papers report policy training/evaluation or zero-shot generalization
      gains, but real-world deployment and cross-setting transfer remain usually unverified.
    disagreements:
    - 'Representation choice: stochastic latent state-space/VAE models, diffusion
      transformers, unified video-action diffusion, and physics-informed generative
      models are used differently.'
    - 'Supervision signals differ: mask reconstruction, context conditioning, keypoint/depth
      physics tasks, language-primitive factorization, and action-free video pretraining
      target different capabilities.'
    - Evaluation settings vary from Atari sample efficiency and contextual control
      benchmarks to driving datasets, robot datasets, and Minecraft-style open-domain
      memory tests, making direct comparison difficult.
    - Some methods assume observable context or predefined language primitives, while
      others learn without actions or target zero-shot transfer across datasets/embodiments.
    open_questions:
    - Can improved spatial/memory consistency on open-domain benchmarks translate
      into safer or more reliable driving and robot policies?
    - How can compositional robot world models generalize beyond seen primitive combinations
      and from simulated rollout to real robot execution?
    - What context, physics, or embodiment properties must be explicitly represented
      to extrapolate to unseen dynamics rather than fit training distributions?
    - Do video-and-action diffusion pretraining gains remain robust under distribution
      shift, long-horizon control, and partially observable deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与闭环视频预测/仿真
      解决的问题: 在驾驶动作下进行长时域、多视角场景预测，并跨驾驶数据集做零样本泛化。
      尚未覆盖: 生成视频质量与真实驾驶安全或运营结果之间的对齐；可见证据中尚未建立强真实闭环评测。
    - 路线: 面向机器人的具身世界模型与动作/物理联合建模
      解决的问题: 组合式机器人视频规划、物理合理的视频生成，以及从大规模机器人数据预训练策略/动力学。
      尚未覆盖: 对新颖语言原语或未见本体的泛化，以及从仿真/视频计划到真实机器人执行的迁移。
    - 路线: 上下文与高效模型型强化学习
      解决的问题: 在离散和连续控制中实现样本高效策略学习，并对可观测上下文变化做零样本泛化。
      尚未覆盖: 依赖可观测上下文或基准覆盖较窄；更广泛环境动力学和部分可观测设置未经验证。
    - 路线: 空间记忆与动作控制的世界模型基准
      解决的问题: 在循环导航和多样动作空间中测量长期空间一致性、记忆一致性和动作控制。
      尚未覆盖: 基准得分与下游任务表现或真实部署之间的关系尚未展示。
    共识:
    - 面向应用的世界模型越来越多地以生成式序列或视频预测为中心，并共同以提升下游控制或策略效用为目标。
    - 许多方法把世界建模与任务相关信号耦合，例如动作、语言指令、上下文变量、物理目标或多视角一致性。
    - 新近基准开始把长时空间记忆、记忆一致性和动作控制视为短时视觉质量之外的关键缺口。
    - 多篇论文报告了策略训练/评估或零样本泛化提升，但真实世界部署和跨设置迁移大多仍未得到验证。
    分歧:
    - 表示选择不同：随机潜在状态空间/VAE模型、扩散Transformer、统一视频-动作扩散和物理信息生成模型被不同地使用。
    - 监督信号不同：掩码重建、上下文条件、关键点/深度物理任务、语言原语分解和无动作视频预训练分别针对不同能力。
    - 评测设置不同：从Atari样本效率和上下文控制基准，到驾驶数据、机器人数据以及Minecraft式开放域记忆测试，直接比较困难。
    - 方法假设不同：部分方法假设可观测上下文或预定义语言原语，其他方法则学习无动作视频或追求跨数据集/本体零样本迁移。
    开放问题:
    - 开放域基准上的空间/记忆一致性提升，能否转化为更安全或更可靠的驾驶与机器人策略？
    - 组合式机器人世界模型如何泛化到训练未见过的原语组合，并从仿真展开迁移到真实机器人执行？
    - 必须显式表示哪些上下文、物理或本体属性，才能让世界模型外推到未见过动力学，而不只是拟合训练分布？
    - 视频与动作扩散预训练的收益，在分布偏移、长时控制和部分可观测部署下是否仍然稳健？
