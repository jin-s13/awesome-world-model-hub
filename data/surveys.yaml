      what_remains_open: Hardware diversity, training without simulators, independent
        reproduction, and multi-agent or multi-camera scalability.
    consensus:
    - The field converges on world models as generative future-state predictors that
      can support downstream control or evaluation rather than only static perception.
    - There is a shared shift toward action-controllable generation and explicit quantification
