  related_work_outline:
  - 'Mainstream direction: Diffusion-based world models and specialized benchmarks
    for spatial consistency, memory, and action control are driving evaluation beyond
    pixel-level fidelity.'
  - 'Shared research pattern: New benchmarks introduce targeted metrics (e.g., scene
    graph consistency, memory consistency scores) to probe specific world-model capabilities,
    while method papers validate on standard suites like Atari 100k and Nuscenes.'
  - 'Key differences: Evaluation targets diverge—some focus on spatial consistency
    (LoopNav), others on memory and action control (MIND), or on visual detail impact
    for agent performance (DIAMOND). Architectures range from diffusion transformers
    (MaskGWM, DIAMOND) to VAE-Transformer hybrids (STORM) and physics-informed models
    (RoboScape).'
  - 'Trend evolution: From 2023–2026, the field shifted from VAE-Transformer world
    models (STORM) to diffusion-based generation (DIAMOND, MaskGWM), and from generic
    game benchmarks to capability-specific diagnostics (LoopNav, MIND) and physically
    grounded evaluation (RoboScape).'
  - 'Open questions: Whether proxy metrics align with downstream decision utility,
    how benchmark conclusions hold across implementations and compute budgets, and
    whether current task distributions cover real-world deployment settings remain
    unverified.'
  related_work_outline_zh:
  - 主流方向：基于扩散的世界模型以及针对空间一致性、记忆和动作控制的专用基准，正在推动评估超越像素级保真度。
  - 研究共性：新基准引入针对性指标（如场景图一致性分数、记忆一致性分数）来探测世界模型的特定能力，而方法论文则在 Atari 100k、Nuscenes 等标准套件上验证。
  - 关键差异：评测目标分化——有的关注空间一致性（LoopNav），有的关注记忆与动作控制（MIND），有的关注视觉细节对智能体性能的影响（DIAMOND）。架构从扩散
    Transformer（MaskGWM、DIAMOND）到 VAE-Transformer 混合（STORM）和物理信息模型（RoboScape）不等。
  - 趋势演进：2023–2026 年间，领域从 VAE-Transformer 世界模型（STORM）转向基于扩散的生成（DIAMOND、MaskGWM），并从通用游戏基准转向能力专项诊断（LoopNav、MIND）和物理基础评估（RoboScape）。
  - 开放问题：代理指标是否与下游决策效用对齐，基准结论在不同实现和算力预算下是否稳定，当前任务分布是否覆盖真实部署场景，均未得到验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable, e.g., LoopNav for spatial consistency and MIND for memory/action
        control.
      what_remains_open: Whether the task distribution covers the settings where world
        models are expected to help, such as long-horizon, multi-view, and physically
        interactive real-world scenarios.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., Scene Graph Consistency Score and memory
        consistency metrics.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; sensitivity to implementation details
        and compute budgets.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines (Atari 100k,
        Nuscenes) and artifacts, enabling cross-method comparison.
      what_remains_open: Stability of benchmark conclusions across different implementations
        and compute budgets; lack of standardized reporting conventions for world-model
        evaluation.
    consensus:
    - World-model evaluation must go beyond pixel-level reconstruction quality to
      assess structural properties like spatial consistency, temporal memory, and
      action controllability.
    - Standard benchmarks such as Atari 100k and Nuscenes serve as common ground for
      comparing world-model methods, though they may not capture all desired capabilities.
    - Diffusion-based architectures are emerging as a dominant paradigm for world
      models, replacing discrete latent variable approaches.
    disagreements:
    - 'Evaluation targets differ: some works prioritize spatial consistency in navigation,
      others emphasize long-term memory and action control, and still others focus
      on visual detail fidelity for agent training.'
    - 'Representation choices vary: diffusion transformers, VAE-Transformer hybrids,
      and physics-informed keypoint dynamics are used, with no consensus on the optimal
      inductive bias.'
    - 'Interaction modes diverge: some world models are evaluated within RL loops,
      while others are assessed as standalone video generators or pretrained on passive
      data.'
    open_questions:
    - How well do current benchmark metrics (e.g., SGCS, memory consistency scores)
      correlate with downstream task performance in real-world applications?
    - Are benchmark rankings stable when models are re-implemented or trained with
      different compute budgets?
    - Do existing benchmarks cover the full range of real-world deployment conditions,
      including physical interactions, long-horizon planning, and multi-agent settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具备可比性，例如 LoopNav 用于空间一致性，MIND 用于记忆与动作控制。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的真实设置，如长时域、多视角和物理交互场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如场景图一致性分数和记忆一致性指标。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致；对实现细节和算力预算的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线（Atari 100k、Nuscenes）和工件让结果可审计，支持跨方法比较。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；缺乏世界模型评估的标准化报告规范。
    共识:
    - 世界模型评估必须超越像素级重建质量，考察空间一致性、时间记忆和动作可控性等结构属性。
    - Atari 100k 和 Nuscenes 等标准基准是比对世界模型方法的共同基础，但可能无法覆盖所有期望能力。
    - 基于扩散的架构正在取代离散潜变量方法，成为世界模型的主流范式。
    分歧:
    - 评测目标不同：有的优先考虑导航中的空间一致性，有的强调长期记忆和动作控制，还有的关注视觉细节对智能体训练的影响。
    - 表示方式选择多样：扩散 Transformer、VAE-Transformer 混合以及物理信息关键点动力学并存，尚无最优归纳偏置的共识。
    - 交互模式分化：部分世界模型在 RL 循环中评估，其他则作为独立视频生成器或基于被动数据预训练进行评估。
    开放问题:
    - 当前基准指标（如 SGCS、记忆一致性分数）与真实应用下游任务性能的相关性如何？
    - 当模型被重新实现或使用不同算力预算训练时，基准排名是否稳定？
    - 现有基准是否覆盖了真实部署条件的全部范围，包括物理交互、长时域规划和多智能体设置？
