  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving simulation systems
      what_it_solves: Produce future driving frames from trajectory or control inputs
        for closed-loop evaluation and policy validation.
      what_remains_open: Evidence is concentrated on nuScenes; long-horizon cross-view
        consistency, distribution shifts, and multi-GPU deployment are not demonstrated.
    - line: Benchmarks for spatial and action fidelity
      what_it_solves: Quantify whether world models preserve geometry, topology, and
        action commands, not only pixel-level similarity.
      what_remains_open: Some benchmark papers report no experimental results or limited
        baseline coverage; broader environment coverage remains missing.
    - line: Contextual, physics-informed, and embodied world-model architectures
      what_it_solves: Improve zero-shot generalization, physical plausibility, and
        visual fidelity by integrating context, depth, keypoint dynamics, or embodiment
        priors.
      what_remains_open: Assumptions such as observable context restrict real applicability;
        evaluations are often narrow or limitation details are absent.
    - line: Cross-embodiment large-scale pretraining systems
      what_it_solves: Use shared latent action interfaces to pretrain on heterogeneous
        human, robot, and simulation video and adapt to target robots.
      what_remains_open: Reproducibility signals are weak for a large-scale pretraining
        system; independent validation across platforms is not shown.
    consensus:
    - World models are positioned as executable predictive systems, with value judged
      by downstream control, policy success, or action and geometry consistency rather
      than visual quality alone.
    - Action conditioning and controllability are treated as core requirements for
      driving and robot simulation.
    - Evaluation relies on public datasets or newly introduced benchmarks, often paired
      with open-source artifacts.
    - Multiple works improve long-horizon coherence and fidelity through architectural
      or training modifications such as latent replacement, recurrent context, or
      autoregressive conditioning.
    disagreements:
    - 'Evaluation targets differ: some use scene-graph scores for spatial consistency,
      some use trajectory-conditioned video for action fidelity, some use FID/FVD
      for visual fidelity, and some use robot policy success rates.'
    - 'Supervision and representation differ: explicit observable context values,
      physics-oriented depth or keypoint supervision, trajectory controls, or universal
      latent actions.'
    - 'Deployment assumptions differ: offline dataset evaluation, closed-loop single-GPU
      low-latency serving, or real-robot adaptation with synthetic data generation.'
    open_questions:
    - Can current action-controllable world models generalize beyond the reported
      benchmark environments such as nuScenes, two CARL tasks, and Minecraft LoopNav?
    - How stable are spatial and action consistency over very long closed-loop rollouts
      under distribution shift?
    - Where are limitation details and independent reproduction evidence for systems
      whose reproducibility signals or experimental coverage are incomplete?
    - What are the system-level trade-offs when scaling from single-GPU real-time
      driving simulation to multi-agent or multi-embodiment deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的驾驶仿真系统
      解决的问题: 根据轨迹或控制输入生成未来驾驶帧，用于闭环评测和策略验证。
      尚未覆盖: 证据集中在nuScenes；长时域跨视角一致性、分布外场景和多GPU部署未充分验证。
    - 路线: 空间一致性与动作忠实度基准
      解决的问题: 量化世界模型是否保持几何、拓扑和动作指令，而不仅是像素相似度。
      尚未覆盖: 部分基准论文未报告实验结果或基线覆盖有限，环境覆盖仍不足。
    - 路线: 上下文、物理信息与具身世界模型架构
      解决的问题: 通过上下文、深度、关键点动力学或具身先验改进零样本泛化、物理合理性和视觉保真度。
      尚未覆盖: 可观测上下文等假设限制实际适用；评测范围较窄或局限性缺失。
    - 路线: 跨具身大规模预训练系统
      解决的问题: 使用共享潜在动作接口在异构人、机器人与仿真视频上预训练并适配目标机器人。
      尚未覆盖: 大规模系统的复现信号较弱，跨平台独立验证尚未展示。
    共识:
    - 世界模型被定位为可执行的预测系统，其价值由下游控制、策略成功率或动作与几何一致性判断，而非仅凭视觉质量。
    - 动作条件化与可控性被视作驾驶和机器人仿真的核心要求。
    - 评测依赖公开数据集或新提出的基准，并常配合开源工件。
    - 多项工作通过潜在替换、循环上下文或自回归条件等架构与训练修改来提升长时域一致性和保真度。
    分歧:
    - 评测目标不同：有的用场景图得分测空间一致性，有的用轨迹条件视频测动作忠实度，有的用FID/FVD测视觉保真度，有的用机器人策略成功率测任务表现。
    - 监督与表示不同：显式可观测上下文、物理导向的深度或关键点监督、轨迹控制或通用潜在动作。
    - 部署假设不同：离线数据集评测、闭环单GPU低延迟服务、真实机器人适配与合成数据生成。
    开放问题:
    - 当前动作可控世界模型能否在nuScenes、两个CARL任务和Minecraft LoopNav之外的基准环境中泛化？
    - 在极长闭环推演和分布偏移下，空间与动作一致性是否仍然稳定？
    - 复现信号或实验覆盖不完整的系统，其局限性与独立复现证据在哪里？
    - 从单GPU实时驾驶仿真扩展到多智能体或多具身部署时，系统级权衡是什么？
