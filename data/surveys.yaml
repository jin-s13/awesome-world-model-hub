  related_work_outline:
  - 'Mainstream direction: Video generation conditioned on actions is the dominant
    instantiation of world models, with growing emphasis on physical alignment and
    reward-based post-training.'
  - 'Shared research pattern: Models generate future frames from past observations
    and actions, then verify or align outputs through verifiers, reward models, or
    preference optimization.'
  - 'Key differences: Architectures diverge into diffusion transformers, masked autoregression,
    and adapter-based pretrained video models; alignment strategies differ between
    test-time verifiers, multi-dimensional reward models, and DPO post-training.'
  - 'Trend evolution: From 2024 to 2026, work shifts from purely video-fidelity world
    models to those enforcing physical plausibility, introducing functional benchmarks,
    and analyzing test-time scaling failures.'
  - 'Open questions: Whether video generation suffices for causal reasoning, how alignment
    guarantees transfer across tasks, and how to standardize functional benchmarks
    beyond visual quality.'
  related_work_outline_zh:
  - 主流方向：以动作为条件的视频生成是当前世界模型的主要实现形式，并越来越强调物理对齐和基于奖励的后训练。
  - 研究共性：模型根据过去观测和动作生成未来帧，然后通过验证器、奖励模型或偏好优化来验证或对齐输出。
  - 关键差异：架构上分为扩散Transformer、掩码自回归和基于适配器的预训练视频模型；对齐策略有测试时验证器、多维奖励模型和DPO后训练之分。
  - 趋势演进：从2024到2026年，工作从纯视频保真度的世界模型转向强制物理合理性的模型，引入功能基准，并分析测试时缩放失败原因。
  - 开放问题：视频生成是否足以支撑因果推理，对齐保证如何跨任务迁移，以及如何标准化功能基准以超越视觉质量。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions via video generation as world models
      what_it_solves: Establishes that world models can be operationalized as action-conditioned
        video generators, unifying policy, forward dynamics, and inverse dynamics
        within a single architecture.
      what_remains_open: Whether these formalized capabilities capture true causal
        structure or merely exploit visual correlations, and whether the assumptions
        hold in real-world, non-stationary environments.
    - line: Scaling and alignment guarantees for world model outputs
      what_it_solves: Connects world model behavior to desired properties through
        test-time verifiers, multi-dimensional reward models, or preference optimization,
        aiming to improve physical plausibility and task consistency.
      what_remains_open: Direct validation that these guarantees predict failures
        and generalize across tasks is missing; test-time scaling fails on some benchmarks,
        indicating an information bottleneck in current models.
    - line: Conceptual taxonomy of world models
      what_it_solves: Organizes world model approaches into state construction (implicit/explicit)
        and dynamics modeling, and advocates for functional benchmarks over visual
        fidelity metrics.
      what_remains_open: Whether the taxonomy changes how researchers design or evaluate
        models remains unquantified; the transition to functional benchmarks is still
        in early stages.
    consensus:
    - World models are predominantly built as video generation models conditioned
      on actions and past observations.
    - Current evaluation metrics (e.g., FVD, PSNR) are insufficient to assess physical
      persistence, causality, and task-oriented reasoning.
    - Post-training alignment, whether through reward models, verifiers, or preference
      optimization, can significantly improve the physical plausibility and logical
      coherence of generated rollouts.
    - Explicit state construction is largely absent in current video generation models,
      creating a gap with classical world model theories.
    disagreements:
    - 'Architectural choices: some use diffusion transformers with decoupled temporal
      and spatial blocks, others adopt masked autoregression, and still others adapt
      frozen pretrained video diffusion models via learned masks.'
    - 'Alignment strategies: one line uses test-time verifiers that ground rewards
      in spatial assertions, another trains hierarchical multi-dimensional reward
      models, and a third applies DPO-based post-training with decoupled discriminators.'
    - 'Evaluation priorities: some works focus on visual fidelity and controllability
      for robot manipulation, while others target spatial reasoning accuracy, and
      yet others advocate for zero-shot physical plausibility benchmarks.'
    open_questions:
    - Can world models learn explicit state representations that support long-horizon
      causal reasoning, or are they merely video predictors with limited physical
      understanding?
    - Under what conditions do alignment methods (reward models, verifiers) transfer
      across tasks and embodiments, and how can their failure modes be systematically
      detected?
    - How can functional benchmarks be designed to reliably measure persistence and
      causality, and what would drive their adoption over traditional visual quality
      metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于视频生成的世界模型形式化定义与假设
      解决的问题: 确立世界模型可被实施为动作条件的视频生成器，在单一架构中统一策略、前向动力学和逆动力学。
      尚未覆盖: 这些形式化能力是否捕捉了真实的因果结构，还是仅利用了视觉相关性，以及这些假设在真实非平稳环境中是否成立。
    - 路线: 世界模型输出的缩放与对齐保证
      解决的问题: 通过测试时验证器、多维奖励模型或偏好优化，将世界模型行为与期望属性连接起来，旨在提升物理合理性和任务一致性。
      尚未覆盖: 缺乏直接验证这些保证能否预测失败并跨任务泛化；测试时缩放在某些基准上失败，表明现有模型存在信息瓶颈。
    - 路线: 世界模型的概念分类
      解决的问题: 将世界模型方法组织为状态构建（隐式/显式）和动态建模，并倡导以功能基准替代视觉保真度指标。
      尚未覆盖: 该分类法是否改变研究者设计和评估模型的方式尚未量化；向功能基准的过渡仍处于早期阶段。
    共识:
    - 世界模型主要被构建为以动作和过去观测为条件的视频生成模型。
    - 当前评估指标（如FVD、PSNR）不足以评估物理持久性、因果性和任务导向推理。
    - 通过奖励模型、验证器或偏好优化进行的后训练对齐，可显著改善生成轨迹的物理合理性和逻辑一致性。
    - 当前的视频生成模型普遍缺乏显式状态构建，与经典世界模型理论存在差距。
    分歧:
    - 架构选择：一些使用解耦时空块的扩散Transformer，另一些采用掩码自回归，还有一些通过学习的掩码适配冻结的预训练视频扩散模型。
    - 对齐策略：一条路线使用将奖励建立在空间断言上的测试时验证器，另一条训练分层的多维奖励模型，第三条使用基于DPO的解耦判别器后训练。
    - 评估重点：部分工作关注机器人操作中的视觉保真度和可控性，其他则聚焦空间推理精度，还有提倡零样本物理合理性基准。
    开放问题:
    - 世界模型能否学习支持长期因果推理的显式状态表示，还是仅作为物理理解有限的视频预测器？
    - 对齐方法（奖励模型、验证器）在什么条件下可跨任务和本体迁移，如何系统检测其失效模式？
    - 如何设计能可靠测量持久性和因果性的功能基准，什么因素能推动其取代传统视觉质量指标？
