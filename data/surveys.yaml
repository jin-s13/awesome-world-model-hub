  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned or loop-based datasets that
        make world-model consistency claims comparable across scenes and viewpoints.
      what_remains_open: Coverage is not yet shown for open-domain, long-horizon,
        and cross-action-space settings where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual fidelity, and zero-shot policy generalization beyond aggregate game
        scores.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        quality or long-horizon control is not established.
    - line: Comparable baselines and reporting
      what_it_solves: Produces standardized baselines and released artifacts so world-model
        results are auditable across implementations.
      what_remains_open: Stability of conclusions across compute budgets, implementations,
        and missing limitation or result details remains uncertain.
    consensus:
    - Evaluations increasingly combine action-conditioned generation, loop or revisit
      structure, and held-out scenes to test consistency rather than only single-frame
      realism.
    - Diffusion and transformer-based world models are compared on standardized benchmarks
      such as Atari 100k, CARL, NuScenes, OpenDV-2K, and Waymo using relative or human-normalized
      scores.
    - Several works provide code or dataset artifacts, but many limitation fields
      are empty or do not clarify boundary failures.
    - Generalization is commonly probed through unseen context values, zero-shot scenes,
      or long-horizon rollout.
    - Score prominence in this packet appears driven more by recency, methodology,
      and repository signals than by citation evidence because OpenAlex metadata is
      largely unavailable.
    disagreements:
    - 'Representation choices differ: discrete latent sequence models, diffusion-based
      generation, and coupled video-action diffusion are used for world dynamics.'
    - 'Supervision signals differ: observable context values, temporal depth and keypoint
      dynamics, action-free video, and shared action spaces each drive learning.'
    - 'Evaluation targets differ: policy performance, scene-graph consistency, memory
      and action control, or visual and physical plausibility are used as core measures.'
    - 'Deployment settings differ: Atari, Minecraft navigation, driving, robotics,
      and contextual reinforcement learning create different interaction and measurement
      assumptions.'
    open_questions:
    - Do scene-graph, spatial-consistency, or memory-control metrics predict downstream
      decision utility in open-domain tasks?
    - How well do current datasets cover long-horizon, cross-action-space, and multi-view
      conditions outside their collection settings?
    - Are reported benchmark rankings stable across different implementations and
      compute budgets when citation and artifact coverage vary?
    - Can context-conditioned world models generalize when the context values are
      not directly observable?
    - Why are limitation fields missing or sparse for many high-scoring world-model
      methods, and what boundary failures remain unmeasured?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的、动作条件或循环式数据集，使世界模型在空间、记忆和控制上的一致性主张可比较。
      尚未覆盖: 尚未证明覆盖开放域、长时域和跨动作空间等世界模型预期发挥作用的真实设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在单一总分之外检验空间一致性、记忆一致性、动作控制、视觉保真度和零样本策略泛化。
      尚未覆盖: 代理指标与用户真正关心的下游决策质量或长期控制之间是否一致，尚未建立证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、公开代码或数据集和报告约定，让世界模型结果可审计。
      尚未覆盖: 不同实现和算力预算下结论是否稳定，以及缺失的局限性和结果细节，仍缺少证据。
    共识:
    - 评估越来越强调动作条件生成、循环/再访问结构和保留场景，而不是只看单帧真实度。
    - 扩散和Transformer世界模型在Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo等标准基准上报告相对分数或人类归一化分数。
    - 多项工作提供代码或数据集工件，但很多方法的局限性字段为空或未说明失败边界。
    - 泛化通常通过未见上下文、零样本场景或长时域展开来检验。
    - 本证据包中的排名靠前主要由新颖性、方法论和仓库信号驱动，因为OpenAlex元数据大多缺失，引用证据有限。
    分歧:
    - 表示方式不同：离散潜变量序列模型、扩散生成和视频-动作耦合扩散分别用于建模世界动力学。
