  related_work_outline:
  - 'Mainstream direction: Autonomous driving and robotics dominate world model applications,
    with video generation via diffusion Transformers as the core technique.'
  - 'Shared research pattern: Learning to predict future frames conditioned on actions
    or language, then evaluating on visual fidelity, control, or task success.'
  - 'Key differences: Application domains (driving, robotic manipulation, games) and
    evaluation metrics (visual quality, spatial consistency, memory consistency, physical
    plausibility).'
  - 'Trend evolution: Shift from game-based world models (Atari) to complex driving
    and robot scenarios, and from pure generation quality to comprehensive benchmarks
    measuring memory and action control.'
  - 'Open questions: Whether simulation gains transfer to real-world safety, how to
    maintain long-term memory consistency, and generalization to unseen physical primitives
    or environments.'
  related_work_outline_zh:
  - 主流方向：自动驾驶和机器人是世界模型应用的主导领域，以扩散变换器为核心技术进行视频生成。
  - 研究共性：基于动作或语言条件预测未来帧，然后通过视觉保真度、控制能力或任务成功率进行评估。
  - 关键差异：应用领域（驾驶、机器人操作、游戏）和评估指标（视觉质量、空间一致性、记忆一致性、物理合理性）不同。
  - 趋势演进：从基于游戏的世界模型（Atari）转向复杂的驾驶和机器人场景，从纯生成质量转向综合评估记忆和动作控制的基准测试。
  - 开放问题：仿真收益能否转化为真实世界安全，如何维持长期记忆一致性，以及向未见物理原语或环境的泛化能力。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Scene prediction and closed-loop simulation for driving policy
        evaluation, using diffusion transformers and mask reconstruction for long-horizon
        video generation.
      what_remains_open: Alignment between simulator-based improvements and real-world
        safety or operational metrics; zero-shot transfer across different driving
        datasets and sensor setups.
    - line: Embodied robot world models
      what_it_solves: Video generation conditioned on language and actions for robotic
        task planning, leveraging compositional decomposition, physics-informed learning,
        or unified diffusion of video and actions.
      what_remains_open: Generalization beyond seen primitive combinations; reliance
        on simulation and limited real-robot validation; handling fully novel physical
        properties or instructions.
    - line: Interactive agent world models for games and navigation
      what_it_solves: Efficient policy learning from imagined rollouts in Atari or
        Minecraft, and evaluation of spatial/memory consistency in open worlds.
      what_remains_open: Long-term memory stability across environment changes; generalization
        when game rules, goals, or user interactions change; transfer from navigation
        benchmarks to diverse interactive tasks.
    - line: Benchmarks for world model consistency and control
      what_it_solves: Quantifying spatial consistency (LoopNav) and memory consistency
        with action control (MIND) to reveal limitations of current models.
      what_remains_open: Coverage of diverse real-world dynamics; scalability to multi-agent
        or long-horizon scenarios; integration with physical safety constraints.
    consensus:
    - World models in applications are predominantly video generation models conditioned
      on actions or language, often built on diffusion or Transformer architectures.
    - Pretraining on large-scale datasets (e.g., driving or robotic manipulation videos)
      improves generalization and robustness of learned policies.
    - Combining visual generation with auxiliary tasks such as depth prediction, keypoint
      dynamics, or mask reconstruction enhances physical plausibility.
    - Evaluation is moving beyond pixel-level fidelity to encompass spatial, temporal,
      and memory consistency, as well as action controllability.
    disagreements:
    - 'Evaluation targets differ: some works optimize for visual quality (FID, PSNR),
      others for task success rate, physical plausibility, or spatial consistency
      scores.'
    - 'Supervision signals vary: driving models use video and vehicle actions; robot
      models use language instructions and embodiment-specific actions; game models
      use environment rewards or navigation loops.'
    - 'Generalization strategies differ: compositional decomposition of primitives
      (RoboDreamer), context-conditioned latent dynamics (cRSSM), or independent diffusion
      timesteps (UWM).'
    - 'Physical grounding is handled differently: explicit depth and keypoint learning
      (RoboScape) vs implicit physics in video generation (MaskGWM) vs no explicit
      physics (STORM).'
    open_questions:
    - Can improvements in driving world model simulations consistently translate to
      reduced real-world accident rates or operational safety gains?
    - How can world models maintain long-term memory and spatial consistency across
      extended trajectories with changing viewpoints and actions?
    - What evaluation protocols can capture generalization to entirely novel physical
      primitives, environments, or tasks not seen during training?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 用于驾驶策略评估的场景预测和闭环仿真，通过扩散变换器和掩码重建实现长时域视频生成。
      尚未覆盖: 仿真提升与真实世界安全或运营指标的一致性；跨不同驾驶数据集和传感器设置的零样本迁移。
    - 路线: 具身机器人世界模型
      解决的问题: 基于语言和动作条件的视频生成，用于机器人任务规划，利用组合分解、物理信息学习或视频与动作的统一扩散。
      尚未覆盖: 超出已见原语组合的泛化；依赖仿真且真实机器人验证有限；处理全新物理特性或指令。
    - 路线: 交互式智能体世界模型（游戏与导航）
      解决的问题: 通过想象推演在Atari或Minecraft中高效学习策略，并评估开放世界中的空间/记忆一致性。
      尚未覆盖: 环境变化下的长期记忆稳定性；游戏规则、目标或用户交互变化时的泛化；从导航基准到多样化交互任务的迁移。
    - 路线: 世界模型一致性与控制基准
      解决的问题: 量化空间一致性（LoopNav）和记忆一致性与动作控制（MIND），以揭示当前模型的局限性。
      尚未覆盖: 覆盖多样的真实世界动力学；扩展到多智能体或长时域场景；与物理安全约束的整合。
    共识:
    - 应用中的世界模型主要是以动作或语言为条件的视频生成模型，通常基于扩散或Transformer架构。
    - 在大规模数据集（如驾驶或机器人操作视频）上预训练可提升所学策略的泛化性和鲁棒性。
    - 将视觉生成与深度预测、关键点动力学或掩码重建等辅助任务结合，可增强物理合理性。
    - 评估正从像素级保真度转向涵盖空间、时间和记忆一致性以及动作可控性。
    分歧:
    - 评估目标不同：部分工作优化视觉质量（FID、PSNR），另一些关注任务成功率、物理合理性或空间一致性分数。
    - 监督信号各异：驾驶模型使用视频和车辆动作；机器人模型使用语言指令和本体特定动作；游戏模型使用环境奖励或导航循环。
    - 泛化策略不同：原语组合分解（RoboDreamer）、上下文条件潜在动力学（cRSSM）或独立扩散时间步（UWM）。
    - 物理基础处理方式不同：显式深度和关键点学习（RoboScape） vs 视频生成中的隐式物理（MaskGWM） vs 无显式物理（STORM）。
    开放问题:
    - 驾驶世界模型仿真性能的提升能否持续转化为真实世界事故率降低或运营安全收益？
    - 世界模型如何在视角和动作变化的长时间轨迹中保持长期记忆和空间一致性？
    - 什么样的评估协议能捕捉到对训练中未见过的全新物理原语、环境或任务的泛化能力？
