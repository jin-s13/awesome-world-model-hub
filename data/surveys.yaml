  related_work_outline:
  - 'Mainstream direction: Recent work centers on transformer/diffusion world models
    for video prediction and embodied simulation, adding auxiliary objectives such
    as mask reconstruction, depth/key point dynamics, and action diffusion to improve
    fidelity and control.'
  - 'Shared research pattern: The evidence converges on moving beyond pure pixel reconstruction
    by conditioning generative video or latent dynamics on context, language primitives,
    physics cues, or actions.'
  - 'Key differences: Some approaches learn compact recurrent latent dynamics for
    sample-efficient RL, while others use pixel-space or transformer video generation;
    evaluations range from Atari and contextual RL to driving, robot, and open-domain
    consistency settings.'
  - 'Trend evolution: Within this packet, the frontier shifts from stochastic transformer
    world models for Atari around 2023 toward diffusion-based embodied and driving
    world models plus memory/spatial/action consistency evaluations through 2025-2026.'
  - 'Open questions: It remains unclear whether consistency and auxiliary-objective
    gains transfer to closed-loop control, real-robot execution, unseen contexts/primitives,
    and whether evaluation scores predict downstream policy performance.'
  related_work_outline_zh:
  - 主流方向：以Transformer和扩散为基础，构建面向驾驶、机器人和开放域的生成式世界模型，并引入掩码重建、深度/关键点、动作扩散等辅助目标。
  - 研究共性：多篇近期工作不再只做像素重建，而是加入空间一致性、物理信息、上下文或动作条件，以提升预测、控制或泛化。
  - 关键差异：有的学习紧凑潜在循环动力学用于样本高效强化学习，有的使用像素或Transformer视频生成；评测从Atari和上下文RL延伸到驾驶、机器人和开放域一致性场景。
  - 趋势演进：证据前沿从2023年面向Atari的随机Transformer世界模型，演进到2024-2026年的具身/驾驶扩散世界模型与记忆/空间/动作控制评测。
  - 开放问题：一致性和辅助目标收益是否能迁移到闭环控制、真实机器人执行、未见过上下文/原语，以及评测分数能否预测下游策略表现仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion/transformer video world models with auxiliary reconstruction
        objectives
      what_it_solves: Improving long-horizon and multi-view video prediction fidelity
        by adding mask reconstruction or spatiotemporal consistency tasks
      what_remains_open: Whether gains transfer beyond driving/view synthesis settings
        and into closed-loop action interfaces
    - line: Contextual and stochastic latent world models for sample-efficient reinforcement
        learning
      what_it_solves: Compressing observed dynamics into recurrent/transformer latent
        models for policy learning and zero-shot context generalization
      what_remains_open: Context observability assumptions and limited task diversity
        leave unseen-dynamics generalization unverified
    - line: Compositional and physics-informed embodied world models
      what_it_solves: Factorizing video generation by language primitives or physics
        cues to support robot imagination and unseen goal synthesis
      what_remains_open: Generalization to entirely new primitives and real-robot
        execution beyond simulation remain underevidenced
    - line: Unified video-action diffusion dynamics
      what_it_solves: Coupling video and action diffusion in a shared transformer
        to represent policy, forward/inverse dynamics, and video generation
      what_remains_open: Ablation evidence isolating coupling benefits from large-scale
        pretraining and action-free video learning is incomplete
    - line: Evaluation protocols for consistency and action control
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control in open-domain loop-based or revisited settings
      what_remains_open: Whether higher consistency/control scores predict downstream
        policy training or deployment improvements is not yet established
    consensus:
    - World models are moving beyond pure pixel reconstruction toward auxiliary objectives
      that enforce temporal, spatial, physical, or action-conditioned consistency.
    - Generative video and latent dynamics are used as a substrate for policy learning,
      planning, or robot/driving simulation, not only for open-loop video quality.
    - Recent work agrees that large-scale visual or embodied datasets and transformer/diffusion
      backbones improve generalization, but consistency and control metrics are still
      consolidating.
    disagreements:
    - 'Representation differs: compact recurrent latent dynamics versus pixel-space
      or transformer diffusion video generation.'
    - 'Supervision and auxiliary signals differ: context values, language primitives,
      depth/key point physics, mask reconstruction, or action diffusion.'
    - 'Evaluation targets differ: Atari and contextual RL scores versus driving/robot
      video fidelity and open-domain consistency/control metrics.'
    - 'Interaction mode differs: open-loop video prediction, closed-loop action-conditioned
      generation, and unified video-action modeling.'
    open_questions:
    - Do auxiliary consistency objectives improve closed-loop control or only video
      prediction metrics on current evaluation settings?
    - Can context-conditioned latent world models generalize beyond observed context
      values and beyond the reported small task sets?
    - Do compositionality and physics-informed cues support entirely unseen primitives
      and real-world robot execution?
    - What levels of memory, spatial consistency, and action control are necessary
      or sufficient for downstream policy training and deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 扩散/Transformer视频世界模型与辅助重建目标
      解决的问题: 通过掩码重建或时空一致性任务提升长时域和多视角视频预测保真度
      尚未覆盖: 收益能否迁移到驾驶/视图合成之外以及闭环动作接口尚不明确
    - 路线: 面向样本高效强化学习的上下文与随机潜在世界模型
      解决的问题: 将观测动力学压缩为循环/Transformer潜在模型，用于策略学习和零样本上下文泛化
      尚未覆盖: 上下文可观测假设和有限任务多样性使未见过动力学泛化未被验证
    - 路线: 组合式与物理信息具身世界模型
      解决的问题: 用语言原语或物理线索分解视频生成，支持机器人想象与未见过目标合成
      尚未覆盖: 全新原语和仿真之外的实体机器人执行仍然证据不足
    - 路线: 统一视频-动作扩散动力学
      解决的问题: 在共享Transformer中耦合视频与动作扩散，表示策略、前向/逆向动力学和视频生成
      尚未覆盖: 隔离耦合收益与大规模预训练、无动作视频学习贡献的消融证据仍不完整
    - 路线: 一致性与动作控制评测协议
      解决的问题: 在开放域循环或重访场景中度量空间一致性、记忆一致性和动作控制
      尚未覆盖: 更高的一致性/控制分数能否预测下游策略训练或部署提升尚未建立
    共识:
    - 世界模型正从纯像素重建转向时空、物理、动作条件等辅助目标。
    - 生成视频和潜在动力学被用于策略学习、规划或机器人/驾驶仿真，而不只用于开环画质。
    - 近期工作多采用大规模视觉或具身数据和Transformer/扩散骨干，但一致性和控制指标仍在整合中。
    分歧:
    - 表示方式不同：紧凑循环潜在动力学与像素空间或Transformer扩散视频生成并存。
    - 监督信号不同：上下文值、语言原语、深度/关键点物理、掩码重建和动作扩散各不一样。
    - 评测目标不同：Atari和上下文RL分数与驾驶/机器人视频保真、开放域一致性/控制指标难以直接比较。
    - 交互模式不同：开环视频预测、闭环动作条件生成和统一视频-动作建模各有差异。
    开放问题:
    - 辅助一致性目标改善的是闭环控制，还是仅提升当前评测场景中的视频指标？
    - 上下文条件潜在世界模型能否超越已观测上下文值和报告中的少量任务场景？
    - 组合性与物理信息提示能否支持全新原语和真实机器人执行？
    - 记忆、空间一致性和动作控制需要达到什么程度才能保证下游策略训练和部署？
