  related_work_outline_zh:
  - 主流方向：学习可动作控制、高保真的世界模型或视频模拟器，用于自动驾驶和机器人闭环训练与评估。
  - 研究共性：将生成模型扩展为可运行模拟器，并加入动作条件、物理一致性或空间一致性目标及基准和系统约束。
  - 关键差异：应用域、控制接口、监督信号、评测目标与部署设置不同，尚未形成统一的系统或指标。
  - 趋势演进：可见重点集中在2022-2026年，从物理机器人上的模型强化学习转向大规模闭环驾驶与世界模型模拟器及基准工件。
  - 开放问题：有限数据集之外的泛化、长时程自回归一致性、独立复现和速度-保真度-可控性权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turns model ideas into end-to-end workflows for data, training,
        inference, and evaluation; evidence includes world-model simulators for driving
        and robot policy learning.
      what_remains_open: Whether the stack survives external deployment, hardware
        changes, and user-specific settings; many evaluations stay on limited benchmarks
        or a small set of robot platforms.
    - line: Real-time and interactive serving
      what_it_solves: Meets latency and interactivity requirements for closed-loop
        simulation and robot control; some systems report sub-second single-GPU inference
        or online physical-robot learning.
      what_remains_open: Trade-offs among speed, fidelity, controllability, and system
        complexity; long-horizon autoregressive rollout degradation remains unresolved.
    - line: Artifacts and reproducible engineering
      what_it_solves: Makes systems inspectable and reusable through datasets, benchmarks,
        code, and evaluation artifacts; several works provide open evaluation frameworks
        or spatial-consistency benchmarks.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        environments; some papers omit limitation details or lack artifact signals,
        leaving verification gaps.
    consensus:
    - Recent work treats learned video or world models as controllable simulators
      for closed-loop evaluation and policy learning rather than only as media generators.
    - There is convergent emphasis on action conditioning and explicit auxiliary objectives
      such as physics, spatial consistency, or motion modeling to improve dynamic
      plausibility.
    - Fidelity, action adherence, and deployment latency are treated as core system-level
      evaluation dimensions, with datasets and benchmarks used as shared validation
      artifacts.
    - Open code and artifacts are becoming expected for reuse, although independent
      reproduction remains underevidenced.
    disagreements:
    - 'They operate in different domains: autonomous driving, physical robot manipulation
      and locomotion, open-world navigation, and game-like environments impose different
      sensor and action requirements.'
    - 'Control interfaces differ: high-level driving commands, goal points or trajectories,
      robot actions, observable context values, and loop-navigation actions are conditioned
      in mutually incompatible ways.'
    - 'Supervision signals differ: some use imitation from trajectory-annotated video,
      some use online interaction or reinforcement on physical robots, and some use
      pretrained video models with lightweight action modules.'
    - 'Evaluation targets differ: visual fidelity metrics, action fidelity, spatial
      consistency, physical plausibility, and real-robot task success are used separately
      rather than unified.'
    - 'Deployment settings differ: real-time single-GPU closed-loop serving, online
      physical-robot learning without simulators, and offline benchmark evaluation
      impose different constraints.'
    open_questions:
    - How well do learned world-model simulators generalize beyond nuScenes, CARL,
      Minecraft, or a small set of physical robots to unseen environments, sensors,
      and dynamics?
    - Can long-horizon closed-loop generation remain spatially, physically, and action-consistent
      under iterative autoregression without accumulating errors?
    - What minimum artifact and reporting standards are needed for independent reproduction
      across teams and infrastructure?
    - How should speed, fidelity, controllability, and system complexity be traded
      off in real deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型想法转化为覆盖数据、训练、推理和评测的端到端工作流；证据包括驾驶模拟器和机器人策略学习系统。
      尚未覆盖: 系统栈能否在外部部署、硬件变化和用户特定设置下保持可靠；多数评测仍限于nuScenes或少量机器人平台。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环模拟与机器人控制中的延迟和交互要求；部分系统报告单GPU亚秒级推理或物理机器人在线学习。
      尚未覆盖: 速度、保真度、可控性和系统复杂度之间的权衡；长时程自回归推演中的退化仍未解决。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、数据集、基准和评测工件使系统可检查、可复用；若干工作提供开放评估框架或空间一致性基准。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现；部分论文未报告局限或缺少工件信号，构成验证缺口。
    共识:
    - 近期工作将学习得到的视频或世界模型视为闭环评估和策略学习的可运行模拟器，而非仅作视频生成器。
    - 多篇论文都强调动作条件化和显式辅助目标，如物理、空间一致性或运动建模，以提升动态合理性。
    - 保真度、动作遵循度和部署延迟被视为核心系统评测维度，并以数据集或基准作为共享验证手段。
    - 开放代码和工件逐渐成为复现预期，但独立复现的证据仍不足。
    分歧:
    - 运行域不同：自动驾驶、物理机器人操作与移动、开放世界导航和游戏类环境对传感器和动作的需求不同。
    - 控制接口不同：高层驾驶指令、目标点或轨迹、机器人动作、可观测上下文值和循环导航动作相互不能直接迁移。
    - 监督信号不同：有的依赖轨迹标注视频的模仿，有的使用物理机器人在线交互或强化学习，有的基于预训练视频模型加入轻量动作模块。
    - 评测目标不同：视觉保真度指标、动作忠实度、空间一致性、物理合理性和真实机器人任务成功度被分别使用，缺乏统一标准。
    - 部署设置不同：单GPU实时闭环、无模拟器在线机器人学习和离线基准评测对系统约束各不一致。
    开放问题:
    - 学习式世界模型模拟器在nuScenes、CARL、Minecraft或少量物理机器人之外的未见环境、传感器和动力学上能否泛化？
    - 长时程闭环生成在迭代自回归下如何保持空间、物理和动作一致性而不积累误差？
    - 实现跨团队、跨基础设施的独立复现需要哪些最低限度的工件和报告标准？
    - 真实部署中应如何权衡速度、保真度、可控性和系统复杂度？
