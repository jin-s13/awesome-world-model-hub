  related_work_outline:
  - 'Mainstream direction: the current frontier centers on evaluating generative dynamics
    through standardized benchmarks and targeted datasets; LoopNav and MIND exemplify
    dedicated open-domain protocols, while Atari 100k, NuScenes, OpenDV-2K, Waymo,
    and CARL serve as common comparison settings.'
  - 'Shared research pattern: works increasingly pair video observations with actions
    and report consistency, control, fidelity, or downstream policy metrics rather
    than only reconstruction loss.'
  - 'Key differences: evaluation targets split among spatial consistency, memory/action
    control, visual detail, physics plausibility, and downstream agent utility; training
    and representation signals include mask reconstruction, diffusion generation,
    context-conditioned latent dynamics, VAE/Transformer modeling, keypoint dynamics,
    and temporal depth.'
  - 'Trend evolution: from 2023-2025 performance reporting on Atari and driving benchmarks
    toward 2025-2026 dedicated open-domain stress tests for memory, action control,
    and long-horizon multi-view consistency.'
  - 'Open questions: metric-to-decision alignment, coverage of real deployment and
    action-free or partially observable settings, stability under reimplementation
    and compute variability, and missing limitation/baseline evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在生成动力学的评估，通过标准化基准和专用数据集检验一致性与控制能力；LoopNav、MIND 是专用协议代表，Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL
    是常见比较环境。
  - 研究共性：多篇工作将视频观察与动作配对，报告一致性、控制、保真度或下游策略指标，而不是只报告重建损失。
  - 关键差异：评估目标在空间一致性、记忆/动作控制、视觉细节、物理合理性和下游智能体效用之间分化；训练信号涉及掩码重建、扩散生成、上下文条件潜动力学、VAE/Transformer、关键点动力学和时间深度。
  - 趋势演进：从 2023-2025 年以 Atari 和驾驶基准为主的性能报告，走向 2025-2026 年面向记忆、动作控制和长时程多视角一致性的专用开放域压力测试。
  - 开放问题：指标与真实决策的对齐、真实部署及无动作或部分可观测设置的覆盖、不同实现与算力下的结论稳定性，以及局限性和基线证据缺失都仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Constructs shared action-conditioned video and navigation tasks,
        such as loop-based navigation and open-domain closed-loop videos, making consistency
        claims comparable across scenes and viewpoints.
      what_remains_open: Whether these scenarios transfer to real deployment settings
        and whether action distributions cover downstream tasks beyond navigation
        or gameplay remains unverified.
    - line: Metric and stress-test design
      what_it_solves: Introduces targeted consistency and control measures, including
        scene-graph consistency, memory consistency, action control, visual fidelity,
        and standardized agent scores, to reveal failures hidden by aggregate generation
        quality.
      what_remains_open: Proxy-metric alignment with the downstream decisions or physical
        plausibility that users and policies actually need is not demonstrated in
        the packet.
    - line: Comparable baselines and reporting
      what_it_solves: Provides reproducible baselines and shared benchmarks such as
        Atari 100k, NuScenes, OpenDV-2K, Waymo, and CARL for comparing diffusion,
        stochastic Transformer, context-conditioned, and physics-informed approaches.
      what_remains_open: Stability across implementations and compute budgets is unclear
        because several reports omit full baseline details, limitations, or code/dataset
        evidence.
    consensus:
    - Evaluation is shifting toward action-conditioned temporal prediction, with shared
      protocols such as Atari 100k, NuScenes, OpenDV-2K, Waymo, and CARL used to compare
      model quality.
    - Visual detail, spatial/temporal consistency, memory, and action control are
      collectively treated as important beyond single-frame or aggregate generation
      scores.
    - Benchmarks increasingly combine video observations with actions and use targeted
      metrics rather than only reporting reconstruction or generation loss.
    - Reproducibility signals are often tied to code or dataset release, while evidence
      on limitations, baseline selection, and metric stability remains incomplete.
    disagreements:
    - 'Evaluation targets differ: some works probe spatial consistency across loop
      navigation, others probe memory consistency and action control, while several
      approaches prioritize visual fidelity, physics plausibility, or downstream policy
      scores.'
    - 'Training signals differ: mask reconstruction, diffusion generation, context-conditioned
      latent dynamics, VAE/Transformer stochastic modeling, keypoint dynamics, and
      temporal depth reflect different assumptions about what produces generalizable
      dynamics.'
    - Interaction and deployment settings diverge across single-agent game frames,
      multi-view driving, open-domain navigation, and robotic video datasets, creating
      different action spaces, viewpoints, and observability assumptions.
    - 'Metrics are not unified: human-normalized game score, scene-graph consistency,
      and 1080p memory/action-control protocols coexist, with no packet evidence showing
      they rank the same model weaknesses.'
    open_questions:
    - Do the proposed consistency metrics, such as scene-graph or memory/action-control
      scores, correlate with downstream planning or policy improvement in real tasks?
    - Can current benchmarks cover partial observability, action-free video, unseen
      dynamics, and real-world deployment boundaries without leaking train-time information?
    - How stable are leaderboard conclusions when baselines are reimplemented or trained
      under different compute budgets and data mixtures?
    - What minimal reporting is needed for reproducibility given that several top
      papers in this packet lack documented limitations or complete baseline/artifact
      details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的带动作视频与导航任务（如循环导航和开放域闭环视频），使不同模型在空间、时间和动作一致性上的主张可比较。
      尚未覆盖: 这些场景能否迁移到真实部署，动作分布是否覆盖导航、游戏或机器人以外的下游任务，仍缺乏证据。
    - 路线: 指标与压力测试设计
      解决的问题: 在生成质量之外引入场景图一致性、记忆一致性、动作控制、视觉保真和标准化智能体得分，暴露总分或生成指标中隐藏的失败。
      尚未覆盖: 代理指标是否与用户真正关心的下游决策或物理合理性一致，在本证据包内尚未得到验证。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL 等共享基线和可复现基准，比较扩散、随机 Transformer、上下文条件和物理信息等方法。
      尚未覆盖: 不同实现和算力预算下结论是否稳定仍不明，部分论文缺少基线细节、局限性或代码/数据发布证据。
    共识:
    - 评估正向带动作的时间预测转变，多项研究使用 Atari 100k、NuScenes、OpenDV-2K、Waymo、CARL 等共享协议比较模型质量。
    - 视觉细节、空间/时间一致性、记忆和动作控制被共同视为比单帧重建或聚合生成分数更重要。
    - 基准越来越倾向同时提供视频与动作，并使用针对性指标，而不是仅报告重建或生成损失。
    - 复现信号通常与代码或数据集发布相关，但局限性、基线选择和指标稳定性的方法学证据仍不完整。
    分歧:
    - 评估目标不同：有的检验循环导航中的空间一致性，有的检验记忆一致性和动作控制，还有的强调视觉保真、物理合理性或下游策略得分。
    - 训练信号不同：掩码重建、扩散生成、上下文条件潜动力学、VAE/Transformer 随机建模、关键点动力学和时间深度分别被采用，暗示对可泛化动力学来源的假设不同。
    - 交互与部署场景不同：单智能体游戏帧、多视角驾驶、开放域导航和机器人视频数据集带来不同动作空间、视角和可观测性假设。
    - 指标不统一：人类归一化游戏得分、场景图一致性和 1080p 视频记忆/动作控制协议并存，尚无证据表明它们会把相同模型弱点排在同一位置。
    开放问题:
