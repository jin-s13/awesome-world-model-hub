  related_work_outline:
  - 'Mainstream direction: Diffusion-based video generation world models with action
    conditioning and physics-informed designs are dominant recently, especially in
    driving and robotics (e.g., MaskGWM, UWM, RoboScape).'
  - 'Shared research pattern: Models couple visual dynamics learning with policy or
    planning objectives, often via large-scale pretraining on diverse datasets, and
    increasingly incorporate explicit physical or geometric cues.'
  - 'Key differences: Architectures vary (Transformer+VAE vs. Diffusion Transformer);
    some inject explicit physics losses while others rely on data-driven generation;
    evaluation targets differ (zero-shot generalization, visual fidelity, spatial/memory
    consistency) and application domains split between gaming, driving, and embodied
    manipulation.'
  - 'Trend evolution: Within 2023–2025, the field moved from efficient stochastic
    world models (STORM) on Atari to large-scale diffusion models for robotics and
    driving, and by 2025–2026 specialized benchmarks (LoopNav, MIND) emerged to quantify
    spatial consistency, memory, and action control.'
  - 'Open questions: Long-horizon memory consistency and physical plausibility remain
    unsolved; real-world deployment gap is unverified; separating model contribution
    from planner or task priors is still difficult; compositional generalization to
    entirely novel primitives is limited.'
  related_work_outline_zh:
  - 主流方向：基于扩散模型的视频生成世界模型，集成动作条件与物理信息，近期在驾驶与机器人领域占据主导（如 MaskGWM、UWM、RoboScape）。
  - 研究共性：模型将视觉动力学学习与策略或规划目标耦合，常通过大规模多数据集预训练实现，并越来越多地引入显式物理或几何线索。
  - 关键差异：架构选择不同（Transformer+VAE 与 Diffusion Transformer）；部分工作注入显式物理损失，其余依赖数据驱动生成；评估目标各异（零样本泛化、视觉保真度、空间/记忆一致性），应用领域横跨游戏、驾驶与具身操作。
  - 趋势演进：2023至2025年间，从 Atari 上的高效随机世界模型（STORM）转向用于机器人与驾驶的大规模扩散模型；2025–2026年出现专门基准（LoopNav、MIND）量化空间一致性、记忆与动作控制。
  - 开放问题：长时域记忆一致性与物理合理性仍未解决；真实世界部署缺口未经验证；模型贡献与规划器/任务先验的分离依旧困难；组合泛化对全新原语的适应边界有限。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforming world-model concepts into concrete architectures,
        loss functions, and training recipes, including diffusion transformers, VAE-Transformer
        hybrids, physics-informed joint learning, and compositional factorization.
      what_remains_open: Which representation choices transfer beyond the reported
        task family; how to balance visual fidelity, physical plausibility, and computational
        efficiency; and whether explicit physics losses outperform data-driven generation
        in the long tail.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to intervention, planning, and decision-time
        interfaces, such as training policies on imagined rollouts, flexible policy-dynamics
        representation through diffusion timesteps, and generating video plans for
        robot execution.
      what_remains_open: How much of the decision-making gain originates from the
        model versus the planner or task prior; whether the same world model can serve
        both forward dynamics and inverse dynamics robustly across diverse embodiments;
        and the reliability of imagined plans under distribution shift.
    - line: Method evidence and ablation protocol
      what_it_solves: Isolating method contribution from dataset, baseline, metric,
        and implementation effects by introducing targeted benchmarks for spatial
        consistency, memory, and action controllability, and moving beyond aggregate
        task scores.
      what_remains_open: Whether current benchmarks cover the full spectrum of world-model
        failures (e.g., long-term coherence, causal reasoning); and how well these
        evaluation protocols predict real-world downstream task performance.
    consensus:
    - World models are shifting from single-task state prediction to multi-modal video
      generation combined with action or language conditions, enabling usage across
      more open-ended tasks.
    - Large-scale pretraining on diverse robotic or driving datasets is a common strategy
      to improve generalization and robustness over pure imitation learning.
    - Evaluation is moving beyond aggregate task returns to more targeted diagnostics
      of memory, spatial consistency, and action controllability, revealing systematic
      weaknesses in current models.
    disagreements:
    - 'Representation: some works adopt variational autoencoders with Transformers,
      while others use diffusion transformers, leading to different trade-offs in
      sample quality and training stability.'
    - 'Supervision: a subset of models explicitly injects physics-based losses (depth,
      keypoint dynamics), whereas others rely solely on RGB reconstruction, with no
      consensus on which yields better downstream control.'
    - 'Evaluation target: one line evaluates zero-shot policy generalization under
      varying dynamics, another focuses on visual fidelity and long-horizon video
      prediction, and a third measures memory consistency and action controllability
      in dedicated benchmarks, making cross-paper comparison difficult.'
    - 'Interaction mode: some models are used to generate imagined rollouts for policy
      training, others directly output video plans for execution, and some unify policy
      and dynamics in a single diffusion process, leading to different assumptions
      about the action interface.'
    open_questions:
    - How can world models maintain long-term memory consistency and spatial coherence
      under extended rollouts, as highlighted by recent benchmarks?
    - What is the true source of policy improvement—model quality, planner design,
      or task priors—and can ablation protocols reliably disentangle these factors?
    - To what extent do physics-informed designs generalize to unseen physical interactions,
      and can they replace the need for explicit physics simulators?
    - How do compositional world models handle combinations of primitives that were
      never jointly observed during training, and what are the failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型理念转化为具体架构、损失函数和训练配方，包括扩散 Transformer、VAE-Transformer 混合、物理信息联合学习与组合式分解。
      尚未覆盖: 哪些表示选择能迁移到报告任务族之外；如何平衡视觉保真度、物理合理性与计算效率；显式物理损失在长尾分布上是否优于纯数据驱动生成。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，例如在想象轨迹上训练策略、通过扩散时间步灵活表示策略与动力学、为机器人执行生成视频计划。
      尚未覆盖: 决策增益中有多少来自模型本身而非规划器或任务先验；同一世界模型能否在不同实体上同时稳健地支持前向和逆动力学；分布偏移下想象计划的可靠性。
    - 路线: 方法证据与消融协议
      解决的问题: 通过引入针对空间一致性、记忆和动作可控性的专项基准，将方法贡献与数据集、基线、指标和实现因素分离，超越聚合任务得分。
      尚未覆盖: 当前基准是否覆盖了世界模型失效的全部类型（如长期因果推理）；这些评估协议在多大程度上能预测真实世界下游任务表现。
    共识:
    - 世界模型正从单一任务状态预测转向多模态视频生成，并融合动作或语言条件，以支撑更开放的任务。
    - 在多样化机器人或驾驶数据集上进行大规模预训练是提升泛化性与鲁棒性的通用策略，优于纯模仿学习。
    - 评估正从聚合任务回报转向对记忆、空间一致性和动作可控性等专项诊断，揭示出当前模型的系统性弱点。
    分歧:
    - 表示层面：部分工作采用变分自编码器与 Transformer 结合，另一部分使用扩散 Transformer，导致样本质量与训练稳定性上的不同权衡。
    - 监督信号：一部分模型显式引入基于物理的损失（深度、关键点动力学），而其他工作仅依赖 RGB 重建，对于哪种方式能带来更好的下游控制尚无共识。
    - 评测目标：一条路线评估零样本策略泛化，另一条关注视觉保真度与长时域视频预测，第三条在专项基准中衡量记忆一致性与动作可控性，使得跨论文比较困难。
    - 交互模式：部分模型生成想象轨迹用于策略训练，部分直接输出执行视频计划，部分在单一扩散过程中统一策略与动力学，对动作接口的假设存在差异。
    开放问题:
    - 如近期基准所示，世界模型如何在长时域推演下保持长期记忆一致性与空间连贯性？
    - 策略改进的真正来源是模型质量、规划器设计还是任务先验，消融协议能否可靠地解耦这些因素？
    - 物理信息设计在多大程度上能泛化到未见物理交互，能否替代显式物理模拟器？
    - 组合世界模型如何处理训练中从未联合出现的原语组合，其失效模式是什么？
