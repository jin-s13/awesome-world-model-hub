  related_work_outline:
  - 'Mainstream direction: World models are being applied to driving, robotics, and
    games via video generation, dynamics modeling, and policy learning, with diffusion
    and Transformer architectures dominating.'
  - 'Shared research pattern: Large-scale pretraining or self-supervised learning
    to build simulators that generate imagined trajectories for policy optimization
    or evaluation, often conditioned on language, actions, or goals.'
  - 'Key differences: Supervision signals (pure video generation vs. coupled action-video),
    evaluation targets (visual fidelity vs. task success), interaction modes (open-loop
    prediction vs. closed-loop control), and domain-specific constraints.'
  - 'Trend evolution: From single-game environments (Atari) to open-domain robotics
    and driving; architectures shift from RNN-based to diffusion/Transformer, incorporating
    physics, compositionality, and memory-aware benchmarks.'
  - 'Open questions: Long-term memory and spatial consistency, cross-embodiment and
    cross-dataset transfer, measuring physical realism and safety, and the lack of
    a unified benchmark covering diverse application demands.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于自动驾驶、机器人操作和游戏等场景，通过视频生成、动力学建模和策略学习，扩散与Transformer架构占据主导。
  - 研究共性：利用大规模预训练或自监督学习构建模拟器，生成想象轨迹用于策略优化或评估，常以语言、动作或目标作为条件。
  - 关键差异：监督信号（纯视频生成与耦合动作-视频）、评估目标（视觉保真度与任务成功率）、交互模式（开环预测与闭环控制）以及领域特有约束。
  - 趋势演进：从单一游戏环境（Atari）扩展到开放域机器人和驾驶；架构从RNN转向扩散/Transformer，并引入物理知识、组合性和面向记忆的基准。
  - 开放问题：长期记忆与空间一致性，跨本体、跨数据集迁移，物理真实性与安全性的衡量，以及缺乏覆盖多样化应用需求的统一基准。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving scene prediction and closed-loop simulation
      what_it_solves: Multi-view, long-horizon video prediction and generalization
        for driving world models.
      what_remains_open: Alignment between simulation gains and real-world safety
        or operational outcomes; limited zero-shot transfer evidence across different
        sensor setups and geographies.
    - line: Embodied robotic world models for manipulation
      what_it_solves: Learning robot dynamics and policies from video and action data,
        enabling compositional generalization and physics-informed video synthesis.
      what_remains_open: Whether the policies and dynamics transfer across embodiments,
        datasets, and from simulation to real-world environments; heavy reliance on
        pre-parsed language primitives or known action spaces.
    - line: World models in interactive game environments and benchmarks
      what_it_solves: Efficient model-based RL with visual inputs and systematic evaluation
        of memory consistency and action control.
      what_remains_open: Generalization when environment rules, goals, or action spaces
        change; lack of long-term spatial consistency benchmarks beyond simple loop
        navigation.
    consensus:
    - World models are shifting from passive state predictors to generative simulators
      that support policy learning and planning.
    - Diffusion models and Transformers have become the dominant architectures across
      driving, robotics, and game domains.
    - Multimodal conditioning—language instructions, goal images, or action sequences—is
      widely adopted to improve generalization and controllability.
    - Evaluation is expanding from task success rates to include video quality, physical
      plausibility, and long-term consistency metrics.
    disagreements:
    - 'Supervision: some methods rely purely on video generation losses, while others
      jointly predict actions, leading to different training objectives and data requirements.'
    - 'Evaluation: visual fidelity metrics (FVD, LPIPS) are used in open-loop generation,
      whereas task success rates are used in closed-loop policy evaluation, making
      cross-comparison difficult.'
    - 'Domain specificity: driving, robotics, and game environments impose different
      action spaces, state representations, and safety constraints, and no unified
      framework bridges them.'
    - 'Physics integration: works like RoboScape incorporate explicit physical clues
      (depth, keypoints), while others rely on implicit learning from video data alone.'
    open_questions:
    - How can world models maintain long-term memory consistency and spatial coherence
      across extended trajectories, as highlighted by MIND and LoopNav benchmarks?
    - To what extent do improvements in embodied policies or video quality transfer
      across different robots, datasets, and real-world deployment conditions?
    - What evaluation protocols can reliably measure the gap between simulated world
      model performance and true safety or operational outcomes in driving and robotics?
    - Can world models be trained across diverse domains (games, driving, manipulation)
      in a unified architecture without sacrificing domain-specific performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶场景预测与闭环仿真
      解决的问题: 实现多视角、长时域的驾驶世界模型视频预测与泛化。
      尚未覆盖: 仿真收益与真实安全或运营结果之间的一致性；跨传感器配置和地理区域的零样本迁移证据有限。
    - 路线: 具身机器人操作世界模型
      解决的问题: 从视频和动作数据中学习机器人动力学与策略，实现组合泛化和物理信息视频合成。
      尚未覆盖: 策略和动力学能否跨本体、数据集和仿真到现实环境迁移；严重依赖预解析的语言原语或已知动作空间。
    - 路线: 交互式游戏环境中的世界模型与基准
      解决的问题: 基于视觉输入的高效基于模型的强化学习，并系统评估记忆一致性和动作控制。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化能力；缺乏超越简单循环导航的长期空间一致性基准。
    共识:
    - 世界模型正从被动状态预测转向生成式模拟器，用于策略学习和规划。
    - 扩散模型和Transformer已成为驾驶、机器人和游戏领域的主流架构。
    - 多模态条件（语言指令、目标图像或动作序列）被广泛采用以提升泛化性和可控性。
    - 评估从任务成功率扩展到视频质量、物理合理性和长期一致性等指标。
    分歧:
    - 监督信号：部分方法仅依赖视频生成损失，而其他方法联合预测动作，导致训练目标和数据需求不同。
    - 评估方式：开环生成使用视觉保真度指标（FVD、LPIPS），闭环策略评估使用任务成功率，难以横向比较。
    - 领域特异性：驾驶、机器人和游戏环境有不同的动作空间、状态表示和安全约束，尚无统一框架衔接。
    - 物理信息注入：类似RoboScape的工作显式融入深度、关键点等物理线索，而其他方法仅从视频数据中隐式学习。
    开放问题:
    - 世界模型如何保持长时间轨迹中的记忆一致性和空间连贯性，如MIND和LoopNav基准所揭示的挑战？
    - 具身策略或视频质量的改进在多大程度上能跨不同机器人、数据集和真实部署条件迁移？
    - 需要何种评估协议才能可靠衡量仿真世界模型性能与驾驶或机器人领域中真实安全及运营结果之间的差距？
    - 能否在统一架构中跨游戏、驾驶、操作等多样化领域训练世界模型而不牺牲特定领域性能？
