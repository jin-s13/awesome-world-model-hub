  related_work_outline:
  - 'Mainstream direction: Building action-conditioned video generation models as
    world models, primarily using diffusion transformers and autoregressive architectures,
    to enable robot manipulation, planning, and policy evaluation.'
  - 'Shared research pattern: Framing world modeling as predicting future video frames
    from past observations and actions, with a growing emphasis on physical realism
    and alignment with downstream task objectives.'
  - 'Key differences: Methods diverge in how they inject actions (frame-level conditioning
    vs. global adaptation), whether they adapt pretrained video models or train from
    scratch, and how they enforce physical plausibility (reward-based alignment, DPO,
    or test-time verifiers).'
  - 'Trend evolution: Within 2024–2026, the frontier moves from architectural unification
    and efficient pretraining toward post-training alignment for physical plausibility
    and conceptual frameworks that question the statefulness of current models.'
  - 'Open questions: Whether current video-based world models possess explicit state
    representations for long-horizon persistence and causal reasoning, and how to
    construct reliable evaluation benchmarks beyond visual fidelity.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer和自回归架构为主，构建动作条件视频生成模型作为世界模型，用于机器人操作、规划与策略评估。
  - 研究共性：将世界建模定义为从过去观测与动作预测未来视频帧，并越来越强调物理真实性和与下游任务目标的对齐。
  - 关键差异：动作注入方式（帧级条件化 vs. 全局适配）、是否基于预训练视频模型、以及确保物理合理性的机制（奖励对齐、DPO或测试时验证器）上存在分歧。
  - 趋势演进：在2024–2026年内，前沿从架构统一与高效预训练，转向面向物理合理性的后训练对齐，并出现质疑当前模型状态性的概念框架。
  - 开放问题：当前基于视频的世界模型是否具备显式状态表示以支持长程持久性与因果推理，以及如何构建超越视觉保真度的可靠评估基准。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation as world models
      what_it_solves: Enables prediction of future video frames from actions and observations,
        serving as a learned simulator for policy learning, planning, and evaluation
        in robotics.
      what_remains_open: The generated videos often lack explicit state representations,
        leading to failures in long-horizon physical persistence and causal reasoning;
        most models are evaluated on visual quality rather than functional correctness
        for downstream tasks.
    - line: Alignment and physical plausibility enforcement
      what_it_solves: Improves the physical fidelity, task logic, and embodiment consistency
        of generated rollouts through reward models, preference optimization, or test-time
        verification.
      what_remains_open: Alignment methods rely on human preferences or heuristic
        verifiers that may be subjective, expensive, or poorly calibrated; the trade-off
        between visual quality and physical accuracy remains unresolved, and gains
        on one benchmark often fail to transfer to another.
    - line: Conceptual frameworks and evaluation benchmarks
      what_it_solves: Organizes video generation models into taxonomies of state construction
        and dynamics modeling, and proposes functional benchmarks that test physical
        persistence and causal reasoning beyond visual fidelity.
      what_remains_open: Existing taxonomies have not yet been adopted to change model
        design or training; functional benchmarks are novel but lack community consensus
        and do not yet correlate with real-world robot performance.
    consensus:
    - Video generation models can be repurposed as world models by conditioning on
      actions, and they provide a scalable way to learn dynamics from large datasets.
    - Physical realism and alignment with task objectives are critical for the generated
      videos to be useful for decision-making, not just visually appealing.
    - Current evaluation metrics (e.g., FVD, PSNR) are insufficient to capture the
      functional quality of a world model, and new benchmarks are needed.
    disagreements:
    - 'How to incorporate actions: some works inject actions via frame-level attention
      modules, while others use global conditioning or learned masks on pretrained
      models without access to internal parameters.'
    - 'Supervision and alignment strategy: one line uses multi-dimensional reward
      models trained on human preference data with RL-based post-training, another
      uses direct preference optimization with decoupled discriminators, and a third
      relies on test-time heuristic verifiers without any training.'
    - 'Evaluation targets: some papers measure policy learning success via downstream
      task performance, others emphasize physical plausibility in zero-shot benchmarks,
      and yet others focus on spatial reasoning accuracy, revealing no single agreed-upon
      metric for world model quality.'
    open_questions:
    - Do current video-based world models learn an implicit state representation that
      supports counterfactual reasoning and long-horizon consistency, or are they
      merely high-quality frame interpolators?
    - Can alignment techniques that improve physical plausibility on one benchmark
      (e.g., PBench) generalize to more complex, unseen tasks without overfitting
      to the reward model?
    - What is the relationship between test-time scaling laws for world models and
      their actual capacity for causal reasoning, given that verifiers can be miscalibrated
      and fail to improve performance on harder benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频生成作为世界模型
      解决的问题: 从动作和观测中预测未来视频帧，作为学习模拟器用于机器人策略学习、规划与评估。
      尚未覆盖: 生成的视频往往缺乏显式状态表示，导致长程物理持久性和因果推理失败；多数模型仅在视觉质量上评估，而非下游任务的功能正确性。
    - 路线: 对齐与物理合理性强制
      解决的问题: 通过奖励模型、偏好优化或测试时验证，提升生成轨迹的物理保真度、任务逻辑和具身一致性。
      尚未覆盖: 对齐方法依赖人类偏好或启发式验证器，可能主观、昂贵或校准不良；视觉质量与物理准确性之间的权衡尚未解决，且在一个基准上的改进往往无法迁移到另一个基准。
    - 路线: 概念框架与评估基准
      解决的问题: 将视频生成模型组织为状态构建与动态建模的分类法，并提出测试物理持久性和因果推理的功能基准，超越视觉保真度。
      尚未覆盖: 现有分类法尚未被采纳以改变模型设计或训练；功能基准虽新颖，但缺乏社区共识，且尚未与真实世界机器人性能建立关联。
    共识:
    - 视频生成模型可通过动作条件化被重新用作世界模型，并提供从大规模数据中学习动力学的可扩展途径。
    - 物理真实性和与任务目标的对齐对于生成视频对决策有用至关重要，而非仅追求视觉吸引力。
    - 当前评估指标（如FVD、PSNR）不足以捕捉世界模型的功能质量，需要新的基准。
    分歧:
    - 动作注入方式：一些工作通过帧级注意力模块注入动作，另一些则使用全局条件化或在不访问内部参数的情况下对预训练模型施加学习掩码。
    - 监督与对齐策略：一条路线使用基于人类偏好数据训练的层次化奖励模型结合RL后训练，另一条使用具有解耦判别器的直接偏好优化，还有一条依赖测试时启发式验证器而无任何训练。
    - 评估目标：一些论文通过下游任务性能衡量策略学习成功，另一些强调零样本基准中的物理合理性，还有的侧重空间推理准确性，表明世界模型质量尚无统一的度量标准。
    开放问题:
    - 当前基于视频的世界模型是否学到了支持反事实推理和长程一致性的隐式状态表示，还是仅仅是高质量帧插值器？
    - 在一个基准（如PBench）上改善物理合理性的对齐技术能否泛化到更复杂的未知任务，而不对奖励模型过拟合？
    - 鉴于验证器可能校准不良且在更难的基准上无法提升性能，世界模型的测试时缩放定律与其实际因果推理能力之间存在何种关系？
