  - 'Mainstream direction: World models are being adapted to domain-specific tasks
    such as autonomous driving, robotics, and interactive agents, with a focus on
    video generation, action-conditioned prediction, and physics-informed simulation.'
  - 'Shared research pattern: Most works use diffusion models or Transformers for
    video prediction, train on diverse datasets, and evaluate generation quality,
    policy performance, or consistency metrics.'
  - 'Key differences: Approaches differ in how they incorporate physics (explicit
    depth/keypoints vs. implicit learned dynamics), in the supervision signal (video-only,
    action-only, joint), and in the evaluation target (visual fidelity, policy robustness,
    memory consistency).'
  - 'Trend evolution: From early RL sample-efficient world models to large-scale pretraining
    with diffusion and multi-modal data, and now to specialized benchmarks measuring
    spatial and memory consistency.'
  - 'Open questions: How to close the sim-to-real gap, achieve compositional generalization
    across tasks, and maintain long-term memory and action control in open domains.'
  related_work_outline_zh:
  - 主流方向：世界模型正被适配到自动驾驶、机器人、交互式智能体等具体领域，强调视频生成、动作条件预测和物理信息仿真。
  - 研究共性：多数工作采用扩散模型或Transformer进行视频预测，在多样化数据集上训练，并评估生成质量、策略性能或一致性指标。
  - 关键差异：物理结合方式（显式深度/关键点 vs. 隐式动力学）、监督信号（纯视频、纯动作、联合）、评估目标（视觉保真度、策略鲁棒性、记忆一致性）存在分歧。
  - 趋势演进：从早期强化学习样本高效世界模型，到利用扩散和多模态数据的大规模预训练，再到当前专门的基准测试衡量空间和记忆一致性。
  - 开放问题：如何弥合仿真与真实差距，实现跨任务组合泛化，并在开放域中保持长期记忆和动作控制。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation
      what_it_solves: Generating long-horizon, multi-view driving videos for closed-loop
        simulation and policy evaluation, with emphasis on mask reconstruction and
        diffusion scalability.
      what_remains_open: Real-world safety and operational alignment remain unverified;
        sim-to-real transfer and cross-dataset generalization are limited.
    - line: Interactive agents and games
      what_it_solves: Building efficient world models for sample-efficient RL in Atari
        and Minecraft, and evaluating spatial consistency, memory, and action control.
      what_remains_open: Generalization when environment rules, goals, or action spaces
        change; long-term memory maintenance and cross-action-space control are unresolved.
    - line: Embodied and domain task transfer
      what_it_solves: Applying world models to robot manipulation via compositional
        video generation, physics-informed dynamics, and joint video-action diffusion
        pretraining on large robot datasets.
      what_remains_open: Cross-embodiment and cross-dataset transfer, reliance on
        seen primitives, and lack of real-world deployment validation.
    consensus:
    - All works use video generation as the core representation of world models, with
      diffusion or Transformer architectures.
    - Generalization (to unseen states, tasks, or environments) is a shared concern.
    - Benchmarking is emerging as a critical tool to systematically evaluate consistency,
      control, and fidelity of world models.
    disagreements:
    - 'Physics integration: explicit prediction of depth and keypoints versus implicit
      learning from video dynamics.'
    - 'Supervision signal: some models rely solely on video generation, while others
      jointly predict actions or use RL rewards.'
    - 'Evaluation target: visual quality metrics versus policy performance versus
      spatial and memory consistency metrics.'
    - 'Interaction mode: offline video prediction versus interactive closed-loop policy
      evaluation.'
    open_questions:
    - How to transfer simulation gains to real-world task performance, especially
      in robotics and driving?
    - What benchmarks can capture long-term consistency and compositional generalization
      across diverse actions and scenes?
    - Can world models effectively leverage internet-scale action-free video data
      for policy learning?
