  related_work_outline:
  - 'Mainstream direction: World models are applied mainly to embodied control and
    driving simulation, using generative video/diffusion or learned dynamics to support
    prediction, planning, and policy learning.'
  - 'Shared research pattern: Methods learn predictive models from interaction or
    video and couple them with task structure such as actions, physics, context, or
    language; evaluation uses domain benchmarks and rollout or policy success.'
  - 'Key differences: Representation and supervision differ, including diffusion video
    generation, MAE-style mask reconstruction, recurrent state-space models, transformer-VAE
    stochastic models, and coupled video-action diffusion; some inject physics or
    memory metrics. Evaluation settings span driving, robotics, Atari, Minecraft,
    and open-domain video.'
  - 'Trend evolution: High-ranked visible evidence is concentrated in 2023-2026, moving
    from RL-oriented world models toward large-scale generative video models for driving
    and robotics, plus benchmarks for spatial, memory, and action consistency.'
  - 'Open questions: Whether simulator gains transfer to real safety and operational
    outcomes; how to maintain long-term memory consistency and generalize across unseen
    context, embodiment, action space, and physical environment.'
  related_work_outline_zh:
  - 主流方向：世界模型主要应用于具身控制和自动驾驶仿真，以生成式视频/扩散模型或学习动力学支持预测、规划与策略学习。
  - 研究共性：方法从交互或视频中学习预测模型，并与动作、物理、上下文或语言等任务结构结合；评估使用领域基准和 rollout/策略成功率。
  - 关键差异：表示与监督信号不同，包括扩散视频生成、MAE风格掩码重建、循环状态空间、Transformer-VAE随机模型和视频-动作耦合扩散；部分注入物理或记忆指标。评测场景涵盖驾驶、机器人、Atari、Minecraft和开放域视频。
  - 趋势演进：高排名证据集中在2023—2026年，从强化学习导向世界模型转向面向驾驶和机器人的大规模生成视频模型，并出现空间/记忆/动作一致性基准。
  - 开放问题：仿真收益是否迁移到真实安全与运营；长期记忆一致性与跨动作空间泛化；跨上下文、本体和物理环境泛化。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to concrete task domains with domain-specific
        states, actions, and constraints; examples include contextual recurrent state-space
        models for zero-shot generalization and compositional video generation for
        robot imagination and policy training.
      what_remains_open: Transfer across embodiments, datasets, institutions, and
        physical environments remains unverified, and some approaches assume observable
        context or support only previously seen primitive combinations.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for multi-view, long-horizon driving video
        prediction and closed-loop simulation; MaskGWM is an example of mask-reconstruction-based
        prediction evaluated on NuScenes, OpenDV-2K, and Waymo.
      what_remains_open: Whether benchmark gains on NuScenes or Waymo align with real-world
        safety or operational outcomes, and whether zero-shot transfer to unseen driving
        setups holds.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments where agents
        must act over time; examples include STORM for Atari 100k and LoopNav or MIND
        for spatial, memory, and action-control evaluation in Minecraft and open-domain
        video.
      what_remains_open: Generalization when environment rules, goals, action spaces,
        or user interactions change; long-term memory consistency and cross-action
        evaluation remain unresolved.
    consensus:
    - World models are treated as learned predictive simulators for visual control
      and policy learning rather than only as generative media models.
    - Most works combine a predictive model with structured conditions such as actions,
      language, context, physics, or mask reconstruction to improve task-specific
      prediction and control.
    - Evaluation increasingly includes domain-specific benchmarks and metrics beyond
      raw visual fidelity, such as zero-shot generalization, spatial consistency,
      memory consistency, and action control.
    disagreements:
    - 'Representation choices differ: some use diffusion transformers for video generation,
      others use recurrent state-space models with variational inference, and still
      others couple video and action diffusion in a unified transformer.'
    - 'Supervision and inductive biases differ: several methods learn from action-free
      video or language-primitive decomposition, while others require action supervision
      or observable context; physics-informed and memory-consistency approaches add
      explicit constraints or metrics.'
    - 'Evaluation targets differ: driving approaches emphasize multi-view and long-horizon
      prediction; game approaches emphasize sample-efficient Atari performance or
      loop-navigation consistency; robot approaches emphasize task execution, video
      plausibility, and policy generalizability.'
    open_questions:
    - Do improvements in driving or robotic simulators transfer to real-world safety,
      physical execution, and operational reliability?
    - How should world models maintain long-term memory consistency and robust action
      control across viewpoint, action-space, and scene changes?
    - Which assumptions, such as observable context, predefined primitives, or fixed
      action spaces, limit generalization to unseen dynamics, embodiments, or physical
      environments?
    - How should benchmarks balance video fidelity, physical plausibility, and downstream
      policy quality when evaluating world models?
