      across long closed-loop rollouts and unfamiliar environments?
    - What latency-fidelity trade-offs emerge when moving from a single-GPU driving
      benchmark to diverse hardware and real-world deployment?
    - Can cross-embodiment world models operate without shared visible context or
      shared action spaces, and what evidence supports this?
    - Which results are independently reproducible across teams and datasets, given
