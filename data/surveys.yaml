  related_work_outline_zh:
  - 主流方向：通过分类体系、框架和评估路线图将碎片化的世界模型研究统一起来，覆盖视频生成、具身智能和自动驾驶。
  - 研究共性：多数工作通过提出潜在空间分类法、组织挑战（交互性、记忆、可控性）并设计评估基准来梳理设计空间。
  - 关键差异：覆盖范围不同，有的聚焦交互式视频世界建模，有的面向自动驾驶潜在世界模型，有的从Sora等通用模型出发，有的针对机器人想象等特定应用。
  - 趋势演进：从2022年的早期应用开始，领域在2024–2026年转向系统化综述和分类框架，并越来越强调开源和实时交互性。
  - 开放问题：所提分类法缺乏实证验证；跨设置的评估兼容性未经验证；开放挑战的优先级排序尚不明确；视线外动态和长时记忆尚未充分探索。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Structuring fragmented world model research into directions,
        milestones, and gaps by organizing latent spaces, structural priors, and application
        scenarios.
      what_remains_open: Taxonomies rely on selective examples and lack systematic
        evidence; theoretical frameworks are not empirically validated; coverage of
        emerging methods is uncertain.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different benchmarks and metrics shape conclusions
        across world model papers, and prescribing evaluation suites for closed-loop
        and resource-aware assessment.
      what_remains_open: Compatibility of results across simulation, real-world, and
        different domains is unverified; proposed cost-aware metrics remain untested;
        open-loop/closed-loop mismatches are acknowledged but not resolved.
    - line: Open problem and gap mapping
      what_it_solves: Turning broad literature into concrete next-step questions such
        as action-conditioned controllability, long-horizon memory, out-of-sight dynamics,
        and real-time interactivity.
      what_remains_open: Prioritization of which gaps matter most for progress is
        missing; lists of challenges are not backed by empirical difficulty ranking;
        validating the impact of solving each gap is unexplored.
    consensus:
    - World models are converging on the need for interactivity, long-term temporal
      consistency, and memory to enable realistic simulation beyond passive observation.
    - Evaluation frameworks and benchmarks are essential for progress, and they must
      go beyond short-term quality to include closed-loop, resource-aware, and multi-domain
      metrics.
    - Video generation is a core capability of world models, but it must be extended
      to persistent 3D/4D state evolution and multi-entity dynamics to serve as general
      simulators.
    - Open-source artifacts and real-time inference are emerging as key enablers for
      reproducibility and practical deployment.
    disagreements:
    - Some works focus on latent-space world models for planning and control (e.g.,
      autonomous driving), while others emphasize high-fidelity video generation as
      the primary simulation medium.
    - 'The definition of interactivity varies: some treat it as action-conditioned
      generation, while others require real-time responsiveness and closed-loop agent
      interaction.'
    - Scope differs across application domains—some surveys target a single vertical
      (autonomous driving, robotics), others attempt a general cross-domain taxonomy,
      which may dilute depth.
    - 'Methodological depth varies: some papers provide systematic comparisons and
      design choices, while others offer conceptual frameworks without empirical validation
      or baseline comparisons.'
    open_questions:
    - How can proposed taxonomies be empirically validated to ensure they cover all
      relevant design choices and are not biased by the authors' selection of papers?
    - What evaluation protocols can reliably compare world models across different
      domains (robotics, driving, gaming) given the mismatch in data modalities, action
      spaces, and safety requirements?
    - Which open challenges (e.g., out-of-sight dynamics, long-horizon memory, compositionality)
      should be prioritized to maximize progress, and how can their difficulty be
      quantitatively assessed?
    - How can synthesis frameworks incorporate emerging methods that combine multiple
      modalities (e.g., ego-vision, language, poses) without becoming overly broad
      or losing predictive power?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为方向、里程碑和缺口，通过潜在空间、结构先验和应用场景进行分类。
      尚未覆盖: 分类法依赖选择性示例，缺乏系统证据；理论框架缺少实证验证；对新兴方法的覆盖程度不确定。
    - 路线: 对比评测综合
      解决的问题: 总结不同基准和指标如何影响世界模型论文的结论，并提出闭环和资源感知的评估方案。
      尚未覆盖: 不同设置（仿真、真实、不同领域）下结果的兼容性未经验证；提出的成本感知指标尚未测试；开环/闭环不匹配问题被承认但未解决。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献转化为具体的下一步研究问题，如动作条件可控性、长时记忆、视线外动态和实时交互。
      尚未覆盖: 缺乏对哪些缺口对进展最重要的优先级排序；挑战列表缺少基于实证的难度排序；解决每个缺口的影响尚未验证。
    共识:
    - 世界模型正朝着需要交互性、长期时间一致性和记忆的方向趋同，以超越被动观察实现现实模拟。
    - 评估框架和基准对进展至关重要，必须超越短期质量，包含闭环、资源感知和多领域指标。
    - 视频生成是世界模型的核心能力，但必须扩展到持久的3D/4D状态演化和多实体动态，才能成为通用模拟器。
    - 开源工件和实时推理正成为可复现性和实际部署的关键推动因素。
    分歧:
    - 部分工作侧重于用于规划与控制的潜在空间世界模型（如自动驾驶），而另一些则强调高保真视频生成作为主要模拟媒介。
    - 交互性的定义存在差异：有些将其视为动作条件生成，另一些则要求实时响应和闭环智能体交互。
    - 覆盖的应用领域不同——一些调查针对单一垂直领域（自动驾驶、机器人），另一些尝试跨领域通用分类，可能会稀释深度。
    - 方法深度不同：部分论文提供系统比较和设计选择，另一些只给出概念框架，缺乏实证验证或基线对比。
    开放问题:
    - 如何对所提出的分类法进行实证验证，以确保其覆盖所有相关设计选择，而非受作者论文选择偏差的影响？
    - 鉴于数据模态、动作空间和安全要求的差异，哪些评估协议能够可靠地比较不同领域（机器人、驾驶、游戏）的世界模型？
    - 哪些开放挑战（如视线外动态、长时记忆、组合性）应被优先解决以最大化进展，如何定量评估其难度？
    - 综合框架如何纳入结合多种模态（如第一人称视觉、语言、姿态）的新兴方法，而不变得过于宽泛或失去预测能力？
