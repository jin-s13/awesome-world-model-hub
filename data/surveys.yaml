  - 'Open questions: Cross-dataset and cross-embodiment generalization, long-horizon
    consistency under autoregressive rollouts, deployment robustness beyond single-GPU/dataset
    settings, and independent reproduction remain largely unverified.'
  related_work_outline_zh:
  - 主流方向：证据集中在动作可控的世界模型模拟器与基准，尤其是具身和自动驾驶场景下的闭环视频生成与评估框架，而非通用系统管理。
  - 研究共性：多数工作通过辅助目标、上下文条件或轻量模块同时提升视觉保真度与可控性，并与基准或下游策略评估绑定。
  - 关键差异：方法上分为改造预训练生成器或世界模型与训练新模拟器；评测重点覆盖空间一致性、动作保真度、物理合理性、零样本策略泛化和闭环延迟。
  - 趋势演进：可见的2024–2026证据显示，研究从开环保真度和静态基准走向实时、闭环、动作条件系统及可复现工件；早期年份未被高排名论文代表，趋势仅限当前前沿。
  - 开放问题：跨数据集与跨具身泛化、自回归长时域一致性、单GPU或单数据集之外的部署鲁棒性，以及独立复现仍未得到充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned world-model simulation for closed-loop video generation
      what_it_solves: Generates future video conditioned on actions or physical signals
        for embodied and driving simulators, supporting downstream policy training
        and evaluation.
      what_remains_open: Long-horizon consistency, out-of-distribution action handling,
        and physical plausibility across environments remain incompletely verified.
    - line: Benchmarks and metrics for world-model fidelity and controllability
      what_it_solves: Quantifies spatial consistency, action fidelity, and model comparisons
        through standardized datasets and evaluation frameworks.
      what_remains_open: Evaluation is often limited to one dataset or domain, and
        metric alignment with downstream task utility is not yet established.
    - line: Context-conditioned model-based reinforcement learning
      what_it_solves: Trains policies on imagined trajectories and improves zero-shot
        generalization by conditioning latent dynamics on observable context.
      what_remains_open: Requires observable context, has been evaluated on narrow
        task suites, and lacks real-system generalization evidence.
    - line: Deployable real-time systems and open artifacts
      what_it_solves: Integrates low-latency inference, code, datasets, or benchmarks
        into reusable simulator stacks.
      what_remains_open: Validation is mostly single-GPU or single-scenario, with
        cross-infrastructure robustness and independent reproduction still missing.
    consensus:
    - Most systems evaluate conditional video generation together with action adherence
      or physical plausibility, rather than treating visual quality alone as sufficient.
    - Action-conditioned controllability is treated as a central bottleneck, addressed
      via action modules, structured control, physics-informed objectives, or context
      inputs.
    - Datasets and benchmarks are a major reproducibility vehicle, but not all models
      provide equally complete code, artifacts, or limitation evidence.
    - 'Methodological evidence is uneven: some entries provide experiments, baselines,
      metrics, and limitations, while others lack reported limitations or cross-dataset
      validation; high reproducibility or recency signals should be read separately
      from proof of robustness.'
    disagreements:
