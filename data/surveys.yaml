  related_work_outline:
  - 'Mainstream direction: Diffusion-based generative architectures, especially diffusion
    transformers with masked reconstruction or multi-modal conditioning, dominate
    recent world model research for video generation and policy learning.'
  - 'Shared research pattern: Most works train a world model to predict future frames
    or latent states via self-supervised objectives, then use the model for simulation,
    planning, or policy improvement, often with a focus on long-horizon consistency.'
  - 'Key differences: Models differ in representation (stochastic state-space vs.
    diffusion), incorporation of physics/context (explicit context, keypoint dynamics,
    compositional primitives), and evaluation target (video quality vs. downstream
    task performance vs. memory consistency benchmarks).'
  - 'Trend evolution: From 2023 onward, the field shifted from VAE-Transformer hybrids
    toward diffusion-based world models; by 2025-2026, benchmarks for memory and spatial
    consistency emerged, and multi-modal pretraining on large robotics datasets became
    a new frontier.'
  - 'Open questions: It remains unclear how to isolate the contribution of the world
    model from the planner or task prior, and whether visual fidelity improvements
    translate to better closed-loop control in real-world settings.'
  related_work_outline_zh:
  - 主流方向：基于扩散的生成架构，特别是结合掩码重建或多模态条件的扩散Transformer，在视频生成和策略学习的世界模型研究中占主导地位。
  - 研究共性：多数工作通过自监督目标训练世界模型预测未来帧或潜在状态，然后利用模型进行仿真、规划或策略改进，并普遍关注长时域一致性。
  - 关键差异：模型在表示方式（随机状态空间 vs. 扩散）、物理/上下文注入方式（显式上下文、关键点动力学、组合原语）和评测目标（视频质量 vs. 下游任务性能
    vs. 记忆一致性基准）上存在分歧。
  - 趋势演进：从2023年起，领域从VAE-Transformer混合体转向以扩散为基础的世界模型；2025-2026年，针对记忆和空间一致性的基准涌现，大规模机器人数据上的多模态预训练成为新前沿。
  - 开放问题：如何分离世界模型与规划器或任务先验的贡献，以及视觉保真度提升能否转化为真实场景中更好的闭环控制，仍未有定论。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-based generative architectures with masked or multi-modal conditioning
      what_it_solves: Scalable video generation and long-horizon prediction by combining
        diffusion transformers with masked reconstruction (e.g., MaskGWM) or unified
        video-action diffusion (e.g., UWM).
      what_remains_open: Whether the gains come from the diffusion prior, the mask
        strategy, or the dataset scale; and generalization to unseen action spaces
        or physical interactions beyond the training distribution.
    - line: Stochastic state-space models for latent imagination
      what_it_solves: Efficient model-based reinforcement learning by learning compact
        latent dynamics (e.g., Dreamer variants like cRSSM and STORM) and using imagined
        rollouts for policy optimization.
      what_remains_open: The assumption that the latent state sufficiently captures
        all dynamics; performance on tasks requiring precise physical reasoning or
        long-term memory beyond the training horizon.
    - line: Compositional and physics-informed world models
      what_it_solves: Generalization to unseen object/action combinations (RoboDreamer)
        and improved physical plausibility (RoboScape) by factorizing generation or
        injecting physics priors like keypoint dynamics.
      what_remains_open: Reliance on predefined primitives or explicit physics tasks;
        limited evidence of real-robot transfer and scalability to completely novel
        physical phenomena.
    - line: Benchmarks for world model consistency and control
      what_it_solves: Standardized evaluation of spatial consistency (LoopNav) and
        memory/action control (MIND) using loop-based navigation or scripted action
        spaces, moving beyond simple frame-wise metrics.
      what_remains_open: These benchmarks are still synthetic or game-based; correlation
        with real-world task success and sensitivity to model architecture choices
        remain unverified.
    consensus:
    - World models are increasingly built as generative video models, with the goal
      of predicting future observations conditioned on actions or language instructions.
    - Self-supervised or unsupervised learning on large-scale video datasets is a
      common pretraining strategy, and the resulting models are evaluated on either
      perceptual quality or downstream task performance.
    - Long-horizon consistency, memory, and physical plausibility are recognized as
      central challenges that current models struggle with, motivating new benchmarks
      and architectural components.
    disagreements:
    - 'Representation: Some works use stochastic latent state-space models (e.g.,
      cRSSM, STORM), while others adopt fully feed-forward diffusion models in pixel
      space or latent space (MaskGWM, UWM, RoboScape).'
    - 'Supervision for dynamics: Methods differ in how they incorporate physical or
      contextual knowledge—explicit context values (cRSSM), keypoint dynamics (RoboScape),
      compositional language primitives (RoboDreamer), or no explicit physics beyond
      generative loss.'
    - 'Evaluation target: One line evaluates world models by video fidelity and downstream
      policy performance (e.g., Atari, CARL, robot simulation), while another line
      designs diagnostic benchmarks that isolate memory and action consistency (LoopNav,
      MIND).'
    - 'Interaction mode: Most models are evaluated as open-loop video predictors;
      only a subset (e.g., UWM, STORM) explicitly couple action and observation for
      closed-loop control, and benchmarks like MIND start to test this directly.'
    open_questions:
    - How much of the reported policy improvement is due to the world model architecture
      versus the choice of planner, data augmentation, or hyperparameter tuning?
    - Can diffusion-based world models maintain consistent object identity and 3D
      geometry over hundreds of timesteps without external memory or explicit scene
      graphs?
    - What is the minimal set of inductive biases (e.g., physics, compositionality,
      memory) needed to achieve robust generalization to unseen dynamics in real-world
      robotic tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散的生成架构，结合掩码或多模态条件
      解决的问题: 通过将扩散Transformer与掩码重建（如MaskGWM）或统一的视频-动作扩散（如UWM）相结合，实现可扩展的视频生成和长时域预测。
      尚未覆盖: 增益来自扩散先验、掩码策略还是数据规模；以及能否泛化到未见过的动作空间或训练分布之外的物理交互。
    - 路线: 用于潜在想象的随机状态空间模型
      解决的问题: 通过学习紧凑的潜在动力学（如cRSSM和STORM等Dreamer变体）并使用想象轨迹进行策略优化，实现高效的基于模型的强化学习。
      尚未覆盖: 假设潜在状态充分捕捉所有动力学；在需要精确物理推理或超出训练时域的长时记忆的任务上的表现。
    - 路线: 组合式与物理信息驱动的世界模型
      解决的问题: 通过分解生成或注入物理先验（如关键点动力学），实现对未见物体/动作组合的泛化（RoboDreamer）和提升物理合理性（RoboScape）。
      尚未覆盖: 依赖预定义原语或显式物理任务；缺乏真实机器人迁移和扩展到全新物理现象的证据。
    - 路线: 用于世界模型一致性和控制能力的基准
      解决的问题: 使用基于循环的导航或脚本化动作空间，对空间一致性（LoopNav）和记忆/动作控制（MIND）进行标准化评估，超越简单的逐帧指标。
      尚未覆盖: 这些基准仍是合成或游戏环境；与真实世界任务成功的相关性以及对模型架构选择的敏感性尚未验证。
    共识:
    - 世界模型正越来越多地被构建为生成式视频模型，目标是根据动作或语言指令预测未来观测。
    - 在大规模视频数据集上进行自监督或无监督学习是常见的预训练策略，得到的模型在感知质量或下游任务性能上进行评估。
    - 长时域一致性、记忆和物理合理性被公认为当前模型难以应对的核心挑战，推动了新基准和架构组件的设计。
    分歧:
    - 表示方式：一些工作使用随机潜在状态空间模型（如cRSSM、STORM），另一些则采用像素空间或潜在空间中的全前馈扩散模型（MaskGWM、UWM、RoboScape）。
    - 动力学监督信号：方法在注入物理或上下文知识的方式上存在差异——显式上下文值（cRSSM）、关键点动力学（RoboScape）、组合式语言原语（RoboDreamer），或除生成损失外无显式物理。
    - 评测目标：一条路线通过视频保真度和下游策略性能（如Atari、CARL、机器人仿真）评估世界模型，另一条路线设计诊断性基准来隔离记忆和动作一致性（LoopNav、MIND）。
    - 交互模式：多数模型被评估为开环视频预测器；仅部分工作（如UWM、STORM）显式地耦合动作和观测以进行闭环控制，而MIND等基准开始直接测试这一点。
    开放问题:
    - 报告的策略性能提升有多少归因于世界模型架构，而非规划器选择、数据增强或超参数调节？
    - 基于扩散的世界模型能否在不需要外部记忆或显式场景图的情况下，在数百个时间步内保持对象身份和3D几何的一致性？
    - 在真实世界机器人任务中实现对新动力学的鲁棒泛化所需的最小归纳偏置集合（如物理、组合性、记忆）是什么？
