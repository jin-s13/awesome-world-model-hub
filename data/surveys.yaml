  related_work_outline_zh:
  - 主流方向：当前前沿集中在具身与驾驶场景的可运行世界模型模拟栈，特别是以动作、轨迹或上下文为条件的可控视频生成与闭环仿真。
  - 研究共性：多数系统将可学习生成/世界模型与动作或上下文条件接口结合，并用基准或下游策略评估闭环行为；多个工作开放代码或数据集，但独立复用证据不均。
  - 关键差异：部署目标、控制接口、评测目标和延迟约束不同，例如物理机器人、驾驶模拟器与开放世界游戏之间存在不同权衡。
  - 趋势演进：在2022–2026证据内，研究从无模拟器的机器人在线学习，转向大规模预训练视频/扩散模拟器、标准基准和闭环低延迟服务；2015–2021年跨度存在，但顶级论文证据不足。
  - 开放问题：系统跨数据集、机器人、传感器配置和硬件环境是否可迁移；保真度、可控性与实时性如何平衡；发布工件能否支持跨团队独立复现；缺失的局限与代码信息构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning learned models into end-to-end workflows for data, training,
        inference, and evaluation in driving/robotic simulation and real-robot loops.
      what_remains_open: External deployment, hardware changes, and user-specific
        sensor or setting transfer are not demonstrated; many evaluations remain tied
        to nuScenes, CARL, or specific robot platforms.
    - line: Real-time and interactive serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        driving and physical robot learning, such as FAR-Drive reporting sub-second
        single-GPU inference.
      what_remains_open: Trade-offs among speed, visual fidelity, controllability,
        and physically plausible dynamics; long-horizon consistency under iterative
        self-conditioning may still degrade.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making systems inspectable and comparable through datasets,
        benchmarks, and baselines, for example LoopNav and ACT-Bench for consistency
        and action-fidelity evaluation.
      what_remains_open: Independent reproduction across teams and infrastructure;
        several highly relevant papers lack visible OpenAlex identifiers, complete
        limitation sections, or strong code signals.
    - line: World-model consistency and control benchmarking
      what_it_solves: Evaluating simulators through spatial consistency, action fidelity,
        and physical plausibility rather than relying only on pixel-level similarity.
      what_remains_open: Metrics are specialized; no single suite jointly covers spatial,
        action, physical, and policy-level evaluation across deployment settings.
    consensus:
    - 'The community increasingly treats video generation and world models as runnable
      simulators: learned dynamics are evaluated through closed-loop or downstream-control
      behavior, not only image quality.'
    - Action or context conditioning is a shared interface for making generative simulators
      useful, whether through observable context in state-space dynamics or action-conditioned
      video/diffusion modules.
    - Open artifacts, datasets, and benchmarks are treated as primary contributions;
      several works pair a model proposal with an evaluation dataset or baseline system.
    - High-fidelity or real-world deployment requires system-level attention to latency,
      closed-loop stability, sensor configuration, and physical plausibility.
    disagreements:
    - 'Representation: some systems use latent state-space dynamics conditioned on
      context, while others use autoregressive or diffusion video generation with
      explicit action or trajectory controls.'
    - 'Supervision and loss: physics-informed auxiliary losses, motion-reinforced
      losses, and benchmark-driven fidelity metrics prioritize different failure modes.'
    - 'Evaluation target: spatial consistency in open-world navigation, action fidelity
      in driving, real-robot learning speed without resets, and downstream policy
      usefulness are not unified.'
    - 'Deployment setting: real physical robots without simulators, nuScenes-based
      driving simulation, open-world Minecraft, and game/robotics domains create different
      latency, controllability, and generalization demands.'
    - 'Interaction mode: high-level goals and trajectory controls, low-level actions,
      and observable context values coexist; assumptions about context observability
      and reset availability differ.'
    open_questions:
    - Can these systems generalize beyond their evaluated datasets and platforms,
      particularly to unseen sensors, robots, or driving environments?
    - What minimum serving latency and long-horizon stability are needed for closed-loop
      use without accumulating autoregressive or cross-view drift?
    - How should action fidelity, spatial consistency, physical plausibility, and
      policy transfer be jointly evaluated instead of relying on specialized metrics?
    - Are the available datasets, code, and baseline artifacts sufficient for independent
      cross-team reproduction under different infrastructure environments?
    - What are the boundaries of context observability assumptions, and can these
      systems remain reliable when context is partial or distribution-shifted?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型方法转化为面向数据、训练、推理和评估的端到端工作流，支撑驾驶/机器人仿真和物理机器人闭环。
      尚未覆盖: 外部部署、硬件变化和用户特定传感器或场景转移缺乏验证；多数评估仍绑定nuScenes、CARL或特定机器人平台。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环驾驶和物理机器人学习对低延迟与交互性的需求，例如FAR-Drive的单GPU亚秒级推理。
      尚未覆盖: 速度、视觉保真度、可控性与物理合理性之间的权衡，以及自回归长时域一致性在分布外条件下的退化。
    - 路线: 工件与可复现工程
      解决的问题: 通过数据集、基准和基线使系统可检查、可比较，例如LoopNav与ACT-Bench提供空间一致性和动作忠实度评测。
      尚未覆盖: 跨团队、数据集和基础设施的独立复现；不少高相关论文缺少OpenAlex标识符、完整局限性或强代码信号。
    - 路线: 世界模型一致性与控制基准
      解决的问题: 用空间一致性、动作忠实度和物理合理性等指标评估模拟器，而不只依赖像素级相似度。
      尚未覆盖: 指标各自专门化，尚未形成覆盖空间、动作、物理和策略级评估的统一评测套件。
    共识:
    - 研究越来越把视频生成和世界模型当作可运行模拟器：以闭环或下游控制行为来评价学习动力学，而不只是图像质量。
    - 动作或上下文条件化是使生成式模拟器可用的共同接口，表现为上下文状态空间动力学或动作条件视频/扩散模块。
    - 开放源码、数据集和基准被当作主要贡献之一，多个工作同时提供模型与配套基准或基线系统。
    - 高保真或真实世界部署强调系统层面问题：延迟、闭环稳定性、传感器配置和物理合理性。
    分歧:
    - 表示方式：一些系统采用以可观测上下文为条件的潜在状态空间动力学，另一些采用自回归或扩散视频生成并加入动作或轨迹控制。
    - 监督信号与损失：物理信息辅助损失、运动增强损失与基准驱动的保真度指标各自优先处理不同失败模式。
    - 评测目标：开放世界导航空间一致性、驾驶动作忠实度、无重置条件下的真实机器人学习速度，以及下游策略有用性彼此难以统一。
    - 部署场景：真实物理机器人、基于nuScenes的驾驶模拟、Minecraft开放世界，以及游戏/机器人域带来不同延迟、可控性和泛化要求。
    - 交互模式：高层目标或轨迹控制、低层动作和可观测上下文值并存；对上下文可观测性和重置条件的假设不同。
    开放问题:
    - 这些系统能否在评估数据集和平台之外泛化到未见传感器、机器人或驾驶环境？
    - 闭环使用所需的最低服务延迟和长时域稳定性是什么，如何避免自回归漂移和跨视角漂移累积？
    - 如何共同评估动作忠实度、空间一致性、物理合理性和策略迁移能力，而不是依赖各自专门的指标？
    - 现有数据集、代码和基线工件是否足以支持不同基础设施下的跨团队独立复现？
    - 上下文可观测性假设的边界在哪里，当上下文部分缺失或发生分布漂移时系统是否仍可靠？
