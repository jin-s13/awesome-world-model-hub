  related_work_outline:
  - 'Mainstream direction: Adapting video generation models into action-conditioned
    world models for robot simulation and policy learning.'
  - 'Shared research pattern: Action conditioning is injected through architecture
    design, adapter modules, or masked autoregression, while physical fidelity and
    task alignment are improved via reward-based post-training.'
  - 'Key differences: Methods diverge on whether action conditioning is embedded inside
    the generative backbone or applied as an external adapter, and on whether alignment
    targets multi-dimensional human preferences or physics-consistency discriminators.'
  - 'Trend evolution: From 2024–2026 the focus shifted from building action-conditioned
    video world models to aligning them with physical realism and diagnosing their
    reasoning limits through test-time scaling and mechanistic taxonomies.'
  - 'Open questions: Can video generation models capture causal dynamics beyond visual
    similarity, and how should persistent physical reasoning be evaluated in a standardized,
    functionally grounded manner?'
  related_work_outline_zh:
  - 主流方向：将视频生成模型适配为动作条件化的世界模型，用于机器人仿真与策略学习。
  - 研究共性：动作条件化通过架构设计、适配器模块或掩码自回归注入，同时通过基于奖励的后训练提升物理保真度和任务对齐性。
  - 关键差异：方法分歧在于动作条件嵌入生成主干内部还是作为外部适配器，以及对齐目标是多维人类偏好还是物理一致性判别器。
  - 趋势演进：2024至2026年焦点从构建动作条件视频世界模型转向对齐物理真实感，并通过测试时缩放和机制分类法诊断其推理极限。
  - 开放问题：视频生成模型能否捕捉超越视觉相似性的因果动态，以及如何以标准化、功能接地的方式评估持续物理推理。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models
      what_it_solves: Learning dynamics and control from video by conditioning generation
        on actions, enabling robot simulation, policy learning, and planning.
      what_remains_open: Long-horizon physical consistency, cross-embodiment generalization,
        theoretical guarantees for learning from action-free videos, and whether the
        learned dynamics reflect causal structure rather than visual correlation.
    - line: World model alignment and physical fidelity
      what_it_solves: Improving physical plausibility, task logic, and visual quality
        of generated rollouts through multi-dimensional reward models, preference
        optimization, or discriminative post-training.
      what_remains_open: Scalability of human preference collection, subjective reward
        design, and generalization beyond contact-rich manipulation tasks.
    - line: Capability evaluation and theoretical frameworks
      what_it_solves: Diagnosing world model reasoning limits, proposing taxonomies
        of state construction and dynamics, and advocating functional benchmarks over
        visual fidelity metrics.
      what_remains_open: Wide adoption of mechanistic benchmarks, bridging the gap
        between formal state persistence and empirical model behavior, and validation
        that test-time verifiers accurately reflect model reasoning.
    consensus:
    - Video generation is a viable substrate for world models when conditioned on
      actions.
    - Physical realism and task alignment are critical deficiencies that require explicit
      optimization beyond next-frame prediction.
    - Current evaluation metrics overemphasize visual quality and underrepresent physical
      persistence and causal reasoning.
    disagreements:
    - 'Action conditioning implementation: integrated into the transformer backbone
      (UWM, IRASim, HMA) versus external adapter without backbone access (AVID).'
    - 'Alignment strategy: multi-dimensional reward with PPO post-training (ReWorld)
      versus DPO with decoupled physics discriminators (ABot-PhysWorld).'
    - 'Evaluation focus: task-centric manipulation benchmarks (IRASim, ReWorld, ABot-PhysWorld)
      versus diagnostic test-time scaling and spatial reasoning probes (Probing effectiveness,
      A Mechanistic View).'
    open_questions:
    - Do current video-based world models learn causal dynamics or merely interpolate
      visual patterns from training data?
    - How can long-horizon physical consistency be maintained when error accumulates
      over autoregressive rollouts?
    - What is the minimal set of functional benchmarks that can replace visual fidelity
      metrics for world model evaluation?
    - Under what conditions can action-free video data substitute for action-labeled
      data in learning dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频世界模型
      解决的问题: 通过动作条件化视频生成学习动力学与控制，支持机器人仿真、策略学习和规划。
      尚未覆盖: 长时域物理一致性、跨具身泛化、从无动作视频学习的理论保证，以及所学动态是否反映因果结构而非视觉相关性。
    - 路线: 世界模型对齐与物理保真
      解决的问题: 通过多维奖励模型、偏好优化或判别式后训练提升生成轨迹的物理合理性、任务逻辑和视觉质量。
      尚未覆盖: 人类偏好收集的可扩展性、主观奖励设计，以及在接触丰富操作任务之外的泛化。
    - 路线: 能力评估与理论框架
      解决的问题: 诊断世界模型推理极限，提出状态构建和动态建模的分类法，倡导功能基准取代视觉质量指标。
      尚未覆盖: 机制化基准的广泛采用，形式化状态持久性与经验模型行为的差距，以及测试时验证器准确反映模型推理的验证。
    共识:
    - 视频生成在动作条件化时可以成为世界模型的有效载体。
    - 物理真实感和任务对齐是关键缺陷，需要超越下一帧预测的显式优化。
    - 当前评估指标过度强调视觉质量，低估了物理持久性和因果推理。
    分歧:
    - 动作条件实现方式：集成在Transformer主干内（UWM、IRASim、HMA）与外部适配器无主干访问（AVID）。
    - 对齐策略：多维奖励结合PPO后训练（ReWorld）与带有解耦物理判别器的DPO（ABot-PhysWorld）。
    - 评估重点：以任务为中心的操作基准（IRASim、ReWorld、ABot-PhysWorld）与诊断性测试时缩放和空间推理探测（Probing effectiveness、A
      Mechanistic View）。
    开放问题:
    - 当前基于视频的世界模型是否学习因果动态，还是仅从训练数据中插值视觉模式？
    - 当误差在自回归推演中累积时，如何保持长时域物理一致性？
    - 什么是最小功能基准集，可以取代视觉质量指标来评估世界模型？
    - 在什么条件下，无动作视频数据可以替代动作标签数据来学习动力学？
