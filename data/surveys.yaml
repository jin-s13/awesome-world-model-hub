  related_work_outline:
  - 'Mainstream direction: Diffusion- and Transformer-based architectures dominate
    world model design, with a focus on high-fidelity video generation, physical plausibility,
    and scalable pretraining on large robotic datasets.'
  - 'Shared research pattern: Most works couple perception and action through latent
    dynamics or multi-modal diffusion, aiming to improve generalization, long-horizon
    consistency, and downstream policy performance.'
  - 'Key differences: Models vary in representation (VAE vs. diffusion), supervision
    (mask reconstruction, physics-informed losses, action-video coupling), evaluation
    targets (visual fidelity, spatial/memory consistency, action controllability),
    and deployment domain (Atari, driving, Minecraft, robotic manipulation).'
  - 'Trend evolution: From 2023’s efficient Transformer-VAE hybrids (STORM) to 2024-2025’s
    diffusion-based compositional and physics-informed models, followed by 2025-2026
    benchmarks that rigorously assess memory and action consistency, indicating a
    shift from pure generation quality to holistic evaluation.'
  - 'Open questions: How to disentangle model gains from planner or task priors; whether
    representations transfer across domains; how to achieve long-term physical consistency
    without prohibitive compute; and how to align benchmark metrics with real-world
    task success.'
  related_work_outline_zh:
  - 主流方向：基于扩散和Transformer的架构主导世界模型设计，重点在于高保真视频生成、物理合理性以及在大规模机器人数据集上的可扩展预训练。
  - 研究共性：多数工作通过潜在动力学或多模态扩散耦合感知与动作，以提升泛化性、长时域一致性和下游策略性能。
  - 关键差异：模型在表示形式（VAE抑或扩散）、监督信号（掩码重建、物理信息损失、动作-视频耦合）、评测目标（视觉保真度、空间/记忆一致性、动作可控性）以及部署领域（雅达利、驾驶、Minecraft、机器人操作）上存在差异。
  - 趋势演进：从2023年高效的Transformer-VAE混合模型（如STORM）发展到2024-2025年基于扩散的组合模型与物理信息模型，再到2025-2026年严格评估记忆与动作一致性的基准，表明从单纯生成质量转向全面评估的转变。
  - 开放问题：如何区分模型增益与规划器或任务先验的贡献；表示能否跨领域迁移；如何在不消耗过高算力的前提下实现长期物理一致性；以及如何将基准指标与真实世界任务成功对齐。
  literature_review:
    line_of_work_matrix:
    - line: Architecture and training objective design
      what_it_solves: realizing world models through concrete representations, losses,
        and scalable architectures—e.g., Diffusion Transformers with mask reconstruction
        (MaskGWM), Transformer-VAE hybrids (STORM), and physics-informed joint training
        (RoboScape) to generate high-fidelity, temporally coherent videos.
      what_remains_open: which algorithmic choices transfer beyond the tested domains;
        whether physical consistency losses scale to diverse real-world interactions;
        and the trade-off between generation fidelity and computational efficiency.
    - line: Planning and action-interface methods
      what_it_solves: connecting learned dynamics to policy learning and generalization—via
        contextual latent states for zero-shot transfer (cRSSM), compositional language
        decomposition for unseen tasks (RoboDreamer), or unified video-action diffusion
        for pretraining (UWM)—enabling robust action-conditioned rollouts.
      what_remains_open: how much of the performance gain originates from the model
        versus the planner or task-specific priors; reliance on observable context
        or predefined primitives; and generalization to entirely novel combinations
        of actions and scenes.
    - line: Evaluation protocols and benchmarks
      what_it_solves: providing standardized metrics and datasets to measure world
        model capabilities such as spatial consistency (LoopNav), memory consistency,
        and action controllability (MIND), helping to isolate method contributions
        from implementation effects.
      what_remains_open: whether current benchmarks cover sufficient scene diversity
        and action spaces; the correlation between benchmark scores and real-world
        task performance; and the absence of a unified protocol across simulation
        and physical domains.
    consensus:
    - Deep generative models, especially diffusion and Transformers, are the preferred
      backbone for world models seeking high visual quality and long-horizon prediction.
    - Explicit incorporation of action signals or multi-modal conditioning is essential
      for bridging dynamics and policy learning.
    - Generalization beyond seen dynamics—whether zero-shot, compositional, or cross-domain—is
      a central challenge being addressed through context, language, and physics priors.
    - Standardized benchmarks are needed to objectively compare world model capabilities,
      as evaluation metrics heavily influence perceived progress.
    disagreements:
    - 'Architecture choice: Variational autoencoders (e.g., STORM) vs. diffusion models
      (e.g., MaskGWM, UWM) for stochastic dynamic modeling, with different trade-offs
      in sample efficiency and generation quality.'
    - 'Supervision signals: Some works rely on self-supervised pixel reconstruction
      or mask tokens, while others inject explicit physics constraints (depth prediction,
      keypoint dynamics) or joint action-video diffusion losses.'
    - 'Evaluation target: Benchmarks emphasize passive visual consistency (LoopNav)
      or active memory and action controllability (MIND), while method papers often
      report Atari scores or driving video fidelity, leading to fragmented progress
      metrics.'
    - 'Interaction mode: Contextual world models assume observed context values (cRSSM),
      compositional models require language parsing (RoboDreamer), and unified diffusion
      models enable flexible control over action and video generation timesteps (UWM),
      reflecting different assumptions about available information.'
    open_questions:
    - Under what conditions can world models trained in simulation or limited domains
      transfer dynamics knowledge to real-world robotic tasks?
    - How can we design a unified evaluation framework that simultaneously assesses
      visual fidelity, physical consistency, memory, and action controllability?
    - Is the gain from physics-informed losses or compositional structures sufficient
      to justify the added complexity and annotation cost across diverse environments?
    - What is the minimal set of modality-specific diffusion timesteps or context
      variables needed to achieve general-purpose world model pretraining?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 架构与训练目标设计
      解决的问题: 将世界模型想法落实为具体表示、损失和可扩展架构——例如，带有掩码重建的扩散Transformer（MaskGWM）、Transformer-VAE混合模型（STORM）以及物理信息联合训练（RoboScape），以生成高保真、时序连贯的视频。
      尚未覆盖: 哪些算法选择能迁移到测试领域之外；物理一致性损失能否扩展到多样的真实交互；以及生成保真度与计算效率之间的权衡。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到策略学习与泛化——通过上下文潜在状态实现零样本迁移（cRSSM）、组合语言分解处理未见任务（RoboDreamer）或统一视频-动作扩散进行预训练（UWM），从而生成鲁棒的动作条件化推演。
      尚未覆盖: 性能增益中有多少来自模型而非规划器或任务特定先验；对可观测上下文或预定义原语的依赖；以及对全新动作与场景组合的泛化能力。
    - 路线: 评估协议与基准
      解决的问题: 提供标准化度量和数据集来衡量世界模型的空间一致性（LoopNav）、记忆一致性和动作可控性（MIND），帮助隔离方法贡献与实现因素的影响。
      尚未覆盖: 当前基准是否覆盖了足够的场景多样性和动作空间；基准分数与真实世界任务性能之间的相关性；以及仿真与物理领域统一评估协议的缺失。
    共识:
    - 深度生成模型，尤其是扩散模型和Transformer，是追求高视觉质量和长时域预测的世界模型的主流骨干网络。
    - 显式融入动作信号或多模态条件化对于连接动力学与策略学习至关重要。
    - 超越已知动力学的泛化——无论是零样本、组合还是跨领域——是通过上下文、语言和物理先验加以解决的核心挑战。
    - 需要标准化基准来客观比较世界模型能力，因为评估指标强烈影响感知到的进展。
    分歧:
    - 架构选择：变分自编码器（如STORM）与扩散模型（如MaskGWM、UWM）在随机动力学建模上的选择，在样本效率和生成质量上存在不同权衡。
    - 监督信号：部分工作依赖自监督像素重建或掩码令牌，而其他工作注入显式物理约束（深度预测、关键点动力学）或联合动作-视频扩散损失。
    - 评测目标：基准强调被动视觉一致性（LoopNav）或主动记忆与动作可控性（MIND），而方法论文常报告Atari分数或驾驶视频保真度，导致碎片化的进展度量。
    - 交互模式：上下文世界模型假设可观测上下文值（cRSSM），组合模型依赖语言解析（RoboDreamer），统一扩散模型则允许灵活控制动作和视频生成时间步（UWM），反映了对可用信息的不同假设。
    开放问题:
    - 在仿真或有限领域训练的世界模型在何种条件下能将动力学知识迁移到真实机器人任务？
    - 如何设计一个同时评估视觉保真度、物理一致性、记忆和动作可控性的统一评估框架？
    - 物理信息损失或组合结构带来的增益是否足以证明在不同环境中增加的复杂度和标注成本是合理的？
    - 实现通用世界模型预训练所需的最小模态特定扩散时间步或上下文变量集是什么？
