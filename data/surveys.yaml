  related_work_outline:
  - 'Mainstream direction: Current application work concentrates on action-conditioned
    generative world models for robotics and driving, using diffusion transformers
    and auxiliary self-supervised tasks to produce rollouts for policy learning, simulation,
    and evaluation.'
  - 'Shared research pattern: Methods couple visual dynamics with control signals—actions,
    language instructions, or context—and assess models through rollout-level properties
    such as long-horizon coherence, spatial consistency, physical plausibility, or
    downstream policy success.'
  - 'Key differences: Studies vary in domain assumptions and conditioning mechanisms:
    explicit context variables, decomposition into language primitives, unified video-action
    diffusion, or physics-informed auxiliary losses; evaluation targets range from
    simulation fidelity to policy generalization.'
  - 'Trend evolution: The 2023–2026 top evidence moves from sample-efficient RL world
    models and contextual zero-shot generalization toward large-scale generative video
    world models for driving and robotics, alongside newly introduced consistency
    benchmarks.'
  - 'Open questions: Whether benchmark gains transfer to real-world safety, physical
    execution, and cross-embodiment or cross-dataset settings remains under-evidenced;
    long-term memory consistency and generalization across action spaces are identified
    as unresolved.'
  related_work_outline_zh:
  - 主流方向：当前应用研究集中在机器人与驾驶等具身领域，以动作条件生成式世界模型为主，结合扩散Transformer和自监督辅助任务，生成用于策略学习、仿真和评估的轨迹。
  - 研究共性：方法将视觉动态与动作、语言指令或上下文等控制信号耦合，并在长时域一致性、空间一致性、物理合理性或下游策略成功率等层面进行评测。
  - 关键差异：研究所采用的领域假设和条件机制不同，包括显式上下文变量、语言原语分解、视频-动作统一扩散以及物理信息辅助损失；评测目标覆盖仿真保真到策略泛化。
  - 趋势演进：2023–2026年的前沿证据显示，从样本高效的强化学习世界模型和上下文零样本泛化，转向面向驾驶与机器人的大规模生成式视频世界模型，并出现一致性评测基准。
  - 开放问题：基准收益能否迁移到真实安全、物理执行和跨本体或跨数据集场景仍缺乏证据；长时记忆一致性和跨动作空间泛化仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon prediction
      what_it_solves: Generates future driving scenes across views and time horizons
        to support simulation and planning in autonomous driving.
      what_remains_open: Evidence linking generation quality to closed-loop driving
        safety or real operational outcomes is absent; zero-shot transfer beyond the
        reported driving datasets remains uncertain.
    - line: Embodied robot world models with action-conditioned video generation
      what_it_solves: Learns video dynamics conditioned on actions, language primitives,
        or physics auxiliary targets for robot imagination, policy learning, and policy
        evaluation.
      what_remains_open: Generalization to novel primitives, real-world execution,
        and diverse embodiments is not established; some evaluations are simulation-only.
    - line: Efficient and contextual world models for model-based reinforcement learning
      what_it_solves: Improves sample efficiency and zero-shot task transfer by learning
        latent dynamics conditioned on context or by combining stochastic sequence
        models.
      what_remains_open: Some approaches assume observable context values and use
        limited benchmark tasks; scaling beyond Atari and CARL is unverified.
    - line: World-model evaluation benchmarks for spatial and memory consistency
      what_it_solves: Provides controlled open-domain benchmarks and metrics for spatial
        consistency, memory consistency, and action control.
      what_remains_open: Current evidence shows models struggle with long-term memory
        and cross-action-space generalization; benchmark construction papers report
        limited or no model comparison results.
    consensus:
    - 'World models in application settings are treated as predictive interactive
      environments: they generate future observations conditioned on actions or task
      instructions and are used for policies, simulation, or evaluation.'
    - There is a shared shift toward evaluating rollout consistency—spatial, memory,
      physical, and long-horizon—rather than frame-level prediction alone.
    - Generative architectures, especially diffusion and transformer backbones, are
      increasingly paired with auxiliary self-supervised objectives such as mask reconstruction,
      depth prediction, keypoint dynamics, or latent state regularization.
    - Large-scale or diverse data collection is used to stress generalization, with
      driving, robotic manipulation, and open-world navigation datasets serving as
      testbeds.
    disagreements:
    - 'Conditioning structure differs: some methods use explicit observable context
      variables, some parse language instructions into primitive models, and some
      couple video and action diffusion in one transformer.'
    - 'Primary evaluation targets differ: downstream policy quality or sample efficiency,
      generated visual and physical fidelity, benchmarked action and memory consistency,
      or long-horizon multi-view driving prediction.'
    - 'Domain constraints differ: navigation benchmarks assume loop closures or shared
      action spaces, robotic tasks assume language decomposability or physics auxiliary
      signals, and driving tasks emphasize multi-view camera geometry.'
    - 'Use of explicit physics or consistency signals differs: some methods add depth,
      keypoint, or scene-graph consistency losses, while others rely on end-to-end
      video diffusion without explicit physical state.'
    open_questions:
    - Do improvements in video prediction and simulator-based policy training transfer
      to real-world safety and operational outcomes across driving and robotics?
    - Can world models maintain long-term memory consistency and accurate action control
      when scenes, viewpoints, and action spaces change?
    - How can context and physical properties be learned without assuming observable
      context variables or explicit physics annotations?
    - Are zero-shot generalization gains observed on small benchmark suites representative
      of cross-embodiment, cross-institution, and cross-dataset transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向多视角与长时域预测的驾驶世界模型
      解决的问题: 生成未来驾驶场景，支持自动驾驶中的预测、仿真和策略评测。
      尚未覆盖: 缺乏证据将生成质量提升与闭环驾驶安全或真实运营结果联系起来；跨数据集零样本迁移仍不确定。
    - 路线: 基于动作条件视频生成的具身机器人世界模型
      解决的问题: 以动作、语言原语或物理辅助目标为条件学习视频动态，用于机器人想象、策略学习和策略评估。
      尚未覆盖: 对未知原语、真实机器人执行和多样本体的泛化尚未证实；部分评估仅限仿真。
    - 路线: 面向模型强化学习的高效上下文世界模型
      解决的问题: 通过上下文条件化潜在动态或随机序列模型提升样本效率和零样本任务迁移。
      尚未覆盖: 部分方法假设上下文可观测，且仅在有限任务上评测；向 Atari 与 CARL 之外的扩展未验证。
    - 路线: 面向空间与记忆一致性的世界模型评测基准
      解决的问题: 提供受控的开放域基准与指标，评测空间一致性、记忆一致性和动作控制。
      尚未覆盖: 证据显示现有模型在长期记忆和跨动作空间泛化上仍有困难；基准论文本身较少报告完整模型对比结果。
    共识:
    - 应用场景中的世界模型被当作可交互的预测环境，通过动作或任务指令生成未来观测，用于策略、仿真或评估。
    - 研究共同从单帧预测转向关注长时域、空间、记忆和物理等 rollout 级一致性。
    - 生成式架构尤其是扩散或 Transformer 常与掩码重建、深度预测、关键点动力学或潜在状态正则化等自监督目标结合。
    - 大规模或多样化数据被用于检验泛化，驾驶、机器人操作和开放世界导航是主要实验载体。
    分歧:
    - 条件结构不同：部分方法使用显式可观测上下文变量，部分将语言指令分解为原语模型，部分在统一 Transformer 中耦合视频与动作扩散。
    - 主要评测目标不同：下游策略质量或样本效率、生成视觉与物理保真、动作与记忆一致性基准、长时域多视角驾驶预测各有侧重。
    - 领域约束不同：导航基准假设闭环或共享动作空间，机器人任务假设语言可分解或物理辅助信号可用，驾驶任务强调多视角几何。
    - 物理与一致性信号使用不同：部分方法引入深度、关键点或场景图一致性损失，部分依赖端到端视频扩散，无显式物理状态。
    开放问题:
    - 视频预测和仿真策略训练的改进能否迁移到真实驾驶和机器人的安全与运营结果？
    - 场景、视角和动作空间变化时，世界模型能否维持长期记忆一致性和精确动作控制？
    - 如何在不假设上下文可观测、不依赖显式物理标注的情况下学习上下文与物理特性？
    - 小规模基准上的零样本泛化收益是否代表跨本体、跨机构和跨数据集的迁移能力？
