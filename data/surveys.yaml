  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing a fragmented field into coherent directions, design
        dimensions, and future research milestones.
      what_remains_open: Whether the taxonomy is backed by systematic evidence across
        all relevant works and can be empirically validated, rather than relying on
        selective, illustrative examples.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices (metrics, benchmarks,
        protocols) influence conclusions and comparing the strengths of existing evaluation
        frameworks across application domains.
      what_remains_open: The compatibility of compared results across settings; many
        evaluation frameworks are proposed but not yet implemented or tested in practice,
        so their effectiveness remains unverified.
    - line: Open problem and gap mapping
      what_it_solves: Translating broad literature coverage into concrete, actionable
        research questions and identifying unresolved technical challenges.
      what_remains_open: Prioritization of which gaps matter most for progress; the
        mapping often reflects current known limitations but may miss emerging issues
        as the field evolves rapidly.
    consensus:
    - A structured taxonomy is necessary to handle the rapid growth of world model
      research across disparate domains like video generation, autonomous driving,
      and robotics.
    - Standardized evaluation benchmarks and metrics are crucial for comparing approaches
      and measuring progress, yet current benchmarks are fragmented and domain-specific.
    - Key technical challenges include action-conditioned controllability, long-horizon
      temporal consistency, and memory mechanisms for persistent world state.
    disagreements:
    - 'Scope: some surveys aim for a general umbrella covering all world models, while
      others focus on a single application such as autonomous driving or interactive
      video.'
    - 'Maturity of evaluation: one survey proposes a detailed latent-space evaluation
      framework with resource-aware metrics, but it remains theoretical; another compares
      existing benchmarks across four domains without implementing new ones.'
    - 'Emphasis: evaluation-oriented works stress design of latent representations
      and structural priors, whereas roadmap-oriented works highlight action-conditioned
      generation and real-time interactivity.'
    open_questions:
    - How can taxonomic frameworks be empirically validated to ensure they capture
      the full diversity of methods and do not exclude emerging approaches?
    - What are the most critical open challenges (e.g., out-of-sight dynamics, compositional
      generalization, real-time latency) that, if solved, would most advance world
      model capabilities?
    - How can evaluation frameworks be standardized across applications to enable
      fair comparison, and what resource-aware metrics should be adopted to reflect
      real-world deployment constraints?
