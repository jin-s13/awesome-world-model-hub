  related_work_outline:
  - 'Mainstream direction: World-model evaluation is converging on standardized downstream
    benchmarks and consistency-oriented stress tests in embodied, driving, and game
    settings.'
  - 'Shared research pattern: Papers compare against fixed baselines on shared tasks
    and report a small set of aggregate metrics such as human-normalized score, spatial
    consistency, memory consistency, action control, or visual fidelity.'
  - 'Key differences: Evaluation targets vary from downstream policy utility in Atari/CARL
    to spatial and memory consistency in Minecraft/open scenes, multi-view driving
    generalization, and physical plausibility in robotics; supervision spans action-free
    video, action-coupled diffusion, and observable context.'
  - 'Trend evolution: The frontier is moving from aggregate game performance toward
    stress tests for long-horizon consistency, action control, cross-domain or cross-view
    generalization, physical plausibility, and policy usefulness, with increasing
    dataset and code release.'
  - 'Open questions: It remains unclear whether benchmark metrics align with real
    deployment decisions, whether tasks cover realistic long-horizon and cross-action
    settings, and whether conclusions remain stable across implementations and compute
    budgets.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正在向标准化下游基准和具身、驾驶、游戏场景中的一致性压力测试收敛。
  - 研究共性：论文通常在共享任务上对比固定基线，并报告少量汇总指标，如人类归一化得分、空间一致性、记忆一致性、动作控制或视觉保真度。
  - 关键差异：评测目标不同，有些关注Atari/CARL中的下游策略效用，有些关注Minecraft或开放场景中的空间与记忆一致性、多视角驾驶泛化，或机器人场景中的物理合理性；监督信号覆盖无动作视频、动作耦合扩散和可观测上下文。
  - 趋势演进：研究前沿正从聚合游戏性能转向长时域一致性、动作控制、跨域或跨视角泛化、物理合理性和策略有用性的压力测试，数据集与代码发布也在增加。
  - 开放问题：基准指标是否与真实部署决策一致、任务是否覆盖真实长时域和跨动作设置，以及结论在不同实现和算力预算下是否稳定，仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Shared benchmark task and dataset design
      what_it_solves: Creates reusable tasks and datasets for comparing world-model
        claims on spatial consistency, memory consistency, and action control.
      what_remains_open: Domain coverage is limited to Minecraft and selected scenes;
        coverage of real driving, robot deployment, long-horizon rollouts, and cross-action
        settings remains unresolved.
    - line: Standardized downstream policy evaluation
      what_it_solves: Provides common environments and scores such as Atari 100k and
        CARL for measuring agent utility, sample efficiency, or zero-shot generalization.
      what_remains_open: Results often come from few tasks or games, simplified assumptions
        such as observable context, and leave cross-implementation or compute-budget
        stability unverified.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial and memory consistency, action
        control, visual detail, and physical plausibility beyond aggregate comparisons.
      what_remains_open: Alignment between proxy metrics and downstream deployment
        decisions is not demonstrated; baseline sensitivity and failure boundaries
        are insufficiently reported.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results more auditable through shared baselines, open
        datasets, code, and common evaluation settings.
      what_remains_open: Several papers lack limitation analysis or standardized compute
        budgets, so reproducibility and robustness across implementations remain verification
        gaps.
    consensus:
    - Evaluation is most credible when it uses fixed tasks, baselines, and metrics
      as shared reference points.
    - World-model quality is increasingly judged by behavioral consistency and downstream
      utility, not only by visual realism.
    - Benchmarks combine action-conditioned generation with policy performance or
      consistency scoring to expose model limitations.
    - Open dataset and code artifacts are treated as important for comparability and
      reproducibility.
    disagreements:
    - Some evaluations target downstream control scores, while others target spatial,
      memory, or physical consistency of generated sequences.
    - 'Supervision assumptions differ: observable context conditioning, action-free
      video learning, and action-coupled diffusion impose different evaluation and
      data requirements.'
    - Domains differ substantially in action spaces, viewpoints, and dynamics, including
      driving, robotic manipulation, Minecraft navigation, and Atari games.
    - Methods differ in representation and generation choices such as diffusion transformers,
      VAE-transformer hybrids, or recurrent state-space models, with evaluation consequences
      that are not directly aligned.
    open_questions:
    - Do current benchmark metrics predict real-world deployment utility when proxy
      scores improve?
    - Can spatial or memory consistency benchmarks transfer across domains beyond
      the specific scenes and action spaces used?
    - Are reported human-normalized or state-of-the-art gains stable across different
      implementations, hyperparameters, and compute budgets?
    - What evaluation protocols are needed for long-horizon rollouts, cross-action
      generalization, and physical plausibility under missing real-world dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 共享基准任务与数据集设计
      解决的问题: 构建可复用的任务和数据集，用于比较世界模型在空间一致性、记忆一致性和动作控制上的主张。
      尚未覆盖: 领域覆盖主要限于Minecraft和若干场景；对真实驾驶、机器人部署、长时域展开和跨动作设置的覆盖仍未解决。
    - 路线: 标准化下游策略评估
      解决的问题: 通过Atari 100k、CARL等共享环境和分数，度量智能体效用、样本效率或零样本泛化。
      尚未覆盖: 结果常来自少量任务或游戏，并带有可观测上下文等简化假设；跨实现和算力预算的稳定性未经验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在汇总比较之外，检验预测质量、空间与记忆一致性、动作控制、视觉细节和物理合理性。
      尚未覆盖: 代理指标与下游部署决策之间的一致性尚未证明；基线敏感性和失效边界报告不足。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线、开放数据集、代码和共同评估设置，让结果更可审计。
      尚未覆盖: 若干论文缺少局限性分析或标准化算力预算，可复现性和跨实现鲁棒性仍是验证缺口。
    共识:
    - 使用固定任务、基线和指标作为共享参照点时，评估更有说服力。
    - 世界模型质量越来越依赖行为一致性和下游效用，而不仅是视觉真实感。
    - 基准将动作条件生成与策略性能或一致性评分结合，以暴露模型局限。
    - 开放数据集和代码工件被视为提高可比性和可复现性的重要条件。
    分歧:
    - 有的评估关注下游控制得分，有的关注生成序列的空间、记忆或物理一致性。
    - 监督假设不同：可观测上下文条件、无动作视频学习和动作耦合扩散对数据和评估提出不同要求。
    - 领域在动作空间、视角和动力学上差异很大，包括驾驶、机器人操作、Minecraft导航和Atari游戏。
    - 方法在表示和生成选择上不同，如扩散Transformer、VAE-Transformer混合或循环状态空间模型，其评估后果并不直接对齐。
    开放问题:
    - 当前基准指标的提升是否能预测真实世界部署效用？
    - 空间或记忆一致性基准能否跨领域迁移，超越当前使用的特定场景和动作空间？
    - 人类归一化得分或最先进提升在不同实现、超参数和算力预算下是否稳定？
    - 在缺失真实动力学的情况下，需要哪些评估协议来检验长时域展开、跨动作泛化和物理合理性？
