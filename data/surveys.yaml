  related_work_outline:
  - 'Mainstream direction: Large-scale generative world models based on diffusion
    Transformers and self-supervised pretraining, emphasizing video generation quality,
    physical consistency, and action-conditioned control.'
  - 'Shared research pattern: Learn dynamics from video data via self-supervision,
    condition on actions or context, generate future frames for planning or policy
    learning, and evaluate on standard benchmarks.'
  - 'Key differences: Divergence in architecture choices (diffusion, VAE, Transformer
    hybrids), integration of physical priors (explicit losses vs. implicit learning),
    evaluation focus (pixel fidelity vs. spatial/physical consistency), and generalization
    targets (single task vs. compositional).'
  - 'Trend evolution: Moving from RNN/VAE-based world models (e.g., Dreamer) to Transformer
    and diffusion backbones; recent emphasis on physical plausibility, compositional
    generalization, and large-scale pretraining, with benchmarks expanding from game
    environments to open-domain videos and embodied tasks.'
  - 'Open questions: How to design transferable representations and evaluation protocols
    that isolate method contributions and verify genuine physical understanding; long-term
    memory consistency and cross-action-space generalization remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基于扩散Transformer和自监督预训练的大规模生成式世界模型，强调视频生成质量、物理一致性和动作条件控制。
  - 研究共性：通过自监督从视频数据学习动力学，以动作或上下文为条件，生成未来帧用于规划或策略学习，并在标准基准上评估。
  - 关键差异：架构选择（扩散、VAE、Transformer混合）、物理先验整合方式（显式损失 vs. 隐式学习）、评测重点（像素保真度 vs. 空间/物理一致性）以及泛化目标（单任务
    vs. 组合）上的分歧。
  - 趋势演进：从基于RNN/VAE的世界模型（如Dreamer）向Transformer和扩散主干演进；近期强调物理合理性、组合泛化和大规模预训练，基准从游戏环境扩展到开放域视频和具身任务。
  - 开放问题：如何设计可迁移的表示和评估协议以隔离方法贡献并验证真实物理理解；长期记忆一致性和跨动作空间泛化仍是挑战。
  literature_review:
    line_of_work_matrix:
    - line: Representation and objective design
      what_it_solves: Instantiating world-model concepts into trainable architectures
        (e.g., diffusion Transformers, Transformer-VAE hybrids) and designing training
        targets (e.g., mask reconstruction, context conditioning, physics-informed
        losses) to capture environment dynamics.
      what_remains_open: Transferability of these design choices across task families
        (driving, robotics, Atari) and the trade-off between generation quality, computational
        efficiency, and physical accuracy.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to action spaces for policy learning,
        video plan synthesis, or zero-shot generalization, via context-conditioned
        rollouts, compositional primitives, or unified diffusion processes.
      what_remains_open: Separation of gains from the model versus the planner/controller;
        limited generalization across action spaces and reliance on observable context
        or pre-parsed primitives.
    - line: Benchmarking and evaluation protocols
      what_it_solves: Providing standardized datasets and metrics (e.g., spatial consistency
        scores, memory consistency and action control) to rigorously assess world-model
        capabilities and enable reproducible comparisons.
      what_remains_open: Coverage of diverse open-domain environments, long-term memory,
        and physical interactions; whether metrics isolate method contributions from
        dataset or implementation choices.
    consensus:
    - World models are increasingly built on generative architectures, particularly
      diffusion models and Transformers, for high-fidelity video prediction.
    - Self-supervised pretraining on large-scale, often multi-task, video datasets
      is a common strategy to improve generalization and robustness.
    - Action-conditioned generation is the primary mechanism for linking world models
      to downstream decision-making or policy learning.
    - Spatial and physical consistency are emerging as critical quality dimensions
      beyond pixel-level accuracy.
    disagreements:
    - 'Architecture: Diffusion Transformers vs. recurrent state-space models vs. compositional
      VAE-based generators.'
    - 'Physical priors: Explicitly supervised (depth, keypoint dynamics) vs. implicitly
      learned from data.'
    - 'Evaluation target: Pixel-level video fidelity vs. spatial consistency or memory
      consistency scores vs. task success in RL.'
    - 'Generalization ambition: Single-environment tasks vs. compositional generalization
      to unseen object/action combinations vs. zero-shot transfer to unseen dynamics.'
    - 'Data modality: Models that require paired action data vs. those that can leverage
      action-free videos via independent diffusion timesteps.'
    open_questions:
    - How can we verify that world models learn causal physical relationships rather
      than statistical visual correlations?
    - What evaluation protocols can isolate the contribution of the world model from
      the planner, controller, or task-specific priors?
    - How can long-term memory consistency be maintained in open-domain settings with
      large viewpoint changes and occlusions?
    - To what extent can current world models generalize to entirely novel action
      spaces or physical contexts not seen during training?
    - Are existing benchmarks sufficiently diverse and challenging to drive progress
      toward real-world embodied deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 表示与目标设计
      解决的问题: 将世界模型概念实例化为可训练的架构（如扩散Transformer、Transformer-VAE混合），并设计训练目标（如掩码重建、上下文条件、物理信息损失）以捕获环境动态。
      尚未覆盖: 这些设计选择在不同任务族（驾驶、机器人、Atari）之间的可迁移性，以及生成质量、计算效率与物理准确性之间的权衡。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到动作空间，以支持策略学习、视频计划合成或零样本泛化，通过上下文条件展开、组合原语或统一扩散过程。
      尚未覆盖: 模型收益与规划器/控制器收益的分离；跨动作空间的有限泛化能力，以及对可观测上下文或预解析原语的依赖。
    - 路线: 基准与评估协议
      解决的问题: 提供标准化数据集和指标（如空间一致性分数、记忆一致性和动作控制）以严格评估世界模型能力，并实现可复现的比较。
      尚未覆盖: 多样开放域环境、长期记忆和物理交互的覆盖；指标是否充分隔离方法贡献与数据集或实现选择。
    共识:
    - 世界模型越来越多地采用生成式架构，特别是扩散模型和Transformer，以实现高保真视频预测。
    - 在大规模、通常是多任务视频数据集上的自监督预训练是提升泛化性和鲁棒性的常见策略。
    - 动作条件生成是将世界模型与下游决策或策略学习连接的主要机制。
    - 空间和物理一致性正成为超越像素级精度的关键质量维度。
    分歧:
    - 架构：扩散Transformer vs. 循环状态空间模型 vs. 基于VAE的组合生成器。
    - 物理先验：显式监督（深度、关键点动力学） vs. 从数据中隐式学习。
    - 评测目标：像素级视频保真度 vs. 空间一致性或记忆一致性分数 vs. 强化学习任务成功率。
    - 泛化目标：单一环境任务 vs. 对未见物体/动作组合的组合泛化 vs. 对未见动力学的零样本迁移。
    - 数据模态：需要配对动作数据的模型 vs. 能够通过独立扩散时间步利用无动作视频的模型。
    开放问题:
    - 如何验证世界模型学到了因果物理关系而非统计视觉相关性？
    - 何种评估协议可以隔离世界模型贡献与规划器、控制器或任务特定先验的影响？
    - 如何在具有大视角变化和遮挡的开放域环境中维持长期记忆一致性？
    - 当前世界模型在多大程度上能泛化到训练中未见的全新动作空间或物理上下文？
    - 现有基准是否足够多样和具有挑战性，以推动向真实世界具身部署的进展？
