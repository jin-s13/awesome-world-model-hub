  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models built from
    video diffusion or latent state-space/transformer dynamics, with auxiliary self-supervised
    tasks such as mask reconstruction, depth/keypoint prediction, language composition,
    context conditioning, or action coupling for embodied and driving prediction.'
  - 'Shared research pattern: Papers couple visual or latent prediction with additional
    structure—action, language, context, masks, depth, keypoints—to improve rollout
    fidelity, controllability, or zero-shot generalization; evaluation spans simulation,
    driving, robot, and game-like domains.'
  - 'Key differences: Some models operate in pixel/video diffusion space, while others
    learn compact latent dynamics for model-based RL; interaction ranges from open-loop
    generation to closed-loop action control and policy learning; evaluation targets
    differ across sample efficiency, spatial/memory consistency, and downstream policy
    utility.'
  - 'Trend evolution: From 2023 transformer-VAE sample-efficient reinforcement learning
    models to 2024–2025 embodied video world models and contextual/physics-informed
    approaches, with emerging 2025–2026 benchmarks for spatial consistency and memory/action
    control.'
  - 'Open questions: How well do auxiliary reconstruction or physics objectives transfer
    beyond driving and robot manipulation, can models maintain long-horizon memory
    and cross-action-space consistency, and how should physical plausibility and controllability
    be measured in standard benchmarks?'
  related_work_outline_zh:
  - 主流方向：近期工作围绕生成式世界模型展开，采用视频扩散或潜在状态空间/Transformer动力学，并结合掩码重建、深度/关键点预测、语言组合、上下文条件或动作耦合等自监督任务，面向具身智能和驾驶预测。
  - 研究共性：论文普遍在视觉或潜在预测中引入动作、语言、上下文、掩码、深度、关键点等结构，以提升生成保真度、可控性或零样本泛化；评估涵盖仿真、驾驶、机器人和游戏环境。
  - 关键差异：部分方法在像素/视频扩散空间中建模，部分学习紧凑潜在动力学用于基于模型的强化学习；交互方式从开环生成到闭环动作控制与策略学习不等；评测目标包括样本效率、空间/记忆一致性和下游策略效用。
  - 趋势演进：从2023年Transformer-VAE样本高效强化学习模型，发展到2024–2025年具身视频世界模型、上下文与物理信息方法，2025–2026年出现面向空间一致性和记忆/动作控制的基准。
  - 开放问题：辅助重建或物理目标能否迁移到驾驶和机器人操作以外的领域，模型能否保持长时域记忆和跨动作空间一致性，以及如何在标准基准中衡量物理合理性与可控性。
  literature_review:
    line_of_work_matrix:
    - line: Masked diffusion video prediction with auxiliary geometric or reconstruction
        tasks
      what_it_solves: Long-horizon, multi-view or physically plausible video generation
        via diffusion transformers with masks, depth, or keypoint signals.
      what_remains_open: Most evidence is in driving or robot video domains; transferability
        to other action spaces and physical regimes is not established.
    - line: Contextual and stochastic latent dynamics for model-based reinforcement
        learning
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        by conditioning latent state-space or transformer dynamics on observed context.
      what_remains_open: Assumes observable context and limited benchmark tasks; evidence
        does not isolate model contribution from planner or task prior.
    - line: Action-coupled and language-compositional world models for robot control
      what_it_solves: Connect generated video or latent dynamics to actions, enabling
        policy learning, forward/inverse dynamics, and compositional task generalization.
      what_remains_open: Generalization remains limited to seen primitives or action
        combinations; real-robot validation and gain attribution are incomplete.
    - line: Benchmarks for spatial memory and action-control consistency
      what_it_solves: Quantify whether world models preserve loop consistency, long-term
        memory, and action effects across viewpoints and scenes.
      what_remains_open: Current models still struggle with long-term memory and cross-action-space
        generalization; benchmark scope is limited to selected scenes.
    consensus:
    - Recent world models favor generative prediction objectives, often combining
      visual or latent prediction with auxiliary signals such as masks, depth, keypoints,
      context, language, or actions.
    - Papers evaluate with multiple datasets, baselines, or benchmarks and report
      improved fidelity, sample efficiency, controllability, or generalization over
      single-task or monolithic baselines.
    - There is growing emphasis on consistency beyond short clips, including spatial
      consistency, memory consistency, and action control rather than image quality
      alone.
    - Public artifacts and code are often provided, but limitation details are uneven
      across papers.
    disagreements:
    - 'Representation: pixel-space video diffusion, latent state-space dynamics, and
      hybrid transformer-VAE approaches coexist.'
    - 'Supervision signal: some methods rely on fully self-supervised reconstruction
      or prediction, while others require action labels, observable context, language
      parsing, or physics-informed auxiliary tasks.'
    - 'Evaluation target: sample efficiency on game benchmarks, long-horizon driving
      metrics, robot policy utility, and consistency metrics represent different goals.'
    - 'Interaction mode: open-loop generation, closed-loop action conditioning, and
      policy learning from imagined rollouts are used differently.'
    - 'Deployment setting: driving, robotic simulation, open-world game environments,
      and controlled contextual reinforcement learning tasks create different generalization
      claims.'
    open_questions:
    - Do mask, depth, keypoint, and context auxiliary objectives transfer to domains
      other than driving and robot manipulation?
    - Can world models maintain long-term memory and action-control consistency across
      open-domain scenes and varying action spaces?
    - How much of reported policy or prediction improvement comes from the learned
      world model versus the planner, action interface, or task-specific priors?
    - What standardized metrics should capture physical plausibility, spatial consistency,
      and controllability without being dataset-specific?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 带掩码重建或几何辅助任务的扩散视频预测
      解决的问题: 通过扩散Transformer和掩码、深度或关键点信号，实现长时域、多视角或物理合理的视频生成。
      尚未覆盖: 证据主要集中在驾驶或机器人视频领域，尚未验证到其他动作空间和物理场景的迁移。
    - 路线: 上下文与随机潜在动力学用于基于模型的强化学习
      解决的问题: 通过对潜在状态空间或Transformer动力学引入可观测上下文，实现样本高效策略学习和零样本泛化。
      尚未覆盖: 假设上下文可观测，基准任务有限，且证据未充分隔离模型与规划器或任务先验的贡献。
    - 路线: 动作耦合与语言组合式世界模型用于机器人控制
      解决的问题: 将生成式视频或潜在动力学与动作连接，支持策略学习、正向/逆向动力学和组合任务泛化。
      尚未覆盖: 泛化仍限于训练中见过的原语或动作组合，真实机器人验证和收益归因不完整。
    - 路线: 面向空间记忆与动作控制一致性的基准
      解决的问题: 量化世界模型是否在循环导航、长时记忆和跨视角/场景动作效应上保持一致。
      尚未覆盖: 当前模型在长时记忆和跨动作空间泛化上仍存在挑战，基准场景覆盖有限。
    共识:
    - 近期世界模型普遍采用生成式预测目标，并将视觉或潜在预测与掩码、深度、关键点、上下文、语言或动作等辅助信号结合。
    - 论文常通过多个数据集、基线或基准评估，并报告在保真度、样本效率、可控性或泛化性上优于单任务或单一基线。
    - 研究越来越关注片段之外的一致性，包括空间一致性、记忆一致性和动作控制，而非仅关注图像质量。
    - 代码与工件经常公开，但方法局限说明的详细程度不一。
    分歧:
    - 表示方式：像素空间视频扩散、潜在状态空间动力学与Transformer-VAE混合方法并存。
    - 监督信号：有些方法依赖完全自监督重建或预测，有些需要动作标签、可观测上下文、语言解析或物理信息辅助任务。
    - 评测目标：游戏基准样本效率、长时域驾驶指标、机器人策略效用和一致性指标代表不同目标。
    - 交互方式：开环生成、闭环动作条件和基于想象轨迹的策略学习被不同工作采用。
    - 部署场景：驾驶、机器人仿真、开放世界游戏环境和受控上下文强化学习任务带来不同的泛化主张。
    开放问题:
    - 掩码、深度、关键点和上下文等辅助目标能否迁移到驾驶和机器人操作以外的领域？
    - 世界模型能否在开放域场景和多样化动作空间中保持长时记忆与动作控制一致性？
    - 报告的策略或预测提升有多少来自所学世界模型，多少来自规划器、动作接口或任务先验？
    - 应使用哪些标准化指标衡量物理合理性、空间一致性和可控性，而不局限于特定数据集？
