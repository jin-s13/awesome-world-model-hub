  related_work_outline:
  - 'Mainstream direction: action-conditioned video and video-action world models
    for robot manipulation, using unified generative backbones to represent policy,
    dynamics, and visual prediction in one model; recent work further adds reward/preference
    alignment or test-time verification for physical and task coherence.'
  - 'Shared research pattern: coupling observation and action modalities and evaluating
    generated rollouts through downstream control, planning, or reasoning rather than
    visual quality alone.'
  - 'Key differences: generative architecture, adaptation strategy, supervision/alignment
    signal, and evaluation target differ; whether a model is trained from scratch
    or adapts a pretrained video model is a major split.'
  - 'Trend evolution: available evidence is concentrated in 2024-2026 and moves from
    standalone robotic video generation toward larger unified models, post-training
    alignment, and test-time verification; the theory angle is represented mainly
    by a conceptual taxonomy rather than formal proofs or scaling laws.'
  - 'Open questions: formal assumptions are not yet connected to empirical model behavior;
    causal persistence, physical realism, and verifier calibration still lack cross-domain
    validation.'
  related_work_outline_zh:
  - 主流方向：以动作条件化视频和视频-动作世界模型为主，用于机器人操作；近期工作进一步结合奖励/偏好对齐或测试时验证，提升物理与任务一致性。
  - 研究共性：将观测与动作模态耦合，并以策略、动力学或规划等下游功能而非单纯视觉质量来评价生成轨迹。
  - 关键差异：生成架构、适配策略、监督/对齐信号和评测目标不同；从零训练还是适配预训练模型是主要分歧。
  - 趋势演进：证据集中在2024-2026年，从单一机器人视频生成走向更大规模统一模型、后训练对齐和测试时验证；理论主题主要由概念分类而非形式证明或缩放律代表。
  - 开放问题：形式化假设尚未与经验模型行为连接；因果持久性、物理现实性和验证器校准仍缺少跨领域验证。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions for state and dynamics
      what_it_solves: Clarifying what an action-conditioned video model must represent
        as state and dynamics before it can support policy, planning, or causal reasoning.
      what_remains_open: The formal distinctions are not yet tied to observed failures
        in realistic robotic manipulation or spatial reasoning settings.
    - line: Scaling and transferability of model capacity and heterogeneous data
      what_it_solves: Connecting larger unified models and mixed-embodiment robot
        data to better visual fidelity, controllability, and simulation speed.
      what_remains_open: No evidence in the packet establishes predictive scaling
        laws for physical persistence, causal transfer, or downstream policy robustness.
    - line: Action-conditioned generative architectures and adaptation
      what_it_solves: Representing policy, forward/inverse dynamics, and video generation
        in unified diffusion, masked autoregression, or flow-based models; adapting
        pretrained video generators without full parameter access.
      what_remains_open: Architecture-specific advantages are not isolated, and adaptation
        depends on domain-specific action-labeled data or pretrained model biases.
    - line: Alignment, test-time verification, and functional evaluation
      what_it_solves: Using reward/preference alignment or verifiable spatial assertions
        to make generated rollouts physically plausible, task-relevant, or useful
        for reasoning.
      what_remains_open: Human preference is subjective; test-time verifiers can be
        miscalibrated; improvements are benchmark-sensitive and contact-rich domains
        dominate.
    consensus:
    - Action-conditioned video generation is treated as the main route to embodied
      world models, with action and observation streams jointly modeled.
    - Visual quality alone is insufficient; physical plausibility, task success, planning,
      or spatial reasoning must be evaluated.
    - Pretrained or large-scale robot data are increasingly used to improve fidelity,
      controllability, and simulation efficiency.
    disagreements:
    - 'Generative formulation differs: diffusion transformer, masked autoregression
      over quantized/soft tokens, and flow-based post-training are used for similar
      world-model tasks.'
    - 'Supervision differs: some methods use action-free video or heterogeneous cross-embodiment
      data, while others need action-labeled videos, human preference pairs, or physics-aware
      annotations.'
    - 'Evaluation differs: some target video fidelity and controllability, others
      manipulation planning or policy correlation, and others spatial reasoning or
      physical plausibility benchmarks.'
    - 'Deployment strategy differs: some train unified models from scratch, while
      others adapt closed-source pretrained video diffusion models without accessing
      weights.'
    open_questions:
    - Which formal state/dynamics conditions, if any, are sufficient for action-conditioned
      video models to support causal long-horizon planning?
    - Why does test-time verification improve SAT-Real but not MMSI-Bench, and how
      can the information bottleneck in imagined views be reduced?
    - How can physical plausibility and embodiment be benchmarked without relying
      on subjective human preferences or contact-rich manipulation only?
    - Do scaling trends in model size and heterogeneous robot data predict cross-embodiment
      transfer and policy robustness, or only visual generation quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 状态与动态的形式化定义和假设
      解决的问题: 澄清动作条件化视频模型在支持策略、规划或因果推理前需要表示何种状态和动态。
      尚未覆盖: 形式化区分尚未与实际机器人操作和空间推理中的失败模式连接。
    - 路线: 模型容量与异构数据的缩放和迁移
      解决的问题: 将更大规模统一模型和跨本体机器人数据与视觉保真度、可控性及仿真速度联系起来。
      尚未覆盖: 证据中缺少预测物理持久性、因果迁移或下游策略鲁棒性的缩放规律验证。
    - 路线: 动作条件化生成架构与适配
      解决的问题: 在统一扩散、掩码自回归或基于流的模型中表示策略、前向/逆向动力学和视频生成；也在不访问参数时适配预训练视频生成器。
      尚未覆盖: 架构优势未被隔离；适配依赖领域动作标签数据或预训练模型偏差。
    - 路线: 对齐、测试时验证与功能评测
      解决的问题: 通过奖励/偏好对齐或可验证空间断言使生成轨迹物理合理、任务相关或可支持推理。
      尚未覆盖: 人类偏好主观；测试时验证器可能校准不良；改进依赖特定基准，且主要集中在接触丰富操作。
    共识:
    - 动作条件化视频生成被视为具身世界模型的主要路径，动作与观测流被联合建模。
    - 视觉质量单独不足以作为目标，物理合理性、任务成功、规划或空间推理必须被评测。
    - 越来越多使用预训练或大规模机器人数据提升保真度、可控性和仿真效率。
    分歧:
    - 生成式公式不同：扩散Transformer、量化/软令牌掩码自回归和基于流的后训练被用于类似任务。
    - 监督信号不同：一些方法使用无动作视频或跨本体异构数据，另一些需要动作标签视频、人类偏好对或物理感知标注。
    - 评测目标不同：有的面向视频保真度和可控性，有的面向操作规划/策略相关性，有的面向空间推理或物理合理性。
    - 部署策略不同：一些从零训练统一模型，另一些在不访问权重情况下适配闭源预训练视频扩散模型。
    开放问题:
