  related_work_outline_zh:
  - 主流方向：以世界模型为核心的可运行系统，面向自动驾驶、机器人和导航中的可控未来帧生成、动作遵循与评测。
  - 研究共性：将动作、上下文或物理结构作为条件，生成未来视频或想象轨迹，并用一致性、动作忠实度、物理合理性或下游策略成功率评估。
  - 关键差异：研究在基准评测、模型生成、跨具身适配和闭环低延迟服务之间分化，控制表示与评测目标也不相同。
  - 趋势演进：从单任务上下文模型和动作可控基准，走向更大规模、物理知情、跨具身和闭环系统；证据集中在2024至2026年前沿。
  - 开放问题：长时域一致性、跨域跨传感器泛化、独立物理合理性证据和缺失的局限性说明仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: turning world-model ideas into end-to-end workflows for data,
        training, inference, and evaluation in driving and robotics
      what_remains_open: deployment outside tested settings such as nuScenes or specific
        robot platforms; multi-sensor and multi-GPU scaling are not independently
        verified
    - line: Real-time and interactive closed-loop serving
      what_it_solves: meeting latency and interactivity requirements for closed-loop
        video generation and simulation
      what_remains_open: trade-offs between sub-second latency, long-horizon fidelity,
        and degradation under self-conditioning or distribution shift
    - line: Benchmark and reproducibility artifacts
      what_it_solves: making systems inspectable and reusable through open datasets,
        baselines, and evaluation frameworks
      what_remains_open: independent reproduction across teams and environments; some
        benchmarks report construction but not experimental results
    - line: Controllable and physics-informed generation
      what_it_solves: making future-frame generation follow action, context, or physical
        structure for policy training and evaluation
      what_remains_open: independent evidence for physical plausibility, cross-context
        zero-shot transfer, and action fidelity beyond reported datasets
    consensus:
    - World-model systems are treated as more than video generators; they are evaluated
      on action adherence, spatial or physical consistency, or downstream policy utility.
    - Action- or context-conditioned future-frame generation is a shared mechanism
      across driving, robotics, and navigation settings.
    - Benchmark construction is often packaged with open baselines or datasets to
      standardize evaluation rather than only report model scores.
    - Several top papers provide model or dataset artifacts but omit explicit limitations,
      leaving failure modes and generalization boundaries unverified.
    disagreements:
    - 'Control representation differs: structured action/trajectory controls, observable
      context values, universal latent actions, and physics/keypoint signals are used.'
    - 'Evaluation target differs: some focus on fidelity metrics or action adherence,
      while others score downstream policy success, real-robot performance, or latency.'
    - 'Interaction mode differs: offline benchmark scoring, closed-loop simulator
      rollouts, and policy training/evaluation are adopted as separate deployment
      settings.'
    - 'Deployment setting differs: single-domain driving with low-latency serving
      contrasts with cross-embodiment robot adaptation and zero-shot context transfer.'
    open_questions:
    - How do spatial-consistency and action-fidelity metrics transfer when sensors,
      environments, or robot embodiments change beyond the evaluated datasets?
    - Can closed-loop frame-autoregressive systems maintain consistency over long
      horizons outside nuScenes-like sequences?
    - What independent evidence would confirm the physical plausibility and policy
      utility claimed by physics-informed and cross-embodiment systems?
    - How much of the reported performance comes from large-scale pretraining or dataset
      design rather than the specific control interface or architecture?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将世界模型想法转化为覆盖数据、训练、推理和评测的端到端工作流
      尚未覆盖: 在nuScenes或特定机器人平台之外的部署；多传感器和多GPU扩展尚未独立验证
    - 路线: 实时与交互式闭环服务
      解决的问题: 满足闭环视频生成与模拟中的延迟和交互要求
      尚未覆盖: 亚秒级延迟与长时域保真度、自条件或分布外退化之间的权衡仍不明确
    - 路线: 基准与可复现工件
      解决的问题: 通过开放数据集、基线和评测框架使系统可检查、可复用
      尚未覆盖: 跨团队和环境的独立复现；部分基准只报告构建而缺少实验结果
    - 路线: 可控与物理知情生成
      解决的问题: 让未来帧生成遵循动作、上下文或物理结构，用于策略训练和评测
      尚未覆盖: 物理合理性、跨上下文零样本转移和动作忠实度仍缺少数据集之外的独立证据
    共识:
    - 世界模型系统被视为超越视频生成器，需要评估动作遵循、空间或物理一致性，或下游策略价值。
    - 动作或上下文条件下的未来帧生成是驾驶、机器人和导航场景中的共性机制。
    - 基准构建通常与开放基线或数据集一起发布，以标准化评测，而不只是报告模型分数。
    - 一些顶部研究提供模型或数据工件但省略明确的局限性说明，使失败模式和泛化边界未经验证。
    分歧:
    - 控制表示不同：使用结构化动作/轨迹控制、可观测上下文值、通用潜在动作或物理/关键点信号。
    - 评测目标不同：有的关注保真度指标或动作忠实度，有的评估下游策略成功率、真实机器人表现或延迟。
    - 交互模式不同：离线基准评分、闭环模拟器推演和策略训练评估作为不同的部署设置。
    - 部署场景不同：面向驾驶的低延迟服务与跨具身机器人适配、零样本上下文迁移形成对比。
    开放问题:
    - 当传感器、环境或机器人具身改变并超出已有数据集时，空间一致性和动作忠实度指标是否仍然有效？
    - 闭环帧级自回归系统能否在nuScenes类序列之外的更长时间范围内保持一致？
    - 哪些独立证据可以确认物理知情和跨具身系统所声称的物理合理性与策略价值？
    - 报告表现中有多少来自大规模预训练或数据集设计，而非特定控制接口或架构？
