  related_work_outline:
  - 'Mainstream direction: The community is shifting from generic RL world-model benchmarks
    to targeted evaluation suites that probe spatial consistency, memory, action control,
    and physical plausibility across diverse embodied and driving domains.'
  - 'Shared research pattern: All top papers define a specific evaluation protocol—either
    a dataset, a metric, or a stress test—to expose a capability gap in current world
    models, and then use it to compare existing methods or propose a new model that
    addresses that gap.'
  - 'Key differences: Works differ in what capability they stress-test (spatial consistency
    vs. memory consistency vs. visual fidelity vs. physics), the environment (Minecraft,
    Atari, driving, robotics), and whether the benchmark is designed to evaluate models
    or to serve as a training backbone for an agent.'
  - 'Trend evolution: Between 2023 and 2026, benchmarks evolved from aggregate performance
    scores on Atari 100k to closed-loop, multi-view, and long-horizon tests that demand
    open-world generalization and action-conditioned dynamics.'
  - 'Open questions: Whether current proxy metrics align with downstream task success;
    how stable benchmark conclusions remain across different model implementations
    and compute budgets; and whether the task distribution covers real-world settings
    where world models are expected to help.'
  related_work_outline_zh:
  - 主流方向：社区正从通用的强化学习世界模型基准测试，转向针对空间一致性、记忆、动作控制和物理合理性等特定能力的评估套件，覆盖具身智能和驾驶等多样化领域。
  - 研究共性：所有顶级论文均定义了一个具体的评估协议（数据集、指标或压力测试），以揭示当前世界模型的能力缺口，并使用该协议比较现有方法或提出弥补该缺口的新模型。
  - 关键差异：各工作所压力测试的能力不同（空间一致性与记忆一致性与视觉保真度与物理合理性），环境不同（Minecraft、Atari、驾驶、机器人），以及基准是用于评估模型还是作为智能体的训练骨架。
  - 趋势演进：在2023至2026年间，基准从Atari 100k上的聚合性能分数，演变为要求开放世界泛化和动作条件动力学的闭环、多视图、长时域测试。
  - 开放问题：当前代理指标是否与下游任务成功对齐；基准结论在不同模型实现和计算预算下是否稳定；任务分布是否覆盖了世界模型预期发挥作用的真实世界设置。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, such as loop-based navigation scenarios in Minecraft or multi-scene
        action-conditioned videos in diverse domains.
      what_remains_open: Whether the task distribution (e.g., single environment,
        limited action space) covers the open-world settings where world models are
        expected to help, and whether the constructed scenarios can generalize to
        unseen real-world conditions.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores, e.g., spatial consistency via scene graphs,
        memory consistency and action control in closed-loop revisitation, and visual
        fidelity under action-conditioned generation.
      what_remains_open: Alignment between proxy metrics (e.g., scene graph consistency,
        human-normalized score) and the downstream decisions users actually care about;
        lack of standardized validation that these metrics correlate with real-world
        task performance.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable through common baselines, artifacts,
        and reporting conventions, as seen in the release of code, datasets, and evaluation
        frameworks for benchmarks like LoopNav and MIND.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets; the absence of rigorous sensitivity analyses
        and the limited reporting of limitations in many model-focused papers.
    consensus:
    - World models require evaluation beyond simple visual quality or aggregate reward,
      with a growing focus on spatial consistency, long-term memory, and action controllability.
    - Static open-loop evaluation is insufficient; closed-loop, interactive, and multi-view
      benchmarks are necessary to expose failure modes of current world models.
    - The community agrees on the need for shared, reproducible benchmarks, as evidenced
      by the release of datasets and code in the majority of top papers.
    disagreements:
    - 'The primary capability to stress-test varies: some works prioritize spatial
      consistency in navigation loops, others target memory and action control across
      varied viewpoints, and yet others emphasize physical plausibility in robotic
      manipulation.'
    - Evaluation domains differ significantly, ranging from 2D Atari games to 3D driving
      simulators and real-world robotics, leading to no consensus on a single unifying
      benchmark environment.
    - 'The role of visual fidelity is contested: one line of work argues that improved
      visual details directly boost agent performance, while another suggests that
      higher-level consistency metrics matter more than pixel-level realism.'
    open_questions:
    - Do current benchmark metrics (e.g., scene graph consistency, mean human score)
      reliably predict the downstream utility of a world model for planning or decision-making?
    - How sensitive are the reported benchmark rankings to changes in model architecture,
      training budget, or random seeds, given that many papers lack detailed sensitivity
      analyses?
    - Can the task distribution in existing benchmarks—often limited to a single game
      or driving scenario—be extended to cover the diversity of real-world applications
      where world models are expected to operate?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型的主张具备可比性，例如Minecraft中的循环导航场景或跨领域多场景的动作条件视频。
      尚未覆盖: 任务分布（如单一环境、有限动作空间）是否覆盖了世界模型预期发挥作用的开放世界设置，以及构建的场景能否泛化至未见过的真实条件。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，例如通过场景图检验空间一致性，在闭环重访中检验记忆一致性与动作控制，以及动作条件生成下的视觉保真度。
      尚未覆盖: 代理指标（如场景图一致性、人类归一化得分）与用户真正关心的下游决策之间是否一致；缺乏标准化验证以证明这些指标与真实世界任务性能相关。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、工件和报告规范让结果可审计，如LoopNav和MIND等基准发布了代码、数据集和评估框架。
      尚未覆盖: 基准结论在不同实现和计算预算下是否稳定；许多以模型为中心的论文缺乏严格的敏感性分析，且局限性报告不足。
    共识:
    - 世界模型的评估需要超越简单的视觉质量或聚合奖励，越来越关注空间一致性、长期记忆和动作可控性。
    - 静态开环评估不足；需要闭环、交互式和多视图基准来揭示当前世界模型的失败模式。
    - 社区一致认为需要共享、可复现的基准，这从大多数顶级论文发布数据集和代码中可见一斑。
    分歧:
    - 压力测试的核心能力各不相同：有的工作优先考虑导航循环中的空间一致性，有的关注跨视角的记忆与动作控制，还有的强调机器人操作中的物理合理性。
    - 评估领域差异显著，从2D Atari游戏到3D驾驶模拟器和真实机器人，导致无法就单一统一基准环境达成共识。
    - 视觉保真度的角色存在争议：一条路线认为改进的视觉细节直接提升智能体性能，另一条路线则主张高层一致性指标比像素级真实感更重要。
    开放问题:
    - 当前基准指标（如场景图一致性、平均人类得分）能否可靠预测世界模型在规划或决策中的下游效用？
    - 鉴于许多论文缺乏详细的敏感性分析，所报告的基准排名对模型架构、训练预算或随机种子的变化有多敏感？
    - 现有基准中的任务分布（通常限于单一游戏或驾驶场景）能否扩展以覆盖世界模型预期运行的真实应用多样性？
