    formal analysis.'
  - 'Shared research pattern: Most works couple observation video with action and
    dynamics modeling using diffusion transformers, autoregression, or adapter-style
    post-training, then evaluate generated rollouts for planning, policy evaluation,
    or reasoning support.'
  - 'Key differences: Works diverge in representation and conditioning mechanisms,
    supervision signals such as preference data, action-labelled video, or zero-shot
