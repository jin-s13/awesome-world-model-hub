  - 'Key differences: They diverge in latent representation choices (continuous vs.
    discrete vs. hybrid), evaluation paradigms (open-loop generation quality vs. closed-loop
    task success), and deployment settings (simulation vs. physical robots).'
  - 'Trend evolution: From 2022''s online world-model learning on physical robots
    to 2024–2026''s surge of surveys and interactive video world models, the focus
    has shifted from offline generation to online, persistent dynamics and open-source
    simulators.'
  - 'Open questions: How to validate taxonomies with systematic evidence, unify evaluation
    protocols across incompatible benchmarks, and extend persistent world state formalisms
    to multi-agent, safety-critical real-world settings.'
  related_work_outline_zh:
  - 主流方向：世界模型综述正汇聚于交互式、可控、持久的世界模拟，从被动视频生成迈向具身智能与自动驾驶应用。
  - 研究共性：多数工作通过分类体系、挑战识别和基准比较来结构化该领域，强调动作条件控制、长时记忆和实时交互。
  - 关键差异：在潜在表示选择（连续/离散/混合）、评估范式（开环生成质量/闭环任务成功）和部署环境（仿真/真实机器人）上存在分歧。
  - 趋势演进：从2022年在物理机器人上在线学习世界模型，到2024–2026年综述与交互式视频世界模型涌现，重心从离线生成转向在线持久动态和开源模拟器。
  - 开放问题：如何用系统证据验证分类法，统一不兼容基准的评估协议，以及将持久世界状态形式化扩展到多智能体、安全关键的物理场景。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing fragmented world model research into unified frameworks,
        identifying key technical challenges and future directions across application
        domains.
      what_remains_open: Taxonomies are often built on selective literature reviews
        without systematic empirical validation; proposed roadmaps may quickly become
        outdated as the field evolves.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices (metrics, benchmarks,
        open-loop vs. closed-loop) shape conclusions about world model capabilities.
      what_remains_open: Cross-benchmark result compatibility is rarely verified;
        the gap between open-loop generation metrics and closed-loop task performance
        remains unresolved.
    - line: Open problem and gap mapping
      what_it_solves: Translating broad literature coverage into concrete research
        gaps such as out-of-sight dynamics, compositional generalization, and real-world
        online learning.
      what_remains_open: Prioritization of which gaps most critically block progress
        is missing; many gaps are identified under current model assumptions and may
        shift with foundation model advances.
    consensus:
    - World models are transitioning from passive video generation to interactive,
      action-conditioned simulators that support embodied decision-making.
    - Action-conditioned controllability, long-horizon temporal consistency, and real-time
      responsiveness are the three central technical challenges.
    - Evaluation must move beyond frame-wise reconstruction quality toward closed-loop,
      task-oriented metrics that measure planning and control capabilities.
    - Compositionality and modular design (e.g., factorizing language into primitives,
      structuring latent spaces with geometric priors) improve generalization to unseen
      scenarios.
    - Open-source, reproducible world models and standardized benchmarks are critical
      for accelerating community progress.
    disagreements:
    - 'Latent representation: continuous state spaces versus discrete token-based
      versus hybrid representations, each with different trade-offs in compression
      and controllability.'
    - 'Supervision signals: language-parsed primitives versus ego-motion trajectories
      and human poses versus pure image observations with sparse rewards, leading
      to different generalization scopes.'
    - 'Evaluation target: video generation fidelity versus task success rate in downstream
      robot execution versus consistency of persistent out-of-sight dynamics.'
    - 'Interaction mode: offline video synthesis from static prompts versus online
      real-time interaction with sub-second latency versus closed-loop policy learning
      on physical robots.'
    - 'Deployment setting: simulation-only evaluation versus real-world robot learning
      without simulators versus large-scale real-world driving datasets, each with
      distinct safety and reproducibility constraints.'
    open_questions:
    - How can taxonomy and roadmap claims be systematically validated beyond curated
      examples, and what empirical evidence would confirm a proposed framework's completeness?
    - What unified evaluation protocol can reconcile incompatible benchmarks across
      open-world exploration, autonomous driving, and robotics to enable fair cross-paper
      comparison?
    - What are the minimal sensing and supervision requirements for learning a world
      model that supports safe, robust online adaptation on physical robots?
    - How can persistent world state formalisms (e.g., out-of-sight dynamics) be extended
      to multi-agent, long-duration scenarios where entities interact and occlude
      each other?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为统一框架，识别跨应用领域的关键技术挑战和未来方向。
      尚未覆盖: 分类法多基于选择性文献回顾，缺乏系统实证验证；提出的路线图可能随领域快速演变而过时。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（指标、基准、开环/闭环）如何影响关于世界模型能力的结论。
      尚未覆盖: 跨基准的结果兼容性很少被验证；开环生成指标与闭环任务性能之间的差距仍未解决。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体研究缺口，如视线外动态、组合泛化和真实世界在线学习。
      尚未覆盖: 哪些缺口最阻碍进展的优先级排序缺失；许多缺口在当前模型假设下识别，可能随基础模型进步而改变。
    共识:
    - 世界模型正从被动视频生成转向支持具身决策的交互式、动作条件模拟器。
    - 动作条件可控性、长时域时间一致性和实时响应性是三大核心技术挑战。
    - 评估必须超越逐帧重建质量，转向衡量规划和控制能力的闭环、任务导向指标。
    - 组合性和模块化设计（如将语言分解为原语、用几何先验结构化潜在空间）能提升对未见场景的泛化。
    - 开源、可复现的世界模型和标准化基准对加速社区进步至关重要。
    分歧:
    - 潜在表示：连续状态空间、离散令牌或混合表示，各自在压缩率和可控性上有不同权衡。
    - 监督信号：语言解析原语、自我运动轨迹与人体姿态、或仅图像与稀疏奖励，导致不同的泛化范围。
    - 评测目标：视频生成保真度、下游机器人执行的任务成功率、或持久视线外动态的一致性。
    - 交互模式：基于静态提示的离线视频合成、亚秒级延迟的在线实时交互、或物理机器人上的闭环策略学习。
    - 部署环境：纯仿真评估、无模拟器的真实机器人学习、或大规模真实驾驶数据集，各有不同的安全与可复现约束。
    开放问题:
    - 如何超越精选示例，系统验证分类法和路线图的主张，哪些实证证据能确认所提框架的完备性？
    - 何种统一评估协议能调和开放世界探索、自动驾驶和机器人领域不兼容的基准，实现公平的跨论文比较？
    - 在物理机器人上支持安全、鲁棒在线适应的世界模型，其最低感知和监督要求是什么？
    - 如何将持久世界状态形式化（如视线外动态）扩展到实体相互交互和遮挡的多智能体、长时域场景？
