  related_work_outline_zh:
  - 主流方向：基于视频生成构建世界模型，用于机器人、自动驾驶和开放世界探索等交互任务，并越来越强调实时交互、长时记忆和视线外动态。
  - 研究共性：通过语言或结构化原语分解视频生成以实现组合泛化，同时利用潜变量或全局状态保持时间一致性。
  - 关键差异：综述在分类维度（按应用场景 vs. 按潜空间表示）、评估框架（定性列出挑战 vs. 提出度量套件）和领域侧重（通用 vs. 自动驾驶特定）上存在分歧。
  - 趋势演进：从2022年基于Dreamer的物理机器人学习，到2024-2026年关于Sora式视频模拟器的综述，再到解决视线外动态、开源实时系统和自我视角控制的方法，表明从被动生成向交互式、持久的世界模拟转变。
  - 开放问题：缺乏统一的物理合理性闭环基准，如何在长期记忆与计算成本间取得平衡，以及如何验证组合原语能够真正覆盖开放世界的多样性。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing fragmented world model research into coherent frameworks
        by categorizing approaches along dimensions such as application scenario,
        latent representation, or structural priors, and by identifying technical
        challenges and future directions.
      what_remains_open: Most taxonomies are built on selective literature reviews
        without systematic empirical validation; cross-domain compatibility and the
        completeness of proposed categories remain unverified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation metrics and settings (e.g.,
        open-loop vs. closed-loop, resource-aware inference cost) shape conclusions
        across world model papers, and prescribing evaluation frameworks to reduce
        mismatch.
      what_remains_open: The proposed evaluation suites are not yet implemented or
        tested; it is unclear whether results from different settings can be fairly
        compared, and no standardized benchmark for physical world simulation exists.
    - line: Open problem and gap mapping
      what_it_solves: Turning broad literature coverage into concrete next-step research
        questions, such as action-conditioned controllability, long-horizon memory,
        and out-of-sight dynamics, which are highlighted as major unsolved challenges.
      what_remains_open: Prioritization of these gaps is not backed by quantitative
        difficulty or impact measures; many gaps are identified from qualitative trends,
        not from systematic failure analysis.
    consensus:
    - Video generation is the central paradigm for building world models, with the
      aim of simulating realistic environments for interactive agents.
    - 'Three cross-cutting challenges are widely recognized: achieving fine-grained
      action-conditioned controllability, maintaining long-horizon temporal consistency
      and memory, and enabling real-time responsiveness.'
    - Most works agree that world models must move beyond 2D observation generation
      toward persistent 4D dynamic simulation, incorporating both static scene structure
      and evolving entities.
    - There is a shared call for open-source, reproducible world model systems and
      for benchmarks that go beyond short-term visual fidelity to measure physical
      plausibility and decision-making utility.
    disagreements:
    - 'Taxonomy granularity: some surveys structure the field by application domains
      (open-world exploration, gaming, autonomous driving, robotics), while others
      propose a latent-space-centric framework based on continuous states, discrete
      tokens, or hybrid representations.'
    - 'Evaluation methodology: works like the unified latent world model survey propose
      concrete metrics and resource-aware inference cost, whereas other surveys remain
      at the level of listing challenges without quantifiable evaluation protocols.'
    - 'Domain specificity: one subset of work focuses exclusively on automated driving
      world models, treating lane topology and ego-motion as primary, while general
      surveys cover a broader scope including embodied AI and video generation benchmarks.'
    - 'Interaction paradigm: method papers emphasize different interaction modes,
      e.g., language-driven composition (RoboDreamer), trajectory-based ego-motion
      control (GEM), or monitor-based autonomous simulation (LiveWorld), without a
      unified interaction interface.'
    open_questions:
    - How can a unified benchmark be designed to evaluate world models as world simulators,
      measuring not just visual quality but also physical consistency, causal reasoning,
      and decision-making capability in closed-loop settings?
    - What mechanisms enable world models to simulate persistent out-of-sight dynamics
      without exploding memory or computational cost, and how can generalization to
      entirely novel object/action compositions be achieved?
    - How can the gap between open-loop video generation metrics and downstream task
      performance (e.g., robot execution success) be systematically bridged, given
      that few papers provide real-robot validation?
    - What is the minimal set of structural priors (geometry, topology, semantics)
      needed for a world model to support multiple downstream applications, and how
      can these priors be learned rather than hand-crafted?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 通过按应用场景、潜表示或结构先验等维度分类方法，并识别技术挑战和未来方向，将碎片化的世界模型研究组织成连贯的框架。
      尚未覆盖: 大多数分类法基于选择性文献综述，缺乏系统实证验证；跨领域兼容性和所提分类的完整性未经验证。
    - 路线: 对比评测综合
      解决的问题: 总结不同评估指标和设置（如开环 vs. 闭环、资源感知推理成本）如何影响世界模型文献中的结论，并设计评估框架以减少不匹配。
      尚未覆盖: 所提评估套件尚未实施或测试；尚不清楚不同设置下的结果是否可以公平比较，且缺乏物理世界模拟的标准化基准。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体的下一步研究问题，例如动作条件可控性、长时程记忆和视线外动态，这些被突出为主要未解决的挑战。
      尚未覆盖: 这些缺口的优先级排序缺乏定量难度或影响度量支撑；许多缺口通过定性趋势识别，而非系统性的失败分析。
    共识:
    - 视频生成是构建世界模型的核心范式，旨在为交互式智能体模拟真实环境。
    - 广泛公认的三个跨领域挑战：实现细粒度动作条件可控性、保持长时程时间一致性和记忆、实现实时响应。
    - 多数工作一致认为世界模型必须超越2D观察生成，走向包含静态场景结构和动态演化实体的持久4D动态模拟。
    - 普遍呼吁开源、可复现的世界模型系统，以及超越短期视觉保真度、衡量物理合理性和决策效用的基准。
    分歧:
    - 分类粒度：一些综述按应用领域（开放世界探索、游戏、自动驾驶、机器人）组织领域，而另一些提出基于潜空间的框架，区分连续状态、离散令牌或混合表示。
    - 评估方法论：统一潜世界模型综述等提出具体度量套件和资源感知推理成本，而其他综述停留在列出挑战的层面，缺少可量化的评估协议。
    - 领域特异性：一部分工作专注于自动驾驶世界模型，将车道拓扑和自我运动作为首要因素，而通用综述覆盖更广的范围，包括具身AI和视频生成基准。
    - 交互范式：方法论文强调不同的交互模式，如语言驱动组合（RoboDreamer）、基于轨迹的自我运动控制（GEM）或基于监控的自主模拟（LiveWorld），缺乏统一的交互接口。
    开放问题:
    - 如何设计统一的基准来评估作为世界模拟器的世界模型，不仅衡量视觉质量，还衡量闭环环境中的物理一致性、因果推理和决策能力？
    - 什么机制能使世界模型以不爆炸的内存或计算成本模拟持久的视线外动态，以及如何实现对全新物体/动作组合的泛化？
    - 鉴于目前很少有论文提供真实机器人验证，如何系统性地弥合开环视频生成指标与下游任务表现（如机器人执行成功率）之间的差距？
    - 支持多个下游应用所需的最小结构先验（几何、拓扑、语义）集是什么，以及如何让这些先验通过学习而非手工设计获得？
