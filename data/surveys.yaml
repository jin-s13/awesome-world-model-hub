  related_work_outline:
  - 'Mainstream direction: Current work concentrates on evaluating action-conditioned
    world models across open-domain videos, driving scenes, robotic datasets, and
    RL benchmarks, with newer benchmarks targeting spatial consistency, long-term
    memory, and action control rather than frame-level quality alone.'
  - 'Shared research pattern: Papers introduce or reuse a dataset/task, define metrics
    that stress generalization beyond aggregate scores, and compare against standard
    baselines under a fixed protocol; recent evidence emphasizes long-horizon, multi-view,
    zero-shot, and cross-action settings.'
  - 'Key differences: Evaluation targets vary: spatial consistency via scene graphs,
    memory/action-control via closed-loop revisits, visual detail/control on Atari,
    contextual RL generalization, and driving multi-view generation. Model choices
    differ in diffusion, transformer, and latent-dynamics representations, but these
    are content-level differences rather than tag differences.'
  - 'Trend evolution: Within the recent frontier, 2023-2024 evidence focuses more
    on model-level gains on Atari and contextual RL, while 2025-2026 evidence shifts
    toward dedicated benchmark datasets and stress tests for memory, spatial consistency,
    and driving generalization.'
  - 'Open questions: Do current task distributions cover real settings where world
    models should help? Are proxy metrics aligned with downstream decisions? Are benchmark
    conclusions stable across implementations and compute budgets? Several sources
    lack visible code, dataset, metric, or limitation details.'
  related_work_outline_zh:
  - 主流方向：当前研究集中于评估动作条件世界模型，覆盖开放域视频、驾驶场景、机器人数据和强化学习基准；新基准越来越多地考察空间一致性、长时记忆和动作控制，而非仅评估帧级质量。
  - 研究共性：论文引入或复用数据集/任务，定义能暴露泛化短板的指标，并在固定协议下与标准基线比较；近期证据强调长时域、多视角、零样本和跨动作设置。
  - 关键差异：评测目标各不相同：基于场景图的空间一致性、闭环重访的记忆/动作控制、Atari视觉细节与控制、上下文强化学习泛化、驾驶多视角生成；模型在扩散、Transformer和潜变量动力学等表示上不同，但并非标签性差异。
  - 趋势演进：在当前前沿时间窗内，2023-2024年证据更关注模型在Atari和上下文强化学习上的指标提升，2025-2026年证据转向针对记忆、空间一致性和驾驶泛化的专用基准与压力测试。
  - 开放问题：当前任务分布是否覆盖世界模型应发挥作用的真实设置？代理指标是否与下游决策一致？基准结论在不同实现和算力预算下是否稳定？若干来源缺少可见的代码、数据集、指标或局限性说明。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared datasets and tasks for comparing world-model
        claims, including loop-navigation videos, open-domain video-action pairs,
        contextual RL suites, and standard Atari/driving protocols.
      what_remains_open: Whether task distributions cover long-horizon, zero-shot,
        multi-view, and real deployment conditions; some benchmark entries report
        dataset construction without experimental baselines.
    - line: Metric and stress-test design
      what_it_solves: Probing world models beyond aggregate generation quality, including
        spatial consistency, temporal memory, action control, visual detail, and downstream
        policy utility.
      what_remains_open: Alignment between proxy metrics and downstream decisions
        users care about; limited evidence on metric sensitivity across domains, implementations,
        or compute budgets.
    - line: Comparable baselines and reporting
      what_it_solves: Anchoring evaluations to common baselines such as Dreamer v3,
        imitation learning, state-of-the-art driving predictors, and human-normalized
        RL scores.
      what_remains_open: Stability of conclusions across implementations and compute
        budgets; many sources have empty limitation fields or incomplete artifact
        signals, creating verification gaps.
    - line: Model capability evaluation under benchmark pressure
      what_it_solves: Comparing diffusion, transformer-VAE, contextual latent, and
        physics-informed models on shared control and video-generation benchmarks.
      what_remains_open: Whether gains come from visual fidelity, dynamics, or benchmark
        fit, and whether model-level results transfer beyond the tested games, robotic
        scenes, or driving datasets.
    consensus:
    - Evaluations are moving toward action-conditioned and consistency-driven protocols,
      treating visual fidelity as necessary but insufficient.
    - There is a shared need for standardized datasets and baselines so world-model
      claims can be compared across tasks, scenes, and action spaces.
    - World-model evidence increasingly pairs model training with benchmark evaluation
      on Atari, contextual RL, driving, robotic video, or open-domain video settings.
    disagreements:
    - Some evaluations target spatial consistency through loop closure and scene graphs,
      while others target long-term memory consistency and action control across viewpoints.
    - Some benchmark-oriented sources report dataset and metric construction rather
      than experimental results, while model-oriented sources report quantitative
      gains on established benchmarks.
    - 'Methods differ in representation and supervision: diffusion video generation
      with auxiliary reconstruction, transformer-based stochastic dynamics, contextual
      recurrent state-space models, and physics-informed video synthesis.'
    - 'Evaluation settings differ materially: first-person/third-person videos under
      shared action spaces, multi-view driving, Atari game frames, and contextual
      reinforcement learning tasks.'
    open_questions:
    - How well do loop-navigation and memory/action-control benchmarks transfer to
      real driving, robotic, or deployment settings?
    - Which consistency or visual-detail metrics best predict downstream policy quality
      and user-relevant decisions?
    - Are benchmark conclusions robust across different implementations, compute budgets,
      and unreported hyperparameter choices?
    - How should future benchmarks handle unobserved context, long-horizon rollout,
      and cross-action-space generalization?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享数据集和任务以比较世界模型主张，包括循环导航视频、开放域视频-动作对、上下文强化学习套件及标准Atari/驾驶协议。
      尚未覆盖: 任务分布是否覆盖长时域、零样本、多视角和真实部署条件；部分基准来源仅报告数据集构建，缺少实验基线。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合生成质量之外考察空间一致性、时间记忆、动作控制、视觉细节和下游策略效用。
      尚未覆盖: 代理指标与用户关心的下游决策之间是否一致；关于指标在不同领域、实现或算力预算下敏感性的证据有限。
    - 路线: 可比基线与报告规范
      解决的问题: 以Dreamer v3、模仿学习、最先进驾驶预测器和人类归一化强化学习得分等共同基线锚定评估。
      尚未覆盖: 结论在不同实现和算力预算下是否稳定；许多来源的局限性字段为空或工件信号不完整，形成验证缺口。
    - 路线: 基准压力下的模型能力评估
      解决的问题: 在共享控制与视频生成基准上比较扩散、Transformer-VAE、上下文潜变量和物理信息驱动模型。
      尚未覆盖: 性能提升来自视觉保真、动力学还是基准匹配，以及模型结果能否迁移到测试游戏、机器人场景或驾驶数据集之外。
    共识:
