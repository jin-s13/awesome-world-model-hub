  related_work_outline:
  - 'Mainstream direction: Predictive model evaluation is shifting from short-horizon
    aggregate task scores toward specialized datasets and stress tests for long-horizon,
    multi-view, action-conditioned, and memory-consistent generation.'
  - 'Shared research pattern: Works typically couple a predictive/generative backbone
    with an evaluation protocol or downstream control task, then compare against prior
    methods on established suites such as Atari 100k, CARL, NuScenes, OpenDV-2K, Waymo,
    or Minecraft.'
  - 'Key differences: They differ in what is evaluated—visual fidelity, physical plausibility,
    spatial consistency, memory/action control, environment returns, or zero-shot
    generalization—and in whether training uses observations, actions, context, or
    physics side signals.'
  - 'Trend evolution: Available top papers concentrate in 2023–2026; earlier evidence
    focuses on Atari 100k sample efficiency, while recent work moves toward open-domain
    navigation, embodied robotics, video-action diffusion, and physics-informed generation.'
  - 'Open questions: Whether specialized consistency metrics align with downstream
    policy utility, whether benchmarks transfer beyond their constructed task distributions,
    and whether conclusions remain stable across architectures and compute budgets.'
  related_work_outline_zh:
  - 主流方向：预测模型评估正在从短时程聚合任务分数转向专用数据集与压力测试，覆盖长时程、多视角、动作条件和记忆一致性生成。
  - 研究共性：工作通常将预测/生成主干与评测协议或下游控制任务结合，并在 Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo 或
    Minecraft 等现有套件上比较。
  - 关键差异：评测目标不同，包括视觉保真、物理合理性、空间一致性、记忆/动作控制、环境回报或零样本泛化；训练信号也不同，包括观测、动作、上下文或物理辅助信号。
  - 趋势演进：可用高相关论文集中在2023–2026年；较早证据关注Atari 100k样本效率，近期转向开放域导航、具身机器人、视频-动作扩散和物理信息生成。
  - 开放问题：专用一致性指标是否与下游策略效用对齐，基准能否跨出构造的任务分布，以及结论在不同架构和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets for comparing long-horizon,
        multi-view, action-conditioned, or open-domain predictive generation across
        models.
      what_remains_open: Whether constructed task distributions cover deployment variability
        and failure modes beyond curated scenes, navigation loops, or fixed action
        spaces.
    - line: Metric and stress-test design
      what_it_solves: Probes properties that aggregate scores miss, such as spatial
        consistency, memory consistency, action control, physical plausibility, and
        zero-shot dynamics generalization.
      what_remains_open: Whether these proxy stress metrics align with downstream
        decision quality and remain sensitive without overfitting to metric-specific
        artifacts.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through shared suites, baseline comparisons,
        code/dataset artifacts, and standardized evaluation settings across architectures.
      what_remains_open: Whether benchmark conclusions remain stable across implementation
        details and compute budgets, since many reports lack full limitation or robustness
        evidence.
    consensus:
    - Evaluation is moving beyond single aggregate performance numbers to stress properties
      such as long-horizon rollout, spatial or temporal consistency, memory, and action-conditioned
      control.
    - Recent work commonly pairs a predictive model with a downstream task or metric,
      using established suites as a shared reference rather than constructing isolated
      single-task evaluations.
    - Reproducibility is increasingly treated as part of benchmark value, with open
      datasets, code, or artifacts accompanying new evaluation protocols.
    - 'Many comparisons report state-of-the-art improvements, but the evidence base
      remains narrow: key conclusions often rest on a small number of environments
      or tasks.'
    disagreements:
    - 'Evaluation target differs: some works optimize environment returns or policy
      generalization, while others optimize visual fidelity, physical plausibility,
      spatial consistency, or memory/action control.'
    - 'Training and supervision differ: some use self-supervised visual prediction,
      others condition on observable context, joint video-action diffusion, or physics
      side signals such as depth and keypoints.'
    - 'Interaction mode differs: some evaluate closed-loop agent control or policy
      rollout, while others evaluate open-loop generation or benchmark-only consistency.'
    - 'Deployment setting differs: testbeds range from Atari and contextual control
      tasks to Minecraft navigation, driving scenes, and robotic manipulation scenarios.'
    open_questions:
    - How well do spatial, temporal, or memory-consistency metrics predict downstream
      policy success when the evaluated task distribution changes?
    - What benchmark design is needed to test generalization under unobservable or
      partially observed dynamics, given that some methods assume context is available?
    - Are current open-domain and robotic benchmarks large and varied enough to expose
      long-horizon stability and cross-action-space transfer?
    - How stable are benchmark conclusions across architecture choices and compute
      budgets when many reports do not include full limitation or robustness analyses?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，用于跨模型比较长时程、多视角、动作条件或开放域预测生成。
      尚未覆盖: 构造的任务分布是否涵盖部署中的变化和失败模式，在跨场景、跨动作空间下仍未被充分验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、物理合理性以及零样本动力学泛化。
      尚未覆盖: 这些代理压力指标是否与下游决策质量一致，以及是否会出现针对指标伪影的过拟合。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享评测套件、基线对比、代码/数据集工件和标准化设置，让结果可审计。
      尚未覆盖: 评测结论在不同实现细节和算力预算下是否稳定，许多报告缺少完整的局限性或鲁棒性证据。
    共识:
    - 评估正在从单一聚合性能分数转向对长时程展开、时空一致性、记忆和动作条件控制等压力特性的检验。
    - 近期工作通常将预测模型与下游任务或指标结合，以现有评测套件作为共享参照，而不是各自构建孤立评测。
    - 可复现性越来越被视为基准价值的一部分，新评测协议常同时发布数据集、代码或工件。
    - 许多比较报告显示最先进性能提升，但证据范围较窄，关键结论常依赖少量环境或任务。
    分歧:
    - 评测目标不同：有的优化环境回报或策略泛化，有的优化视觉保真、物理合理性、空间一致性或记忆/动作控制。
    - 训练与监督信号不同：有的使用自监督视觉预测，有的依赖可观测上下文、视频-动作联合扩散，或深度与关键点等物理辅助信号。
    - 交互模式不同：有的评估闭环智能体控制或策略展开，有的只评估开环生成或基准一致性。
    - 部署场景不同：测试环境涵盖Atari、上下文控制、Minecraft导航、驾驶和机器人操作等不同设置。
    开放问题:
    - 当任务分布变化时，空间、时间或记忆一致性指标在多大程度上能预测下游策略成功？
    - 面对不可观测或部分观测动力学，需要怎样的基准设计，尤其是现有方法常假设上下文可观测？
    - 当前开放域和机器人基准是否足够大且多样，能揭示长时程稳定性和跨动作空间迁移？
    - 在许多报告未包含完整局限性或鲁棒性分析的情况下，基准结论在不同架构和算力预算下是否稳定？
