  related_work_outline:
  - 'Mainstream direction: World model architectures are shifting from pixel-level
    generation to structured generation incorporating physical priors, action conditioning,
    and contextual information, with diffusion models and Transformers as dominant
    backbones.'
  - 'Shared research pattern: Most works learn environment dynamics via self-supervised
    next-frame or future-state prediction on large-scale video data, then use the
    learned model for policy learning or planning.'
  - 'Key differences: Methods diverge on whether to explicitly model physical knowledge,
    whether to condition on or jointly generate actions, and whether to optimize for
    visual fidelity or downstream task performance.'
  - 'Trend evolution: From 2023 to 2026, the field moved from pure video prediction
    toward embodied world models integrating actions, context, and physics, with evaluation
    expanding from visual quality to memory consistency and action control.'
  - 'Open questions: How to guarantee long-horizon physical consistency? How to isolate
    model contributions from the planner/controller? Do current benchmarks reflect
    real-world deployment challenges?'
  related_work_outline_zh:
  - 主流方向：世界模型架构正从像素级生成向融合物理先验、动作条件和上下文信息的结构化生成演进，扩散模型和Transformer成为主导架构。
  - 研究共性：多数工作通过在大规模视频数据上自监督预测未来帧或状态来学习环境动力学，并利用学到的模型进行策略学习或规划。
  - 关键差异：方法在是否显式建模物理知识、是否将动作作为条件输入还是联合生成、以及优化目标是视觉保真度还是下游任务性能等方面存在分歧。
  - 趋势演进：2023至2026年间，领域从纯视频预测模型转向整合动作、上下文和物理的具身世界模型，评估基准从视觉质量扩展到记忆一致性和动作控制。
  - 开放问题：如何保证长期预测的物理一致性？如何分离模型与规划器或控制器的贡献？现有基准能否反映真实世界部署的挑战？
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architecture design (diffusion/Transformer)
      what_it_solves: Representing environment dynamics as high-fidelity, long-horizon
        video or state prediction models.
      what_remains_open: How architectural choices affect downstream task performance;
        error accumulation and physical consistency in long rollouts.
    - line: Contextual and compositional world models
      what_it_solves: Achieving zero-shot or compositional generalization across varying
        dynamics, tasks, and object combinations.
      what_remains_open: Generalization to entirely novel contexts or primitives;
        the assumption that context values are observable.
    - line: Action and planning interfaces
      what_it_solves: Connecting learned dynamics to decision-making for policy learning,
        planning, or control.
      what_remains_open: Disentangling model gains from the planner or controller;
        error propagation in multi-step planning.
    - line: World model evaluation benchmarks
      what_it_solves: Systematically assessing spatial consistency, memory, and action
        control capabilities of world models.
      what_remains_open: Standardization of benchmarks and their predictive validity
        for real-world task performance.
    consensus:
    - World models are moving from naive video generation toward more structured,
      conditional generation incorporating actions, context, and physical priors.
    - Diffusion models and Transformers have become the mainstream architectures due
      to their ability to handle complex spatiotemporal data.
    - Evaluation is shifting from single visual quality metrics toward functional
      consistency metrics such as spatial consistency, memory, and action control.
    - World models are increasingly used as internal simulators tightly coupled with
      policy learning in embodied AI settings like robotics and autonomous driving.
    disagreements:
    - 'Whether to explicitly inject physical knowledge: some works learn physics via
      depth prediction and keypoint dynamics, while others rely purely on data-driven
      generation.'
    - 'How actions are coupled with the world model: joint diffusion of video and
      action versus conditioning on actions versus using the model only to generate
      imagined trajectories for a separate policy.'
    - 'Generalization strategy: context-conditioned zero-shot generalization versus
      compositional generalization via primitive decomposition versus relying on data
      coverage.'
    - 'Evaluation domains: methods are validated on driving, Atari games, robotic
      manipulation, and navigation benchmarks, making cross-domain comparison difficult.'
    open_questions:
    - How can current world models guarantee physical consistency in long-horizon
      predictions, especially in out-of-distribution regions?
    - How can we quantify the independent contribution of the world model to downstream
      policy performance, separating it from the planner or controller?
    - Do existing benchmarks for memory consistency and action control adequately
      represent the dynamic interaction requirements of real-world robots?
    - How can world models achieve robust generalization when context is unobservable
      or unknown?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构设计（扩散/Transformer）
      解决的问题: 将环境动力学表示为高保真、长时域的视频或状态预测模型。
      尚未覆盖: 架构选择如何影响下游任务性能；长期预测中的误差累积和物理一致性。
    - 路线: 上下文与组合世界模型
      解决的问题: 在动态上下文或组合任务中实现零样本或组合泛化。
      尚未覆盖: 对全新上下文或原语的泛化；上下文值可观测的假设局限。
    - 路线: 动作与规划接口
      解决的问题: 将学到的动力学连接到决策，用于策略学习、规划或控制。
      尚未覆盖: 模型收益与规划器或控制器的贡献分离；多步规划中的误差传播。
    - 路线: 世界模型评估基准
      解决的问题: 系统评估世界模型的空间一致性、记忆和动作控制能力。
      尚未覆盖: 基准的标准化及其对真实任务性能的预测效度。
    共识:
    - 世界模型正从简单视频生成向融合动作、上下文和物理先验的结构化生成发展。
    - 扩散模型和Transformer已成为主流架构，因其能处理复杂时空数据。
    - 评估方式正从单一视觉质量指标转向功能一致性指标，如空间一致性、记忆和动作控制。
    - 世界模型在具身智能中作为内部模拟器，与策略学习紧密结合。
    分歧:
    - 是否显式注入物理知识：有的方法通过深度预测和关键点动力学学习物理，有的则纯粹依赖数据驱动生成。
    - 动作与世界的耦合方式：将视频和动作联合扩散，或将动作作为条件输入，或仅用世界模型生成想象轨迹供独立策略使用。
    - 泛化策略：通过上下文条件实现零样本泛化，或通过原语分解实现组合泛化，或依赖数据覆盖。
    - 评估领域：方法在驾驶、游戏、机器人操作和导航等不同基准上验证，跨领域比较困难。
    开放问题:
    - 当前世界模型在长期预测中如何保证物理一致性，特别是在训练未覆盖的区域？
    - 如何量化世界模型对下游策略性能的独立贡献，将其与规划器或控制器的提升分离？
    - 现有的记忆一致性和动作控制基准能否充分代表现实世界机器人的动态交互需求？
    - 在上下文不可观测或未知的情况下，世界模型如何实现稳健泛化？
