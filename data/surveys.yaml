  related_work_outline:
  - 'Mainstream direction: Developing video-based world models with interactive, long-horizon,
    and controllable dynamics for robotics and autonomous driving.'
  - 'Shared research pattern: Factorizing video generation using language or structure,
    adding memory for out-of-sight states, and benchmarking with dedicated suites.'
  - 'Key differences: Some focus on compositional generalization from language primitives,
    others on persistent out-of-sight dynamics, open-source real-time systems, or
    ego-centric multimodal control.'
  - 'Trend evolution: 2022–2026 shift from pure reinforcement learning world models
    on physical robots to large-scale video generation frameworks with explicit interactivity
    and open benchmarks.'
  - 'Open questions: How to unify evaluation across open-loop and closed-loop settings,
    whether generalization to entirely novel primitives is achievable, and how to
    prioritize the many identified gaps.'
  related_work_outline_zh:
  - 主流方向：开发基于视频的交互式、长时程、可控世界模型，用于机器人和自动驾驶。
  - 研究共性：利用语言或结构分解视频生成，加入记忆跟踪视线外状态，并构建专用基准评测。
  - 关键差异：有的侧重语言原语的组合泛化，有的关注视线外持久动态，有的构建开源实时系统，有的聚焦自我中心多模态控制。
  - 趋势演进：2022–2026 年从纯强化学习物理机器人世界模型转向大规模视频生成框架，并显式加入交互性和开放的基准。
  - 开放问题：如何统一开环与闭环评估、能否泛化到全新原语、以及如何为众多已识别缺口排序优先级。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing fragmented world model research (video generation,
        interactive, driving, robotics) into a unified design space with latent representations,
        structural priors, and internal mechanics.
      what_remains_open: The proposed taxonomies remain conceptual without empirical
        validation; whether they cover all emerging approaches and can be operationalized
        into actionable benchmarks is unclear.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation settings (open-loop vs.
        closed-loop, dedicated benchmarks like LiveBench, COM metrics) affect conclusions
        about controllability, long-horizon consistency, and real-time responsiveness.
      what_remains_open: Compatibility of results across benchmarks is unverified;
        the gap between open-loop metrics and closed-loop execution success remains
        a key verification gap.
    - line: Open problem and gap mapping
      what_it_solves: 'Turning broad literature coverage into concrete next-step questions:
        out-of-sight dynamics, compositional generalization, open-source reproducibility,
        and real-time interactive world simulation.'
      what_remains_open: No evidence-based prioritization of which gap matters most
        for progress; many identified gaps are stated without quantifiable targets
        or accepted consensus metrics.
    consensus:
    - World models benefit from video generation as a core capability, enabling future
      state prediction and planning.
    - Action-conditioned controllability, long-horizon memory, and real-time interactivity
      are the three central technical challenges.
    - Dedicated benchmarks are necessary because existing generic video generation
      metrics do not capture world model fidelity.
    - Combining multiple modalities (language, images, ego-trajectory, human poses)
      improves fine-grained control over generated scenes.
    - Open-source releases and standardized evaluation suites are needed to accelerate
      progress and enable fair comparisons.
    disagreements:
    - 'Representation: some models use latent states (RL world models) while others
      operate directly in pixel space with video diffusion.'
    - 'Control granularity: approaches differ in conditioning on language primitives,
      ego-motion, object dynamics, or human poses, leading to different controllability
      scopes.'
    - 'Interaction mode: works range from offline video generation for planning to
      real-time interactive simulation with sub-second latency.'
    - 'Evaluation setting: closed-loop robot execution, simulation, and open-loop
      video quality metrics are used as success criteria with no unified standard.'
    - 'Deployment domain: driving, manipulation, navigation, and egocentric activity
      are treated as separate application scenarios with distinct assumptions.'
    open_questions:
    - Can world models generalize to entirely novel primitives not seen during training,
      beyond recombination of known factors?
    - How should out-of-sight dynamics be evaluated when ground truth is unobserved,
      and what metrics capture long-term spatiotemporal consistency?
    - What is the minimum set of benchmarks and metrics that can replace the current
      ad-hoc evaluation landscape and enable reproducible progress?
    - How can the gap between open-loop video generation metrics and closed-loop task
      success in real robots be systematically closed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究（视频生成、交互、自动驾驶、机器人）组织为统一设计空间，包含潜在表示、结构先验和内部机制。
      尚未覆盖: 提出的分类法仍为概念性，缺乏实证验证；是否涵盖所有新兴方法并可转化为可操作的基准尚有疑问。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测设置（开环/闭环、专用基准如LiveBench、COM指标）如何影响关于可控性、长时程一致性和实时响应的结论。
      尚未覆盖: 不同基准间结果的可比性未经验证；开环指标与闭环执行成功之间的差距是关键验证缺口。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体下一步问题：视线外动态、组合泛化、开源可复现性、实时交互世界模拟。
      尚未覆盖: 缺乏基于证据的优先级排序，以确定哪个缺口对进展最重要；许多缺口未给出量化目标或公认共识指标。
    共识:
    - 世界模型以视频生成为核心能力，支持未来状态预测和规划。
    - 动作条件可控性、长时程记忆和实时交互性是三大核心技术挑战。
    - 专用基准是必要的，因为现有通用视频生成指标无法捕捉世界模型的保真度。
    - 结合多模态输入（语言、图像、自我轨迹、人体姿态）可提升对生成场景的细粒度控制。
    - 需要开源发布和标准化评估套件，以加速进展并实现公平比较。
    分歧:
    - 表示方式：一些模型使用潜在状态（强化学习世界模型），另一些直接在像素空间用视频扩散模型操作。
    - 控制粒度：方法在条件输入上存在差异，如语言原语、自我运动、物体动态或人体姿态，导致可控范围不同。
    - 交互模式：工作范围从离线视频生成用于规划，到亚秒级延迟的实时交互式模拟。
    - 评测设置：将闭环机器人执行、仿真和开环视频质量指标作为成功标准，缺少统一标准。
    - 部署领域：驾驶、操控、导航和自我中心活动被作为独立应用场景处理，各自有不同的假设。
    开放问题:
    - 世界模型能否泛化到训练中未见过的新原语，而不仅仅是已知因素的组合？
    - 当真实情况不可观测时，如何评估视线外动态，哪些指标能捕捉长期时空一致性？
    - 能够取代当前临时评测格局并实现可复现进展的最小基准和指标集是什么？
    - 如何系统性地缩小开环视频生成指标与真实机器人闭环任务成功之间的差距？
