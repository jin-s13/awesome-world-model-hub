  related_work_outline_zh:
  - 主流方向：面向具身驾驶与机器人控制的动作可控生成式世界模拟器及评测基准，常以可运行系统形式提出。
  - 研究共性：以动作或上下文为条件生成未来帧或潜状态，并加入一致性/忠实度损失；用视频指标和自定义空间/动作分数评估。
  - 关键差异：监督信号涉及潜在增量、关键点/深度、上下文循环或自回归扩散；评测目标涵盖空间一致性、动作忠实度、视觉质量和真实机器人策略。
  - 趋势演进：从2022年物理机器人基于模型的强化学习，转向2024-2026年带显式基准的驾驶与具身视频世界模拟器，集中在当前前沿。
  - 开放问题：长时域物理与跨视图一致性、基准得分到下游控制的迁移、上下文特权假设，以及工件缺失时的独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving and embodied video simulation
      what_it_solves: Generates future frames conditioned on high-level goals or low-level
        actions for closed-loop simulation and downstream policy training/evaluation.
      what_remains_open: Long-horizon rollouts still degrade; evaluation is often
        limited to nuScenes or manipulation benchmarks, leaving cross-domain and multi-sensor
        deployment unverified.
    - line: Benchmarks for world-model spatial consistency and action fidelity
      what_it_solves: Makes spatial consistency and action adherence measurable through
        Minecraft loop navigation or trajectory-paired driving evaluation.
      what_remains_open: Domain coverage is narrow; some benchmark contributions report
        dataset/benchmark construction without experimental baselines, limiting comparability.
    - line: Contextual and physics-informed latent world models
      what_it_solves: Incorporates context variables or physics-like signals such
        as depth and keypoints to improve zero-shot generalization and physical plausibility.
      what_remains_open: Relies on observable context or privileged physics supervision;
        task and platform coverage is limited, and broader quantitative evidence is
        missing.
    - line: Real-world robot learning stacks
      what_it_solves: Deploys model-based reinforcement learning directly on physical
        robots for online learning without simulators or manual resets.
      what_remains_open: Hardware access and fixed hyperparameters constrain evidence
        across robots; only a small number of platforms and tasks are shown.
    - line: Low-latency autonomous driving simulation stacks
      what_it_solves: Provides system-level multi-view generation with sub-second
        latency for closed-loop simulation and action-conditioned rollout.
      what_remains_open: Cross-sensor, cross-city, very long sequence, and multi-GPU
        scaling remain unverified; some artifacts or baseline details are missing.
    consensus:
    - Recent work treats world models as runnable simulators by conditioning generation
      on actions or context and scoring outputs with video-generation metrics plus
      custom fidelity measures.
    - Evaluation is shifting from visual quality alone toward spatial consistency,
      physical plausibility, and action adherence.
    - 'Open artifacts are frequently emphasized, but reproducibility evidence is uneven:
      some systems include code and datasets while others lack visible code or result
      baselines.'
    disagreements:
    - 'Supervision signals differ: latent transition increments, keypoint/depth learning,
      explicit context conditioning, and autoregressive diffusion are used across
      systems.'
    - 'Evaluation targets differ: Minecraft spatial consistency, driving action fidelity,
      visual metrics like FID/FVD/LPIPS, or real-robot policy learning.'
    - 'Deployment settings differ: physical robot online learning versus single-GPU
      closed-loop simulation, with different latency, reset, and hardware assumptions.'
    open_questions:
    - Can action-controllable world models maintain physical and cross-view consistency
      over long closed-loop rollouts beyond curated benchmarks?
    - Do benchmark scores such as action fidelity or scene-graph consistency transfer
      to better downstream policies in unseen environments?
    - How much supervision or privileged information do contextual and physics-informed
      world models need to generalize beyond observed dynamics?
    - Are these systems independently reproducible across teams, hardware, and datasets
      when code, baselines, or evaluation artifacts are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的驾驶与具身视频模拟
      解决的问题: 根据高层目标或低层动作生成未来帧，用于闭环仿真和下游策略训练/评估。
      尚未覆盖: 长时程推演仍会退化；评测常局限在nuScenes或操作基准，跨域与多传感器部署未充分验证。
    - 路线: 世界模型空间一致性与动作忠实度基准
      解决的问题: 通过Minecraft循环导航或轨迹配对驾驶评测，使空间一致性和动作遵循度可量化。
      尚未覆盖: 场景覆盖较窄；部分工作偏重数据/基准构建，缺少实验基线与对比结果。
    - 路线: 上下文与物理信息潜在世界模型
      解决的问题: 将上下文变量、深度或关键点等物理信号纳入建模，提升零样本泛化和物理合理性。
      尚未覆盖: 依赖可观测上下文或特权物理监督；任务和平台覆盖有限，更广泛的定量证据缺失。
    - 路线: 真实机器人学习系统
      解决的问题: 直接在物理机器人上部署基于模型的强化学习，实现无模拟器和无手动重置的在线学习。
      尚未覆盖: 硬件可及性与固定超参数限制证据外推；仅有少量平台和任务得到验证。
    - 路线: 低延迟自动驾驶仿真系统栈
      解决的问题: 提供多视图生成和亚秒级延迟的系统级方案，用于闭环仿真与动作条件推演。
      尚未覆盖: 跨传感器、跨城市、极长序列和多GPU扩展未验证；部分工件或基线细节缺失。
    共识:
    - 近期研究普遍将世界模型作为可运行模拟器，以动作或上下文为条件生成输出，并用视频生成指标和自定义忠实度指标评估。
    - 评测正从单纯视觉质量扩展到空间一致性、物理合理性和动作遵循度。
    - 论文反复强调开放工件，但复现证据不一致：部分系统提供代码和数据集，另一些缺少可见代码或结果基线。
    分歧:
    - 监督信号不同：潜在增量、关键点/深度学习、显式上下文条件化和自回归扩散被不同系统采用。
    - 评测目标不同：Minecraft空间一致性、驾驶动作忠实度、FID/FVD/LPIPS视觉指标或真实机器人策略学习。
    - 部署场景不同：物理机器人在线学习与单GPU闭环仿真，在延迟、重置和硬件假设上存在差异。
    开放问题:
    - 动作可控世界模型能否在超出整理基准的长闭环推演中保持物理与跨视图一致性？
    - 动作忠实度或场景图一致性等基准得分，能否在未见环境中转化为更好的下游策略？
    - 上下文与物理信息世界模型需要多少监督或特权信息，才能在观测动力学之外泛化？
    - 当代码、基线或评测工件缺失时，这些系统能否被独立团队跨硬件和数据集复现？
