  related_work_outline:
  - 'Mainstream direction: World-model methods are converging on generative video
    or latent dynamics models for embodied driving and robotics, often using diffusion
    Transformers with self-supervised objectives such as mask reconstruction, depth/keypoint
    prediction, and coupled video-action diffusion.'
  - 'Shared research pattern: Most works learn dynamics from high-dimensional observations
    and validate through generation quality, downstream policy learning, or consistency/action-control
    benchmarks rather than only next-frame error.'
  - 'Key differences: Some methods optimize visual fidelity and physical plausibility,
    while others target latent dynamics for policy learning; supervision sources include
    language primitives, context values, physics signals, and independent video/action
    diffusion timesteps.'
  - 'Trend evolution: The available 2023-2026 evidence moves from stochastic latent
    world models toward contextual/compositional models and then large embodied/driving
    video world models plus explicit memory, spatial consistency, and action-control
    evaluation.'
  - 'Open questions: Isolated method contribution versus planner/task prior, transfer
    to unseen primitives or contexts, whether consistency metrics predict downstream
    utility, and verification gaps from sparse limitation, ablation, code, and dataset
    evidence.'
  related_work_outline_zh:
  - 主流方向：世界模型研究正汇聚到面向具身驾驶与机器人的生成式视频或潜动力学模型，常用扩散Transformer配合自监督目标，如掩码重建、深度/关键点预测、视频-动作联合扩散。
  - 研究共性：多数工作从高维观测中学习动力学，并通过生成质量、下游策略学习或一致性/动作控制基准来验证，而不只依赖下一帧误差。
  - 关键差异：部分方法侧重视觉保真和物理合理性，另一些侧重用于策略学习的潜动力学；监督来源包括语言原语、上下文值、物理信号以及独立的视频/动作扩散时间步。
  - 趋势演进：现有2023-2026证据显示，从随机潜世界模型发展到上下文/组合模型，再到大规模具身驾驶视频世界模型以及显式的记忆、空间一致性和动作控制评测。
  - 开放问题：方法贡献能否与规划器/任务先验分离，能否泛化到未见的原语或上下文，一致性指标能否预测下游效用，以及由于局限性、消融、代码和数据集证据稀疏带来的验证空白。
  literature_review:
    line_of_work_matrix:
    - line: Generative video world-model objectives
      what_it_solves: Learning high-dimensional visual dynamics and long-horizon or
        multi-view prediction by combining diffusion/transformer backbones with reconstruction,
        depth, keypoint, or mask-based training signals.
      what_remains_open: Whether improved visual fidelity or physical plausibility
        transfers outside reported driving and robotic scenarios, and whether these
        objectives capture controllable dynamics rather than only appearance.
    - line: Latent dynamics and policy-action interfaces
      what_it_solves: Connecting learned world dynamics to policies through imagined
        rollouts, recurrent state-space representations, or coupled action-video prediction
        so the model can support control and reinforcement learning.
      what_remains_open: How much of the reported gain comes from the world-model
        representation versus the planner, controller, task prior, or benchmark scope;
        several assumptions such as observable context or simulation-only evaluation
        remain unresolved.
    - line: Compositional and contextual generalization
      what_it_solves: Enabling zero-shot or unseen task/goal transfer by explicit
        factorization through language primitives, observable context conditioning,
        or independently controlled modality diffusion timesteps.
      what_remains_open: Generalization is mostly shown for combinations of seen primitives
        or seen context ranges; reliance on accurate instruction parsing or context
        observability limits transfer to truly novel settings.
    - line: World-model evaluation protocols
      what_it_solves: Measuring memory consistency, spatial consistency, closed-loop
        revisiting, and action control through loop navigation datasets and scene-consistency
        scores rather than only short-horizon reconstruction metrics.
      what_remains_open: The bounded evidence reports limited experimental results
        for these protocols, and the relationship between consistency metrics and
        downstream task performance is not yet established.
    consensus:
    - World models are treated as learned generative or latent dynamics from high-dimensional
      observations, trained with self-supervised objectives and evaluated by generation
      quality or downstream policy performance.
    - Recent work increasingly emphasizes explicit controllability, memory, spatial
      layout, long-horizon behavior, and physical plausibility over short-horizon
      pixel prediction alone.
    - Model-based methods frequently rely on imagined trajectories or coupled action-video
      models to learn policies, forward dynamics, inverse dynamics, or video generators.
    disagreements:
    - 'Representation choices differ: diffusion Transformer video models, stochastic
      Transformer-VAE latent dynamics, recurrent contextual state-space models, and
      unified video-action diffusion transformers.'
    - 'Supervision signals differ: mask reconstruction, depth and keypoint physics
      tasks, language-primitive factorization, observable context conditioning, and
      independent modality timesteps.'
    - 'Evaluation targets differ: visual fidelity and physical plausibility, zero-shot
      policy generalization on contextual RL suites, Atari 100k performance, robot
      video planning, and spatial/memory/action-control benchmarks.'
    - 'Deployment settings differ: multi-view driving video, robot manipulation, open-world
      Minecraft navigation, and game or contextual reinforcement-learning environments.'
    open_questions:
    - Which part of the observed policy improvement comes from the learned world model
      rather than the planner, controller, task prior, or benchmark training setup?
    - Can compositional or contextual world models generalize to entirely unseen primitives,
      contexts, or action spaces beyond combinations present in training?
    - Are visual fidelity, physical plausibility, and spatial/memory consistency metrics
      predictive of downstream robot control or real-world deployment?
    - The current packet leaves ablation, limitation, code, dataset, metric, and baseline
      details only partially verifiable, making isolated method comparison across
      families difficult.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频世界模型目标
      解决的问题: 通过扩散/Transformer骨干结合重建、深度、关键点或掩码训练信号，学习高维视觉动力学以及长时域或多视角预测。
      尚未覆盖: 更好的视觉保真或物理合理性是否能在已报告的驾驶和机器人场景之外迁移，以及这些目标是否捕获可控动力学而不仅仅是外观。
    - 路线: 潜动力学与策略-动作接口
      解决的问题: 通过想象轨迹、循环状态空间表示或视频-动作联合预测，将学习到的世界动力学连接到策略，使模型支持控制和强化学习。
      尚未覆盖: 报告收益有多少来自世界模型表示，而不是规划器、控制器、任务先验或基准范围；可观测上下文等假设以及仅仿真评估等边界仍未解决。
    - 路线: 组合与上下文泛化
      解决的问题: 通过语言原语、可观测上下文条件或独立控制的模态扩散时间步进行显式分解，实现零样本或未见任务/目标迁移。
      尚未覆盖: 泛化主要展示在已见原语组合或已见上下文范围内；依赖准确的指令解析或上下文可观测性限制了向真正新场景的迁移。
    - 路线: 世界模型评测协议
      解决的问题: 通过循环导航数据集和场景一致性分数，衡量记忆一致性、空间一致性、闭环重访和动作控制，而不只使用短时域重建指标。
      尚未覆盖: 当前证据对这些协议报告的实验结果有限，而且一致性指标与下游任务表现之间的关系尚未建立。
    共识:
    - 世界模型被视作从高维观测中学习的生成式或潜动力学模型，采用自监督目标训练，并通过生成质量或下游策略表现来评测。
    - 近期工作越来越强调显式可控性、记忆、空间布局、长时域行为和物理合理性，而不仅仅是短时域像素预测。
    - 基于模型的方法常依赖想象轨迹或视频-动作联合模型来学习策略、前向动力学、逆动力学或视频生成器。
    分歧:
    - 表示选择不同：扩散Transformer视频模型、随机Transformer-VAE潜动力学、循环上下文状态空间模型，以及统一视频-动作扩散Transformer。
    - 监督信号不同：掩码重建、深度与关键点物理任务、语言原语分解、可观测上下文条件化，以及独立模态时间步。
    - 评测目标不同：视觉保真与物理合理性、上下文强化学习套件上的零样本策略泛化、Atari 100k表现、机器人视频规划，以及空间/记忆/动作控制基准。
    - 部署场景不同：多视角驾驶视频、机器人操作、开放世界Minecraft导航，以及游戏或上下文强化学习环境。
    开放问题:
    - 观察到的策略收益中，哪部分来自学习到的世界模型，而不是规划器、控制器、任务先验或基准训练设置？
    - 组合式或上下文世界模型能否泛化到训练中从未出现过的原语、上下文或动作空间？
    - 视觉保真、物理合理性以及空间/记忆一致性指标能否预测下游机器人控制或真实部署效果？
    - 当前证据包对消融、局限性、代码、数据集、指标和基线细节只能部分验证，因此难以跨方法族进行隔离比较。
