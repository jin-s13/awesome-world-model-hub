  related_work_outline:
  - 'Mainstream direction: Generative transformer/diffusion world models with auxiliary
    tasks or video-action coupling dominate recent work, especially for driving and
    robot video prediction.'
  - 'Shared research pattern: Methods add consistency or structure supervision—mask
    reconstruction, depth, keypoint dynamics, or action diffusion—to improve long-horizon
    prediction, physical plausibility, or downstream policy utility.'
  - 'Key differences: They differ in representation, supervision signal, action interface,
    and evaluation target, spanning driving, Atari, robot, Minecraft, and open-domain
    benchmarks.'
  - 'Trend evolution: Observable trend is within the 2023–2026 frontier: efficient
    stochastic RL world models lead to contextual and compositional models, then to
    large generative world models and consistency benchmarks.'
  - 'Open questions: Long-term memory and spatial consistency, unseen context/primitive
    generalization, separating model gain from planner or data effects, and whether
    consistency metrics transfer to real execution.'
  related_work_outline_zh:
  - 主流方向：以生成式Transformer/扩散架构为核心的世界模型，并通过掩码重建、深度、关键点或视频-动作扩散等辅助任务增强预测。
  - 研究共性：在视觉预测中引入一致性或结构监督，以提升长时域、多视角、物理合理性或下游控制能力。
  - 关键差异：表示形式、监督目标、动作接口与评测场景不同，从驾驶视频、Atari、机器人操作到Minecraft和开放域基准。
  - 趋势演进：已有证据集中在2023-2026年前沿，从高效RL世界模型走向上下文/组合泛化，再到大规模生成世界模型与一致性评测。
  - 开放问题：长期记忆与空间一致性、未观测上下文与全新原语泛化、模型增益与规划器/任务的分离，以及评测指标与实际执行之间的缺口。
  literature_review:
    line_of_work_matrix:
    - line: World-model representation and objective design for video dynamics
      what_it_solves: Operationalizes world models through diffusion transformers,
        stochastic transformer-VAE dynamics, mask reconstruction, depth/keypoint auxiliary
        tasks, and coupled video-action diffusion objectives for long-horizon or multi-modal
        prediction.
      what_remains_open: Which architecture and auxiliary objective choices transfer
        beyond the reported driving, robot, and Atari settings; missing limitation
        details prevent identifying failure boundaries.
    - line: Planning and action-interface methods for dynamics-driven policies
      what_it_solves: Connects learned dynamics to decision interfaces via contextual
        recurrent state-space models, language-primitive compositional generation,
        diffusion-timestep action coupling, and pretraining on action-free video for
        downstream policy learning.
      what_remains_open: How much policy improvement comes from the learned dynamics
        versus the action interface, planner, task prior, or pretraining data; reliance
        on observable context or seen primitives is unresolved.
    - line: Method evidence and consistency-oriented evaluation protocols
      what_it_solves: Audits method contribution with datasets and metrics for spatial
        consistency, memory consistency, action control, long-horizon rollout, zero-shot
        validation, and visual or physical plausibility.
      what_remains_open: New benchmarks have limited reported comparative results;
        long-term memory and cross-action-space generalization are unresolved, and
        consistency metrics may not prove closed-loop execution quality.
    consensus:
    - Recent methods favor generative video architectures, especially transformer
      or diffusion backbones, as the core world-model representation.
    - Several approaches add auxiliary supervision—mask reconstruction, depth prediction,
      keypoint dynamics, or action diffusion—to improve visual fidelity, consistency,
      or downstream robot control.
    - Evaluation is shifting toward spatial consistency, memory consistency, and action
      control rather than only reconstruction quality.
    - World models are increasingly used as pretraining or policy-learning tools,
      not only as forward video predictors.
    disagreements:
    - 'Representation families differ: recurrent state-space latent dynamics, stochastic
      transformer, diffusion transformer, and modular video generation.'
    - 'Training objectives differ: mask reconstruction with generative diffusion,
      variational sequence modeling, physics-informed depth/keypoint losses, and coupled
      video-action diffusion.'
    - 'Action and interaction assumptions differ: conditioning on observable context,
      parsing language into primitives, coupling actions as diffusion modalities,
      or evaluating action-free video generation.'
    - 'Evaluation targets differ: driving video prediction, Atari sample-efficiency,
      robot video and policy learning, Minecraft spatial consistency, and open-domain
      memory/action control.'
    - 'Generalization strategies differ: zero-shot context extrapolation, compositional
      primitive recombination, and large-scale multitask pretraining each rely on
      different assumptions.'
    open_questions:
    - How well do auxiliary consistency objectives transfer beyond the reported driving
      and robot benchmarks?
    - Can current world models maintain long-term memory consistency and generalize
      across substantially different action spaces in open domains?
    - What share of policy improvement comes from learned dynamics versus the action
      interface, planner, or pretraining data?
    - How can world models generalize when context is unobserved or when tasks require
      entirely new primitives rather than recombination of seen primitives?
    - Are spatial and memory consistency metrics sufficient proxies for closed-loop
      robot execution or downstream policy performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向视频动力学的世界模型表示与目标设计
      解决的问题: 通过扩散Transformer、随机Transformer-VAE动力学、掩码重建、深度/关键点辅助任务及视频-动作扩散目标，实现可扩展的长时域或多模态预测。
      尚未覆盖: 哪些架构和辅助目标选择能跨驾驶、机器人与Atari场景迁移；缺失的局限性细节掩盖了失败边界。
    - 路线: 面向动力学驱动策略的规划与动作接口方法
      解决的问题: 通过上下文循环状态空间模型、语言原语组合生成、扩散时间步动作耦合及无动作视频预训练，将学习动力学连接到下游策略学习。
      尚未覆盖: 策略提升中有多少来自学习动力学，多少来自动作接口、规划器、任务先验或预训练数据；依赖可观测上下文或已见原语的问题未解决。
    - 路线: 方法证据与一致性导向的评测协议
      解决的问题: 用数据集和度量审计方法贡献，覆盖空间一致性、记忆一致性、动作控制、长时域展开、零样本验证及视觉/物理合理性。
      尚未覆盖: 新基准的比较实验结果有限；长期记忆和跨动作空间泛化未解决，一致性指标未必能证明闭环执行质量。
    共识:
    - 近期方法倾向使用生成式视频架构，尤其是Transformer或扩散骨干，作为世界模型核心表示。
    - 多个方法通过掩码重建、深度预测、关键点动力学或动作扩散等辅助监督来提升视觉保真、一致性或下游机器人控制。
    - 评测正从重建质量转向空间一致性、记忆一致性和动作控制。
    - 世界模型正被用作预训练或策略学习工具，而不仅是前向视频预测器。
    分歧:
    - 表示族不同：循环状态空间潜在动力学、随机Transformer、扩散Transformer与模块化视频生成。
    - 训练目标不同：掩码重建结合生成扩散、变分序列建模、物理先验深度/关键点损失，以及耦合视频-动作扩散。
    - 动作与交互假设不同：依赖可观测上下文、语言解析为原语、将动作作为扩散模态耦合，或评测无动作视频生成。
    - 评测目标不同：驾驶视频预测、Atari样本效率、机器人视频与策略学习、Minecraft空间一致性，以及开放域记忆与动作控制。
    - 泛化策略不同：零样本上下文外推、组合原语重组和大规模多任务预训练各依赖不同假设。
    开放问题:
    - 辅助一致性目标在已报告驾驶与机器人基准之外迁移能力如何？
    - 当前世界模型能否在开放域中维持长期记忆一致性并跨明显不同的动作空间泛化？
    - 策略提升中有多少来自学习动力学，多少来自动作接口、规划器或预训练数据？
    - 当上下文不可观测或任务需要全新原语而非已见原语重组时，世界模型如何泛化？
    - 空间与记忆一致性指标是否足以代理闭环机器人执行或下游策略性能？
