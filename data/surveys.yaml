  related_work_outline:
  - 'Mainstream direction: World-model benchmarking now centers on consistency and
    control; visual fidelity is measured together with spatial/memory consistency
    and action-conditioned rollout quality across driving, robotics, game, and open-domain
    video settings.'
  - 'Shared research pattern: Methods couple generation with auxiliary signals such
    as mask reconstruction, depth/keypoint dynamics, context conditioning, or video-action
    diffusion, then evaluate on standard suites or new consistency-oriented datasets.'
  - 'Key differences: Evaluation targets split between generation realism, downstream
    policy utility, zero-shot generalization, and open-domain memory/action consistency;
    model representations and supervision differ accordingly.'
  - 'Trend evolution: The evidence cluster moves from Atari 100k sample-efficiency
    comparisons toward long-horizon, multi-view, physics-informed, and open-domain
    consistency evaluation within the current 2023-2026 frontier.'
  - 'Open questions: Whether proxy consistency metrics track downstream decisions,
    whether coverage includes unseen dynamics and action spaces, and whether reported
    conclusions remain stable across implementations and compute.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正从单一聚合分数转向同时考察视觉保真、空间/记忆一致性与动作条件推演质量，覆盖驾驶、机器人、游戏和开放域视频。
  - 研究共性：方法将生成与辅助信号耦合，如掩码重建、深度/关键点、上下文条件或视频-动作扩散，并在标准评测或新一致性数据集上验证。
  - 关键差异：评测目标分为生成真实性、下游策略效用、零样本泛化、开放域记忆/动作一致性；表示和监督信号也相应不同。
  - 趋势演进：证据集中在2023-2026年前沿，从Atari 100k样本效率对比转向长时域、多视角、物理信息与开放域一致性评测。
  - 开放问题：代理一致性指标能否预测下游决策，任务分布是否覆盖未见动态与动作空间，基准结论在不同实现和算力下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Constructs shared tasks and datasets for comparable world-model
        evaluation; examples include LoopNav for loop-based spatial consistency and
        MIND for memory consistency and action control.
      what_remains_open: Coverage is still limited to specific simulators or video
        domains; long-horizon, open-domain, and cross-action-space generalization
        remain under-evidenced.
    - line: Metric and stress-test design
      what_it_solves: Probes capabilities beyond aggregate generation scores, such
        as scene-graph consistency, memory consistency, action control, and human-normalized
        game performance.
      what_remains_open: Proxy metrics lack established alignment with downstream
        decision utility, physical plausibility, and stability under visual or implementation
        variation.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Uses shared benchmarks such as Atari 100k, CARL, driving datasets,
        and robot video data to compare sample efficiency, zero-shot generalization,
        visual quality, and training cost across model baselines.
      what_remains_open: Several evidence records omit limitation details and standardized
        artifact links, so reproducibility and cross-implementation stability are
        verification gaps rather than demonstrated conclusions.
    consensus:
    - Recent work converges on evaluating world models beyond single generation scores
      by also considering spatial consistency, memory consistency, action control,
      or downstream policy quality.
    - There is shared use of standard evaluation suites and released datasets, including
      Atari 100k, CARL, Minecraft navigation videos, driving data, and robotic video
      collections.
    - Coupling visual generation with action, context, physics, or reconstruction
      signals is treated as a common way to make world-model capabilities testable.
    disagreements:
    - 'Evaluation target differs: some stress visual realism and physical plausibility,
      while others stress sample-efficient game performance, zero-shot control generalization,
      or long-horizon memory and action consistency.'
    - 'Representation differs: diffusion-based generation, transformer-VAE stochastic
      models, recurrent state-space context models, and physics-informed video models
      coexist.'
    - 'Supervision differs: action-conditioned video and dynamics, action-free video,
      observable context, and auxiliary depth/keypoint or mask-reconstruction signals
      reflect different assumptions.'
    - 'Deployment setting differs: simulated Atari, contextual control tasks, Minecraft
      navigation, robotic manipulation, driving multi-view/long-horizon, and open-domain
      video loops create different evaluation conditions.'
    open_questions:
    - Do consistency and action-control metrics predict downstream policy or robot
      deployment success?
    - Can benchmark tasks cover unseen dynamics, cross-action-space generalization,
      and long-horizon memory without overfitting to a simulator or video domain?
    - Are current leaderboard conclusions stable across model implementations, compute
      budgets, and dataset splits?
    - Which auxiliary signals and evaluation settings are necessary for world models
      to transfer from game or video benchmarks to real-world settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据，使世界模型在空间一致性、记忆一致性、动作控制等方面可比较；例如 LoopNav 用循环导航视频评测空间一致性，MIND
        评测记忆一致性与动作控制。
      尚未覆盖: 覆盖仍局限于特定模拟器或视频域；长时域、开放域和跨动作空间泛化证据不足。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验世界模型，如场景图一致性、记忆一致性、动作控制、人类归一化游戏得分等。
      尚未覆盖: 这些代理指标与下游决策效用、物理合理性及对视觉和实现变化的稳定性之间的关系尚未建立。
    - 路线: 可比基线与报告规范
      解决的问题: 利用 Atari 100k、CARL、驾驶数据集和机器人视频等共享基准，比较样本效率、零样本泛化、视觉质量和训练成本。
      尚未覆盖: 部分证据记录缺少限制说明和标准化工件链接，因此跨实现稳定性仍是验证缺口。
    共识:
    - 近期工作共同趋势是超越单一生成分数，同时考虑空间一致性、记忆一致性、动作控制或下游策略质量。
    - 研究共享标准评测套件和公开数据集，如 Atari 100k、CARL、Minecraft 导航视频、驾驶数据和机器人视频。
    - 将视觉生成与动作、上下文、物理或重建信号耦合，成为验证世界模型能力的常见方式。
    分歧:
    - 评测目标不同：有的强调视觉真实性和物理合理性，有的关注样本效率、零样本控制泛化或长时域记忆/动作一致性。
    - 表示不同：基于扩散的生成、Transformer-VAE 随机模型、循环状态空间上下文模型，以及物理信息视频模型并存。
    - 监督不同：包括动作条件视频与动力学、无动作视频、可观测上下文，以及深度/关键点或掩码重建等辅助任务。
    - 部署设置不同：模拟 Atari、上下文控制任务、Minecraft 导航、机器人操作、驾驶多视角/长时域和开放域视频。
    开放问题:
    - 一致性指标和动作控制指标能否预测下游策略或机器人部署表现？
    - 基准任务是否覆盖未见动态、跨动作空间泛化和长时域记忆，而不局限于单一模拟器或视频域？
    - 当前榜单结论在不同实现、算力预算和数据集划分下是否稳定？
    - 哪些辅助信号和评测设置能帮助世界模型从游戏或视频基准迁移到真实环境？
