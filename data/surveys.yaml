  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from aggregate game
    or video scores toward action-conditioned, closed-loop benchmarks that probe spatial,
    memory, and control consistency in driving, robotics, and open-world settings.'
  - 'Shared research pattern: Methods couple video generation with actions, dynamics,
    context, or physics signals and evaluate on standardized or newly proposed tasks
    such as Atari 100k, driving rollouts, Minecraft navigation, or large robot datasets.'
  - 'Key differences: Work diverges in representation, supervision, evaluation target,
    and deployment domain; some optimize visual fidelity for reinforcement learning,
    while others target long-horizon driving, spatial consistency, or policy utility.'
  - 'Trend evolution: From model-based reinforcement learning and zero-shot contextual
    generalization in 2023-2024 toward 2025-2026 open-domain memory/action benchmarks
    and unified video-action world models for embodied control.'
  - 'Open questions: Whether consistency metrics align with downstream decision quality,
    whether conclusions are stable across datasets and compute budgets, and whether
    current task distributions cover real-world variation remain open.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从总分或游戏得分转向动作条件、闭环式基准，考察驾驶、机器人和开放世界中的空间、记忆与控制一致性。
  - 研究共性：通常将视频生成与动作、动力学、上下文或物理信号耦合，并在标准化或新建任务上评估，如Atari 100k、驾驶数据集和Minecraft导航。
  - 关键差异：在表示方式、监督信号、评测目标和部署环境上不同；有的侧重视觉保真与强化学习，有的侧重长时域驾驶、空间一致性或策略效用。
  - 趋势演进：从2023-2024年的模型式强化学习和零样本上下文泛化，走向2025-2026年开放域记忆/动作基准和统一视频-动作世界模型。
  - 开放问题：一致性指标是否对应真实决策质量、结论在不同数据和算力下是否稳定、任务分布是否覆盖真实变异仍需验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: 'Creates shared tasks and datasets that make world-model capabilities
        comparable: loop-based navigation, closed-loop revisited control, long-horizon
        driving rollouts, and contextual reinforcement-learning settings.'
      what_remains_open: Whether curated task distributions and action spaces cover
        the real environment variation and deployment settings where world models
        are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, controllability, spatial consistency,
        memory consistency, and decision utility beyond aggregate scores.
      what_remains_open: Alignment between proxy stress-test metrics and downstream
        decisions or long-horizon, cross-action-space performance.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, standardized
        datasets, and reproducibility artifacts such as code, environments, and evaluation
        protocols.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and missing limitation or citation evidence.
    consensus:
    - World-model evaluation is increasingly control-oriented, using action guidance
      and closed-loop or revisited probes instead of visual quality alone.
    - Long-horizon, spatial, memory, and action-control consistency are treated as
      central evaluation dimensions.
    - Video generation is commonly coupled with action, dynamics, context, or physics
      signals to support policy learning, policy evaluation, or pretraining.
    disagreements:
    - Representation choices differ across diffusion, transformer-VAE, recurrent state-space,
      and physics-informed keypoint/depth models.
    - 'Supervision signals differ: mask reconstruction, observed context conditioning,
      independent video-action diffusion timesteps, or auxiliary temporal depth and
      keypoint tasks.'
    - 'Evaluation targets differ: Atari 100k human-normalized scores, contextual zero-shot
      generalization, driving multi-view long-horizon rollouts, Minecraft spatial
      loops, and robot policy utility.'
    - Deployment domains differ among games, simulated open worlds, driving scenes,
      and robot manipulation, which changes the relevant failure modes.
    open_questions:
    - Do spatial, memory, and action-control metrics predict downstream decision quality
      in real deployments?
    - How stable are benchmark rankings across action spaces, scene diversity, dataset
      splits, implementations, and compute budgets?
    - Which curated tasks are missing for evaluating world models under partially
      observed, context-unobserved, or long-horizon distribution shift?
    - Several current works lack visible limitation details or rely on narrow benchmark
      settings, leaving comparative stability as a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型能力可比，例如循环导航、闭环记忆/动作控制、长时域驾驶和上下文强化学习设置。
      尚未覆盖: 任务分布和动作空间是否覆盖真实环境变化以及世界模型预期帮助的部署场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测质量、可控性、空间一致性、记忆一致性和决策效用。
      尚未覆盖: 代理指标与下游决策及长时域、跨动作空间表现之间是否一致。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、标准化数据集、代码、环境和评估协议使结果可审计。
      尚未覆盖: 结论在不同实现、算力预算以及缺失的局限性或引用证据下是否稳定。
    共识:
    - 世界模型评估越来越以控制为导向，使用动作引导和闭环或重访式探针，而非仅看视觉质量。
    - 长时域、空间、记忆和动作控制一致性被视为核心评估维度。
    - 视频生成常与动作、动力学、上下文或物理信号耦合，以支持策略学习、策略评估或预训练。
    分歧:
    - 表示方式不同：扩散、Transformer-VAE、循环状态空间和物理信息关键点/深度模型各有侧重。
    - 监督信号不同：掩码重建、上下文条件、独立视频-动作扩散时间步或辅助深度/关键点任务。
    - 评测目标不同：Atari 100k人类归一化得分、上下文零样本泛化、驾驶多视角长时域、Minecraft空间一致性或机器人策略效用。
    - 部署域不同：游戏、模拟开放世界、驾驶和机器人操作中的失效模式不同。
    开放问题:
    - 空间、记忆和动作控制指标能否预测真实部署中的下游决策质量？
    - 不同动作空间、场景多样性、数据集划分、实现和算力预算下，基准排名是否稳定？
    - 缺少哪些任务来评估部分观测、上下文不可见或长时域分布漂移下的世界模型？
    - 若干当前工作缺少可见局限性说明或仅依赖窄基准设置，因此可比性仍是一个待验证缺口。
