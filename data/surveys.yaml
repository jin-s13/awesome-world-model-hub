  related_work_outline:
  - 'Mainstream direction: current benchmark-focused world-model work is consolidating
    around standardized interaction and video prediction evaluations, with recent
    examples such as MIND and LoopNav adding open-domain memory, spatial consistency,
    and action-control probes.'
  - 'Shared research pattern: papers couple datasets or environment suites with task-specific
    metrics and baseline comparisons; model papers use established benchmarks like
    Atari 100k, CARL, Nuscenes, OpenDV-2K, Waymo, or robot pretraining datasets for
    evidence.'
  - 'Key differences: evaluation targets split among policy performance, visual fidelity
    and physical plausibility, and memory/action consistency; assumptions differ on
    observable context, action-free video, mask reconstruction, physics-informed keypoint/depth,
    or unified action-video diffusion.'
  - 'Trend evolution: within the 2023-2026 frontier, evaluation is moving from aggregate
    Atari or visual quality toward open-domain, closed-loop, and physically grounded
    stress tests; older years appear as foundations but top evidence is recent.'
  - 'Open questions: whether proxy metrics align with downstream decisions, whether
    task distributions cover real deployment, and whether benchmark conclusions remain
    stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：当前面向基准的世界模型研究正围绕标准化交互与视频预测评估收敛，MIND、LoopNav等近期样本增加了开放域记忆、空间一致性与动作控制探针。
  - 研究共性：论文将数据集或环境套件与任务相关指标及基线比较耦合；模型论文使用Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo或机器人预训练数据集作为证据。
  - 关键差异：评测目标在策略表现、视觉保真与物理合理性、记忆/动作一致性之间分化；关于可观测上下文、无动作视频、掩码重建、物理信息关键点/深度或统一动作-视频扩散的假设不同。
  - 趋势演进：在2023-2026前沿内，评估正从Atari或视觉质量的聚合分数走向开放域、闭环和物理压力测试；更早年份提供基础，但高证据论文偏近期。
  - 开放问题：代理指标是否与下游决策对齐，任务分布是否覆盖真实部署，以及基准结论在实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared, open-domain tasks and datasets for evaluating
        world-model memory, spatial consistency, and action control across navigation
        and video settings.
      what_remains_open: Whether task distributions cover deployment-scale, long-horizon,
        multi-view, and cross-action settings where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate generation scores by probing spatial
        consistency, memory consistency, action control, zero-shot generalization,
        visual fidelity, and physical plausibility.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users care about; available evidence does not establish decision-level
        validity.
    - line: Comparable baselines and reporting
      what_it_solves: Provides standardized benchmarks and baselines such as Atari
        100k, CARL, Nuscenes, OpenDV-2K, Waymo, and robot pretraining datasets for
        auditing model-based RL and world-model results.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and dataset splits; limitations and detailed baseline settings
        are often not visible in the evidence.
    consensus:
    - World-model evaluation increasingly requires task-specific probes, not only
      image reconstruction or video prediction quality.
    - Benchmark usefulness depends on pairing datasets with reproducible evaluation
      protocols and comparable baselines.
    - Spatial memory, temporal consistency, action control, generalization, and policy
      performance are recurring evaluation concerns across settings.
    - Recent work treats standardized interaction benchmarks as evidence of progress,
      but often leaves failure boundaries and compute or implementation sensitivity
      under-reported.
    disagreements:
    - 'Evaluation target differs: some work scores agent return on Atari and contextual
      control tasks, while other work scores spatial or memory consistency and action
      controllability in open-domain video.'
    - 'Use of supervision and prior structure differs: observable context conditioning,
      mask reconstruction, action-video diffusion coupling, and physics-informed keypoint/depth
      tasks emphasize different assumptions.'
    - 'Domain coverage differs: driving, Minecraft navigation, robotic manipulation,
      and Atari are used, which changes what generalization and interaction mean.'
    - 'Reproducibility evidence differs: some benchmark papers release dataset/code
      signals, while several method papers show artifact signals but no limitation
      text in the supplied analysis.'
    open_questions:
    - Do current benchmarks cover long-horizon memory, multi-view consistency, and
      cross-action generalization in deployed settings?
    - 'Which proxy metrics best predict downstream decision quality: policy return,
      physical plausibility, scene-graph consistency, or action controllability?'
    - How stable are benchmark conclusions across different model implementations,
      training compute budgets, and evaluation splits?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的开放域任务和数据集，用于评估世界模型在导航和视频场景中的记忆、空间一致性与动作控制能力。
      尚未覆盖: 任务分布是否覆盖部署规模、长时域、多视角和跨动作空间设置，目前证据未完全验证。
    - 路线: 指标与压力测试设计
      解决的问题: 超越聚合生成分数，检验空间一致性、记忆一致性、动作控制、零样本泛化、视觉保真与物理合理性。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致，尚缺少决策层面的效度证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、Nuscenes、OpenDV-2K、Waymo和机器人预训练数据集等标准化基准与基线，使结果可审计。
      尚未覆盖: 结论在不同实现、算力预算和数据划分下是否稳定；所给证据中限制和基线细节常不完整。
    共识:
    - 世界模型评估越来越需要任务特定的探针，而不只是图像重建或视频预测质量。
    - 基准价值依赖于将数据集与可复现的评估协议和可比基线配对。
    - 空间记忆、时间一致性、动作控制、泛化能力和策略表现是跨场景反复出现的评估关注点。
    - 近期研究将标准化交互基准视为进展证据，但常在证据中省略失败边界及实现或算力敏感性。
    分歧:
    - 评测目标不同：一些工作衡量Atari和上下文控制上的策略回报，另一些衡量开放域视频中的空间或记忆一致性与动作可控性。
    - 监督信号与先验结构不同：可观测上下文条件、掩码重建、动作-视频扩散耦合及物理信息关键点/深度任务体现了不同假设。
    - 领域覆盖不同：驾驶、Minecraft导航、机器人操作和Atari各自定义了不同的泛化和交互含义。
    - 可复现证据不同：部分基准工作提供数据集和代码信号，而若干方法论文虽有工件信号但分析中未提供限制说明。
    开放问题:
    - 当前基准是否覆盖部署中的长时域记忆、多视角一致性和跨动作泛化？
    - 哪个代理指标最能预测下游决策质量：策略回报、物理合理性、场景图一致性还是动作可控性？
    - 基准结论在不同模型实现、训练算力预算和评估划分下的稳定性如何？
