  related_work_outline:
  - 'Mainstream direction: Survey-style synthesis of world-model research, organizing
    generative video, autonomous driving, and embodied control into shared taxonomies,
    evaluation frameworks, and roadmap challenges.'
  - 'Shared research pattern: Mapping design choices such as latent representation,
    structural priors, memory, controllability, and long-horizon consistency; method
    papers provide empirical anchors while surveys abstract across them.'
  - 'Key differences: Conceptual taxonomy papers remain mostly unvalidated and prescribe
    evaluation, while empirical system papers operate in different settings, including
    real robots, driving simulation, ego-vision prediction, and open-source video
    simulation.'
  - 'Trend evolution: From early physical robot and driving simulation systems around
    2022-2023, through compositional and Sora-centered synthesis in 2024, toward 2025-2026
    taxonomies, open benchmarks, open-source simulators, and persistent out-of-sight
    dynamics.'
  - 'Open questions: Whether proposed taxonomies are sufficient and validated; how
    to compare results across incompatible evaluation settings; what mechanisms support
    long-horizon and compositional generalization; and which reproducibility gaps
    most weaken survey conclusions.'
  related_work_outline_zh:
  - 主流方向：以综述式综合为主，围绕世界模型研究组织生成视频、自动驾驶和具身控制，形成共享分类法、评估框架与路线图挑战。
  - 研究共性：映射设计选择，如潜在表示、结构先验、记忆、可控性与长时程一致性；方法论文提供经验锚点，综述则跨论文抽象。
  - 关键差异：概念分类论文多未验证且提出评估建议，而经验系统论文处于不同设置中，包括真实机器人、驾驶仿真、自我视角预测和开源视频仿真。
  - 趋势演进：从2022-2023年的物理机器人与驾驶仿真系统，到2024年的组合与Sora中心综合，再到2025-2026年的分类法、开放基准、开源模拟器和持久视线外动态。
  - 开放问题：所提分类法是否充分且经过验证；如何在不可兼容的评估设置间比较结果；什么机制支持长时程与组合泛化；哪些可复现性缺口最会削弱综述结论。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world-model research into design-space
        axes such as latent representation form, structural priors, and internal mechanics,
        linking video generation, driving, and embodied agents under a common framework.
      what_remains_open: Syntheses often remain conceptual; systematic inclusion criteria,
        exhaustiveness, and empirical validation of the proposed taxonomies are not
        established in the available evidence.
    - line: Evaluation-oriented synthesis and benchmarking
      what_it_solves: Consolidates assessment choices into benchmarks and metrics
        for long-horizon consistency, controllability, closed-loop behavior, real-time
        cost, and resource-aware inference.
      what_remains_open: Cross-setting compatibility and implementation are unresolved;
        several proposed evaluation suites are described without empirical testing,
        and baseline comparability is not demonstrated.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete research gaps
        such as out-of-sight dynamics, compositional generalization beyond seen primitives,
        real-world robot learning, and open-source artifact availability.
      what_remains_open: Prioritization of which gaps matter most and verification
        that they reflect systematic evidence rather than selective examples remain
        unresolved.
    - line: Empirical world-model anchors
      what_it_solves: Supplies concrete systems and results for compositional video
        generation, physical robot learning, driving simulation, and controllable
        ego-vision prediction from which surveys can abstract.
      what_remains_open: Several anchor papers lack detailed limitation evidence or
        complete artifact signals, leaving the strength of the empirical base uncertain.
    consensus:
    - World models are treated as a central object for synthesizing progress across
      video generation, driving, and embodied control rather than as isolated task-specific
      components.
    - Long-horizon consistency, controllability, and closed-loop or real-world evaluation
      are recurring concerns; papers converge on needing evidence beyond short video
      quality.
    - Open-source artifacts and reproducible benchmarks are highlighted as enabling
      conditions for comparing and advancing world-model research.
    disagreements:
    - Some contributions prioritize conceptual taxonomy and evaluation prescription,
      while others prioritize empirical demonstration in a specific simulator or robot
      platform.
    - 'Representation choices differ: language-conditioned compositional primitives,
      persistent global state with monitors, latent traffic agents with personality,
      and ego-vision multimodal controls imply different assumptions about what must
      be explicit in a model.'
    - Evaluation targets differ across simulation success, physical robot learning,
      motion prediction, future-frame controllability, and out-of-sight persistence,
      making direct result comparison difficult.
    - Deployment settings differ from real-time interactive or open-source simulation
      to offline benchmark evaluation and real robot online learning, creating different
      reproducibility and hardware-access requirements.
    open_questions:
    - Which taxonomy dimensions are necessary and sufficient for comparing world models
      across driving, embodied control, and video generation?
    - How can proposed evaluation frameworks be empirically validated without shared
      datasets, baselines, or open-source implementations?
    - What representation and memory mechanisms are needed to sustain long-horizon,
      out-of-sight, and compositional generalization beyond training primitives?
    - Which reproducibility gaps such as missing code, model access, or limitation
      evidence most weaken current survey conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型研究组织为潜空间表示、结构先验、内部机制等设计维度，并把视频生成、自动驾驶与具身智能统一起来。
      尚未覆盖: 综述多停留在概念层面，缺少系统文献筛选证据和对分类法的实证验证。
    - 路线: 评估导向综合与基准构建
      解决的问题: 整合长时程一致性、可控性、闭环行为、实时性或资源成本等评估选择，提出度量或基准。
      尚未覆盖: 不同评测设置之间的可比性未被证明；部分评估套件在证据中尚未实施或测试。
    - 路线: 开放问题与缺口路线图
      解决的问题: 将文献覆盖转化为具体研究缺口，如视线外动态、超越已见原语的组合泛化、真实机器人学习和开源工件可获取性。
      尚未覆盖: 哪些缺口最优先以及如何区分真缺口与选择性证据仍未解决。
    - 路线: 经验性世界模型锚点
      解决的问题: 提供组合视频生成、物理机器人学习、驾驶仿真和可控自我视角预测等具体系统与结果，为综述综合提供事实基础。
      尚未覆盖: 多个方法论文缺少详细局限或工件证据，导致支撑综合的论断难以验证。
    共识:
    - 世界模型被视为跨视频生成、自动驾驶和具身控制进行综合的核心对象，而不是仅作为孤立任务组件。
    - 长时程一致性、可控性以及闭环或真实世界评估是反复出现的问题，论文共同指向需要超越短视频质量。
    - 开放源码工件和可复现基准被认为是比较和推进世界模型研究的使能条件。
    分歧:
    - 部分工作侧重概念分类和评估建议，部分工作侧重在特定模拟器或机器人平台上的经验演示。
    - 表示选择不同：语言条件的组合原语、带监控的持久全局状态、带个性潜变量的交通智能体、以及自我视角多模态控制，隐含着对模型必须显式建模什么的不同假设。
    - 评估目标不同：仿真成功率、物理机器人学习、运动预测、未来帧可控性、视线外持久性，其结果通常不可直接比较。
    - 部署设置不同：实时交互或开源仿真、离线基准评测、真实机器人在线学习，带来不同的可复现性和硬件门槛。
    开放问题:
    - 哪些分类维度对跨驾驶、具身控制与视频生成的世界模型比较是必要且充分的？
    - 在缺少共享数据集、基线和开源实现的情况下，如何对提出的评估框架进行实证验证？
    - 需要哪些表示和记忆机制来维持超越训练原语的长时程、视线外与组合泛化？
    - 哪些可复现性缺口，如缺失代码、模型访问或局限性证据，最会削弱当前综述结论？
