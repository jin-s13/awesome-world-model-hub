  literature_review:
    line_of_work_matrix:
    - line: Landscape survey synthesis for generative world models
      what_it_solves: Organizes fragmented advances across video generation, autonomous
        driving, and autonomous agents into a shared world-model perspective and highlights
        broad capabilities.
      what_remains_open: Limitations and challenges are mentioned but not detailed
        in visible abstract-level evidence; systematic selection criteria and an operational
        evaluation framework are not specified.
    - line: Unified taxonomy and evaluation framework synthesis
      what_it_solves: Defines design dimensions for latent representations, structural
        priors, and internal mechanics, and proposes evaluation prescriptions such
        as closed-loop and resource-aware metrics.
      what_remains_open: The framework is conceptual; it lacks empirical validation,
        implemented evaluation, and a guarantee that the taxonomy covers existing
        and future approaches.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad literature coverage into future research directions
        and open challenges for physical consistency, long-horizon stability, and
        generalization.
      what_remains_open: Evidence does not show how to prioritize those gaps or how
        to test which gap matters most for downstream progress.
    consensus:
    - The visible syntheses agree that generative world-model work needs structured
      overviews because methods span video prediction, interactive simulation, and
      planning.
    - Both treat evaluation as underdeveloped and call for moving beyond single generation-quality
      scores toward closed-loop or resource-aware assessment.
    - Both treat physical consistency, long-horizon stability, and generalization
      as open challenges rather than solved capabilities.
    disagreements:
    - One synthesis is broad and application-spanning, covering video generation,
      autonomous driving, and agents, while the other narrows to automated driving
      and focuses on latent design space.
    - 'Validation posture differs: one summarizes findings from existing work but
      leaves limitation detail at the abstract level, while the other explicitly presents
      a conceptual framework with no experiments.'
    - 'Evaluation prescriptions differ: one proposes a domain-specific closed-loop
      metric suite and resource-aware inference cost, while the other discusses evaluation
      more generally.'
    open_questions:
    - Can taxonomy completeness and evaluation prescriptions be validated beyond selective
      examples?
    - 'Which open challenge is most progress-limiting: long-horizon consistency, physical
      plausibility, real-time interaction, or closed-loop evaluation?'
    - Are findings from different datasets, metrics, and deployment settings compatible
      enough for cross-paper comparison?
    - Many non-survey papers in the evidence packet lack full method and citation
      metadata, so reproducibility and limitation coverage remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型全景综述与路线图综合
      解决的问题: 将视频生成、自动驾驶和自主智能体等碎片化进展纳入统一世界模型视角，提炼能力方向。
      尚未覆盖: 可见摘要中局限与挑战讨论较粗，缺少系统筛选标准与可操作评测框架。
    - 路线: 面向自动驾驶的统一潜空间分类法与评测框架
      解决的问题: 按潜在表示、结构先验和内部机制组织设计空间，并提出闭环度量与资源感知评测方案。
      尚未覆盖: 框架仅为概念性，缺少实证验证、实现评测或对分类完整性的保证。
    - 路线: 开放问题与缺口映射
      解决的问题: 把文献覆盖转化为物理一致性、长时程稳定性和泛化等未来研究方向与开放挑战。
      尚未覆盖: 证据未显示如何排序这些缺口，也无法验证哪个缺口对下游进展最优先。
    共识:
    - 可见的综述都认为需要结构化梳理生成式世界模型，因为方法覆盖视频预测、交互模拟和规划等不同问题。
    - 双方都把评测视为尚不成熟的核心问题，强调超越单一生成质量，向闭环或资源感知评估延伸。
    - 双方都将物理一致性、长时程稳定性和泛化作为开放挑战的一部分。
    分歧:
    - 一篇为跨应用全景综述，涉及视频生成、自动驾驶和智能体；另一篇收缩到自动驾驶，聚焦潜空间设计。
    - 验证姿态不同：一篇综合已有发现但摘要级局限细节有限；另一篇明确是概念框架，没有实验。
    - 评测方案不同：一篇提出领域特定的闭环度量套件与资源感知推理代价，另一篇更一般地讨论评测。
    开放问题:
    - 分类法与评测方案能否被实证验证，而不是依赖选择性例子？
    - 长时程一致性、物理合理性、实时交互与闭环评估中，哪个缺口对进展最优先？
    - 不同数据集、指标和部署约束下的发现是否足够兼容以跨论文比较？
    - 证据包中许多非综述论文缺少完整方法与引文元数据，复现性和局限覆盖仍是验证缺口。
