  related_work_outline_zh:
  - 主流方向：世界模型越来越多地采用扩散和Transformer架构，应用于自动驾驶、机器人、交互游戏等具体领域，进行视频预测、仿真和策略学习。
  - 研究共性：大部分工作通过视觉或多模态数据的自监督预训练学习环境动态，再将学到的模型用于下游控制、规划或评估。
  - 关键差异：方法在建模像素级观测还是潜在动态、是否引入物理先验或组合结构、是否耦合动作与视频生成以及评估基准是标准集还是特定领域定制集等方面存在差异。
  - 趋势演进：领域正从纯潜在动力学模型（如Dreamer变体）转向基于扩散的视频世界模型，近期侧重物理合理性、组合泛化和记忆一致性，体现在2023至2026年的工作中。
  - 开放问题：跨本体与跨领域迁移、长期记忆与物理一致性、仿真收益与真实世界安全之间的对齐，以及缺乏标准化基准来评估世界模型能力。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Generating realistic, multi-view, long-horizon driving videos
        for closed-loop simulation and scene prediction under diverse conditions.
      what_remains_open: Verification of real-world safety and operational outcomes,
        zero-shot transfer across sensor setups and geographic regions, and integration
        of traffic rule compliance beyond pixel fidelity.
    - line: Embodied world models for robotics
      what_it_solves: Learning environment dynamics from visual and action data to
        enable robot imagination, policy pretraining, and compositional task planning.
      what_remains_open: Generalization to unseen physical embodiments and real-world
        deployment, true physical constraint satisfaction, and handling of novel object-action
        combinations not seen in training.
    - line: Interactive world model benchmarks
      what_it_solves: Providing standardized evaluation of spatial consistency, memory,
        and action controllability in open-ended environments like Minecraft and custom
        video sets.
      what_remains_open: Coverage of diverse interactive scenarios, long-term memory
        evaluation beyond short loops, and alignment with realistic agent tasks beyond
        navigation.
    consensus:
    - World models benefit from generative architectures (diffusion, transformers)
      to capture complex environment dynamics from high-dimensional observations.
    - Self-supervised pretraining on large-scale datasets, including action-free videos,
      improves downstream task performance and sample efficiency.
    - Explicit conditioning on actions or context is essential for controllable simulation
      and policy learning.
    - Evaluation remains fragmented across domains, with no single accepted benchmark
      for world model capabilities.
    disagreements:
    - Whether to model the world at the pixel level (video generation) or in a compact
      latent space for policy optimization; this affects the type of downstream tasks
      supported.
    - 'The role of explicit physical priors: some works inject depth or keypoint dynamics,
      while others rely purely on data-driven appearance learning.'
    - 'How to achieve compositional generalization: through language-based decomposition
      of primitives or through unified multi-task architectures.'
    - 'Evaluation protocols: standard RL benchmarks (Atari) vs. domain-specific driving
      datasets vs. self-constructed Minecraft or video benchmarks, making cross-work
      comparison difficult.'
    open_questions:
    - Can world models trained in simulation or on static datasets transfer to real-world
      robotic or driving tasks without extensive fine-tuning?
    - How to ensure long-term memory and physical consistency in generated rollouts,
      especially when actions deviate from training distributions?
    - What metrics and benchmarks can capture both visual fidelity and control-oriented
      utilities (e.g., policy robustness) in a unified way?
    - Under what conditions do compositional or physics-informed designs actually
      improve downstream task success compared to scaling data and model size?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 生成逼真、多视角、长时域驾驶视频，用于闭环仿真和场景预测。
      尚未覆盖: 真实世界安全性与运营结果的验证，跨传感器设置和地理区域的零样本迁移，以及超越像素保真度的交通规则遵守。
    - 路线: 机器人具身世界模型
      解决的问题: 从视觉和动作数据中学习环境动态，支持机器人想象、策略预训练和组合任务规划。
      尚未覆盖: 向未见物理本体的泛化与真实世界部署，真实物理约束的满足，以及对训练中未见的物体-动作组合的处理。
    - 路线: 交互式世界模型基准
      解决的问题: 在Minecraft等开放环境中，为空间一致性、记忆和动作可控性提供标准化评估。
      尚未覆盖: 多样化交互场景的覆盖，超越短循环的长期记忆评估，以及与实际智能体任务（非导航）的对齐。
    共识:
    - 世界模型借助生成式架构（扩散、Transformer）从高维观测中捕捉复杂环境动态。
    - 在大规模数据集上进行自监督预训练，包括无动作视频，可提升下游任务性能和样本效率。
    - 显式地以动作或上下文为条件对于可控仿真和策略学习至关重要。
    - 评估在不同领域各自为政，缺乏公认的统一世界模型能力基准。
    分歧:
    - 在像素级建模（视频生成）还是紧凑潜在空间建模方面存在选择，这影响所支持的下游任务类型。
    - 显式物理先验的角色：部分工作注入深度或关键点动力学，其他工作则完全依赖数据驱动的外观学习。
    - 实现组合泛化的方式：通过基于语言的原语分解，还是通过统一的多任务架构。
    - 评估协议：标准RL基准（Atari）对领域特定驾驶数据集对自建Minecraft或视频基准，导致跨工作比较困难。
    开放问题:
    - 在仿真或静态数据集上训练的世界模型能否在无需大量微调的情况下迁移到真实机器人或驾驶任务？
    - 如何确保生成轨迹中的长期记忆和物理一致性，尤其当动作偏离训练分布时？
    - 哪些指标和基准能同时捕捉视觉保真度与面向控制的效用（如策略鲁棒性）？
    - 相比于扩展数据和模型规模，组合或物理信息设计在何种条件下真正提升下游任务成功率？
