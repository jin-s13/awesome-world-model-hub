  related_work_outline:
  - 'Mainstream direction: Creating standardized benchmarks and metrics to evaluate
    world models beyond visual quality, emphasizing long-term consistency, action
    controllability, and physical plausibility.'
  - 'Shared research pattern: Proposing a new dataset or evaluation protocol, defining
    a specialized metric (e.g., spatial consistency, memory consistency), and benchmarking
    existing world model architectures against it.'
  - 'Key differences: Evaluation focus varies—spatial consistency (loop navigation),
    memory and action control (closed-loop revisited), task performance (Atari), visual
    fidelity (video generation)—across environments from games to real driving.'
  - 'Trend evolution: Shift from static, open-loop video prediction benchmarks toward
    interactive, closed-loop evaluations that stress-test memory and generalization;
    benchmarks now span multi-view, long-horizon, and embodied settings.'
  - 'Open questions: Whether proxy metrics align with downstream decision utility,
    whether benchmark rankings remain stable under different compute budgets and implementations,
    and how to cover the full spectrum of world-model capabilities in a unified suite.'
  related_work_outline_zh:
  - 主流方向：构建标准化基准与指标，超越视觉质量，重点评估世界模型的长期一致性、动作可控性和物理合理性。
  - 研究共性：提出新数据集或评估协议，定义专门指标（如空间一致性、记忆一致性），并对现有世界模型架构进行基准测试。
  - 关键差异：评估重点不同（空间一致性、记忆与动作控制、任务性能、视觉保真度），环境从游戏到真实驾驶各异。
  - 趋势演进：从静态开环视频预测基准转向交互式闭环评估，压力测试记忆与泛化；基准现已覆盖多视角、长时域和具身场景。
  - 开放问题：代理指标是否与下游决策效用一致，基准排名在不同算力和实现下是否稳定，如何构建覆盖世界模型全能力的统一套件。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world models
      what_it_solves: Creates shared evaluation tasks and datasets that make prediction,
        generalization, and consistency claims of world models comparable across architectures.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings where world models are expected to assist planning, decision-making,
        and long-horizon interaction.
    - line: Metric and stress-test design for world model evaluation
      what_it_solves: Probes capabilities beyond pixel-level reconstruction, such
        as memory consistency, action control, spatial coherence, and stability under
        distribution shift, via specialized metrics and stress tests.
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        utility for policy learning or robotic execution, and sensitivity to shifts
        in data distribution or evaluation protocol.
    - line: Comparable baselines and reporting standards
      what_it_solves: Establishes common baselines (e.g., Dreamer variants, diffusion
        world models) and reporting conventions so that results are auditable and
        comparisons are meaningful.
      what_remains_open: Stability of benchmark conclusions across different implementations,
        compute budgets, and hyperparameter choices; generalization of findings from
        one benchmark to another.
    consensus:
    - World model evaluation must move beyond frame-wise reconstruction quality to
      assess long-term memory, temporal consistency, and action-conditioned controllability.
    - A well-designed benchmark needs standardized tasks, transparent metrics, and
      a clear evaluation protocol to enable reproducible and fair comparisons.
    - Closed-loop or interactive evaluation protocols reveal brittleness that open-loop
      rollout metrics often miss, especially under compounding errors.
    disagreements:
    - 'The primary evaluation dimension differs: some works prioritize spatial consistency
      across viewpoints, others emphasize memory of past observations, while many
      focus on task-level success or visual fidelity.'
    - The choice of environment varies from synthetic game worlds (Minecraft, Atari)
      and real-world driving logs (nuScenes, Waymo) to diverse robotic manipulation
      settings, leading to different assumptions about action spaces and visual complexity.
    - Metrics differ in their sensitivity to pixel-level variations; some are invariant
      by design (scene-graph-based scores), while others directly measure reconstruction
      error or human-normalized performance, causing disagreements on model rankings.
    open_questions:
    - Do current benchmarks collectively cover the essential capabilities needed for
      world models to be useful in real-world decision-making, such as physical reasoning
      and causal understanding?
    - How strongly do the proposed proxy metrics correlate with downstream task performance
      in policy learning, and can a single metric suffice across environments?
    - Are the conclusions drawn from existing benchmarks stable under varying computational
      budgets, model sizes, and implementation details, or do rankings shift with
      these factors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型的基准任务与数据集设计
      解决的问题: 构建共享的评估任务和数据集，使不同世界模型的预测、泛化和一致性主张可跨架构比较。
      尚未覆盖: 任务分布是否覆盖了世界模型预期用于规划、决策和长时域交互的全部真实场景。
    - 路线: 世界模型评估的指标与压力测试设计
      解决的问题: 探测超越像素级重建的能力，如记忆一致性、动作控制、空间连贯性和分布偏移下的稳定性，通过专门指标和压力测试实现。
      尚未覆盖: 这些代理指标与策略学习或机器人执行的下游效用之间的对齐，以及对数据分布或评估协议变化的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 建立统一基线（如Dreamer变体、扩散世界模型）和报告惯例，使结果可审计且比较有意义。
      尚未覆盖: 基准结论在不同实现、算力预算和超参数选择下的稳定性，以及从一个基准到另一个基准的发现泛化性。
    共识:
    - 世界模型评估必须超越逐帧重建质量，转向评估长期记忆、时间一致性和动作条件可控性。
    - 设计良好的基准需要标准化的任务、透明的指标和清晰的评估协议，以实现可复现且公平的比较。
    - 闭环或交互式评估协议能揭示开环指标（尤其在累积误差下）经常遗漏的脆弱性。
    分歧:
    - 主要评估维度不同：有的工作优先考虑跨视角的空间一致性，有的强调对过去观测的记忆，而许多工作聚焦于任务级成功或视觉保真度。
    - 环境选择从合成游戏世界（Minecraft、Atari）到真实驾驶日志（nuScenes、Waymo）再到多样化机器人操作场景，导致对动作空间和视觉复杂度的假设不同。
    - 指标对像素级变化的敏感度不同；有些在设计上具有不变性（基于场景图的分数），而其他直接测量重建误差或人类归一化性能，导致模型排名出现分歧。
    开放问题:
    - 当前基准是否共同覆盖了世界模型在现实决策中所需的关键能力，如物理推理和因果理解？
    - 所提出的代理指标与策略学习中的下游任务性能之间相关性有多强，且单一指标能否跨环境通用？
    - 现有基准得出的结论在不同计算预算、模型规模和实现细节下是否稳定，或者排名会随这些因素而改变？
