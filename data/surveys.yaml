  related_work_outline:
  - 'Mainstream direction: Building world-model benchmarks with specialized datasets
    and metrics that go beyond aggregate task scores, probing spatial consistency,
    memory, action control, and physical plausibility.'
  - 'Shared research pattern: Introducing a new dataset or evaluation protocol that
    targets a specific capability of world models, then benchmarking existing models
    to reveal their weaknesses.'
  - 'Key differences: The evaluated capabilities differ substantially—some focus on
    visual fidelity and policy performance, others on physical reasoning or long-term
    memory; the underlying world-model architectures also vary (diffusion, VAE, Transformer).'
  - 'Trend evolution: From 2023–2026, benchmarks shift from standard game-based (Atari)
    to diverse domains (driving, robotics, Minecraft) and from overall scores to fine-grained,
    multi-dimensional evaluations.'
  - 'Open questions: The connection between proxy metrics and downstream decision
    utility remains unverified; long-term memory consistency and cross-action-space
    generalization are unresolved challenges; benchmark stability across implementations
    and compute budgets is not yet demonstrated.'
  related_work_outline_zh:
  - 主流方向：通过专门的数据集和指标构建世界模型基准，超越总分，探查空间一致性、记忆、动作控制和物理合理性。
  - 研究共性：提出一个新的数据集或评估方案，针对世界模型的特定能力，然后对现有模型进行基准测试以揭示其弱点。
  - 关键差异：评估的能力维度差异显著，有的关注视觉保真度和策略性能，有的关注物理推理或长期记忆；底层世界模型架构也不同（扩散、VAE、Transformer）。
  - 趋势演进：2023–2026年间，基准从标准游戏（Atari）转向多样化领域（驾驶、机器人、Minecraft），从总体分数转向细粒度、多维评估。
  - 开放问题：代理指标与下游决策效用之间的联系尚未验证；长期记忆一致性和跨动作空间泛化仍是未解决的挑战；基准在不同实现和计算预算下的稳定性尚未得到证明。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model claims
        comparable, covering driving, gaming, robotics, and open-world navigation.
      what_remains_open: Whether the task distribution realistically covers the settings
        where world models are expected to help, such as long-term physical interactions
        and complex real-world dynamics, is not yet established.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, robustness, and decision
        utility beyond aggregate scores through metrics like scene graph consistency,
        memory consistency, action control, and physical plausibility.
      what_remains_open: The alignment between these proxy metrics and the downstream
        decisions users actually care about (e.g., robot policy success rate) has
        not been validated, and failure modes may remain undetected.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable by providing open-source code, datasets,
        and common baselines (e.g., Atari 100k, Dreamer variants) that enable head-to-head
        comparisons.
      what_remains_open: Stability of benchmark conclusions across different implementations
        and compute budgets is unexplored; reproducibility of reported results remains
        a verification gap for several works.
    consensus:
    - World-model evaluation is moving from single aggregate task scores toward multi-dimensional
      capability analysis, including spatial consistency, memory, action control,
      and physical plausibility.
    - Diffusion models and Transformers have become dominant architectures for world
      models and are driving improvements in visual quality and prediction accuracy.
    - Specialized benchmarks reveal that current world models struggle with long-term
      consistency and generalizing across diverse action spaces, motivating more challenging
      evaluation designs.
    disagreements:
    - 'The choice of which capability to evaluate varies: some works prioritize visual
      fidelity and its impact on policy performance, others emphasize physical plausibility
      or memory-driven consistency.'
    - Benchmark domains are fragmented, spanning Atari games, driving, robotics, and
      Minecraft, with no unified evaluation protocol that allows cross-domain comparison
      of world-model quality.
    - Architectural choices differ, with some models using diffusion, others VAE-Transformer
      hybrids, leading to different trade-offs in training efficiency, inference speed,
      and visual detail.
    open_questions:
    - How can we construct benchmarks that comprehensively assess the utility of world
      models for real-world decision-making, rather than only measuring proxy metrics?
    - What is the relationship between fine-grained metrics like memory consistency
      or action control and downstream task performance, and how can we design stress
      tests that anticipate real failure modes?
    - Under what conditions do benchmark conclusions remain stable across different
      implementations, hardware budgets, and hyperparameter settings, and how can
      we ensure reproducibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张具备可比性，覆盖驾驶、游戏、机器人和开放世界导航。
      尚未覆盖: 任务分布是否真实地覆盖了世界模型预期发挥作用的场景（如长期物理交互和复杂现实动力学）尚未证实。
    - 路线: 指标与压力测试设计
      解决的问题: 通过场景图一致性、记忆一致性、动作控制和物理合理性等指标，在总分之外检验预测、可控性、鲁棒性和决策效用。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策（如机器人策略成功率）之间的一致性尚未验证，且可能遗漏故障模式。
    - 路线: 可比基线与报告规范
      解决的问题: 通过提供开源代码、数据集和通用基线（如Atari 100k、Dreamer变体）使结果可审计，支持直接比较。
      尚未覆盖: 基准结论在不同实现和计算预算下的稳定性尚未探索；部分工作的结果可复现性仍存在验证缺口。
    共识:
    - 世界模型评估正从单一任务总分转向多维度能力分析，包括空间一致性、记忆、动作控制和物理合理性。
    - 扩散模型和Transformer已成为世界模型的主流架构，推动了视觉质量和预测精度的提升。
    - 专门基准揭示当前世界模型在长期一致性和跨动作空间泛化方面存在困难，促使设计更具挑战性的评估方案。
    分歧:
    - 评估能力的选择不同：有的工作优先考虑视觉保真度及其对策略性能的影响，有的则强调物理合理性或记忆驱动的一致性。
    - 基准领域碎片化，涵盖Atari游戏、驾驶、机器人、Minecraft，缺乏统一的跨域世界模型质量评估协议。
    - 架构选择存在差异，部分模型使用扩散，部分使用VAE-Transformer混合，导致训练效率、推理速度和视觉细节方面各有取舍。
    开放问题:
    - 如何构建能全面评估世界模型在真实决策中效用的基准，而不仅仅是测量代理指标？
    - 细粒度指标（如记忆一致性或动作控制）与下游任务性能之间的关系是什么？如何设计能预见真实故障模式的压力测试？
    - 基准结论在不同实现、硬件预算和超参数设置下何时保持稳定？如何确保可复现性？
