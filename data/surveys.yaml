  related_work_outline:
  - 'Mainstream direction: Generative world models based on diffusion transformers
    and unified multimodal architectures, trained on video with auxiliary signals
    such as mask reconstruction, depth, keypoints, context, and actions.'
  - 'Shared research pattern: Most works couple a learned dynamics or video generator
    with task-specific conditioning or auxiliary objectives, then evaluate through
    prediction fidelity, policy generalization, zero-shot execution, or consistency
    benchmarks.'
  - 'Key differences: Representations range from recurrent state-space and VAE-transformer
    to diffusion transformer; supervision differs across context conditioning, language
    primitives, physics-informed tasks, mask reconstruction, and coupled action diffusion;
    evaluation targets span driving, Atari, robot simulation, Minecraft, and open-domain
    video.'
  - 'Trend evolution: Available top-paper evidence from 2023-2026 shows a shift from
    sample-efficient model-based RL architectures toward unified world models that
    jointly represent video, action, context, and physics, with newer benchmarks for
    consistency and action control; older years are not represented in the frontier
    sample.'
  - 'Open questions: Long-term spatial and memory consistency, cross-action-space
    generalization, real-robot transfer, and whether observed gains come from the
    learned model versus planners, controllers, or system-level design remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer与统一多模态架构为核心的生成式世界模型，联合视频生成和辅助信号（掩码重建、深度、关键点、动作）提升保真度与可控性。
  - 研究共性：多数工作将学习动力学或视频生成器与任务条件/辅助目标耦合，并以预测保真度、策略泛化或基准一致性作为证据模式。
  - 关键差异：表示涵盖循环状态空间、VAE-Transformer与扩散Transformer；监督信号涉及上下文、语言原语、物理、动作扩散与掩码重建；评测覆盖驾驶、Atari、机器人仿真、Minecraft与开放域视频。
  - 趋势演进：2023-2026年证据显示从样本高效模型驱动强化学习架构转向统一世界模型，并纳入动作、上下文、物理与一致性基准；更早年份未在top论文中体现，趋势属当前前沿。
  - 开放问题：长时空间/记忆一致性、跨动作空间泛化、真实机器人迁移，以及收益是否来自模型、规划器或系统选择仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Converts world-model concepts into concrete architectures and
        training signals, including video prediction, mask reconstruction, physics-informed
        depth and keypoint learning, contextual latent dynamics, and unified video-action
        generation.
      what_remains_open: Which representation or auxiliary objective transfers beyond
        the reported task families, datasets, and visual or control metrics is not
        isolated.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics or video generation to interventions,
        policies, and task execution through imagination, action diffusion, language-primitive
        planning, or downstream policy training and evaluation.
      what_remains_open: Evidence does not fully separate gains from the learned model
        from gains contributed by the planner, controller, task prior, or environment-specific
        action interface.
    - line: Method evidence and evaluation protocol
      what_it_solves: Introduces datasets and metrics for capabilities that visual
        fidelity or sample-efficiency scores may miss, such as spatial consistency,
        memory consistency, action control, and cross-scene or cross-view generalization.
      what_remains_open: Benchmark-oriented evidence often reports protocol construction
        with limited method comparison; missing baselines, metrics, code, or limitation
        details remain verification gaps.
    consensus:
    - World-model methods increasingly combine generative video or latent dynamics
      with auxiliary supervision or conditioning to improve fidelity, controllability,
      and generalization.
    - 'There is shared interest in evaluating beyond visual quality: policy generalization,
      zero-shot or unseen-goal execution, spatial and memory consistency, and action
      control appear as common evidence targets.'
    - Recent methods favor architectures that unify multiple modalities such as video,
      action, context, language, and physics within a single generative or dynamics
      objective.
    disagreements:
    - 'Representation choices differ: recurrent state-space, VAE-transformer, and
      diffusion transformer are used for world-model dynamics or generation.'
    - 'Supervision signals differ: mask reconstruction, context conditioning, language-primitive
      factorization, keypoint and depth physics tasks, and coupled action diffusion
      define different training objectives.'
    - 'Evaluation targets differ: driving video prediction, Atari sample-efficient
      control, robot simulation and policy execution, Minecraft navigation, and open-domain
      video consistency lead to different evidence patterns and failure modes.'
    - 'Interaction and deployment assumptions differ: closed-loop action control,
      generative video plans, and benchmark-only evaluation make different assumptions
      about observable context, action spaces, and real-world transfer.'
    open_questions:
    - Can world models maintain long-term memory and spatial consistency across loops,
      viewpoints, and action spaces without task-specific priors?
    - Do zero-shot and unseen-goal improvements come from the learned model or from
      context observability, language parsing, planner quality, and dataset biases?
    - How well do representations trained on simulation or internet-style video transfer
      to real robot execution and physical constraints?
    - Which auxiliary objectives and evaluation metrics are sufficient to isolate
      method contribution from surrounding system choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法落实为具体架构与训练信号，包括视频预测、掩码重建、物理信息深度和关键点、上下文潜在动力学以及统一视频-动作生成。
      尚未覆盖: 尚不明确哪类表示或辅助目标能迁移到已报告任务族、数据集及视觉或控制指标之外。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学或视频生成连接到干预、策略和任务执行，包括想象训练、动作扩散、语言原语规划以及下游策略训练和评估。
      尚未覆盖: 证据未能完全区分收益来自学习模型，还是来自规划器、控制器、任务先验或环境特有的动作接口。
    - 路线: 方法证据与评测协议
      解决的问题: 提出数据集和指标以捕捉视觉保真度或样本效率分数可能遗漏的空间一致性、记忆一致性、动作控制和跨场景/跨视角泛化能力。
      尚未覆盖: 基准类证据多报告协议构建，方法对比有限；缺失基线、指标、代码或局限性细节仍是验证缺口。
    共识:
    - 世界模型方法越来越将生成式视频或潜在动力学与辅助监督/条件结合，以提升保真度、可控性和泛化性。
    - 研究普遍在视觉质量之外评估策略泛化、零样本或未见目标执行、空间/记忆一致性和动作控制。
    - 近期方法倾向于用统一生成或动力学目标整合视频、动作、上下文、语言和物理等多模态信息。
    分歧:
    - 表示选择不同：循环状态空间、VAE-Transformer与扩散Transformer分别用于世界模型动力学或生成。
    - 监督信号不同：掩码重建、上下文条件、语言原语分解、关键点/深度物理任务和耦合动作扩散定义不同的训练目标。
    - 评测目标不同：驾驶视频预测、Atari样本高效控制、机器人仿真策略执行、Minecraft导航和开放域视频一致性形成不同证据模式。
    - 交互与部署假设不同：闭环动作控制、生成视频计划或纯基准评测对可观测上下文、动作空间和真实环境迁移的假设不同。
    开放问题:
    - 世界模型能否在没有任务特定先验下维持跨循环、跨视角和跨动作空间的长期记忆与空间一致性？
    - 零样本和未见目标改进究竟来自模型本身，还是来自上下文可观测、语言解析、规划器质量与数据偏差？
    - 在仿真或互联网式视频上训练的表示能否迁移到真实机器人执行和物理约束？
    - 哪些辅助目标和评测指标足以隔离方法贡献与周边系统选择？
