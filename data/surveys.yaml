  - 'Trend evolution: Evidence from 2022 to 2026 moves from physical-robot online
    world-model learning through Sora-focused survey unification and compositional/multimodal
    methods, toward 2026 work on out-of-sight dynamics, autonomous driving taxonomies,
    open-source real-time simulation, and interactive evaluation.'
  - 'Open questions: It remains open how to validate survey taxonomies and evaluation
    suites empirically, how to generalize beyond seen primitive combinations and episodic
    settings, how to close the open-loop/closed-loop evaluation gap, and how to verify
    real deployment transfer.'
