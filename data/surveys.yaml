  - 'Trend evolution: 2022 physical robot world models preceded 2024 general video
    world model surveys. 2025–2026 frontier shifts toward open-source interactive
    systems, out-of-sight dynamics benchmarks, and unified driving taxonomies with
    explicit evaluation frameworks.'
  - 'Open questions: How to align open-loop generation with closed-loop decisions;
    whether long-horizon and out-of-sight consistency generalize; how to validate
    conceptual taxonomies; and which evaluation gaps should be prioritized remain
    open.'
  related_work_outline_zh:
  - 主流方向：面向具身智能与自动驾驶的世界模型综合与评测，尤其生成式视频世界模型和驾驶潜在世界模型；综述提供分类体系与路线图，方法论文聚焦可控、长时程动态。
  - 研究共性：工作常把场景分解为可控因素——语言原语、潜在状态、位姿/自运动、目的地/个性——再通过未来预测、视频规划或交通仿真评测；综述围绕表示、结构先验和评测缺口进行归纳。
  - 关键差异：表示从语言原语、连续/离散潜在状态、显式3D/全局状态到多模态稀疏特征各不相同；评测目标涉及物理机器人学习、仿真、驾驶运动预测和基准视频生成；部分为概念框架，部分为实证系统。
  - 趋势演进：2022年物理机器人世界模型之后，2024年出现通用视频世界模型综述；2025–2026年前沿转向开源交互系统、视线外动态基准和带评测框架的统一驾驶分类体系。
  - 开放问题：如何对齐开环生成与闭环决策；长时程与视线外一致性如何泛化；概念性分类法如何验证；哪些评测缺口值得优先解决，仍有待回答。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model work into design dimensions, milestones,
        and research gaps for general and driving-specific settings.
      what_remains_open: Synthesis is often based on selective review; conceptual
        frameworks lack empirical validation, and inclusion criteria or systematic
        evidence are not fully reproducible.
    - line: Comparative evaluation synthesis
      what_it_solves: Compares open-loop generation, closed-loop driving, controllability
        metrics, and physical execution claims to reveal evaluation mismatches.
      what_remains_open: Proposed closed-loop and resource-aware metric suites are
        not implemented; compatibility across datasets and baselines remains unverified.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into targeted gaps such as out-of-sight
        dynamics, long-horizon consistency, novel primitive generalization, and decision-ready
        evaluation.
      what_remains_open: Prioritization of gaps and resource constraints are unspecified;
        evidence for which gap most blocks progress is missing.
    - line: Controllable generative world-model systems
      what_it_solves: Produce future frames, video plans, or multi-agent trajectories
        conditioned on language, pose/ego-motion, destination, or latent state.
      what_remains_open: Novel compositional primitives, long-term out-of-sight consistency,
        physical real-world generalization, and available code or artifacts remain
        incomplete.
    consensus:
    - World models are treated as a central simulation substrate for embodied and
      autonomous settings, with generative video and latent dynamics as a shared medium.
    - Controllability and long-horizon temporal consistency recur as goals; methods
      factor scenes into language primitives, latent states, explicit global memory,
      or multimodal conditioning.
    - There is broad recognition that evaluation must connect generation quality to
      downstream closed-loop behavior, not only open-loop prediction.
    - Survey and method contributions converge on the need for decision-ready, resource-aware
      evaluation and more systematic gap identification.
    disagreements:
    - 'Representation: factorized language primitives versus continuous/discrete latent
      worlds, explicit 3D/global state, and multimodal sparse feature conditioning.'
    - 'Evaluation target: physical robot learning, driving motion prediction and traffic
      simulation, benchmark-based video fidelity, and conceptual taxonomy validation
      are not aligned.'
    - 'Interaction or supervision: sparse rewards, language plus goal images, human
      pose and ego-trajectory, or destination and personality conditioning reflect
      different control assumptions.'
    - 'Deployment setting: real robot hardware, simulation, egocentric real-world
      video, and autonomous driving scenarios make claims difficult to compare directly.'
    open_questions:
    - Can out-of-sight and long-horizon consistency be maintained without explicit
      global state or monitor mechanisms?
    - What evaluation protocol would align open-loop generation metrics with closed-loop
      driving or physical execution reliability?
    - Do compositional world models generalize to truly novel primitives beyond training
      combinations?
    - What reproducible artifact and systematic inclusion criteria should be required
      before a survey taxonomy or roadmap is accepted as evidence-based?
    - Which open gap should be prioritized first under limited compute and real-world
      experimentation budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型工作整理为设计维度、里程碑与研究缺口，覆盖通用与驾驶特化场景。
      尚未覆盖: 综合常基于选择性综述；概念框架缺乏实证验证，纳入标准与系统证据难以复现。
    - 路线: 对比评测综合
      解决的问题: 比较开环生成、闭环驾驶、可控性指标与物理执行声明，揭示评测错配。
      尚未覆盖: 所提出的闭环和资源感知指标套件未实现；跨数据集与基线的兼容性尚未验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献转化为具体缺口，如视线外动态、长时程一致性、新原语泛化与决策就绪评测。
      尚未覆盖: 缺口优先级与资源约束未被说明；哪些缺口最阻碍进展还缺乏证据。
    - 路线: 可控生成式世界模型系统
      解决的问题: 以语言、位姿/自运动、目的地或潜在状态为条件生成未来帧、视频计划或多智能体轨迹。
      尚未覆盖: 新组合原语、长期视线外一致性、物理真实泛化以及可用代码或工件仍不完整。
    共识:
    - 世界模型被视为具身与自主场景的核心模拟基座，生成式视频和潜在动态是共同媒介。
    - 可控性与长时程一致性反复成为目标；方法将场景分解为语言原语、潜在状态、显式全局记忆或多模态条件。
    - 广泛认识到评测需要连接生成质量与下游闭环行为，而不只是开环预测。
    - 综述与方法一致指向决策就绪、资源感知的评测，以及更系统的缺口识别。
    分歧:
    - 表示方式：语言原语分解、连续/离散潜在世界、显式3D/全局状态、多模态稀疏特征条件化之间存在张力。
    - 评测目标：物理机器人学习、驾驶运动预测与交通仿真、基准视频保真度、概念分类法验证并不对齐。
    - 监督或交互信号：稀疏奖励、语言加目标图像、人体姿态与自运动、目的地与个性条件化反映不同控制假设。
    - 部署场景：真实机器人、仿真、自我中心真实视频和自动驾驶场景使结论难以直接比较。
    开放问题:
    - 是否能不借助显式全局状态或监控机制而保持视线外和长时程一致性？
    - 什么评测协议能对齐开环生成指标与闭环驾驶或物理执行可靠性？
    - 组合世界模型是否能泛化到训练组合之外的新原语？
    - 综述分类法或路线图要被认定为证据驱动，应要求何种可复现工件与系统纳入标准？
    - 在有限算力和真实世界实验预算下，应优先解决哪个开放缺口？
