  related_work_outline:
  - 'Mainstream direction: Current evidence centers on evaluating world models through
    controlled video generation and downstream policy tests. Benchmarks such as MIND
    and LoopNav probe memory consistency, spatial consistency, and action control,
    while method papers are judged on Atari 100k, NuScenes, OpenDV-2K, Waymo, and
    CARL.'
  - 'Shared research pattern: Papers combine video or state sequences with actions
    or context, then measure visual fidelity, physical plausibility, or policy return.
    Method papers increasingly use diffusion, Transformer, or stochastic latent models;
    benchmark papers contribute datasets plus diagnostic metrics rather than only
    aggregate scores.'
  - 'Key differences: Evaluation targets vary from human-normalized game score and
    visual quality to spatial loop consistency and action control. Supervision assumptions
    differ: some use action-free video or observable context, while others require
    paired actions. Settings range from Atari and Minecraft to driving and robotic
    videos, limiting direct comparison.'
  - 'Trend evolution: Within the 2023-2026 frontier, work moves from compact recurrent/VAE
    world models toward diffusion-based and Transformer-based generation. Benchmarks
    are shifting from aggregate task reward to targeted stress tests for long-term
    memory, spatial consistency, cross-action generalization, and multi-view rollout.'
  - 'Open questions: Whether diagnostic metrics align with downstream robot or driving
    decisions, whether loop/open-domain benchmarks cover deployment settings, and
    whether conclusions remain stable across missing code, datasets, baselines, and
    compute budgets remain open verification gaps.'
  related_work_outline_zh:
  - 主流方向：当前证据集中于通过可控视频生成和下游策略测试评估世界模型；MIND、LoopNav等基准探测记忆一致性、空间一致性与动作控制，方法论文则以Atari
    100k、NuScenes、OpenDV-2K、Waymo和CARL为评测。
  - 研究共性：论文通常将视频或状态序列与动作或上下文结合，衡量视觉保真度、物理合理性或策略回报；方法论文越来越多采用扩散、Transformer或随机潜变量模型，基准论文则贡献数据集和诊断指标。
  - 关键差异：评测目标从游戏人类归一化得分、视觉质量到空间闭环一致性和动作控制各不相同；监督假设也不同，有的使用无动作视频或可观测上下文，有的需要配对动作；场景覆盖Atari、Minecraft、驾驶和机器人视频，难以直接比较。
  - 趋势演进：在2023-2026前沿期内，工作从紧凑循环/VAE世界模型转向扩散和Transformer生成；基准从聚合任务回报转向长期记忆、空间一致性、跨动作泛化和多视角推演的压力测试。
  - 开放问题：诊断指标是否与机器人或驾驶下游决策一致；闭环/开放域基准是否覆盖部署场景；在缺失代码、数据集、基线和算力预算时结论是否稳定，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared video-action datasets and open-domain loop/revisit
        tasks so spatial memory and action control can be compared across world models.
      what_remains_open: Coverage is concentrated in game and open-domain videos;
        representativeness for driving, robotic manipulation, and long-horizon physical
        scenes is not established.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, spatial consistency, physical
        plausibility, and decision utility beyond aggregate visual or reward scores.
      what_remains_open: The alignment between proxy metrics such as scene-graph consistency
        or memory scores and downstream user decisions is not yet validated across
        settings.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditing through common suites such as Atari 100k and
        CARL, training budgets, and open artifacts or checkpoints.
      what_remains_open: Several top evidence entries include missing code, dataset,
        baseline, metric, or limitation details in this packet, so cross-implementation
        and compute-budget stability remains a verification gap.
    consensus:
    - Recent evidence converges on evaluating world models with video prediction and
      action-conditioned generation rather than only static-image metrics.
    - Works agree that stochastic, diffusion, or Transformer world models need diagnostic
      benchmarks for long-horizon consistency and control, not only aggregate scores.
    - Public datasets and benchmark suites are treated as important for reproducibility
      and cross-model comparison.
    disagreements:
    - 'Evaluation target: some optimize agent return in game or control suites, while
      others measure spatial consistency, memory consistency, visual fidelity, or
      physical plausibility.'
    - 'Representation: some models use continuous diffusion, while others use discrete
      latent or VAE/Transformer stochastic models; no single representation dominates
      the evidence.'
    - 'Supervision: some require paired actions or observable context values, while
      others learn from action-free video or mixed action spaces, making comparison
      uneven.'
    - Deployment settings range from game environments to driving and robotic videos,
      and conclusions may not transfer across domains.
    open_questions:
    - Do current consistency and action-control metrics predict downstream policy
      quality in deployment?
    - Which supervision assumptions and task distributions are needed for fair memory
      and spatial consistency evaluation across architectures?
    - How stable are benchmark rankings when code, datasets, baselines, and limitation
      details are missing or incompletely reported?
    - Can findings from game or open-domain benchmarks transfer to driving and robotic
      settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享视频-动作数据和循环导航/重访任务，使世界模型的空间记忆和动作控制可比较。
      尚未覆盖: 覆盖主要集中在游戏和开放域视频；对驾驶、机器人操作及长时程物理场景的代表性尚未建立。
    - 路线: 指标与压力测试设计
      解决的问题: 在视觉或奖励总分之外，探测预测、可控性、空间一致性、物理合理性和决策效用。
      尚未覆盖: 场景图一致性、记忆得分等代理指标与下游用户决策之间的对应关系尚未跨场景验证。
