  related_work_outline:
  - 'Mainstream direction: Designing specialized diagnostic benchmarks for world model
    capabilities, moving beyond aggregate generation quality to probe spatial/temporal
    consistency, memory, and physical plausibility.'
  - 'Shared research pattern: All works use standard datasets with open-source code
    and focus on comparing model predictions against ground-truth actions or scene
    graphs, emphasizing reproducibility and controlled evaluation.'
  - 'Key differences: Benchmarks differ in evaluation paradigm (closed-loop action
    control vs. loop-based spatial consistency), metric type (pixel-level fidelity
    vs. scene-graph or semantic consistency), and domain (gaming, driving, robotics).'
  - 'Trend evolution: From 2017–2023 the field reused generic RL and video benchmarks
    (Atari, CARL, NuScenes); since 2024–2026 dedicated world-model benchmarks have
    emerged that add interactive, memory, and consistency stress tests, indicating
    a shift toward diagnostic evaluation.'
  - 'Open questions: Whether proxy metrics align with downstream decision utility,
    how to ensure benchmark stability across compute budgets, and whether task distributions
    cover real-world open-ended settings.'
  related_work_outline_zh:
  - 主流方向：设计专门针对世界模型能力的诊断性基准，超越整体生成质量，探测空间/时间一致性、记忆和物理合理性。
  - 研究共性：所有工作都使用标准数据集并开源代码，聚焦于将模型预测与真实动作或场景图对比，强调可复现性和受控评估。
  - 关键差异：基准在评估范式（闭环动作控制 vs. 基于循环的空间一致性）、指标类型（像素级保真度 vs. 场景图或语义一致性）和领域（游戏、驾驶、机器人）上存在分歧。
  - 趋势演进：2017–2023年主要复用通用强化学习和视频基准（Atari、CARL、NuScenes）；2024–2026年出现了专门的世界模型基准，增加了交互性、记忆和一致性压力测试，表明向诊断性评估的转变。
  - 开放问题：代理指标是否与下游决策效用对齐，如何确保基准在不同计算预算下的稳定性，以及任务分布是否覆盖真实世界的开放场景。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets (e.g., LoopNav in Minecraft,
        MIND with diverse scenes) that enable controlled, comparable evaluation of
        world model capabilities like spatial consistency, memory, and action control.
      what_remains_open: Whether the designed task distributions cover the open-ended
        real-world settings where world models are expected to assist, and whether
        the benchmarks support cross-domain generalization (e.g., from gaming to robotics).
    - line: Metric and stress-test design
      what_it_solves: Provides fine-grained probes beyond aggregate scores, such as
        the Scene Graph Consistency Score (SGCS) or memory-consistency and action-control
        metrics, to reveal weaknesses in temporal stability and context coherence.
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        decision utility that users care about; robustness of metrics to pixel-level
        variations and distribution shifts remains underexplored.
    - line: Comparable baselines and reporting
      what_it_solves: Establishes common baselines, artifacts, and reporting conventions
        (e.g., Atari 100k, NuScenes leaderboards with open code) that allow results
        from world model methods to be audited and compared under similar conditions.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and hyperparameter choices; strict reporting
        protocols for reproducibility are still lacking.
    consensus:
    - Evaluating world models requires moving beyond raw generation quality to test
      consistency, memory, and physical plausibility through controlled interactions
      or consistency checks.
    - Open datasets and code are critical for reproducible research, and most recent
      works release artifacts to enable direct comparison.
    - Standard benchmarks like Atari 100k and NuScenes serve as common ground for
      comparing method performance, but they are insufficient for diagnosing specific
      world model failures.
    disagreements:
    - 'Benchmark design differs in interaction mode: closed-loop action-driven evaluation
      (MIND) versus passive loop-based navigation consistency (LoopNav), reflecting
      different assumptions about what world models should preserve.'
    - 'Metric choice varies: some works rely on pixel-level reconstruction fidelity,
      while others propose semantic or scene-graph consistency scores, leading to
      different rankings of model quality.'
    - 'Domain and viewpoint settings diverge: first-person robotic and driving environments
      (RoboScape, MaskGWM) vs. third-person or open-world gaming (Minecraft, Atari),
      which influences the type of generalization tested.'
    - 'Supervision signals differ: some benchmarks assume full action labels, others
      rely on video-only inference or context observability, affecting which models
      can be fairly evaluated.'
    open_questions:
    - How to design a unified benchmark suite that covers the diverse capabilities
      of world models (spatial consistency, long-term memory, physical plausibility)
      without introducing domain-specific biases.
    - To what extent do current proxy metrics (e.g., SGCS, memory consistency scores)
      correlate with improvements in real-world downstream tasks such as robotic policy
      learning or autonomous driving decisions.
    - How can benchmark conclusions be made robust to variations in compute budget,
      model implementation, and hyperparameter tuning, given that most reports lack
      rigorous sensitivity analyses.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集（如Minecraft中的LoopNav、多场景的MIND），对世界模型的空间一致性、记忆和动作控制等能力进行受控且可比较的评估。
      尚未覆盖: 所设计的任务分布是否覆盖世界模型预期服务的开放真实场景，以及基准是否支持跨领域泛化（如从游戏到机器人）。
    - 路线: 指标与压力测试设计
      解决的问题: 提供超越总分数的细粒度探针，如场景图一致性分数（SGCS）或记忆一致性与动作控制指标，揭示时间稳定性和上下文连贯性方面的弱点。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策效用之间的一致性；指标对像素级变化和分布偏移的鲁棒性尚未充分探索。
    - 路线: 可比基线与报告规范
      解决的问题: 建立统一基线、工件和报告惯例（如Atari 100k、NuScenes排行榜及开源代码），使世界模型方法的结果在类似条件下可审计和比较。
      尚未覆盖: 基准结论在不同实现、计算预算和超参数选择下是否稳定；严格的可复现性报告协议仍然缺失。
    共识:
    - 评估世界模型需要超越原始生成质量，通过受控交互或一致性检查来测试一致性、记忆和物理合理性。
    - 开放数据集和代码对可复现研究至关重要，近期大多数工作都发布工件以实现直接比较。
    - Atari 100k和NuScenes等标准基准是方法性能比较的共同基础，但不足以诊断世界模型的具体失败模式。
    分歧:
    - 基准设计在交互模式上存在差异：闭环动作驱动评估（MIND）与被动循环导航一致性（LoopNav），反映了对世界模型应保留何种能力的假设不同。
    - 指标选择各异：一些工作依赖像素级重建保真度，另一些提出语义或场景图一致性分数，导致模型质量排序不同。
    - 领域和视角设定分化：第一人称机器人和驾驶环境（RoboScape、MaskGWM）与第三人称或开放世界游戏（Minecraft、Atari），影响所测试的泛化类型。
    - 监督信号不同：部分基准假设完整的动作标签，其他依赖纯视频推断或上下文可观性，影响哪些模型可被公平评估。
    开放问题:
    - 如何设计一个统一的基准套件，覆盖世界模型的多方面能力（空间一致性、长期记忆、物理合理性），同时不引入领域特定偏差。
    - 当前代理指标（如SGCS、记忆一致性分数）在多大程度上与真实下游任务（如机器人策略学习或自动驾驶决策）的改进相关。
    - 由于大多数报告缺乏严格的敏感性分析，如何使基准结论对计算预算、模型实现和超参数调优的变化具有鲁棒性。
