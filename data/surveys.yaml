  related_work_outline_zh:
  - 主流方向：面向自动驾驶、机器人操作和交互式游戏的世界模型应用，以视频生成和动作预测为核心。
  - 研究共性：采用扩散模型或Transformer作为骨干，在大规模视频数据上自监督训练，并利用学习到的模型进行规划或策略学习。
  - 关键差异：评估重点（视觉质量 vs. 任务成功率）、条件输入（语言、动作、物理先验）、交互模式（开环 vs. 闭环）以及部署的真实性。
  - 趋势演进：早期工作集中于Atari游戏（约2023年），随后扩展到机器人（2024年）和自动驾驶（2025年）；近期工作引入物理先验和统一视频-动作扩散，并出现针对记忆和空间一致性的专门基准（2025-2026年）。
  - 开放问题：真实世界泛化、长期记忆维持、跨域迁移以及基准性能与物理部署之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: adapting world models to concrete task domains with domain-specific
        states, actions, and constraints, such as robotic manipulation, by learning
        dynamics and generating video plans for policy learning.
      what_remains_open: whether improvements transfer across embodiments, datasets,
        institutions, or physical environments; generalization to unseen object combinations
        and real-world execution remains unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: using world models for scene prediction, closed-loop simulation,
        and policy evaluation in driving, enabling long-horizon and multi-view video
        prediction.
      what_remains_open: alignment between simulator gains and real-world safety or
        operational outcomes; cross-dataset zero-shot generalization and robustness
        to diverse driving conditions.
    - line: Interactive agents and games
      what_it_solves: grounding world models in interactive environments where agents
        must act over time, enabling efficient policy learning or evaluating spatial
        and memory consistency.
      what_remains_open: generalization when environment rules, goals, or user interactions
        change; long-term memory consistency and action control across varied action
        spaces; relevance of game benchmarks to real-world tasks.
    consensus:
    - World models are predominantly built on generative architectures like diffusion
      models or Transformers to predict future observations.
    - They are used as internal simulators to train policies or evaluate agent behavior
      in simulation.
    - Training often leverages self-supervised learning on video data, sometimes combined
      with action or language conditioning.
    - Evaluation is conducted on standard benchmarks (e.g., Atari, Nuscenes) or custom
      datasets, with limited real-world validation.
    disagreements:
    - 'Evaluation focus: some works prioritize visual fidelity and video quality metrics,
      while others optimize downstream task performance (e.g., game score, robot execution
      success).'
    - 'Conditioning modalities: models differ in whether they use only visual states,
      language instructions, action sequences, or explicit physics priors.'
    - 'Interaction mode: some evaluate in open-loop video prediction, while others
      require closed-loop interaction with action feedback.'
    - 'Deployment setting: most work is confined to simulation or curated datasets;
      evidence of physical robot deployment is sparse.'
    open_questions:
    - How do world model improvements in simulation translate to safety-critical real-world
      applications like autonomous driving or healthcare?
    - Can current world models maintain long-term memory consistency and physical
      plausibility over extended horizons?
    - What are the minimal benchmarks that reliably predict real-world task performance
      for embodied agents?
    - How to achieve compositional generalization to novel object-action combinations
      without retraining?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人等具有领域特定状态、动作和约束的任务中，通过学习动力学和生成视频计划来辅助策略学习。
      尚未覆盖: 改进是否跨本体、数据集、机构或物理环境迁移；对未见物体组合和真实执行的泛化能力尚未验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 将世界模型用于驾驶场景预测、闭环仿真和策略评测，实现长时域和多视角视频预测。
      尚未覆盖: 仿真收益与真实安全或运营结果之间的一致性；跨数据集零样本泛化及对多样驾驶条件的鲁棒性。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落到需要持续行动的交互环境中，实现高效策略学习或评估空间与记忆一致性。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化；长期记忆一致性和跨动作空间的控制能力；游戏基准对真实任务的适用性。
    共识:
    - 世界模型主要基于扩散模型或Transformer等生成式架构来预测未来观测。
    - 它们被用作内部模拟器，在仿真中训练策略或评估智能体行为。
    - 训练通常利用视频数据的自监督学习，有时结合动作或语言条件。
    - 评估在标准基准（如Atari、Nuscenes）或自定义数据集上进行，缺乏真实世界验证。
    分歧:
    - 评估重点：部分工作强调视觉保真度和视频质量指标，另一部分则优化下游任务表现（如游戏得分、机器人执行成功率）。
    - 条件模态：模型在仅使用视觉状态、语言指令、动作序列或显式物理先验方面存在差异。
    - 交互模式：有的在开环视频预测中评估，有的需要闭环交互与动作反馈。
    - 部署设置：多数工作局限于仿真或精选数据集，物理机器人部署的证据稀少。
    开放问题:
    - 世界模型在仿真中的改进如何转化为安全关键的自动驾驶或医疗等真实应用？
    - 当前世界模型能否在扩展时域内维持长期记忆一致性和物理合理性？
    - 哪些最小基准能可靠预测具身智能体在真实任务中的表现？
    - 如何在不重新训练的情况下实现对新颖物体-动作组合的组合泛化？
