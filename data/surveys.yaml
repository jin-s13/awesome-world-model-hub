  related_work_outline:
  - 'Mainstream direction: The packet labeled as theory is dominated by embodied world-model
    methods, especially action-conditioned video generative models for robot manipulation,
    with only one survey/theory taxonomy and one test-time verification study.'
  - 'Shared research pattern: Most works treat action-conditioned video prediction
    as a surrogate for environment dynamics and evaluate generated rollouts for planning,
    policy evaluation, synthetic data, or spatial reasoning.'
  - 'Key differences: Works differ in action-conditioning mechanisms, supervision
    signals, and evaluation targets, including unified video-action diffusion, frame-level
    conditioning modules, learned adapters, RL reward alignment, preference optimization,
    and benchmark-based physical plausibility.'
  - 'Trend evolution: From 2024 adaptation of pretrained video diffusion models to
    2025-2026 larger unified/heterogeneous world models with physics alignment and
    zero-shot benchmarking; the evidence is limited to the current frontier rather
    than a long historical arc.'
  - 'Open questions: Whether visual fidelity transfers to downstream policy success,
    whether formal guarantees or causal persistence can be established, and whether
    current benchmarks sufficiently isolate physical realism from surface quality
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：该理论标签下的证据主要由具身世界模型方法主导，尤其是用于机器人操作的动作条件视频生成模型；仅有少量概念分类和测试时验证研究。
  - 研究共性：多数工作将动作条件视频预测视为环境动力学代理，并评估生成轨迹在规划、策略评估、合成数据或空间推理中的作用。
  - 关键差异：动作条件注入机制、监督信号和评测目标不同，包括统一视频-动作扩散、帧级条件模块、学习适配器、强化学习奖励对齐、偏好优化及物理合理性基准。
  - 趋势演进：从2024年适配预训练视频扩散模型，到2025-2026年更大规模统一/异构世界模型与物理对齐和零样本评测；证据集中于当前前沿，历史跨度较小。
  - 开放问题：视觉保真度是否转化为下游策略成功、能否建立形式保证或因果持久性、当前基准是否足以区分物理真实性与表面质量仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative world models
      what_it_solves: Learning a shared model that can represent policy, forward dynamics,
        inverse dynamics, and video prediction from robot interaction data.
      what_remains_open: Evidence on out-of-domain generalization, formal guarantees,
        and limitations is often missing; some works lack sufficient comparison details
        or public artifacts.
    - line: Parameter-efficient adaptation of pretrained video diffusion
      what_it_solves: Turning pretrained or closed video generators into action-conditioned
        world models using limited domain data without full model access.
      what_remains_open: Assumes action-labeled domain videos are available; pretrained
        model biases and cross-domain transfer are not fully verified.
    - line: Physics and preference alignment of world-model rollouts
      what_it_solves: Improving physical plausibility, embodiment consistency, task
        logic, and visual quality through reward models or preference optimization.
      what_remains_open: Evaluation is concentrated on contact-rich manipulation;
        human preference collection is subjective and costly, and broader domain evidence
        is missing.
    - line: Test-time evaluation and verification of world-model reasoning
      what_it_solves: Assessing whether action-conditioned imagined trajectories and
        verifiers improve spatial reasoning under test-time scaling.
      what_remains_open: Verifier calibration and reward reliability are weak; gains
        do not transfer consistently across evaluation settings, indicating an information
        bottleneck.
    - line: Conceptual taxonomies of video generation as world models
      what_it_solves: Clarifying state construction and dynamics modeling gaps between
        video generators and classical world model theory.
      what_remains_open: No experimental validation is offered; whether the taxonomy
        changes evaluation or model design remains unknown.
    consensus:
    - Action-conditioned video generation is treated as a usable substitute for environment
      dynamics in embodied settings.
    - Physical realism and action-frame alignment are central quality dimensions,
      not only visual fidelity.
    - Pretrained generative models can be adapted or post-trained into world models
      but require additional conditioning or alignment.
    - Current evaluation reveals a gap between generation quality and reliable downstream
      reasoning or policy value.
    disagreements:
    - Action conditioning differs across coupled diffusion timesteps, frame-level
      modules, learned masks, and parallel context blocks.
    - Supervision differs across dynamics/action prediction, RL-based multidimensional
      rewards, and DPO-style preference optimization.
    - Evaluation targets differ across policy-simulator correlation, physical-plausibility
      benchmarks, and test-time spatial reasoning.
    - Architectural scale and design differ from unified video-action transformers
      to heterogeneous masked autoregression and large diffusion transformers.
    open_questions:
    - Does improved video generation fidelity reliably improve robot policy learning
      or planning outside reported benchmarks?
    - Can formal conditions or guarantees explain when a learned world model remains
      physically plausible and causally persistent over long horizons?
    - Do current benchmarks measure physical realism and action alignment independently,
      or do they reward surface-level fidelity?
    - How well do these models transfer across embodiments, tasks, and real-world
      domains when action-labeled or human preference data are scarce?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成世界模型
      解决的问题: 从机器人交互数据中学习可同时表示策略、前向动力学、逆向动力学和视频预测的共享模型。
      尚未覆盖: 常缺少域外泛化、形式保证和局限性说明；部分工作论证细节或公共工件不足。
    - 路线: 预训练视频扩散模型的参数高效适配
      解决的问题: 用少量领域数据将预训练或闭源视频生成器转换为动作条件世界模型，无需完整访问原模型。
      尚未覆盖: 依赖动作标注领域视频；预训练模型偏差和跨域迁移尚未充分验证。
    - 路线: 世界模型轨迹的物理与偏好对齐
      解决的问题: 通过奖励模型或偏好优化提升生成轨迹的物理合理性、具身一致性、任务逻辑和视觉质量。
      尚未覆盖: 评测集中在接触丰富操作任务；人类偏好收集主观且昂贵，跨域证据不足。
    - 路线: 世界模型推理的测试时评估与验证
      解决的问题: 检验动作条件想象轨迹和验证器在测试时缩放下是否改善空间推理。
      尚未覆盖: 验证器校准和奖励可靠性较差；改进未在不同评测环境一致迁移，显示信息瓶颈。
    - 路线: 视频生成作为世界模型的概念分类
      解决的问题: 澄清视频生成器与经典世界模型理论在状态构建和动态建模上的差距。
      尚未覆盖: 没有实验验证；分类法是否改变评测或模型设计仍未知。
    共识:
    - 动作条件视频生成被用作环境中动力学的可用替代品，以支持具身决策。
    - 物理合理性和动作-帧对齐被视作核心质量维度，而非仅视觉保真度。
    - 预训练生成模型可被适配或后训练为世界模型，但需要额外条件注入或对齐。
    - 现有评测显示生成质量与可靠下游推理或策略价值之间仍存在差距。
    分歧:
    - 动作条件注入方式不同：耦合扩散时间步、帧级模块、学习掩码或并行上下文块。
    - 监督方式不同：动力学/动作预测、强化学习多维奖励或DPO式偏好优化。
    - 评测目标不同：策略-模拟器相关性、物理合理性基准或测试时空间推理。
    - 模型架构和规模不同：从统一视频-动作Transformer到异构掩码自回归，再到大参数扩散Transformer。
    开放问题:
    - 改进的视频生成保真度是否能在已报告基准之外可靠转化为更好的机器人策略学习或规划成功？
    - 能否给出形式条件或保证，说明学到的世界模型在长时程下何时保持物理合理和因果持久？
    - 当前基准是否独立衡量物理真实性和动作对齐，还是会偏向表面保真度？
    - 当动作标注或人类偏好数据稀缺时，这些模型在实体、任务和真实域之间的迁移表现如何？
