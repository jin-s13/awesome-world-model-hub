  related_work_outline:
  - 'Mainstream direction: domain-specific generative world models dominate, including
    driving video prediction, robotic video synthesis and policy learning, and game/agent
    memory and action-control evaluation. Recent methods use diffusion transformers,
    contextual recurrent state-space models, or physics-informed auxiliary objectives,
    shifting from frame realism toward closed-loop controllability and long-horizon
    consistency.'
  - 'Shared research pattern: across domains, work encodes actions, instructions,
    or context into latent dynamics and trains on large video datasets. Evaluation
    increasingly targets spatial and temporal consistency, policy generalization,
    or task success rather than reconstruction quality alone.'
  - 'Key differences: supervision differs across mask reconstruction, physics auxiliary
    tasks, context conditioning, or joint action-video diffusion. Evaluation settings
    differ across game scores, navigation consistency, driving rollout fidelity, and
    simulated robot execution. Some work assumes observable context or seen language
    primitives; others target action-free or real-world transfer.'
  - 'Trend evolution: top-ranked evidence concentrates in 2023–2026, so the visible
    trend is within the current frontier: from single-environment game world models
    toward domain-scale pretraining, physics-informed generation, and dedicated consistency
    and action benchmarks for robotics, driving, and open-world agents.'
  - 'Open questions: whether simulator and video metrics align with real-world safety
    or operational outcomes, how to maintain memory over long horizons, how to generalize
    across action spaces or unseen primitives, and how to relax assumptions such as
    observable context and language parsing.'
  related_work_outline_zh:
  - 主流方向：领域特定的生成式世界模型主导，包括驾驶视频预测、机器人视频合成与策略学习、游戏/智能体记忆和动作控制评测。近期方法采用扩散Transformer、上下文循环状态空间模型或物理信息辅助目标，重心从单帧真实感转向闭环可控性和长时一致性。
  - 研究共性：跨领域都倾向于将动作、指令或上下文编码进潜在动态，并在大规模视频数据上训练；评测关注时空一致性、策略泛化或任务成功，而不只是重建质量。
  - 关键差异：差异体现在监督信号类型，如掩码重建、物理辅助任务、上下文条件化、动作-视频联合扩散，以及评测设置，如Atari得分、Minecraft导航一致性、驾驶长时rollout、仿真机器人执行。部分工作假设上下文可观测或语言原语已见；另一些面向无动作视频或真实迁移。
  - 趋势演进：排名证据集中在2023–2026，可见趋势处于当前前沿：从单环境游戏世界模型走向面向机器人、驾驶和开放世界的领域规模预训练、物理信息生成以及专门的记忆和动作一致性评测。
  - 开放问题：仿真与视频指标能否对应真实安全或运营结果；长时记忆一致性如何保持；如何跨动作空间或未见原语泛化；如何放宽上下文可观测、语言解析等假设。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving scene prediction and closed-loop simulation
      what_it_solves: Uses diffusion-based video models with mask reconstruction to
        predict long-horizon, multi-view driving scenes across datasets and validation
        settings.
      what_remains_open: Evidence covers Nuscenes, OpenDV-2K, and Waymo validation,
        but real-world driving safety or operational transfer is not established.
    - line: Embodied robot world models and video-action pretraining
      what_it_solves: Learns compositional, physics-informed, or unified video and
        action dynamics to generate robot plans, support policy training, and improve
        generalization.
      what_remains_open: Novel object-action primitives, sim-to-real execution, and
        broader real-robot deployment remain under-verified; some evaluations are
        simulation-only.
    - line: Contextual and stochastic world models for model-based reinforcement learning
      what_it_solves: Adds context conditioning or stochastic transformer-VAE dynamics
        to Dreamer-style models for zero-shot generalization and efficient game policy
        training.
      what_remains_open: Assumes observable context and is validated on limited tasks
        or game benchmarks; transfer to partially observed real dynamics is not shown.
    - line: Consistency and controllability evaluation in open-world agents
      what_it_solves: Constructs spatial-consistency, memory-consistency, and action-control
        evaluation protocols using loop navigation or revisited video sequences.
      what_remains_open: Current models still struggle with long-term memory consistency
        and cross-action-space generalization; evaluation completeness alone does
        not quantify closed-loop task success.
    consensus:
    - Application world models increasingly use large video datasets and generative
      sequence models to learn pixel-level dynamics conditioned on actions, instructions,
      or context.
    - Evaluation is moving toward closed-loop, long-horizon, and consistency-based
      criteria such as spatial coherence, memory, and action controllability rather
      than frame reconstruction alone.
    - Domain-specific auxiliary structure, such as depth, keypoint dynamics, language
      primitives, or context disentanglement, is used to improve generalization and
      physical plausibility.
    - 'There is a shared verification gap: strong benchmark or simulation performance
      is not yet matched by robust evidence of real-world operational utility.'
    disagreements:
    - 'Supervision differs: some methods use masked video reconstruction, others use
      physics-informed auxiliary tasks, observable context conditioning, or joint
      action-video diffusion.'
    - 'Evaluation targets differ: game performance scores, spatial consistency metrics,
      memory and action-control protocols, driving rollout fidelity, and simulated
      robot execution are used across works.'
    - 'Interaction assumptions differ: some models require action or instruction inputs,
      some use action-free video pretraining, and some assume observable context or
      predefined language primitives.'
    - 'Deployment evidence differs: results range from simulation-only robot execution
      to policy pretraining on large robot datasets, without a common real-world safety
      or transfer standard.'
    open_questions:
    - Do improvements in driving and robot video prediction transfer to real-world
      safety, task success, or operational outcomes rather than benchmark metrics?
    - How can world models maintain long-horizon memory and spatial consistency under
      viewpoint changes, revisits, and extended rollouts?
    - How can compositional robot world models handle entirely new primitives instead
      of only unseen combinations of training primitives?
    - How can context-conditioned or physics-informed models be extended to partially
      observed, non-stationary, or real-world deployment conditions?
    - What minimal evaluation protocols connect video fidelity, physical plausibility,
      action controllability, and downstream policy performance without relying on
      popularity or citation signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶场景预测与闭环仿真
      解决的问题: 结合扩散视频模型与掩码重建，预测长时域、多视角驾驶场景，并跨数据集泛化。
      尚未覆盖: 证据覆盖Nuscenes、OpenDV-2K和Waymo验证，但真实驾驶安全或运营迁移未验证。
    - 路线: 具身机器人世界模型与视频-动作预训练
      解决的问题: 学习组合式、物理信息或统一的视频/动作动力学，生成机器人计划并支持策略训练。
      尚未覆盖: 未见原语、仿真到真实执行及更广泛真实机器人部署仍未充分验证；部分评估仅在仿真中。
    - 路线: 上下文与随机世界模型用于基于模型的强化学习
      解决的问题: 在Dreamer式模型中加入上下文条件或随机Transformer-VAE动态，以提升零样本泛化和游戏策略训练效率。
      尚未覆盖: 假设上下文可观测，任务或游戏基准有限；向部分可观测真实动态的迁移未展示。
    - 路线: 开放世界智能体的一致性与可控性评测
      解决的问题: 通过循环导航或重复访问视频构造空间一致性、记忆一致性和动作控制评测协议。
      尚未覆盖: 现有模型在长期记忆一致性和跨动作空间泛化上仍困难；评测完备性也不等于闭环任务成功。
    共识:
    - 应用世界模型越来越多地使用大规模视频数据集和生成式序列模型，以动作、指令或上下文为条件学习像素级动态。
    - 评测正从单帧重建转向闭环、长时域和一致性标准，包括空间一致性、记忆和动作可控性。
    - 领域特定的辅助结构，如深度、关键点动力学、语言原语或上下文解耦，被用于提升泛化与物理合理性。
    - 存在共同验证缺口：基准或仿真表现突出，但真实世界运行效用的证据仍不充分。
    分歧:
    - 监督信号不同：掩码视频重建、物理信息辅助任务、可观测上下文条件化或动作-视频联合扩散。
    - 评测目标不同：游戏得分、空间一致性指标、记忆与动作控制协议、驾驶rollout保真度、仿真机器人执行等。
    - 交互假设不同：有些模型需要动作或指令输入，有些使用无动作视频预训练，有些假设上下文可观测或语言原语预定义。
    - 部署证据不同：从仅仿真机器人执行到大规模机器人数据策略预训练，缺乏统一的真实安全或迁移标准。
    开放问题:
    - 驾驶和机器人视频预测的改进能否迁移为真实安全、任务成功或运行结果，而非仅基准指标？
    - 世界模型如何在地点重访、视角变化和长时间 rollout 下保持记忆一致性与空间一致性？
    - 组合式机器人世界模型如何应对全新原语，而不只是训练原语的未见组合？
    - 如何把上下文条件或物理信息模型扩展到部分可观测、非平稳或真实部署环境？
    - 如何建立最小评测协议，连接视频保真度、物理合理性、动作可控性和下游策略性能？
