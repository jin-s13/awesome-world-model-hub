  related_work_outline:
  - 'Mainstream direction: Constructing action-conditioned video world models for
    embodied decision-making, primarily using diffusion transformers to generate future
    frames from robot observations and actions, enabling policy learning, planning,
    and evaluation.'
  - 'Shared research pattern: Frameworks replace or augment classical simulators by
    learning dynamics from offline interaction data, then applying the video rollouts
    to downstream tasks such as policy optimization or model-based planning.'
  - 'Key differences: Action injection mechanisms vary (unified diffusion, adapter,
    frame-level conditioning); alignment targets differ (visual fidelity, physical
    plausibility, task logic); training data scale spans from small domain-specific
    datasets to large multi-embodiment corpora.'
  - 'Trend evolution: Within 2024–2026, the focus shifted from adapting pretrained
    video models to building unified architectures, then toward aligning generated
    rollouts with physical realism and human preferences, and most recently toward
    diagnosing verification bottlenecks and proposing mechanistic taxonomies.'
  - 'Open questions: What formal guarantees should a video world model satisfy for
    reliable causal reasoning, how can we verify physical consistency without expensive
    human judgments, and why do test-time verifiers fail to scale on many benchmarks
    despite plausible imagery.'
  related_work_outline_zh:
  - 主流方向：构建动作条件化的视频世界模型用于具身决策，以扩散Transformer为主，从机器人观测和动作生成未来帧，支撑策略学习、规划与评估。
  - 研究共性：通过从离线交互数据学习动力学来替代或增强传统模拟器，再将视频轨迹用于下游任务，如策略优化或基于模型的规划。
  - 关键差异：动作注入机制不同（统一扩散、适配器、帧级条件）；对齐目标不同（视觉保真度、物理合理性、任务逻辑）；训练数据规模从小规模领域数据到大规模多本体语料。
  - 趋势演进：2024–2026年间，重心从适配预训练视频模型转向构建统一架构，再转向对齐物理真实性和人类偏好，最后转向诊断验证瓶颈并提出机制性分类法。
  - 开放问题：视频世界模型应满足哪些形式化保证才能支持可靠因果推理，如何在不依赖昂贵人类判断的情况下验证物理一致性，以及为何测试时验证器在诸多基准上无法随算力提升而持续改善。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video diffusion modeling
      what_it_solves: Jointly modeling actions and videos in a single architecture
        to flexibly represent policy, forward dynamics, inverse dynamics, and video
        generation, enabling pretraining on large-scale robot datasets.
      what_remains_open: Whether the assumed coupling between action and video modalities
        is optimal, and whether the unified representation transfers to unseen embodiments
        and contact-rich manipulation without fine-grained physical constraints.
    - line: Preference-based physical alignment of world models
      what_it_solves: Post-training world models with multi-dimensional reward models
        covering physical realism, task completion, and visual quality to make generated
        rollouts more aligned with human expectations and physical laws.
      what_remains_open: The subjective and costly nature of human preference collection,
        potential loss of behavioral diversity during alignment, and the lack of demonstrated
        generalization beyond manipulation tasks.
    - line: Diagnostic evaluation and test-time verification
      what_it_solves: Systematically probing world model capabilities (e.g., spatial
        reasoning) through test-time verifiers to uncover miscalibration, action biases,
        and information bottlenecks.
      what_remains_open: Why verifiers fail to scale on certain benchmarks, how to
        design verifiers that are robust across diverse reasoning tasks, and whether
        the identified bottlenecks are inherent to the generative architecture or
        the training data.
    - line: Mechanistic taxonomies bridging video generation and world models
      what_it_solves: Organizing fragmented approaches by state construction (implicit
        vs. explicit) and dynamics modeling (knowledge integration vs. architectural
        reformulation), while advocating functional benchmarks for persistence and
        causality.
      what_remains_open: The taxonomy has not been empirically validated through model
        design, and the proposed functional benchmarks remain aspirational; no concrete
        recipe is given for closing the gap between stateless video generation and
        classical world model theories.
    consensus:
    - Video generation models can serve as world models for embodied control by conditioning
      on actions and generating future observations.
    - Visual fidelity alone is insufficient; some form of physical plausibility, task
      consistency, or downstream utility must be evaluated.
    - Diffusion-based architectures are the dominant backbone, often combined with
      transformers for spatio-temporal modeling.
    disagreements:
    - 'Action-conditioning strategy: some integrate action and video diffusion into
      a unified process, others freeze a pretrained video model and inject actions
      via learned adapters or frame-level conditioning modules.'
    - 'Evaluation target: work prioritizes pixel-level video quality, while others
      emphasize physical plausibility, trajectory consistency, or policy performance
      improvement.'
    - 'Training data scale and supervision: some require large-scale multi-robot pretraining
      with paired actions, others operate with small domain-specific datasets, and
      a few exploit action-free video for further improvement.'
    - Whether explicit physical constraints or reward-based alignment is necessary,
      or whether scaling data and model size addresses physical plausibility implicitly.
    open_questions:
    - What formal conditions must a video world model satisfy to guarantee reliable
      causal reasoning and planning, and how can those conditions be empirically verified?
    - Current test-time verifiers exhibit poor calibration and fail to scale on benchmarks
      like MMSI-Bench; are the failures due to insufficient model capacity, inadequate
      training objectives, or a fundamental mismatch between generative video and
      symbolic reasoning?
    - How can we design automatic evaluation protocols that decouple physical realism,
      task logic, and visual quality without relying on costly human annotations?
    - The gap between stateless video generation models and classical state-space
      world models is widely acknowledged; what architectural or training innovations
      would endow these models with persistent state representations and causal dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频扩散建模
      解决的问题: 在单一架构中联合建模动作和视频，灵活表示策略、前向动力学、逆动力学和视频生成，实现大规模机器人预训练。
      尚未覆盖: 动作与视频模态的耦合假设是否最优，统一表示能否在未见过的本体和接触丰富的操作中泛化，缺乏细粒度物理约束。
    - 路线: 基于偏好的世界模型物理对齐
      解决的问题: 使用多维奖励模型（涵盖物理真实性、任务完成和视觉质量）对世界模型进行后训练，使生成轨迹更符合人类期望和物理规律。
      尚未覆盖: 人类偏好收集的主观性和成本，对齐过程中可能丧失行为多样性，未在操作任务之外验证泛化能力。
    - 路线: 诊断性评估与测试时验证
      解决的问题: 通过测试时验证器系统性地探测世界模型能力（如空间推理），揭示校准不良、动作偏差和信息瓶颈。
      尚未覆盖: 验证器为何在某些基准上无法扩展，如何设计跨任务鲁棒的验证器，所识别的瓶颈是生成架构固有缺陷还是训练数据不足所致。
    - 路线: 连接视频生成与世界模型的机制性分类法
      解决的问题: 通过状态构建（隐式/显式）和动态建模（知识整合/架构重构）组织碎片化方法，倡导面向持久性和因果性的功能基准。
      尚未覆盖: 分类法尚未通过模型设计进行实证验证，所倡导的功能基准仍属设想，未给出弥合无状态视频生成与经典世界模型理论差距的具体方法。
    共识:
    - 视频生成模型可通过动作条件化生成未来观测，充当具身控制的世界模型。
    - 仅靠视觉保真度不够，必须评估物理合理性、任务一致性或下游效用。
    - 扩散架构是主要骨干，常与Transformer结合用于时空建模。
    分歧:
    - 动作条件化策略：有的将动作和视频扩散统一在一个过程中，有的冻结预训练视频模型并通过学习适配器或帧级条件模块注入动作。
    - 评估目标：有的侧重像素级视频质量，有的强调物理合理性、轨迹一致性或策略性能提升。
    - 训练数据规模与监督：有的需要大规模多机器人配对动作预训练，有的仅需小规模领域数据集，少数利用无动作视频进一步提升。
    - 是否需要显式物理约束或基于奖励的对齐，还是通过扩大数据和模型规模隐式解决物理合理性。
    开放问题:
