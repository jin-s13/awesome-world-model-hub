  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is shifting from aggregate game
    scores toward multi-dimensional evaluation of memory, spatial consistency, and
    action controllability.'
  - 'Shared research pattern: Most works rely on standardized offline benchmarks (e.g.,
    Atari 100k, Nuscenes) to compare architectures, while acknowledging that current
    suites miss critical real-world capabilities.'
  - 'Key differences: Evaluation environments range from simple games to open-world
    settings; metrics diverge between pixel-level fidelity and semantic consistency;
    opinions differ on whether explicit physics injection is necessary.'
  - 'Trend evolution: Between 2023 and 2026, the field moved from Transformer/diffusion
    models dominating Atari to dedicated benchmarks for memory and spatial consistency,
    reflecting demand for holistic assessment.'
  - 'Open questions: The link between proxy metrics and downstream decision utility
    remains unverified; benchmark stability across implementations and compute budgets
    is unknown; long-horizon generalization is still unsolved.'
  related_work_outline_zh:
  - 主流方向：世界模型基准正从单一游戏得分转向对记忆、空间一致性和动作可控性的多维度评估。
  - 研究共性：多数工作依赖标准化离线基准（如 Atari 100k、Nuscenes）比较架构，同时承认现有测试套件遗漏了关键的真实世界能力。
  - 关键差异：评估环境从简单游戏延伸到开放世界；指标在像素级保真度与语义一致性之间分化；对是否需显式注入物理信息存在分歧。
  - 趋势演进：2023 至 2026 年间，领域从 Transformer/扩散模型刷新 Atari 记录，发展到出现专门针对记忆和空间一致性的新基准，反映对全面评估的追求。
  - 开放问题：代理指标与下游决策效用的关联尚未验证；不同实现和算力预算下基准结论的稳定性未知；长时域泛化仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and curated datasets that isolate specific
        capabilities like spatial consistency, memory, and action control, making
        world-model claims comparable beyond aggregate game scores.
      what_remains_open: Whether these synthetic task distributions transfer to real-world
        deployment settings where world models are expected to improve decision-making,
        such as robotics or autonomous driving.
    - line: Metric and stress-test design
      what_it_solves: Introducing evaluation metrics (e.g., scene graph consistency
        scores, memory consistency measures) and stress tests that probe temporal
        stability, controllability, and robustness, revealing failure modes hidden
        by pixel-level or average-score metrics.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decision quality that users actually care about; current metrics are validated
        on limited controlled videos, not in closed-loop policy learning.
    - line: Comparable baselines and reporting
      what_it_solves: Providing standardized benchmarks and reproducible training
        protocols to compare world-model architectures, revealing the importance of
        visual details and contextual information for sample efficiency and zero-shot
        generalization.
      what_remains_open: Benchmark conclusions may not be stable across different
        implementations, compute budgets, or evaluation protocols; over-reliance on
        a few game-based benchmarks may mask weaknesses in physical realism and long-term
        planning.
    consensus:
    - Better visual reconstruction quality, especially with diffusion models, correlates
      with higher downstream task performance, confirming that visual details matter
      for world models.
    - Existing popular benchmarks like Atari 100k primarily measure short-term game
      performance and fail to capture long-term memory, spatial consistency, and physical
      plausibility.
    - World-model architectures are evolving from discrete latent variable models
      to diffusion and Transformer-based models to achieve richer generation.
    - Evaluation should move beyond single-score aggregates to multi-dimensional capability
      tests that include memory, action control, and generalization.
    disagreements:
    - 'Evaluation environments differ sharply: some works use controlled, single-task
      games (Atari) or parametric variations (CARL), while others use open-world navigation
      (Minecraft) or real driving videos, leading to different demands on generalization.'
    - 'Metric definitions diverge: pixel-level fidelity metrics (FVD, PSNR) are still
      common, whereas newer benchmarks advocate semantic-level consistency scores;
      there is no agreement on which best captures world-model quality.'
    - Whether explicit physics knowledge (e.g., depth, keypoint dynamics) is necessary
      for world models, or whether purely data-driven visual dynamics are sufficient,
      remains disputed.
    - 'Evaluation modes conflict: open-loop video prediction metrics are not well
      aligned with closed-loop policy learning performance, making cross-study comparisons
      difficult.'
    open_questions:
    - How do world-model evaluation metrics correlate with downstream decision utility
      in real robotic tasks, given that current benchmarks are validated only on synthetic
      or video-only settings?
    - Are the reported benchmark rankings stable when implementations, compute budgets,
      and hyperparameter tuning protocols differ, particularly for diffusion-based
      models that require more resources?
    - Can current benchmarks reliably measure long-horizon memory consistency and
      cross-action-space generalization, which remain challenging for all existing
      models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和精心构建的数据集，隔离空间一致性、记忆和动作控制等特定能力，使世界模型主张在总分之外具备可比性。
      尚未覆盖: 这些合成任务分布是否能够迁移到真实环境的部署中，例如机器人或自动驾驶，在这些场景中世界模型应改善决策。
    - 路线: 指标与压力测试设计
      解决的问题: 引入评估指标（如场景图一致性分数、记忆一致性度量）和压力测试，探测时间稳定性、可控性和鲁棒性，揭示被像素级或平均分指标隐藏的失效模式。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策质量之间的对齐；当前指标仅在有限的可控视频上验证，而非在闭环策略学习中。
    - 路线: 可比基线与报告规范
      解决的问题: 提供标准化基准和可复现的训练协议，以比较世界模型架构，揭示视觉细节和上下文信息对样本效率和零样本泛化的重要性。
      尚未覆盖: 基准结论在不同实现、算力预算或评估协议下可能不稳定；过度依赖少数基于游戏的基准可能掩盖物理真实性和长期规划方面的弱点。
    共识:
    - 更好的视觉重建质量，尤其是扩散模型，与更高的下游任务性能相关，证实视觉细节对世界模型至关重要。
    - 现有的流行基准如 Atari 100k 主要衡量短期游戏性能，无法捕捉长期记忆、空间一致性和物理合理性。
    - 世界模型架构正从离散潜变量模型向扩散模型和 Transformer 模型演进，以生成更丰富的细节。
    - 评估应从单一分数聚合转向包含记忆、动作控制和泛化能力的多维度能力测试。
    分歧:
    - 评估环境选择差异显著：部分工作使用控制环境下的单任务游戏（Atari）或参数变化（CARL），而其他工作使用开放世界导航（Minecraft）或真实驾驶视频，对泛化能力提出不同要求。
    - 指标定义分化：像素级保真度指标（FVD、PSNR）仍被广泛使用，而新基准提倡语义级一致性分数；对哪种最能捕捉世界模型质量尚无共识。
    - 是否需要显式注入物理知识（例如深度、关键点动力学）来构建世界模型，还是完全依赖数据驱动的视觉动力学，仍然存在争议。
    - 评估模式冲突：开环视频预测指标与闭环策略学习性能之间缺乏良好对齐，导致跨研究比较困难。
    开放问题:
    - 在当前基准仅于合成或纯视频设定下验证的情况下，世界模型评估指标与真实机器人任务中下游决策效用的关联性如何？
    - 当实现细节、算力预算和超参数调优协议不同时，尤其是在扩散模型等需要更多资源的方法上，所报告的基准排名是否稳定？
    - 现有基准能否可靠地衡量长时域记忆一致性和跨动作空间泛化，这些对所有现有模型仍具挑战？
