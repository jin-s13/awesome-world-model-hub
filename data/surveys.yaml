    conditioned on actions, language, context, or physics signals.'
  - 'Shared research pattern: Most papers learn a predictive model from visual and
    action data in an interactive environment, then evaluate it for prediction quality,
    policy learning, or diagnostic capabilities.'
  - 'Key differences: They differ by target domain and supervision: driving multi-view
    rollout, robot task execution, game navigation; some use context or language factorization,
    others physics auxiliaries or benchmark consistency scores.'
  - 'Trend evolution: Although the topic spans 2015–2026, top evidence clusters in
    2023–2026. The visible trend moves from sample-efficient model-based RL toward
    large generative/diffusion world models and benchmarks for memory and action control.'
  - 'Open questions: Evidence gaps remain on cross-embodiment, cross-dataset, and
    simulation-to-real transfer; visible gains are often limited to simulation or
    specific benchmark tasks.'
  related_work_outline_zh:
  - 主流方向：应用特定的世界建模，尤其是机器人和驾驶，使用以动作、语言、上下文或物理信号为条件的扩散或Transformer视频生成。
  - 研究共性：多数工作从视觉和动作数据中学习预测模型，并在预测质量、策略学习或诊断能力方面进行评估。
  - 关键差异：目标领域和监督信号不同：驾驶多视角推演、机器人任务执行、游戏导航；有的使用上下文或语言分解，有的使用物理辅助或基准一致性评分。
  - 趋势演进：虽然该主题覆盖2015–2026年，但高排名证据集中在2023–2026年，可见趋势处于当前前沿：从高效基于模型的强化学习转向大规模生成式/扩散世界模型及记忆与动作控制基准。
  - 开放问题：跨本体、跨数据集和仿真到真实迁移仍存在证据缺口；可见收益往往限于仿真或特定基准任务。
  literature_review:
    line_of_work_matrix:
    - line: Task-conditioned robotic video world models
      what_it_solves: Generating action/instruction-conditioned robot videos for imagination,
        policy learning, and dynamics modeling across robot datasets.
      what_remains_open: Transfer to real-robot execution, novel task primitives,
        and embodiments beyond the training distribution is not established.
    - line: Physics-informed embodied world models
      what_it_solves: Improving physical plausibility and motion quality of generated
        robot videos by jointly learning RGB generation with depth and keypoint dynamics.
      what_remains_open: Cross-embodiment and cross-dataset transfer of physics representations
        is not shown.
    - line: Driving scene prediction and multi-view simulation
      what_it_solves: Long-horizon, multi-view driving video prediction and zero-shot
        evaluation across driving datasets.
      what_remains_open: Whether improved validation metrics transfer to closed-loop
        safety or operational outcomes is unverified.
    - line: Sample-efficient visual RL and contextual world models
      what_it_solves: Learning efficient latent or world models for visual control
        and zero-shot generalization under observable context.
      what_remains_open: Evaluation is limited to Atari or two CARL tasks and assumes
        observable context; broader dynamics generalization remains open.
    - line: Interactive game and open-domain world-model diagnostics
      what_it_solves: Benchmarking spatial consistency, memory, and action control
        in navigation-style and open-domain interactive settings.
      what_remains_open: Generalization under changing environment rules, goals, or
        user interactions is not directly addressed.
    consensus:
    - World models are applied as predictive video or latent-dynamics models conditioned
      on actions, instructions, context, or physics cues.
    - 'Evaluation is usually domain-specific: sample efficiency on visual control,
      long-horizon driving rollout, robot video realism or execution, and interactive
      benchmark metrics for memory and action control.'
    - Generated rollouts or videos are treated as a resource for downstream policy
      learning or policy evaluation across robotics, driving, and game-like settings.
    disagreements:
    - 'Representation choices differ: recurrent state-space latent dynamics, diffusion
      transformers, VAE-transformer hybrids, and unified diffusion over video and
      actions.'
    - 'Supervisory signals differ: observable context values, language-derived primitives,
      physics auxiliaries such as depth and keypoint dynamics, and memory/action-consistency
      scores.'
    - 'Evaluation targets and deployment assumptions differ: simulated robot execution
      versus real-robot transfer, multi-view driving generalization versus closed-loop
      safety, and benchmark completeness versus task-level control.'
    open_questions:
    - Do current simulation and benchmark improvements transfer to real robots, vehicles,
      or safety-critical deployments?
    - Can world models handle unseen dynamics, new task primitives, or environment
      rule changes without observed context or explicit retraining?
    - What standardized metrics can compare memory consistency, action control, and
      physical plausibility across driving, robotics, and game domains?
