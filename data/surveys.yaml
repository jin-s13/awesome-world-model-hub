  related_work_outline:
  - 'Mainstream direction: Generative video world models conditioned on actions, language,
    context, or physics inputs dominate domain applications, with robotics and driving
    as the strongest clusters and consistency benchmarks emerging.'
  - 'Shared research pattern: Most works train transformer/diffusion world models
    on domain interaction or video data, then reuse imagined videos or latent trajectories
    for policy learning, planning, or evaluation.'
  - 'Key differences: They split along supervision and evaluation targets: action-conditioned
    driving video prediction, language-primed robot video generation, physics-informed
    dynamics, contextual RL dynamics, game score efficiency, and memory/action-control
    benchmarks.'
  - 'Trend evolution: From 2023 efficient transformer-based RL world models in games
    to 2024-2025 embodied robot and driving video models, shifting toward 2025-2026
    benchmark-defined consistency, memory, and cross-action generalization.'
  - 'Open questions: Real-world deployment transfer, long-term memory, action-space
    and embodiment generalization, unobservable context, and missing domain evidence
    such as healthcare or scientific simulation remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以动作、语言、上下文或物理信息为条件的生成式视频世界模型主导领域应用，机器人和驾驶是最强集群，一致性基准开始出现。
  - 研究共性：多数工作用Transformer或扩散世界模型在领域交互或视频数据上训练，再把想象视频或潜在轨迹用于策略学习、规划或评测。
  - 关键差异：监督信号和评测目标分化，包括动作条件驾驶视频预测、语言原语机器人视频生成、物理信息动力学、上下文强化学习、游戏得分效率，以及记忆与动作控制基准。
  - 趋势演进：从2023年游戏中的高效Transformer世界模型，到2024-2025年具身机器人与驾驶视频模型，再转向2025-2026年基准定义的一致性、记忆和跨动作泛化。
  - 开放问题：真实部署迁移、长期记忆、动作空间与本体的泛化、不可观测上下文，以及医疗和科学仿真等应用证据缺失仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapts world models to robot manipulation, contextual control,
        and physically plausible video generation by conditioning on language primitives,
        observed context, actions, or physics cues and using imagined trajectories
        for policy learning.
      what_remains_open: Evidence is limited to simulation or seen primitive combinations;
        cross-embodiment, cross-dataset, and real-robot transfer are not demonstrated,
        and some methods assume observable context variables.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Provides long-horizon and multi-view scene prediction for driving
        by combining diffusion transformers with mask reconstruction, evaluated on
        normal, long-horizon, and zero-shot driving settings.
      what_remains_open: The packet does not establish alignment between improved
        driving video prediction and real-world safety, closed-loop planning, or operational
        outcomes.
    - line: Interactive agents and games
      what_it_solves: Grounds world models in action-driven environments and benchmarks
        interaction consistency, using stochastic transformer dynamics for efficient
        Atari learning, loop-based Minecraft navigation, and open-domain action-control
        scenes.
      what_remains_open: Generalization to changing environment rules, goals, or action
        spaces is untested; current models struggle with long-term memory consistency
        and cross-action-space generalization.
    consensus:
    - Recent work treats world models as generative simulators for domain-specific
      interaction, using video generation or latent imagination conditioned on actions,
      language, context, or physics.
    - 'There is shared emphasis on downstream usefulness: predicted videos or imagined
      trajectories support policy learning, planning, or policy evaluation rather
      than only generation quality.'
    - Transformer and diffusion architectures are common, with training on large interaction,
      navigation, or driving video datasets.
    - 'Evaluation has become more explicit about robustness variations: long-horizon,
      zero-shot, unseen goals, loop consistency, memory consistency, and action controllability.'
    disagreements:
    - 'Representation and supervision differ: pixel-space video diffusion for driving
      or robot generation, stochastic latent state-space dynamics for game RL, context-conditioned
      latent dynamics, and physics-informed auxiliary losses.'
    - 'Evaluation targets diverge: driving scene quality, robot task generalization,
      game score efficiency, spatial consistency in Minecraft, and memory/action control
      in open-domain scenes.'
    - 'Interaction mode differs: some condition generation on actions or language
      for planning; others roll out policies inside learned models; benchmarks often
      evaluate world-model consistency without training a policy.'
    - 'Generalization evidence is not uniform: zero-shot driving datasets, unseen
      robot goals or primitive combinations, zero-shot contextual dynamics, and varied
      action spaces are each tested in isolation.'
    open_questions:
    - Do improvements in driving or robot video prediction transfer to safer physical
      deployment and more reliable closed-loop control?
    - Can world models maintain long-term memory consistency and action control across
      different action spaces, scenes, and embodiments?
    - How sensitive are current results to assumptions such as observable context,
      predefined language primitives, or fixed evaluation datasets?
    - What evidence would connect simulation-based policy training or evaluation gains
      to real-world operational outcomes?
    - Which domain applications beyond driving, robotics, and games, especially healthcare
      and scientific simulation, are missing from the current evidence packet?
    - For papers with no visible limitation text or incomplete reproduction links,
      how do unreported failure modes and verification gaps affect cross-institution
      replication?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人操作、上下文控制和物理合理视频生成，通过语言原语、可观测上下文、动作或物理线索进行条件化，并用想象轨迹支持策略学习。
      尚未覆盖: 可见证据主要限于仿真或已见原语组合；跨本体、跨数据集和真机迁移尚未展示，部分方法假设上下文变量可观测。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 通过扩散Transformer与掩码重建，为驾驶提供长时域和多视角场景预测，并在常规、长时域和零样本驾驶设置下评测。
      尚未覆盖: 证据没有建立驾驶视频预测改善与真实安全、闭环规划或运营结果之间的一致性。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型落地到动作驱动的交互环境，使用随机Transformer动力学进行高效Atari学习，并通过循环导航和开放域动作控制基准评估空间与记忆一致性。
      尚未覆盖: 环境规则、目标或动作空间变化时的泛化未验证；当前模型在长期记忆一致性和跨动作空间泛化上仍存在问题，游戏得分提升不等同于跨基准迁移。
    共识:
    - 近期研究将世界模型视为面向领域交互的生成式仿真器，通过以动作、语言、上下文或物理为条件的视频生成或潜在想象进行建模。
    - 共同强调下游可用性：预测视频或想象轨迹用于策略学习、规划或策略评测，而不仅是生成质量。
    - Transformer与扩散架构较为常见，并在大规模交互、导航或驾驶视频数据上训练。
    - 评测越来越显式地关注鲁棒性变化，包括长时域、零样本、未见目标、循环一致性、记忆一致性和动作可控性。
    分歧:
    - 表示与监督信号不同：驾驶或机器人中使用像素空间视频扩散，游戏强化学习中使用随机潜在状态空间，上下文强化学习使用可观测上下文条件，还有物理信息辅助损失。
    - 评测目标分化：驾驶场景质量、机器人任务泛化、游戏得分效率、Minecraft空间一致性，以及开放域场景中的记忆与动作控制。
    - 交互模式不同：有的以动作或语言为条件生成视频用于规划，有的在学到的模型内展开策略，有的基准只评测世界模型一致性而不训练策略。
    - 泛化证据不统一：驾驶数据集零样本、机器人未见目标或原语组合、上下文零样本、不同动作空间分别在单独设定下测试，缺少统一跨域证据。
    开放问题:
    - 驾驶或机器人视频预测的改善能否转化为更安全的物理部署和更可靠的闭环控制？
    - 世界模型能否在不同动作空间、场景和本体之间保持长期记忆一致性与动作控制？
