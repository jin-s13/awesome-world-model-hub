  related_work_outline:
  - 'Mainstream direction: Scaling diffusion-based or transformer-based world models
    to embodied tasks (robotics, driving) and interactive games, focusing on video
    prediction, policy learning, and multi-task generalization.'
  - 'Shared research pattern: Learning environment dynamics via generative architectures,
    improving agent generalization through imagined trajectories or video plans, and
    evaluating on simulation benchmarks.'
  - 'Key differences: Representation form (diffusion vs. recurrent state-space), use
    of explicit physics priors, interaction mode (end-to-end policy vs. plan-only
    generation), and evaluation metrics (game scores vs. spatial/memory consistency).'
  - 'Trend evolution: Expansion from Atari games to embodied AI and driving (2023–2025),
    with growing emphasis on physical plausibility and long-term consistency, and
    evaluation shifting from single-task performance to multi-dimensional reliability.'
  - 'Open questions: Real-world transfer, cross-embodiment generalization, integration
    of physics with data-driven models, and long-term closed-loop consistency remain
    unverified.'
  related_work_outline_zh:
  - 主流方向：将基于扩散模型或Transformer的世界模型扩展到具身任务（机器人、驾驶）和交互式游戏，强调视频预测、策略学习和多任务泛化。
  - 研究共性：通过生成式架构学习环境动态，利用想象轨迹或视频规划提升智能体泛化能力，并在仿真基准上评估。
  - 关键差异：表示形式（扩散模型与循环状态空间模型）、是否引入显式物理先验、交互模式（端到端策略与纯规划生成）和评测指标（游戏得分与空间/记忆一致性）各不相同。
  - 趋势演进：从Atari游戏向具身智能和驾驶领域扩展（2023–2025），越来越关注物理合理性和长期一致性，评测从单一任务性能转向多维度可靠性。
  - 开放问题：真实世界迁移、跨本体泛化、物理知识与数据驱动模型的结合，以及长期闭环一致性尚未得到验证。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to domain-specific tasks with embodied
        states, actions, and physical constraints; enabling policy learning, compositional
        imagination, and multi-task generalization from video and action data.
      what_remains_open: Cross-embodiment and sim-to-real transfer, physical property
        generalization beyond training, and reliance on pre-defined primitives for
        compositional generalization.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Using world models for long-horizon, multi-view scene prediction,
        and zero-shot generalization across driving datasets, supporting closed-loop
        simulation and policy evaluation.
      what_remains_open: Alignment between simulation gains and real-world safety/operational
        outcomes, generalization to extreme or rare scenarios, and integration with
        production driving stacks.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments to learn
        policies, evaluate spatial consistency, and measure memory and action control
        in open-domain navigation and game tasks.
      what_remains_open: Generalization when environment rules, goals, or user interactions
        change; long-term memory consistency; scalability from simple games to open-world
        tasks.
    consensus:
    - World models are shifting from simple game environments to embodied AI and driving
      domains, with diffusion models and transformers becoming the dominant generative
      architectures.
    - Most approaches train world models via self-supervised video prediction, latent
      state reconstruction, or action prediction, and use imagined data to improve
      policy learning.
    - Evaluation relies heavily on simulation benchmarks; real-world deployment validation
      is largely absent.
    - Recent work is beginning to incorporate physical consistency, spatial awareness,
      and long-term memory into world models, but evaluation metrics remain fragmented.
    disagreements:
    - 'Representation choices differ: some adopt diffusion-based video generation
      (MaskGWM, RoboDreamer, UWM) while others use recurrent state-space models (cRSSM)
      or transformer-VAE hybrids (STORM).'
    - Explicit physics priors are used in RoboScape (depth and keypoint dynamics)
      but absent in most other data-driven approaches.
    - 'Interaction modes vary: UWM and cRSSM integrate policy learning within the
      world model, whereas RoboDreamer generates video plans with separate policy
      execution.'
    - 'Evaluation targets diverge: STORM optimizes game scores, MaskGWM focuses on
      video quality, while LoopNav and MIND introduce spatial and memory consistency
      metrics.'
    open_questions:
    - How can physics-informed world models be combined with large-scale pretraining
      to achieve cross-embodiment and real-world generalization?
    - What is the relationship between simulation-based improvements and actual safety
      or reliability in physical driving and robotics tasks?
    - How can world models maintain long-term memory consistency and generalize across
      varied action spaces in open-domain interactions?
    - Can compositional generalization be achieved without relying on manually defined
      primitives, and instead automatically discover composable units?
    - How to build a unified evaluation framework that fairly compares world models
      across visual fidelity, physical plausibility, policy benefit, and long-term
      consistency?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到具有具身状态、动作和物理约束的领域任务；支持策略学习、组合想象和从视频与动作数据中实现多任务泛化。
      尚未覆盖: 跨本体和仿真到真实的迁移，训练分布之外的物理属性泛化，以及组合泛化对预定义原语的依赖。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用世界模型进行长时域、多视角场景预测，并实现跨驾驶数据集的零样本泛化，支持闭环仿真和策略评估。
      尚未覆盖: 仿真收益与真实安全/运营结果之间的对应关系，对极端或罕见场景的泛化，以及与现有驾驶系统的集成。
    - 路线: 交互式智能体与游戏
      解决的问题: 在交互式环境中落地世界模型，用于学习策略、评估空间一致性，并衡量开放域导航和游戏任务中的记忆与动作控制。
      尚未覆盖: 环境规则、目标或用户交互变化时的泛化；长期记忆一致性；从简单游戏到开放世界任务的可扩展性。
    共识:
    - 世界模型正从简单游戏环境向具身智能和驾驶领域扩展，扩散模型和Transformer成为主导的生成式架构。
    - 多数方法通过视频预测、潜在状态重建或动作预测进行自监督训练，并利用想象数据改进策略学习。
    - 评估严重依赖仿真基准，真实世界部署的验证普遍缺失。
    - 近期工作开始将物理一致性、空间感知和长期记忆纳入世界模型，但评测指标仍不统一。
    分歧:
    - 表示方式不同：部分采用基于扩散的视频生成（MaskGWM、RoboDreamer、UWM），另一些使用循环状态空间模型（cRSSM）或Transformer与VAE的混合架构（STORM）。
    - RoboScape显式引入深度和关键点动力学等物理先验，而其他多数方法仅依赖数据驱动。
    - 交互模式各异：UWM和cRSSM将策略学习集成在世界模型内部，而RoboDreamer仅生成视频规划，策略执行与模型分离。
    - 评测目标差异显著：STORM追求游戏得分，MaskGWM关注视频质量，而LoopNav和MIND提出空间一致性和记忆一致性等新指标。
    开放问题:
    - 如何将物理信息驱动与世界模型的大规模预训练相结合，实现跨本体和真实世界的泛化？
    - 仿真性能的提升与物理驾驶或机器人操作中的实际安全性和可靠性之间存在何种关系？
    - 世界模型如何在开放域交互中保持长期记忆一致性，并泛化到不同的动作空间？
