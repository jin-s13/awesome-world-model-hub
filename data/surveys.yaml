  literature_review:
    line_of_work_matrix:
    - line: Action-conditional simulation and world-model pipelines
      what_it_solves: Turns action, trajectory, or control inputs into future video
        and state rollouts for driving and robotics evaluation, reducing reliance
        on costly real-world interaction.
      what_remains_open: Long-horizon consistency and generalization beyond nuScenes,
        CARL, or constrained robot setups are not fully verified; failure conditions
        are rarely reported.
    - line: Real-time and closed-loop generation serving
      what_it_solves: Aims to meet interactivity constraints for closed-loop simulation
        by optimizing autoregressive or diffusion inference and maintaining multi-view/temporal
        coherence.
      what_remains_open: Multi-GPU or complex-scene scalability, extreme distribution
        shift, and sub-second latency claims are only partially evidenced on limited
        datasets.
    - line: Benchmark and artifact construction for world-model evaluation
      what_it_solves: Provides datasets, scoring functions, and open frameworks to
        quantify spatial consistency, action fidelity, or downstream policy benefit.
      what_remains_open: Independent cross-team reproduction, broader baseline comparison,
        and deployment-time metric transfer remain open; some metadata and limitation
        fields are absent.
    - line: Cross-embodiment and latent action interfaces
      what_it_solves: Uses shared latent action representations to pretrain or adapt
        world models across human, robot, and simulation data without common native
        action spaces.
      what_remains_open: Evidence is limited to selected robot platforms and benchmark
        tasks; artifact availability is weaker and real-world generalization is not
        fully established.
    consensus:
    - World models here are primarily action- or control-conditional future predictors
      rather than unconditioned generative models.
    - Evaluation increasingly combines visual quality with control-level or downstream
      signals such as action fidelity, spatial consistency, policy success, or closed-loop
      rollouts.
    - Open datasets and benchmark frameworks are seen as central for reproducible
      comparison in driving, navigation, and manipulation settings.
    - Large-scale pretraining or post-training on trajectory-annotated video is a
      common route to improve generation and downstream policy usefulness.
    disagreements:
    - 'Representation choices differ: some use latent recurrent state-space dynamics,
      others use diffusion-based or frame-level autoregressive video generation.'
    - 'Supervision differs: explicit observable context, physical auxiliary tasks,
      trajectory-based action control, and universal latent action conditioning represent
      distinct inductive biases.'
    - 'Evaluation targets differ: spatial consistency, zero-shot generalization, action
      fidelity, visual fidelity, and real-robot policy success are weighted differently
      across papers.'
    - 'Deployment orientation differs: some systems optimize single-GPU or closed-loop
      latency, while others prioritize benchmark comparisons or synthetic data generation.'
    open_questions:
    - How well do current action-fidelity and spatial-consistency metrics transfer
      to unseen sensor layouts, environments, dynamics, and robot embodiments?
    - What mechanisms best maintain geometric and temporal consistency over long rollouts
      under iterative self-conditioning, and where exactly do current systems degrade?
    - What is the minimal context or action representation needed for robust generalization
      when context is partially observed or cross-embodiment data is noisy?
    - Independent reproduction across teams and infrastructure remains a verification
      gap, especially where code or dataset availability signals are weak or absent.
    - Missing limitation evidence across several top systems prevents clear comparison
      of failure modes, compute costs, and safe deployment boundaries.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件模拟与世界模型流水线
      解决的问题: 将动作、轨迹或控制输入转化为未来视频和状态推演，用于驾驶与机器人评测，减少对高成本真实交互的依赖。
      尚未覆盖: 在nuScenes、CARL或受限机器人设置之外的长时程一致性与泛化尚未充分验证，失败条件也较少报告。
    - 路线: 实时与闭环生成服务
      解决的问题: 通过优化自回归或扩散推理并保持多视图/时序一致性，满足闭环仿真中的交互延迟需求。
      尚未覆盖: 多GPU或复杂场景可扩展性、极端分布偏移以及亚秒级延迟声明在有限数据集上仅有部分证据。
    - 路线: 世界模型评测基准与工件构建
      解决的问题: 通过数据集、评分函数和开放框架量化空间一致性、动作忠实度或下游策略收益。
      尚未覆盖: 跨团队独立复现、更广基线比较和部署期指标迁移仍不明确；部分元数据和局限性字段缺失。
    - 路线: 跨具身与潜在动作接口
      解决的问题: 用共享潜在动作表示在人类、机器人和仿真数据上预训练或适配世界模型，避免依赖相同原生动作空间。
      尚未覆盖: 证据集中在少量机器人平台和基准任务，工件可得性较弱，真实世界泛化尚未完全确立。
    共识:
    - 该主题中的世界模型主要作为动作或控制条件的未来预测器，而非无条件生成模型。
    - 评测日益结合视觉质量与控制级或下游信号，如动作忠实度、空间一致性、策略成功率或闭环推演。
    - 开放数据集和基准框架被视为在驾驶、导航和操作场景中实现可复现比较的关键组件。
    - 在带轨迹标注的视频上进行大规模预训练或后训练，是提升生成质量与下游策略实用性的常见路线。
    分歧:
    - 表示选择不同：有的使用潜在循环状态空间动力学，有的使用扩散式或帧级自回归视频生成。
    - 监督信号不同：显式可观测上下文、物理辅助任务、基于轨迹的动作控制与通用潜在动作条件化分别体现不同归纳偏置。
    - 评测目标不同：空间一致性、零样本泛化、动作忠实度、视觉保真度和真机策略成功率的权重不一致。
    - 部署导向不同：有的系统优化单GPU或闭环延迟，有的更关注基准对比或合成数据生成。
    开放问题:
    - 当前动作忠实度和空间一致性指标在未知传感器布局、环境、动力学和机器人具身上的迁移能力如何？
    - 在迭代自条件下，什么机制能最有效地维持长时程几何与时间一致性，现有系统究竟在哪些阶段退化？
    - 当上下文部分可观测或跨具身数据存在噪声时，鲁棒泛化所需的最小上下文或动作表示是什么？
    - 跨团队和基础设施的独立复现仍是验证缺口，尤其当代码、数据集或工件可得性信号较弱或缺失时。
    - 若干系统缺失局限性证据，难以比较失败模式、计算成本和安全部署边界。
