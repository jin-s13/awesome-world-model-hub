  - 研究共性：将生成式视频或循环状态空间模型与显式控制信号、物理信息损失或基准指标结合，以提升动作忠实度、空间一致性及下游策略效用。
  - 关键差异：评测目标不同，包括空间一致性、动作忠实度、视觉质量、零样本策略泛化；领域覆盖 Minecraft、CARL、nuScenes 与机器人视频；交互模式涵盖离线生成、闭环自回归推演和基于模型的强化学习想象。
  - 趋势演进：高相关证据集中在 2024-2026 年，显示前沿正从通用世界模型转向可部署、可评测、动作可控且物理信息驱动的模拟栈；更早年份证据较少。
  - 开放问题：长时一致性、跨领域指标有效性、低延迟服务与视觉保真度权衡、独立可复现性仍是验证缺口；部分论文缺少完整局限或工件证据。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable and physics-informed world model systems
      what_it_solves: Generating future video frames conditioned on actions, trajectories,
        or context for driving and robotics simulation; improving action fidelity,
        physical plausibility, and zero-shot policy transfer.
      what_remains_open: Generalization across environments and sensor configurations,
        long-horizon autoregressive consistency, and trade-offs between dynamic transition
        accuracy and fine-grained visual detail remain only partially validated.
    - line: Benchmarking and evaluation artifacts for world-model consistency
      what_it_solves: Providing datasets, metrics, and open evaluation frameworks
        for spatial consistency and action fidelity in open-world and driving settings.
      what_remains_open: Evidence is concentrated in specific domains such as Minecraft
        and nuScenes; cross-domain validity of consistency metrics and their downstream
        utility are not established, and some artifacts lack reported baseline results.
    - line: Contextual model-based reinforcement learning stacks
      what_it_solves: Turning an existing world model such as Dreamer v3 into a context-conditioned
        simulator to improve zero-shot generalization in contextual reinforcement
        learning.
      what_remains_open: Assumes observable context values and is evaluated on only
        two CARL tasks, so performance under partially observed or more varied dynamics
        is unresolved.
    - line: Systematic interactive world modeling frameworks
      what_it_solves: Organizing application scenarios, technical challenges, benchmarks,
        and future directions across open-world exploration, game engines, autonomous
        driving, and robotics.
      what_remains_open: Survey coverage may lag rapid development; challenge and
        trend claims are based on current evidence and not empirically validated across
        all settings.
    consensus:
    - World models are treated as simulation infrastructure rather than standalone
      generative models, aimed at policy training, policy evaluation, and closed-loop
      rollout.
    - Action conditioning is a shared mechanism, though implementations vary widely.
    - Benchmarks and metrics are recognized as necessary because visual quality alone
      does not guarantee spatial or action consistency.
    - Real-time or low-latency deployment and long-horizon consistency are recurring
      system requirements.
    - Open-sourcing of code, data, or benchmarks is common but not always accompanied
      by complete evaluation or limitation evidence.
    disagreements:
    - 'Representation: some systems use scene graph consistency scores, while others
      use latent replacement or multi-view diffusion transformers.'
    - 'Supervision signal: some rely on physics-informed auxiliary tasks such as depth
      and keypoint dynamics, while others use explicit action-conditioned modules
      or context-conditioned latent dynamics.'
    - 'Evaluation target: works prioritize different outcomes including spatial consistency,
      action fidelity, visual fidelity, or zero-shot policy generalization.'
    - 'Interaction mode: systems operate in offline benchmark evaluation, closed-loop
      autoregressive rollout, or model-based reinforcement learning imagination.'
    - 'Deployment setting: evidence spans open-world navigation in Minecraft, contextual
      control in CARL, autonomous driving with nuScenes, and robotic video synthesis.'
    open_questions:
    - How do spatial consistency and action fidelity metrics translate to downstream
      policy performance or real-world deployment reliability?
    - Can low-latency interactive serving be maintained without sacrificing visual
      fidelity, physical plausibility, or long-horizon consistency?
    - Which assumptions limit current contextual world models when context is partially
      observed or tasks extend beyond CARL?
    - Do benchmark-based consistency claims generalize across domains, sensor configurations,
      and simulation-to-real transfer?
    - Where is independent reproduction still unverified given uneven code, dataset,
      baseline, and limitation disclosure in the existing evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控与物理信息驱动的世界模型系统
      解决的问题: 为驾驶和机器人模拟生成以动作、轨迹或上下文为条件的未来视频帧，提升动作忠实度、物理合理性及零样本策略迁移。
      尚未覆盖: 跨环境和传感器配置的泛化、长时自回归一致性，以及动态转移精度与细粒度视觉细节之间的权衡仍只有部分验证。
    - 路线: 面向世界模型一致性的基准与评估工件
      解决的问题: 提供数据集、指标和开放评估框架，用于衡量开放世界和驾驶场景中的空间一致性及动作忠实度。
      尚未覆盖: 证据集中在 Minecraft 与 nuScenes 等领域；一致性指标的跨领域有效性和下游效用尚未确立，部分工件未报告基线结果。
    - 路线: 上下文模型驱动强化学习栈
      解决的问题: 将现有世界模型（如 Dreamer v3）改造为上下文条件模拟器，以改善上下文强化学习中的零样本泛化。
      尚未覆盖: 假设上下文值可观测，且仅在两个 CARL 任务上评估；部分可观测或更多变动力学下的表现仍未解决。
    - 路线: 交互式世界建模系统化框架
      解决的问题: 整理开放世界探索、游戏引擎、自动驾驶和机器人中的应用场景、技术挑战、基准与未来方向。
      尚未覆盖: 综述覆盖可能滞后于快速进展；挑战与趋势判断基于当前证据，尚未在所有设置上经验验证。
    共识:
    - 世界模型被视作面向策略训练、策略评估和闭环推演的模拟基础设施，而非独立生成模型。
    - 动作条件控制是共同机制，但实现方式各异。
    - 视觉质量本身不足以确保空间或动作一致性，因此基准与指标被广泛引入。
    - 实时或低延迟部署与长时一致性是反复出现的系统要求。
    - 代码、数据或基准开源较常见，但完整评测与局限证据并不总是可见。
    分歧:
    - 表示方式：有些系统采用场景图一致性分数，有些采用潜在替换或多视图扩散 Transformer。
    - 监督信号：有些依赖深度与关键点等物理信息辅助任务，有些使用显式动作条件模块或上下文潜在动力学。
    - 评测目标：分别侧重空间一致性、动作忠实度、视觉保真度或零样本策略泛化。
    - 交互模式：包括离线基准评测、闭环自回归推演和基于模型的强化学习想象。
    - 部署场景：覆盖 Minecraft 导航、CARL 控制、nuScenes 自动驾驶和机器人视频合成。
    开放问题:
    - 空间一致性与动作忠实度指标如何转化为下游策略性能或真实部署可靠性？
    - 能否在保持视觉保真度、物理合理性和长时一致性的同时维持低延迟交互服务？
    - 当上下文部分可观测或任务超出 CARL 时，当前上下文世界模型的假设是否仍成立？
    - 基于基准的一致性结论能否跨领域、跨传感器配置以及实现仿真到真实迁移？
    - 在代码、数据集、基线和局限披露不均的情况下，独立复现仍未验证的环节在哪里？
