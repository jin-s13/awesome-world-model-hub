  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models for manipulation
      what_it_solves: Predict future video from past observations and actions to serve
        as forward dynamics, policy priors, or robot simulators.
      what_remains_open: Most evidence is contact-rich or task-specific; long-horizon,
        cross-embodiment causal consistency and formal assumptions are not fully validated.
    - line: Adaptation and reward/alignment of pretrained video generators into world
        models
      what_it_solves: Reuse high-quality video priors and align them with action controllability,
        physical realism, and task logic without always accessing or retraining the
        original parameters.
      what_remains_open: Adapter or reward datasets may be domain-specific, subjective,
        or scarce; generalization beyond the evaluated domains remains unproven.
    - line: Test-time scaling and verification of world-model reasoning
      what_it_solves: Evaluate whether imagined action-conditioned trajectories improve
        spatial reasoning and decision making through verifiers or frame-anchored
        assertions.
      what_remains_open: Verifiers show calibration biases and inconsistent benchmark
        scaling; current world models can form information bottlenecks.
    - line: Formalization and conceptual taxonomy of state and dynamics
      what_it_solves: Clarify what a world model must represent and organize implicit/explicit
        state construction and dynamics modeling, including persistence and causality
        assumptions.
      what_remains_open: No direct evidence that the formal conditions or taxonomy
        predict empirical model behavior or change model design.
    consensus:
    - Action-conditioned future prediction is the central capability used for planning,
      policy evaluation, or simulation.
    - Visual fidelity alone is treated as insufficient; action-frame alignment, physical
      plausibility, task logic, and downstream task correlation are valued.
    - Evaluation is shifting from generation quality toward decision-making behavior,
      physical realism, and causal or spatial reasoning.
    - Formal theory is sparse in this packet; applied world-model methods dominate
      the shared evidence.
    disagreements:
    - 'Representation: unified diffusion, masked autoregression, flow-based post-training,
      and adapter-based reuse of pretrained video diffusion.'
    - 'Supervision: action-labeled videos, human preference rewards, physics-aware
      annotations, and heuristic test-time verifiers.'
    - 'Evaluation target: visual quality, policy correlation with a simulator, planning
      success, spatial reasoning benchmark scores, physical plausibility, and trajectory
      consistency.'
    - 'Update mode: training from scratch, adapting a pretrained model without parameter
      access, and post-training a full model with reward or DPO.'
    open_questions:
    - Does explicit state construction and disentangled dynamics improve long-term
      persistence and causal reasoning beyond current generation metrics?
    - Can test-time verifiers be calibrated and transfer consistently across spatial
      reasoning benchmarks beyond SAT-Real, given MMSI-Bench shows no consistent scaling?
    - Do human preference-based reward models remain effective beyond contact-rich
      manipulation tasks?
    - Are there formal guarantees linking model size, data, objectives, and expected
      world-model failure or transfer? The packet leaves this as a validation gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向操作的动作条件视频世界模型
      解决的问题: 根据过去观测和动作预测未来视频，作为前向动力学、策略先验或机器人仿真器。
      尚未覆盖: 多数证据集中在接触丰富或任务特定场景；长时程、跨本体的因果一致性及形式假设尚未充分验证。
    - 路线: 预训练视频生成器的适配与奖励对齐
      解决的问题: 复用高质量视频先验，并在不总是访问或重训原始参数的情况下注入动作可控性、物理真实性和任务逻辑。
      尚未覆盖: 适配器或奖励数据可能领域特定、主观或稀缺；在评估域之外的泛化仍未被证明。
    - 路线: 世界模型推理的测试时缩放与验证
      解决的问题: 检验动作条件想象轨迹能否通过验证器或帧锚定断言改善空间推理和决策。
      尚未覆盖: 验证器存在校准偏差和基准不一致；当前世界模型可能形成信息瓶颈。
    - 路线: 状态构建与动态建模的形式化与概念分类
      解决的问题: 澄清世界模型必须表示什么，组织隐式/显式状态构建和动态建模，包括持久性与因果性假设。
      尚未覆盖: 没有直接证据表明形式条件或分类能预测经验模型行为或改变模型设计。
    共识:
    - 动作条件下的未来预测是用于规划、策略评测或仿真的核心能力。
    - 单纯视觉保真被认为不够，动作-帧对齐、物理合理性、任务逻辑和下游任务相关性更受关注。
    - 评测正从生成质量转向决策行为、物理真实性和因果或空间推理。
    - 本证据包中形式理论很少，占主导的是应用型世界模型方法。
    分歧:
    - 表示方式：统一扩散、掩码自回归、基于流后训练和基于预训练视频扩散的适配器复用。
    - 监督信号：动作标签视频、人类偏好奖励、物理感知标注和启发式测试时验证器。
    - 评测目标：视觉质量、与仿真器的策略相关性、规划成功率、空间推理基准分数、物理合理性与轨迹一致性。
    - 更新方式：从零训练、无参数访问地适配预训练模型、以及用奖励或DPO对全模型进行后训练。
    开放问题:
    - 显式状态构建与解耦动态是否比当前生成指标更能提升长期持久性和因果推理？
    - 测试时验证器能否在SAT-Real之外的基准上校准并一致扩展，鉴于MMSI-Bench未能一致扩展？
    - 基于人类偏好的奖励模型能否在接触丰富操作任务之外保持有效？
    - 是否存在规模、数据、目标与预期世界模型失效或迁移之间的形式保证？本证据包将其留作验证缺口。
