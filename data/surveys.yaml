  related_work_outline:
  - 'Mainstream direction: The dominant represented work treats action-conditioned
    video generation as world models for robot manipulation; explicit theory appears
    mainly as state/dynamics taxonomy and assumptions about action-conditioned prediction.'
  - 'Shared research pattern: Methods couple observations and actions, predict future
    video or dynamics, and evaluate visual quality, controllability, planning, or
    benchmark alignment; many claim better policy learning, simulation, or reasoning.'
  - 'Key differences: Representation differs across unified diffusion, frame-level
    action conditioning, masked autoregression, and adapters over pretrained video
    generators; training signals include imitation, RL/DPO reward alignment, and verifier-selected
    trajectories; evaluation targets range from visual fidelity to physical plausibility
    and spatial reasoning.'
  - 'Trend evolution: Available evidence concentrates in 2024–2026 and moves from
    fine-grained action-frame alignment and pretrained-video adaptation toward large-scale
    pretraining, physics and reward alignment, test-time scaling, and functional benchmarks;
    older years in the span lack top-paper evidence.'
  - 'Open questions: Whether formal assumptions match realistic rollouts, generalization
    beyond contact-rich manipulation, calibrated fine-grained verifiers, physical
    persistence and causality, and reproducibility given missing artifacts.'
  related_work_outline_zh:
  - 主流方向：证据中占主导的方向是将动作条件化视频生成作为机器人操作的世界模型；显式理论主要体现在状态/动力学分类以及对动作条件预测的假设上。
  - 研究共性：方法将观测与动作耦合，预测未来视频或动力学，并以视觉质量、可控性、规划或基准一致性作为评估依据。
  - 关键差异：表示方式涵盖统一扩散、帧级动作条件、掩码自回归和基于预训练视频生成器的适配器；训练信号包括模仿、RL/DPO奖励对齐和验证器选择；评测目标从视觉保真到物理合理性和空间推理不等。
  - 趋势演进：现有证据集中在2024–2026年，从细粒度动作-帧对齐和预训练视频适配，走向大规模预训练、物理与奖励对齐、测试时缩放和功能基准；时间跨度中的更早年份缺少顶会论文证据。
  - 开放问题：形式假设是否匹配真实轨迹，能否泛化到接触丰富操作之外，细粒度推理验证器是否校准，是否捕捉物理持久性与因果性，以及缺失工件对可复现性的影响。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions for video-based world models
      what_it_solves: Clarifying the state and dynamics properties a video generator
        must satisfy when used as a world model, and specifying what action-conditioned
        prediction assumes.
      what_remains_open: Direct validation that these formal conditions hold in realistic
        rollouts or across embodiments is absent from the available evidence.
    - line: Action-conditioned video dynamics and robot manipulation
      what_it_solves: Learning observation-action predictive models that can serve
        as policies, dynamics models, or video simulators for manipulation.
      what_remains_open: Most evidence is limited to manipulation or game/robot videos;
        formal conditions for out-of-domain generalization and physical or causal
        persistence are not established.
    - line: Physics and preference alignment for world-model rollouts
      what_it_solves: Aligning generated rollouts with multi-dimensional human preferences
        such as physical realism, task completion, embodiment plausibility, and visual
        quality.
      what_remains_open: It relies on large human-preference datasets and contact-rich
        tasks; domain transfer and subjective reward robustness remain under-validated.
    - line: Test-time verification and spatial reasoning
      what_it_solves: Using verifier-selected action-conditioned views to improve
        spatial reasoning and trajectory selection.
      what_remains_open: Verifier calibration, action biases, and unreliable reward
        signals persist; consistent scaling is not achieved on fine-grained benchmarks.
    - line: Conceptual state/dynamics taxonomy for video world models
      what_it_solves: Organizing state construction and dynamics modeling choices
        and advocating functional benchmarks over visual-only evaluation.
      what_remains_open: The taxonomy remains conceptual and lacks experimental evidence
        that it changes model design or evaluation outcomes.
    consensus:
    - Observation-action trajectories are central to learning world models for embodied
      control, usually by predicting future video frames.
    - Visual fidelity alone is insufficient; methods increasingly align rollouts with
      physical realism, task logic, or human preference.
    - Current benchmarks and metrics do not sufficiently test persistence, causality,
      or calibrated decision-relevant reasoning.
    - Large-scale video-action pretraining or post-training is treated as a path to
      more generalizable world models.
    disagreements:
    - Some methods train unified models over modalities, while others adapt pretrained
      video generators through learned masks or post-training stages.
    - 'Supervision differs: preference or reinforcement-learning alignment, action-conditioned
      reconstruction, and verifier-selected trajectory rewards.'
    - 'Evaluation targets differ: visual quality and speed, physical plausibility,
      policy correlation, or spatial reasoning benchmarks.'
    - Some frameworks treat world models as interactive simulators, while others treat
      them as test-time reasoning engines constrained by information bottlenecks.
    open_questions:
    - Which formal assumptions guarantee that action-conditioned video generation
      remains a reliable dynamics model outside training domains?
    - Can reward-aligned world models transfer to unseen embodiments and tasks without
      costly human preference data?
    - Do verifier-based test-time scaling methods reduce uncertainty or only lower
      answer entropy?
    - What functional benchmarks can measure physical persistence and causal reasoning
      rather than frame realism?
    - How much cross-paper comparison is limited by absent code, datasets, limitation
      notes, or metric details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于视频世界模型的形式化定义与假设
      解决的问题: 澄清视频生成器作为世界模型时必须满足的状态与动力学属性，并说明动作条件预测所依赖的假设。
      尚未覆盖: 现有证据缺少直接验证这些形式条件在真实轨迹或跨本体场景中是否成立。
    - 路线: 动作条件化视频动力学与机器人操作
      解决的问题: 学习观测-动作预测模型，使其可作为操作任务中的策略、动力学模型或视频模拟器。
      尚未覆盖: 证据多限于操作或游戏/机器人视频，域外泛化以及物理或因果持久性的形式条件尚未建立。
    - 路线: 基于物理与偏好对齐的世界模型轨迹
      解决的问题: 将生成轨迹与多维人类偏好对齐，包括物理真实、任务完成、具身合理性和视觉质量。
      尚未覆盖: 依赖大量人类偏好数据和接触丰富任务，领域迁移和主观奖励鲁棒性缺乏验证。
    - 路线: 测试时验证与空间推理
      解决的问题: 通过验证器选择的动作条件视图改善空间推理和轨迹选择。
      尚未覆盖: 验证器校准、动作偏差和不可靠奖励信号仍然存在，细粒度基准上未实现一致缩放。
    - 路线: 视频世界模型的状态/动力学概念分类
      解决的问题: 组织状态构建与动力学建模选择，并倡导以功能基准替代仅视觉评估。
      尚未覆盖: 分类仍是概念性的，尚无实验证据表明它能改变模型设计或评估结果。
    共识:
    - 观测-动作轨迹是学习具身控制世界模型的核心，通常通过预测未来视频帧实现。
    - 仅视觉保真度不够，需要进一步与物理真实、任务逻辑或人类偏好对齐。
    - 现有基准和指标未充分测试持续性、因果性或决策相关推理的校准性。
    - 大规模视频-动作数据的预训练或后训练被视为提升世界模型泛化性的路径。
    分歧:
    - 有的方法训练统一的多模态模型，有的通过学习掩码或后训练阶段适配预训练视频生成器。
    - 监督信号不同：偏好或强化学习对齐、动作条件重建、以及验证器选择的轨迹奖励。
    - 评测目标不同：视觉质量与速度、物理合理性、策略相关性或空间推理基准。
    - 部分框架将世界模型视为交互模拟器，另一些则视为受信息瓶颈限制的测试时推理引擎。
    开放问题:
    - 哪些形式假设能保证动作条件视频生成在训练域之外仍可作为可靠的动力学模型？
    - 奖励对齐世界模型能否在无需昂贵人类偏好数据的情况下迁移到未见本体和任务？
    - 基于验证器的测试时缩放方法是降低真实不确定性，还是仅降低答案熵？
    - 哪些功能基准能测量物理持久性和因果推理，而非仅测量帧真实感？
    - 跨论文比较在多大程度上受限于缺失的代码、数据集、局限性说明或指标细节？
