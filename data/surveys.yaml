  related_work_outline:
  - 'Mainstream direction: Recent top work concentrates on generative world models
    built from video or latent dynamics, using Diffusion Transformers, Transformer-VAE,
    or stochastic state-space backbones for driving, robotics, and model-based control.'
  - 'Shared research pattern: Most papers learn a predictive dynamics model from visual
    experience and then use it for rollout generation, policy improvement, zero-shot
    generalization, or consistency evaluation, with action conditioning becoming more
    explicit.'
  - 'Key differences: Representations range from stochastic recurrent state-space
    and Transformer-VAE to mask-conditioned diffusion and video-action co-diffusion;
    evaluation spans Atari sample efficiency to driving, robotic execution, and memory-consistency
    benchmarks.'
  - 'Trend evolution: The evidence window is concentrated in 2023-2026, moving from
    single-benchmark stochastic world models toward unified action-coupled, physics-informed,
    and data-scaled embodied models plus targeted consistency benchmarks.'
  - 'Open questions: Reported gains are often not isolated by ablation; several papers
    omit limitations or code details, leaving unclear transfer beyond reported tasks,
    datasets, context assumptions, and simulation settings.'
  related_work_outline_zh:
  - 主流方向：近期顶尖工作集中在生成式世界模型，以Diffusion Transformer、Transformer-VAE或随机状态空间骨干，面向驾驶、机器人与基于模型的控制。
  - 研究共性：多数论文从视觉经验学习预测动力学，并用于长时域生成、策略改进、零样本泛化或一致性评测；动作条件愈发显式化。
  - 关键差异：表示从随机循环状态空间、Transformer-VAE到掩码条件扩散和视频-动作联合扩散；评测涵盖Atari、驾驶、机器人和记忆一致性。
  - 趋势演进：证据集中在2023-2026年，从单一基准随机世界模型走向统一动作耦合、物理信息和数据规模化具身模型及一致性基准。
  - 开放问题：论文常未通过消融隔离方法贡献；部分条目缺少局限性或代码细节，因此在报告任务、数据、上下文假设和仿真之外难以判断迁移性。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion- and mask-based visual generation for world models
      what_it_solves: Learning scalable video prediction and long-horizon or multi-view
        rollout from driving video by combining generative diffusion with masked context
        learning.
      what_remains_open: Transfer beyond reported driving datasets and whether mask,
        row-wise attention, or cross-view modules are necessary versus data scale.
    - line: Transformer-VAE and stochastic state-space dynamics for model-based RL
      what_it_solves: Modeling latent stochastic dynamics from high-dimensional observations
        for sample-efficient policy learning and zero-shot generalization.
      what_remains_open: Context observability assumptions and narrow CARL task evaluation
        leave broader applicability unclear.
    - line: Language-primitive and contextual factorization for compositional generalization
      what_it_solves: Decomposing instructions or context into conditioners so world
        models can synthesize unseen combinations of seen primitives.
      what_remains_open: Requires accurate primitive parsing and known context; genuinely
        novel primitives and actions are unsupported.
    - line: Action- and physics-informed embodied world-model pretraining
      what_it_solves: Coupling video generation with action diffusion or physics side
        tasks to produce plausible robot or driving videos and policies.
      what_remains_open: Real-robot validation and evidence isolating physics or action
        objectives from the base generator and task prior.
    - line: World-model benchmarking for spatial, memory, and action-control consistency
      what_it_solves: Providing loop-based or closed-loop revisited video datasets
        and metrics to quantify consistency beyond pixel fidelity.
      what_remains_open: Small curated video counts, early baseline evidence, and
        unclear correlation between benchmark scores and downstream task success.
    consensus:
    - Most approaches treat learned visual dynamics as a foundation for planning,
      policy learning, or behavior evaluation rather than standalone video generation.
    - Action conditioning is increasingly integrated into the world model instead
      of left to an external controller.
    - Long-horizon and spatial consistency are treated as central failure modes, motivating
      mask reconstruction, depth/keypoint tasks, or consistency benchmarks.
    - Methods rely heavily on large-scale visual datasets, simulation, or existing
      driving/robot data such as Atari, CARL, RT-X, Nuscenes, OpenDV-2K, and Waymo.
    - Reported evidence typically combines architecture, training objectives, and
      evaluation settings; separability of these contributions remains uncertain.
    disagreements:
    - Stochastic latent state-space models prioritize sample efficiency, while diffusion-based
      generators prioritize high-fidelity multi-view and long-horizon video.
    - Some methods assume observable context or language primitives; others learn
      from action-free or action-coupled video.
    - 'Evaluation targets differ: Atari sample efficiency, contextual zero-shot generalization,
      driving benchmark rollout, robotic policy utility, and open-domain consistency.'
    - Physics integration differs from explicit depth/keypoint side tasks to implicit
      co-diffusion or no explicit physical prior.
    - Deployment evidence ranges from simulation-only robot execution to dataset-driven
      driving and cross-action-space generalization.
    open_questions:
    - Do gains transfer when unseen contexts, action spaces, or initial viewpoints
      exceed the training distribution?
    - How much of reported improvement comes from the world-model representation,
      the training objective, the planner/policy, or data scale?
    - Are spatial, memory, and action-control benchmark metrics predictive of downstream
      control success?
    - Which physics or consistency side tasks are necessary for long-horizon physical
      plausibility in open-domain settings?
    - Several top papers lack limitations or code detail; what verification gaps remain
      around reproducibility and baseline fairness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于扩散和掩码的视觉生成世界模型
      解决的问题: 从驾驶视频学习可扩展的视频预测与长时域或多视角生成，结合扩散生成与掩码上下文学习。
      尚未覆盖: 在报告驾驶数据集之外的迁移，以及掩码、行式注意力和跨视图模块是否必要尚未隔离验证。
    - 路线: Transformer-VAE与随机状态空间动力学世界模型
      解决的问题: 从高维观测建模潜在随机动力学，用于样本效率策略学习和零样本泛化。
      尚未覆盖: 上下文可观测假设和CARL基准上仅两个任务的评估范围较窄。
    - 路线: 语言原语与上下文分解的组合泛化
      解决的问题: 将指令或上下文分解为条件信号，使世界模型能合成已见原语的新组合。
      尚未覆盖: 依赖准确的原语解析和已知上下文；全新原语或动作不被支持。
    - 路线: 动作与物理信息驱动的具身世界模型预训练
      解决的问题: 耦合视频生成与动作扩散或物理辅助任务，产生更合理的机器人或驾驶视频和策略。
      尚未覆盖: 缺少真实机器人验证，也缺少对物理或动作目标与基础生成器、任务先验贡献的隔离。
    - 路线: 面向空间、记忆与动作控制一致性的世界模型评测
      解决的问题: 提供循环导航或闭环可复现视频数据集和指标，在像素保真度之外量化一致性。
      尚未覆盖: 视频规模有限，基线证据仍较弱，评测指标与下游任务成功率的关联尚不明确。
    共识:
    - 多数工作将学习到的视觉动力学作为规划、策略学习或行为评估的基础，而非孤立视频生成。
    - 动作条件正越来越多地集成进世界模型，而不是留给外部控制器。
    - 长时域和空间一致性被视为核心失败模式，推动了掩码重建、深度/关键点任务或一致性基准。
    - 方法普遍依赖大规模视觉数据集、仿真或已有驾驶/机器人数据，如Atari、CARL、RT-X、Nuscenes、OpenDV-2K和Waymo。
    - 已报告证据通常混合架构、训练目标和评测设置，这些贡献的可分离性仍不确定。
    分歧:
    - 随机潜在状态空间方法更关注采样效率，而扩散生成器更关注高保真多视角和长时域视频。
    - 部分方法假设上下文或语言原语可观测；部分方法从无动作或动作耦合视频中学习。
    - 评测目标包括Atari采样效率、上下文零样本泛化、驾驶基准展开、机器人策略效用和开放域一致性。
    - 物理集成方式从显式深度/关键点辅助任务到隐式联合扩散或无显式物理先验存在差异。
    - 部署证据从纯仿真机器人执行，到基于数据集的驾驶和跨动作空间泛化不等。
    开放问题:
    - 当未见上下文、动作空间或新视角超出训练分布时，方法收益能否迁移？
    - 报告提升有多少来自世界模型表示、训练目标、规划/策略或数据规模？
    - 空间、记忆和动作控制基准指标能否预测下游控制成功率？
    - 在开放域长时域物理合理性中，哪些物理或一致性辅助任务是必要的？
    - 若干头部论文缺少局限性或代码细节，围绕可复现性和基线公平性的验证缺口有哪些？
