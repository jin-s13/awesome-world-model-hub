  related_work_outline:
  - 'Mainstream direction: Research centers on evaluating world models through shared
    benchmarks that probe consistency, memory, controllability, and task performance
    rather than only video reconstruction.'
  - 'Shared research pattern: Define an interaction or navigation protocol, add a
    targeted metric such as spatial consistency, action control, or human-normalized
    score, and compare generative architectures on limited data or zero-shot settings.'
  - 'Key differences: Benchmarks differ in domain—open-world navigation, game/control
    suites, and driving/robotics—and in evaluation targets such as visual fidelity,
    physical plausibility, spatial/memory consistency, or downstream policy utility.'
  - 'Trend evolution: Top evidence is concentrated in 2023–2026; work is moving from
    aggregate control-suite scores toward consistency- and memory-aware benchmarks
    and toward embodied driving/robotics evaluation.'
  - 'Open questions: Whether curated consistency probes transfer to real deployment,
    how proxy metrics relate to downstream decisions, and whether rankings remain
    stable across implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：研究重心转向通过共享基准评估世界模型的一致性、记忆、可控性和任务表现，而不仅是视频重建。
  - 研究共性：定义交互或导航协议，增加空间一致性、动作控制或人类归一化分数等针对性指标，并在有限数据或零样本设置下比较生成式架构。
  - 关键差异：基准在开放世界导航、游戏控制套件、驾驶/机器人等领域不同；评估目标包括视觉保真、物理合理性、空间/记忆一致性或下游策略效用。
  - 趋势演进：高证据集中于2023–2026年，工作正从聚合控制套件分数转向一致性与记忆感知基准，并走向具身驾驶/机器人评估。
  - 开放问题：策划的一致性探针是否迁移到真实部署，代理指标与下游决策如何关联，排名在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared loop-based navigation or video datasets that
        make world-model spatial, memory, and action-control claims testable; short
        examples include LoopNav and MIND.
      what_remains_open: 'Coverage is narrow: Minecraft-only loop navigation and 250
        curated videos leave real-world deployment and diverse interaction settings
        unverified.'
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate reconstruction quality by introducing
        targeted probes such as scene-graph consistency and memory/action-control
        evaluation frameworks.
      what_remains_open: It is unclear whether these proxy metrics correspond to the
        downstream decisions users actually care about or remain robust across viewpoints
        and action variations.
    - line: World-model agent evaluation on control suites
      what_it_solves: Provides comparable sample-efficiency and zero-shot generalization
        evidence on Atari 100k and CARL for model-based agents; short examples include
        STORM, DIAMOND, and cRSSM.
      what_remains_open: These suites do not directly measure long-horizon spatial
        or memory consistency and may not transfer to complex embodied or real-world
        tasks.
    - line: Embodied world-model evaluation via physics and action coupling
      what_it_solves: Evaluates visual fidelity, physical plausibility, and policy
        utility in robotic or driving settings; short examples include MaskGWM, RoboScape,
        and UWM.
      what_remains_open: Reported improvements rely on benchmark-specific metrics;
        evidence that physics-informed or action-coupled generation improves real
        robot deployment remains incomplete.
    consensus:
    - World models are usually evaluated through video prediction or agent rollouts
      under an interaction protocol, with metrics beyond raw reconstruction quality.
    - A useful benchmark should expose a specific failure mode—spatial inconsistency,
      memory drift, or action misalignment—rather than rely only on aggregate scores.
    - Generative architectures such as diffusion transformers, recurrent state-space
      models, and transformer-VAE hybrids are compared on shared suites such as Atari
      100k, CARL, Nuscenes, OpenDV-2K, and Waymo.
    disagreements:
    - 'Task domain and interaction mode differ: game/control suites versus open-world
      navigation versus driving or robotic video settings.'
    - 'Evaluation targets differ: pixel-level visual fidelity and physical plausibility
      versus spatial scene-graph consistency versus memory/action-control versus downstream
      policy utility.'
    - 'Supervision and representation differ: context-conditioned recurrent state-space,
      diffusion-based generation, mask reconstruction, physics-informed auxiliary
      tasks, and action-coupled diffusion.'
    - 'Deployment assumptions differ: curated simulator or video benchmarks versus
      zero-shot driving and robotic policy training or evaluation.'
    open_questions:
    - Do loop-consistency and memory/action-control probes in curated environments
      transfer to real-world robotic and driving deployment?
    - How should visual fidelity be weighted against physical plausibility and downstream
      decision utility when comparing world models?
    - Are benchmark rankings stable across different implementations, compute budgets,
      and repeated runs?
    - What minimal dataset and scene coverage is needed to expose long-horizon spatial
      and memory failures without overfitting to specific environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的循环导航或视频数据集，使世界模型的空间、记忆和动作控制主张可被测试；代表性短例包括 LoopNav 和 MIND。
      尚未覆盖: 覆盖范围较窄：仅 Minecraft 循环导航和 250 个精选视频，真实部署和多样化交互设置仍未验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合重建质量之外引入场景图一致性、记忆一致性和动作控制等针对性探针。
      尚未覆盖: 尚不清楚这些代理指标是否与用户真正关心的下游决策一致，以及是否在视角和动作变化下保持稳健。
    - 路线: 控制套件上的世界模型智能体评估
      解决的问题: 在 Atari 100k 和 CARL 上提供样本效率和零样本泛化的可比证据；代表性短例包括 STORM、DIAMOND 和 cRSSM。
      尚未覆盖: 这些套件不直接测量长时域空间或记忆一致性，也不一定能迁移到复杂具身或真实任务。
    - 路线: 物理与动作耦合的具身世界模型评估
      解决的问题: 在机器人或驾驶设置中评估视觉保真、物理合理性和策略效用；代表性短例包括 MaskGWM、RoboScape 和 UWM。
      尚未覆盖: 报告提升依赖基准特定指标；物理信息或动作耦合生成能否改善真实机器人部署仍缺少完整证据。
    共识:
    - 世界模型通常通过视频预测或智能体交互推演来评估，并采用超越原始重建质量的指标。
    - 有效基准应暴露特定失败模式，如空间不一致、记忆漂移或动作不对齐，而不是仅依赖聚合分数。
    - 扩散 Transformer、循环状态空间模型和 Transformer-VAE 混合架构在 Atari 100k、CARL、Nuscenes、OpenDV-2K
      和 Waymo 等共享套件上进行比较。
    分歧:
    - 任务域和交互模式不同：游戏控制套件、开放世界导航、驾驶或机器人视频设置各有侧重。
    - 评估目标不同：像素级视觉保真和物理合理性、空间场景图一致性、记忆/动作控制或下游策略效用各有侧重。
    - 监督信号和表示不同：上下文条件循环状态空间、扩散生成、掩码重建、物理信息辅助任务和动作耦合扩散并存。
    - 部署假设不同：策划的模拟器或视频基准与零样本驾驶、机器人策略训练或评估场景存在差异。
    开放问题:
    - 策划环境中的循环一致性和记忆/动作控制探针能否迁移到真实机器人和驾驶部署？
    - 比较世界模型时，视觉保真应如何与物理合理性和下游决策效用加权？
    - 基准排名在不同实现、算力预算和重复运行下是否稳定？
    - 需要多少数据集和场景覆盖才能暴露长时域空间与记忆失败，同时避免对特定环境过拟合？
