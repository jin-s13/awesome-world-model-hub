  related_work_outline_zh:
  - 主流方向：以综述式综合为主，围绕生成式与潜在世界模型展开，尤其关注视频生成模拟器在机器人、自动驾驶和具身交互中的应用；近期工作从方法基准转向统一分类体系与评测框架。
  - 研究共性：通过应用场景、状态表示和评测设置来组织碎片化模型设计，并反复映射长时一致性、可控性和实时交互等技术瓶颈。
  - 关键差异：范围从通用视频世界模型综述，到交互式视频建模、自动驾驶和物理机器人学习；证据从概念性分类构建到实证系统基准和真实机器人评估。
  - 趋势演进：2022年提供物理机器人世界模型强化学习证据；2024年转向生成式视频世界模拟器；2025至2026年新增细粒度多模态控制、开源模拟器、视线外动态以及更正式的分类与评测，显示当前前沿由方法走向系统综合。
  - 开放问题：如何实证检验分类法和闭环指标，如何泛化到未见原语或领域之外，以及当多篇论文缺失局限或实现细节时如何确定缺口优先级。
  literature_review:
    line_of_work_matrix:
    - line: World-model survey and taxonomy synthesis
      what_it_solves: Maps fragmented world-model research into directions, milestones,
        application scenarios, and structural design choices such as latent representations
        and priors.
      what_remains_open: Many taxonomies and roadmaps are proposed as conceptual frameworks
        without empirical validation or systematic coverage guarantees.
    - line: Comparative evaluation and benchmark synthesis
      what_it_solves: Summarizes how benchmark setting, metrics, and closed-loop versus
        open-loop evaluation shape conclusions across interactive video, driving,
        exploration, and robotics.
      what_remains_open: Compared results often remain incompatible across domains;
        proposed evaluation suites are not always implemented or tested.
    - line: Generative world-model construction and controllability
      what_it_solves: Builds video or latent simulators with controllable dynamics,
        long-horizon memory, physical robot learning, or fine-grained multimodal control.
      what_remains_open: Generalization beyond seen primitives or training environments,
        real-robot validation, and limitation or reproducibility evidence are incomplete.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete next research
        questions such as action-conditioned controllability, long-horizon memory,
        real-time interactivity, and resource-aware inference.
      what_remains_open: Prioritization among these gaps remains unresolved, especially
        when evidence is selective and recent work moves quickly.
    consensus:
    - World-model work is converging on generative video and latent-dynamics simulation
      as central objects of study, with shared attention to controllability, long-horizon
      consistency, and deployment in robotics, driving, and embodied settings.
    - Surveys and methods both treat real-time interactivity, action-conditioned generation,
      and long-term memory as core technical challenges rather than solved capabilities.
    - Evaluation is increasingly treated as a research object itself, with benchmark
      comparisons organized by application scenario and open-loop/closed-loop settings,
      though not always operationalized.
    disagreements:
    - Papers differ on whether to organize the problem through a general unifying
      model taxonomy or through domain-specific evaluation frameworks, with some targeting
      interactive video, others autonomous driving, and others physical robot learning.
    - 'Representation and supervision choices diverge: compositional language primitives,
      persistent 3D global state, ego-motion and human pose, and model-based reinforcement-learning
      state control each assume different world-model granularity.'
    - Evaluation targets vary from simulated video plans and benchmark metrics to
      real robot execution and real-time latency, making cross-paper conclusions difficult
      to align.
    open_questions:
    - Which closed-loop or open-loop evaluation setting best predicts real-world world-model
      utility, and can proposed metric suites be implemented and validated beyond
      conceptual descriptions?
    - How can video or latent world models generalize beyond previously seen primitive
      combinations, environments, or robot platforms without returning to domain-specific
      retraining?
    - What evidence would validate survey taxonomies as systematic rather than selective,
      especially when limitations, baselines, or reproducibility artifacts are not
      reported?
    - How should research prioritize long-horizon memory, action-conditioned controllability,
      and real-time interactivity when the field is moving rapidly and recent coverage
      may be incomplete?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型综述与分类体系综合
      解决的问题: 将碎片化的世界模型研究映射为方向、里程碑、应用场景以及潜在表示和结构先验等设计选择。
      尚未覆盖: 许多分类法和路线图仍作为概念框架提出，缺少实证验证或系统性覆盖保证。
    - 路线: 对比评测与基准综合
      解决的问题: 总结不同基准设置、指标以及闭环/开环评测如何影响交互式视频、自动驾驶、探索和机器人等领域的跨论文结论。
      尚未覆盖: 被比较的结果在不同领域之间往往不兼容；提出的评测套件也未必被实施或测试。
    - 路线: 生成式世界模型构建与可控性
      解决的问题: 构建具有可控动态、长时记忆、物理机器人学习或细粒度多模态控制的视频或潜在模拟器。
      尚未覆盖: 对未见原语或训练环境的泛化、真实机器人验证以及局限性和可复现性证据仍不完整。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为具体的下一步研究问题，如动作条件可控性、长时记忆、实时交互和资源感知推理。
      尚未覆盖: 在证据选择性强且近期工作快速演进的条件下，各缺口的重要优先级仍不明确。
    共识:
    - 世界模型工作正汇聚到生成式视频和潜在动态模拟这一核心对象，并共同关注可控性、长时一致性以及机器人、自动驾驶和具身环境中的部署。
    - 综述和方法研究都把实时交互、动作条件生成和长期记忆视为核心技术挑战，而非已经解决的能力。
    - 评测本身越来越多被当作研究对象，基准比较常按应用场景和开环/闭环设置组织，但并非始终可操作。
    分歧:
    - 论文在是否采用统一通用模型分类体系或领域特定评测框架上存在分歧，有的面向交互式视频，有的面向自动驾驶，有的面向物理机器人学习。
    - 表示与监督选择不同：组合式语言原语、持久3D全局状态、自我运动与人体姿态，以及基于模型的强化学习状态控制分别假设了不同的世界模型粒度。
    - 评测目标从仿真视频计划和基准指标到真实机器人执行与实时延迟各不相同，使跨论文结论难以对齐。
    开放问题:
    - 哪种闭环或开环评测设置最能预测世界模型在真实环境中的效用，提出的指标套件能否从概念描述走向实施与检验？
    - 视频或潜在世界模型如何在不进行领域特定重训练的情况下泛化到未见原语组合、环境或机器人平台？
    - 当局限性、基线或可复现工件未被报告时，需要什么证据才能验证综述分类体系是系统性的而非选择性举例？
    - 在领域快速演进且近期覆盖可能不完整的情况下，如何优先处理长时记忆、动作条件可控性和实时交互等开放挑战？
