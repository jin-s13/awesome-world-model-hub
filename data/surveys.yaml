  related_work_outline_zh:
  - 主流方向：基于扩散Transformer或潜在状态空间模型的生成式世界模型，并以动作或目标为条件，辅以重建、深度、关键点等辅助任务。
  - 研究共性：从自监督视频或交互数据中学习未来观测或潜在动力学，再用于策略学习、视频规划或一致性评测。
  - 关键差异：表示方式分为像素视频生成、潜在随机推演和统一动作-视频扩散；监督信号与评测目标覆盖驾驶、机器人和控制基准。
  - 趋势演进：可用高排序证据集中在2023-2026年，从高效随机世界模型走向上下文/组合机器人模型、物理信息生成、统一视频-动作预训练和闭环一致性基准。
  - 开放问题：如何分离模型与规划器/数据/接口的贡献，跨域迁移是否成立，以及长时记忆和跨动作空间控制仍是待解边界。
  literature_review:
    line_of_work_matrix:
    - line: Generative diffusion and transformer video world models with auxiliary
        reconstruction or physics tasks
      what_it_solves: High-dimensional visual future prediction across driving and
        robotic settings, including multi-view and long-horizon generation.
      what_remains_open: Long-horizon memory stability, physical consistency under
        unseen actions, and generalization beyond training scenes or primitive combinations
        remain unresolved.
    - line: Latent stochastic and contextual state-space world models for model-based
        reinforcement learning
      what_it_solves: Sample-efficient policy learning from imagined latent trajectories
        and zero-shot generalization to observed context changes in control tasks.
      what_remains_open: Evidence is limited to small benchmark task sets; transfer
        beyond those tasks, partially observable context, and model-vs-planner contribution
        are open.
    - line: Unified action-video diffusion interfaces and multimodal goal conditioning
      what_it_solves: Couples action and observation generation so one model can express
        policy, forward/inverse dynamics, and language- or image-conditioned video
        plans.
      what_remains_open: Whether independent modality timestep control transfers across
        different action spaces and whether pretraining gains isolate the proposed
        method remain unclear.
    - line: Evaluation protocols for spatial, temporal, and action-control consistency
      what_it_solves: Measures closed-loop world-model properties such as loop-navigation
        consistency, memory persistence, and cross-action-space generalization.
      what_remains_open: Benchmark construction is stronger than model-result evidence;
        metric validity and alignment with downstream task success still need demonstration.
    - line: Method evidence and ablation isolation
      what_it_solves: Separates proposed architecture or objective contributions from
        dataset scale, baseline choice, and implementation effects.
      what_remains_open: Several papers in this packet lack detailed limitations or
        reported ablations; therefore contribution boundaries and failure modes are
        not fully verified.
    consensus:
    - 'Multiple lines share a generative-sequence modeling core: future frames or
      latent states are predicted under action or goal conditioning, often with Transformers
      or diffusion.'
    - Auxiliary tasks are commonly used to inject structure beyond plain reconstruction,
      including mask reconstruction, depth prediction, keypoint dynamics, and action
      co-modeling.
    - Evaluation is moving beyond visual similarity toward downstream control, zero-shot
      generalization, or closed-loop consistency.
    - Long-horizon consistency, memory, and action generalization across scenes and
      embodiments form a shared open frontier.
    disagreements:
    - 'Representation differs: latent state-space rollouts for sample-efficient control
      versus pixel-space video generation versus unified action-video latent diffusion.'
    - 'Supervision differs: observable context values are assumed in some work, language-primitive
      parsing in another, and physics-oriented auxiliary tasks elsewhere.'
    - 'Evaluation targets differ: Atari 100k and CARL-style control, driving multi-view
      prediction, robot video plans, and open-domain consistency benchmarks.'
    - 'Interaction mode differs: simulated policy execution, embodied or driving deployment
      claims, and benchmark-only protocol studies with no reported model results.'
    open_questions:
    - Do reported zero-shot, multi-view, or policy gains transfer beyond the small
      task subsets, simulations, or specific datasets used?
    - How much of measured policy or video-quality improvement comes from the learned
      world model rather than the surrounding planner, controller, or pretraining
      data?
    - What architectural or training changes are needed for long-horizon memory consistency
      and cross-action-space generalization, which current benchmarks highlight as
      unresolved?
    - What is the real reproducibility boundary when code or dataset signals exist
      but limitation and ablation evidence are absent in several papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式扩散/Transformer视频世界模型与辅助重建或物理任务
      解决的问题: 面向驾驶和机器人场景的高维视觉未来预测，包括多视角和长时域生成。
      尚未覆盖: 长时域记忆稳定性、未知动作下物理一致性，以及训练场景或原语组合之外的泛化仍不明确。
    - 路线: 潜在随机与上下文状态空间世界模型用于基于模型的强化学习
      解决的问题: 从想象的潜在轨迹中采样高效学习策略，并对可观测上下文变化实现零样本泛化。
      尚未覆盖: 证据局限于少量基准任务；跨任务迁移、部分可观测上下文以及模型与规划器贡献未充分分离。
    - 路线: 统一动作-视频扩散接口与多模态目标条件
      解决的问题: 将动作和观测生成耦合，使同一模型可表达策略、前向/逆动力学以及语言或图像条件下视频计划。
      尚未覆盖: 独立模态时间步控制是否跨不同动作空间迁移，预训练收益是否来自方法本身仍待验证。
    - 路线: 空间、时间与动作控制一致性的评估协议
      解决的问题: 衡量闭环世界模型性质，如循环导航一致性、记忆保持和跨动作空间泛化。
      尚未覆盖: 基准构建证据强于模型结果证据；指标有效性与下游任务成功的关系尚未充分证明。
    - 路线: 方法证据与消融隔离
      解决的问题: 区分方法贡献与数据集规模、基线选择和实现因素。
      尚未覆盖: 若干论文缺少详细局限性或消融，因此贡献边界和失败模式未能完全核验。
    共识:
    - 多条路线共享生成式序列建模思想：在动作或目标条件下预测未来帧或潜在状态，常用Transformer或扩散模型。
    - 辅助任务常被用来注入结构，例如掩码重建、深度预测、关键点动力学和动作联合建模。
    - 评测正在从单纯视觉相似度走向下游控制、零样本泛化或闭环一致性。
    - 长时域一致性、记忆和跨场景、跨具身行动泛化是共同的开放前沿。
    分歧:
    - 表示方式不同：有潜在状态空间推演、像素空间视频生成，以及统一动作-视频扩散。
    - 监督信号不同：有方法假设上下文可观测，有方法依赖语言原语解析，也有方法使用物理辅助任务。
    - 评测目标不同：包括Atari 100k和CARL类控制、驾驶多视角预测、机器人视频计划和开放域一致性基准。
    - 交互模式不同：包括仿真策略执行、具身或驾驶部署声明，以及仅构建基准而未报告模型结果的研究。
    开放问题:
    - 在现有小任务子集、仿真或特定数据集之外，报告到的零样本、多视角或策略提升能否迁移到未见任务族和真实环境？
    - 策略或视频质量提升有多少来自世界模型本身，而非规划器、控制器或预训练数据？
    - 需要何种架构或训练变化，才能改善当前基准揭示的长时域记忆一致性和跨动作空间泛化问题？
    - 当部分论文有代码或数据集信号但缺少局限性与消融时，真实可复现边界在哪里？
