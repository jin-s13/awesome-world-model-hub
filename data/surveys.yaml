  related_work_outline:
  - 'Mainstream direction: Building specialized benchmarks that probe world models
    beyond aggregate scores, focusing on spatial consistency, memory, action control,
    and physical plausibility.'
  - 'Shared research pattern: Creating video-based datasets with interaction logs,
    defining targeted metrics to diagnose specific failure modes, and reporting results
    on standard platforms like Atari 100k or Nuscenes.'
  - 'Key differences: Evaluation dimensions (spatial reasoning vs. long-term memory
    vs. physical dynamics), domain (simulation games vs. autonomous driving vs. robotic
    manipulation), and assessment mode (open-loop prediction vs. closed-loop interaction).'
  - 'Trend evolution: From 2023 efficiency-driven benchmarks (Atari 100k) to 2024–2025
    driving and robotics suites, and then to 2025–2026 diagnostic benchmarks that
    explicitly test consistency and memory, signaling a shift from general performance
    to fine-grained capability auditing.'
  - 'Open questions: How well do proxy metrics correlate with downstream decision
    quality in real deployments? Can benchmarks cover the full distribution of dynamics
    where world models are expected to operate? Are benchmark rankings stable across
    implementations and compute budgets?'
  related_work_outline_zh:
  - 主流方向：构建专项基准以超越总分考核世界模型，聚焦空间一致性、记忆、动作控制和物理合理性。
  - 研究共性：创建基于视频和交互的数据集，定义针对性指标诊断特定失败模式，并在Atari 100k、Nuscenes等标准平台上报告结果。
  - 关键差异：评估维度（空间推理、长期记忆、物理动力学），领域（仿真游戏、自动驾驶、机器人操作），以及评估模式（开环预测、闭环交互）。
  - 趋势演进：从2023年效率导向的Atari 100k，到2024–2025年驾驶和机器人套件，再到2025–2026年专门测试一致性和记忆的诊断基准，标志着从通用性能到细粒度能力审计的转变。
  - 开放问题：代理指标与真实部署中下游决策质量的相关性如何？基准能否覆盖世界模型预期操作的全部动态分布？基准排名在不同实现和算力预算下是否稳定？
  literature_review:
    line_of_work_matrix:
    - line: Diagnostic benchmarks for world model consistency and control
      what_it_solves: Probing specific capabilities such as spatial consistency, memory
        retention, and action control that are not captured by per-frame generation
        quality or aggregate game scores.
      what_remains_open: Alignment between these diagnostic metrics and the actual
        utility of world models in downstream planning or policy learning; whether
        the curated tasks reflect the diversity of real-world dynamics.
    - line: Standardized task suites and dataset platforms for model comparison
      what_it_solves: Providing shared environments (e.g., Atari, CARL, Nuscenes)
        and protocols that enable head-to-head comparison of world model architectures,
        training efficiency, and generalization.
      what_remains_open: Whether the task distribution covers the settings where world
        models are expected to help; stability of conclusions under different compute
        budgets, implementations, and hyperparameter choices.
    - line: Physics-informed and dynamics-aware evaluation
      what_it_solves: Assessing whether world models capture underlying physical laws
        (via depth, keypoint dynamics, or driving dynamics) rather than just visual
        appearance, enabling more realistic simulation for robotics and autonomous
        driving.
      what_remains_open: Correlation between physics-focused metrics and downstream
        decision-making performance; generalization across unseen object properties
        and environmental conditions.
    consensus:
    - 'World models need evaluation beyond reconstruction quality: long-term consistency,
      memory, and controllability are critical weaknesses that standard benchmarks
      fail to expose.'
    - Video-based, interactive benchmarks with closed-loop or loop-based navigation
      protocols are necessary to measure temporal coherence and action-conditioned
      prediction.
    - Current popular benchmarks (e.g., Atari 100k) remain useful for efficiency comparisons
      but are insufficient to guarantee capability in complex, real-world scenarios.
    disagreements:
    - 'Evaluation emphasis: some works prioritize visual fidelity (e.g., using diffusion-based
      generation) while others focus on physical plausibility or latent consistency,
      leading to different metric designs.'
    - 'Open-loop vs. closed-loop: there is tension between using fixed video prediction
      datasets for reproducibility and building interactive environments that capture
      true agent-environment feedback.'
    - 'Domain specificity: benchmarks are fragmented across game simulations, driving
      datasets, and robotic manipulation, making it unclear whether improvements in
      one domain transfer to others.'
    open_questions:
    - How can we design benchmarks whose metrics strongly correlate with downstream
      task performance (e.g., policy learning, planning) in real-world deployments?
    - Do current diagnostic benchmarks adequately cover the long-tail dynamics and
      memory demands that world models will face outside curated datasets?
    - What is the minimal set of evaluation dimensions that guarantees a world model's
      usefulness across diverse applications, and how can we standardize reporting
      to ensure reproducibility across compute scales?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型一致性与控制的诊断基准
      解决的问题: 探测空间一致性、记忆保持和动作控制等具体能力，这些能力无法通过逐帧生成质量或总分来反映。
      尚未覆盖: 诊断指标与下游规划或策略学习实际效用的一致性；策划的任务是否反映真实世界动态的多样性。
    - 路线: 用于模型比较的标准化任务套件和数据集平台
      解决的问题: 提供共享环境（如Atari、CARL、Nuscenes）和协议，使不同世界模型架构、训练效率和泛化性能可进行直接比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的场景；在不同算力预算、实现和超参数下结论的稳定性。
    - 路线: 物理信息与动力学感知的评估
      解决的问题: 评估世界模型是否捕捉底层物理规律（如深度、关键点动力学、驾驶动力学），而不仅仅是视觉外观，为机器人和自动驾驶提供更真实的模拟。
      尚未覆盖: 物理中心指标与下游决策性能的相关性；对未知物体属性和环境条件的泛化能力。
    共识:
    - 世界模型需要超越重建质量的评估：长期一致性、记忆和可控性是标准基准难以暴露的关键弱点。
    - 基于视频的交互式基准，采用闭环或循环导航协议，对于衡量时间连贯性和动作条件预测是必要的。
    - 当前流行的基准（如Atari 100k）在效率对比上仍有价值，但不足以确保在复杂真实场景中的能力。
    分歧:
    - 评估重点：部分工作优先考虑视觉保真度（如使用扩散生成），而其他工作则关注物理合理性或潜在一致性，导致指标设计不同。
    - 开环与闭环：使用固定视频预测数据集以保证可复现性，与构建交互式环境捕捉真实智能体-环境反馈之间存在张力。
    - 领域特异性：基准碎片化于游戏模拟、驾驶数据集和机器人操作之间，某个领域的改进是否可迁移到其他领域尚不明确。
    开放问题:
    - 如何设计基准，使其指标与真实部署中的下游任务表现（如策略学习、规划）强相关？
    - 当前诊断基准是否充分覆盖世界模型在策划数据集之外将面临的长期动态和记忆需求？
    - 能保证世界模型在多样应用中实用性的最小评估维度集合是什么？如何标准化报告以确保在不同计算规模下的可复现性？
