    targets, and deployment settings such as online physical learning versus single-GPU
    closed-loop simulation.'
  - 'Trend evolution: Within the current frontier, the top-paper evidence moves from
    2022 physical robot world-model learning to 2024-2026 driving and video world
    models with explicit action-fidelity benchmarks, controllability losses, and latency-aware
    closed-loop serving.'
  - 'Open questions: Long-horizon spatial and action consistency, generalization beyond
    single datasets or robot platforms, and independent verification of code, datasets,
    and metrics remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中在作为可控视觉模拟器使用的学习型世界模型系统，面向具身智能体和自动驾驶，而非通用软件平台。
  - 研究共性：利用视频或交互数据构建前向模型，以动作或上下文为条件生成未来状态，并通过下游控制、基准分数或物理机器人学习进行评估。
  - 关键差异：生成骨干、监督信号、评测目标和部署设置不同，如在线物理学习与单GPU闭环模拟、显式上下文与预训练视频先验。
  - 趋势演进：在当前前沿内，从2022年物理机器人世界模型学习，演进到2024-2026年自动驾驶和视频世界模型，强调动作保真度基准、可控性损失和低延迟闭环服务。
  - 开放问题：长时程空间和动作一致性、跨数据集或机器人平台的泛化、以及代码、数据集和指标的独立复现验证仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Learned world-model simulation stacks
      what_it_solves: Turning video or interaction data into forward models that generate
        future visual states for agent training, evaluation, and closed-loop rollouts.
      what_remains_open: Long-horizon consistency, physical plausibility, and generalization
        beyond the source environment remain unevenly verified.
    - line: Action-controllable video generation systems
      what_it_solves: Aligning generated future frames with high-level commands, trajectories,
        or low-level controls in driving and robotics.
      what_remains_open: Action fidelity is still imperfect in state-of-the-art models,
        and evidence is limited to a small set of datasets and sensor configurations.
    - line: Real-time and physical deployment pipelines
      what_it_solves: Meeting online or closed-loop requirements, including direct
        physical robot learning and sub-second driving simulation latency on a single
        GPU.
      what_remains_open: Hardware-specific generalization, multi-GPU scalability,
        and behavior under distribution shifts or long deployments are not fully shown.
    - line: Evaluation artifacts and benchmarks
      what_it_solves: Providing datasets and metrics for spatial consistency and action
        fidelity in world-model outputs.
      what_remains_open: Metrics and benchmarks are early-stage; independent reproduction
        across teams and coverage beyond single environments are missing.
    consensus:
    - 'World models are framed as runnable simulators: they take observations and
      actions or context and predict future visual states.'
    - Action controllability and task-specific fidelity are treated as central system
      properties, not only pixel-level generation quality.
    - Several systems use generated rollouts for downstream policy training or action
      evaluation, making the model part of a closed-loop pipeline.
    - Public code, datasets, or benchmark artifacts are present in several top papers,
      but independent evaluation across teams remains limited.
    disagreements:
    - 'Generative backbone: some systems use recurrent state-space dynamics for imagination,
      while others use diffusion or frame-level autoregressive generation.'
    - 'Supervision signal: some train with explicit observable context or trajectory
      conditioning, while others use pretrained video priors or physics-informed auxiliary
      objectives.'
    - 'Evaluation target: spatial loop consistency, action fidelity, visual fidelity,
      and physical robot learning efficiency are emphasized differently across the
      evidence.'
    - 'Deployment setting: the systems range from offline benchmark evaluation to
      online physical robot learning and single-GPU closed-loop driving simulation.'
    open_questions:
    - How well do loop-consistency and action-fidelity benchmarks transfer to environments
      beyond Minecraft and nuScenes?
    - What metric can capture physical plausibility and closed-loop action adherence
      without requiring dense ground-truth future video?
    - Can systems trained on specific robot platforms or driving datasets maintain
      performance under new hardware, sensor layouts, or out-of-distribution conditions?
    - Do low-latency single-GPU results translate to multi-agent or safety-critical
      real-time deployment where larger scale and reliability are required?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 学习型世界模型模拟栈
      解决的问题: 将视频或交互数据转化为前向模型，生成未来视觉状态，用于智能体训练、评测和闭环推演。
      尚未覆盖: 长时程一致性、物理合理性以及跨源环境的泛化仍未得到一致验证。
    - 路线: 动作可控视频生成系统
      解决的问题: 让生成的未来帧与高层指令、轨迹或低层控制信号对齐，服务于驾驶和机器人任务。
      尚未覆盖: 最先进模型的动作保真度仍不完善，证据集中于少量数据集和传感器配置。
    - 路线: 实时与物理部署流水线
      解决的问题: 满足在线或闭环需求，包括直接物理机器人学习，以及单GPU上的亚秒级驾驶模拟延迟。
      尚未覆盖: 硬件相关泛化、多GPU可扩展性，以及分布偏移或长时部署下的表现尚未充分验证。
    - 路线: 评测工件与基准
      解决的问题: 提供数据集和指标，用于衡量世界模型输出的空间一致性和动作保真度。
      尚未覆盖: 指标和基准仍处早期，跨团队独立复现和单一环境之外的覆盖不足。
    共识:
    - 世界模型被定位为可运行模拟器：接收观测和动作或上下文，预测未来视觉状态。
    - 动作可控性和任务相关保真度被视为核心系统属性，而非仅像素级生成质量。
    - 多个系统将生成推演用于下游策略训练或动作评估，使模型成为闭环流水线的一部分。
    - 部分研究发布了代码、数据集或基准工件，但跨团队的独立评测验证仍然有限。
    分歧:
    - 生成骨干不同：有的系统使用循环状态空间动力学进行想象，有的使用扩散或帧级自回归生成。
    - 监督信号不同：有的依赖显式可观测上下文或轨迹条件，有的使用预训练视频先验或物理信息辅助目标。
    - 评测目标不同：空间循环一致性、动作保真度、视觉保真度以及物理机器人学习效率各有侧重。
    - 部署设置不同：从离线基准评测到在线物理机器人学习，再到单GPU闭环驾驶模拟。
    开放问题:
    - 循环一致性和动作保真度基准在Minecraft和nuScenes之外的环境中能否迁移？
    - 什么样的指标能在缺少稠密真实未来视频时，衡量物理合理性和闭环动作遵循度？
    - 在特定机器人平台或驾驶数据集上训练的系统，面对新硬件、传感器布局或分布外条件时是否仍有效？
    - 单GPU低延迟结果能否扩展到多智能体或安全关键的实时部署中？
