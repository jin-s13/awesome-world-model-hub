  related_work_outline:
  - 'Mainstream direction: Domain applications of world models concentrate on driving
    and robot learning, where generative video models serve as forward predictors
    and policy/dynamics learners; examples include MaskGWM for multi-view driving
    prediction and UWM for robot video-action pretraining.'
  - 'Shared research pattern: Papers share self-supervised or generative training
    objectives, condition on domain signals such as actions, language, context, or
    physics cues, and evaluate through rollout quality, benchmark scores, or policy
    training rather than perceptual quality alone.'
  - 'Key differences: Architectures include recurrent state-space, Transformer/VAE,
    diffusion Transformer, and unified video-action diffusion; supervision includes
    context, actions, language, depth/keypoints, and masks; evaluation targets range
    from Atari human score to zero-shot dynamics, spatial consistency, and memory/action
    control.'
  - 'Trend evolution: Within the visible 2023-2026 frontier, the field moves from
    efficient model-based RL on Atari toward contextual zero-shot generalization,
    then toward robot and driving generative world models and dedicated consistency/action-control
    benchmarks.'
  - 'Open questions: Do benchmark and simulation gains transfer to real-world safety
    and operational outcomes? Can world models generalize across unseen action spaces,
    embodiments, or dynamics without strong context assumptions? How can long-horizon
    memory consistency and physical plausibility be maintained?'
  related_work_outline_zh:
  - 主流方向：世界模型的领域应用集中于自动驾驶与机器人学习，生成式视频模型作为前向预测器和策略/动力学学习器；如MaskGWM用于多视角驾驶预测，UWM用于机器人视频-动作预训练。
  - 研究共性：论文共享自监督或生成式训练目标，以动作、语言、上下文或物理线索为条件，并通过推演质量、基准分数或策略训练评估，而非仅看感知质量。
  - 关键差异：架构包括循环状态空间、Transformer/VAE、扩散Transformer和统一视频-动作扩散；监督信号包括上下文、动作、语言、深度/关键点和掩码；评测目标从Atari人类分到零样本动力学、空间一致性与记忆/动作控制。
  - 趋势演进：在可见的2023-2026前沿内，趋势从Atari高效基于模型的强化学习走向上下文零样本泛化，再到机器人和驾驶生成式世界模型以及专用一致性/动作控制基准。
  - 开放问题：基准与仿真收益能否迁移到真实安全与运行结果？不作强上下文假设时，世界模型能否跨未知动作空间、本体或动力学泛化？长时域记忆一致性与物理合理性如何维持？
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting generative world models to robot manipulation and task-level
        planning by composing language primitives, physics cues, or unified action-video
        diffusion.
      what_remains_open: Generalization beyond simulation and seen primitives, cross-embodiment
        transfer, and real-robot execution evidence remain sparse.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Long-horizon, multi-view driving scene prediction and scalable
        diffusion masking for learning driving world models.
      what_remains_open: Alignment between validation gains on driving datasets and
        closed-loop real-world safety or operational utility has not been established.
    - line: Interactive agents and games
      what_it_solves: Action-conditioned policy learning and benchmark-based evaluation
        of spatial memory, action control, contextual dynamics, and data-efficient
        RL in game environments.
      what_remains_open: Generalization across action spaces, environment rules, and
        long-term memory consistency beyond the constructed benchmarks remains unresolved.
    consensus:
    - Generative world models are treated as reusable forward models that support
      policy training, planning, or evaluation rather than as standalone perceptual
      predictors.
    - Domain-specific conditioning through actions, language instructions, context
      variables, depth, keypoints, or masks is becoming standard for improving generalization
      and physical plausibility.
    - Evaluation increasingly pairs visual quality with task-oriented or consistency
      metrics such as zero-shot returns, scene-graph consistency, or memory/action-control
      scores.
    disagreements:
    - 'Representation differs: recurrent state-space, Transformer/VAE hybrids, diffusion
      Transformers, and unified video-action diffusion architectures are used for
      different domains.'
    - 'Supervision and priors differ: some methods rely on observable context or language
      parsing, while others use physics-oriented depth/keypoints or mask reconstruction.'
    - 'Evaluation target and deployment setting differ: Atari human-normalized performance,
      robot policy transfer, driving video prediction, and spatial/action consistency
      benchmarks reflect distinct outcome definitions across simulation, driving datasets,
      and large multitask robot data.'
    open_questions:
    - Do driving and robot world-model improvements translate to real-world safety,
      operational reliability, or physical execution outcomes?
    - Can world models generalize to unseen action spaces, embodiments, and environment
      dynamics without assuming observable context values or pre-parsed language primitives?
    - How should long-horizon memory consistency and physical plausibility be measured
      and improved beyond existing loop-navigation or closed-loop benchmark setups?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将生成式世界模型适配到机器人操作与任务规划中，组合语言原语、物理线索或统一动作-视频扩散。
      尚未覆盖: 仿真和已见原语之外的泛化、跨本体迁移以及真实机器人执行证据仍然不足。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 长时域、多视角驾驶场景预测，以及用于学习驾驶世界模型的可扩展扩散掩码建模。
      尚未覆盖: 驾驶数据集上的验证提升与真实闭环安全或运行收益之间的一致性尚未证实。
    - 路线: 交互式智能体与游戏
      解决的问题: 在交互式游戏环境中进行动作条件策略学习，并评测空间记忆、动作控制、上下文动力学与数据高效强化学习。
      尚未覆盖: 跨动作空间、环境规则变化以及超出已有基准的长期记忆一致性泛化仍未解决。
    共识:
    - 生成式世界模型被作为可复用的前向模型，用于策略训练、规划或评测，而不是单纯作为感知预测器。
    - 通过动作、语言指令、上下文变量、深度、关键点或掩码进行领域条件化，已成为提升泛化性与物理合理性的常见做法。
    - 评测越来越同时关注视觉质量与任务导向或一致性指标，如零样本回报、场景图一致性、记忆/动作控制分数。
    分歧:
    - 表示方式不同：循环状态空间、Transformer/VAE 混合、扩散 Transformer 和统一视频-动作扩散架构分别用于不同领域。
    - 监督与先验不同：部分方法依赖可观测上下文或语言解析，部分方法使用面向物理的深度/关键点或掩码重建。
    - 评测目标与部署场景不同：Atari人类标准化分数、机器人策略迁移、驾驶视频预测和空间/动作一致性基准反映不同的结果定义；证据覆盖仿真、驾驶数据集和大规模多任务机器人数据。
    开放问题:
    - 驾驶与机器人世界模型的提升能否迁移到真实安全、运行可靠性或物理执行结果？
    - 在不假设上下文可观测或语言原语可解析的情况下，世界模型能否泛化到未知动作空间、本体和环境动力学？
    - 如何在现有循环导航或闭环基准之外，衡量并改善长时域记忆一致性与物理合理性？
