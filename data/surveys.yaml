  related_work_outline:
  - 'Mainstream direction: Building evaluation benchmarks for world models that go
    beyond pixel-level generation quality to assess spatial consistency, memory, action
    controllability, and physical plausibility across diverse embodied environments.'
  - 'Shared research pattern: Proposing a dataset or task with targeted stress tests,
    defining a metric that captures a specific capability (e.g., scene graph consistency,
    memory consistency), and benchmarking existing world models to reveal their limitations.'
  - 'Key differences: The evaluated capability differs—spatial loop consistency (LoopNav),
    memory and action control (MIND), physical plausibility and action adherence (PAVXploreRL,
    RoboScape), or zero-shot generalization under context shift (cRSSM). Environments
    also vary from Minecraft to driving and robotic manipulation.'
  - 'Trend evolution: The frontier is shifting from single aggregate metrics toward
    multi-dimensional, semantically grounded evaluations that probe long-horizon consistency
    and cross-domain generalization, with a growing emphasis on open-source benchmarks
    and reproducible frameworks.'
  - 'Open questions: Whether proxy metrics like spatial consistency or action fidelity
    correlate with downstream task success; how to verify that benchmark conclusions
    generalize across different platform implementations and compute budgets; and
    how to move beyond curated simulation datasets to real-world deployment settings.'
  related_work_outline_zh:
  - 主流方向：为世界模型构建超越像素级生成质量的评估基准，检验空间一致性、记忆、动作可控性和物理合理性等跨具身环境的能力。
  - 研究共性：提出包含针对性压力测试的数据集或任务，定义捕获特定能力（如场景图一致性、记忆一致性）的指标，并对现有世界模型进行基准测试以揭示其局限性。
  - 关键差异：评估的能力维度不同——空间回路一致性（LoopNav）、记忆与动作控制（MIND）、物理合理性与动作遵循（PAVXploreRL、RoboScape），或上下文偏移下的零样本泛化（cRSSM）；环境也从Minecraft跨至驾驶和机器人操作。
  - 趋势演进：前沿正从单一聚合指标转向多维度、语义化的评估，探究长时域一致性和跨域泛化，并越来越强调开源基准和可复现框架。
  - 开放问题：空间一致性或动作保真度等代理指标是否与下游任务成功相关；如何验证基准结论在不同实现和算力预算下是否稳定；以及如何从策划的仿真数据集过渡到真实部署场景。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets (e.g., loop-based navigation,
        varied action spaces) that make world-model claims comparable across spatial
        consistency, memory, and action control.
      what_remains_open: Whether the task distribution covers the full range of settings
        where world models are expected to help, and how well curated simulation data
        transfers to real-world deployment.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate scores, using metrics like scene graph consistency,
        memory consistency, and action fidelity.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; the sensitivity of metrics to evaluation hyperparameters
        remains unquantified.
    - line: Comparable baselines and reporting
      what_it_solves: Enables reproducible auditing through common baselines, open-source
        artifacts, and standardized evaluation protocols (e.g., Atari 100k, NuScenes,
        CARL).
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations and compute budgets, and the lack of power analysis or confidence
        intervals in reported comparisons.
    consensus:
    - World models need evaluation beyond pixel-level reconstruction quality, targeting
      specific capabilities such as spatial consistency, memory, and action controllability.
    - Benchmarks should provide diverse scenes and action spaces, with closed-loop
      or revisited evaluation to test long-horizon stability.
    - Open-source datasets and evaluation frameworks are essential for reproducibility
      and fair comparison.
    - Current world models exhibit significant weaknesses in long-term memory and
      cross-action-space generalization, indicating that new benchmarks are uncovering
      genuine gaps.
    disagreements:
    - 'The choice of evaluated capability: some works focus on spatial consistency
      through loop navigation, others on memory and action control, and others on
      physical plausibility and zero-shot generalization, reflecting different priorities
      in what constitutes a useful world model.'
    - 'The environment and modality: Minecraft-based benchmarks rely on synthetic,
      controllable worlds, while driving and robotic benchmarks use real-world or
      realistic simulators, leading to different trade-offs in controllability and
      domain gap.'
    - 'Evaluation protocol: whether to use fixed offline datasets or interactive online
      evaluation with world models generating rollouts; the latter can introduce computational
      overhead and reproducibility concerns.'
    - 'The role of baselines: some benchmarks directly compare existing world models,
      while others propose new model variants as baselines, making it harder to isolate
      benchmark difficulty from model capability improvements.'
    open_questions:
    - How can we systematically verify that improvements on proxy metrics like spatial
      consistency or action control translate into better performance on downstream
      tasks such as planning or policy learning?
    - What is the statistical reliability of current benchmark rankings—do we need
      confidence intervals or power analyses to claim superiority?
    - How do these benchmarks perform when deployed in real-world settings with uncurated
      sensor noise and distribution shifts, beyond the publicly available simulation
      datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集（如回路导航、多样化动作空间），使世界模型在空间一致性、记忆和动作控制等方面具有可比性。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部设置，以及策划的仿真数据能否迁移到真实场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验预测、可控性、鲁棒性和决策效用，采用场景图一致性、记忆一致性和动作保真度等指标。
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致；指标对评估超参数的敏感性尚未量化。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、开源工件和标准化评估协议（如Atari 100k、NuScenes、CARL）实现可审计的复现。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定，以及报告比较中缺乏统计功效分析或置信区间。
    共识:
    - 世界模型需要超越像素级重建质量的评估，针对空间一致性、记忆和动作可控性等特定能力。
    - 基准应提供多样化的场景和动作空间，并通过闭环或可复现评估来测试长时域稳定性。
    - 开源数据集和评估框架对于可复现性和公平比较至关重要。
    - 当前世界模型在长期记忆和跨动作空间泛化方面存在显著弱点，表明新基准揭示了真正的差距。
    分歧:
    - 评估能力的选择：有些工作关注空间回路一致性，有些关注记忆和动作控制，另一些关注物理合理性和零样本泛化，反映了对世界模型效用的不同优先级。
    - 环境和模态：基于Minecraft的基准依赖合成可控世界，而驾驶和机器人基准使用真实或逼真模拟器，导致可控性和领域差距的权衡不同。
    - 评估协议：使用固定离线数据集还是与世界模型生成的推演进行交互式在线评估；后者可能引入计算开销和可复现性问题。
    - 基线的角色：有些基准直接比较现有世界模型，其他则提出新的模型变体作为基线，使得难以将基准难度与模型能力提升分离。
    开放问题:
    - 如何系统验证空间一致性或动作控制等代理指标的提升能转化为下游任务（如规划或策略学习）的更好性能？
    - 当前基准排名的统计可靠性如何——是否需要置信区间或统计功效分析来支撑优越性声明？
    - 这些基准在带有未处理传感器噪声和分布偏移的真实场景中表现如何，能否超越公开的仿真数据集？
