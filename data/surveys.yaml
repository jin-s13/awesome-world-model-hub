    line_of_work_matrix:
    - line: Benchmark-driven evaluation platforms for world models
      what_it_solves: Creates datasets and metrics to test spatial and action fidelity,
        turning informal generation quality into measurable model behavior.
      what_remains_open: Evidence is concentrated in Minecraft or driving scenes;
