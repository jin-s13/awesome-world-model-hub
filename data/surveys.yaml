  related_work_outline:
  - 'Mainstream direction: Surveys and taxonomies are converging on world models as
    a unifying framework, spanning video generation, embodied AI, and autonomous driving.
    The dominant thrust is to systematize fragmented methods into structured design
    spaces—covering latent representations, action-conditioned controllability, long-horizon
    memory, and evaluation protocols—rather than introducing new model architectures.'
  - 'Shared research pattern: Multiple works structure the field by identifying a
    set of core technical challenges (e.g., action-conditioned generation, temporal
    consistency, real-time interactivity), then map existing methods onto these axes
    and propose benchmarks or evaluation suites. This pattern appears across general
    world model surveys and domain-specific taxonomies alike.'
  - 'Key differences: Surveys differ in scope granularity: some assess a single model''s
    simulation capability (e.g., Sora), others cover interactive video world modeling
    broadly, and still others build a latent-space taxonomy for a specific domain
    like automated driving. The evaluation frameworks they propose range from purely
    conceptual to partially implemented, and the degree of empirical validation varies
    substantially.'
  - 'Trend evolution: From 2022 to 2026, the field moved from early demonstrations
    of world models on physical robots (DayDreamer) toward systematic synthesis efforts.
    By 2024–2026, comprehensive surveys and unifying taxonomies emerged, accompanied
    by proposals for standardized benchmarks. The trend is toward tighter integration
    of evaluation methodology with design-space organization.'
  - 'Open questions: Whether proposed taxonomies and evaluation frameworks can be
    empirically validated at scale; how to align evaluation protocols across diverse
    application domains (robotics, driving, open-world exploration); and how rapidly
    evolving methods can be incorporated into surveys without rendering them obsolete.'
  related_work_outline_zh:
  - 主流方向：综述与分类法正汇聚于世界模型这一统一框架，覆盖视频生成、具身AI和自动驾驶。主要推力是将碎片化方法系统化为结构化的设计空间——涵盖潜在表示、动作条件可控性、长时记忆和评估协议——而非引入新的模型架构。
  - 研究共性：多篇工作通过识别一组核心技术挑战（如动作条件生成、时间一致性、实时交互），然后将现有方法映射到这些轴上，并提出基准或评估套件来组织领域。这一模式同时出现在通用世界模型综述和领域特定分类法中。
  - 关键差异：综述在覆盖粒度上不同：有的评估单一模型的模拟能力（如Sora），有的广泛覆盖交互式视频世界建模，还有的为自动驾驶等特定领域构建潜在空间分类法。它们提出的评估框架从纯概念性到部分实现不等，实证验证程度差异显著。
  - 趋势演进：从2022年到2026年，领域从物理机器人上世界模型的早期演示（DayDreamer）走向系统化综合。到2024-2026年，出现了全面的综述和统一分类法，并伴随标准化基准的提案。趋势是评估方法与设计空间组织的更紧密整合。
  - 开放问题：提出的分类法和评估框架能否在大规模上得到实证验证；如何在不同应用领域（机器人、驾驶、开放世界探索）之间对齐评估协议；以及如何将快速演进的方法纳入综述而不使其过时。
  literature_review:
    line_of_work_matrix:
    - line: Interactive video world modeling surveys and roadmaps
      what_it_solves: Organizes the scattered literature on action-conditioned video
        generation into a structured overview of application scenarios, world state
        evolution, and scene modality, while identifying controllability, long-horizon
        memory, and real-time responsiveness as core technical challenges.
      what_remains_open: The synthesis relies on current trends and may not cover
        the newest methods; the proposed future directions are not empirically validated,
        and the mapping between challenges and specific solutions remains qualitative
        rather than experimentally grounded.
    - line: General world model capability assessment
      what_it_solves: Evaluates whether a specific generative model (e.g., Sora) exhibits
        world-simulator properties by examining its physical-law comprehension across
        video generation, autonomous driving, and autonomous agent domains, linking
        these subfields under a unified world-model umbrella.
      what_remains_open: The depth of physical-law understanding is assessed qualitatively
        rather than through rigorous, reproducible metrics; the survey does not provide
        a systematic comparison protocol that can be reused across different generative
        models, and the discussion of limitations remains high-level.
    - line: Domain-specific latent world model taxonomies
      what_it_solves: Proposes a unified latent-space framework for world models in
        automated driving, organizing the design space by latent representations and
        structural priors, and articulating cross-cutting internal mechanics alongside
        evaluation prescriptions to reduce the sim-to-real gap.
      what_remains_open: The framework is entirely theoretical with no empirical validation
        or implementation; the taxonomy may miss edge cases or future architectures,
        and the proposed evaluation suite—including closed-loop metrics and resource-aware
        inference cost—has not been tested on any existing driving world model.
    - line: World model methods for compositional and persistent dynamics
      what_it_solves: Addresses the technical gap of generalizing world models to
        unseen task combinations (RoboDreamer) and to out-of-sight entities that persist
        and evolve when unobserved (LiveWorld), extending the capability boundary
        of video-based world simulators.
      what_remains_open: RoboDreamer's generalization is limited to combinations of
        primitives seen during training, and evaluation is simulation-only; LiveWorld
        lacks reported limitations in the available evidence, and its reproducibility
        score is low (38), indicating a verification gap for independent replication.
    consensus:
    - World models are being positioned as a central abstraction that unifies video
      generation, embodied AI, and autonomous driving under a common framework of
      learning predictive dynamics from sensory data.
    - Action-conditioned controllability, long-horizon temporal consistency, and real-time
      interactivity are consistently identified as the three bottleneck challenges
      that current world models must overcome to become practical simulators.
    - There is broad agreement that the field lacks standardized evaluation protocols,
      and that existing benchmarks are fragmented across application domains, making
      cross-method comparison unreliable.
    - Latent representations—whether continuous states, discrete tokens, or hybrid
      forms—are recognized as a key design dimension that shapes both the expressiveness
      and the computational efficiency of world models.
    disagreements:
    - 'Scope of synthesis: some works assess a single prominent model''s simulation
      capability, while others attempt to cover the entire interactive world modeling
      landscape, and still others restrict their taxonomy to a single application
      domain such as automated driving. These scoping choices lead to different organizing
      principles and different conclusions about what the field''s priorities should
      be.'
    - 'Evaluation philosophy: conceptual surveys propose evaluation frameworks without
      implementing them, while method papers evaluate on specific benchmarks with
      concrete metrics. This creates a gap between what the community recommends as
      evaluation practice and what is actually measured in empirical work.'
    - 'Definition of world model: the term spans video generators that predict future
      frames, latent dynamics models used for planning in reinforcement learning,
      and 3D persistent state simulators. Surveys differ in which of these they include,
      leading to incompatible coverage.'
    - 'Role of real-world deployment: DayDreamer demonstrates learning directly on
      physical robots without simulators, while most surveyed works operate in simulated
      or pre-recorded video settings. The extent to which world model advances in
      simulation transfer to physical systems remains an open point of contention.'
    open_questions:
    - How can the proposed taxonomies and evaluation frameworks be empirically validated
      across a representative sample of existing world models, given that current
      evidence shows no implementation of these frameworks?
    - What is the minimum set of evaluation dimensions—such as controllability, temporal
      consistency, physical plausibility, and resource cost—that would enable fair
      comparison across video-based, latent-dynamics, and 3D-persistent world models?
    - How can surveys keep pace with the rapid release of new methods (2024–2026)
      without becoming outdated before publication, and what mechanisms would allow
      living surveys to incorporate new evidence systematically?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 交互式视频世界建模综述与路线图
      解决的问题: 将动作条件视频生成的零散文献组织为应用场景、世界状态演化和场景模态的结构化概览，同时识别可控性、长时记忆和实时响应作为核心技术挑战。
      尚未覆盖: 综合依赖于当前趋势，可能未涵盖最新方法；提出的未来方向未经实证验证，挑战与具体解决方案之间的映射仍是定性的，缺乏实验基础。
    - 路线: 通用世界模型能力评估
      解决的问题: 通过考察特定生成模型（如Sora）在视频生成、自动驾驶和自主智能体领域对物理规律的理解，评估其是否具备世界模拟器属性，将这些子领域统一在世界模型框架下。
      尚未覆盖: 物理规律理解的深度通过定性方式评估，而非严格、可复现的指标；综述未提供可跨不同生成模型复用的系统比较协议，对局限性的讨论仍停留在高层次。
    - 路线: 领域特定的潜在世界模型分类法
      解决的问题: 为自动驾驶中的世界模型提出统一的潜在空间框架，按潜在表示和结构先验组织设计空间，并阐述跨领域内部机制，同时提出评估方案以缩小仿真与现实的差距。
      尚未覆盖: 框架完全理论化，缺乏实证验证或实现；分类法可能遗漏边界情况或未来架构，所提出的评估套件——包括闭环度量和资源感知推理成本——未在任何现有驾驶世界模型上测试。
    - 路线: 面向组合泛化和持久动态的世界模型方法
      解决的问题: 解决世界模型向未见任务组合泛化（RoboDreamer）以及模拟视线外实体在未观察时持续演化（LiveWorld）的技术缺口，扩展基于视频的世界模拟器的能力边界。
      尚未覆盖: RoboDreamer的泛化仅限于训练中见过的原语组合，评估仅在仿真中进行；LiveWorld在可用证据中缺少局限性报告，且可复现性评分较低（38），表明独立复现存在验证缺口。
    共识:
    - 世界模型正被定位为一种核心抽象，将视频生成、具身AI和自动驾驶统一在从感知数据中学习预测动力学的共同框架下。
    - 动作条件可控性、长时域时间一致性和实时交互性被一致识别为当前世界模型必须克服的三大瓶颈挑战，才能成为实用的模拟器。
    - 普遍共识是领域缺乏标准化评估协议，现有基准在各应用领域之间碎片化，导致跨方法比较不可靠。
    - 潜在表示——无论是连续状态、离散令牌还是混合形式——被公认为塑造世界模型表达能力和计算效率的关键设计维度。
    分歧:
    - 综合范围：有的工作评估单一著名模型的模拟能力，有的尝试覆盖整个交互式世界建模领域，还有的将分类法限制在自动驾驶等单一应用领域。这些范围选择导致不同的组织原则和对领域优先事项的不同结论。
    - 评估理念：概念性综述提出评估框架但未实现，而方法论文在特定基准上以具体指标评估。这造成了社区推荐的评估实践与实际经验工作中测量的内容之间的差距。
    - 世界模型的定义：该术语涵盖预测未来帧的视频生成器、用于强化学习规划的潜在动力学模型以及3D持久状态模拟器。综述在包含哪些类型上存在差异，导致覆盖范围不可比。
    - 真实世界部署的角色：DayDreamer展示了直接在物理机器人上学习而无需模拟器，而大多数被综述的工作在仿真或预录视频环境中运行。世界模型在仿真中的进展有多少能迁移到物理系统，仍是一个争议的开放点。
    开放问题:
    - 鉴于当前证据显示这些框架未被实现，如何在一组有代表性的现有世界模型上实证验证所提出的分类法和评估框架？
    - 什么是最小评估维度集合——如可控性、时间一致性、物理合理性和资源成本——能够实现基于视频的、潜在动力学的和3D持久世界模型之间的公平比较？
    - 综述如何跟上2024-2026年新方法的快速发布而不在发表前过时，以及什么机制可以允许活体综述系统性地纳入新证据？
