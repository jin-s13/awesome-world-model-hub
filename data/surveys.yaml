    研究路线矩阵:
    - 路线: 基于潜在动力学的模型化强化学习
      解决的问题: 通过想象潜在轨迹学习策略，降低对模拟器依赖，并在可观测上下文变化下提升零样本泛化。
      尚未覆盖: 假设上下文值可观测；仅在CARL和少量物理机器人平台之外的泛化和真实部署证据不足。
    - 路线: 动作可控视觉仿真与实时部署
      解决的问题: 将动作或轨迹条件转为未来视频生成，用于自动驾驶和机器人闭环模拟，并优化可控性及低延迟推理。
      尚未覆盖: 长时域和跨视图一致性、nuScenes之外泛化以及单GPU之外的可扩展性尚未系统验证。
    - 路线: 物理信息与几何一致性视频生成
      解决的问题: 引入深度、关键点、结构或几何信号，使生成的未来帧更物理合理且几何连贯。
      尚未覆盖: 隐式物理表示缺乏独立物理合理性指标，也未在多样材料、交互和传感器配置中验证。
    - 路线: 基准与可复现评估工件
      解决的问题: 构建数据集、指标和开放评估框架，用于评测空间一致性及动作忠实度，支持比较与复用。
      尚未覆盖: 现有基准锚定在Minecraft或nuScenes等特定场景；跨团队复现和失败模式证据仍然不足。
    共识:
    - 学习式未来预测是共同基础：系统从历史与条件输入生成视频或潜在状态，而不是将感知与控制分开处理。
    - 可控性成为当前系统要求：动作、轨迹、上下文或目标条件被显式加入，以提升下游策略学习或仿真价值。
    - 评测引入任务特定的一致性或忠实度信号，例如空间一致性、动作忠实度、物理合理性或零样本策略表现，而不只看图像质量。
    - 部分工作公开数据集、基准或代码，显示可复现评测趋势，但独立跨团队复现仍不足。
    分歧:
    - 表示方式不同：部分系统使用循环潜在状态空间动力学，部分系统适配扩散或自回归视频Transformer。
    - 条件接口不同：有的依赖可观测上下文值，有的依赖动作或轨迹指令，有的采用从目标到低层操控的分层控制。
    - 训练信号不同：物理信息深度/关键点目标、运动增强损失和上下文条件潜在动力学体现了不同的现实性假设。
    - 评测场景不同：导航空间一致性、驾驶动作忠实度、真实机器人在线学习和基于模型的策略训练形成不同成功标准。
    - 部署约束不同：无模拟器的物理机器人学习与单GPU亚秒延迟的驾驶仿真意味着不同的系统权衡。
    开放问题:
    - 这些系统在分布偏移或超出分布的条件下如何保持长时程时间与跨视图一致性？
    - 需要哪些证据才能独立于视觉保真度和下游策略表现来证明物理合理性？
    - 当上下文或场景参数部分可观测时，潜在动力学模型与动作条件模型是否仍然校准？
    - 在证据包特定数据集和机器人平台之外存在哪些泛化边界？
    - 哪些缺失的代码、指标和局限性说明正在阻碍对系统能力的独立复现？
