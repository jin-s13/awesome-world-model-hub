  - 'Shared research pattern: Papers couple visual observation/state with action and
    attempt to improve action-frame alignment, physical plausibility, and downstream
    policy or planning utility.'
  - 'Key differences: They vary in generation backbone, adaptation strategy, alignment
    signal, evaluation target, and whether predictions serve control, planning, or
    reasoning.'
  - 'Trend evolution: Work moves from fine-grained action-conditioned generation in
    2024 toward larger unified models and human-preference/DPO alignment, with 2026
    adding mechanistic taxonomies and test-time verification studies.'
  - 'Open questions: Whether visual fidelity predicts physical and causal correctness;
