  related_work_outline_zh:
  - 主流方向：构建动作可控的世界模型作为自动驾驶与机器人领域的视频模拟器，围绕视觉保真度与动作忠实度展开评测。
  - 研究共性：以动作与历史帧为条件，使用生成式视频模型（扩散或自回归）模拟未来状态，并借助运动、结构或物理辅助损失提升质量。
  - 关键差异：架构选择（扩散/自回归/循环状态空间）、物理知识融入方式（显式深度/关键点 vs. 隐式）、以及长时域一致性与多视图几何的处理策略。
  - 趋势演进：2022–2026 年从孤立的世界模型方法向统一仿真平台演进，标准化基准、动作可控性与实时推理受到更多关注，整体处于当前前沿。
  - 开放问题：仿真器在安全关键部署中的可靠性、对未知动态与环境的泛化、以及生成指标与下游策略性能的对齐。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world models as simulators
      what_it_solves: Generating future video frames conditioned on action commands
        to enable closed-loop simulation for autonomous driving and robotic policy
        training.
      what_remains_open: Guaranteeing physical plausibility under out-of-distribution
        actions, maintaining long-horizon temporal consistency, and achieving multi-view
        geometric alignment without per-scene tuning.
    - line: Benchmarks and evaluation protocols for world model fidelity
      what_it_solves: Providing standardized datasets and metrics (e.g., action fidelity,
        spatial consistency scores) to compare world models beyond generic video quality.
      what_remains_open: Independent reproduction of benchmarks across diverse simulation
        environments, and establishing metrics that correlate with downstream task
        success rather than only pixel-level similarity.
    - line: Physics-informed world model architectures
      what_it_solves: Incorporating physical priors such as depth estimation, keypoint
        dynamics, or scene graph consistency into video generation to improve realism
        and structural stability.
      what_remains_open: Extending physical constraints to complex interactions (contact,
        collisions) and ensuring that physics-informed losses do not degrade visual
        fidelity in non-rigid scenes.
    - line: Leveraging pre-trained video generative models for world simulation
      what_it_solves: Turning large, pre-trained video models into controllable world
        simulators with lightweight action-conditioned adapters, reducing the need
        for domain-specific training.
      what_remains_open: Domain gap between pre-training data and target tasks, and
        the trade-off between preserving fine-grained appearance and enhancing dynamic
        responsiveness.
    - line: Real-time interactive serving of world models
      what_it_solves: Achieving low-latency, single-GPU inference for closed-loop
        driving simulation, enabling practical deployment in online decision-making
        loops.
      what_remains_open: Scalability to multi-GPU or safety-critical settings, maintaining
        quality under strict latency budgets, and robustness to sensor noise and runtime
        perturbations.
    consensus:
    - Action-conditioned video generation is the core mechanism for world simulation,
      with most works conditioning on ego-vehicle trajectories or robot actions.
    - Long-horizon consistency is a central challenge, and autoregressive or latent
      replacement strategies are widely adopted to mitigate drift.
    - Evaluation requires both visual quality metrics (FID, FVD) and task-specific
      metrics such as action fidelity or spatial consistency, with a growing focus
      on loop-closure tests.
    - Pre-trained or large-scale training on driving/robotics datasets improves generalization,
      but additional inductive biases (structure, physics) are needed for realistic
      simulation.
    disagreements:
    - 'Disagreement on model architecture: some methods use diffusion transformers
      with structured control, while others rely on recurrent state-space models or
      autoregressive transformers, leading to different trade-offs between quality
      and controllability.'
    - 'Disagreement on physics integration: explicit depth prediction and keypoint
      dynamics are used in some works, whereas others rely on motion-reinforced losses
      without explicit 3D supervision, resulting in varying levels of physical plausibility.'
    - 'Disagreement on evaluation scope: benchmarks are often limited to single datasets
      (nuScenes, CARL, Minecraft), making it unclear whether world model improvements
      transfer across domains or to open-ended real-world interactions.'
    open_questions:
    - How can we design world models that remain physically plausible in long-horizon,
      interactive loops without accumulating catastrophic errors?
    - What metrics beyond FID/FVD and action fidelity can reliably predict the utility
      of a world model for downstream policy learning or real-world deployment?
    - Can world models trained on static, offline driving datasets be adapted to dynamic,
      online scenarios with human-in-the-loop or adversarial agents?
    - What are the minimal system requirements (latency, memory, compute) for a world
      model to be safely deployed in real-time autonomous driving or safety-critical
      robotics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控世界模型作为仿真器
      解决的问题: 以动作指令为条件生成未来视频帧，实现自动驾驶与机器人策略训练的闭环仿真。
      尚未覆盖: 在分布外动作下保证物理合理性、维持长时域时间一致性，并在无需逐场景微调的情况下实现多视图几何对齐。
    - 路线: 世界模型保真度的基准与评测协议
      解决的问题: 提供标准化数据集与指标（如动作忠实度、空间一致性评分），超越通用视频质量来比较世界模型。
      尚未覆盖: 在不同仿真环境中独立复现基准，以及建立与下游任务成功率相关而非仅像素级相似的指标。
    - 路线: 物理信息驱动的世界模型架构
      解决的问题: 将深度估计、关键点动力学或场景图一致性等物理先验融入视频生成，提升真实感与结构稳定性。
      尚未覆盖: 将物理约束扩展到复杂交互（接触、碰撞），并确保物理信息损失不会降低非刚性场景的视觉保真度。
    - 路线: 利用预训练视频生成模型进行世界仿真
      解决的问题: 通过轻量级动作条件适配器将大型预训练视频模型转化为可控世界仿真器，减少领域特定训练需求。
      尚未覆盖: 预训练数据与目标任务之间的领域鸿沟，以及保留细粒度外观与增强动态响应之间的权衡。
    - 路线: 世界模型的实时交互服务
      解决的问题: 在单GPU上实现低延迟推理，用于闭环驾驶仿真，支持在线决策循环中的实际部署。
      尚未覆盖: 向多GPU或安全关键场景的扩展性、在严格延迟预算下保持质量，以及对传感器噪声和运行时扰动的鲁棒性。
    共识:
    - 动作条件视频生成是世界仿真的核心机制，大多数工作以自车轨迹或机器人动作作为条件。
    - 长时域一致性是核心挑战，自回归或潜在替换策略被广泛采用以缓解漂移。
    - 评测需要同时包含视觉质量指标（FID、FVD）和任务特定指标，如动作忠实度或空间一致性，且越来越关注闭环测试。
    - 基于大规模驾驶/机器人数据集的预训练或大规模训练能提升泛化能力，但仍需额外的结构或物理归纳偏置以实现逼真仿真。
    分歧:
    - 模型架构分歧：部分方法使用带有结构化控制的扩散变换器，其他则依赖循环状态空间模型或自回归变换器，导致质量与可控性之间的权衡不同。
    - 物理知识融入分歧：一些工作显式使用深度预测和关键点动力学，而另一些则依赖运动增强损失而无显式3D监督，造成物理合理性的差异。
    - 评测范围分歧：基准通常局限于单一数据集（nuScenes、CARL、Minecraft），难以判断世界模型的改进是否跨领域迁移或适用于开放式真实交互。
    开放问题:
    - 如何设计在长时域交互循环中不积累灾难性错误且保持物理合理性的世界模型？
    - 除FID/FVD和动作忠实度外，哪些指标能可靠预测世界模型对下游策略学习或实际部署的效用？
    - 基于静态离线驾驶数据集训练的世界模型能否适应包含人类参与或对抗智能体的动态在线场景？
    - 在实时自动驾驶或安全关键机器人中安全部署世界模型的最低系统要求（延迟、内存、计算）是什么？
