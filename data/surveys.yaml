  related_work_outline:
  - 'Mainstream direction: World model benchmarks are shifting from global video quality
    metrics to targeted capability probes such as spatial consistency, memory consistency,
    action control, and physical plausibility.'
  - 'Shared research pattern: Proposing a new dataset or evaluation protocol that
    isolates a specific failure mode of world models, then measuring multiple existing
    models to expose a capability gap.'
  - 'Key differences: Benchmarks differ in the evaluated capability (spatial consistency
    vs. memory-action coupling vs. physical plausibility), the environment domain
    (Minecraft, driving, robotics, Atari), and the closure type (open-loop generation
    vs. closed-loop interactive rollouts).'
  - 'Trend evolution: From 2023–2025, evaluation moved from standard Atari/RL benchmarks
    to domain-specific stress tests (LoopNav, MIND), with 2026 papers adding action
    exploration and multi-objective reward-based evaluation, indicating a push toward
    closing the loop between perception, action, and physics.'
  - 'Open questions: There is no unified protocol that spans capabilities and domains;
    proxy metrics are not yet validated against downstream decision quality; long-term
    memory and cross-action-space generalization remain underexplored.'
  related_work_outline_zh:
  - 主流方向：世界模型基准正从全局视频质量指标转向针对特定能力的探测，如空间一致性、记忆一致性、动作控制和物理合理性。
  - 研究共性：提出一个新的数据集或评估协议，隔离世界模型的一种特定失效模式，然后测量多个现有模型以暴露能力差距。
  - 关键差异：基准在评估能力（空间一致性 vs. 记忆-动作耦合 vs. 物理合理性）、环境领域（Minecraft、驾驶、机器人、Atari）和闭环类型（开环生成
    vs. 闭环交互式推演）上存在差异。
  - 趋势演进：2023–2025年间，评估从标准Atari/RL基准转向领域特定的压力测试（LoopNav、MIND），2026年的论文进一步加入动作探索和多目标奖励驱动评估，表明正朝着感知、动作和物理闭环的方向发展。
  - 开放问题：尚无跨能力和跨领域的统一协议；代理指标尚未在下游决策质量上得到验证；长期记忆和跨动作空间泛化仍探索不足。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates dedicated datasets and tasks that expose specific world
        model capabilities, such as spatial consistency in loop navigation (LoopNav)
        or memory-action coherence in diverse scenes (MIND), enabling standardized
        comparison.
      what_remains_open: Existing datasets cover only a few domains (Minecraft, driving,
        robotics) and action spaces; it is unclear whether tasks designed for these
        domains transfer to the full range of settings where world models are expected
        to be useful.
    - line: Metric and stress-test design
      what_it_solves: Defines capability-specific metrics beyond FVD/PSNR – e.g.,
        Scene Graph Consistency Score for spatial invariance, memory consistency and
        action control scores, or PAV objectives for physical plausibility and action
        adherence – to probe failure modes that aggregate video quality hides.
      what_remains_open: Alignment between these proxy metrics and actual downstream
        decision quality (e.g., policy performance or human preference) is not yet
        validated; the sensitivity of metrics to implementation choices and data distribution
        shifts is unknown.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common evaluation protocols and baselines (e.g., Atari
        100k, Nuscenes, CARL) that make results auditable across different world model
        architectures and training budgets.
      what_remains_open: Benchmark conclusions may not be stable across compute budgets
        or implementation details; most papers report scores on fixed datasets without
        verifying reproducibility across independent re-implementations, and there
        is no agreed reporting standard for uncertainty or failure analysis.
    consensus:
    - World model evaluation must go beyond pixel-level reconstruction quality to
      test structured capabilities like spatial consistency, temporal memory, and
      physical plausibility.
    - New benchmarks are needed because existing standard benchmarks fail to capture
      long-horizon consistency and action-conditioned generation quality.
    - Closed-loop or interactive evaluation offers a more faithful assessment of world
      model utility than open-loop video prediction scores.
    disagreements:
    - 'The capability to prioritize differs: one line focuses on spatial consistency
      as invariant under viewpoint changes, another on action control and memory across
      long sequences, and a third on physical plausibility of object interactions.'
    - Datasets are drawn from incompatible domains – block-based worlds (Minecraft),
      real-world driving (Nuscenes/Waymo), robotic manipulation, and Atari games –
      making cross-benchmark conclusions unreliable.
    - 'Evaluation protocols vary in interactivity: some benchmarks use static open-loop
      rollouts, while others adopt closed-loop revisited navigation, which changes
      the nature of the measured capability.'
    open_questions:
    - Can a single benchmark suite cover spatial, temporal, physical, and action aspects
      without overfitting to a narrow domain?
    - How do spatial consistency or memory scores correlate with policy performance
      in downstream tasks like navigation or manipulation?
    - What is the minimal set of stress tests that guarantees generalization to unseen
      environments and action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建专门的数据集和任务，暴露特定世界模型能力，如循环导航中的空间一致性（LoopNav）或多场景下的记忆-动作一致性（MIND），实现标准化比较。
      尚未覆盖: 现有数据集仅覆盖少数领域（Minecraft、驾驶、机器人）和动作空间；尚不清楚为这些领域设计的任务能否迁移到世界模型预期发挥作用的全部场景。
    - 路线: 指标与压力测试设计
      解决的问题: 定义超越FVD/PSNR的特定能力指标——例如空间不变性的场景图一致性分数、记忆一致性与动作控制分数，或物理合理性和动作一致性的PAV目标——以探测聚合视频质量所隐藏的失效模式。
      尚未覆盖: 这些代理指标与实际下游决策质量（如策略性能或人类偏好）之间的一致性尚未被验证；指标对实现选择和数据分布偏移的敏感性未知。
    - 路线: 可比基线与报告规范
      解决的问题: 提供通用评估协议和基线（如Atari 100k、Nuscenes、CARL），使不同世界模型架构和训练预算下的结果可审计。
      尚未覆盖: 基准结论可能在计算预算或实现细节变化下不稳定；多数论文仅在固定数据集上报告分数，未验证独立复现的可重复性，且缺乏关于不确定性或失败分析的统一报告标准。
    共识:
    - 世界模型评估必须超越像素级重建质量，以测试结构化能力，如空间一致性、时间记忆和物理合理性。
    - 需要新的基准，因为现有标准基准无法捕捉长时域一致性和动作条件生成质量。
    - 闭环或交互式评估比开环视频预测分数更能真实反映世界模型的实用性。
    分歧:
    - 优先关注的能力不同：一条路线关注视点变化下的空间一致性，另一条关注长序列中的动作控制与记忆，第三条关注物体交互的物理合理性。
    - 数据集来自互不兼容的领域——积木世界（Minecraft）、真实驾驶（Nuscenes/Waymo）、机器人操作和Atari游戏——导致跨基准结论不可靠。
    - 评估协议在交互性上存在差异：部分基准使用静态开环推演，而其他基准采用闭环重访导航，这改变了所测能力的性质。
    开放问题:
    - 一个统一的基准套件能否覆盖空间、时间、物理和动作各方面，同时避免过度拟合单一领域？
    - 空间一致性或记忆分数与下游任务（如导航或操作）中的策略性能如何关联？
    - 保证对未见环境和动作空间泛化所需的最小压力测试集是什么？
