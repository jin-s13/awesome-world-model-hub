  related_work_outline:
  - 'Mainstream direction: world models are being applied in driving, robotics, and
    interactive game environments for controllable future prediction, policy learning,
    and benchmarking.'
  - 'Shared research pattern: methods condition future generation on actions, language,
    goals, context, or initial frames, and evaluate with rollout, cross-dataset, or
    consistency metrics.'
  - 'Key differences: deployment domains, supervision signals, output levels, and
    evaluation targets split the works into driving realism, robot task execution,
    zero-shot dynamics transfer, and game-action consistency.'
  - 'Trend evolution: from sample-efficient Atari world models through contextual
    robot/RL generalization to 2024-2026 driving/robot unified video-action modeling
    and memory/action-control benchmarks.'
  - 'Open questions: real-world validity, cross-embodiment generalization, long-horizon
    consistency, and whether current benchmarks align with downstream outcomes; several
    papers lack verifiable artifacts or limitations.'
  related_work_outline_zh:
  - 主流方向：世界模型正被用于驾驶、机器人和交互式游戏环境中的可控未来预测、策略学习与基准评测。
  - 研究共性：方法以动作、语言、目标、上下文或初始帧为条件生成未来，并用 rollout、跨数据集或一致性指标评估。
  - 关键差异：部署领域、监督信号、输出层级和评测目标不同，分为驾驶真实感、机器人任务执行、零样本动力学迁移和游戏动作一致性等路线。
  - 趋势演进：从样本高效的 Atari 世界模型，到上下文化机器人/强化学习泛化，再到 2024-2026 年驾驶/机器人统一视频-动作建模和记忆/动作控制基准。
  - 开放问题：真实环境收益、跨本体泛化、长时域一致性以及当前基准是否对应下游结果仍待验证；部分论文缺少可核验工件或局限性说明。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon prediction
      what_it_solves: Generates future driving scenes from history and control/mask
        signals, targeting normal validation, long-horizon rollout, and cross-dataset
        zero-shot evaluation.
      what_remains_open: Whether simulator or generative realism gains align with
        real-world driving safety, operational reliability, and domain transfer beyond
        tested datasets.
    - line: Robot video-generation world models and policy learning
      what_it_solves: Uses language instructions, goal images, physics information,
        or coupled video-action diffusion to support robot imagination, policy training,
        and dynamics prediction.
      what_remains_open: Generalization to unseen primitive combinations, real-robot
        deployment, and transfer across datasets and embodiments remain underevidenced.
    - line: Context-conditioned model-based reinforcement learning world models
      what_it_solves: Incorporates observable context into latent state inference
        and dynamics modeling to improve zero-shot policy generalization to unseen
        task dynamics.
      what_remains_open: Assumes observable context and is verified on limited tasks;
        broader generalization to partially observed or open-world dynamics remains
        open.
    - line: Game and open-domain interactive world models and consistency benchmarks
      what_it_solves: Builds loop-based or closed-loop revisitable evaluation data
        for spatial consistency, memory consistency, and action control, while supporting
        sample-efficient policy learning in game environments.
      what_remains_open: Whether benchmark consistency scores align with downstream
        agent capability and whether long-term stability generalizes across scenes,
        games, and user interactions.
    consensus:
    - Most methods treat future states or videos as a controllable generative target
      conditioned on actions, language instructions, goal images, context variables,
      or initial observations.
    - Evaluation is shifting from single-step reconstruction toward rollout, closed-loop,
      cross-dataset, and consistency-oriented evidence.
    - Transformer and diffusion backbones are frequently used to scale video or latent
      dynamics, while stochastic or physics-informed components are introduced to
      improve plausibility.
    - 'Reproducibility signals are uneven: benchmark and dataset contributions tend
      to expose more artifacts, while several model-focused contributions lack limitation
      or baseline verification.'
    disagreements:
    - 'Deployment domain differs strongly: driving scenes, robot manipulation videos,
      Atari, and Minecraft imply incompatible dynamics, action spaces, and failure
      modes.'
    - 'Supervision differs: mask reconstruction, context-conditioned reinforcement
      learning objectives, physics-informed depth/keypoints, and coupled video-action
      diffusion impose different learning biases.'
    - 'Output level differs: pixel-space video generation, latent rollout for policies,
      or unified policy-and-dynamics models change what can be evaluated and transferred.'
    - 'Evaluation target differs: driving realism, robot task execution, zero-shot
      dynamics transfer, spatial/memory consistency, and game sample efficiency are
      not interchangeable evidence.'
    open_questions:
    - Do gains in video fidelity, rollout quality, or consistency scores translate
      into safer driving outcomes or real robot task success?
    - How well do these models generalize to unseen scenes, embodiments, action spaces,
      or user interactions beyond the training primitives, contexts, and datasets
      reported?
    - What level of physics supervision or memory architecture is necessary for long-horizon
      and physically plausible predictions?
    - Several model-focused papers lack verifiable code, baselines, or limitation
      details, so negative results and reproducibility remain open verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型与多视角、长时域预测
      解决的问题: 从历史视频和控制/掩码信号生成未来驾驶场景，支持正常验证、长时域 rollout 和跨数据集零样本评估。
      尚未覆盖: 仿真或生成真实感的提升是否对应真实驾驶安全、运营可靠性以及超出测试数据集的域迁移仍不明确。
    - 路线: 机器人视频生成世界模型与策略学习
      解决的问题: 利用语言指令、目标图像、物理信息或耦合的视频-动作扩散支持机器人想象、策略训练和动力学预测。
      尚未覆盖: 对未见原语组合、真实机器人部署以及跨数据集和跨本体的泛化仍缺少充分证据。
    - 路线: 上下文条件化的模型基强化学习世界模型
      解决的问题: 将可观测上下文纳入潜在状态推断和动力学建模，以提升策略对未见任务动态的零样本泛化。
      尚未覆盖: 假设上下文可观测，且仅在有限任务上验证；对部分观测或开放世界动态的更广泛泛化仍未覆盖。
    - 路线: 游戏与开放域交互式世界模型及一致性基准
      解决的问题: 构建循环或闭环可复现数据，衡量空间一致性、记忆一致性和动作控制，并支持游戏环境中的样本高效策略学习。
      尚未覆盖: 基准一致性分数是否对应下游智能体能力，以及长期稳定性能否跨场景、游戏和用户交互泛化仍未知。
    共识:
    - 多数工作将未来状态或视频作为可控生成目标，并以动作、语言指令、目标图像、上下文变量或初始观测为条件。
    - 评估正从单步重建转向 rollout、闭环、跨数据集和一致性导向的证据。
    - Transformer 与扩散模型常被用于扩展视频或潜在动力学，同时引入随机动态或物理信息组件以提升合理性。
    - 可复现证据不均衡：基准和数据集工作通常公开更多工件，而部分模型工作缺少局限性或基线核验。
    分歧:
    - 部署领域差异明显：驾驶场景、机器人操作视频、Atari 和 Minecraft 在动力学、动作空间和失败模式上不可互换。
    - 监督方式不同：掩码重建、上下文条件强化学习目标、物理深度/关键点以及耦合视频-动作扩散带来不同学习偏置。
    - 输出层级不同：像素级视频生成、潜在 rollout 或策略与动力学统一模型会改变可评估和可迁移的对象。
    - 评测目标不同：驾驶真实感、机器人任务成功率、零样本动力学迁移、空间/记忆一致性和游戏样本效率不能直接比较。
    开放问题:
    - 视频保真度、rollout 质量或一致性分数的提升能否转化为更安全的驾驶或真实机器人任务成功？
    - 模型能否在未见场景、本体、动作空间或用户交互下泛化，而不局限于已报告的训练原语、上下文和数据集？
    - 需要多少物理监督或何种记忆架构才能保证长时域且物理合理的预测？
    - 部分模型工作缺少可核验的代码、基线与局限性信息，负结果和可复现性仍是开放验证缺口。
