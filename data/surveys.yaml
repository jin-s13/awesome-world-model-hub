  related_work_outline:
  - 'Mainstream direction: Building controllable world simulators by adapting video
    generation models into action-conditioned systems, evaluated primarily on autonomous
    driving and robotics domains.'
  - 'Shared research pattern: All papers inject control signals (actions, context,
    physics) into generative backbones and measure temporal consistency and visual
    fidelity on established benchmarks such as nuScenes, CARL, and Minecraft.'
  - 'Key differences: Supervision signal varies—explicit physics knowledge (RoboScape),
    observable context values (cRSSM), action trajectories (Vista, Terra, DWS, FAR-Drive);
    evaluation emphasis ranges from spatial consistency and zero-shot generalization
    to closed-loop action fidelity and real-time latency.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field progresses from generalizable
    driving world models (2024) toward dedicated benchmarks for action fidelity (2025)
    and closed-loop deployment systems with sub-second latency (2026), shifting focus
    from visual quality alone to interactive controllability.'
  - 'Open questions: Long-horizon temporal and cross-view consistency under autoregressive
    rollout; generalization beyond the training domains of nuScenes, CARL, and Minecraft;
    independent reproduction across hardware and sensor configurations; resolving
    the speed–fidelity trade-off in real-time interactive serving.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型改造为动作条件化的可控世界模拟器，主要在自动驾驶和机器人领域进行评测。
  - 研究共性：所有论文均将控制信号（动作、上下文、物理）注入生成主干，并在nuScenes、CARL、Minecraft等既定基准上测量时间一致性和视觉保真度。
  - 关键差异：监督信号各异——显式物理知识（RoboScape）、可观测上下文值（cRSSM）、动作轨迹（Vista、Terra、DWS、FAR-Drive）；评测重心从空间一致性、零样本泛化延伸到闭环动作忠实度和实时延迟。
  - 趋势演进：在2024–2026前沿期内，领域从通用驾驶世界模型（2024年）发展为专用的动作忠实度基准（2025年）和亚秒级延迟的闭环部署系统（2026年），重心从纯视觉质量转向交互可控性。
  - 开放问题：自回归推演下的长时域时间与跨视图一致性；在nuScenes、CARL、Minecraft等训练域之外的泛化；跨硬件和传感器配置的独立复现；实时交互服务中速度与保真度的权衡。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation as world simulators
      what_it_solves: Transforms pre-trained or purpose-built video generative models
        into controllable simulators that accept action inputs and produce future-frame
        predictions for robotics and autonomous driving.
      what_remains_open: Long-horizon autoregressive rollout causes temporal and cross-view
        consistency degradation; generalization to new environments, sensor setups,
        and out-of-distribution conditions is largely unverified; deployment latency
        and system integration remain underexplored.
    - line: Benchmarks and evaluation frameworks for world model fidelity
      what_it_solves: Provides standardized datasets, metrics, and evaluation protocols
        to quantify spatial consistency, action fidelity, and physical plausibility
        of generated rollouts, enabling comparison across models.
      what_remains_open: Existing benchmarks are confined to narrow domains (Minecraft,
        nuScenes); no consensus on whether open-loop metrics predict closed-loop performance;
        real-world deployment conditions such as hardware variability and user interaction
        are absent from current evaluation.
    - line: Physics-informed and context-aware world modeling
      what_it_solves: Incorporates explicit physical knowledge (depth, keypoint dynamics)
        or observable context variables (mass, dimensions) into the latent dynamics
        of world models to improve plausibility and zero-shot generalization.
      what_remains_open: Assumes observability of context or physics priors that may
        not hold in real settings; evaluation is limited to one or two tasks per benchmark;
        the benefit over purely learned dynamics in more complex, unstructured environments
        remains unclear.
    consensus:
    - Action-conditioned generation is the central mechanism for building controllable
      world simulators across driving and robotics domains.
    - Temporal consistency over multi-step rollouts is a shared challenge, and all
      approaches introduce architectural or training strategies to mitigate autoregressive
      degradation.
    - Video generation backbones—both diffusion-based and autoregressive transformers—can
      be effectively adapted as world simulators by adding control modules.
    - Standardized evaluation on existing datasets (nuScenes, CARL, Minecraft) is
      the common practice, with FID, FVD, and task-specific fidelity metrics serving
      as the primary comparison tools.
    disagreements:
    - Whether to prioritize visual fidelity or action controllability in model design
      and evaluation—some works optimize for pixel-level quality while others emphasize
      dynamic transition accuracy even at the cost of visual detail.
    - Whether to use explicit physics-informed losses (depth prediction, keypoint
      dynamics) or rely on learned latent dynamics without structured physical priors.
    - Whether to evaluate in open-loop settings with fixed metrics or in closed-loop
      deployment where the model's own outputs feed back as future inputs.
    - Whether to fine-tune pre-trained general-purpose video generators or train specialized
      models from scratch on domain-specific data.
    open_questions:
    - How well do world models trained on curated datasets like nuScenes and Minecraft
      transfer to real-world deployment with diverse hardware, sensor noise, and user-driven
      interactions?
    - What evaluation protocols can reliably predict closed-loop performance from
      open-loop metrics, and how should action fidelity be weighed against visual
      quality?
    - Can lightweight action-conditioned modules scale to highly specialized or safety-critical
      domains without sacrificing the robustness needed for deployment?
    - What is the minimum acceptable latency for closed-loop interactive systems,
      and how does it constrain model architecture choices in practice?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件化视频生成作为世界模拟器
      解决的问题: 将预训练或专门构建的视频生成模型改造为可控模拟器，接受动作输入并生成未来帧预测，服务于机器人和自动驾驶。
      尚未覆盖: 长时域自回归推演导致时间与跨视图一致性退化；对新环境、传感器配置和分布外条件的泛化大多未经验证；部署延迟和系统集成仍探索不足。
    - 路线: 世界模型忠实度的基准与评测框架
      解决的问题: 提供标准化数据集、指标和评测协议，量化生成推演的空间一致性、动作忠实度和物理合理性，支持跨模型比较。
      尚未覆盖: 现有基准局限于狭窄领域（Minecraft、nuScenes）；开环指标能否预测闭环性能尚无共识；当前评测缺少硬件可变性和用户交互等真实部署条件。
    - 路线: 物理信息与上下文感知的世界建模
      解决的问题: 将显式物理知识（深度、关键点动力学）或可观测上下文变量（质量、尺寸）纳入世界模型的潜在动力学，以提升合理性和零样本泛化。
      尚未覆盖: 假设上下文或物理先验可观测，这在真实场景中可能不成立；评估仅限于每个基准的一到两个任务；在更复杂、非结构化环境中相比纯学习动力学方法的优势尚不明确。
    共识:
    - 动作条件化生成是跨驾驶和机器人领域构建可控世界模拟器的核心机制。
    - 多步推演中的时间一致性是共同挑战，所有方法均引入架构或训练策略来缓解自回归退化。
    - 基于扩散和自回归Transformer的视频生成主干均可通过添加控制模块有效改造为世界模拟器。
    - 在现有数据集（nuScenes、CARL、Minecraft）上进行标准化评测是通用做法，FID、FVD和任务特定忠实度指标是主要比较工具。
    分歧:
    - 在模型设计与评测中优先考虑视觉保真度还是动作可控性——部分工作优化像素级质量，其他工作则强调动态转换精度，即使牺牲视觉细节。
    - 使用显式物理信息损失（深度预测、关键点动力学）还是依赖无结构化物理先验的纯学习潜在动力学。
    - 在固定指标的开环设定下评测，还是在模型自身输出反馈为未来输入的闭环部署中评测。
    - 微调预训练通用视频生成器，还是在领域特定数据上从头训练专用模型。
    开放问题:
    - 在nuScenes和Minecraft等精选数据集上训练的世界模型，在多大程度上能迁移到具有多样硬件、传感器噪声和用户驱动交互的真实部署场景？
    - 何种评测协议能可靠地从开环指标预测闭环性能，且动作忠实度与视觉质量应如何权衡？
    - 轻量级动作条件模块能否在不过度牺牲部署所需鲁棒性的前提下，扩展到高度专业化或安全关键领域？
    - 闭环交互系统的最低可接受延迟是多少，这在实际中如何约束模型架构选择？
