  related_work_outline:
  - 'Mainstream direction: Video-generative world models are being engineered into
    runnable simulators for closed-loop evaluation and policy training in autonomous
    driving and robotics.'
  - 'Shared research pattern: Action-conditioned modules, autoregressive frame generation,
    and dedicated losses are used to improve controllability and dynamic consistency
    of the simulator.'
  - 'Key differences: Evaluation targets diverge (spatial consistency vs. action fidelity
    vs. visual quality), domain-specific designs contrast with generalist ambitions,
    and the integration of explicit physics knowledge varies.'
  - 'Trend evolution: The field is moving from open-loop scene generation toward interactive,
    closed-loop simulation, and from single-domain frameworks to lightweight, reusable
    methods that build on pretrained video models.'
  - 'Open questions: Long-horizon stability and memory, out-of-distribution robustness,
    cross-domain transfer, trade-offs between physical realism and computational efficiency,
    and the absence of a unified evaluation standard.'
  related_work_outline_zh:
  - 主流方向：以视频生成为核心的世界模型正在被构建为可运行的模拟器，用于自动驾驶和机器人领域的闭环评估与策略训练。
  - 研究共性：通过动作条件模块、自回归式帧生成和专用损失函数，提升模拟器的可控性与动态一致性。
  - 关键差异：评测目标（空间一致性 vs 动作保真度 vs 视觉质量）、领域专用设计与通用化追求，以及显式物理知识的整合程度各不相同。
  - 趋势演进：从开环场景生成迈向交互式闭环模拟，从单一领域框架转向基于预训练视频模型的轻量级可复用方法。
  - 开放问题：长时域稳定性与记忆、分布外鲁棒性、跨域迁移、物理真实感与计算效率的权衡，以及统一评测标准的缺失。
  literature_review:
    line_of_work_matrix:
    - line: Runnable world-model simulators and deployment stacks
      what_it_solves: Transforms video generation models into end-to-end, controllable
        simulators for data generation, closed-loop policy evaluation, and model-based
        training.
      what_remains_open: Reliability under real-world domain shifts, hardware heterogeneity,
        and safety-critical deployment constraints; long-horizon consistency beyond
        the training distribution.
    - line: Real-time and interactive simulation serving
      what_it_solves: Achieves low-latency, action-conditioned video generation that
        supports closed-loop control and interactive applications.
      what_remains_open: Trade-offs among generation speed, visual fidelity, multi-agent
        interactivity, and the complexity of the control interface; real-time guarantees
        under stochastic dynamics.
    - line: Benchmark-driven reproducible engineering
      what_it_solves: Provides standardized datasets, metrics, and open-source frameworks
        to quantify simulation quality and enable fair comparison.
      what_remains_open: Independent reproduction across teams and infrastructure
        environments; coverage of physical plausibility and task-level success beyond
        visual metrics.
    consensus:
    - World models are being operationalized as controllable simulators, not just
      as static generative models; action-conditioned video generation is the predominant
      technical vehicle.
    - Lightweight adapters or fine-tuning of pretrained video models are favored over
      training world simulators from scratch, driven by compute and data efficiency.
    - Benchmarks and leaderboards are indispensable for progress, with metrics such
      as FID, FVD, and newly proposed action-fidelity scores being used to measure
      visual and dynamic quality.
    - Closed-loop evaluation, where the simulator interacts with a policy or planner,
      is recognized as more informative than open-loop frame prediction.
    disagreements:
    - 'Evaluation emphasis: some works prioritize spatial consistency and scene graph
      metrics, while others focus on action fidelity or pixel-level visual quality,
      reflecting different assumptions about what makes a simulator useful.'
    - 'Domain scope: specialized simulators for autonomous driving (e.g., nuScenes-based)
      are contrasted with generalist systems that target games, robotics, and open-world
      exploration, leading to fundamentally different control interfaces and failure
      modes.'
    - 'Physics integration: explicit physics-informed losses or keypoint dynamics
      are used in some systems, whereas others rely purely on data-driven video generation,
      creating a divide in how physical plausibility is enforced.'
    - 'Real-time constraints: sub-second latency on a single GPU is a hard requirement
      for a subset of work, while other systems are designed for offline, high-quality
      rollouts where speed is secondary.'
    open_questions:
    - How can long-horizon consistency and memory be maintained over thousands of
      simulation steps without compounding autoregressive errors?
    - What is the minimal set of evaluation metrics that captures both visual fidelity
      and task-level utility for downstream policy training?
    - Can lightweight action-conditioned modules generalize to highly dynamic, multi-agent
      scenarios without sacrificing physical accuracy?
    - How do these simulators perform when deployed on different hardware stacks or
      when the input distribution shifts from the training data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的世界模型模拟器与部署栈
      解决的问题: 将视频生成模型转化为数据生成、闭环策略评估和基于模型训练所需的端到端、可控模拟器。
      尚未覆盖: 在真实世界分布偏移、硬件异构和安全关键部署约束下的可靠性；超出训练分布的长时域一致性。
    - 路线: 实时与交互式模拟服务
      解决的问题: 实现低延迟、动作条件驱动的视频生成，支撑闭环控制与交互式应用。
      尚未覆盖: 生成速度、视觉保真度、多智能体交互性与控制接口复杂度之间的权衡；随机动态下的实时性保障。
    - 路线: 基准驱动的可复现工程
      解决的问题: 提供标准化数据集、指标和开源框架，量化模拟质量并支持公平比较。
      尚未覆盖: 跨团队和基础设施环境的独立复现；除视觉指标外，对物理合理性和任务级成功率的覆盖。
    共识:
    - 世界模型正被构建为可控模拟器，而非单纯的静态生成模型；动作条件视频生成是主要的技术载体。
    - 基于预训练视频模型的轻量级适配或微调受到青睐，而非从头训练世界模拟器，这源于计算和数据效率的考虑。
    - 基准和排行榜对研究进展至关重要，当前使用 FID、FVD 以及新提出的动作保真度分数等指标来衡量视觉和动态质量。
    - 闭环评估（模拟器与策略或规划器交互）被公认比开环帧预测更具信息量。
    分歧:
    - 评测重点不同：部分工作强调空间一致性和场景图指标，另一些则聚焦动作保真度或像素级视觉质量，这反映了对模拟器有用性的不同假设。
    - 领域范围不同：面向自动驾驶的专用模拟器（基于 nuScenes 等）与瞄准游戏、机器人、开放世界探索的通用系统形成对比，导致控制接口和失败模式的根本差异。
    - 物理知识整合方式不同：一些系统采用显式物理信息损失或关键点动力学，而另一些则纯粹依赖数据驱动视频生成，由此在物理合理性保障上存在分歧。
    - 实时性约束不同：部分工作将单 GPU 亚秒级延迟作为硬性要求，而其他系统设计用于离线高质量推演，速度优先级较低。
    开放问题:
    - 如何在数千步模拟中保持长时域一致性和记忆，而不累积自回归误差？
    - 能够同时捕捉视觉保真度和下游策略训练任务效用的最小评估指标集合是什么？
    - 轻量级动作条件模块能否在不牺牲物理准确性的前提下，泛化到高度动态的多智能体场景？
    - 当部署在不同硬件栈或输入分布偏离训练数据时，这些模拟器的性能表现如何？
