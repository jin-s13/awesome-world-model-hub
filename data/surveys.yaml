  related_work_outline:
  - 'Mainstream direction: World models are shifting from pure video generation to
    unified frameworks that couple video, action, and physics, aiming for physically
    plausible and generalizable dynamics.'
  - 'Shared research pattern: Most works adopt Transformer-based architectures and
    diffusion models, and jointly optimize multiple objectives such as reconstruction,
    action adherence, and physical consistency.'
  - 'Key differences: Representations diverge into pixel-space video generation and
    latent-state dynamics; supervision ranges from reconstruction loss to RL rewards
    and physics-informed constraints; applications span driving, Atari, and robotics.'
  - 'Trend evolution: From 2023''s efficient latent models (STORM) to 2024–2026''s
    diffusion-based video world models with compositionality, physics, and large-scale
    pretraining, the field is moving toward multi-modal, multi-task generalization.'
  - 'Open questions: Evaluating long-horizon physical consistency, integrating world
    models into closed-loop decision-making, and scaling to unseen environments with
    limited supervision remain unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型从纯视频生成转向耦合视频、动作和物理知识的统一框架，目标是物理合理且可泛化的动力学。
  - 研究共性：多数工作采用Transformer架构和扩散模型，联合优化重建、动作一致性和物理一致性等多重目标。
  - 关键差异：表示方法分为像素空间视频生成和潜在状态动力学；监督信号涵盖重建损失、强化学习奖励和物理约束；应用场景涉及驾驶、雅达利和机器人。
  - 趋势演进：从2023年高效潜在模型（STORM）到2024–2026年基于扩散的视频世界模型，融入组合性、物理知识和大规模预训练，领域正迈向多模态、多任务泛化。
  - 开放问题：如何评估长时域物理一致性、将世界模型整合到闭环决策中、以及在有限监督下泛化到未见环境，这些问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Video generation as world models
      what_it_solves: Learning environment dynamics from raw visual data by predicting
        future frames, enabling visual planning and imagination.
      what_remains_open: Long-horizon physical accuracy and generalization to unseen
        compositions; how to reliably use generated videos for downstream policy learning
        without compounding errors.
    - line: Latent dynamics models for reinforcement learning
      what_it_solves: Sample-efficient policy learning by training an agent within
        learned latent dynamics, reducing the need for real environment interactions.
      what_remains_open: Assumptions about observable context or action distributions;
        limited task diversity in evaluation; the gap between latent imagination and
        real-world deployment.
    - line: Evaluation benchmarks for spatial and physical consistency
      what_it_solves: Providing standardized metrics to quantify a world model's ability
        to maintain spatial coherence over time, which pixel-level metrics miss.
      what_remains_open: Coverage is limited to simulated environments (e.g., Minecraft);
        no benchmark yet captures the full complexity of real-world physical interactions.
    consensus:
    - World models must capture environment dynamics in a way that supports decision-making,
      not just visual plausibility.
    - Transformer architectures and diffusion-based generation have become the dominant
      building blocks for recent world models.
    - Multi-objective training combining visual fidelity, action adherence, and physical
      priors is more effective than single-loss optimization.
    - Generalization to unseen scenarios—whether through context conditioning, compositionality,
      or large-scale pretraining—is a central goal.
    disagreements:
    - 'Representation: some models operate directly in pixel space (video generation),
      while others learn compact latent states for dynamics, trading off visual detail
      for computational efficiency.'
    - 'Supervision: methods differ in using self-supervised video reconstruction,
      reinforcement learning rewards, physics-informed losses, or coupled action diffusion
      as the primary training signal.'
    - 'Interaction mode: video generation models are often evaluated in open-loop
      prediction, whereas latent dynamics models are typically used for closed-loop
      policy training inside the learned world.'
    - 'Evaluation target: driving simulators, Atari games, and robotic manipulation
      each impose different requirements on physical fidelity, action space, and long-term
      consistency, making cross-domain comparison difficult.'
    open_questions:
    - How can we verify that a world model's long-term predictions remain physically
      consistent rather than visually plausible but physically wrong?
    - What is the minimal set of supervision signals (action, depth, keypoints, physics)
      needed to achieve robust generalization to new environments?
    - Can world models pretrained on large-scale video data be effectively fine-tuned
      for closed-loop control without forgetting the learned dynamics?
    - How do we design benchmarks that measure both spatial coherence and physical
      plausibility in real-world settings, beyond limited simulated domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成式世界模型
      解决的问题: 通过预测未来帧从原始视觉数据中学习环境动力学，支持视觉规划和想象。
      尚未覆盖: 长时域物理准确性以及对未见组合的泛化；如何将生成视频可靠地用于下游策略学习而不累积误差。
    - 路线: 面向强化学习的潜在动力学模型
      解决的问题: 在学到的潜在动力学中训练智能体，实现样本高效策略学习，减少真实环境交互需求。
      尚未覆盖: 对可观测上下文或动作分布的假设；评估的任务多样性有限；潜在想象与实际部署之间的差距。
    - 路线: 空间与物理一致性的评估基准
      解决的问题: 提供标准化指标来量化世界模型随时间保持空间一致性的能力，弥补像素级指标的不足。
      尚未覆盖: 覆盖范围仅限于模拟环境（如Minecraft）；尚无基准能捕捉真实世界物理交互的全部复杂性。
    共识:
    - 世界模型必须捕捉环境动力学以支持决策，而非仅追求视觉逼真。
    - Transformer架构和基于扩散的生成已成为近期世界模型的主流构建模块。
    - 结合视觉保真度、动作一致性和物理先验的多目标训练比单一损失优化更有效。
    - 通过上下文条件化、组合性或大规模预训练实现对未见场景的泛化是核心目标。
    分歧:
    - 表示方式：部分模型直接在像素空间操作（视频生成），另一些学习紧凑的潜在状态，在视觉细节与计算效率之间权衡。
    - 监督信号：方法在使用自监督视频重建、强化学习奖励、物理信息损失或耦合动作扩散作为主要训练信号上存在差异。
    - 交互模式：视频生成模型通常在开环预测中评估，而潜在动力学模型一般用于学到的世界内部闭环策略训练。
    - 评测目标：驾驶模拟器、雅达利游戏和机器人操作对物理保真度、动作空间和长期一致性提出了不同要求，导致跨领域比较困难。
    开放问题:
    - 如何验证世界模型的长期预测在物理上一致，而非仅视觉上合理但物理上错误？
    - 实现对新环境鲁棒泛化所需的最少监督信号集合（动作、深度、关键点、物理）是什么？
    - 在大规模视频数据上预训练的世界模型能否有效微调用于闭环控制而不遗忘已学到的动力学？
    - 如何设计能够衡量真实世界场景中空间一致性和物理合理性的基准，超越有限的模拟域？
