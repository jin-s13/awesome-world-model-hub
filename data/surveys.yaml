      解决的问题: 通过上下文状态动力学、语言组合视频生成、物理深度/关键点信息或统一视频-动作扩散，将世界模型适配到机器人及领域任务。
      尚未覆盖: 泛化受限于已见原语或上下文值、仿真评估或动作标签假设；真实机器人和未知物理环境的证据仍缺失。
    - 路线: 交互式智能体与高效基于模型的强化学习
      解决的问题: 构建随机视觉世界模型以生成想象轨迹，用于游戏式交互环境中的样本高效控制。
      尚未覆盖: 证据主要集中在Atari 100k；长时域记忆、跨环境泛化和动作空间变化尚未建立。
    - 路线: 世界模型评测基准与一致性协议
      解决的问题: 通过循环导航或可复访视频-动作基准，测量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 基准完备性已展示，但其得分能否预测下游策略质量或真实部署仍是开放验证缺口。
    共识:
    - 近期世界模型被训练为以动作或上下文为条件的预测器，生成未来视频、潜在状态或想象轨迹用于控制。
    - 评测从单一像素保真度转向零样本泛化、物理合理性、空间/记忆一致性和动作可控性。
    - 基于模型的学习与预训练利用想象回放提高样本效率或策略鲁棒性，尤其在机器人学和视觉控制中。
