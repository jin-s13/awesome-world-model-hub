  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative world models for embodied
    and driving settings, using diffusion transformers or stochastic sequence models
    to predict video and dynamics.'
  - 'Shared research pattern: Methods train on reconstruction or video prediction
    with action, context, language, or physics conditioning, then evaluate via fidelity,
    control, and consistency metrics.'
  - 'Key differences: One sub-direction targets representation and objectives such
    as mask reconstruction, VAE stochasticity, physics auxiliaries, and contextual
    state-space models; another targets action-video coupling and planning; a third
    targets benchmark protocols.'
  - 'Trend evolution: 2023 work emphasizes efficient RL world models; 2024 adds contextual
    and compositional robot imagination; 2025-2026 shifts toward large-scale video
    world models and memory/spatial/action-control benchmarks.'
  - 'Open questions: Evidence is often limited to narrow task families and simulations,
    with unclear transfer, system-level attribution, missing limitation details, and
    unverified robustness to unseen context, primitives, and long-horizon consistency.'
  related_work_outline_zh:
  - 主流方向：面向驾驶与机器人的生成式世界模型，采用扩散Transformer或随机序列模型进行视频和动力学预测。
  - 研究共性：以重建或视频预测为训练信号，加入动作、上下文、语言或物理条件，并用保真度、可控性和一致性指标评测。
  - 关键差异：一脉聚焦表示与目标设计，如掩码重建、VAE随机性、物理辅助任务和上下文状态空间；另一脉聚焦动作-视频耦合与规划；还有一脉聚焦基准与评估协议。
  - 趋势演进：2023年重视高效强化学习世界模型，2024年出现上下文与组合式机器人想象，2025-2026年转向大规模视频世界模型及记忆、空间和动作控制评测。
  - 开放问题：证据常局限于窄任务和仿真，迁移性、系统级归因、局限细节和长时域一致性尚未充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: turning world-model ideas into concrete representations, losses,
        architectures, and training recipes
      what_remains_open: which algorithmic choices transfer beyond the reported task
        family and objective design
    - line: Planning and action-interface methods
      what_it_solves: connecting learned dynamics to intervention, planning, and decision-time
        interfaces
      what_remains_open: how much of the gain comes from the model versus the planner,
        controller, or task prior
    - line: Method evidence and ablation protocol
      what_it_solves: separating method contribution from dataset, baseline, metric,
        and implementation effects
      what_remains_open: whether evidence isolates the proposed method rather than
        surrounding system choices
    consensus:
    - World-model methods increasingly use generative sequence or video modeling as
      the core learning objective, with self-supervised reconstruction or diffusion
      training.
    - Action, context, language, or physics information is treated as necessary conditioning
      for controllable prediction and downstream policy learning.
    - Evaluation is expanding from visual fidelity and task score toward consistency
      metrics for memory, spatial structure, or action control.
    - Several papers report gains over strong baselines on benchmark-specific tasks,
      but transfer and system-level attribution often remain unresolved.
    disagreements:
    - Stochastic latent dynamics with VAEs versus diffusion-based generative architectures
      versus physics-informed auxiliary losses as the preferred modeling route.
    - Coupling actions jointly with video in a unified diffusion model versus treating
      actions as conditioning inputs versus using action-free video for pretraining.
    - 'Evaluation targets differ substantially: RL sample efficiency, zero-shot generalization
      to unseen dynamics, driving video prediction, robot plan synthesis, or spatial
      and memory consistency.'
    - Required prior knowledge differs across approaches, including observable context
      values, parsed language primitives, depth and keypoint dynamics, or explicit
      action spaces.
    open_questions:
    - Do mask reconstruction, contextual state-space, physics-informed, and unified
      action-video designs transfer beyond their original datasets and task families?
    - In action-coupled world models, how much policy improvement comes from learned
      dynamics versus pretraining data scale, task priors, or planner and controller
      choices?
    - Can current benchmarks isolate long-horizon memory and spatial consistency as
      model capabilities when many papers omit limitation details or comparable baselines?
    - What minimal supervision is needed for zero-shot generalization when context
      is unobservable or when unseen object and action primitives appear?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 把世界模型想法落实为具体表示、损失函数、架构和训练配方
      尚未覆盖: 哪些算法选择能迁移到报告任务族和目标设计之外
    - 路线: 规划与动作接口方法
      解决的问题: 把学习到的动力学连接到干预、规划和决策时接口
      尚未覆盖: 收益有多少来自模型本身，而不是规划器、控制器或任务先验
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素
      尚未覆盖: 证据是否真正隔离了方法贡献，而不是周边系统选择
    共识:
    - 世界模型方法越来越多以生成式序列或视频建模为核心学习目标，采用自监督重建或扩散训练。
    - 动作、上下文、语言或物理信息被视为可控预测和下游策略学习的必要条件。
    - 评估正从视觉保真度和任务分数扩展到记忆、空间结构或动作控制的一致性指标。
    - 多篇论文在特定基准上报告优于强基线的结果，但迁移性和系统级归因常未解决。
    分歧:
    - 建模路线不同：VAE随机隐动力学、扩散生成架构、物理信息辅助损失各有选择。
    - 动作与视频的耦合方式不同：统一扩散联合建模、将动作作为条件输入、或利用无动作视频预训练。
    - 评测目标不同：RL采样效率、零样本泛化、驾驶视频预测、机器人计划合成或空间与记忆一致性。
    - 所需先验不同：可观测上下文值、解析语言原语、深度与关键点动力学、显式动作空间。
    开放问题:
    - 掩码重建、上下文状态空间、物理信息和统一动作-视频设计能否迁移到原始数据集和任务族之外？
    - 在动作耦合世界模型中，策略提升有多少来自学习到的动力学，而不是预训练数据规模、任务先验或规划器与控制器选择？
    - 当前基准能否隔离长时记忆和空间一致性作为模型能力，而多篇论文缺少局限细节或可比基线？
    - 当上下文不可观测或出现未见物体与动作原语时，零样本泛化所需的最小监督是什么？
