  related_work_outline:
  - 'Mainstream direction: World models applied to autonomous driving, robotics, and
    interactive games, with a strong focus on video generation as the core predictive
    interface.'
  - 'Shared research pattern: Use diffusion or transformer-based architectures to
    learn latent dynamics from high-dimensional sensory inputs, then leverage the
    learned model for planning, policy learning, or simulation.'
  - 'Key differences: Supervision signals vary across physics-informed losses, action-coupled
    diffusion, mask reconstruction, and language-driven decomposition; evaluation
    protocols range from offline video fidelity to closed-loop policy performance
    and memory consistency benchmarks.'
  - 'Trend evolution: Starting from Atari game benchmarks (2023), the field rapidly
    moved to embodied and driving domains (2024–2025) and is now shifting toward systematic
    evaluation of spatial and temporal consistency (2025–2026).'
  - 'Open questions: Whether model improvements transfer across embodiments and environments,
    how to align simulated gains with real-world safety, and how to maintain long-term
    memory consistency under changing action spaces.'
  related_work_outline_zh:
  - 主流方向：世界模型应用于自动驾驶、机器人和交互式游戏，以视频生成为核心预测界面。
  - 研究共性：使用扩散或Transformer架构从高维感知输入中学习潜在动力学，并利用学到的模型进行规划、策略学习或仿真。
  - 关键差异：监督信号包括物理信息损失、动作耦合扩散、掩码重建和语言驱动分解；评测方式从离线视频保真度到闭环策略性能和记忆一致性基准。
  - 趋势演进：从Atari游戏基准（2023年）开始，迅速扩展到具身和驾驶领域（2024–2025），目前正转向对时空一致性的系统评估（2025–2026）。
  - 开放问题：模型改进能否跨本体和环境迁移，仿真收益与真实安全性如何对齐，以及如何在变化的动作空间下保持长期记忆一致性。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to robotics and continuous control tasks,
        enabling video-based planning, policy learning, and compositional generalization
        to unseen object-action combinations.
      what_remains_open: Generalization relies on seen primitives and assumes observable
        context; real-world physical alignment and transfer across different robot
        platforms remain unverified.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Long-horizon, multi-view scene prediction for closed-loop driving
        simulation and policy evaluation, using scalable diffusion architectures with
        mask-based reconstruction.
      what_remains_open: Zero-shot deployment to new sensor setups and real-world
        safety outcomes are not yet validated; reliance on specific driving datasets
        limits cross-domain generalization.
    - line: Interactive agents and games
      what_it_solves: Grounding world models in interactive environments where agents
        act over time, evaluated through human-normalized scores, spatial consistency,
        and memory benchmarks.
      what_remains_open: Long-term memory consistency and generalization across diverse
        action spaces remain challenging; evaluations are mostly in simulated or synthetic
        settings without real human interaction.
    consensus:
    - World models serve as internal simulators that predict future sensory observations,
      enabling planning and policy optimization without costly real-world interaction.
    - Diffusion and transformer architectures are the dominant backbones due to their
      ability to handle high-dimensional video and sequential data.
    - Incorporating auxiliary tasks such as depth prediction, mask reconstruction,
      or action prediction improves visual fidelity and physical plausibility.
    - Recent benchmarks emphasize the need to evaluate world models beyond pixel-level
      quality, focusing on memory consistency and action controllability.
    disagreements:
    - 'Supervision strategy: physics-informed joint training (RoboScape) vs. action-video
      diffusion coupling (UWM) vs. language-conditioned decomposition (RoboDreamer)
      vs. mask reconstruction (MaskGWM).'
    - 'Evaluation target: some works measure human-normalized game scores (STORM),
      others focus on video generation quality for driving or robotics, while new
      benchmarks (LoopNav, MIND) isolate spatial and memory consistency.'
    - 'Interaction mode: offline video prediction with fixed action sequences vs.
      closed-loop policy rollouts inside the world model vs. interactive video-to-world
      baselines.'
    - 'Deployment setting: simulated environments only (Atari, Minecraft, CARL) vs.
      real-robot datasets (RT-X, Open X-Embodiment) with no real-world execution reported.'
    open_questions:
    - Can compositional world models generalize to entirely novel primitives not seen
      during training?
    - How do we close the gap between pixel-level video fidelity and downstream task
      performance in real-world robotics?
    - What is the minimal set of evaluation dimensions (memory, action control, physical
      plausibility) needed to certify a world model for safety-critical applications?
    - How can world models leverage passive video data without action labels while
      maintaining precise control for policy learning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到机器人及连续控制任务，实现基于视频的规划、策略学习以及对未见物体-动作组合的组合泛化。
      尚未覆盖: 泛化依赖于已见原语且假设上下文可观测；真实物理对齐和跨不同机器人平台的迁移尚未验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 面向闭环驾驶仿真和策略评估的长时域、多视角场景预测，利用可扩展扩散架构和掩码重建。
      尚未覆盖: 对新传感器配置的零样本部署和真实安全结果尚未验证；依赖特定驾驶数据集限制了跨域泛化。
    - 路线: 交互式智能体与游戏
      解决的问题: 将世界模型扎根于智能体需要持续行动的交互环境，通过人类归一化分数、空间一致性和记忆基准进行评估。
      尚未覆盖: 长期记忆一致性和跨多样化动作空间的泛化仍然困难；评估主要在模拟或合成设置中进行，缺乏真实人类交互。
    共识:
    - 世界模型作为内部模拟器预测未来感官观测，从而在不进行代价高昂的真实交互的情况下进行规划和策略优化。
    - 扩散和Transformer架构因其处理高维视频和序列数据的能力而成为主要骨干。
    - 引入深度预测、掩码重建或动作预测等辅助任务能提升视觉保真度和物理合理性。
    - 近期基准工作强调需要超越像素级质量来评估世界模型，重点关注记忆一致性和动作可控性。
    分歧:
    - 监督策略：物理信息联合训练（RoboScape）与动作-视频扩散耦合（UWM）与语言条件分解（RoboDreamer）与掩码重建（MaskGWM）之间的差异。
    - 评测目标：部分工作衡量人类归一化游戏分数（STORM），其他聚焦于驾驶或机器人的视频生成质量，而新基准（LoopNav、MIND）则分离出空间和记忆一致性。
    - 交互模式：基于固定动作序列的离线视频预测与在世界模型内部进行闭环策略展开与交互式视频到世界基线之间的差异。
    - 部署场景：仅模拟环境（Atari、Minecraft、CARL）与使用真实机器人数据集（RT-X、Open X-Embodiment）但未报告真实世界执行之间的差异。
    开放问题:
