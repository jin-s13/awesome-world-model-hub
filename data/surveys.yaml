    - 该应用切片中的生成式世界模型主要围绕以观测、动作、语言或上下文为条件的视频预测。
    - Transformer与扩散架构是主导建模族，常结合时空或物理一致性等辅助任务。
    - 评测越来越多地结合视觉保真度与任务导向信号，如策略成功率、泛化能力或记忆与动作一致性。
    - 研究者已形成共识：短时域像素精度不足，长时域、空间和物理一致性是关键目标。
    分歧:
    - 表示耦合方式不同：有的仅生成视频或将语言分解为视频原语，有的统一建模视频-动作扩散，或注入物理辅助目标。
    - 评测设置不同：驾驶工作侧重多数据集和零样本视频基准，机器人工作侧重仿真执行或基于机器人数据的策略学习，交互工作侧重循环/空间一致性。
    - 模型假设不同：上下文模型要求上下文可观测，组合机器人模型依赖解析出的原语，物理信息模型从数据中隐式学习物理知识。
    - 泛化目标不同：零样本动力学、已见原语的新组合、跨视角或跨数据集视频预测，或跨动作空间动作控制。
    开放问题:
