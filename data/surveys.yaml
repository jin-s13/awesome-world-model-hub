  literature_review:
    line_of_work_matrix:
    - line: Unified action-video generative world models
      what_it_solves: Represent policy, forward/inverse dynamics, and video generation
        in one model for large-scale robot pretraining and flexible control.
      what_remains_open: Cross-embodiment and cross-domain transfer assumptions are
        not formalized; evaluation centers on robot manipulation and visual controllability.
    - line: Adaptation of pretrained video diffusion into action-conditioned world
        models
      what_it_solves: Convert closed or pretrained video models into decision-relevant
        world models without full parameter access, improving action-frame alignment.
      what_remains_open: Depends on domain-specific action-labelled videos; inherited
        pretrained biases and generalization to other sequential tasks remain unverified.
    - line: Physics and preference alignment for rollouts
      what_it_solves: Align generated trajectories with physical realism, task completion,
        embodiment plausibility, and visual quality using preference or DPO-style
        signals.
      what_remains_open: Supervision relies on subjective human preferences; results
        are mainly demonstrated on contact-rich manipulation, not broader domains.
    - line: State-and-dynamics taxonomy and functional evaluation
      what_it_solves: Clarify state construction and dynamics modeling for video generation
        as world models and call for functional benchmarks.
      what_remains_open: No empirical demonstration that the taxonomy changes model
        design; functional evaluation gap still open.
    - line: Test-time verification for spatial reasoning
      what_it_solves: Ground test-time rewards in verifiable frame-anchored micro-claims
        and diagnose verifier miscalibration for world-model reasoning.
      what_remains_open: Scaling is inconsistent across benchmarks; imagined views
        may form an information bottleneck for fine-grained reasoning.
    consensus:
    - Treat action-conditioned video generation as an embodied dynamics substrate
      rather than only a visual-generation task.
    - Use alignment or verification signals beyond pixel fidelity, including physics,
      planning outcomes, preferences, and micro-claims.
    - Show benefits from pretraining and adaptation on robot or video data for more
      controllable and useful world models.
    - Recognize that evaluation must cover action alignment, physical plausibility,
      and downstream decision quality.
    - Reported gains include model scale, generation speed, and test-time scaling,
      but formal guarantees are rarely supplied.
    disagreements:
    - 'Representation differs: unified diffusion timesteps couple action and video,
      while others use frame-level conditioning, masked autoregression, adapter masks,
      or flow-based post-training.'
    - 'Supervision differs: some use human preference datasets and DPO-like signals,
      others use heuristic verification or reward model alignment, while some rely
      only on action-conditioned generation.'
    - 'Evaluation targets differ: visual quality and speed, model-based planning,
      zero-shot physical plausibility, or spatial reasoning; no single benchmark is
      dominant.'
    - 'State formalization differs: conceptual work calls for explicit state construction,
      while generative methods often keep state implicit in dynamics models.'
    open_questions:
    - What formal conditions for state construction and dynamics modeling are necessary
      for a video generative model to qualify as a world model?
    - Can functional benchmarks distinguish physical persistence and causal reasoning
      from visual fidelity across manipulators and unseen embodiments?
    - Does test-time verification provide consistent downstream gains beyond SAT-Real,
      and what breaks scaling on benchmarks like MMSI-Bench?
    - Which alignment signals generalize beyond contact-rich manipulation, and how
      can reward/preference costs be reduced without sacrificing physical fidelity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频生成式世界模型
      解决的问题: 用单一模型表示策略、正向/逆向动力学和视频生成，服务大规模机器人预训练与灵活控制。
      尚未覆盖: 跨本体与跨域迁移的形式假设未建立，评测集中在机器人操作和视觉可控性。
    - 路线: 预训练视频扩散模型适配
      解决的问题: 在不完全访问参数的情况下把预训练视频模型转化为动作条件世界模型，改善动作-帧对齐。
      尚未覆盖: 依赖领域特定的动作标注视频；预训练偏差及其他顺序决策任务上的泛化缺少证据。
    - 路线: 物理与偏好对齐
      解决的问题: 通过偏好或类似DPO的信号使生成轨迹符合物理真实、任务完成、具身合理和视觉质量。
      尚未覆盖: 监督依赖主观人类偏好；主要证据限于接触丰富的操作任务。
    - 路线: 状态/动态分类与功能评测
      解决的问题: 澄清视频生成作为世界模型的状态构建和动态建模，倡导面向持久性和因果性的功能基准。
      尚未覆盖: 缺少证据表明该分类改变模型设计；功能评测差距仍未闭合。
    - 路线: 测试时验证与空间推理
      解决的问题: 将测试时奖励锚定到可验证的帧级微断言，诊断验证器校准和动作偏差。
      尚未覆盖: 跨基准的缩放结果不一致；想象视图可能构成细粒度推理的信息瓶颈。
    共识:
    - 将动作条件视频生成视为具身动力学载体，而非仅视觉生成任务。
    - 除像素保真度外，还使用物理、规划结果、偏好或微断言等信号进行对齐或验证。
    - 在机器人或视频数据上预训练和适配能提升世界模型的可控性与下游可用性。
    - 评测需同时覆盖动作对齐、物理合理性和下游决策质量。
    - 已有证据显示模型规模、生成速度和测试时缩放带来收益，但缺少形式化保证。
    分歧:
    - 表示方式不同：统一扩散时间步耦合动作与视频，另有帧级条件、掩码自回归、适配器掩码或基于流的后训练。
    - 监督信号不同：部分使用人类偏好数据集和类似DPO的信号，部分使用启发式验证或奖励模型，部分仅依赖动作条件生成。
    - 评测目标不同：视觉质量和生成速度、基于模型的规划、零样本物理合理性或空间推理之间尚无统一主导基准。
    - 状态形式化不同：概念性工作主张显式状态构建，生成式方法常把状态隐式留在动力学模型中。
    开放问题:
    - 视频生成模型成为世界模型需要满足哪些状态构建和动态建模的形式化条件？
    - 功能基准能否在多种机器人与未见本体上区分物理持久性、因果推理和视觉保真度？
    - 测试时验证能否在SAT-Real之外持续带来下游收益，MMSI-Bench等基准上缩放失败的原因是什么？
    - 哪些对齐信号能泛化到接触丰富操作之外的领域，并降低奖励/偏好采集成本？
