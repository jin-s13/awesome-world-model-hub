  related_work_outline:
  - 'Mainstream direction: The survey/roadmap literature is converging on world models
    as generative simulators for embodied AI, especially robot imagination and autonomous
    driving.'
  - 'Shared research pattern: Papers organize or learn visual dynamics by conditioning
    on structure—language primitives, ego-motion, human pose, destination, or latent
    personality—and evaluate through generated video plans or rollout control.'
  - 'Key differences: Work splits between broad conceptual taxonomies and method-focused
    systems, with different evaluation targets such as physical robots, traffic simulation,
    out-of-sight video consistency, and controllable future prediction.'
  - 'Trend evolution: Earliest evidence from 2022 shows physical robot world models;
    2023–2024 adds driving simulation and large generative-video surveys; 2025–2026
    emphasizes open-source, real-time, long-horizon, and out-of-sight dynamics.'
  - 'Open questions: Whether synthetic taxonomies are backed by systematic evidence,
    how to generalize beyond seen primitives, how to evaluate out-of-sight persistence,
    and which metrics predict real-world control remain unresolved.'
  related_work_outline_zh:
  - 主流方向：综述与路线图文献正围绕世界模型作为生成式模拟器收敛，重点覆盖机器人想象和自动驾驶。
  - 研究共性：论文通过语言原语、自我运动、人体姿态、目的地或潜在个性等结构信号来组织或学习视觉动态，并用生成视频计划或控制回放评估。
  - 关键差异：研究可分为概念性分类体系和面向方法的系统，评测目标分别涉及物理机器人、交通仿真、视线外视频一致性和可控未来预测。
  - 趋势演进：2022年证据集中在物理机器人世界模型；2023–2024年出现驾驶仿真和生成视频综述；2025–2026年强调开源、实时、长时域与视线外动态。
  - 开放问题：分类体系是否有系统证据、如何泛化到未见原语、如何评估视线外持续性、哪些指标能预测真实控制性能仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented world-model methods, applications, and
        evaluation choices into a conceptual structure and future research directions.
      what_remains_open: Whether the taxonomies are derived from systematic evidence
        collection rather than selective examples, and whether their evaluation prescriptions
        are empirically tested.
    - line: Comparative evaluation and benchmarking synthesis
      what_it_solves: Identifies how evaluation settings, datasets, and metrics shape
        claims about world model controllability, consistency, and planning.
      what_remains_open: Comparability of results across simulation, physical robot,
        and video-generation settings is still limited; proposed metrics are often
        not validated on downstream tasks.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad survey coverage into concrete next research questions
        across world model methods and evaluations.
      what_remains_open: Which gaps are most important for progress remains unprioritized;
        gaps are often asserted without evidence of practical impact.
    - line: Generative video world modeling for robot imagination
      what_it_solves: Learns visual forward models that synthesize future frames or
        video plans from language and other conditioning signals for robot execution.
      what_remains_open: Generalization is bounded by seen primitive combinations;
        real-robot execution evidence is partial and long-horizon persistence is underexplored.
    - line: Physical and multi-agent simulation world models
      what_it_solves: Learns dynamics for physical robot control without simulators
        or for configurable multi-agent traffic simulation and motion prediction.
      what_remains_open: Hardware generalization and hyperparameter assumptions remain
        untested across platforms; driving simulation realism is not yet tied to closed-loop
        deployment.
    consensus:
    - World models are treated as a shared substrate for visual future prediction,
      planning, and interaction rather than only as video generators.
    - Auxiliary conditioning structure improves controllability and compositional
      generalization compared with monolithic generative models.
    - Long-horizon temporal consistency and persistent dynamics are recognized as
      central challenges for generative world simulation.
    - Evaluation should move beyond visual quality toward control, closed-loop behavior,
      and scene-state consistency.
    disagreements:
    - 'Representation-level split: some work factors generation into lower-level primitives,
      while others use unified latent/global-state or multimodal RGB-depth representations.'
    - 'Conditioning and supervision differ: language-driven decomposition, ego-motion
      and pose control, destination plus latent personality, or persistent entity
      monitors are used as alternative inductive biases.'
    - 'Evaluation target differs: physical robot learning, autonomous driving simulation,
      out-of-sight video benchmarks, and controllable future-frame prediction are
      not yet comparable in one framework.'
    - 'Deployment setting differs: evidence ranges from simulated rollouts to physical
      robots and open-source real-time systems, so claims about real-world readiness
      vary.'
    open_questions:
    - Can survey-level taxonomies and evaluation frameworks be validated against systematic
      cross-paper empirical comparisons?
    - Which conditioning structures and representations best support generalization
      to entirely novel objects, actions, or traffic scenarios?
    - How should out-of-sight or unobserved entity dynamics be benchmarked and verified
      in generative world models?
    - What metrics and datasets would align offline video-generation performance with
      downstream real-robot and autonomous-driving success?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的世界模型方法、应用和评测选择组织为概念结构，并给出未来研究方向。
      尚未覆盖: 分类体系是否来自系统证据而非选择性示例仍未验证；其评估建议也缺少实证检验。
    - 路线: 对比评测与基准综合
      解决的问题: 总结评测设置、数据集和指标如何影响关于可控性、一致性和规划能力的结论。
      尚未覆盖: 仿真、真实机器人和视频生成设置之间的结果可比性有限；提出的指标多未在下游任务上验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛的文献覆盖转化为世界模型方法和评测中的具体下一步研究问题。
      尚未覆盖: 哪些缺口最值得优先解决仍缺乏排序；缺口常被提出，但缺少实际影响的证据。
    - 路线: 面向机器人想象的生成式视频世界模型
      解决的问题: 学习视觉前向模型，根据语言和其他条件信号合成未来帧或视频计划以支持机器人执行。
      尚未覆盖: 泛化受限于已见原语组合；真实机器人执行证据不完整，长时域持续性尚未充分探索。
    - 路线: 物理与多智能体仿真世界模型
      解决的问题: 在无模拟器条件下学习物理机器人控制，或学习可配置的多智能体交通仿真与运动预测。
      尚未覆盖: 跨硬件泛化和超参数假设缺乏充分验证；驾驶仿真的逼真性尚未与闭环部署直接关联。
    共识:
    - 世界模型被视为视觉未来预测、规划与交互的共同基础，而不仅是视频生成器。
    - 辅助条件结构相比单一生成模型能够提升可控性和组合泛化能力。
    - 长时域时间一致性和持久动态被认为是生成式世界模拟的核心挑战。
    - 评测应从视觉质量扩展到控制性能、闭环行为和场景状态一致性。
    分歧:
    - 表示层面的分歧：有的工作将生成分解为低级原语，有的采用统一潜在/全局状态或多模态 RGB-D 表示。
    - 条件与监督信号不同：语言驱动分解、自我运动和姿态控制、目的地加潜在个性、持续实体监控等提供了不同的归纳偏置。
    - 评测目标不同：物理机器人学习、自动驾驶仿真、视线外视频基准和可控未来帧预测尚未在同一框架下兼容。
    - 部署场景不同：证据涵盖仿真回放、物理机器人和开源实时系统，因此对真实世界就绪程度的判断不一致。
    开放问题:
    - 综述级分类体系和评测框架能否通过系统的跨论文实证比较得到验证？
    - 哪些条件结构与表示最有利于泛化到完全新颖的物体、动作或交通场景？
    - 如何为生成式世界模型中的视线外或未观察实体动态建立基准并验证？
    - 哪些指标和数据集能使离线视频生成性能与下游真实机器人和自动驾驶表现对齐？
