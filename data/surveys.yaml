    gaps such as action-conditioned controllability, long-horizon memory, and real-time
    interactivity.'
  - 'Key differences: Some works stay conceptual with proposed taxonomies and metrics
    but no empirical validation; others provide benchmarks or system results. Coverage
    ranges from general video generation to domain-specific autonomous driving, ego-vision,
    and physical robots.'
  - 'Trend evolution: The available 2022-2026 span moves from applying learned world
    models to physical robots toward generative video world models, open-source interactive
    simulators, and survey/evaluation synthesis; later years emphasize evaluation
    and open challenges.'
  - 'Open questions: Systematic inclusion criteria, metric compatibility across benchmarks,
    simulation-to-real validation, and prioritization of long-horizon, out-of-sight,
