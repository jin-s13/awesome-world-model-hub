    autonomous driving, open-world exploration), with increasing emphasis on long-horizon
    consistency, real-time interactivity, and open-source availability.'
  - 'Shared research pattern: Leveraging video generation backbones to learn world
    dynamics from large-scale data, then conditioning on actions, language instructions,
    or multimodal trajectories to produce future frames; survey works organize this
    fragmented landscape into taxonomies of latent representations, structural priors,
    and evaluation protocols.'
  - 'Key differences: Representations range from continuous latent states to discrete
    tokens and hybrid forms; control granularity spans high-level language goals to
    fine-grained ego-motion, object dynamics, and human poses; some works address
    out-of-sight persistence while others focus on observed context; evaluation settings
    differ between simulation, real robots, and benchmark-only comparisons.'
  - 'Trend evolution: From 2022 on-robot world-model learning without simulators,
    through 2024 compositional video planning and Sora-triggered surveys, to 2025–2026
    interactive, persistent, and open-source world models paired with explicit taxonomies
    and evaluation frameworks for autonomous driving and general interaction.'
  - 'Open questions: How to achieve true physical law compliance and out-of-distribution
    generalization beyond seen primitives; how to design standardized, closed-loop
    benchmarks that capture real-time, long-horizon, and multi-agent interactions;
    how to balance computational cost with fidelity for deployment; and how to unify
    evaluation metrics across diverse application domains.'
  related_work_outline_zh:
  - 主流方向：构建可交互、可控且持久的视频世界模型，模拟具身场景（机器人、自动驾驶、开放世界探索）中的物理动态，并越来越强调长时一致性、实时交互和开源。
  - 研究共性：以视频生成骨干为基础，从大规模数据中学习世界动态，通过动作、语言指令或多模态轨迹条件生成未来帧；综述类工作将这一碎片化领域整理为潜在表示、结构先验和评估协议的分类体系。
  - 关键差异：表示方式从连续潜变量到离散令牌及混合形式；控制粒度从高层语言目标到细粒度自我运动、物体动态和人体姿态；部分工作处理视线外持久性，其他聚焦于已观察的上下文；评估设置在仿真、真实机器人和纯基准比较之间分化。
  - 趋势演进：从2022年无需模拟器的真实机器人世界模型学习，到2024年组合视频规划与Sora引发的综述，再到2025–2026年交互式、持久化、开源的世界模型，并伴随自动驾驶与通用交互的显式分类法和评估框架。
  - 开放问题：如何在未见原语上实现真正物理规律遵循和分布外泛化；如何设计标准化、闭环的基准以捕捉实时、长时域和多智能体交互；如何在部署中平衡计算成本与保真度；如何统一不同应用领域的评估指标。
  literature_review:
    line_of_work_matrix:
    - line: Compositional world models for video-grounded planning
      what_it_solves: Enables generalization to unseen object/action combinations
        by factorizing video generation from language into reusable primitives, producing
        video plans for robot tasks.
      what_remains_open: Generalization is limited to combinations of primitives seen
        during training; entirely novel primitives are unsupported, and evaluation
        is only in simulation without real-robot execution.
    - line: Persistent out-of-sight dynamics simulation
      what_it_solves: Extends video world models to maintain a global persistent state
        (static 3D background + dynamic entities) that evolves even when unobserved,
        ensuring long-term scene consistency upon revisiting.
      what_remains_open: No explicit limitations are reported in the available evidence;
        scalability to complex, multi-entity scenes and integration with real-time
        control remain unverified.
    - line: Open-source world model systems
      what_it_solves: Provides publicly available, high-fidelity world simulators
        with minute-level memory and real-time interactivity, lowering the barrier
        for reproducible research across diverse visual environments.
      what_remains_open: Methodology quality evidence is limited; detailed comparisons
        with existing benchmarks and failure modes under edge cases are not described
        in the provided analysis.
    - line: Multimodal controllable future prediction
      what_it_solves: Predicts future frames from a reference image conditioned on
        ego-motion, object dynamics, and human poses, generating paired RGB and depth
        for richer spatial understanding over long horizons.
      what_remains_open: The work lacks listed limitations; generalization beyond
        the 4000-hour training distribution and to unseen environments or camera configurations
        is not evidenced.
    - line: World model-based robot learning without simulators
      what_it_solves: Applies latent world models (Dreamer) directly on physical robots,
        enabling fast online learning of locomotion, manipulation, and navigation
        from pixels and sparse rewards without manual resets.
      what_remains_open: Evaluation is constrained to four robot platforms with identical
        hyperparameters; optimality and transferability across broader hardware and
        task families are unknown.
    - line: Taxonomy and evaluation framework synthesis
      what_it_solves: Organizes the design space of latent world models for automated
        driving and interactive video generation into taxonomies of latent representations,
        structural priors, and internal mechanics, and proposes evaluation prescriptions.
      what_remains_open: Proposed frameworks are theoretical without empirical validation;
        they may not cover all existing approaches, and the evaluation prescriptions
        remain unimplemented and untested on real benchmarks.
    consensus:
    - World models are treated as generative simulators that can predict future sensory
      observations conditioned on actions or control signals, forming a common backbone
      across robotics, driving, and interactive environments.
    - Long-horizon temporal consistency and action-conditioned controllability are
      recognized as central technical challenges that must be addressed for practical
      deployment.
    - Latent representations (whether continuous or discrete) are a critical design
      choice that influences the trade-off between compression, fidelity, and controllability.
    - Evaluation of world models is moving beyond image quality metrics to include
      closed-loop, task-oriented measures that reflect planning and decision-making
      performance.
    - Open-source artifacts and standardized benchmarks are increasingly valued to
      ensure reproducibility and fair comparison in a rapidly evolving field.
    disagreements:
    - 'Representation level: some works learn continuous latent states for planning
      (e.g., Dreamer-based), while others generate pixel-level videos and factorize
      them into symbolic primitives or discrete tokens.'
    - 'Control interface: approaches differ in whether they use high-level language
      instructions, fine-grained trajectory and pose signals, or a combination of
      both, affecting the granularity and flexibility of control.'
    - 'Scope of persistence: one line explicitly models out-of-sight dynamics with
      a persistent global state, whereas most methods only simulate dynamics within
      the observed camera frustum.'
    - 'Deployment setting: on-robot learning directly in the physical world contrasts
      with simulation-only evaluation and with survey-based conceptual frameworks,
      leading to different validation strengths and assumptions about sim-to-real
      transfer.'
    - 'Evaluation target: some works emphasize video generation quality (FID, IS),
      others propose new controllability metrics (COM), and survey papers advocate
      for closed-loop, resource-aware metrics, indicating no unified standard exists.'
    open_questions:
    - How can world models reliably simulate physics beyond the combinations of primitives
      or scenarios seen during training, and what evidence is needed to claim a model
      truly understands physical laws?
    - What is the minimal set of evaluation protocols (closed-loop, multi-agent, resource-constrained)
      that can replace the current fragmented landscape of metrics and enable fair
      cross-domain comparison?
    - Under what conditions do persistent, out-of-sight simulations improve downstream
      task performance compared to purely reactive or observation-based memories,
      and how can this be measured systematically?
    - How can we reconcile the computational cost of high-fidelity, real-time interactive
      world models with the need for deployment on resource-limited embodied platforms?
    - To what extent do the taxonomies and evaluation frameworks proposed in recent
      surveys align with the empirical findings of method papers, and how can they
      be iteratively validated as the field evolves?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向视频规划的组合世界模型
      解决的问题: 将语言驱动的视频生成分解为可复用的原语，实现对未见物体与动作组合的泛化，为机器人任务生成视频计划。
      尚未覆盖: 泛化仅限训练中见过的原语组合，全新原语无法支持；评估仅在仿真中进行，未在真实机器人上执行验证。
    - 路线: 持久视线外动态模拟
      解决的问题: 扩展视频世界模型以维护包含静态3D背景和动态实体的全局状态，即便实体离开视野仍持续演化，确保重新可见时的长时场景一致性。
      尚未覆盖: 现有证据未报告显式局限性；复杂多实体场景的可扩展性以及与实时控制的集成尚未验证。
    - 路线: 开源世界模型系统
      解决的问题: 提供公开可用的高保真世界模拟器，具备分钟级记忆和实时交互能力，降低跨多种视觉环境的可复现研究门槛。
      尚未覆盖: 方法学质量证据有限；与现有基准的详细对比及边缘情况下的失效模式未在提供的分析中描述。
    - 路线: 多模态可控未来预测
      解决的问题: 从参考图像出发，以自我运动、物体动态和人体姿态为条件预测未来帧，并生成配对的RGB与深度图，实现长时域下的丰富空间理解。
      尚未覆盖: 无明确局限性说明；对超出4000小时训练分布之外的场景及未见相机配置的泛化能力缺乏证据。
    - 路线: 无需模拟器的世界模型机器人学习
      解决的问题: 将潜变量世界模型（Dreamer）直接部署于物理机器人，仅凭像素和稀疏奖励在线快速学习运动、操作和导航，无需手动重置。
      尚未覆盖: 评估限于四种机器人平台且使用相同超参数；在更广泛硬件和任务族上的最优性与可迁移性未知。
    - 路线: 分类体系与评估框架综合
      解决的问题: 将自动驾驶与交互式视频生成中的潜在世界模型设计空间组织为潜在表示、结构先验和内部机制的分类法，并提出评估方案。
      尚未覆盖: 所提框架均为理论性，缺乏实证验证；可能无法涵盖所有现有方法，评估方案未实施且未在真实基准上测试。
    共识:
    - 世界模型被视为生成式模拟器，能够以动作或控制信号为条件预测未来感官观测，构成机器人、驾驶和交互环境的共同骨干。
    - 长时域时间一致性和动作条件可控性是被普遍认可的核心技术挑战，是实现实际部署必须解决的问题。
    - 潜在表示（无论是连续还是离散）是影响压缩、保真度与可控性之间权衡的关键设计选择。
    - 世界模型的评估正从图像质量指标转向包含闭环、任务导向的度量，以反映规划与决策性能。
    - 开源工件和标准化基准越来越受重视，以确保在快速发展的领域中实现可复现性和公平比较。
    分歧:
    - 表示层次：部分工作学习连续潜在状态用于规划（如基于Dreamer的方法），另一些则生成像素级视频并将其分解为符号化原语或离散令牌。
    - 控制接口：不同方法在使用高层语言指令、细粒度轨迹与姿态信号，或两者结合上存在差异，影响了控制的粒度与灵活性。
    - 持久性范围：一条路线通过持久全局状态显式建模视线外动态，而多数方法仅模拟相机视锥内的动态。
    - 部署场景：直接在物理世界中进行的真实机器人学习，与仅基于仿真的评估以及基于综述的概念框架形成对比，导致不同的验证强度和对sim-to-real迁移的假设。
    - 评估目标：有的工作强调视频生成质量（FID、IS），有的提出新的可控性指标（COM），而综述论文则倡导闭环、资源感知的度量，表明领域内尚无统一标准。
    开放问题:
    - 世界模型如何可靠地模拟超出训练所见原语或场景组合的物理规律，以及需要哪些证据才能声称模型真正理解了物理定律？
    - 什么是最小化的评估协议集（闭环、多智能体、资源受限），能够取代当前碎片化的度量格局，实现跨领域的公平比较？
    - 在何种条件下，持久、视线外的模拟相比于纯反应式或基于观察的记忆能提升下游任务性能，且如何系统性地测量这一提升？
    - 如何在高保真、实时交互世界模型的计算成本与资源受限的具身平台部署需求之间取得平衡？
    - 近期综述中提出的分类法和评估框架在多大程度上与方法论文的实证发现相一致，以及如何随着领域发展进行迭代验证？
