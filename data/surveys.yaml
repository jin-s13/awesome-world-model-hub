  related_work_outline:
  - 'Mainstream direction: Using video generation models as world models for embodied
    AI, particularly robotic manipulation, by conditioning on actions and optimizing
    for physical and task alignment.'
  - 'Shared research pattern: Large-scale pretraining or adaptation of video diffusion/autoregressive
    models with action-conditioning mechanisms, followed by alignment or verification
    to improve fidelity and controllability.'
  - 'Key differences: Action conditioning is implemented via unified transformers,
    lightweight adapters, frame-level modules, or heterogeneous masked autoregression;
    alignment uses reward modeling, DPO, or test-time verifiers; evaluation ranges
    from visual quality to zero-shot physical plausibility benchmarks.'
  - 'Trend evolution: The field is moving from adapting pretrained video models to
    training large, dedicated world models with explicit physics alignment and standardized
    benchmarks, with increasing attention to failure modes like information bottlenecks
    and verifier calibration.'
  - 'Open questions: How to define and evaluate physical persistence and causal reasoning
    beyond visual fidelity; whether test-time scaling laws generalize across tasks;
    and how to bridge the gap between formal world model assumptions and empirical
    model behavior.'
  related_work_outline_zh:
  - 主流方向：将视频生成模型作为具身智能的世界模型，特别是在机器人操作中，通过动作条件化并优化物理与任务对齐。
  - 研究共性：大规模预训练或适配视频扩散/自回归模型，加入动作条件化机制，然后通过对齐或验证提升保真度和可控性。
  - 关键差异：动作条件化实现方式包括统一Transformer、轻量适配器、帧级模块或异构掩码自回归；对齐方法包括奖励建模、DPO或测试时验证器；评估从视觉质量到零样本物理合理性基准。
  - 趋势演进：领域正从适配预训练视频模型转向训练大规模专用世界模型，并强调显式物理对齐和标准化基准，同时更多关注信息瓶颈和验证器校准等失败模式。
  - 开放问题：如何定义和评估超越视觉保真度的物理持久性和因果推理；测试时缩放定律是否跨任务泛化；以及如何弥合形式化世界模型假设与经验模型行为之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies that a world model must construct states and model
        dynamics; provides categories such as implicit/explicit state construction
        and knowledge integration vs. architectural reformulation, and offers concrete
        instantiations through unified action-video diffusion, frame-level conditioning,
        and adaptation methods.
      what_remains_open: Whether the formal conditions (e.g., persistent state, causal
        dynamics) can be reliably implemented in current architectures and whether
        they match empirical behavior on long-horizon, contact-rich tasks.
    - line: Scaling laws and guarantees
      what_it_solves: Connects test-time compute, model size, and verifier design
        to spatial reasoning performance; uncovers poor calibration, action biases,
        and unreliable reward signals in existing world-model-based verifiers, and
        proposes grounded verification frameworks to improve scaling.
      what_remains_open: Direct validation that the identified scaling laws predict
        failures and transfers across diverse benchmarks; consistent scaling on complex
        tasks like MMSI-Bench remains unachieved, indicating an information bottleneck
        in current world models.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into a taxonomy centered
        on state construction and dynamics modeling, and advocates a shift from visual
        fidelity to functional benchmarks that test physical persistence and causality.
      what_remains_open: Whether the taxonomy influences how researchers design, train,
        and evaluate world models; the proposed functional benchmarks are not yet
        widely adopted, and the link between taxonomy categories and empirical success
        is unproven.
    consensus:
    - Video generation models can serve as world models when conditioned on actions,
      enabling policy learning and model-based planning.
    - Evaluation must go beyond visual quality to include physical plausibility, task
      logic, and long-term consistency.
    - Large-scale pretraining on diverse robotic or video datasets improves generalization
      and controllability of the generated rollouts.
    - Alignment or post-training (e.g., via human preferences, DPO, or verifiers)
      is necessary to suppress unphysical behaviors and improve task relevance.
    disagreements:
    - 'Action conditioning strategy: unified transformer with independent diffusion
      timesteps vs. lightweight adapter on frozen pretrained model vs. frame-level
      conditioning modules vs. heterogeneous masked autoregression.'
    - 'Alignment mechanism: multi-dimensional reward modeling with RL post-training
      vs. DPO with decoupled discriminators vs. test-time verification with spatial
      assertions.'
    - 'State representation: implicit through context management vs. explicit through
      latent compression; the community has not converged on which approach better
      supports physical reasoning.'
    - 'Scaling behavior: test-time scaling with verifiers shows improvements on SAT-Real
      but not on MMSI-Bench, indicating disagreement on whether current world models
      can consistently benefit from additional compute.'
    open_questions:
    - How can we define and systematically measure physical persistence and causal
      reasoning in video-based world models, beyond existing visual fidelity metrics?
    - Why do test-time scaling laws fail on certain spatial reasoning benchmarks,
      and what architectural or representational changes would remove the information
      bottleneck?
    - What is the minimal set of formal assumptions (about state, dynamics, and action)
      required for a world model to be reliably used for decision-making in real-world
      robotic tasks?
    - Can human preference alignment scale to the diversity of embodied tasks, and
      how do we ensure the reward models do not introduce new biases or over-optimization
      artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须构建状态和建模动态，提供隐式/显式状态构建、知识整合与架构重构等分类，并通过统一动作-视频扩散、帧级条件化和适配方法给出具体实例。
      尚未覆盖: 形式条件（如持久状态、因果动态）能否在当前架构中可靠实现，以及它们是否匹配长时域、接触丰富任务上的经验行为。
    - 路线: 缩放规律与保证
      解决的问题: 将测试时计算、模型规模和验证器设计与空间推理性能联系起来，揭示现有基于世界模型的验证器中校准不良、动作偏差和不可靠奖励信号，并提出基于断言的验证框架以改善缩放。
      尚未覆盖: 所识别的缩放规律能否预测跨基准的失败和迁移；在MMSI-Bench等复杂任务上尚未实现一致缩放，表明当前世界模型存在信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织成以状态构建和动态建模为中心的分类法，倡导从视觉保真度转向测试物理持久性和因果推理的功能基准。
      尚未覆盖: 该分类法是否影响研究者设计、训练和评估世界模型；所提议的功能基准尚未被广泛采用，分类类别与经验成功之间的联系尚未证明。
    共识:
    - 以动作为条件的视频生成模型可作为世界模型，用于策略学习和基于模型的规划。
    - 评估必须超越视觉质量，包括物理合理性、任务逻辑和长期一致性。
    - 在多样化机器人或视频数据上的大规模预训练可以提高生成轨迹的泛化性和可控性。
    - 对齐或后训练（例如通过人类偏好、DPO或验证器）对于抑制非物理行为和提升任务相关性是必要的。
    分歧:
    - 动作条件化策略：具有独立扩散时间步的统一Transformer vs. 在冻结预训练模型上的轻量适配器 vs. 帧级条件化模块 vs. 异构掩码自回归。
    - 对齐机制：基于多维奖励建模的RL后训练 vs. 具有解耦判别器的DPO vs. 基于空间断言的测试时验证。
    - 状态表示：通过上下文管理的隐式方式 vs. 通过潜在压缩的显式方式；社区尚未就哪种方法更有利于物理推理达成一致。
    - 缩放行为：基于验证器的测试时缩放在SAT-Real上有效，但在MMSI-Bench上无效，表明当前世界模型是否能一致地受益于额外计算存在分歧。
    开放问题:
    - 如何定义和系统测量基于视频的世界模型中的物理持久性和因果推理，超越现有的视觉保真度指标？
    - 为什么测试时缩放定律在某些空间推理基准上失效，需要哪些架构或表示上的改变来消除信息瓶颈？
    - 世界模型要可靠地用于真实世界机器人决策所需的最少形式化假设（关于状态、动态和动作）是什么？
    - 人类偏好对齐能否扩展到多样化的具身任务，以及如何确保奖励模型不会引入新的偏见或过度优化伪影？
