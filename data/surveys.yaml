    - How well do current systems generalize beyond the reported platforms and datasets
      such as CARL, nuScenes, Minecraft, and individual robot hardware?
    - What speed-fidelity-deployment trade-offs remain for real-time closed-loop multi-camera
      or physical-robot systems?
