  related_work_outline:
  - 'Mainstream direction: Generative world models are shifting toward diffusion transformers
    and sequence models that produce video or imagined rollouts, with auxiliary tasks
    for long-horizon, action-conditional, and physically plausible prediction in driving
    and robotics.'
  - 'Shared research pattern: Several works add structural or consistency signals
    beyond raw reconstruction: mask or primitive factorization, depth/keypoint physics
    tasks, context conditioning, and action diffusion. This improves generalization
    and temporal coherence rather than only visual fidelity.'
  - 'Key differences: They differ in representation and control interface: stochastic
    latent world models, video diffusion transformers, factorized language-primitive
    generators, and unified video-action diffusion; evaluation ranges from pixel quality
    to memory, spatial, and policy generalization.'
  - 'Trend evolution: Evidence shifts from Atari and contextual model-based RL around
    2023-2024 toward large driving and robotic video models plus closed-loop consistency
    benchmarks in 2025-2026, with growing attention to memory, action control, and
    zero-shot settings.'
  - 'Open questions: Unclear which auxiliary objectives transfer across domains; whether
    spatial and memory metrics improve downstream policy success; and how much gain
    comes from representation versus planner, data scale, or action interface.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型正转向扩散Transformer和序列模型，生成视频或想象轨迹，并辅以长时域、动作条件和物理合理预测的辅助任务，主要面向驾驶和机器人。
  - 研究共性：多项研究在原始重建之外引入结构或一致性信号：掩码/原语分解、深度/关键点物理任务、上下文条件、动作扩散，以提升泛化与时序一致性，而非仅追求视觉保真。
  - 关键差异：表示和控制接口不同：随机潜在世界模型、视频扩散Transformer、分解式语言原语生成器、统一视频-动作扩散；评测从像素质量延伸到记忆、空间和策略泛化。
  - 趋势演进：证据从2023-2024年的Atari和上下文模型强化学习，转向2025-2026年大规模驾驶/机器人视频模型与闭环一致性基准，更关注记忆、动作控制和零样本设置。
  - 开放问题：哪些辅助目标可跨域迁移；空间/记忆指标能否提升下游策略成功率；收益中有多少来自表示本身，而非规划器、数据规模或动作接口，尚不清楚。
  literature_review:
    line_of_work_matrix:
    - line: Video world-model representation and objective design
      what_it_solves: Learns high-dimensional visual dynamics from video using diffusion
        or sequence models, with auxiliary objectives such as mask reconstruction,
        depth, keypoint, or physics-informed tasks.
      what_remains_open: Which representation or auxiliary loss transfers beyond the
        reported driving, Atari, or robotic datasets; long-horizon and physical consistency
        still lack universal metrics.
    - line: Context- and composition-aware dynamics generalization
      what_it_solves: Enables zero-shot adaptation to unseen dynamics, objects, or
        goals by conditioning on observed context values or language primitives.
      what_remains_open: Context observability assumptions, support for entirely new
        primitives, and limited evaluation beyond CARL, RT-X, and simulation.
    - line: Action-coupled video generation and policy learning
      what_it_solves: Connects video dynamics with actions, forward/inverse dynamics,
        policy pretraining, or imagined rollouts through unified diffusion and model-based
        RL.
      what_remains_open: Separating model contribution from planner or controller
        gains; cross-action-space generalization and deployment beyond reported robot
        setups remain weakly evidenced.
    - line: Spatial, memory, and action-control evaluation protocols
      what_it_solves: Benchmarks long-term consistency and action control beyond per-frame
        visual fidelity, using loop navigation, scene-graph consistency, and closed-loop
        revisit designs.
      what_remains_open: Metrics are not yet clearly linked to downstream task success,
        and some benchmark papers report limited or no comparative experimental results.
    consensus:
    - World models are increasingly framed as generative sequence or diffusion models
      over high-dimensional observation and action streams, not only as one-step predictors.
    - Auxiliary structure such as mask reconstruction, depth/keypoint prediction,
      context conditioning, or memory-consistency metrics is used to improve realism,
      generalization, or temporal coherence.
    - Evaluation is moving from per-frame visual quality to long-horizon, action-conditional,
      closed-loop, spatial, and memory consistency protocols.
    - Many papers provide architecture, dataset, baseline, and metric evidence, but
      limitation and ablation sections are often sparse or absent, leaving verification
      gaps.
    disagreements:
    - 'Representation differs: some use stochastic latent sequence models, others
      use diffusion transformers, factorized language-primitive generators, or unified
      video-action diffusion.'
    - 'Supervision differs: mask reconstruction, physics-informed depth/keypoint losses,
      context conditioning, and independent diffusion timestep control each emphasize
      different consistency properties.'
    - Evaluation target differs across visual fidelity, spatial consistency, memory
      and action control, and downstream policy generalization.
    - 'Interaction and deployment setting differ: action-free video generation, language-conditioned
      imagination, action-conditioned prediction, closed-loop navigation/robotics,
      and driving simulation.'
    - Some methods assume observable context or predefined language primitives; others
      avoid that assumption but rely on large robot or driving video datasets.
    open_questions:
    - Do spatial, memory, and long-horizon video-consistency improvements transfer
      to measurable downstream policy or control success?
    - Which auxiliary objective or architectural choice generalizes beyond the reported
      driving, Atari, Minecraft, or robotic datasets?
    - How well do current world models handle unseen context values, novel action
      spaces, or entirely new language primitives without explicit priors?
    - How much of reported improvement is attributable to the learned world model
      rather than dataset scale, planner or controller, action interface, or benchmark
      design?
    - What are the failure modes, compute/data boundaries, and ablations of these
      methods given many limitation fields are empty?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频世界模型表示与目标设计
      解决的问题: 利用扩散或序列模型从视频中学习高维视觉动力学，并引入掩码重建、深度、关键点或物理等辅助目标。
      尚未覆盖: 哪些表示或辅助损失可迁移到已报告数据集之外；长时域与物理一致性仍缺少通用度量。
    - 路线: 上下文与组合感知的动力学泛化
      解决的问题: 通过对可观测上下文或语言原语进行条件建模，实现对未见动力学、物体或目标的零样本泛化。
      尚未覆盖: 上下文可观测性假设、全新原语支持，以及CARL、RT-X和仿真之外的真实场景证据。
    - 路线: 动作耦合视频生成与策略学习
      解决的问题: 通过统一扩散或想象轨迹连接视频动力学、动作、策略与正向/逆向动力学，用于机器人预训练和策略改进。
      尚未覆盖: 难以分离模型贡献与规划器或控制器收益；跨动作空间泛化和部署边界证据有限。
    - 路线: 空间、记忆与动作控制评测协议
      解决的问题: 通过循环导航、场景图一致性和闭环重访设计，测量世界模型的空间一致性、记忆一致性和动作控制。
      尚未覆盖: 指标与下游任务成功的联系尚未证明，部分基准论文缺少充分对比实验结果。
    共识:
    - 世界模型越来越多被构建为对高维观测和动作流进行建模的生成式序列或扩散模型，而非单步预测器。
    - 通过掩码重建、深度/关键点预测、上下文条件或记忆一致性等辅助结构，改善真实性、泛化或时序一致性。
    - 评测正在从逐帧视觉质量转向长时域、动作条件、闭环、空间与记忆一致性协议。
    - 不少论文给出了架构、数据集、基线和指标证据，但局限性与消融部分常较稀疏或缺失，构成验证缺口。
    分歧:
    - 表示方式不同：随机潜在序列模型、扩散Transformer、分解式语言原语生成器或统一视频-动作扩散并存。
    - 监督信号不同：掩码重建、物理信息深度/关键点损失、上下文条件和独立扩散时间步控制各自强调不同的一致性。
    - 评测目标不同：视觉保真、空间一致性、记忆与动作控制，以及下游策略泛化分别覆盖不同数据集与指标。
    - 交互与部署设置不同：无动作视频生成、语言条件想象、动作条件预测、闭环导航/机器人以及驾驶仿真同时存在。
    - 部分方法假设上下文可观测或语言原语预定义；另一些避免该假设，但依赖大规模机器人或驾驶视频数据。
    开放问题:
    - 空间、记忆和长时域视频一致性提升能否转化为可测量的下游策略或控制成功率？
    - 哪种辅助目标或架构选择能泛化到已报告的驾驶、Atari、Minecraft或机器人数据集之外？
    - 在没有显式先验时，当前世界模型如何处理未见上下文值、新动作空间或全新语言原语？
    - 报告的性能提升中，有多少来自学习到的世界模型，而非数据规模、规划器/控制器、动作接口或基准设计？
    - 鉴于许多局限性字段为空，这些方法的失败模式、计算/数据边界和消融证据是什么？
