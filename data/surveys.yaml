    quality or downstream policy performance.'
  - 'Key differences: Conditioning interface varies from explicit controls to latent
    actions; evaluation targets range from spatial consistency and action fidelity
    to visual fidelity and closed-loop policy success; deployment ranges from offline
    benchmarks to low-latency closed-loop simulation.'
  - 'Trend evolution: From context-conditioned dynamics models in 2024 toward physics-informed
    and benchmark-driven simulation in 2025, then cross-embodiment and closed-loop
    low-latency systems in 2026; evidence is concentrated in the current frontier.'
  - 'Open questions: Generalization beyond single environments and sensor settings,
    long-horizon consistency under autoregressive rollout, physical and causal validity,
    robust deployment at scale, and independent reproduction across teams and infrastructure.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型构建可运行的数据生成与仿真系统，强调动作或上下文可控，常用于具身与自动驾驶场景，并配套高保真视频生成和评测基准。
  - 研究共性：系统将大规模视频预测与动作、上下文或物理条件输入结合，并用生成质量或下游策略性能进行评估。
  - 关键差异：条件接口从显式控制、上下文变量到潜在动作不等；评测目标覆盖空间一致性、动作忠实度、视觉保真度与闭环策略成功率；部署从离线评测到低延迟闭环仿真。
  - 趋势演进：2024年侧重上下文条件动力学模型，2025年转向物理信息与基准驱动仿真，2026年出现跨具身和闭环低延迟系统；证据集中在当前前沿。
  - 开放问题：跨环境与传感器配置的泛化、自回归长时程一致性、物理与因果有效性、规模化部署可靠性，以及跨团队独立复现。
  literature_review:
    line_of_work_matrix:
    - line: Context- and physics-conditioned world-model training systems
      what_it_solves: Learning latent dynamics conditioned on observed context or
        physics signals to improve zero-shot generalization and physically plausible
        visual dynamics.
      what_remains_open: Assumes context observability or physics supervision; evaluations
        cover few tasks or robotic scenes, so generalization to unseen environments
        and real-world settings remains unverified.
    - line: Action-controllable simulation and evaluation platforms for embodied and
        driving domains
      what_it_solves: Quantifying whether generated future video follows control inputs
        and providing datasets or benchmarks for action fidelity and visual realism.
      what_remains_open: Action adherence is still imperfect; evaluation often focuses
        on a single dataset or domain, and long-horizon control plus cross-sensor
        or cross-city deployment remain open.
    - line: Cross-embodiment and closed-loop autoregressive serving stacks
      what_it_solves: Scaling world models across heterogeneous robot or driving data
        and producing closed-loop, low-latency rollouts for policy training and evaluation.
      what_remains_open: Evidence is limited to selected benchmarks and real-robot
        platforms; long-horizon consistency, complex-scene or multi-GPU deployment,
        and independent artifact availability remain gaps.
    consensus:
    - Recent work agrees that world-model systems should not only generate visually
      plausible video but also respond to action, context, or physics constraints
      to be useful for embodied policy training and evaluation.
    - Systems increasingly converge on synthetic rollouts or generated data as a scalable
      substrate for policy learning, rather than passive video prediction alone.
    - 'Evaluation is treated as part of the system contribution: papers introduce
      datasets, benchmarks, or downstream policy evaluations alongside the model.'
    disagreements:
    - 'Conditioning interface differs: explicit context variables, 3D-grounded latent
      actions, physics signals, or structured driving controls.'
    - 'Evaluation target differs: spatial consistency in navigation, action fidelity
      in driving video, visual fidelity and physical plausibility in robotic video,
      or policy success after synthetic training.'
    - 'Interaction mode differs: offline conditional generation and benchmark scoring
      versus closed-loop autoregressive simulation with latency constraints.'
    - 'Generalization setting differs: zero-shot context extrapolation, cross-embodiment
      transfer, or single-environment driving.'
    open_questions:
    - How well do these systems transfer beyond the limited tasks and datasets evaluated,
      especially to real-world deployment and new sensor or robot configurations?
    - What mechanisms preserve long-horizon consistency and physical validity without
      accumulating autoregressive errors in closed-loop rollouts?
    - Which conditioning interface best supports cross-embodiment transfer while remaining
      controllable enough for policy learning?
    - How reproducible are the claimed systems when code, datasets, and infrastructure
      are absent or only partially documented?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 上下文与物理条件世界模型训练系统
      解决的问题: 在潜在动力学中引入可观测上下文或物理信号，以提升零样本泛化或物理合理视觉动态。
      尚未覆盖: 依赖上下文可观测或物理监督，且仅在少量任务或机器人场景上验证，未知场景与真实部署泛化不足。
    - 路线: 面向具身与驾驶的动作可控仿真评测平台
      解决的问题: 衡量生成视频是否遵循控制输入，并提供用于动作忠实度与视觉质量的评测数据或基准。
      尚未覆盖: 动作遵循仍不完全；评测常集中在单一数据集或领域，长时程控制与跨传感器、跨城市部署仍开放。
    - 路线: 跨具身与闭环自回归服务栈
      解决的问题: 在异构机器人或驾驶数据上扩展世界模型，并生成闭环低延迟推演用于策略训练与评测。
      尚未覆盖: 仅在选定基准和少量真实机器人平台上验证；长时程一致性、复杂场景扩展及独立工件可用性仍有缺口。
    共识:
    - 近期工作一致认为，面向具身和自动驾驶的世界模型系统不能止于生成视觉逼真视频，还需响应动作、上下文或物理约束，以支持策略学习与评测。
    - 系统贡献趋向于把合成推演或生成数据作为可扩展的策略训练底座，而非单纯被动视频预测。
    - 评测逐渐成为系统的一部分，论文通常同时给出数据集、基准或下游策略评估来支持模型主张。
    分歧:
    - 条件表示接口不同：显式上下文变量、3D接地潜在动作、物理信号或结构化驾驶控制。
    - 评测目标不同：导航空间一致性、驾驶视频动作忠实度、机器人视频视觉保真与物理合理性，或合成训练后的策略成功率。
    - 交互模式不同：离线条件生成与基准评分，对比闭环自回归仿真及其延迟约束。
    - 泛化设定不同：上下文零样本外推、跨具身迁移或单一驾驶环境。
    开放问题:
    - 这些系统在有限任务和数据集之外能否迁移到真实部署及新的传感器或机器人配置？
    - 闭环推演中如何维持长时程一致性并避免自回归误差累积导致物理失真？
    - 哪种条件接口能兼顾跨具身迁移和策略学习所需可控性？
    - 在代码、数据集与基础设施证据缺失时，系统主张能在多大程度上被独立复现？
