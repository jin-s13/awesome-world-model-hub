  related_work_outline:
  - 'Mainstream direction: World-model evaluation dominates this slice, centering
    on action-conditioned video or trajectory prediction with diagnostics for spatial
    consistency, memory, action control, and domain transfer; representative examples
    include LoopNav, MIND, MaskGWM, and DIAMOND.'
  - 'Shared research pattern: Papers use or construct observation-action datasets
    and propose metrics beyond pixel reconstruction, then compare against baselines
    or protocols; several combine benchmark design with model training.'
  - 'Key differences: Evaluation settings range from Minecraft loop navigation and
    open-domain video to driving, robotics, and Atari; evaluation targets differ among
    spatial consistency, memory/action control, long-horizon rollout, visual plausibility,
    and downstream policy utility.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2023-2026, so
    the trend is within the current frontier, shifting from aggregate RL benchmarks
    such as Atari 100k toward domain-specific world-model stress tests for driving,
    robotics, and memory/spatial consistency.'
  - 'Open questions: How to align proxy metrics with downstream decisions; what coverage
    is needed to expose long-horizon and cross-action-space generalization failures;
    whether conclusions remain stable across implementations, compute budgets, and
    missing artifact details.'
  related_work_outline_zh:
  - 主流方向：围绕世界模型评测展开，以动作条件的视频或轨迹预测为核心，并加入空间一致性、记忆、动作控制和跨域迁移诊断；代表性工作包括LoopNav、MIND、MaskGWM和DIAMOND。
  - 研究共性：使用或构建动作-观测配对数据，提出超出像素重建的评价指标，并与基线或协议比较；多个工作把基准设计与模型训练相结合。
  - 关键差异：评测场景从Minecraft循环导航、开放域视频到驾驶、机器人和Atari；评测目标分别侧重空间一致性、记忆/动作控制、长时域推演、视觉合理性或下游策略分数。
  - 趋势演进：可获证据集中在2023-2026年，处于当前前沿；从Atari 100k等聚合RL基准转向更具体的驾驶泛化、机器人动力学和记忆/空间一致性压力测试。
  - 开放问题：代理指标如何对齐下游决策；需要何种覆盖才能暴露长时域与跨动作空间泛化失败；缺失工件时结论能否跨实现、算力和模型族复现。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for world models
      what_it_solves: Creates shared action-observation datasets and protocols so
        prediction consistency, action control, and domain generalization can be compared
        across models.
      what_remains_open: Whether curated scenes, action spaces, and video lengths
        cover deployment settings, rare events, and long-horizon use cases where world
        models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory stability, action control,
        physical plausibility, or downstream policy utility beyond aggregate reconstruction
        or game score.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; current metrics only partially capture real robot
        or driving deployment utility.
    - line: Comparable baselines and reporting
      what_it_solves: Provides reference models or benchmark protocols for reproducing
        claims about efficient, generalizable, or state-of-the-art world-model training.
      what_remains_open: Stability of benchmark conclusions across different implementations,
        compute budgets, action spaces, and missing code/dataset details.
    consensus:
    - Action-conditioned video or trajectory prediction is becoming the core evaluation
      substrate for world-model capability.
    - Diagnostic dimensions such as spatial consistency, memory consistency, action
      control, and long-horizon rollout are replacing or augmenting aggregate scores.
    - Open dataset and protocol artifacts are used as reproducibility signals, but
      incomplete implementation or limitation details remain a recurring verification
      gap.
    disagreements:
    - Some contributions are benchmark-only dataset/protocol papers, while others
      propose model architectures and evaluate them on existing or new benchmarks.
    - 'Evaluation targets differ: scene-graph spatial consistency, memory/action control
      in open-domain video, visual and physical plausibility, and downstream policy
      performance on Atari or robotic tasks.'
    - Deployment settings differ from game/navigation environments to driving and
      robot manipulation, so the assumed action spaces and safety-relevant dynamics
      are not equivalent.
    - 'Proxy metrics are not aligned: human-normalized game scores, visual/physical
      plausibility scores, and downstream policy utility capture different aspects
      of world-model quality.'
    open_questions:
    - How should benchmarks balance visual fidelity, dynamics accuracy, spatial/memory
      consistency, and downstream control utility without overfitting to one proxy
      metric?
    - What scene diversity, action-space coverage, and horizon length are necessary
      to expose the long-term memory and cross-action-space generalization failures
      observed in current world models?
    - Can benchmark conclusions be reproduced across different implementations, compute
      budgets, and model families when code, dataset, or training details are incomplete?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型基准任务与数据集设计
      解决的问题: 构建共享的动作-观测数据集和协议，使预测一致性、动作控制和跨域泛化可跨模型比较
      尚未覆盖: 精选场景、动作空间和视频长度是否覆盖部署环境、罕见事件及世界模型应发挥作用的长时域场景
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合重建或游戏得分之外，检验空间一致性、记忆稳定性、动作控制、物理合理性或下游策略效用
      尚未覆盖: 代理指标与用户真正关心的下游决策之间是否一致；现有指标只部分反映真实机器人或驾驶部署效用
    - 路线: 可比基线与报告规范
      解决的问题: 提供参考模型或基准协议，让高效、泛化或最先进世界模型训练主张可复现审计
      尚未覆盖: 不同实现、算力预算、动作空间和代码/数据集细节缺失时，基准结论是否仍稳定
    共识:
    - 动作条件的视频或轨迹预测正在成为世界模型能力的核心评测载体。
    - 空间一致性、记忆一致性、动作控制和长时域推演等诊断维度正在替代或补充聚合分数。
    - 开放数据集和协议被用作可重复信号，但实现或局限性细节不完整仍是常见验证缺口。
    分歧:
    - 部分工作是仅提供基准/数据集的协议论文，另一些工作提出模型架构并在现有或新基准上评测。
    - 评测目标不同：场景图空间一致性、开放域视频中的记忆/动作控制、视觉与物理合理性、以及Atari或机器人任务上的下游策略性能。
    - 部署设置从游戏/导航环境到驾驶和机器人操作不等，所假设的动作空间和安全相关动力学并不一致。
    - 代理指标未对齐：人类归一化游戏得分、视觉/物理合理性得分和下游策略效用衡量的是不同维度。
    开放问题:
    - 如何在视觉保真、动力学准确、空间/记忆一致性和下游控制效用之间取得平衡，同时避免对单一代理指标过拟合？
    - 需要什么样的场景多样性、动作空间覆盖和时域长度，才能暴露当前世界模型中的长期记忆和跨动作空间泛化失败？
    - 当代码、数据集或训练细节不完整时，基准结论能否在不同实现、算力预算和模型族上复现？
