  related_work_outline:
  - 'Mainstream direction: World models are shifting from controlled game environments
    (Atari, Minecraft) to embodied interaction in robotics, autonomous driving, and
    open-world settings, with a strong emphasis on video generation, multi-task pretraining,
    and explicit physical or spatial consistency.'
  - 'Shared research pattern: Works cast world models as conditional video generators
    (conditioned on actions, language, or context) using diffusion transformers and
    VAE-type architectures, then use the generated rollouts to train policies or evaluate
    future states.'
  - 'Key differences: Domains differ in the inductive biases they inject (mask reconstruction,
    depth/keypoint dynamics, language primitives), the action representations they
    use (continuous diffusion, discrete, parsed primitives), and the evaluation targets
    (multi-view prediction, task success, spatial/memory consistency).'
  - 'Trend evolution: From 2023 data-efficient Atari world models (STORM) through
    2024–2025 compositional and physics-informed robot models (RoboDreamer, RoboScape,
    UWM) and driving models (MaskGWM), to 2025–2026 benchmarks that systematically
    measure memory, spatial consistency, and action control (LoopNav, MIND), the field
    is moving from capability demonstration to auditing consistency and generalization
    boundaries.'
  - 'Open questions: Verifying physical plausibility over long rollouts, transferring
    policies across embodiments and environments, leveraging action-free video data,
    and building standardized metrics for long-term memory and consistency remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：世界模型正从受控游戏环境（Atari、Minecraft）转向机器人、自动驾驶和开放世界中的具身交互，重点在于视频生成、多任务预训练和明确的物理或空间一致性。
  - 研究共性：这些工作将世界模型构建为以动作、语言或上下文为条件的视频生成器，采用扩散Transformer和变分自编码器等架构，并利用生成的推演来训练策略或评估未来状态。
  - 关键差异：不同领域注入的归纳偏置不同（掩码重建、深度/关键点动力学、语言原语），使用的动作表征各异（连续扩散、离散动作、解析后的原语），评估目标也分化了（多视角预测、任务成功率、空间/记忆一致性）。
  - 趋势演进：从2023年数据高效的Atari世界模型（STORM），到2024–2025年组合式与物理信息驱动的机器人模型（RoboDreamer、RoboScape、UWM）和驾驶模型（MaskGWM），再到2025–2026年系统测量记忆、空间一致性和动作控制的基准（LoopNav、MIND），该领域正从能力展示转向对一致性和泛化边界的审查。
  - 开放问题：验证长时域推演中的物理合理性、跨本体和环境的策略迁移、利用无动作视频数据，以及建立长期记忆和一致性的标准化指标仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models with multi-view generation
      what_it_solves: predicting future scenes in driving videos for simulation and
        policy evaluation
      what_remains_open: real-world safety alignment and long-horizon consistency
        remain unverified
    - line: Game-based world models for data-efficient RL
      what_it_solves: learning compact world models from limited interactions in Atari
        and Minecraft to train policies
      what_remains_open: generalization when game rules or tasks change beyond training
        distribution
    - line: Compositional and physics-informed robot world models
      what_it_solves: generating task-conditional robot videos and policies from language,
        actions, and physical priors
      what_remains_open: transfer to real-world hardware and bounding physical plausibility
        errors
    - line: Benchmarks for world model consistency and control
      what_it_solves: measuring spatial consistency, memory, and action controllability
        that visual fidelity misses
      what_remains_open: standardized metrics across diverse action spaces and long-term
        memory evaluations
    consensus:
    - World models are increasingly cast as video generation models conditioned on
      actions or language, with diffusion transformers and variational autoencoders
      as dominant architectures.
    - Multi-task pretraining on large-scale datasets is seen as a path to more generalizable
      policies, moving beyond single-environment training.
    - Evaluation is expanding from visual quality to include state consistency, memory
      coherence, and action control, as shown by new benchmarks.
    disagreements:
    - 'The choice of inductive bias differs: MaskGWM uses mask reconstruction for
      driving, RoboScape injects depth and keypoint dynamics, and RoboDreamer factorizes
      via language primitives.'
    - 'Action representation varies: continuous actions in UWM diffusion, discrete
      actions in Atari world models, and language-parsed primitives in RoboDreamer.'
    - 'Evaluation targets diverge: driving models focus on multi-view prediction,
      robot models on task completion, and benchmarks on spatial or memory consistency.'
    open_questions:
    - How can we verify that physics-informed world models maintain physical plausibility
      over long rollouts, given the lack of rigorous physical validation metrics?
    - Can policies trained inside world models transfer across different robot embodiments
      or driving environments without retraining on target-specific data?
    - What is the effective way to leverage action-free video data to improve world
      model learning, and how does it compare to fully labeled data?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶多视图世界模型
      解决的问题: 生成驾驶场景的未来视频，用于仿真和策略评估
      尚未覆盖: 真实世界安全对齐与长时域一致性尚未验证
    - 路线: 基于游戏环境的数据高效强化学习世界模型
      解决的问题: 在Atari和Minecraft等环境中从有限交互中学习紧凑的世界模型，用于训练策略
      尚未覆盖: 游戏规则或任务变化超出训练分布时的泛化
    - 路线: 组合式与物理信息驱动的机器人世界模型
      解决的问题: 从语言、动作和物理先验生成任务条件化的机器人视频与策略
      尚未覆盖: 向真实硬件迁移及物理合理性误差的边界
    - 路线: 世界模型一致性与控制基准
      解决的问题: 度量视觉保真度无法捕捉的空间一致性、记忆和动作可控性
      尚未覆盖: 跨不同动作空间的标准化指标及长期记忆评估
    共识:
    - 世界模型正越来越多地被构建为以动作或语言为条件的视频生成模型，扩散Transformer和变分自编码器是主流架构。
    - 在大规模数据集上进行多任务预训练被视为获得更通用策略的途径，超越了单环境训练的方式。
    - 评估正从视觉质量扩展到包括状态一致性、记忆连贯性和动作控制，新基准的出现体现了这一趋势。
    分歧:
