  related_work_outline:
  - 'Mainstream direction: The evidence clusters around generative world modeling
    with diffusion transformers, often augmented by auxiliary tasks such as mask reconstruction,
    physics-informed depth/keypoint prediction, language-compositional video generation,
    or action coupling for driving, robotic, and game settings.'
  - 'Shared research pattern: Works learn dynamics through self-supervised sequence
    or video generation, or latent state reconstruction, then connect the learned
    model to policy learning, action-conditioned generation, or benchmarked consistency
    probes.'
  - 'Key differences: Representations range from latent recurrent state-space models
    to pixel-level diffusion video; supervision includes context-conditioned RL, physics
    and action signals; evaluation spans Atari sample efficiency, CARL zero-shot generalization,
    driving video quality, robot execution, and memory/action benchmarks.'
  - 'Trend evolution: Available high-ranked evidence is concentrated in 2023-2026
    and shifts from sample-efficient transformer-VAE latent world models toward diffusion-based
    multiview, embodied, physics-informed, and benchmarked world models.'
  - 'Open questions: How much benefit comes from learned dynamics versus the planner
    or policy; whether visual fidelity translates to control robustness; how to measure
    long-horizon memory, spatial consistency, and cross-action generalization without
    task-specific overfitting.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer为主的生成式世界模型，常通过掩码重建、深度与关键点、语言组合或动作耦合等辅助目标提升视频预测。
  - 研究共性：利用自监督视频生成或潜在状态重建学习动力学，再将模型连接到策略学习、动作条件生成或一致性评测。
  - 关键差异：表示从潜在循环状态空间到像素级扩散视频不等，监督信号包括上下文、物理、动作，评测覆盖Atari、CARL、驾驶、机器人与记忆/动作基准。
  - 趋势演进：现有高排名证据集中在2023-2026年，从高样本效率的潜在世界模型转向多视角、具身、物理约束和基准化评测的扩散世界模型。
  - 开放问题：收益有多少来自动力学模型本身而非规划器或策略；视觉保真度能否转化为控制鲁棒性；如何衡量长期记忆、空间一致性和跨动作空间泛化。
  literature_review:
    line_of_work_matrix:
    - line: Masked and physics-informed generative video world models
      what_it_solves: Long-horizon, multiview, or physically plausible video prediction
        by adding auxiliary objectives to diffusion or generative training.
      what_remains_open: Evidence is concentrated in driving and robotic video tasks;
        transfer to other control settings and connection to downstream planning are
        not fully isolated.
    - line: Latent model-based reinforcement learning with contextual or stochastic
        objectives
      what_it_solves: Sample-efficient policy learning and zero-shot dynamics generalization
        by learning latent dynamics that can generate imagined trajectories.
      what_remains_open: Assumes observable context or limited task families; gains
        from the world model versus the policy or planner are not cleanly separated.
    - line: Compositional and multimodal action-video interfaces for robotics
      what_it_solves: Connects language, video, and action modalities so policies
        can be pretrained or imagined from compositional primitives or unified diffusion.
      what_remains_open: Generalization beyond seen primitives, real-robot validation,
        and reliable language-to-primitive parsing remain unresolved.
    - line: World-model capability benchmarks for memory, space, and action
      what_it_solves: Provides datasets and metrics for spatial consistency, memory
        consistency, and action control that pixel-level prediction alone may miss.
      what_remains_open: Benchmark coverage is still narrow and one benchmark lacks
        reported experimental results; standardized cross-model and cross-domain comparison
        is incomplete.
    consensus:
    - World-model training is dominated by self-supervised generation or reconstruction
      objectives rather than purely supervised dynamics labels.
    - Auxiliary signals such as mask reconstruction, physics knowledge, context conditioning,
      action coupling, or language composition are used to improve generalization
      or controllability.
    - Evaluation is task-specific and often tied to visual prediction quality, sample
      efficiency, or downstream policy performance; benchmarks are emerging to probe
      consistency and action control.
    - Transformer and diffusion architectures are common substrates, but the evidence
      does not show a single architectural recipe transfers across all tasks.
    disagreements:
    - 'Representation: some methods use latent state-space models, while others generate
      pixel-level video or decompose video into language-conditioned primitives.'
    - 'Supervision: methods differ in whether they rely on action-free generation,
      context-conditioned RL, physics-informed auxiliary tasks, or coupled action-video
      diffusion.'
    - 'Evaluation target: Atari sample efficiency, CARL zero-shot generalization,
      driving video quality, robot task success, and memory/action benchmark scores
      emphasize different capabilities.'
    - 'Interaction mode: some models are used for imagined policy training, others
      for language-driven video planning or unified policy/dynamics pretraining; benchmark
      works focus on closed-loop consistency and action control.'
    open_questions:
    - Do improvements in video generation or latent reconstruction transfer to better
      planning and control when the planner or policy is held fixed?
    - Which world-model representation is necessary for long-horizon spatial and memory
      consistency across viewpoint and action changes?
    - How far can compositional or physics-informed objectives generalize beyond seen
      primitives, tasks, or simulation environments?
    - What evaluation protocol can isolate model contribution from dataset, baseline,
      metric, and system-level implementation choices?
    - Several top-ranked entries lack limitation details or citation-graph evidence;
      missing code, dataset, baseline, or metric information is a verification gap
      rather than confirmed absence.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码与物理先验的生成式视频世界模型
      解决的问题: 通过扩散或生成训练中的辅助目标，提升长时域、多视角或物理合理的视频预测能力
      尚未覆盖: 证据集中在驾驶与机器人视频任务；向其他控制任务和下游规划的迁移尚未隔离
    - 路线: 上下文或随机目标的潜在模型式强化学习
      解决的问题: 学习潜在动力学并生成想象轨迹，提升样本效率与零样本动力学泛化
      尚未覆盖: 假设上下文可观测或任务族有限；模型与策略或规划器的收益未清晰分离
    - 路线: 面向机器人的组合式与多模态动作-视频接口
      解决的问题: 连接语言、视频与动作，使策略可通过组合原语或统一扩散进行预训练和想象
      尚未覆盖: 对未见原语的泛化、真实机器人验证以及语言到原语的可靠解析仍不充分
    - 路线: 面向世界模型的记忆、空间与动作能力基准
      解决的问题: 提供数据集和指标，衡量像素级预测可能忽略的空间一致性、记忆一致性和动作控制能力
      尚未覆盖: 基准覆盖范围仍窄；部分基准未报告实验结果，跨模型与跨领域标准比较不完整
    共识:
    - 世界模型训练以自监督生成或重建目标为主，而非依赖完全监督的动力学标签。
    - 常通过掩码重建、物理知识、上下文条件、动作耦合或语言组合等辅助信号提升泛化或可控性。
    - 评测通常针对特定任务，如视觉预测质量、样本效率或下游策略性能，并开始出现一致性与动作控制基准。
    - Transformer 与扩散架构是常见基础，但证据未显示单一架构配方可跨任务迁移。
    分歧:
    - 表示方式：有的方法使用潜在状态空间模型，有的生成像素级视频或分解为语言条件原语。
    - 监督信号：方法在无动作生成、上下文条件强化学习、物理先验辅助任务或动作-视频耦合扩散之间不同。
    - 评测目标：Atari 样本效率、CARL 零样本泛化、驾驶视频质量、机器人任务成功率、记忆/动作基准强调不同能力。
    - 交互模式：有的用于想象策略训练，有的用于语言驱动视频规划或统一策略/动力学预训练，有的专注闭环一致性与动作控制。
    开放问题:
    - 视频生成或潜在重建的提升在固定规划器或策略时能否转化为更好的规划与控制？
    - 长时域空间一致性与记忆一致性需要哪种世界模型表示？
    - 组合式或物理先验目标能否超出已见原语、任务或仿真环境泛化？
    - 何种评测协议能隔离模型贡献与数据集、基线、指标和系统实现选择？
    - 部分高排名条目缺少局限性说明或引用图谱证据；缺失代码、数据集、基线或指标信息应视为验证缺口，而非确认不存在。
