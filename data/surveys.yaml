  related_work_outline:
  - 'Mainstream direction: Generative world models built on diffusion transformers
    or recurrent state-space backbones are being adapted to embodied and driving settings,
    using auxiliary objectives or conditioning to improve long-horizon, multi-view,
    and zero-shot behavior.'
  - 'Shared research pattern: Papers couple a learned dynamics or video generator
    with an additional training signal—mask reconstruction, context conditioning,
    physics-informed depth/keypoints, or action diffusion—and evaluate visual quality,
    policy return, or consistency benchmarks.'
  - 'Key differences: They differ in representation (recurrent state-space, VAE-Transformer,
    diffusion Transformer, joint video-action diffusion), supervision target (video-only
    vs action/physics/language-conditioned), and evaluation setting (Atari, contextual
    RL, driving, robot imagination, open-domain consistency).'
  - 'Trend evolution: Within the available top-paper evidence (2023-2026), work is
    shifting from sample-efficient model-based RL toward large-scale generative video
    world models for robotics and driving, with 2025-2026 adding explicit memory and
    action-control benchmarks.'
  - 'Open questions: How much gain comes from the model versus the planner, data,
    or metric remains unclear; assumptions such as observable context or predefined
    primitives may not hold; and current evidence often lacks enough ablations and
    limitations to isolate method contributions.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer或循环状态空间为骨干的生成式世界模型正被适配到具身和驾驶场景，通过辅助目标或条件化改善长时域、多视角和零样本行为。
  - 研究共性：论文将学到的动力学或视频生成器与额外训练信号耦合，例如掩码重建、上下文条件、物理信息深度/关键点或动作扩散，并在视觉质量、策略回报或一致性基准上评估。
  - 关键差异：表示形式包括循环状态空间、VAE-Transformer、扩散Transformer和视频-动作联合扩散；监督目标包括视频生成、物理/语言/动作条件；评测设置覆盖Atari、上下文RL、驾驶、机器人想象和开放域一致性。
  - 趋势演进：在可获得的2023-2026证据内，工作正从样本高效的模型式RL转向机器人/驾驶的大规模生成视频世界模型，2025-2026年新增记忆与动作控制基准。
  - 开放问题：收益有多少来自模型而不是规划器、数据或指标仍不清晰；可观测上下文或预定义原语等假设未必成立；当前证据常缺少足够消融与局限性说明来隔离方法贡献。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns world-model ideas into concrete generative architectures,
        losses, and conditioning schemes for video or sequence dynamics.
      what_remains_open: Which representation or auxiliary objective transfers across
        task families, sensor views, and embodiment boundaries remains unclear; interactions
        among masking, diffusion, physics, and context are underexplored.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to action generation, policy training
        on imagined rollouts, video planning, or joint video-action pretraining.
      what_remains_open: How much gain comes from the dynamics model versus the planner,
        controller, or task prior is not isolated; observable-context and primitive-decomposition
        assumptions may limit open-world deployment.
    - line: Method evidence and ablation protocol
      what_it_solves: Introduces benchmarks and metrics for spatial consistency, memory
        consistency, action control, and zero-shot generalization to separate method
        effect from surrounding choices.
      what_remains_open: 'Evidence coverage is uneven: some benchmark works report
        no experimental results, several papers omit limitations or ablations, and
        metric sensitivity to implementation and data choices is not fully isolated.'
    consensus:
    - Method contributions are concentrated in representation-objective design, coupling
      generative sequence modeling with auxiliary losses or conditioning to improve
      fidelity and generalization.
    - Action or control is increasingly treated as a first-class modality alongside
      video, not only as a downstream policy input.
    - Evaluation is broadening from task scores to spatial, memory, and action-control
      consistency evidence.
    disagreements:
    - 'Representation families differ: recurrent state-space dynamics versus VAE-Transformer
      versus diffusion Transformer versus joint video-action diffusion.'
    - 'Supervision signals differ: mask reconstruction, observable context, language
      primitive decomposition, physics-informed depth/keypoints, or coupled action
      prediction.'
    - 'Evaluation targets differ: Atari sample efficiency, contextual zero-shot policy
      generalization, multi-view driving rollout, robot video plans, and open-domain
      closed-loop consistency.'
    - Some works assume observable context values or predefined primitives; others
      use action-free video or independent modality diffusion timesteps.
    open_questions:
    - Does improved visual or benchmark consistency transfer to real robot execution
      and unseen dynamics?
    - How much of reported gain is attributable to the dynamics model versus the planner,
      controller, pretraining data, or metric?
    - Can methods handle latent or unavailable context, novel primitive combinations,
      and cross-action-space control without hand-designed interfaces?
    - What metrics and ablations are needed to isolate method contributions from dataset,
      baseline, and implementation choices?
    - Several papers lack visible limitation statements or sufficient ablation details,
      so reproducibility and failure boundaries remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型想法转化为具体的生成架构、损失函数和条件化方案，用于视频或序列动力学建模。
      尚未覆盖: 哪些表示或辅助目标能跨任务族、传感器视角和具身边界迁移仍不清楚；掩码、扩散、物理与上下文条件之间的交互未被充分研究。
    - 路线: 规划与动作接口方法
      解决的问题: 将学到的动力学连接到动作生成、基于想象轨迹的策略训练、视频规划或视频-动作联合预训练。
      尚未覆盖: 收益中有多少来自动力学模型而不是规划器、控制器或任务先验尚未被隔离；可观测上下文和原语分解假设可能限制开放场景部署。
    - 路线: 方法证据与消融协议
      解决的问题: 引入空间一致性、记忆一致性、动作控制和零样本泛化等基准与度量，用于分离方法本身与周边系统选择的影响。
      尚未覆盖: 证据覆盖不均：部分基准论文未报告实验结果，多篇论文缺少局限说明或消融，且指标对实现与数据选择的敏感性尚未被充分隔离。
    共识:
    - 方法贡献集中在表示-目标设计：将生成式序列建模与辅助损失或条件化相结合，以改善保真度与泛化。
    - 动作或控制正从下游策略输入变为与视频并列的一等模态。
    - 评估从单一任务分数扩展到空间、记忆与动作控制一致性证据。
    分歧:
    - 表示族不同：循环状态空间动力学、VAE-Transformer、扩散Transformer，以及视频-动作联合扩散。
    - 监督信号不同：掩码重建、可观测上下文、语言原语分解、物理信息深度/关键点，或耦合动作预测。
    - 评测目标不同：Atari样本效率、上下文零样本策略泛化、多视角驾驶展开、机器人视频计划、开放域闭环一致性。
    - 部分工作假设上下文可观测或原语预定义；部分工作利用无动作视频或独立模态扩散时间步。
    开放问题:
    - 视觉或基准一致性提升能否迁移到真实机器人执行和未见动力学？
    - 已报告收益中有多少来自动力学模型，多少来自规划器、控制器、预训练数据或指标选择？
    - 方法能否在上下文不可获得、原语组合新颖、跨动作空间控制等条件下工作？
    - 需要哪些指标与消融来隔离方法贡献与数据集、基线和实现选择？
    - 多篇论文缺少可见的局限性或消融细节，因此可复现性与失败边界仍是验证缺口。
