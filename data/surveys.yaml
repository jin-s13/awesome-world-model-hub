  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from aggregate agent
    scores toward specialized closed-loop benchmarks that probe memory consistency,
    action control, spatial consistency, and zero-shot generalization.'
  - 'Shared research pattern: Multiple works combine action- or context-conditioned
    video/dynamics generation with standardized datasets such as Atari 100k, CARL,
    NuScenes, OpenDV-2K, and Waymo, and introduce model variants or benchmark protocols
    for comparability.'
  - 'Key differences: Contributions split between new benchmark/dataset/metric design
    and model architecture improvements; supervision differs across mask reconstruction,
    VAE stochastic latents, physics-informed keypoints/depth, context conditioning,
    and coupled video-action diffusion.'
  - 'Trend evolution: The visible evidence concentrates in 2023-2026, moving from
    discrete/VAE/transformer world models toward diffusion-based video world models
    and from single-task performance toward memory-, action-, and physics-oriented
    evaluation.'
  - 'Open questions: Whether proxy metrics align with downstream policy utility, whether
    results remain stable across implementations and compute budgets, and whether
    long-term memory and cross-action-space generalization are adequately covered.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从汇总的智能体得分转向专门的闭环基准，重点考察记忆一致性、动作控制、空间一致性和零样本泛化。
  - 研究共性：多项工作将动作或上下文条件化的视频/动力学生成与 Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo 等标准数据集结合，提出模型变体或评测协议以提升可比性。
  - 关键差异：贡献分为新基准/数据集/指标设计与模型架构改进；监督信号在掩码重建、VAE随机潜变量、物理关键点/深度、上下文条件化、视频-动作联合扩散之间不同。
  - 趋势演进：可见证据集中在 2023-2026 年，从离散/VAE/Transformer 世界模型转向基于扩散的视频世界模型，从单任务性能转向记忆、动作和物理导向评测。
  - 开放问题：代理指标是否与下游策略效用一致，评测结论在不同实现和算力预算下是否稳定，长期记忆和跨动作空间泛化是否被充分覆盖。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets such as loop-based navigation
        in Minecraft and first/third-person video with controlled action spaces, making
        world-model claims comparable.
      what_remains_open: Whether task distributions cover deployment settings; benchmark
        completeness is currently evidenced in limited scenes and action modes.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual fidelity, and physical plausibility beyond aggregate scores.
      what_remains_open: Alignment between proxy metrics and downstream policy or
        robotics decisions remains unproven.
    - line: Comparable baselines and reporting
      what_it_solves: Uses common baselines and evaluation suites such as Atari 100k,
        CARL, NuScenes, OpenDV-2K, and Waymo to audit model claims across implementations.
      what_remains_open: Stability across implementations and compute budgets is uncertain;
        several works omit limitation or full experimental detail.
    consensus:
    - Closed-loop evaluation is becoming central for validating world-model claims.
    - Reproducible datasets and standardized evaluation suites are treated as necessary
      complements to model advances.
    - Diffusion-based and transformer-based generative world models are frequently
      positioned as improvements in visual fidelity and policy performance.
    - Common benchmark platforms such as Atari 100k, CARL, NuScenes, OpenDV-2K, and
      Waymo recur across model comparisons.
    - There is shared interest in evaluation beyond pixel-level quality, including
      consistency, control, generalization, and physical plausibility.
    disagreements:
    - Some contributions emphasize dataset or metric construction, while others emphasize
      model accuracy on existing benchmarks.
    - 'Training supervision differs: mask reconstruction, stochastic VAE latents,
      context-conditioned recurrent state-space, physics-informed depth/keypoints,
      or coupled video-action diffusion.'
    - 'Evaluation targets differ: RL policy scores, driving video prediction and zero-shot
      transfer, robotic video plausibility, or memory and action control.'
    - 'Interaction modes differ: open-loop generation, closed-loop action-conditioned
      rollouts, and pretraining from action-free or action-paired video.'
    - Deployment settings differ across game environments, driving, robotic manipulation,
      and Minecraft navigation.
    open_questions:
    - Do spatial/memory consistency and action-control scores predict success in downstream
      robot or driving policies?
    - How far do Atari 100k, CARL, NuScenes, OpenDV-2K, Waymo, Minecraft loop navigation,
      and curated video benchmarks transfer to open-world deployment?
    - Can benchmark conclusions remain stable across different implementations, compute
      budgets, and train/test splits?
    - What mix of action-free video, action-paired video, and physics supervision
      yields the most generalizable world models?
    - How should limitations and failure cases be reported to make zero-shot and long-horizon
      claims verifiable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享任务和数据，例如 Minecraft 循环导航与第一/第三人称受控动作视频，使世界模型主张可比较。
      尚未覆盖: 任务分布是否覆盖真实部署场景仍不明确；基准完整性仅见于少量场景和动作模式。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外考察空间一致性、记忆一致性、动作控制、视觉保真度和物理合理性。
      尚未覆盖: 这些代理指标与下游策略或机器人决策的一致性尚未得到证明。
    - 路线: 可比基线与报告规范
      解决的问题: 通过 Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo 等公共基线和基准让结果可审计。
      尚未覆盖: 跨实现和算力预算的稳定性不确定，且部分工作未报告局限性或完整实验设置。
    共识:
    - 闭环评估正成为验证世界模型能力的关键方式。
    - 可复现数据集和标准化评估套件被视为模型进步的必要补充。
    - 基于扩散和 Transformer 的生成式世界模型常被定位为在视觉保真度和策略性能上的改进。
    - Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo 等公共基准在模型比较中反复出现。
    - 研究者共同关注超越像素级质量的评估，包括一致性、控制、泛化和物理合理性。
    分歧:
    - 部分贡献侧重数据集或指标构建，另一部分侧重在现有基准上提升模型精度。
    - 训练监督信号不同：掩码重建、随机 VAE 潜变量、上下文条件循环状态空间、物理深度/关键点或视频-动作联合扩散。
    - 评测目标不同：强化学习策略得分、驾驶视频预测与零样本迁移、机器人视频合理性或记忆与动作控制。
    - 交互模式不同：开环生成、闭环动作条件展开，以及基于无动作或动作配对视频的预训练。
    - 部署场景不同：游戏环境、驾驶、机器人操作和 Minecraft 导航。
    开放问题:
    - 空间/记忆一致性与动作控制分数能否预测下游机器人或驾驶策略的实际成功率？
    - Atari 100k、CARL、NuScenes、OpenDV-2K、Waymo、Minecraft 循环导航和精选视频基准在多大程度上能迁移到开放世界部署？
    - 评测结论能否在不同实现、算力预算和训练/测试划分下保持稳定？
    - 无动作视频、动作配对视频与物理监督应以何种比例结合，才能得到最通用的世界模型？
    - 应如何报告局限与失败案例，使零样本和长时域声明可验证？
