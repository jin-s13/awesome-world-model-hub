  related_work_outline:
  - 'Mainstream direction: Diffusion/Transformer generative world models dominate
    recent work for embodied, driving, and robot settings, often using action- or
    language-conditioned video rollouts to support planning and policy learning.'
  - 'Shared research pattern: Most methods build a learned dynamics or video-generation
    model, couple it with an action/context interface, and evaluate through imagined
    trajectories or downstream control/video benchmarks.'
  - 'Key differences: Compact latent state-space world models target model-based RL
    sample efficiency and contextual zero-shot transfer, while full video generation
    methods target long-horizon fidelity, physical realism, and large-scale pretraining.'
  - 'Trend evolution: From Dreamer-style recurrent stochastic models toward scalable
    diffusion transformers, physics-informed objectives, and compositional generation;
    recent benchmarks shift evaluation toward memory consistency, spatial consistency,
    and action control.'
  - 'Open questions: Transfer beyond reported datasets, attribution of gains to model
    versus planner/pretraining, and generalizing to unseen primitives, action spaces,
    or physical properties remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：扩散/Transformer生成式世界模型在具身、驾驶和机器人场景中占据主导，常通过动作或语言条件的视频推演支持规划与策略学习。
  - 研究共性：多数工作构建学习型动力学或视频生成模型，并将其与动作/上下文接口结合，通过想象轨迹或下游控制/视频基准进行评估。
  - 关键差异：紧凑隐状态世界模型面向基于模型的强化学习样本效率和上下文零样本迁移；全视频生成方法侧重长时域保真、物理真实和大规模预训练。
  - 趋势演进：从Dreamer风格的循环随机模型走向可扩展扩散Transformer、物理信息目标与组合式生成；最近基准更关注记忆一致性、空间一致性和动作控制。
  - 开放问题：已报告数据集之外的迁移、模型与规划器/预训练之间的收益归属，以及对未见原语、动作空间或物理特性的泛化仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Latent state-space world models for model-based RL
      what_it_solves: Learns compact stochastic dynamics from visual observations
        to train policies in imagined rollouts, improving sample efficiency and contextual
        zero-shot transfer.
      what_remains_open: Transfer beyond limited benchmark tasks and observable context;
        attribution between learned dynamics and RL policy optimization remains unclear.
    - line: Diffusion/Transformer generative world models for video prediction
      what_it_solves: Produces long-horizon, multi-view, or action-conditioned video
        rollouts from language, robot actions, or driving scenes for planning and
        policy learning.
      what_remains_open: Long-term memory consistency, cross-action-space generalization,
        and evidence of physical/3D coherence across datasets without task-specific
        tuning.
    - line: Embodied and physics-informed compositional generation
      what_it_solves: Factorizes video generation into language primitives, physics
        cues, or coupled video-action modalities to support unseen task/goal combinations
        and realistic robot scenarios.
      what_remains_open: Generalization beyond primitives seen during training; whether
        physics-informed objectives truly capture dynamics or mostly improve visual
        fidelity.
    - line: World-model evaluation protocols and benchmarks
      what_it_solves: Provides closed-loop navigation, spatial consistency, memory
        consistency, and action-control evaluations to expose open-world model limitations.
      what_remains_open: Metric coverage of open-world dynamics, robustness to pixel-level
        variation, and separating model limitations from metric insensitivity.
    consensus:
    - World-model methods increasingly treat learned dynamics as generative sequential
      modeling over visual observations, actions, and context.
    - There is convergence on scalable backbones such as Transformers, diffusion objectives,
      or hybrid VAE losses for stochastic transition modeling.
    - Evaluation is moving beyond next-frame reconstruction toward closed-loop consistency,
      memory, and action controllability.
    disagreements:
    - 'Representation level differs: compact latent states for model-based RL versus
      full pixel/video generation for embodied or driving rollouts.'
    - 'Supervision signal differs: self-supervised video prediction, physics-informed
      auxiliary tasks, language-primitive parsing, or paired action-video diffusion.'
    - 'Evaluation target differs: sample efficiency and zero-shot transfer versus
      video fidelity, physical plausibility, scene-graph consistency, or memory and
      action control.'
    open_questions:
    - Which representation and objective choices transfer beyond reported benchmarks,
      especially when evaluations rely on limited task suites or simulation?
    - How can long-horizon memory and action-control generalization be measured without
      conflating model limitations and metric insensitivity?
    - Can physics-informed or language-compositional models handle novel objects,
      primitives, physics properties, or action spaces absent from training?
    - What share of policy gains comes from the learned world model rather than the
      planner, pretraining data, or surrounding system design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向基于模型强化学习的隐状态世界模型
      解决的问题: 从视觉观测中学习紧凑随机动力学，并在想象轨迹上训练策略，以提升样本效率或上下文零样本迁移。
      尚未覆盖: 有限基准任务和可观测上下文之外的迁移；学习动力学与RL策略优化之间的收益归属不明确。
    - 路线: 基于扩散/Transformer的生成式世界模型
      解决的问题: 从语言、机器人动作或驾驶场景生成长时域、多视角或动作条件的视频推演，用于规划和策略学习。
      尚未覆盖: 长期记忆一致性、跨动作空间泛化，以及无需任务特定调参下的跨数据集物理/3D一致性证据。
    - 路线: 具身与物理信息驱动的组合式生成
      解决的问题: 将视频生成分解为语言原语、物理线索或耦合的视频-动作模态，以支持未见任务/目标组合和更真实的机器人场景。
      尚未覆盖: 训练中未见原语之外的泛化；物理信息目标是否真正改善动力学，而非仅改善视觉质量。
    - 路线: 世界模型评测协议与基准
      解决的问题: 提供闭环导航、空间一致性、记忆一致性和动作控制评测，以暴露开放世界模型的局限性。
      尚未覆盖: 开放世界动态的度量覆盖、像素级变化鲁棒性，以及区分模型局限和指标不敏感。
    共识:
    - 世界模型方法越来越将学习动力学视为对视觉观测、动作和上下文的生成式序列建模。
    - 方法在可扩展骨干上趋于收敛，例如使用Transformer、扩散目标或混合VAE损失建模随机转移。
    - 评测正从下一帧重建转向闭环一致性、记忆保持和动作可控性。
    分歧:
    - 表示层级不同：基于模型的强化学习常用紧凑隐状态，而具身或驾驶世界模型常生成完整视频。
    - 监督信号不同：自监督视频预测、物理信息辅助任务、语言原语解析或视频-动作配对扩散各有侧重。
    - 评测目标不同：样本效率和零样本迁移、视频保真度与物理合理性、空间/记忆/动作控制分别成为核心指标。
    开放问题:
    - 哪些表示和目标选择能在已报告基准之外迁移，尤其当评测依赖有限任务套件或仿真时？
    - 如何测量长期记忆和动作控制泛化，同时避免把模型局限与指标不敏感混为一谈？
    - 物理信息或语言组合方法能否处理训练中未见过的物体、原语、物理特性或动作空间？
    - 策略性能提升有多少来自所学世界模型，而不是规划器、预训练数据或整体系统设计？
