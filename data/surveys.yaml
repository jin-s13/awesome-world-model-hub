  related_work_outline:
  - 'Mainstream direction: Building generative world models—often diffusion- or transformer-based—that
    produce video sequences conditioned on actions or language, with a growing emphasis
    on physical plausibility, compositional generalization, and multi-task robotic
    pretraining.'
  - 'Shared research pattern: A latent world model is trained on visual observations
    and actions, then used to generate imagined trajectories for policy learning,
    planning, or evaluation; the core loop is representation learning → dynamics modeling
    → generation → downstream decision-making.'
  - 'Key differences: Representations range from contextual latent states and compositional
    primitives to unified video-action diffusion; training objectives include mask
    reconstruction, RL-based fidelity optimization, physics-informed losses, and imitation-style
    pretraining; evaluation spans driving, Atari, robotics, and Minecraft.'
  - 'Trend evolution: Since 2023, the field moved from efficient transformer-VAE models
    toward diffusion-based architectures, explicit physics priors, and RL-optimized
    world models; 2025–2026 sees benchmarks for spatial consistency and unified pretraining
    on large heterogeneous robot datasets.'
  - 'Open questions: What is the minimal supervision and inductive bias needed for
    reliable long-horizon generation? How much of the reported gain stems from model
    innovations versus data scale and compute? Can spatial consistency and compositionality
    be measured and enforced without relying on task-specific heuristics?'
  related_work_outline_zh:
  - 主流方向：构建以扩散模型或Transformer为核心的生成式世界模型，生成以动作或语言为条件的视频，着重提升物理合理性、组合泛化能力和多任务机器人预训练效果。
  - 研究共性：在视觉观察和动作上训练潜在世界模型，再用模型生成的想象轨迹进行策略学习、规划或评估；核心循环为表示学习→动力学建模→生成→下游决策。
  - 关键差异：表示形式包括上下文潜在状态、组合原语、统一视频-动作扩散；训练目标包括掩码重建、基于RL的保真度优化、物理信息损失和模仿式预训练；评测场景覆盖驾驶、Atari、机器人和Minecraft。
  - 趋势演进：2023年以来，从高效Transformer-VAE模型转向扩散架构、显式物理先验和RL优化世界模型；2025–2026年出现空间一致性基准和大规模多机器人统一预训练。
  - 开放问题：可靠长时域生成所需的最小监督和归纳偏置是什么？报告的性能提升多大程度来自模型创新，多大程度来自数据规模和算力？能否在不依赖任务特定启发式的前提下衡量并强制空间一致性与组合性？
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turning world-model ideas into concrete architectures, latent
        representations, training losses, and pretraining recipes—e.g., diffusion
        transformers with mask tokens, contextual latent state-space models, RL-optimized
        fidelity objectives, transformer-VAEs, compositional video primitives, physics-informed
        auxiliary tasks, and unified video-action diffusion.
      what_remains_open: Which architectural choices and objective combinations transfer
        beyond the reported task family (e.g., from driving to manipulation) and how
        sensitive results are to the specific design of masks, context, or physics
        losses.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to intervention, planning, and decision-time
        interfaces—whether through policy learning on imagined rollouts, policy evaluation
        with reduced overestimation bias, video-based plan execution, or unified representation
        of forward/inverse dynamics and video generation.
      what_remains_open: How much of the downstream performance gain is attributable
        to the dynamics model itself versus the planner, controller, or task-specific
        priors, especially when comparing methods that use lookahead search against
        those that do not.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating the contribution of the proposed method from dataset
        scale, baseline strength, metric choice, and implementation details—illustrated
        by the emergence of dedicated benchmarks like LoopNav for spatial consistency.
      what_remains_open: Whether the provided evidence isolates the novel method components
        rather than confounding factors such as larger pretraining datasets, privileged
        context information, or favorable evaluation settings.
    consensus:
    - World models are predominantly learned from high-dimensional visual observations
      with an action-conditioned latent dynamics component.
    - Generating future video frames and using them for policy improvement or planning
      is a common evaluation paradigm.
    - Pretraining on large-scale offline datasets (robot demonstrations, driving videos)
      improves generalization and robustness.
    - Physical plausibility and long-horizon consistency are recognized as central
      challenges, driving the inclusion of auxiliary losses or evaluation protocols.
    disagreements:
    - Whether explicit context conditioning (e.g., observable mass/dimensions) is
      necessary for zero-shot dynamics generalization, or if data-driven factorization
      and composition suffice.
    - Whether world model training should rely on supervised reconstruction losses
      and auxiliary physics tasks, or be driven by RL-based reward optimization for
      fidelity.
    - Whether action and video modalities should be tightly coupled in a unified diffusion
      process or handled separately within the world model.
    - 'Evaluation setting: some works target sample-efficient RL on discrete games,
      others focus on long-horizon driving video generation or multi-task robotic
      manipulation, making direct comparison difficult.'
    open_questions:
    - How can spatial consistency and memory retention be evaluated in a way that
      is invariant to pixel-level variation and not tied to a single domain like Minecraft?
    - What is the minimal amount of context or physical prior required to achieve
      reliable zero-shot generalization to unseen dynamics, and can it be learned
      from data alone?
    - To what extent do improvements in generation fidelity translate to better policy
      performance in real-world deployment, and how can we close the sim-to-real gap?
    - How do we design ablation protocols that convincingly disentangle model architecture,
      training objective, and dataset scale contributions in world-model research?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 把世界模型想法落实为具体架构、潜在表示、训练损失和预训练配方，例如扩散Transformer加掩码令牌、上下文潜在状态空间模型、RL优化保真度目标、Transformer-VAE、组合视频原语、物理信息辅助任务以及统一视频-动作扩散。
      尚未覆盖: 哪些架构选择和目标组合能迁移到报告任务族之外（如从驾驶到操作），以及结果对掩码、上下文或物理损失的具体设计有多敏感。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，包括在想象轨迹上训练策略、降低过估计偏差的策略评估、基于视频的执行规划，以及统一表示前向/逆动力学与视频生成。
      尚未覆盖: 下游性能提升多大程度来自动力学模型本身，多大程度来自规划器、控制器或任务特定先验，尤其是在使用前瞻搜索与不使用的方法之间进行比较时。
    - 路线: 方法证据与消融协议
      解决的问题: 区分方法贡献与数据集规模、基线强度、指标选择和实现细节的影响，体现为专门空间一致性基准（如LoopNav）的出现。
      尚未覆盖: 现有证据是否隔离了新颖方法组件，还是混杂了更大预训练数据集、特权上下文信息或有利评估设置等混淆因素。
    共识:
    - 世界模型主要从高维视觉观测中学习，并包含以动作为条件的潜在动力学组件。
    - 生成未来视频帧并用于策略改进或规划是常见的评估范式。
    - 在大规模离线数据集（机器人演示、驾驶视频）上预训练能提升泛化性和鲁棒性。
    - 物理合理性和长时域一致性被公认为核心挑战，推动了辅助损失或专门评估协议的设计。
    分歧:
    - 在零样本动力学泛化中，是否需要显式上下文条件（如可观测的质量/尺寸），还是仅靠数据驱动的分解与组合就足够。
    - 世界模型训练应依赖监督重建损失和辅助物理任务，还是应由基于RL的保真度奖励优化驱动。
    - 动作与视频模态应在统一扩散过程中紧密耦合，还是在世界模型内分别处理。
    - 评估场景：部分工作聚焦离散游戏的样本高效RL，另一些关注长时域驾驶视频生成或多任务机器人操作，难以直接比较。
    开放问题:
    - 如何以对像素级变化不变且不局限于单一领域（如Minecraft）的方式评估空间一致性和记忆保持能力？
    - 实现可靠的零样本动力学泛化所需的最小上下文或物理先验是多少，能否仅从数据中学习到？
    - 生成保真度的提升在多大程度上转化为真实世界部署中的策略性能改善，如何缩小仿真与现实的差距？
    - 如何设计消融协议，以令人信服地解耦世界模型研究中架构、训练目标和数据集规模的贡献？
