  related_work_outline:
  - 'Mainstream direction: Building world models as video generation models using
    diffusion transformers, often with self-supervised objectives like mask reconstruction
    or physics-informed losses, and condition on actions or language.'
  - 'Shared research pattern: Improved architectures (DiT, transformers) and training
    recipes (masked reconstruction, keypoint dynamics) aim to produce long-horizon,
    consistent video predictions, with benchmarks emerging to measure spatial/memory
    consistency.'
  - 'Key differences: Some methods focus on video fidelity alone, others couple action
    prediction; some incorporate explicit physics, others are purely data-driven;
    some use compositional factorization, others monolithic models.'
  - 'Trend evolution: From 2023-2026, shift from latent dynamics planning (Dreamer-based)
    to diffusion-based video generation world models, and a recent surge in evaluation
    benchmarks.'
  - 'Open questions: How to integrate video generation with decision-making effectively,
    how to achieve zero-shot generalization across diverse environments, and how to
    verify physical plausibility beyond visual quality.'
  related_work_outline_zh:
  - 主流方向：将世界模型构建为视频生成模型，使用扩散Transformer，结合自监督目标（掩码重建、物理信息损失），并条件化于动作或语言。
  - 研究共性：改进架构（DiT、Transformer）和训练配方（掩码重建、关键点动力学）以生成长时域、一致的视频预测，同时涌现出衡量空间一致性/记忆一致性的基准。
  - 关键差异：部分方法仅关注视频保真度，其他则耦合动作预测；部分纳入显式物理知识，部分纯数据驱动；部分使用组合分解，部分使用单一模型。
  - 趋势演进：2023-2026年，从基于潜在动力学规划（Dreamer）转向基于扩散的视频生成世界模型，评估基准近期激增。
  - 开放问题：如何有效整合视频生成与决策，如何实现跨环境零样本泛化，以及如何验证物理合理性而非仅视觉质量。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforming world-model concepts into concrete video generation
        architectures, training losses, and conditioning schemes (e.g., diffusion
        transformers with mask reconstruction, physics-informed keypoint learning,
        compositional factorization).
      what_remains_open: Which design choices—such as mask reconstruction vs. physics-informed
        losses—generalize better across diverse environments and tasks beyond the
        reported domains.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to policy learning via imagined
        rollouts (Dreamer-based) or by coupling video and action diffusion within
        a unified model to enable policy and dynamics prediction.
      what_remains_open: How much of the policy improvement is due to the world model
        rather than the planner or data scale, and how these methods scale to real-world
        high-dimensional control.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing standardized benchmarks to evaluate world model capabilities
        such as spatial consistency, memory, and action controllability, separating
        model contributions from dataset and metric effects.
      what_remains_open: Whether these benchmarks capture the key aspects needed for
        robotic deployment, and whether they can be used to drive model improvements
        rather than just evaluation.
    consensus:
    - World models are predominantly formulated as video generation models, with diffusion-based
      architectures becoming the standard for high-quality frame prediction.
    - There is a shared focus on long-horizon consistency, either through self-supervised
      reconstruction objectives or explicit physics-inspired losses.
    - The field recognizes the need for dedicated benchmarks to evaluate world model
      capabilities beyond simple pixel-level metrics.
    disagreements:
    - Whether video generation should be combined with action prediction in a unified
      model or kept separate as a dynamics module, and how to balance the two objectives.
    - 'The role of explicit physical knowledge: some methods rely on physics-informed
      losses, while others are purely data-driven.'
    - 'The trade-off between compositional factorization and monolithic models for
      generalization: compositional approaches offer flexibility but are limited to
      known primitives.'
    open_questions:
    - How can world models be effectively used for downstream planning and decision-making,
      beyond just generating visually plausible videos?
    - What are the minimal requirements for a world model to achieve zero-shot generalization
      to unseen dynamics and environments?
    - How should we evaluate physical plausibility and long-term memory consistency
      in a way that correlates with real-world task performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将世界模型概念转化为具体的视频生成架构、训练损失和条件化方案（如扩散Transformer加掩码重建、物理信息关键点学习、组合分解）。
      尚未覆盖: 哪种设计选择（如掩码重建 vs. 物理信息损失）在超出报告领域的不同环境和任务中泛化更好，仍待验证。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到策略学习，通过想象推演（基于Dreamer）或在统一模型中耦合视频和动作扩散，实现策略和动力学预测。
      尚未覆盖: 策略改进有多少来自世界模型本身而非规划器或数据规模，以及这些方法如何扩展到真实世界高维控制。
    - 路线: 方法证据与消融协议
      解决的问题: 提供标准化基准（如LoopNav、MIND）评估世界模型能力，如空间一致性、记忆和动作可控性，以区分方法贡献与数据集、指标影响。
      尚未覆盖: 这些基准是否捕捉了机器人部署所需的关键方面，以及能否用于推动模型改进而非仅评估。
    共识:
    - 世界模型主要被构建为视频生成模型，扩散架构成为高质量帧预测的标准。
    - 共同关注长时域一致性，通过自监督重建目标或显式物理启发损失实现。
    - 领域认识到需要专门基准来评估世界模型能力，超越简单的像素级指标。
    分歧:
    - 视频生成应与动作预测结合在统一模型中还是作为独立的动力学模块，以及如何平衡两个目标。
    - 显式物理知识的作用：一些方法依赖物理信息损失，而其他方法纯数据驱动。
    - 组合分解与单一模型在泛化上的权衡：组合方法提供灵活性，但受限于已知原语。
    开放问题:
    - 如何有效利用世界模型进行下游规划和决策，而不仅仅是生成视觉合理的视频？
    - 世界模型实现未见动力学和环境零样本泛化的最低要求是什么？
    - 如何评估物理合理性和长期记忆一致性，以与实际任务性能相关联？
