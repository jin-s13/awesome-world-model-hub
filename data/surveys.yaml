  related_work_outline:
  - 'Mainstream direction: Current evidence centers on benchmarking world-model memory
    consistency, action controllability, long-horizon closed-loop behavior, and generalization
    rather than only static visual quality.'
  - 'Shared research pattern: Works pair action-conditioned rollouts or standardized
    tasks with datasets and metrics such as Atari 100k, CARL, NuScenes/OpenDV-2K/Waymo,
    LoopNav, and MIND to stress different world-model capabilities.'
  - 'Key differences: Evaluation targets split between RL policy utility, video generation
    fidelity, physical plausibility, spatial consistency, and robotic pretraining;
    some use aggregate scores while others use structure- or physics-aware metrics.'
  - 'Trend evolution: The visible 2023-2026 top papers move from sample-efficient
    Atari and contextual RL benchmarks toward open-domain memory/action benchmarks
    and large driving or robotic evaluation; earlier years are too sparse to infer
    a longer trend.'
  - 'Open questions: Whether benchmark metrics align with downstream planning and
    policy quality, whether conclusions are stable across compute and implementation
    choices, and whether current domains cover deployment-scale variability.'
  related_work_outline_zh:
  - 主流方向：当前证据集中于评估世界模型的一致性、记忆、动作可控性与长时域闭环行为，而非仅看静态视觉质量。
  - 研究共性：工作通常将动作条件 rollout 或标准任务与数据集/指标结合，如 Atari 100k、CARL、NuScenes/OpenDV-2K/Waymo、LoopNav、MIND，以检验不同能力。
  - 关键差异：评测目标分为 RL 策略效用、视频生成保真度、物理合理性、空间一致性与机器人预训练；有的用聚合分数，有的用结构或物理感知指标。
  - 趋势演进：可见的 2023-2026 顶级论文从 Atari 和上下文 RL 的样本效率基准，转向开放域记忆/动作基准和大规模驾驶/机器人评测；早期年份证据太稀疏，难以推断更长趋势。
  - 开放问题：基准指标是否与下游规划/策略质量一致，结论在算力和实现变化下是否稳定，当前领域是否覆盖部署规模变异。
  literature_review:
    line_of_work_matrix:
    - line: Open-domain closed-loop memory and action benchmarks
      what_it_solves: Assessing temporal stability, contextual coherence, and action
        responsiveness in world-model video generation beyond frame-wise error.
      what_remains_open: Evidence is limited to curated video sets; the link to downstream
        task or policy success remains untested.
    - line: Spatial consistency evaluation
      what_it_solves: Quantifying whether a world model preserves spatial relations
        and scene structure across viewpoints using scene-graph scores.
      what_remains_open: Coverage is centered on Minecraft-style loop navigation;
        transfer to driving, manipulation, or planning is unclear.
    - line: Standardized sample-efficiency RL world-model benchmarks
      what_it_solves: Comparing model-based RL agents on Atari 100k with human-normalized
        scores and training compute.
      what_remains_open: The discrete-game domain is narrow, and visual fidelity,
        compute, and policy utility are often entangled.
    - line: Contextual and physics-informed generalization stress tests
      what_it_solves: Probing zero-shot generalization to unseen dynamics or context,
        and physical plausibility for embodied video.
      what_remains_open: Several results assume observed context or simplified physics,
        and broader task coverage is still unverified.
    - line: Large-scale driving and robotic rollout evaluation
      what_it_solves: Evaluating long-horizon, multi-view, action-conditioned prediction
        and policy/dynamics pretraining on driving and robot datasets.
      what_remains_open: Prediction quality is not yet clearly tied to planning or
        policy success; limitation and baseline reporting gaps remain.
    consensus:
    - Closed-loop or rollout evaluation is becoming preferred over isolated frame
      prediction.
    - Memory consistency, long-horizon stability, and action control are treated as
      central world-model capabilities.
    - Standardized suites and released datasets or metrics are used to anchor comparability.
    - Visual detail and physical plausibility are both valued, but evaluated with
      different proxies.
    - World-model pretraining is considered useful for downstream policy learning,
      while the exact transfer mechanism still needs evidence.
    disagreements:
    - 'Evaluation target differs: some optimize agent score on game benchmarks, while
      others optimize video generation, spatial consistency, or physical plausibility.'
    - 'Representation differs: discrete latent, stochastic transformer-VAE, diffusion,
      video-action diffusion, and physics-informed joint training coexist.'
    - 'Metric philosophy differs: aggregate human-normalized scores versus structure-aware
      consistency scores versus physics- and visual-plausibility measures.'
    - 'Interaction and supervision differ: offline action-free video, shared action
      spaces, multiple action spaces, or closed-loop replay.'
    - 'Deployment setting differs: games, Minecraft-style open worlds, driving, robotics,
      and embodied video each stress different world-model assumptions.'
    open_questions:
    - Do memory consistency and action-control metrics predict downstream policy or
      planning performance in real deployments?
    - Are benchmark rankings stable across codebases, compute budgets, and unreported
      training details?
    - Can spatial consistency scores designed in Minecraft-style loop navigation transfer
      to driving, manipulation, or long-horizon robotics?
    - What minimal set of metrics can decouple visual fidelity, dynamics correctness,
      and decision utility?
    - Several source records lack detailed limitation or broad baseline reporting;
      how should such missing evidence affect confidence in benchmark conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 开放域闭环记忆与动作基准
      解决的问题: 评估世界模型视频生成中的时间稳定性、上下文连贯性和动作响应，而不只看逐帧误差。
      尚未覆盖: 证据限于策划视频集；与下游任务或策略成功的关系仍未验证。
    - 路线: 空间一致性评估
      解决的问题: 通过场景图分数量化世界模型是否在跨视角下保持空间关系和场景结构。
      尚未覆盖: 覆盖集中于 Minecraft 风格的循环导航；能否迁移到驾驶、操作或规划尚不明确。
    - 路线: 标准化样本效率 RL 世界模型基准
      解决的问题: 在 Atari 100k 上以人类归一化分数和训练算力比较基于模型的 RL 智能体。
      尚未覆盖: 离散游戏领域较窄，视觉保真度、算力和策略效用常被混在一起。
    - 路线: 上下文与物理信息泛化压力测试
      解决的问题: 检验对未见动力学或上下文的零样本泛化，以及具身视频的物理合理性。
      尚未覆盖: 部分结果假设上下文可观测或物理设置简化，更广泛任务覆盖仍未验证。
    - 路线: 大规模驾驶与机器人 rollout 评估
      解决的问题: 在驾驶和机器人数据集上评估长时域、多视角、动作条件预测及策略/动力学预训练。
      尚未覆盖: 预测质量尚未明确关联到规划或策略成功；局限性和基线报告仍存在缺口。
    共识:
    - 闭环或 rollout 式评估正取代孤立单帧预测，成为更受偏好的做法。
    - 记忆一致性、长时域稳定性和动作控制被视为世界模型的核心能力。
    - 标准化套件和发布的数据集或指标被用来锚定可比性。
    - 视觉细节和物理合理性都受到重视，但通过不同代理指标评估。
    - 世界模型预训练被认为对下游策略学习有用，但其迁移机制仍需证据。
    分歧:
    - 评测目标不同：有的优化游戏基准上的智能体分数，有的优化视频生成、空间一致性或物理合理性。
    - 表示方式不同：离散潜变量、随机 transformer-VAE、扩散、视频-动作扩散和物理信息联合训练并存。
    - 指标理念不同：聚合人类归一化分数、结构感知一致性分数、物理与视觉合理性指标各有侧重。
    - 交互与监督不同：离线无动作视频、共享动作空间、多动作空间或闭环回放各有使用。
    - 部署场景不同：游戏、Minecraft 风格开放世界、驾驶、机器人和具身视频各自强调不同世界模型假设。
    开放问题:
    - 记忆一致性和动作控制指标能否预测真实部署中的下游策略或规划性能？
    - 基准排名在不同代码库、算力预算和未报告训练细节下是否稳定？
