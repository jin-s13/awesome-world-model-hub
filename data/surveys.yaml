  related_work_outline:
  - 'Mainstream direction: Diffusion transformers and coupled video-action generative
    methods dominate recent work, often adding auxiliary objectives such as mask reconstruction,
    physics signals, context conditioning, or language factorization to improve generalization.'
  - 'Shared research pattern: Methods combine generative dynamics learning with planning
    or policy training, while newer benchmarks evaluate spatial consistency, memory
    consistency, and action control alongside task performance.'
  - 'Key differences: Representation families include latent recurrent dynamics, stochastic
    transformer-VAE, compositional language-conditioned generation, and unified video/action
    diffusion; supervision ranges from context values and language to physics signals
    and action-free video.'
  - 'Trend evolution: The topic moves from efficient model-based reinforcement learning
    and simple video prediction toward large-scale pretraining, long-horizon/multi-view
    generation, and benchmark-driven consistency evaluation; available top papers
    are concentrated in the 2023-2026 frontier.'
  - 'Open questions: Which losses and representations transfer beyond reported task
    families, and whether gains come from the world model itself rather than the policy,
    controller, dataset, baseline, metric, or implementation.'
  related_work_outline_zh:
  - 主流方向：扩散Transformer和视频-动作耦合生成方法成为近期主导，常通过掩码重建、物理、上下文或语言分解等辅助目标增强泛化。
  - 研究共性：方法通常把生成式动力学学习与规划或策略训练连接，较新的基准则同时考察空间一致性、记忆一致性和动作控制，而不仅是任务分数。
  - 关键差异：表示上有潜在循环动力学、随机Transformer-VAE、组合式语言条件生成和统一视频/动作扩散；监督信号包括上下文、语言、物理信息和无动作视频。
  - 趋势演进：研究从高效基于模型的强化学习和简单视频预测，走向大规模预训练、长时域/多视角生成以及基准驱动的一致性评测；可用前沿论文集中在 2023-2026。
  - 开放问题：哪些损失和表示能迁移到报告任务族之外，以及提升主要来自世界模型还是策略、控制器、数据集、基线、指标或实现细节。
  literature_review:
    line_of_work_matrix:
    - line: 'Method representation and objective design: diffusion transformer, stochastic
        transformer-VAE, context-conditioned latent dynamics, compositional language
        factorization, physics-informed depth/keypoint auxiliary tasks, and unified
        video-action diffusion.'
      what_it_solves: Turns world-model ideas into concrete representations, losses,
        architectures, and training recipes for video or latent prediction and generation.
      what_remains_open: Which architectural and objective choices transfer beyond
        reported driving, Atari, Minecraft, and robotic task families, and how much
        each auxiliary signal contributes.
    - line: 'Planning and action-interface methods: policy learning in world-model
        dreams, action-conditioned generation, forward/inverse dynamics in unified
        diffusion, and closed-loop action-control evaluation.'
      what_it_solves: Connects learned dynamics to intervention, planning, and decision-time
        interfaces for zero-shot generalization, pretraining, or efficient policy
        learning.
      what_remains_open: How much of reported gains come from the world model versus
        the planner, controller, task prior, or interaction budget.
    - line: 'Method evidence and ablation protocol: loop-based spatial-consistency
        navigation, memory and action-control benchmarks, dataset and baseline matrices,
        and reproducibility artifacts.'
      what_it_solves: Separates method contribution from dataset, baseline, metric,
        and implementation effects and exposes consistency failures.
      what_remains_open: Whether evaluation isolates the proposed method rather than
        surrounding system choices; several highly relevant papers still lack explicit
        limitation fields or comparable baseline detail.
    consensus:
    - Recent work converges on generative world modeling as a core strategy, using
      learned video or latent dynamics to support visual prediction and policy learning.
    - Auxiliary tasks or extra conditioning signals are commonly added to a base generative
      architecture to improve fidelity, consistency, or generalization.
    - Evaluation is moving beyond short-horizon reconstruction toward standardized
      benchmarks and metrics for long-horizon, multi-view, spatial, memory, and action-controllability
      properties.
    - Policy training increasingly occurs on model-generated experience or coupled
      video-action diffusion rather than only on real interaction data.
    disagreements:
    - 'Representation differs: some use recurrent latent state-space models, others
      transformer-VAE or diffusion-based generation, and others factorize generation
      by language primitives.'
    - 'Supervision differs: some require observable context, some use language instructions
      or goal images, some use physics-like depth or keypoint signals, and some learn
      from action-free video.'
    - 'Evaluation targets differ: visual fidelity on driving or robot video, human-normalized
      reinforcement-learning scores, zero-shot generalization under changed dynamics,
      spatial consistency during navigation, and memory/action control across viewpoints.'
    - 'Interaction mode differs: methods vary between closed-loop action-conditioned
      generation, open-loop long-horizon rollout, and policy learning inside imagined
      trajectories.'
    open_questions:
    - Which representation and auxiliary objective transfer beyond the specific datasets
      and task families reported in the evidence?
    - When a method improves downstream policy or video prediction, how much is attributable
      to the world model itself versus the planner, controller, task prior, baseline,
      or metric?
    - How should open-domain physical plausibility, spatial consistency, and memory
      consistency be measured without ground-truth state or scene graphs?
    - Can loop-based navigation or varied action-space benchmarks isolate method contributions
      from implementation and data effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计：扩散Transformer、随机Transformer-VAE、上下文条件潜在动力学、组合式语言分解、物理深度/关键点辅助任务、视频-动作统一扩散。
      解决的问题: 将世界模型想法落实为具体表示、损失、架构和训练配方，用于视频或潜在预测与生成。
      尚未覆盖: 哪些架构和目标选择能迁移到报告任务族之外，以及各辅助信号的贡献尚未被隔离。
    - 路线: 规划与动作接口方法：在世界模型梦境中训练策略、动作条件生成、统一扩散中的前向/逆动力学、闭环动作控制评测。
      解决的问题: 将学习到的动力学连接到干预、规划和决策时接口，用于零样本泛化、预训练或高效策略学习。
      尚未覆盖: 报告收益有多少来自世界模型本身，而非规划器、控制器、任务先验或交互预算。
    - 路线: 方法证据与消融协议：循环导航空间一致性、记忆与动作控制基准、数据集与基线矩阵、可复现工件。
      解决的问题: 区分方法贡献与数据集、基线、指标和实现因素，暴露一致性失败。
      尚未覆盖: 评测是否真正隔离了方法自身而非周边系统选择；若干高相关论文仍缺少明确限制字段或可比基线细节。
    共识:
    - 近期研究趋向以生成式世界模型为核心，用学习到的视频或潜在动力学支持视觉预测和策略学习。
    - 通常在基础生成架构上加入辅助任务或条件信号，以提升保真度、一致性或泛化性。
    - 评测正从短期重建扩展到长时域、多视角、空间一致性、记忆和动作可控性等标准化基准与指标。
    - 策略训练越来越多地发生在模型生成的经验或视频-动作耦合扩散中，而非仅依赖真实交互数据。
    分歧:
    - 表示方式不同：有的使用循环潜在状态空间模型，有的使用Transformer-VAE或扩散生成，还有的按语言原语分解生成。
    - 监督信号不同：有的需要可观测上下文，有的使用语言指令或目标图像，有的使用类物理深度或关键点信号，也有的从无动作视频学习。
    - 评测目标不同：分别关注驾驶或机器人视频保真度、人类标准化强化学习分数、变化动力学下的零样本泛化、导航空间一致性和跨视角记忆/动作控制。
    - 交互模式不同：方法在闭环动作条件生成、开环长时域展开和想象轨迹中的策略学习之间取舍。
    开放问题:
    - 哪些表示和辅助目标能迁移到证据中报告的数据集和任务族之外？
    - 当下游策略或视频预测提升时，多少应归因于世界模型本身，多少来自规划器、控制器、任务先验、基线或指标？
    - 在缺少真实状态或场景图时，如何测量开放域的物理合理性、空间一致性和记忆一致性？
    - 循环导航或多样化动作空间等基准能否将方法贡献与实现和数据效果区分开？
