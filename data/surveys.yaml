  related_work_outline:
  - 'Mainstream direction: Applying world models to embodied robotics and autonomous
    driving for video prediction and policy learning, with growing emphasis on generalization,
    physical consistency, and long-horizon coherence.'
  - 'Shared research pattern: Using generative architectures (diffusion, Transformers)
    to model environment dynamics conditioned on actions, language, or context, and
    generating future frames or latent states for downstream control or evaluation.'
  - 'Key differences: Model architecture (diffusion vs. recurrent state-space), conditioning
    modality (action, language, context), incorporation of explicit physics knowledge,
    evaluation benchmarks, and the type of generalization targeted (zero-shot, compositional,
    cross-dataset).'
  - 'Trend evolution: The field is moving from game benchmarks (Atari) toward complex
    real-world-like tasks in robotics and driving, introducing large-scale pretraining,
    diffusion-based video generation, and dedicated benchmarks for memory, spatial
    consistency, and action control.'
  - 'Open questions: Whether simulation gains transfer to real-world safety and operational
    outcomes; how to maintain long-term memory and spatial consistency; cross-embodiment
    and cross-dataset generalization; and the lack of standardized, comprehensive
    evaluation protocols.'
  related_work_outline_zh:
  - 主流方向：将世界模型应用于具身智能与自动驾驶的视频预测和策略学习，重点关注泛化性、物理一致性及长时域连贯性。
  - 研究共性：采用生成式架构（扩散模型、Transformer）建模环境动力学，以动作、语言或上下文为条件生成未来帧或潜在状态，用于下游控制或评测。
  - 关键差异：模型架构（扩散 vs. 循环状态空间）、条件模态（动作、语言、上下文）、物理知识的显式融入方式、评测基准以及泛化目标类型（零样本、组合、跨数据集）。
  - 趋势演进：从游戏基准（Atari）向机器人、驾驶等复杂现实任务迁移，引入大规模预训练、基于扩散的视频生成，以及针对记忆、空间一致性和动作控制的专用基准。
  - 开放问题：仿真收益能否迁移到真实安全与运营结果；如何维持长期记忆与空间一致性；跨本体、跨数据集泛化能力；以及标准化、全面评估协议的缺失。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: Adapting world models to embodied tasks by incorporating context,
        language instructions, or physics knowledge to improve zero-shot/compositional
        generalization and video generation realism.
      what_remains_open: Cross-embodiment and cross-environment transfer, real-robot
        deployment safety, and generalization to entirely novel primitives or physical
        interactions not seen in training.
    - line: Autonomous driving and simulation use cases
      what_it_solves: Building generalizable driving world models with diffusion transformers
        and mask reconstruction for long-horizon, multi-view scene prediction and
        zero-shot cross-dataset evaluation.
      what_remains_open: Alignment between simulated performance gains and real-world
        driving safety or operational metrics; verification across diverse sensor
        setups and physical road conditions.
    - line: Interactive agents and games
      what_it_solves: Constructing efficient world models for policy learning in game
        environments, and developing benchmarks to evaluate spatial consistency, memory,
        and action control in open-world interactive settings.
      what_remains_open: Long-term memory and action generalization in open-ended
        environments; correlation between benchmark metrics and real-world task performance;
        coverage of diverse action spaces and scene types.
    consensus:
    - World models are predominantly used to generate future video frames or latent
      states for policy learning, planning, or evaluation.
    - Generative architectures, especially diffusion models and Transformers, are
      the dominant modeling choice for video prediction and dynamics learning.
    - Generalization—whether zero-shot, compositional, or cross-dataset—is a central
      goal across embodied, driving, and game domains.
    - Physical and spatial consistency are emerging as important evaluation criteria,
      leading to the creation of dedicated benchmarks and physics-informed training
      objectives.
    disagreements:
    - 'Model architecture: some works use diffusion-based video generation, while
      others rely on recurrent state-space models or Transformer-VAE hybrids.'
    - 'Conditioning modality: actions, natural language instructions, or observable
      context variables are used as control signals, affecting the scope of tasks
      and generalization types.'
    - 'Evaluation settings: results are reported on standard benchmarks (Atari, NuScenes,
      CARL) versus custom-built benchmarks (LoopNav, MIND), making direct comparison
      difficult.'
    - 'Physics integration: RoboScape explicitly incorporates depth and keypoint dynamics
      for physical plausibility, whereas other methods rely purely on data-driven
      video generation without explicit physical priors.'
    open_questions:
    - Can the physical realism and consistency achieved in simulation reliably transfer
      to real-world robotic and driving tasks, and how should safety be validated?
    - How can world models maintain long-term memory and spatial consistency over
      extended interactions, as highlighted by the LoopNav and MIND benchmarks?
    - To what extent do improvements on one dataset or embodiment translate to others,
      given the limited cross-dataset and cross-robot evaluations in current work?
    - Is there a path toward unified evaluation protocols that cover diverse action
      spaces, scene types, and consistency metrics, replacing the current patchwork
      of domain-specific benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 通过引入上下文、语言指令或物理知识，将世界模型适配到具身任务，提升零样本/组合泛化以及视频生成的逼真度。
      尚未覆盖: 跨本体、跨环境迁移，真实机器人部署安全性，对训练中未见的全新原语或物理交互的泛化能力。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 利用扩散变换器与掩码重建构建泛化驾驶世界模型，实现长时域、多视角场景预测和零样本跨数据集评测。
      尚未覆盖: 仿真性能提升与真实驾驶安全或运营指标之间的一致性；跨传感器配置和真实道路条件的验证。
    - 路线: 交互式智能体与游戏
      解决的问题: 在游戏环境中构建高效世界模型以支持策略学习，并开发基准评估开放世界交互中的空间一致性、记忆和动作控制。
      尚未覆盖: 开放环境中的长期记忆和动作泛化；基准指标与真实任务性能之间的关联；多样化动作空间和场景类型的覆盖。
    共识:
    - 世界模型主要用于生成未来视频帧或潜在状态，以支持策略学习、规划或评测。
    - 生成式架构，尤其是扩散模型和Transformer，是视频预测和动力学学习的主流选择。
    - 泛化性——无论是零样本、组合还是跨数据集——是具身、驾驶和游戏领域的共同核心目标。
    - 物理和空间一致性正成为重要的评估标准，催生了专用基准和物理信息驱动的训练目标。
    分歧:
    - 模型架构：部分工作采用基于扩散的视频生成，另一些则依赖循环状态空间模型或Transformer-VAE混合架构。
    - 条件模态：使用动作、自然语言指令或可观测上下文变量作为控制信号，影响了任务范围和泛化类型。
    - 评测设置：结果在标准基准（Atari、NuScenes、CARL）与自定义基准（LoopNav、MIND）上分别报告，难以直接比较。
    - 物理融入方式：RoboScape显式加入深度和关键点动力学以保证物理合理性，而其他方法纯粹依赖数据驱动的视频生成，未使用显式物理先验。
    开放问题:
    - 仿真中获得的物理真实性和一致性能否可靠地迁移到真实机器人和驾驶任务中，如何验证安全性？
    - 如LoopNav和MIND基准所示，世界模型如何在长时间交互中维持记忆与空间一致性？
    - 鉴于当前工作有限的跨数据集和跨机器人评测，在一个数据集或本体上的改进在多大程度上能迁移到其他设定？
    - 是否存在统一评估协议的可能，以覆盖多样化动作空间、场景类型和一致性指标，取代当前领域特定基准的碎片化局面？
