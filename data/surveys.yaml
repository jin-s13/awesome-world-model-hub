  related_work_outline_zh:
  - 主流方向：近期世界模型研究集中于控制、具身和驾驶领域的生成式动力学，采用扩散或Transformer视频预测以及视频-动作耦合。
  - 研究共性：方法将动力学条件化于动作、上下文或语言，通过辅助重建/物理目标或扩散损失训练，并在下游策略、零样本或视频质量上评测。
  - 关键差异：表示方式涵盖随机潜变量状态空间模型、扩散Transformer和分解原语条件生成；监督信号和评测目标在RL基准、机器人/驾驶视频与诊断一致性基准之间分化。
  - 趋势演进：可得高相关证据集中在2023-2026年：从样本高效的Atari世界模型到上下文零样本泛化，再到大规模具身/驾驶生成式世界模型和一致性/动作控制基准。
  - 开放问题：现有证据尚不能证明收益可迁移到窄基准之外；模型贡献与规划器/任务先验的隔离仍不清楚；长期记忆一致性和跨动作空间泛化仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic and contextual latent dynamics for model-based reinforcement
        learning
      what_it_solves: Sample-efficient policy learning by learning latent state transitions
        and generating imagined rollouts under action and context conditions.
      what_remains_open: Zero-shot generalization beyond observed context/task families
        and isolation of planner versus dynamics gains remain unverified.
    - line: Diffusion and auxiliary-task generative world models
      what_it_solves: Long-horizon, multi-view, or physically plausible video generation
        through mask reconstruction, depth/keypoint prediction, or coupled action-video
        diffusion.
      what_remains_open: Explicit limitation evidence and cross-domain transfer of
        auxiliary losses beyond reported driving/robotic datasets are missing.
    - line: Compositional and language-conditioned world models
      what_it_solves: Generalization to unseen combinations of objects and actions
        by parsing instructions into previously seen primitive-conditioned generators.
      what_remains_open: Entirely novel primitives, parser reliability, and real-robot
        transfer are not covered by visible evidence.
    - line: Diagnostic benchmarks for consistency and action control
      what_it_solves: Evaluating spatial, temporal, memory, and action-control properties
        of world models rather than per-frame visual quality alone.
      what_remains_open: These benchmarks reveal long-term memory and cross-action-space
        generalization failures, but baseline results and model fixes are not yet
        resolved.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing controlled comparison signals to separate methodological
        contribution from dataset, baseline, metric, and implementation choices.
      what_remains_open: Several highly ranked papers show no explicit limitation
        or ablation details in visible evidence, leaving contribution boundaries unverified.
    consensus:
    - The field is converging on learned generative dynamics from high-dimensional
      observations, with action or context conditioning and downstream use for planning,
      policy learning, or zero-shot policy transfer.
    - There is shared interest in moving beyond per-frame visual fidelity toward geometric/physical
      plausibility and consistency-based evaluation.
    - Recent work often treats world models as large-scale pretraining objects for
      embodied tasks, but relies on task-specific datasets and benchmarks.
    disagreements:
    - 'Representation choices differ: stochastic recurrent state-space models, transformer/diffusion
      generators, and factorized primitive-conditioned generators make different speed
      and generalization tradeoffs.'
    - 'Supervision differs: mask reconstruction or physics-informed auxiliary tasks
      versus coupled action-video diffusion versus model-based RL imagined rollouts.'
    - Evaluation targets differ across sample-efficient game benchmarks, driving/robot
      video quality and downstream policy utility, and diagnostic spatial/memory/action-control
      benchmarks, making cross-paper comparison difficult.
    - 'Deployment settings differ in the visible evidence: simulation-only evaluation
      versus open-domain video, with different assumptions about observability of
      context and actions.'
    open_questions:
    - What evidence isolates world-model contribution from planner, controller, task
      prior, dataset fit, or evaluation metric choices?
    - Do diffusion/mask/physics auxiliary gains transfer beyond the reported driving
      and robotic datasets?
    - Can compositional methods support entirely novel primitives rather than only
      unseen combinations of training primitives?
    - How can learned world models achieve long-term memory consistency and cross-action-space
      control, as current benchmarks identify as difficult?
    - For top-ranked papers with empty limitation fields or no reported baseline metric,
      can independent replications establish failure boundaries?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于随机与上下文潜动力学的模型强化学习路线
      解决的问题: 通过潜状态转移和想象轨迹进行低样本策略学习，支持动作和上下文条件。
      尚未覆盖: 超出已见上下文/任务族的零样本泛化，以及规划器与动力学收益的隔离尚未验证。
    - 路线: 扩散与辅助任务生成式世界模型路线
      解决的问题: 通过掩码重建、深度/关键点预测或动作-视频扩散实现长时域、多视角或物理合理的视频生成。
      尚未覆盖: 可见证据缺少显式局限性说明，辅助损失在已报告驾驶/机器人数据集之外的迁移仍未知。
    - 路线: 组合式与语言条件世界模型路线
      解决的问题: 通过将指令解析为已见原语条件生成器，支持对未见物体和动作组合的泛化。
      尚未覆盖: 全新原语、解析可靠性与真实机器人迁移未被可见证据覆盖。
    - 路线: 一致性与动作控制诊断基准路线
      解决的问题: 评测空间、时间、记忆和动作控制属性，超越逐帧视觉质量。
      尚未覆盖: 当前模型仍存在长期记忆和跨动作空间泛化失败，基线结果与改进方案尚不明确。
    - 路线: 方法证据与消融协议路线
      解决的问题: 提供受控比较信号，分离方法贡献与数据集、基线、指标和实现选择。
      尚未覆盖: 多篇高排名论文在可见证据中未给出显式局限性或消融，贡献边界仍不明确。
    共识:
    - 领域正在向从高维观测中学习生成式动力学收敛，并以动作或上下文为条件，用于规划或策略学习。
    - 研究共同关注超越逐帧视觉质量，引入几何/物理合理性和一致性评估。
    - 近期工作将世界模型视为具身任务的大规模预训练对象，但仍依赖特定任务数据集和基准。
    分歧:
    - 表示选择不同：随机循环状态空间模型、Transformer/扩散生成器和分解原语条件生成器在效率与泛化上取舍不同。
    - 监督信号不同：掩码重建或物理信息辅助任务、动作-视频扩散耦合、基于模型的强化学习想象轨迹各有侧重。
    - 评测目标不同：样本高效游戏基准、驾驶/机器人视频质量与下游策略效用、诊断性空间/记忆/动作一致性基准难以直接比较。
    - 部署场景不同：可见证据中仿真评测与开放域视频并存，对上下文/动作可观测性的假设不同。
    开放问题:
    - 如何隔离世界模型贡献与规划器、控制器、任务先验、数据集或评测指标的影响？
    - 扩散/掩码/物理辅助增益能否迁移到已报告驾驶和机器人数据集之外？
    - 组合式方法能否支持全新原语，而不仅是训练原语的新组合？
    - 如何实现长期记忆一致性和跨动作空间控制？当前基准已显示这些仍是难点。
    - 对于局限性字段为空或未报告基线的论文，独立复现能否建立失败边界？
