  related_work_outline:
  - 'Mainstream direction: Generative world models built on transformer, diffusion,
    or state-space/VAE backbones, conditioned on actions, language, or context, and
    evaluated on driving, robotics, game, and open-world video benchmarks.'
  - 'Shared research pattern: Papers add an auxiliary objective or inductive bias
    such as mask reconstruction, depth/keypoint supervision, context conditioning,
    primitive composition, or action-video diffusion to improve generalization, consistency,
    or control.'
  - 'Key differences: They differ in representation (stochastic state-space versus
    diffusion video), conditioning interface (observed context, language primitives,
    action diffusion), and evaluation targets (zero-shot policy return, video fidelity,
    spatial or memory consistency, action controllability).'
  - 'Trend evolution: From Dreamer-style recurrent state-space models around 2023
    to 2024 toward unified or physics-informed diffusion video-action models and explicit
    consistency benchmarks around 2025 to 2026; the evidence reflects the current
    frontier rather than a long historical shift.'
  - 'Open questions: Whether auxiliary representations transfer across tasks, how
    to handle hidden context or unseen primitives, how to maintain long-horizon memory
    consistency, and whether reported gains isolate the model from the planner, dataset,
    or metric choices.'
  related_work_outline_zh:
  - 主流方向：以Transformer、扩散或状态空间/VAE为骨干的生成式世界模型，依赖动作、语言或上下文条件，在驾驶、机器人、游戏和开放世界视频基准上评测。
  - 研究共性：通过掩码重建、深度/关键点监督、上下文条件、原语组合或动作-视频扩散等辅助目标或归纳偏置，提升泛化、一致性或控制能力。
  - 关键差异：表示方式包括随机状态空间与扩散视频；条件接口包括可观测上下文、语言原语、动作扩散；评测目标包括零样本策略回报、视频保真度、空间/记忆一致性与动作可控性。
  - 趋势演进：从约2023至2024年Dreamer类循环状态空间模型，转向2025至2026年统一或物理信息驱动的扩散视频-动作模型和显式一致性基准；证据主要反映当前前沿。
  - 开放问题：辅助表示的跨任务迁移性、隐式上下文或新原语如何处理、长时域记忆一致性如何保持，以及报告增益是否隔离了模型与规划器、数据集或指标选择。
  literature_review:
    line_of_work_matrix:
    - line: Generative video and state-space world-model architectures
      what_it_solves: Turning world-model ideas into concrete video predictors or
        latent dynamics with transformer, diffusion, VAE, or recurrent state-space
        objectives.
      what_remains_open: Which architectural and auxiliary-objective choices transfer
        beyond reported Atari, driving, or robot video settings, and whether visual
        fidelity implies usable dynamics.
    - line: Contextual, compositional, and memory-aware dynamics
      what_it_solves: Improving generalization to unseen contexts, scenes, and object-action
        combinations by conditioning on observed context, language primitives, or
        scene-consistent memory.
      what_remains_open: Hidden context, entirely new primitives, and long-horizon
        spatial or memory consistency remain unresolved; current evidence assumes
        observability or seen primitive combinations.
    - line: Unified action-video and planning interfaces
      what_it_solves: Connecting learned dynamics to action prediction, policy learning,
        or closed-loop control by coupling video generation with action diffusion
        or model-based policy optimization.
      what_remains_open: Whether gains come from the world model or the action interface
        and task prior, and whether policies transfer across action spaces and robot
        embodiments.
    - line: Evaluation and evidence protocols
      what_it_solves: Separating method contribution from dataset, baseline, metric,
        and implementation effects via benchmarks for spatial consistency, memory
        consistency, and action control.
      what_remains_open: Benchmark coverage is narrow, some artifacts report no experimental
        results, and missing limitation or baseline details leave verification gaps.
    consensus:
    - World models are framed as learned generative dynamics, most often video prediction
      or latent imagination conditioned on action, language, or context.
    - Recent work favors transformer/diffusion backbones and auxiliary objectives
      to improve visual fidelity, sample efficiency, generalization, or consistency.
    - Evaluation relies on simulator or benchmark domains with visual, control, or
      consistency metrics; evidence is strongest for narrow task families such as
      Atari, driving video, and robot manipulation.
    - There is a shared shift toward explicitly measuring consistency, controllability,
      or zero-shot generalization rather than only short-horizon reconstruction.
    disagreements:
    - 'Representation: stochastic state-space/VAE dynamics versus diffusion-based
      video generation differ in how uncertainty and sequence modeling are handled.'
    - 'Supervision: RGB video prediction is augmented with different signals, including
      mask reconstruction, depth and keypoint physics priors, context values, language
      primitives, or action diffusion; these reflect different assumptions about available
      data.'
    - 'Interaction mode: some methods target open-loop video generation, while others
      target action-conditioned control, unified policy and dynamics pretraining,
      or model-based policy learning.'
    - 'Evaluation target: papers optimize different evidence such as zero-shot policy
      return, long-horizon rollout, visual fidelity and physical plausibility, spatial
      consistency, or memory and action-control benchmarks, making direct comparison
      difficult.'
    open_questions:
    - Can mask reconstruction, diffusion, or state-space objectives transfer beyond
      driving, Atari, or robot video tasks without re-tuning the auxiliary losses?
    - How should world models handle hidden context or entirely new primitive combinations
      when conditioning signals are absent or unseen?
    - What representations and training objectives are sufficient to maintain long-horizon
      memory consistency and cross-action-space controllability in open domains?
    - Do reported improvements isolate the model architecture and objective from dataset
      scale, planner or action-interface choices, and metric selection?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频与状态空间世界模型架构
      解决的问题: 将世界模型想法具体化为视频预测器或潜在动力学，采用Transformer、扩散、VAE或循环状态空间目标。
      尚未覆盖: 哪些架构与辅助目标能迁移到Atari、驾驶或机器人视频之外，以及视觉保真是否等同于可用的动力学。
    - 路线: 上下文、组合与记忆感知动力学
      解决的问题: 通过对可观测上下文、语言原语或场景一致记忆进行条件化，改进对新场景、新物体-动作组合的泛化。
      尚未覆盖: 隐式上下文、全新原语和长时域空间或记忆一致性仍未解决；现有证据假设上下文可观测或组合已见过。
    - 路线: 统一动作-视频与规划接口
      解决的问题: 通过耦合视频生成与动作扩散或基于模型的策略优化，将学习到的动力学连接到动作预测和闭环控制。
      尚未覆盖: 收益来自世界模型还是动作接口与任务先验尚不清晰；策略跨动作空间和机器人本体迁移仍未验证。
    - 路线: 评测与证据协议
      解决的问题: 通过空间一致性、记忆一致性和动作控制等基准，区分方法贡献与数据集、基线、指标和实现因素。
      尚未覆盖: 基准覆盖较窄，部分工件未报告实验结果；缺失局限性和基线细节带来验证缺口。
    共识:
    - 世界模型被表述为学习到的生成式动力学，通常是以动作、语言或上下文为条件的视频预测或潜在想象。
    - 近期工作偏向Transformer或扩散骨干与辅助目标，以提升视觉保真、样本效率、泛化或一致性。
    - 评测依赖仿真器或基准域，并采用视觉、控制或一致性指标；证据在Atari、驾驶视频和机器人操作等狭窄任务族中最强。
    - 共享趋势是明确测量一致性、可控性或零样本泛化，而不只是短时域重建。
    分歧:
    - 表示方式：随机状态空间/VAE动力学与基于扩散的视频生成在不确定性和序列建模上不同。
    - 监督信号：RGB视频预测之外加入不同辅助信号，包括掩码重建、深度与关键点物理先验、上下文值、语言原语或动作扩散，反映不同的数据可用性假设。
    - 交互模式：部分工作面向开环视频生成，另一些面向动作条件控制、统一策略与动力学预训练或基于模型的策略学习。
    - 评测目标：各工作优化不同证据，包括零样本策略回报、长时域展开、视觉保真与物理合理性、空间一致性或记忆与动作控制基准，难以直接比较。
    开放问题:
    - 掩码重建、扩散或状态空间目标能否在驾驶、Atari或机器人视频任务之外迁移而不重新调整辅助损失？
    - 当条件信号缺失或未见时，世界模型如何处理隐式上下文和全新原语组合？
    - 哪些表示和训练目标足以在开放域中保持长时域记忆一致性以及跨动作空间可控性？
    - 报告提升是否隔离了模型架构和目标本身，而不是数据集规模、规划器或动作接口选择以及指标选择？
