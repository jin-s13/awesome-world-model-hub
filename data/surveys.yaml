  related_work_outline:
  - 'Mainstream direction: Building action-conditioned generative world models—predominantly
    diffusion-based—that simulate future video or text states for decision-making
    and planning in embodied AI and agentic RL.'
  - 'Shared research pattern: Large-scale pretraining on diverse robot or text trajectory
    datasets, then conditioning on actions to generate plausible future observations,
    often with flexible representations that unify policy, dynamics, and video generation.'
  - 'Key differences: Modality (video vs. text), action-conditioning mechanism (adapter
    mask vs. frame-level module vs. end-to-end diffusion timestep), alignment strategy
    (multi-dimensional reward, DPO, physics discrimination), and evaluation target
    (visual quality, downstream task performance, physical plausibility).'
  - 'Trend evolution: From 2024 fine-grained action-frame alignment and pre-trained
    model adaptation, through 2025 unified video-action pretraining, to 2026 large-scale
    14B models, human-preference alignment, test-time verification, and zero-shot
    benchmarks.'
  - 'Open questions: Whether current world models form an information bottleneck that
    limits fine-grained reasoning; how to define objective, scalable physical realism
    metrics; robustness under adversarial or out-of-distribution scenes; and the absence
    of theoretical guarantees linking scaling to failure prediction.'
  related_work_outline_zh:
  - 主流方向：构建以动作条件生成式世界模型（多基于扩散）为核心，模拟未来视频或文本状态，用于具身智能和智能体强化学习的决策与规划。
  - 研究共性：在大规模机器人或文本轨迹数据集上预训练，通过动作条件生成未来观测，常以灵活表示统一策略、动力学和视频生成。
  - 关键差异：模态（视频 vs. 文本）、动作条件化机制（适配器掩码、帧级模块、端到端扩散时间步）、对齐策略（多维奖励、DPO、物理判别）和评估目标（视觉质量、下游任务表现、物理合理性）。
  - 趋势演进：从2024年的细粒度动作-帧对齐和预训练模型适配，经2025年的统一视频-动作预训练，到2026年14B级大规模模型、人类偏好对齐、测试时验证和零样本基准。
  - 开放问题：当前世界模型是否形成信息瓶颈而限制细粒度推理；如何定义客观可扩展的物理真实性指标；对抗或分布外场景下的鲁棒性；缺乏从缩放预测失败和迁移的理论保证。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent—e.g., decomposing
        text-based world modeling into initial state, task context, tool schemas,
        domain rules, and steering directives—and under which conditions its predictions
        are considered valid.
      what_remains_open: The formal decomposition is tested only in text-based environments;
        it is unclear whether similar assumptions hold for video-based or real-robot
        world models with continuous action spaces and partial observability.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size, data scale, and architecture choices to
        expected behavior, such as observed video quality improvement with larger
        diffusion transformers and faster real-time generation with masked autoregression.
      what_remains_open: No theoretical law is derived; the observed scaling trends
        are empirical and tied to specific benchmarks; direct validation that these
        trends predict failure modes or out-of-distribution transfer is absent.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes world-model evaluation into separable dimensions—physical
        realism, task completion, embodiment plausibility, visual quality—and creates
        benchmarks that decouple physical fidelity from action alignment.
      what_remains_open: Whether such taxonomies change how researchers design or
        train world models remains unproven; the reward model underlying the taxonomy
        relies on human preferences, which may introduce subjectivity and limit scalability.
    consensus:
    - Action-conditioned generation is the core mechanism for world models, enabling
      them to simulate future states given agent actions.
    - Diffusion models, especially diffusion transformers, are the dominant architecture
      for video-based world models due to their flexible conditioning and generation
      quality.
    - Pretraining on large-scale, diverse datasets (robot manipulation clips, text
      trajectories) significantly improves generalization and robustness of the learned
      world models.
    - 'World models can serve multiple downstream purposes: policy learning, model-based
      planning, synthetic data generation, and policy evaluation, often within a unified
      framework.'
    disagreements:
    - 'Modality: some works build world models purely in text space, while others
      generate high-fidelity video frames, leading to different representational capacities
      and speed-accuracy trade-offs.'
    - 'Action conditioning: approaches range from lightweight adapters that modify
      frozen pre-trained models without accessing parameters, to tightly integrated
      frame-level action blocks, to controlling independent diffusion timesteps per
      modality.'
    - 'Alignment target: what constitutes a "good" world model rollout varies—visual
      quality, physical plausibility, task completion, or embodiment consistency—and
      different works optimize or evaluate different subsets of these dimensions.'
    - 'Evaluation setting: some use closed-loop policy evaluation in simulators, others
      rely on human preference scoring, and yet others introduce zero-shot physical
      benchmarks, making cross-paper comparison difficult.'
    open_questions:
    - Do current world models form an information bottleneck where imagined future
      views fail to enrich fine-grained spatial and causal reasoning, as suggested
      by test-time verification failures on spatially demanding benchmarks?
    - How can we define objective, automated metrics for physical realism that do
      not depend on costly human preference data and that generalize across embodiments
      and tasks?
    - What are the failure modes of world models under adversarial perturbations or
      rare events, and can they be mitigated without sacrificing generation quality?
    - Can we derive any formal guarantees that connect model scaling, data diversity,
      and training objectives to the reliability of world-model predictions in decision-making
      loops?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么——例如将基于文本的世界建模分解为初始状态、任务上下文、工具模式、领域规则和引导指令——并明确其预测有效的条件。
      尚未覆盖: 该形式化仅在文本环境中验证；尚不清楚类似假设是否适用于连续动作空间和部分可观测的真实机器人视频世界模型。
    - 路线: 缩放规律与保证
      解决的问题: 将模型规模、数据量和架构选择与预期行为联系起来，如观察到视频质量随扩散Transformer增大而提升，以及掩码自回归带来更快的实时生成。
      尚未覆盖: 未推导出理论规律；观察到的缩放趋势是经验性的并依赖特定基准；缺乏这些趋势能否预测失败模式或分布外迁移的直接验证。
    - 路线: 概念分类与边界
      解决的问题: 将世界模型评估组织为可分离的维度——物理真实性、任务完成度、具身合理性、视觉质量——并创建将物理保真度与动作对齐解耦的基准。
      尚未覆盖: 此类分类是否改变研究者的模型设计或训练方式尚未证实；分类所依赖的奖励模型以人类偏好为基础，可能引入主观性并限制可扩展性。
    共识:
    - 动作条件化生成是世界模型的核心机制，使其能根据智能体动作模拟未来状态。
    - 扩散模型，尤其是扩散Transformer，因其灵活的条件化和生成质量，成为视频世界模型的主流架构。
    - 在大规模多样化数据集（机器人操作片段、文本轨迹）上预训练，显著提升世界模型的泛化性和鲁棒性。
    - 世界模型可服务于多种下游任务：策略学习、基于模型的规划、合成数据生成和策略评估，常以统一框架实现。
    分歧:
    - 模态：有的工作在纯文本空间构建世界模型，有的生成高保真视频帧，导致表征能力和速度-精度权衡不同。
    - 动作条件化：从修改冻结预训练模型无需访问参数的轻量级适配器，到紧密集成的帧级动作模块，再到控制每模态独立扩散时间步，实现方式多样。
    - 对齐目标：何谓“好的”世界模型轨迹存在差异——视觉质量、物理合理性、任务完成或具身一致性——不同工作优化或评估这些维度的不同子集。
    - 评估场景：有的使用仿真器中的闭环策略评估，有的依赖人类偏好评分，还有的引入零样本物理基准，使得跨论文比较困难。
    开放问题:
    - 当前世界模型是否形成信息瓶颈，使得想象出的未来视图无法丰富细粒度空间和因果推理，正如空间推理基准上测试时验证失败所示？
    - 如何定义客观、自动化的物理真实性指标，使其不依赖昂贵的人类偏好数据，并跨本体和任务泛化？
    - 世界模型在对抗扰动或罕见事件下的失败模式是什么，能否在不牺牲生成质量的前提下缓解？
    - 能否推导出任何形式化保证，将模型缩放、数据多样性和训练目标与决策循环中世界模型预测的可靠性联系起来？
