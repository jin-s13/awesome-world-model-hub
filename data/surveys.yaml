    evaluation targets visual fidelity, physical plausibility, or task-specific planning.'
  - 'Trend evolution: Work has shifted from conceptual taxonomies (2022–2024) to large-scale
    pretraining and alignment (2024–2025) and now to test-time scaling and physical
    benchmarking (2025–2026).'
  - 'Open questions: How to achieve long-horizon persistence and causal reasoning;
