  related_work_outline:
  - 'Mainstream direction: The dominant evidence focuses on embodied world models
    for driving and robotics, especially video diffusion or mask-based generative
    predictors conditioned on actions, language, or physics; game/RL settings appear
    mainly through benchmarks.'
  - 'Shared research pattern: Papers learn a predictive model from interactions or
    video, then evaluate downstream policy learning, zero-shot transfer, or consistency
    metrics, often against domain-specific datasets such as NuScenes, OpenDV-2K, Waymo,
    Atari 100k, CARL, RT-X, and Minecraft.'
  - 'Key differences: They vary in representation—diffusion transformers, recurrent
    state-space models, Transformer+VAE, and coupled action-video diffusion—and in
    supervision signals like mask reconstruction, context values, language primitives,
    depth, and keypoints.'
  - 'Trend evolution: Within the available 2023–2026 evidence, work moves from sample-efficient
    model-based RL and contextual generalization toward physics-informed embodied
    video generation, large robot pretraining, and benchmarks for spatial memory and
    action control.'
  - 'Open questions: Real-world deployment evidence, long-horizon consistency, cross-embodiment/dataset
    transfer, and generalization beyond seen primitives/contexts remain unresolved;
    several top papers report no limitation details.'
  related_work_outline_zh:
  - 主流方向：证据集中于驾驶和机器人等具身世界模型，以视频扩散或掩码重建生成预测为主，并结合动作、语言或物理；游戏/RL 场景主要出现在基准中。
  - 研究共性：从交互或视频学习预测模型，再评估下游策略、零样本迁移或一致性，常用 NuScenes、OpenDV-2K、Waymo、Atari 100k、CARL、RT-X、Minecraft
    等数据/基准。
  - 关键差异：表示方式包括扩散 Transformer、循环状态空间、Transformer+VAE 和动作-视频耦合扩散；监督信号包括掩码重建、上下文、语言原语、深度和关键点。
  - 趋势演进：在本证据包覆盖的 2023–2026 年内，研究从样本高效 model-based RL 和上下文泛化，转向物理信息具身视频生成、大规模机器人预训练和空间记忆/动作控制评测。
  - 开放问题：真实部署证据、长时域一致性、跨本体/数据集迁移、超出已见原语和上下文的泛化仍待验证；若干论文未给出限制说明。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene prediction and multi-view simulation
      what_it_solves: Long-horizon and multi-view video prediction for driving scenes,
        including normal validation, long-horizon rollout, and zero-shot dataset transfer.
      what_remains_open: Alignment between zero-shot dataset gains and real driving
        safety or operational outcomes; limitations are not reported in the available
        evidence.
    - line: Contextual and stochastic model-based reinforcement learning
      what_it_solves: Sample-efficient policy learning and zero-shot generalization
        to unseen dynamics by conditioning latent world models on context or stochastic
        latents.
      what_remains_open: Assumes observable context values in narrow benchmark tasks,
        leaving broader unseen dynamics and real-world settings unverified.
    - line: Compositional robot imagination from language
      what_it_solves: Video planning for robot tasks by factorizing language instructions
        into lower-level primitives, enabling unseen combinations of objects and actions.
      what_remains_open: Generalization is limited to combinations of primitives seen
        during training; real-robot execution is not demonstrated.
    - line: Physics-informed and action-coupled embodied world models
      what_it_solves: Joint video generation with physics knowledge or action diffusion
        for robot data, improving visual fidelity, physical plausibility, and policy
        pretraining.
      what_remains_open: Whether physics-informed generation and action-free video
        pretraining translate to robust real-world policy behavior across embodiments
        remains open.
    - line: Consistency and control benchmarks for interactive worlds
      what_it_solves: Measuring spatial consistency, long-term memory consistency,
        and action control in open-domain navigation and video-to-world settings.
      what_remains_open: Long-term memory consistency and cross-action-space generalization
        remain identified challenges; these benchmarks mainly provide evaluation rather
        than improved methods.
    consensus:
    - Applied world models are increasingly constructed as generative video predictors
      rather than only latent neural controllers.
    - Multiple works assess models through domain-specific rollout or visual-fidelity
      benchmarks and report downstream policy improvement in simulated or offline
      settings.
    - A shared assumption is that learned dynamics or video priors can support policy
      learning, zero-shot transfer, or physical plausibility.
    - 'Evidence quality is uneven: some entries provide dataset, baseline, metric,
      and code signals, while missing limitation or result details create verification
      gaps.'
    disagreements:
    - 'Representation choices diverge: mask-based diffusion transformers, recurrent
      state-space models, Transformer+VAE stochastic models, and unified action-video
      diffusion.'
    - Supervision differs by context observability, language-primitive parsing, mask
      reconstruction, temporal depth/keypoints, or action-free video data.
    - Evaluation targets split across driving multi-view rollout, Atari sample efficiency,
      robot simulation policy execution, Minecraft spatial consistency, and open-domain
      memory/action control.
    - Deployment settings differ between simulation/offline validation and real-world
      relevance, with limited real-world evaluation evidence.
    open_questions:
    - Does stronger video fidelity or physical plausibility in simulation translate
      to safer or more reliable deployment in driving and robotics?
    - How can world models preserve long-term memory consistency and action control
      across viewpoints and action spaces, as current benchmarks identify as challenging?
    - Can zero-shot gains observed on settings such as Waymo or CARL tasks generalize
      across embodiments, datasets, and physical environments?
    - How should models generalize when context is unobserved, language includes novel
      primitives, or dynamics fall outside the training distribution?
    - Which missing artifact, baseline, metric, and limitation details currently prevent
      stronger reproducibility comparisons?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶场景预测与多视角仿真
      解决的问题: 面向驾驶场景的长时域和多视角视频预测，包括常规验证、长程 rollout 和零样本数据集迁移。
      尚未覆盖: 零样本数据集收益与真实驾驶安全/运营结果之间的一致性；证据中未记录局限性。
    - 路线: 上下文与随机 model-based 强化学习
      解决的问题: 通过将潜在世界模型条件化于上下文或随机潜变量，实现样本高效策略学习和未见过动力学的零样本泛化。
      尚未覆盖: 假设上下文可观测，且仅在较窄的 CARL 任务上验证，更广泛未知动力学和真实场景尚不清楚。
    - 路线: 基于语言的组合式机器人想象
      解决的问题: 把语言指令分解为低层原语来生成机器人视频计划，从而泛化到未见的物体和动作组合。
      尚未覆盖: 泛化限于训练中见过的原语组合；未提供真实机器人执行证据。
    - 路线: 物理信息与动作耦合的具身世界模型
      解决的问题: 联合学习 RGB 视频生成与物理知识或动作扩散，以提升视觉保真、物理合理性和机器人策略预训练。
      尚未覆盖: 物理信息生成和动作无关视频预训练能否跨具身环境转化为稳健的真实策略仍未证实。
    - 路线: 面向交互世界的一致性与控制评测
      解决的问题: 在开放域导航和 video-to-world 设置中量化空间一致性、记忆一致性和动作控制。
      尚未覆盖: 长期记忆一致性和跨动作空间泛化仍被识别为当前挑战；相关基准主要提供评测而非改进方法。
    共识:
    - 应用世界模型越来越被构建为生成式视频预测器，而不仅是潜在神经控制器。
    - 多项工作使用领域特定的 rollout 或视觉保真度评测，并报告在下游策略学习、零样本泛化或物理合理性上的提升。
    - 共同假设是学习到的动力学或视频先验可以支撑策略学习、零样本迁移或物理合理性。
    - 证据质量不均：部分研究提供数据集、基线、指标和代码信号，但缺少局限性或结果细节会带来验证缺口。
    分歧:
    - 表示选择存在差异：基于掩码的扩散 Transformer、循环状态空间、Transformer+VAE、统一动作-视频扩散等。
    - 监督信号不同：包括上下文可观测值、语言原语解析、掩码重建、时间深度/关键点和无动作视频数据。
    - 评测目标不同：驾驶多视角 rollout、Atari 样本效率、机器人仿真策略执行、Minecraft 空间一致性和开放域记忆/动作控制。
    - 部署环境不同：多数证据集中在仿真或离线验证，真实世界验证仍有限。
    开放问题:
    - 在仿真中更强的视频保真度或物理合理性是否转化为驾驶和机器人部署中更安全、更可靠的表现？
    - 世界模型如何在不同视角和动作空间下保持长期记忆一致性和动作控制？现有基准显示这仍是挑战。
    - 在 Waymo 或 CARL 等设置上的零样本提升能否跨本体、数据集和物理环境泛化？
    - 当上下文不可观测、语言包含未知原语或动力学超出训练分布时，模型应如何泛化？
    - 哪些缺失的工件、基线、指标和限制说明正在影响可复现性比较？
