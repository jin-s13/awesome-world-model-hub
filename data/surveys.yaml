  related_work_outline_zh:
  - 主流方向：世界模型研究正汇聚为面向闭环控制的可用仿真系统，尤其用于驾驶、机器人与具身导航的动作可控视频生成。
  - 研究共性：论文用动作、上下文、物理或几何线索增强生成式视频模型，并通过数据集、指标或下游策略训练来评测，而非只看视觉真实度。
  - 关键差异：条件表示、监督信号、评测目标、交互模式与部署场景各不相同，从开放世界导航到实体机器人与多相机驾驶。
  - 趋势演进：可见前沿从单点世界模型方法转向包含基准、低延迟闭环服务和物理合理性约束的系统；证据集中在2022-2026年。
  - 开放问题：跨域泛化、长时域一致性、速度-保真度-可控性权衡、上下文可观测性及独立可复现性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end world-model pipelines and physical deployment stacks
      what_it_solves: Turning learned world models into workflows that combine data
        collection, training, imagination-based policy learning, and evaluation on
        physical or simulated agents.
      what_remains_open: Robustness to new hardware, sensor configurations, and deployment-specific
        constraints remains largely unproven; evidence is limited to selected robot
        platforms and driving datasets.
    - line: Real-time and closed-loop action-controllable serving
      what_it_solves: Meeting latency and interactivity requirements for closed-loop
        simulation and model-based reinforcement learning through action-conditioned
        or context-conditioned video generation.
      what_remains_open: Trade-offs among speed, fidelity, controllability, and long-horizon
        consistency are underexplored, especially beyond single-GPU or narrow dataset
        settings.
    - line: Reproducible evaluation artifacts and benchmarks
      what_it_solves: Providing datasets, benchmark protocols, and metrics to inspect
        spatial consistency, action fidelity, or visual quality in world-model systems.
      what_remains_open: Independent cross-team reproduction and coverage of deployment
        variability are not established; several papers lack visible limitation details
        or complete artifact signals.
    consensus:
    - Recent work frames world models as simulators or system components whose outputs
      must support downstream control, policy training, or evaluation.
    - There is shared emphasis on conditioning generated futures on actionable or
      contextual signals rather than producing unconditional videos.
    - Evaluation is expanding from visual quality metrics to include consistency,
      action adherence, and physical plausibility.
    - Open datasets and benchmark protocols are treated as part of the system contribution,
      not merely as external evaluation.
    disagreements:
    - 'Representation choices differ: some systems embed context into latent state
      dynamics, others inject action modules into pre-trained generators, and others
      use depth, keypoint, or geometric cues for physics consistency.'
    - 'Supervision and evaluation targets differ: spatial loop consistency, zero-shot
      policy generalization, action fidelity, visual realism, physical plausibility,
      and closed-loop latency are not interchangeable goals.'
    - 'Interaction modes differ: some target open-loop video generation from short
      context, while others emphasize closed-loop autoregressive rollouts under agent
      actions.'
    - Deployment settings differ across physical robots, Minecraft-like open worlds,
      multi-camera driving environments, and game or robotics domains, creating different
      assumptions about sensors and resets.
    open_questions:
    - Can these world-model systems generalize beyond narrowly evaluated environments
      such as specific driving datasets or a small set of robot platforms?
    - How should closed-loop systems balance latency, visual fidelity, physical plausibility,
      and controllability as rollout horizons grow?
    - What happens to long-horizon temporal and cross-view consistency when action-conditioned
      generation is deployed outside curated evaluation sequences?
    - Are context or action observability assumptions realistic for physical deployment
      when task variables are not instrumented?
    - Several papers omit limitations or abstract results and have uneven artifact
      signals; these are verification gaps rather than proof of absent baselines or
      code.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端世界模型流水线与实体部署栈
      解决的问题: 将学习到的世界模型转化为覆盖数据收集、训练、想象策略学习及实体或仿真智能体评测的工作流。
      尚未覆盖: 对新硬件、传感器配置和部署约束的稳健性仍未充分证明；证据限于少数机器人平台和驾驶数据集。
    - 路线: 实时与闭环动作可控服务
      解决的问题: 通过动作或上下文条件视频生成，满足闭环仿真和基于模型的强化学习对延迟与交互性的要求。
      尚未覆盖: 速度、保真度、可控性与长时域一致性之间的权衡探索不足，尤其缺少单GPU或窄数据集场景之外的证据。
    - 路线: 可复现评测工件与基准
      解决的问题: 提供数据集、基准协议与指标，以检查世界模型系统的空间一致性、动作忠实度或视觉质量。
      尚未覆盖: 跨团队独立复现与部署可变性覆盖尚未建立；若干论文缺少可见的局限性细节或完整工件信号。
    共识:
    - 近期工作将世界模型视为模拟器或系统组件，其输出必须支持下游控制、策略训练或评测。
    - 研究共同强调生成未来帧时应以动作或上下文信号为条件，而非仅做无条件视频生成。
    - 评测正从视觉质量指标扩展到一致性、动作遵循度和物理合理性。
    - 开放数据集和基准协议被视作系统贡献的一部分，而不仅是外部评测。
    分歧:
    - 表示选择不同：有的将上下文嵌入潜在状态动力学，有的向预训练生成器插入动作模块，有的使用深度、关键点或几何线索增强物理一致性。
    - 监督与评测目标不同：空间循环一致性、零样本策略泛化、动作忠实度、视觉真实度、物理合理性与闭环延迟不可互换。
    - 交互模式不同：有些面向短上下文开环生成，有些强调在智能体动作下的闭环自回归推演。
    - 部署场景不同：跨实体机器人、Minecraft类开放世界、多相机驾驶环境及游戏或机器人域，导致对传感器和重置的假设不同。
    开放问题:
    - 这些世界模型系统能否在特定驾驶数据集或少量机器人平台之外的场景中泛化？
    - 当推演时长增加时，闭环系统应如何平衡延迟、视觉保真度、物理合理性与可控性？
    - 在脱离精心设计的评测序列后，动作条件生成的长时域时间与跨视角一致性会如何变化？
    - 当物理部署中任务变量未被仪器化时，对上下文或动作可观测性的假设是否现实？
    - 若干论文缺少局限性或摘要结果，工件信号也不完整；这属于验证缺口，而非证明缺少基线或代码。
