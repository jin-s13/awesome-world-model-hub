  - 开放问题：长时程一致性、未见上下文下的物理合理性、超出nuScenes/Minecraft/CARL的泛化，以及跨团队独立复现仍未充分解决或仅有部分证据。
  literature_review:
    line_of_work_matrix:
    - line: Controllable world-model simulation from generative video and recurrent
        state models
      what_it_solves: Turning predictive models into action- or context-conditioned
        simulators that can generate future frames or latent trajectories for policy
        learning and evaluation.
      what_remains_open: Long-horizon coherence, physical plausibility, action fidelity,
        and generalization beyond curated driving, robotics, or game settings.
    - line: Context-aware model-based reinforcement learning
      what_it_solves: Improving zero-shot policy transfer when environment dynamics
        change by conditioning world-model latent inference and dynamics on observable
        context.
      what_remains_open: Reliance on observable context values and evaluation only
        on limited tasks leaves fully unknown-dynamics generalization unverified.
    - line: Benchmark and evaluation artifacts for world models
      what_it_solves: Providing datasets, metrics, and open-access evaluation frameworks
        to measure spatial consistency, action fidelity, and physical plausibility.
      what_remains_open: Coverage is concentrated in Minecraft, nuScenes, and CARL;
        independent reproduction and cross-domain validity are not yet demonstrated.
    - line: Real-time closed-loop serving and deployment stacks
      what_it_solves: Reducing inference latency and providing system-level reproducibility
        so generative simulators can be used in closed-loop or interactive settings.
      what_remains_open: Scalability beyond single-GPU, multi-camera, or curated deployment
        scenarios and robustness over very long sequences remain uncertain.
    consensus:
    - High-relevance work converges on using world models as interactive simulators
      rather than only as video generators, with downstream policy training, evaluation,
      or closed-loop control as motivating targets.
    - Evaluation is broadening from pixel-level visual quality to action fidelity,
      dynamic consistency, spatial consistency, and physical plausibility.
    - Artifacts such as datasets, benchmarks, and code or open-access evaluation frameworks
      are treated as central contributions, especially where they enable comparison
      across models.
    - Long-horizon consistency and domain shift are recurrently named as unresolved
      challenges; results are often limited to a few benchmark domains.
    disagreements:
    - Some approaches train recurrent world models with imagined rollouts for zero-shot
      transfer, while others adapt pretrained video diffusion or autoregressive generative
      models through lightweight action-conditioned modules; this changes representation,
      training cost, and controllability.
    - 'Evaluation targets differ: one line uses loop closure and scene-graph consistency
      in Minecraft, another uses trajectory-conditioned future frame generation in
      nuScenes, another uses physical plausibility of robot videos, and another uses
      zero-shot returns on contextual RL tasks.'
    - 'Interaction modes differ: closed-loop frame autoregressive serving with sub-second
      latency versus offline dataset and benchmark construction versus prioritized
      imagination in model-based RL.'
    - 'Assumptions differ around context and action: some methods assume observable
      context values, while others condition on explicit trajectory or action commands
      or embed physics implicitly through depth and keypoint tasks.'
    open_questions:
    - Can spatial consistency and physical plausibility be maintained over much longer
      horizons than the benchmark clips evaluated in this packet?
    - Do action-controllable world models generalize outside nuScenes, Minecraft,
      CARL, and the curated robotic scenarios represented in the evidence?
    - How should world models be evaluated when ground-truth actions are absent or
      when context variables are unobservable?
    - What independent cross-team reproduction evidence exists for the code, datasets,
      and benchmarks hinted in the packet, given the absence of independent verification
      signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于生成式视频与循环状态模型的可控世界模拟
      解决的问题: 将预测模型转化为可由动作或上下文条件驱动的模拟器，用于策略学习和评测。
      尚未覆盖: 长时程一致性、物理合理性、动作忠实度以及超出驾驶、机器人或游戏场景的泛化仍未充分验证。
    - 路线: 上下文感知的基于模型的强化学习
      解决的问题: 在环境动力学变化时，将上下文纳入世界模型潜状态推断和动力学建模，以改进零样本策略迁移。
      尚未覆盖: 依赖可观测上下文且仅在有限任务上评估，完全未知动力学下的零样本泛化仍不明确。
    - 路线: 面向世界模型的基准与评估工件
      解决的问题: 提供数据集、指标和开放获取评测框架，量化空间一致性、动作忠实度和物理合理性。
      尚未覆盖: 覆盖集中在Minecraft、nuScenes和CARL等少量环境，跨域有效性和独立复现尚待证明。
    - 路线: 实时闭环服务与部署栈
      解决的问题: 降低推理延迟并提供系统级可复现性，使生成式模拟器可用于闭环或交互式场景。
      尚未覆盖: 超出单GPU、多相机或特定部署场景的可扩展性，以及极长序列稳健性仍不确定。
    共识:
    - 高相关度工作正从单纯视频生成转向将世界模型作为可交互模拟器，并以策略训练、评测或闭环控制为目标。
    - 评测重心从像素级视觉质量扩展到动作忠实度、动态一致性、空间一致性和物理合理性。
    - 数据集、基准和开放评测框架被视为核心贡献，尤其在支持跨模型比较时。
    - 长时程一致性和分布转移被反复视为未解决挑战，结果多局限于少数基准领域。
    分歧:
    - 一些方法训练循环世界模型并通过想象轨迹实现零样本迁移，另一些方法通过轻量动作条件模块适配预训练视频扩散或自回归生成模型，这改变了表示、训练成本和可控性。
    - 评测目标不同：有的用Minecraft闭环导航和场景图一致性，有的用nuScenes轨迹条件未来帧生成，有的用机器人视频物理合理性，还有的用上下文强化学习零样本回报。
    - 交互模式不同：有的强调单GPU亚秒级闭环帧自回归服务，有的侧重离线数据集与基准构建，还有的用于基于模型的强化学习优先想象。
    - 对上下文和动作的假设不同：有的假设上下文可观测，有的以显式轨迹或动作命令为条件，还有的通过深度和关键点任务隐式嵌入物理信息。
    开放问题:
    - 在超出证据包中基准片段的长时程下，空间一致性和物理合理性能否保持？
    - 动作可控世界模型能否在nuScenes、Minecraft、CARL和所代表的机器人场景之外泛化？
    - 当地面真值动作缺失或上下文变量不可观测时，应如何评测世界模型？
    - 证据包中有代码、数据集和基准线索，但缺少独立验证信号；多个团队与基础设施之间的独立复现证据是什么？
