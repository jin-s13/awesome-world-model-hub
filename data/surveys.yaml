  related_work_outline_zh:
  - 主流方向：综述与分类工作集中在视频生成、交互式模拟和自动驾驶的世界模型，按应用场景、世界状态表示和技术挑战组织设计空间。
  - 研究共性：论文把碎片化领域抽象为可控结构，如潜在状态、显式3D或动态实体、视频生成原语，再据此识别可控性、记忆与评测缺口，并提出路线图式方向。
  - 关键差异：范围从通用视频世界模型到自动驾驶潜在世界模型；表示分为生成式视频或像素空间预测与潜在连续、离散或混合状态；评测从概念框架、基准比较到方法级仿真或真实机器人结果。
  - 趋势演进：证据从2022年物理机器人世界模型学习，走向2024—2026年交互式和通用视频世界模型综述，再到面向长时程、实时、持久视线外动态的分类、开源模拟器与基准。
  - 开放问题：提出的分类和基准比较是否有系统覆盖而非选择性示例；指标与环境在领域间是否可比；应优先解决哪些缺口，如真实验证、持久状态、动作跟随响应。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into directions, milestones,
        and gaps across application scenarios, representations, and technical challenges.
      what_remains_open: Whether the synthesis is based on systematic coverage or
        selective examples, and whether proposed taxonomies are empirically validated.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how benchmarks and evaluation choices shape conclusions
        across open-world exploration, game engines, autonomous driving, and robotics.
      what_remains_open: Whether reported results and metrics are compatible across
        different environments, datasets, and open-loop or closed-loop settings.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad coverage into concrete next questions around action-conditioned
        controllability, long-horizon memory, real-time responsiveness, and persistent
        out-of-sight dynamics.
      what_remains_open: Prioritization of gaps and evidence that the mapped gaps
        are the most important for real-world progress rather than artifacts of current
        trends.
    - line: Primary method exemplification within survey coverage
      what_it_solves: Demonstrates concrete world-model capabilities such as robot
        imagination, ego-vision control, out-of-sight persistence, and open-source
        real-time simulation that surveys taxonomize.
      what_remains_open: Whether these method-level results use compatible evaluation
        settings and provide enough real-world or long-horizon evidence to support
        general survey claims.
    consensus:
    - World models are treated as a central abstraction for synthesizing realistic
      visual content, predicting future states, and enabling interaction in dynamic
      environments.
    - Controllability, long-horizon temporal consistency, and persistent world state
      are recurring research challenges across the reviewed landscape.
    - Evaluation and benchmark coverage is seen as necessary, but current methods
      are not consistently validated in real-world or closed-loop deployment.
    - 'Surveys tend to identify similar open directions: broader generalization, better
      memory, and more reliable action-following responsiveness.'
    disagreements:
    - 'Representation-level difference: some work organizes around generative video
      or pixel-space predictions, while others center on latent continuous, discrete,
      or hybrid states.'
    - 'Evaluation-target difference: some contributions compare existing benchmarks
      across domains, while others propose conceptual frameworks or method-specific
      metrics without implementation.'
    - 'Interaction and deployment difference: evidence ranges from real-time interactive
      simulators and physical robot learning to offline video-plan generation and
      simulated out-of-sight persistence.'
    - 'Supervision and control difference: papers use language-composed primitives,
      ego-motion and object or human-pose control, or action-conditioned generation
      as the main control mechanism.'
    open_questions:
    - How can survey-level taxonomies be validated with systematic literature coverage
      and empirical checks rather than selective examples?
    - Which evaluation settings and metrics are actually comparable across open-world
      exploration, game engines, autonomous driving, and robotics?
    - Do current world-model capabilities transfer from simulation or curated video
      generation to physical robot deployment and long-horizon real-world interaction?
    - Which gaps such as real-world validation, persistent out-of-sight state, action-following
      latency, or resource-aware inference should be prioritized next?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类法与路线图综合
      解决的问题: 把碎片化的世界模型研究映射到方向、里程碑和缺口，覆盖应用场景、表示和技术挑战。
      尚未覆盖: 该综合是否基于系统覆盖而非选择性示例，以及所提分类法是否经过实证验证。
    - 路线: 对比评测综合
      解决的问题: 总结基准和评测选择如何影响开放世界探索、游戏引擎、自动驾驶和机器人领域的结论。
      尚未覆盖: 不同环境、数据集以及开环或闭环设定下报告的结果和指标是否真正兼容。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛覆盖转化为动作条件可控性、长时记忆、实时响应和持久视线外动态等具体研究问题。
      尚未覆盖: 缺口的优先级，以及这些缺口是否真正决定实际进展而非仅反映当前热点。
    - 路线: 被综述覆盖的原型方法
      解决的问题: 提供具体的世界模型能力示例，如机器人想象、自我视觉控制、视线外持续模拟和开源实时模拟，供综述分类并据此定义缺口。
      尚未覆盖: 这些方法级结果是否使用兼容评测设置，并具备足够的真实世界或长时程证据来支撑综述性结论。
    共识:
    - 世界模型被视为合成逼真视觉内容、预测未来状态并支持动态环境交互的核心抽象。
    - 可控性、长时程时间一致性和持久世界状态是被综述文献中反复出现的研究挑战。
    - 评测和基准覆盖被认为必要，但当前方法在真实世界或闭环部署中的验证并不一致。
    - 综述普遍指向相似的开放方向：更强的泛化、更好的记忆和更可靠的动作跟随响应。
    分歧:
    - 表示层面：一些工作围绕生成式视频或像素空间预测，另一些以潜在连续、离散或混合状态为中心。
    - 评测目标：一些贡献比较现有跨域基准，另一些提出概念框架或方法特定指标但未实施验证。
    - 交互与部署：证据覆盖实时交互模拟器、物理机器人学习、离线视频计划生成和仿真视线外持续性等不同设定。
    - 监督与控制：论文分别以语言组合原语、自我运动与物体或人体姿态控制、或动作条件生成为主要可控性机制。
    开放问题:
    - 如何用系统性文献覆盖和实证检验来验证综述级分类法，而不是依赖选择性示例？
    - 开放世界探索、游戏引擎、自动驾驶和机器人中的评测设置与指标在多大程度上可以互相比较？
    - 当前世界模型能力是否能从仿真或精选视频生成迁移到物理机器人和长时程真实世界交互？
    - 下一波研究应优先解决哪些缺口：真实验证、持久视线外状态、动作跟随延迟还是资源感知推理？
