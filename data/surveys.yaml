  related_work_outline_zh:
  - 主流方向：以生成式、动作条件视频世界模型为主的具身与驾驶应用，典型如 MaskGWM、RoboScape、RoboDreamer、UWM，将扩散或 Transformer
    预测与任务控制耦合。
  - 研究共性：论文通常学习视觉动态预测模型，并以动作、语言或物理线索作为条件，在领域数据上评测，再将预测质量与下游策略或一致性指标关联。
  - 关键差异：表示与监督不同：随机潜在想象、视频掩码重建、语言原语分解、物理信息辅助任务和统一视频-动作扩散并存。
  - 趋势演进：当前高相关证据集中在 2023-2026 年，显示从样本高效强化学习世界模型，转向领域特定视频生成与空间/记忆/动作一致性评测基准。
  - 开放问题：证据包尚未显示视频或指标提升能否迁移到真实安全、新动作空间或跨本体部署；复现与局限信息常不完整。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot task transfer and compositional imagination
      what_it_solves: Adapts video world models to robot manipulation by combining
        language-conditioned primitives, physics-informed auxiliary tasks, or unified
        video-action diffusion pretraining.
      what_remains_open: Evidence is mostly limited to simulation or offline policy
        evaluation; transfer to real robots, entirely novel primitives, and cross-embodiment
        robustness remains unverified.
    - line: Autonomous driving scene prediction and multi-view simulation
      what_it_solves: Uses diffusion transformers with mask reconstruction to improve
        long-horizon and multi-view driving video prediction across nuScenes, OpenDV-2K,
        and Waymo.
      what_remains_open: Reported gains are video-prediction benchmark results; closed-loop
        planning, safety, and alignment with real-world operational outcomes are not
        demonstrated in the packet.
    - line: Model-based reinforcement learning in interactive environments
      what_it_solves: Builds stochastic or context-conditioned world models to reduce
        environment interactions and improve zero-shot generalization in Atari and
        contextual RL tasks.
      what_remains_open: The contextual approach assumes observable context and is
        tested on only two CARL tasks; game benchmark gains do not show transfer to
        embodied or real-world settings.
    - line: Consistency and action-control benchmarking for world models
      what_it_solves: Provides open-domain datasets and metrics for spatial consistency,
        memory consistency, and action control using loop navigation and varied action
        spaces.
      what_remains_open: Benchmark construction is emphasized, but evidence that metric
        improvements predict downstream task success is missing; long-term consistency
        remains a reported challenge.
    consensus:
    - Recent applications increasingly treat video generation as the core predictive
      interface for world models, usually with diffusion or transformer backbones.
    - Actions or control signals are becoming first-class conditioning variables for
      world-model training and evaluation.
    - Evaluation combines visual fidelity with domain-specific control or consistency
      metrics, but often stops short of real-world closed-loop evidence.
    - Domain-specific datasets and benchmarks are used to expose generalization problems
      such as unseen contexts, long-horizon rollouts, and spatial or memory consistency.
    disagreements:
    - 'Representation differs: stochastic latent imagination, masked video reconstruction,
      language-primitive factorization, physics-informed auxiliary tasks, and unified
      video-action diffusion all coexist in the packet.'
    - 'Supervision differs: some models use action-free video or language goals, while
      others require observable context, action-labeled trajectories, or physical
      auxiliary supervision.'
    - 'Evaluation targets differ: Atari human-normalized score and training time,
      multi-view driving prediction, robot video fidelity and policy utility, and
      spatial/memory/action-control consistency metrics reflect incompatible notions
      of success.'
    - Deployment assumptions differ between game simulation, robot simulation or offline
      data, driving datasets, and open-domain videos; cross-domain and real-world
      generalization is rarely tested.
    open_questions:
    - Do driving video prediction gains transfer to closed-loop real-world planning
      and safety outcomes?
    - Do spatial, memory, or action-control consistency metrics predict downstream
      task success or agent capability?
    - Can compositional robot world models handle novel primitives and new action
      spaces beyond combinations seen in training?
    - Does the observable-context assumption in contextual world models hold in unstructured
      real-world tasks?
    - What verification gaps exist for models whose packet evidence lacks explicit
      code, baseline, dataset, metric, or limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人任务迁移与组合式想象生成
      解决的问题: 通过语言条件原语、物理信息辅助任务或统一视频-动作扩散预训练，将视频世界模型适配到机器人操作场景。
      尚未覆盖: 证据多停留在仿真或离线策略评估；真实机器人、全新原语和跨本体鲁棒性仍未充分验证。
    - 路线: 自动驾驶场景预测与多视角仿真
      解决的问题: 利用扩散 Transformer 和掩码重建，在 nuScenes、OpenDV-2K、Waymo 上改善长时域与多视角驾驶视频预测。
      尚未覆盖: 当前收益主要是视频预测基准结果；闭环规划、安全性和真实运行对应关系在证据包中未得到证明。
    - 路线: 交互式环境中的基于模型强化学习
      解决的问题: 构建随机或上下文条件世界模型，降低环境交互需求并改善 Atari 和上下文强化学习中的零样本泛化。
      尚未覆盖: 上下文方法假设上下文可观测，且仅在两个 CARL 任务上验证；游戏基准提升未显示可迁移到具身或真实环境。
    - 路线: 世界模型的一致性与动作控制基准评测
      解决的问题: 提供开放域数据集和指标，评测空间一致性、记忆一致性以及不同动作空间下的动作控制。
      尚未覆盖: 侧重基准构建，指标提升能否预测下游任务成功仍缺少证据；长期一致性仍是该方法提出的关键挑战。
    共识:
    - 近期应用多将视频生成作为世界模型的核心预测接口，并以扩散或 Transformer 作为常见骨干。
    - 动作或控制信号越来越多地成为世界模型训练与评测的一等条件变量。
    - 评测通常结合视觉保真度与领域控制或一致性指标，但往往缺少真实世界闭环证据。
    - 通过领域特定数据集和基准来揭示泛化问题，例如未见上下文、长时域展开和空间或记忆一致性。
    分歧:
    - 表示方式不同：随机潜在想象、视频掩码重建、语言原语分解、物理信息辅助任务和统一视频-动作扩散并存。
    - 监督信号不同：有的利用无动作视频或语言目标，有的需要可观测上下文、动作标注轨迹或物理辅助监督。
    - 评测目标不同：Atari 人类归一化分数与训练时间、多视角驾驶预测、机器人视频保真度和策略效用、以及空间/记忆/动作控制一致性指标反映不同的成功标准。
    - 部署假设不同：游戏仿真、机器人仿真或离线数据、驾驶数据集和开放域视频之间存在差异，跨域和真实泛化很少被直接测试。
    开放问题:
    - 驾驶视频预测的改善能否迁移到闭环真实规划与安全结果？
    - 空间、记忆或动作控制一致性指标能否预测下游任务成功或智能体能力？
    - 组合式机器人世界模型能否处理训练中未见的新原语和新动作空间？
    - 上下文世界模型中的可观测上下文假设在非结构化真实任务中是否成立？
    - 对于证据包中缺少代码、基线、数据集、指标或局限细节的模型，存在哪些验证缺口？
