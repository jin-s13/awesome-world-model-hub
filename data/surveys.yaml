    研究路线矩阵:
    - 路线: 面向多视角和长时域预测的驾驶世界模型
      解决的问题: 将驾驶场景预测构建为条件视频生成，并利用掩码重建提升跨驾驶数据集和多视角的泛化。
      尚未覆盖: 证据主要在Nuscenes、OpenDV-2K和Waymo的视觉预测上，闭环安全与真实运营结果未确立。
    - 路线: 上下文和随机模型驱动的强化学习
      解决的问题: 通过上下文潜在动力学或随机Transformer世界模型提升样本效率和变化动力学下的零样本泛化。
      尚未覆盖: 上下文可观测假设以及CARL或Atari上的窄域评估，使真实具身迁移和未知动力学仍未验证。
    - 路线: 组合式和物理信息引导的机器人想象
      解决的问题: 通过语言原语分解或深度、关键点动力学等物理相关任务分解机器人视频生成，用于可复用视频计划、策略训练与评估。
      尚未覆盖: 对训练原语之外的新组合泛化、真实机器人部署以及客观物理合理性评估仍未解决。
    - 路线: 视频-动作统一预训练机器人世界模型
      解决的问题: 在单一Transformer中耦合动作和视频扩散，表示策略、前向/逆向动力学和视频生成，以利用大规模机器人数据。
      尚未覆盖: 除预训练和微调收益外，长时域可靠性与真实机器人执行证据仍缺失。
    - 路线: 世界模型一致性和动作控制基准
      解决的问题: 构建导航视频数据集和指标，用于评估空间/记忆一致性、动作条件和跨视角闭环控制。
      尚未覆盖: 指标效度尚未与下游任务成功关联，基准结果也未显示如何弥合观察到的一致性差距。
    共识:
    - 世界模型越来越被构建为以动作、语言或上下文为条件的生成式视频或序列模型，而不仅是价值估计的潜在动力学模型。
    - 辅助自监督或物理类目标被广泛用于提升时空一致性、泛化能力和下游策略学习。
    - 评估从单一任务RL分数转向数据集或基准级泛化，包括跨数据集驾驶、未见机器人目标和记忆/动作控制探查。
    - 可复现与部署证据不均衡，多篇论文报告了强基准提升，但未给出真实或闭环结果。
    分歧:
    - 表示空间不同：多视角驾驶视频、第一/第三人称机器人视频、潜在循环状态空间和Minecraft导航帧提出不同的记忆、视角和动作空间要求。
    - 监督信号不同：掩码重建、深度/关键点预测、上下文条件化、语言原语分解和动作-视频扩散依赖不同标签与假设。
    - 评测目标不同：驾驶工作强调视觉保真和跨数据集迁移，RL工作强调样本效率和人类归一化分数，机器人工作强调指令执行或物理合理性，基准工作强调一致性和动作控制。
    - 交互模式不同：一些模型是离线视频规划器或策略预训练器，另一些生成闭环动作，MIND明确评估跨视角的交互式回访和动作控制。
    - 部署场景不同：仅仿真机器人执行和游戏导航基准难以支撑真实驾驶安全、物理接触和长时域运行有效性的判断。
    开放问题:
    - 驾驶视频预测提升能否迁移到真实闭环驾驶安全与运营结果？
    - 组合式机器人世界模型能否处理训练原语之外的全新指令或物体-动作组合？
    - 测量的空间或记忆一致性能否预测下游导航或操作任务成功？
    - 上下文条件化在仅两个CARL任务上的零样本结果在上下文不可观测或动力学变化较大时是否仍成立？
    - 物理信息生成和视频-动作统一预训练能否在真实机器人执行而不仅是仿真或视觉指标上得到验证？
