  related_work_outline:
  - 'Mainstream direction: World-model benchmarking is consolidating around standardized
    tasks that measure video prediction, visual detail, physics plausibility, spatial/memory
    consistency, action control, and downstream policy utility. Evidence centers on
    driving, Minecraft navigation, robotic manipulation, and Atari, often using diffusion
    or transformer world models.'
  - 'Shared research pattern: Papers define or reuse a task and metric, compare against
    standard baselines, and report both generation quality and downstream utility
    such as policy training, zero-shot generalization, or interactive control.'
  - 'Key differences: Evaluation targets differ from spatial loop consistency, memory/action
    control, Atari human-normalized score, driving video prediction, to contextual
    zero-shot policy. Supervision differs across action-conditioned diffusion, physics-informed
    auxiliary tasks, context dynamics, and mask reconstruction. Deployment settings
    differ across open-world navigation, embodied robot data, driving, and games.'
  - 'Trend evolution: The represented frontier spans 2023-2026, moving from efficient
    stochastic/transformer world models on Atari toward diffusion-based, multimodal,
    embodied and memory/action/physics consistency evaluations; older years in the
    year span lack top-evidence coverage.'
  - 'Open questions: Whether proxy metrics match downstream decisions, whether task
    coverage includes unseen action spaces and long-horizon memory, whether conclusions
    are stable across implementations and compute budgets, and whether missing limitation/citation
    data limits auditability.'
  related_work_outline_zh:
  - 主流方向：世界模型评估围绕标准任务和数据集展开，重点测量视频预测、视觉细节、物理合理性、空间/记忆一致性、动作控制和下游策略收益；驾驶、Minecraft、机器人操作与Atari是主要证据场景。
  - 研究共性：定义或复用任务与指标，对比基线，并同时报告视觉质量、物理合理性、策略训练或零样本泛化等下游表现。
  - 关键差异：评估目标分别关注空间一致性、记忆与动作控制、Atari智能体得分、驾驶视频生成或上下文零样本策略；监督信号包括动作条件扩散、物理辅助任务、上下文动力学和掩码重建；场景覆盖开放世界导航、具身机器人、驾驶与游戏。
  - 趋势演进：证据集中在2023-2026前沿，从Atari上的高效随机/Transformer世界模型，走向扩散式、多模态和具身评估，强调记忆、动作与物理一致性；2016-2022年份跨度存在，但缺乏顶层证据。
  - 开放问题：代理指标是否反映真实下游策略和部署价值；基准是否覆盖长时域记忆、未知动作空间与跨域迁移；不同实现和算力预算下结论是否稳定；缺失的局限性和引用信息是否削弱可审计性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that make world-model claims
        comparable across navigation, driving, robot, and game settings.
      what_remains_open: Whether task distributions cover unseen action spaces, long-horizon
        memory, and the real settings where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, controllability, robustness, memory
        consistency, visual detail, and decision utility beyond aggregate scores.
      what_remains_open: Whether proxy metrics such as scene consistency, visual fidelity,
        or action control align with downstream decisions users actually care about.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, standard benchmarks,
        training-cost reporting, and reproducibility artifacts.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        dataset splits, and compute budgets given incomplete reporting.
    consensus:
    - 'World-model evaluation must capture more than frame-level realism: consistency,
      controllability, and downstream policy value are increasingly part of benchmark
      design.'
    - Diffusion and transformer models are treated as strong baselines, with standard
      benchmark scores used for comparability.
    - Long-horizon generation, memory consistency, and generalization across scenes
      or action spaces are widely recognized as unresolved pressures.
    disagreements:
    - 'Evaluation targets differ: closed-loop spatial consistency, memory/action control,
      Atari human-normalized score, driving video prediction, or contextual zero-shot
      policy success.'
    - 'Supervision signals differ: action-conditioned video generation, physics-informed
      auxiliary objectives, context-conditioned dynamics, or mask reconstruction.'
    - 'Metric emphasis differs: scene-graph consistency, visual/physical plausibility,
      human-normalized reward, or policy success.'
    - 'Deployment settings differ: open-world navigation, embodied robot datasets,
      real-world driving, and game environments.'
    open_questions:
    - Do the proxy metrics used in these benchmarks align with the downstream decisions
      or policies that users actually care about?
    - Do current task distributions cover the real settings where world models are
      expected to help, including unseen action spaces and long-horizon memory?
    - Are benchmark conclusions stable across dataset splits, implementation choices,
      and compute budgets when many scores/citations and limitation details are missing?
    - Does benchmark design separate generalization from scene-specific memorization
      without overfitting to particular scenes or action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型在导航、驾驶、机器人操作与游戏场景中具备可比性。
      尚未覆盖: 任务分布是否覆盖未知动作空间、长时域记忆和世界模型预期发挥作用的真实设置仍不明确。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体分数之外检验预测质量、可控性、记忆一致性、视觉细节和决策效用。
      尚未覆盖: 场景一致性、视觉保真度或动作控制等代理指标与用户真正关心的下游决策之间是否一致仍缺证据。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准基准、基线、训练开销报告和开源工件让结果可审计。
      尚未覆盖: 在报告不完整时，基准结论在不同实现、数据划分和算力预算下是否稳定仍缺少验证。
    共识:
    - 世界模型评估需要超越帧级真实感，一致性、可控性和下游策略价值正成为基准设计的核心维度。
    - 扩散模型和Transformer模型被作为强基线，标准基准分数用于可比性。
    - 长时域生成、记忆一致性以及跨场景/动作空间泛化被普遍视为尚未解决的压力。
    分歧:
    - 评估目标不同：闭环空间一致性、记忆与动作控制、Atari人类归一化得分、驾驶视频预测或上下文零样本策略成功。
    - 监督信号不同：动作条件视频生成、物理信息辅助目标、上下文动力学建模或掩码重建。
    - 指标侧重不同：场景图一致性、视觉/物理合理性、人类归一化奖励或策略成功。
    - 部署场景不同：开放世界导航、具身机器人数据集、真实驾驶和游戏环境。
    开放问题:
    - 这些基准中的代理指标是否与用户真正关心的下游决策或策略一致？
    - 当前任务分布是否覆盖世界模型预期发挥作用的真实设置，包括未知动作空间和长时域记忆？
    - 在大量评分、引用和局限性细节缺失时，基准结论是否在不同数据划分、实现和算力预算下保持稳定？
    - 基准设计能否把泛化与场景特定记忆分开，并避免对特定场景或动作空间过拟合？
