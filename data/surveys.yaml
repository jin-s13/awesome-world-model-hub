  literature_review:
    line_of_work_matrix:
    - line: Action-controllable video world-model serving
      what_it_solves: Generates future frames conditioned on actions or trajectories
        for closed-loop driving simulation and policy evaluation
      what_remains_open: Long-horizon cross-view consistency beyond nuScenes, multi-GPU
        deployment scaling, and behavior under out-of-distribution actions
    - line: Contextual latent world models for model-based RL
      what_it_solves: Improves zero-shot policy generalization by conditioning Dreamer-style
        latent dynamics on observed context values
      what_remains_open: Assumes observable context; evaluated only on two CARL tasks,
        leaving unknown-dynamics generalization unverified
    - line: Physics-informed embodied world models
      what_it_solves: Adds temporal depth prediction and keypoint dynamics to RGB
        video generation for more physically plausible robot videos
      what_remains_open: Visible evidence lacks explicit limitations and independent
        multi-team reproduction; broader robot domains not shown
    - line: Benchmarks for spatial consistency and action fidelity
      what_it_solves: Provides datasets and metrics to measure loop-based spatial
        consistency and action adherence in world models
      what_remains_open: The loop-based navigation benchmark reports no experimental
        results in the visible abstract; metric sensitivity to long-horizon drift
        and baseline coverage remain unclear
    - line: Adaptation of pre-trained video generators into world simulators
      what_it_solves: Turns existing diffusion or autoregressive video generators
        into controllable simulators through lightweight action-conditioned modules
      what_remains_open: May sacrifice fine visual detail and inherit pretrained biases;
        evaluation is limited to games and robotics, not broad interactive domains
    consensus:
    - Use video-generative backbones as world simulators, conditioned on actions,
      trajectories, or context, and evaluate both generation quality and downstream
      control utility.
    - Treat geometry, physics, or scene-graph consistency as necessary beyond pixel-level
      realism.
    - Emphasize open artifacts such as datasets, code, and benchmark evaluations,
      but independent verification remains a repeated gap.
    disagreements:
    - 'Evaluation target differs: visual fidelity, action fidelity, spatial consistency,
      latency, or downstream policy performance.'
    - 'Control representation differs: high-level intentions, low-level trajectories,
      observable latent context, keypoint dynamics, or action-conditioned modules.'
    - 'Deployment setting differs: closed-loop autonomous driving, model-based RL,
      robotic video generation, and benchmark-first evaluation rather than real-time
      serving.'
    - 'Training strategy differs: specialized simulators trained on domain data versus
      adapting pre-trained video generators with lightweight modules.'
    open_questions:
    - How can long-horizon action-conditioned videos maintain geometric, spatial,
      and cross-view consistency without accumulating autoregressive drift?
    - What evaluation protocol can jointly measure visual quality, physical plausibility,
      action following, and system latency without overfitting to one benchmark?
    - Can contextual world models generalize zero-shot when context is unobserved
      or dynamics are unknown, beyond two CARL tasks?
    - Are the open-sourced systems and benchmarks independently reproducible across
      teams, datasets, and hardware environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控视频世界模型服务
      解决的问题: 以动作或轨迹为条件生成未来帧，用于闭环驾驶模拟与策略评估
      尚未覆盖: nuScenes之外的长时域跨视角一致性、多GPU部署扩展、分布外动作行为
    - 路线: 面向基于模型强化学习的上下文潜在世界模型
      解决的问题: 通过将Dreamer式潜在动力学条件化于可观测上下文值，提升策略零样本泛化
      尚未覆盖: 假设上下文可观测；仅在CARL两个任务上评估，未知动力学泛化未验证
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 在RGB视频生成中加入时间深度预测和关键点动力学，提高机器人视频物理合理性
      尚未覆盖: 可见证据缺少显式局限性和跨团队独立复现；更广泛机器人领域未展示
    - 路线: 面向空间一致性与动作忠实度的基准
      解决的问题: 提供数据集与指标，衡量世界模型在循环导航中的空间一致性及动作忠实度
      尚未覆盖: 循环导航基准在可见摘要中无实验结果；指标对长时域漂移的敏感性及基线覆盖仍不清
    - 路线: 将预训练视频生成器适配为世界模拟器
      解决的问题: 通过轻量动作条件模块，把已有扩散或自回归视频生成器转化为可控模拟器
      尚未覆盖: 可能牺牲细粒度视觉细节并继承预训练模型偏差；评估限于游戏和机器人，未覆盖广泛交互场景
    共识:
    - 使用视频生成骨干作为世界模拟器，以动作、轨迹或上下文为条件，并同时评估生成质量与下游控制效用。
    - 将几何、物理或场景图一致性视为超越像素级真实感的必要能力。
    - 强调开放数据集、代码与基准评估，但独立验证仍然是重复出现的缺口。
    分歧:
    - 评测目标不同：视觉保真度、动作忠实度、空间一致性、延迟或下游策略性能。
    - 控制表示不同：高层意图、低层轨迹、可观测潜在上下文、关键点动力学或动作条件模块。
    - 部署场景不同：闭环自动驾驶、基于模型的强化学习、机器人视频生成，以及以基准为主的评测而非实时服务。
    - 训练策略不同：在领域数据上训练专用模拟器，或通过轻量模块适配预训练视频生成器。
    开放问题:
    - 长时域动作条件视频如何在自回归推演中保持几何、空间与跨视角一致性，避免误差累积？
    - 何种评测协议能联合衡量视觉质量、物理合理性、动作跟随与系统延迟，而不只过度拟合单一基准？
    - 当上下文不可观测或动力学未知时，上下文世界模型能否在CARL两个任务之外实现零样本泛化？
    - 开放系统与基准能否在跨团队、数据集和硬件环境中被独立复现？
