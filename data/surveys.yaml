  related_work_outline:
  - 'Mainstream direction: building generalizable world models for embodied and driving
    domains by coupling video generation with action or physics, often via large-scale
    pretraining and diffusion/Transformer architectures.'
  - 'Shared research pattern: using video prediction or latent dynamics as the core
    world model, augmenting it with extra signals (context, actions, language, physics)
    to improve generalization, and evaluating on simulation or offline datasets.'
  - 'Key differences: application domains (driving, robotics, games) and the type
    of auxiliary information (mask reconstruction, context, language primitives, depth,
    keypoints, action diffusion) lead to distinct generalization goals and evaluation
    protocols.'
  - 'Trend evolution: moving from single-task game worlds (Atari) toward multi-embodiment
    and driving scenarios; from purely visual generation to physics-informed and action-coupled
    models; from separate training to unified pretraining on large robot datasets;
    evaluation benchmarks are now targeting spatial and memory consistency.'
  - 'Open questions: real-world safety and operational alignment, long-term memory
    consistency, cross-embodiment and cross-action-space generalization, and whether
    physical priors or context assumptions limit zero-shot transfer to fully unknown
    dynamics.'
  related_work_outline_zh:
  - 主流方向：构建通用世界模型，通过视频生成与动作/物理的耦合，采用大规模预训练和扩散/Transformer架构，支持具身和驾驶领域的视频预测、策略学习与评估。
  - 研究共性：普遍以视频预测或潜变量动态作为世界模型核心，引入额外信号（上下文、动作、语言、物理）提升泛化，并在仿真或离线数据上评测。
  - 关键差异：应用领域（驾驶、机器人、游戏）和辅助信息类型（掩码重建、上下文、语言原语、深度、关键点、动作扩散）不同，导致泛化焦点和评测方式分化。
  - 趋势演进：从单任务游戏世界（Atari）向多本体/驾驶场景扩展；从纯视觉生成到物理信息与动作耦合模型；从独立训练到大规模机器人数据统一预训练；评估基准开始关注空间和记忆一致性。
  - 开放问题：仿真到真实的安全性与操作对齐，长期记忆一致性，跨本体和跨动作空间泛化，以及物理先验或上下文假设是否限制了完全未知动态下的零样本迁移。
  literature_review:
    line_of_work_matrix:
    - line: Embodied and domain task transfer
      what_it_solves: adapting world models to concrete tasks with varying dynamics,
        actions, and constraints, enabling zero-shot or compositional generalization
        to unseen contexts and goals.
      what_remains_open: generalization to entirely novel physical embodiments or
        environments without observable context, reliance on predefined primitives
        or context assumptions, and lack of real-world robotic validation.
    - line: Autonomous driving and simulation use cases
      what_it_solves: long-horizon, multi-view video prediction for driving scenes,
        and zero-shot generalization across different driving datasets.
      what_remains_open: alignment between video prediction metrics and real-world
        driving safety or operational outcomes; closed-loop policy evaluation under
        real-world conditions is not yet verified.
    - line: Interactive agents and games
      what_it_solves: building and evaluating world models in interactive environments
        with loop-based structures and long-term dependencies, improving sample efficiency
        or spatial consistency.
      what_remains_open: generalization across different games, action spaces, and
        long-term memory maintenance; transferring capabilities from game environments
        to real-world interactive tasks.
    consensus:
    - World models are predominantly realized as video generation or latent-dynamics
      models, with Transformer and diffusion architectures as the backbone.
    - All works incorporate auxiliary information (context, actions, language, physics)
      to improve generalization beyond pure visual reconstruction.
    - Evaluation is heavily simulation- or offline-dataset-based, leaving a gap in
      real-world closed-loop validation.
    disagreements:
    - 'Representation form: stochastic latent-variable models (cRSSM, STORM) versus
      deterministic diffusion-based generation (MaskGWM, UWM, RoboDreamer).'
    - 'Supervision signals: mask reconstruction (MaskGWM), context conditioning (cRSSM),
      language decomposition (RoboDreamer), physics priors (RoboScape), and action-video
      coupling (UWM).'
    - 'Evaluation targets: zero-shot domain generalization (MaskGWM, cRSSM), sample
      efficiency (STORM), compositional generalization (RoboDreamer), and physical
      plausibility (RoboScape).'
    - 'Interaction modes: game environments with discrete actions (Atari, Minecraft)
      versus robotic and driving settings with continuous or multi-view action spaces.'
    open_questions:
    - How can world models trained in simulation be safely and reliably deployed in
      real-world environments, and what metrics can certify this transfer?
    - Long-term memory consistency and cross-action-space generalization remain major
      challenges, as evidenced by the MIND and LoopNav benchmarks.
    - Do physics-informed priors and context assumptions restrict zero-shot generalization
      to environments with completely unknown dynamics or embodiments?
    - Can large-scale pretrained unified world models (e.g., UWM) cover diverse robot
      morphologies and tasks without sacrificing domain-specific performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身与领域任务迁移
      解决的问题: 将世界模型适配到具有变化动力学、动作和约束的具体任务，实现对未见上下文和目标的零样本或组合泛化。
      尚未覆盖: 在无可观测上下文的完全新颖物理本体或环境上的泛化，对预定义原语或上下文假设的依赖，以及缺乏真实机器人验证。
    - 路线: 自动驾驶与仿真应用
      解决的问题: 驾驶场景的长时域、多视角视频预测，以及跨不同驾驶数据集的零样本泛化。
      尚未覆盖: 视频预测指标与真实驾驶安全或运营结果之间的对齐，真实条件下闭环策略评估尚未验证。
    - 路线: 交互式智能体与游戏
      解决的问题: 在具有循环结构和长期依赖的交互环境中构建和评估世界模型，提升样本效率或空间一致性。
      尚未覆盖: 跨不同游戏、动作空间的泛化以及长期记忆维护，从游戏环境向真实世界交互任务迁移的能力。
    共识:
    - 世界模型普遍以视频生成或潜变量动态模型实现，采用Transformer和扩散架构作为骨干。
    - 所有工作都引入辅助信息（上下文、动作、语言、物理）以提升纯视觉重建之外的泛化能力。
    - 评估主要基于仿真或离线数据集，存在真实世界闭环验证的缺口。
    分歧:
    - 表示形式：随机潜变量模型（cRSSM, STORM）与确定性扩散生成（MaskGWM, UWM, RoboDreamer）之间的差异。
    - 监督信号：掩码重建（MaskGWM）、上下文条件化（cRSSM）、语言分解（RoboDreamer）、物理先验（RoboScape）和动作-视频耦合（UWM）。
    - 评测目标：零样本域泛化（MaskGWM, cRSSM）、样本效率（STORM）、组合泛化（RoboDreamer）和物理合理性（RoboScape）。
    - 交互模式：离散动作的游戏环境（Atari、Minecraft）与具连续或多视角动作空间的机器人/驾驶场景。
    开放问题:
    - 如何将仿真训练的世界模型安全可靠地部署到真实环境，并有哪些指标可以认证这种迁移？
    - 长期记忆一致性和跨动作空间泛化仍是当前世界模型的主要挑战，MIND和LoopNav基准已揭示这一点。
    - 物理信息先验和上下文假设是否限制了模型在动力学或本体完全未知的环境中的零样本泛化？
    - 大规模预训练统一世界模型（如UWM）能否覆盖多样化的机器人形态和任务，同时不牺牲特定领域的性能？
