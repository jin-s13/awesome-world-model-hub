  related_work_outline:
  - 'Mainstream direction: Recent work centers on generative video or latent-dynamics
    world models for embodied control and driving, with diffusion-transformers or
    stochastic state-space models, e.g., MaskGWM, STORM, UWM, RoboScape.'
  - 'Shared research pattern: Models couple generative sequence/video objectives with
    auxiliary signals such as mask reconstruction, explicit context, language primitives,
    depth/keypoints, or action diffusion to improve consistency and generalization.'
  - 'Key differences: Work differs in representation (latent state-space vs video
    diffusion), supervision (observed context or language primitives vs unified video-action
    pretraining), evaluation target (Atari, CARL, driving, robot simulation, Minecraft),
    and action interface.'
  - 'Trend evolution: The available top-paper years 2023-2026 show a shift from efficient
    stochastic transformer RL models toward contextual, compositional, physics-informed,
    and unified video-action world models plus closed-loop benchmark evaluation.'
  - 'Open questions: Evidence often lacks limitations or broad generalization tests;
    it remains unclear which auxiliary objectives transfer across task families and
    how much gain comes from model, planner, controller, or task prior rather than
    method.'
  related_work_outline_zh:
  - 主流方向：近期方法集中在生成式视频或潜在动力学世界模型，用于具身控制与驾驶；代表如 MaskGWM、STORM、UWM、RoboScape。
  - 研究共性：方法普遍将生成序列/视频目标与掩码重建、显式上下文、语言原语、深度/关键点、动作扩散等辅助信号结合，以提升一致性和泛化。
  - 关键差异：工作差异在于表示（潜在状态空间 vs 视频扩散）、监督（可观测上下文/语言原语 vs 统一视频-动作预训练）、评测目标（Atari、CARL、驾驶、机器人仿真、Minecraft）和动作接口。
  - 趋势演进：Top 论文年份主要集中在 2023-2026，显示从高效随机 Transformer 强化学习模型走向上下文、组合、物理信息、统一视频-动作世界模型，并增加闭环基准评测。
  - 开放问题：证据中常缺少 limitations 或广泛泛化实验；哪些辅助目标可跨任务族迁移，以及收益多少来自模型、规划器、控制器或任务先验仍未明确。
  literature_review:
    line_of_work_matrix:
    - line: Generative video/latent dynamics representation and objective design (e.g.,
        MaskGWM, STORM, UWM, RoboScape)
      what_it_solves: Turns high-dimensional observations and actions into trainable
        generative world-model rollouts or video predictions, improving visual fidelity,
        sample efficiency, or physical consistency.
      what_remains_open: Which auxiliary losses and representations transfer beyond
        the reported dataset/task family is not established; visual fidelity is not
        yet clearly tied to policy utility.
    - line: Contextual and compositional generalization methods (e.g., cRSSM, RoboDreamer)
      what_it_solves: Uses observable context values or language-primitive factorization
        to produce imagined trajectories/video plans for unseen dynamics, goals, or
        object-action combinations.
      what_remains_open: They assume observable context or reliable primitive parsing,
        and evidence is limited to a few tasks or simulation; generalization to wholly
        novel primitives remains unsupported.
    - line: Action-interface and policy/dynamics coupling (e.g., UWM, MIND-World baseline)
      what_it_solves: Connects learned dynamics to actions, planning, policy learning,
        or closed-loop video-to-world control in a unified model.
      what_remains_open: It is not clear how much gain comes from the model versus
        the planner, controller, or task prior; cross-action-space generalization
        is identified as a challenge.
    - line: Evaluation and benchmark protocols (e.g., LoopNav, MIND)
      what_it_solves: Provides datasets and metrics for spatial consistency, memory
        consistency, and action control to reveal world-model failures beyond pixel-level
        generation quality.
      what_remains_open: LoopNav's abstract reports no experimental results; real-world
        closed-loop evidence and broader platform coverage are missing.
    consensus:
    - Recent methods agree that world models should be learned generative sequence
      or latent dynamics models that can produce imagined rollouts or video for control.
    - There is convergence on adding auxiliary signals such as mask reconstruction,
      context, language composition, depth/keypoints, or action diffusion to improve
      consistency and generalization.
    - Evaluation is expanding from short-horizon visual quality or game-based control
      toward closed-loop memory, spatial consistency, action control, and downstream
      policy utility.
    disagreements:
    - Representation differs between low-dimensional latent state-space models for
      sample-efficient RL and high-fidelity video/diffusion generation for visual
      or robotic data.
    - Supervision differs between explicit observable context or parsed language primitives
      and unified action-free video/dynamics pretraining.
    - Evaluation targets differ across Atari 100k, CARL control tasks, driving multi-view
      video, robot datasets, and Minecraft replay benchmarks.
    - Interaction mode differs among imaginary rollouts for policy optimization, video-plan
      generation for robot execution, and benchmarked closed-loop action control.
    open_questions:
    - Which auxiliary objectives transfer beyond the reported task family without
      overfitting to dataset-specific views, actions, or scenes?
    - How much of the reported policy or generation gain is attributable to model
      representation and objective versus surrounding planner, controller, or task-prior
      choices?
    - Can spatial/memory consistency benchmarks be linked to real closed-loop control
      performance in physical or unseen environments?
    - Several top papers lack visible limitations or broad baselines; code, dataset,
      metric, and limitation details remain verification gaps rather than confirmed
      absences.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频/潜在动力学表示与目标设计（如 MaskGWM、STORM、UWM、RoboScape）
      解决的问题: 将高维观测和动作转化为可训练的生成式世界模型 rollout 或视频预测，以提升视觉保真、样本效率或物理一致性。
      尚未覆盖: 哪些辅助损失和表示能跨数据集/任务族迁移尚未验证；视觉保真与策略效用之间的关联仍不清晰。
    - 路线: 上下文与组合泛化方法（如 cRSSM、RoboDreamer）
      解决的问题: 通过可观测上下文或语言原语分解，生成面向未见动力学、目标或物体-动作组合的想象轨迹/视频计划。
      尚未覆盖: 依赖可观测上下文或可靠原语解析；证据仅限于少量任务或仿真，对完全新颖原语的泛化仍无支持。
    - 路线: 动作接口与策略-动力学耦合（如 UWM、MIND-World 基线）
      解决的问题: 将学习到的动力学连接到动作、规划、策略学习或闭环视频到世界控制。
      尚未覆盖: 收益有多少来自模型而非规划器、控制器或任务先验尚不清楚；跨动作空间泛化仍是挑战。
    - 路线: 评测与基准协议（如 LoopNav、MIND）
      解决的问题: 提供数据集和指标，用于衡量空间一致性、记忆一致性和动作控制，揭示超出像素级生成质量的世界模型失败模式。
      尚未覆盖: LoopNav 摘要未报告实验结果；真实闭环证据和更广泛平台覆盖仍缺失。
    共识:
    - 近期方法普遍认为世界模型应是可学习的生成式序列或潜在动力学模型，能生成想象 rollout 或视频以支撑控制。
    - 方法趋向于引入掩码重建、上下文、语言组合、深度/关键点或动作扩散等辅助信号，以改进一致性与泛化。
    - 评测正从短期视觉质量或游戏控制走向闭环记忆、空间一致性、动作控制和下游策略效用。
    分歧:
    - 表示形态不同：低维潜在状态空间用于样本高效强化学习，对高保真视频/扩散生成用于视觉或机器人数据。
    - 监督方式不同：显式可观测上下文或解析语言原语，对统一动作无关视频/动力学预训练。
    - 评测目标不同：Atari 100k、CARL 控制任务、驾驶多视角视频、机器人数据集和 Minecraft 回放基准各有侧重。
    - 交互方式不同：想象 rollout 用于策略优化、视频计划用于机器人执行、基准闭环动作控制各有不同接口。
    开放问题:
    - 哪些辅助目标能跨任务族迁移，而不受数据集视角、动作空间或场景限制？
    - 报告的策略或生成收益有多少来自模型表示和目标，而不是来自规划器、控制器或任务先验？
    - 空间/记忆一致性基准能否与真实或未知环境中的闭环控制表现建立有效关联？
    - 若干 top 论文缺少可见 limitations 或广泛基线；代码、数据集、指标和局限性细节属于验证缺口，不应直接断定为缺项。
