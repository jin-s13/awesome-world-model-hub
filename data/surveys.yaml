  related_work_outline:
  - 'Mainstream direction: Application work clusters around controllable video generation
    and latent dynamics for embodied control, especially driving scenes and robot
    manipulation, with an emerging evaluation layer for world-model consistency.'
  - 'Shared research pattern: Methods condition future prediction on actions, language,
    or context and add auxiliary objectives—mask reconstruction, depth/keypoint physics,
    diffusion coupling—to improve consistency and controllability.'
  - 'Key differences: Architectures range from recurrent state-space models and Transformers
    to diffusion models; evaluation spans driving, robot, game, and open-world domains;
    supervision signals also differ.'
  - 'Trend evolution: Within the 2023-2026 frontier window, work moves from efficient
    model-based RL on Atari toward large-scale robot and driving video world models,
    then toward explicit memory and action-control benchmarks.'
  - 'Open questions: Cross-domain transfer, real-world safety and deployment, long-horizon
    memory consistency, generalization beyond observed contexts or instructions, and
    validation of simulator gains remain open.'
  related_work_outline_zh:
  - 主流方向：应用研究集中于机器人和驾驶等具身场景中的可控视频生成与潜在动力学建模，并开始形成世界模型一致性评测层。
  - 研究共性：方法普遍以动作、语言或上下文为条件预测未来，并引入掩码重建、深度/关键点物理、扩散耦合等辅助目标增强一致性与可控性。
  - 关键差异：架构与表示从循环状态空间、Transformer-VAE到扩散模型不一；评测域包括驾驶、机器人、Atari/CARL和Minecraft等，监督信号也不同。
  - 趋势演进：在2023-2026前沿窗口内，研究从Atari上的高效模型强化学习，转向大规模机器人和驾驶视频世界模型，再到显式的记忆与动作控制基准。
  - 开放问题：跨域迁移、真实安全与部署、长时域记忆一致性、对未见上下文/指令的泛化，以及仿真收益向真实结果转化仍未闭合。
  literature_review:
    line_of_work_matrix:
    - line: Driving scene generation and simulation use cases
      what_it_solves: Multi-view, long-horizon driving video prediction and zero-shot
        scene generation via mask reconstruction and diffusion.
      what_remains_open: Whether improved video prediction translates into real-world
        driving safety or operational outcomes remains unverified.
    - line: Model-based RL with latent or recurrent world models
      what_it_solves: Sample-efficient policy learning by training agents on imagined
        latent trajectories for visual control tasks.
      what_remains_open: Evaluation is narrow in domain coverage and uses simplified
        assumptions such as observable context values.
    - line: Compositional and physics-informed robot world models
      what_it_solves: Language-factorized or physics-guided video generation for robot
        manipulation, policy training, and policy evaluation.
      what_remains_open: Generalization beyond seen primitive combinations and real-robot
        transfer are not fully demonstrated.
    - line: World-model consistency evaluation benchmarks
      what_it_solves: Quantifying spatial, memory, and action-control consistency
        beyond pixel-level generation quality.
      what_remains_open: Benchmark-specific environments like Minecraft or curated
        videos leave cross-environment and downstream task validity open.
    consensus:
    - World-model application work increasingly treats future video generation as
      a controllable intermediate object for downstream control or evaluation.
    - Action, language, or context conditioning is a common mechanism for making generated
      futures task-relevant.
    - Auxiliary tasks beyond pixel reconstruction—mask reconstruction, depth/keypoint
      prediction, dynamics modeling, or consistency scoring—are used to improve stability
      and physical plausibility.
    - Recent benchmarks evaluate world models on consistency properties, not only
      visual quality or task score.
    - Papers share a simulation-first or benchmark-first evaluation setting, with
      limited real-world validation.
    disagreements:
    - 'Architectural and dynamics representation differs: recurrent state-space or
      Transformer-VAE rollouts versus diffusion-based video generation.'
    - 'Supervision signals differ: observable context, language primitives, physics-informed
      depth/keypoints, action diffusion, or mask reconstruction.'
    - 'Evaluation domains differ: driving datasets, robot manipulation datasets, Atari/CARL,
      and Minecraft-like open worlds.'
    - 'Interaction mode differs: latent imagination for policy optimization, explicit
      video rollout generation, or closed-loop consistency probing.'
    - 'Deployment readiness differs: some works target policy learning/evaluation
      in simulation, while driving-focused work implies but does not close the real-world
      safety gap.'
    open_questions:
    - How well do driving video prediction benchmarks predict real-world safety outcomes,
      given the absence of operational evidence in current evidence?
    - Can zero-shot dynamics generalization scale beyond simplified contextual reinforcement
      learning tasks with observable context?
    - Can compositional robot world models handle entirely new instructions or physical
      interactions beyond seen primitives and simulation?
    - What architectural or memory mechanisms are needed to maintain long-term consistency
      across viewpoints and action spaces?
    - Does physics-informed generation produce downstream policy gains that transfer
      to real robots, or only simulated visual plausibility?
