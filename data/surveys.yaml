  related_work_outline:
  - 'Mainstream direction: Diffusion/transformer video-generation world models dominate
    this evidence, especially for embodied, driving, and robot settings; representative
    examples include MaskGWM, RoboDreamer, RoboScape, and UWM.'
  - 'Shared research pattern: Papers add auxiliary or joint objectives—mask reconstruction,
    keypoint dynamics, language primitives, or coupled action/video diffusion—to improve
    generalization, spatial/temporal consistency, physical plausibility, or policy
    learning.'
  - 'Key differences: The evidence splits along representation, supervision, and evaluation:
    latent recurrent state-space RL versus transformer/diffusion video models; action-only
    versus language-conditioned versus physics-informed training; Atari, CARL, driving,
    robot video, and memory/action-control benchmarks.'
  - 'Trend evolution: From 2023 model-based RL world models such as STORM, the evidence
    shifts toward 2024-2025 contextual, compositional, physics-informed video world
    models and, by 2025-2026, dedicated memory and action-control benchmarks like
    LoopNav and MIND.'
  - 'Open questions: Evidence still lacks long-term memory guarantees, closed-loop
    action control, physical plausibility beyond visual quality, generalization to
    novel contexts/action spaces, and complete code/limitation or baseline details
    for several papers.'
  related_work_outline_zh:
  - 主流方向：具身、驾驶与机器人场景中的生成式视频世界模型，代表性方法包括 MaskGWM、RoboDreamer、RoboScape、UWM 等扩散/Transformer
    架构。
  - 研究共性：引入辅助或联合目标，如掩码重建、关键点动力学、语言原语、动作与视频扩散耦合，以提升泛化、时空一致性、物理合理性或策略学习。
  - 关键差异：在表示、监督与评测上分化：潜在循环状态空间RL与Transformer/扩散视频模型；动作、语言或物理信息条件；Atari、CARL、驾驶、机器人视频与记忆/动作控制基准。
  - 趋势演进：从2023年前后基于模型的RL世界模型，转向2024-2025上下文/组合/物理信息视频世界模型，再到2025-2026专门的记忆与动作控制基准。
  - 开放问题：长期记忆、闭环动作控制、视觉之外物理合理性、对未见上下文/动作空间泛化，以及多篇论文代码或局限/基线细节缺失的验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative video prediction with auxiliary reconstruction or physics tasks
      what_it_solves: Transforms visual observations and action context into long-horizon,
        multi-view, or robotic video generation while adding signals such as mask
        reconstruction, depth, or keypoint dynamics.
      what_remains_open: Long-term memory consistency, physical plausibility outside
        visual fidelity, and real-world deployment evidence are not yet established.
    - line: Latent dynamics and model-based reinforcement learning
      what_it_solves: Learns compact recurrent latent state spaces and imagination-based
        policy optimization for sample-efficient control.
      what_remains_open: Generalization beyond limited benchmark tasks and assumptions
        such as observable context values remains unverified.
    - line: Compositional and multimodal action-conditioned generation
      what_it_solves: Connects language, goals, actions, and generated video or diffusion
        timesteps to support policy learning, planning, or dynamics modeling.
      what_remains_open: Support for entirely novel primitives, real-robot execution,
        and simulation-to-real transfer remains unresolved.
    - line: Memory, spatial, and action-control evaluation protocols
      what_it_solves: Provides datasets and metrics for measuring spatial consistency,
        memory consistency, and action controllability beyond pixel-level video quality.
      what_remains_open: Benchmark completeness and standardized baseline comparisons
        are still sparse; several papers report no experimental results or limitations.
    consensus:
    - Recent work converges on generative video/diffusion or sequence models as a
      common substrate for world-model method research.
    - Joint or auxiliary objectives improve visual fidelity, consistency, or downstream
      policy learning compared with single-objective generation.
    - Closed-loop memory, spatial consistency, and action-control evaluation are recognized
      as necessary complements to pixel-level video metrics.
    disagreements:
    - 'Representation choices differ: latent recurrent state-space models for model-based
      RL versus transformer/diffusion video generation.'
    - 'Supervision signals differ: mask reconstruction, language primitive factorization,
      physics-informed auxiliary tasks, or coupled action/video diffusion.'
    - 'Evaluation targets differ: sample efficiency on Atari, zero-shot context generalization
      in CARL, driving video fidelity, robot execution, or memory/action consistency.'
    - 'Interaction and deployment settings differ: open-loop video synthesis versus
      closed-loop action-conditioned rollouts, and simulated execution versus driving/robot
      validation.'
    open_questions:
    - How can video world models maintain long-term memory and spatial/action consistency
      across loops and viewpoint changes?
    - Which gains transfer beyond observed task families when evaluation is limited
      to two CARL tasks, simulation, or specific driving and robot datasets?
    - How much improvement comes from the learned model versus the planner, controller,
      language parser, or task prior in mixed systems?
    - Can current methods handle entirely novel primitives, contexts, or action spaces
      beyond training compositions?
    - Do evaluation protocols and available code or limitation details sufficiently
      isolate method contribution from dataset, baseline, and implementation effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式视频预测与辅助重建或物理任务设计
      解决的问题: 将视觉观测和动作上下文转化为长时域、多视角或机器人视频生成，并引入掩码重建、深度或关键点动力学等信号。
      尚未覆盖: 长期记忆一致性、视觉之外物理合理性及真实部署证据仍不足。
    - 路线: 潜在动力学与基于模型的强化学习
      解决的问题: 学习紧凑循环潜在状态空间，并通过想象轨迹优化策略，实现样本高效控制。
      尚未覆盖: 在有限基准任务之外的泛化，以及上下文值可观测等假设尚未得到验证。
    - 路线: 组合式与多模态动作条件生成
      解决的问题: 连接语言、目标、动作与生成视频或扩散时间步，支持策略学习、规划或动力学建模。
      尚未覆盖: 对新原语的支持、真实机器人执行和仿真到真实迁移仍未解决。
    - 路线: 记忆、空间与动作控制评测协议
      解决的问题: 提供数据集与指标，衡量空间一致性、记忆一致性和动作可控性，超越像素级视频质量。
      尚未覆盖: 基准完备性与标准化基线比较仍稀疏；部分论文未报告实验结果或局限。
    共识:
    - 近期工作趋向于以生成式视频/扩散或序列模型作为世界模型方法研究的共同基础。
    - 联合或辅助目标相比单一生成目标能提升视觉保真度、一致性或下游策略学习。
    - 闭环记忆、空间一致性与动作控制评测被认可为像素级视频指标之外的必要补充。
    分歧:
    - 表示方式不同：基于模型的RL中采用潜在循环状态空间模型，对比Transformer/扩散视频生成。
    - 监督信号不同：掩码重建、语言原语分解、物理信息辅助任务或动作/视频扩散耦合。
    - 评测目标不同：Atari样本效率、CARL零样本上下文泛化、驾驶视频保真、机器人执行或记忆/动作一致性。
    - 交互与部署设置不同：开环视频合成与闭环动作条件推演，仿真执行与真实驾驶/机器人验证。
    开放问题:
    - 视频世界模型如何在循环导航和视角变化下维持长期记忆与空间/动作一致性？
    - 当评测仅覆盖两个CARL任务、仿真或特定驾驶与机器人数据集时，哪些收益能迁移到观测任务族之外？
    - 在混合系统中，提升有多少来自学习模型本身，而非规划器、控制器、语言解析器或任务先验？
    - 当前方法能否处理训练组合之外的全新原语、上下文或动作空间？
    - 现有评测协议及代码或局限细节是否足以隔离方法贡献与数据集、基线和实现选择的影响？
