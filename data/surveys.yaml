    model-based RL modifications toward open evaluation frameworks, physics-informed
    and cross-embodiment pretraining, and latency-aware closed-loop generation.'
  - 'Open questions: Long-horizon and out-of-domain consistency, generalization beyond
    narrow benchmarks, cross-embodiment action alignment, and independent deployment-scale
    reproduction remain unverified.'
  related_work_outline_zh:
  - 主流方向：证据集中在可学习的生成式世界模型系统，作为面向自动驾驶和机器人操控的可运行模拟器，以动作或上下文为条件预测未来视频。
  - 研究共性：论文普遍结合大规模视频预测、结构化动作/上下文接口，并通过生成保真度与下游任务效用共同评估，常同时公开数据集或基准。
  - 关键差异：工作分为面向单一特性的离线基准（如空间一致性、动作忠实度）、物理信息或上下文建模改进，以及有延迟约束的闭环系统部署。
  - 趋势演进：在当前前沿内，研究从上下文模型式强化学习的单点改进，走向开放评测框架、物理信息与跨具身预训练，以及低延迟闭环生成。
  - 开放问题：长时域与分布外一致性、跨窄基准的泛化、跨具身动作对齐、以及部署规模下的独立复现仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Closed-loop generative driving simulators
      what_it_solves: Generate future multi-camera driving video under action or trajectory
        control for simulation and policy evaluation; one line targets sub-second
        single-GPU latency.
      what_remains_open: Generalization beyond nuScenes-like settings, long-horizon
        cross-view consistency, and multi-GPU or complex-scene deployment scalability.
    - line: Contextual and cross-embodiment world-model adaptation
      what_it_solves: Enable zero-shot or cross-embodiment transfer by conditioning
        on observable context or universal latent actions, using pretraining across
        many datasets and frames.
      what_remains_open: Assumes observable context or a shared latent-action interface;
        broad zero-shot generalization and real-robot validity are only partially
        evidenced.
    - line: Physics-informed and controllable video world models
      what_it_solves: Improve visual fidelity, motion, and physical plausibility through
        depth prediction, keypoint dynamics, structured losses, or explicit control.
      what_remains_open: Evaluation is limited to selected robotic or driving scenarios;
        physical-plausibility metrics and downstream deployment impact are not standardized.
    - line: Benchmarks and reproducible evaluation artifacts for world-model systems
      what_it_solves: Provide datasets, metrics, and open evaluation frameworks for
        properties such as spatial consistency or action fidelity.
      what_remains_open: Some benchmark papers emphasize construction over experimental
        results; independent cross-team reproduction and environment coverage remain
        open.
    - line: Real-time and interactive serving stacks
      what_it_solves: Turn generative world models into low-latency closed-loop components
        for driving or robot training and evaluation pipelines.
      what_remains_open: Latency results are demonstrated on limited hardware and
        datasets; interactive robustness under long sessions or out-of-distribution
        conditions is not established.
    consensus:
    - Papers converge on treating world models as action- or context-conditioned video-generation
      systems, with simulation or downstream policy use as a central motivation.
    - 'They evaluate along multiple axes: generation fidelity, control adherence or
      consistency, physical plausibility, and downstream task utility.'
    - Open code, datasets, or benchmarks are emphasized, but evaluation remains concentrated
      on canonical environments such as Minecraft, CARL, nuScenes, and LIBERO.
    disagreements:
    - 'Conditioning and supervision differ: explicit trajectory or action controls
      for driving simulators, context observables for model-based reinforcement learning,
      and universal latent actions for cross-embodiment robots.'
    - 'Evaluation target differs: spatial consistency, action fidelity, physical plausibility,
      or closed-loop latency and policy success are treated as the primary success
      signal.'
    - 'Deployment setting differs: offline dataset benchmarks versus closed-loop autoregressive
      simulation versus real-robot adaptation and policy training.'
    open_questions:
    - What evidence would show that current simulated world models transfer reliably
      to unseen driving environments, sensor layouts, or robot embodiments?
    - Which action or context representation best supports long-horizon consistency
      and zero-shot generalization without assuming full context observability?
    - How do benchmark metrics for spatial or action fidelity connect to closed-loop
      downstream success and safety?
    - What independent reproduction across teams and infrastructure is available for
      the open artifacts, and which missing code or dataset details limit verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 闭环生成式驾驶模拟器
      解决的问题: 在动作或轨迹控制下生成未来多相机驾驶视频，用于仿真和策略评估；部分系统以单GPU亚秒级延迟为目标。
      尚未覆盖: 超出 nuScenes 类场景的泛化、长时域跨视角一致性、多 GPU 或复杂场景部署可扩展性。
    - 路线: 上下文与跨具身世界模型自适应
      解决的问题: 通过对可观测上下文或通用潜在动作进行条件化，实现零样本或跨具身迁移，并利用多数据集与大规模帧预训练。
      尚未覆盖: 假设上下文可观测或共享潜在动作接口；更广泛的零样本泛化与真实机器人有效性仅部分验证。
    - 路线: 物理信息与可控视频世界模型
      解决的问题: 通过深度预测、关键点动力学、结构化损失或显式控制提升视觉保真度、运动和物理合理性。
      尚未覆盖: 评估限于所选机器人或驾驶场景；物理合理性指标和下游部署影响缺乏标准化。
    - 路线: 世界模型系统的基准与可复现评测工件
      解决的问题: 为空间一致性、动作忠实度等性质提供数据集、指标和开放评测框架。
      尚未覆盖: 部分基准论文侧重构建而缺乏充分实验结果；跨团队独立复现与环境覆盖仍开放。
    - 路线: 实时交互式服务系统
      解决的问题: 将生成式世界模型转化为低延迟闭环组件，用于驾驶或机器人训练和评估流水线。
      尚未覆盖: 延迟在有限硬件和数据集上验证；长会话与分布外条件下的交互鲁棒性尚未建立。
    共识:
    - 论文共同将世界模型视为动作或上下文条件下的视频生成系统，并以仿真或下游策略应用为核心动机。
    - 普遍同时评估生成保真度、控制遵循或一致性、物理合理性和下游任务效用。
    - 强调开放代码、数据集或基准，但评估仍集中在 Minecraft、CARL、nuScenes、LIBERO 等典型环境中。
    分歧:
    - 条件化与监督信号不同：驾驶模拟器使用显式轨迹或动作控制，基于模型的强化学习使用上下文可观测值，跨具身机器人使用通用潜在动作。
    - 评测目标不同：空间一致性、动作忠实度、物理合理性或闭环延迟与策略成功率被视为主要成功信号。
    - 部署设置不同：离线数据集基准、闭环自回归仿真、真实机器人适配与策略训练。
    开放问题:
    - 当前模拟世界模型在未见驾驶环境、传感器布局或机器人形态下可靠迁移需要什么证据？
    - 哪种动作或上下文表示能在不假设完整上下文可观测的情况下，同时支持长时域一致性和零样本泛化？
    - 空间或动作忠实度指标如何与闭环下游成功和安全性相关联？
    - 开放工件有哪些跨团队和跨基础设施独立复现证据，缺少的代码或数据集细节如何限制验证？
