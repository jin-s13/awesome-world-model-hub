    - 世界模型如何在不依赖强可观测性或已见原语假设下，泛化到完全未见的动力学、原语组合、本体或评测动作空间？
    - 哪些一致性或控制基准分数能预测下游策略质量和现实有用性？
    - 深度和关键点等物理信息线索能否被更大视频模型隐式学习，还是显式信号对合理的具身仿真仍然必要？
