  related_work_outline:
  - 'Mainstream direction: Building world models as controllable video simulators
    for autonomous driving, robotics, and game-like environments, with a sharp focus
    on action-conditioned generation and closed-loop evaluation.'
  - 'Shared research pattern: Adapting video generation backbones (diffusion or autoregressive
    transformers) through action-conditioning modules, training on domain-specific
    datasets, and measuring visual fidelity plus task-specific controllability.'
  - 'Key differences: Works diverge on the underlying world representation (latent
    dynamics models vs. pixel-space video generation), the target property being evaluated
    (spatial consistency, action fidelity, physical plausibility), and the deployment
    setting (offline benchmark vs. real-time closed-loop simulation).'
  - 'Trend evolution: From 2024 to 2026, the topic moves from general world models
    toward specialized driving simulators, with increasing emphasis on frame-level
    autoregressive generation, low-latency inference, and interactive long-horizon
    rollouts.'
  - 'Open questions: How to maintain spatial-temporal consistency over very long rollouts,
    generalize beyond the training dataset (e.g., nuScenes) to new environments and
    sensor setups, and balance visual quality with sub-second latency for real-time
    deployment.'
  related_work_outline_zh:
  - 主流方向：构建面向自动驾驶、机器人和游戏环境的可控视频世界模拟器，重点放在动作条件生成和闭环评估上。
  - 研究共性：以视频生成模型（扩散模型或自回归 Transformer）为骨架，通过动作条件模块适配，在领域特定数据集上训练，并用视觉保真度和任务特定可控性指标度量。
  - 关键差异：工作在世界表示（潜在动力学模型 vs. 像素空间视频生成）、评估目标（空间一致性、动作忠实度、物理合理性）和部署方式（离线基准 vs. 实时闭环仿真）上存在分歧。
  - 趋势演进：从 2024 年到 2026 年，主题从通用世界模型转向专用驾驶模拟器，越来越强调帧级自回归生成、低延迟推理和长时程交互式推演。
  - 开放问题：如何在极长rollout中保持时空一致性，如何从 nuScenes 等训练集泛化到新环境和传感器配置，以及如何在实时部署中平衡视觉质量与亚秒级延迟。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable world simulators for autonomous driving
      what_it_solves: High-fidelity, action-conditioned video generation for closed-loop
        simulation, enabling policy training and evaluation without real-world data.
      what_remains_open: Generalization beyond nuScenes to diverse driving environments
        and sensor configurations; long-horizon spatial-temporal consistency and real-time
        deployment constraints.
    - line: Physics-informed and embodied world models
      what_it_solves: Adding physical knowledge (depth, keypoint dynamics) to video
        generation for robotic simulation, improving visual plausibility and supporting
        downstream policy training.
      what_remains_open: Handling a wide range of physical interactions and material
        properties; real-world transfer and deployment outside the training scenarios.
    - line: Contextual dynamics learning for model-based RL
      what_it_solves: Zero-shot generalization of world models in reinforcement learning
        by conditioning latent dynamics on observable context variables, enabling
        policies to adapt to unseen dynamics.
      what_remains_open: Assumption of observable context, which may not hold in all
        settings; evaluation limited to a small set of benchmark tasks.
    - line: Benchmarks and evaluation frameworks for world model consistency
      what_it_solves: Standardized assessment of spatial consistency and action fidelity
        in world models, providing datasets and metrics to compare simulators.
      what_remains_open: Coverage of a broader range of domains and real-world sensor
        data; independent reproduction across teams and infrastructure environments.
    consensus:
    - World models must support action-conditioned generation to serve as controllable
      simulators.
    - Video generation is the primary capability, with visual fidelity metrics (FID,
      FVD) universally adopted as quality indicators.
    - Long-horizon consistency is a shared challenge, and all works attempt to mitigate
      degradation through training strategies or architectural designs.
    - Downstream utility is validated through policy training or evaluation in simulated
      environments.
    disagreements:
    - 'Underlying world representation: latent dynamics models (Dreamer-based) vs.
      pixel-space video generation (diffusion/autoregressive).'
    - 'Evaluation focus: spatial consistency (LoopNav) vs. action fidelity (Terra
      ACT-Bench, Vista) vs. physical plausibility (RoboScape).'
    - 'Deployment setting: offline benchmark evaluation vs. real-time closed-loop
      simulation with low-latency requirements (FAR-Drive).'
    - 'Method of conditioning: structured control signals, universal action-conditioned
      modules, or context-conditioned latent dynamics.'
    open_questions:
    - How can world models preserve spatial and temporal consistency over thousands
      of autoregressive steps without collapsing?
    - What metrics beyond FID/FVD can reliably capture action fidelity and physical
      plausibility for safety-critical applications?
    - Can world models trained on a single dataset (e.g., nuScenes) generalize to
      unseen driving environments, sensor layouts, and weather conditions?
    - What is the minimum latency and compute budget needed for a world model to be
      usable in a real-time control loop, and how does that constrain model design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向自动驾驶的动作可控世界模拟器
      解决的问题: 高保真、动作条件的视频生成，用于闭环仿真，支撑策略训练和评估，无需真实世界数据。
      尚未覆盖: 从 nuScenes 泛化到多样驾驶环境和传感器配置；长时域时空一致性以及实时部署约束。
    - 路线: 物理信息驱动的具身世界模型
      解决的问题: 在机器人仿真视频生成中加入物理知识（深度、关键点动力学），提升视觉合理性并支持下游策略训练。
      尚未覆盖: 处理广泛的物理交互和材料特性；训练场景之外的真实世界迁移和部署。
    - 路线: 基于上下文的模型驱动强化学习动力学学习
      解决的问题: 通过将潜在动力学条件化于可观测上下文变量，实现世界模型在强化学习中的零样本泛化，使策略适应未见动力学。
      尚未覆盖: 上下文可观测的假设在部分场景不成立；评估仅限于少量基准任务。
    - 路线: 世界模型一致性的基准与评估框架
      解决的问题: 标准化评估世界模型的空间一致性和动作忠实度，提供数据集和度量指标以比较不同模拟器。
      尚未覆盖: 覆盖更广泛的领域和真实传感器数据；跨团队和基础设施环境的独立复现。
    共识:
    - 世界模型必须支持动作条件生成，才能作为可控模拟器使用。
    - 视频生成是核心能力，FID、FVD 等视觉保真度指标被普遍用作质量指标。
    - 长时域一致性是共同挑战，所有工作均通过训练策略或架构设计试图缓解退化。
    - 通过模拟环境中的策略训练或评估来验证下游实用性。
    分歧:
    - 底层世界表示：潜在动力学模型（基于 Dreamer） vs. 像素空间视频生成（扩散/自回归）。
    - 评估重点：空间一致性（LoopNav） vs. 动作忠实度（Terra ACT-Bench、Vista） vs. 物理合理性（RoboScape）。
    - 部署方式：离线基准评估 vs. 具有低延迟要求的实时闭环仿真（FAR-Drive）。
    - 条件化方法：结构化控制信号、通用动作条件模块或上下文条件的潜在动力学。
    开放问题:
    - 世界模型如何在数千步自回归生成中保持时空一致性而不崩溃？
    - 除 FID/FVD 外，哪些指标能可靠捕捉动作忠实度和物理合理性，以满足安全关键应用？
    - 仅在单一数据集（如 nuScenes）上训练的世界模型能否泛化到未见过的驾驶环境、传感器布局和天气条件？
    - 世界模型在实时控制回路中可用的最低延迟和算力预算是多少，这对模型设计有何约束？
