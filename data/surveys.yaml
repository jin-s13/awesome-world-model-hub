  related_work_outline:
  - 'Mainstream direction: World-model evaluation now centers on video/action generation
    benchmarks, with recent work moving from Atari sample-efficiency scores toward
    driving, robotic, and open-domain consistency or action-control probes.'
  - 'Shared research pattern: Generative sequence models, especially diffusion and
    transformer variants, are trained on visual or video-action data and assessed
    by downstream policy quality, visual fidelity, physical plausibility, or consistency
    metrics.'
  - 'Key differences: Works split between constructing new datasets/benchmarks and
    proposing model architectures; they also differ in supervision signals, representation
    choices, evaluation targets, and closed-loop interaction assumptions.'
  - 'Trend evolution: The available 2023-2026 frontier shifts from compact latent
    Atari world models to large video diffusion and embodied/driving world models,
    with 2025-2026 benchmarks adding spatial consistency, memory consistency, and
    action-control stress tests.'
  - 'Open questions: Alignment between proxy metrics and real downstream decisions,
    coverage of long-horizon and varied action settings, stability across implementations
    and compute budgets, and mechanisms for long-term memory consistency remain underevidenced.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正围绕视频/动作生成基准展开，近年从Atari样本效率分数转向驾驶、机器人和开放域一致性或动作控制探测。
  - 研究共性：以扩散或Transformer为主的生成式序列模型在视觉或视频-动作数据上训练，并通过下游策略质量、视觉保真度、物理合理性或一致性指标评估。
  - 关键差异：工作分为构建新数据集/基准与提出模型架构两类，并在监督信号、表示方式、评测目标和闭环交互假设上存在差异。
  - 趋势演进：现有2023-2026前沿从紧凑潜变量Atari世界模型转向大规模视频扩散与具身/驾驶世界模型，2025-2026基准加入空间一致性、记忆一致性和动作控制压力测试。
  - 开放问题：代理指标与真实下游决策的一致性、长时域和多样动作设置的覆盖、跨实现与算力预算的稳定性，以及长期记忆一致性机制仍未充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design (e.g., LoopNav, MIND)
      what_it_solves: Creates shared video/action tasks and datasets to make world-model
        claims comparable across driving, robotic, game, and open-domain navigation
        settings.
      what_remains_open: Whether the task distribution covers long-horizon, multi-view,
        and varied action-space settings where world models are expected to help;
        some datasets are introduced with construction evidence but without full reported
        experimental validation.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual fidelity, physical plausibility, and zero-shot generalization beyond
        aggregate scores, using scores such as SGCS or MIND's dual-ability measures.
      what_remains_open: Alignment between these proxy metrics and downstream decisions,
        such as policy training or deployment utility, remains thin; improvements
        in visual quality do not yet guarantee long-term consistency or controllability.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through shared baselines and benchmark
        protocols, such as Dreamer v3 comparisons for contextual RL, Atari 100k for
        sample-efficient RL, and driving or robotic suites for video world models.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets is not fully evidenced; several top entries have missing
        limitation or artifact details, so reproducibility is a verification gap rather
        than a confirmed absence.
    consensus:
    - World-model evaluation is increasingly tied to generative video or video-action
      prediction rather than static task metrics.
    - Shared benchmarks and protocols supply common comparison points, spanning sample-efficient
      game RL, driving/robotic video generation, and open-domain navigation consistency.
    - Recent methods converge on diffusion-based or transformer-based dynamics models
      trained on high-dimensional visual or video-action data.
    - Downstream policy quality, visual fidelity, physical plausibility, and consistency
      probes are all treated as relevant evaluation evidence.
    disagreements:
    - Some contributions construct datasets and stress tests for consistency or action
      control, while others propose model architectures evaluated on existing benchmarks.
    - 'Representation choices differ: discrete or continuous latent world models,
      diffusion video models, unified video-action diffusion, and context-conditioned
      recurrent state-space models.'
    - 'Supervision and auxiliary signals differ: mask reconstruction, physics-informed
      depth/keypoint tasks, context conditioning, action diffusion, and action-free
      video pretraining.'
    - 'Evaluation targets differ: sample efficiency on Atari-style benchmarks, driving
      long-horizon and multi-view generation, embodied visual/physical plausibility,
      and open-domain memory/action-control consistency.'
    - 'Deployment assumptions differ: closed-loop policy learning from world-model
      rollouts versus open-loop visual realism and benchmarked interaction from video
      data.'
    open_questions:
    - How well do proxy consistency and visual-quality metrics align with downstream
      policy decision quality in real deployments?
    - Does the current task coverage include long-horizon, multi-view, varied action-space,
      and open-domain settings that world models must handle?
    - Can benchmark conclusions remain stable across different implementations, compute
      budgets, and missing artifact/reporting details?
    - What mechanisms can support long-term memory consistency and cross-action-space
      generalization, which current benchmarks identify as key challenge areas?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计（如 LoopNav、MIND）
      解决的问题: 构建共享视频/动作任务和数据集，使世界模型主张在驾驶、机器人、游戏和开放域导航等设置中可比。
      尚未覆盖: 任务分布是否覆盖长时域、多视角和多样动作空间等世界模型预期发挥作用的设置；部分数据集给出了构建证据，但未完整报告实验验证。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、视觉保真度、物理合理性和零样本泛化，例如使用 SGCS 或 MIND 的双能力度量。
      尚未覆盖: 这些代理指标与下游决策（如策略训练或部署效用）的一致性仍然较弱；视觉质量提升尚不能保证长期一致性或可控性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线和基准协议使结果可审计，例如上下文强化学习中的 Dreamer v3 对比、Atari 100k 样本效率评估，以及驾驶或机器人套件中的视频世界模型评估。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定尚未充分验证；若干高排名条目缺少局限性或工件细节，因此可复现性属于验证缺口而非确认缺失。
    共识:
    - 世界模型评测越来越多地与生成式视频或视频-动作预测绑定，而不是仅看静态任务指标。
    - 共享基准和协议提供了共同比较点，涵盖样本高效游戏强化学习、驾驶/机器人视频生成和开放域导航一致性。
    - 近年方法在扩散或Transformer动力学模型上趋于一致，并在高维视觉或视频-动作数据上训练。
    - 下游策略质量、视觉保真度、物理合理性和一致性探测都被视为相关评测证据。
    分歧:
    - 部分工作构建一致性或动作控制的数据集与压力测试，另一些工作提出模型架构并在既有基准上评测。
