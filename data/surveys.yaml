  related_work_outline:
  - 'Mainstream direction: Building specialized benchmarks and metrics that stress-test
    world models on spatial consistency, memory, action control, and zero-shot generalization,
    moving beyond raw video prediction quality.'
  - 'Shared research pattern: All works evaluate world models via held-out video generation
    or downstream task scores, but the newer benchmarks add closed-loop, action-conditioned,
    and long-horizon consistency checks.'
  - 'Key differences: Evaluation targets range from visual fidelity (e.g., DIAMOND)
    to physical plausibility and policy utility; settings span Atari, driving, Minecraft,
    and robotic manipulation, with no single metric dominating.'
  - 'Trend evolution: Within the 2023–2026 frontier, benchmarks have shifted from
    generic Atari 100k to specialized suites (LoopNav, MIND) that probe spatial memory
    and action control, and toward physics-informed and multimodal diffusion models.'
  - 'Open questions: Whether proxy metrics (SGCS, memory scores) align with real downstream
    decisions; how to unify evaluation across driving, gaming, and robotics without
    overfitting to a single environment; and the stability of rankings under different
    compute budgets and implementations.'
  related_work_outline_zh:
  - 主流方向：构建专门针对空间一致性、记忆、动作控制和零样本泛化能力的基准与指标，超越原始视频预测质量。
  - 研究共性：所有工作都通过留出视频生成或下游任务得分评估世界模型，但新基准增加了闭环、动作条件和长时域一致性检查。
  - 关键差异：评估目标从视觉保真度（如DIAMOND）到物理合理性和策略效用不等；场景涵盖Atari、驾驶、Minecraft和机器人操作，尚无统一指标。
  - 趋势演进：在2023–2026年前沿中，基准已从通用Atari 100k转向探测空间记忆和动作控制的专用套件（LoopNav、MIND），并趋向物理信息和多模态扩散模型。
  - 开放问题：代理指标（SGCS、记忆得分）与真实下游决策是否对齐；如何统一驾驶、游戏和机器人评估而不对单一环境过拟合；不同算力和实现下排名稳定性如何。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared environments and data (e.g., Minecraft loop
        navigation, multi-scene video with action) that test world models on spatial
        consistency, memory, and action control, making claims comparable across methods.
      what_remains_open: Whether the task distribution (e.g., Minecraft, third-person
        video) covers the full range of real-world settings like autonomous driving
        and robotic manipulation where world models are expected to assist, and whether
        closed-loop benchmarks can scale to diverse action spaces.
    - line: Metric and stress-test design
      what_it_solves: Defines metrics beyond per-frame reconstruction (e.g., Scene
        Graph Consistency Score, memory consistency, action control) to probe long-horizon
        stability, 3D coherence, and sensitivity to actions, capturing weaknesses
        that aggregate video quality scores miss.
      what_remains_open: Alignment between these diagnostic metrics and the downstream
        decision quality (e.g., reinforcement learning policy returns) is not yet
        established; metrics may reward models that fail on task-critical physical
        interactions.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditing by standardizing training protocols, datasets
        (NuScenes, Atari 100k, CARL), and evaluation splits; some works provide code
        and artifacts to reduce reproducibility barriers.
      what_remains_open: Conclusions may not be stable across different compute budgets,
        training seeds, and implementation details; no standard protocol for reporting
        hyperparameters and failure modes has been adopted across the community.
    consensus:
    - World model evaluation must go beyond pixel-level reconstruction or FVD and
      include tests of long-term consistency, memory, and action-conditioned control.
    - Specialized benchmarks (e.g., loop navigation, memory consistency suites) expose
      failure modes that generic video prediction benchmarks hide.
    - Diffusion-based world models show promise in capturing visual details, but their
      evaluation requires both visual quality and physical plausibility metrics.
    - Open-sourcing code and datasets is widely recognized as critical for reproducibility,
      though not all works fully comply.
    disagreements:
    - 'Representation: discrete latent variable world models (STORM) versus diffusion-based
      models (DIAMOND, MaskGWM, UWM) lead to different trade-offs between sample quality
      and planning efficiency.'
    - 'Supervision signal: some works inject explicit physics knowledge (RoboScape)
      while others rely purely on video and action data (MIND, LoopNav), resulting
      in different evaluation strengths.'
    - 'Evaluation target: loop-based spatial consistency (LoopNav) vs. memory and
      action control (MIND) vs. zero-shot policy generalization (cRSSM) vs. visual
      fidelity and game score (DIAMOND, STORM), reflecting no agreement on the most
      important capability.'
    - 'Interaction mode: closed-loop revisited benchmarks (MIND) versus open-loop
      video prediction (LoopNav, MaskGWM) and imagination-based policy training (cRSSM,
      STORM, DIAMOND), each placing different demands on the world model.'
    - 'Deployment setting: Atari games (STORM, DIAMOND) vs. driving (MaskGWM) vs.
      robotic manipulation (RoboScape, UWM) vs. open-world Minecraft (LoopNav), making
      it unclear if a single benchmark can rank models across all domains.'
    open_questions:
    - Do the proposed diagnostic metrics (e.g., SGCS, memory consistency scores) correlate
      with downstream task performance such as policy returns in reinforcement learning?
    - Can a single evaluation protocol cover the diverse action spaces and visual
      modalities of driving, robotics, and gaming without diluting specific failure
      modes?
    - How do findings from current benchmarks transfer when the world model is deployed
      in a closed-loop setting with unseen dynamics and no ground-truth state?
    - What is the minimal set of stress tests that guarantees generalization across
      compute budgets, architectures, and domain shifts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享环境和数据（如Minecraft循环导航、带动作的多场景视频），测试世界模型的空间一致性、记忆和动作控制，使不同方法的结果可比。
      尚未覆盖: 任务分布（如Minecraft、第三人称视频）是否覆盖自动驾驶、机器人操作等真实设置的全貌，以及闭环基准能否扩展到多样动作空间。
    - 路线: 指标与压力测试设计
      解决的问题: 定义超越逐帧重建的指标（如场景图一致性分数、记忆一致性、动作控制），探测长时域稳定性、三维一致性和对动作的敏感性，揭示总分掩盖的弱点。
      尚未覆盖: 这些诊断指标与下游决策质量（如强化学习策略回报）之间的对齐关系尚未建立；指标可能奖励那些在任务关键物理交互上失败的模型。
    - 路线: 可比基线与报告规范
      解决的问题: 通过标准化训练协议、数据集（NuScenes、Atari 100k、CARL）和评估分割，使结果可审计；部分工作提供代码和工件以降低复现障碍。
      尚未覆盖: 结论可能在不同算力预算、训练种子和实现细节下不稳定；社区尚未采用标准化的超参数和失败模式报告协议。
    共识:
    - 世界模型评估必须超越像素级重建或FVD，加入长期一致性、记忆和动作条件控制的测试。
    - 专用基准（如循环导航、记忆一致性套件）能暴露通用视频预测基准忽略的失败模式。
    - 基于扩散的世界模型在捕捉视觉细节方面展现潜力，但其评估需同时考虑视觉质量和物理合理性指标。
    - 开源代码和数据集被广泛认可为可复现性的关键，但并非所有工作都完全遵循。
    分歧:
    - 表示方式：离散潜变量世界模型（STORM）与基于扩散的模型（DIAMOND、MaskGWM、UWM）在样本质量和规划效率之间各有取舍。
    - 监督信号：部分工作注入显式物理知识（RoboScape），而其他工作仅依赖视频和动作数据（MIND、LoopNav），导致评估优势不同。
    - 评测目标：基于循环的空间一致性（LoopNav）对比记忆与动作控制（MIND）对比零样本策略泛化（cRSSM）对比视觉保真度与游戏得分（DIAMOND、STORM），反映对最重要的能力缺乏共识。
    - 交互模式：闭环可复现基准（MIND）对比开环视频预测（LoopNav、MaskGWM）以及基于想象的策略训练（cRSSM、STORM、DIAMOND），对世界模型提出不同要求。
    - 部署场景：Atari游戏（STORM、DIAMOND）对比驾驶（MaskGWM）对比机器人操作（RoboScape、UWM）对比开放世界Minecraft（LoopNav），单一基准能否跨领域排名尚不明确。
    开放问题:
    - 所提出的诊断指标（如SGCS、记忆一致性得分）是否与强化学习中策略回报等下游任务表现相关？
    - 单一评估协议能否覆盖驾驶、机器人和游戏的不同动作空间与视觉模态，而不稀释特定失败模式？
    - 当世界模型部署在未见动态且无真实状态的闭环环境中时，当前基准的发现如何迁移？
    - 能够保证跨算力预算、架构和领域迁移泛化的最小压力测试集是什么？
