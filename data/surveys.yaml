  related_work_outline:
  - 'Mainstream direction: The top-ranked evidence clusters around world-model benchmarking
    and model evaluation, especially action-conditioned visual prediction in driving,
    robotics, Atari, and Minecraft.'
  - 'Shared research pattern: Papers combine generative architectures such as diffusion,
    transformer, VAE/SSM, or physics-informed models with tasks that stress visual
    fidelity, temporal/spatial consistency, action controllability, or zero-shot generalization.'
  - 'Key differences: Some works focus on dataset and metric design, while others
    focus on model-centric improvements; supervision ranges from RGB video and depth/keypoints
    to scene-graph consistency and context-conditioned dynamics.'
  - 'Trend evolution: Within the available top-paper years, work appears to move from
    Atari-style sample-efficiency benchmarks toward open-domain embodied and driving
    benchmarks, with growing emphasis on long-horizon memory, spatial consistency,
    and cross-action-space generalization.'
  - 'Open questions: Current proxy metrics may not match downstream decision utility,
    curated tasks may not cover real-world settings, and many papers lack detailed
    limitation or failure-mode evidence.'
  related_work_outline_zh:
  - 主流方向：排名靠前的证据集中在世界模型基准与模型评测，尤其是驾驶、机器人、Atari 和 Minecraft 中的动作条件视觉预测。
  - 研究共性：论文普遍将扩散、Transformer、VAE/SSM 或物理信息生成式架构，与强调视觉保真、时序/空间一致性、动作可控性或零样本泛化的任务结合。
  - 关键差异：部分工作侧重数据集与指标设计，部分侧重模型改进；监督信号包括 RGB 视频、深度/关键点、场景图一致性、上下文条件动力学等，领域和评测差异明显。
  - 趋势演进：在已有高排名论文年份内，工作从 Atari 式样本效率基准，转向开放域具身和驾驶基准，并更关注长时域记忆、空间一致性和跨动作空间泛化。
  - 开放问题：当前代理指标是否与下游决策效用一致；精选任务是否覆盖真实场景；多数论文缺少详细局限性与失败模式证据。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared action-conditioned visual tasks and datasets
        for comparing world-model abilities; examples include LoopNav for spatial
        consistency and MIND for memory and action control.
      what_remains_open: Whether curated simulated or video-based settings cover the
        real-world distribution where world models are expected to help, and whether
        scene/action diversity is sufficient.
    - line: Metric and stress-test design
      what_it_solves: Adds targeted probes beyond aggregate visual quality, such as
        scene-graph consistency scoring and memory-consistency or action-control evaluation.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        is not established, and stability across implementations or compute budgets
        remains unmeasured.
    - line: Generative model-centric world-model evaluation
      what_it_solves: Develops diffusion, transformer, VAE/SSM, or physics-informed
        models that learn visual dynamics and can act as environments for policy learning
        or video prediction.
      what_remains_open: Many papers report state-of-the-art benchmark scores but
        omit limitations or broader failure modes; evaluations often rely on a small
        number of datasets and tasks.
    - line: Comparable baselines and reporting artifacts
      what_it_solves: Introduces open datasets, code, and baselines, or compares against
        state-of-the-art baselines, making results auditable and reproducible.
      what_remains_open: Missing citation metadata and uneven limitation reporting
        make it hard to verify score robustness, compute stability, and broader benchmark
        coverage.
    consensus:
    - Action-conditioned visual prediction and rollout are a shared testbed for world-model
      capability.
    - Generative architectures such as diffusion, transformer, VAE/SSM, and physics-informed
      components are widely used to capture visual dynamics and stochasticity.
    - Results are reported on standardized tasks or against baselines, but the meaning
      of improvement depends on domain-specific evaluation protocols.
    - Open dataset/code artifacts improve reproducibility, yet detailed limitation
      reporting is frequently absent.
    disagreements:
    - 'Evaluation target: spatial consistency and loop navigation versus memory/action
      control versus zero-shot context generalization versus visual fidelity and policy
      utility.'
    - 'Supervision signal: raw RGB video generation, depth/keypoint physics, scene-graph
      consistency, context-conditioned latent dynamics, or coupled video-action diffusion.'
    - 'Benchmark domain: Atari, driving video, robotics, and Minecraft stress different
      generalization boundaries and interaction modes.'
    - 'Measurement type: aggregate benchmark scores versus targeted stress metrics
      versus downstream policy training and evaluation.'
    - 'Assumptions: whether context or action labels are observed, whether evaluation
      is closed-loop, and how many action spaces are covered.'
    open_questions:
    - Do current spatial, memory, and visual-quality metrics align with the downstream
      robotic or driving decisions that motivate world models?
    - How well do curated benchmarks cover real-world task distributions, action spaces,
      and long-horizon settings?
    - Are reported conclusions stable across reimplementations, compute budgets, and
      missing baseline/dataset details?
    - What failure modes, dataset biases, or out-of-distribution boundaries remain
      hidden by the frequent absence of limitation reporting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的动作条件视觉任务和数据集，用于比较世界模型能力；例如 LoopNav 关注空间一致性，MIND 关注记忆与动作控制。
      尚未覆盖: 精选模拟或视频环境是否覆盖真实应用中世界模型需要发挥作用的场景，以及场景和动作多样性是否足够。
    - 路线: 指标与压力测试设计
      解决的问题: 在视觉质量之外添加针对性探测，例如场景图一致性评分，以及记忆一致性和动作控制评测。
      尚未覆盖: 这些代理指标与下游决策之间的一致性尚未建立，其在不同实现或算力预算下的稳定性也未被测量。
    - 路线: 生成式模型中心的世界模型评测
      解决的问题: 发展扩散、Transformer、VAE/SSM 或物理信息模型，学习视觉动力学并可用作策略训练或视频预测环境。
      尚未覆盖: 许多论文报告最优基准分数，但缺少局限性和更广泛失败模式；评估常依赖少量数据集和任务。
    - 路线: 可比基线与报告工件
      解决的问题: 引入开放数据集、代码和基线，或与最先进基线比较，使结果可审计和可复现。
      尚未覆盖: 引用元数据缺失和局限性报告不均，使得分数稳健性、算力稳定性和更广泛基准覆盖难以验证。
    共识:
    - 动作条件视觉预测与推演是检验世界模型能力的共同实验场。
    - 扩散、Transformer、VAE/SSM 和物理信息组件等生成式架构被广泛用于捕捉视觉动态和随机性。
    - 结果通常在标准化任务或基线上报告，但改进意义依赖领域特定的评测协议。
    - 开放数据集或代码有利于复现，但详细的局限性报告经常缺失。
    分歧:
    - 评测目标不同：空间一致性与环状导航、记忆/动作控制、零样本上下文泛化、视觉保真与策略效用各有侧重。
    - 监督信号不同：包括原始 RGB 视频生成、深度/关键点物理信息、场景图一致性、上下文条件潜在动态、视频-动作耦合扩散。
    - 基准领域不同：Atari、驾驶视频、机器人和 Minecraft 强调不同的泛化边界与交互模式。
    - 测量类型不同：聚合基准分数、针对性压力指标、下游策略训练与评估。
    - 假设不同：上下文或动作标签是否可观测、是否闭环评估、覆盖多少动作空间。
    开放问题:
    - 当前空间、记忆和视觉质量指标是否与驱动世界模型研究的下游机器人或驾驶决策一致？
    - 精选基准在多大程度上覆盖真实世界任务分布、动作空间和长时域设置？
    - 在重实现、不同算力预算以及基线或数据集细节缺失的情况下，已有结论是否稳定？
    - 大量工作缺少局限性报告，哪些失败模式、数据偏差或分布外边界尚未被测量？
