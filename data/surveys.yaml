  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from aggregate RL scores
    toward targeted benchmarks for visual fidelity, spatial and memory consistency,
    action control, and long-horizon generalization across driving, robotics, and
    open-domain scenes.'
  - 'Shared research pattern: Work couples video prediction with auxiliary tasks or
    scoring signals such as masks, depth, keypoints, actions, scene graphs, and closed-loop
    rollouts to stress-test model capabilities beyond average accuracy.'
  - 'Key differences: Evaluation targets diverge among human-normalized Atari scores,
    zero-shot context generalization, pixel-invariant scene-graph consistency, memory/action
    consistency, and multi-view driving rollouts; model representations also split
    across diffusion, stochastic VAE/transformer, recurrent state-space, and unified
    video-action diffusion.'
  - 'Trend evolution: In the visible 2023-2026 frontier, benchmarks move from agent
    performance suites toward open-domain closed-loop diagnostics, physics-informed
    generation, and memory-aided evaluation; earlier years appear in the span but
    no top-paper evidence is provided here.'
  - 'Open questions: Whether proxy metrics align with downstream decision utility,
    whether benchmark conclusions remain stable across implementations and compute
    budgets, and whether existing task distributions cover realistic deployment conditions.'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从聚合强化学习分数转向针对视觉保真度、空间一致性、记忆一致性、动作控制和长时域泛化的定向基准，覆盖驾驶、机器人和开放域场景。
  - 研究共性：工作将视频预测与掩码、深度、关键点、动作、场景图和闭环展开等辅助任务或评分信号结合，以在平均精度之外对模型能力进行压力测试。
  - 关键差异：评测目标在人类归一化Atari分数、零样本上下文泛化、像素不变的场景图一致性、记忆/动作一致性和多视角驾驶展开之间分化；表示方式也在扩散、随机VAE/Transformer、循环状态空间和统一视频-动作扩散之间分歧。
  - 趋势演进：在可见的2023-2026前沿中，基准从智能体性能套件转向开放域闭环诊断、物理信息生成和记忆辅助评估；更早年份虽然存在，但证据包未提供头部论文细节。
  - 开放问题：代理指标是否与下游决策效用一致，基准结论在不同实现和算力预算下是否稳定，现有任务分布是否覆盖真实部署条件。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared navigation, video, and control datasets so spatial
        consistency, memory consistency, and long-horizon prediction can be measured
        across models.
      what_remains_open: Coverage is skewed to Minecraft, Atari, driving, and robotic
        scenes; it is not shown that these distributions cover all real-world conditions
        where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Moves evaluation beyond aggregate scores by probing visual detail,
        physical plausibility, scene-graph consistency, memory, and action control
        under distribution shifts.
      what_remains_open: Alignment between these proxy metrics and downstream policy
        or deployment decisions is not demonstrated; trade-offs among fidelity, controllability,
        and zero-shot stability remain unresolved.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common suites such as Atari 100k, CARL, Nuscenes/OpenDV-2K/Waymo,
        and open-source datasets or artifacts for reproducible comparison.
      what_remains_open: Benchmark conclusions may not be stable across implementations
        or compute budgets; several top papers lack explicit limitation fields or
        controlled robustness checks, leaving verification gaps.
    consensus:
    - World-model evaluation requires more than aggregate scores; current work stresses
      targeted capabilities such as long-horizon prediction, spatial consistency,
      memory consistency, and action controllability.
    - Shared datasets and benchmark protocols are necessary to compare increasingly
      different world-model architectures and training schemes.
    - Video prediction quality, physical plausibility, and downstream policy utility
      are treated as connected but separately measurable evidence.
    disagreements:
    - 'Evaluation target differs: some work uses human-normalized game scores, others
      use zero-shot control under context shift, scene-graph spatial consistency,
      or closed-loop memory and action consistency.'
    - 'Representation choices differ: diffusion-based generative models, stochastic
      VAE/transformer models, recurrent state-space models, and unified video-action
      diffusion models optimize different inductive biases.'
    - 'Interaction and deployment settings differ: offline Atari/CARL episodes, open-domain
      Minecraft navigation, driving multi-view rollout, and large-scale robotic datasets
      imply distinct generalization assumptions.'
    open_questions:
    - Do consistency and visual fidelity metrics predict actual policy improvement
      or safety outcomes in driving and robotics?
    - Can benchmark tasks cover cross-action-space and cross-embodiment generalization
      without overfitting to specific simulator or dataset priors?
    - Are reported results stable across different code implementations and compute
      budgets given missing limitation evidence in several top papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的导航、视频和控制数据集，使空间一致性、记忆一致性与长时域预测能够在不同模型间比较。
      尚未覆盖: 现有证据覆盖偏向Minecraft、Atari、驾驶和机器人场景，未证明这些分布能代表世界模型预期发挥作用的全部真实条件。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验视觉细节、物理合理性、场景图一致性、记忆和动作控制，并关注分布迁移下的稳定性。
      尚未覆盖: 这些代理指标与下游策略或部署决策之间的对齐尚未证明；保真度、可控性与零样本稳定性之间的取舍仍不明确。
    - 路线: 可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、Nuscenes/OpenDV-2K/Waymo等共享套件和开源工件，让不同工作可复现地比较。
      尚未覆盖: 基准结论是否在不同实现和算力预算下稳定仍未知；若干头部论文缺失局限性说明或受控鲁棒性检查，构成验证缺口。
    共识:
    - 世界模型评估不能只依赖总分，需要定向检验长时域预测、空间一致性、记忆一致性和动作可控性。
    - 共享数据集与评估协议被视为比较不同生成、循环和扩散假设的必要条件。
    - 视频保真度、物理合理性和下游策略效用被当作相关但需分别测量的证据。
    分歧:
    - 评测目标不同：人类归一化游戏分数、上下文迁移下的零样本控制、场景图空间一致性或闭环记忆与动作一致性各有侧重。
    - 表示方式不同：扩散生成、随机VAE/Transformer、循环状态空间和统一视频-动作扩散分别引入不同归纳偏置。
    - 交互与部署设置不同：离线游戏/控制片段、开放域Minecraft导航、驾驶多视角展开和大规模机器人数据集隐含不同泛化假设。
    开放问题:
    - 一致性和视觉保真度指标能否预测驾驶与机器人任务中的策略改进或安全结果？
    - 基准套件能否覆盖跨动作空间和跨具身泛化，而不过拟合到特定模拟器或数据集先验？
    - 在若干头部论文缺失局限性证据的情况下，现有结果在不同实现和算力预算下是否稳定？
