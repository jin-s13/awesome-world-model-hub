  related_work_outline:
  - 'Mainstream direction: Generative world models are converging on diffusion transformers,
    masked/video reconstruction, physics-informed auxiliary tasks, and unified video-action
    pretraining for driving, robotics, and RL; evaluation is shifting from pixel fidelity
    toward long-horizon, zero-shot, memory, and action-consistency signals.'
  - 'Shared research pattern: Most works couple a learned dynamics or generation objective
    with an action or context interface, train via self-supervised or generative losses,
    and probe generalization through rollout, simulation, or controlled video prediction.'
  - 'Key differences: Representation, conditioning, and evaluation targets differ:
    explicit context state-space models, language-composed primitives, physics-informed
    video generation, and unified video-action diffusion are evaluated on Atari/CARL
    control, driving prediction, robot simulation, or open-domain consistency.'
  - 'Trend evolution: Available evidence is concentrated in 2023-2026; the frontier
    moves from efficient stochastic Transformer world models toward embodied and driving
    generative world models, then toward formal memory-consistency and action-control
    evaluation.'
  - 'Open questions: Whether gains come from the learned world model rather than planner/task
    prior; generalization beyond seen primitives or observable context; long-term
    memory and cross-action-space control; and whether consistency metrics predict
    downstream policy performance.'
  related_work_outline_zh:
  - 主流方向：生成式世界模型正围绕扩散Transformer、掩码/视频重建、物理约束辅助任务和统一视频-动作预训练收敛，用于驾驶、机器人和强化学习，评测从像素保真转向长时域、零样本、记忆与动作一致性。
  - 研究共性：多数工作把生成或动力学目标与动作/上下文接口耦合，采用自监督或生成损失，并通过rollout、仿真或可控视频预测检验泛化。
  - 关键差异：表示、条件信号和评测目标不同：显式上下文状态空间、语言组合原语、物理信息生成与统一视频-动作扩散，分别在Atari/CARL控制、驾驶预测、机器人仿真或空间记忆一致性上评测。
  - 趋势演进：证据集中在2023-2026前沿，由高效随机Transformer世界模型转向具身/驾驶生成式世界模型，再转向正式的记忆一致性和动作控制评测。
  - 开放问题：收益是否来自世界模型而非规划器/任务先验；未见原语或上下文泛化；长期记忆与跨动作空间控制；一致性指标是否预测下游策略表现。
  literature_review:
    line_of_work_matrix:
    - line: Generative representation and objective design for world models
      what_it_solves: Turns world-model ideas into concrete video/dynamics objectives
        using diffusion, VAEs, masked reconstruction, depth/keypoint supervision,
        physics constraints, and language-composed generation.
      what_remains_open: Which representation or auxiliary objective transfers beyond
        the reported driving, robot, or Atari task families, and which objective combinations
        are necessary rather than incidental.
    - line: Action-conditioned and decision-time interfaces for learned dynamics
      what_it_solves: Connects learned dynamics to policies, forward/inverse dynamics,
        zero-shot control, and video planning through context conditioning, language
        primitives, or unified video-action diffusion.
      what_remains_open: How much gain comes from the world model versus the planner,
        controller, policy optimizer, or task prior; assumptions such as observable
        context and previously seen primitive combinations limit generalization.
    - line: Evaluation protocols for spatial, memory, and action consistency
      what_it_solves: Operationalizes world-model evaluation beyond pixel-level realism
        using datasets and metrics such as LoopNav and MIND for spatial consistency,
        memory consistency, and action control.
      what_remains_open: Whether these consistency scores correspond to downstream
        control performance, and whether limited scene/action coverage or missing
        limitation details hide important failure modes.
    consensus:
    - Generative video/dynamics objectives have become a central training target,
      often combined with auxiliary reconstruction, physics, context, or action-conditioned
      losses.
    - Evaluation is moving beyond pixel-level realism toward long-horizon rollout,
      zero-shot generalization, spatial consistency, memory consistency, and action
      control.
    - Several methods use transformer or diffusion backbones to produce imagined trajectories
      for policies or planners, linking world-model learning to decision-making.
    disagreements:
    - 'Representation choices differ: stochastic recurrent state-space latents, VAE-Transformer
      latents, diffusion over pixels/latents, compositional language primitives, and
      unified video-action diffusion.'
    - 'Conditioning signals differ: observable context variables, parsed language
      primitives, physics-derived depth/keypoint supervision, and action-free video
      data.'
    - 'Evaluation targets differ: Atari/CARL control scores, driving long-horizon
      and multi-view prediction, robot simulation execution, and open-domain consistency
      metrics.'
    - 'Interaction mode differs: some models support closed-loop action-conditioned
      control, while others emphasize open-loop video generation or benchmarked forward
      consistency.'
    - Deployment assumptions differ across simulation, real driving data, robot datasets,
      and Minecraft-style open-world videos.
    open_questions:
    - How much of reported policy or dynamics improvement is attributable to the world
      model rather than the planner, controller, policy optimizer, or task prior?
    - Can models trained on seen primitives, observable contexts, or restricted action
      spaces generalize to unseen dynamics and action interfaces?
    - What auxiliary objectives and conditioning signals transfer across driving,
      robotics, and open-domain settings without domain-specific redesign?
    - Do spatial/memory consistency and action-control metrics predict downstream
      policy success, or are they only proxy indicators?
    - Several top papers lack complete limitation, baseline, code, or metric details,
      leaving verification gaps around negative results and reproducibility.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式表示与目标设计
      解决的问题: 将世界模型想法落实为具体视频/动力学目标，使用扩散、VAE、掩码重建、深度/关键点监督、物理约束和语言组合生成。
      尚未覆盖: 哪些表示或辅助目标能迁移到驾驶、机器人和Atari之外的任务族；哪些目标组合是必要的，哪些只是附带。
    - 路线: 动作条件与决策时接口
      解决的问题: 通过上下文条件、语言原语或统一视频-动作扩散，把学习到的动力学连接到策略、前向/逆向动力学、零样本控制和视频规划。
      尚未覆盖: 收益有多少来自世界模型本身，而不是规划器、控制器、策略优化器或任务先验；可观测上下文和已见原语组合等假设限制了泛化。
    - 路线: 空间、记忆与动作一致性评测协议
      解决的问题: 用LoopNav和MIND等数据集与指标，超越像素级真实感，衡量空间一致性、记忆一致性和动作控制。
      尚未覆盖: 这些一致性分数是否对应下游控制表现；有限场景/动作覆盖或缺失限制细节可能掩盖关键失败模式。
    共识:
    - 生成式视频/动力学目标已成为世界模型训练的核心，常与辅助重建、物理、上下文或动作条件损失结合。
    - 评测正从像素级真实感转向长时域展开、零样本泛化、空间一致性、记忆一致性和动作控制。
    - 多种方法使用Transformer或扩散骨干生成想象轨迹，用于策略或规划器，把世界模型学习与决策连接起来。
    分歧:
    - 表示选择不同：随机循环状态空间、VAE-Transformer、像素/潜在扩散、组合语言原语以及统一视频-动作扩散。
    - 条件信号不同：可观测上下文变量、解析语言原语、物理派生的深度/关键点监督以及无动作视频数据。
    - 评测目标不同：Atari/CARL控制分数、驾驶长时域/多视角预测、机器人仿真执行和开放域一致性指标。
    - 交互模式不同：部分模型支持闭环动作条件控制，另一些强调开环视频生成或评测前向一致性。
    - 部署假设不同：横跨仿真、真实驾驶数据、机器人数据集和Minecraft式开放世界视频。
    开放问题:
    - 报告的策略或动力学改进有多少来自世界模型本身，而非规划器、控制器、策略优化器或任务先验？
    - 在已见原语、可观测上下文或受限动作空间上训练的模型，能否泛化到未见动力学和动作接口？
    - 哪些辅助目标和条件信号能跨驾驶、机器人和开放域设置迁移，而无需领域特定重构？
    - 空间/记忆一致性和动作控制指标能否预测下游策略成功率，还是只是代理指标？
    - 多篇论文缺少完整限制、基线、代码或指标细节，负面结果与可复现性仍有验证缺口。
