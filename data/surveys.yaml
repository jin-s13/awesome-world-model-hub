      尚未覆盖: 对训练中已见原语组合之外的泛化以及真实机器人执行仍缺乏证据。
    - 路线: 上下文与样本高效的基于模型的强化学习
      解决的问题: 在给定上下文时实现未见动力学的零样本泛化，并通过潜在想象进行样本高效策略学习。
      尚未覆盖: 评测任务较少且依赖上下文可观测等假设，跨任务和跨环境迁移证据有限。
    - 路线: 开放域记忆与空间一致性基准
      解决的问题: 在游戏式交互环境中系统评估世界模型的空间一致性、记忆一致性和动作控制能力。
      尚未覆盖: 部分工作侧重基准构建而非任务结果；长期记忆一致性与跨动作空间控制仍是当前模型暴露的短板。
    共识:
    - 生成式架构，尤其是扩散Transformer或随机序列模型，被广泛复用于驾驶、机器人和游戏式开放世界，作为可学习的视觉动力学仿真器。
    - 多种方法引入掩码重建、上下文变量、物理任务、语言原语或动作扩散等辅助信号，以提升超出直接模仿或独立视频生成的泛化能力。
    - 评测越来越多地针对零样本泛化、策略学习、长时域预测、记忆一致性和动作控制等领域能力，而非只关注单一视觉质量指标。
    分歧:
    - 监督假设不同：部分方法依赖可观测上下文值或预定义语言原语，另一些方法从无动作视频或隐式物理和关键点信号中学习。
    - 评测目标不同：驾驶工作侧重多视角和长时域预测，机器人工作侧重策略与动力学学习，基准工作侧重空间或记忆一致性以及动作控制。
    - 交互模式不同：一些模型是开环预测或想象引擎，另一些则通过动作在闭环或交互式导航环境中被评估。
    - 部署领域不同：证据分散在驾驶、机器人操作、游戏式开放世界和小型上下文控制任务中，跨领域迁移仍不明确。
    开放问题:
