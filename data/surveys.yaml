  related_work_outline:
  - 'Mainstream direction: Designing specialized benchmarks for world models that
    evaluate spatial consistency, memory, action control, and generalization beyond
    raw video prediction, while established suites like Atari 100k and nuScenes remain
    central for driving method progress.'
  - 'Shared research pattern: Proposing new tasks and datasets (LoopNav, MIND) with
    dedicated metrics (scene graph consistency, memory/action scores) and open-sourcing
    artifacts; method papers adopt these or existing benchmarks, reporting human-normalized
    scores or comparative metrics.'
  - 'Key differences: Benchmarks differ in evaluation target—spatial consistency vs.
    memory and action control—and in domain (Minecraft, real-world-style videos, driving).
    Method papers vary in supervision (diffusion, VAE, Transformer) and deploy settings
    (Atari, driving, robotics), leading to different stress on visual fidelity, physical
    plausibility, or generalization.'
  - 'Trend evolution: From 2023–2026, the field moves from relying on general game/driving
    benchmarks (Atari 100k, nuScenes) toward constructing purpose-built world-model
    diagnostics (LoopNav 2025 to MIND 2026), shifting from coarse aggregate performance
    to fine-grained capability testing.'
  - 'Open questions: Whether proxy metrics align with downstream decision quality;
    if benchmark conclusions are stable across implementations and compute budgets;
    and whether task distributions cover the full range of real-world settings where
    world models are expected to operate.'
  related_work_outline_zh:
  - 主流方向：设计面向世界模型的专用基准，评估空间一致性、记忆、动作控制和超越原始视频预测的泛化能力，同时Atari 100k和nuScenes等成熟基准仍驱动方法发展。
  - 研究共性：提出新任务和数据集（如LoopNav、MIND），配套专用指标（场景图一致性、记忆/动作评分）并开源资源；方法论文采用这些或已有基准，报告人类归一化得分或对比指标。
  - 关键差异：基准在评估目标上分化为空间一致性与记忆/动作控制，领域涵盖Minecraft、真实风格视频、驾驶；方法在监督方式（扩散、VAE、Transformer）和部署场景（Atari、驾驶、机器人）上不同，导致对视觉保真度、物理合理性或泛化性的侧重各异。
  - 趋势演进：2023至2026年，领域从依赖通用游戏/驾驶基准转向构建专用世界模型诊断工具（LoopNav 2025到MIND 2026），评估粒度从粗犷聚合性能细化到能力剖析。
  - 开放问题：代理指标是否与下游决策质量一致；基准结论在不同实现和算力下是否稳定；任务分布是否覆盖世界模型拟发挥作用的全部真实场景。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make world-model capabilities
        comparable, e.g., spatial consistency via loop-based navigation or memory/action
        control via diverse viewpoints.
      what_remains_open: Whether the proposed tasks and domains (Minecraft, 1080p
        videos) sufficiently represent the complexity and dynamics of real-world deployment
        settings where world models are expected to help.
    - line: Metric and stress-test design
      what_it_solves: Probing prediction, controllability, and robustness beyond pixel-level
        metrics using invariance-focused scores (scene graph consistency) and multi-condition
        evaluation (varied action spaces, first-person vs. third-person).
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        decision quality users care about, and whether the stress tests capture all
        relevant failure modes of world models.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable by providing standard baselines, open-source
        code and datasets, and consistent reporting of normalized scores, enabling
        cross-study comparison.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and hyperparameter choices, and the absence
        of systematic sensitivity studies.
    consensus:
    - Dedicated world-model benchmarks are needed to evaluate capabilities beyond
      short-term prediction, such as spatial consistency, memory, and action control.
    - Standardized tasks, open-source datasets, and defined metrics facilitate fair
      comparison and reproducibility in world-model research.
    - Sample-efficient benchmarks like Atari 100k are widely adopted for evaluating
      world-model-based reinforcement learning, alongside domain-specific suites such
      as nuScenes for driving.
    disagreements:
    - 'Evaluation targets diverge: some benchmarks focus on spatial consistency with
      scene graph scores, while others emphasize memory and action control under varied
      viewpoints, reflecting different priorities in what constitutes a good world
      model.'
    - Method papers implicitly assume visual fidelity (diffusion models) or physical
      plausibility as a quality signal, whereas dedicated benchmarks abstract away
      from pixel-level details to measure structural consistency, creating a tension
      between low-level and high-level assessment.
    - 'Deployment settings differ substantially: driving scenes (nuScenes), video
      games (Atari, Minecraft), and robotic manipulation, each with unique dynamics
      and action spaces, leading to disagreements on the presumed scope and generality
      of conclusions.'
    open_questions:
    - How well do current benchmark metrics predict downstream task success, such
      as policy learning efficiency or safe planning in real-world environments?
    - Can benchmark rankings be replicated across different model implementations
      and training budgets, and what is the minimum reporting standard to ensure reproducibility?
    - Do the task distributions in existing benchmarks cover the long-horizon, partially
      observable, and interactive scenarios that motivate world-model research, or
      are we optimizing for proxy tasks that miss core challenges?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型能力可比较，例如通过循环导航评估空间一致性，或通过多视角评估记忆与动作控制。
      尚未覆盖: 所提出的任务和领域（Minecraft、1080p视频）是否充分代表世界模型预期工作所需的真实世界复杂性与动态性。
    - 路线: 指标与压力测试设计
      解决的问题: 在像素级指标之外，利用对变化保持不变的分数（场景图一致性）和多条件评估（不同动作空间、第一/第三人称）检验预测、可控性和鲁棒性。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策质量之间的一致性，以及压力测试是否覆盖世界模型的所有关键失效模式。
    - 路线: 可比基线与报告规范
      解决的问题: 通过提供标准基线、开源代码和数据集，以及一致报告归一化得分，使结果可审计，支持跨研究比较。
      尚未覆盖: 基准结论在不同实现、算力预算和超参数选择下是否稳定，以及缺乏系统性敏感性研究。
    共识:
    - 需要专用世界模型基准评估超越短期预测的能力，如空间一致性、记忆和动作控制。
    - 标准化任务、开源数据集和明确指标有助于世界模型研究的公平比较和可复现性。
    - Atari 100k等样本效率基准被广泛用于评估基于世界模型的强化学习，与nuScenes等驾驶专用基准并存。
    分歧:
    - 评估目标分化：一些基准用场景图分数关注空间一致性，另一些强调多视角下的记忆与动作控制，反映了对世界模型核心能力的优先级差异。
    - 方法论文默认将视觉保真度（扩散模型）或物理合理性作为质量信号，而专用基准剥离像素细节以衡量结构一致性，形成低层与高层评估之间的张力。
    - 部署场景显著不同：驾驶场景（nuScenes）、视频游戏（Atari、Minecraft）和机器人操作，各自具有独特的动力学和动作空间，导致结论的假设范围和通用性存在分歧。
    开放问题:
