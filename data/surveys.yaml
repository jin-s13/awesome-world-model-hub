  related_work_outline:
  - 'Mainstream direction: World-model evaluation is shifting from aggregate task
    scores toward diagnostic benchmarks that separately test spatial consistency,
    memory consistency, action control, visual fidelity, and physical plausibility,
    while also measuring downstream policy utility.'
  - 'Shared research pattern: Multiple works combine public benchmarks, action-conditioned
    video generation, and downstream policy evaluation; benchmark works release datasets,
    metrics, and code, while method works compare against state-of-the-art baselines
    on shared suites.'
  - 'Key differences: They differ in evaluation targets such as game sample efficiency,
    contextual zero-shot generalization, multi-view driving, robot video synthesis,
    and open-domain memory, as well as interaction mode, supervision signal, and whether
    metrics are pixel-level or semantic.'
  - 'Trend evolution: Available top-paper evidence clusters in 2023–2026, so the visible
    trend is within the current frontier: from compact latent world models toward
    diffusion, physics-informed, and action-coupled video world models, with explicit
    benchmark construction emerging in 2025–2026 for spatial and memory consistency.'
  - 'Open questions: Do diagnostic metrics align with downstream decisions? Are benchmark
    conclusions stable across implementations and compute? Does coverage extend to
    real deployment settings? How can long-term memory and cross-action-space generalization
    be evaluated without assuming observable context?'
  related_work_outline_zh:
  - 主流方向：世界模型评估正从总分转向诊断性基准，分别测试空间一致性、记忆一致性、动作控制、视觉保真度和物理合理性，同时衡量下游策略效用。
  - 研究共性：多项工作结合公开基准、动作条件视频生成和下游策略评估；基准工作发布数据集、指标和代码，方法工作在共享套件上与基线比较。
  - 关键差异：评测目标、交互模式、监督信号和指标性质各异，涉及游戏样本效率、上下文零样本泛化、多视角驾驶、机器人视频合成和开放域记忆。
  - 趋势演进：现有高相关证据集中在2023–2026年，可见趋势处于当前前沿：从紧凑潜在世界模型转向扩散、物理信息和动作耦合视频世界模型，并在2025–2026年出现显式基准构建。
  - 开放问题：诊断指标是否与下游决策对齐？基准结论是否在实现和算力变化下稳定？覆盖是否扩展到真实部署环境？如何评估长时记忆和跨动作空间泛化？
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared tasks and datasets for making world-model claims
        comparable, including diagnostic datasets for driving, gaming, robotics, and
        spatial or memory consistency.
      what_remains_open: Whether these task distributions cover the open-domain, long-horizon,
        cross-action, and real deployment settings where world models are expected
        to help remains insufficiently evidenced.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction quality, spatial consistency, memory consistency,
        action control, visual fidelity, and physical plausibility beyond a single
        aggregate score.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility remains underevidenced, especially for semantic versus pixel-level
        evaluation.
    - line: Comparable baselines and reporting
      what_it_solves: Supports auditable comparisons through shared baselines, public
        benchmarks, open resources, and downstream policy evaluations.
      what_remains_open: Cross-implementation stability, compute-budget sensitivity,
        and consistent limitation reporting are not fully evidenced in the available
        packet.
    consensus:
    - Recent world-model work increasingly evaluates both visual generation quality
      and downstream policy utility.
    - Benchmarks are moving toward diagnostic abilities such as spatial consistency,
      memory consistency, action control, and physical plausibility.
    - Diffusion-based and action-coupled video generation is a strong current direction
      for learning world models.
    - Reproducibility artifacts such as code and datasets are present for several
      benchmark and method contributions.
    disagreements:
    - 'Evaluation targets differ substantially: sample-efficient game play, contextual
      zero-shot control, multi-view driving prediction, robotic video synthesis, and
      open-domain memory consistency.'
    - Some metrics reward pixel-level visual fidelity, while others use semantic scene-graph
      consistency that is intentionally invariant to pixel variation.
    - 'Interaction modes differ: closed-loop action-conditioned benchmarks, action-free
      video learning, and static or open-loop prediction coexist.'
    - 'Supervision and representation differ: discrete VAEs, transformer stochastic
      models, diffusion models, physics-informed auxiliary tasks, and context-conditioned
      latent dynamics are all used.'
    - 'Reporting completeness differs: some method papers omit explicit limitations,
      while benchmark papers emphasize open challenges but may not yet report full
      experimental baselines.'
    open_questions:
    - Do current diagnostic metrics for consistency, fidelity, and control align with
      downstream decisions users actually care about?
    - Can benchmark conclusions remain stable across different implementations, compute
      budgets, and missing citation or limitation evidence?
    - Does the available benchmark coverage extend to real driving, robotics, and
      open-world deployment beyond curated game or simulator settings?
    - How should evaluation capture long-term memory consistency and cross-action-space
      generalization, which current evidence identifies as unresolved?
    - What happens when context is not observable, given that contextual world models
      currently assume observable context values?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享任务和数据集，使世界模型主张在驾驶、游戏、机器人和空间或记忆一致性等方面具备可比性。
      尚未覆盖: 这些任务分布是否覆盖开放域、长时域、跨动作空间和真实部署环境，仍缺乏充分证据。
    - 路线: 指标与压力测试设计
      解决的问题: 在单一总分之外检验预测质量、空间一致性、记忆一致性、动作可控性、视觉保真度和物理合理性。
      尚未覆盖: 这些代理指标与下游决策效用的对齐尚未充分证明，尤其是语义一致性与像素级评估之间的取舍。
    - 路线: 可比基线与报告规范
      解决的问题: 通过共享基线、公开基准、代码数据集和下游策略评估使结果可审计。
      尚未覆盖: 跨实现稳定性、算力预算敏感性以及一致性限制报告在现有证据中未被充分覆盖。
    共识:
    - 近期世界模型研究越来越同时评估视觉生成质量和下游策略效用。
    - 基准正在转向空间一致性、记忆一致性、动作可控性和物理合理性等诊断性能力。
    - 基于扩散和动作耦合的视频生成是当前学习世界模型的重要方向。
    - 若干基准和方法贡献提供了代码、数据集等可复现工件。
    分歧:
    - 评测目标差异明显：样本高效游戏、上下文零样本控制、多视角驾驶预测、机器人视频合成和开放域记忆一致性各有侧重。
    - 部分指标奖励像素级视觉保真度，而另一些指标使用对像素变化不变的语义场景图一致性。
    - 交互模式不同：闭环动作条件基准、无动作视频学习以及静态或开环预测同时存在。
    - 监督信号和表示不同：离散VAE、Transformer随机模型、扩散模型、物理信息辅助任务和上下文条件潜在动力学各有选择。
    - 报告完整性不同：部分方法论文缺少明确限制，而基准论文强调开放挑战但可能尚未报告完整实验基线。
    开放问题:
    - 当前用于一致性、保真度和控制的诊断指标，是否与用户真正关心的下游决策对齐？
    - 在不同实现、算力预算以及缺失引用和限制证据的情况下，基准结论是否保持稳定？
    - 现有基准覆盖是否能扩展到真实驾驶、机器人和开放世界部署，而不仅是精选游戏或模拟器环境？
    - 当前证据指出长期记忆一致性和跨动作空间泛化仍未解决，应如何在评估中捕捉这些能力？
    - 上下文世界模型目前假设上下文值可观测，当上下文不可观测时应当如何评估？
