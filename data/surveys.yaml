  related_work_outline:
  - 'Mainstream direction: Recent research centers on generative video world models
    using diffusion Transformers, often for embodied or driving domains, and on coupling
    visual generation with masked reconstruction, physics, language, or action diffusion.'
  - 'Shared research pattern: World-model methods jointly design a predictive representation
    or objective and an interface to actions or planning; they are increasingly validated
    by rollout fidelity, downstream policy utility, or consistency metrics.'
  - 'Key differences: Some methods optimize latent model-based RL sample efficiency,
    while others optimize high-fidelity video or multimodal generation; supervision,
    interaction mode, and evaluation settings diverge accordingly.'
  - 'Trend evolution: The available 2023-2026 evidence shows a shift from stochastic
    Transformer/VAE RL world models toward diffusion-based embodied/driving world
    models and dedicated spatial/memory/action-consistency evaluations within the
    current frontier.'
  - 'Open questions: Long-term memory and action-space generalization, physical plausibility,
    handling unseen contexts/novel primitives, and isolating model contribution from
    dataset/planner remain unresolved; several papers omit limitations or full experimental
    results.'
  related_work_outline_zh:
  - 主流方向：以扩散 Transformer 和生成式视频世界模型为主的具身、驾驶世界建模，常与掩码重建、物理线索、语言或动作扩散结合。
  - 研究共性：世界模型方法多同时设计预测表示/目标与动作或规划接口，并以生成保真度、下游策略效用或一致性指标进行验证。
  - 关键差异：一类侧重潜在模型强化学习样本效率，另一类侧重高保真视频或多模态生成；监督信号、交互方式和评测设定也随之不同。
  - 趋势演进：2023-2026 证据显示，从随机 Transformer/VAE 强化学习世界模型转向面向具身/驾驶的扩散世界模型及专门的记忆与动作一致性评估，仍属当前前沿内部演进。
  - 开放问题：长期记忆一致性、跨动作空间泛化、物理合理性、未见上下文/新原语处理，以及模型贡献与数据/规划器贡献的分离仍未解决；部分论文缺少局限性或完整实验结果。
  literature_review:
    line_of_work_matrix:
    - line: Diffusion-and-Transformer generative world models for video prediction
        and embodied generation
      what_it_solves: Turns world-model ideas into concrete architectures and objectives
        for high-fidelity future frame/video synthesis, including masked diffusion
        reconstruction, physics-informed auxiliaries, and coupled video-action diffusion.
      what_remains_open: Transfer beyond reported driving/robot domains, long-horizon
        physical and memory consistency, and exact contribution of each objective
        or auxiliary task are not yet established.
    - line: Latent model-based RL world models with stochastic or contextual sequence
        dynamics
      what_it_solves: Connects learned dynamics to policy improvement through imagined
        trajectories, improving sample efficiency and, when context is explicit, zero-shot
        generalization to unseen dynamics.
      what_remains_open: Attribution between model, planner, and task priors is unclear;
        context observability and narrow benchmark coverage leave real-world or fully
        unknown-dynamics generalization unverified.
    - line: Evaluation protocols for spatial, memory, and action-control consistency
        in world models
      what_it_solves: Provides datasets and metrics to test whether world models maintain
        spatial consistency, long-term memory, and action-conditioned control beyond
        pixel-level fidelity.
      what_remains_open: The evidence mostly constructs or applies benchmarks and
        reports world-model weaknesses; it does not yet isolate which method choices
        improve these consistency properties or provide complete result/limitation
        evidence.
    consensus:
    - Recent world-model research treats generation and action-conditioned prediction
      as central, not merely passive video reconstruction.
    - Visual fidelity alone is insufficient; consistency, controllability, and downstream
      policy or planning utility are becoming shared evaluation concerns.
    - Self-supervised or large-data pretraining objectives are commonly used to learn
      dynamics, often with diffusion or sequence-model architectures.
    - Methods increasingly couple multiple modalities or auxiliary signals such as
      language, actions, physics cues, or context values.
    disagreements:
    - 'Supervision signal differs: some work uses masked reconstruction or physics-informed
      auxiliary tasks, while others use stochastic latent dynamics or coupled video-action
      diffusion.'
    - 'Evaluation target differs: some optimize reinforcement-learning performance
      on game benchmarks, others optimize driving/robot video prediction, and others
      evaluate spatial/memory/action consistency.'
    - 'Interaction mode differs: some models are evaluated open-loop or through imagined
      rollouts, while others are evaluated in closed-loop action-controlled settings
      or via downstream robot policies.'
    - 'Assumptions differ: some methods assume observable context values, others assume
      language instructions can be parsed into previously seen primitives, and others
      rely on large robot datasets with or without actions.'
    open_questions:
    - Which representation or auxiliary objective best preserves long-term memory
      and physical plausibility across unseen scenes and action spaces?
    - How much of reported policy or prediction gain comes from the world model itself
      versus the surrounding dataset, planner, action interface, or task prior?
    - Can current models handle unobserved context, entirely novel action or object
      primitives, and real-world closed-loop deployment?
    - What evaluation protocols are needed when several benchmark papers provide no
      full experimental results or limitations, leaving verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向视频预测与具身生成的扩散/Transformer生成式世界模型
      解决的问题: 把世界模型想法落实为高保真未来视频合成的架构与目标，包括掩码扩散重建、物理信息辅助任务和视频-动作耦合扩散。
      尚未覆盖: 驾驶/机器人域以外的迁移、长时域物理与记忆一致性，以及各目标或辅助任务的具体贡献尚未确定。
    - 路线: 基于潜在模型强化学习的随机或上下文序列动力学世界模型
      解决的问题: 通过想象轨迹连接学习到的动力学与策略改进，提升样本效率；在显式上下文条件下提升零样本泛化。
      尚未覆盖: 模型、规划器与任务先验的收益归属不清；上下文可观测假设和窄基准覆盖使真实或完全未知动力学泛化未经验证。
    - 路线: 面向空间、记忆和动作控制一致性的评估协议
      解决的问题: 提供数据集和指标，检验世界模型是否在像素级保真度之外保持空间一致性、长期记忆和动作条件控制。
      尚未覆盖: 证据主要构建或应用基准并揭示弱点，尚未隔离提升这些一致性能力的方法选择，也缺少完整结果/局限性证据。
    共识:
    - 近期世界模型研究将生成和动作条件预测视为核心，而非仅是被动的视频重建。
    - 视觉保真度本身不够，一致性、可控性和下游策略或规划效用正在成为共同评估关注点。
    - 常采用自监督或大规模数据预训练目标学习动力学，且多使用扩散或序列模型架构。
    - 方法日益耦合多模态或辅助信号，如语言、动作、物理线索或上下文变量。
    分歧:
    - 监督信号不同：有的使用掩码重建或物理信息辅助任务，有的使用随机潜在动力学或视频-动作耦合扩散。
    - 评测目标不同：有的优化游戏基准上的强化学习表现，有的优化驾驶/机器人视频预测，有的评估空间/记忆/动作一致性。
    - 交互模式不同：有的通过想象轨迹或开环预测评估，有的在闭环动作控制或下游机器人策略中评估。
    - 假设条件不同：有的假设上下文变量可观测，有的假设语言指令可解析为已见原语，有的依赖含或不含动作的大规模机器人数据。
    开放问题:
    - 哪种表示或辅助目标最能保持跨未见场景和动作空间的长期记忆与物理合理性？
    - 报告的策略或预测增益有多少来自世界模型本身，多少来自数据集、规划器、动作接口或任务先验？
    - 当前模型能否处理不可观测上下文、全新动作或物体原语以及真实闭环部署？
    - 当部分基准论文未给出完整实验结果或局限性时，需要怎样的评估协议来补足验证缺口？
