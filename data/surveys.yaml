  related_work_outline:
  - 'Mainstream direction: recent work is dominated by generative world models built
    on diffusion or transformer backbones, using video prediction as a central objective
    and increasingly coupling it with action, context, or physics signals for embodied
    control.'
  - 'Shared research pattern: methods improve consistency and generalization by adding
    auxiliary signals such as mask reconstruction, contextual latent conditioning,
    physics-informed depth/keypoint tasks, language-based composition, or unified
    video-action diffusion.'
  - 'Key differences: representations range from compact latent state-space dynamics
    for model-based RL to high-dimensional pixel/video generation; interfaces include
    observable context, language primitives, action diffusion, and benchmark-specific
    action spaces; evaluation spans Atari/CARL, driving, robot, Minecraft, and open-domain
    video.'
  - 'Trend evolution: the 2023-2026 evidence shows a shift from efficient stochastic
    RL world models toward larger video/action generative models and task-specific
    embodied world models, with new benchmarks emerging for spatial, memory, and action-control
    consistency.'
  - 'Open questions: whether reported gains isolate the model from planner/system
    choices, transfer outside tested domains, maintain long-term memory and action
    generalization without assumptions such as observable context or known primitive
    vocabularies, and what missing limitation details hide.'
  related_work_outline_zh:
  - 主流方向：近期以扩散或Transformer为骨干的生成式世界模型占主导，以视频预测为核心目标，并越来越多地与动作、上下文或物理信号耦合，用于具身控制。
  - 研究共性：方法通过加入掩码重建、上下文潜在条件、物理信息深度/关键点任务、语言组合或统一视频-动作扩散等辅助信号，增强一致性与泛化能力。
  - 关键差异：表示方式从用于模型型强化学习的紧凑潜在状态空间动力学，到高维像素/视频生成；接口包括可观测上下文、语言原语、动作扩散和基准特定动作空间；评测覆盖Atari/CARL、驾驶、机器人、Minecraft和开放域视频。
  - 趋势演进：2023-2026年证据显示，从高效随机强化学习世界模型转向更大规模的视频/动作生成模型和任务特定具身世界模型，并出现了面向空间一致性、记忆一致性和动作控制的新基准。
  - 开放问题：模型收益是否与规划器/系统选择隔离，能否迁移到已测试领域之外，能否在缺少可观测上下文或已知原语等假设下维持长期记忆和动作泛化，以及缺失的局限性说明隐藏了哪些失败模式。
  literature_review:
    line_of_work_matrix:
    - line: Representation and objective design
      what_it_solves: Converts world-model assumptions into concrete generative or
        latent-dynamics architectures and auxiliary training signals, such as diffusion
        mask reconstruction, Transformer-VAE stochastic transitions, contextual recurrent
        state-space modeling, or physics-informed video generation.
      what_remains_open: Transfer beyond the reported domains is unverified; several
        papers omit limitations, and it is unclear whether gains come from auxiliary
        losses or from backbone capacity and scale.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics or video models to policy, planning,
        and language/action interfaces, including Dreamer-style imagination, composition
        from language primitives, and unified video-action diffusion for robot pretraining.
      what_remains_open: Attribution between the world model and the downstream policy/planner
        is unresolved; unseen action primitives and real-robot deployment remain weakly
        covered.
    - line: Method evidence and evaluation protocols
      what_it_solves: Uses datasets and metrics for spatial consistency, memory consistency,
        and action control to expose world-model failures that frame-level generation
        quality alone cannot capture.
      what_remains_open: New benchmark evidence is still sparse and not yet tied to
        specific method improvements; cross-domain and real-world validity remains
        unverified.
    consensus:
    - Recent methods converge on generative or latent world models trained with auxiliary
      objectives to improve temporal, spatial, or physical consistency beyond simple
      frame prediction.
    - Action, context, or language interfaces are increasingly integrated into world-model
      training rather than treated only as downstream inputs.
    - Evaluation is moving from offline reconstruction quality toward control-oriented
      or consistency-oriented signals such as zero-shot dynamics generalization, memory
      consistency, spatial consistency, and action control.
    - Dedicated benchmarks and datasets are needed to reveal world-model limitations
      that frame-level generation metrics miss.
    disagreements:
    - 'Representation choice differs: some work learns compact latent state-space
      dynamics for sample-efficient RL, while other work generates high-dimensional
      RGB video via diffusion or autoencoder-style models.'
    - 'Supervision and interaction mode differ: models condition on or predict observable
      context variables, language-derived primitives, action sequences, or modality-specific
      diffusion timesteps.'
    - 'Evaluation targets and deployment domains differ: Atari/CARL control, multi-view
      driving, robotic manipulation, Minecraft navigation, and open-domain video consistency.'
    - 'Assumptions differ: some approaches assume observable context or a predefined
      primitive vocabulary, while action-free video learning and open-domain action-space
      generalization relax or shift those assumptions.'
    - Some papers provide code, datasets, or limitation evidence; others omit limitations,
      leaving failure modes and transfer boundaries unclear.
    open_questions:
    - Which representation and auxiliary objectives transfer beyond the reported tasks,
      datasets, and domains?
    - How much of the reported policy or video-quality gain comes from the world model
      versus the surrounding planner, controller, or action interface?
    - Can world models maintain long-term memory and action consistency without assumptions
      such as observable context, predefined primitives, or fixed action spaces?
    - Do the new spatial and memory benchmarks generalize from game or rendered domains
      to real-world robot use, and how should their scores guide model design?
    - What failure modes and replication gaps are hidden by missing limitation or
      code details in several top method papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 表示与目标设计
      解决的问题: 将世界模型假设落实为具体生成式或潜在动力学架构与辅助训练信号，例如扩散掩码重建、Transformer-VAE随机转移、上下文循环状态空间建模或物理信息视频生成。
      尚未覆盖: 已报告领域之外的迁移尚未验证；若干论文未给出局限性，且不清楚收益来自辅助损失还是骨干容量与规模。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学或视频模型连接到策略、规划和语言/动作接口，包括Dreamer式想象、基于语言原语的组合生成，以及用于机器人预训练的统一视频-动作扩散。
      尚未覆盖: 世界模型与下游策略/规划器之间的收益归因仍不清晰；未见动作原语和真实机器人部署的证据较弱。
    - 路线: 方法证据与评估协议
      解决的问题: 使用空间一致性、记忆一致性和动作控制等数据集与指标，揭示仅靠帧级生成质量无法捕捉的世界模型缺陷。
      尚未覆盖: 新基准证据仍较稀疏，尚未与具体方法改进建立联系；跨域与真实世界有效性仍未验证。
    共识:
    - 近期方法趋向于以生成式或潜在世界模型为基础，并通过辅助目标提升时间、空间或物理一致性，而不只依赖简单帧预测。
    - 动作、上下文或语言接口越来越多地直接参与世界模型训练，而不仅是训练后的下游输入。
    - 评测正从离线重建质量转向控制导向或一致性导向信号，例如零样本动力学泛化、记忆一致性、空间一致性和动作控制。
    - 需要专用基准和数据集来暴露帧级生成指标无法捕捉的世界模型局限。
    分歧:
    - 表示选择不同：一些工作学习紧凑潜在状态空间动力学用于样本高效强化学习，另一些通过扩散或自编码式模型生成高维RGB视频。
    - 监督与交互方式不同：模型以可观测上下文变量、语言派生原语、动作序列或模态特定扩散时间步为条件或预测目标。
    - 评测目标与部署领域不同：包括Atari/CARL控制、多视角驾驶、机器人操作、Minecraft导航和开放域视频一致性。
    - 假设不同：部分方法假设上下文可观测或原语预先已知，而动作自由视频学习和开放域动作空间泛化则放松或改变这些假设。
    - 部分论文提供代码、数据集或局限性证据，另一些则缺失局限性说明，使失败模式和迁移边界不清。
    开放问题:
    - 哪些表示和辅助目标能迁移到已报告任务、数据集和领域之外？
    - 已报告策略或视频质量收益中，有多少来自世界模型本身，多少来自周边规划器、控制器或动作接口？
    - 在缺少可观测上下文、预定义原语或固定动作空间等假设时，世界模型能否维持长期记忆和动作一致性？
    - 新空间与记忆基准能否从游戏或渲染域迁移到真实机器人场景，其分数应如何指导模型设计？
    - 若干顶级方法论文缺少局限性或代码细节，隐藏了哪些失败模式和复现缺口？
