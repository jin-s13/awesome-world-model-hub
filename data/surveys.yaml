  related_work_outline:
  - 'Mainstream direction: Domain world models are being built as controllable generative
    video or latent rollout models for robotics, driving, games, and benchmark-driven
    evaluation; diffusion transformers and coupled video/action diffusion are common
    in recent work.'
  - 'Shared research pattern: Papers couple visual generation with domain-specific
    structure such as actions, language primitives, context values, depth, keypoints,
    masks, or loop navigation to improve control, fidelity, and generalization.'
  - 'Key differences: Supervision and conditioning differ across action-free video
    pretraining, explicit context-conditioned latent dynamics, language-primitive
    decomposition, physics-informed losses, and consistency benchmarking instead of
    task performance.'
  - 'Trend evolution: From 2023 Atari-focused model-based RL efficiency toward 2024-2025
    robot and driving pretraining, then 2026 open-domain memory/action consistency
    benchmarks; the observed span is mostly the current frontier.'
  - 'Open questions: Real-world transfer, long-term memory consistency, cross-action-space
    generalization, and whether benchmark or simulator gains align with downstream
    safety and operational outcomes remain unresolved.'
  related_work_outline_zh:
  - 主流方向：领域世界模型正被构建为可控生成视频或潜在推演模型，用于机器人、驾驶、游戏和评测导向场景；近期以扩散Transformer及视频/动作耦合扩散为主。
  - 研究共性：将视觉生成与动作、语言原语、上下文、深度、关键点、掩码或循环导航等领域结构耦合，以改善控制、保真度与泛化。
  - 关键差异：监督与条件机制不同，包括无动作视频预训练、上下文条件潜在动力学、语言原语分解、物理信息损失，以及以一致性基准替代任务表现。
  - 趋势演进：从2023年Atari 100k上的基于模型强化学习效率，转向2024-2025年机器人与驾驶预训练，再到2026年开放域记忆/动作一致性基准；时间跨度较窄，趋势属于当前前沿。
  - 开放问题：真实世界迁移、长期记忆一致性、跨动作空间泛化，以及基准或仿真收益是否与下游安全与运营结果一致仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models and video planning
      what_it_solves: Synthesizes action- or language-conditioned robot videos and
        rollouts for policy learning, planning, and evaluation in manipulation settings.
      what_remains_open: Real-robot execution evidence, generalization to entirely
        new primitive combinations, and physical plausibility beyond visual metrics
        remain limited.
    - line: Autonomous driving world models and simulation
      what_it_solves: Generates multi-view, long-horizon driving scenes for prediction,
        closed-loop simulation, and zero-shot validation across driving datasets.
      what_remains_open: Alignment between reported video improvements and real-world
        driving safety or operational outcomes; reported limitations are missing.
    - line: Model-based reinforcement learning world models
      what_it_solves: Learns latent dynamics or contextual rollouts in imagined trajectories
        to improve sample efficiency and zero-shot policy generalization.
      what_remains_open: Assumes observable context or simplified task settings, and
        evidence on only two contextual tasks or Atari-focused benchmarks limits broader
        claims.
    - line: Open-domain world-model consistency benchmarks
      what_it_solves: Measures spatial consistency, memory consistency, and action
        control in interactive video-to-world settings using loop navigation or revisited
        clips.
      what_remains_open: Benchmark scores have not yet been tied to downstream robot
        or driving performance, and some benchmark papers report methods or datasets
        without experimental results.
    consensus:
    - Many recent approaches treat world models as generative video or latent rollout
      models and couple multiple modalities, including video, action, language, context,
      depth, and keypoints, rather than learning visual prediction in isolation.
    - 'Generalization is a shared evaluation pressure: unseen contexts, unseen goals,
      long-horizon rollouts, multi-view prediction, zero-shot datasets, and open-domain
      revisits are used to test models beyond training distributions.'
    - Transformer and diffusion backbones are common in newer work, often adding auxiliary
      reconstruction, mask, or physics-informed tasks to improve coherence, control,
      or physical plausibility.
    - Independent benchmarks for memory, spatial consistency, and action control signal
      that the field wants verifiable behavioral properties, not only visual fidelity.
    disagreements:
    - 'Conditioning assumptions differ: some rely on action-free video pretraining,
      while others require explicit action context, observable context values, or
      language parsed into predefined primitives.'
    - 'Representation choices differ: latent recurrent state-space models are used
      for contextual control, while video-diffusion transformers are used for high-dimensional
      visual rollout and policy evaluation.'
    - 'Evaluation targets differ: sample efficiency on Atari-style control, zero-shot
      contextual generalization, driving dataset rollout quality, robot execution
      success, and open-domain memory/action consistency are separate success criteria.'
    - 'Physics and abstraction differ: driving work uses mask reconstruction for spatiotemporal
      structure, embodied work adds depth/keypoint physics signals, and interactive
      benchmarks measure consistency without claiming physical simulation.'
    open_questions:
    - Does improved video generation or consistency on current benchmarks transfer
      to real robot policy success and real driving safety or operational outcomes?
    - Can world models maintain long-term memory consistency across large viewpoint
      and action-space changes without task-specific action spaces or seen primitive
      combinations?
    - Which conditioning representation, such as context, action-free video, language
      primitives, physics signals, or unified video-action diffusion, generalizes
      most robustly under partially observable or shifting real-world dynamics?
    - What thresholds connect spatial or memory consistency scores to downstream control
      performance, and do current datasets cover enough scene diversity to support
      that claim?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人世界模型与视频规划
      解决的问题: 合成动作或语言条件的机器人视频与推演，用于操作任务中策略学习、规划和评测。
      尚未覆盖: 真实机器人执行证据、全新原语组合泛化，以及视觉指标之外的物理合理性仍有限。
    - 路线: 自动驾驶世界模型与仿真
      解决的问题: 生成多视角长时域驾驶场景，用于预测、闭环仿真和跨数据集零样本验证。
      尚未覆盖: 视频指标提升与真实驾驶安全或运营结果的对应关系尚未验证；报告的方法局限缺失。
    - 路线: 基于模型强化学习的世界模型
      解决的问题: 在想象轨迹中学习潜在动力学或上下文推演，提升采样效率和策略零样本泛化。
      尚未覆盖: 假设上下文可观测或任务设置简化；仅在两个上下文任务或Atari类基准上的证据限制更广泛结论。
    - 路线: 开放域世界模型一致性基准
      解决的问题: 通过循环导航或回访片段，评估交互式视频到世界场景中的空间一致性、记忆一致性和动作控制。
      尚未覆盖: 基准分数尚未与下游机器人或驾驶性能关联；部分基准工作未报告实验结果。
    共识:
    - 许多近期方法将世界模型视为生成视频或潜在推演模型，并耦合视频、动作、语言、上下文、深度、关键点等多种模态，而非孤立学习视觉预测。
    - 泛化是共同评测压力：未见上下文、未见目标、长时域推演、多视角预测、零样本数据集和开放域回访被用于测试训练分布外能力。
    - Transformer和扩散主干在较新工作中常见，常加入辅助重建、掩码或物理信息任务以改善连贯性、控制或物理合理性。
    - 独立的记忆、空间一致性和动作控制基准出现，表明领域希望验证可观测行为属性，而不仅是视觉保真度。
    分歧:
    - 条件假设不同：有的依赖无动作视频预训练，有的依赖显式动作上下文、可观测上下文值或解析为预定义原语的语言指令。
    - 表示选择不同：潜在循环状态空间模型用于上下文控制，视频扩散Transformer用于高维视觉推演与策略评测。
    - 评测目标不同：Atari类样本效率、上下文零样本泛化、驾驶数据集推演质量、机器人执行成功、开放域记忆/动作一致性互不相同。
    - 物理与抽象程度不同：驾驶工作用掩码重建捕捉时空结构，具身工作增加深度/关键点物理信号，交互基准在未声称物理仿真的情况下测量一致性。
    开放问题:
    - 当前基准上的视频生成或一致性提升，是否可迁移到真实机器人策略成功和真实驾驶安全或运营结果？
    - 世界模型能否在大范围视角和动作空间变化下维持长期记忆一致性，而不依赖任务特定动作空间或已见原语组合？
    - 在部分可观测或动态变化的真实环境中，上下文、无动作视频、语言原语、物理信号或统一视频-动作扩散等条件表示中哪种更鲁棒？
    - 空间或记忆一致性分数达到何种阈值才能预测下游控制性能，当前数据集是否覆盖足够场景多样性以支持该结论？
