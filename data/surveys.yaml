  related_work_outline:
  - 'Mainstream direction: The strongest top-ranked evidence is generative environment
    dynamics modeling for control and video prediction, while dedicated evaluation-oriented
    work appears as a smaller but distinct branch.'
  - 'Shared research pattern: Most methods couple visual generation with auxiliary
    self-supervised or control signals and evaluate on standard suites such as Atari
    100k, CARL, nuScenes/OpenDV-2K/Waymo, LoopNav, or MIND.'
  - 'Key differences: Modeling-oriented work optimizes visual fidelity, training efficiency,
    or policy generalization, while evaluation-oriented work targets spatial consistency,
    memory consistency, or action controllability through loop-based or closed-loop
    revisits.'
  - 'Trend evolution: From 2023-2024 efficient discrete/VAE and diffusion-based game
    models to 2025-2026 driving, robotics, and open-domain settings with physics-informed,
    masked, or video-action coupled objectives.'
  - 'Open questions: Whether visual-generation metrics align with downstream decision
    utility, whether targeted consistency benchmarks cover long-horizon and cross-action
    generalization, and whether missing limitation/result details hide reproducibility
    gaps.'
  related_work_outline_zh:
  - 主流方向：证据包中最强证据集中在面向控制与视频预测的生成式环境动力学建模，而非独立评测套件；以评测为导向的工作是较小但独立的分支。
  - 研究共性：多数方法将视觉生成与辅助自监督或控制信号结合，并在 Atari 100k、CARL、nuScenes/OpenDV-2K/Waymo、LoopNav
    或 MIND 等标准场景中评测。
  - 关键差异：建模导向工作优化视觉保真、训练效率或策略泛化；评测导向工作通过循环或闭环回访检验空间一致性、记忆一致性或动作可控性。
  - 趋势演进：从 2023-2024 年高效的离散/VAE 与基于扩散的游戏模型，演进到 2025-2026 年驾驶、机器人及开放域场景中的物理信息、掩码重建和视频-动作耦合目标。
  - 开放问题：视觉生成指标是否与下游决策效用一致；面向一致性的评测是否覆盖长时域与跨动作泛化；多篇论文缺少局限性与结果细节，构成可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative dynamics architectures with auxiliary objectives
      what_it_solves: Improves visual fidelity, long-horizon or multi-view prediction,
        efficient training, and policy learning by combining diffusion, transformers,
        masking, depth/keypoint learning, or action coupling.
      what_remains_open: Whether improved generation quality transfers to robust real-world
        decisions under unseen dynamics, viewpoints, or action spaces; several papers
        omit explicit limitation analyses.
    - line: Evaluation-oriented task and dataset design
      what_it_solves: Creates closed-loop or loop-based navigation, open-domain revisit,
        and shared action-space datasets to expose spatial and temporal consistency
        in predictive video models.
      what_remains_open: 'Coverage remains narrow: loop-based Minecraft navigation
        and a limited set of open-domain videos may not represent long-horizon driving,
        manipulation, or deployment variability.'
    - line: Metric and stress-test design
      what_it_solves: Defines consistency scores and action-control evaluations that
        go beyond aggregate visual quality or single-step prediction.
      what_remains_open: Alignment between these proxy metrics and downstream decision
        utility is not demonstrated; cross-view and cross-action generalization remains
        a challenge.
    - line: Comparable baselines and reporting
      what_it_solves: Uses shared baselines such as Dreamer v3, imitation learning,
        or state-of-the-art driving models and public datasets to make results comparable.
      what_remains_open: Several top papers lack full result or limitation details;
        stability across implementations, random seeds, and compute budgets is not
        established.
    consensus:
    - Predictive video and dynamics models are increasingly evaluated by downstream
      control or policy performance rather than by visual quality alone.
    - Joint training of visual generation with auxiliary tasks such as action prediction,
      context conditioning, depth/keypoint learning, or mask reconstruction is a recurring
      approach.
    - Evaluation-oriented work converges on closed-loop or loop-based settings to
      measure temporal stability and spatial consistency instead of isolated frame-level
      scores.
    disagreements:
    - 'Representation choices differ: discrete/VAE recurrent state-space models, diffusion-only
      models, and unified video-action diffusion transformers make different training
      and sampling trade-offs.'
    - 'Supervision differs: some methods require observable context values; others
      learn from action-free video; others inject physics through depth and keypoint
      objectives.'
    - 'Evaluation targets differ: Atari human-normalized score, CARL zero-shot generalization,
      nuScenes/OpenDV-2K/Waymo driving quality, and LoopNav/MIND consistency and controllability
      metrics stress different abilities.'
    - 'Deployment settings differ: game environments, contextual reinforcement learning,
      autonomous driving, robotic manipulation, and open-domain interactive video
      create different demands on memory, action conditioning, and long-horizon stability.'
    open_questions:
    - Which evaluation settings are necessary to show that improved visual prediction
      actually improves decision-making under unseen dynamics?
    - Can spatial consistency and memory/action control metrics detect long-horizon
      drift, physical implausibility, or cross-action failure in real deployments?
    - How stable are the reported model rankings when implementation details, computation
      budgets, or evaluation datasets change?
    - Do current evaluation datasets cover the open-domain, multi-view, and long-horizon
      conditions where generative environment models are expected to operate?
    - Given that read-first, citation, and component scores are popularity and ranking
      signals rather than methodology evidence, and many OpenAlex metadata fields
      are absent, what additional methodological evidence is needed for reliable comparison?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式环境动力学架构与辅助目标
      解决的问题: 通过结合扩散、Transformer、掩码重建、深度/关键点学习或动作耦合，改善视觉保真、长时域/多视角预测、训练效率与策略学习。
      尚未覆盖: 生成质量提升能否迁移到未见动力学、视角或动作空间下的稳健真实决策尚未验证；部分论文缺少明确局限性分析。
    - 路线: 评测导向的任务与数据集设计
      解决的问题: 构建闭环或循环导航、开放域回访和共享动作空间数据集，以暴露预测视频模型中的空间与时间一致性。
      尚未覆盖: 覆盖范围仍较窄；Minecraft 循环导航和有限开放域视频可能无法代表长时域驾驶、操作或部署多样性。
    - 路线: 指标与压力测试设计
      解决的问题: 定义一致性分数和动作控制评测，超越总体视觉质量或单步预测。
      尚未覆盖: 代理指标与下游决策效用之间的一致性尚未证实；跨视角与跨动作空间泛化仍是难点。
    - 路线: 可比基线与报告规范
      解决的问题: 使用 Dreamer v3、模仿学习或最先进驾驶模型等公共基线和数据集，使结果可比较。
      尚未覆盖: 多篇论文缺少完整结果或局限性细节；跨实现、随机种子和算力预算的稳定性尚未建立。
    共识:
    - 预测视频与动力学模型越来越多地用下游控制或策略表现来评测，而不是只看视觉质量。
    - 将视觉生成与动作预测、上下文条件化、深度/关键点学习或掩码重建等辅助任务联合训练，是反复出现的做法。
    - 评测导向工作趋向于用闭环或循环场景来测量时间稳定性和空间一致性，而非孤立的单帧分数。
    分歧:
    - 表示选择不同：离散/VAE循环状态空间模型、纯扩散模型和统一视频-动作扩散Transformer在训练与采样取舍上不同。
    - 监督方式不同：一些方法依赖可观测上下文值，一些从无动作视频学习，还有的通过深度与关键点目标注入物理信息。
    - 评测目标不同：Atari 人类归一化分数、CARL 零样本泛化、nuScenes/OpenDV-2K/Waymo 驾驶质量，以及 LoopNav/MIND
      的一致性与可控性指标强调不同能力。
    - 部署场景不同：游戏环境、上下文强化学习、自动驾驶、机器人操作和开放域交互视频对记忆、动作条件化和长时域稳定性提出不同要求。
    开放问题:
    - 需要哪些评测设置才能证明视觉预测改善确实转化为未见动力学下的更好的决策？
