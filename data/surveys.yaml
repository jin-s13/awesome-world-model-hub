  related_work_outline:
  - 'Mainstream direction: Formalizing world model requirements through state construction
    and dynamics modeling, with growing emphasis on functional benchmarks that test
    physical persistence and causal reasoning beyond visual fidelity.'
  - 'Shared research pattern: Conditioning video generation on actions to create interactive
    world models for embodied tasks, often leveraging pretrained video diffusion models
    and aligning them with task-specific rewards or preferences.'
  - 'Key differences: State representation ranges from implicit context management
    to explicit latent compression; action conditioning is implemented via frame-level
    modules, diffusion timestep control, learned masks, or heterogeneous autoregression;
    alignment uses DPO, RL with multi-dimensional rewards, or heuristic verifiers.'
  - 'Trend evolution: From 2024''s focus on fine-grained action-conditioned video
    generation and model adaptation, through 2025''s unified pretraining and fast
    autoregressive dynamics, to 2026''s emphasis on physical plausibility, reward-based
    alignment, and critical analysis of test-time scaling limitations.'
  - 'Open questions: Whether current video generation models truly construct explicit
    states, why test-time verifiers fail to scale consistently, and how to design
    functional benchmarks that drive changes in model design rather than just visual
    quality improvements.'
  related_work_outline_zh:
  - 主流方向：通过状态构建和动态建模形式化世界模型要求，并越来越多地强调超越视觉保真度、测试物理持久性和因果推理的功能基准。
  - 研究共性：基于动作生成视频以创建用于具身任务的交互式世界模型，通常利用预训练视频扩散模型，并通过任务特定奖励或偏好将其对齐。
  - 关键差异：状态表示从隐式上下文管理到显式潜在压缩各不相同；动作条件化通过帧级模块、扩散时间步控制、学习掩码或异构自回归实现；对齐使用DPO、基于RL的多维奖励或启发式验证器。
  - 趋势演进：从2024年关注细粒度动作条件视频生成和模型适配，到2025年统一预训练和快速自回归动态，再到2026年强调物理合理性、基于奖励的对齐以及对测试时缩放局限性的批判性分析。
  - 开放问题：当前视频生成模型是否真正构建了显式状态，为什么测试时验证器无法一致缩放，以及如何设计功能基准以驱动模型设计变革，而非仅提升视觉质量。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifying what a world model must represent (state and dynamics)
        and the assumptions under which action-conditioned video generation serves
        as a faithful world model.
      what_remains_open: Whether the proposed formal conditions (e.g., explicit state
        construction, causal dynamics) hold in realistic, noisy environments and align
        with empirical model behavior in complex tasks.
    - line: Scaling laws and guarantees
      what_it_solves: Connecting model size, data, test-time computation, or alignment
        objectives to expected improvements in world model fidelity, controllability,
        and reasoning.
      what_remains_open: Direct validation that claimed scaling properties—such as
        test-time verifier scaling—predict failures and transfer across tasks; current
        evidence shows inconsistent scaling and information bottlenecks.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizing fragmented world-model claims into categories (e.g.,
        implicit vs. explicit state, knowledge integration vs. architectural reformulation)
        to define problem boundaries and evaluation criteria.
      what_remains_open: Whether such taxonomies actually change how researchers design
        models and benchmarks, or remain post-hoc descriptions without driving the
        adoption of functional evaluations over visual metrics.
    consensus:
    - World models for embodied tasks require explicit conditioning on actions to
      generate future observations, moving beyond unconditional video generation.
    - Pretrained video diffusion models provide a strong initialization that can be
      adapted to world models with relatively small domain-specific datasets.
    - Evaluation must move beyond visual fidelity to include physical plausibility,
      logical coherence, and task completion; functional benchmarks are needed.
    - State construction and dynamics modeling are key orthogonal dimensions for designing
      and analyzing video generation as world models.
    disagreements:
    - 'State representation: whether to use implicit context (e.g., all past frames)
      or explicit latent compression, and whether explicit state leads to better long-term
      persistence.'
    - 'Action-conditioning mechanism: frame-level attention modules vs. diffusion
      timestep control vs. learned masks vs. heterogeneous autoregression, with different
      trade-offs in controllability and computational cost.'
    - 'Alignment objective: reinforcement learning from multi-dimensional human preferences
      (ReWorld) vs. DPO with decoupled discriminators (ABot-PhysWorld) vs. heuristic
      verifiers (ViSA), reflecting different assumptions about what makes a rollout
      realistic.'
    - 'Evaluation target: some works focus on spatial reasoning accuracy, others on
      manipulation success or physical law compliance, leading to fragmented benchmarks
      and no unified metric.'
    open_questions:
    - Do current video generation models truly construct an explicit world state,
      or do they rely on implicit memorization that fails under distribution shift?
    - Why does test-time scaling with verifiers fail to improve spatial reasoning
      on complex benchmarks like MMSI-Bench, and what architectural changes can break
      this information bottleneck?
    - How can functional benchmarks be designed to capture physical persistence and
      causal reasoning, and will they actually influence model design beyond the current
      focus on visual quality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么（状态与动态），以及在哪些假设下动作条件化视频生成可作为忠实的世界模型。
      尚未覆盖: 所提出的形式条件（如显式状态构建、因果动态）是否在真实嘈杂环境中成立，并与复杂任务中的经验模型行为一致。
    - 路线: 缩放规律与保证
      解决的问题: 连接模型规模、数据、测试时计算或对齐目标与世界模型保真度、可控性和推理能力的预期改进。
      尚未覆盖: 直接验证声称的缩放特性（如测试时验证器缩放）是否能预测失败和跨任务迁移；当前证据显示缩放不一致且存在信息瓶颈。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的世界模型主张组织为类别（如隐式与显式状态、知识整合与架构重构），以定义问题边界和评估标准。
      尚未覆盖: 这些分类是否真正改变研究者设计模型和基准的方式，还是仅仅作为事后描述，而未能推动功能评估取代视觉指标。
    共识:
    - 面向具身任务的世界模型需要显式地以动作为条件来生成未来观测，超越无条件视频生成。
    - 预训练视频扩散模型提供了强大的初始化，可以通过相对较小的领域特定数据集适配为世界模型。
    - 评估必须超越视觉保真度，涵盖物理合理性、逻辑一致性和任务完成度；需要功能基准。
    - 状态构建和动态建模是设计和分析视频生成作为世界模型的两个关键正交维度。
    分歧:
    - 状态表示：使用隐式上下文（如所有过去帧）还是显式潜在压缩，显式状态是否带来更好的长期持久性。
    - 动作条件化机制：帧级注意力模块、扩散时间步控制、学习掩码与异构自回归，在可控性和计算成本上各有取舍。
    - 对齐目标：基于人类多维偏好的强化学习（ReWorld）与基于解耦判别器的DPO（ABot-PhysWorld）与启发式验证器（ViSA），反映对什么使轨迹逼真的不同假设。
    - 评测目标：一些工作关注空间推理准确度，另一些关注操作成功或物理规律遵循，导致基准碎片化且缺乏统一度量。
    开放问题:
    - 当前视频生成模型是否真正构建了显式世界状态，还是依赖于隐式记忆，在分布偏移下会失败？
    - 为什么测试时验证器缩放无法在复杂基准如MMSI-Bench上改善空间推理，哪些架构变化可以打破这一信息瓶颈？
    - 如何设计功能基准以捕捉物理持久性和因果推理，它们是否真的能超越当前对视觉质量的关注，影响模型设计？
