  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving world models
      what_it_solves: Generating multi-view, long-horizon future frames for scene
        prediction and closed-loop simulation, as demonstrated by MaskGWM using diffusion
        transformers with mask reconstruction.
      what_remains_open: Generalization across different driving datasets (e.g., from
        Nuscenes to Waymo) remains a zero-shot challenge; real-world safety alignment
        is not measured.
    - line: Embodied robot world models with video generation
      what_it_solves: Learning compositional or physics-informed video generation
        from language instructions and actions, enabling robot imagination and policy
        pretraining, as shown by RoboDreamer, RoboScape, and Unified World Models.
      what_remains_open: Physical plausibility metrics are still underdeveloped; generalization
        to unseen primitive combinations or novel embodiments is limited; evaluation
        is mostly in simulation.
    - line: Contextual and memory-augmented world models for interactive environments
      what_it_solves: Improving zero-shot generalization to unseen dynamics by conditioning
        on context (cRSSM) or enabling efficient transformer-based world models for
        games (STORM); also benchmarking spatial consistency and memory (LoopNav,
        MIND).
      what_remains_open: cRSSM assumes observable context; STORM is limited to Atari;
        memory consistency benchmarks reveal that long-term coherence and cross-action-space
        generalization are still major challenges.
    consensus:
    - World models are implemented as generative models of future observations, predominantly
      using video prediction or latent state rollouts.
    - Actions are integrated as conditional inputs to the generation process, either
      via separate diffusion timesteps or recurrent state-space models.
    - Recent works emphasize pretraining on diverse, large-scale datasets to improve
      generalization and downstream policy performance.
    - Evaluation increasingly includes metrics beyond pixel-level fidelity, such as
      spatial consistency, memory retention, and action controllability.
    disagreements:
    - 'Representation: Some models use explicit latent dynamics (e.g., RSSM in cRSSM)
      while others directly generate pixels via diffusion (e.g., MaskGWM, RoboDreamer).'
    - 'Supervision signal: Physics-informed models add auxiliary tasks like depth
      or keypoint prediction (RoboScape), whereas pure video diffusion models rely
      only on reconstruction and adversarial losses.'
    - 'Evaluation target: Driving models are tested on zero-shot dataset transfer;
      robot models are validated by policy training in simulation; game and memory
      benchmarks focus on spatial consistency and action control without downstream
      tasks.'
    - 'Interaction mode: UWM couples video and action diffusion in a single transformer,
      allowing flexible policy/dynamics representation, while others keep world model
      and policy separate.'
    open_questions:
    - How can we design physics-informed metrics that correlate with real-world robot
      success?
    - What is the minimal context or memory architecture needed to maintain long-term
      spatial consistency across viewpoint changes?
    - Can world models pretrained on one embodiment (e.g., driving) transfer to other
      embodied tasks (e.g., manipulation) with minimal fine-tuning?
    - What are the failure modes of current action-controllable video generation when
      deployed in novel, open-ended action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶世界模型
      解决的问题: 生成多视角、长时域的未来帧，用于场景预测和闭环仿真，如MaskGWM使用扩散Transformer与掩码重建。
      尚未覆盖: 跨不同驾驶数据集（如Nuscenes到Waymo）的泛化仍是零样本挑战；真实世界安全性对齐尚未衡量。
    - 路线: 具身机器人世界模型与视频生成
      解决的问题: 从语言指令和动作学习组合式或物理信息驱动的视频生成，实现机器人想象和策略预训练，如RoboDreamer、RoboScape和Unified
        World Models。
      尚未覆盖: 物理合理性指标尚不成熟；对未见过的原语组合或新本体的泛化受限；评估主要在仿真中。
    - 路线: 交互环境中的上下文与记忆增强世界模型
      解决的问题: 通过上下文条件化（cRSSM）提升零样本泛化，或构建高效Transformer世界模型用于游戏（STORM）；同时建立空间一致性和记忆的基准（LoopNav,
        MIND）。
      尚未覆盖: cRSSM假设上下文可观测；STORM仅限于Atari；记忆一致性基准揭示长期连贯性和跨动作空间泛化仍是主要挑战。
    共识:
    - 世界模型被实现为未来观测的生成模型，主要采用视频预测或潜在状态推演。
    - 动作作为条件输入集成到生成过程中，通过独立的扩散时间步或循环状态空间模型。
    - 近期工作强调在多样化、大规模数据集上预训练，以提升泛化能力和下游策略性能。
    - 评估逐渐超越像素级保真度，纳入空间一致性、记忆保持和动作可控性等指标。
    分歧:
    - 表示方式：部分模型使用显式潜在动力学（如cRSSM的RSSM），而其他模型通过扩散直接生成像素（如MaskGWM、RoboDreamer）。
    - 监督信号：物理信息驱动的模型添加深度或关键点预测等辅助任务（RoboScape），而纯视频扩散模型仅依赖重建和对抗损失。
    - 评测目标：驾驶模型以零样本跨数据集迁移为测试；机器人模型通过仿真中的策略训练验证；游戏和记忆基准侧重于空间一致性和动作控制，不涉及下游任务。
    - 交互模式：UWM在单个Transformer中耦合视频和动作扩散，允许灵活的策略/动力学表示，而其他方法将世界模型与策略分离。
    开放问题:
    - 如何设计与真实机器人成功相关的物理信息指标？
    - 维持跨视角变化的长期空间一致性所需的最小上下文或记忆架构是什么？
    - 在一个本体（如驾驶）上预训练的世界模型能否以最小微调迁移到其他具身任务（如操控）？
    - 当前动作可控视频生成在部署到新颖、开放动作空间时有哪些失败模式？
