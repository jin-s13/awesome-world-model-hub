  related_work_outline:
  - 'Mainstream direction: Transforming pretrained video generative models into controllable,
    interactive world simulators for autonomous driving and robotics, with a strong
    emphasis on action fidelity, dynamic consistency, and real-time closed-loop execution.'
  - 'Shared research pattern: Building or adapting benchmarks and system pipelines
    that quantify key simulator properties (spatial consistency, action controllability,
    latency) and using them to iteratively improve model architectures and training
    strategies.'
  - 'Key differences: Some works focus on offline evaluation benchmarks while others
    target real-time interactive deployment; physical plausibility is addressed either
    through explicit physics-informed losses or through data-driven motion priors;
    the definition of consistency varies from scene graph invariance to trajectory-level
    action fidelity.'
  - 'Trend evolution: From 2024 to 2026 the field moves from general-purpose video
    generation toward domain-specific, low-latency simulators with closed-loop interaction,
    supported by newly introduced benchmarks and a growing emphasis on deployability
    on single GPUs.'
  - 'Open questions: Whether current benchmarks capture real-world deployment variability,
    how to maintain long-horizon consistency under autoregressive rollout, and how
    to trade off generation quality, interactivity, and physical plausibility in safety-critical
    applications.'
  related_work_outline_zh:
  - 主流方向：将预训练视频生成模型转化为可控、交互式的世界模拟器，用于自动驾驶和机器人，重点提升动作保真度、动态一致性和实时闭环执行能力。
  - 研究共性：构建或适配基准测试和系统流水线，量化关键模拟器属性（空间一致性、动作可控性、延迟），并以此为驱动迭代改进模型架构和训练策略。
  - 关键差异：部分工作聚焦离线评估基准，部分追求实时交互部署；物理合理性通过显式物理信息损失或数据驱动的运动先验实现；一致性的定义从场景图不变性到轨迹级动作保真度不等。
  - 趋势演进：2024—2026 年，领域从通用视频生成走向特定领域、低延迟、闭环交互的模拟器，伴随新基准的引入以及对单 GPU 可部署性的日益重视。
  - 开放问题：当前基准是否覆盖真实世界部署的多样性；如何在自回归推演中保持长时域一致性；如何在安全关键应用中权衡生成质量、交互性与物理合理性。
  literature_review:
    line_of_work_matrix:
    - line: Reproducible evaluation benchmarks and datasets
      what_it_solves: Quantifying system-level properties such as spatial consistency
        and action fidelity for world models, enabling standardized comparison.
      what_remains_open: Existing benchmarks (e.g., LoopNav, ACT-Bench) are restricted
        to specific environments like Minecraft or nuScenes; their realism, sensor
        noise coverage, and correlation with downstream task performance remain unverified.
    - line: Real-time closed-loop simulation and deployment optimization
      what_it_solves: Integrating world models into autonomous driving or robotics
        closed loops with low latency and high-fidelity, action-controllable generation
        for policy evaluation or training.
      what_remains_open: Long-horizon consistency degrades over extended sequences;
        generalization to new sensor configurations and complex scenarios is limited;
        real-time guarantees under multi-GPU or extreme conditions are missing.
    - line: Physics- and context-aware world model integration
      what_it_solves: Injecting physical knowledge (depth, keypoint dynamics) or context
        variables into generation to improve dynamic plausibility and zero-shot generalization,
        moving beyond purely data-driven appearance.
      what_remains_open: Physical priors are tailored to narrow domains (e.g., robotic
        manipulation); the approach assumes observable context values, which is often
        unrealistic; generalization to unseen physical interactions remains weak.
    consensus:
    - World models must evolve from static video generation to interactive, controllable
      simulators that support action-conditioned rollout and dynamic consistency.
    - Standardized benchmarks covering spatial consistency, action fidelity, and real-time
      metrics are essential to drive systematic progress in system-level simulator
      design.
    - Leveraging pretrained video generative models as backbones for world simulators
      is a dominant paradigm, with lightweight adapters added for controllability
      and task-specific alignment.
    disagreements:
    - 'Evaluation targets differ: some works prioritize scene graph consistency under
      spatial loops, while others emphasize trajectory-level action fidelity, leading
      to incompatible metrics for physical and temporal coherence.'
    - 'Interaction modes vary: some simulators are used for offline video generation
      and passive metric evaluation, whereas others are integrated into real-time
      closed-loop policy training or reward modeling, placing different demands on
      latency and autoregressive stability.'
    - Physical plausibility is achieved through explicitly engineered losses (e.g.,
      depth prediction, keypoint dynamics) in some systems, while others rely entirely
      on motion-reinforced losses on pretrained models, without explicit physics modeling.
    - 'Deployment domains introduce distinct requirements: autonomous driving simulators
      demand multi-view geometric consistency and safety-critical fidelity, while
      robotic simulators emphasize physical interaction and embodiment, making cross-domain
      framework unification unresolved.'
    open_questions:
    - How can we build a unified simulator evaluation suite that simultaneously measures
      spatial, temporal, action, and physical consistency across diverse interactive
      domains?
    - What guarantees are needed to trust generative world simulators in safety-critical
      closed-loop applications, and how can we verify long-horizon stability under
      distribution shift?
    - To what extent can explicit physics knowledge be scaled to open-world settings
      without sacrificing the flexibility and diversity of purely data-driven video
      generation?
    - What are the minimal latency and resource requirements for real-time interactive
      world models, and how do they trade off against visual fidelity and sampling
      efficiency in model-based reinforcement learning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可复现的评估基准与数据集
      解决的问题: 量化世界模型的空间一致性、动作保真度等系统级属性，提供标准化对比工具。
      尚未覆盖: 现有基准（如 LoopNav、ACT-Bench）局限于 Minecraft、nuScenes 等特定环境，其真实性、传感器噪声覆盖以及与下游任务性能的关联性尚未验证。
    - 路线: 实时闭环模拟与部署优化
      解决的问题: 将世界模型集成到自动驾驶或机器人闭环中，以低延迟、高保真、动作可控的生成能力支持策略评估或训练。
      尚未覆盖: 长时域一致性在扩展序列中退化；对新传感器配置和复杂场景的泛化有限；多 GPU 或极端条件下的实时性保障缺失。
    - 路线: 物理与上下文感知的世界模型集成
      解决的问题: 将物理知识（深度、关键点动力学）或上下文变量注入生成过程，提升动态合理性和零样本泛化，超越纯数据驱动外观。
      尚未覆盖: 物理先验局限于狭窄领域（如机器人操作）；方法假设上下文值可观测，现实中常不成立；对未见物理交互的泛化能力仍然薄弱。
    共识:
    - 世界模型需要从静态视频生成演进为可交互、可控的模拟器，支持动作条件推演和动态一致性。
    - 覆盖空间一致性、动作保真度与实时性指标的标准化基准，对推动系统级模拟器设计的系统化进展至关重要。
    - 以预训练视频生成模型为骨干构建世界模拟器已成为主流范式，通过轻量级适配器增加可控性和任务对齐。
    分歧:
    - 评测目标不同：部分工作优先考虑空间循环下的场景图一致性，另一些则强调轨迹级动作保真度，导致物理和时间一致性的度量标准不兼容。
    - 交互模式差异：有些模拟器用于离线视频生成与被动指标评估，另一些则集成到实时闭环策略训练或奖励建模中，对延迟和自回归稳定性提出不同要求。
    - 物理合理性实现方式不同：部分系统通过显式设计的损失函数（如深度预测、关键点动力学）引入物理知识，而其他系统完全依赖预训练模型上的运动增强损失，无显式物理建模。
    - 部署领域带来不同约束：自动驾驶模拟器要求多视图几何一致性和安全关键保真度，机器人模拟器则强调物理交互与具身性，跨领域框架的统一尚未解决。
    开放问题:
    - 如何构建统一的模拟器评估套件，同时衡量跨多交互领域的空间、时间、动作与物理一致性？
    - 在安全关键的闭环应用中，需要何种保证才能信任生成式世界模拟器？如何验证分布偏移下的长时域稳定性？
    - 显式物理知识在多大程度上能扩展到开放世界设定，而不牺牲纯数据驱动视频生成的灵活性和多样性？
    - 实时交互式世界模型的最低延迟和资源需求是什么？在基于模型的强化学习中，它们如何与视觉保真度和采样效率权衡？
