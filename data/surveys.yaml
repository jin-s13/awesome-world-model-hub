  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for world models
      what_it_solves: Maps fragmented generative video, embodied agent, and autonomous
        driving research into directions, technical challenges, and future roadmaps.
      what_remains_open: Coverage completeness and whether synthesis is driven by
        systematic evidence rather than selected examples; rapid publication pace
        can outdate taxonomies.
    - line: Comparative evaluation and benchmark synthesis
      what_it_solves: Summarizes benchmark designs, metrics, and evaluation settings
        across interactive video, open-world, game-engine, driving, and robotics domains.
      what_remains_open: Whether results and metrics are compatible across settings,
        and whether proposed evaluation prescriptions are implemented and tested.
    - line: Open problem and gap mapping
      what_it_solves: 'Turns broad literature coverage into concrete gaps: action-conditioned
        controllability, long-horizon memory, real-time responsiveness, out-of-sight
        dynamics, and closed-loop evaluation.'
      what_remains_open: Prioritizing which gaps matter most for progress and connecting
        them to resource-aware, verifiable evaluation methods.
    consensus:
    - World-model surveys converge on video generation and latent dynamics as a shared
      substrate for simulation across interaction, driving, and robotics.
    - They organize the field by design axes such as application scenario, world-state
      evolution, modality, latent representation, and structural priors.
    - They identify recurring gaps around action-conditioned control, long-horizon
      consistency, real-time interactivity, and evaluation mismatch.
    - Conceptual taxonomies and evaluation frameworks often remain untested, so their
      claims are provisional rather than empirically validated.
    disagreements:
    - Synthesis scope ranges from general generative world-model overviews to domain-specific
      driving taxonomies, changing which methods and benchmarks are central.
    - 'Evaluation treatment differs: some work compares existing benchmarks across
      domains, while others propose new metric suites or closed-loop prescriptions
      without implementation.'
    - Control and deployment assumptions differ, including language-composed video
      primitives, ego-motion and pose control, persistent global state, and physical
      robot learning with sparse rewards.
    open_questions:
    - Can taxonomy coverage be made systematic enough to avoid omission of recent
      methods in a fast-moving publication landscape?
    - Are cross-domain benchmark and metric comparisons valid when interaction mode,
      frame horizon, and reward or control signal differ?
    - Which open gaps, such as long-horizon memory versus real-time interactivity
      versus out-of-sight dynamics, should receive priority in next roadmaps?
    - How should conceptual evaluation frameworks be transformed into implementation-tested
      benchmarks with reproducible results?
    - Do current surveys sufficiently separate bibliometric attention and score signals
      from methodological and reproducibility evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: World model 分类体系与路线图综合
      解决的问题: 将生成视频、具身智能体和自动驾驶等碎片化研究整理为方向、技术挑战与未来路线图。
      尚未覆盖: 覆盖完整性，以及综合是否基于系统证据而非选择性示例；领域发展快，分类法可能滞后。
    - 路线: 对比评测与基准综合
      解决的问题: 总结交互式视频、开放世界、游戏引擎、自动驾驶和机器人中的基准设计、指标与评测设置。
      尚未覆盖: 不同设置下结果与指标是否真正兼容，以及所提评测方案是否经过实现与测试。
    - 路线: 开放问题与缺口映射
      解决的问题: 将文献覆盖转化为具体缺口：动作条件可控性、长时记忆、实时响应、视线外动态与闭环评估。
      尚未覆盖: 哪些缺口最值得优先推进，以及如何连接资源感知且可验证的评估方法。
    共识:
    - World model 综述趋向将视频生成和潜在动态作为交互、驾驶与机器人模拟的共同基础。
    - 按应用场景、世界状态演化、模态、潜在表示和结构先验组织领域。
    - 反复识别动作条件控制、长时一致性、实时交互与评测不匹配等缺口。
    - 概念性分类法和评估框架常未经验证，因此结论仍具暂时性。
    分歧:
    - 综合范围从通用生成式 world model 概述到领域特定驾驶分类法不等，影响核心方法与基准选择。
    - 评测处理不同：有的比较跨领域现有基准，有的提出新指标或闭环方案但未实现。
    - 控制与部署假设不同，包含语言组合视频原语、自我运动与姿态控制、持久全局状态，以及稀疏奖励的物理机器人学习。
    开放问题:
    - 如何让分类法覆盖足够系统，避免在快速出版环境中遗漏新方法？
    - 当交互模式、帧时域和奖励或控制信号不同时，跨领域基准与指标比较是否有效？
    - 在长时记忆、实时交互和视线外动态之间，哪些缺口应在下一路线图中优先推进？
    - 如何将概念性评测框架转化为经过实现与复现测试的基准？
    - 当前综述是否充分区分文献关注度/评分信号与方法学、复现性证据？
