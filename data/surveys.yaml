  related_work_outline:
  - 'Mainstream direction: Action-conditioned video generative models are being built
    or adapted as world models for embodied and robotic tasks; examples include UWM
    for unified video-action diffusion and IRASim for fine-grained frame prediction.'
  - 'Shared research pattern: Treat video prediction as dynamics conditioned on actions;
    use pretraining or adapter-based reuse, as in HMA and AVID; then add alignment
    or verification to improve action-frame consistency, physical plausibility, and
    downstream usefulness.'
  - 'Key differences: Architecture and action injection differ (unified diffusion
    timesteps, frame-level conditioning, learned masks, parallel spatial blocks);
    supervision differs (reward alignment/DPO, test-time verifiers, direct pretraining);
    evaluation targets differ across manipulation fidelity, planning, physical benchmarks,
    and spatial reasoning.'
  - 'Trend evolution: Evidence moves from fine-grained and adapter-based video world
    models around 2024, to unified video-action pretraining and faster autoregressive
    simulators in 2025, then to physics/reward alignment and test-time verification
    by 2026; the span is narrow, so this trend is within the current frontier.'
  - 'Open questions: Whether visual fidelity transfers to decision-making, whether
    formal state/dynamics definitions can be made into functional benchmarks, how
    reward-aligned models generalize beyond contact-rich tasks, and why verifier-based
    scaling fails on some spatial reasoning benchmarks.'
  related_work_outline_zh:
  - 主流方向：以动作条件化视频生成模型作为世界模型，面向机器人与具身任务；例如UWM统一视频-动作扩散，IRASim做细粒度帧预测。
  - 研究共性：将视频预测视为以动作条件化的动力学建模；通过预训练或适配现有视频生成器构建，如HMA预训练掩码自回归、AVID适配冻结视频生成器；再用对齐或验证提升动作一致性、物理合理性和下游能力。
  - 关键差异：结构与动作注入方式不同，例如统一扩散时间步、帧级条件模块、冻结模型掩码、并行空间动作块；监督方式不同，如偏好奖励/DPO、测试时验证、直接预训练；评测目标覆盖操作视频、规划、物理基准和空间推理。
  - 趋势演进：证据显示2024年前后聚焦细粒度动作条件世界模型和适配器方法，2025年出现统一视频-动作预训练与更快的自回归模拟器，2026年转向物理/奖励对齐与测试时验证；时间跨度较窄，属于当前前沿。
  - 开放问题：视觉真实度能否转化为决策能力；形式化状态/动力学定义如何变成功能基准；奖励对齐模型能否跨域泛化；测试时验证为何在部分空间推理基准上无法扩展。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video world models for robot dynamics and planning
      what_it_solves: Predicts future frames from observations and actions, enabling
        policy evaluation, model-based planning, and synthetic rollouts without a
        hand-coded simulator.
      what_remains_open: Whether visual quality improvements translate into better
        control remains underevidenced; several papers lack visible limitation, code,
        or dataset details, so reproducibility is a verification gap.
    - line: Adapting pretrained video generators into world models
      what_it_solves: Reuses large pretrained video generators with limited action-labeled
        data or without accessing model parameters, lowering training cost and supporting
        closed-source backbones.
      what_remains_open: Still requires domain-specific action-labeled video and may
        inherit pretrained model bias; there is no direct evidence of generalization
        beyond tested game and robotic domains.
    - line: Aligning and post-training world models for physical plausibility
      what_it_solves: Uses human-preference rewards or DPO-style optimization to suppress
        unphysical behavior while preserving visual quality and task logic.
      what_remains_open: Validation concentrates on contact-rich manipulation; preference
        collection is subjective and costly, and broad-domain generalization is not
        demonstrated.
    - line: Formalizing state, dynamics, and functional evaluation of video world
        models
      what_it_solves: Provides a conceptual taxonomy separating state construction
        from dynamics modeling and argues for functional benchmarks beyond visual
        fidelity.
      what_remains_open: The taxonomy is not empirically validated; physical persistence
        and causal reasoning remain conceptually highlighted but not operationalized
        as metrics or guarantees.
    - line: Test-time verification for world-model spatial reasoning
      what_it_solves: Grounds trajectory selection in frame-anchored assertions, exposing
        verifier calibration problems and improving spatial reasoning on SAT-Real.
      what_remains_open: No verifier achieves consistent scaling on MMSI-Bench, suggesting
        current world models act as an information bottleneck; generalization across
        spatial tasks is unresolved.
    consensus:
    - World models are being operationalized as action-conditioned video generators
      rather than explicit symbolic simulators.
    - Large-scale pretraining or adapter-based reuse of video generation models is
      the dominant construction route.
    - Action conditioning, temporal consistency, and physical coherence are treated
      as core requirements for downstream use.
    - Evaluation is expanding from visual quality toward planning, policy evaluation,
      physical plausibility, and spatial reasoning.
    disagreements:
    - 'Architecture and action injection differ: unified diffusion timesteps, frame-level
      action-conditioning modules, masked autoregression, learned masks on frozen
      models, and parallel spatial action blocks.'
    - 'Supervision and adaptation differ: preference-based reward alignment or DPO,
      test-time verifiers, and direct action-conditioned pretraining.'
    - Evaluation targets differ across manipulation video fidelity, model-based planning
      metrics, zero-shot physical plausibility, and spatial reasoning benchmarks.
    - 'Deployment settings differ: some methods adapt closed-source pretrained video
      models without parameter access, while others train open large-scale models
      on heterogeneous robot data.'
    open_questions:
    - Under what measurable conditions does improved visual world-model fidelity transfer
      to better policies, planning, or spatial reasoning?
    - Can formal distinctions between state construction and dynamics modeling be
      operationalized into benchmarks that expose persistence and causal failures?
    - Do physical-alignment methods generalize beyond contact-rich manipulation and
      closed-domain evaluation sets?
    - Why do frame-anchored test-time verifiers improve SAT-Real but fail to scale
      on MMSI-Bench, and is that failure caused by an imagination bottleneck?
