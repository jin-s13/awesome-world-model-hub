  related_work_outline:
  - 'Mainstream direction: Building generative world models with improved architectures
    (Diffusion Transformers, VAE-Transformer hybrids) and training objectives (mask
    reconstruction, physics-informed losses, joint video-action diffusion) for high-fidelity
    video prediction and policy learning in robotics and autonomous driving.'
  - 'Shared research pattern: Training latent dynamics models or video generators
    via self-supervised learning on visual inputs, then using the learned world model
    for downstream tasks such as planning, policy optimization, or data augmentation;
    evaluation commonly involves visual fidelity, task performance, and generalization
    to unseen conditions.'
  - 'Key differences: Domain specialization (driving, robotics, Atari, open-world
    environments) leads to distinct input modalities, action interfaces, and evaluation
    protocols; models differ in how they incorporate structure—explicit physics knowledge,
    compositional language parsing, contextual conditioning, or memory consistency—and
    in whether they prioritize generation quality, sample efficiency, or zero-shot
    generalization.'
  - 'Trend evolution: From 2018 Dreamer-style latent dynamics models to 2023–2025
    transformer-based (STORM) and diffusion-based (MaskGWM, UWM) architectures; a
    recent shift toward physics-informed (RoboScape) and compositional (RoboDreamer)
    designs, and the emergence of dedicated benchmarks (LoopNav, MIND) that probe
    spatial consistency and memory rather than only task performance, indicating a
    maturing evaluation landscape.'
  - 'Open questions: How to achieve long-term memory consistency and physical plausibility
    without sacrificing generation speed; how to generalize world models across unseen
    action spaces, embodiments, and dynamics with limited or no context observability;
    how to design unified evaluation protocols that disentangle model capability from
    planner, controller, and dataset biases.'
  related_work_outline_zh:
  - 主流方向：通过改进架构（扩散变换器、VAE-Transformer混合）和训练目标（掩码重建、物理信息损失、联合视频-动作扩散）构建生成式世界模型，用于机器人和自动驾驶中的高保真视频预测与策略学习。
  - 研究共性：通过视觉输入的自监督学习训练潜在动力学模型或视频生成器，然后利用学习到的世界模型进行规划、策略优化或数据增强；评估通常涉及视觉保真度、任务性能和对未见条件的泛化。
  - 关键差异：领域专精（驾驶、机器人、Atari、开放世界环境）导致不同的输入模态、动作接口和评估协议；模型在融入结构的方式上存在差异——显式物理知识、组合式语言解析、上下文条件化或记忆一致性——且侧重点不同，有的优先生成质量，有的优先样本效率或零样本泛化。
  - 趋势演进：从2018年Dreamer式潜在动力学模型，发展到2023–2025年基于Transformer（STORM）和扩散（MaskGWM, UWM）的架构；近期出现物理信息驱动（RoboScape）和组合式（RoboDreamer）设计，以及专门评估空间一致性和记忆而非仅任务性能的基准（LoopNav,
    MIND），表明评估体系正在成熟。
  - 开放问题：如何在保持长时域记忆一致性和物理合理性的同时不牺牲生成速度；如何在上下文有限或不可观测的情况下将世界模型泛化到未见动作空间、具身形态和动力学；如何设计统一的评估协议以分离模型能力与规划器、控制器和数据集偏差。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures
      what_it_solves: Designing expressive backbones (Diffusion Transformers, VAE-Transformer
        hybrids) and training objectives (mask reconstruction, joint video-action
        diffusion, temporal depth prediction) to synthesize high-fidelity, temporally
        coherent video rollouts from sensory observations and actions.
      what_remains_open: Verification of long-horizon consistency beyond reported
        metrics, transferability of architectural choices across domains (e.g., from
        driving to manipulation), and the trade-off between generation quality and
        inference speed for real-time control.
    - line: Generalization via structured world models
      what_it_solves: Enabling world models to adapt to unseen dynamics, tasks, or
        goals by incorporating context (cRSSM), compositional language primitives
        (RoboDreamer), or pretraining on large-scale multitask data (UWM).
      what_remains_open: Reliance on observed context, predefined primitives, or curated
        pretraining data limits deployment in open-world settings; evidence is confined
        to narrow task suites, leaving generalization to completely novel dynamics
        or embodiments unverified.
    - line: Evaluation protocols for world model capabilities
      what_it_solves: Quantifying core abilities beyond visual quality—spatial consistency
        (LoopNav), memory consistency and action control (MIND)—to expose failure
        modes of current models.
      what_remains_open: Benchmarks are recent and limited to simulated or game environments;
        their correlation with real-world deployment success is unknown, and they
        do not yet cover physical reasoning or interaction with deformable objects.
    consensus:
    - Learning a predictive model of the environment from visual observations and
      actions is a viable path toward sample-efficient policy learning and planning.
    - Transformer-based and diffusion-based architectures are increasingly adopted
      as the backbone for world models, replacing earlier RNN-centric designs.
    - Self-supervised or unsupervised pretraining on video data, with or without actions,
      is a key strategy to improve generalization.
    disagreements:
    - Whether to embed explicit physics knowledge (e.g., depth, keypoints) into the
      model or rely on purely data-driven emergent dynamics.
    - Whether the world model should operate in raw pixel space, latent space, or
      a hybrid (e.g., feature-level mask reconstruction) and how this choice affects
      downstream task performance.
    - 'How to measure world model quality: task-centric metrics (RL scores, policy
      robustness) vs. self-contained consistency metrics (spatial consistency, memory)
      vs. generation fidelity (FVD, PSNR), with no unified standard.'
    - 'The role of action data: some models require actions for dynamics learning,
      while others aim to learn from action-free videos, reflecting different assumptions
      about data availability.'
    open_questions:
    - Can current world models reliably maintain object permanence and spatial consistency
      over hundreds of steps without accumulating catastrophic errors?
    - What is the minimal set of inductive biases (physics, compositionality, context)
      needed for a world model to generalize to novel dynamics and task combinations
      without task-specific fine-tuning?
    - How do we design benchmarks that isolate world model capability from the impact
      of planners, controllers, and data collection policies, given that most evaluations
      conflate these components?
    - What are the scaling laws for world model training in terms of data diversity,
      model size, and compute, and do they translate to predictable gains in real-world
      robotics and autonomous driving?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构
      解决的问题: 设计表达力强的骨干网络（扩散变换器、VAE-Transformer混合）和训练目标（掩码重建、联合视频-动作扩散、时间深度预测），以从感官输入和动作合成高保真、时间连贯的视频序列。
      尚未覆盖: 超出报告指标的长时域一致性验证，架构选择在不同领域（如从驾驶到操作）的可迁移性，以及生成质量与实时控制所需推理速度之间的权衡。
    - 路线: 基于结构化世界模型的泛化
      解决的问题: 通过引入上下文（cRSSM）、组合式语言原语（RoboDreamer）或在大规模多任务数据上预训练（UWM），使世界模型能够适应未见动力学、任务或目标。
      尚未覆盖: 对可观测上下文、预定义原语或精选预训练数据的依赖限制了开放世界中的部署；证据局限于狭窄的任务套件，向完全新颖的动力学或具身形态的泛化未经验证。
    - 路线: 世界模型能力的评估协议
      解决的问题: 量化视觉质量以外的核心能力——空间一致性（LoopNav）、记忆一致性和动作控制（MIND）——以揭示当前模型的失效模式。
      尚未覆盖: 基准较新且限于模拟或游戏环境；它们与真实世界部署成功之间的相关性未知，且尚未涵盖物理推理或与可变形物体的交互。
    共识:
    - 从视觉观察和动作中学习环境预测模型是实现样本高效策略学习和规划的可行路径。
    - 基于Transformer和扩散的架构正越来越多地被用作世界模型的骨干，取代了早期以RNN为中心的设计。
    - 在视频数据上进行自监督或非监督预训练（无论是否包含动作）是提升泛化能力的关键策略。
    分歧:
    - 是否将显式物理知识（如深度、关键点）嵌入模型，还是完全依赖数据驱动的涌现动力学。
    - 世界模型应在原始像素空间、潜在空间还是混合空间（如特征级掩码重建）中运行，以及这种选择如何影响下游任务性能。
    - 如何衡量世界模型质量：以任务为中心的指标（RL分数、策略鲁棒性）vs. 自我一致的一致性指标（空间一致性、记忆）vs. 生成保真度（FVD、PSNR），尚无统一标准。
    - 动作数据的作用：一些模型需要动作进行动力学学习，而另一些则试图从无动作视频中学习，这反映了对数据可用性的不同假设。
    开放问题:
    - 当前的世界模型能否在数百步内可靠地保持物体恒存性和空间一致性，而不累积灾难性误差？
    - 使世界模型能够在无需任务特定微调的情况下泛化到新颖动力学和任务组合所需的最小归纳偏置集（物理、组合性、上下文）是什么？
    - 如何设计基准以将世界模型能力与规划器、控制器和数据收集策略的影响隔离开来，鉴于大多数评估将这些组件混为一谈？
    - 世界模型训练在数据多样性、模型规模和算力方面的缩放律是什么，它们是否能转化为现实世界机器人和自动驾驶中可预测的收益？
