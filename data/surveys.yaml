  related_work_outline:
  - 'Mainstream direction: Action-conditioned video world models built on diffusion
    transformers or masked autoregression, aimed at robot manipulation and embodied
    decision-making.'
  - 'Shared research pattern: Coupling observations and actions in a generative model,
    pretraining on large robot video/action datasets, and using generated rollouts
    for policy, planning, or synthetic data.'
  - 'Key differences: Modeling and adaptation routes differ, including unified diffusion
    pretraining, adapter-based adaptation to closed-source video models, autoregressive
    token prediction, and post-training alignment via rewards or preferences.'
  - 'Trend evolution: From high-fidelity video generation toward physical plausibility,
    action-frame alignment, and functional evaluation; recent work adds benchmarks
    and verifiers for spatial reasoning and causal state.'
  - 'Open questions: Whether visual fidelity implies persistent causal world state,
    whether models transfer beyond trained embodiments, and how to build shared functional
    benchmarks for physical realism and decision utility.'
  related_work_outline_zh:
  - 主流方向：面向机器人操作和具身决策的动作条件视频世界模型，以扩散Transformer或掩码自回归为主。
  - 研究共性：在生成模型中耦合观测与动作，利用大规模机器人视频/动作数据预训练，并以生成轨迹支持策略、规划或合成数据。
  - 关键差异：建模与适配路线不同，包括统一扩散预训练、对闭源视频扩散模型的适配、自回归预测，以及基于奖励或偏好的后训练对齐。
  - 趋势演进：从追求视频保真度转向强调物理合理性、动作-帧对齐和功能评测，并开始引入基准和验证器考察空间推理和因果状态。
  - 开放问题：视觉保真是否等价于持续的因果世界状态，跨本体和任务迁移是否成立，以及如何构建公认的物理合理性与决策效用基准。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video diffusion world models for robot manipulation (e.g.,
        UWM, IRASim)
      what_it_solves: Represents policy, forward/inverse dynamics, and video generation
        in one model; improves action-frame alignment and enables model-based planning.
      what_remains_open: Evidence mostly reports visual quality and selected task
        metrics; transfer beyond trained embodiments and formal conditions for policy
        improvement are not established.
    - line: Adaptation of pretrained video diffusion models to action-conditioned
        world models (e.g., AVID)
      what_it_solves: Turns closed-source video generators into action-conditioned
        predictors using a learned mask and a small labelled dataset, avoiding direct
        parameter access.
      what_remains_open: Assumes domain-specific action-labelled videos exist; generalization
        beyond video game and robot settings is not demonstrated, and inherited pretrained-model
        biases remain.
    - line: Heterogeneous autoregressive video dynamics for fast robot simulation
        (e.g., HMA)
      what_it_solves: Pre-trains across embodiments, domains, and tasks and accelerates
        action-conditioned video generation for real-time simulation and synthetic
        data.
      what_remains_open: Reported speed and controllability gains lack detailed limitations;
        downstream policy evaluation and post-training simulator validity are only
        partially evidenced.
    - line: Preference- or reward-aligned embodied world models (e.g., ReWorld, ABot-PhysWorld)
      what_it_solves: Post-trains video world models to match human preferences or
        physical plausibility criteria, improving physical fidelity and task logic.
      what_remains_open: Evaluations center on manipulation; human preference data
        may be subjective or costly, and cross-domain generalization plus reproducible
        artifacts are not shown.
    - line: Functional evaluation and conceptual state/dynamics taxonomy (e.g., ViSA,
        A Mechanistic View on Video Generation as World Models)
      what_it_solves: Identifies state construction and dynamics modeling as the core
        distinction; probes test-time verifiers and advocates benchmark-oriented evaluation.
      what_remains_open: Current models may form an information bottleneck in spatial
        reasoning; functional benchmarks for persistence and causality are advocated
        but not yet widely adopted, and formal conditions remain unvalidated.
    consensus:
    - The field is converging on action-conditioned video prediction as a central
      route to world models for embodied decision-making.
    - Multiple works agree that observation and action should be coupled in a generative
      objective and that large-scale robot video data can provide useful dynamics
      priors.
    - There is growing agreement that visual fidelity alone is not sufficient; action
      alignment, physical plausibility, and downstream policy or planning utility
      matter.
    - Several papers recognize evaluation and verification as weak points, especially
      when verifier signals or benchmark improvements do not transfer across settings.
    disagreements:
    - 'Generation paradigm differs: unified diffusion over video and action, masked
      autoregression, or adapting an existing pretrained video diffusion model.'
    - 'Alignment approach differs: learned mask adaptation without parameter access,
      RL from multi-dimensional reward models, DPO-style post-training, or no explicit
      alignment.'
    - 'Evaluation target differs: frame quality, policy evaluation correlation, physical
      plausibility, or spatial reasoning accuracy; no single benchmark resolves all.'
    - 'Data and model assumptions differ: open pretraining on heterogeneous robot
      data versus requiring action-labelled domain data and a fixed pretrained base
      model.'
    open_questions:
    - What formal assumptions connect action-conditioned video generation to reliable
      forward dynamics and policy improvement beyond visual realism?
    - Can current world models maintain persistent causal state over long horizons,
      or do they remain visually plausible but causally shallow?
    - Why do verifier-based improvements scale on one spatial-reasoning benchmark
      but not another, and what benchmark properties explain the discrepancy?
    - What evidence would show that scaling model size or data yields predictable
      gains in physical fidelity, transfer, and upstream decision performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一动作-视频扩散世界模型，用于机器人操作（如 UWM、IRASim）
      解决的问题: 在单一模型中表示策略、前向/逆向动力学和视频生成，强化动作-帧对齐，并支持基于模型的规划。
      尚未覆盖: 证据多集中在视觉质量与选定任务指标；跨本体迁移和对策略改进的形式条件尚未建立。
    - 路线: 将预训练视频扩散模型适配为动作条件世界模型（如 AVID）
      解决的问题: 通过学习掩码和小型标注数据，把闭源视频生成器转为动作条件预测器，无需直接访问参数。
      尚未覆盖: 假设存在领域特定的动作标注视频；视频游戏和机器人之外的泛化未被证明，基模型偏差仍可能存在。
    - 路线: 异构自回归视频动态，用于快速机器人模拟（如 HMA）
      解决的问题: 跨本体、领域和任务预训练，并加速动作条件视频生成以支持实时模拟与合成数据。
      尚未覆盖: 速度与可控性提升缺少详细局限；下游策略评估和模拟器有效性仅有部分证据。
    - 路线: 基于偏好或奖励对齐的具身世界模型（如 ReWorld、ABot-PhysWorld）
      解决的问题: 通过人类偏好或物理合理性标准后训练视频世界模型，提升物理保真度与任务逻辑。
      尚未覆盖: 评估集中于操作任务；人类偏好可能主观且昂贵，跨域泛化与可复现工件未展示。
    - 路线: 功能性评测与状态/动态概念分类（如 ViSA、《A Mechanistic View on Video Generation as World
        Models》）
      解决的问题: 把状态构建和动态建模作为核心区分；探测测试时验证器并倡导面向功能基准的评测。
      尚未覆盖: 当前模型可能在空间推理中形成信息瓶颈；持久性和因果性的功能基准尚未广泛采用，形式条件未验证。
    共识:
    - 领域正收敛到以动作条件视频预测作为具身决策世界模型的核心路线。
    - 多项研究同意生成目标应耦合观测与动作，并利用大规模机器人视频数据提供动力学先验。
    - 越来越多研究认为仅视觉保真不够，动作对齐、物理合理性和下游策略或规划效用同样重要。
    - 多篇论文承认评测与验证是薄弱环节，验证器信号或基准提升并不总能跨场景迁移。
    分歧:
    - 生成范式不同：视频与动作统一扩散、掩码自回归，或对现有视频扩散模型进行适配。
    - 对齐方式不同：无参数访问的学习掩码适配、多维奖励模型的强化学习、DPO式后训练，或无显式对齐。
    - 评测目标不同：帧质量、策略评估相关性、物理合理性或空间推理准确率；没有单一基准同时覆盖。
    - 数据与模型假设不同：开放参数下的异构机器人数据预训练，或需要动作标注领域数据并依赖固定预训练模型。
    开放问题:
    - 哪些形式假设能够把动作条件视频生成与可靠的长期动力学和策略改进联系起来？
    - 当前世界模型能否长期维持因果一致的状态，还是仅生成视觉合理但因果浅层的轨迹？
    - 为什么基于验证器的改进在一个空间推理基准上有效而在另一个上失效，哪些基准属性导致差异？
    - 哪些证据能证明扩大模型或数据规模会可预测地提升物理保真度、迁移和上游决策性能？
