  related_work_outline:
  - 'Mainstream direction: World model architectures are shifting from recurrent state-space
    models toward Transformer- and diffusion-based generative models, with growing
    emphasis on multi-task pretraining and physics-informed learning for embodied
    settings.'
  - 'Shared research pattern: Most works learn a dynamics model from visual observations,
    often via self-supervised objectives such as video prediction, mask reconstruction,
    or variational inference, and then use the model for policy learning or planning.'
  - 'Key differences: Methods diverge in representation granularity (latent state
    vs. pixel-level video), incorporation of physical priors, action interface design
    (implicit policy training vs. explicit action diffusion), and evaluation focus
    (visual fidelity, physical plausibility, spatial/memory consistency, or zero-shot
    generalization).'
  - 'Trend evolution: The field is moving from simple game benchmarks (Atari) to complex
    driving and robotic scenarios, from single-task models to large-scale pretraining
    on multi-task robot datasets, and from purely data-driven approaches to hybrid
    physics-informed models; evaluation is shifting from open-loop metrics to closed-loop,
    capability-oriented benchmarks.'
  - 'Open questions: How to guarantee long-term memory consistency and spatial coherence
    across viewpoints; how to generalize across unseen action spaces and dynamics;
    how to disentangle model contributions from planner or controller effects; and
    how to establish standardized, ecologically valid evaluation protocols.'
  related_work_outline_zh:
  - 主流方向：世界模型架构正从循环状态空间模型转向基于Transformer和扩散的生成式模型，越来越强调多任务预训练和面向具身场景的物理信息学习。
  - 研究共性：多数工作从视觉观测中学习动力学模型，通常通过视频预测、掩码重建或变分推断等自监督目标，然后将模型用于策略学习或规划。
  - 关键差异：方法在表示粒度（潜在状态 vs. 像素级视频）、物理先验的融入、动作接口设计（隐式策略训练 vs. 显式动作扩散）以及评估重点（视觉保真度、物理合理性、空间/记忆一致性或零样本泛化）上存在分歧。
  - 趋势演进：领域正从简单游戏基准（Atari）转向复杂驾驶和机器人场景，从单任务模型转向大规模多任务机器人数据集预训练，从纯数据驱动方法转向物理信息混合模型；评估正从开环指标转向闭环、面向能力的基准。
  - 开放问题：如何保证长期记忆一致性和跨视角空间连贯性；如何泛化到未见动作空间和动力学；如何分离模型贡献与规划器或控制器的影响；如何建立标准化、生态有效的评估协议。
  literature_review:
    line_of_work_matrix:
    - line: Generative world model architectures and training objectives (e.g., diffusion
        transformers with mask reconstruction, VAE-Transformer hybrids, unified video-action
        diffusion)
      what_it_solves: Turning world-model concepts into concrete representations,
        losses, and architectures that can generate plausible futures from visual
        observations and actions.
      what_remains_open: Which architectural choices (e.g., latent vs. pixel-level
        generation, stochastic vs. deterministic dynamics) transfer beyond the reported
        task family, and how to balance physical plausibility with computational efficiency.
    - line: Interfaces between world models and decision-making (e.g., contextual
        latent models for policy zero-shot generalization, compositional video generation
        from language, coupled video-action diffusion)
      what_it_solves: Connecting learned dynamics to intervention, planning, and policy
        learning, enabling generalization to unseen tasks or contexts.
      what_remains_open: How much of the performance gain comes from the model versus
        the planner, controller, or task prior; and how to learn actionable representations
        from action-free video data without sacrificing control precision.
    - line: Evaluation benchmarks and evidence protocols for world model capabilities
        (e.g., spatial consistency benchmarks, memory and action control benchmarks)
      what_it_solves: Separating method contribution from dataset, baseline, and metric
        effects by providing standardized, capability-oriented evaluation suites.
      what_remains_open: Whether these benchmarks capture ecologically valid world-model
        abilities (e.g., causal reasoning, long-horizon coherence) and whether they
        will be adopted broadly enough to enable fair comparisons.
    consensus:
    - World models are increasingly built on generative architectures such as Transformers
      and diffusion models, moving beyond traditional recurrent state-space models.
    - Self-supervised learning from visual observations (video prediction, mask reconstruction,
      variational objectives) is the dominant paradigm for training dynamics models.
    - There is a growing recognition that evaluation must go beyond open-loop visual
      quality and include closed-loop, capability-specific metrics such as spatial
      consistency, memory coherence, and physical plausibility.
    - Pretraining on large-scale, multi-task datasets is emerging as a promising direction
      for improving generalization in robotic and driving domains.
    disagreements:
    - 'Representation level: some methods operate on compact latent states for policy
      learning, while others generate pixel-level videos, trading off sample efficiency
      against visual fidelity.'
    - 'Physical grounding: works like RoboScape explicitly inject physics knowledge
      via auxiliary tasks, whereas others rely purely on data-driven generation without
      explicit physical constraints.'
    - 'Action interface: approaches differ in whether actions are treated as conditioning
      inputs for video generation, as outputs of an inverse dynamics model, or as
      jointly diffused modalities alongside video.'
    - 'Evaluation target: benchmarks emphasize different facets—spatial consistency
      (LoopNav), memory and action control (MIND), zero-shot generalization to unseen
      dynamics (cRSSM), or task success in simulation—making direct comparison difficult.'
    open_questions:
    - Can current world models maintain consistent memory and spatial layout over
      long horizons and across viewpoint changes, as highlighted by the MIND and LoopNav
      benchmarks?
    - How can world models generalize to entirely novel action spaces or physical
      dynamics not seen during training, beyond the compositional generalization shown
      in RoboDreamer?
    - What is the minimal set of evaluation protocols needed to isolate a world model's
      contribution from the surrounding policy, planner, and data pipeline?
    - To what extent do physics-informed objectives (e.g., depth prediction, keypoint
      dynamics) improve downstream task performance compared to scaling data and compute
      alone?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 生成式世界模型架构与训练目标设计（如扩散Transformer结合掩码重建、VAE-Transformer混合、统一视频-动作扩散）
      解决的问题: 将世界模型概念落实为具体表示、损失函数和架构，能够从视觉观测和动作生成合理的未来状态。
      尚未覆盖: 哪些架构选择（如潜在生成 vs. 像素级生成、随机 vs. 确定性动力学）能迁移到报告任务族之外，以及如何在物理合理性与计算效率之间取得平衡。
    - 路线: 世界模型与决策的接口（如上下文潜在模型用于策略零样本泛化、基于语言的组合视频生成、耦合视频-动作扩散）
      解决的问题: 将学习到的动力学连接到干预、规划和策略学习，使智能体能够泛化到未见任务或上下文。
      尚未覆盖: 性能增益有多少来自模型本身，而不是规划器、控制器或任务先验；以及如何从无动作视频数据中学习可操作的表示而不牺牲控制精度。
    - 路线: 面向世界模型能力的评估基准与证据协议（如空间一致性基准、记忆与动作控制基准）
      解决的问题: 通过提供标准化、面向能力的评估套件，区分方法贡献与数据集、基线和指标的影响。
      尚未覆盖: 这些基准是否捕捉到生态有效的世界模型能力（如因果推理、长时域连贯性），以及它们是否会被足够广泛地采用以实现公平比较。
    共识:
    - 世界模型越来越多地建立在生成式架构（如Transformer和扩散模型）之上，超越了传统的循环状态空间模型。
    - 从视觉观测中进行自监督学习（视频预测、掩码重建、变分目标）是训练动力学模型的主导范式。
    - 人们越来越认识到评估必须超越开环视觉质量，纳入闭环、面向能力的指标，如空间一致性、记忆连贯性和物理合理性。
    - 在大规模多任务数据集上进行预训练正成为提升机器人和驾驶领域泛化能力的有前景的方向。
    分歧:
    - 表示层级：一些方法在紧凑的潜在状态上操作以进行策略学习，而另一些方法生成像素级视频，在样本效率与视觉保真度之间进行权衡。
    - 物理基础：像RoboScape这样的工作通过辅助任务显式注入物理知识，而其他方法则纯粹依赖数据驱动生成，没有显式的物理约束。
    - 动作接口：方法在动作是作为视频生成的条件输入、作为逆动力学模型的输出，还是作为与视频联合扩散的模态上存在差异。
    - 评估目标：基准强调不同的方面——空间一致性（LoopNav）、记忆与动作控制（MIND）、对未见动力学的零样本泛化（cRSSM）或仿真中的任务成功率——使得直接比较变得困难。
    开放问题:
    - 当前的世界模型能否在长时域和跨视角变化下保持一致的记忆和空间布局，正如MIND和LoopNav基准所揭示的挑战？
    - 世界模型如何泛化到训练中未见的全新动作空间或物理动力学，超越RoboDreamer所展示的组合泛化？
    - 需要哪些最小评估协议集来隔离世界模型的贡献与周围策略、规划器和数据管道的影响？
    - 与单纯扩展数据和计算相比，物理信息目标（如深度预测、关键点动力学）在多大程度上提升了下游任务性能？
