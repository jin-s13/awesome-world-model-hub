  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics for embodied control
      what_it_solves: Learning future observation frames from action sequences for
        policy learning, inverse dynamics, planning, and faster simulation across
        robot datasets.
      what_remains_open: Long-horizon physical and causal persistence, formal action-frame
        assumptions, and generalization beyond evaluated robot or domain settings.
    - line: Reward, preference, and verification alignment of world-model rollouts
      what_it_solves: Aligning generated trajectories with physical realism, task
        logic, human preference, or more reliable test-time view selection for spatial
        reasoning.
      what_remains_open: Preference supervision can be subjective or costly, cross-benchmark
        scaling is inconsistent, and reward or verifier calibration under distribution
        shift is unclear.
    - line: Conceptual taxonomy and functional evaluation of state and dynamics
      what_it_solves: Clarifying implicit and explicit state construction, organizing
        dynamics modeling approaches, and arguing for functional benchmarks beyond
        visual fidelity.
      what_remains_open: The taxonomy lacks experimental validation and has not been
        shown to change model design or evaluation practice.
    - line: Scaling and boundary evidence for world models
      what_it_solves: Connecting model size or test-time compute to video quality
        or spatial reasoning improvements in specific settings.
      what_remains_open: No formal guarantees or scaling laws are validated, test-time
        scaling fails on some benchmarks, and model-size scaling evidence remains
        sparse.
    consensus:
    - World models are increasingly operationalized as action-conditioned generative
      video models rather than only analytic formal objects.
    - Visual quality alone is insufficient; physical consistency, action alignment,
      task logic, or causal persistence are emerging evaluation targets.
    - Large action-observation pretraining and post-training alignment can improve
      controllability, fidelity, or downstream policy and planning usefulness.
    disagreements:
    - Whether to adapt frozen pretrained video generators without parameter access
      or train unified action-video models with modality-specific conditioning.
    - 'Which supervision signal should align world models: human preference reward,
      preference-based DPO, frame-anchored verifiable assertions, or low-level action
      controllability.'
    - 'Which evaluation target is primary: frame quality and action alignment, physical
      plausibility and trajectory consistency, spatial reasoning benchmark scaling,
      or functional state/dynamics persistence.'
    - Whether state should be represented implicitly through context or latent compression
      or explicitly through architectural modules, and whether diffusion transformers
      or masked autoregression are preferable.
    open_questions:
    - Do the formal conditions or assumptions behind action-conditioned video models
      match empirical deployment behavior, and where are the boundary-violation cases?
    - Why does test-time verifier scaling improve one spatial reasoning benchmark
      but not another, and does this indicate an information bottleneck in current
      world models?
    - Can preference-aligned world models transfer beyond contact-rich manipulation
      tasks without costly new human preference data?
    - Do zero-shot physical plausibility benchmarks reflect real-world causal correctness
      or mainly distributional consistency within curated evaluation scenes?
    - How reproducible are the reported gains given missing code, dataset, or limitation
      details in several high-scoring papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向具身控制的动作条件化视频动力学
      解决的问题: 从动作序列学习未来观测帧，用于策略学习、逆动力学、规划及跨机器人数据集的更快仿真。
      尚未覆盖: 长程物理与因果持续性、动作-帧假设的形式化验证，以及超出已评测机器人或领域的泛化边界。
    - 路线: 世界模型轨迹的奖励、偏好与验证对齐
      解决的问题: 将生成轨迹与物理真实性、任务逻辑、人类偏好对齐，或改善空间推理中测试时视图选择的可靠性。
      尚未覆盖: 偏好监督可能主观或成本高，跨基准缩放不一致，奖励或验证器在分布偏移下的校准未知。
    - 路线: 状态与动态的概念分类及功能性评测
      解决的问题: 澄清隐式与显式状态构建，组织动态建模方式，并主张超越视觉保真度的功能性基准。
      尚未覆盖: 该分类法缺少实验验证，也尚未证明能改变模型设计或评测实践。
    - 路线: 世界模型的缩放与边界证据
      解决的问题: 在特定场景中建立模型规模或测试时计算与视频质量、空间推理改进之间的关联。
      尚未覆盖: 没有经过验证的形式保证或缩放规律；部分基准上测试时缩放失效，模型规模缩放证据有限。
    共识:
    - 世界模型越来越多地被操作化为动作条件化生成式视频模型，而不是单纯的分析形式对象。
    - 视觉质量单独不足；物理一致性、动作对齐、任务逻辑或因果持久性正在成为评测目标。
    - 大规模动作-观测预训练与后训练对齐能够改善可控性、保真度或下游策略与规划效果。
    分歧:
    - 是适配冻结的预训练视频生成器而不访问参数，还是训练统一的动作-视频模型并使用模态专用条件化。
    - 以何种监督信号对齐世界模型：人类偏好奖励、基于偏好的 DPO、帧锚定可验证断言，还是低级动作可控性。
    - 首要评测目标是帧质量与动作对齐、物理合理性与轨迹一致性、空间推理基准缩放，还是功能性状态/动态持久性。
    - 状态应通过上下文或潜在压缩隐式表示，还是通过架构模块显式表示；扩散 Transformer 与掩码自回归何者更优。
    开放问题:
    - 动作条件化视频模型背后的形式条件或假设是否与部署中的经验行为一致，边界违例发生在何处？
    - 为何测试时验证器缩放在一个空间推理基准有效而在另一个上无效，是否表明当前世界模型存在信息瓶颈？
    - 偏好对齐的世界模型能否无需昂贵的新人类偏好数据就迁移到接触丰富操作之外的任务？
    - 零样本物理合理性基准反映的是真实世界因果正确性，还是仅在策划评测场景中的分布一致性？
    - 在若干高评分论文缺少代码、数据集或局限细节的情况下，所报告提升的可复现性如何？
