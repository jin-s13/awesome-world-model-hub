  - 主流方向：围绕交互式视频、自动驾驶、智能体与通用世界模拟进行综述、分类、路线图和评估框架整合，而非仅提出单一方法。
  - 研究共性：多数工作将问题分解为可控生成、长期一致性、记忆和评估；部分方法用语言原语、全局状态、多模态条件或在线世界模型学习来回应这些轴。
