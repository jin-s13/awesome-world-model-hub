        reproduction evidence.
    consensus:
    - Generative models are treated as learnable world simulators whose future rollouts
      can be conditioned on actions, context, or physical structure rather than evaluated
      only as unconditional video generators.
    - Specialized benchmarks and metrics are emerging for control fidelity, spatial
      consistency, and physical plausibility beyond visual realism alone.
    - Downstream usefulness is increasingly evaluated through policy training, planning,
      simulation realism, or closed-loop driving rather than standalone generation
      quality.
    - Many top papers include reproducibility signals such as code or dataset artifacts,
      but citation and graph-prestige evidence is unavailable in this packet.
    disagreements:
