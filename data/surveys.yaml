  related_work_outline:
  - 'Mainstream direction: recent work concentrates on scalable generative world models,
    especially diffusion or transformer video prediction for driving and robotics,
    with a parallel line of latent-dynamics model-based reinforcement learning and
    emerging benchmarks for consistency and action control.'
  - 'Shared research pattern: methods convert high-dimensional observations into learned
    latent states or video representations, train via self-supervised reconstruction,
    prediction, or diffusion objectives, and evaluate through visual quality, downstream
    policy execution, or zero-shot generalization.'
  - 'Key differences: representations range from recurrent state-space latent dynamics
    to diffusion transformers and compositional video primitives; supervision ranges
    from pure video prediction to physics-informed auxiliary tasks; action interfaces
    range from policy-centric model-based RL to video-action diffusion.'
  - 'Trend evolution: available high-signal papers span roughly 2023 to 2026, moving
    from stochastic transformer world models and contextual Dreamer variants toward
    unified video-action diffusion, physics-informed embodied generation, and benchmark-defined
    consistency or control evaluation.'
  - 'Open questions: cross-domain transfer, isolating model contribution from planner
    or generator choices, evaluating memory and action consistency without confounded
    metrics, and handling unobserved context or unseen primitive combinations remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于可扩展生成式世界模型，尤其是驾驶与机器人场景中的扩散或Transformer视频预测；并行路线是基于潜在动力学的模型强化学习，以及面向一致性、记忆和动作控制的基准。
  - 研究共性：多数方法将高维观测转换为潜在状态或视频表示，采用自监督重建、预测或扩散目标，并以视觉质量、下游策略执行或零样本泛化作为证据。
  - 关键差异：表示选择包括循环状态空间潜在动力学、扩散Transformer和组合视频原语；监督信号包括纯视频预测、物理信息辅助任务和上下文条件动力学；动作接口包括策略中心模型强化学习和视频-动作扩散。
  - 趋势演进：高证据论文主要分布在2023至2026年，从随机Transformer世界模型和上下文Dreamer变体，走向统一视频-动作扩散、物理信息具身生成和基准定义的一致性/控制评测。
  - 开放问题：跨领域迁移、隔离模型与规划器或生成器的贡献、无混淆指标下评测记忆与动作一致性、处理不可观测上下文和未见原语组合等问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Latent dynamics and model-based policy learning (e.g., STORM, cRSSM)
      what_it_solves: Learning compact recurrent or state-space dynamics for sample-efficient
        model-based reinforcement learning and contextual zero-shot policy generalization.
      what_remains_open: Evidence is limited to narrow tasks such as Atari 100k or
        two CARL tasks; context observability is assumed and model contribution is
        not fully isolated from policy training.
    - line: Generative video world models for driving and robot imagination (e.g.,
        MaskGWM, RoboDreamer, RoboScape)
      what_it_solves: Generating long-horizon, multi-view, goal-conditioned, or physics-informed
        videos that can serve as visual predictions or robot plans.
      what_remains_open: Generalization often depends on seen scenes or primitive
        combinations; evaluation relies heavily on visual fidelity and simulation,
        with limited real-world deployment evidence.
    - line: Unified video-action diffusion pretraining (e.g., Unified World Models)
      what_it_solves: Coupling video and action diffusion inside one transformer so
        that policy, forward dynamics, inverse dynamics, and video generation can
        be represented by controlling modality-specific timesteps.
      what_remains_open: Ablation evidence for the coupling and timestep design is
        incomplete, and generalization beyond large multi-task robot datasets or action-free
        video settings is not fully verified.
    - line: Spatial, memory, and action consistency benchmarking (e.g., LoopNav, MIND)
      what_it_solves: Providing datasets and metrics to evaluate whether world models
        maintain long-term spatial consistency, memory consistency, and action control
        across viewpoint changes and action spaces.
      what_remains_open: Some benchmark papers report construction rather than model
        results; metric validity and separation of model capability from interface
        or prompt choices remain open.
    consensus:
    - World models are increasingly formulated as generative sequence models over
      observations or latent states.
    - Self-supervised or auxiliary prediction objectives are used to learn dynamics
      or video priors before or alongside policy learning or planning.
    - Evaluation is shifting from training loss alone toward generalization, visual
      fidelity, physical plausibility, downstream execution, and consistency control.
    - Long-horizon consistency and action grounding are recognized as core open challenges
      rather than only frame-level prediction quality.
    disagreements:
    - 'Representation choice: compact latent state-space models for sample-efficient
      policy learning versus high-dimensional video or token diffusion generators.'
    - 'Supervision signal: pure video reconstruction and prediction versus physics-informed
      auxiliary tasks versus context-conditioned latent dynamics.'
    - 'Action interface: implicit policy or dynamics learning for model-based reinforcement
      learning versus generated video plans versus coupled video-action diffusion.'
    - 'Evaluation target: standard Atari or robot-task performance versus visual quality
      and zero-shot driving/view synthesis versus spatial, memory, and action consistency
      benchmarks.'
    - 'Deployment setting: single-task or context-limited benchmarks, driving scenes,
      Minecraft navigation, and robot RGB video settings make transfer claims hard
      to compare.'
    open_questions:
    - Does MAE-style mask reconstruction combined with diffusion remain beneficial
      beyond driving scenes and the reported multi-view settings?
    - Can contextual recurrent state-space models retain state-context disentanglement
      when context is partially observed or tasks extend beyond two CARL settings?
    - Can compositional video generation handle primitives not seen during training
      without manual language parsing?
    - Do physics-informed auxiliary tasks improve downstream robot policy learning
      in real-world settings, rather than only improving generated video quality?
    - Which benchmark metric can distinguish memory or action-control failures from
      visual quality changes or action-interface mismatch?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 潜在动力学与基于模型的策略学习（如STORM、cRSSM）
      解决的问题: 学习紧凑的循环或状态空间动力学，以支持样本高效的模型强化学习和上下文零样本策略泛化。
      尚未覆盖: 证据局限于Atari 100k或两个CARL任务；假设上下文可观测，且模型贡献尚未与策略训练充分隔离。
    - 路线: 面向驾驶与机器人想象的生成式视频世界模型（如MaskGWM、RoboDreamer、RoboScape）
      解决的问题: 生成长时域、多视角、目标条件或物理信息视频，作为视觉预测或机器人计划。
      尚未覆盖: 泛化常依赖已见场景或原语组合；评估偏重视觉保真和仿真，真实部署证据不足。
    - 路线: 统一视频-动作扩散预训练（如Unified World Models）
      解决的问题: 在单个Transformer中耦合视频与动作扩散，通过控制模态特定时间步表示策略、前向动力学、逆向动力学和视频生成。
      尚未覆盖: 耦合与时间步设计的消融证据不完整，大规模多任务机器人数据集或无动作视频之外的泛化未充分验证。
    - 路线: 空间、记忆与动作一致性基准测试（如LoopNav、MIND）
      解决的问题: 提供数据集与指标，评估世界模型在视角变化和动作空间变化下是否保持长期空间一致性、记忆一致性和动作控制。
      尚未覆盖: 部分基准论文偏重构建而未报告模型结果；指标有效性以及模型能力与接口/提示选择的分离仍待验证。
    共识:
    - 世界模型越来越多被构建为面向观测或潜在状态的生成式序列模型。
    - 自监督或辅助预测目标被用于在策略学习或规划之前或过程中学习动力学或视频先验。
    - 评估正从仅看训练损失转向泛化、视觉保真、物理合理性、下游执行和一致性控制。
    - 长时程一致性和动作接地被视为核心开放挑战，而非仅帧级预测质量。
    分歧:
    - 表示选择：用于样本高效策略学习的紧凑潜在状态空间模型，对比高维视频或令牌扩散生成器。
    - 监督信号：纯视频重建预测、物理信息辅助任务和上下文条件潜在动力学之间存在差异。
    - 动作接口：模型强化学习中的隐式策略或动力学学习、生成视频计划、视频-动作耦合扩散各自不同。
    - 评测目标：Atari或机器人任务表现、视觉质量与零样本驾驶/视角合成、空间/记忆/动作一致性基准之间存在差异。
    - 部署场景：单任务或任务受限基准、驾驶场景、Minecraft导航和机器人RGB视频设置使得迁移声明难以直接比较。
    开放问题:
    - 基于掩码重建与扩散结合的方法在驾驶场景和已报告多视角设置之外是否仍然有效？
    - 上下文循环状态空间模型在部分可观测或超出两个CARL任务时是否仍能解耦状态与上下文？
    - 组合视频生成能否在没有人工语言解析的情况下泛化到训练未见原语？
    - 物理信息辅助任务能否在真实机器人策略学习中带来提升，而非仅改善生成视频质量？
    - 哪种基准指标可以区分记忆或动作控制失败与视觉质量变化或动作接口不匹配？
