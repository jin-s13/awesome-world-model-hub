    evaluation spans Minecraft navigation, CARL control, and nuScenes closed-loop
    driving; success is measured by FID/FVD, policy success, action fidelity, spatial
    consistency, or latency.'
  - 'Trend evolution: In the available 2024-2026 evidence window, work moves from
    contextual RL world models and open-loop driving video prediction toward physics-informed
    robot video generation, cross-embodiment latent-action pretraining, and frame-level
    closed-loop simulation.'
  - 'Open questions: Generalization beyond narrow benchmarks, long-horizon stability,
    scalable real-time deployment, and independent reproducibility remain underevidenced.'
  related_work_outline_zh:
  - 主流方向：以具身仿真与自动驾驶为核心的生成式世界模型系统，重点是动作条件下的视频预测与闭环评测。
  - 研究共性：大规模视频预训练后进行任务特定适配，并配套新数据集、指标或基准框架，关注一致性、动作忠实度、物理合理性及下游策略价值。
  - 关键差异：条件表示不同，包括上下文潜在状态、物理先验的深度/关键点、通用潜在动作和结构化多视角扩散；评测覆盖Minecraft导航、CARL控制到nuScenes闭环驾驶；指标从FID/FVD到策略成功率和延迟各异。
  - 趋势演进：在可获得的2024-2026证据窗口内，从上下文世界模型和开放环路驾驶视频预测，走向物理先验机器人视频生成、跨具身潜在动作预训练和帧级闭环仿真。
  - 开放问题：在窄基准之外的泛化、长时域稳定性、可扩展实时部署以及可复现工程仍缺乏证据。
  literature_review:
    line_of_work_matrix:
    - line: World-model evaluation artifacts and reproducible benchmarks
      what_it_solves: Provides public datasets and metrics for measuring spatial consistency
        and action fidelity in video generation systems.
      what_remains_open: Current benchmarks cover loop navigation and nuScenes-style
        driving, leaving manipulation, cross-embodiment, and long-horizon evaluation
        underevidenced.
    - line: Contextual and physics-informed world-model training for control
      what_it_solves: Improves zero-shot generalization, physical plausibility, and
        action-conditioned prediction by injecting context, depth, keypoint dynamics,
        or latent actions into world models.
      what_remains_open: Assumes observable context or physics-related supervision;
        validation uses few tasks, while partial observability and broader environment
        transfer are not covered.
    - line: Closed-loop and real-time generative simulation stacks
      what_it_solves: Builds frame-level autoregressive or diffusion-based video generation
        systems for closed-loop driving and robotic policy training with low-latency
        execution.
      what_remains_open: Evidence is limited to nuScenes and a few robot platforms;
        long-horizon stability, distribution shift, and multi-GPU scalability remain
        unresolved.
    - line: Cross-embodiment data generation and adaptation
      what_it_solves: Uses shared latent action interfaces to transfer data across
        human videos, robot demonstrations, and simulation, improving policy training
        and video prediction.
      what_remains_open: Reproducibility artifacts are weak or not visible; generalization
        across more embodiments and real-world deployment needs independent verification.
    consensus:
    - Systems are evaluated not only by visual realism but also by task-oriented measures
      such as action fidelity, spatial consistency, physical plausibility, or downstream
      policy success.
    - Large-scale pretraining followed by task-specific adaptation is a common strategy
      for world-model systems.
    - Controllability and consistency are treated as first-class system requirements,
      with dedicated conditioning interfaces for actions, contexts, or physics signals.
    disagreements:
    - 'Conditioning representation differs: some use observable context vectors, some
      use depth and keypoint dynamics, some use universal latent actions, and some
      use structured multi-view diffusion control.'
    - 'Evaluation targets differ: zero-shot policy generalization, video fidelity
      metrics such as FID/FVD, spatial consistency, action adherence, or closed-loop
      latency are not standardized.'
    - 'Deployment assumptions differ: some papers target benchmark or simulated evaluation,
      while others target real-time single-GPU driving systems or cross-embodiment
      robot data pipelines; hardware and environment scalability evidence is uneven.'
    - 'Supervision assumptions differ: observable context values and physics-related
      keypoint/depth supervision are available in some settings but not demonstrated
      in partially observable real-world conditions.'
    open_questions:
    - Can a common benchmark align spatial consistency, action fidelity, and downstream
      policy success across navigation, manipulation, and driving?
    - How do physics-informed and contextual world models behave under partial observability,
      unseen dynamics, and distribution shift beyond CARL and nuScenes?
    - What are the limits of frame-level autoregressive simulation for long-horizon
      closed-loop deployment, and how can such systems scale beyond one dataset and
      single-GPU latency?
    - Does cross-embodiment synthetic data improve real-robot performance reliably
      enough to replace or augment real demonstrations, given limited reproducibility
      evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评估工件与可复现基准
      解决的问题: 提供公开数据集和指标，衡量视频生成系统的空间一致性与动作忠实度。
      尚未覆盖: 现有基准主要覆盖环路导航和nuScenes驾驶，操作任务、跨具身和长时域评估证据不足。
    - 路线: 面向控制的上下文与物理先验世界模型训练
      解决的问题: 通过注入上下文、深度、关键点动力学或潜在动作，提升零样本泛化、物理合理性和动作条件下的预测能力。
      尚未覆盖: 依赖可观测上下文或物理相关监督，验证任务较少，部分可观测与跨环境迁移尚未覆盖。
    - 路线: 闭环与实时生成式仿真栈
      解决的问题: 构建帧级自回归或扩散视频生成系统，用于闭环驾驶和机器人策略训练，并满足低延迟执行需求。
      尚未覆盖: 证据集中于nuScenes和少量机器人平台，长时域稳定性、分布外场景和多GPU扩展仍待验证。
    - 路线: 跨具身数据生成与适配
      解决的问题: 利用共享潜在动作接口在人类视频、机器人演示和仿真间迁移数据，改进策略训练和视频预测。
      尚未覆盖: 可复现工件不足，跨更多具身和真实部署需要独立验证。
    共识:
    - 系统不仅按视觉真实度评测，也按动作忠实度、空间一致性、物理合理性或下游策略成功率等任务导向指标评测。
    - 大规模预训练后进行任务特定适配是这些世界模型系统的常见路线。
    - 可控性和一致性被作为系统的一等要求，通过动作、上下文或物理信号的条件接口实现。
    分歧:
    - 条件表示不同：可观测上下文向量、深度和关键点动力学、通用潜在动作或结构化多视角扩散控制。
    - 评测目标不同：零样本策略泛化、FID/FVD视频保真度、空间一致性、动作遵循或闭环延迟缺乏统一标准。
    - 部署假设不同：有些面向基准或仿真评测，有些面向单GPU实时驾驶系统或跨具身机器人数据管线；硬件与环境可扩展性证据参差不齐。
    - 监督假设不同：部分工作假设上下文值和物理关键点/深度监督可用，但在部分可观测真实条件下未被验证。
    开放问题:
    - 能否建立统一基准，使空间一致性、动作忠实度和下游策略成功在导航、操作与驾驶任务中可比较？
    - 在部分可观测、未见动力学和分布偏移下，物理先验与上下文世界模型是否仍保持优势？
    - 帧级自回归仿真在长时域闭环部署中的边界在哪里，如何超越单一数据集和单GPU延迟进行扩展？
    - 跨具身合成数据是否能可靠提升真实机器人策略表现，在可复现证据有限的前提下是否足以替代或增强真实演示？
