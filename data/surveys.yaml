  related_work_outline:
  - 'Mainstream direction: recent work centers on generative video/dynamics models
    built from diffusion or Transformer backbones, increasingly conditioned on action,
    language, context, or physics-related side tasks.'
  - 'Shared research pattern: methods augment raw video prediction with auxiliary
    objectives such as mask reconstruction, depth/keypoint prediction, action diffusion,
    or context conditioning to improve long-horizon consistency and downstream usefulness.'
  - 'Key differences: representations range from stochastic VAE-Transformer models
    and masked diffusion Transformers to compositional primitive generators and unified
    video-action diffusion; evaluation spans Atari, driving, robotics, and memory/action
    consistency settings.'
  - 'Trend evolution: the available top evidence spans 2023-2026, moving from model-based
    reinforcement learning efficiency toward embodied/driving video generation, unified
    action-video pretraining, and specialized consistency benchmarks.'
  - 'Open questions: observable-context assumptions, generalization to unseen primitives
    or dynamics, real-robot transfer, and separation of model gains from planner or
    task priors remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：以扩散或Transformer为骨干的自监督视频世界模型，并越来越多地结合动作、语言、上下文或物理辅助任务。
  - 研究共性：通过掩码重建、深度/关键点预测、动作扩散或上下文条件等辅助目标提升长时域一致性与下游策略质量。
  - 关键差异：表示方式涵盖随机VAE-Transformer、掩码扩散Transformer、组合原语视频生成和视频-动作统一扩散；评测目标从Atari、驾驶到机器人、记忆与动作控制。
  - 趋势演进：2023-2026进入当前前沿，从模型驱动强化学习效率转向大规模具身/驾驶视频生成、统一动作-视频预训练与专用一致性基准。
  - 开放问题：上下文可观测性、未见过原语/动力学泛化、真实机器人迁移，以及模型收益是否可与规划器或任务先验分离仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Masked diffusion and generative video world modeling
      what_it_solves: Scalable long-horizon and multi-view video prediction for driving
        scenes by combining diffusion Transformers with masked reconstruction.
      what_remains_open: Cross-dataset and zero-shot physical consistency beyond reported
        driving benchmarks; no explicit limitation analysis is visible.
    - line: Context-conditioned latent dynamics and model-based reinforcement learning
      what_it_solves: Improves zero-shot policy transfer under observed context by
        conditioning recurrent state-space dynamics on context values.
      what_remains_open: Assumes observable context and evaluates on only two contextual
        control tasks, leaving unobserved context and broader dynamics unverified.
    - line: Compositional and physics-informed video generation for robotics
      what_it_solves: Generalizes to unseen instruction-goal combinations or improves
        physical plausibility by factorizing language primitives and adding depth/keypoint
        objectives.
      what_remains_open: Generalization to entirely new primitives and real-robot
        deployment beyond simulation are not demonstrated in the available abstracts.
    - line: Unified video-action diffusion pretraining
      what_it_solves: Couples action and video diffusion in one Transformer so the
        model can represent policy, forward/inverse dynamics, or a video generator
        and can use action-free video.
      what_remains_open: Evidence does not yet isolate whether gains come from multimodal
        pretraining, diffusion formulation, dataset scale, or base architecture.
    - line: World-model consistency and action-control benchmarks
      what_it_solves: Measures spatial consistency, memory consistency, and action
        control using loop navigation or revisited video settings.
      what_remains_open: One benchmark reports construction rather than baseline results;
        another reveals long-term memory and cross-action-space generalization gaps.
    consensus:
    - Recent work converges on generative sequence models as world-model backbones,
      especially diffusion and Transformer variants.
    - Auxiliary self-supervised objectives are commonly added to raw video prediction
      to address long-horizon, physical, or action-related consistency.
    - Evaluation is shifting from visual quality alone toward downstream policy quality,
      action-conditioned control, or consistency under revisiting.
    - Embodied settings such as driving and robotics motivate world models that consume
      or produce action information.
    disagreements:
    - Stochastic latent state-space rollout differs from diffusion-based video generation
      and from unified video-action diffusion over independent modality timesteps.
    - Some methods assume observable context or parse language into known primitives,
      while others rely on action-free video pretraining without such symbolic decomposition.
    - 'Evaluation targets diverge: Atari 100k efficiency, zero-shot contextual control,
      driving video prediction, robot video synthesis, and memory/action consistency
      benchmarks.'
    - Interaction mode differs among open-loop video prediction, closed-loop policy
      training in imagination, and action-controlled closed-loop video revisiting.
    open_questions:
    - Can unobserved context or entirely new task primitives be handled without assuming
      observability or symbolic parsing?
    - Do gains transfer from simulation and benchmark scenes to real-world robot execution
      or unseen driving domains?
    - How much of reported improvement comes from the world-model representation versus
      planner, controller, action prior, or data scale?
    - Which auxiliary objectives most improve long-term memory consistency and cross-action-space
      generalization, and under what evaluation protocol?
    - Several included entries lack visible limitation sections or citation metadata,
      leaving verification gaps rather than confirmed weaknesses.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 掩码扩散与生成式视频世界建模
      解决的问题: 在驾驶视频中实现可扩展的长时域和多视角预测，通过扩散Transformer结合掩码重建。
      尚未覆盖: 跨数据集和零样本物理一致性尚未超出已报告驾驶基准，且可见分析中缺失显式局限性说明。
    - 路线: 上下文条件潜在动力学与基于模型的强化学习
      解决的问题: 在可观测上下文下，通过上下文条件循环状态空间动力学改善策略零样本迁移。
      尚未覆盖: 假设上下文可观测，仅在两个上下文控制任务上评估，未观测上下文和更广动力学未验证。
    - 路线: 面向机器人的组合式与物理信息视频生成
      解决的问题: 通过语言原语分解和深度/关键点辅助任务，提升未见指令-目标组合泛化或物理合理性。
      尚未覆盖: 全新原语与仿真外真实机器人部署在可用摘要中未展示。
    - 路线: 视频-动作统一扩散预训练
      解决的问题: 在单一Transformer中耦合视频和动作扩散，以表示策略、前向/逆动力学或视频生成器，并利用无动作视频。
      尚未覆盖: 证据尚不能隔离收益来自多模态预训练、扩散公式、数据规模还是基础架构。
    - 路线: 世界模型一致性与动作控制基准
      解决的问题: 通过循环导航或可回访视频评估空间一致性、记忆一致性与动作控制。
      尚未覆盖: 一个基准只报告构建未报告基线结果；另一个揭示长时记忆与跨动作空间泛化缺陷。
    共识:
    - 近期工作汇聚到以扩散和Transformer变体为主的生成式序列模型作为世界模型骨干。
    - 在原始视频预测之外，普遍引入自监督辅助目标来改善长时域或物理一致性。
    - 评测逐渐从视觉质量扩展到下游策略、动作条件或控制能力。
    - 驾驶和机器人等具身场景推动世界模型同时处理或生成动作信息。
    分歧:
    - 随机潜在状态空间推演不同于扩散式视频生成，也不同于使用独立模态时间步的视频-动作统一扩散。
    - 部分方法假设上下文可观测或将语言解析为已知原语，另一些方法采用无动作视频预训练，避免符号分解。
    - 评测目标分化：Atari 100k效率、零样本上下文控制、驾驶视频预测、机器人视频合成、记忆/动作一致性基准。
    - 交互模式在开环视频预测、想象中闭环策略训练和动作控制闭环回访之间不同。
    开放问题:
    - 能否在不假设可观测性或符号解析的情况下处理未观测上下文或全新任务原语？
    - 仿真和基准场景中的收益能否迁移到真实机器人执行或未见的驾驶域？
    - 报告提升中多少来自世界模型表示，多少来自规划器、控制器、动作先验或数据规模？
    - 哪些辅助目标最能提升长期记忆一致性和跨动作空间泛化，又应在何种协议下评测？
    - 若干条目缺少可见局限性或引用元数据，属于验证缺口而非已证实的弱点。
