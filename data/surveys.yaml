  - 关键差异：各工作侧重不同，有的强调分类宽度，有的侧重对比基准，有的聚焦开放问题映射；在是否纳入资源感知推理成本、采用闭环还是开环指标，以及潜在空间定义的抽象层次上存在分歧。
  - 趋势演进：从2022年到2026年，综述从描述孤立的世界模型应用转向整合多模态和交互范式，从抽象的缺口分析转向提出可行动的指标和设计建议。
  - 开放问题：如何跟上快速扩展的文献、验证分类法对未来系统的适用性，并建立公认的基准以捕捉世界模型的全部能力，包括视线外动态和实时响应性。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: mapping a fragmented field into directions, milestones, and
        research gaps
      what_remains_open: whether the synthesis is backed by systematic evidence rather
        than selective examples
    - line: Comparative evaluation synthesis
      what_it_solves: summarizing how different evaluation choices shape conclusions
        across papers
      what_remains_open: whether the compared results are actually compatible across
        settings
    - line: Open problem and gap mapping
      what_it_solves: turning broad literature coverage into concrete next research
        questions
      what_remains_open: prioritization of which gaps matter most for progress
    consensus:
    - Surveys converge on long-horizon temporal consistency, action-conditioned generation,
      and real-time interactivity as primary challenges for world models.
    - All emphasize the importance of benchmarks and metrics for progress, and advocate
      structured design spaces to compare methods.
    - They identify a gap between open-loop video generation and closed-loop decision-making,
      calling for more realistic evaluation setups.
    disagreements:
    - 'The definition of a world model varies: some surveys treat video generation
      as a world simulator, while others require explicit latent dynamics for planning.'
    - Works differ on whether to include resource-aware metrics like inference latency
      or memory as part of the evaluation framework.
    - 'Taxonomy choices differ: one survey organizes by application domains (driving,
      robotics, gaming), another by internal mechanics (latent representations, structural
      priors).'
    - The granularity of gap analysis ranges from broad high-level challenges to specific
      technical shortcomings.
    open_questions:
    - Which benchmarks and metrics are minimally sufficient to drive progress in interactive
      world models?
    - Can taxonomies derived from current literature effectively predict or accommodate
      future model architectures?
    - How can we validate that a proposed evaluation framework reduces the open-loop/closed-loop
      performance gap in practice?
    - Is there a consensus on the essential capabilities that define a world model
      as opposed to a conditional video generator?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化领域整理为方向、里程碑和研究缺口
      尚未覆盖: 综合是否由系统证据支撑，而不是选择性举例
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择如何影响跨论文结论
      尚未覆盖: 被比较的结果在不同设置下是否真正兼容
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为具体下一步研究问题
      尚未覆盖: 哪些缺口最值得优先解决仍需要排序
    共识:
    - 综述一致认为长时域一致性、动作条件生成和实时交互性是世界模型的首要挑战。
    - 均强调基准和指标对进展的重要性，并倡导用结构化设计空间来比较方法。
    - 都指出开环视频生成与闭环决策之间存在差距，呼吁采用更真实的评估设置。
    分歧:
    - 世界模型的定义不同：有的将视频生成视为世界模拟器，有的则要求显式的潜在动力学用于规划。
    - 在是否将推理延迟或内存等资源感知指标纳入评估框架上存在分歧。
    - 分类选择不同：有的按应用领域（驾驶、机器人、游戏）组织，有的按内部机制（潜在表示、结构先验）组织。
    - 缺口分析的粒度从宽泛的高层挑战到具体的技术缺点不等。
    开放问题:
    - 哪些基准和指标足以推动交互式世界模型的进展？
    - 从当前文献中得出的分类法能否有效预测或容纳未来的模型架构？
    - 如何验证所提出的评估框架在实践中确实缩小了开环与闭环性能差距？
    - 是否存在关于定义世界模型（而非条件视频生成器）所需基本能力的共识？
