  - 开放问题：如何用系统证据验证分类体系、使评测设置可比，并解决长期一致性、组合泛化和真实世界迁移。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: turning fragmented world-model literature into organized design
        choices, milestones, and application directions
      what_remains_open: whether the synthesis is grounded in systematic evidence
        rather than selective examples; proposed taxonomies often remain conceptually
        framed without empirical validation
    - line: Comparative evaluation synthesis
      what_it_solves: clarifying how evaluation settings such as open-loop visual
        quality, controllability, long-horizon consistency, and closed-loop decision
        readiness shape conclusions
      what_remains_open: whether results are comparable across video generation, autonomous
        driving, and physical robot learning when datasets, metrics, and platforms
        differ
    - line: Open problem and gap mapping
      what_it_solves: converting broad literature coverage into concrete unresolved
        capabilities like persistent out-of-sight dynamics, compositional generalization,
        and real-world online learning
      what_remains_open: which gaps matter most for progress and how to prioritize
        them across simulation, control, and deployment constraints
    consensus:
    - World-model research is converging on unifying frameworks that connect video
      generation, motion prediction, and decision-making rather than treating them
      as separate tasks.
    - There is broad agreement that evaluation should capture long-term temporal consistency,
      controllability, and closed-loop decision readiness, not only short-horizon
      visual quality.
    - Compact latent or structured representations are seen as necessary for scaling
      world models to physical robots, driving, and open-ended interactive settings.
    disagreements:
    - General surveys emphasize large generative video models that simulate physical
      laws, while automated driving work argues for domain-specific structural priors
      such as geometry, topology, and semantics.
    - 'Evaluation targets differ: some focus on video generation fidelity and future-frame
      control, others on closed-loop metrics and resource-aware inference cost, with
      no shared compatibility standard.'
    - 'Representations differ across lines: compositional language primitives, persistent
      global state with dynamic entities, and ego-centric multimodal control signals
      are all proposed, but their relative limits remain unsettled.'
    - Conceptual taxonomy papers prioritize framework coverage over empirical validation,
      whereas method papers offer experimental baselines but often omit systematic
      cross-setting comparisons.
    open_questions:
    - Which evaluation settings can make world-model results comparable across video
      generation, autonomous driving, and physical robot learning?
    - What evidence would show that a proposed taxonomy covers the field systematically
      rather than through selective representative papers?
    - How can persistent out-of-sight dynamics be evaluated and extended beyond controlled
      benchmarks without losing real-time interactivity?
    - What generalization boundaries exist for compositional primitives and for environments
      or goals outside the training distribution?
    - How should survey-level open problems be prioritized when simulation, real-world
      deployment, and resource constraints point to different next steps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型文献整理为设计选择、里程碑与应用方向
      尚未覆盖: 系统证据是否支撑综合仍不清楚；概念性分类法常缺乏实证验证
    - 路线: 对比评测综合
      解决的问题: 澄清开环视觉质量、可控性、长时程一致性和闭环决策等评测选择如何影响结论
      尚未覆盖: 视频生成、自动驾驶和物理机器人学习的数据集、指标与平台差异使结果可比性尚未解决
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为持久视线外动态、组合泛化和真实在线学习等具体未解能力
      尚未覆盖: 哪个缺口对进展最重要，以及仿真、控制与部署约束下如何排序，仍不明确
    共识:
    - 世界模型研究正汇聚到统一框架上，将视频生成、运动预测与决策连接起来，而不是将其视为孤立任务。
    - 广泛的共识是评测应捕获长期时间一致性、可控性和闭环决策就绪度，而不仅是短时视觉质量。
    - 紧凑的潜在表示或结构化表示被认为是将世界模型扩展到物理机器人、驾驶和开放式交互场景的关键。
    分歧:
    - 通用综述强调大型生成视频模型的物理规律模拟，而自动驾驶研究则主张引入几何、拓扑和语义等领域特定结构先验。
    - 评测目标不同：有的关注视频生成保真度和未来帧控制，有的提出闭环指标和资源感知推理成本，缺乏兼容性标准。
    - 表示方式存在差异：组合式语言原语、带动态实体的持久全局状态、以及自我中心多模态控制分别被提出，但其相对边界未定。
    - 概念性分类研究重视框架覆盖面而缺少实证验证，方法类研究提供实验基线但常缺跨设置的系统比较。
    开放问题:
    - 哪种评测设置能使世界模型结果在视频生成、自动驾驶和物理机器人学习之间具有可比性？
    - 哪些证据能证明所提分类体系系统地覆盖了领域，而不是基于选择性代表性论文？
    - 如何在保持实时交互的前提下，评估并扩展视线外持续动态模拟？
    - 组合原语以及训练分布外环境或目标存在哪些泛化边界？
    - 当仿真、真实部署和资源约束指向不同下一步时，应如何对综述中列出的开放问题进行优先级排序？
