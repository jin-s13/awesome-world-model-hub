  - 'Mainstream direction: The evidence emphasizes formalizing action-conditioned
    video generation as world models for robotics and embodied reasoning, with rising
    attention on state-dynamics separation, physical plausibility, and test-time verification;
    explicitly theory-only work is present but not dominant.'
  - 'Shared research pattern: Papers treat an observation-action predictive model
    as a world model, then stress-test it through planning, policy evaluation, or
    reasoning benchmarks; assumptions about state, dynamics, and supervision are usually
    implicit.'
  - 'Key differences: They differ in representation and generation objective, including
    unified action-video diffusion, masked autoregression, adapted pretrained video
    diffusion, and flow-based or DPO-aligned models; supervision and evaluation targets
    also differ.'
  - 'Trend evolution: From 2024-2025 action-video world-model construction and pretraining
    recipes, the 2026 evidence shifts toward conceptual taxonomies, physics alignment,
    and test-time scaling probes; older foundations are weakly represented in this
    packet.'
  - 'Open questions: Whether formal state/dynamics definitions match empirical models,
    whether scaling or verifier signals give reliable guarantees, and how to build
    functional benchmarks for persistence, causality, and physical plausibility remain
    unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中在将动作条件视频生成形式化为机器人与具身推理的世界模型，并越来越关注状态-动态分离、物理合理性和测试时验证；纯理论研究存在但非主导。
  - 研究共性：论文倾向把观测-动作预测模型视为世界模型，并通过规划、策略评测或推理基准进行压力测试；关于状态、动态和监督的假设常是隐式的。
  - 关键差异：表示与生成目标不同，包括统一动作-视频扩散、掩码自回归、适配预训练视频扩散、基于流或DPO对齐的模型；监督信号和评测目标也不同。
  - 趋势演进：2024-2025多为动作-视频世界模型构造与预训练；2026证据转向概念分类、物理对齐和测试时缩放探查；本证据包中更早基础工作体现较弱。
  - 开放问题：形式化状态/动态定义是否匹配经验模型、缩放与验证器信号能否提供可靠保证、如何建立面向持续性、因果性与物理合理性的功能基准，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what a world model must represent, such as distinguishing
        state construction from dynamics modeling in video generation systems.
      what_remains_open: Often assumes a state-dynamics separation that current video
        generation models may lack; no evidence in the packet shows the formal conditions
        are tested against empirical model behavior.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented world-model claims into categories such
        as implicit versus explicit state construction and dynamics integration via
        knowledge or architecture.
      what_remains_open: Whether the taxonomy changes evaluation or model design is
        not demonstrated; functional benchmarks remain proposed but not validated.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model size, data, objectives, or assumptions to expected
        behavior under scale.
      what_remains_open: No formal scaling law or guarantee appears in the packet;
        only isolated scaling-related observations and inconsistent test-time scaling
        results exist, making this a verification gap.
    - line: Model-based evaluation and alignment
      what_it_solves: Connects world-model rollouts to decision-making value through
        planning, policy evaluation, reward alignment, or verifier-guided selection.
      what_remains_open: Reward and verifier calibration are unresolved, cross-benchmark
        reliability is limited, and human-preference-based rewards may not generalize
        beyond evaluated manipulation settings.
    consensus:
    - Action-conditioned video prediction is treated as a practical but incomplete
      world-model testbed for robotics and embodied reasoning.
    - Model capability should be judged by downstream utility such as policy quality,
      planning correlation, physical consistency, or reasoning improvement, not only
      generation fidelity.
    - Explicit or implicit state-dynamics structure is recognized as central, with
      a shared move toward separating what is remembered from how it evolves.
    disagreements:
    - 'Representation and generation objective differ: unified action-video diffusion,
      masked autoregression over tokens, adapter-based pretrained video diffusion,
      and flow-based or DPO-aligned video world models.'
    - 'Supervision and alignment signal differ: action-labeled video, small domain-specific
      action datasets, human-preference reward models, decoupled physical discriminators,
      and heuristic or assertion-based verifiers.'
    - 'Evaluation target differs: policy generalization, planning correlation, physical
      plausibility, trajectory consistency, spatial reasoning, or real-time controllability;
      benchmarks and metrics are not standardized.'
    - 'Data and scale assumptions differ: large multi-task robot datasets versus small
      action-labeled domain data versus curated physics-aware manipulation clips,
      making generalization claims hard to compare.'
    open_questions:
    - Do formal state-construction and dynamics assumptions hold in current pretrained
      video models, and what measurable criteria would demonstrate that they hold?
    - Can scaling behavior be turned into guarantees or at least predictive laws for
      policy transfer and failure modes, given that test-time scaling shows benchmark-dependent
      results?
    - Which reward or verifier signals are calibrated enough to support reliable world-model
      evaluation, and how can systematic biases and information bottlenecks be avoided?
    - What functional benchmarks can test persistence, causality, and physical plausibility
      beyond visual fidelity, and how well do they generalize across embodiments and
      tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 澄清世界模型必须表示什么，例如把视频生成系统中的状态构建与动态建模区分开。
      尚未覆盖: 常假设存在状态-动态分离，但当前视频生成模型可能缺乏该结构；证据包中没有展示形式条件是否经过经验模型行为检验。
    - 路线: 概念分类与边界
      解决的问题: 把碎片化的世界模型主张组织为隐式/显式状态构建，以及通过知识或架构整合进行动态建模等类别。
      尚未覆盖: 没有证明这些分类会改变评测或模型设计；功能基准仍停留在提出阶段，尚未被验证。
    - 路线: 缩放规律与保证
      解决的问题: 试图把模型规模、数据、目标或假设与规模化后的预期行为连接起来。
      尚未覆盖: 证据包中没有形式化缩放规律或保证；只有孤立的缩放相关观察和不一致的测试时缩放结果，属于验证缺口。
    - 路线: 基于模型的评测与对齐
      解决的问题: 通过规划、策略评估、奖励对齐或验证器引导选择，将世界模型轨迹连接到决策价值。
      尚未覆盖: 奖励和验证器校准不足，跨基准可靠性有限；基于人类偏好的奖励未必能泛化到已评估的机器人操作之外。
    共识:
    - 动作条件视频预测被视为机器人具身世界模型的实用但不完整的测试载体。
    - 模型能力不应只看生成质量，还要看下游效用，例如策略质量、规划相关性、物理一致性或推理提升。
    - 隐式或显式的状态-动态结构被认为核心，趋势是从视觉生成走向对持久状态和演化规则的显式建模。
    分歧:
    - 表示与生成目标存在差异：统一动作-视频扩散、掩码自回归、基于适配器的预训练视频扩散、基于流或DPO对齐的视频世界模型。
    - 监督与对齐信号存在差异：动作标注视频、小规模领域动作数据、人类偏好奖励模型、解耦物理判别器、启发式或断言验证器。
    - 评测目标存在差异：分别强调策略泛化、规划相关性、物理合理性、轨迹一致性、空间推理或实时可控性，缺少统一基准。
    - 数据与规模假设存在差异：大规模多任务机器人数据、小规模动作标注数据、精选物理感知操作数据，使泛化结论难以直接比较。
    开放问题:
    - 当前预训练视频模型是否真正满足形式化状态构建和动态建模假设？需要哪些可测量标准来判断？
    - 缩放能否形成保证或至少形成可预测策略迁移与失效模式的规律？目前测试时缩放在不同基准上表现不一致。
    - 哪些奖励或验证器信号足够校准，可作为可靠的世界模型评测依据？如何避免系统偏差和信息瓶颈？
    - 如何设计测试持续性、因果性和物理合理性的功能基准，并验证其跨本体和任务的泛化能力？
