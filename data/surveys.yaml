  related_work_outline_zh:
  - 主流方向：将视频生成模型重构为面向驾驶、机器人和游戏环境的可控世界模拟器，重点转向以动作或上下文为条件的未来预测，而非单纯视觉生成。
  - 研究共性：系统把学习到的动力学或视频主干与控制、上下文或物理约束结合，并通过开放基准和指标评估保真度、动作遵循、空间一致性或零样本动力学。
  - 关键差异：研究在目标领域、条件注入方式和评测对象上不同；有的强调像素级视觉保真，有的强调动作忠实度、空间图一致性、物理合理性或策略泛化。
  - 趋势演进：2024-2026年的证据显示从独立视频生成走向闭环、低延迟、以基准驱动的交互式仿真，并伴随可复用数据集和代码工件。
  - 开放问题：长时程一致性、跨域泛化、独立复现以及真实部署权衡在样本论文中仍缺少充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Action-controllable driving world models (e.g., Terra ACT-Bench, Vista,
        FAR-Drive)
      what_it_solves: Produce future driving video from trajectory or control signals
        and evaluate action fidelity for simulation or policy assessment.
      what_remains_open: Generalization beyond nuScenes, long-horizon cross-view consistency,
        and multi-GPU or deployment-level real-time scalability remain unresolved.
    - line: Contextual world models for policy learning (e.g., Dreaming of Many Worlds
        with cRSSM)
      what_it_solves: Infer context-conditioned latent dynamics so policies trained
        on imagined rollouts can transfer to unseen dynamics with zero-shot gains.
      what_remains_open: Assumes observable context and is tested on only two CARL
        tasks; broader unseen dynamics and partial or latent context remain unverified.
    - line: Physics-informed and spatial-consistency modeling and evaluation (e.g.,
        RoboScape, LoopNav)
      what_it_solves: Add depth, keypoint, physics, or scene-graph consistency signals
        to improve or measure physical plausibility and spatial coherence.
      what_remains_open: LoopNav reports no experimental results in the abstract,
        while RoboScape lacks visible limitations; real-world robotic grounding and
        metric alignment need independent validation.
    - line: Reusable benchmark and survey infrastructure (e.g., ACT-Bench, interactive
        video world modeling survey)
      what_it_solves: Define missing evaluation surfaces such as action fidelity and
        interactive world modeling challenges, and provide datasets or systematic
        comparisons.
      what_remains_open: Coverage may lag rapid development, evaluation remains concentrated
        on curated datasets, and cross-team reproduction evidence is limited.
    consensus:
    - 'Controllable future-state generation is treated as a system-level capability:
      models must accept actions or context, maintain visual and dynamic consistency,
      and produce usable rollouts for simulation or policy learning.'
    - Evaluation is moving beyond standard generation quality toward action fidelity,
      physical plausibility, spatial consistency, and zero-shot dynamics generalization.
    - Open datasets, benchmarks, and code artifacts are common in this frontier; deployment
      latency and long-horizon stability are recurring concerns even when not fully
      resolved.
    disagreements:
    - 'Representation differs: some lines use explicit context or control embeddings,
      while others use physics or geometry auxiliary tasks or frame-level autoregressive
      structure.'
    - 'Primary evaluation target differs: visual realism, action-instruction adherence,
      spatial graph consistency, physical plausibility, or zero-shot policy transfer
      across unseen contexts.'
    - 'Interaction setting differs: offline benchmark generation and evaluation versus
      closed-loop autonomous driving simulation with sub-second latency requirements.'
    - 'Assumptions differ: some methods assume observable context values, some rely
      on trajectory-annotated driving data, while others rely on physics signals or
      loop-based navigation datasets.'
    open_questions:
    - Can long-horizon autoregressive rollouts preserve spatial, temporal, and cross-view
      consistency beyond existing benchmark sequence lengths?
    - Do current simulators transfer to unseen environments, sensor configurations,
      or context values beyond nuScenes, CARL, Minecraft, and curated robotics datasets?
    - What are the real deployment boundaries for low-latency, high-fidelity, action-controllable
      systems under hardware changes and user-specific settings?
    - How should open code or dataset signals be interpreted when several high-ranking
      papers lack visible limitations or independent cross-team reproduction evidence?
    - 'Which metrics best reflect closed-loop usefulness: action fidelity, physical
      plausibility, spatial consistency, or downstream policy performance?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作可控的驾驶世界模型（如 Terra ACT-Bench、Vista、FAR-Drive）
      解决的问题: 根据轨迹或控制信号生成未来驾驶视频，并评估动作忠实度，以支持仿真和策略评测。
      尚未覆盖: nuScenes 之外的泛化、长时程跨视角一致性，以及多GPU或真实部署级别的实时可扩展性仍待解决。
    - 路线: 用于策略学习的上下文世界模型（如 Dreaming of Many Worlds 的 cRSSM）
      解决的问题: 推断以上下文为条件的潜在动力学，使在想象轨迹上训练的策略能零样本迁移到未见动力学。
      尚未覆盖: 假设上下文可观测，且仅在两个 CARL 任务上测试；部分上下文、潜在上下文及更广泛未见动力学仍待验证。
    - 路线: 物理信息与空间一致性建模与评测（如 RoboScape、LoopNav）
      解决的问题: 引入深度、关键点、物理或场景图一致性信号，提升或量化物理合理性与空间连贯性。
      尚未覆盖: LoopNav 摘要未报告实验结果，RoboScape 未提供可见局限性；真实机器人落地与指标对齐需要独立验证。
    - 路线: 可复用基准与综述基础设施（如 ACT-Bench、交互式视频世界建模综述）
      解决的问题: 定义动作忠实度等缺失评测面，并提供数据集或系统比较。
      尚未覆盖: 快速进展下覆盖可能不全，评测仍集中于精选数据集，跨团队复现证据不足。
    共识:
    - 可控未来状态生成被视为系统级能力：模型需接收动作或上下文，保持视觉与动力学一致性，并产出可用于仿真或策略学习的轨迹。
    - 评测正在从标准生成质量扩展到动作忠实度、物理合理性、空间一致性和零样本动力学泛化。
    - 该前沿工作普遍提供开放数据集、基准或代码工件；即使尚未完全解决，部署延迟与长时程稳定性仍是反复出现的关注点。
    分歧:
    - 表示方式不同：有的路线采用显式上下文或控制嵌入，有的采用物理或几何辅助任务，还有的采用帧级自回归结构。
    - 主要评测目标不同：分别关注视觉真实感、动作指令遵循、空间图一致性、物理合理性，或未见上下文下的策略迁移。
    - 交互模式不同：离线基准生成与评测，相对闭环自动驾驶仿真中的亚秒级延迟要求存在差异。
    - 假设不同：有的假设上下文值可观测，有的依赖轨迹标注驾驶数据，有的依赖物理信号或循环导航数据集。
    开放问题:
    - 长时程自回归推演能否在现有基准序列长度之外保持空间、时间和跨视角一致性？
    - 当前模拟器能否泛化到 nuScenes、CARL、Minecraft 和精选机器人数据集之外的环境、传感器配置或上下文值？
    - 在硬件变化和用户特定设置下，低延迟、高保真、动作可控系统的真实部署边界是什么？
    - 当若干高排名论文缺少可见局限性或独立跨团队复现证据时，开放代码或数据集信号应如何解读？
    - 哪些指标最能反映闭环有用性：动作忠实度、物理合理性、空间一致性，还是下游策略性能？
