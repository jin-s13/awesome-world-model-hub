  - 'Key differences: evaluation targets range from spatial consistency and action
    fidelity to planning realism; conditioning spans trajectory, high-level intent,
    action, and physical context; architectures include recurrent state-space models,
    diffusion transformers, autoregressive generators, and plug-in adapters.'
  - 'Trend evolution: the highest-ranked evidence is concentrated in 2024-2026, showing
