  related_work_outline:
  - 'Mainstream direction: Transformer/diffusion-based video world models with auxiliary
    self-supervised tasks and action or language conditioning for control and planning.'
  - 'Shared research pattern: Learning latent or video dynamics from high-dimensional
    observations, then using generated rollouts for policy learning, planning, or
    consistency benchmarks.'
  - 'Key differences: Representation spans stochastic latent state-space models and
    explicit video/diffusion generation; supervision, task domains, interaction modes,
    and evaluation targets differ.'
  - 'Trend evolution: Available evidence shows a shift from recurrent latent world
    models for sample-efficient RL toward diffusion-based video world models and closed-loop
    action-control benchmarks, concentrated around 2023-2026.'
  - 'Open questions: Cross-domain transfer, long-term memory and spatial consistency,
    model-versus-planner attribution, and reproducibility boundaries remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：基于Transformer/扩散的视频世界模型，结合辅助自监督任务，并将动作或语言条件引入动力学与控制。
  - 研究共性：从高维观测学习潜在或视频动力学，利用生成轨迹支持策略学习、规划或进行一致性评测。
  - 关键差异：表示分为潜在状态空间与显式视频生成；监督信号、任务域和交互方式不同。
  - 趋势演进：从样本高效强化学习的循环潜在世界模型，转向扩散视频世界模型与动作/控制闭环评测，当前处于前沿集中。
  - 开放问题：跨域迁移、长期记忆与空间一致性、模型与规划器贡献分离、复现边界均需更充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Stochastic latent state-space world models for model-based reinforcement
        learning
      what_it_solves: Converts observed trajectories into compact latent dynamics
        and imagined rollouts for sample-efficient policy learning.
      what_remains_open: Whether context and dynamics identifiability assumptions
        transfer beyond two CARL tasks or Atari-style visual control remains unverified.
    - line: Diffusion Transformer video world models with reconstruction or physics
        auxiliary objectives
      what_it_solves: Learns high-dimensional visual future prediction with mask reconstruction,
        depth, or keypoint dynamics to improve fidelity and physical plausibility.
      what_remains_open: Cross-domain and zero-shot generalization evidence remains
        limited; long-horizon physical consistency beyond reported driving and robot
        datasets is unresolved.
    - line: Unified or compositional action-video interfaces
      what_it_solves: Couples action and video generation, or factorizes language
        into primitive video plans, enabling world models to serve as policies or
        planners.
      what_remains_open: How far composition generalizes to novel primitives, unseen
        action spaces, or real-world execution beyond simulation and demonstration
        data is unclear.
    - line: Closed-loop consistency and action-control benchmark design
      what_it_solves: Provides evaluation protocols for spatial consistency, memory
        consistency, and action responsiveness rather than frame realism alone.
      what_remains_open: Benchmark results and baselines are only partially reported;
        open-domain long-term memory and cross-action-space generalization remain
        unresolved.
    consensus:
    - World-model learning is moving from latent recurrent state-space dynamics toward
      transformer and diffusion architectures for high-dimensional visual prediction.
    - Auxiliary self-supervised tasks are used to stabilize generation and encode
      geometry or physics, including mask reconstruction, depth prediction, and keypoint
      dynamics.
    - Conditioning on context, language, goals, or actions is treated as essential
      for control, planning, and zero-shot generalization.
    - Evaluation is expanding from visual quality to closed-loop consistency, action
      controllability, and spatial or temporal coherence.
    disagreements:
    - Representation differs between compact stochastic latent states and explicit
      video/diffusion generation.
    - 'Supervision differs: some methods rely on reconstruction/generation, while
      others add physics-informed or action-coupling objectives.'
    - Evaluation targets differ across Atari/CARL benchmarks, driving video datasets,
      robot manipulation datasets, and open-domain first/third-person videos.
    - 'Interaction mode differs: imagined rollouts for policy learning, decomposed
      language-goal video plans, unified action-video diffusion, and benchmark action-control
      loops.'
    open_questions:
    - Which auxiliary objectives transfer beyond the reported task families and datasets?
    - How much of reported policy or inference gains come from the learned dynamics
      rather than the planner, controller, or task prior?
    - Can these models maintain long-term memory and spatial consistency across unseen
      viewpoints, scenes, and action spaces?
    - Do current benchmarks isolate method contributions from surrounding system choices
      and dataset-specific metrics?
    - Several works lack visible code, limitation statements, or benchmark results,
      leaving reproducibility and failure boundaries as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向模型强化学习的随机潜在状态空间世界模型
      解决的问题: 将观测轨迹压缩为潜在动力学和想象轨迹，支持样本高效策略学习。
      尚未覆盖: 上下文和动力学可识别性是否可迁移到CARL和Atari之外的场景仍缺乏证据。
    - 路线: 扩散Transformer视频世界模型与重建/物理辅助目标
      解决的问题: 通过掩码重建、深度或关键点动力学辅助任务，提升视频预测保真度与物理合理性。
      尚未覆盖: 跨域和零样本泛化证据有限，驾驶/机器人数据集之外的长期物理一致性尚未验证。
    - 路线: 统一或组合式动作-视频接口
      解决的问题: 将动作与视频生成耦合，或将语言分解为原语视频计划，使世界模型可用于策略或规划。
      尚未覆盖: 对全新原语、未见动作空间和真实机器人执行的泛化仍不明确。
    - 路线: 闭环一致性与动作控制基准设计
      解决的问题: 提供空间一致性、记忆一致性和动作响应的评测协议，而不仅是单帧真实性。
      尚未覆盖: 部分基准结果和基线尚未报告；开放域长期记忆与跨动作空间泛化仍是未解决问题。
    共识:
    - 世界模型学习正从潜在循环状态空间转向Transformer和扩散架构，用于高维视觉预测。
    - 辅助自监督任务被用于稳定生成并注入几何或物理信息，如掩码重建、深度预测和关键点动力学。
    - 上下文、语言、目标或动作条件被视为实现控制、规划和零样本泛化的关键要素。
    - 评测从视觉质量扩展到闭环一致性、动作可控性和时空连贯性。
    分歧:
    - 表示方式不同：紧凑随机潜在状态与显式视频/扩散生成并存。
    - 监督信号不同：方法分别依赖重建/生成、物理先验或动作-视频耦合。
    - 评测目标不同：覆盖Atari/CARL、驾驶视频、机器人操纵和开放域第一/第三人称视频。
    - 交互模式不同：想象轨迹用于策略学习、语言-目标视频规划、统一动作-视频扩散或基准动作控制。
    开放问题:
    - 哪些辅助目标能迁移到已报告任务族和数据集之外？
    - 策略或推理收益有多少来自模型本身，而不是规划器、控制器或任务先验？
    - 模型能否在未见视角、场景和动作空间中保持长期记忆与空间一致性？
    - 当前基准是否隔离了方法贡献，而非受数据集特定指标和系统选择影响？
    - 部分研究缺少可见代码、局限说明或基准结果，复现性和失败边界仍是验证缺口。
