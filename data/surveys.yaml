  related_work_outline:
  - 'Mainstream direction: Generative world models centered on diffusion transformers
    and transformer sequence models for embodied settings such as driving, robotics,
    and open-world navigation, with a shift toward unifying video and action dynamics.'
  - 'Shared research pattern: Combine video/dynamics generation with auxiliary self-supervised
    tasks or conditioning such as mask reconstruction, depth/keypoint prediction,
    context, language primitives, or paired actions, then evaluate on visual fidelity,
    consistency, or downstream policy utility.'
  - 'Key differences: Representation choices range from stochastic state-space and
    Transformer-VAE to masked diffusion DiT, language-primitive factorization, physics-informed
    auxiliary tasks, and unified video-action diffusion; evaluation targets include
    closed-loop memory/action consistency, zero-shot context generalization, and robot
    execution.'
  - 'Trend evolution: The top evidence clusters in 2023-2026, moving from efficient
    RL world models toward large-scale embodied diffusion models and dedicated spatial/memory
    benchmarks, so the observed trend reflects the current frontier rather than the
    full 2015-2026 span.'
  - 'Open questions: Long-horizon memory and spatial consistency, cross-action-space
    and unseen-primitive/context generalization, real-world transfer, isolating model
    versus planner/data contributions, and verification gaps from unreported limitations,
    code, datasets, or baselines remain unresolved.'
  related_work_outline_zh:
  - 主流方向：以扩散Transformer、序列模型为核心的具身生成式世界模型，覆盖驾驶、机器人和开放世界导航，并逐步统一视频与动作动力学。
  - 研究共性：将视频/动力学生成与掩码、深度/关键点、上下文、语言原语或动作等条件结合，以视觉逼真度、一致性或下游策略评估模型。
  - 关键差异：表示层包括随机状态空间、Transformer+VAE、掩码扩散DiT、语言原语分解、物理辅助任务和统一视频-动作扩散；评测目标从零样本上下文泛化到记忆/动作一致性、真实/仿真执行不等。
  - 趋势演进：证据集中在2023-2026年，从高效RL世界模型转向大规模具身扩散模型和专用空间/记忆基准，整体属于当前前沿而非跨2015-2026年的完整演进。
  - 开放问题：长时记忆与空间一致性、跨动作空间和未见原语/上下文泛化、真实环境迁移、模型相对规划器与数据的贡献、未报告局限/代码/数据集/基线等验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: 'Turns world-model ideas into concrete architectures, losses,
        and training recipes: masked diffusion transformers, Transformer-VAE stochastic
        models, contextual recurrent state-space models, language-primitive factorization,
        physics-informed auxiliary tasks, and unified video-action diffusion.'
      what_remains_open: Whether these design choices transfer beyond the reported
        driving, Atari, CARL, RT-X, or robotic settings, and how they handle unseen
        primitives, unobserved context, novel physical properties, long-horizon memory,
        and spatial consistency.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned dynamics to action, control, and policy pathways
        through imagination training, video plans for robot execution, downstream
        policy training/evaluation, and flexible policy/forward/inverse dynamics representations.
      what_remains_open: How much gain comes from the world model rather than the
        planner, controller, action prior, or training data; real-robot execution
        evidence remains thin, and cross-action-space control generalization is still
        unresolved.
    - line: Method evidence and ablation protocol
      what_it_solves: 'Provides standardized evaluation surfaces for method comparison:
        Atari-style benchmark scores, spatial consistency metrics such as scene-graph
        consistency, and closed-loop memory/action-control benchmarks with shared
        and varied action spaces.'
      what_remains_open: Evidence often stops short of isolating the proposed method
        from surrounding system choices; several top papers lack visible limitations
        or ablations, one benchmark reports no experimental results, and limited-task
        evaluations leave broader transfer unverified.
    consensus:
    - World models are increasingly built around generative video/dynamics modeling
      with transformer or diffusion backbones and self-supervised or auxiliary objectives.
    - Evaluation is moving beyond visual quality toward downstream policy utility,
      long-horizon consistency, spatial coherence, and action-conditioned control.
    - Conditioning on context, language, action, depth, or keypoint information is
      treated as a route to more generalizable or physically plausible world models.
    - Embodied settings such as driving, robotics, and open-world navigation dominate
      the current frontier evidence.
    disagreements:
    - 'Representation-level: stochastic latent state-space models differ from masked
      diffusion transformers, Transformer-VAE hybrids, language-primitive factorizations,
      physics-informed auxiliary-task models, and unified video-action diffusion.'
    - 'Supervision and conditioning differ: self-supervised mask/depth/keypoint cues
      contrast with explicit context values, natural-language primitive decomposition,
      or paired video-action data.'
    - 'Evaluation targets differ: closed-loop memory and action control, spatial consistency,
      zero-sample context generalization, standardized game scores, and simulated
      or real robot execution are not interchangeable.'
    - 'Interaction and deployment settings differ: open-loop video prediction, closed-loop
      action-conditioned generation, imagination-based policy training, and downstream
      policy evaluation create distinct method pressures.'
    - Some papers report state-of-the-art task results while others provide benchmarks
      or qualitative evidence; this makes direct method comparison subject to unverified
      baseline, metric, and limitation details.
    open_questions:
    - Which architectural or training objective choices are necessary for long-horizon
      memory and spatial consistency under closed-loop action control?
    - Do the reported generalization gains persist beyond narrow evaluation settings
      such as two contextual control tasks, seen language primitives, or specific
      robotic and driving datasets?
    - How can future evidence separate the world model contribution from the planner,
      controller, action prior, data scale, and domain-specific inductive biases?
    - What real-world and cross-action-space evidence is needed to support claims
      about embodied world models, given the current reliance on simulation and controlled
      video benchmarks?
    - Which missing limitations, code, datasets, baseline details, or ablations are
      verification gaps rather than proof of absence in the bounded packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 把世界模型想法落实为具体架构、损失和训练配方，包括掩码扩散Transformer、Transformer-VAE随机模型、上下文循环状态空间模型、语言原语分解、物理辅助任务和统一视频-动作扩散。
      尚未覆盖: 这些设计能否迁移到已报告的驾驶、Atari、CARL、RT-X或机器人场景之外；如何处理未见原语、不可观测上下文、新物理属性、长时记忆和空间一致性仍未明确。
    - 路线: 规划与动作接口方法
      解决的问题: 通过想象训练、视频计划、下游策略训练评估以及灵活的策略/前向/逆动力学表示，把学到的动力学连接到动作、控制和策略路径。
      尚未覆盖: 收益中有多少来自世界模型而非规划器、控制器、动作先验或数据；真实机器人执行证据仍不足，跨动作空间控制泛化也未解决。
    - 路线: 方法证据与消融协议
      解决的问题: 提供标准化评测面以比较方法：Atari式基准分数、场景图一致性空间指标，以及共享和变化动作空间的闭环记忆/动作控制基准。
      尚未覆盖: 证据常未隔离方法本身与周边系统选择；若干top论文缺少可见局限或消融，一项基准未报告实验结果，有限任务评估无法验证更广泛迁移。
    共识:
    - 世界模型越来越多地围绕生成式视频/动力学建模构建，采用Transformer或扩散骨干并结合自监督或辅助目标。
    - 评测正从视觉质量转向下游策略效用、长时一致性、空间连贯性和动作条件控制。
    - 上下文、语言、动作、深度或关键点等条件被视为提升泛化或物理合理性的重要途径。
    - 驾驶、机器人和开放世界导航等具身场景主导当前前沿证据。
    分歧:
    - 表示层差异：随机潜在状态空间模型与掩码扩散Transformer、Transformer-VAE混合、语言原语分解、物理辅助任务模型和统一视频-动作扩散不同。
    - 监督与条件差异：自监督掩码/深度/关键点线索与显式上下文值、自然语言原语分解或配对视频-动作数据形成对比。
    - 评测目标差异：闭环记忆与动作控制、空间一致性、零样本上下文泛化、标准化游戏分数和仿真或真实机器人执行不可互换。
    - 交互与部署差异：开环视频预测、闭环动作条件生成、想象策略训练和下游策略评估对方法提出不同压力。
    - 部分工作报告最先进任务结果，另一些提供基准或定性证据，未经验证的基线、指标和局限细节使直接比较困难。
    开放问题:
    - 哪些架构或训练目标选择对闭环动作控制下的长时记忆和空间一致性是必要的？
    - 报告中的泛化收益能否在更广的设置中保持，例如两个上下文控制任务、已见语言原语或特定机器人和驾驶数据集之外？
    - 未来证据如何区分世界模型贡献与规划器、控制器、动作先验、数据规模和领域先验的贡献？
    - 鉴于当前依赖仿真和受控视频基准，具身世界模型还需要哪些真实环境与跨动作空间证据？
    - 在有限证据包中，哪些缺失的局限、代码、数据集、基线细节或消融属于验证缺口，而不是方法本身缺失的证明？
