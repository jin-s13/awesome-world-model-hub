    - 'Emphasis: evaluation-oriented works stress design of latent representations
      and structural priors, whereas roadmap-oriented works highlight action-conditioned
      generation and real-time interactivity.'
    open_questions:
    - How can taxonomic frameworks be empirically validated to ensure they capture
      the full diversity of methods and do not exclude emerging approaches?
    - What are the most critical open challenges (e.g., out-of-sight dynamics, compositional
      generalization, real-time latency) that, if solved, would most advance world
      model capabilities?
    - How can evaluation frameworks be standardized across applications to enable
      fair comparison, and what resource-aware metrics should be adopted to reflect
      real-world deployment constraints?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化领域组织为清晰的方向、设计维度和未来研究里程碑。
      尚未覆盖: 分类体系是否由全领域系统性证据支撑且可被实证验证，而非仅依赖选择性示例。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（指标、基准、协议）如何影响结论，并比较跨应用领域现有评测框架的优劣。
      尚未覆盖: 不同设置下被比较结果的兼容性；许多评测框架仅被提出而未被实施或测试，其有效性仍待验证。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛文献覆盖转化为具体、可操作的研究问题，并识别尚未解决的技术挑战。
      尚未覆盖: 哪些缺口对进展最为关键的优先级排序；映射通常反映当前已知局限，但可能遗漏快速演变领域中的新兴问题。
    共识:
    - 结构化分类法对于应对视频生成、自动驾驶和机器人等不同领域世界模型研究的快速增长是必要的。
    - 标准化评测基准和指标对于比较方法和衡量进展至关重要，但当前基准是碎片化且领域特定的。
    - 关键技术挑战包括动作条件可控性、长时域时间一致性以及维持持久世界状态的记忆机制。
    分歧:
    - 覆盖范围：一些综述旨在涵盖所有世界模型的通用伞形框架，而另一些则聚焦于自动驾驶或交互视频等单一应用。
    - 评测成熟度：一篇综述提出了包含资源感知指标的详细潜在空间评测框架，但仍为理论性；另一篇则比较了四个领域的现有基准但未实施新基准。
    - 侧重点：评测导向的工作强调潜在表示和结构先验的设计，而路线图导向的工作则强调动作条件生成和实时交互性。
    开放问题:
    - 如何对分类框架进行实证验证，以确保其覆盖方法的多样性且不遗漏新兴方法？
    - 哪些关键挑战（如视线外动态、组合泛化、实时延迟）一旦解决，最能推动世界模型能力的进步？
    - 如何跨应用标准化评测框架以实现公平比较，以及应采用哪些资源感知指标来反映真实部署约束？
