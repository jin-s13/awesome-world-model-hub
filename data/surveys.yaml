  - 关键差异：部分系统面向开放世界的空间一致性评分，部分面向动作忠实度或闭环驾驶模拟，部分面向跨具身合成数据；表示选择涉及场景图分数、物理关键点/深度任务、通用潜在动作等。
  - 趋势演进：证据从基准构建和单模型保真度改进，走向关注延迟的闭环与跨具身系统框架；可用年份较窄，主要反映当前前沿。
