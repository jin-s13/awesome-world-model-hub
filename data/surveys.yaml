    - 基准特定指标的提升能否可靠地转化为更好的真实世界任务性能，例如更安全的驾驶策略或更鲁棒的机器人操作？
    - 揭示当前世界模型失效模式所需的最小压力测试集是什么，以及如何防止对已知基准的过拟合？
