  - 'Shared research pattern: Systems combine generative sequence/diffusion models
    with auxiliary self-supervised tasks such as mask reconstruction, depth/keypoint
    prediction, context conditioning, or action diffusion, then evaluate via benchmark
    scores or policy rollouts.'
  - 'Key differences: Works split by domain and supervision, including driving multi-view
    generation, robotics physical/compositional/action-coupled models, sample-efficient
    game/RL dynamics, and benchmark-based memory/action evaluation.'
  - 'Trend evolution: Evidence moves from sample-efficient model-based RL toward diffusion-based
    generative world models and dedicated consistency/action-control benchmarks, mostly
    within the 2023-2026 frontier.'
  - 'Open questions: Real-world safety and operational alignment, transfer across
    embodiments/datasets, long-term memory consistency, context or primitive assumptions,
    and closed-loop certification metrics remain unresolved.'
  related_work_outline_zh:
  - 主流方向：驾驶与机器人领域的世界模型应用占主导，重点在视频预测、长时域/多视角生成、物理合理合成以及视频-动作耦合预训练。
  - 研究共性：生成式序列或扩散模型与自监督辅助任务结合，如掩码重建、深度/关键点预测、上下文条件化或动作扩散，并通过基准或策略 rollout 评测。
  - 关键差异：研究按领域和监督信号分化，包括驾驶多视角生成、机器人物理/组合/动作耦合模型、游戏/RL 样本高效动力学，以及针对记忆和动作控制的基准评测。
  - 趋势演进：从样本高效的模型基强化学习转向扩散生成式世界模型和专门的记忆/动作控制基准，时间集中在 2023-2026 前沿。
  - 开放问题：真实安全与运营收益对齐、跨本体/数据集迁移、长期记忆一致性、上下文或原语假设、以及闭环认证指标仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Driving world models for multi-view and long-horizon scene prediction
      what_it_solves: Domain-generalizable video prediction across driving datasets
        using mask reconstruction and shifted attention over spatial-temporal views.
      what_remains_open: Real-world closed-loop safety and operational validity are
        not directly demonstrated; reported limitations are sparse, leaving deployment
        boundaries as a verification gap.
    - line: Memory, spatial consistency, and action-control evaluation
      what_it_solves: Quantifies spatial consistency, long-term memory, and action
        control in open-domain or interactive videos via dedicated benchmarks.
      what_remains_open: Current models still struggle with long-term consistency
        and cross-action-space generalization, and broader benchmark adoption or correlation
        with real tasks is unverified.
    - line: Contextual and sample-efficient model-based reinforcement learning
      what_it_solves: Learns latent dynamics and policies from imagined rollouts while
        conditioning on context for zero-shot generalization.
      what_remains_open: Assumes observable context and is evaluated on narrow CARL/Atari
        settings; generalization beyond simplified tasks remains uncertain.
    - line: Robotic video generation and action-dynamics pretraining
      what_it_solves: Builds compositional, physics-informed, or video-action coupled
        world models for robot imagination, policy learning, and policy evaluation.
      what_remains_open: Real-robot execution, novel primitive composition, and transfer
        across robot datasets or embodiments are only partially validated or not shown.
    consensus:
    - World models are specialized through auxiliary objectives tied to the application
      domain, such as mask reconstruction, physical prediction, context conditioning,
      or action diffusion.
    - Generated video or imagined rollouts serve not only as visual prediction but
      also as substrates for policy learning, planning, or closed-loop evaluation.
    - Benchmarks increasingly measure consistency and control rather than only pixel-level
      generation quality.
    - Recent work favors unified generative architectures that couple visual dynamics
      with actions or other conditioning signals.
    disagreements:
    - 'Supervision differs: some use pixel/video reconstruction objectives, some add
      physical or geometric auxiliary tasks, and others couple action diffusion or
      language-primitive factorization.'
    - 'Evaluation targets diverge: visual fidelity, physical plausibility, zero-shot
      policy return, spatial/memory consistency, and action control are privileged
      differently.'
    - Deployment settings vary from offline multi-view driving and open-domain video
      to simulated robot execution, game environments, and large robot datasets; cross-setting
      evidence remains scarce.
    - Assumptions differ around context observability and predefined primitive vocabularies
      versus more data-driven unified modeling, affecting the strength of generalization
      claims.
    open_questions:
    - Do benchmark gains in simulated or video-based world models align with real-world
      safety, operational performance, and physical execution?
    - How can long-horizon memory consistency and cross-action-space control be achieved
      without task-specific loop or mask designs?
    - Do compositional, physics-informed, or action-coupled world models transfer
      across unseen embodiments, datasets, and physical environments?
    - What evaluation metrics can jointly certify visual plausibility, dynamics correctness,
      and closed-loop action control?
    - Are context observability and primitive decomposition assumptions scalable to
      real application settings with partially observed contexts and novel tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型的场景预测与多视角/长时域生成
      解决的问题: 通过掩码重建和时空视角上的移位注意力，提升驾驶视频预测在不同数据集上的泛化能力。
      尚未覆盖: 真实闭环安全与运营有效性未直接验证；局限性报告稀疏，部署边界仍是证据缺口。
    - 路线: 记忆一致性、空间一致性与动作控制评测
      解决的问题: 通过专门基准量化开放域或交互视频中的空间一致性、长期记忆和动作控制。
      尚未覆盖: 当前模型在长期一致性和跨动作空间泛化上仍有困难，基准推广及与真实任务相关性未证实。
    - 路线: 上下文与样本高效的模型基强化学习
      解决的问题: 利用想象 rollout 学习潜在动力学和策略，并通过上下文条件化实现零样本泛化。
      尚未覆盖: 假设上下文可观测，且仅在 CARL/Atari 等有限设置上验证，超出简化任务后的泛化仍不确定。
    - 路线: 机器人视频生成与动作-动力学预训练
      解决的问题: 构建组合式、物理信息或视频-动作耦合的世界模型，用于机器人想象、策略学习和策略评估。
      尚未覆盖: 真实机器人执行、全新原语组合和跨数据集/本体迁移仅部分验证或未展示。
    共识:
    - 世界模型通过与应用领域绑定的辅助目标进行专门化，如掩码重建、物理预测、上下文条件化或动作扩散。
    - 生成视频或想象 rollout 不仅用于视觉预测，还被用作策略学习、规划或闭环评估的基础。
    - 基准越来越关注一致性和控制，而不仅是像素级生成质量。
    - 近期工作偏好统一生成架构，将视觉动态与动作或其他条件信号耦合。
    分歧:
    - 监督信号不同：有的使用像素/视频重建目标，有的增加物理或几何辅助任务，有的耦合动作扩散或语言原语分解。
    - 评测目标不同：视觉保真度、物理合理性、零样本策略回报、空间/记忆一致性和动作控制被不同地优先。
    - 部署设置不同：从离线多视角驾驶、开放域视频到仿真机器人执行、游戏环境和大规模机器人数据集各不相同；跨设置证据稀缺。
    - 关于上下文可观测性和预定义原语词汇的假设不同，影响泛化声明的强度。
    开放问题:
    - 仿真或视频基准中的世界模型提升是否与真实安全、运营性能和物理执行对齐？
    - 如何在不依赖任务特定环路或掩码设计的情况下，实现长期记忆一致性和跨动作空间控制？
    - 组合式、物理信息或动作耦合世界模型能否跨未见本体、数据集和物理环境迁移？
    - 哪些评测指标可联合认证视觉合理性、动力学正确性和闭环动作控制？
    - 上下文可观测性和原语分解假设能否扩展到部分可观测和全新任务的真实应用？
