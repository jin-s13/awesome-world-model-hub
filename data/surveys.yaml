  related_work_outline_zh:
  - 主流方向：证据集中在世界模型综述与分类体系，尤其是生成式视频、交互式模拟和自动驾驶潜在世界模型；方法论文作为可控性、长时记忆和实时推理的示例。
  - 研究共性：综述与原始研究普遍按应用场景、状态演化和模态组织；动作条件可控性、长时一致/记忆、实时响应反复出现。
  - 关键差异：理论综合与经验生成/机器人学习的目标不同；表示选择涵盖语言原语、自我运动/姿态、潜在状态/令牌、3D全局状态；评测覆盖仿真、真实机器人和基准对比。
  - 趋势演进：2022-2026从物理机器人世界模型学习，转向Sora式通用视频模拟，再转向交互式、开源、视线外动态与自动驾驶分类，属于当前前沿内的快速迭代。
  - 开放问题：系统纳入标准、基准兼容性、训练组合外泛化、真实机器人闭环验证、缺口优先级仍未解决；读先与引用分数独立于方法与可复现证据，代码/数据集/局限缺失属于验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented world-model research into application scenarios,
        design spaces, internal mechanics, and future directions.
      what_remains_open: Systematic search or inclusion evidence is not shown; taxonomies
        can become outdated quickly and may remain theoretically proposed without
        empirical validation.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes benchmark and metric choices across open-world, game,
        autonomous driving, and robotics, and proposes evaluation frameworks such
        as closed-loop metric suites and resource-aware inference cost.
      what_remains_open: Cross-setting comparability is not established, and several
        evaluation prescriptions are not implemented or tested.
    - line: Open problem and gap mapping
      what_it_solves: 'Converts broad literature coverage into concrete challenges:
        action-conditioned controllability, long-horizon memory, real-time responsiveness,
        out-of-sight dynamics, and generalization beyond seen primitives.'
      what_remains_open: Gap prioritization is missing; many methods have verification
        gaps from absent code, dataset, baseline, or limitation details.
    consensus:
    - World-model work is commonly organized by application scenario, world-state
      evolution, and scene modality.
    - Action-conditioned controllability, long-horizon consistency or memory, and
      real-time responsiveness appear as recurring core challenges.
    - Benchmarks and metrics are treated as necessary but remain fragmented or not
      yet empirically unified.
    - Representation and generation approaches emphasize compositional, latent, or
      global state designs to improve consistency and generalization.
    disagreements:
    - 'Representation: methods use language-primitive factorization, ego-motion/pose
      controls, latent state/token/action frameworks, or persistent 3D global states
      with dynamic entities.'
    - 'Evaluation target: some works learn on physical robots or simulation, while
      surveys compare benchmarks; several method results are limited to simulation
      or do not include real-robot execution.'
    - 'Validation mode: review-style works often propose conceptual frameworks without
      empirical testing, whereas method papers report generation or learning results
      but differ in latency, scale, and baselines.'
    - 'Interaction and deployment setting: real-time interactive video generation,
      offline future-frame prediction, and simulator-based robot planning represent
      distinct assumptions.'
    open_questions:
    - Can survey comprehensiveness be verified without systematic inclusion criteria
      or search protocol details in the packet?
    - Are benchmark and metric comparisons compatible across open-world, game, autonomous
      driving, and robotics settings?
    - Do compositional, latent, or global-state representations generalize to entirely
      novel primitives, objects, actions, or environments beyond training combinations?
    - Can proposed real-time, long-horizon, out-of-sight, and resource-aware evaluation
      frameworks be validated in real-robot closed-loop settings?
    - Which gaps matter most for progress, and how should missing code, dataset, baseline,
      and limitation signals be treated as verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化世界模型研究映射到应用场景、设计空间、内部机制与未来方向。
      尚未覆盖: 证据包未显示系统检索或纳入标准；分类可能快速过时，并可能停留在理论提出而缺乏实证验证。
    - 路线: 对比评测综合
      解决的问题: 汇总不同应用领域的基准与指标选择，提出闭环度量套件、资源感知推理成本等评测框架。
      尚未覆盖: 跨设置兼容性尚未建立，若干评测方案未被实施或测试。
    - 路线: 开放问题与缺口映射
      解决的问题: 把文献覆盖转化为动作条件可控性、长时记忆、实时响应、视线外动态和训练组合外泛化等具体问题。
      尚未覆盖: 缺口优先级缺失；许多方法因代码、数据集、基线或局限性信息缺失而存在验证缺口。
    共识:
    - 世界模型研究普遍按应用场景、状态演化和场景模态组织。
    - 动作条件可控性、长时一致性或记忆、实时响应反复出现。
    - 基准和指标被视为必要，但仍碎片化或缺乏实证统一。
    - 表示和生成路线强调组合、潜在或全局状态设计以提升一致性和泛化。
    分歧:
    - 表示：有的用语言原语分解，有的用自我运动/姿态控制，有的用潜在状态/令牌/动作框架，有的用持久3D全局状态与动态实体。
    - 评测目标：部分在真实机器人或仿真中学习，部分综述比较基准；一些方法结果仅限仿真或未含真实机器人执行。
    - 验证方式：综述类工作常提出概念框架而未经实证测试，方法论文报告生成或学习结果，但在延迟、规模和基线上不统一。
    - 交互与部署：实时交互视频生成、离线未来帧预测、基于模拟的机器人规划代表不同假设。
    开放问题:
    - 证据包未展示系统检索或纳入标准时，能否验证综述的全面性？
    - 跨开放世界、游戏、自动驾驶和机器人的基准与指标比较是否真正兼容？
    - 组合、潜在或全局状态表示能否泛化到训练组合之外的全新原语、物体、动作和环境？
    - 所提出的实时、长时程、视线外动态和资源感知评测框架能否在真实机器人闭环环境中被验证？
    - 哪些缺口最值得优先解决？代码、数据集、基线和局限信号缺失应如何作为验证缺口处理？
