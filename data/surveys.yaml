  related_work_outline:
  - 'Mainstream direction: Video generation models, especially diffusion-based architectures,
    serve as world models for robotics and autonomous driving, enabling long-horizon
    visual prediction.'
  - 'Shared research pattern: Large-scale pretraining on multimodal datasets, incorporation
    of action conditions, and joint optimization of visual fidelity and physical plausibility.'
  - 'Key differences: Architectures diverge into diffusion, stochastic latent dynamics,
    and compositional designs; training objectives range from video reconstruction
    to reinforcement learning; evaluation varies from open-loop prediction to closed-loop
    policy assessment.'
  - 'Trend evolution: From 2023 Transformer+VAE models to 2025 diffusion-dominated
    approaches with explicit physics priors and emerging benchmarks for spatial consistency;
    rapid frontier development within 2023–2026.'
  - 'Open questions: How to generalize physical consistency metrics beyond spatial
    loops, reduce diffusion model latency for real-time control, and automatically
    discover compositional primitives.'
  related_work_outline_zh:
  - 主流方向：视频生成模型（尤其是扩散架构）作为世界模型，用于机器人和自动驾驶，实现长时域视觉预测。
  - 研究共性：在多模态数据集上大规模预训练，融入动作条件，联合优化视觉保真度和物理合理性。
  - 关键差异：架构分为扩散、随机潜在动力学和组合式设计；训练目标从视频重建到强化学习；评估从开环预测到闭环策略评估。
  - 趋势演进：从2023年Transformer+VAE模型到2025年扩散模型主导，显式物理先验和空间一致性基准出现；2023-2026年前沿快速演进。
  - 开放问题：如何将物理一致性度量扩展到空间循环之外，降低扩散模型延迟以支持实时控制，以及自动发现组合原语。
  literature_review:
    line_of_work_matrix:
    - line: Video generation world model architectures (diffusion and compositional)
      what_it_solves: Learning to generate future video frames from action or language
        instructions, enabling visual prediction and planning across diverse scenes.
      what_remains_open: Physical consistency is mostly learned implicitly; explicit
        physics constraints are limited, and the computational cost of diffusion models
        hinders real-time control.
    - line: Stochastic latent state-space dynamics (e.g., Dreamer variants, STORM)
      what_it_solves: Modeling environment stochasticity in compact latent spaces
        for sample-efficient reinforcement learning and policy imagination.
      what_remains_open: Assumes observable context or fixed dynamics; generalization
        to partially observable or dynamically changing contexts is not yet demonstrated.
    - line: Joint action-video diffusion and policy optimization
      what_it_solves: Unifying action and video generation in a single model so that
        the world model can directly support policy learning, evaluation, or planning
        without separate controllers.
      what_remains_open: Out-of-distribution action exploration can cause overestimation;
        it is unclear whether gains come from the model or the coupled training procedure.
    - line: World model evaluation benchmarks focusing on spatial consistency
      what_it_solves: Providing metrics like scene graph consistency to quantify long-term
        spatial coherence of generated trajectories, beyond pixel-level fidelity.
      what_remains_open: Current benchmarks are limited to a single environment (Minecraft)
        and do not cover multimodal, multi-task, or closed-loop decision-making scenarios.
    consensus:
    - World models are shifting from single-step image reconstruction to multi-step
      video generation, with a strong emphasis on long-horizon consistency.
    - Action conditioning is a core component, either through explicit action embeddings
      or joint diffusion, enabling the model to serve as both a dynamics simulator
      and a policy.
    - Physical priors such as depth maps, keypoints, and physics-informed losses are
      increasingly integrated to improve realism beyond purely visual fidelity.
    - Large-scale pretraining on diverse datasets is a shared strategy to achieve
      generalization across tasks, domains, and initial conditions.
    disagreements:
    - 'Architectural choices: diffusion-based video generators (MaskGWM, RoboScape,
      UWM) versus stochastic latent dynamics with Transformers or VAEs (STORM, cRSSM).'
    - 'Training objectives: video reconstruction loss versus reward-driven reinforcement
      learning for world model optimization (PAVXploreRL vs. others).'
    - 'Interaction mode: open-loop video prediction for visual evaluation versus closed-loop
      policy evaluation that uses the world model to score actions.'
    - 'Explicit vs. implicit physics: some methods inject temporal depth and keypoint
      dynamics as explicit supervision, while others rely on the model to learn physical
      laws from data.'
    - 'Deployment settings: specialized driving simulators, robotic manipulation,
      and game environments (Atari, Minecraft) impose different assumptions on action
      spaces and visual complexity.'
    open_questions:
    - How can physical consistency be evaluated beyond spatial loops, for instance
      through temporal causal reasoning or object permanence?
    - Can diffusion-based world models achieve real-time inference without sacrificing
      generation quality, enabling deployment on physical robots?
    - Under what conditions do contextual world models fail when context is partially
      observable or must be inferred from history?
    - How can compositional world models automatically discover primitives from data
      instead of relying on predefined language parses?
    - What evaluation protocols are needed to measure a world model's utility for
      closed-loop decision-making and safety, beyond open-loop visual metrics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 视频生成世界模型架构（扩散与组合式）
      解决的问题: 从动作或语言指令生成未来视频帧，实现跨场景的视觉预测和规划。
      尚未覆盖: 物理一致性多为隐式学习，显式物理约束不足；扩散模型计算成本高，难以支持实时控制。
    - 路线: 随机潜在状态空间动力学（如Dreamer变体、STORM）
      解决的问题: 在紧凑潜在空间中建模环境随机性，实现样本高效强化学习和策略想象。
      尚未覆盖: 假设上下文可观测或动力学固定；对部分可观测或动态变化上下文的泛化尚未验证。
    - 路线: 联合动作-视频扩散与策略优化
      解决的问题: 将动作和视频生成统一在同一模型中，使得世界模型能直接支持策略学习、评估或规划，无需独立控制器。
      尚未覆盖: 分布外动作探索可能导致过估计；收益来自模型本身还是耦合训练过程尚不清楚。
    - 路线: 面向空间一致性的世界模型评估基准
      解决的问题: 提供场景图一致性等指标，量化生成轨迹的长期空间连贯性，超越像素级保真度。
      尚未覆盖: 当前基准限于单一环境（Minecraft），未覆盖多模态、多任务或闭环决策场景。
    共识:
    - 世界模型正从单步图像重建转向多步视频生成，强调长时域一致性。
    - 动作条件化是核心组件，通过显式动作嵌入或联合扩散，使模型同时充当动力学模拟器和策略。
    - 深度图、关键点等物理先验和物理信息损失越来越多地被整合，以提升超越视觉保真度的真实感。
    - 在多样化数据集上大规模预训练是实现跨任务、跨域和跨初始条件泛化的共享策略。
    分歧:
    - 架构选择：基于扩散的视频生成器（MaskGWM、RoboScape、UWM）与基于Transformer/VAE的随机潜在动力学（STORM、cRSSM）。
    - 训练目标：视频重建损失与用于世界模型优化的奖励驱动强化学习（PAVXploreRL与其他方法）。
    - 交互模式：用于视觉评估的开环视频预测与使用世界模型评估动作的闭环策略评估。
    - 显式与隐式物理：部分方法注入时间深度和关键点动力学作为显式监督，其他方法依靠模型从数据中学习物理规律。
    - 部署场景：专用驾驶模拟器、机器人操作和游戏环境（Atari、Minecraft）对动作空间和视觉复杂度有不同假设。
    开放问题:
    - 如何将物理一致性评估从空间循环扩展到时间因果推理或物体持久性？
    - 基于扩散的世界模型能否在不牺牲生成质量的情况下实现实时推理，以便部署到物理机器人上？
    - 在上下文部分可观测或必须从历史推断时，上下文世界模型在什么条件下会失效？
    - 组合式世界模型如何从数据中自动发现原语，而非依赖预定义的语言解析？
    - 需要哪些评估协议来衡量世界模型在闭环决策和安全性方面的效用，超越开环视觉指标？
