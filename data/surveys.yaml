  related_work_outline_zh:
  - 主流方向：证据主要围绕世界模型的综述、分类体系与评估框架，尤其是生成式视频世界模型在交互式模拟、自动驾驶和机器人学习中的应用。
  - 研究共性：相关贡献把碎片化领域整理为应用场景、潜在表示、结构先验或挑战类别，并反复把动作条件控制、长时域记忆和实时交互识别为核心问题。
  - 关键差异：工作区别体现在表示选择，如连续潜在状态、离散 token 或持久 3D/4D 全局状态；评测目标从开环生成到闭环机器人执行；部署场景包括驾驶、机器人和开放世界探索。
  - 趋势演进：从 2022 年物理机器人世界模型学习到 2024-2026 年交互式视频世界建模综述与开源模拟器，趋势转向视线外持久动态、标准化基准和实时交互，属于当前前沿内演进。
  - 开放问题：如何实证验证所提分类法与评估框架；如何在不同仿真、基准和物理设置间比较结果；如何处理训练未见的新原语或实体；以及如何优先解决长时域、记忆和响应性等未闭合缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps a fragmented world-model field into application scenarios,
        latent representations, structural priors, and future directions, making different
        technical choices comparable.
      what_remains_open: Whether the taxonomies are backed by systematic coverage
        and empirical validation rather than selected examples; several proposed frameworks
        remain conceptual.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes benchmark and metric choices across domains such
        as open-world exploration, game engines, autonomous driving, and robotics,
        exposing how evaluation shapes conclusions.
      what_remains_open: Whether compared results are actually compatible across open-loop
        generation, closed-loop control, simulation, and physical robot settings;
        proposed metric suites often remain unimplemented.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete challenges such
        as action-conditioned controllability, long-horizon interaction, memory, real-time
        responsiveness, and out-of-sight dynamics.
      what_remains_open: Relative priority of these gaps is still unclear, and evidence
        is thin for which gap most constrains progress toward persistent interactive
        world simulation.
    consensus:
    - The reviewed work converges on generative video world models as a central substrate
      for interactive simulation, with reusable challenges around controllability,
      temporal consistency, and interactivity.
    - Surveys and taxonomies mostly organize by application scenario, world-state
      evolution, scene modality, latent representation, and structural priors rather
      than by a single benchmark score.
    - There is a visible shift from static video prediction toward persistent, memory-equipped,
      real-time, embodied simulation; deployment in embodied agent settings is increasingly
      treated as the target.
    - Evaluation is recognized as a core problem, especially the mismatch between
      open-loop generation metrics and closed-loop decision-making or execution success.
    disagreements:
    - 'Works choose different representations: continuous latent states, discrete
      tokens, hybrid forms, or persistent static 3D plus dynamic entities instead
      of 2D observation memory.'
    - 'Supervision and evaluation targets differ: some use language-conditioned video
      generation and simulation success, others use ego-motion and human-pose future-frame
      control, and others prescribe closed-loop driving metrics without empirical
      validation.'
    - 'Interaction mode differs: real-time, low-latency interactive simulation, offline
      video planning, and long-horizon future prediction impose different constraints
      on memory and inference.'
    - 'Deployment settings differ: physical robot learning, autonomous driving, ego-centric
      human activity, and open-world exploration lead to different benchmarks and
      assumptions about dynamics.'
    - Some contributions are conceptual surveys without new experiments, while others
      introduce new benchmarks, datasets, or models; this changes what can be claimed
      as evidence.
    open_questions:
    - How can proposed taxonomies and evaluation frameworks be empirically validated
      when several current papers stop at conceptual prescriptions or do not report
      implemented experiments?
    - How should results be compared across simulation-only video planning, benchmark
      generation, and physical robot execution when their success criteria are not
      compatible?
    - How can world models support entirely novel primitives or entities beyond combinations
      seen during training, rather than only recombining known factors?
    - Which unresolved gap, long-horizon memory, out-of-sight dynamics, real-time
      responsiveness, or fine-grained control, most limits progress toward persistent
      interactive world simulation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的世界模型领域整理为应用场景、潜在表示、结构先验和未来方向，使不同技术选择可比较。
      尚未覆盖: 分类是否由系统覆盖和实证验证支撑，而不是选择性举例；多个框架仍停留在概念层面。
    - 路线: 对比评测综合
      解决的问题: 总结开放世界探索、游戏引擎、自动驾驶和机器人等领域的基准与指标选择，揭示评测如何影响结论。
      尚未覆盖: 被比较结果在开环生成、闭环控制、仿真和物理机器人设置之间是否真正兼容；所提指标套件常未实现。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛文献覆盖转化为具体挑战，如动作条件控制、长时域交互、记忆、实时响应和视线外动态。
      尚未覆盖: 各缺口的优先级尚不清晰；关于哪个缺口最制约持久交互式世界模拟进展的证据仍不足。
    共识:
    - 综述和分类工作主要围绕生成式视频世界模型展开，可控性、时间一致性和交互性是反复出现的核心挑战。
    - 多数工作按应用场景、世界状态演化、场景模态、潜在表示和结构先验组织，而不是围绕单一基准分数。
    - 明显趋势是从静态视频预测转向持久、带记忆、实时、具身模拟，越来越多工作以具身智能体设置为目标。
    - 评测被视为关键问题，尤其是开环生成指标与闭环决策或执行成功之间的不匹配。
    分歧:
    - 表示选择不同：连续潜在状态、离散 token、混合形式，或持久静态 3D 加动态实体，而不是 2D 观察记忆。
    - 监督与评测目标不同：有的用语言条件视频生成和仿真成功，有的用于自我运动与人体姿态的未来帧控制，有的仅提出闭环驾驶指标而未做实证验证。
    - 交互模式不同：实时低延迟交互模拟、离线视频规划和长时域未来预测对记忆和推理提出不同约束。
    - 部署场景不同：物理机器人学习、自动驾驶、自我中心人类活动和开放世界探索带来不同基准和动力学假设。
    - 部分贡献是概念性综述且无新实验，另一些引入了新基准、数据集或模型，这改变了可被声称为证据的内容。
    开放问题:
    - 当部分分类和评估框架止步于概念性方案或未报告已实施实验时，如何对它们进行实证验证？
    - 当仿真视频规划、基准生成和物理机器人执行的成功标准并不兼容时，如何比较其结果？
    - 世界模型如何支持训练中未见的新原语或实体，而不是仅重组已知因子？
    - 在长时域记忆、视线外动态、实时响应和细粒度控制中，哪个未解决缺口最限制持久交互式世界模拟的进展？
