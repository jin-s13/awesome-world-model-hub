  related_work_outline:
  - 'Mainstream direction: Building runnable world-model simulators and video-generation
    pipelines for closed-loop evaluation in autonomous driving, robotics, and gaming.'
  - 'Shared research pattern: Augmenting pre-trained video generative models with
    action-conditioning modules, training on large-scale annotated datasets, and evaluating
    on domain-specific benchmarks that measure controllability, consistency, and fidelity.'
  - 'Key differences: Some works target real-time interactive serving (sub-second
    latency), others focus on zero-shot generalization across dynamics, and a third
    group constructs benchmark suites to quantify specific properties such as spatial
    consistency or action fidelity.'
  - 'Trend evolution: In 2024–2026, the field moved from algorithmic extensions of
    model-based RL (Dreamer) toward diffusion- and transformer-based video simulators,
    with a growing emphasis on open-source benchmarks and real-time closed-loop systems.'
  - 'Open questions: Long-horizon temporal and cross-view consistency, generalization
