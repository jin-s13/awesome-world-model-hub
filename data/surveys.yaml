  related_work_outline:
  - 'Mainstream direction: Building action-controllable, high-fidelity interactive
    world simulators for policy training and evaluation, especially in autonomous
    driving and robotics.'
  - 'Shared research pattern: Using video generative models as backbones, conditioning
    on actions, trajectories, or context to predict future states, and creating dedicated
    benchmarks for consistency and controllability.'
  - 'Key differences: Divergence in supervision signals (physical priors, action alignment,
    spatial graphs), evaluation dimensions (spatial consistency, action fidelity,
    visual quality), open-loop vs closed-loop interaction, and real-time serving requirements.'
  - 'Trend evolution: From a surge of action-controllable world models in 2024 to
    closed-loop autoregressive systems and real-time inference in 2025–2026, shifting
    from open-loop evaluation toward deployable interactive simulators.'
  - 'Open questions: Long-horizon consistency, cross-domain generalization, trade-off
    between physical plausibility and computational efficiency, independent reproducibility,
    and reward design without ground-truth actions.'
  related_work_outline_zh:
  - 主流方向：构建动作可控、高保真的交互式世界模拟器，用于自动驾驶与机器人策略训练和评估。
  - 研究共性：以视频生成模型为基础，注入动作、轨迹或上下文条件预测未来状态，并设计专用基准评估一致性与可控性。
  - 关键差异：在监督信号（物理先验、动作对齐、空间图）、评估维度（空间一致性、动作保真度、视觉质量）、开环/闭环交互模式及实时性要求上存在分歧。
  - 趋势演进：从2024年动作可控世界模型兴起，到2025–2026年转向闭环自回归系统与实时推理，从开环评估走向可部署的交互式模拟器。
  - 开放问题：长时域一致性、跨域泛化、物理真实性与计算效率的权衡、独立复现性及无真值动作下的奖励设计。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: turning model ideas into end-to-end workflows for data, training,
        inference, and evaluation, as seen in systems like FAR-Drive, Terra, and Vista
        that integrate data, simulation, and control.
      what_remains_open: how well the stack survives external deployment, hardware
        changes, and user-specific settings; FAR-Drive is evaluated only on nuScenes,
        and cross-sensor generalization is not demonstrated.
    - line: Real-time and interactive serving
      what_it_solves: meeting latency and interactivity requirements for closed-loop
        use, e.g., FAR-Drive achieves sub-second latency, and Vista supports versatile
        control for interactive simulation.
      what_remains_open: trade-offs between speed, fidelity, controllability, and
        system complexity; long-horizon consistency and real-time performance under
        extreme or out-of-distribution conditions remain unverified.
    - line: Artifacts and reproducible engineering
      what_it_solves: making systems inspectable and reusable through code, tools,
        and experiment artifacts, such as the open-source LoopNav dataset and ACT-Bench
        evaluation framework.
      what_remains_open: independent reproduction across teams, datasets, and infrastructure
        environments; some works lack public code or are limited to specific datasets,
        leaving verification gaps.
    consensus:
    - World models must accept actions or context as conditions to generate interactive
      future frames.
    - Video generative models (diffusion, autoregressive) are the mainstream backbone
      for building world simulators.
    - Dedicated benchmarks are needed to quantify controllability, consistency, and
      fidelity beyond visual quality.
    - Closed-loop interaction and real-time serving are increasingly important for
      practical deployment.
    disagreements:
    - 'Supervision signals: some rely on physical priors (depth, keypoints), others
      only on action conditioning, and some on spatial graph consistency.'
    - 'Evaluation targets: spatial consistency (LoopNav), action fidelity (ACT-Bench),
      and visual quality are emphasized differently without a unified standard.'
    - 'Interaction mode: most works use open-loop evaluation, while FAR-Drive adopts
      closed-loop autoregressive generation, imposing different stability requirements.'
    - 'Deployment setting: automotive, robotic, and game domains have distinct dynamics
      and interaction needs, leading to fragmented system designs.'
    open_questions:
    - How can long-horizon spatial-temporal consistency and physical plausibility
      be maintained in closed-loop interaction without error accumulation?
    - What is the generalization capability of current world simulators across environments
      and sensor configurations?
    - What is the optimal trade-off between real-time interactivity and high-fidelity
      physics modeling?
    - How can independent reproducibility be ensured given the lack of standardized
      workflows and cross-team validation?
    - How can effective reward or evaluation signals be designed when ground-truth
      actions are unavailable?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 把模型想法转化为覆盖数据、训练、推理和评测的端到端工作流，如FAR-Drive、Terra和Vista集成了数据、模拟与控制。
      尚未覆盖: 系统栈在外部部署、硬件变化和用户特定设置下是否仍然可靠；FAR-Drive仅在nuScenes上验证，未展示跨传感器泛化。
    - 路线: 实时与交互式服务
      解决的问题: 满足闭环使用中的延迟和交互需求，例如FAR-Drive实现亚秒延迟，Vista支持多功能控制以进行交互式模拟。
      尚未覆盖: 速度、保真度、可控性和系统复杂度之间的权衡；长时域一致性及极端或分布外条件下的实时性尚未验证。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、工具和实验工件让系统可检查、可复用，如开源的LoopNav数据集和ACT-Bench评估框架。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现；部分工作未公开代码或局限于特定数据集，存在验证缺口。
    共识:
    - 世界模型需要接收动作或上下文作为条件，以生成可交互的未来帧。
    - 视频生成模型（扩散、自回归）是构建世界模拟器的主流基础架构。
    - 需要专门的基准来量化评估可控性、一致性和保真度，而非仅依赖视觉质量。
    - 闭环交互和实时性正成为实际部署中日益重要的考量。
    分歧:
    - 监督信号：有的依赖物理先验（深度、关键点），有的仅靠动作条件，有的引入空间图一致性。
    - 评估目标：空间一致性（LoopNav）、动作保真度（ACT-Bench）和视觉质量各有侧重，缺乏统一标准。
    - 交互模式：多数工作采用开环评估，而FAR-Drive采用闭环自回归生成，对稳定性要求不同。
    - 部署场景：自动驾驶、机器人和游戏领域动力学与交互需求差异大，导致系统设计割裂。
    开放问题:
    - 如何在闭环交互中保持长时域时空一致性和物理合理性，避免误差累积？
    - 当前世界模拟器在不同环境和传感器配置下的泛化能力如何？
    - 实时交互性与高保真物理建模之间的最佳平衡点是什么？
    - 在缺乏标准化复现流程和跨团队验证的情况下，如何确保独立复现性？
    - 当没有真实动作标签时，如何设计有效的奖励或评估信号？
