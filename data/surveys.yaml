  related_work_outline:
  - 'Mainstream direction: World-model evaluation is converging on action-conditioned
    video prediction and embodied dynamics benchmarks, with driving, robotics, and
    game domains as common testbeds.'
  - 'Shared research pattern: Construct datasets or reuse standardized suites, couple
    them with baseline world models and a quantitative metric, then expose a gap in
    long-term consistency, controllability, or zero-shot transfer.'
  - 'Key differences: Representation choices include diffusion versus VAE/discrete
    latent models; supervision includes mask reconstruction, depth/keypoints, action-video
    coupling, and context conditioning; evaluation targets range from game score and
    driving rollout to robotic utility and open-domain memory.'
  - 'Trend evolution: Within the 2023-2026 frontier, evaluation moves from Atari 100k
    aggregate agent scores toward open-domain, multi-view, embodied benchmarks, with
    growing emphasis on physical plausibility, memory consistency, and action-space
    generalization.'
  - 'Open questions: Coverage of real deployment settings, metric alignment with downstream
    decisions, cross-implementation stability, long-horizon memory and action-space
    generalization, and evaluation of physical plausibility beyond visual fidelity.'
  related_work_outline_zh:
  - 主流方向：世界模型评测正汇聚到以动作条件视频预测和具身动力学基准上，驾驶、机器人和游戏环境是常见测试场。
  - 研究共性：构建数据集或复用标准化套件，配合基线世界模型和定量指标，揭示长时一致性、可控性或零样本迁移的缺口。
  - 关键差异：表示方式分扩散模型与VAE/离散潜变量；监督信号含掩码重建、深度/关键点、动作-视频耦合和上下文条件化；评测目标从游戏得分到驾驶、机器人和开放域记忆。
  - 趋势演进：在2023-2026前沿期内，评测从Atari 100k总分转向开放域、多视角、具身基准，更强调物理合理性、记忆一致性和动作空间泛化。
  - 开放问题：真实部署场景覆盖、代理指标与下游决策一致性、跨实现稳定性、长时记忆与动作空间泛化、以及超越视觉保真度的物理合理性评估。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets so world-model claims are
        comparable across driving, robotics, game, and open-domain settings.
      what_remains_open: Whether task distributions cover deployment scenarios where
        long-horizon memory, action control, and physical plausibility matter.
    - line: Metric and stress-test design
      what_it_solves: Probes spatial consistency, memory consistency, action control,
        visual detail, and zero-shot generalization beyond aggregate scores.
      what_remains_open: Alignment between proxy metrics and downstream policy or
        decision utility is not yet established.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common evaluation suites such as Atari 100k, CARL,
        Nuscenes, OpenDV-2K, and Waymo to audit baselines.
      what_remains_open: Stability across implementations and compute budgets, and
        missing code, dataset, and limitation details, remain verification gaps.
    consensus:
    - Recent work treats world models as learned simulators whose evaluation requires
      action-conditioned rollouts, long-horizon prediction, and visual dynamics consistency.
    - Common benchmarks use standardized game, driving, robotic, or open-domain videos
      paired with quantitative metrics rather than qualitative generation alone.
    - Aggregate scores are increasingly supplemented with probes for memory, spatial
      consistency, controllability, zero-shot transfer, or physical plausibility.
    disagreements:
    - 'Representations differ: some use discrete or VAE latent dynamics while others
      use diffusion-based generative world models.'
    - 'Supervision signals differ: mask reconstruction, temporal depth and keypoint
      dynamics, action-video diffusion coupling, and context-conditioned reinforcement
      learning each optimize different aspects of world modeling.'
    - 'Evaluation targets differ: game performance, multi-view driving rollout, robotic
      policy utility, and open-domain memory or action control are used separately.'
    - 'Interaction modes differ: open-loop generation, closed-loop action-controlled
      simulation, loop-based spatial consistency, and action-space generalization
      are stressed to different degrees.'
    open_questions:
    - Do current benchmark task distributions cover the real deployment settings where
      world models are expected to support decisions?
    - Are spatial consistency, memory consistency, and visual-detail metrics aligned
      with downstream policy robustness and decision utility?
    - Do benchmark conclusions remain stable across different implementations and
      compute budgets when code, dataset, and limitation details are missing?
    - How can long-horizon memory and action-space generalization be stress-tested
      without shortcut leakage?
    - How should physical plausibility be measured beyond visual fidelity in embodied
      world models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使世界模型主张在驾驶、机器人、游戏和开放域设置中可比较。
      尚未覆盖: 任务分布是否覆盖需要长时记忆、动作控制和物理合理性的部署场景。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外检验空间一致性、记忆一致性、动作控制、视觉细节和零样本泛化。
      尚未覆盖: 代理指标与下游策略或决策效用之间的一致性尚未确立。
    - 路线: 可比基线与报告规范
      解决的问题: 提供Atari 100k、CARL、Nuscenes、OpenDV-2K和Waymo等公共评测套件以审计基线。
      尚未覆盖: 不同实现和算力预算下的结论稳定性，以及代码、数据集和局限性细节缺失仍是验证缺口。
    共识:
    - 近期工作将世界模型视为学习式模拟器，其评测需要动作条件展开、长时预测和视觉动态一致性。
    - 常见基准使用标准化的游戏、驾驶、机器人或开放域视频，并搭配定量指标，而非仅依赖定性生成。
    - 在总分之外，评测越来越多地加入对记忆、空间一致性、可控性、零样本迁移或物理合理性的探查。
    分歧:
    - 表示方式不同：有的使用离散或VAE潜在动态，有的使用基于扩散的生成式世界模型。
    - 监督信号不同：掩码重建、时间深度和关键点动态、动作-视频扩散耦合、以及上下文条件强化学习各自优化世界建模的不同方面。
    - 评测目标不同：游戏表现、多视角驾驶展开、机器人策略效用、以及开放域记忆或动作控制被分别使用。
    - 交互模式不同：开放环生成、闭环动作控制模拟、基于循环的空间一致性、以及动作空间泛化受到不同程度的压力测试。
    开放问题:
    - 当前基准任务分布是否覆盖世界模型预期支持决策的真实部署场景？
    - 空间一致性、记忆一致性和视觉细节指标是否与下游策略鲁棒性和决策效用对齐？
    - 在代码、数据集和局限性细节缺失时，基准结论能否在不同实现和算力预算下保持稳定？
    - 如何在不发生捷径泄漏的情况下对长时记忆和动作空间泛化进行压力测试？
    - 如何在具身世界模型中衡量超越视觉保真度的物理合理性？
