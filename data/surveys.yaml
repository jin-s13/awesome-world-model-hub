  related_work_outline:
  - 'Mainstream direction: Creating specialized benchmarks and metrics to evaluate
    critical but previously under-measured capabilities of world models, such as spatial
    consistency, long-term memory, visual fidelity, and zero-shot generalization,
    moving beyond aggregate game scores.'
  - 'Shared research pattern: Researchers propose a new dataset or stress test targeting
    a specific failure mode of world models, design a metric that isolates that capability,
    and use it to expose gaps in current state-of-the-art models, often accompanied
    by open-source code and data.'
  - 'Key differences: Work varies in the capability being evaluated (spatial consistency
    via LoopNav vs. memory and action control via MIND vs. visual detail impact on
    policy via DIAMOND), the domain (Minecraft, driving, Atari, robotics), and whether
    the evaluation is purely observational or involves interactive agent-in-the-loop
    benchmarking.'
  - 'Trend evolution: From 2023–2026, the focus has shifted from using existing fixed
    benchmarks (Atari 100k, Nuscenes) to constructing dedicated diagnostic benchmarks
    that probe specific world model limitations, with a recent emphasis on open-domain,
    multi-view, and long-horizon scenarios.'
  - 'Open questions: Whether proxy metrics like scene graph consistency or human-normalized
    scores align with real-world downstream task success; how to cover the full distribution
    of settings where world models are expected to help; and whether benchmark conclusions
    remain stable across different implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建专门的基准和指标，以评估世界模型之前未被充分衡量的关键能力，如空间一致性、长期记忆、视觉保真度和零样本泛化，超越总分数的比较。
  - 研究共性：研究者提出针对世界模型特定失效模式的新数据集或压力测试，设计隔离该能力的指标，并用其揭示当前最优模型的短板，往往同时开源代码和数据。
  - 关键差异：工作在被评估的能力（LoopNav的空间一致性 vs. MIND的记忆与动作控制 vs. DIAMOND的视觉细节对策略的影响）、领域（Minecraft、驾驶、Atari、机器人）以及评估方式（纯观察
    vs. 交互式agent-in-the-loop基准）上存在不同。
  - 趋势演进：2023至2026年，重点从使用现有固定基准（Atari 100k、Nuscenes）转向构建专用诊断基准，以探测特定世界模型局限，近期强调开放域、多视角和长时域场景。
  - 开放问题：场景图一致性或人类归一化得分等代理指标是否与真实下游任务成功对齐；如何覆盖世界模型预期发挥作用的全部设置分布；基准结论在不同实现和算力预算下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets (e.g., LoopNav for spatial
        consistency, MIND for memory and action control) that make world-model claims
        comparable across specific dimensions often missed by generic benchmarks.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings where world models are expected to help, and whether the static datasets
        capture the interactive, closed-loop nature of agent-environment interaction.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate pixel-level scores, using metrics like Scene Graph
        Consistency Score, memory consistency measured in action-conditioned rollouts,
        or human-normalized policy performance.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about (e.g., safety in autonomous driving);
        metrics often assume a fixed action space and may not generalize across diverse
        embodiment.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, standardized
        benchmarks (Atari 100k, Nuscenes), and open-source artifacts, enabling fair
        comparison of model capabilities and training efficiency.
      what_remains_open: Whether benchmark rankings remain stable across different
        implementations, hyperparameter tuning, and compute budgets; lack of rigorous
        sensitivity analysis for reported results.
    consensus:
    - World models need evaluation beyond simple reconstruction loss or aggregated
      game scores; dedicated benchmarks that probe spatial consistency, memory, and
      action controllability are essential.
    - Diffusion-based world models achieve high visual fidelity, but that fidelity
      alone does not guarantee better downstream task performance unless the metric
      directly captures task-relevant details.
    - Open-sourcing of datasets, code, and evaluation protocols is becoming standard
      practice, which significantly improves reproducibility and comparability across
      studies.
    disagreements:
    - 'What dimension of world model quality matters most: spatial consistency (LoopNav),
      long-term memory and action control (MIND), visual detail sufficiency for policy
      (DIAMOND), or zero-shot generalization to unseen dynamics (cRSSM).'
    - 'The choice of evaluation domain: closed-loop game environments (Atari, Minecraft)
      vs. real-world driving and robotics, where the cost of rolling out a policy
      is higher and the emphasis on static dataset evaluation is stronger.'
    - Whether metrics should be based on pixel-space reconstruction, latent-space
      consistency, or downstream task success; some works argue for direct task performance,
      others for diagnostic intermediate metrics that expose specific failure modes.
    open_questions:
    - How can we design a unified benchmark that simultaneously evaluates visual quality,
      physical plausibility, memory consistency, and decision utility without conflating
      different failure modes?
    - To what extent do the conclusions from existing benchmarks (e.g., Atari 100k,
      Minecraft loop navigation) transfer to noisy, open-world, safety-critical settings
      like autonomous driving or robotic manipulation?
    - Are current evaluation protocols robust to variations in implementation and
      compute budget, and what is the minimal reporting standard needed to ensure
      reliable replication?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建共享任务和数据集（如 LoopNav 用于空间一致性，MIND 用于记忆与动作控制），使世界模型的主张在通用基准常被忽略的特定维度上可比较。
      尚未覆盖: 任务分布是否覆盖世界模型预期发挥作用的全部真实设置，以及静态数据集是否捕捉到智能体-环境交互的闭环特性。
    - 路线: 指标与压力测试设计
      解决的问题: 在聚合像素级分数之外，使用场景图一致性分数、动作条件回放中的记忆一致性或人类归一化策略性能等指标，探测预测、可控性、鲁棒性和决策效用。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策（如自动驾驶安全）之间是否对齐；指标通常假设固定动作空间，可能无法泛化到不同具身形态。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、标准化基准（Atari 100k、Nuscenes）和开源工件，使结果可审计，支持模型能力和训练效率的公平比较。
      尚未覆盖: 基准排名在不同实现、超参数调优和算力预算下是否稳定；缺乏对报告结果的严格敏感性分析。
    共识:
    - 世界模型需要超越简单的重建损失或汇总游戏得分的评估；专门探测空间一致性、记忆和动作可控性的基准至关重要。
    - 基于扩散的世界模型具有高视觉保真度，但仅凭保真度不能保证更好的下游任务性能，除非该指标直接捕获任务相关细节。
    - 数据集、代码和评估协议的开源正成为标准做法，显著提升了不同研究间的可复现性和可比较性。
    分歧:
    - 世界模型质量的哪个维度最重要：空间一致性（LoopNav）、长期记忆与动作控制（MIND）、视觉细节对策略的充分性（DIAMOND），还是对未见动力学的零样本泛化（cRSSM）。
    - 评估域的选择：闭环游戏环境（Atari、Minecraft）与现实世界的驾驶和机器人，前者可低成本交互，后者更强调静态数据集评估，且部署策略成本更高。
    - 指标应基于像素空间重建、潜在空间一致性还是下游任务成功；一些工作主张直接测量任务性能，另一些则主张诊断性中间指标以暴露特定失效模式。
    开放问题:
    - 如何设计一个统一基准，同时评估视觉质量、物理合理性、记忆一致性和决策效用，而不混淆不同的失效模式？
    - 现有基准（如 Atari 100k、Minecraft 循环导航）的结论在多大程度上能迁移到嘈杂、开放世界、安全关键的设置（如自动驾驶或机器人操作）？
    - 当前评估协议对实现和算力预算的变异性是否鲁棒，确保可靠复现所需的最低报告标准是什么？
