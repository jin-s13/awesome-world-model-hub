  related_work_outline:
  - 'Mainstream direction: large-scale world models based on diffusion models and
    Transformers dominate, expanding from video prediction to unified action-video
    modeling and embodied interaction.'
  - 'Shared research pattern: multiple works learn latent dynamics from high-dimensional
    observations via self-supervision, connect to action interfaces through imagination
    or planning, and increasingly emphasize consistency and physical plausibility
    evaluation.'
  - 'Key differences: architectural choices (diffusion vs. VAE vs. unified Transformer),
    physical knowledge integration (explicit physics tasks vs. pure data-driven),
    context and compositionality handling (context conditioning vs. primitive composition),
    and evaluation targets (visual quality vs. spatial/memory consistency vs. task
    success) diverge.'
  - 'Trend evolution: from pre-2023 Transformer+VAE hybrids to 2024-2025 diffusion-based
    models incorporating physical priors and compositionality; 2025-2026 sees dedicated
    benchmarks for memory consistency and action control, marking a shift from model
    building to rigorous evaluation.'
  - 'Open questions: long-term memory consistency and cross-action-space generalization
    remain challenging; disentangling model contribution from planner/prior is incomplete;
    unified ablation and fair comparison protocols are lacking.'
  related_work_outline_zh:
  - 主流方向：基于扩散模型和Transformer的大规模世界模型主导，从视频预测扩展到统一动作-视频建模和具身交互。
  - 研究共性：多工作通过自监督从高维观测学习潜在动力学，经由想象或规划连接动作接口，并逐步增强对一致性和物理合理性的评估。
  - 关键差异：在架构选择（扩散 vs. VAE vs. 统一Transformer）、物理知识融合方式（显式物理任务 vs. 纯数据驱动）、上下文与组合性处理（上下文条件化
    vs. 原语组合）以及评估目标（视觉质量 vs. 空间/记忆一致性 vs. 任务成功率）上存在分歧。
  - 趋势演进：由2023年前的Transformer+VAE融合逐步转向2024-2025年的扩散模型，并引入物理先验和组合性；2025-2026年出现专门评估记忆一致性和动作控制的基准，标志着从模型构建到严格评估的演进。
  - 开放问题：长期记忆一致性和跨动作空间泛化仍面临挑战；模型贡献与规划器/先验的分离不充分；缺乏统一的消融与公平比较协议。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Designing architectures, loss functions, and training recipes
        that encode dynamics assumptions into world models, such as combining diffusion
        with MAE-style mask reconstruction, Transformer+VAE, language-guided compositionality,
        explicit physics prediction, and unified video-action diffusion.
      what_remains_open: Which architectural choices transfer beyond the reported
        task domain (e.g., from driving to manipulation); generalization to unseen
        object/action combinations; systematic trade-off between computational efficiency
        and model fidelity.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned dynamics to decision-making via imagination-based
        policy training, flexible diffusion timestep control for policy/dynamics/inverse
        dynamics, or video plan generation for robotic execution.
      what_remains_open: How much performance gain originates from the world model
        versus the planner or task prior; reliability of closed-loop interaction in
        real-world settings; error accumulation in long-horizon planning under model
        uncertainty.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing systematic evaluation protocols and benchmarks to
        isolate method contributions and assess core capabilities such as spatial
        consistency, memory consistency, and action control, beyond pixel-level quality.
      what_remains_open: Whether these benchmarks capture all essential world-model
        capabilities (e.g., causal reasoning, physical violation detection); absence
        of standardized ablation protocols to separate architecture, data, and implementation
        effects, hindering fair comparison.
    consensus:
    - World models need to capture both visual appearance and underlying dynamics,
      leading to consensus on fusing generative models (diffusion, VAE) with sequence
      models (Transformers).
    - Evaluation must go beyond image quality metrics to include structured capabilities
      like spatial consistency, memory, and action controllability.
    - Pretraining on large-scale, diverse datasets benefits downstream task transfer
      and generalization.
    disagreements:
    - 'Physical knowledge integration: some works explicitly add depth/keypoint prediction
      tasks, while others rely purely on data-driven learning without physical supervision.'
    - 'Action-video coupling: UWM treats video and action as a unified diffusion process,
      whereas Dreamer variants separate latent dynamics and policy learning, leading
      to different flexibility and interface design.'
    - 'Context and generalization: cRSSM conditions on observable context variables
      for zero-shot transfer, while RoboDreamer composes pretrained primitives; the
      former assumes observable context, the latter depends on predefined primitives
      and accurate parsing.'
    - 'Evaluation domains: methods are tested on diverse, non-overlapping scenarios
      (Atari games, driving, robotic simulation) without a unified cross-domain benchmark,
      making direct comparison difficult.'
    open_questions:
    - Can world models learn physical consistency without explicit physical supervision,
      and how to verify it?
    - How to design fair benchmarks that isolate the contributions of model architecture,
      training data, and implementation tricks?
    - What mechanisms effectively mitigate error accumulation in closed-loop long-horizon
      prediction?
    - How to evaluate a world model's reliability under unseen dynamics in real-world
      deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 设计将动力学假设编码为世界模型的架构、损失函数和训练配方，如扩散结合MAE掩码重建、Transformer+VAE、语言引导的组合性、显式物理预测、统一视频-动作扩散等。
      尚未覆盖: 哪些架构选择能迁移到报告任务域之外（如从驾驶到操作）；对未见物体/动作组合的泛化；计算效率与模型保真度之间的系统权衡。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的动力学连接到决策，通过基于想象的策略训练、灵活的扩散时间步控制策略/动力学/逆动力学，或为机器人执行生成视频计划。
      尚未覆盖: 多少性能增益来自世界模型本身而非规划器或任务先验；真实世界闭环交互的可靠性；模型不确定性下长时域规划的误差累积。
    - 路线: 方法证据与消融协议
      解决的问题: 提供系统性评估协议和基准，以隔离方法贡献并评估空间一致性、记忆一致性和动作控制等核心能力，超越像素级质量。
      尚未覆盖: 这些基准是否捕获了所有关键世界模型能力（如因果推理、物理违规检测）；缺乏标准化的消融协议来分离架构、数据和实现影响，阻碍公平比较。
    共识:
    - 世界模型需要同时捕捉视觉外观和底层动力学，因此融合生成模型（扩散、VAE）与序列模型（Transformer）成为共识。
    - 评估必须超越图像质量指标，纳入空间一致性、记忆和动作可控性等结构化能力。
    - 在大规模多样化数据集上预训练有助于下游任务迁移和泛化。
    分歧:
    - 物理知识整合：部分工作显式添加深度或关键点预测任务，其他工作则完全依赖数据驱动学习，不施加物理监督。
    - 动作-视频耦合：UWM将视频和动作作为统一扩散过程，而Dreamer变体在潜在空间中分离动力学和策略学习，导致不同的灵活性和接口设计。
    - 上下文与泛化：cRSSM通过可观测上下文变量实现零样本迁移，RoboDreamer则组合预训练原语；前者假设上下文可观测，后者依赖预定义原语和准确解析。
    - 评估领域：方法在差异化的非重叠场景（Atari游戏、驾驶、机器人仿真）上测试，缺少统一的跨领域基准，直接比较困难。
    开放问题:
    - 世界模型能否在没有显式物理监督的情况下学习物理一致性，以及如何验证？
    - 如何设计公平的基准，隔离模型架构、训练数据和实现技巧的贡献？
    - 哪些机制能有效缓解闭环长时域预测中的误差累积？
    - 如何评估世界模型在真实世界未见动态下的可靠性？
