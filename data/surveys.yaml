    - 路线: 具身机器人世界模型用于视觉策略与动力学学习
      解决的问题: 学习机器人视频生成、物理合理性及动作-视频耦合动力学，以支持策略训练或策略评估。
      尚未覆盖: 对未见语言原语、新本体和真实机器人部署的泛化仍然有限，许多结果仅来自仿真或缺少可见的真实环境验证。
    - 路线: 面向上下文与样本高效强化学习的世界模型
      解决的问题: 通过世界模型想象轨迹提升上下文变化或有限交互下的策略学习与零样本泛化。
      尚未覆盖: 假设上下文值可观测且评测任务较窄，部分可观测或更广泛现实场景中的适用性尚未验证。
    - 路线: 记忆、空间一致性与动作控制基准
      解决的问题: 量化开放领域世界模型中的长期记忆一致性、空间连贯性和动作控制能力。
      尚未覆盖: 重访场景中的长期一致性、跨动作空间泛化，以及从基准分数到模型能力改进的闭环仍不充分。
    共识:
    - 多数工作学习以动作、语言或上下文为条件的生成式动力学或视频模型，而不是仅依赖静态感知。
    - 评估普遍依赖领域数据集与指标，如下游任务成功率、视觉保真度、长期展开质量或一致性分数。
    - 近期工作将世界模型视为策略训练或策略评估的可复用组件，而非单纯帧预测器。
    - 任务特定条件，如上下文变量、语言原语、物理辅助任务或动作-视频耦合，被普遍认为能改善泛化能力。
    分歧:
    - 表征选择不同：掩码扩散Token、上下文状态空间模型、VAE-Transformer模型、组合原语和统一动作-视频扩散。
    - 监督信号不同：无动作视频、配对机器人演示、物理辅助任务或上下文条件想象轨迹。
    - 评测目标不同：驾驶数据集、机器人操作数据集、Atari、上下文强化学习套件以及Minecraft或开放域记忆基准。
    - 交互方式不同：闭环动作条件展开、开环视频生成或基于基准的一致性评估。
    开放问题:
    - 驾驶和机器人世界模型从仿真或现有数据集迁移到未见环境、本体及真实运营安全时，证据仍不充分。
    - 当前模型能否在开放域重访场景中保持长期记忆一致性和动作控制，仍待验证。
    - 当上下文部分可观测或语言原语是全新的时，现有条件化方法是否可靠仍不清楚。
    - 哪些评测指标能把视觉保真度和动力学精度直接关联到下游任务成功或安全结果，仍需研究。
    - 在限定的顶部论文证据中缺少医疗和科学仿真应用，因此向这些领域迁移仍是开放缺口。
    - 部分顶部论文缺少可见的局限性说明，部分缺少外部标识符或工件验证，构成可复现性与独立验证缺口。
