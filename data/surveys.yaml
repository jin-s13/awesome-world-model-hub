  related_work_outline:
  - 'Mainstream direction: building action-controllable, high-fidelity world models
    as interactive simulators for autonomous driving, robotics, and gaming, supported
    by standardized benchmarks for reproducible evaluation.'
  - 'Shared research pattern: adopting pre-trained video generative models as backbones,
    designing action-conditioning mechanisms to enable controllable future prediction,
    and optimizing for spatiotemporal consistency and visual realism.'
  - 'Key differences: choices in model architecture (diffusion vs. autoregressive),
    integration of physical priors (explicit physics losses vs. implicit dynamics
    learning), application focus (driving vs. robot manipulation vs. open-world gaming),
    and evaluation emphasis (spatial consistency, action fidelity, or physical plausibility).'
  - 'Trend evolution: a shift from early RL-centric world models toward large-scale
    video generation models as world simulators, with recent work converging on closed-loop
    interaction, long-horizon consistency, and low-latency serving, alongside the
    emergence of dedicated benchmarks.'
  - 'Open questions: cross-domain generalization to unseen dynamics, mitigation of
    compounding errors in long-horizon rollouts, trade-offs between physical realism
    and computational efficiency, and absence of independent reproduction and deployment
    validation across diverse hardware.'
  related_work_outline_zh:
  - 主流方向：构建动作可控、高保真的世界模型作为交互式模拟器，用于自动驾驶、机器人和游戏，并通过标准化基准推动可复现评估。
  - 研究共性：采用预训练视频生成模型作为骨干，设计动作条件机制实现可控的未来预测，并优化时空一致性与视觉真实感。
  - 关键差异：模型架构选择（扩散与自回归）、物理先验集成方式（显式物理损失与隐式动力学学习）、应用领域重点（驾驶与机器人操作与开放世界游戏）以及评估侧重（空间一致性、动作忠实度或物理合理性）不同。
  - 趋势演进：从早期以强化学习为核心的世界模型转向大规模视频生成模型作为世界模拟器，近期的研究致力于闭环交互、长时域一致性和低延迟服务，同时涌现出专门基准。
  - 开放问题：跨域泛化到未见动力学的能力，长时域推演中累积误差的缓解，物理真实性与计算效率之间的权衡，以及在多样硬件上缺乏独立复现和部署验证。
  literature_review:
    line_of_work_matrix:
    - line: Building world model simulators via action-conditioned video generation
      what_it_solves: Transforming pre-trained video generative models into physics-aware,
        action-controllable simulators that can generate future frames for downstream
        tasks like policy training and evaluation. Works such as RoboScape, Vista,
        FAR-Drive, DWS, and cRSSM exemplify this line.
      what_remains_open: Generalization across diverse embodiments and dynamics remains
        limited; long-horizon consistency often degrades due to compounding errors;
        physical realism sometimes trades off against fine-grained visual details;
        and real-time constraints are rarely met under complex multi-modal interactions.
    - line: Benchmarking and dataset construction for world model evaluation
      what_it_solves: Providing standardized datasets and metrics (e.g., LoopNav's
        SGCS, ACT-Bench) to quantify spatial consistency, action fidelity, and physical
        plausibility of world models, thereby enabling fair comparison and identifying
        overlooked capabilities.
      what_remains_open: Existing benchmarks cover a narrow set of environments (Minecraft,
        nuScenes) and may not correlate with downstream task performance; metric designs
        are still early and may not capture all failure modes; independent validation
        across teams and infrastructure is missing.
    - line: System architectures for real-time, interactive world simulation
      what_it_solves: Designing low-latency, closed-loop frameworks (e.g., FAR-Drive's
        sub-second inference on a single GPU, the survey's emphasis on action-following
        responsiveness) that enable interactive video generation for autonomous driving
        and robotics.
      what_remains_open: Scalability to multi-GPU or edge deployments is unverified;
        real-time constraints under high-resolution, multi-camera setups are not systematically
        evaluated; robustness to out-of-distribution actions and sensor noise is largely
        unexplored.
    consensus:
    - All works treat action-conditioned video generation as the core mechanism for
      world simulation, recognizing that future frame prediction must be steerable
      by control signals.
    - There is a shared commitment to improving spatiotemporal consistency, whether
      through geometric constraints, temporal losses, or latent replacement strategies.
    - The community emphasizes open-source artifacts—datasets, code, and benchmarks—to
      enable reproducible evaluation, though the completeness of artifacts varies.
    - Pre-trained large video models serve as the foundation, and adapting them to
      specific domains (driving, robotics, gaming) is seen as more practical than
      training from scratch.
    disagreements:
    - 'Model architecture: Some adopt diffusion-based generation (Vista, DWS, FAR-Drive)
      while others rely on autoregressive transformers or recurrent state-space models
      (cRSSM), leading to different trade-offs in fidelity and inference speed.'
    - 'Physical prior integration: RoboScape explicitly injects depth prediction and
      keypoint dynamics as physics losses, whereas DWS and cRSSM rely on the model
      to learn dynamics implicitly from action-transition data.'
    - 'Controllability approach: Lightweight plug-in action modules (DWS) contrast
      with end-to-end conditional training (Vista, FAR-Drive), impacting the generality
      and ease of adaptation to new models.'
    - 'Evaluation focus: LoopNav targets spatial consistency via scene graph metrics,
      ACT-Bench measures action fidelity, and RoboScape emphasizes visual and physical
      plausibility, revealing no unified evaluation standard yet.'
    - 'Domain specialization: Works are tightly coupled to driving (Vista, FAR-Drive,
      Terra ACT-Bench), robotics (RoboScape), or gaming (LoopNav, DWS), and cross-domain
      transfer is rarely attempted.'
    open_questions:
    - How can world models be evaluated in a way that reliably predicts downstream
      task performance, rather than optimizing proxy metrics alone?
    - What strategies can effectively mitigate the compounding error in long-horizon
      autoregressive rollouts, especially under distribution shift?
    - Can physical realism and real-time inference be achieved simultaneously on resource-constrained
      hardware without sacrificing visual quality?
    - To what extent do current benchmarks reflect the diversity of real-world deployment
      conditions, and what additional scenarios are needed for robust validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通过动作条件视频生成构建世界模型模拟器
      解决的问题: 将预训练视频生成模型转化为具有物理感知、动作可控的模拟器，为策略训练和评估等下游任务生成未来帧。代表性工作包括RoboScape、Vista、FAR-Drive、DWS和cRSSM。
      尚未覆盖: 跨不同具身和动力学的泛化能力仍然有限；长时域一致性常因累积误差而退化；物理真实感有时与细粒度视觉细节相妥协；在复杂多模态交互下实时约束很少被满足。
    - 路线: 世界模型评估的基准与数据集构建
      解决的问题: 提供标准化数据集和度量（如LoopNav的SGCS、ACT-Bench），量化世界模型的空间一致性、动作忠实度和物理合理性，从而实现公平比较并识别被忽视的能力。
      尚未覆盖: 现有基准覆盖的环境（Minecraft、nuScenes）较窄，且可能与下游任务性能不相关；度量设计仍处于早期，可能无法捕获所有失败模式；跨团队和基础设施的独立验证缺失。
    - 路线: 实时交互式世界模拟的系统架构
      解决的问题: 设计低延迟、闭环框架（例如FAR-Drive在单GPU上的亚秒推理，综述强调的动作跟随响应性），使自动驾驶和机器人领域的交互式视频生成成为可能。
      尚未覆盖: 多GPU或边缘部署的可扩展性未经验证；高分辨率、多相机设置下的实时约束未系统评估；对分布外动作和传感器噪声的鲁棒性基本未探索。
    共识:
    - 所有工作都将动作条件视频生成视为世界模拟的核心机制，认识到未来帧预测必须由控制信号引导。
    - 共同致力于提高时空一致性，无论是通过几何约束、时间损失还是潜在替换策略。
    - 社区强调开源工件——数据集、代码和基准——以实现可复现评估，尽管工件的完整性各不相同。
    - 预训练大型视频模型作为基础，将其适配到特定领域（驾驶、机器人、游戏）被视为比从头训练更实用的路线。
    分歧:
    - 模型架构：有的采用扩散生成（Vista、DWS、FAR-Drive），有的依赖自回归Transformer或循环状态空间模型（cRSSM），导致在保真度和推理速度上不同的权衡。
    - 物理先验集成：RoboScape显式注入深度预测和关键点动力学作为物理损失，而DWS和cRSSM依赖模型从动作-转换数据中隐式学习动力学。
    - 可控性实现方式：轻量级插入式动作模块（DWS）与端到端条件训练（Vista、FAR-Drive）形成对比，影响通用性和适配新模型的难易程度。
    - 评估重点：LoopNav通过场景图度量关注空间一致性，ACT-Bench测量动作忠实度，RoboScape强调视觉和物理合理性，揭示尚未有统一的评估标准。
    - 领域专门化：工作紧密耦合于驾驶（Vista、FAR-Drive、Terra ACT-Bench）、机器人（RoboScape）或游戏（LoopNav、DWS），跨领域迁移很少被尝试。
    开放问题:
    - 世界模型如何以可靠预测下游任务性能的方式进行评估，而不是仅优化代理指标？
    - 什么策略可以有效缓解长时域自回归推演中的累积误差，尤其是在分布偏移下？
    - 能否在资源受限的硬件上同时实现物理真实感和实时推理，而不牺牲视觉质量？
    - 当前基准在多大程度上反映了真实部署条件的多样性，还需要哪些额外场景来实现稳健验证？
