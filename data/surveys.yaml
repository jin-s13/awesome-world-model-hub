  related_work_outline:
  - 'Mainstream direction: Recent evidence is dominated by domain-specific generative
    world models for driving and robotics, using video diffusion or transformer-based
    dynamics to predict future observations, support policy learning, and enable simulation.'
  - 'Shared research pattern: Most works learn latent or video dynamics from high-dimensional
    observations, condition on actions, language, or context, and evaluate through
    downstream control, generation quality, or consistency benchmarks.'
  - 'Key differences: Methods differ in representation, supervision, and evaluation
    target; some compress observations into latent state-space models, others generate
    future RGB video or jointly diffuse actions and video, while benchmark work evaluates
    spatial, memory, and action consistency.'
  - 'Trend evolution: Available top papers concentrate in 2023–2026, moving from sample-efficient
    model-based RL and contextual generalization toward large-scale video/diffusion
    world models and explicit consistency benchmarks; healthcare and scientific simulation
    evidence is absent from this packet.'
  - 'Open questions: Whether simulation or benchmark gains transfer to real driving
    and robot deployment, how long-term memory and cross-action control can be maintained,
    and how assumptions such as observable context or physics-augmented generation
    extend beyond narrow datasets.'
  related_work_outline_zh:
  - 主流方向：近期证据以驾驶和机器人的领域专用生成式世界模型为主，采用视频扩散或Transformer动力学预测未来观测，并支持策略学习或仿真。
  - 研究共性：多数工作从高维观测中学习潜在或视频动力学，以动作、语言或上下文为条件，并通过下游控制、生成质量或一致性基准评估。
  - 关键差异：表示方式包括潜在状态空间、视频生成和动作-视频联合扩散；监督信号包括强化学习回报、重建、物理辅助任务和上下文条件；评测对象覆盖驾驶数据、Atari、CARL、机器人数据及开放域基准。
  - 趋势演进：可用论文集中在2023至2026年，从样本高效的模型式强化学习和上下文泛化，转向大规模视频/扩散世界模型与显式一致性基准；本证据包未提供医疗或科学仿真应用证据。
  - 开放问题：仿真或基准收益能否迁移到真实驾驶与机器人部署，长期记忆和跨动作控制能否保持，以及可观测上下文或物理增强生成等假设在更广环境中的边界仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Generative driving world models for scene prediction and simulation
      what_it_solves: Predict multi-view, long-horizon driving scenes and enable zero-shot
        transfer across driving datasets.
      what_remains_open: Whether improved validation on NuScenes, OpenDV-2K, and Waymo
        translates to closed-loop real-world driving safety and operational outcomes.
    - line: Embodied robot world models for video planning and policy learning
      what_it_solves: Generate physically plausible robot videos and pretrain policies
        or dynamics by coupling video with actions, language, or physics signals.
      what_remains_open: Generalization beyond seen primitives, sim-to-real transfer,
        and coverage across large robot datasets and unseen embodiments remain unclear.
    - line: Model-based RL world models for interactive agents and games
      what_it_solves: Learn compact latent or context-conditioned dynamics for sample-efficient
        policy learning and zero-shot generalization in control or game tasks.
      what_remains_open: Assumptions of observable context, limited CARL and Atari
        evaluations, and transfer to partially observed real-world tasks remain unresolved.
    - line: Benchmarks for spatial, memory, and action consistency in world models
      what_it_solves: Provide loop-based navigation or open-domain video benchmarks
        to evaluate spatial consistency, memory consistency, and action control.
      what_remains_open: Benchmarks expose consistency gaps but lack strong method
        baselines or broad scene/action coverage, and their relationship to downstream
        task success is not established.
    consensus:
    - World models should condition video or latent dynamics on actions, language,
      or context to support downstream control and generalization.
    - Generative fidelity alone is insufficient; consistency, memory, and action responsiveness
      are emerging evaluation targets.
    - Transformer and diffusion architectures are widely used to scale world modeling
      across visual observations and long horizons.
    disagreements:
    - 'Representation: some works compress observations into latent state-space models
      for RL, while others generate future RGB video or jointly diffuse actions and
      video.'
    - 'Supervision: Atari and CARL work relies on RL return and reconstruction objectives,
      while robot and driving work adds language decomposition, physics auxiliary
      tasks, or video-action diffusion objectives.'
    - 'Evaluation target: driving models emphasize multi-view and long-horizon dataset
      performance, robot models emphasize visual fidelity and policy execution, and
      benchmark work targets consistency rather than task success.'
    - 'Interaction and deployment: some methods assume online action or observable
      context, while benchmark and generative video lines operate in offline or open-domain
      settings.'
    open_questions:
    - Do driving world model gains on NuScenes, OpenDV-2K, and Waymo transfer to closed-loop
      real-world safety outcomes?
    - Can robot world models generalize beyond seen language or action primitives
      and beyond simulation-only evaluation?
    - What training or memory mechanisms allow world models to maintain long-term
      memory consistency and cross-action control required by benchmarks such as LoopNav
      and MIND?
    - How do world models relying on observable context behave under partial observability
      or unseen dynamics?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 驾驶世界模型用于场景预测与仿真
      解决的问题: 预测多视角、长时域驾驶场景，并实现跨驾驶数据集的零样本迁移。
      尚未覆盖: NuScenes、OpenDV-2K和Waymo上的提升能否转化为闭环真实驾驶安全与运营结果仍未验证。
    - 路线: 具身机器人世界模型用于视频规划与策略学习
      解决的问题: 生成物理合理的机器人视频，并通过视频、动作、语言或物理信号耦合来预训练策略和动力学。
      尚未覆盖: 对未见原语组合、仿真到真实迁移、大规模机器人数据和不同本体的泛化仍不清楚。
    - 路线: 基于模型的强化学习世界模型用于交互智能体与游戏
      解决的问题: 学习紧凑潜在或上下文条件动力学，以提升样本效率，并在控制或游戏任务中实现零样本泛化。
      尚未覆盖: 上下文可观测假设、有限的CARL与Atari评测，以及向部分可观测真实任务的迁移仍不明确。
    - 路线: 世界模型的空间、记忆与动作一致性基准
      解决的问题: 提供循环导航或开放域视频基准，以评估空间一致性、记忆一致性和动作控制。
      尚未覆盖: 基准能暴露一致性缺口，但缺乏强方法基线或广泛场景/动作覆盖，与下游任务成功的关系尚未建立。
    共识:
    - 世界模型应以动作、语言或上下文为条件来建模视频或潜在动力学，以支持下游控制与泛化。
    - 生成保真度不足以单独作为目标；一致性、记忆与动作响应正成为新的评估重点。
    - Transformer与扩散架构被广泛用于跨视觉观测和长时域扩展世界建模。
    分歧:
    - 表示方式：部分研究将观测压缩为潜在状态空间模型用于强化学习，另有研究生成未来RGB视频或联合扩散动作与视频。
    - 监督信号：Atari与CARL工作多使用强化学习回报与重建目标，机器人/驾驶工作则加入语言分解、物理辅助任务或视频-动作扩散目标。
    - 评测目标：驾驶模型侧重多视角长时域数据集表现，机器人模型侧重视觉保真与策略执行，基准工作侧重空间/记忆/动作一致性而非任务成功率。
    - 交互与部署：部分方法假设在线动作或上下文可观测，基准与生成视频路线更多在离线或开放域设置中评估。
    开放问题:
    - 驾驶世界模型在NuScenes、OpenDV-2K和Waymo上的收益是否迁移到闭环真实安全结果？
    - 机器人世界模型能否超越已见语言/动作原语组合与仅仿真评估？
    - 何种训练或记忆机制能让世界模型满足LoopNav和MIND所要求的长期记忆一致性与跨动作控制？
    - 依赖可观测上下文的世界模型在部分可观测或未见动力学下如何表现？
