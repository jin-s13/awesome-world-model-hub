  related_work_outline:
  - 'Mainstream direction: World models in embodied AI and autonomous driving are
    adopting diffusion and transformer-based video generation, conditioned on actions,
    physical priors, or context, to serve as learned simulators for policy learning
    and evaluation.'
  - 'Shared research pattern: Most works pretrain a generative model on large-scale
    domain-specific datasets (robotic manipulation, driving videos, game play) and
    then adapt it via conditioning, fine-tuning, or task decomposition to specific
    downstream tasks.'
  - 'Key differences: Approaches diverge on supervision signals (mask reconstruction,
    depth/keypoint physics, action diffusion, context values), evaluation targets
    (visual fidelity, zero-shot policy performance, spatial/memory consistency), and
    interaction mode (open-loop generation vs. closed-loop control).'
  - 'Trend evolution: Early work focused on game environments (Atari, Minecraft) with
    compact latent dynamics; since 2023–2024 the trend shifts toward real-world applications
    like robotics and driving, with larger models, explicit physical constraints,
    and benchmarks for long-horizon consistency.'
  - 'Open questions: Achieving reliable long-term memory and physical plausibility
    in open-domain rollouts, transferring learned dynamics across diverse embodiments
    and environments, and closing the gap between simulation-based metrics and real-world
    safety/operational outcomes.'
  related_work_outline_zh:
  - 主流方向：具身智能和自动驾驶中的世界模型正采用基于扩散和Transformer的视频生成架构，通过动作、物理先验或上下文条件化，将世界模型作为学习模拟器，用于策略学习与评估。
  - 研究共性：多数工作在大规模领域数据集（机器人操作、驾驶视频、游戏画面）上预训练生成模型，然后通过条件控制、微调或任务分解适配到具体下游任务。
  - 关键差异：在监督信号（掩码重建、深度/关键点物理、动作扩散、上下文值）、评估目标（视觉保真度、零样本策略性能、空间/记忆一致性）和交互模式（开环生成 vs.
    闭环控制）上存在分歧。
  - 趋势演进：早期工作集中在游戏环境（Atari、Minecraft）中的紧凑潜在动力学；2023-2024年后趋势转向机器人、驾驶等现实应用，模型规模扩大，引入显式物理约束，并出现针对长时域一致性的基准。
  - 开放问题：在开放域推演中实现可靠的长期记忆和物理合理性，跨不同本体和环境迁移所学动力学，以及缩小基于仿真的指标与真实世界安全/运营结果之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Embodied robot world models
      what_it_solves: Learning composable, physics-aware, or action-conditioned video
        generation for robotic manipulation, enabling policy training, planning, and
        zero-shot generalization to unseen task combinations.
      what_remains_open: Cross-embodiment and sim-to-real transfer remain unverified;
        physical plausibility degrades in long-horizon rollouts; reliance on action
        labels or explicit context limits applicability to passive video data.
    - line: Autonomous driving world models
      what_it_solves: Multi-view, long-horizon video prediction under scene dynamics
        for closed-loop simulation and policy evaluation in driving.
      what_remains_open: Alignment between improved video prediction metrics and real-world
        driving safety or operational metrics is not established; generalization to
        unseen cities, weather, and sensor setups is underexplored.
    - line: Interactive game and open-domain world models
      what_it_solves: Building stochastic generative models of game environments (Atari,
        Minecraft) for efficient policy learning or benchmarking spatial consistency
        and memory over long trajectories.
      what_remains_open: Maintaining memory consistency and action control across
        diverse action spaces and long time horizons; translating game-domain findings
        to realistic interactive tasks with physical constraints.
    consensus:
    - World models in applied domains are predominantly built as video generation
      models using diffusion or transformer architectures, replacing earlier compact
      latent dynamics models.
    - Large-scale pretraining on task-specific datasets (robotics, driving, games)
      is considered essential for generalization, and most works couple visual prediction
      with action or control signals.
    - There is a shared recognition that evaluation must go beyond short-horizon visual
      quality, prompting the design of new benchmarks that measure memory, spatial
      consistency, or policy performance.
    disagreements:
    - 'Supervision and conditioning: some works use mask reconstruction, others use
      depth/keypoint physics, explicit action diffusion, or observable context variables,
      leading to different assumptions about what side information is available.'
    - 'Evaluation target: works disagree on whether the primary metric should be video
      fidelity, zero-shot policy success, or long-term memory consistency, making
      cross-comparison difficult.'
    - 'Interaction mode: open-loop video generation (RoboDreamer, RoboScape, MaskGWM)
      versus closed-loop control and memory evaluation (MIND, cRSSM) reflect different
      assumptions about how world models will be deployed.'
    open_questions:
    - How can world models maintain object permanence and physical consistency over
      hundreds of steps without external memory or ground-truth physics?
    - Can a single world model pretrained on diverse robot or driving data generalize
      across substantially different embodiments, sensor configurations, and action
      spaces?
    - What evaluation protocols can reliably connect improvements in video generation
      quality to real-world task success or safety, especially in safety-critical
      domains like driving?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 具身机器人世界模型
      解决的问题: 学习可组合、物理感知或动作条件的视频生成，用于机器人操作，支持策略训练、规划和对未见任务组合的零样本泛化。
      尚未覆盖: 跨本体和仿真到真实的迁移尚未验证；长时域推演中物理合理性下降；对动作标签或显式上下文的依赖限制了在无动作视频数据上的应用。
    - 路线: 自动驾驶世界模型
      解决的问题: 在场景动力学下进行多视角、长时域视频预测，用于驾驶中的闭环仿真和策略评估。
      尚未覆盖: 视频预测指标提升与真实驾驶安全或运营指标之间的关系尚未建立；对未见城市、天气和传感器设置的泛化探索不足。
    - 路线: 交互式游戏与开放域世界模型
      解决的问题: 构建游戏环境（Atari、Minecraft）的随机生成模型，用于高效策略学习或对长轨迹上的空间一致性和记忆进行基准测试。
      尚未覆盖: 在多样化动作空间和长时域下保持记忆一致性和动作控制；将游戏领域的发现迁移到具有物理约束的现实交互任务。
    共识:
    - 应用领域的世界模型主要采用扩散或Transformer架构的视频生成模型，取代了早期的紧凑潜在动力学模型。
    - 在任务特定数据集（机器人、驾驶、游戏）上进行大规模预训练被认为对泛化至关重要，多数工作将视觉预测与动作或控制信号耦合。
    - 研究者普遍认识到评估需要超越短时域视觉质量，从而推动设计衡量记忆、空间一致性或策略性能的新基准。
    分歧:
    - 监督与条件化：部分工作使用掩码重建，另一些使用深度/关键点物理、显式动作扩散或可观测上下文变量，导致对可用辅助信息的假设不同。
    - 评估目标：各工作对主要指标应为视频保真度、零样本策略成功率还是长期记忆一致性存在分歧，使得跨方法比较困难。
    - 交互模式：开环视频生成（如RoboDreamer、RoboScape、MaskGWM）与闭环控制和记忆评估（如MIND、cRSSM）反映了对世界模型部署方式的不同假设。
    开放问题:
    - 世界模型如何在无外部记忆或真实物理的情况下，在数百步的推演中保持物体持久性和物理一致性？
    - 在多样化机器人或驾驶数据上预训练的单一世界模型，能否泛化到实质不同的本体、传感器配置和动作空间？
    - 何种评估协议能够将视频生成质量的提升可靠地与真实世界任务成功或安全性联系起来，尤其是在驾驶等安全关键领域？
