  related_work_outline:
  - 'Mainstream direction: Current evidence centers on building and evaluating action-conditioned
    video world models for robotic manipulation and embodied decision-making rather
    than on formal theory; methods unify video and action generation, adapt pretrained
    video diffusion, and post-train for physical plausibility.'
  - 'Shared research pattern: Treat video generation as a predictive world model,
    condition rollouts on actions and history, then evaluate alignment, controllability,
    and decision utility beyond visual quality.'
  - 'Key differences: They differ in generative architecture, action injection, supervision
    signal, and evaluation target—some emphasize video fidelity, others physical realism,
    policy evaluation, or spatial reasoning benchmarks.'
  - 'Trend evolution: The available 2024–2026 frontier moves from architecture-centric
    action-video generation toward alignment, verifier reliability, and functional
    benchmarks; earlier years are not represented in the top evidence.'
  - 'Open questions: Whether imagined trajectories can support reliable decision-making
    across tasks and embodiments, how to evaluate physical persistence and causal
    reasoning, and why test-time verifiers scale inconsistently.'
  related_work_outline_zh:
  - 主流方向：当前证据集中于面向机器人操作和具身决策的动作条件视频世界模型，而非形式化理论；方法包括统一视频与动作生成、适配预训练视频扩散以及为物理合理性做后训练。
  - 研究共性：把视频生成视为预测性世界模型，以动作和历史为条件生成轨迹，并在视觉质量之外评估对齐、可控性和决策效用。
  - 关键差异：差异体现在生成架构、动作注入方式、监督信号与评测目标——有的强调视频保真度，有的强调物理真实性、策略评估或空间推理基准。
  - 趋势演进：可见的2024–2026前沿从以架构为中心的动作-视频生成转向对齐、验证器可靠性与功能基准；较早年份未在主要证据中体现。
  - 开放问题：想象轨迹能否在跨任务和跨本体场景中支持可靠决策，如何评测物理持久性与因果推理，以及测试时验证器为何缩放不一致。
  literature_review:
    line_of_work_matrix:
    - line: Unified action-video world models for robot manipulation
      what_it_solves: Learning joint video and action dynamics from large or heterogeneous
        robot datasets so one model can represent policy, forward/inverse dynamics,
        or a controllable video simulator.
      what_remains_open: Reported gains center on fidelity, controllability, and speed;
        some papers lack visible code or limitation details, leaving policy-evaluation
        reliability and cross-task generalization unverified.
    - line: Adaptation and alignment of pretrained video diffusion models
      what_it_solves: Converting pretrained video generators into action-conditioned
        world models or improving physical realism, task logic, and visual quality
        without full retraining.
      what_remains_open: Adaptation requires domain-specific action/video or preference
        data; human preference data is subjective, and evaluations mostly cover contact-rich
        manipulation rather than broader domains.
    - line: Functional evaluation and conceptual taxonomy
      what_it_solves: Clarifying state construction and dynamics modeling, and probing
        whether test-time verifiers or benchmarks can measure decision-relevant world-model
        quality.
      what_remains_open: Verifiers can be poorly calibrated and scaling inconsistent
        across benchmarks; current models may form an information bottleneck, and
        no functional benchmark yet proves causal persistence.
    - line: Formalization and theoretical guarantees
      what_it_solves: A conceptual line proposes state-construction and dynamics categories
        and calls for functional benchmarks, but the top evidence does not provide
        formal guarantees or scaling-law validation.
      what_remains_open: Whether these conceptual categories can be operationalized
        into model design or evaluation changes remains untested.
    consensus:
    - World-model research in this packet converges on action-conditioned video rollouts
      as a shared substrate for prediction, planning, and policy evaluation.
    - Visual quality alone is treated as insufficient; action-frame alignment, physical
      plausibility, task logic, or decision utility are increasingly evaluated.
    - Large-scale pretraining or adaptation from pretrained video models is seen as
      a practical path, but domain-specific action, preference, or benchmark data
      remains necessary.
    disagreements:
    - 'Generative formulation differs: unified diffusion over action and video, masked
      autoregression, flow-based post-training, or adapters on pretrained diffusion
      each encode different assumptions.'
    - 'Supervision and alignment signal differ: frame-level action conditioning, learned
      masks, multi-dimensional human preference rewards, and physics-suppression post-training
      optimize different objectives.'
    - 'Evaluation target differs: some target video fidelity and speed, others policy
      correlation and planning, spatial reasoning benchmarks, or zero-shot physical
      plausibility and trajectory consistency.'
    - 'Verifier reliability is contested: one study reports improvement on SAT-Real
      but finds no consistent scaling on MMSI-Bench across studied verifiers.'
    open_questions:
    - Which evaluation protocol can certify that generated rollouts support reliable
      policy selection, planning, or spatial reasoning across unseen tasks and embodiments?
    - What specific gaps in state persistence and causal dynamics cause current video
      world models to become information bottlenecks in fine-grained reasoning?
    - Can physical-realism alignment be scaled beyond contact-rich manipulation without
      relying on costly or subjective human preference data?
    - How reproducible are the leading methods when several top papers lack visible
      code, datasets, or limitation documentation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向机器人操作的统一动作-视频世界模型
      解决的问题: 从大规模或异构机器人数据中学习联合视频与动作动态，使单一模型可表示策略、前向/逆向动力学或可控视频模拟器。
      尚未覆盖: 现有证据主要报告保真度、可控性和速度；部分论文缺少可见代码或局限性说明，策略评估可靠性和跨任务泛化仍未验证。
    - 路线: 预训练视频扩散模型的适配与物理/人类偏好对齐
      解决的问题: 将预训练视频生成器转换为动作条件世界模型，或在无须完全重训的情况下改善物理真实性、任务逻辑和视觉质量。
      尚未覆盖: 适配依赖领域特定的动作视频或偏好数据；人类偏好具有主观性，且评估多集中在接触丰富的操作任务，未展示更广泛领域泛化。
    - 路线: 功能评测与概念分类
      解决的问题: 澄清状态构建与动态建模的分类，或探究测试时验证器和基准能否测量与决策相关的世界模型质量。
      尚未覆盖: 验证器可能校准不良且在不同基准上缩放不一致；当前模型可能构成信息瓶颈，功能基准尚未证明因果持久性。
    - 路线: 形式化定义与理论保证
      解决的问题: 概念性工作提出状态构建/动态建模分类，并倡导功能基准；但顶层证据未提供形式化保证或缩放律验证。
      尚未覆盖: 这些概念类别能否转化为可操作的模型设计或评测改进仍未验证。
    共识:
    - 本证据包中的世界模型研究汇聚于以动作条件视频轨迹作为预测、规划与策略评估的共同载体。
    - 单纯视觉质量被认为不够；动作-帧对齐、物理合理性、任务逻辑或决策效用正被逐步纳入评估。
    - 大规模预训练或从预训练视频模型适配被视为可行路径，但仍需要领域特定的动作、偏好或基准数据。
    分歧:
    - 生成形式不同：动作与视频的统一扩散、掩码自回归、基于流的后训练或预训练扩散适配器各有不同假设。
    - 监督与对齐信号不同：帧级动作条件、学习掩码、多维人类偏好奖励和物理抑制后训练编码了不同目标。
    - 评测目标不同：有的侧重视频保真度与速度，有的侧重策略相关性和规划，有的侧重空间推理基准或零样本物理合理性与轨迹一致性。
    - 验证器可靠性存在分歧：有研究显示在SAT-Real上有效，但在MMSI-Bench上所有被研究验证器均未稳定缩放。
    开放问题:
    - 哪种评测协议能证明生成的轨迹能够在未见任务和本体上支持可靠的策略选择、规划或空间推理？
    - 当前视频世界模型为何在细粒度推理中形成信息瓶颈，其状态持久性与因果动态的缺口如何定位？
    - 在不依赖昂贵或主观人类偏好数据的情况下，物理真实性对齐能否扩展到接触丰富操作以外的领域？
    - 在多个顶级方法缺少可见代码、数据集或局限性文档的情况下，其可复现性如何验证？
