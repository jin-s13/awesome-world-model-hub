  related_work_outline:
  - 'Mainstream direction: Building world models as runnable, action-controllable
    interactive video simulators that can be deployed in closed-loop systems for autonomous
    driving and robotics.'
  - 'Shared research pattern: Pursuing high fidelity, physical consistency, and long-horizon
    coherence; emphasizing action controllability; and developing dedicated benchmarks
    to evaluate these capabilities.'
  - 'Key differences: Evaluation focuses range from spatial consistency to action
    fidelity; architectures span diffusion, autoregressive transformers, and recurrent
    state-space models; control modalities vary from high-level commands to low-level
    trajectories.'
  - 'Trend evolution: Moving from static video generation toward interactive closed-loop
    simulation, from single-view to multi-view frame-level autoregressive generation,
    and incorporating physical priors and pre-trained models, with benchmarks rapidly
    diversifying.'
  - 'Open questions: Mitigating long-horizon degradation, satisfying real-time constraints,
    generalizing across diverse domains, and establishing unified evaluation standards
    for world simulators.'
  related_work_outline_zh:
  - 主流方向：将世界模型构建为可运行、动作可控的交互式视频模拟器，部署于自动驾驶与机器人等闭环系统。
  - 研究共性：追求高保真、物理一致与长时域连贯性，强调动作可控性，并开发专用基准来评估这些能力。
  - 关键差异：评估聚焦点从空间一致性到动作保真度各不相同；架构涵盖扩散模型、自回归Transformer与循环状态空间模型；控制方式从高层指令到低层轨迹不等。
  - 趋势演进：从静态视频生成向交互式闭环模拟演进，从单视图到多视图帧级自回归，融合物理先验与预训练模型，基准快速多样化。
  - 开放问题：缓解长时域退化、满足实时约束、跨领域泛化，以及为世界模拟器建立统一评估标准。
  literature_review:
    line_of_work_matrix:
    - line: World model evaluation benchmarks and toolkits
      what_it_solves: Provides standardized metrics and datasets for quantifying spatial
        consistency, action fidelity, and physical plausibility of world models, enabling
        systematic comparison.
      what_remains_open: Few benchmarks connect metric improvements to downstream
        task performance in real-world scenarios; cross-domain generalization of evaluation
        protocols remains unverified.
    - line: Controllable world model architectures
      what_it_solves: Designs video generative models that achieve high visual fidelity,
        action-conditioned controllability, and physical plausibility, serving as
        simulators for policy learning.
      what_remains_open: Long-horizon consistency under autoregressive rollout degrades
        over time; trade-offs between real-time inference speed and generation quality
        are not well resolved; architectural choices are rarely validated outside
        narrow domains like driving or games.
    - line: Interactive closed-loop world simulation systems
      what_it_solves: Integrates world models into closed-loop decision pipelines,
        generating future frames conditioned on actions to support planning and policy
        training in autonomous driving and robotics.
      what_remains_open: Robustness under real-world deployment, multi-sensor fusion,
        and strict latency constraints are not demonstrated; assumptions about action
        observability and environment staticness limit real-world applicability.
    consensus:
    - Action controllability, long-horizon consistency, and physical plausibility
      are essential capabilities for world models as simulators.
    - Dedicated benchmarks are critical for measuring progress, but existing benchmarks
      cover only a subset of relevant dimensions.
    - Leveraging pre-trained video generative models as a foundation for world simulators
      is a promising direction.
    - Incorporating structural, physical, or geometric priors improves generation
      fidelity and consistency.
    - Frame-level autoregressive generation with structured control is a common paradigm
      for closed-loop simulation.
    disagreements:
    - 'Evaluation targets diverge: some works emphasize pixel-level fidelity (FID,
      FVD), while others prioritize action-following accuracy or downstream policy
      performance.'
    - 'Control granularity differs: high-level commands (goals, directions) versus
      low-level trajectories (waypoints, speed, steering), with no consensus on the
      optimal level for generalization.'
    - 'Supervision signals vary: kinematic trajectory data, depth, keypoint dynamics,
      and physical priors are used alternatively, each with different assumptions
      about data availability.'
    - 'Architectural preferences differ: diffusion-based models, autoregressive transformers,
      and recurrent state-space models each trade off sample quality, speed, and memory
      in distinct ways.'
    - 'Interaction modes differ: some systems are designed for open-loop future prediction,
      while others target closed-loop self-conditioned generation, leading to different
      error accumulation patterns.'
    open_questions:
    - How can we build a unified evaluation framework that simultaneously measures
      visual fidelity, action controllability, physical consistency, and long-horizon
      stability?
    - What training and inference strategies can maintain temporal consistency over
      extremely long rollouts without prohibitive computation?
    - How can world models be reliably deployed in real-time systems with strict latency
      budgets, especially when handling multi-view or multi-sensor inputs?
    - To what extent can world models trained on limited domains generalize to unseen
      dynamics, environments, and task specifications?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评估基准与工具
      解决的问题: 提供标准化指标和数据集，用于量化世界模型的空间一致性、动作保真度和物理合理性，支持系统化比较。
      尚未覆盖: 很少基准将指标提升与实际下游任务性能关联；跨领域评估协议的泛化性尚未验证。
    - 路线: 可控制世界模型架构
      解决的问题: 设计高视觉保真度、动作可控且物理合理的视频生成模型，作为策略学习的模拟器。
      尚未覆盖: 自回归推演时长增加时一致性退化；实时推理速度与生成质量的权衡未妥善解决；架构选择仅在驾驶或游戏等狭窄领域验证。
    - 路线: 交互式闭环世界模拟系统
      解决的问题: 将世界模型集成到闭环决策流程中，根据动作生成未来帧，支持自动驾驶和机器人的规划与策略训练。
      尚未覆盖: 真实部署的鲁棒性、多传感器融合及严格延迟约束未展示；对动作可观测性和环境静态性的假设限制了实际应用。
    共识:
    - 动作可控性、长时域一致性和物理合理性是世界模型作为模拟器的核心能力。
    - 专用基准对衡量进展至关重要，但现有基准仅覆盖部分相关维度。
    - 利用预训练视频生成模型作为世界模拟器的基础是一条有前景的路径。
    - 引入结构、物理或几何先验能够提升生成保真度和一致性。
    - 带结构化控制的帧级自回归生成是实现闭环模拟的常见范式。
    分歧:
    - 评测目标不同：部分工作强调像素级保真度（FID、FVD），另一些侧重动作跟随精度或下游策略性能。
    - 控制粒度不同：高层指令（目标、方向）与低层轨迹（路径点、速度、转向）并存，对最优泛化粒度未达成共识。
    - 监督信号不同：运动轨迹数据、深度、关键点动力学和物理先验交替使用，各自对数据可用性有不同假设。
    - 架构偏好不同：基于扩散的模型、自回归Transformer和循环状态空间模型在样本质量、速度和内存方面各有取舍。
    - 交互模式不同：部分系统为开环未来预测设计，另一些面向闭环自条件生成，导致不同的误差累积模式。
    开放问题:
    - 如何构建统一的评估框架，同时衡量视觉保真度、动作可控性、物理一致性和长时域稳定性？
    - 何种训练和推理策略能在不显著增加计算开销的情况下，维持极长推演的时间一致性？
    - 世界模型如何在严格延迟预算的实时系统中可靠部署，特别是处理多视图或多传感器输入时？
    - 在有限领域训练的世界模型能在多大程度上泛化到未见动态、环境和任务规范？
