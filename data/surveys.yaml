  - 'Mainstream direction: Controllable generative world simulators are the dominant
    system direction, especially for autonomous driving and embodied RL, with action-conditioned
    video generation and closed-loop evaluation increasingly treated as runnable pipelines
    rather than standalone models.'
  - 'Shared research pattern: Works couple visual generation with control or action
    inputs, then evaluate through benchmarked metrics for action fidelity, spatial
    consistency, physical plausibility, or downstream planning/RL utility.'
  - 'Key differences: They differ in conditioning signal, evaluation target, and deployment
    mode; examples include explicit context, action trajectories, or physics-inspired
    losses, and open-loop versus closed-loop real-time serving.'
  - 'Trend evolution: The available evidence spans mainly 2024-2026, moving from dataset/benchmark
    construction and model-centric improvements toward frame-level, low-latency closed-loop
    simulation and system-level integration.'
  - 'Open questions: Cross-domain generalization, long-horizon consistency, the right
    metric for downstream utility, reproducibility across infrastructure, and trade-offs
    among latency, fidelity, and controllability remain unsettled.'
  related_work_outline_zh:
  - 主流方向：可控生成式世界模拟器，尤其面向自动驾驶与具身强化学习；动作条件视频生成和闭环评测正成为可运行系统。
  - 研究共性：将视觉生成与控制/动作输入耦合，并以基准化指标评测动作忠实度、空间一致性、物理合理性或下游规划/强化学习效用。
  - 关键差异：条件信号、评测目标、交互模式不同；例如显式上下文、动作轨迹或物理启发损失，以及开环或闭环实时部署。
  - 趋势演进：证据集中在 2024-2026，正从数据集/基准和模型改进走向帧级低延迟闭环模拟与系统集成。
  - 开放问题：跨域泛化、长时程一致性、下游效用指标、基础设施复现，以及延迟-保真-可控权衡仍需验证。
  literature_review:
    line_of_work_matrix:
    - line: Runnable driving simulation and planning pipelines
      what_it_solves: End-to-end conversion of action-conditioned generative dynamics
        models into simulation, scenario generation, and planning workflows for autonomous
        driving.
      what_remains_open: Generalization beyond the evaluated driving datasets and
        sensors, external deployment under hardware change, and long-horizon multi-view
        consistency.
    - line: Real-time closed-loop serving
      what_it_solves: Low-latency, frame-level generation for interactive simulators
        and policy evaluation, with structured control to preserve consistency.
      what_remains_open: Speed-fidelity-controllability trade-offs, scalability beyond
        single-GPU settings, and degradation under extended autoregressive rollouts.
    - line: Context- and physics-conditioned world model learning
      what_it_solves: Zero-shot or physically plausible next-state/video generation
        by conditioning on observable context or physics-inspired objectives.
      what_remains_open: Assumptions of observable context, limited evaluation domains,
        and incomplete evidence on robustness to unseen physical settings.
    - line: Benchmarks and reproducible evaluation artifacts
      what_it_solves: Standardized datasets and scores for spatial consistency and
        action fidelity, making world model behavior inspectable and comparable.
      what_remains_open: Independent reproduction across teams and infrastructure;
        some abstracts omit experimental results or limitation evidence, leaving metric
        validity unverified.
    consensus:
    - Recent work positions generative world models as system components for simulation
      and control, linking future video generation to action, trajectory, or context
      inputs.
    - Evaluation is moving from image quality alone toward quantitative system behavior
      such as action fidelity, spatial consistency, physical plausibility, and downstream
      planning or reinforcement learning utility.
    - Controllability and closed-loop interaction are shared goals, often achieved
      by conditioning modules, structured losses, or autoregressive rollout designs.
    - Papers frequently release code, datasets, or benchmarks, signaling reproducibility
      as a common norm, even though independent verification is not fully demonstrated.
    disagreements:
    - 'Conditioning signals differ: explicit observable context for latent dynamics,
      action/trajectory conditioning for video generation, and physics-inspired objectives
      such as depth or keypoint dynamics.'
    - 'Evaluation targets differ: pixel-level fidelity, spatial scene-graph consistency,
      action adherence, physical plausibility, or downstream planning/RL performance.'
    - 'Interaction mode differs: open-loop generation from context frames versus closed-loop
      autoregressive simulation with low-latency serving requirements.'
    - Domain settings differ, including Minecraft navigation, contextual RL, robotic
      manipulation, and autonomous driving, which leaves transferability unresolved.
    open_questions:
    - 'Which evidence or metric best predicts downstream utility: action fidelity,
      spatial consistency, visual realism, physical plausibility, or planning performance?'
    - How robust are these systems beyond the reported datasets and domain settings,
      especially under unseen sensors, environments, and long-horizon rollouts?
    - Can context-conditioned models handle latent or partially observable context
      rather than assuming explicit context values?
    - What deployment evidence is needed to confirm real-time claims beyond single-GPU
      or narrow benchmark demonstrations?
    - Where are the concrete reproducibility gaps when code, data, and evaluation
      artifacts are released but independent reproduction is not reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行驾驶模拟与规划流水线
      解决的问题: 将动作条件生成式动力学模型转化为端到端的仿真、场景生成与规划工作流。
      尚未覆盖: 在已评测驾驶数据集与传感器之外的泛化、硬件变化下的外部部署、长时程多视角一致性。
    - 路线: 实时闭环服务
      解决的问题: 低延迟帧级生成用于交互式模拟和策略评估，并以结构化控制保持一致性。
      尚未覆盖: 速度-保真-可控权衡、单GPU之外的可扩展性、扩展自回归推演下的退化。
    - 路线: 上下文与物理条件世界模型学习
      解决的问题: 通过对可观测上下文或物理启发目标进行条件化，实现零样本或物理合理的下一状态/视频生成。
      尚未覆盖: 可观测上下文假设、有限评测域、对未知物理环境的鲁棒性证据不足。
    - 路线: 基准与可复现评测工件
      解决的问题: 提供空间一致性与动作忠实度的标准数据集和分数，使世界模型行为可检查、可比较。
      尚未覆盖: 跨团队和基础设施的独立复现；部分摘要缺少实验结果或局限性证据，指标效度未验证。
    共识:
    - 近期工作将生成式世界模型作为仿真与控制组件，把未来视频生成与动作、轨迹或上下文输入关联。
    - 评测正从图像质量扩展到定量系统行为，如动作忠实度、空间一致性、物理合理性和下游规划/强化学习效用。
    - 可控性和闭环交互是共同目标，常通过条件模块、结构化损失或自回归推演实现。
    - 论文频繁发布代码、数据集或基准，表明可复现性已成为常规预期，但独立验证尚未充分展示。
    分歧:
    - 条件信号不同：显式可观测上下文用于潜在动力学，动作/轨迹条件用于视频生成，以及深度或关键点动力学等物理启发目标。
    - 评测目标不同：像素级保真、空间场景图一致性、动作遵循、物理合理性或下游规划/强化学习性能。
    - 交互模式不同：从上下文帧进行开环生成，与具有低延迟服务需求的闭环自回归仿真。
    - 领域设置不同，包括Minecraft导航、上下文强化学习、机器人操作和自动驾驶，因此可迁移性仍未解决。
    开放问题:
    - 哪种证据或指标最能预测下游效用：动作忠实度、空间一致性、视觉真实感、物理合理性还是规划性能？
    - 这些系统在已报告数据集和领域设置之外，尤其是未知传感器、环境和长时程推演下有多稳健？
    - 上下文条件模型能否处理潜在或部分可观测的上下文，而不是假设上下文值可用？
    - 除单GPU或窄基准演示外，还需要哪些部署证据才能确认实时声明？
    - 当代码、数据和评测工件已发布但没有独立复现报告时，具体可复现性缺口在哪里？
