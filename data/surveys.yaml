  related_work_outline_zh:
  - 主流方向：以视频世界模型为核心，面向具身控制的动作条件视频生成、奖励对齐与测试时验证，而非传统封闭式理论保证。
  - 研究共性：将视频生成视为可控动力学模型，通过动作注入扩散或掩码自回归模型，并对生成轨迹进行物理合理性或决策效用对齐与评测。
  - 关键差异：表示与监督信号不同：统一视频-动作预训练 vs 适配预训练视频模型；人类偏好奖励 vs DPO vs 帧锚定启发式验证；评测覆盖机器人操作、视频游戏和空间推理等场景。
  - 趋势演进：在可见的2024-2026年高相关证据中，从基于扩散的机器人视频世界模型走向物理后训练、异构预训练与测试时缩放；概念工作开始要求显式状态构建和功能基准。
  - 开放问题：视频生成指标能否证明物理持久性或因果推理；对齐奖励在接触丰富任务之外是否迁移；状态/动态分类的形式条件如何对应经验模型行为。
  literature_review:
    line_of_work_matrix:
    - line: Unified video-action generative world models
      what_it_solves: Learning policy, forward dynamics, inverse dynamics, or video
        generation from large robot datasets in one model.
      what_remains_open: Cross-embodiment transfer and formal guarantees that the
        same model remains calibrated when used as policy, dynamics model, or simulator.
    - line: Adapter-based adaptation of pretrained video diffusion models
      what_it_solves: Turning closed pretrained video generators into action-conditioned
        world models with small domain-specific data.
      what_remains_open: Dependence on pretrained model access and biases, and generalization
        beyond the evaluated game and robot domains.
    - line: Alignment and post-training for embodied world models
      what_it_solves: Improving physical fidelity, logical coherence, embodiment plausibility,
        and visual quality via preference or discriminator-based rewards.
      what_remains_open: Human-preference cost and subjectivity, and evidence that
        alignment rewards predict downstream policy success beyond contact-rich manipulation.
    - line: Conceptual taxonomies and test-time evaluation of world models
      what_it_solves: Clarifying state construction vs dynamics modeling and grounding
        test-time rewards in frame-anchored spatial assertions.
      what_remains_open: Whether taxonomies and verifiers change model design or evaluation;
        current models may form an information bottleneck on fine-grained benchmarks.
    consensus:
    - Video generation models are treated as world-model substrates when actions are
      injected and rollouts are evaluated for dynamics or planning utility.
    - Alignment or post-training improves physical plausibility and control-relevant
      quality over purely visual video generation.
    - Evaluation needs to move beyond visual fidelity toward physical persistence,
      causal reasoning, and trajectory consistency.
    disagreements:
    - Some methods train a unified video-action model from large data, while others
      adapt pretrained video diffusion models via a learned mask without parameter
      access.
    - 'Alignment signals differ: multi-dimensional human-preference reward models,
      DPO-based discriminators, and frame-anchored verifier assertions are used to
      constrain generation.'
    - 'Evaluation targets differ: robot manipulation planning and simulation, video
      game and real-world action-video fidelity, and spatial reasoning benchmarks
      lead to inconsistent evidence about useful scaling.'
    open_questions:
    - Which formal state and dynamics assumptions would certify that a video world
      model supports causal reasoning rather than only visual continuation?
    - Do physical alignment rewards learned on contact-rich manipulation transfer
      to other embodiments and tasks, and can they be collected less subjectively?
    - Why do test-time verifiers improve spatial reasoning on SAT-Real but not MMSI-Bench,
      and is this due to an information bottleneck in current world models?
    - The packet lacks direct scaling-law and formal guarantee studies, so predicted
      failure modes and transfer behavior remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 统一视频-动作生成式世界模型
      解决的问题: 在大规模机器人数据集中用一个模型学习策略、前向动力学、逆动力学或视频生成。
      尚未覆盖: 跨实体迁移，以及同一模型在策略、动力学和模拟器用途下保持校准的形式保证。
    - 路线: 预训练视频扩散模型的适配器式改造
      解决的问题: 用小型领域数据将闭源预训练视频生成器改造为动作条件世界模型。
      尚未覆盖: 依赖预训练模型可访问性与固有偏差，且缺少对游戏和机器人之外领域的泛化证据。
    - 路线: 具身世界模型的对齐与后训练
      解决的问题: 通过偏好或判别器奖励提升物理保真度、逻辑一致性、具身合理性与视觉质量。
      尚未覆盖: 人类偏好成本与主观性；对齐奖励是否能预测下游策略成功仍缺少超出接触丰富操作的证据。
    - 路线: 概念分类与测试时评估
      解决的问题: 澄清状态构建与动态建模的区别，并用帧锚定空间断言约束测试时奖励。
      尚未覆盖: 分类法和验证器是否改变模型设计或评测；当前模型在细粒度基准上可能构成信息瓶颈。
    共识:
    - 视频生成模型在注入动作并评测动力学或规划效用后，被当作世界模型基底。
    - 对齐或后训练能改善物理合理性和控制相关质量，而不只是视觉生成质量。
    - 评测需要从视觉保真度扩展到物理持久性、因果推理和轨迹一致性。
    分歧:
    - 表示与训练模式：有的用大规模数据统一训练视频-动作模型，有的通过学习掩码适配预训练视频扩散模型而不访问参数。
    - 对齐信号不同：多维人类偏好奖励、基于DPO的判别器、以及帧锚定验证断言分别用于约束生成。
    - 评测目标不同：机器人操作规划与仿真、游戏与真实世界动作视频保真度、空间推理基准之间存在不同证据强度。
    开放问题:
