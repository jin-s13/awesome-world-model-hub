  related_work_outline:
  - 'Mainstream direction: The evidence centers on world-model evaluation through
    controllable video generation and downstream control; 2025-2026 work introduces
    explicit open-domain benchmarks for navigation, spatial consistency, memory, and
    action control.'
  - 'Shared research pattern: Papers combine standardized tasks or datasets with metrics
    such as human-normalized score, zero-shot generalization, spatial consistency,
    memory/action control, and visual-physical plausibility.'
  - 'Key differences: Some evaluate closed-loop action/memory settings, others long-horizon
    or multi-view rollout; some use action-free video pretraining, others assume observable
    context or action-conditioned interaction; representations range from diffusion
    to Transformer/VAE or unified video-action diffusion.'
  - 'Trend evolution: The available top evidence moves from 2023-2024 single-task
    RL records on Atari 100k and contextual zero-shot tests toward 2025-2026 open-domain
    benchmark construction and embodied/driving evaluation.'
  - 'Open questions: Metric alignment with downstream decisions, stability across
    implementations and compute, generalization from curated scenes and fixed action
    spaces, and the role of context observability remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中在通过可控视频生成和下游控制评估世界模型；2025-2026年出现面向导航、空间一致性、记忆和动作控制的开放域基准。
  - 研究共性：论文将标准化任务或数据集与人类归一化分数、零样本泛化、空间一致性、记忆/动作控制以及视觉-物理合理性等指标结合使用。
  - 关键差异：有的评测闭环动作/记忆设置，有的关注长时域或多视角展开；有的用无动作视频预训练，有的假设上下文可观测或动作条件交互；表示从扩散到Transformer/VAE或统一视频-动作扩散不等。
  - 趋势演进：证据从2023-2024年Atari 100k单任务RL记录和上下文零样本测试，转向2025-2026年开放域基准构建与具身/驾驶评估。
  - 开放问题：指标与下游决策对齐、实现与算力稳定性、精选场景和固定动作空间的泛化，以及上下文可观测性的作用仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for open-domain spatial and memory consistency,
        with short examples such as LoopNav and MIND
      what_it_solves: Creates shared navigation and video tasks so that world-model
        claims about spatial stability, memory, and action following can be compared
        across models.
      what_remains_open: Whether the selected Minecraft or video scenes cover the
        long-horizon, diverse-action, real-world settings where world models are expected
        to help.
    - line: Metric and stress-test design for rollout quality, physical plausibility,
        and zero-shot dynamics
      what_it_solves: Probes aggregate performance with spatial consistency scores,
        memory/action-control measures, human-normalized Atari scores, zero-shot generalization,
        and fidelity/plausibility checks.
      what_remains_open: Alignment between these proxy metrics and downstream decisions
        such as robot policy training, navigation, or deployment reliability.
    - line: Comparable baselines and reporting on public RL and driving benchmarks
      what_it_solves: Makes results auditable through Atari 100k, CARL, NuScenes/OpenDV/Waymo,
        and reported training compute or zero-shot settings.
      what_remains_open: Whether benchmark rankings remain stable across implementations,
        compute budgets, missing code/dataset signals, and unreported limitation details.
    consensus:
    - 'World-model evaluation is treated as more than generation quality: downstream
      policy performance, zero-shot ability, or control consistency are used as key
      evidence.'
    - Standardized benchmarks and explicit metrics are used to compare diffusion or
      transformer-based world models across visual fidelity, memory, spatial consistency,
      and action following.
    - Current evaluation should isolate long-horizon and cross-view or cross-action
      settings because short single-step or single-view results do not expose core
      failure modes.
    disagreements:
    - Some papers evaluate through closed-loop interactive navigation or action control,
      while others evaluate through long-horizon video rollout or one-step policy
      learning; this changes which consistency properties are measured.
    - 'Supervision and evaluation targets differ: action-free video pretraining is
      used in some work, whereas other work assumes observable context values or action-conditioned
      interaction with known dynamics.'
    - Discrete or VAE-style stochastic latents, diffusion-based generation, and unified
      video-action diffusion lead to different visual-detail/compute tradeoffs and
      different claims on the same benchmarks.
    open_questions:
    - Do current open-domain memory/action benchmarks generalize beyond their curated
      scenes and fixed action spaces to embodied or driving deployment?
    - Do spatial or memory consistency metrics align with downstream task success,
      or are they mainly diagnostic proxies?
    - How stable are benchmark rankings across implementation choices, compute budgets,
      and missing code or dataset artifacts?
    - Does assuming observable context limit zero-shot world models when unseen dynamics
      must be inferred from pixels alone?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向空间与记忆一致性的开放域基准任务和数据集设计，例如LoopNav、MIND
      解决的问题: 建立共享导航和视频任务，使世界模型关于空间稳定性、记忆和动作跟随的主张可比较。
      尚未覆盖: 所选Minecraft或视频场景是否能覆盖真实世界中长时域、多样动作和不同视角的关键设置。
    - 路线: 面向展开质量、物理合理性和零样本动力学的指标与压力测试设计
      解决的问题: 用空间一致性分数、记忆/动作控制度量、Atari人类归一化分数、零样本泛化以及保真度/合理性检验，在总分之外探测模型能力。
      尚未覆盖: 这些代理指标与机器人策略训练、导航或部署可靠性的下游决策之间是否真正一致。
    - 路线: 公共强化学习和驾驶基准上的可比基线与报告规范
      解决的问题: 通过Atari 100k、CARL、NuScenes/OpenDV/Waymo等公共基准和训练算力/零样本设置的报告，让结果可审计。
      尚未覆盖: 不同实现、算力预算、部分缺失的代码/数据集信号和未报告局限性下，基准结论是否仍稳定。
    共识:
    - 世界模型评估不只是生成质量，下游策略表现、零样本能力或控制一致性被用作关键证据。
    - 通过标准化基准和显式指标比较扩散或Transformer世界模型在视觉保真度、记忆、空间一致性和动作跟随方面的能力。
    - 当前评估需要隔离长时域、跨视角或跨动作设置，因为短期单步或单视角结果无法揭示核心失效模式。
    分歧:
    - 有的工作通过闭环交互式导航或动作控制评测，有的通过长时域视频展开或单步策略学习评测，因而测量的空间/记忆性质不同。
    - 监督与评测目标不同：一些工作利用无动作视频预训练，另一些假设上下文可观测或依赖动作条件交互和已知动力学。
    - 离散或VAE式随机潜变量、扩散生成和统一视频-动作扩散等表示与报告方式不同，带来不同的视觉细节-算力权衡和同一基准上的主张差异。
    开放问题:
