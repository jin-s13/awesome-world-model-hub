    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes benchmarks, metrics, and evaluation choices across
        generative video, autonomous driving, robotic execution, and ego-vision settings.
      what_remains_open: Metric compatibility across domains and settings is unproven;
        proposed closed-loop or resource-aware metrics lack implementation and direct
        comparison evidence.
    - line: Open problem and gap mapping
      what_it_solves: Converts literature coverage into concrete research gaps such
        as action-conditioned controllability, long-horizon memory, real-time interactivity,
        and out-of-sight dynamics.
      what_remains_open: Prioritization among gaps is unclear, and methods targeting
        these gaps still show narrow generalization or limited validation beyond simulation
        or specific datasets.
    consensus:
    - The surveyed work is highly fragmented by application scenario, representation,
      and evaluation setting, so synthesis is organized around those dimensions.
    - Action-conditioned controllability, long-horizon temporal consistency and memory,
      and real-time responsiveness appear repeatedly as key technical challenges.
    - Evaluation needs to move beyond open-loop visual quality toward control, dynamics,
      and resource-aware closed-loop measurement.
    disagreements:
    - Conceptual survey work proposes taxonomies and evaluation prescriptions without
      experimental evidence, while method and system work reports empirical benchmarks
      or deployed systems.
    - 'World-state representation choices differ: language-derived compositional primitives,
      persistent global state with dynamic entities, latent spaces with structural
      priors, and ego-centric multimodal state.'
    - 'Validation settings differ: physical robot learning versus simulation or video
      benchmarks, and general video generation versus domain-specific autonomous driving
      or ego-vision scenarios.'
    open_questions:
    - How can survey taxonomies and challenges be validated beyond selective examples
      and current trends?
    - Which metrics are genuinely comparable across generative video, autonomous driving,
      and embodied robot settings?
    - How should long-horizon memory, out-of-sight dynamics, and real-time interactivity
      be prioritized for open-source world simulators?
    - Do current world models generalize to unseen primitive combinations and real-world
      execution beyond simulation or training-distribution evaluation?
