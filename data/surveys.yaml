  - 开放问题：分布偏移下的长时程时空一致性，视觉保真度与物理真实性的权衡，以及可运行仿真系统缺乏标准化元评估。
  literature_review:
    line_of_work_matrix:
    - line: World-model evaluation benchmarks and datasets
      what_it_solves: Provides standardized metrics and scenarios for spatial consistency,
        action fidelity, and interactive capabilities, enabling systematic comparison
        of world-model simulators.
      what_remains_open: Coverage beyond driving and navigation domains, and the lack
        of cross-benchmark alignment on evaluation protocols for long-horizon and
        out-of-distribution settings.
    - line: Action-controllable world-model systems
      what_it_solves: Transforms pre-trained video generators into simulators that
        respond to control signals (trajectory, command, keypoints) with high visual
        fidelity and dynamic consistency.
      what_remains_open: Long-horizon autoregressive degradation, limited generalization
        across sensor configurations and environments, and the tension between detail
        preservation and motion accuracy.
    - line: Real-time closed-loop simulation stacks
      what_it_solves: Delivers sub-second latency, frame-level autoregressive generation,
        and multi-view geometric consistency for interactive simulation in autonomous
        driving or robotics.
      what_remains_open: Scalability to multi-GPU or edge deployments, robustness
        under extreme or out-of-distribution conditions, and integration with downstream
        policy training loops.
    - line: Open artifacts and reproducible engineering
      what_it_solves: Releases code, datasets, and evaluation frameworks that make
        world-model simulators inspectable and reusable across teams.
      what_remains_open: Independent reproduction across different infrastructure,
        dataset versions, and hardware configurations remains unverified.
    consensus:
    - World models are evolving from pure generation tools into interactive, action-conditioned
      simulators for closed-loop tasks.
    - Lightweight action-conditioning modules that plug into existing video generators
      are a widely adopted architectural pattern.
    - Evaluation is shifting from image-quality metrics (FID, FVD) to action fidelity,
      spatial consistency, and closed-loop controllability.
    - Autonomous driving and game environments are the dominant testbeds for system-level
      world-model simulation.
    - Combining multiple training signals (depth, keypoints, motion emphasis) improves
      physical plausibility beyond pixel-level realism.
    disagreements:
    - 'Representation choice: diffusion-based vs. autoregressive transformers for
      frame generation, with different trade-offs in latency and long-horizon stability.'
    - 'Supervision signals: some works enforce physics through depth and keypoints,
      others rely purely on data-driven motion losses without explicit physical priors.'
    - 'Evaluation target: spatial consistency (LoopNav), action fidelity (ACT-Bench),
      visual quality (Vista), or real-time latency (FAR-Drive) are prioritized differently.'
    - 'Interaction mode: closed-loop autoregressive simulation with self-conditioning
      vs. open-loop action-to-video generation evaluated on pre-recorded data.'
    - 'Deployment goal: single-GPU real-time inference is claimed by some, while others
      treat the system as an offline simulation engine without latency guarantees.'
    open_questions:
    - How can long-horizon consistency be maintained when world models are rolled
      out autoregressively under distribution shift?
    - What is the minimal set of evaluation protocols needed to certify a world-model
      simulator as ready for downstream policy training?
    - Can physical realism be reliably achieved without ground-truth depth or keypoint
      supervision, and how does this affect sim-to-real transfer?
    - How do real-time world-model simulators scale to multi-agent settings or diverse
      hardware environments beyond the reported single-GPU scenario?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 世界模型评估基准与数据集
      解决的问题: 为空间一致性、动作忠实度和交互能力提供标准化度量与场景，支持世界模型模拟器的系统比较。
      尚未覆盖: 自动驾驶和导航之外的领域覆盖，以及长时程和分布外场景下评估协议缺乏跨基准对齐。
    - 路线: 动作可控的世界模型系统
      解决的问题: 将预训练视频生成器转化为可响应控制信号的模拟器，兼顾高视觉保真度和动态一致性。
      尚未覆盖: 长时程自回归退化，跨传感器配置和环境的泛化有限，以及细节保留与运动准确性的权衡。
    - 路线: 实时闭环仿真栈
      解决的问题: 在自动驾驶或机器人中提供亚秒级延迟、帧级自回归生成和多视图几何一致性，支持交互式仿真。
      尚未覆盖: 多GPU或边缘部署的可扩展性，极端或分布外条件下的鲁棒性，以及与下游策略训练循环的集成。
    - 路线: 开放工件与可复现工程
      解决的问题: 发布代码、数据集和评估框架，使世界模型模拟器跨团队可检查、可复用。
      尚未覆盖: 跨不同基础设施、数据集版本和硬件配置的独立复现仍未验证。
    共识:
    - 世界模型正从纯生成工具演进为用于闭环任务的交互式、动作条件模拟器。
    - 可插入现有视频生成器的轻量动作条件模块是一种被广泛采用的架构模式。
    - 评估正从图像质量指标（FID、FVD）转向动作忠实度、空间一致性和闭环可控性。
    - 自动驾驶和游戏环境是系统级世界模型仿真的主要测试平台。
    - 结合深度、关键点、运动增强等多重训练信号，能提升超越像素级真实感的物理合理性。
    分歧:
    - 表示选择：基于扩散模型与自回归Transformer用于帧生成，在延迟和长时程稳定性上存在不同权衡。
    - 监督信号：部分工作通过深度和关键点强制物理约束，另一些仅依赖数据驱动的运动损失，缺乏显式物理先验。
    - 评测目标：空间一致性（LoopNav）、动作忠实度（ACT-Bench）、视觉质量（Vista）或实时延迟（FAR-Drive）各有侧重。
    - 交互模式：以自条件进行的闭环自回归模拟，与在预录制数据上评估的开环动作-视频生成。
    - 部署目标：部分工作声称单GPU实时推理，另一些则将系统视为离线仿真引擎，不提供延迟保证。
    开放问题:
    - 当世界模型在分布偏移下自回归推演时，如何维持长时程一致性？
    - 认证一个世界模型模拟器可用于下游策略训练所需的最小评估协议集是什么？
    - 没有真实深度或关键点监督时，物理真实性能否可靠实现？这对仿真到真实迁移有何影响？
    - 实时世界模型模拟器如何扩展到多智能体设置或超出所报告单GPU场景的多样化硬件环境？
