  related_work_outline:
  - 'Mainstream direction: The bounded top evidence centers on action-conditioned
    video world models for embodied manipulation, including unified diffusion or autoregressive
    generation, pretrained video diffusion adaptation, and physics or preference alignment.'
  - 'Shared research pattern: Papers treat future video generation conditioned on
    actions and observations as a learnable dynamics model, then assess its utility
    for planning, policy evaluation, simulation, or spatial reasoning.'
  - 'Key differences: They differ in conditioning representation, alignment signal,
    and evaluation setting; some use diffusion timesteps or masked autoregression,
    others use learned adapters, reward models, DPO-style post-training, or test-time
    verifiers.'
  - 'Trend evolution: Within the available 2024-2026 frontier, work moves from domain-specific
    robot video prediction toward larger pretraining, physical alignment, and benchmark-
    or verifier-based evaluation; earlier years are not represented in top evidence.'
  - 'Open questions: How well formal state/dynamics concepts and functional benchmarks
    capture real-world physical persistence, causal consistency, and policy utility
    remains unresolved; verifier scaling fails on MMSI-Bench.'
  related_work_outline_zh:
  - 主流方向：当前顶部证据集中在具身操作中的动作条件视频世界模型，包括统一扩散或自回归生成、预训练视频扩散适配、以及物理或偏好对齐。
  - 研究共性：论文将动作与观测条件下的未来视频生成视为可学习的动力学模型，并评估其在规划、策略评估、模拟或空间推理中的效用。
  - 关键差异：条件化表示、对齐信号和评测设置不同；有的使用扩散时间步或掩码自回归，有的使用学习适配器、奖励模型、DPO式后训练或测试时验证器。
  - 趋势演进：在可用的2024-2026前沿内，研究从领域专用机器人视频预测走向更大规模预训练、物理对齐和基于基准或验证器的评测；早期年份未在顶部证据中体现。
  - 开放问题：形式化状态/动态概念与功能基准能否反映真实物理持久性、因果一致性和策略效用仍不明确；MMSI-Bench上验证器缩放失败。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics modeling
      what_it_solves: Generates future frames from action and observation sequences
        to support policy learning, planning, and simulation for robot manipulation.
      what_remains_open: Evidence focuses on short-horizon, curated, or contact-rich
        tasks; long-horizon physical persistence and cross-domain transfer are not
        shown.
    - line: Adaptation of pretrained video diffusion models
      what_it_solves: Adds action conditioning to closed-source video generators using
        a small action-labeled dataset without accessing original parameters.
      what_remains_open: Assumes a suitable pretrained video generator and action-labeled
        videos; generalization to sequential decision tasks is not demonstrated.
    - line: Alignment and reward modeling for embodied rollouts
      what_it_solves: Uses human-preference rewards or DPO-style post-training to
        improve physical realism, task logic, embodiment plausibility, and visual
        quality.
      what_remains_open: Evaluated mainly on contact-rich manipulation; human-preference
        collection is subjective and costly, leaving broader domain behavior unverified.
    - line: Test-time verification for world-model reasoning
      what_it_solves: Grounds test-time trajectory selection in frame-anchored assertions
        to improve spatial reasoning and correct selection bias.
      what_remains_open: Scaling is inconsistent across benchmarks; current models
        can form an information bottleneck where imagined views do not enrich fine-grained
        reasoning.
    - line: Conceptual taxonomy and functional benchmarking
      what_it_solves: Organizes world-model claims into state construction and dynamics
        modeling, arguing for benchmarks that test physical persistence and causal
        reasoning.
      what_remains_open: No new experiments or datasets are provided; whether the
        taxonomy changes model design or evaluation remains open.
    consensus:
    - Action-conditioned video generation is treated as a substrate for world models,
      where future frames serve as imagined rollouts for planning, policy evaluation,
      or synthetic data.
    - Visual quality alone is insufficient; useful evaluation should include action-frame
      alignment, physical plausibility, task completion, or downstream decision quality.
    - Large generative video models can be pretrained, adapted, or post-trained to
      improve controllability and produce synthetic robot experience.
    disagreements:
    - 'Conditioning mechanism differs: independent diffusion timesteps, frame-level
      action modules, learned masks, masked autoregression, or parallel context blocks.'
    - 'Supervision and alignment signal differs: generative objectives, human-preference
      reward models, or DPO-style discriminators.'
    - 'Evaluation target differs: video fidelity, policy correlation, planning improvement,
      physical plausibility, zero-shot embodiment transfer, or test-time reasoning
      scaling.'
    - 'Deployment setting differs: closed-source pretrained video diffusion adaptation,
      large-scale multi-embodiment pretraining, or verifier-guided reasoning without
      training dynamics.'
    open_questions:
    - Can current action-conditioned world models maintain physical persistence and
      causal consistency over long horizons in unseen embodiments or scenes?
    - Can functional benchmarks predict policy or planning performance, given that
      one verifier improves SAT-Real but fails to scale on MMSI-Bench?
    - What assumptions are needed for reward or preference alignment to transfer beyond
      contact-rich manipulation tasks?
    - How can conceptual state/dynamics taxonomies be linked to quantitative or scaling
      predictions and validated against observed failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频动力学建模
      解决的问题: 基于动作与观测序列生成未来帧，用于机器人操作中的策略学习、规划与模拟。
      尚未覆盖: 证据集中在短程、精选或接触丰富任务；长程物理持久性和跨域迁移未展示。
    - 路线: 预训练视频扩散模型适配
      解决的问题: 在无法访问原始参数的情况下，用小型动作标注数据为闭源视频生成器增加动作条件化。
      尚未覆盖: 假设存在合适的预训练视频生成器和动作标注视频；未展示对顺序决策任务的泛化。
    - 路线: 具身轨迹的对齐与奖励建模
      解决的问题: 通过人类偏好奖励或DPO式后训练改善物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 主要在接触丰富操作上评估；人类偏好收集主观且昂贵，更广泛领域行为未经验证。
    - 路线: 世界模型推理的测试时验证
      解决的问题: 将测试时轨迹选择建立在帧锚定断言上，以改善空间推理并纠正选择偏差。
      尚未覆盖: 缩放不一致：当前模型可能形成信息瓶颈，想象视图无法丰富细粒度推理。
    - 路线: 概念分类与功能基准
      解决的问题: 将世界模型主张组织为状态构建与动态建模，并主张关注物理与因果的功能基准。
      尚未覆盖: 未提供新实验或数据集；该分类是否改变模型设计或评测仍不明确。
    共识:
    - 动作条件视频生成被作为世界模型的基础：未来帧可充当用于规划、策略评估或合成数据的想象轨迹。
    - 仅视觉质量不够；有效评测需包含动作-帧对齐、物理合理性、任务完成或下游决策质量。
    - 大规模生成视频模型可通过预训练、适配或后训练提高可控性并生成合成机器人经验。
    分歧:
    - 条件化机制不同：独立扩散时间步、帧级动作模块、学习掩码、掩码自回归或并行上下文块。
    - 监督与对齐信号不同：生成式目标、人类偏好奖励模型或DPO式判别器。
    - 评测目标不同：视频保真度、策略相关性、规划收益、物理合理性、零样本本体迁移或测试时推理缩放。
    - 部署设置不同：闭源预训练视频扩散适配、大规模多本体预训练，或不训练动态的验证器引导推理。
    开放问题:
    - 当前动作条件世界模型能否在未见本体或场景中保持长程物理持久性与因果一致性？
    - 功能基准能否预测策略或规划性能，尤其当一个验证器在SAT-Real上有效却在MMSI-Bench上无法一致缩放？
    - 奖励或偏好对齐需要哪些假设才能从接触丰富操作任务迁移到更广泛领域？
    - 如何将概念上的状态/动态分类法连接到定量或缩放预测，并用观察到的失败模式加以验证？
