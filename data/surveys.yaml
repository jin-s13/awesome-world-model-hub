  related_work_outline:
  - 'Mainstream direction: The current frontier shifts toward closed-loop, action-conditioned
    world-model evaluation in embodied settings such as driving, robotics, Minecraft,
    and Atari, using video rollout benchmarks rather than static single-step probes.'
  - 'Shared research pattern: Papers pair a dataset or simulation protocol with targeted
    capability scores: spatial consistency, memory consistency, action control, task
    reward, visual quality, or downstream policy utility.'
  - 'Key differences: Evaluation targets split between open-domain geometric consistency,
    visual fidelity, task-level agent score, and downstream robotic performance; supervision
    differs by context observability, action-free video, depth/keypoints, and multi-view
    data.'
  - 'Trend evolution: From 2023 onward, evaluation moved from task-only RL benchmarks
    to specialized open-domain and embodied tests; recent 2025-2026 work adds memory,
    spatial, and action-control criteria.'
  - 'Open questions: It remains unclear whether specialized consistency metrics align
    with downstream decisions, and whether narrow task coverage supports generalization
    claims across deployment settings.'
  related_work_outline_zh:
  - 主流方向：当前前沿转向闭环、动作条件化的世界模型评测，覆盖驾驶、机器人、Minecraft和Atari等具身场景，以视频推演基准取代静态单步探测。
  - 研究共性：论文通常将数据集或仿真协议与针对性能力分数配对，包括空间一致性、记忆一致性、动作控制、任务奖励、视觉质量或下游策略效用。
  - 关键差异：评测目标分为开放域几何一致性、视觉保真、任务级智能体得分和下游机器人性能；监督条件在上下文可观测性、无动作视频、深度/关键点与多视角数据上不同。
  - 趋势演进：从2023年起，评测从单纯任务型RL基准转向专门的开放域和具身测试；2025至2026年工作进一步加入记忆、空间和动作控制标准。
  - 开放问题：专门的一致性指标是否与下游决策对齐，以及狭窄任务覆盖是否足以支持跨部署场景的泛化主张，仍不清楚。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design for closed-loop prediction
      what_it_solves: Builds shared datasets and tasks that make world-model capabilities
        comparable across navigation, driving, and robotic video settings.
      what_remains_open: Whether each dataset's action space and scene distribution
        cover the deployment conditions where world models are expected to help.
    - line: Metric and stress-test design for isolated capabilities
      what_it_solves: Adds targeted probes such as spatial consistency, memory consistency,
        action control, task reward, and physical plausibility beyond aggregate prediction
        error.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about.
    - line: Comparable baselines and model-reporting protocols
      what_it_solves: Provides standard evaluation settings like Atari 100k, CARL
        tasks, driving datasets, and robotic video collections for auditing learned
        dynamics and policy utility.
      what_remains_open: Whether conclusions remain stable across implementations,
        compute budgets, and baseline choices.
    consensus:
    - 'World-model evaluation is treated as closed-loop and action-conditioned: models
      are judged by rollouts, control responses, or viewpoint changes over time, not
      only by reconstruction quality.'
    - A single aggregate score is often insufficient; recent evaluations isolate spatial,
      temporal, memory, or control-related ability with separate scores.
    - Benchmark usefulness is increasingly tied to available artifacts such as datasets,
      code, or reproducible evaluation protocols.
    - Downstream utility appears as a recurring evaluation target, whether through
      policy learning, task scores, or robotic policy training.
    disagreements:
    - 'Evaluation targets differ: some work prioritizes open-domain spatial and memory
      consistency, while other work prioritizes game task score, visual-physical fidelity,
      or downstream robot performance.'
    - 'Supervision assumptions differ: some settings require observable context values,
      some rely on action-free video, and others require depth, keypoints, multi-view
      data, or paired action sequences.'
    - 'Metric granularity differs: human-normalized aggregate scores on Atari coexist
      with scene-graph consistency scores and action-control checks, without an agreed
      common metric.'
    - 'Deployment settings differ substantially: simulated games, Minecraft navigation,
      autonomous driving datasets, and robot manipulation suites make cross-paper
      conclusions hard to compare.'
    open_questions:
    - Do spatial, memory, and action-control consistency metrics correlate with downstream
      policy or decision quality?
    - Are current task distributions broad enough to test the long-horizon and cross-action
      generalization claims made for world models?
    - Would benchmark rankings remain stable across different implementations and
      compute budgets?
    - Which benchmark properties best predict transfer from simulated or open-domain
      environments to real-world deployment settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向闭环预测的基准任务与数据集设计
      解决的问题: 构建共享数据集和任务，使世界模型在导航、驾驶和机器人视频场景中的能力可比较。
      尚未覆盖: 数据集的动作空间和场景分布是否覆盖世界模型预期发挥作用的真实部署条件。
    - 路线: 面向独立能力的指标与压力测试设计
      解决的问题: 在总体预测误差之外，增加空间一致性、记忆一致性、动作控制、任务奖励和物理合理性等针对性探测。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致。
    - 路线: 可比基线与模型报告规范
      解决的问题: 提供Atari 100k、CARL任务、驾驶数据集和机器人视频集合等标准评测设置，用于审计学习动力学和策略效用。
      尚未覆盖: 结论在不同实现、算力预算和基线选择下是否保持稳定。
    共识:
    - 世界模型评测被视为闭环和动作条件化的：不仅看重建质量，还看推演、控制响应或视角随时间变化的能力。
    - 单一总分往往不够；近期评测用独立分数区分空间、时间、记忆或控制相关能力。
    - 基准价值越来越依赖可用工件，例如数据集、代码或可复现的评测协议。
    - 下游效用反复成为评测目标，无论通过策略学习、任务得分还是机器人策略训练。
    分歧:
    - 评测目标不同：有的优先开放域空间和记忆一致性，有的优先游戏任务得分、视觉物理保真或下游机器人性能。
    - 监督假设不同：有的设定要求可观测上下文值，有的依赖无动作视频，还有的需要深度、关键点、多视角数据或配对动作序列。
    - 指标粒度不同：Atari上的人类归一化总分与场景图一致性得分、动作控制检查并存，缺少公认的统一指标。
    - 部署场景差异很大：仿真游戏、Minecraft导航、自动驾驶数据集和机器人操作套件使跨论文结论难以直接比较。
    开放问题:
    - 空间、记忆和动作控制一致性指标是否与下游策略或决策质量相关？
    - 当前任务分布是否足够广泛，能够检验世界模型的长时域和跨动作泛化主张？
    - 基准排名在不同实现和算力预算下是否保持稳定？
    - 哪些基准属性最能预测从仿真或开放域环境到真实世界部署的迁移？
