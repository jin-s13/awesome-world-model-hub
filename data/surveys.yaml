  related_work_outline:
  - 'Mainstream direction: Current methods center on scalable generative world models
    built from diffusion transformers or video-generation backbones, augmented with
    auxiliary objectives for geometry, physics, or action conditioning.'
  - 'Shared research pattern: Most papers learn dynamics by reconstructing or predicting
    visual trajectories under self-supervised losses, then evaluate through visual
    quality, long-horizon consistency, or downstream policy/control performance.'
  - 'Key differences: Some learn latent stochastic state-space dynamics for sample-efficient
    RL, while others generate explicit RGB video; some use task-specific context or
    language primitives, while others unify video-action diffusion or physics-informed
    auxiliary tasks.'
  - 'Trend evolution: Work moves from efficient stochastic world models for Atari
    RL around 2023 toward contextual, compositional, and physics-informed embodied/driving
    models in 2024-2025, with 2025-2026 benchmarks targeting closed-loop memory consistency
    and action control.'
  - 'Open questions: Isolating the model contribution from planners and system choices,
    scaling beyond seen task primitives or contexts, maintaining long-term memory
    consistency, and closing evidence gaps from unreported limitations or missing
    comparisons remain open.'
  related_work_outline_zh:
  - 主流方向：当前工作集中于基于扩散Transformer或视频生成骨干的可扩展生成式世界模型，并用几何、物理或动作条件等辅助目标增强。
  - 研究共性：多数方法通过自监督视觉序列重建或预测学习动力学，并围绕视觉质量、长期一致性或下游策略/控制性能进行评测。
  - 关键差异：有的学习潜在随机状态空间动力学以提升样本效率，有的生成显式RGB视频；有的采用任务特定上下文或语言原语，有的统一视频-动作扩散或引入物理信息辅助任务。
  - 趋势演进：从约2023年面向Atari RL的高效随机世界模型，演进到2024-2025年面向具身驾驶的上下文、组合与物理信息世界模型，2025-2026年出现关注闭环记忆一致性和动作控制的基准。
  - 开放问题：如何隔离模型贡献与规划器/系统选择、扩展至未见任务原语或上下文、维持长期记忆一致性，以及弥补未报告局限或缺失比较带来的证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Generative video dynamics models with mask/diffusion/transformer objectives
        (e.g., MaskGWM, RoboScape, UWM)
      what_it_solves: Turning world-model ideas into scalable video prediction by
        combining diffusion Transformers with auxiliary objectives such as mask reconstruction,
        depth/keypoint learning, or unified action-video diffusion.
      what_remains_open: Transfer beyond reported driving/robotic datasets; isolating
        whether gains come from architecture, auxiliary tasks, or dataset scale; limitation
        and baseline details are not consistently reported.
    - line: Stochastic latent state-space models for model-based RL (e.g., STORM,
        cRSSM)
      what_it_solves: Sample-efficient policy learning from imagined rollouts in compact
        latent dynamics, with context-conditioned variants supporting zero-shot generalization.
      what_remains_open: Generalization beyond small task sets and observable context
        assumptions; evidence is missing for broader context types, partial observability,
        and whether gains are model-driven rather than reward/task-specific.
    - line: Compositional language-conditioned and action-conditioned embodied world
        models (e.g., RoboDreamer, UWM)
      what_it_solves: Connecting learned video dynamics to robot planning and policy
        learning via language primitives or coupled action diffusion, enabling generalization
        to unseen combinations or large multitask robot datasets.
      what_remains_open: Supporting entirely novel primitives or actions remains unresolved;
        real-robot evidence beyond simulation is limited; alignment between action-free
        video pretraining and downstream control needs more measurement.
    - line: Benchmark-driven evaluation protocols for consistency and action control
        (e.g., LoopNav, MIND)
      what_it_solves: Providing datasets and metrics for spatial/memory consistency
        and action-control generalization, reducing reliance on per-domain visual
        fidelity or task rewards.
      what_remains_open: No shared cross-domain comparison across all method types;
        one benchmark paper reports no experimental results in the abstract, so method
        sensitivity and baseline coverage are not yet established.
    consensus:
    - Most proposed methods use self-supervised sequence modeling or generative reconstruction
      to learn world dynamics rather than relying only on task rewards.
    - Transformer and diffusion-based architectures are increasingly used as the core
      representation for scalable world modeling.
    - Evaluation is shifting toward a mix of visual fidelity, physical plausibility,
      long-horizon spatial or memory consistency, and downstream policy/control utility.
    - Auxiliary tasks and conditioning signals such as masks, depth, keypoints, language,
      context, or actions are common mechanisms to improve structure and controllability.
    disagreements:
    - 'Representation: explicit RGB video generation versus compact latent state-space
      dynamics separates methods in training goals and downstream interfaces.'
    - 'Conditioning and supervision: context values, language primitives, physics-oriented
      auxiliary tasks, or coupled action diffusion impose different requirements on
      available annotations and task assumptions.'
    - 'Evaluation setting: sample-efficient Atari RL, driving video benchmarks, robotic
      simulation, and memory/action-control benchmarks emphasize different success
      metrics.'
    - 'Control interface: some methods optimize policies inside learned latent imagination,
      while others output action sequences or video plans for downstream execution.'
    open_questions:
    - How well do auxiliary-task gains transfer outside the reported driving, robotic,
      and Atari task families when limitations and baselines are not fully reported?
    - What part of the performance improvement is due to the world-model representation
      versus the planner, controller, task prior, dataset scale, or evaluation protocol?
    - Can video-based world models maintain long-term memory and spatial consistency
      under closed-loop action control beyond the current benchmark clips and action
      spaces?
    - Can context-conditioned zero-shot generalization handle unobserved or partially
      observed context instead of assuming explicit observable context values?
    - How should methods be compared when code, datasets, metrics, baselines, or limitations
      are missing across papers, and what minimal evidence would make verification
      reproducible?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于掩码/扩散/Transformer目标的生成式视频动力学模型（如 MaskGWM、RoboScape、UWM）
      解决的问题: 通过扩散Transformer与掩码重建、深度/关键点或统一动作-视频扩散等辅助目标，将世界模型思想落实为可扩展视频预测。
      尚未覆盖: 向报告之外驾驶/机器人数据集的迁移；改进来自架构、辅助任务还是数据规模仍难分离；局限性与基线信息不完整。
    - 路线: 面向基于模型强化学习的随机潜在状态空间模型（如 STORM、cRSSM）
      解决的问题: 在紧凑潜在动力学中通过想象rollout进行样本高效策略学习，并通过上下文条件变体支持零样本泛化。
      尚未覆盖: 从小任务集和可观测上下文假设向外扩展；对部分可观测或未见上下文类型证据不足；收益是否来自模型而非奖励或任务设置仍待验证。
    - 路线: 语言条件与动作条件的组合式具身世界模型（如 RoboDreamer、UWM）
      解决的问题: 通过语言原语或耦合动作扩散，将学习到的视频动力学连接到机器人规划与策略学习，提升对未见组合或大规模多任务机器人数据的泛化。
      尚未覆盖: 支持全新原语或动作仍未解决；真实机器人证据有限；无动作视频预训练与下游控制的匹配度需要进一步测量。
    - 路线: 面向一致性和动作控制的基准评测协议（如 LoopNav、MIND）
      解决的问题: 提供用于空间/记忆一致性和动作控制泛化的数据集与指标，减少对单一领域视觉保真度或任务奖励的依赖。
      尚未覆盖: 尚无跨方法类型的共享跨域比较；一篇基准论文摘要未报告实验结果，方法敏感性和基线覆盖尚未确立。
    共识:
    - 多数方法通过自监督序列建模或生成重建学习世界动力学，而不是仅依赖任务奖励。
    - Transformer与扩散式架构越来越多地作为可扩展世界建模的核心表示。
    - 评测正从单一视觉质量转向视觉保真度、物理合理性、长期空间/记忆一致性以及下游策略/控制效用的组合。
    - 掩码、深度、关键点、语言、上下文或动作等辅助任务和条件信号，是改善结构与可控性的常见机制。
    分歧:
    - 表示方式：显式RGB视频生成与紧凑潜在状态空间动力学的训练目标和下游接口不同。
    - 条件与监督方式：上下文值、语言原语、物理导向辅助任务或耦合动作扩散对标注与任务假设的要求不同。
    - 评测场景：Atari样本效率、驾驶视频基准、机器人仿真、记忆与动作控制基准分别强调不同的成功指标。
    - 控制接口：部分方法在潜在想象中优化策略，另一些输出动作序列或视频计划供下游执行。
    开放问题:
    - 在局限性与基线未完全报告的情况下，辅助任务带来的增益能否迁移到已报告驾驶、机器人和Atari任务族之外？
    - 性能提升中多少来自世界模型表示，多少来自规划器、控制器、任务先验、数据规模或评测协议？
    - 视频世界模型能否在闭环动作控制中维持长期记忆与空间一致性，而不只限于当前基准片段和动作空间？
    - 上下文条件零样本泛化能否处理不可观测或部分可观测上下文，而不假设显式可观测上下文值？
    - 当各论文缺失代码、数据集、指标、基线或局限性时，应如何比较方法，何种最小证据能保证可复现验证？
