  related_work_outline:
  - 'Mainstream direction: Recent work concentrates on action-conditioned video world
    models for concrete domains—especially robotics, driving, and interactive control—using
    diffusion or transformer-based generative objectives rather than generic open-loop
    prediction.'
  - 'Shared research pattern: Models learn latent or pixel dynamics conditioned on
    actions, language, context, or physics cues, then generate imagined trajectories
    or rollouts; evaluation increasingly adds generalization, consistency, and controllability
    metrics to visual fidelity.'
  - 'Key differences: Representation spans diffusion masks, VAE-transformer stochastic
    latents, recurrent state-space context, and unified video-action diffusion; supervision
    ranges from action labels and context values to language primitives and physics
    depth/keypoint signals; evaluation targets differ across driving rollouts, robot
    execution, game scores, and memory-action benchmarks.'
  - 'Trend evolution: Evidence moves from efficient game-world model-based RL in 2023
    toward 2024–2025 domain-specific predictive models for robotics and driving, followed
    by 2025–2026 benchmarks for spatial memory, action control, and closed-loop revisit;
    the top-paper pattern is within the current frontier.'
  - 'Open questions: Cross-domain and simulation-to-real transfer, long-horizon spatial/temporal
    consistency, action-space generalization, handling unobserved context or novel
    primitives, and verification gaps from missing limitations and real-world deployment
    evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：近期工作集中于面向具体领域的动作条件视频世界模型，尤其是机器人、驾驶和交互控制，采用扩散或Transformer生成目标，而非通用开环预测。
  - 研究共性：模型以动作、语言、上下文或物理线索为条件学习潜在或像素动力学，生成想象轨迹；评测在视觉保真之外逐步加入泛化、一致性和可控性指标。
  - 关键差异：表示方式包括扩散掩码、VAE-Transformer随机隐状态、循环状态空间上下文和统一视频-动作扩散；监督信号从动作标签、上下文值到语言原语和物理深度/关键点不等；评测目标涵盖驾驶、机器人执行、游戏得分和记忆-动作基准。
  - 趋势演进：证据从2023年高效游戏世界模型式强化学习，走向2024–2025年面向机器人与驾驶的领域预测模型，再到2025–2026年空间记忆、动作控制和闭环重访基准；趋势处于当前前沿。
  - 开放问题：跨域与仿真到真实迁移、长时域时空一致性、动作空间泛化、未观测上下文或新原语处理，以及缺失限制说明和真实部署证据造成的验证缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Autonomous driving and simulation world models
      what_it_solves: Generalizable multi-view and long-horizon driving scene prediction
        from video, including zero-shot rollout across driving datasets.
      what_remains_open: Evidence stops at dataset-level prediction improvements;
        real-world closed-loop safety and operational alignment are not shown.
    - line: Embodied and contextual task transfer world models
      what_it_solves: Adapting world models to robot and domain tasks via contextual
        state dynamics, language-compositional video generation, physics-informed
        depth/keypoint cues, or unified video-action diffusion for policy and dynamics
        learning.
      what_remains_open: Transfer remains bounded by seen primitives or context values,
        simulated evaluation, or assumed action observations; real-robot and unseen
        physical setting evidence is missing.
    - line: Interactive agents and efficient model-based reinforcement learning
      what_it_solves: Stochastic visual world models that generate imagined trajectories
        for sample-efficient control in game-like interactive environments.
      what_remains_open: Evidence mainly covers Atari 100k; long-horizon memory, cross-environment
        generalization, and action-space changes are not established.
    - line: World model evaluation benchmarks and consistency protocols
      what_it_solves: Measuring spatial consistency, memory consistency, and action
        control through loop navigation or revisited video-action benchmarks.
      what_remains_open: Benchmark completeness is shown, but whether scores predict
        downstream policy quality or real deployment remains an open verification
        gap.
    consensus:
    - Recent world models are trained as action- or context-conditioned predictors
      that generate future video, latent states, or imagined rollouts for control.
    - Evaluation is shifting from pixel-level fidelity alone toward zero-shot generalization,
      physical plausibility, spatial/memory consistency, and action controllability.
    - Model-based learning and pretraining use imagined rollouts to improve sample
      efficiency or policy robustness, especially in robotics and visual control.
    - Several top papers leave limitations blank; reproducibility and real-world deployment
      evidence remain partial verification gaps.
    disagreements:
    - 'Representation choice differs: stochastic VAE-transformer latents, recurrent
      state-space context, diffusion mask tokens, and unified video-action diffusion
      coexist.'
    - 'Supervision differs: some use action labels, some observable context values,
      some language-primed low-level primitives, and some physics cues such as depth
      and keypoints.'
    - 'Evaluation targets differ: driving rollouts across multiple datasets, Atari
      human-normalized scores, robot simulation execution and video plausibility,
      and open-domain memory/action benchmarks.'
    - 'Interaction and deployment settings differ: offline video prediction, closed-loop
      revisited navigation, policy training in simulation, and action-free video pretraining
      are not directly comparable.'
    open_questions:
    - Do dataset-level video prediction gains translate into safer or more reliable
      closed-loop driving and real robot execution?
    - Can world models maintain long-horizon memory and spatial consistency under
      unseen action spaces, loop closures, and environment changes?
    - How should models handle unobserved context values, unseen composition primitives,
      or missing action labels without breaking dynamics learning?
    - What is missing in current evaluation when many papers do not report limitations,
      code, or real deployment evidence, and how should verification gaps be scored?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 自动驾驶与仿真世界模型
