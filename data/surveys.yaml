  related_work_outline:
  - 'Mainstream direction: Although the topic is theory, the bounded evidence is dominated
    by action-conditioned video world models; the main direction is making learned
    dynamics more physically plausible, controllable, and evaluable, while formal
    definitions and guarantees remain sparse.'
  - 'Shared research pattern: Work couples observations and actions with future frames,
    then adds conditioning, post-training, or verifier signals to improve action-frame
    alignment, physical realism, or task-relevant rollouts.'
  - 'Key differences: They differ in generative formulation such as unified diffusion,
    masked autoregression, adapter-based adaptation, and flow-based post-training;
    in supervision signal such as action conditioning, preference/DPO, and test-time
    verifiers; and in evaluation setting such as manipulation, game/robot adaptation,
    and spatial reasoning.'
  - 'Trend evolution: Within 2024-2026, the evidence moves from scaling action-video
    pretraining and adapting pretrained video models toward physics/preference alignment
    and functional zero-shot benchmarks; older years provide only topic context.'
  - 'Open questions: Whether explicit state/dynamics assumptions can be empirically
    validated, which functional benchmarks can measure causal persistence, and how
    scaling or alignment signals predict transfer and failure remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据包内主流是将世界模型落实为动作条件视频生成与动力学建模，并逐渐从视觉质量转向物理合理性、动作对齐与功能评测；形式化定义与保证仍然稀缺。
  - 研究共性：多数工作把观测、动作与未来帧耦合到生成式架构中，并通过条件化、后训练或验证器提升动作-帧对齐、物理真实感或任务相关轨迹。
  - 关键差异：生成形式、对齐信号和评测靶点不同，如统一扩散、掩码自回归、适配器、基于流的后训练，偏好/DPO、测试时验证器，以及操作、游戏/机器人、空间推理等。
  - 趋势演进：2024至2026年间，证据从规模化动作视频预训练和适配预训练视频模型，走向偏好/物理对齐与功能化零样本基准；早期年份仅提供背景。
  - 开放问题：显式状态与动力学假设能否被经验验证，哪些功能性基准能测量因果持续性，以及缩放或对齐信号能否预测迁移和失败，仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics modeling
      what_it_solves: Learning future-frame dynamics from observations and actions,
        and flexibly representing policies, forward/inverse dynamics, or adapted pretrained
        video generators for robot control.
      what_remains_open: Formal conditions under which generated frames match real
        environment dynamics are not established; evaluation is concentrated on specific
        robot/game tasks and visual-controllability metrics rather than causal persistence
        or guaranteed transfer.
    - line: Preference- and physics-aligned embodied world modeling
      what_it_solves: Post-training video-based world models to improve physical realism,
        task logic, embodiment plausibility, and visual quality via reward models
        or DPO-style preference signals.
      what_remains_open: Generalization beyond contact-rich manipulation and reliance
        on human preference data remain unresolved; zero-shot physical plausibility
        benchmarks are new and not yet broadly validated across embodiments.
    - line: State/dynamics conceptualization and test-time evaluation
      what_it_solves: Clarifying state construction and dynamics modeling boundaries
        for video generation as world models, and diagnosing test-time verifiers for
        spatial reasoning.
      what_remains_open: The proposed taxonomy and functional benchmarks have not
        been shown to change model design or evaluation practice; current models still
        form an information bottleneck, and verifier-based scaling is inconsistent.
    consensus:
    - World models in this evidence are predominantly operationalized as action-conditioned
      video generation or learned dynamics rather than purely formal objects.
    - Action-frame alignment and controllability are treated as core desiderata for
      robotics-oriented world models.
    - Visual quality alone is considered insufficient; physical plausibility, logical
      coherence, or causal/persistence evaluation is increasingly required.
    - Pretraining or adaptation on action-labelled video data is a shared route to
      policy learning and synthetic rollout generation.
    disagreements:
    - 'Generative formulation differs: unified diffusion with independent modality
      timesteps, masked autoregressive token prediction, flow-based post-training,
      and closed-source model adaptation via learned masks.'
    - 'Alignment signal differs: frame-level action conditioning, reward/DPO preference
      post-training, and test-time verifier grounding.'
    - 'Evaluation target differs: manipulation benchmarks and model-based planning,
      video game plus real robot adaptation, spatial reasoning benchmarks, and zero-shot
      physical/trajectory benchmarks.'
    - 'Interaction and deployment assumptions differ: low-level action inputs, keyboard/VR
      control, cross-embodiment action injection, and real-time video simulation.'
    open_questions:
    - Which explicit state/dynamics assumptions can be empirically validated in action-conditioned
      video models, and which fail outside curated manipulation or game settings?
    - How can benchmarks move from visual fidelity to functional persistence and causal
      reasoning when current verifiers show inconsistent scaling and poor calibration?
    - Under what conditions does preference-based or physics-aligned post-training
      transfer beyond contact-rich tasks without costly human preference collection?
    - What evidence links model scale, test-time scaling, or alignment training to
      predicted failure modes or cross-embodiment transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件视频动力学建模
      解决的问题: 从观测和动作学习未来帧动态，并灵活表示策略、前向/逆向动力学或适配的预训练视频生成器用于机器人控制。
      尚未覆盖: 生成帧与真实环境动态一致的形式条件尚未建立；评测集中在特定机器人和游戏任务，较少覆盖因果持续性和可保证的迁移。
    - 路线: 偏好与物理对齐的具身世界建模
      解决的问题: 通过奖励模型或DPO式偏好信号后训练视频世界模型，以改善物理真实性、任务逻辑、具身合理性和视觉质量。
      尚未覆盖: 接触丰富操作任务之外的泛化以及对人类偏好数据的依赖仍未解决；零样本物理基准较新，跨本体验证不足。
    - 路线: 状态/动态概念化与测试时评测
      解决的问题: 澄清视频生成作为世界模型中的状态构建和动态建模边界，并诊断空间推理中的测试时验证器。
      尚未覆盖: 所提分类法和功能基准尚未被证明会改变模型设计或评测实践；当前模型仍构成信息瓶颈，验证器缩放不一致。
    共识:
    - 证据中的世界模型主要表现为动作条件视频生成或学习式动力学，而非纯形式对象。
    - 动作-帧对齐和可控性被视为面向机器人的世界模型的核心要求。
    - 仅视觉质量被认为不够，越来越需要物理合理性、逻辑一致性或因果/持续性评测。
    - 在带动作标签的视频数据上预训练或适配是策略学习和合成轨迹生成的共同路径。
    分歧:
    - 生成形式不同：统一扩散中的独立模态时间步、掩码自回归令牌预测、基于流的后训练和基于学习掩码的闭源模型适配。
    - 对齐信号不同：帧级动作条件化、奖励/DPO偏好后训练、测试时验证器接地。
    - 评测目标不同：操作基准与模型规划、视频游戏和真实机器人适配、空间推理基准、零样本物理与轨迹基准。
    - 交互与部署假设不同：低层动作输入、键盘/VR控制、跨本体动作注入和实时视频模拟。
    开放问题:
    - 哪些显式状态/动态假设能在动作条件视频模型中得到经验验证，哪些在策划的操作或游戏场景之外失效？
    - 当前验证器缩放不一致且校准差，如何建立从视觉保真度转向功能持续性和因果推理的基准？
    - 偏好或物理对齐后训练在何种条件下能跨接触丰富任务迁移，而不依赖昂贵的人类偏好收集？
    - 哪些证据能把模型规模、测试时缩放或对齐训练与预测的失败模式和跨本体迁移联系起来？
