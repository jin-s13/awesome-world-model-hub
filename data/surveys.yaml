  related_work_outline_zh:
  - 主流方向：构建并对齐行动条件化视频世界模型用于机器人操作；理论主要以形式化、分类和验证器分析出现，而非独立保证。
  - 研究共性：方法类研究共享预训练-后训练结构；理论类研究将评测重新聚焦于状态、动力学、持久性和因果性。
  - 关键差异：表示、监督信号和评测目标不同，使研究分化为操作保真度方法和形式化/基准导向分析。
  - 趋势演进：高排名证据集中在2024-2026年；从帧级动作对齐走向统一预训练和物理后训练，并越来越关注功能性基准。
  - 开放问题：视觉保真与动作可控性是否蕴含因果或物理世界模型能力；奖励或测试时缩放能否预测迁移；如何标准化持久性与因果基准。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video dynamics modeling and unified pretraining
      what_it_solves: Captures policy, forward/inverse dynamics, and future video
        from robot action-observation data, improving action-frame alignment and planning.
      what_remains_open: Whether visual and control metrics imply physical persistence,
        causal reasoning, or transfer beyond evaluated manipulation settings remains
        unverified.
    - line: Alignment, reward, and verifier-based evaluation
      what_it_solves: Uses preference data, physics-aware annotations, or frame-anchored
        assertions to improve realism, task completion, and decision utility of generated
        rollouts.
      what_remains_open: Reward signals may be subjective or costly; verifier calibration
        and test-time scaling are inconsistent across benchmarks, and domain generalization
        is not demonstrated.
    - line: Conceptual formalization and functional benchmarks
      what_it_solves: Organizes state construction and dynamics modeling to bridge
        video generation and world-model claims, motivating functional evaluation
        beyond visual fidelity.
      what_remains_open: No shared benchmark yet operationalizes persistence and causality,
        and it is unclear whether the taxonomy changes model design or evaluation
        practice.
    consensus:
    - Action-conditioned video generation is treated as a usable substrate for robot
      learning, planning, or policy evaluation.
    - Better alignment between actions, frames, and physical outcomes is a shared
      goal, but visual fidelity alone is not treated as sufficient evidence.
    - Evaluation now mixes visual quality, controllability, planning correlation,
      and physical or logical realism, although metric unification is absent.
    disagreements:
    - 'Representation choices differ: unified video-action diffusion transformer,
      heterogeneous masked autoregression, masked adaptation of pretrained video diffusion,
      and flow-based post-training.'
    - 'Supervision sources differ: action-labelled demonstrations, human preference
      datasets, physics-aware manual annotation, heuristic verifiers, and frame-anchored
      assertions.'
    - 'Evaluation targets differ: contact-rich manipulation fidelity, spatial reasoning
      benchmark scaling, cross-embodiment zero-shot physical plausibility, and policy
      evaluation or synthetic-data generation.'
    open_questions:
    - How much of the observed manipulation success comes from training-distribution
      replay rather than transferable dynamics?
    - Which supervision or alignment signal generalizes to unseen bodies, tasks, and
      physical changes?
    - Can frame-anchored micro-claim verification provide a standardized persistence/causality
      test, and why does it fail on some benchmarks?
    - Reproducibility and limitation reporting are uneven, leaving independent verification
      of several claims unresolved.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作条件化视频动力学建模与统一预训练
      解决的问题: 从机器人动作-观测数据中捕捉策略、前向/逆动力学和未来视频，改进动作-帧对齐与规划。
      尚未覆盖: 视觉和控制指标是否意味着物理持久性、因果推理或跨出已评测操作场景的迁移仍未验证。
    - 路线: 对齐、奖励与验证器评测
      解决的问题: 利用偏好数据、物理感知标注或以帧为锚定的断言提高生成轨迹的真实性、任务完成度和决策效用。
      尚未覆盖: 奖励信号可能主观或成本高；验证器校准和测试时缩放在不同基准上表现不一致，跨域泛化未被证明。
    - 路线: 概念形式化与功能基准
      解决的问题: 通过状态构建和动力学建模组织视频生成与世界模型的关系，推动超越视觉保真度的功能评测。
      尚未覆盖: 尚无共享基准可操作化地评估持久性与因果性；分类是否真正改变模型设计或评测实践仍不清楚。
    共识:
    - 行动条件化视频生成被视为机器人学习、规划或策略评估的可用动态载体。
    - 研究者普遍把动作-帧对齐和物理合理性作为共同目标，但认为仅有视觉保真度不能充分证明世界模型能力。
    - 评测已混合视觉质量、可控性、规划相关性与物理/逻辑一致性，但缺乏统一度量。
    分歧:
    - 表示方式不同：统一视频-动作扩散Transformer、异构掩码自回归、预训练视频扩散的掩码适配、基于流的后训练。
    - 监督信号不同：动作标注演示、人类偏好、物理感知标注、启发式验证器和以帧为锚定的断言。
    - 评测目标不同：接触丰富操作保真度、空间推理基准缩放、跨本体零样本物理合理性和策略评估皆被使用。
    开放问题:
    - 视觉保真和动作可控性在多大程度上来自训练分布回放，而非可迁移的动力学建模？
    - 哪种监督或对齐信号能泛化到未见本体、任务和物理变化？
    - 以帧为锚定的微断言验证能否标准化持久性/因果性测试，为何在SAT-Real等基准有效却在MMSI-Bench等基准上未能一致缩放？
    - 若干论文的限制说明和复现信号不全，独立验证仍存在证据缺口。
