  related_work_outline:
  - 'Mainstream direction: The evidence concentrates on action-conditioned video generation
    models treated as world models for robot manipulation and spatial reasoning; unified
    diffusion/transformer, masked autoregression, and adapted pretrained video models
    generate future frames for policy learning, planning, and simulation, with newer
    work adding physics/preference alignment and functional-benchmark critiques.'
  - 'Shared research pattern: Papers share a pipeline of conditioning generation on
    observations and actions, evaluating action-frame alignment, visual fidelity,
    controllability, policy correlation, and increasingly physical plausibility or
    reasoning; several also reuse pretrained video models or post-train with preference
    reward, while conceptual work urges separating representation from dynamics and
    visual from functional evaluation.'
  - 'Key differences: They differ in generator representation and adaptation: unified
    coupled diffusion/transformer, masked autoregression, parameter-free adapter,
    and flow-based post-training; supervision spans action conditioning, human preference
    reward, and verifier/test-time assertions; evaluation targets range from video
    quality and planning correlation to physical plausibility, causal persistence,
    and spatial reasoning benchmarks.'
  - 'Trend evolution: The available 2024–2026 evidence moves from improving action-conditioned
    video generation and planning correlation toward physics alignment, zero-shot
    embodied evaluation, and more formal taxonomies of state and dynamics; 2025–2026
    work also tests whether test-time scaling and verifiers yield calibrated reasoning
    improvements, revealing current bottlenecks.'
  - 'Open questions: Do high-fidelity action-conditioned rollouts provide formal guarantees
    for physical persistence and causal reasoning? Can verifier-based test-time scaling
    be calibrated across benchmarks? Does preference/DPO alignment generalize beyond
    contact-rich manipulation? Would functional benchmarks change model design? Missing
    evidence leaves scaling-law and formal-assumption claims under-validated.'
  related_work_outline_zh:
  - 主流方向：证据集中于将动作条件化视频生成模型当作具身世界模型，用于机器人操作和空间推理；统一扩散/Transformer、掩码自回归和预训练视频适配生成未来帧，服务策略、规划与仿真，近期加入物理/偏好对齐和功能基准批评。
  - 研究共性：工作普遍用观测和动作序列条件生成未来帧，评估动作-帧对齐、视觉保真、可控性、策略相关性和物理合理性；多条路线复用预训练视频模型或进行偏好后训练，概念性工作则强调把表示与动态、视觉评估与功能评估分开。
  - 关键差异：生成器表示和适配方式不同：耦合扩散/Transformer、掩码自回归、外部适配器、基于流的后训练；监督信号涵盖动作条件、人类偏好奖励、验证器/测试时断言；评测目标从视频质量、规划相关到物理合理性、因果持久和空间推理。
  - 趋势演进：可见的2024–2026证据从提升动作条件视频生成和规划相关性，走向物理对齐、零样本具身评测以及状态与动态的分类法；2025–2026年开始检验测试时缩放和验证器是否提供校准推理增益，揭示当前瓶颈。
  - 开放问题：高保真动作条件轨迹能否为物理持久性和因果推理提供形式保证？验证器测试时缩放能否跨基准校准？偏好/DPO对齐能否泛化到接触丰富操作之外？功能基准会否改变模型设计？证据缺口使缩放律和形式假设未被直接验证。
  literature_review:
    line_of_work_matrix:
    - line: Action-conditioned video generation as robot dynamics models
      what_it_solves: Learns future-frame generation from observation-action sequences,
        giving a reusable policy, dynamics, or simulation signal for manipulation
        and planning.
      what_remains_open: Evidence is mostly visual or control-oriented; it does not
        establish physical persistence, causal guarantees, or generalization beyond
        the evaluated robot and video-game domains.
    - line: Adaptation of pretrained video diffusion models to action-conditioned
        world models
      what_it_solves: Reduces the need to train a world model from scratch by adapting
        a closed or pretrained video generator with small action-labeled data.
      what_remains_open: Adapter training still needs domain-specific action-labeled
        video; inherited generator biases and behavior in other sequential decision
        tasks remain unverified.
    - line: Physics and preference alignment for video-based world models
      what_it_solves: Post-trains flow or diffusion generators with human preference,
        DPO, or decoupled discriminators to improve physical realism, task logic,
        and visual quality.
      what_remains_open: Evaluation concentrates on contact-rich manipulation; human
        preference is subjective and costly, and alignment gains are not linked to
        formal guarantees or broad domain transfer.
    - line: Taxonomic and mechanistic analysis of video generation as world models
      what_it_solves: Organizes state construction and dynamics modeling into implicit/explicit
        and knowledge/architectural dimensions, and argues for functional benchmarks.
      what_remains_open: The taxonomy is conceptual; no evidence shows it changes
        design, training, or evaluation practice, and the identified persistence/causality
        gaps remain experimentally unresolved.
    - line: Test-time scaling and verifier-based evaluation for world-model reasoning
      what_it_solves: Studies whether action-conditioned imagined trajectories and
        frame-anchored assertions can improve spatial reasoning with test-time compute.
      what_remains_open: Verifiers show poor calibration and benchmark-specific gains;
        current world models may act as an information bottleneck, with no consistent
        scaling across SAT-Real and MMSI-Bench.
    consensus:
    - Video generation models are being repurposed as action-conditioned world models
      by coupling observations with actions to predict future frames.
    - Visual quality alone is treated as insufficient; there is a shared turn toward
      action-frame alignment, physical plausibility, planning correlation, or functional
      reasoning.
    - Pretraining or adaptation on robot manipulation videos is viewed as a way to
      support policy evaluation, planning, simulation, or synthetic data, but domain-specific
      data remains necessary.
    disagreements:
    - 'Generator and adaptation choices differ: coupled diffusion/transformer, masked
      autoregression, external adapter, and flow-based post-training represent distinct
      representation and interaction assumptions.'
    - Supervision differs from plain action conditioning to human preference/DPO alignment
      and verifier/test-time assertions, changing what signal is optimized.
    - 'Evaluation target differs: visual fidelity and controllability, policy evaluation
      correlation, physical plausibility and trajectory consistency, or spatial reasoning
      benchmark performance.'
    - 'Deployment assumptions differ: real-time robotic simulation and policy learning
      versus closed-source pretrained video adaptation versus benchmark-based reasoning
      with test-time scaling.'
    open_questions:
    - Can action-conditioned video generators provide calibrated test-time scaling
      for spatial reasoning across datasets beyond the SAT-Real success case?
    - What formal conditions or assumptions would connect frame-level action alignment
      and preference-based realism to physical persistence and causal guarantees?
    - Do functional benchmarks for persistence and causality produce different model
      choices than visual-quality or action-control metrics?
    - Does reward-based alignment remain effective beyond contact-rich manipulation
      and domain-specific small-scale training settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 作为机器人动态模型的动作条件化视频生成
      解决的问题: 从观测-动作序列学习未来帧生成，为操作与规划提供可复用的策略、动力学或仿真信号。
      尚未覆盖: 证据主要围绕视觉和控制；尚未建立物理持久性、因果保证或超出机器人/视频游戏领域的泛化。
    - 路线: 将预训练视频扩散模型适配为动作条件化世界模型
      解决的问题: 利用小型动作标注数据适配闭源或预训练视频生成器，减少从零训练世界模型的成本。
      尚未覆盖: 适配仍依赖领域特定的动作标注视频；继承的生成器偏差及其他顺序决策任务中的表现未被验证。
    - 路线: 基于物理与偏好对齐的视频世界模型
      解决的问题: 用人类偏好、DPO或解耦判别器后训练基于流/扩散的生成器，提升物理真实、任务逻辑和视觉质量。
      尚未覆盖: 评估集中在接触丰富操作；人类偏好主观且昂贵，对齐收益未与形式保证或广泛领域迁移关联。
    - 路线: 将视频生成作为世界模型的分类与机制分析
      解决的问题: 把状态构建和动态建模分为隐式/显式与知识/架构维度，并主张引入功能基准。
      尚未覆盖: 该分类是概念性的；缺少证据表明它改变设计、训练或评测实践，所识别的持久性和因果缺口仍未实验解决。
    - 路线: 世界模型推理的测试时缩放与验证器评估
      解决的问题: 研究动作条件化想象轨迹和帧锚定断言能否通过测试时计算改善空间推理。
      尚未覆盖: 验证器校准差且收益依赖基准；当前世界模型可能形成信息瓶颈，跨SAT-Real与MMSI-Bench无一致缩放。
    共识:
    - 视频生成模型正被重新用作动作条件化世界模型，通过耦合观测与动作预测未来帧。
    - 仅凭视觉质量被认为不够；研究共同转向动作-帧对齐、物理合理性、规划相关性或功能推理。
    - 在机器人操作视频上预训练或适配被视为支持策略评估、规划、仿真或合成数据的途径，但仍需领域特定数据。
    分歧:
