  related_papers:
  - id: worldroambench-an-open-world-benchmark-for-long-horizon-sta-2026
    title: 'WorldRoamBench: An Open-World Benchmark for Long-Horizon Stability of
      Interactive World Models'
    url: https://arxiv.org/abs/2606.31672v1
    title_zh: WorldRoamBench：面向交互式世界模型长时程稳定性的开放世界基准
  - id: abot-world-0-infinite-interactive-world-rollout-on-a-single-2026
    title: 'ABot-World-0: Infinite Interactive World Rollout on a Single Desktop GPU'
    url: https://arxiv.org/abs/2607.19191
    title_zh: ABot-World-0：在单桌面GPU上实现无限交互世界展开
  name_zh: WorldRoamBench
  description_zh: 尽管交互式世界模型（IWM）取得了快速进展，现有基准仅在轨迹层面评估动作跟随，忽略了记忆与交互物理。我们提出WorldRoamBench，一个面向长时程稳定性的开放世界基准，涵盖四个维度，每个维度均有定制创新：（i）动作：逐帧动作度量，绕过跨模型语义尺度差异，暴露被轨迹隐藏的失败；（ii）视觉：基于片段的漂移度量，捕捉起始-终点比较无法发现的非单调中期序列崩溃；（iii）物理：可控性门控评估，涵盖力学、光学与3D一致性，在忠实动作执行下对合理性进行评分；（iv）记忆：动作解耦协议，通过过渡定位的3D点云重建评估场景记忆，通过跟踪加VLM推理评估主体记忆。该基准包含600余个测试用例，覆盖自然、城市与室内场景，采用第一/第三人称视角，支持WASD连续交互10-60秒。对10余个开源/闭源模型的评估显示，没有任何模型能可靠满足所有维度；即使最佳模型也仅获得中等分数。在WorldRoamBench上的进步是迈向稳定、物理可信、记忆忠实且可部署于实际应用的交互式世界模型的重要步骤。
  notes_zh: 派生自论文：WorldRoamBench：面向交互式世界模型长时程稳定性的开放世界基准
  year: 2026
  preview: https://arxiv.org/html/2606.31672v2/x1.png
