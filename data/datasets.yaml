- id: paper-worldroambench-an-open-world-benchmark-for-long-horizon-sta-2026
  name: WorldRoamBench
  description: Despite rapid progress in interactive world models (IWMs), existing
    benchmarks evaluate action following only at trajectory level and ignore memory
    and interaction physics. We introduce WorldRoamBench, an open-world benchmark
    for long-horiz...
  tags: []
